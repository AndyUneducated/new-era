# B12: quotes of Sun Lijun, Fu Zhenghua, Su Rong, Lu Wei, Lai Xiaomin. Every text is checked verbatim against its cite.
sun-lijun:
  - text: 我错误地认为，当官和发财是可以两不误的。
    cite: b12-xinhua-2022-01-15-zero-tolerance-ep1
    kind: interview
    date: 2022-01-15
    occasion: 中纪委专题片《零容忍》第一集中出镜，谈 2001 年与医药老板约定三七分成
    star: true
  - text: 我从来没有过闯红灯的历史，到了公安部之后，我认为闯红灯是很正常的。
    cite: b12-xinhua-2022-01-15-zero-tolerance-ep1
    kind: interview
    date: 2022-01-15
    occasion: 《零容忍》第一集，谈到公安部后权力变大
  - text: 他每年大概四五次来北京，每次都给我30万美金，放在一个小的海鲜盒里面。他每次来就说，我给你送点“小海鲜”，我就知道怎么回事儿了。
    cite: b12-xinhua-2022-01-15-zero-tolerance-ep1
    kind: interview
    date: 2022-01-15
    occasion: 《零容忍》第一集，谈王立科送钱
  - text: 你是做公安的，是公平和正义的维护者，没想到自己成了一个法治建设或者是公平正义的破坏者。
    cite: b12-xinhua-2022-01-15-zero-tolerance-ep1
    kind: interview
    date: 2022-01-15
    occasion: 《零容忍》第一集，反思部分
  - text: 我应该说算是（党的）十八大或者十九大之后都没有收敛也没有收手的，犯了不少错误，也犯了不少罪过。
    cite: b12-xinhua-2022-01-15-zero-tolerance-ep1
    kind: interview
    date: 2022-01-15
    occasion: 《零容忍》第一集开场
  - text: 要把党徽和党旗永放心头、把群众放在心中最高位置……时刻以党员标准严格要求自己，对党忠诚、积极工作，为共产主义奋斗终身
    cite: b12-bbc-2020-04-20-sun-lijun
    kind: public
    date: 2020-03
    occasion: 在武汉为两名年轻女民警当入党介绍人时对她们说的话（《人民公安报》报道，BBC 转引），落马前一个多月

fu-zhenghua:
  - text: 确实我对他有唯命是从的做法，在政治上他也是竭尽全力地举荐和做工作，这个在政治上实际上是互相利用。
    cite: b12-chinanews-2023-01-07-bugle-ep1
    kind: interview
    date: 2023-01-07
    occasion: 中纪委专题片《永远吹冲锋号》第一集中出镜，谈与孙力军的关系
    star: true
  - text: 由于我的违法犯罪，严重损坏了党的形象，严重危害了公安司法事业，严重破坏了政法系统的政治生态，我的教训极为沉痛。
    cite: b12-chinanews-2023-01-07-bugle-ep1
    kind: interview
    date: 2023-01-07
    occasion: 《永远吹冲锋号》第一集开场
  - text: 是我对权力的滥用和任性，用权时的越轨和出轨，带坏了家人，败坏了家风，我应当对家风的败坏负全部责任，因为根子是我以权谋私。
    cite: b12-chinanews-2023-01-07-bugle-ep1
    kind: interview
    date: 2023-01-07
    occasion: 《永远吹冲锋号》第一集，谈亲属借其权力牟利
  - text: 从一开始就不是真实的身份和本来面目，看到我的职务提升，他就编造了更大的谎言，然后用这个诱惑，牵着我一步一步地往前走，反过来我给他办了好几件事。
    cite: b12-chinanews-2023-01-07-bugle-ep1
    kind: interview
    date: 2023-01-07
    occasion: 《永远吹冲锋号》第一集，谈骗了他近 20 年的“政治骗子”李全
  - text: 今后谁再收钱‘捞人’，就坚决开除谁，谁再打听案情，办人情案、关系案就坚决处理谁。纪律面前人人平等，执行纪律没有例外
    cite: b12-bbc-2021-10-03-fu-zhenghua
    kind: public
    date: 2010
    occasion: 刚任北京市公安局局长时宣布“三个凡是”铁规（BBC 转引）

su-rong:
  - text: 正常的同志关系，完全变成了商品交换关系。我家成了‘权钱交易所’，我就是‘所长’，老婆是‘收款员’。
    cite: b12-xinhua-2015-05-29-su-rong-warning
    kind: leaked
    date: 2015-05
    occasion: 苏荣的忏悔录，见官方 2015 年的警示文章
    star: true
  - text: 收受别人的陶瓷瓷瓶，被碰得头破血流；收受别人的陶瓷瓷碗，被砸得遍体鳞伤；收受别人的书画字画，将政治生命化为灰烬；收受别人的钱财和贵重物品，使自己跌入了经济犯罪的万丈深渊。
    cite: b12-people-2016-10-21-su-rong-documentary
    kind: interview
    date: 2016-10-20
    occasion: 专题片《永远在路上》第四集中首次露面，用四句话概括自己的犯罪过程
  - text: 我到江西是最后一站了，希望离任时老百姓能说，苏荣这个人还行，还是做了些实事，我就满足了。
    cite: b12-xinhua-2015-05-29-su-rong-warning
    kind: public
    date: 2007
    occasion: 初到江西时在干部大会上的讲话（警示文章记载）
  - text: 现在就放我出去我都没法出去，怎么去见熟人，同学，特别是老领导，我无法去见面，我没脸去见面。
    cite: b12-people-2016-10-21-su-rong-documentary
    kind: interview
    date: 2016-10-20
    occasion: 专题片《永远在路上》第四集
  - text: 我将自己主政的地方变成了亲朋故友谋取私利的经济领地，带坏了社会风气，也害了亲友。
    cite: b12-xinhua-2015-05-29-su-rong-warning
    kind: leaked
    date: 2015-05
    occasion: 苏荣的忏悔录，见官方 2015 年的警示文章

lu-wei:
  - text: 中国历来好客热情，但谁到我家做客，我是有选择的。我没有办法改变你，但是我有权利选择朋友。我希望到中国来的都是朋友，是真朋友。你的网站在你家里，我怎么可能跑到你家去关你家的网站？
    cite: b12-xinhua-2014-10-30-lu-wei-guest
    kind: public
    date: 2014-10-30
    occasion: 国务院新闻办发布会上回应中国是否封锁境外网站
    star: true
  - text: 自由和秩序紧密相连、不可分割，自由是秩序的目的，秩序是自由的保障，离开了秩序的自由是不存在的。哪里没有秩序，那里一定没有自由。
    cite: b12-wenming-2013-09-lu-wei-freedom-order
    kind: public
    date: 2013-09-09
    occasion: 在伦敦第五届中英互联网圆桌会议上的主旨演讲
  - text: 就像一个汽车一样，如果没有刹车，这个汽车的性能再好，一旦上了高速路，可想而知会造成怎样的后果。所以，再好的汽车都要有刹车。
    cite: b12-xinhua-2014-09-10-lu-wei-davos
    kind: adlib
    date: 2014-09-10
    occasion: 夏季达沃斯论坛“网络经济的未来”分论坛问答
  - text: 我们不能允许的是，占着中国的市场，挣了中国的钱，又来伤害中国。这是绝不能允许的。
    cite: b12-xinhua-2014-09-10-lu-wei-davos
    kind: adlib
    date: 2014-09-10
    occasion: 夏季达沃斯分论坛上回答有关高通反垄断调查的提问
  - text: 你们说‘内容审查’这四个字是用词不当……但是没有‘内容审查’不等于没有管理。
    cite: b12-nytcn-2017-11-22-lu-wei
    kind: public
    occasion: 《纽约时报》在其落马时转引的讲话

lai-xiaomin:
  - text: 拿了就往那儿一放，就像经常会去超市嘛，把这个名字叫超市。就在里面铁柜里，铁皮柜，一分钱都没有花，都放在那里了，最后组织上都收了。所以我说要这么多钱有什么用呢，最后又不敢花又不敢用，还提心吊胆的。
    cite: b12-sina-2020-01-13-national-supervision-ep2
    kind: interview
    date: 2020-01
    occasion: 中纪委专题片《国家监察》中出镜，谈藏匿现金的房子
    star: true
  - text: 党委书记、董事长、法人都是我一个人挑，纪委书记都还是自己党委下面管，他哪有多少权威啊？纪委书记是我的党委委员，我的部下，他很难监督我，说句实话。
    cite: b12-sina-2020-01-13-national-supervision-ep2
    kind: interview
    date: 2020-01
    occasion: 专题片《国家监察》
  - text: 金融行业天天跟钱打交道，而且接触的老板都是动不动几个亿、几十个亿、上百亿的，给你点钱对他来说小菜一碟
    cite: b12-sina-2020-01-13-national-supervision-ep2
    kind: interview
    date: 2020-01
    occasion: 专题片《国家监察》
  - text: 你跟他要一套，或者车子这个不错，我喜欢开这种车，留在我这吧，当时就非常麻木了。
    cite: b12-sina-2020-01-13-national-supervision-ep2
    kind: interview
    date: 2020-01
    occasion: 专题片《国家监察》，谈向老板索要房车
  - text: 我来到公司8年瘦了20斤，公司养肥了，我却瘦了。
    cite: b12-hkcd-2018-08-12-lai-cash
    kind: adlib
    date: 2017-03
    occasion: 华融 2016 年业绩发布会上的笑谈（华商报转述）
