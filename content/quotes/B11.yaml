# B11: quotes for Yang Jiechi, Meng Jianzhu, Sun Chunlan, Chen Min'er, Huang Kunming.
yang-jiechi:
  - text: 美国没有资格居高临下同中国说话，中国人不吃这一套。与中国打交道，就要在相互尊重的基础上进行。
    cite: b11-mfa-2021-03-19-yang-anchorage
    kind: public
    date: 2021-03-18
    occasion: 安克雷奇中美高层战略对话开场发言
    star: true
  - text: 你们没有资格在中国的面前说，你们从实力的地位出发，跟中国谈话……中国人是不吃这一套的。
    cite: b11-bbc-2021-03-20-anchorage-close
    kind: adlib
    date: 2021-03-18
    occasion: 安克雷奇对话开场，回应布林肯、沙利文（据现场录像）
  - text: 难道我们吃洋人的苦头还少吗？
    cite: b11-bbc-2021-03-19-anchorage-plain
    kind: adlib
    date: 2021-03-18
    occasion: 安克雷奇中美高层战略对话
  - text: 中美有过对抗的年代，中国都挺过来了。事实证明，对抗对美国没有好处。
    cite: b11-mfa-2021-03-19-yang-anchorage
    kind: public
    date: 2021-03-18
    occasion: 安克雷奇中美高层战略对话开场发言
  - text: China is a big country and other countries are small countries and that is just a fact.
    zh: 中国是大国，其他国家是小国，这就是事实。
    cite: b11-jamestown-2010-china-missteps
    kind: leaked
    date: 2010-07
    occasion: 东盟地区论坛河内会议，对新加坡外长（据与会者转述）

