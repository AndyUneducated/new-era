# B08: quotes, person id → list. Every text is checked verbatim against its cite.
qin-gang:
  - text: 如果美方不踩刹车，继续沿着错误道路狂飙下去，再多的护栏也挡不住脱轨翻车，必然陷入冲突对抗。
    cite: b08-mfa-2023-03-07-qin-presser
    kind: interview
    date: 2023-03-07
    occasion: 十四届全国人大一次会议记者会，首次以外长身份回答中外记者提问
    star: true
  - text: 其实，所谓“战狼外交”就是一个话语陷阱，制造这个话语陷阱的人，要么不懂中国和中国外交，要么无视事实，别有用心。
    cite: b08-mfa-2023-03-07-qin-presser
    kind: interview
    date: 2023-03-07
    occasion: 同一场记者会，回答关于“战狼外交”的提问
  - text: 中国外交有足够的厚道与善意，但当豺狼挡道、恶狼来袭，中国的外交官必须“与狼共舞”，保家卫国。
    cite: b08-mfa-2023-03-07-qin-presser
    kind: interview
    date: 2023-03-07
    occasion: 同一场记者会，回答关于“战狼外交”的提问
  - text: 台湾问题是中国核心利益中的核心，是中美关系政治基础中的基础，是中美关系第一条不可跨越的红线。
    cite: b08-mfa-2023-03-07-qin-presser
    kind: interview
    date: 2023-03-07
    occasion: 同一场记者会，谈中美关系
li-shangfu:
  - text: 如果有人胆敢把台湾从中国分裂出去，中国军队不会有丝毫迟疑，不畏惧任何对手，不管付出多大代价，都将坚决维护国家主权和领土完整。
    cite: b08-chinanews-2023-06-04-li-shangri-la
    kind: public
    date: 2023-06-04
    occasion: 第二十届香格里拉对话会大会发言，他作为防长的首次多边亮相
    star: true
  - text: 如果相互尊重都做不到，交流对话不会有好的效果。
    cite: b08-chinanews-2023-06-04-li-shangri-la-qa
    kind: interview
    date: 2023-06-04
    occasion: 香格里拉对话会发言后回答中美防务交流的提问
