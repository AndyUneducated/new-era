luo-gan:
  - text: 有效防范敌对势力和别有用心的人插手和利用人民内部矛盾问题制造事端，打着“维权”幌子进行破坏活动，利用“法轮功”等邪教组织捣乱滋事
    cite: b03-reformdata-2006-luo-qiushi
    kind: public
    date: 2006-04-11
    occasion: 社会主义法治理念研讨班讲话
    star: true
  - text: 社会主义法治理念可以概括为依法治国、执法为民、公平正义、服务大局、党的领导五个方面的内容
    cite: b03-reformdata-2006-luo-qiushi
    kind: public
    date: 2006-04-11
    occasion: 社会主义法治理念研讨班讲话
  - text: 也有一些别有用心的人，企图打着依法治国的幌子否定党对政法工作的领导，打着司法改革的旗号否定社会主义制度
    cite: b03-reformdata-2006-luo-qiushi
    kind: public
    date: 2006-04-11
    occasion: 社会主义法治理念研讨班讲话
  - text: 什么犯罪突出，就重点打击什么犯罪，什么问题突出就重点解决什么问题
    cite: b03-reformdata-2006-luo-qiushi
    kind: public
    date: 2006-04-11
    occasion: 社会主义法治理念研讨班讲话，谈“严打”方针
  - text: 政法干警既是党的忠诚卫士，人民的忠诚卫士，也是法律的忠诚卫士。
    cite: b03-reformdata-2006-luo-qiushi
    kind: public
    date: 2006-04-11
    occasion: 社会主义法治理念研讨班讲话

