  - text: 满足官兵生活工作的基本需要，要让战士们喝上干净水，洗上热水澡，如厕很方便
    cite: b13-gmw-2007-07-22-barracks
    kind: interview
    date: 2007-07
    occasion: 任总后基建营房部部长时谈全军营区综合配套整治
  - text: 由于老标准内容缺项、指标偏低，近年来无标准、超标准建房现象时有发生，工程建设管理秩序受到影响。因此，与时俱进修订老标准势在必行。
    cite: b13-chinanews-2009-12-07-gu-standards
    kind: interview
    date: 2009-12-07
