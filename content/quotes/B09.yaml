wang-yi:
  - text: 你的提问，充满了对中国的偏见, 和不知道从什么地方来的傲慢，我是完全不能接受的。
    cite: b09-xinhua-2016-06-03-wang-canada-p3
    kind: adlib
    date: 2016-06-01
    occasion: 渥太华中加外长联合记者会上回应加拿大记者关于人权的提问
    star: true
  - text: 最了解中国人权状况的，不是你，是中国人自己。你没有发言权，而中国有发言权。
    cite: b09-xinhua-2016-06-03-wang-canada-p3
    kind: adlib
    date: 2016-06-01
    occasion: 渥太华中加外长联合记者会
  - text: 这种行为令人匪夷所思，几乎是歇斯底里的，荒唐的，是百分之百的滥用武力
    cite: b09-rfi-2023-02-18-wang-munich
    kind: public
    date: 2023-02-18
    occasion: 慕尼黑安全会议上谈美国击落中国气球
  - text: 不管你把头发染得再黄、鼻子修得再尖，你也变不了欧美人，变不成西方人，要知道自己的根在什么地方。
    cite: b09-ifeng-2023-07-04-wang-qingdao
    kind: adlib
    date: 2023-07-03
    occasion: 青岛中日韩合作国际论坛期间会见主要嘉宾
  - text: 中国外交将坚定不移地站在历史正确的一边，站在人类进步的一边，将以中国的确定性稳住不确定的世界。
    cite: b09-mfa-2025-03-07-wang-presser
    kind: public
    date: 2025-03-07
    occasion: 十四届全国人大三次会议外交主题记者会

liu-he:
  - text: 合作是双方唯一正确的选择，但合作是有原则的，在重大原则问题上中方决不让步。
    cite: b09-gov-2019-05-11-liu-he-washington
    kind: interview
    date: 2019-05-10
    occasion: 第十一轮中美经贸高级别磋商结束后在华盛顿对媒体表示
    star: true
  - text: 关税是双方贸易争端的起点，如果要达成协议，加征的关税必须全部取消。
    cite: b09-gov-2019-05-11-liu-he-washington
    kind: interview
    date: 2019-05-10
    occasion: 第十一轮中美经贸高级别磋商结束后
  - text: 在大国发展的过程中，出现一些曲折是好事，可以检验我们的能力。
    cite: b09-gov-2019-05-11-liu-he-washington
    kind: interview
    date: 2019-05-10
    occasion: 第十一轮中美经贸高级别磋商结束后
  - text: 历史或以不同的方式重演，或把我们带到似曾相识的十字路口
    cite: b09-bbc-2025-us-china-talks
    kind: public
    date: 2018
    occasion: 中美贸易谈判期间的一次发言（BBC中文网转引）

chen-xi:
  - text: 有的不信马列信鬼神，不信理想信方术，不敬人民敬“大师”，精神极度空虚
    cite: b09-xinhua-2017-11-16-chen-xi-article
    kind: public
    date: 2017-11-16
    occasion: 《人民日报》署名文章《培养选拔干部必须突出政治标准》
    star: true
  - text: 干部政治上出问题，对党的危害绝不亚于腐败问题，其职务越高、平台越大，给党造成的损失越大。
    cite: b09-xinhua-2017-11-16-chen-xi-article
    kind: public
    date: 2017-11-16
    occasion: 《人民日报》署名文章《培养选拔干部必须突出政治标准》
  - text: 有的把西方三权分立、多党制那一套奉为圭臬，价值观发生偏差
    cite: b09-xinhua-2017-11-16-chen-xi-article
    kind: public
    date: 2017-11-16
    occasion: 《人民日报》署名文章《培养选拔干部必须突出政治标准》
  - text: 对党忠诚，不是有条件的而是无条件的，不是抽象的而是具体的
    cite: b09-xinhua-2017-11-16-chen-xi-article
    kind: public
    date: 2017-11-16
    occasion: 《人民日报》署名文章《培养选拔干部必须突出政治标准》

hu-chunhua:
  - text: 不获全胜、决不收兵，确保如期完成脱贫攻坚任务。
    cite: b09-xinhua-2019-09-03-hu-poverty
    kind: public
    date: 2019-09
    occasion: 四川广元深度贫困地区脱贫攻坚督导推进会
    star: true
  - text: 脱贫攻坚越到最后阶段越要保持定力。
    cite: b09-xinhua-2020-06-18-hu-poverty
    kind: public
    date: 2020-06-18
    occasion: 脱贫攻坚督战工作电视电话会议
  - text: 作为一个政协新兵，最近通过学习习近平总书记关于加强和改进人民政协工作的重要思想，有一些初步的认识和收获。
    cite: b09-rmzxw-2023-04-03-hu-speech
    kind: public
    date: 2023-04
    occasion: 全国政协党组理论学习中心组2023年第一次集体学习发言
  - text: 人民政协是各党派团体和各族各界人士发扬民主、参与国是、团结合作的重要平台，不是权力机关，也不是决策机构。
    cite: b09-rmzxw-2023-04-03-hu-speech
    kind: public
    date: 2023-04
    occasion: 全国政协党组理论学习中心组2023年第一次集体学习发言

chen-quanguo:
  - text: 应收尽收
    cite: b09-nyt-2019-11-16-xinjiang-papers
    kind: leaked
    occasion: 新疆内部文件中的命令（《纽约时报》2019年11月披露）
    star: true
  - text: 对于一些人，甚至5年的再教育可能是不够的
    cite: b09-bbc-2022-05-24-police-files
    kind: leaked
    occasion: 对军队和警察系统高级干部的内部讲话（“新疆公安文件”）
  - text: 这些人一旦放出去，问题又会重新出现，这就是新疆的现实。
    cite: b09-bbc-2022-05-24-police-files
    kind: leaked
    occasion: 对军队和警察系统高级干部的内部讲话（“新疆公安文件”）
  - text: 危害不除，新疆难安。
    cite: b09-chinanews-2017-02-28-chen-rally
    kind: public
    date: 2017-02-27
    occasion: 乌鲁木齐反恐维稳誓师大会
  - text: 追着打、压着打、挖着打，斩草除根、除恶务尽
    cite: b09-chinanews-2017-02-28-chen-rally
    kind: public
    date: 2017-02-27
    occasion: 乌鲁木齐反恐维稳誓师大会

he-lifeng:
  - text: 贸易战没有赢家，中方不愿打贸易战，但也不怕打。倘若美方执意侵害中方权益，中方将坚决反制，奉陪到底。
    cite: b09-mofcom-2025-05-12-geneva-talks
    kind: public
    date: 2025-05-11
    occasion: 日内瓦中美经贸高层会谈
    star: true
  - text: 此次中美经贸高层会谈坦诚、深入、具有建设性，达成重要共识，并取得实质性进展。
    cite: b09-gov-2025-05-12-he-geneva-presser
    kind: public
    date: 2025-05-11
    occasion: 日内瓦中方代表团新闻发布会
  - text: 作为发展阶段、经济制度不同的两个大国，中美双方在经贸合作中出现分歧和摩擦是正常的
    cite: b09-mofcom-2025-05-12-geneva-talks
    kind: public
    date: 2025-05-11
    occasion: 日内瓦中美经贸高层会谈
  - text: 两国经贸关系的本质是互利共赢。
    cite: b09-mofcom-2025-05-12-geneva-talks
    kind: public
    date: 2025-05-11
    occasion: 日内瓦中美经贸高层会谈

li-yuanchao:
  - text: 把最优秀的干部用在最关键的岗位上
    cite: b09-taiwan-2009-11-21-li-cadres
    kind: public
    date: 2009-11-21
    occasion: 全国组织部长学习贯彻十七届四中全会精神培训班
    star: true
  - text: 干部队伍年轻化不是“低龄化”，不能将任职年龄层层递减。
    cite: b09-taiwan-2009-11-21-li-cadres
    kind: public
    date: 2009-11-21
    occasion: 全国组织部长学习贯彻十七届四中全会精神培训班
  - text: 坚决纠正干部任职年龄“一刀切”的错误做法
    cite: b09-taiwan-2009-11-21-li-cadres
    kind: public
    date: 2009-11-21
    occasion: 全国组织部长学习贯彻十七届四中全会精神培训班
  - text: 组织部长要以对党组织高度负责、对人民事业高度负责、对干部工作高度负责的精神选人用人，当好党的干部制度和用人原则的“守门员”。
    cite: b09-taiwan-2009-11-21-li-cadres
    kind: public
    date: 2009-11-21
    occasion: 全国组织部长学习贯彻十七届四中全会精神培训班
