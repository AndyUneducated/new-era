# B17: quotes for Wang Xiaohong, Liu Jinguo, Guo Shengkun, Yang Xiaodu, Zhang Chunxian, You Quan.
wang-xiaohong:
  - text: 推动中美禁毒和执法合作行稳致远，更好回应人民期待，展现大国担当。希望美方展现更多合作诚意，重视并解决中方关切。
    cite: b17-gov-2025-01-08-wang-gupta
    kind: public
    date: 2025-01-07
    occasion: 与美国白宫国家禁毒政策办公室主任古普塔视频通话（新华社转述）
    star: true
  - text: 持续深化反恐、打击电诈等跨国犯罪、高质量共建“一带一路”安保和移民管理等领域务实合作
    cite: b17-gov-2026-05-19-wang-astana
    kind: public
    date: 2026-05-18
    occasion: 阿斯塔纳中国－中亚公安内务部长会晤机制第二次会议主旨发言（新华社转述）
  - text: 合力打击“三股势力”，深化打击跨国犯罪、移民管理、海外利益保护、执法能力建设等领域务实合作
    cite: b17-gov-2026-09-07-wang-central-asia
    kind: public
    date: 2026-09-07
    occasion: 北京中国－中亚公安内务部长会晤机制非正式会晤主旨讲话（新华社转述）

liu-jinguo:
  - text: 有人说我‘装’，那我就‘装’到死。咱们共产党人都‘装到死’，不就成真的了吗？
    cite: b17-cntv-2012-02-14-liu-hometown
    kind: adlib
    date: 2012-02
    occasion: 回应有人怀疑他清廉是“装”（中新网转述）
    star: true
  - text: 我是人民公仆，如有不廉洁、不公正、不负责、不作为的任何一点，定将主动辞职，坚决言行一致，决不失信于民！
    cite: b17-cntv-2012-02-14-liu-hometown
    kind: public
    occasion: 公开承诺
  - text: 我只有管好自己家里人了，才有资格去管别人。
    cite: b17-cntv-2012-02-14-liu-hometown
    kind: interview
    occasion: 告诫亲友（中新网转述）
  - text: 我来到了这个火场，就没想活着回去。
    cite: b17-chinanews-2014-10-25-liu-ccdi
    kind: adlib
    date: 2010-07-16
    occasion: 大连新港输油管线火灾现场，对时任大连市公安局长王立科
  - text: 不枉纪枉法，不干预办案，不泄露案情，不吃请受礼。
    cite: b17-chinanews-2014-10-25-liu-ccdi
    kind: public
    occasion: 亲手为公安部纪检干部写下的四条纪律

guo-shengkun:
  - text: 要以刀刃向内的决心勇气抓好查纠整改，坚决清除害群之马、整治顽瘴痼疾。
    cite: b17-court-2021-02-guo-rectification
    kind: public
    date: 2021-02-27
    occasion: 全国政法队伍教育整顿动员部署会议
    star: true
  - text: 努力打造一支党和人民信得过、靠得住、能放心的政法铁军
    cite: b17-court-2021-02-guo-rectification
    kind: public
    date: 2021-02-27
    occasion: 全国政法队伍教育整顿动员部署会议
  - text: 要稳妥有序推进干警违纪违法问题查处工作，清除害群之马，维护政法队伍肌体健康。
    cite: b17-spp-2021-04-06-guo-rectification
    kind: public
    date: 2021-04-06
    occasion: 全国第一批政法队伍教育整顿工作推进会
  - text: 社会稳定的良好局面来之不易，要倍加珍惜、持续巩固
    cite: b17-voa-2018-09-21-guo-xinjiang
    kind: public
    date: 2018-09
    occasion: 新疆调研（美国之音转引官方报道）
  - text: maximisation of interests
    zh: 利益最大化
    cite: b17-scmp-2012-12-29-guo-divides
    kind: interview
    date: 2010
    occasion: 接受党刊采访，称经营企业和治理自治区都要追求利益最大化，只是服务对象不同（南华早报转述）

yang-xiaodu:
  - text: 反腐败是个世界性的难题，只要有官吏，官吏个人发生腐败行为是不可避免的。
    cite: b17-12371-2017-10-19-yang-presser
    kind: public
    date: 2017-10-19
    occasion: 十九大新闻中心记者招待会
    star: true
  - text: 我说在中国人民心目当中，林肯是个英雄，因为他解放了黑奴……反过来，我们在西藏解放农奴，美国朋友怎么就想不通了呢？
    cite: b17-12371-2017-10-19-yang-presser
    kind: adlib
    date: 2017-10-19
    occasion: 十九大记者会上回答 CGTN 记者关于人权的提问
  - text: “不敢”，我们基本做到了，群众说坏人怕了；“不能”，我们现在正在快速推进，违纪违法的空间越来越小
    cite: b17-12371-2017-10-19-yang-presser
    kind: public
    date: 2017-10-19
    occasion: 十九大新闻中心记者招待会
  - text: 我不敢说没有漏网的，但是我想，再出现过去那样的情况是不可能了。
    cite: b17-12371-2017-10-19-yang-presser
    kind: adlib
    date: 2017-10-19
    occasion: 十九大记者会上回答凤凰卫视记者关于孙政才等人带病提拔的提问
  - text: 如果没有习近平总书记和党中央坚强有力的领导，中央纪委能做多大的事？
    cite: b17-12371-2017-10-19-yang-presser
    kind: public
    date: 2017-10-19
    occasion: 十九大新闻中心记者招待会

zhang-chunxian:
  - text: 当交通部部长时，我最担心车祸。现在当湖南省委书记，我最担心人祸。
    cite: b17-chinanews-2006-03-07-zhang-hunan
    kind: interview
    date: 2006-03
    occasion: 全国两会期间接受第一财经日报采访
    star: true
  - text: 我不喜欢烧新官上任后的‘三把火’，我也不刻意去追求这些！
    cite: b17-chinanews-2006-03-07-zhang-hunan
    kind: interview
    date: 2006-03
    occasion: 全国两会期间接受第一财经日报采访
  - text: 要标本兼治，多管齐下，综合施策，但根本还在争取民心
    cite: b17-people-2014-03-06-zhang-terror
    kind: public
    date: 2014-03-05
    occasion: 全国人大新疆代表团审议政府工作报告
  - text: 现在新疆的暴恐，90%是‘翻墙’，根据网络上一些视频，不断形成暴恐
    cite: b17-people-2014-03-07-zhang-sixteen-minutes
    kind: adlib
    date: 2014-03-06
    occasion: 全国两会新疆团开放日后回应境外记者
  - text: 再说吧，再说
    cite: f04-rfi-2016-03-09-xinjiang
    kind: adlib
    date: 2016-03-08
    occasion: 两会期间被记者问是否支持习近平的领导

you-quan:
  - text: 我希望今天座谈会开得实一点，表扬政府的话就不说了，大家开门见山，有什么问题就讲什么问题。
    cite: b17-hxnews-2014-09-22-you-putian
    kind: adlib
    date: 2014-09
    occasion: 莆田民营企业代表座谈会开场
    star: true
  - text: 不能给他们机会！政府一定会为你们发展打造更好的环境，尤其是良好的市场环境和开放环境，你们只管放手干，我们为你们做好服务。
    cite: b17-hxnews-2014-09-22-you-putian
    kind: adlib
    date: 2014-09
    occasion: 莆田座谈会上回应女企业家对韩日竞争对手的担忧
  - text: 作为一名新的福建人，我要尽快融入福建、扎根福建，更好地服务福建、奉献福建。
    cite: b17-people-2012-12-20-you-fujian
    kind: public
    date: 2012-12-19
    occasion: 福建省领导干部大会就任讲话
  - text: 统一战线是政治联盟，统战工作是政治工作，必须始终坚持党的领导，以党的旗帜为旗帜、以党的方向为方向、以党的意志为意志
    cite: b17-people-2019-11-26-you-united-front
    kind: public
    date: 2019-11-26
    occasion: 人民日报署名文章《坚持大统战工作格局》
  - text: 支持各宗教在保持基本信仰、核心教义、礼仪制度的同时，深入挖掘教义教规中有利于社会和谐、时代进步、健康文明的内容，对教规教义作出符合当代中国发展进步要求、符合中华优秀传统文化的阐释
    cite: b17-people-2019-11-26-you-united-front
    kind: public
    date: 2019-11-26
    occasion: 人民日报署名文章《坚持大统战工作格局》
