# B15: quotes for Li Ganjie, Li Shulei, Zhang Guoqing, Chen Jining, Yuan Jiajun.
li-ganjie:
  - text: 对于“一刀切”，我们的态度一直是非常鲜明的，坚决反对，坚决制止，严格禁止。“一刀切”是生态环境领域形式主义和官僚主义的典型表现，它既影响和损害了形象和公信力，也损害了合法合规企业的基本权益。
    cite: b15-people-2019-03-11-li-ganjie-presser
    kind: public
    date: 2019-03-11
    occasion: 十三届全国人大二次会议记者会，答“一刀切”问题
    star: true
  - text: 不管大会小会，什么场合、什么活动，都是旗帜鲜明的坚决反对，要求大家不要这么做……相反，影响很不好，一粒老鼠屎搞坏一锅汤。
    cite: b15-people-2019-03-11-li-ganjie-presser
    kind: adlib
    date: 2019-03-11
    occasion: 十三届全国人大二次会议记者会
  - text: 坚持“双查”，既查不作为、慢作为，又查乱作为、滥作为。
    cite: b15-people-2019-03-11-li-ganjie-presser
    kind: public
    date: 2019-03-11
    occasion: 十三届全国人大二次会议记者会，谈生态环境督察

li-shulei:
  - text: 如果一个执政党因党八股之困而减弱了其文化影响力并进而危及到自身与民族生存，那就应是它奋起从思想上与体制上反对党八股的时候了。
    cite: b15-people-2014-11-12-party-jargon
    kind: public
    occasion: 任中央党校教员时的文章（人民网 2014 年引述）
    star: true
  - text: 当时就想，这下子终于不用放羊了。
    cite: b15-pku-2016-li-shulei-prodigy
    kind: interview
    occasion: 回忆 1978 年在黄河滩放羊时接到北大录取通知书
  - text: 要发扬学术民主、艺术民主，鼓励解放思想、大胆探索，营造积极健康、宽松和谐的氛围，提倡不同观点和学派充分讨论
    cite: b15-people-2022-11-10-li-shulei-article
    kind: public
    date: 2022-11-10
    occasion: 人民日报署名文章《增强实现中华民族伟大复兴的精神力量》
  - text: 要正确区分政治原则问题、思想认识问题、学术观点问题，旗帜鲜明反对和抵制各种错误观点。
    cite: b15-people-2022-11-10-li-shulei-article
    kind: public
    date: 2022-11-10
    occasion: 人民日报署名文章
  - text: 新闻舆论工作处在意识形态斗争最前沿，必须坚持党管宣传、党管意识形态、党管媒体
    cite: b15-people-2022-11-10-li-shulei-article
    kind: public
    date: 2022-11-10
    occasion: 人民日报署名文章

zhang-guoqing:
  - text: 今后不管走到哪里，兵器工业永远是我的“娘家”，我会经常回来汇报工作，看望大家。
    cite: f08-chinanews-2017-02-07-jungong
    kind: public
    date: 2013-04
    occasion: 离开兵器工业集团赴重庆任职前
    star: true
  - text: 必须时刻绷紧安全生产这根弦。
    cite: b15-xinhua-2023-05-31-zhang-safety-month
    kind: public
    date: 2023-05-31
    occasion: 2023 年全国“安全生产月”活动启动仪式
  - text: 坚决打赢当前防汛抗洪救灾这场遭遇战
    cite: b15-xinhua-2023-08-05-zhang-tianjin-flood
    kind: public
    date: 2023-08-05
    occasion: 受习近平委派赴天津指导防汛抗洪救灾
  - text: 确保风险区域人员应撤尽撤、不落一人，严格落实交通管制等措施，防止转移安置人员未经允许提前返回，坚决避免群死群伤。
    cite: b15-xinhua-2023-08-05-zhang-tianjin-flood
    kind: public
    date: 2023-08-05
    occasion: 在天津大清河、独流减河等防汛一线

chen-jining:
  - text: 我今天上午给她打了很多电话，一直占线，我给她发了短信，向她表示感谢。
    cite: b15-bjnews-2015-03-01-chen-chaijing
    kind: adlib
    date: 2015-03-01
    occasion: 就任环保部长后首次媒体见面会，谈柴静纪录片《穹顶之下》
    star: true
  - text: 我想，这个片子对换取公众关注环境健康问题也有重要的促进作用，我特别赞赏这个事情。
    cite: b15-bjnews-2015-03-01-chen-chaijing
    kind: adlib
    date: 2015-03-01
    occasion: 环保部长首次媒体见面会
  - text: 要通过专项行动集中整治一批突出问题，取缔一批违法场所，拆除一批违法建筑，关闭取缔一批违法违规和不符合安全条件的企业，倒逼安全隐患突出的低端业态疏解腾退。
    cite: b06-people-2017-11-20-cai-fire
    kind: public
    date: 2017-11-19
    occasion: 大兴西红门火灾现场会
  - text: 惟有以“我将无我”的担当和“时时放心不下”的责任感，恪尽职守，埋头苦干。
    cite: b15-zaobao-2022-10-29-chen-shanghai
    kind: public
    date: 2022-10-28
    occasion: 上海市领导干部会议，就任上海市委书记表态

yuan-jiajun:
  - text: 共同富裕不仅是社会发展概念，更是一场以缩小地区差距、城乡差距、收入差距为标志的社会变革。
    cite: b15-xinhua-2021-06-10-yuan-common-prosperity
    kind: interview
    date: 2021-06
    occasion: 浙江共同富裕示范区文件发布时接受新华社专访
    star: true
  - text: 按照“每年有新突破、5年有大进展、15年基本建成”的安排，用3个五年规划时间压茬推进，争取不断形成阶段性标志性成果。
    cite: b15-xinhua-2021-06-10-yuan-common-prosperity
    kind: interview
    date: 2021-06
    occasion: 新华社专访
  - text: 让人民群众真切感受到共同富裕看得见、摸得着、真实可感，努力成为新时代全面展示中国特色社会主义制度优越性的重要窗口，为全国实现共同富裕先行探路。
    cite: b15-xinhua-2021-06-10-yuan-common-prosperity
    kind: interview
    date: 2021-06
    occasion: 新华社专访
  - text: 浙江是城乡区域发展最均衡、群众最富裕、社会活力最强、社会秩序最优的省份之一，为浙江共同富裕先行示范打下了坚实基础。
    cite: b15-xinhua-2021-06-10-yuan-common-prosperity
    kind: interview
    date: 2021-06
    occasion: 新华社专访
