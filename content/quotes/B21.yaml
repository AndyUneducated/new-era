    cite: b21-people-2015-04-30-guo-no-retreat
    kind: public
    date: 2015-04-29
    occasion: 同一次会议
  - text: 过去说“不是金刚钻，别揽瓷器活”，现在瓷器活就摆在面前了，我们的干部就要成为金刚钻。
    cite: b21-people-2015-04-30-guo-no-retreat
    kind: public
    date: 2015-04-29
    occasion: 同一次会议，谈干部要“长新的本领”
  - text: 北京的人口资源环境矛盾和“大城市病”问题，已经成为人民群众的高度关切，成为我们不能释怀的最大焦虑。
    cite: b21-cntv-2015-07-13-guo-big-test
    kind: public
    date: 2015-07-10
    occasion: 北京市委十一届七次全会
  - text: 没有共产党，就没有新西藏。只有社会主义才能发展西藏。
