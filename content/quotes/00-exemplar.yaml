    date: 2020-05-28
    occasion: 十三届全国人大三次会议闭幕后的记者会（当时转载的实录）
    star: true
  - text: 但是有6亿中低收入及以下人群，他们平均每个月的收入也就1000元左右
    cite: gov-2020-05-29-li-keqiang-presser
