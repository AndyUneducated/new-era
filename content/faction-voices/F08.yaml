# F08 (round 3): further voices on xi-shanghai, qinghua, aerospace and mishu

aerospace:
  - voice: zh
    text: 本文所指的「軍工系」，並非單純字面意義上軍工系統出身的官員，而是統指中共十八大以來湧現的一大批，來自航空航天系統、軍工系統等高新制造業領域的省部級高官。
    cite: f08-hk01-2021-jungong
    quote: true
  - voice: zh
    text: 不過與此同時，儘管在趨勢層面長期看好，但若看眼前，則在經歷十八大後頭幾年的「高光」之後，「軍工系」似乎有些後繼乏力。
    cite: f08-hk01-2021-jungong
    quote: true
  - voice: official
    text: 有媒体评论认为，从中国军工行业走出来的这些官员有着自身的鲜明特点，如执行能力强、善于在高压下突破创新、具有强烈的忠诚度和荣誉感等，而且基本没有官场现实利益的牵扯，这些都是组织部门十分看重的珍贵品质。
    cite: f08-chinanews-2017-02-07-jungong
    quote: true
  - voice: zh
    text: 金壮龙之后长时间未露面，人们臆测可能与中国军工系统近年出现大震荡、多名军工巨头相继落马有关。
    cite: f08-voa-2025-03-01-jin-zhuanglong
    quote: true

qinghua:
  - voice: scholar
    text: In contrast to members of the old Tsinghua Clique, who just happened to be graduates of the same university (such as Hu Jintao, Wu Bangguo, Huang Ju, and Wu Guanzheng), members of the new Tsinghua Clique have strong personal ties with one another.
    zh: 旧清华帮的成员只是恰好毕业于同一所大学（如胡锦涛、吴邦国、黄菊、吴官正），新清华帮的成员彼此之间则有很强的私人联系。
    cite: f08-diplomat-2015-04-27-tsinghua
    quote: true
  - voice: scholar
    text: The three men now have been placed in strategic positions for further promotions.
    zh: 这三人如今都被安排在有利于进一步升迁的战略位置上。
    cite: f08-diplomat-2015-04-27-tsinghua
    quote: true
  - voice: zh
    text: “但是，他们并没有共同的政治兴趣或信仰。将所有清华毕业生归为一个政治集团是一种误导。”沈栋说，“清华帮是一个没有实质内容的通用概念，清华每年都有成千上万的学生毕业。仅仅因为他们来自同一所学校，并不意味着他们在政治上是一致的。”
    cite: f08-epoch-2022-10-28-tsinghua
    quote: true

xi-shanghai:
  - voice: zh
    text: 從中央到地方，上海官員攻城略地，搶灘要津，一個新的上海幫呼之欲出，不過這個新上海幫並不是以江澤民為首，而是以習近平為尊，兩者有本質的區別。
    cite: f08-orientaldaily-2016-09-16-new-shanghai
    quote: true
  - voice: zh
    text: 丁薛祥和习近平在上海的工作关系只有七个月。2007年10月，习近平离开上海，前往北京。然而就是在这短短的7个月里，丁薛祥赢得了习近平的信任。
    cite: f08-voa-2022-11-08-ding
    quote: true
  - voice: zh
    text: 在这个新“上海帮”中，其实可以分为两大派。一是本土派，二是外来派。所谓本土派就是在上海基层起家，一步步升到区、局岗位，再进入市领导行列。丁薛祥、杜家毫、陈豪都是如此。
    cite: f08-botanwang-2014-10-new-shanghai
    quote: true

mishu:
  - voice: zh
    text: 中国事务专家、美国加州州立大学洛杉矶分校退休教授宋永毅认为，其中一个原因可能是习近平曾经做过秘书工作，而且由于学识和能力所限，做得很差，所以碰到了做秘书工作比较好的丁薛祥，他就会刮目相看。
    cite: f08-voa-2022-11-08-ding
    quote: true
  - voice: zh
    text: 中央辦公廳是中共中央的中樞機構……使中辦主任素來有「中南海大管家」之稱，前提是必須獲得領導人的絕對信任。
    cite: f08-cna-2023-03-20-cai-qi
    quote: true
  - voice: zh
    text: 所以，如果说当时的李强是习近平的大秘的话，那么徐令义就是习近平的二秘。
    cite: f07-rfa-2020-11-20-xu-lingyi
    quote: true
  - voice: zh
    text: 相比紧随习近平左右时常曝光在媒体面前的丁薛祥，钟绍军这个军委主席大秘似乎更加低调而神秘，在网络上几乎很难看到关于他的公开报道。
    cite: f08-secretchina-2021-09-22-zhong-shaojun
    quote: true
