# 上位之路 · 第七轮 U02：已有完整传记的第四代、第五代领导人（十六大至十九大的常委）。字段见 src/data/schema.ts 的 TurnRecordSchema 和 research/howto-content.md §12。
hu-jintao:
  routes: [youth, frontier, echelon, patron]
  rungs:
    - { rung: bureau, date: 1982-09, post: 共青团甘肃省委书记, cite: b02-gov-2008-03-16-hu-resume }
    - { rung: vice, date: 1982-12, post: 共青团中央书记处书记, cite: f05-people-2013-06-21-cyl-secretaries }
    - { rung: minister, date: 1984-12, post: 共青团中央书记处第一书记, cite: f05-people-2013-06-21-cyl-secretaries }
    - { rung: pb, date: 1992-10, post: 中央政治局常委、中央书记处书记, cite: b02-gov-2008-03-16-hu-resume }
    - { rung: psc, date: 1992-10, post: 中央政治局常委、中央书记处书记, cite: b02-gov-2008-03-16-hu-resume }
  turns:
    - date: 1979
      h: 建委座谈汇报
      text: >-
        胡锦涛清华大学水利系毕业后到甘肃刘家峡工地劳动，此后在水电部第四工程局和甘肃省建委做技术员、秘书，1975年任省建委设计管理处副处长。联合早报转述《南风窗》2002年的报道说，1979年时任甘肃省委“一把手”的宋平到省建委主持座谈会，胡锦涛出面汇报，给宋平留下深刻印象；1980年他出任甘肃省建委副主任，“从此进入仕途的快车道”。
      did: >-
        在基层工程单位和省级机关做了十多年技术和文字工作，轮到自己向省委书记汇报时，讲得让对方记住了他。
      who: [song-ping]
      cites: [b02-gov-2008-03-16-hu-resume, f05-zaobao-2026-03-04-song-ping]
    - date: 1982
      h: 三个月跳进团中央
      text: >-
        1982年9月他任共青团甘肃省委书记，同年12月团十一大上进入团中央书记处，兼任全国青联主席，给第一书记王兆国当副手；1984年12月接替王兆国任团中央第一书记。《中国新闻周刊》记述1982年十二大选干部年轻化时写到，新选出的348名中央委员和候补中央委员里，最年轻的就是39岁的胡锦涛。
      did: >-
        赶上干部年轻化的大批提拔，从省团委书记的位置上只做了三个月就调进中央，又在两年内接任团中央一把手。
      who: [wang-zhaoguo]
      cites: [b02-gov-2008-03-16-hu-resume, f05-people-2013-06-21-cyl-secretaries, u01-waou-2014-11-04-third-echelon]
    - date: 1988
      h: 在西藏处理骚乱
      text: >-
        1985年他从团中央外放贵州任省委书记，1988年46岁时转任西藏自治区党委书记。1989年拉萨发生骚乱后，国务院决定在拉萨实行戒严；新浪转载的《胡锦涛文选》收录了他当时的讲话，他说“分裂主义势力也绝不会善罢甘休”，要求树立长期斗争的思想准备。1992年他从西藏调回北京。
      did: >-
        先后去两个最穷、最难管的省区当一把手，在民族地区的骚乱中执行了中央的强硬决定。
      who: []
      cites: [b02-gov-2008-03-16-hu-resume, b02-sina-2016-09-20-hu-wenxuan]
    - date: 1992-10
      h: 隔代指定入常
      text: >-
        1992年十四大，49岁的胡锦涛直接从西藏党委书记进入中央政治局常委会和中央书记处，此后任中央党校校长、国家副主席、中央军委副主席，2002年接任总书记。BBC中文2001年的报道说，按中国自己的说法，他是邓小平生前预先安排的第四代领导班子的核心；学者吴稼祥认为这种“隔代指定”可能埋下了江胡之争的伏笔。联合早报说，宋平在甘肃和中组部主持工作时都提拔举荐过他。
      did: >-
        没有在中央部委或沿海大省担任过要职，就被当作下一代核心直接放进常委会，此后十年低调做副手，等到交接。
      who: [deng-xiaoping, song-ping, jiang-zemin]
      cites: [b02-gov-2008-03-16-hu-resume, c09-bbc-2001-hu-dragon-chair, f05-zaobao-2026-03-04-song-ping]
  can:
    text: >-
      能学的是在别人不愿去的地方扛事：他从刘家峡工地和甘肃省建委起步，后来又先后主政贵州和西藏这两个难管的省区，在西藏骚乱中执行了中央的决定。这些经历让他在被提拔时有可以拿得出手的地方一把手履历。
    cites: [b02-gov-2008-03-16-hu-resume, b02-sina-2016-09-20-hu-wenxuan]
  cannot:
    text: >-
      学不来的是时机和伯乐：1982年前后中共大批起用年轻干部，他以39岁进入中央委员会；宋平在甘肃对他的赏识，以及邓小平生前对第四代核心的安排，把他从一个省区书记直接放进了常委会。这样的窗口和这样的安排，此后再没有出现过。
    cites: [u01-waou-2014-11-04-third-echelon, f05-zaobao-2026-03-04-song-ping, c09-bbc-2001-hu-dragon-chair]
  counter:
    - id: wang-zhaoguo
      name: 王兆国
      text: 1982年任团中央第一书记，胡锦涛是他的副手；1984年转任中办主任、次年进入中央书记处。据高新的说法，1987年十三大前薄一波传达邓小平、陈云的意见，安排他到福建当省长，不再留任书记处书记，等于从副国级降为正省级，此后再没有进入常委会。
      cite: f05-rfa-2023-01-13-wang-zhaoguo-xi
  deep: true

wen-jiabao:
  routes: [technocrat, patron, secretary]
  rungs:
    - { rung: bureau, date: 1982, post: 地质矿产部政策法规研究室主任、党组成员, cite: b02-gov-2008-03-16-wen-resume }
    - { rung: vice, date: 1983, post: 地质矿产部副部长, cite: b02-gov-2008-03-16-wen-resume }
    - { rung: minister, date: 1986, post: 中央办公厅主任, cite: b02-gov-2008-03-16-wen-resume }
    - { rung: pb, date: 1997, post: 中央政治局委员、中央书记处书记, cite: b02-gov-2008-03-16-wen-resume }
    - { rung: psc, date: 2002-11, post: 中央政治局常委、国务院副总理, cite: b02-gov-2008-03-16-wen-resume }
  turns:
    - date: 1982
      h: 部里推荐副部长
      text: >-
        温家宝北京地质学院研究生毕业后在甘肃地质局做了十多年野外地质工作，1981年任甘肃省地质局副局长。光明网转载的《温家宝进京》说，1980至1984年国家计委地质局局长孙大光每年带一批年轻的司局级干部到各省调研，温家宝在1981年那一批，调研中给孙大光留下深刻印象；1982年孙大光提议由部机关职工直接推荐副部长人选，结果“不少人都推荐了时任甘肃省地矿局副局长的温家宝”。他1982年调地矿部任政策法规研究室主任，1983年任副部长。
      did: >-
        在最艰苦的野外地质岗位上干了多年，文章和总结写得扎实，被部里几个部门分别注意到，群众推荐时票数集中到了他身上。
      who: []
      cites: [b02-gov-2008-03-16-wen-resume, u02-gmw-2003-03-27-wen-to-beijing]
    - date: 1985
      h: 胡耀邦点名借调
      text: >-
        同一篇文章说，1985年中央筹备召开全国代表会议，胡耀邦点名借调了三个人参与筹备，其中之一便是地矿部的温家宝；会后他任中共中央办公厅副主任。温家宝自己回忆，1986年初他刚调任中办副主任不久，胡耀邦就让他具体负责组织去贵州、云南、广西贫困地区的考察访问。1986年他升任中办主任，1987年进入中央书记处任候补书记。
      did: >-
        从一个部委的业务副部长被借调去做中央会议的筹备，把交办的会务和考察组织好，留在了中办。
      who: [hu-yaobang]
      cites: [u02-gmw-2003-03-27-wen-to-beijing, b22-people-2010-04-15-wen-xingyi, b02-gov-2008-03-16-wen-resume]
    - date: 1989-05
      h: 三任总书记的中办主任
      text: >-
        1989年5月19日凌晨赵紫阳到天安门广场看望绝食学生，纽约时报中文网所配的新华社照片里，时任中办主任温家宝站在他身旁。赵紫阳下台后，他继续担任中办主任到1993年，1992年十四大进入政治局任候补委员，1997年成为政治局委员，1998年任分管农业和金融的副总理，2002年入常，2003年任总理。
      did: >-
        给胡耀邦、赵紫阳、江泽民三任总书记管过中办的日常事务，在1989年的政治风波后仍被留在原位。
      who: [zhao-ziyang]
      cites: [b02-nytcn-2014-06-04-june-fourth, b02-gov-2008-03-16-wen-resume]
  can:
    text: >-
      能学的是把基础工作做扎实、把文字写好：他在祁连山区做了多年区域地质调查，后来被地矿部几个部门同时推荐，理由之一是他的文章和总结写得有深度；进中办后，筹备会议、组织考察这类事务性工作也都做成了。
    cites: [u02-gmw-2003-03-27-wen-to-beijing, b22-people-2010-04-15-wen-xingyi]
  cannot:
    text: >-
      学不来的是伯乐和窗口：温家宝自己说，假如不是孙大光把他调进部里并向上推荐，他“很可能如今还在山沟沟里”；1980年代初部委选拔年轻干部的做法、胡耀邦的点名借调，以及宋平在甘肃的提携，都是个人无法安排的。
    cites: [u02-gmw-2003-03-27-wen-to-beijing, f05-zaobao-2026-03-04-song-ping]

zhou-yongkang:
  routes: [industry, technocrat, patron, law]
  rungs:
    - { rung: county, date: 1973, post: 辽河石油勘探局地球物理勘探处处长, cite: b03-bjreview-2007-10-23-zhou-resume }
    - { rung: bureau, date: 1983, post: 辽河石油勘探局局长，辽宁省盘锦市委副书记、市长, cite: b03-bjreview-2007-10-23-zhou-resume }
    - { rung: vice, date: 1985, post: 石油工业部副部长, cite: b03-bjreview-2007-10-23-zhou-resume }
    - { rung: minister, date: 1996, post: 中国石油天然气总公司总经理、党组书记, cite: b03-bjreview-2007-10-23-zhou-resume }
    - { rung: pb, date: 2002-11, post: 中央政治局委员、中央书记处书记, cite: b03-bjreview-2007-10-23-zhou-resume }
    - { rung: psc, date: 2007-10, post: 中央政治局常委, cite: b03-bjreview-2007-10-23-zhou-resume }
  turns:
    - date: 1983
      h: 辽河油田局长兼市长
      text: >-
        周永康北京石油学院物探专业毕业后从大庆油田的地质队实习员做起，1970年转到辽河石油会战，1973年任辽河石油勘探局物探处处长，1979年任副局长。1983年他任辽河石油勘探局局长，同时兼任新设立的盘锦市委副书记、市长，两年后调北京任石油工业部副部长。
      did: >-
        在一个新开发的大油田里从技术员一路干到局长，同时管油田和油田所在的城市，在40岁出头时进入部委。
      who: []
      cites: [b03-bjreview-2007-10-23-zhou-resume]
    - date: 1996
      h: 石油系统一把手
      text: >-
        1988年石油部改组为中国石油天然气总公司，他任副总经理，其间在1989至1990年兼任塔里木石油会战指挥，又兼任胜利石油管理局局长和东营市委书记；1996年升任总经理、党组书记。央广网转载的报道说，他从1967年到1998年在石油系统工作了31年，据媒体报道在系统内培植了蒋洁敏、王永春等大量“门徒”。
      did: >-
        被派去主持新油田会战、接管老油田，在行业里做到了最高职位，同时在系统内带出了一批自己的人。
      who: []
      cites: [b03-bjreview-2007-10-23-zhou-resume, b03-cnr-2015-10-15-zhou-disciples]
    - date: 1998
      h: 跳出石油进中枢
      text: >-
        1998年国务院机构改革，他离开石油系统任国土资源部部长，1999年任四川省委书记，2002年十六大进入政治局和书记处，年底接任公安部长；BBC中文说，据信这是华国锋之后首位兼任公安部长的政治局委员。2007年十七大他进入常委会，任中央政法委书记。纽约时报中文网称他是江泽民的门生，BBC中文转述的台湾《苹果日报》报道则说他仕途顺遂是因为背后有江泽民支持；另据大纪元（传闻），他是曾庆红一手提拔的。
      did: >-
        在不到五年里先后做部长、省委书记、公安部长，把行业经历换成了部委、地方和政法三种履历，最后执掌政法系统。
      who: [jiang-zemin, zeng-qinghong]
      cites: [b03-bjreview-2007-10-23-zhou-resume, b03-bbc-2015-06-11-zhou-profile, f02-nytcn-2018-10-24-meng-hongwei, b03-bbc-2014-07-30-taiwan-media, f06-epoch-2016-09-18-petroleum-gang]
  can:
    text: >-
      能学的是在一线业务上做出资历：他在辽河、塔里木、胜利几个油田都当过主官，管过会战也管过城市，这让他在石油行业有了别人难以替代的经历。
    cites: [b03-bjreview-2007-10-23-zhou-resume]
  cannot:
    text: >-
      学不来、也不该学的是靠山与圈子：多家媒体把他离开石油系统后的快速升迁归因于江泽民的支持，传闻还牵涉曾庆红；他在石油、四川、政法和秘书各条线上培植的亲信，后来连同他本人一起被清算。2015年他以受贿罪、滥用职权罪、故意泄露国家秘密罪被判处无期徒刑。
    cites: [f02-nytcn-2018-10-24-meng-hongwei, b03-bbc-2014-07-30-taiwan-media, b03-cnr-2015-10-15-zhou-disciples, e03-xinhua-2015-06-11-zhou-verdict]
  counter:
    - id: zhang-gaoli
      name: 张高丽
      text: 同样在石油系统任职多年（14年），被外界归入“石油帮”，又因在广东受江泽民赏识被视为江泽民在政治局的代表；他一路做到政治局常委后退下，没有像周永康那样被立案审判。
      cite: b05-orientaldaily-2021-11-04-zhang
    - id: jiang-jiemin
      name: 蒋洁敏
      text: 被视为周永康在石油系统培植的“门徒”中牵连最深的一位，沿着同一条石油系统的路升上来；2015年10月以受贿、巨额财产来源不明、滥用职权被判处有期徒刑十六年，因自首、积极退赃获从轻处罚。
      cite: b03-cnr-2015-10-15-zhou-disciples
  deep: true

li-changchun:
  routes: [technocrat, echelon, local, patron]
  rungs:
    - { rung: vice, date: 1985, post: 辽宁省委副书记兼沈阳市委书记, cite: b03-bjreview-2007-10-23-li-resume }
    - { rung: minister, date: 1986, post: 辽宁省委副书记、代省长, cite: b03-bjreview-2007-10-23-li-resume }
    - { rung: pb, date: 1997, post: 中央政治局委员、河南省委书记, cite: b03-bjreview-2007-10-23-li-resume }
    - { rung: psc, date: 2002-11, post: 中央政治局常委, cite: b03-bjreview-2007-10-23-li-resume }
  turns:
    - date: 1983
      h: 39岁沈阳市长
      text: >-
        李长春哈尔滨工业大学毕业后在沈阳市开关厂当了七年技术员，此后在沈阳市电器工业公司、机电工业局任职，1982年任沈阳副市长兼市经委主任。1983年他任沈阳市委书记、市长，时年39岁，1982年起为十二届中央候补委员；1986年42岁时任辽宁代省长。
      did: >-
        从工厂技术员做起，赶上干部年轻化，在一年里从副市长升为省会城市的书记兼市长。
      who: []
      cites: [b03-bjreview-2007-10-23-li-resume]
    - date: 1990
      h: 调任河南主政
      text: >-
        1990年他从辽宁调到河南任代省长，1992年任河南省委书记，1997年十五大以河南省委书记身份进入政治局，1998年转任广东省委书记，2002年十六大入常，主管宣传意识形态。路透社2007年的报道题目说，尽管河南省艾滋病疫情丑闻缠身，李长春却得以在政坛存活。
      did: >-
        先后在辽宁、河南、广东三个大省当主官，在河南出了大事之后仍然继续升迁。
      who: []
      cites: [b03-bjreview-2007-10-23-li-resume, b03-rfa-2007-10-16-li-career]
    - date: 2002-11
      h: 入常主管宣传
      text: >-
        自由亚洲电台引述路透社的说法，李长春晋升政治局常委是因为得到江泽民的提拔；西东大学教授杨力宇则说这个判断也许并不准确，“李长春好象过去跟江泽民并没有什么太大的渊源”。旅美评论家李洪宽认为他“最早是江泽民的人”，后来又很快赢得胡锦涛的信任。
      did: >-
        在两任总书记之间都站得住，接手了没有人愿意得罪人的意识形态工作。
      who: [jiang-zemin]
      cites: [b03-rfa-2007-10-16-li-career]
  can:
    text: >-
      能学的是在工厂和城市经济的一线积累管理经验：他从开关厂技术员到电器公司经理，再到主管全市经济的副市长，每一级都是做实事的岗位。
    cites: [b03-bjreview-2007-10-23-li-resume]
