      did: >-
        第二次上战场时已是团长，此后在西南的两个集团军里一级一级升到军长，再跨区当上大军区司令员。
      who: []
      cites: [b08-dw-2026-01-zhang-who, b08-people-2017-10-25-zhang-youxia-cv, b08-jamestown-2025-11-purification]
    - date: 2012-10
      h: 掌总装进军委
      text: >-
        2012年十八大前，他接替常万全任总装备部部长，十八届一中全会进入中央军委。德国之声说，总装备部掌握上万亿的武器装备采购权，长期被视为“肥缺”；李尚福落马后习近平曾下令彻查总装，“但这把火却一直没烧到也曾任总装备部长的张又侠”。2017年十九大他进入政治局，任军委副主席。
      did: >-
        从带兵的大军区司令员转去管武器采购和航天，把实战资历换成了军委里的位置。
      who: [chang-wanquan]
      cites: [b08-dw-2026-01-zhang-who, b08-people-2017-10-25-zhang-youxia-cv]
    - date: 2022-10
      h: 72岁超龄留任
      text: >-
        习近平的父亲习仲勋和张宗逊1947年在西北野战军共过事，德国之声称“习张两家可谓世交”，但两人年轻时交集不多。2022年二十大，72岁的他超龄留任军委副主席，排名第一；德国之声说他被视为推动习近平在二十大连任的主要功臣。2026年1月他与刘振立被立案审查，9月被开除党籍、军籍。
      did: >-
        在最高领导人寻求连任的关口站在他一边，换来了超龄留任；四年后，这份信任被收回。
      who: [xi-jinping, xi-zhongxun, liu-zhenli]
      cites: [b08-dw-2026-01-zhang-who, b08-mod-2026-01-24-zhang-liu-probe, b08-mod-2026-09-21-zhang-liu-expelled]
  can:
    text: >-
      能学的是实战里的担当：他两次上对越战场，带兵穿插夹击拿下阵地，以战功进入团领导班子；BBC说他是少数几位拥有实战经验的高级军官之一，这份资历在长期没有打仗的军队里格外稀缺。
    cites: [b08-dw-2026-01-zhang-who, b04-bbc-2026-01-zhang-youxia]
  cannot:
