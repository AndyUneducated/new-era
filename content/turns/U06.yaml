      text: 同为中共元老之子（刘少奇之子）、同被视为军中太子党，曾任军事科学院和总后勤部政委；美国之音说，在人们普遍估计他会进入中央军委之际，“刘源莫名其妙地退出了军界政界”，转任全国人大财经委员会副主任委员。
