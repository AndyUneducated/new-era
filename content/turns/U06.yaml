      text: >-
        1996年他任国防科工委主任，1998年4月解放军组建总装备部，他出任部长，10月增补为军委委员，同时担任载人航天工程总指挥。2002年十六大他进入政治局，与郭伯雄同任军委副主席，次年接替迟浩田任国防部长。
      did: >-
        在军队装备体制重组时接手新成立的部门，把装备、航天和对外采购几条线握在一起。
      who: []
