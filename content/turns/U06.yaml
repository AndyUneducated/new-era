  turns:
    - date: 1946
      h: 胶东战斗模范
      text: >-
        迟浩田1945年入伍。维基百科记载，1946年攻打胶县县城时他从城墙上跳下，追上并俘获三名敌兵；接下来的即墨战斗他又一口气抓了5名俘虏，战后被评为战斗模范。此后他在第27军从连队文书、指导员一路做政治工作，入朝作战，1970年任第81师政委。
      did: >-
        十几岁当兵，打仗敢往前冲，在一个军里从连队文书做到师政委，攒下了二十多年基层带兵和政工的资历。
      who: []
      cites: [b20-wiki-chi-haotian, c01-people-2013-02-26-chi-haotian]
    - date: 1976-10
      h: 接管人民日报
      text: >-
        维基百科记载，九一三事件后他调入《解放军报》社任副总编辑，1973年12月任北京军区副政委，1976年率北京军区部队参加唐山大地震救灾；同年10月“四人帮”被捕后，他兼任《人民日报》社工作组组长、第一总编辑，前后一年零二十天。1977年他任副总参谋长兼总参政治部主任。
      did: >-
        在政局剧变的关口被派去接管党报，把舆论阵地交到新领导层手里，随后进入总部。
      who: []
      cites: [b20-wiki-chi-haotian, c01-people-2013-02-26-chi-haotian]
    - date: 1989-05
      h: 北京戒严副指挥
      text: >-
        1987年他任总参谋长，次年进入中央军委。维基百科称，1989年5月戒严部队进驻北京，在刘华清任总指挥、迟浩田任副指挥的指挥下进行了清场。1993年他任国务委员兼国防部长，1995年增补为军委副主席，1997年进入政治局；1996年访美时他在美国国防大学说，天安门广场上没有一个人丧生。
      did: >-
        在1989年的戒严中担任前线指挥之一，此后近十五年一直在军队最高层。
      who: []
      cites: [b20-wiki-chi-haotian, c01-people-2013-02-26-chi-haotian, b20-latimes-1996-12-27-tiananmen]
  can:
    text: >-
      能学的是关键时刻派得出去：从入朝作战、唐山救灾到接管报社，他每一次都是被组织派去完成急难任务的人，此前又在同一个军里扎实做了二十多年政治工作。
    cites: [c01-people-2013-02-26-chi-haotian, b20-wiki-chi-haotian]
  cannot:
    text: >-
      学不来的是时代：他的上升紧跟文革结束、粉碎“四人帮”和1989年这几个政治关口，在关口上站在胜出的一方，换来此后二十年的重用。这类机会可遇不可求，而他在1989年的角色至今仍被外界追问。
