  rungs:
    - { rung: county, date: 1993-01, post: 菏泽市曹县县委常委、宣传部部长, cite: u07-thepaper-2024-10-28-wang-hao-cv }
    - { rung: bureau, date: 2003-04, post: 菏泽市委常委、牡丹区委书记, cite: u07-thepaper-2024-10-28-wang-hao-cv }
