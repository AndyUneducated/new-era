    - { rung: minister, date: 2021-09, post: 浙江省代省长, cite: u07-thepaper-2024-10-28-wang-hao-cv }
  turns:
    - date: 2003-04
      h: 菏泽一路做上来
      text: >-
        王浩是山东单县人，省委党校在职大学学历。1993年起他在家乡菏泽任曹县县委常委、宣传部长，菏泽地区体委主任，县级菏泽市市长，牡丹区委书记，2003年4月任菏泽市委常委。2012年9月他调任山东省委副秘书长、省信访局长，2014年任省民政厅长，2015年任淄博市委书记。
      did: >-
        在一个地区从县里的宣传部长做起，二十年里把县、市、区的岗位轮了一遍，再到省里管信访和民政。
      who: []
      cites: [u07-thepaper-2024-10-28-wang-hao-cv]
    - date: 2017-06
      h: 三省地市一把手
      text: >-
        2017年6月他任山东省委常委、烟台市委书记，12月跨省任河北省委常委、唐山市委书记，2019年8月任陕西省委常委、西安市委书记，2021年9月任浙江代省长，2024年10月接替易炼红任浙江省委书记。
      did: >-
        四年里在三个省当了三个大城市的书记，然后去第四个省当省长、书记。
      who: []
      cites: [u07-thepaper-2024-10-28-wang-hao-cv, c03-xinhua-2024-10-28-zhejiang-secretary]
  can:
    text: >-
      能学的是在基层各类岗位都待过：宣传、体育、信访、民政、县市区一把手，到省里任职前已在一个地区干了近二十年。
    cites: [u07-thepaper-2024-10-28-wang-hao-cv]
  cannot:
    text: >-
      学不来的是2017年后的跨省调动：一个地级市书记接连被派到三个省，这样的安排取决于上面对干部交流的整体部署。
    cites: [u07-thepaper-2024-10-28-wang-hao-cv]
  counter:
    - id: yi-lianhong
      name: 易炼红
      text: 王浩在浙江省委书记任上的前任，2024年10月卸任，后任全国人大财政经济委员会副主任委员，2026年2月被查。
      cite: c03-ccdi-2026-02-10-yi-lianhong-probe

