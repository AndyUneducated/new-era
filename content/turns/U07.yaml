# U07: 上位之路 for the sitting provincial party secretaries (round 13). Fields: src/data/schema.ts TurnRecordSchema; howto-content.md §12.
xu-lin:
  routes: [patron, media, local]
  rungs:
    - { rung: vice, date: 2007-05, post: 上海市委常委、市农委主任, cite: u07-xinhua-2022-12-09-xu-lin-cv }
    - { rung: minister, date: 2016-06, post: 中央宣传部副部长、中央网信办（国家网信办）主任, cite: u07-xinhua-2022-12-09-xu-lin-cv }
  turns:
    - date: 2007-05
      h: 进上海市委常委
      text: >-
        徐麟毕业于上海师范大学，在上海南汇县当过中学教师，BBC说他有多年基层工作经验，还作为援藏干部担任过西藏日喀则地委副书记；后任上海农工商集团董事长、市民政局长。2007年3月习近平调任上海市委书记，5月主持新一届市委班子选举，联合早报说徐麟由此“迎来他仕途上的一次重要升迁”，出任市委常委、跻身副部级。新班子集体亮相时，习近平介绍他：“他是领导班子里面最年轻的一位，他也曾经在西藏工作。”
      did: >-
        在郊县教过书、援过藏，又在国企和市政府部门当过一把手，43岁进了上海市委常委会，被新来的市委书记当众点名介绍。
      who: [xi-jinping]
      cites: [u07-zaobao-2016-06-30-xu-lin, u07-bbc-2016-06-29-xu-lin, u07-xinhua-2022-12-09-xu-lin-cv]
    - date: 2015-06
      h: 进京接手网信办
      text: >-
        此后他以市委常委身份任浦东新区区委书记、上海市委宣传部长。2015年6月进京任国家网信办排名第一的副主任，2016年6月接替鲁炜任中央网信办主任。联合早报指出，中央网信领导小组的组长就是习近平，网信办主任兼任领导小组办公室主任，“可直接向习近平汇报工作”；同月中央巡视组刚公布对中宣部的巡视结果，对中宣部提出严厉批评。BBC说，中国媒体评论他从副主任升到主任只用了一年时间。
      did: >-
        从地方的宣传部长调到中央管网络的部门当副手，一年后接替被调离的一把手。
      who: []
      cites: [u07-zaobao-2016-06-30-xu-lin, u07-bbc-2016-06-29-xu-lin, u07-xinhua-2022-12-09-xu-lin-cv]
    - date: 2022-12
      h: 宣传系统外放
      text: >-
        2018年8月他改任中宣部副部长、国务院新闻办主任，2022年5月任国家广播电视总局局长，同年12月出任贵州省委书记，这是他第一次到外省主政。
      did: >-
        在中央宣传系统连换三个岗位后，第一次去外省当一把手。
      who: []
      cites: [u07-xinhua-2022-12-09-xu-lin-cv]
  can:
    text: >-
      能学的是在不同口子都干过：郊县基层、援藏、国企、民政、农业、浦东、宣传，到中央管网络宣传之前，地方上的主要条线他差不多都碰过。
    cites: [u07-zaobao-2016-06-30-xu-lin, u07-xinhua-2022-12-09-xu-lin-cv]
  cannot:
    text: >-
      学不来的是2007年上海换书记的时间点。联合早报和BBC都把他升任市委常委写成习近平到上海后的第一批人事；他后来执掌的网信办，主任可直接向习近平汇报。被谁看到、在什么时候被看到，不是个人能安排的。
    cites: [u07-zaobao-2016-06-30-xu-lin, u07-bbc-2016-06-29-xu-lin]
  counter:
    - id: lu-wei
      name: 鲁炜
      text: 徐麟的前任网信办主任，同在宣传系统、同样直接向网信领导小组汇报。2016年6月被徐麟接替，只剩中宣部副部长头衔；2017年11月落马，2019年以受贿罪被判有期徒刑十四年。
      cite: c03-xinhua-2019-03-26-lu-wei-verdict
  deep: true

chen-gang-1965:
  routes: [technocrat, local]
  rungs:
    - { rung: vice, date: 2012-07, post: 北京市委常委, cite: u07-xinhua-2017-06-22-chen-gang-xiongan }
    - { rung: minister, date: 2020-12, post: 全国总工会党组书记, cite: p03-xinhua-2023-01-03-chen-gang-qinghai }
  turns:
    - date: 2013-07
      h: 去贵阳押注大数据
      text: >-
        陈刚是北京大学化学博士，做过北京玻璃研究所副所长、北京一轻集团副总经理、北京市外经贸委副主任，2003年1月起任朝阳区代区长、区长、区委书记，2012年7月任北京市委常委。2013年6月他调任贵州省委常委，7月任贵阳市委书记。中央网信办网站转载的《网络传播》专访说，他2012年在北京分管中关村时开始关注大数据；到贵阳后，贵阳在2013年把发展大数据产业作为经济体制转型的主攻方向，几年间拿下全国第一个大数据交易所、第一个公共免费WiFi全覆盖城市等多个“全国第一”，给自己的新定位是“大数据之都”。他在专访里说：“我们是笨鸟，但我们先飞了。”又说先行先试“最适合在欠发达地区、不敏感地区来做，因为这些地区有一定的容错空间”。
      did: >-
        带着在北京管科技园区时的积累，到一个欠发达省会押注一个当时还没人做的新产业，把它做成城市的名片。
      who: []
      cites: [u07-cac-2016-08-03-chen-gang-bigdata, u07-xinhua-2017-06-22-chen-gang-xiongan]
    - date: 2017-05
      h: 雄安首任负责人
      text: >-
        2017年5月，陈刚调任河北省委常委、雄安新区临时党委书记，次月任雄安新区党工委书记、管委会主任，此后兼任河北副省长，又升任河北省委副书记，继续兼管雄安。
      did: >-
        被派去一片白地上从零起步建一座新城，当第一任负责人。
      who: []
      cites: [u07-xinhua-2017-06-22-chen-gang-xiongan, p03-xinhua-2023-01-03-chen-gang-qinghai]
    - date: 2020-12
      h: 转全总再主政
      text: >-
        2020年12月他任全国总工会党组书记，2021年2月任全总副主席、书记处第一书记。新华社2024年12月的任职消息说他2022年12月任青海省委书记；另说为2023年1月，新华社2023年1月3日才发布“陈刚同志任青海省委委员、常委、书记”的消息，当天青海召开领导干部会议宣布（p03-xinhua-2023-01-03-chen-gang-qinghai）。2024年12月他调任广西壮族自治区党委书记。
      did: >-
        在群团组织当了两年一把手，再去西部省份当省委书记，两年后转到另一个边疆自治区。
      who: []
      cites: [u07-rmzxw-2025-01-02-chen-gang, p03-xinhua-2023-01-03-chen-gang-qinghai]
  can:
    text: >-
      能学的是提早看准一个新领域，再到合适的地方去试。专访里说他在北京分管中关村时就关注大数据，到贵阳后又把欠发达地区“有一定的容错空间”当作先行先试的理由。
    cites: [u07-cac-2016-08-03-chen-gang-bigdata]
  cannot:
    text: >-
      学不来的是雄安这样的机会：一个国家级新区的第一任负责人只有一个，新区何时设立、需要什么样的人，都不是个人能安排的。
    cites: [u07-xinhua-2017-06-22-chen-gang-xiongan]
  counter:
    - id: chen-gang-beijing
      name: 陈刚（1966年生）
      text: 同名、同一时期在北京任职的另一位陈刚，做过北京市规划委主任、副市长，也当过北京市委常委，后任中国科协书记处书记。法院认定他2003年至2018年利用这些职务受贿1.28亿余元，2021年被判有期徒刑十五年。
      cite: k04-court-2021-02-05-chen-gang-verdict
  deep: true

zhao-yide:
  routes: [youth, patron, local]
  rungs:
    - { rung: county, date: 1996-11, post: 共青团浙江省委组织部部长, cite: u07-sxworker-2022-11-27-zhao-yide-cv }
    - { rung: bureau, date: 2000-07, post: 共青团浙江省委副书记, cite: u07-sxworker-2022-11-27-zhao-yide-cv }
    - { rung: vice, date: 2012-06, post: 浙江省委常委、秘书长, cite: u07-sxworker-2022-11-27-zhao-yide-cv }
    - { rung: minister, date: 2020-08, post: 陕西省代省长, cite: p02-xinhua-2020-08-02-zhao-yide-acting }
  turns:
    - date: 2003-12
      h: 团省委书记
      text: >-
        赵一德读的是台州农校，从温岭县的区公所干事做起，当过团县委书记和三个镇的党委书记，1994年进共青团浙江省委，2003年12月任团省委书记，2006年11月调任温州市委副书记（正厅级）。大纪元把他列入习近平主政浙江时期部下组成的所谓“之江新军”。
      did: >-
        在共青团系统一级一级做上来，团省委一把手的几年正赶上老上级在浙江主政。
      who: [xi-jinping]
      cites: [u07-sxworker-2022-11-27-zhao-yide-cv, f07-epoch-2020-08-02-zhao-yide]
    - date: 2012-05
      h: 回省委当秘书长
      text: >-
        2008年他任温州市长，2011年9月任衢州市委书记；不到一年，2012年5月调回省里任浙江省委秘书长，6月进入省委常委会，2015年9月任杭州市委书记。
      did: >-
        地级市一把手只当了八个月，就被调回省委当总管，三年后去省会当书记。
      who: []
      cites: [u07-sxworker-2022-11-27-zhao-yide-cv, u07-chinanews-2022-11-28-youngest-sec]
    - date: 2020-08
      h: 两度最年轻
      text: >-
        2018年3月他跨省任河北省委副书记，2020年8月任陕西代省长。中新网说，55岁的他是当时31个省份中最年轻的省级政府一把手；2022年11月他接替已任政治局委员的刘国中任陕西省委书记，又成为当时最年轻的省级党委一把手。
      did: >-
        在浙江干了几十年后去北方两个省历练，前任升迁时顺位接班。
      who: []
      cites: [u07-chinanews-2022-11-28-youngest-sec, u07-sxworker-2022-11-27-zhao-yide-cv]
  can:
    text: >-
      能学的是基层和综合岗位都做扎实：乡镇党委书记、团县委书记、地市主官、省委秘书长，每一级都有实际的位置可以评价。
    cites: [u07-sxworker-2022-11-27-zhao-yide-cv]
  cannot:
    text: >-
      学不来的是团省委书记任期和习近平主政浙江的重合。境外媒体把他归入“之江新军”，看重的就是这层交集；法广对这个说法的解释是习近平在浙江期间的旧部。
    cites: [f07-epoch-2020-08-02-zhao-yide, f05-rfi-2015-01-08-chen-shiju, u07-sxworker-2022-11-27-zhao-yide-cv]
  counter:
    - id: zhou-jiangyong
      name: 周江勇
      text: 同样在浙江本地一路做到浙江省委常委、杭州市委书记，2021年8月在杭州市委书记任上落马，2023年以受贿罪被判死缓。
      cite: c03-xinhua-2023-07-25-zhou-jiangyong-verdict
    - id: tang-yijun
      name: 唐一军
      text: 和赵一德一起被大纪元列入“之江新军”的浙江干部，做过宁波市委书记，后任辽宁省长、司法部长。法院认定他2006年至2022年受贿1.37亿余元，2026年2月一审被判无期徒刑。
      cite: f07-court-2026-02-02-tang-yijun
  deep: true

chen-xiaojiang:
  routes: [ccdi, media, technocrat]
  turns:
    - date: 2015-08
      h: 从黄委到中纪委
      text: >-
        陈小江学电力出身，从中国电力报、中国水利报做起，1993年任中国水利报社总编辑，后任水利部直属机关党委常务副书记、办公厅主任，2011年3月任黄河水利委员会主任。2015年8月他调任中央纪委宣传部部长，2016年5月任辽宁省委常委、省纪委书记。联合早报称2015年他的“官场轨迹出现转折”，次年空降辽宁，处理了轰动一时的“辽宁贿选案”，2017年返京任中央纪委副书记、国家监委副主任。早报说调任中纪委宣传部长让他晋升副部级；另说他2011年任黄委主任时已晋升副部级（k06-wiki-chen-xiaojiang）。
      did: >-
        在一个部委系统做了二十多年报纸和机关党务，被调去纪委管宣传，再被派到刚出过大案的省份当纪委书记。
      who: []
      cites: [u07-ce-2016-05-10-chen-xiaojiang-cv, u07-zaobao-2020-12-16-chen-xiaojiang, u07-zaobao-2020-12-28-chen-xiaojiang, k06-wiki-chen-xiaojiang]
    - date: 2020-12
      h: 首位汉族民委主任
      text: >-
        2020年12月他接替65岁的巴特尔任国家民委主任，财新说这是“自1954年以来，国家民委主任首次由汉族官员担任”，他履新前是中央纪委排名最末的副书记，此次跻身正部级。联合早报指出，他的仕途经历此前“几乎从未涉猎民族事务”，并引述学者唐任伍的分析，“陈小江中纪委的背景更有利于中共领导主管国家民委”；早报另一篇报道引述分析说，由中纪委高官接掌民委，“接管及拨乱反正的意味浓厚”。
      did: >-
        一个没做过民族工作的纪检干部被派去管民族事务的部门，上面看重的是他的纪检背景。
      who: []
      cites: [u07-caixin-2020-12-14-chen-xiaojiang, u07-zaobao-2020-12-28-chen-xiaojiang, u07-zaobao-2020-12-16-chen-xiaojiang]
    - date: 2025-07
      h: 接掌新疆
      text: >-
        2022年1月他任中央统战部分管日常工作的副部长，2025年7月接替马兴瑞任新疆维吾尔自治区党委书记，新华社称马兴瑞“将另有任用”。
      did: >-
        在统战和民族工作的中央部门干了四年多，被派到民族问题最受关注的边疆地区当一把手。
      who: []
      cites: [b08-xinhua-2025-07-01-ma-leaves-xinjiang]
  can:
    text: >-
      能学的是把机关里的综合工作做扎实：报纸、机关党务、办公厅、宣传，换到别的系统也用得上。早报引述的学者认为，正是纪检背景让他被派去民委。
    cites: [u07-ce-2016-05-10-chen-xiaojiang-cv, u07-zaobao-2020-12-28-chen-xiaojiang]
  cannot:
    text: >-
      学不来的是政策转向时的人选需要。财新和联合早报都把汉族官员主管民委同当时民族政策的调整联系起来，这样的岗位只在特定的时点出现。
    cites: [u07-caixin-2020-12-14-chen-xiaojiang, u07-zaobao-2020-12-16-chen-xiaojiang]
  counter:
    - id: ma-xingrui
      name: 马兴瑞
      text: 陈小江在新疆的前任、政治局委员，2025年7月卸任时新华社称其“将另有任用”，2026年7月被开除党籍、开除公职，涉嫌受贿犯罪移送检察机关。
      cite: b04-xinhua-2026-07-14-ma-xingrui
  deep: true

guan-zhiou:
  routes: [local, technocrat]
  rungs:
    - { rung: vice, date: 2016-12, post: 辽宁省委常委、省总工会主席候选人, cite: u07-ce-2025-01-07-guan-zhiou-cv }
    - { rung: minister, date: 2024-12, post: 自然资源部党组书记、部长, cite: u07-ce-2025-01-07-guan-zhiou-cv }
  turns:
    - date: 2016-12
      h: 沈阳干部进省委
      text: >-
        关志鸥是辽宁沈阳人，理学博士，长期在沈阳任职：做过市计委处长、农业高新区管委会副主任、外经贸局长，法库县长、县委书记，市规划和国土资源局长，2013年1月任沈阳副市长。2015年7月他任辽宁省农委主任，2016年1月任省政府秘书长，同年12月进入辽宁省委常委会，次月任省总工会主席，当时47岁。
      did: >-
        在一个城市的计委、开发区、县、国土局都干过，上到省里后一年半换了三个岗位，从农委主任做到省委常委。
      who: []
      cites: [u07-ce-2025-01-07-guan-zhiou-cv]
    - date: 2018-03
      h: 跨省管宣传
      text: >-
        2018年3月他跨省任山东省委常委，4月任宣传部长兼省委教育工委书记；2020年5月进京任自然资源部党组成员、国家林业和草原局局长。
      did: >-
        换了一个省、换了一条线管宣传和教育，两年后又转到中央部委管林业。
      who: []
      cites: [u07-ce-2025-01-07-guan-zhiou-cv]
    - date: 2024-12
      h: 最年轻一把手
      text: >-
        2024年12月他任自然资源部部长，财新称他“曾是国务院组成部门最年轻一把手”。2026年5月他接替王忠林任湖北省委书记，财新说这是2026年省级党委书记的首次调整。
      did: >-
        在部长位置上不到一年半，又被派回地方当省委书记。
      who: []
      cites: [u07-caixin-2026-05-30-guan-zhiou, u07-xinhua-2026-05-30-guan-zhiou, u07-ce-2025-01-07-guan-zhiou-cv]
  can:
    text: >-
      能学的是在同一座城市把不同类型的岗位轮一遍：计划、开发区、外贸、县、国土，到省里时已经有完整的地方工作经历。
    cites: [u07-ce-2025-01-07-guan-zhiou-cv]
  cannot:
