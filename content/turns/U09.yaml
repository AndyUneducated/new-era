        2020年6月30日，58岁的他回到审计署，接替到龄退休的胡泽君任审计长。2022年11月，联合国审计委员会决定自2023年1月1日起由他担任主席，任期2年。
      did: >-
        离开七年后回到老单位当一把手，还当上了联合国审计委员会主席。
      who: [hu-zejun]
      cites: [u09-people-2020-07-01-hou-kai, k06-wiki-hou-kai, u09-audit-2022-11-29-hou-kai-un]
  can:
    text: >-
      能学的是专业深耕：审计和纪检都是查问题的工作，他把查账的经验带到了查人上。
    cites: [u09-people-2020-07-01-hou-kai]
  cannot:
    text: >-
      学不来的是从部委副职直接跨到直辖市常委的机会，这要靠组织上的安排。
    cites: [u09-people-2020-07-01-hou-kai]

