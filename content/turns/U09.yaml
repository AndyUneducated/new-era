# 上位之路 U09：三位学者，及国务院组成部门、中央和国家机关现任一把手（不含政治局委员）。字段见 src/data/schema.ts 的 TurnRecordSchema。
yu-keping:
  routes: [scholar]
  rungs:
    - { rung: vice, date: 2001, post: 中共中央编译局副局长, cite: i09-zhwiki-yu-keping }
  turns:
    - date: 1985
      h: 第一代政治学博士
      text: >-
        俞可平1959年生于浙江诸暨农村，刚满17岁就在生产队干体力活挣工分。1981年他从绍兴师范专科学校毕业，1982年考取厦门大学哲学系硕士研究生，1985年考入北京大学国际政治系，师从赵宝煦。财新称他由此“成为中国自己培养的第一代政治学博士”。1987年毕业后他先在北大任教，不久调入中共中央编译局。
      did: >-
        从农村、师专一路考上去，赶上国内政治学恢复后的第一批博士，这个学历成了进入中央理论机关的门票。
      who: []
      cites: [i09-zhwiki-yu-keping, i09-caixin-2015-10-28-yu-keping]
    - date: 2006-10-23
      h: 民主是个好东西
      text: >-
        2001年起他任中央编译局副局长。2006年10月23日，《北京日报》以《关于“民主是个好东西”的辨正》为题刊出他的文章；次年初，中央党校《学习时报》以《民主是个好东西》为题刊登，人民网、新华网转载，引起国内外广泛关注。文中写道，“在人类迄今发明和推行的所有政治制度中，民主是弊端最少的一种”，同时强调“我们不照搬国外的政治模式”。美国《外交事务》的书评称他是胡锦涛的顾问。
      did: >-
        在体制内的理论岗位上，用官方能接受的方式讲一个敏感话题，一篇文章让他成了国内外都知道的名字。
      who: [hu-jintao]
      cites: [i09-zhwiki-yu-keping, i08-sina-2007-02-14-yu-keping, i09-fa-2009-05-yu-keping-review]
    - date: 2015-10-28
      h: 辞官回大学
      text: >-
        2015年10月28日，他在一场改革理论研讨会上宣布，“经多次申请，他已获批辞去中央编译局副局长一职”，转任北京大学政治学研究中心主任、讲席教授，兼任北大政府管理学院院长。2022年7月他出任深圳大学政府管理学院首任院长，深大的报道写道，他在就职讲话中表示，“比起做官来，他更愿意做事”。
      did: >-
        在副部级的位置上主动申请离开，回到大学当院长，把学者身份放在了官职前面。
      who: []
      cites: [i09-caixin-2015-10-28-yu-keping, i09-szu-2022-07-11-yu-keping]
  can:
    text: >-
      能学的是在体制允许的框架里选题、发声：他倡导“治理”“善治”“增量改革”这类既有学理、又能被官方接受的概念，还创办了中国地方政府创新奖等实际项目，让研究落到可见的成果上。
    cites: [i09-szu-2022-07-11-yu-keping]
  cannot:
    text: >-
      学不来的是时代窗口：他是国内自己培养的第一代政治学博士，进入中央编译局时这一领域人才极少；一篇谈民主的文章能由中央党校的报纸刊登、官方网站转载，这样的发表条件不是个人努力就能复制的。
    cites: [i09-caixin-2015-10-28-yu-keping, i08-sina-2007-02-14-yu-keping]
  deep: true

lin-yifu:
  routes: [scholar]
  rungs:
    - { rung: vice, date: 2013, post: 全国工商联专职副主席（副部长级）, cite: i09-zhwiki-lin-yifu }
  turns:
    - date: 1979-05-16
      h: 泅海投奔大陆
      text: >-
        林毅夫原名林正义，台湾宜兰人，1972年从台湾大学转入陆军军官学校，1978年取得政治大学企业管理硕士。1979年2月他出任金门马山连连长，维基百科称只有最优秀的基层军官才能出任这一职务。同年5月16日夜，26岁的他从金门泅海约2公里到厦门。2002年台湾方面正式通缉他；2014年案件移交司法机关后，金门高分检认定他的行为属于“继续犯”，维持通缉。
      did: >-
        放弃了在台湾军中的前途，冒着生命危险游过海峡，从此走上一条完全不同的人生路。
      who: []
      cites: [i09-zhwiki-lin-yifu, i09-voa-2002-11-19-lin-yifu-wanted, i09-rfi-2014-01-13-lin-yifu]
    - date: 1982
      h: 一次翻译的机会
      text: >-
        到大陆后他进入北京大学学习政治经济学，1982年获硕士学位。国际货币基金组织刊物的人物特写称，芝加哥大学教授舒尔茨来华时由他担任翻译，舒尔茨对这位年轻译员印象深刻，回校后为他安排了奖学金。1986年他获芝加哥大学经济学博士，又到耶鲁大学做博士后；1987年起在国务院农村发展研究中心发展研究所任副所长。
      did: >-
        一次给外国名教授当翻译的机会，让他拿到了去世界顶尖经济系读博士的奖学金。
      who: []
      cites: [i09-imf-2012-09-lin-yifu, i09-zhwiki-lin-yifu, i09-pku-scholar-lin-yifu]
    - date: 1994
      h: 创办研究中心
      text: >-
        1993年他升任北京大学教授，1994年与同事共同创办北京大学中国经济研究中心并任主任。国际货币基金组织的文章称，这个中心意在吸引在海外受教育的中国学者，在中国经济政策的形成中影响越来越大。他从第七届起长期担任全国政协委员。
      did: >-
        自己办一个研究机构，把海归经济学家聚到一起，让研究成果能直接进入政策讨论。
      who: []
      cites: [i09-imf-2012-09-lin-yifu, i09-zhwiki-lin-yifu]
    - date: 2008
      h: 执掌世行研究
      text: >-
        2008年至2012年他任世界银行首席经济学家兼负责发展经济学的高级副行长。被问到他是否是第一位来自发展中国家的世行首席经济学家时，他回答：“Not only the first from a developing country, but also [the first] to have a good understanding of developing countries.”他的发展理论强调政府扶持特定产业的作用。2016年11月他与张维迎公开辩论产业政策，澎湃新闻报道，他认为“经济发展有产业政策才能成功”，张维迎则称“产业政策是穿着马甲的计划经济”。2020年8月24日习近平主持经济社会领域专家座谈会，官方报道列出的9位发言专家中他排在第一位。
      did: >-
        在国际机构的最高研究岗位上推广自己的发展理论，回国后在政策辩论和高层座谈会上都占有一席之地。
      who: [zhang-weiying, xi-jinping]
      cites: [i09-imf-2012-09-lin-yifu, i09-zhwiki-lin-yifu, i09-thepaper-2016-11-lin-zhang-debate, i09-gov-2020-08-24-expert-symposium]
  can:
    text: >-
      能学的是抓住每一个接触一流同行的机会，并长期围绕一个核心问题——发展中国家怎样追赶——做研究、办机构、公开发声，让自己的观点在政策圈里有辨识度。
    cites: [i09-imf-2012-09-lin-yifu, i09-thepaper-2016-11-lin-zhang-debate]
  cannot:
    text: >-
      学不来的是他独一无二的经历：从台湾军官泅海而来，正赶上大陆急需懂现代经济学的人才；代价是至今仍被台湾通缉，2002年父亲去世时也没能回台奔丧。
    cites: [i09-imf-2012-09-lin-yifu, i09-rfi-2014-01-13-lin-yifu, i09-bbc-2002-06-02-lin-yifu-funeral]
  deep: true

zheng-yongnian:
  routes: [scholar]
  turns:
    - date: 1997
      h: 落脚新加坡
      text: >-
        郑永年1985年、1988年在北京大学获学士、硕士学位，留校任讲师，后赴普林斯顿大学，1995年获政治学博士，又在哈佛大学做博士后。1997年起他在新加坡国立大学东亚研究所任研究员、资深研究员，2005年转到英国诺丁汉大学中国政策研究所，2008年回到东亚研究所任所长，直到2020年。
      did: >-
        在海外研究中国的机构里从研究员做到所长，有了一个国内外都看得见的平台。
      who: []
      cites: [i09-cuhksz-iia-zheng-yongnian-en, i09-cuhksz-2024-zheng-yongnian-decade]
    - date: 2014-09-04
      h: 副主席读过五本
      text: >-
        他长期讨论“中国模式”，2010年在中新网的评论中写道，“中国模式”是客观存在的，最大的问题是如何改进。2014年9月4日，国家副主席李源潮会见“2014中国共产党与世界对话会”的与会学者时对他说，自己看过不下五本他的著作，“对中国很有借鉴”。
      did: >-
        从建设性的角度讨论中国问题，著作被国家领导人读过，并当面得到肯定。
      who: [li-yuanchao]
      cites: [i09-chinanews-2010-05-04-zheng-china-model, i09-people-2014-09-16-zheng-yongnian]
    - date: 2020
      h: 回国办智库
      text: >-
        2019年8月，他在《人民日报》“侠客岛”访谈中拿切断香港供水开玩笑，官方曾要求媒体推送，后因舆论反弹改了标题，他本人称自己的话被曲解。2020年新加坡国立大学认定，他曾在工作会议上未经同意拥抱一名下属；新加坡警方当年4月已对他发出严厉警告，校方因他已离职，只把结果记入员工档案。同年他回国，在香港中文大学（深圳）创办前海国际事务研究院，8月24日在习近平主持的经济社会领域专家座谈会上发言，2024年任该校公共政策学院创始院长。学校的报道称，研究院许多政策建议报告“被国家领导层审阅和采纳”。
      did: >-
        离开新加坡回到国内办智库，直接给决策层写报告，从海外评论者变成了体制内的政策顾问。
      who: [xi-jinping]
      cites: [i09-cdt-2019-08-29-zheng-water, i09-straitstimes-2020-11-17-zheng-nus, i09-gov-2020-08-24-expert-symposium, i09-cuhksz-2024-zheng-yongnian-decade]
  can:
    text: >-
      能学的是把学术研究和政策建议结合起来，并持续面向公众写作，让自己的观点被决策者看到。
    cites: [i09-people-2014-09-16-zheng-yongnian, i09-cuhksz-2024-zheng-yongnian-decade]
  cannot:
    text: >-
      学不来的是北大和普林斯顿的学术起点，以及在海外长期主持一家研究中国的知名机构所积累的名声。
    cites: [i09-cuhksz-iia-zheng-yongnian-en]

chen-yixin:
  routes: [writer, patron, law]
  rungs:
    - { rung: county, date: 1994-12, post: 浙江省委办公厅调研写作处正处级副处长, cite: c05-people-2018-04-03-chen-yixin }
    - { rung: bureau, date: 2000-06, post: 浙江省委办公厅副主任, cite: c05-people-2018-04-03-chen-yixin }
    - { rung: vice, date: 2014-12, post: 浙江省委常委、温州市委书记, cite: c05-people-2018-04-03-chen-yixin }
    - { rung: minister, date: 2022-10, post: 国家安全部部长, cite: c05-gov-2022-10-30-chen-yixin }
  turns:
    - date: 1992-12
      h: 进省委写材料
      text: >-
        陈一新1976年在浙江云和当知青，读完丽水师专后留校，1984年进入丽水地委办公室当秘书。1992年12月他调入浙江省委办公厅调研写作处，此后在省委办公厅和省委副秘书长岗位上干了十几年，2006年6月起兼任省委政策研究室主任。美国之音称，他在省委办公厅任内与张德江、习近平、赵洪祝三任省委书记都有交集，兼任政研室主任期间“直接为习近平服务，与后来大权独揽的习近平建立了紧密关系”。
      did: >-
        从地委秘书做到省委的笔杆子，长期给省委书记起草文稿、做调研，和主要领导天天打交道。
      who: [zhang-dejiang, xi-jinping, zhao-hongzhu]
      cites: [c05-people-2018-04-03-chen-yixin, c05-voa-2022-10-29-chen-yixin]
    - date: 2015-11
      h: 进京再赴武汉
      text: >-
        2011年12月他第一次主政地方，任金华市委书记，2013年6月转任温州市委书记，2014年12月进入浙江省委常委会。2015年11月他调任中央全面深化改革领导小组办公室专职副主任，一年后出任湖北省委副书记、武汉市委书记。
      did: >-
        在两个地级市补上主政经历后，先进中央改革办，再被派到中部大城市当一把手。
      who: []
      cites: [c05-people-2018-04-03-chen-yixin]
    - date: 2020-02-08
      h: 一新回来了
      text: >-
        2018年3月他回京任中央政法委秘书长。2020年2月8日新冠疫情暴发期间，他被派回武汉任中央指导组副组长。澎湃新闻报道，他在武汉各区党政主官的微信工作群里写道：“大家好，我是陈一新。党中央决定：我担任中央指导组副组长，又能与你们一同战斗了！”“一新回来了”的消息随即登上微博热搜。BBC中文报道称，他也曾在习近平主政浙江期间在其手下工作。
      did: >-
        在危机最重的时候被派回自己熟悉的城市，靠着对当地干部的了解迅速打开局面。
      who: [xi-jinping]
      cites: [c05-people-2018-04-03-chen-yixin, u09-thepaper-2020-02-chen-yixin, u09-bbc-2020-02-13-hubei]
    - date: 2020-07
      h: 主持政法整顿
      text: >-
        2020年7月起，他以全国政法队伍教育整顿试点办公室主任的身份，要求在全国政法系统开展一次“刮骨疗毒式的自我革命”。此前的2020年4月，公安部原副部长孙力军已接受审查；2021年10月，司法部原部长傅政华接受审查，中央纪委后来通报称他“参加孙力军政治团伙”。2022年10月二十大后，他接替进入政治局的陈文清，出任国家安全部部长。
      did: >-
        主持政法系统的整风，在清理内部的过程中掌握主导权，随后接手国家安全部。
      who: [sun-lijun, fu-zhenghua, chen-wenqing]
      cites: [u09-ahjcy-2020-07-zhengfa, c03-ccdi-2020-04-19-sun-lijun-probe, c03-ccdi-2022-03-31-fu-zhenghua-expel, c05-voa-2022-10-29-chen-yixin, c05-gov-2022-10-30-chen-yixin]
  can:
    text: >-
      能学的是写作和调研的硬功夫：从地委秘书到省委政研室主任，他靠给主要领导起草文稿、做调研一步步上来，后来又在金华、温州补上了主政经历。
    cites: [c05-people-2018-04-03-chen-yixin]
  cannot:
    text: >-
      学不来的是与最高领导人的长期工作关系：外媒普遍把他看作习近平的浙江旧部，他从地方到中央的每一步，几乎都与这层关系一起被解读。
    cites: [c05-voa-2022-10-29-chen-yixin, f02-zaobao-2022-10-31-chen-yixin]
  counter:
    - id: fu-zhenghua
      name: 傅政华
      text: 同在政法系统身居要职，曾任司法部长；2021年10月接受审查，2022年3月被开除党籍和公职，中央纪委通报称他“政治野心极度膨胀”，“参加孙力军政治团伙”。
      cite: c03-ccdi-2022-03-31-fu-zhenghua-expel
    - id: sun-lijun
      name: 孙力军
      text: 公安部原副部长、政法系统的实权人物；2020年4月接受审查，2021年9月被开除党籍和公职，移送审查起诉。
      cite: c03-ccdi-2021-09-30-sun-lijun-expel
  deep: true

ying-yong:
  routes: [law, crisis, patron, comeback]
  rungs:
    - { rung: county, date: 1983-11, post: 浙江省台州地区行署公安处副处长, cite: c05-cctv-2020-02-13-ying-yong }
