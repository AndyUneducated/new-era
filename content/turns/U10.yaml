      h: 进省委管干部
      text: >-
        沈跃跃是浙江宁波人，当过副食品商店职工和中学教师，1983年起在共青团系统工作，1991年任浙江团省委书记，后任杭州市委副书记、绍兴市委书记。1998年她进入浙江省委常委班子，任组织部副部长，第二年任组织部部长。
      did: >-
        从共青团干部转到地方任职，再进入省委常委班子主管干部工作。
      who: []
      cites: [f05-people-2013-03-18-shen-yueyue]
    - date: 2002
      h: 调中组部
      text: >-
        2001年她任安徽省委副书记，一年后调任中央组织部副部长，并兼任人事部副部长。2007年她任中央组织部主持常务工作的副部长（正部长级），在这个位置上做了六年。
      did: >-
        进入中央管干部的部门，做到主持日常工作的副部长。
      who: []
      cites: [f05-people-2013-03-18-shen-yueyue]
    - date: 2013
      h: 转任副委员长
      text: >-
        2013年她当选十二届全国人大常委会副委员长，同时任全国妇联主席。
      did: >-
        离开组织部门，成为国家领导人，主管妇女工作。
      who: []
      cites: [f05-people-2013-03-18-shen-yueyue]
  can:
    text: >-
      能看到的是组织部门内部的晋升：她在省委组织部当过副部长、部长，到中央组织部又从副部长做到主持常务工作，前后在组织系统工作了十几年。
    cites: [f05-people-2013-03-18-shen-yueyue]
  cannot:
    text: >-
      官方简历只列出职务，没有说明她从浙江调往安徽、再调入中组部的原因。
    cites: [f05-people-2013-03-18-shen-yueyue]

