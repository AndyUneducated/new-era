# 上位之路 · 批次 U04。字段见 src/data/schema.ts 的 TurnRecordSchema 和 research/howto-content.md §12。
li-yuanchao:
  routes: [youth, princeling, patron]
  rungs:
    - { rung: bureau, date: 1983, post: 共青团上海市委副书记、书记, cite: b09-gov-2013-03-14-li-yuanchao-cv }
    - { rung: vice, date: 1983, post: 共青团中央书记处书记, cite: b09-gov-2013-03-14-li-yuanchao-cv }
    - { rung: minister, date: 2002, post: 江苏省委书记, cite: b09-gov-2013-03-14-li-yuanchao-cv }
    - { rung: pb, date: 2007-10, post: 中央政治局委员, cite: b09-gov-2013-03-14-li-yuanchao-cv }
  turns:
    - date: 1983
      h: 一年连跳进团中央
      text: >-
        1983年，李源潮从复旦大学团委副书记先升为团上海市委副书记、书记，同一年又进入共青团中央书记处。《联合早报》说，当时正值胡耀邦任总书记，团系干部前途光明，他“以火箭般的速度杀入团中央”，等于进入了接班人梯队。香港《文汇报》说，他在团中央直接在时任团中央常务书记、第一书记的胡锦涛领导下工作。
      did: >-
        在学校团委把青年工作做出了名堂，正赶上中央大批提拔年轻干部、团系干部吃香的年份，一年之内连升几级，进了团中央的领导班子。
      who: [hu-yaobang, hu-jintao]
      cites: [b09-gov-2013-03-14-li-yuanchao-cv, b09-zaobao-2017-10-28-li-yuanchao, u04-wenweipo-2007-10-27-li-org]
    - date: 2000
      h: 北京十年后外放
      text: >-
        1990年他离开共青团，转到中央对外宣传小组任一局局长，1993年任外宣办、国务院新闻办副主任，1996年任文化部副部长。香港《太阳报》说，他和刘奇葆一样在北京有过工作“发霉”的日子，胡锦涛掌权后把他们外放地方，才一路顺风顺水；不过按官方简历，他2000年就回家乡任江苏省委副书记，早于胡锦涛2002年接任总书记。他次年兼南京市委书记，2002年任江苏省委书记。
      did: >-
        在中央部委当了十年副职，缺的是地方主政经历；回到家乡后从副书记、省会书记一级级做到省委书记，把履历补齐。
      who: []
      cites: [b09-gov-2013-03-14-li-yuanchao-cv, c02-sun-2012-11-28-liu-qibao, u04-wenweipo-2007-10-27-li-org]
    - date: 2007-10
      h: 治吏出名进中组部
      text: >-
        香港《文汇报》说，他主政江苏7年，推行富民优先战略，经历了铁本、蓝藻事件的考验；2001年几名南京官员在宁波酒后闹事，事后全部被撤职，他当上省委书记后继续以铁腕治吏的风格整肃官场，并把万人评议推广到全省。2007年十七大，他进入政治局和书记处，接替贺国强出任中组部部长。
      did: >-
        在一个省里狠抓干部作风，处理违纪官员不留情面，把“治吏”做成了自己的招牌，正好对上了组织部门需要的经验。
      who: [hu-jintao]
      cites: [u04-wenweipo-2007-10-27-li-org, b09-gov-2013-03-14-li-yuanchao-cv]
    - date: 2012-11
      h: 入常落空
      text: >-
        中央社说，十八大前李源潮是晋级政治局常委的大热门，入常可能性甚至高于汪洋，但最终落榜；他续任政治局委员，2013年任国家副主席，美国之音指出他是1998年以来第一个不是常委的国家副主席。《联合早报》说，明眼人都看出“他的政治巅峰期已经结束”。2017年十九大，67岁的他没有进入新一届中央委员会；中央社说海外流传他与已落马的令计划关系密切等说法，均未获官方证实。
      did: >-
        在离顶层最近的一步上没能跨过去，此后只剩荣誉性职务，未到年龄就退出了。
      who: [xi-jinping]
      cites: [b09-cna-2017-10-25-li-yuanchao, b09-voa-2017-10-13-19th, b09-zaobao-2017-10-28-li-yuanchao]
  can:
    text: >-
      能学的是把每段经历做成看得见的事：在团系抓青年工作、在江苏抓干部作风，都留下了具体口碑；先在中央部门、后到地方当一把手，香港《文汇报》说他的履历比较完整。
    cites: [u04-wenweipo-2007-10-27-li-org, b09-gov-2013-03-14-li-yuanchao-cv]
  cannot:
    text: >-
      学不来的是起点和窗口：他是文革前上海市副市长李干成之子，又在胡耀邦大批提拔年轻团干部的1983年进了团中央，此后的上升与胡锦涛和团派人事安排紧紧相连。这条路的风险也在这里——最高领导人更替后，团派背景从资本变成了负担，他十八大落选常委，十九大未到年龄就退出中央委员会。
    cites: [b09-rfi-2020-11-15-li-yuanchao, b09-zaobao-2017-10-28-li-yuanchao, b09-cna-2017-10-25-li-yuanchao, u04-wenweipo-2007-10-27-li-org]
  counter:
    - id: ling-jihua
      name: 令计划
      text: 同样出身共青团，在胡锦涛身边做到中办主任、书记处书记；2012年被调离中办，2016年以受贿、非法获取国家秘密、滥用职权罪被判无期徒刑。
      cite: b07-court-2016-07-04-ling-sentence
  deep: true

wang-chen:
  routes: [media, writer, base, patron]
  rungs:
    - { rung: minister, date: 2002, post: 人民日报社社长, cite: c02-gov-2017-10-25-19th-cvs }
    - { rung: pb, date: 2017-10, post: 中央政治局委员, cite: c02-xinhua-2017-10-25-19-1-plenum }
  turns:
    - date: 1969
      h: 延安插队提干
      text: >-
        1969年1月王晨到陕西延安地区宜君县插队，同年12月入党，1970年起任宜君县委宣传部、县委办公室干部，1973年调延安地委办公室。习近平同期在延安地区插队；自由亚洲电台的高新称王晨是习近平的“北京哥们”，并说习被推荐上大学时是王晨具体运作的，这一说法未见官方证实。
      did: >-
        下乡后很快因为能写被抽调到县委、地委当文字干部，并和同一批北京知青保持往来。
      who: []
      cites: [c02-gov-2017-10-25-19th-cvs, f04-rfa-2017-10-09-wang-chen]
    - date: 1995
      h: 报社里做到一把手
      text: >-
        1974年他进光明日报社当记者，读完社科院研究生院新闻系硕士后回报社，1986年任副总编辑，1995年任总编辑；2000年任中宣部副部长，2001年调人民日报社任总编辑，2002年起任社长。财新说他记者出身，在新闻界和宣传主管部门工作了三十多年。
      did: >-
        从记者干起，在报社里一级级做到总编辑和社长，一直没有离开宣传这条线。
      who: []
      cites: [c02-gov-2017-10-25-19th-cvs, b19-caixin-2019-03-20-law-society]
    - date: 2013-03
      h: 管网络到人大
      text: >-
        2008年他任中宣部副部长、国务院新闻办主任，2011年兼任首任国家网信办主任，法广称他是中国网络新闻管制的“沙皇”。2013年3月他任全国人大常委会副委员长兼秘书长，2017年进入政治局。高新评论说，习近平出任总书记后安排王岐山和王晨，一个任中纪委书记，另一个以人大副委员长身份“为习近平把关宣传、严控网络媒体”。
      did: >-
        在互联网管理刚成型的时候把这摊事管起来，随后转到人大当“大管家”，进入国家领导人行列。
      who: [xi-jinping]
      cites: [c02-gov-2017-10-25-19th-cvs, b19-rfi-2010-01-14-wang-internet, b19-gov-2011-05-04-cac, f04-rfa-2017-10-09-wang-chen]
  can:
    text: >-
      能学的是在一条专业线上深耕：记者、编辑、总编辑、主管部门负责人，每一步都在同一条线上往上走，三十多年没有换赛道。
    cites: [c02-gov-2017-10-25-19th-cvs, b19-caixin-2019-03-20-law-society]
  cannot:
    text: >-
      学不来的是与最高领导人重叠的知青岁月：高新把他在习近平上台后获重用与当年的延安交情联系在一起，这一说法未获官方证实。他67岁才进入政治局，主要岗位在人大和法学会，属于把关型而非主政型的位置。
    cites: [f04-rfa-2017-10-09-wang-chen, c02-gov-2017-10-25-19th-cvs, b19-caixin-2019-03-20-law-society]
  counter:
    - id: lu-wei
      name: 鲁炜
      text: 同样出身新闻宣传系统，曾任国家网信办主任；2017年落马，2019年以受贿罪被判有期徒刑14年。
      cite: c03-xinhua-2019-03-26-lu-wei-verdict

liu-he:
  routes: [technocrat, writer, patron]
  rungs:
    - { rung: county, date: 1988, post: 国家计委产业政策司产业结构处副处长, cite: b09-xinhua-2017-10-25-liu-he-cv }
    - { rung: bureau, date: 1994, post: 国家计委长期规划和产业政策司副司长, cite: b09-xinhua-2017-10-25-liu-he-cv }
    - { rung: vice, date: 2001, post: 国务院信息化工作办公室副主任, cite: b09-xinhua-2017-10-25-liu-he-cv }
    - { rung: pb, date: 2017-10, post: 中央政治局委员, cite: b09-xinhua-2017-10-25-liu-he-cv }
  turns:
    - date: 1987
      h: 计委里写规划
      text: >-
        1987年刘鹤从国务院发展研究中心转入国家计委，从工业综合局干部做到长期规划和产业政策司副司长，1994年至1995年在哈佛大学肯尼迪政府学院读公共管理硕士。BBC中文网说，从第八个到第十二个五年计划，他参与制定了多份长期规划。《华尔街日报》报道说，自上世纪90年代以来，他不顾想依靠计划经济的官员反对，一直敦促执行市场政策。
      did: >-
        在综合部门埋头做研究、写规划，四十多岁还出国读书，把自己练成了懂市场经济的专业干部。
      who: []
      cites: [b09-xinhua-2017-10-25-liu-he-cv, b09-bbc-2025-us-china-talks, u04-xinmin-2013-10-liu-he]
    - date: 2003
      h: 中财办十年副手
      text: >-
        2003年起刘鹤任中央财经领导小组办公室副主任，一当十年。BBC中文网说，他先后为江泽民、胡锦涛、习近平三任国家主席起草经济讲稿。《华尔街日报》说，十八大后习近平高调视察华南，刘鹤全程陪同，这次视察与1992年邓小平南巡异曲同工。
      did: >-
        在给最高层起草文件的岗位上长期当副手，领导换了三任仍被留用，靠的是文字功夫和专业判断。
      who: [xi-jinping]
      cites: [b09-xinhua-2017-10-25-liu-he-cv, b09-bbc-2025-us-china-talks, u04-xinmin-2013-10-liu-he]
    - date: 2013-05
      h: 他对我非常重要
      text: >-
        2013年3月刘鹤升任中财办主任兼国家发改委副主任。《新民周刊》转述《华尔街日报》的报道：同年5月美国国家安全顾问多尼隆访华，习近平指着身边的刘鹤说：“这是刘鹤，他对我非常重要。”多尼隆的随行人员当晚与他会面。报道说两人自上世纪60年代在北京101中学就相识，但自由亚洲电台的高新撰文反驳了这一同学说法。
      did: >-
        多年准备的改革思路正好碰上新领导人要推改革，最高领导人当着外宾的面为他背书，他从幕后副手变成了经济政策的主笔。
      who: [xi-jinping]
      cites: [b09-xinhua-2017-10-25-liu-he-cv, u04-xinmin-2013-10-liu-he, b09-rfa-2021-05-21-liu-he-xi]
    - date: 2017-10
      h: 没主政地方入局
      text: >-
        2017年十九大，刘鹤以中财办主任兼发改委副主任身份进入中央政治局，2018年3月任国务院副总理，并作为中方牵头人负责对美贸易谈判，2020年1月在白宫签署第一阶段贸易协议。BBC中文网指出，一个从未在地方政府任职的官员位列政治局并掌握经济实权，“这样的升迁轨迹颇为罕见”。
      did: >-
        没当过一天地方官，凭专业和最高领导人的信任直接进入决策层，还被推到对美谈判的最前面。
      who: [xi-jinping]
      cites: [b09-xinhua-2017-10-25-liu-he-cv, b09-bbc-2025-us-china-talks]
  can:
    text: >-
      能学的是专业深耕：三十年守在经济政策一个领域，写规划、读学位、为上级起草文稿，让自己成为离不开的人；领导换了三任，他仍被留在起草经济讲稿的位置上。
    cites: [b09-bbc-2025-us-china-talks, b09-xinhua-2017-10-25-liu-he-cv]
  cannot:
    text: >-
      学不来的是关系与时机：外媒普遍把他的分量归因于与习近平的早年交情（中学同学的说法有争议），他的关键提升都发生在习近平上台之后。不经地方历练直接进入政治局的路径极少见，离不开最高领导人的个人信任。
    cites: [u04-xinmin-2013-10-liu-he, b09-rfa-2021-05-21-liu-he-xi, b09-bbc-2025-us-china-talks]
  counter:
    - id: liu-tienan
      name: 刘铁男
      text: 同在国家计委、发改委系统成长，做到发改委副主任兼国家能源局局长；2013年落马，2014年以受贿罪被判无期徒刑。
      cite: c03-chinacourt-2014-12-10-liu-tienan-verdict
  deep: true

liu-qibao:
  routes: [youth, patron, crisis]
  rungs:
    - { rung: bureau, date: 1982, post: 共青团安徽省委副书记, cite: c02-cyol-2012-11-16-18th-cvs }
    - { rung: vice, date: 1985, post: 共青团中央书记处书记, cite: c02-cyol-2012-11-16-18th-cvs }
    - { rung: minister, date: 2006-06, post: 广西壮族自治区党委书记, cite: c02-cyol-2012-11-16-18th-cvs }
    - { rung: pb, date: 2012-11, post: 中央政治局委员, cite: c02-xinhua-2012-11-15-18-1-plenum }
  turns:
    - date: 1985-11
      h: 团省委进团中央
      text: >-
        刘奇葆早年在安徽省委宣传部、办公厅做文字工作，1980年转入共青团，1983年任团安徽省委书记，1985年11月进入团中央书记处，一干八年。台湾学者蔡文轩把他列为胡锦涛团中央时期的团派干部；香港《太阳报》称他是胡锦涛的“十八罗汉”之一。
      did: >-
        从省委的文字岗位转到共青团，在团省委书记任上被选进团中央，和同代团干部一起进了培养名单。
      who: [hu-jintao]
      cites: [c02-cyol-2012-11-16-18th-cvs, f05-sef-2012-10-tsai-fifth-gen, c02-sun-2012-11-28-liu-qibao]
    - date: 2000-09
      h: 北京副职后外放
      text: >-
        1993年他任人民日报社副总编辑，1994年至2000年任国务院副秘书长；据大纪元（传闻），这使他成为时任国务院秘书长罗干的副手。香港《太阳报》说，他和李源潮一样有过在北京工作“发霉”的日子，胡锦涛掌权后把他们外放地方，才青云直上。2000年他任广西党委副书记，2006年升书记，2007年底调任四川省委书记。
      did: >-
        在中央机关当了几年副职，然后去民族地区当副手，熬到一把手，再调到一个人口大省。
      who: [hu-jintao]
      cites: [c02-cyol-2012-11-16-18th-cvs, b19-epoch-2017-10-25-liu-out, c02-sun-2012-11-28-liu-qibao]
    - date: 2008-05
      h: 汶川重建后入局
      text: >-
        2008年5月汶川地震后，他任四川省抗震救灾指挥部指挥长；8月底到绵竹、什邡察看复课时要求“决不让一个灾区孩子因灾失学、辍学”。2012年十八大他进入政治局和书记处，出任中宣部部长，中央社说外界认为这是胡锦涛安排的结果；大纪元（传闻）则称是周永康要刘云山推荐的。
      did: >-
        在大灾之后主持一个省的抢险和重建，把局面稳住，随后被选进中央分管宣传。
      who: [hu-jintao]
      cites: [b19-sohu-2008-09-01-liu-schools, b19-cna-2017-10-25-three-exit, b19-epoch-2017-10-25-liu-out, c02-cyol-2012-11-16-18th-cvs]
  can:
    text: >-
      能学的是在高压局面下顶住：大地震后把一个省的复课和重建扛下来；也肯在中央机关和地方之间轮岗，从副手做起。
    cites: [b19-sohu-2008-09-01-liu-schools, c02-cyol-2012-11-16-18th-cvs]
  cannot:
    text: >-
      学不来的是派系窗口：香港《太阳报》把他的升迁归因于胡锦涛掌权后的外放安排，出掌中宣部也被外界视为胡锦涛的安排。这份背景在2017年变成负担，中央社认为团派背景不为习近平所喜，他64岁就退出了政治局。
    cites: [c02-sun-2012-11-28-liu-qibao, b19-cna-2017-10-25-three-exit]

zhang-chunxian:
  routes: [frontier, industry, crisis]
  rungs:
    - { rung: bureau, date: 1991, post: 监察部驻机电部监察局副局长, cite: c02-cyol-2012-11-16-18th-cvs }
    - { rung: vice, date: 1998, post: 交通部副部长, cite: c02-cyol-2012-11-16-18th-cvs }
    - { rung: minister, date: 2002-11, post: 交通部部长, cite: c02-cyol-2012-11-16-18th-cvs }
    - { rung: pb, date: 2012-11, post: 中央政治局委员, cite: c02-xinhua-2012-11-15-18-1-plenum }
  turns:
    - date: 1993
      h: 设计院到部长
      text: >-
        张春贤当兵五年后读锻压专业，1982年进机械部第十设计研究院，1985年起任院党委书记；1991年任监察部驻机电部监察局副局长，1993年任中国包装和食品机械总公司总经理，1995年任云南省长助理，1997年回交通部，1998年升副部长，2002年任部长。
      did: >-
        在工业系统从技术和计划岗位做起，到国企当一把手，又去地方挂职、回部委任职，攒下了企业、部门、地方三种经历。
      who: []
      cites: [c02-cyol-2012-11-16-18th-cvs]
    - date: 2005-12
      h: 部长转任湖南
      text: >-
        2005年12月他从交通部长转任湖南省委书记。上任三个多月时他对第一财经日报说，当交通部长时最担心车祸，现在当湖南省委书记最担心人祸；还说不喜欢新官上任烧三把火。
      did: >-
        从管一个行业转到管一个省，说话直率，摆出不搞新官“三把火”的低调姿态。
      who: []
      cites: [c02-cyol-2012-11-16-18th-cvs, b17-chinanews-2006-03-07-zhang-hunan]
    - date: 2010-04
      h: 七五之后接新疆
      text: >-
        2009年乌鲁木齐七五事件后，新疆党委书记王乐泉一直受到下台压力。2010年4月中央宣布由张春贤接任，习近平出席宣布大会。法广说他当年由周永康举荐，但习近平曾陪同他到新疆履新。BBC中文说他上任后互联网很快解封，不少网民称赞他是开明派；《联合早报》说他改推被外界称为柔性治疆的策略。2012年他进入政治局。
      did: >-
        在一场大骚乱之后接手最难的岗位，没有一味加码，而是先放开网络、抓就业和民生，给自己挣来“开明”的名声。
      who: [zhou-yongkang]
      cites: [v01-bbc-2010-04-24-wang-lequan, e02-xinhua-2010-04-24-xinjiang-secretary, f04-rfi-2016-03-09-xinjiang, b17-bbc-2016-08-29-xinjiang-change, b17-zaobao-2016-10-17-zhang-not-negated]
  can:
    text: >-
      能学的是轮岗积累：企业、部委、地方都干过；接手危机地区时，敢于用和前任不同的办法，先从民生和就业入手。
    cites: [c02-cyol-2012-11-16-18th-cvs, b17-zaobao-2016-10-17-zhang-not-negated]
  cannot:
    text: >-
      学不来、也躲不开的是政治风向：法广说他由周永康举荐，BBC中文引分析人士说他被视为江泽民派人物。2016年他被陈全国替换，《联合早报》引述的分析认为高层对柔性治疆不太满意，他转任实权不大的职务，2017年未到年龄就退出政治局。这条路的风险是：同一套治理办法，换了政治气候就会被重新评价。
    cites: [f04-rfi-2016-03-09-xinjiang, b17-bbc-2016-08-29-xinjiang-change, b17-zaobao-2016-10-17-zhang-not-negated, b19-cna-2017-10-25-three-exit]

chen-xi:
  routes: [patron, scholar]
  rungs:
    - { rung: vice, date: 2002, post: 清华大学党委书记（副部长级）, cite: b09-people-2018-04-chen-xi-cv }
    - { rung: minister, date: 2011, post: 中国科协党组书记、常务副主席, cite: b09-people-2018-04-chen-xi-cv }
    - { rung: pb, date: 2017-10, post: 中央政治局委员, cite: b09-people-2018-04-chen-xi-cv }
  turns:
    - date: 1978
      h: 同窗又同党
      text: >-
        1975年陈希以工农兵学员身份进入清华化工系，与习近平同年入学；日本国际问题研究所的报告说两人在宿舍同住一室。《联合早报》引消息说，当时任学生党支部书记的习近平是陈希1978年的入党介绍人之一。自由亚洲电台的高新据此写道，陈希与习近平之间“即是同窗，更是同党”。
      did: >-
        在同一间宿舍、同一个党支部里结下交情，毕业后各奔前程，几十年没有断了联系。
      who: [xi-jinping]
      cites: [b09-jiia-2020-01-chen-xi, b09-zaobao-2017-10-24-chen-xi, b09-rfa-2013-04-30-chen-xi]
    - date: 2002
      h: 清华里做到书记
      text: >-
        陈希毕业后读研留校，从校团委书记、学生工作部部长做到党委副书记，2002年任清华党委书记（副部长级）。习近平1998年在清华读在职博士，《联合早报》说“据称是由陈希在幕后牵线安排的”。高新则认为，到升任清华党委书记为止，陈希的提拔“与习近平一点关系都没有”。
      did: >-
        在一所大学里做了二十多年学生工作和党务，从团委一路干到党委书记，把本职做到了这个系统的顶。
      who: []
      cites: [b09-people-2018-04-chen-xi-cv, b09-zaobao-2017-10-24-chen-xi, b09-rfa-2013-04-30-chen-xi]
    - date: 2013-04
      h: 辗转后进中组部
      text: >-
        2008年离开清华后，他历任教育部副部长、辽宁省委副书记、中国科协党组书记，《联合早报》称科协是闲职。2013年4月，习近平上台不久，他调入中组部任主持常务工作的副部长；自由亚洲电台说，舆论一致认为这是习近平内举不避亲。
      did: >-
        离开熟悉的高校，到部委、地方、群团组织各走一圈，补上地方和部门经历，等来了一次关键调动。
      who: [xi-jinping]
      cites: [b09-people-2018-04-chen-xi-cv, b09-zaobao-2017-10-24-chen-xi, b09-rfa-2013-04-30-chen-xi]
    - date: 2017-10
      h: 执掌组织部
      text: >-
        2017年十九大，陈希进入政治局和书记处，出任中组部部长兼中央党校校长，主持十九大到二十大之间的干部布局。他随后在《人民日报》撰文，强调“选人用人首先要看政治素质”，把突出政治标准具体化为五条考察内容。
      did: >-
        接手全国干部的选拔，把“政治标准”写成了具体的考察条目。
      who: [xi-jinping]
      cites: [b09-people-2018-04-chen-xi-cv, b09-xinhua-2017-11-16-chen-xi-article]
  can:
    text: >-
      能学的是在一个单位里把本职做扎实、长期积累口碑，同时和老同学、老同事保持长久的联系；离开熟悉的单位后，也肯到部委、地方和群团组织去补经历。
    cites: [b09-people-2018-04-chen-xi-cv, b09-zaobao-2017-10-24-chen-xi]
  cannot:
    text: >-
      学不来的是那段同窗之谊恰好碰上同学当上总书记：陈希的关键一跳发生在习近平上台后几个月，自由亚洲电台直接称之为内举不避亲。他没有地方主政实绩，也不是组织系统出身，靠的主要是最高领导人的信任；2022年二十大他退出了中央委员会。
    cites: [b09-rfa-2013-04-30-chen-xi, b09-zaobao-2017-10-24-chen-xi, b09-rfa-2022-10-22-20th-cc]
  counter:
    - id: li-yuanchao
      name: 李源潮
      text: 上一任执掌中组部五年的政治局委员，背后是胡锦涛和团派；最高领导人更替后十八大落选常委，十九大未到年龄就没有进入中央委员会。
      cite: b09-zaobao-2017-10-28-li-yuanchao
  deep: true

wang-yi:
  routes: [diplomat, writer]
  rungs:
