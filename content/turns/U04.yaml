  turns:
    - date: 1983
      h: 一篇讲稿见总书记
      text: >-
        1982年王毅从北京第二外国语学院日语专业毕业，进入外交部亚洲司日本处当科员，主要工作是替领导写发言稿。1983年胡耀邦准备访日，起草讲稿的任务落到他头上；《人民文摘》说，稿子返回时胡耀邦只改了两处，还批了“此稿写得很好！”。当年坐在他旁边的同事江培柱回忆，时任亚洲司司长杨振亚一看讲稿，立刻决定带着王毅去见胡耀邦，“这件事很快传遍了外交部”。
      did: >-
        把领导交办的一篇讲稿写到最好，被上级带去见了最高领导人，一下子在单位里出了名。
      who: [hu-yaobang]
      cites: [u04-people-2013-06-01-wang-yi-youngest, u04-hqrw-2016-08-06-wang-yi-jiang]
    - date: 1994
      h: 每级都最年轻
      text: >-
        1989年起王毅在驻日使馆任参赞，1992年5月定为副司级，1994年任亚洲司副司长，次年升司长，1998年任部长助理，2001年48岁升任副部长。《人民文摘》引《新京报》说，他经历的每个职位几乎都创下了“外交部该职位的最年轻纪录”。他的同事胡中乐回忆，1997年部里派他去美国乔治敦大学做访问学者，专门强化英语，“这说明在个人努力之外，也有组织对他的培养”。
      did: >-
        在日本和亚洲事务这一个方向上一路做下去，同时补英语、读学位，让组织看到他可以往更大的岗位上放。
      who: []
      cites: [b09-xinhua-2018-03-19-wang-yi-cv, u04-people-2013-06-01-wang-yi-youngest, u04-hqrw-2016-08-06-wang-yi-jiang]
    - date: 2004
      h: 难差事一件件接
      text: >-
        2003年起王毅以副部长身份任朝核六方会谈中方代表团团长；2004年中日关系因日本首相参拜靖国神社陷入低谷时，他出任驻日大使，任内有安倍晋三访华的“破冰之旅”和温家宝访日的“融冰之旅”。2007年他回国任外交部常务副部长兼党委书记，2008年任国台办主任，2013年任外交部长。
      did: >-
        被派到最难的谈判、最僵的双边关系和最敏感的对台岗位上，几件难事都没有办砸，从日本通变成了能管全局的人。
      who: []
      cites: [u04-people-2013-06-01-wang-yi-youngest, b09-xinhua-2018-03-19-wang-yi-cv]
    - date: 2022-10
      h: 超龄留任入局
      text: >-
        2022年二十大，69岁的王毅进入中央政治局，接替杨洁篪任中央外办主任；《联合早报》认为，这说明67岁留任、68岁退休的惯例已不再成立。路透社的人物介绍说，他与习近平没有长期的私人渊源。学者高树超对BBC中文说，王毅过去在战狼外交上表现良好，他的破格留任预示今后的重点是斗争。
      did: >-
        在外交风格转向强硬时站在最前面，靠表现赢得了最高领导人的信任，越过了年龄线。
      who: [xi-jinping]
      cites: [b09-zaobao-2022-10-23-wang-yi-pb, f02-reuters-2022-10-24-elites, f01-bbc-2022-10-28-pb-24]
  can:
    text: >-
      能学的是把每一份差事做到最好，并在一个专业方向长期深耕：江培柱回忆，他给总书记写出访讲稿这样的大事能做好，给同事发电影票这样的小事也兢兢业业；此后每一级都靠能办成难事往上走。
    cites: [u04-hqrw-2016-08-06-wang-yi-jiang, u04-people-2013-06-01-wang-yi-youngest]
  cannot:
    text: >-
      学不来的是起步时的机缘和家庭背景：刚进外交部就赶上总书记访日，讲稿任务落到他这个科员头上；《人民文摘》提到他的岳父钱嘉东当过周恩来的外事秘书，江培柱则认为说王毅沾过岳父的光不可能。晚年的超龄留任，取决于外交路线转向强硬的时代需要和最高领导人的个人选择，不是个人能争取的。
    cites: [u04-people-2013-06-01-wang-yi-youngest, u04-hqrw-2016-08-06-wang-yi-jiang, b09-zaobao-2022-10-23-wang-yi-pb]
  counter:
    - id: qin-gang
      name: 秦刚
      text: 同样是外交部培养的职业外交官，被视为习近平亲手提拔，2022年底56岁出任外长；上任半年多即被免职，原因从未公布。
      cite: b08-gov-2023-07-25-order-8

