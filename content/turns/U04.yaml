      h: 嘉兴书记与之江
      text: >-
        1999年他调浙江任湖州市委副书记、市长，2003年任嘉兴市委书记，与省委书记习近平是直接上下级。布鲁金斯学会的李成写道，外界相信他大量协助了习近平的《之江新语》专栏，两人在那几年经常交换想法；日本国际问题研究所引《读卖新闻》说，习近平当时称赞他为人好、不辞辛劳。
      did: >-
        跨省调动后在新省份的地级市主政，同时参与省委书记的文字工作，让领导近距离看到了自己。
      who: [xi-jinping]
      cites: [c02-gov-2017-10-25-19th-cvs, b11-brookings-2022-10-16-20th-candidates, c02-jiia-2019-04-huang-kunming]
    - date: 2013-10
      h: 进京掌宣传
      text: >-
        2007年他接替陈敏尔任浙江省委宣传部长，2010年任杭州市委书记。2013年10月他调任中宣部副部长，2014年任主持常务工作的副部长（正部长级）；日本国际问题研究所指出，此前他只当过两年多宣传部长。2016年十八届六中全会后，他在中宣部发布会上说习近平作为党中央的核心、全党的核心，“是众望所归，当之无愧、名副其实”。2017年他进入政治局，接任中宣部长。
      did: >-
        进入中央部门后在关键节点上带头阐释最高领导人的地位，把宣传系统的口径统一起来。
      who: [xi-jinping]
      cites: [c02-gov-2017-10-25-19th-cvs, c02-jiia-2019-04-huang-kunming, b11-people-2016-10-28-huang-core, b11-xinhua-2017-10-30-huang-propaganda]
  can:
    text: >-
      能学的是在基层和地方长期扎实工作，同时练好文字功夫，上级需要时能把思想整理成文。
    cites: [c02-gov-2017-10-25-19th-cvs, b11-brookings-2022-10-16-20th-candidates]
  cannot:
    text: >-
      学不来的是在福建、浙江两地都与习近平有交集：香港01说他是为数不多的同时与习近平在闽、浙两地都共事过的官员，路透社也这样介绍他。他进京时宣传经验并不丰富，此后的上升主要来自最高领导人的信任；2022年他未能入常，外放广东。
    cites: [b11-hk01-2017-10-30-huang-propaganda, f02-reuters-2022-10-24-elites, c02-jiia-2019-04-huang-kunming, b06-bbc-2022-10-23-psc]
  counter:
    - id: liu-qibao
      name: 刘奇葆
      text: 他的前任中宣部长，团派出身，被外界视为胡锦涛的安排；2017年未到年龄就退出政治局，中宣部交给了黄坤明。
      cite: b19-cna-2017-10-25-three-exit

yang-jiechi:
  routes: [diplomat, worker]
  rungs:
    - { rung: vice, date: 1998, post: 外交部副部长, cite: c02-gov-2017-10-25-19th-cvs }
    - { rung: minister, date: 2007, post: 外交部部长, cite: c02-gov-2017-10-25-19th-cvs }
    - { rung: pb, date: 2017-10, post: 中央政治局委员, cite: c02-xinhua-2017-10-25-19-1-plenum }
  turns:
    - date: 1972
      h: 工人选派留英
      text: >-
        杨洁篪1968年起在上海浦江电表厂当了四年工人，1972年进外交部出国学习集训班，1973年至1975年先后在英国伊林学院、巴斯大学和伦敦政治经济学院学习。央视的报道说，他属于20世纪70年代中国派往英国进修的第一批外交干部，同批还有王光亚、沙祖康等人；回国后他进入外交部翻译室。
      did: >-
        从工厂被挑去学外语，抓住了那一代人里极少有的出国学习机会，回来从翻译做起。
      who: []
      cites: [c02-gov-2017-10-25-19th-cvs, b11-cctv-2007-04-29-yang-tiger]
    - date: 1977
      h: 老布什的老虎杨
      text: >-
        1977年老布什一家访华并获准去西藏参观，刚从伦敦政治经济学院毕业的杨洁篪全程担任翻译；央视报道说，老布什称他为“老虎杨”。詹姆斯敦基金会的文章说，他在翻译室前后工作十多年，为包括邓小平在内的多数领导人当过翻译，与布什一家成为终身朋友，这为他此后的仕途开了好头。
      did: >-
        把一次翻译任务做得让外宾印象深刻，交下了延续几十年的人脉。
      who: []
      cites: [b11-cctv-2007-04-29-yang-tiger, b11-jamestown-2018-yang-element]
    - date: 2007-04
      h: 三驻华府当外长
      text: >-
        此后他三次常驻华盛顿：1983年任二秘，1993年任公使，2000年至2004年任驻美大使（詹姆斯敦基金会的文章记为2001至2005年）。1998年他任外交部副部长，2007年任外交部长，2013年任国务委员兼中央外办主任，2017年进入政治局。詹姆斯敦基金会说，这些技能和人脉在中美关系的关键时刻屡被倚重，例如2001年的中美撞机事件。
      did: >-
        在一组最重要的双边关系上深耕三十年，每当双方关系出事，都是能派上用场的人。
      who: []
      cites: [c02-gov-2017-10-25-19th-cvs, b11-jamestown-2018-yang-element]
  can:
    text: >-
      能学的是把语言和专业练到顶尖，把每一次接待、翻译都当成积累信任和人脉的机会，并长期专注于一组最重要的双边关系。
    cites: [b11-cctv-2007-04-29-yang-tiger, b11-jamestown-2018-yang-element]
  cannot:
    text: >-
      学不来的是时代给的入场券：上世纪70年代初外交部从工人中选派少数人出国学习，这样的机会极少；他此后的上升也和中美关系在中国外交中的分量紧密相连。
    cites: [c02-gov-2017-10-25-19th-cvs, b11-cctv-2007-04-29-yang-tiger]

ma-xingrui:
  routes: [industry, scholar, technocrat]
  rungs:
    - { rung: vice, date: 2007, post: 中国航天科技集团公司总经理, cite: b08-bbc-2026-07-14-ma }
    - { rung: minister, date: 2016-12, post: 广东省代省长, cite: f08-chinanews-2017-02-07-jungong }
    - { rung: pb, date: 2022-10, post: 中央政治局委员, cite: b08-wikisource-2022-10-23-20-1-plenum }
  turns:
    - date: 1996
      h: 最年轻博导转航天
      text: >-
        马兴瑞是国家学位制度建立后培养的首批博士之一，留哈尔滨工业大学任教后先后破格晋升讲师、教授，34岁成为哈工大最年轻的博士生导师，37岁出任副校长；同年他离开高校，转任中国空间技术研究院（航天五院）副院长，进入卫星研制的核心“国家队”。
      did: >-
        先在专业上做到同龄人里最拔尖、被破格提拔，再从学校转到国家重点工程的一线单位。
      who: []
      cites: [b08-zaobao-2026-04-03-ma, b08-bbc-2026-07-14-ma]
    - date: 2007
      h: 航天少帅掌集团
      text: >-
        2007年他接替张庆伟任中国航天科技集团总经理，任载人航天工程副总指挥，参与神舟飞船研制，被誉为“航天少帅”；2008年当选央视年度十大经济人物。BBC中文说，他在航天系统任职期间，嫦娥探月、神舟载人和天宫空间站项目取得重大进展，“为其政治生涯积累了丰富的政绩和管理经验”。
      did: >-
        把国家级工程做成看得见的成绩，以央企掌门人的身份站到了聚光灯下。
      who: [zhang-qingwei]
      cites: [b08-bbc-2026-07-14-ma, b08-zaobao-2026-04-03-ma]
    - date: 2013-03
      h: 四年跨了四界
      text: >-
        2013年3月他任工信部副部长兼国家航天局局长，8个月后空降广东任省委副书记、政法委书记，2015年3月任深圳市委书记，是深圳建市以来首次由中央委员出任一把手，2016年12月任广东省代省长。《中国经济周刊》的报道说，他“跨界范围之大、进步频率之快，都属罕见”；文中一位组织部门人士说，央企领导到地方任要职“体现了组织对该央企的肯定和对干部本人的充分信任”。
      did: >-
        从管技术和企业，转到管政法、管一座特大城市、管一个经济大省，每一站都不长，但都没出大问题。
      who: []
      cites: [f08-chinanews-2017-02-07-jungong]
    - date: 2021-12
      h: 新疆入局到落马
      text: >-
        2021年12月他接替陈全国任新疆党委书记，《联合早报》说他由此“提前拿到新一届政治局入场券”，2022年进入政治局。2025年7月他调离新疆后未公布新职，2026年4月被宣布接受审查，7月被开除党籍、公职，通报称他大搞家族腐败。联合早报引台湾学者张执中的判断说，他出事主要是过去与航天系关联较大，又涉及当前军队与军工反腐。
      did: >-
        在边疆一把手的位置上拿到了进入政治局的资格，但早年所在系统的问题最终追上了他。
      who: []
      cites: [b08-zaobao-2026-04-03-ma, b08-xinhua-2026-07-14-ma-expelled, b08-bbc-2026-07-14-ma]
  can:
    text: >-
      能学的是专业上做到拔尖，并把专业成绩转化成看得见的工程成果；《中国经济周刊》引述的评论认为，军工出身的官员执行能力强、善于在高压下突破创新。
    cites: [b08-zaobao-2026-04-03-ma, f08-chinanews-2017-02-07-jungong]
  cannot:
    text: >-
      学不来的是时代窗口：国家重点工程和组织部门的偏好，把一批航天、军工央企负责人推上地方要职，《中国经济周刊》称之为军工系统官员走俏。这条路的风险同样是系统性的：BBC中文引述的博主说，军工央企反腐中11家副部级军工集团负责人被一网打尽，台湾学者寇健文对中央社说航天帮只剩袁家军还在；马兴瑞成为二十届政治局第三名落马的委员。
    cites: [f08-chinanews-2017-02-07-jungong, b08-bbc-2026-07-14-ma, b08-cna-2026-04-04-ma]
  counter:
    - id: zhang-qingwei
      name: 张庆伟
      text: 同一家集团的前任总经理，马兴瑞2007年正是接替他；从政地方后官至黑龙江、湖南两省省委书记，最后任全国人大副委员长，没有进入政治局，也没有落马。
      cite: b08-bbc-2026-07-14-ma
    - id: xu-dazhe
      name: 许达哲
      text: 马兴瑞在航天科技集团和国防科工局的继任者，后任湖南省长、省委书记；2025年10月被湖南省人大常委会罢免全国人大代表，官方未说明原因。
      cite: f08-xinhua-2025-10-28-npc-notice
  deep: true

chen-wenqing:
  routes: [law, ccdi]
  rungs:
    - { rung: bureau, date: 1994-08, post: 四川省国家安全厅副厅长, cite: b16-chinanews-2016-11-07-chen-mss }
    - { rung: vice, date: 2002-04, post: 四川省人民检察院检察长, cite: b16-chinanews-2016-11-07-chen-mss }
    - { rung: minister, date: 2012-11, post: 中央纪委副书记（正部长级）, cite: b16-chinanews-2016-11-07-chen-mss }
    - { rung: pb, date: 2022-10, post: 中央政治局委员, cite: b08-wikisource-2022-10-23-20-1-plenum }
  turns:
    - date: 1984
      h: 派出所民警起步
      text: >-
        1984年陈文清从西南政法学院毕业，到乐山彭山县谢家镇派出所当民警，不久任金口河区公安分局副局长，1990年任乐山市公安局副局长，1992年底升局长；1994年调任四川省国家安全厅副厅长，1998年升厅长。
      did: >-
        从最基层的派出所干起，在公安和国家安全两个系统里一步步做到省一级的厅长。
      who: []
      cites: [b16-chinanews-2016-11-07-chen-mss]
    - date: 2002-04
      h: 最年轻省检察长
      text: >-
        2002年4月他任四川省检察长，跻身副省级，《联合早报》说他是“当时中国最年轻的省级检察长”。2006年他首次离开四川，任福建省委常委、省纪委书记（中央社记为福建省政法委书记，与官方简历不同），2011年升省委副书记。
      did: >-
        在政法系统里跨公安、国安、检察三条线，又到外省管纪检，履历一步步变宽。
      who: []
      cites: [b16-chinanews-2016-11-07-chen-mss, b16-zaobao-2022-10-29-chen-zhengfa, b16-cna-2022-10-29-chen-zhengfa]
    - date: 2015-04
      h: 中纪委到国安部
      text: >-
        2012年11月他任中纪委副书记（正部长级），在时任中纪委书记王岐山领导下工作。2015年1月国安部副部长马建落马，同年4月他出任国安部党委书记，《联合早报》说这项任命当时被认为与纠正国安系统存在的问题有关；2016年他任国家安全部部长。路透社的人物介绍说，他与习近平没有长期渊源。
      did: >-
        在反腐高峰期进入中纪委，随后被派去整顿出了问题的国安系统。
      who: [wang-qishan]
      cites: [b16-chinanews-2016-11-07-chen-mss, b16-zaobao-2022-10-29-chen-zhengfa, b16-zaobao-2022-10-30-chen-stability, f02-reuters-2022-10-24-elites]
    - date: 2022-10
      h: 国安部长入局
      text: >-
        2022年二十大，他成为首名从国安部长位置进入政治局的人，随后接替郭声琨任中央政法委书记；路透社说，这是间谍头子第一次被选来担任这一最高安全职位。《联合早报》引受访学者说，这显示中共领导人对他高度信任。
      did: >-
        在一个靠忠诚和保密立身的系统里做到顶，被选来统管整个政法系统。
      who: [xi-jinping]
      cites: [b16-zaobao-2022-10-30-chen-stability, b16-reuters-2022-10-30-chen-yixin]
  can:
    text: >-
      能学的是在一个系统里从最基层干起，跨岗位积累经验，并在纪检和整顿这类难办的任务中证明自己可靠。
    cites: [b16-chinanews-2016-11-07-chen-mss, b16-zaobao-2022-10-30-chen-stability]
  cannot:
    text: >-
      学不来的是反腐和国安整顿带来的窗口：马建落马后国安系统需要可信任的人接手，他从中纪委调任正逢其时。路透社说他与习近平没有长期渊源，这条路更多靠系统内的表现和关键时刻的人事需要；《联合早报》则注意到他在福建的任职经历与习近平有相似之处。
    cites: [b16-zaobao-2022-10-30-chen-stability, f02-reuters-2022-10-24-elites]
  counter:
    - id: ma-jian
      name: 马建
      text: 同在国家安全系统做到副部长，2015年初落马，2018年以受贿罪、强迫交易罪、内幕交易罪被判无期徒刑；陈文清正是在他落马后接手国安部。
      cite: f06-court-2018-12-27-ma-jian

chen-miner:
  routes: [writer, media, patron, local]
  rungs:
    - { rung: county, date: 1987, post: 绍兴县委常委、宣传部部长, cite: c02-gov-2017-10-25-19th-cvs }
    - { rung: bureau, date: 1996, post: 绍兴市委常委、绍兴县委书记, cite: c02-gov-2017-10-25-19th-cvs }
    - { rung: vice, date: 2002, post: 浙江省委常委、宣传部部长, cite: c02-gov-2017-10-25-19th-cvs }
    - { rung: minister, date: 2012-12, post: 贵州省委副书记、代省长, cite: c02-gov-2017-10-25-19th-cvs }
    - { rung: pb, date: 2017-10, post: 中央政治局委员, cite: c02-xinhua-2017-10-25-19-1-plenum }
  turns:
    - date: 1987
      h: 宣传干事起步
      text: >-
        陈敏尔从绍兴师专中文系毕业后当宣传干事，1987年任绍兴县委常委、宣传部长，1991年起任县长，1994年任县委书记，1996年进入绍兴市委常委；1997年起任宁波市委常委、副市长、市委副书记。
      did: >-
        从笔头工作起家，在一个县里从宣传部长做到县委书记，攒下了基层主政经历。
      who: []
      cites: [c02-gov-2017-10-25-19th-cvs, b11-brookings-2022-10-16-20th-candidates]
    - date: 2002
      h: 之江新语背后
      text: >-
        1999年他任浙江日报报业集团社长，2001年任省委宣传部长，2002年进入省委常委。习近平主政浙江期间，《浙江日报》头版推出署名哲欣的《之江新语》专栏，哲欣就是习近平的笔名。布鲁金斯学会的李成写道，外界普遍相信陈敏尔在那几年大量协助习近平准备这些每周专栏；BBC中文引《大公报》马浩亮的说法，陈敏尔与蔡奇、黄坤明、李强等人堪称一支“之江新军”。
      did: >-
        在省委书记身边做宣传和文字工作，帮他把思想和言论整理成文、按期见报。
      who: [xi-jinping]
      cites: [c02-gov-2017-10-25-19th-cvs, b11-bbc-2015-07-31-chen-guizhou, b11-brookings-2022-10-16-20th-candidates]
    - date: 2015-07
      h: 贵州当一把手
      text: >-
        2012年初他调任贵州省委副书记，2013年任省长，2015年7月升任省委书记，是当时仅有的三名60后省委书记之一。纽约时报中文网说，他是“习近平的老部下之一”，在贵州强力推行把农村小块土地并进合作社的做法，还加上了自己的创新；李成写道，他在贵州致力于扶贫、环保和大数据，贵州由此成为全国的大数据中心。
      did: >-
        离开熟悉的沿海省份，到欠发达省份当一把手，找到了大数据这个能出成绩的抓手。
      who: [xi-jinping]
      cites: [c02-gov-2017-10-25-19th-cvs, b11-nytcn-2017-09-13-chen-miner, b11-brookings-2022-10-16-20th-candidates]
    - date: 2017-07
      h: 临危接掌重庆
      text: >-
        2017年7月孙政才被免去重庆市委书记，陈敏尔接任。研究中国政党政治的学者傅士卓对纽约时报说：“陈敏尔看来是习近平指望的那种能干事的人之一。”同年十九大他进入政治局，但BBC中文说，会前呼声颇高的他没有进入常委名单；2022年二十大他仍留在政治局委员一级，年底转任天津市委书记。
      did: >-
        在前任突然落马的直辖市接手，第一时间表态清理前任的影响，把一个出过两任落马书记的地方稳住。
      who: [xi-jinping]
      cites: [b11-chinanews-2017-07-15-chen-chongqing, b07-nyt-2017-07-24-sun-fall, b05-bbc-2017-10-25-psc-profiles, b11-brookings-2022-10-16-20th-candidates, b11-xinhua-2022-12-08-chen-tianjin]
  can:
    text: >-
      能学的是文字和宣传功底：从宣传干事一路做到省委宣传部长，再把这份能力用在服务主要领导上；外放贵州后，也能找到大数据这样的抓手做出成绩。
    cites: [c02-gov-2017-10-25-19th-cvs, b11-brookings-2022-10-16-20th-candidates]
  cannot:
    text: >-
      学不来的是在省委书记身边工作的那五年：李成写道外界相信他大量协助了习近平的专栏，这段经历让他成为“之江新军”的代表。李成认为贵州和重庆两次任命让他处于有利位置，但他两次与常委失之交臂，说明即使是最亲近的旧部，能否更上一层也取决于最高层的整体布局。
    cites: [b11-brookings-2022-10-16-20th-candidates, b11-bbc-2015-07-31-chen-guizhou, b05-bbc-2017-10-25-psc-profiles]
  counter:
    - id: sun-zhengcai
      name: 孙政才
      text: 他在重庆的前任，同为60后、同被视为接班人选；2017年被免职立案，2018年以受贿罪被判无期徒刑。
      cite: b07-xinhua-2018-05-08-sun-sentence
    - id: si-xinliang
      name: 斯鑫良
      text: 李成写道，他做过浙江省委宣传部长和组织部长，陈敏尔的女儿曾嫁给他的儿子；同样从浙江宣传口起步，2015年因腐败落马。
      cite: b11-brookings-2022-10-16-20th-candidates
