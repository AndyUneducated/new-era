# 上位之路 · 第七轮 U01：已有完整传记的元老、第三代与第四代领导人。字段见 src/data/schema.ts 的 TurnRecordSchema 和 research/howto-content.md §12。
deng-xiaoping:
  routes: [army, patron, crisis]
  rungs:
    - { rung: pb, date: 1955, post: 中央政治局委员（增选）, cite: b22-reformdata-1997-02-19-deng-obit }
    - { rung: psc, date: 1956-09, post: 中央政治局常委、中央委员会总书记, cite: b22-reformdata-1997-02-19-deng-obit }
  turns:
    - date: 1933
      h: 因拥护毛泽东被撤职
      text: >-
        邓小平早年在西北革命军队中负责政治工作，参加八七会议，第二次国内革命战争时期发动和领导百色起义、龙州起义。官方悼词说，他到中央革命根据地后，因为拥护毛泽东的路线，被当时党内的“左”倾领导者撤职，随后到红军总政治部工作，参加长征和遵义会议。
      did: >-
        在党内路线之争中站在毛泽东一边，并为此付出了被撤职的代价。
      who: []
      cites: [b22-reformdata-1997-02-19-deng-obit]
    - date: 1948
      h: 淮海总前委书记
      text: >-
        抗日战争时期，他同刘伯承一起率部创建晋冀豫等根据地，任一二九师政治委员，在七大当选中央委员。解放战争中他与刘伯承率大军千里跃进大别山，在战略决战阶段担任统一指挥中原、华东两大野战军的总前委书记，领导淮海战役和渡江战役，随后进军大西南。
      did: >-
        长期在主力部队当政治委员，在决定胜负的大战役里负责统一指挥，用战功站稳了位置。
      who: []
      cites: [b22-reformdata-1997-02-19-deng-obit]
    - date: 1956-09
      h: 从西南调进中央
      text: >-
        1949年后他任中共中央西南局第一书记，不久调到北京，1954年任中共中央秘书长，1955年增选为中央政治局委员，1956年在八大上作修改党章的报告，并在八届一中全会上当选中央政治局常委、总书记，此后主持中央书记处工作十年。
      did: >-
        从一个大区的主官转到中央管日常事务，两年里从秘书长做到总书记。
      who: []
      cites: [b22-reformdata-1997-02-19-deng-obit]
    - date: 1978-12
      h: 两次复出成为核心
      text: >-
        文化大革命中他被剥夺一切职务，1973年复出，1975年任中共中央副主席、国务院副总理、中央军委副主席和总参谋长，主持日常工作并大刀阔斧地整顿，不久再度被撤销一切职务。悼词写道：“经过这次全会，邓小平同志成为第二代中央领导集体的核心。”胡锦涛2005年说，陈云在十一届三中全会上同叶剑英、李先念等一起支持了邓小平提出的方针。
      did: >-
        复出后马上抓整顿、做出成效，被打倒后仍保住了党内外的支持，等到时局变化时重新站到台前。
      who: [chen-yun]
      cites: [b22-reformdata-1997-02-19-deng-obit, b22-cctv-2005-06-13-hu-chen-100]
  can:
    text: >-
      能学的是在关键岗位上把事情做成：战争年代他长期担任主力部队政委并统一指挥大战役，1975年主持日常工作时大刀阔斧整顿，短时间内取得成效。这些实绩让他在多次被撤职之后仍有复出的基础。
    cites: [b22-reformdata-1997-02-19-deng-obit]
  cannot:
    text: >-
      学不来的是时代和资历：他属于党的早期党员，经历了长征和建国战争，1949年前已是中央委员和一方统帅。文革结束后拨乱反正的窗口，以及陈云、叶剑英、李先念等老一辈的支持，使他在十一届三中全会后成为核心，这不是个人努力能够复制的条件。
    cites: [b22-reformdata-1997-02-19-deng-obit, b22-cctv-2005-06-13-hu-chen-100]

chen-yun:
  routes: [technocrat, patron]
  turns:
    - date: 1925
      h: 工人运动中入党
      text: >-
        陈云出生在江苏青浦一个贫苦农家，只读过小学。1925年他在上海参加五卅运动和工人罢工运动，同年加入中国共产党，胡锦涛2005年的讲话说：“从此，他开始了职业革命家的生涯。”习近平2015年说，他在大革命中投身工人运动，在实际斗争中成长为工人运动领导人。
      did: >-
        没有学历，靠在工人运动的实际斗争中出头，二十岁就成了职业革命者。
      who: []
      cites: [b22-cctv-2005-06-13-hu-chen-100, b22-people-2015-06-12-xi-chen-110]
    - date: 1935-01
      h: 遵义会议支持毛泽东
      text: >-
        他参加了长征。习近平2015年说，在遵义会议上，陈云坚定支持毛泽东的主张，支持会议确立以毛泽东为代表的领导；抗日战争期间他担任了7年中共中央组织部部长，领导制定了“了解人、气量大、用得好、爱护人”的十二字干部政策。
      did: >-
        在党内决定方向的会议上站对了位置，随后长期掌管干部的选拔和任用。
      who: []
      cites: [b22-people-2015-06-12-xi-chen-110]
    - date: 1949
      h: 一年统一全国财经
      text: >-
        新中国成立后，他任政务院副总理兼财政经济委员会主任，受命主持全国财政经济工作，“只用不到一年时间”实现全国财政经济统一，稳定金融物价，又主持编制和执行第一个五年计划。胡锦涛说，他在领导财经工作中表现出来的才能为毛泽东所赞扬。
      did: >-
        在新政权最要紧的经济难题上拿出了办法，从此成为党内公认管经济的人。
      who: []
      cites: [b22-people-2015-06-12-xi-chen-110, b22-cctv-2005-06-13-hu-chen-100]
    - date: 1978-12
      h: 中央工作会议发言
      text: >-
        1978年底十一届三中全会前的中央工作会议上，他提出要把工作重点转到社会主义建设上来，必须解决好历史遗留的若干重大问题，发言受到与会者积极响应。在随后的三中全会上，他重新当选中央政治局常委、中央副主席，并被选为中央纪委第一书记，此后担任了9年中纪委第一书记。
      did: >-
        在会议上带头提出平反历史问题，借这次发言重新回到核心位置。
      who: [deng-xiaoping]
      cites: [b22-people-2015-06-12-xi-chen-110, b22-cctv-2005-06-13-hu-chen-100]
  can:
    text: >-
      能学的是在一个专业领域做出别人做不到的成绩：他只读过小学，靠长期实践中的刻苦学习成为财经工作的主持者，新中国初期不到一年就统一了财经、稳定了物价；每次决策前都要做大量调查研究，听取多方面意见。
    cites: [b22-people-2015-06-12-xi-chen-110]
  cannot:
    text: >-
      学不来的是时代和资历：他1925年入党，属于党创建时期的一代；遵义会议上站在后来胜出的一方，抗战时又长期执掌组织部门。这些位置决定了他此后几十年的地位，后人无法复制。
    cites: [b22-people-2015-06-12-xi-chen-110, b22-cctv-2005-06-13-hu-chen-100]

hu-yaobang:
  routes: [youth, patron]
  rungs:
    - { rung: pb, date: 1978-12, post: 中央政治局委员、中央纪委第三书记, cite: b22-people-2005-11-18-zeng-hu-90 }
    - { rung: psc, date: 1980-02, post: 中央政治局常委、中央委员会总书记, cite: b22-people-2005-11-18-zeng-hu-90 }
  turns:
    - date: 1935
      h: 苏区红小鬼
      text: >-
        胡耀邦出生在湖南浏阳一个贫苦农家，1929年冬加入共青团，在党的领导下从事青少年工作，1933年9月转为党员，1934年随中央红军长征。到陕北后他先后任少共中央局秘书长、组织部长、宣传部长；习近平2015年说，他领导的扩红、筹款和青年工作成果显著，受到毛泽东称赞。
      did: >-
        十几岁就在根据地做青年团工作，跟着红军走完长征，到陕北后把扩充兵员、筹集经费这类具体任务办出了成绩。
      who: []
      cites: [b22-people-2005-11-18-zeng-hu-90, c09-gov-2015-11-20-xi-hu-yaobang-100]
    - date: 1952
      h: 川北到团中央
      text: >-
        1949年冬他率部进军大西南，任川北区党委书记、行署主任、军区政委，领导土地改革和剿匪。邓小平评价他在川北的工作是搞得好的，“有主见，不盲从”。1952年后他先后任团中央书记处书记、第一书记，主持团中央工作十多年，1956年在八大当选中央委员。
      did: >-
        在一个新解放的地区迅速打开局面，得到上级首长的好评，随后被调去主持全国的青年团工作。
      who: [deng-xiaoping]
      cites: [b22-people-2005-11-18-zeng-hu-90, c09-gov-2015-11-20-xi-hu-yaobang-100]
    - date: 1977-12
      h: 组织部长平反冤案
      text: >-
        1977年3月他任中央党校副校长，12月任中共中央组织部部长，组织推动真理标准问题的讨论，领导平反冤假错案、落实干部政策，使大批受迫害的老同志重新走上领导岗位。1978年12月他当选中央政治局委员，1980年2月在十一届五中全会上当选政治局常委、总书记。纽约时报1989年写道，胡耀邦是邓小平的长期门生，70年代后期在帮助邓小平巩固权力上发挥了重要作用。
      did: >-
        在掌管干部的位置上大批为受冤屈的干部平反，这些干部重新上岗，也成为改革路线的支持者。
      who: [deng-xiaoping]
      cites: [b22-people-2005-11-18-zeng-hu-90, c09-gov-2015-11-20-xi-hu-yaobang-100, b22-nytcn-1989-04-15-hu-obit]
  can:
    text: >-
      能学的是把交办的具体任务做出成绩并敢于担当：在陕北扩红筹款受到称赞，在川北迅速打开局面，主持组织部时推动平反冤假错案，使大批老同志重新走上领导岗位。
    cites: [c09-gov-2015-11-20-xi-hu-yaobang-100]
  cannot:
    text: >-
      学不来的是起点和靠山：他十四岁进入苏区青年团系统、参加长征，属于和党的领袖们一起经历过战争的一代；他长期被视为邓小平的门生，升降也和邓小平的态度相连，1987年1月在学潮和反资产阶级自由化的背景下辞去总书记职务。
    cites: [b22-people-2005-11-18-zeng-hu-90, b22-nytcn-1989-04-15-hu-obit]

song-ping:
  routes: [secretary, technocrat, frontier]
  rungs:
    - { rung: vice, date: 1952, post: 国家计委劳动工资计划局局长兼劳动部副部长, cite: f05-xinhua-2026-03-10-song-ping }
    - { rung: minister, date: 1977, post: 甘肃省委第一书记, cite: f05-xinhua-2026-03-10-song-ping }
    - { rung: pb, date: 1987-11, post: 中央政治局委员兼中央组织部部长, cite: f05-xinhua-2026-03-10-song-ping }
    - { rung: psc, date: 1989-06, post: 中央政治局常委, cite: f05-xinhua-2026-03-10-song-ping }
  turns:
    - date: 1938
      h: 周恩来的政治秘书
      text: >-
        宋平出生在山东莒县一个农民家庭，在北平大学农学院、清华大学读书时参加一二·九运动，1936年参加革命工作，1937年12月入党。1938至1947年他先后在延安中央党校、马列学院、中央南方局和重庆新华日报社工作，其间担任周恩来的政治秘书，并作为中共代表团秘书参加国共和平谈判。
      did: >-
        在延安和重庆做组织、资料和文字一类的幕僚工作，近距离跟随周恩来处理事务。
      who: []
      cites: [f05-xinhua-2026-03-10-song-ping]
    - date: 1977
      h: 计委与大西北
      text: >-
        1952年起他任国家计委委员、劳动工资计划局局长兼劳动部副部长，1957年任国家计委副主任；1960年起调西北局任计委主任，其间带职下放任陕西蒲城县委书记。1972年他任甘肃省委书记（当时设有第一书记），1977年任甘肃省委第一书记，抓救灾、农业和包产到户。新华社的生平写道，他“注重发现和培养选拔优秀年轻干部”。
      did: >-
        在计划经济的核心部门和艰苦的西北之间来回任职，管过全国劳动工资计划，也当过县委书记和省委一把手。
      who: []
      cites: [f05-xinhua-2026-03-10-song-ping]
    - date: 1987-05
      h: 由计委转管干部
      text: >-
        1981年1月他回国家计委任副主任，1983年6月任国务委员兼国家计委主任，1987年5月任中央组织部部长，11月当选中央政治局委员。联合早报说，他在甘肃和中组部主持工作时提拔举荐过胡锦涛、温家宝等人，1979年他到甘肃省建委主持座谈会，时任设计管理处副处长的胡锦涛出面汇报，给他留下深刻印象，曾被称为“中国政坛最大伯乐”。
      did: >-
        先在计划部门做到一把手，再转去管全国的干部；在地方时就留意年轻人，后来提拔推荐的人成了下一代领导人。
      who: []
      cites: [f05-xinhua-2026-03-10-song-ping, f05-zaobao-2026-03-04-song-ping]
    - date: 1989-06
      h: 风波后补进常委
      text: >-
        新华社的生平说，他在1989年的政治风波中“表现出坚强党性和组织纪律性”，同年6月任中央政治局常委。据吴仁华对自由亚洲电台的口述，邓小平、陈云、李先念等元老在邓小平家开会，决定由江泽民出任总书记，“宋平跟李瑞环补上去担任中央政治局的常委”。据阿波罗新闻网（传闻），是邓小平提出让宋平进常委，因为宋平“一直是陈云的得意门生”，陈云、李先念自然同意。
      did: >-
        在高层分裂时明确站在多数元老一边，常委会出缺时被各方都能接受。
      who: [deng-xiaoping, chen-yun]
      cites: [f05-xinhua-2026-03-10-song-ping, u01-rfa-2019-05-27-elders-jiang, u01-aboluowang-2013-06-01-1989-personnel]
  can:
    text: >-
      能学的是在冷门和艰苦的岗位上做实事，并留意发现人才：他在甘肃抓救灾、农业和水利，注重发现和培养年轻干部，后来经他提拔推荐的人成为重要领导人，这份眼光也成为他自己的资历。
    cites: [f05-xinhua-2026-03-10-song-ping, f05-zaobao-2026-03-04-song-ping]
  cannot:
    text: >-
      学不来的是起点和时机：他早年担任周恩来的政治秘书，联合早报说他的政治生涯得益于受到周恩来、邓小平、陈云等历任领导人的信任；1989年常委出缺，是因为赵紫阳、胡启立被免职，由元老们商定补人，72岁进入常委会，这样的窗口可遇不可求。
    cites: [f05-zaobao-2026-03-04-song-ping, b22-cna-2026-03-04-song-ping, u01-rfa-2019-05-27-elders-jiang]

zhao-ziyang:
  routes: [local, crisis, patron]
  rungs:
    - { rung: minister, date: 1965, post: 广东省委书记, cite: wd-Q99829 }
    - { rung: psc, date: 1980-02, post: 中央政治局常委, cite: b14-bbc-2005-01-17-zhao-profile }
  turns:
    - date: 1965
      h: 县委书记做到省委
      text: >-
        赵紫阳1919年生于河南滑县一个地主家庭，1932年加入共青团，1938年2月入党。新华社2005年的通稿说，在革命战争年代和建设时期，他在地方先后担任过县委、地委、省委主要领导职务；BBC说他1949年后在广东、内蒙古和四川担任党政领导工作，Wikidata记载他1965年已任广东省委书记。
      did: >-
        从县一级做起，一级一级在地方上当主官，四十多岁就做到了省里的一把手。
      who: []
      cites: [c05-xinhua-2005-01-29-zhao-ziyang, b14-bbc-2005-01-17-zhao-profile, wd-Q99829]
    - date: 1975
      h: 四川“要吃粮找紫阳”
      text: >-
        文革后期他调任四川省委书记兼成都军区政委。原新华社四川分社社长孙振回忆，他刚到四川，两名主要助手就被造反派绑架，他一面应付造反派，一面微服私访，向基层干部和农民了解农业实情；1976年8月四川发生强震，他不顾造反派的大字报赶赴灾区。文革结束后他在四川推行类似包产到户的政策，农业生产迅速恢复，80年代初民间流传“要吃粮找紫阳”。
      did: >-
        到一个乱局中的大省，先下去摸清农民的实际情况，再放宽政策让农民多种粮，用产量说话。
      who: []
      cites: [b14-rfa-2008-09-12-zhao-sichuan]
    - date: 1980-02
      h: 地方改革换来常委
      text: >-
        BBC写道：“正是因为赵紫阳70年代中期在四川成功进行了农村经济体制改革，他在1980年中共十一届五中全会上当选为中共中央政治局常委”，同年他出任国务院总理，全面负责经济工作。邓小平1992年回顾说，文革结束后他发现靠老一代解决不了长治久安的问题，“于是我们推荐别的人，真正要找第三代”。
      did: >-
        把一个省的改革做成全国可以推广的样板，直接从地方被调进中央掌管经济。
      who: [deng-xiaoping]
      cites: [b14-bbc-2005-01-17-zhao-profile, b22-reformdata-1992-01-18-southern-talks]
    - date: 1987-01
