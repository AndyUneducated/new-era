  can:
    text: >-
      能学的是在地方上敢于向上级要政策、把设想做成制度：他在广东率先提出先走一步、建立出口加工区的请求，最终促成中央批准办经济特区。
    cites: [c05-chinanews-2002-05-30-xi-zhongxun-life, c05-people-2013-10-12-xi-yuanping]
  cannot:
    text: >-
      学不来的是革命元老的资历和时代转折：他是陕甘边根据地的主要创建者之一，1945年已是候补中央委员；十六年的审查关押能在十一届三中全会后彻底平反，并在复出后得到邓小平、叶剑英的支持，都取决于那个时代的大转折，而不是个人的选择。
    cites: [c05-chinanews-2002-05-30-xi-zhongxun-life, c05-people-2013-10-12-xi-yuanping]
