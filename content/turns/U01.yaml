    - { rung: pb, date: 1994-09, post: 中央政治局委员（十四届四中全会增选）、上海市委书记, cite: b01-chinanews-2007-06-05-huang-ju-life }
    - { rung: psc, date: 2002-11, post: 中央政治局常委, cite: b01-chinanews-2007-06-05-huang-ju-life }
  turns:
    - date: 1977-12
      h: 冶金厂的技术革新
      text: >-
        黄菊1963年从清华大学电机系毕业后到上海人造板机器厂当技术员，1967年起在上海中华冶金厂任动力车间技术员，研制出我国第一台可控硅电炉自动配电装置，并写了一本推广小电炉超功率运行经验的书。1977年12月他任该厂革委会副主任、副厂长，1978年主持全厂工作时制定了10项管理制度，此后被派到国外学习企业管理。
      did: >-
        在工厂车间里搞出一项能推广的技术革新，当上副厂长后先把管理制度立起来。
      who: []
      cites: [b01-chinanews-2007-06-05-huang-ju-life]
    - date: 1983-03
      h: 从三百多人中选出
      text: >-
        1982年4月他任上海市第一机电工业局副局长，1983年3月进入上海市委任常委兼工业工作党委书记。中国新闻周刊回顾，当时中央派人到上海调整领导班子，原领导人没动，另从370多人中选拔了18人进入市级领导岗位，其中包括黄菊、吴邦国。1984年11月他任市委秘书长，1985年6月任市委副书记。
      did: >-
        在中央下来选拔年轻干部时，以工程师和副局长的身份被选中，一年内从局里进入市委。
      who: []
      cites: [b01-chinanews-2007-06-05-huang-ju-life, u01-waou-2014-11-04-third-echelon]
    - date: 1994-09
      h: 江泽民的上海助手
      text: >-
        1986年10月他兼任上海市常务副市长，“先后协助两任市长开展工作”，1991年4月任市长，1994年9月任上海市委书记，并在十四届四中全会上增选为中央政治局委员，2002年11月进入常委会。BBC 2002年在分析新常委会时称他是江泽民的“忠实助手”，2007年说他普遍被视为江泽民的亲信，也被视为上海帮的重要成员。
      did: >-
        长期在上海当副手，协助前后几任一把手管经济的日常运转，等到上海一把手被调进中央时接班。
      who: [jiang-zemin]
      cites: [b01-chinanews-2007-06-05-huang-ju-life, f01-bbc-2002-11-16-jiang-shadow, b01-bbc-2007-06-02-huang-ju-shanghai]
  can:
    text: >-
      能学的是做好副手、熟悉一座城市：他在上海工作了40年，从技术员、副厂长、副局长做到常务副市长，协助两任市长处理经济工作，对上海的工业和日常运转了如指掌。
    cites: [b01-chinanews-2007-06-05-huang-ju-life]
  cannot:
    text: >-
      学不来的是上海这块跳板和与江泽民的关系：BBC把他列为江泽民的“忠实助手”和上海帮的重要成员；1989年后上海领导人一个接一个被调进中央，他的接班和进京都发生在这股潮流中。
    cites: [f01-bbc-2002-11-16-jiang-shadow, b01-bbc-2007-06-02-huang-ju-shanghai]

