        在一家大型国有工厂从科员干到厂长，把产量和质量做到全国同行业第一，靠工厂里的成绩被上级注意到。
      who: []
      cites: [c01-people-2015-08-17-wei-jianxing-life]
    - date: 1981-04
      h: 中青班出来当市长
      text: >-
        官方生平说，他“1980年被选派到中央党校中青年干部培训班学习”，1981年4月起先后任哈尔滨市委副书记、市长，1983年10月调全国总工会任副主席、书记处书记。
      did: >-
        赶上中央选拔中青年干部，从厂长被送去中央党校培训，一年后就当了省会城市的市长。
      who: []
      cites: [c01-people-2015-08-17-wei-jianxing-life]
    - date: 1987-05
      h: 组织部到监察部
      text: >-
        1984年8月至1987年5月他先后任中央组织部副部长、部长，1987年5月起任监察部部长，恢复组建监察部和地方各级监察机关。BBC引述中国媒体的报道说，“尉健行曾长期在乔石领导下工作”，两人工作作风、理念相近且配合默契。
      did: >-
        在干部和监察两个新恢复、要从头搭架子的部门担任主官，把机构建起来。
      who: []
      cites: [c01-people-2015-08-17-wei-jianxing-life, b18-bbc-2015-08-07-wei-death]
    - date: 1995-04
      h: 陈希同案后接掌北京
      text: >-
        1992年他任中央政治局委员、中央书记处书记、中央纪委书记。1995年4月27日中央任命他为北京市委书记，同时批准陈希同引咎辞职；他兼任到1997年8月。1997年9月他当选政治局常委，继续任中纪委书记，任内中纪委办理了厦门远华案、成克杰案等案件。
      did: >-
        以纪委书记的身份在首都出事时顶上，处理完北京的局面后进入常委会。
      who: []
      cites: [c01-people-2015-08-17-wei-jianxing-life, e01-cpc-dsj-1995, b18-bbc-2015-08-07-wei-death]
  can:
    text: >-
      能学的是在一家工厂把事做成，再把同样的办法用到新搭建的机构：他在东轻厂把生产和质量做成行业排头兵，后来在监察部从恢复组建做起，在纪委建立工作格局。
    cites: [c01-people-2015-08-17-wei-jianxing-life]
  cannot:
    text: >-
      学不来的是时代机遇和上级的赏识：1980年代初中央大规模选拔中青年干部，他以劳模厂长的身份被选送中央党校，次年就出任市长；BBC说他长期在乔石领导下工作、配合默契。1995年北京的位置则是因陈希同案突然空出。
    cites: [c01-people-2015-08-17-wei-jianxing-life, b18-bbc-2015-08-07-wei-death, e01-cpc-dsj-1995]

