  cannot:
    text: >-
      学不来的是时代的窗口：1980年代对外开放刚开始，新设的外资部门急需懂企业和外贸的人。他与江泽民同出一汽，又先后在国家外国投资管理委员会任职；这些交集是否影响了他后来的升迁，现有来源没有说明。
