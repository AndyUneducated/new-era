      text: >-
        2008 年 12 月，44 岁的李书磊出任中央党校副校长，“其时，中央党校校长是时任中央政治局常委、中央书记处书记习近平”。联合早报说他辅助习近平，被视为习近平的“文胆”；新加坡学者 Tan Kong Yam 写道，“Li Shulei is trusted by Xi Jinping and has been the key drafter of many of Xi's major speeches and party documents.”
      did: >-
        在习近平兼任党校校长期间做他的副手，此后长期参与起草讲话和文件。
      who: [xi-jinping]
      cites: [b15-pku-2016-li-shulei-prodigy, c02-zaobao-2022-11-11-li-shulei, b15-thinkchina-2022-12-21-tan-kong-yam, b15-jamestown-2022-20th-leadership]
    - date: 2014-01
      h: 跨宣传纪检两口
      text: >-
        习近平任总书记后，李书磊 2014 年调任福建省委常委、宣传部长，2015 年底跨界任北京市委常委、市纪委书记，2017 年 1 月任中纪委副书记，2020 年 12 月回中央党校主持日常工作（正部长级），2022 年二十大进入政治局并任中宣部部长。
      did: >-
        从学校出来后在宣传、纪检两个系统轮岗，八年后回到意识形态口执掌中宣部。
      who: [xi-jinping]
      cites: [b15-thepaper-2020-12-li-shulei-cv, c02-zaobao-2022-11-11-li-shulei, b08-wikisource-2022-10-23-20-1-plenum]
  can:
    text: >-
      笔杆子路线：长期在理论、文史领域写作和教学，被领导人看中后负责起草讲话、文件；之后再到地方和纪检系统轮岗，补上实际工作经历。
    cites: [b15-thepaper-2020-12-li-shulei-cv, b15-thinkchina-2022-12-21-tan-kong-yam]
  cannot:
    text: >-
      学不来的是那几年的交集：他当党校副校长时，校长正是后来的总书记。路透社在二十大名单里对他的注解就是“Worked for Xi at the Central Party School in late 2000s”。没有这段上下级关系，学者型干部很少能从党校直接走进政治局。
    cites: [f02-reuters-2022-10-24-elites, b15-pku-2016-li-shulei-prodigy]
  counter:
    - id: hu-heping
      name: 胡和平
      text: 同样长期在高校任职、后来到中宣部的“学校型”干部：在清华学习、任职 23 年，2023 年接替李书磊分管中宣部日常工作，但没有进入政治局。
      cite: f08-caixin-2023-03-06-hu-heping

chen-jining:
  routes: [campus, scholar, technocrat, patron]
  rungs:
    - { rung: minister, date: 2015-02, post: 环境保护部部长, cite: c02-wiki-chen-jining }
    - { rung: pb, date: 2022-10, post: 中央政治局委员, cite: c02-wiki-chen-jining }
  turns:
    - date: 1998-03
      h: 留英博士回清华
      text: >-
        陈吉宁 1986 年清华土木与环境工程系本科毕业，后赴英国帝国理工学院读博士并留校做博士后、助理研究员。1998 年 3 月他回清华任环境工程系副主任，1999 年 7 月任系主任。The Diplomat 写道，陈吉宁和胡和平都是“protégés of Chen Xi at Tsinghua University”。
      did: >-
        在英国做了近十年研究后回国，回校第二年就当上系主任。
      who: [chen-xi]
      cites: [b15-cernet-2012-02-21-chen-jining-cv, f08-diplomat-2015-04-27-tsinghua]
    - date: 2006-02
      h: 当上清华校长
      text: >-
        2006 年 2 月他任清华副校长，同年参与解决东北松花江化学污染问题，2007 年任常务副校长，2012 年出任清华校长，是 1949 年以来最年轻的清华校长。联合早报写道：“有消息说，陈吉宁在清华大学工作时受到该校党委书记、现任中组部常务副部长陈希的欣赏。”
      did: >-
        以环境专家身份参与重大污染事件处置，在清华做到校长。
      who: [chen-xi]
      cites: [b15-cernet-2012-02-21-chen-jining-cv, b15-zaobao-2017-05-27-chen-mayor, c02-wiki-chen-jining]
    - date: 2015-02
      h: 最年轻的部长
      text: >-
        2015 年 1 月他接任环保部党组书记，2 月出任环境保护部部长，51 岁的他成为当时国务院各部委中最年轻的部长。上任第一次见媒体，他说已完整看过柴静的雾霾纪录片《穹顶之下》，并发短信向她表示感谢。
      did: >-
        从大学校长直接进部委当一把手，在雾霾成为全国话题时主管环保。
      who: []
      cites: [c02-wiki-chen-jining, b15-bjnews-2015-03-01-chen-chaijing, b15-bbc-2015-03-01-chen-chaijing]
    - date: 2017-05
      h: 北京市长到上海书记
      text: >-
        2017 年 5 月他调任北京市代市长，接替升任市委书记的蔡奇。联合早报分析说，他长期在学校工作，缺乏主政地方的行政经验。2022 年二十大他进入政治局，接替李强任上海市委书记。The Diplomat 早在 2015 年就认为他“is a good candidate for a senior position in the State Council and also a good candidate for a membership on the Politburo”。
      did: >-
        当了五年首都市长后进入政治局，主政上海。
      who: []
      cites: [c02-wiki-chen-jining, b15-zaobao-2017-05-27-chen-mayor, f08-diplomat-2015-04-27-tsinghua]
  can:
    text: >-
      学者转技术官僚：在一个专业领域做到国内顶尖，在大学管理岗位上证明组织能力，再以专家身份进入对口部委。陈吉宁的环境工程背景正好对上了雾霾治理成为全国议题的时候。
    cites: [b15-zaobao-2017-05-27-chen-mayor, c02-wiki-chen-jining]
  cannot:
    text: >-
      学不来的是清华这层关系：多家媒体都把他算作陈希在清华提携的人，而陈希是习近平的大学室友、后来的中组部长。没有地方经验却能当上首都市长、再进政治局，这在没有这层关系的学者官员身上很少见。
    cites: [f08-diplomat-2015-04-27-tsinghua, b15-zaobao-2017-05-27-chen-mayor]
  counter:
    - id: hu-heping
      name: 胡和平
      text: 同一批“清华新军”：在清华学习、任职 23 年，做到清华党委书记，此后历任浙江、陕西、中宣部和文旅部，是二十届中央委员，但没有进入政治局。
      cite: f08-caixin-2023-03-06-hu-heping

li-ganjie:
