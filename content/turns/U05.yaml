      text: >-
        2021 年 7 月他出任驻美大使，2022 年底升任外交部长，2023 年 3 月兼任国务委员。学者宋文笛说，他“在三个月内连升两级（从副部长到副国级）”，没有习近平的积极干预，至少也要习近平允许才能实现。2023 年 7 月他被免去外长职务，由王毅接任；此后又先后失去国务委员、人大代表和中央委员职务。官方从未说明原因，也没有宣布党纪处分，站内对他的状态记为下落不明。
