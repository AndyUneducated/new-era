      h: 北京刑警破大案
      text: >-
        他从北京市公安局普通侦查员做起，历任刑侦处大要案队队长、刑侦处副处长，参与侦破“1996年运钞车抢劫案”“1997年白宝山案”等大案；此后调任公安部刑侦局副局长，再回北京任市公安局副局长。
      did: >-
