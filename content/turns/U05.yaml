      text: >-
        2006 年 12 月，42 岁的他任国家环保总局副局长兼国家核安全局局长，2008 年环保部成立后任副部长，在这个位置上干了近十年。
      did: >-
        以核安全专家身份进入部级领导层。
      who: []
      cites: [b15-guancha-2020-07-21-li-ganjie-governor, b15-tsinghua-2007-01-11-li-ganjie]
