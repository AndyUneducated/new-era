    - { rung: county, date: 1986-01, post: 昌黎县委常委、组织部部长, cite: b17-xinhua-2015-05-26-liu-jinguo-cv }
    - { rung: bureau, date: 1992-07, post: 秦皇岛市委常委、公安局局长, cite: b17-xinhua-2015-05-26-liu-jinguo-cv }
    - { rung: vice, date: 2002-12, post: 河北省委常委、政法委书记, cite: b17-xinhua-2015-05-26-liu-jinguo-cv }
    - { rung: minister, date: 2014-01, post: 公安部党委副书记（正部级）, cite: b17-xinhua-2015-05-26-liu-jinguo-cv }
  turns:
    - date: 1976-12
      h: 从公社书记干起
      text: >-
        刘金国 1974 年高中毕业后回村任民兵连副连长，历任村党支部书记、公社党委副书记、书记；1976 年起任昌黎县槐李庄公社党委副书记、书记，1983 年进河北省委党校中青年干部培训班学习。
      did: >-
        在农村基层当了近十年公社干部，再进党校培训。
      who: []
      cites: [b17-chinanews-2014-10-25-liu-ccdi, b17-xinhua-2015-05-26-liu-jinguo-cv]
    - date: 1992-05
      h: 由区长转任公安局长
      text: >-
        他 1987 年任秦皇岛山海关区长，1991 年任秦皇岛市委秘书长，1992 年转任市公安局长并进市委常委，1995 年调河北省公安厅任副厅长，2001 年任省委政法委书记，2002 年进入省委常委。央视报道说，他调到省公安厅时，全部家当只有半卡车旧家具和一台黑白电视机。
      did: >-
        从地方党政岗位转入公安，在河北政法系统做到省委常委。
      who: []
      cites: [b17-xinhua-2015-05-26-liu-jinguo-cv, b17-cntv-2012-02-06-liu-touching-china]
    - date: 2010-07
      h: 火场指挥七小时
      text: >-
        2005 年他任公安部副部长，2008 年汶川地震时任公安部前线总指挥，央视称调集的公安救援力量从废墟中搜救出 8335 人。2010 年 7 月大连新港输油管线爆炸起火，他在火线前沿站着指挥了 8 个小时，对时任大连市公安局长王立科说：“我来到了这个火场，就没想活着回去。”2012 年他当选“感动中国”人物。
      did: >-
        在地震、大火等重大突发事件中亲临一线指挥，树起清廉实干的形象。
      who: []
      cites: [b17-cntv-2012-02-06-liu-touching-china, b17-chinanews-2014-10-25-liu-ccdi]
    - date: 2014-10
      h: 转任中纪委副书记
      text: >-
        2014 年 1 月他任公安部党委副书记（正部级），10 月当选中央纪委副书记，中新网称他是“近年来第二位政法系统出身的中纪委副书记”；他负责“猎狐”海外追逃。港媒传言他曾任周永康专案组副组长、组长是王岐山，并称他此前在公安部受到周永康人马排挤。
      did: >-
        从公安部转到中纪委，成为反腐和追逃的主要执行者之一。
      who: [wang-qishan]
      cites: [b17-xinhua-2015-05-26-liu-jinguo-cv, b17-chinanews-2014-10-25-liu-ccdi, b17-scmp-2014-11-08-liu-many-hats, b17-cbfau-2015-liu-wang-qishan]
  can:
    text: >-
      从基层一级一级干上来，在每个岗位上都有清楚的业绩；在重大突发事件里敢于到一线，清廉的口碑也让他在反腐时代成为合适人选。南华早报形容他有一份“squeaky-clean record”。
    cites: [b17-cntv-2012-02-06-liu-touching-china, b17-scmp-2014-11-08-liu-many-hats]
  cannot:
    text: >-
      港媒称他没有什么政治背景和靠山，在公安部副部长中排名长期靠后；他转到中纪委，正赶上十八大后反腐需要政法出身、形象干净的执行者。这样的时代需求不是个人能安排的，靠清廉和苦干本身未必能升到这一步。
    cites: [b17-cbfau-2015-liu-wang-qishan, b17-chinanews-2014-10-25-liu-ccdi]
  counter:
    - id: fu-zhenghua
      name: 傅政华
      text: 同样是公安出身、同样在公安部党委副书记位置上（2015 年接替刘金国），傅政华 2022 年以受贿、徇私枉法罪被判死缓并终身监禁。
      cite: c03-xinhua-2022-09-22-fu-zhenghua-verdict

lu-wei:
  routes: [media, crisis]
  rungs:
    - { rung: bureau, date: 1994-06, post: 新华社广西分社副社长, cite: c03-ccdi-2017-11-21-lu-wei-probe }
    - { rung: vice, date: 2004-05, post: 新华社副社长, cite: c03-ccdi-2017-11-21-lu-wei-probe }
  turns:
    - date: 1980
      h: 从工人到记者
      text: >-
        鲁炜生于安徽巢湖农村，中学毕业后下乡，回乡当过代课老师、民办教师。1980 年他顶班到桂林风动工具厂，从机械工人做到宣传干事，后调桂林市中级人民法院当书记员，又成为《广西法制报》记者，其间拿到广西广播电视大学的中文专业文凭。
      did: >-
        没有正规大学学历，靠写稿从工厂宣传干事一路转到报社记者。
      who: []
      cites: [b12-bbc-2018-07-30-lu-wei, c03-ccdi-2017-11-21-lu-wei-probe]
    - date: 1991-04
      h: 新华社最年轻局级
      text: >-
        1991 年他任新华社桂林记者站站长。BBC 写道，他“一年多发稿500多篇，平均每天一篇”，1992 年被评为新华社十大杰出人才之一；桂林空难后，他带队第一时间赶到现场，刊发辟谣稿件，“受到中央领导的赞扬”。1994 年他任广西分社副社长，1997 年任社长，“成为当时新华社最年轻的正司局级干部”。
      did: >-
        靠高产和一次突发事件报道在新华社出名，六年里从记者站站长升到分社社长。
      who: []
      cites: [b12-bbc-2018-07-30-lu-wei, c03-ccdi-2017-11-21-lu-wei-probe]
    - date: 2011-03
      h: 进京管宣传和网络
      text: >-
        2001 年他调新华社总社任副秘书长、秘书长，2004 年任副社长；2011 年任北京市委常委、宣传部长，2013 年 4 月出任国家互联网信息办公室主任，次年兼任中宣部副部长。BBC 写道，他与“大V”座谈并达成坚守“七条底线”的共识，随后薛蛮子被拘、方舟子被封号；纽约时报中文网说他成了中国“愈发强硬的互联网管控的象征”。
      did: >-
        从新闻机构的管理者转为互联网管控的主事人，主导整治网络大V、创办世界互联网大会。
      who: []
      cites: [c03-ccdi-2017-11-21-lu-wei-probe, b12-bbc-2017-11-22-lu-wei, b12-bbc-2018-07-30-lu-wei, b12-nytcn-2017-11-22-lu-wei]
    - date: 2016-06
      h: 调离网信办后落马
      text: >-
        2016 年 6 月他调离网信办，只保留中宣部副部长职务；2017 年 11 月被宣布接受审查，是十九大后落马的首位正部级官员。2019 年 3 月他以受贿罪被判处有期徒刑十四年，法院认定受贿发生在他任新华社、北京市和网信办领导期间。
      did: >-
        离开实权位置一年多后落马。
      who: []
      cites: [b12-bbc-2017-11-22-lu-wei, c03-xinhua-2019-03-26-lu-wei-verdict]
  can:
    text: >-
      媒体系统的路：在新闻一线靠勤奋和突发事件报道出名，再转做新闻单位的管理，进而进入宣传口。鲁炜没有正规大学学历，这条路在当时的新华社是可以走通的。
    cites: [b12-bbc-2018-07-30-lu-wei]
  cannot:
    text: >-
      靠“受到中央领导的赞扬”的机会出头，本身就是不可复制的时机；后来他在网信办手握大权、风格张扬，BBC 称他“善于塑造形象”，而判决显示他从 2002 年起就利用职务收钱。权力越集中、形象越鲜明，出事后的落差也越大。
    cites: [b12-bbc-2018-07-30-lu-wei, c03-xinhua-2019-03-26-lu-wei-verdict]

lai-xiaomin:
  routes: [finance, patron, secretary]
  rungs: []
  turns:
    - date: 1983-07
      h: 被挑进人民银行总行
      text: >-
        赖小民是江西瑞金人。《金融世界》写道，江西财经学院当时是人民银行直属院校，人民银行从该届学生中“挑选了2名毕业生，直接进入总行，赖小民便是其中之一”。他在人行系统“24岁出任中央资金处副处长，34岁升任信贷管理司副司长”。
      did: >-
        大学毕业直接进央行总行，在计划资金、信贷管理部门升得很快。
      who: []
      cites: [u05-cnfin-2013-11-14-lai-xiaomin, c03-ccdi-2018-04-17-lai-xiaomin-probe, b12-sina-2020-01-13-national-supervision-ep2]
    - date: 2003
      h: 跟刘明康去银监会
      text: >-
        2003 年银监会组建，他到银监会任银行监管二部副局级干部，后任北京监管局筹备组组长、北京银监局局长，再任银监会办公厅主任、首席新闻发言人。看中国（传闻）称，他在央行两次关键晋升与时任副行长陈元有关，到银监会后被刘明康重用，成为“刘明康的大秘”。
      did: >-
        进入新成立的银监会，先当地方监管局长，再回会里当办公厅主任。
      who: [liu-mingkang]
      cites: [c03-ccdi-2018-04-17-lai-xiaomin-probe, u05-secretchina-2021-01-20-lai-patron]
    - date: 2009-01
      h: 被动员去华融
      text: >-
        2009 年 1 月他任中国华融资产管理公司总裁。每日经济新闻引述他的话说，直到银监会主席刘明康和主管副主席“找他谈了4次”他才接受；他说自己“当了10年的厅局级干部了，我想在仕途上一直走下去”，而当时华融 32 个分公司中有 25 个严重亏损。2012 年他任华融董事长。
      did: >-
        从监管机关转到一家亏损的资产管理公司当一把手，开始大规模扩张。
      who: [liu-mingkang]
      cites: [u05-nbd-2018-04-17-lai-xiaomin, b12-hkcd-2018-08-12-lai-cash]
    - date: 2018-04
      h: 扩张后落马
      text: >-
        华融在他手里发展成拥有银行、证券、信托等全牌照的金融集团。华融国际原总经理白天辉对央视说：“他往上升的话肯定需要业绩”，只要短期把规模和利润做出来，长期风险他不管。2018 年 4 月他被查，办案人员在其房产中搜出 2.7 亿元现金；2021 年 1 月他以受贿、贪污、重婚罪被判处死刑，当月执行。
      did: >-
        把一家坏账公司做成金融巨头，用业绩换升迁，最终以受贿 17 亿余元被判死刑。
      who: []
      cites: [b12-sina-2020-01-13-national-supervision-ep2, b12-hkcd-2018-08-12-lai-cash, c03-xinhua-2021-01-29-lai-xiaomin-executed]
  can:
    text: >-
      金融监管干部的路：名校毕业直接进中央金融机关，在业务部门做得出色，被领导选去筹建新机构、当办公厅主任，再被派去执掌金融企业。
    cites: [u05-cnfin-2013-11-14-lai-xiaomin, c03-ccdi-2018-04-17-lai-xiaomin-probe]
  cannot:
    text: >-
      这条路依赖一两位上级的赏识（传闻称是陈元、刘明康）；到企业以后，升迁取决于“业绩”，而金融企业的业绩可以靠激进扩张在短期做出来，风险留给以后。央视专题片里，下属的话是“老赖一支笔说了算”，监督完全失效。
    cites: [u05-secretchina-2021-01-20-lai-patron, b12-sina-2020-01-13-national-supervision-ep2]

sun-lijun:
  routes: [secretary, law, patron]
  rungs: []
  turns:
    - date: 2001
      h: 父亲托关系进卫生局
      text: >-
        孙力军 1969 年生于青岛，在澳大利亚新南威尔士大学取得公共卫生硕士。中央纪委专题片说，他大学毕业后先跟温州商人倒卖钢材，“后来，他父亲找关系，将他安排到卫生部门工作”；他在上海市卫生局外事处、上海市外办任职，2001 年起就与医药商人合作牟利。
      did: >-
        靠家里的关系进入上海卫生系统，从外事岗位起步。
      who: []
      cites: [b12-bbc-2020-04-20-sun-lijun, b12-xinhua-2022-01-15-zero-tolerance-ep1, c03-xinhua-2022-09-23-sun-lijun-verdict]
    - date: 2008
      h: 给公安部长当秘书
      text: >-
        他从上海外办调到公安部任办公厅副主任，BBC 说他曾任孟建柱的秘书。调京时间各方说法不一：中央纪委专题片说是 2008 年，联合早报说是 2010 年。王立科说 2008 年下半年认识他时，觉得他“是公安部领导，很年轻”。
      did: >-
        从地方外事干部跨系统进入公安部机关，在部长身边工作。
      who: [meng-jianzhu]
      cites: [b12-bbc-2020-04-20-sun-lijun, b12-zaobao-2020-04-21-sun-lijun, b12-xinhua-2022-01-15-zero-tolerance-ep1]
    - date: 2018-03
      h: 最年轻的副部长
      text: >-
        此后他任公安部一局（国内安全保卫局）局长、二十六局局长、港澳台办主任，2016 年任公安部党委委员，2018 年 3 月任副部长，自恃是公安部“最年轻的党委委员、副部长”。专题片说他运作提拔龚道安、邓恢林、刘新云等人，收受王立科巨额财物并帮其升任江苏省委常委，还给自己定下“十五年规划”，争取五年上一个台阶。
      did: >-
        十年里从办公厅副主任升到副部长，同时培植了一个跨省的“小圈子”。
      who: []
      cites: [b12-zaobao-2020-04-21-sun-lijun, b12-xinhua-2022-01-15-zero-tolerance-ep1]
    - date: 2020-04
      h: 武汉督导后被查
      text: >-
        2020 年 2 月他作为中央指导组成员赴武汉督导疫情防控，4 月被宣布审查。公安部将他与周永康、孟宏伟并列，要“肃清”其“流毒影响”。2022 年 9 月他以受贿、操纵证券市场、非法持有枪支罪被判死缓、终身监禁，受贿 6.46 亿余元。
      did: >-
        在仕途上升期突然落马，团伙中多名省部级干部一并被查。
      who: []
      cites: [b12-bbc-2020-04-20-sun-lijun, c03-xinhua-2022-09-23-sun-lijun-verdict]
  can:
    text: >-
      部长秘书是进入核心机关的捷径：在部长身边工作，熟悉全局，之后再到要害业务局任局长，几年内就能进入部党委。
    cites: [b12-bbc-2020-04-20-sun-lijun, b12-zaobao-2020-04-21-sun-lijun]
  cannot:
    text: >-
      他的起点是父亲托的关系，跨系统进公安部靠的是在部长身边的位置；他后来的上升又靠拉帮结派、权钱交换。官方专题片称这是“十九大以来我们查处的最严重的案件之一”。这条路的每一步都依赖人身关系，靠山与“小圈子”最终也成了他的罪状。
    cites: [b12-xinhua-2022-01-15-zero-tolerance-ep1]
  counter:
    - id: wang-xiaohong
      name: 王小洪
      text: 同期的公安部副部长，2018 年起任常务副部长，2022 年接任公安部长。他从县级公安局一级级干上来，没有部长秘书经历。
      cite: b17-fznews-2022-06-28-wang-xiaohong-cv

