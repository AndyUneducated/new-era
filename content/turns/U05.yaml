      did: >-
        在新一轮反腐中替最高层办大案，升到正部级、做司法部长，退休后一年多落马。
      who: [xi-jinping]
      cites: [b12-bbc-2021-10-03-fu-zhenghua, b12-voa-2021-10-02-fu-zhenghua, c03-xinhua-2022-09-22-fu-zhenghua-verdict]
  can:
    text: >-
      政法业务干部的路：在刑侦一线办出成绩，在首都公安局长这种高曝光岗位上做出“看得见”的行动，再在重大专案里承担任务，这是公安口晋升的常见途径。
    cites: [b12-bbc-2021-10-03-fu-zhenghua]
  cannot:
    text: >-
      官方专题片把他的晋升归于孙力军的“运作”，境外媒体则强调他为最高层办周永康案；两种叙述都说明，他的上升高度依赖人身关系和专案时机。这条路的风险也写在判决里：所犯受贿、徇私枉法的罪行，就发生在这些任上。
    cites: [b12-chinanews-2023-01-07-bugle-ep1, b12-bbc-2021-10-03-fu-zhenghua, c03-xinhua-2022-09-22-fu-zhenghua-verdict]
