      text: >-
        2016 年 10 月他外放河北任省委副书记，2017 年 6 月回京任环保部长，2020 年任山东省长、次年任山东省委书记，2022 年二十大进入政治局并接替陈希任中组部长。自由亚洲电台写道，他在担任环保部长期间被习近平指定“抓紧培养”；亚洲协会的报告说，陈希是“清华新军”的教父式人物，“now with Li serving as his lieutenant”。
