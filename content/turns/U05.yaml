    - date: 2001
      h: 三省书记到副国级
      text: >-
        2001 年他任青海省委书记，2003 年调甘肃，2006 年任中央党校副校长（正部长级），2007 年任江西省委书记，2013 年 3 月当选全国政协副主席并继续兼任江西省委书记。BBC 说他曾被视为中国政坛的一位明星人物。2014 年 6 月他被调查，成为十八大后落马的首位副国级官员，2017 年 1 月被判处无期徒刑。
      did: >-
        先后主政三个省，最后在江西书记任上升为国家领导人，一年多后落马。
      who: []
      cites: [b12-xinhua-2013-03-11-su-rong-resume, b12-bbc-2014-06-25-su-rong, c03-people-2017-01-23-su-rong-verdict]
  can:
    text: >-
      基层一路干上来的“台阶型”干部：大队、公社、县、地、省，每一级都当过一把手，资历完整，是那个年代提拔干部的标准样子。
    cites: [b12-xinhua-2013-03-11-su-rong-resume]
  cannot:
    text: >-
      完整的台阶不等于有人监督。新华社的警示文章说，江西干部感叹他的问题“上级发现不了、同级不敢监督、下级不敢抵制”，苏荣自己在忏悔录里写“我家成了‘权钱交易所’”。他靠什么在省委书记任上连任、升至副国级，公开材料没有交代；自由亚洲电台的受访者认为他与周永康势力有关，这只是一家之言。
    cites: [b12-xinhua-2015-05-29-su-rong-warning, b12-rfa-2014-06-15-su-rong]
