      cites: [b15-guancha-2020-07-21-li-ganjie-governor, f02-rfa-2023-02-13-jungong, f01-asiasociety-tsinghua]
  can:
    text: >-
      专业监管干部的路：在一个技术性很强的领域（核安全）从工程师做到局长，中间有基层挂职、驻外经历，再从副部长转为部长、到地方主政，层级一级不落。
