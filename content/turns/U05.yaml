# U05 上位之路：二十届政治局委员与几位落马者。
wang-xiaohong:
  routes: [patron, law]
  rungs:
    - { rung: county, date: 1993-08, post: 福州市公安局副局长, cite: b17-fznews-2022-06-28-wang-xiaohong-cv }
    - { rung: bureau, date: 1998-02, post: 福州市公安局局长（副厅级）, cite: b17-fznews-2022-06-28-wang-xiaohong-cv }
    - { rung: vice, date: 2014-12, post: 河南省副省长, cite: b17-fznews-2022-06-28-wang-xiaohong-cv }
    - { rung: minister, date: 2018-03, post: 公安部常务副部长（正部长级）, cite: b17-fznews-2022-06-28-wang-xiaohong-cv }
  turns:
    - date: 1989-01
      h: 在福州当公安分局长
      text: >-
        王小洪 1974 年在闽侯县插队，后进入公安系统，1984 年任闽侯县公安局副局长，1989 年任局长兼福州市公安局郊区分局局长，1993 年升任福州市公安局副局长。The Diplomat 写道，习近平出任福州市委书记后，王小洪被调到福州任市公安局郊区分局局长，随后升任市局副局长、局长；维基百科也记载他这段时间在时任福州市委书记习近平领导下工作。
      did: >-
        在习近平主政福州的那几年，他是这座城市的公安干部，从郊区分局一路做到市局副局长。
      who: [xi-jinping]
      cites: [b17-fznews-2022-06-28-wang-xiaohong-cv, b17-diplomat-2015-04-fujian-clique, c02-wiki-wang-xiaohong]
    - date: 1998-02
      h: 副厅级上停十五年
      text: >-
        1998 年他任福州市公安局局长（副厅级），此后历任漳州市公安局长、福建省公安厅副厅长、厦门市副市长兼公安局长。The Diplomat 认为他的仕途在习近平离开福州后停滞：“He obtained the rank of deputy department head in 1998 but remained at that level for 15 years.”
      did: >-
        在副厅级上干了十五年，在福建省内几个城市和省厅的公安岗位之间平调。
      who: []
      cites: [b17-fznews-2022-06-28-wang-xiaohong-cv, b17-diplomat-2015-04-fujian-clique]
    - date: 2013-08
      h: 一年半升到副部
      text: >-
        习近平 2012 年底任总书记后，2013 年 8 月王小洪被调出福建，任河南省长助理、公安厅长，2014 年 12 月任河南副省长，2015 年 3 月调任北京市副市长、市公安局长，前任北京市公安局长傅政华同月升任公安部党委副书记。The Diplomat 写道：“In one and a half years, he has been promoted from an official of deputy department head level to one of vice-ministerial level.”
      did: >-
        第一次离开福建，一年半里从副厅级升到副部级，接手首都公安局。
      who: [xi-jinping]
      cites: [b17-fznews-2022-06-28-wang-xiaohong-cv, b17-diplomat-2015-04-fujian-clique, b12-bbc-2021-10-03-fu-zhenghua]
    - date: 2022-06
      h: 执掌公安部
      text: >-
        2016 年 5 月他任公安部副部长，2018 年 3 月任常务副部长（正部长级），2022 年 6 月任公安部部长，同年进入二十届中央书记处，2023 年 3 月任国务委员。维基百科称他是 1998 年以来首位有公安背景的公安部长；自由亚洲电台评论说，“王小洪是中共总书记习近平的福州旧部”，任命被认为是习近平握紧“刀把子”。
      did: >-
        从常务副部长接任部长，成为二十多年来第一位公安出身的公安部长，又进入书记处。
      who: [xi-jinping]
      cites: [b17-fznews-2022-06-28-wang-xiaohong-cv, c02-wiki-wang-xiaohong, c02-rfa-2022-06-24-wang-xiaohong, b08-xinhua-2023-03-13-state-councilor-cv]
  can:
    text: >-
      在县、市公安局里干了几十年的业务干部，履历扎实、从未离开公安口，这是他后来能接手北京和全国公安的底子；跨省任职、先到河南再进北京的安排，也是常见的“先补履历再重用”的做法。
    cites: [b17-fznews-2022-06-28-wang-xiaohong-cv, b17-diplomat-2015-04-fujian-clique]
  cannot:
    text: >-
      学不来的是那段交集本身：他在福州任职恰逢习近平主政福州。习离开后他十五年没升级，习掌权后一年半升到副部，这条曲线几乎完全跟着一位领导人的仕途走。台湾上报把两人的关系称作“從福建開始建立的35年交情”。这样的路高度依赖一位庇护者，个人无法安排，也难以复制。
    cites: [b17-diplomat-2015-04-fujian-clique, b17-upmedia-2025-05-22-wang-drug-tsar]
  counter:
    - id: fu-zhenghua
      name: 傅政华
      text: 在北京市公安局长、公安部副部长这两个位置上，傅政华都走在王小洪前面，2018 年转任司法部长；2022 年他以受贿罪、徇私枉法罪被判死缓并终身监禁，所犯罪行就发生在这些任上。
      cite: c03-xinhua-2022-09-22-fu-zhenghua-verdict
  deep: true

ling-jihua:
  routes: [secretary, office, youth, staff, patron]
  rungs:
    - { rung: vice, date: 1999, post: 中央办公厅副主任、调研室主任, cite: u05-beijingreview-2007-10-23-ling-cv }
    - { rung: minister, date: 2003, post: 中央办公厅副主任（主持常务工作，正部长级）, cite: u05-beijingreview-2007-10-23-ling-cv }
  turns:
    - date: 1979
      h: 团中央写材料十五年
      text: >-
        令计划早年在山西平陆县团委工作，任团县委副书记，1979 年调入团中央宣传部，此后历任宣传部副处长、书记处办公室主任、办公厅副主任、《中国共青团》主编、宣传部部长。新浪报道说，当时他的领导和同事有胡锦涛、李克强、刘延东、李源潮等，“令计划以精干、擅长写研究报告而颇受信任和赏识”。
      did: >-
        在团中央机关做了十五年宣传和办公室工作，以写材料、办事得力被领导记住。
      who: [hu-jintao]
      cites: [u05-sina-2007-10-23-ling-secretariat, u05-voa-2007-09-20-ling-gob]
    - date: 1995
      h: 被调进中央办公厅
      text: >-
        新京报写道，令计划“在共青团中央工作16年后，于1995年进入中央办公厅”，从调研室三组负责人做起。美国之音说得更直接：“胡锦涛1995把令计划调到身边”。
      did: >-
        离开团中央，进入中央办公厅调研室，开始在胡锦涛身边工作。
      who: [hu-jintao]
      cites: [b07-bjnews-2014-12-22-ling-resume, u05-voa-2007-09-20-ling-gob, u05-beijingreview-2007-10-23-ling-cv]
    - date: 1999
      h: 从办公室主任到中办主任
      text: >-
        据美国之音，令计划 1998 年出任胡锦涛办公室主任，1999 年底升任中办副主任。新华社简历记载，他 2003 年起主持中办常务工作（正部长级），2007 年任中央书记处书记、中办主任（美国之音记为 2004 年升任常务副主任）。新浪称外电评价他是胡锦涛的“首席高参”；纽约时报中文网援引官员说，“令计划打的电话就相当于胡锦涛的电话”。
      did: >-
        从总书记的办公室主任做到中办主任、书记处书记，成为总书记身边最亲近的大管家。
      who: [hu-jintao]
      cites: [u05-voa-2007-09-20-ling-gob, u05-beijingreview-2007-10-23-ling-cv, u05-sina-2007-10-23-ling-secretariat, c05-nytcn-2012-12-05-ling-gu]
    - date: 2012-09
      h: 车祸后转任统战部
      text: >-
        其子驾驶法拉利车祸身亡一事被中央领导层定为重大丑闻。BBC 援引一位退休高官说，因此令计划不能得到晋升，“胡锦涛也无能为力”。2012 年 9 月他离开中办，改任中央统战部部长，十八大没有进入政治局；2014 年 12 月被调查，2016 年 7 月以受贿、非法获取国家秘密、滥用职权罪被判处无期徒刑。
      did: >-
        十八大前夕离开中办，晋升之路就此断掉，两年后落马。
      who: [hu-jintao]
      cites: [c10-bbc-2012-09-03-ling-ferrari, b07-bjnews-2014-12-22-ling-resume, b07-court-2016-07-04-ling-sentence]
  can:
    text: >-
      秘书路线：在机关里靠写材料和办事能力被领导看中，跟着领导进入核心机关，再在领导任内升到正部级。令计划在团中央十五年、中办十七年，每一步都在文字和办公室岗位上做出来，这部分功夫是真实的。
    cites: [u05-sina-2007-10-23-ling-secretariat, u05-beijingreview-2007-10-23-ling-cv]
  cannot:
    text: >-
      学不来、也最危险的是：这条路的全部高度来自一位领导的信任。领导任期结束时，秘书出身的人往往还没有独立主政过一个地方或部门；纽约时报中文网的报道里也有人评价他“这个人不具备进入政治局的资格”。一旦出事，原来的庇护者也保不住他。
    cites: [c05-nytcn-2012-12-05-ling-gu, c10-bbc-2012-09-03-ling-ferrari]
  counter:
    - id: zeng-qinghong
      name: 曾庆红
      text: 同样走中央办公厅这条路：1993 年起任中办主任，2002 年进入政治局常委、书记处书记，是这条路走到顶的例子。
      cite: b01-cpc-zeng-resume
  deep: true

sun-zhengcai:
  routes: [scholar, technocrat, patron, office]
  rungs:
    - { rung: bureau, date: 1994, post: 北京市农林科学院副院长, cite: b07-mj-2012-11-16-sun-resume }
    - { rung: vice, date: 2002, post: 北京市委常委、顺义区委书记, cite: b07-mj-2012-11-16-sun-resume }
    - { rung: minister, date: 2006-12, post: 农业部部长, cite: u05-ifeng-2006-12-19-sun-minister }
    - { rung: pb, date: 2012-11, post: 中央政治局委员, cite: b07-mj-2012-11-16-sun-resume }
  turns:
    - date: 1984
      h: 玉米专家当上院长
      text: >-
        孙政才 1984 年从山东莱阳农学院毕业，考入北京农林科学院，师从玉米栽培专家陈国平，后获中国农大农学博士。他 1987 年起任玉米研究室副主任（其间赴英国洛桑实验站进修），1993 年任土肥所所长，1994 年任农林科学院副院长，1995 年任常务副院长主持工作。新华网称他是“北京市农林科学院的甜玉米专家”。
      did: >-
        从科研岗位做起，三十出头就成为北京一家局级科研院所的负责人。
      who: []
      cites: [b07-mj-2012-11-16-sun-resume, u05-ifeng-2006-12-19-sun-minister]
    - date: 1997
      h: 下派顺义当县长
      text: >-
        1997 年他任顺义县代县长、县长，此后任区委书记，2002 年进入北京市委常委。纽约时报援引李成等分析人士说，孙政才是贾庆林的门生，贾庆林和江泽民关系亲密。
      did: >-
        从科研单位转到京郊区县主政五年，补上地方经验后进入北京市委班子。
      who: [jia-qinglin]
      cites: [b07-mj-2012-11-16-sun-resume, b07-nyt-2012-11-26-leaders]
    - date: 2006-12
      h: 四十三岁当农业部长
      text: >-
        他 2002 年起任北京市委秘书长，2006 年 12 月出任农业部党组书记、部长。新华网当时写道，他和胡春华都生于 1963 年，“孙政才是目前中国最年轻的正部级干部”，并评论说这“充分显示，中央在用人方面已开始侧重学者型官员”。纽约时报还提到，也有人说温家宝可能是他另一位庇护人。
      did: >-
        带着农学背景回到农业领域，以全国最年轻正部级干部的身份进入梯队。
      who: [wen-jiabao]
      cites: [u05-ifeng-2006-12-19-sun-minister, b07-mj-2012-11-16-sun-resume, b07-nyt-2012-11-26-leaders]
    - date: 2012-11
      h: 进政治局后落马
      text: >-
        2009 年他任吉林省委书记，2012 年十八大进入政治局，随后任重庆市委书记，和胡春华一起被视为政治新星。2017 年 7 月他被免职调查，纽约时报引述的评论说“孙政才是个牺牲品，这是向全党发出的信息”；2018 年 5 月以受贿罪被判处无期徒刑。
      did: >-
        49 岁进政治局，被外界视为接班人选之一，五年后在十九大前落马。
      who: []
      cites: [b07-mj-2012-11-16-sun-resume, b09-cna-2022-10-23-hu-chunhua, b07-nyt-2017-07-24-sun-fall, b07-xinhua-2018-05-08-sun-sentence]
  can:
    text: >-
      专业起家、在科研单位早早当上负责人，再下派区县补地方经验，然后进部委、主政省份，这是八九十年代“学者型官员”的标准通道。专业能力和年轻是这条路上真实的资本。
    cites: [b07-mj-2012-11-16-sun-resume, u05-ifeng-2006-12-19-sun-minister]
  cannot:
    text: >-
      学不来的是年龄窗口和时代：他赶上了中央集中提拔 60 后学者型官员的时期。外界认为他身后有贾庆林、温家宝等不同庇护人，可庇护人一旦退出、高层格局一变，年轻的接班人选反而最先被推到风口上。
    cites: [u05-ifeng-2006-12-19-sun-minister, b07-nyt-2012-11-26-leaders, b07-nyt-2017-07-24-sun-fall]
  counter:
    - id: hu-chunhua
      name: 胡春华
      text: 同样生于 1963 年、2012 年和孙政才同进政治局的政治新星。他走的是团中央和边疆路线，没有落马，但 2022 年二十大未能连任政治局委员。
      cite: b09-cna-2022-10-23-hu-chunhua
  deep: true

yuan-jiajun:
  routes: [industry, soe, technocrat]
  rungs:
    - { rung: vice, date: 2012-03, post: 宁夏回族自治区党委常委, cite: b15-cctv-2020-12-01-yuan-jiajun-cv }
    - { rung: minister, date: 2017-04, post: 浙江省代省长, cite: b15-cctv-2020-12-01-yuan-jiajun-cv }
    - { rung: pb, date: 2022-10, post: 中央政治局委员, cite: b08-wikisource-2022-10-23-20-1-plenum }
  turns:
    - date: 1995-05
      h: 三十三岁进飞船指挥线
      text: >-
        袁家军 1987 年从北京航空学院研究生毕业，进入航天部五院 501 部做技术工作。1995 年 5 月他任五院院长助理兼神舟一号飞船常务副总指挥，1996 年任五院副院长。
      did: >-
        在航天科研单位从技术岗做起，三十出头进入载人飞船工程的指挥层。
      who: []
      cites: [b15-cctv-2020-12-01-yuan-jiajun-cv]
    - date: 1999-11
      h: 神舟一号成名
      text: >-
        联合早报写道：“1999年11月，神舟一号顺利完成中国载人航天工程的首次飞行，当时只有37岁的袁家军名声大噪”。2003 年他任五院院长，并担任神舟二号至五号飞船总指挥，其中包括中国首次载人飞行。
      did: >-
        作为飞船总指挥参与了载人航天的首飞和首次载人飞行，成为航天系最受瞩目的年轻干部。
      who: []
      cites: [b15-zaobao-2020-09-01-jungong-zj-ln, b15-cctv-2020-12-01-yuan-jiajun-cv]
    - date: 2012-03
      h: 从航天转去宁夏
      text: >-
        2007 年他任航天科技集团副总经理，2012 年 3 月调任宁夏回族自治区党委常委，2014 年 8 月调浙江任常务副省长。中新网的官方解读说：“央企领导到地方担任重要职务，体现了组织对该央企的肯定和对干部本人的充分信任。”联合早报的评论认为，提拔“军工系”官员“一方面是对军工成就的褒奖，另一方面也是要为政坛注入更多新风气”。
      did: >-
        50 岁离开央企进入地方党委班子，从头补地方工作经验。
      who: []
      cites: [b15-cctv-2020-12-01-yuan-jiajun-cv, f08-chinanews-2017-02-07-jungong, b15-zaobao-2020-09-01-jungong-zj-ln]
    - date: 2017-04
      h: 在浙江做到书记
      text: >-
        2017 年 4 月他任浙江代省长，2020 年 8 月任浙江省委书记，2022 年二十大进入政治局，随后调任重庆市委书记。南华早报报道他出任浙江代省长时特别提到，浙江是“the power base of President Xi Jinping”；詹姆斯敦基金会在二十大前也把他列为有力竞争者。
      did: >-
        在习近平曾主政的浙江干了八年，从常务副省长做到省委书记，二十大进入政治局。
      who: []
      cites: [b15-cctv-2020-12-01-yuan-jiajun-cv, b15-scmp-2017-05-04-aerospace-elite, b15-jamestown-2022-20th-leadership, f02-rfa-2023-02-13-jungong]
  can:
    text: >-
      航天军工路：在国家重点工程里做出公认的成绩，再被组织当作“技术型”干部派到地方，靠工程管理的履历获得信任；地方任职从常委、常务副省长做起，按部就班补齐主政经验。
    cites: [b15-cctv-2020-12-01-yuan-jiajun-cv, f08-chinanews-2017-02-07-jungong]
  cannot:
    text: >-
      时代窗口学不来：二十大前后中央集中提拔军工航天干部，境外媒体甚至有“军工五人帮”的说法；载人航天首飞这样的全国级成名机会，一代人只有少数几个。同一系统出身也意味着同一系统的风险：BBC 报道，此后军工央企系统反腐，与他同期出身航天科技集团的马兴瑞在 2026 年落马。
