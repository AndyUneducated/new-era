# 上位之路 U08：31 个省级行政区现任政府一把手（省长、市长、自治区主席）。字段见 src/data/schema.ts 的 TurnRecordSchema。
yin-yong:
  routes: [finance, technocrat]
  rungs:
    - { rung: county, date: 2001-03, post: 中国投资公司（新加坡）总经理（正处级）, cite: u08-sina-2023-01-30-yin-yong }
    - { rung: bureau, date: 2002-07, post: 国家外汇管理局储备管理司副司长, cite: u08-sina-2023-01-30-yin-yong }
    - { rung: vice, date: 2016-12, post: 中国人民银行副行长, cite: u08-sina-2023-01-30-yin-yong }
    - { rung: minister, date: 2022-10, post: 北京市代市长, cite: k06-wiki-yin-yong }
  turns:
    - date: 2003
      h: 被总理称作娃娃
      text: >-
        殷勇1992年从清华大学自动化系转入经济管理学院直读博士，1996年进入国家外汇管理局，从事外汇储备的经营管理。他在2014年清华经管学院博士校友会上发言回忆，2003年时任总理朱镕基到储备管理司视察，同他握手后对陪同的领导说：“他们都是些娃娃。”那一年他33岁，已是储备管理司副司长。
      did: >-
        博士一毕业就进了管国家外汇储备的业务部门，三十出头已是副司长，年轻到让来视察的总理都注意到了。
      who: [zhu-rongji]
      cites: [u08-tsinghua-2014-05-06-yin-yong-speech, u08-sina-2023-01-30-yin-yong]
    - date: 2007-08
      h: 管外汇储备八年
      text: >-
        2007年8月，37岁的殷勇任国家外汇管理局中央外汇业务中心主任（副局级），新浪财经称他由此被称为中国外汇储备掌门人。2018年北京市政府提请任命他为副市长时，副市长卢彦所作的说明写道，他在欧债危机等重大市场波动中“及时启动危机应对机制，适时收紧风险政策”，并称他“熟悉外汇、储备、经营管理工作，业务能力突出”。
      did: >-
        在一个专业岗位上连续管了八年外汇储备，扛过了欧债危机这样的市场大考，这段成绩后来被直接写进了提拔说明。
      who: []
      cites: [u08-sina-2023-01-30-yin-yong, u08-sina-2018-01-19-yin-yong, u08-xinhua-2018-01-19-yin-yong]
    - date: 2015-08
      h: 一年多两次提拔
      text: >-
        2015年8月殷勇调任中国人民银行行长助理，成为行长周小川的助手；2016年12月升任央行副行长，维基百科称他以47岁打破了最年轻央行副行长的纪录。新浪财经转引一位接近他的人士的说法：“其在一年多时间两次被提拔，业务精湛是主要原因之一。”同一篇报道提到，殷勇和周小川都是清华大学郑维敏教授的学生；2013年清华经管学院博士校友会成立，首任会长是时任央行副行长刘士余，殷勇任副会长。
      did: >-
        从外汇局进入央行领导层，在行长身边做助手，一年多里连升两级。
      who: [zhou-xiaochuan, liu-shiyu]
      cites: [k06-wiki-yin-yong, u08-sina-2018-01-19-yin-yong]
    - date: 2018-01
      h: 从央行到北京
      text: >-
        2018年1月殷勇转任北京市副市长，同年12月进入市委常委会。新浪财经称，他是首位省部级“金融副书记”，2018年出任副市长时未满49岁，是当时北京市政府最年轻的领导班子成员。2022年6月他升任北京市委副书记，10月二十大当选中央委员，月底接替调往上海的陈吉宁任代市长，2023年1月当选市长。
      did: >-
        从金融监管部门转到地方政府，先当分管副市长，再进常委、任副书记，一级一级补齐了地方主政的经历。
      who: [chen-jining]
      cites: [u08-sina-2023-01-30-yin-yong, k06-wiki-yin-yong]
  can:
    text: >-
      能学的是把一门专业做深：博士毕业后在外汇储备岗位上干了近二十年，危机中的处置有据可查，提拔时组织给出的理由也是业务能力突出。
    cites: [u08-xinhua-2018-01-19-yin-yong, u08-sina-2018-01-19-yin-yong]
  cannot:
    text: >-
      学不来的是起点和时机：清华直博，与后来的央行行长同出一位导师门下，又赶上中国外汇储备从严重不足到稳居全球第一的扩张期。这样的平台和机会，普通人很难复制。
    cites: [u08-sina-2018-01-19-yin-yong, u08-sina-2023-01-30-yin-yong]
  counter:
    - id: fan-yifei
      name: 范一飞
      text: 同样从金融系统做到中国人民银行副行长；2024年被黄冈中院以受贿罪判处死缓并终身监禁，法院认定他1993年至2022年受贿3.86亿余元。
      cite: t02-xinhua-2024-10-10-fan-yifei-verdict
    - id: liu-shiyu
      name: 刘士余
      text: 2006年任央行副行长，2016年出任证监会主席；2019年主动投案，受留党察看二年处分，被降为一级调研员，通报称他违规安排他人到金融系统工作和提拔职务。
      cite: k05-cctv-2019-10-04-liu-shiyu
  deep: true

kong-shaoxun:
  routes: [office, staff, secretary]
  rungs:
    - { rung: vice, date: 2022-04, post: 中共中央办公厅副主任兼秘书局局长, cite: u08-rfa-2022-04-18-kong-shaoxun }
    - { rung: minister, date: 2026-09, post: 甘肃省代省长, cite: p02-xinhua-2026-09-02-kong-shaoxun-acting }
  turns:
    - date: 2010-12
      h: 借干部交流进中办
      text: >-
        孔绍逊1991年大学毕业后长期在宁夏工作，从银川市政府办公厅的副处级秘书做起，在自治区党委办公厅做到副主任，做到自治区党委副秘书长、吴忠市委副书记。财新称，他2010年“参与中组部组织的央地干部交流，调入中办工作”。同年中组部选派66名中央机关干部到地方任职，并要求接收的省区市也选派厅局级干部到中央和国家机关交流任职。维基百科条目另写到，他2009年底曾任上海迎世博600天行动城市管理指挥部副指挥，时任上海市委秘书长是丁薛祥；他调入中办时的中办副主任赵胜轩是他的人大校友。条目没有说明这些交集与他调动的关系。
      did: >-
        在地方党委办公厅把办文、办会的基本功练熟，借中央组织的干部双向交流，从省里进了中央机关。
      who: [ding-xuexiang]
      cites: [u08-caixin-2026-08-30-kong-shaoxun, u08-guancha-2026-09-02-kong-shaoxun, u08-cna-2026-09-29-kong-shaoxun, u08-chinanews-2010-12-06-66-cadres, p03-wiki-kong-shaoxun]
    - date: 2022-04
      h: 接掌中办秘书局
      text: >-
        进中办后，他先后任中办机关党委副书记、纪委书记和人事局局长。2022年4月，官方报道首次以中办副主任兼秘书局局长的头衔提到他。自由亚洲电台引述分析称，秘书局局长实际上是习近平的贴身秘书；当时的中办主任是丁薛祥。
      did: >-
        在中央机关里从党务、人事做到文电和会务的总枢纽，十几年没有离开核心部门。
      who: [xi-jinping, ding-xuexiang]
      cites: [u08-rfa-2022-04-18-kong-shaoxun, u08-guancha-2026-09-02-kong-shaoxun]
    - date: 2022-10-22
      h: 二十大会场一幕
      text: >-
        2022年10月22日二十大闭幕会上，美联社记者从画面中认出，劝离前总书记胡锦涛的两名工作人员中，年长的一位胸牌上写着“孔绍逊”。中央社2026年报道称，他是受习近平之命，召来一名安全人员，一起把坐在习近平左侧的胡锦涛带离会场。官方的说法是胡锦涛身体不适。
      did: >-
        这件事本身不是提拔，但让一名很少公开露面的中办官员第一次被外界认出，也让外界看到他在最高领导人身边承担的角色。
      who: [xi-jinping, hu-jintao]
      cites: [p03-voa-2022-10-23-hu-escorted, u08-cna-2026-09-29-kong-shaoxun, b02-bbc-2022-10-22-hu-escorted]
    - date: 2026-08
      h: 外放甘肃主政
      text: >-
        在中办工作近16年后，孔绍逊2026年8月调任甘肃省委副书记、省政府党组书记，9月2日任代省长，9月29日当选省长。从公开简历看，他此前没有担任过地方党政正职。
      did: >-
        从幕僚岗位直接转任省政府一把手，跳过了常见的地市主官和副省长台阶。
      who: []
      cites: [u08-cna-2026-09-29-kong-shaoxun, u08-caixin-2026-08-30-kong-shaoxun, p02-xinhua-2026-09-29-kong-shaoxun-elected]
  can:
    text: >-
      能学的是把办公厅的基本功做扎实：从银川市政府办公厅的副处级秘书做起，办文、办会、人事都经手过，这份履历让他在干部交流中被调进了中办。
    cites: [u08-guancha-2026-09-02-kong-shaoxun, u08-caixin-2026-08-30-kong-shaoxun]
  cannot:
    text: >-
      学不来的是位置本身：秘书局局长紧挨着最高领导人，外界只能从会场画面和零星报道认识他。他为什么被选中进中办、又为什么在2026年外放甘肃，公开资料都没有说明。
    cites: [u08-rfa-2022-04-18-kong-shaoxun, u08-cna-2026-09-29-kong-shaoxun]
  counter:
    - id: huo-ke
      name: 霍克
      text: 同样长期在中办秘书局工作并升至局长，2014年调任国家旅游局副局长，一个月后被查，2015年被开除党籍和公职。2016年令计划案判决认定，令计划通过时任中办秘书局局长霍克等人非法获取大量国家秘密材料。
      cite: b07-court-2016-07-04-ling-sentence
    - id: ling-jihua
      name: 令计划
      text: 曾任中办主任，后任中央统战部部长、全国政协副主席；2016年以受贿、非法获取国家秘密、滥用职权罪被判无期徒刑。
      cite: b07-court-2016-07-04-ling-sentence
  deep: true

wang-zhengpu:
  routes: [echelon, org, technocrat, local]
  rungs:
    - { rung: bureau, date: 2003-08, post: 农业部财务司副司长, cite: u08-bjnews-2021-10-21-wang-zhengpu }
    - { rung: vice, date: 2016-10, post: 辽宁省委常委、组织部部长, cite: u08-bjnews-2021-10-21-wang-zhengpu }
    - { rung: minister, date: 2021-10, post: 河北省代省长, cite: u08-bjnews-2021-10-21-wang-zhengpu }
  turns:
    - date: 2010-10
      h: 入选66人名单
      text: >-
        王正谱1987年从北京农业大学毕业后进入农业部，在部里工作了23年，做到财务司司长。2010年，中组部发起“改革开放以来规模最大的一次央地干部交流任职”，选派66名中央和国家机关中青年干部到地方，47岁的他入选，出任辽宁辽阳代市长。中新网转载的报道说，这批人选主要是“基层工作经历和基层领导工作经历不满两年的正局级干部”，交流是“加强和改进年轻干部培养工作一个重要举措”。同批的还有水利部农村水利司司长王晓东、中编办司长魏小东和国土资源部办公厅主任冀文林。
      did: >-
        在部委机关做到司长后，被选派到地方当市长补基层经历。正是这次交流，把一名机关干部变成了地方主官。
      who: [wang-xiaodong, wei-xiaodong, ji-wenlin]
      cites: [u08-bjnews-2021-10-21-wang-zhengpu, u08-nbd-2022-01-21-wang-zhengpu, u08-chinanews-2010-12-06-66-cadres]
    - date: 2016-10
      h: 转入组织系统
      text: >-
        主政辽阳5年后，王正谱2015年10月调任辽宁省委组织部副部长，2016年10月升任省委常委、组织部部长，跻身副部级。每日经济新闻旗下的文章记录，他上任时，时任辽宁省委书记李希在组织部机关干部大会上说，辽宁正“处于落实全面从严治党要求、净化和修复政治生态的重要时期”。2018年他跨省任四川省委常委、组织部部长。
      did: >-
        从管农业、管一座城市，转到管干部的组织部门，先后在两个省当组织部长。
      who: [li-xi]
      cites: [u08-nbd-2022-01-21-wang-zhengpu, u08-bjnews-2021-10-21-wang-zhengpu]
    - date: 2021-01
      h: 首任乡村振兴局长
      text: >-
        2021年1月王正谱调离四川，回到中央任国家乡村振兴局首任局长。不到一年，10月他接替升任黑龙江省委书记的许勤，任河北省委副书记、代省长，2022年1月当选省长；同月他被任命为北京冬奥会和冬残奥会组委会执行主席。
      did: >-
        在农业专业和组织部长经历之外，又补上一段主管全国性工作的部门一把手经历，随后转任省长。
      who: [xu-qin]
      cites: [u08-nbd-2022-01-21-wang-zhengpu, u08-bjnews-2021-10-21-wang-zhengpu]
  can:
    text: >-
      能学的是专业和岗位连得上：在农业部财务口干了二十多年，被派去有辽宁“粮仓”之称的辽阳当市长，后来又管乡村振兴，每一步都和原来的专业接得上。
    cites: [u08-nbd-2022-01-21-wang-zhengpu, u08-bjnews-2021-10-21-wang-zhengpu]
  cannot:
    text: >-
      学不来的是那份名单：2010年的交流由中组部集中选派，名额只有66个，来自几十个中央部委。能不能进这份名单，不是个人能决定的；同一份名单上的人，后来的结局也大不相同。
    cites: [u08-chinanews-2010-12-06-66-cadres]
  counter:
    - id: wang-xiaodong
      name: 王晓东
      text: 2010年与王正谱同批从部委交流到地方，由水利部司长出任张家口市领导，后官至湖北省长；2026年5月以全国政协常委、农业和农村委员会副主任的身份被中央纪委国家监委审查调查。
      cite: k05-chinanews-2026-05-17-wang-xiaodong
    - id: ji-wenlin
      name: 冀文林
      text: 同批交流到海南任海口市领导，此前在四川、公安部和中央维稳办给周永康当秘书，官至海南副省长；2016年以受贿罪被判有期徒刑12年。
      cite: c07-court-2016-03-30-ji-wenlin
    - id: wei-xiaodong
      name: 魏小东
      text: 同批由中央编办交流到河南洛阳，后任北京市政协主席；2026年6月被中央纪委国家监委审查调查。
      cite: c03-xinhua-2026-06-06-wei-xiaodong-probe
  deep: true

li-bingjun:
  routes: [secretary, office, staff]
  rungs:
    - { rung: county, date: 1991-05, post: 化工部办公厅部长办公室副主任（副处级）, cite: u08-people-2020-11-24-li-bingjun }
    - { rung: bureau, date: 1997-08, post: 国务院办公厅副局级秘书, cite: u08-people-2020-11-24-li-bingjun }
    - { rung: vice, date: 2007-09, post: 国务院办公厅副部长级秘书, cite: u08-people-2020-11-24-li-bingjun }
    - { rung: minister, date: 2020-11, post: 贵州省代省长, cite: u08-people-2020-11-24-li-bingjun }
  turns:
    - date: 1991
      h: 进国办当秘书
      text: >-
        李炳军1984年从山东化工学院毕业后进入化工部办公厅，1991年调入国务院办公厅秘书二局。此后他在国办工作了22年，从秘书二局一组二秘、一组副组长、一秘做起，历任副局级、正局级秘书，2007年9月成为副部长级秘书。
      did: >-
        进了国务院的秘书班子后，二十多年没有换过系统，级别跟着年资和信任一级一级往上走。
      who: []
      cites: [u08-people-2020-11-24-li-bingjun, u08-chinanews-2015-06-19-li-bingjun]
    - date: 2012-09
      h: 朱镕基办公室主任
      text: >-
        新京报援引华商报报道，李炳军担任过朱镕基办公室主任，“正是朱镕基卸任后的办公室主任”。这个为朱镕基退休专设的办公室组织出版了多部朱镕基著作，李炳军是《朱镕基答记者问》等书的总协调人。2012年9月，他以“国务院办公厅有关负责同志”的名义在长沙出席《朱镕基讲话实录》首发式。报道也说，他担任这一职务期间的信息鲜有公开。
      did: >-
        给卸任总理管办公室、主持编书，这份工作外人看不见，却需要长期被信任。
      who: [zhu-rongji]
      cites: [u08-chinanews-2015-06-19-li-bingjun]
    - date: 2013-07
      h: 空降江西
      text: >-
        2013年7月，李炳军从国办“空降”江西任副省长，分管农业、粮食、金融等工作；2015年6月进入省委常委会，52岁的他是当时江西最年轻的省委常委，随即兼任赣州市委书记，2018年升任省委副书记，仍兼赣州书记。他在赣州的前任史文清早年也在中央机关工作，在全国人大常委会办公厅任过研究室副主任，2008年任江西副省长，2010年起主政赣州，2020年落马。
      did: >-
        在中央机关当了二十多年秘书后，下到地方从副省长、地级市一把手干起，补上主政一方的经历。
      who: [shi-wenqing]
      cites: [u08-chinanews-2015-06-19-li-bingjun, u08-people-2020-11-24-li-bingjun, r04-ccdi-2020-09-21-shi-wenqing-probe]
    - date: 2020-11
