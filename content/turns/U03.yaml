# U03: 上位之路 for people with full biographies (round 7). Fields: src/data/schema.ts TurnRecordSchema; howto-content.md §12.
cai-qi:
  routes: [patron, local]
  rungs:
    - { rung: county, date: 1985-08, post: 福建省委办公厅综合处副处长, cite: u03-zjol-2010-02-25-cai-resume }
    - { rung: bureau, date: 1991-02, post: 福建省委政改办副主任（副厅级）, cite: u03-zjol-2010-02-25-cai-resume }
    - { rung: vice, date: 2007-04, post: 杭州市长, cite: c10-rfa-2023-06-16-cai-qi-trust }
    - { rung: minister, date: 2015, post: 中央国家安全委员会办公室主持常务工作的副主任（正部长级）, cite: b06-people-2017-10-25-cai-resume }
    - { rung: pb, date: 2017-10, post: 中央政治局委员, cite: c10-voa-2022-10-23-cai-qi-loyalty }
    - { rung: psc, date: 2022-10, post: 中央政治局常委, cite: b06-bbc-2022-10-23-psc }
  turns:
    - date: 1999-05
      h: 从福建跨省到衢州
      text: >-
        蔡奇1983年进福建省委办公厅，在综合处、政改办、党建办做了十多年文字和综合工作，1994年起挂职三明市委副书记，1997年任三明市长。1999年5月他跨省调任浙江衢州市委副书记、市长，2002年升任衢州市委书记。法广形容他是“追随中共总书记习近平从福建到浙江任职的爱将之一”；美国之音引述观察家的看法，他与习近平在福建和浙江共事长达20年。
      did: >-
        在省委机关写了十几年材料，再下到地级市当副书记、市长，然后跨省去另一个省的地级市继续当市长。
      who: [xi-jinping]
      cites: [u03-zjol-2010-02-25-cai-resume, u03-rfi-2014-03-27-cai-qi, c10-voa-2022-10-23-cai-qi-loyalty]
    - date: 2004-08
      h: 台州抗台风
      text: >-
        2004年4月蔡奇转任台州市委书记。浙江在线记载，台风“云娜”来袭时他到任仅4个月，时任浙江省委书记的习近平在省防汛防旱指挥部通过手机与在一线指挥的蔡奇通话。同年10月，台州一周内派出10256名机关干部到5160个村蹲点；他还向台州籍商人公布自己的手机号。他后来在微博上说，在台州时就坚持开大会站着讲、讲短话，“站着讲，就不会讲长”。
      did: >-
        在一把手岗位上碰上大灾，人在一线；平时做几件容易被记住的事，比如全市干部下村、公开手机号、开短会。
      who: [xi-jinping]
      cites: [u03-zjol-2017-01-21-cai-taizhou, u03-zjol-2010-02-25-cai-resume]
    - date: 2010-01
      h: 上级走后继续被提拔
      text: >-
        2007年初蔡奇调任杭州市委副书记，4月任市长；自由亚洲电台指出，杭州是副省级城市，他由此在2007年跻身副省部级。同年3月习近平调往上海。2010年1月，蔡奇进入浙江省委常委、任组织部长。自由亚洲电台的评论认为，继任浙江省委书记赵洪祝对习近平在浙江重用过的干部“按既定方针办”，继续提拔，为日后的升迁铺了台阶。
      did: >-
        老上级调走以后，留在原地继续干，被下一任领导接着提拔，最后管起了全省干部的任免。
      who: [zhao-hongzhu, xi-jinping]
      cites: [u03-zjol-2010-02-25-cai-resume, c10-rfa-2023-06-16-cai-qi-trust, f02-rfa-2020-11-16-zhijiang]
    - date: 2014-03
      h: 进京后的“三级跳”
      text: >-
        2014年3月蔡奇被免去浙江副省长职务，调任新设的中央国家安全委员会办公室副主任，2015年主持常务工作（正部长级），2016年任北京代市长，2017年5月任北京市委书记，成为首位非中央委员的北京市委书记，同年10月进入政治局。自由亚洲电台把他从十八大的“双非”到十九大政治局委员称为“三级跳”。2022年他进入政治局常委会，美国之音引述观察家说，他“凭借的并不是他的政绩，而是他与习近平在福建和浙江共事长达20年时间内形成的私谊”。
      did: >-
        在地方做到副省级之后，被调到中央新设的机构做实际负责人，几年内连换五个职务，一路升到首都一把手。
      who: [xi-jinping]
      cites: [u03-rfi-2014-03-27-cai-qi, b06-people-2017-10-25-cai-resume, c10-voa-2022-10-23-cai-qi-loyalty, f02-rfa-2020-11-16-zhijiang]
  can:
    text: >-
      能学的是在每个岗位留下能被记住、讲得清楚的做法：台州的干部下村和抗台，杭州和组织部的连续任职，都让上级有具体的东西可以评价。他在省委机关多年的文字和综合工作经验，也让他到了中央新设机构后能很快接手。
    cites: [u03-zjol-2017-01-21-cai-taizhou, u03-zjol-2010-02-25-cai-resume]
  cannot:
    text: >-
      学不来的是他与习近平在福建、浙江长达约二十年的交集。他55岁前后才到副部级、十八大时仍是“双非”，自由亚洲电台称之为“大器晚成”；真正的跃升发生在老上级成为总书记之后，美国之音引述的观察家把他入常归因于私谊而非政绩。这样的机会取决于跟对了人、又赶上那个人上台的时间窗口，不是个人努力能安排的。
    cites: [c10-rfa-2023-06-16-cai-qi-trust, c10-voa-2022-10-23-cai-qi-loyalty]
  counter:
    - id: huang-kunming
      name: 黄坤明
      text: 同样是习近平在福建、浙江的旧部，与蔡奇同在十九大进入政治局。BBC引述宋文笛的分析，2022年是黄坤明入常的最后时机，但习近平把常委位置给了丁薛祥，黄坤明止步于政治局委员。
      cite: b06-bbc-2022-10-23-psc
  deep: true

li-qiang:
  routes: [secretary, patron, local]
  rungs:
    - { rung: county, date: 1985, post: 浙江省民政厅农村救济处副处长, cite: b06-xinhua-2017-10-25-li-qiang-resume }
    - { rung: bureau, date: 1992, post: 浙江省民政厅副厅长, cite: b06-xinhua-2017-10-25-li-qiang-resume }
    - { rung: vice, date: 2005, post: 浙江省委常委、秘书长, cite: b06-xinhua-2017-10-25-li-qiang-resume }
    - { rung: minister, date: 2012, post: 浙江省代省长, cite: b06-xinhua-2017-10-25-li-qiang-resume }
    - { rung: pb, date: 2017-10, post: 中央政治局委员, cite: b06-bbc-2022-10-23-psc }
    - { rung: psc, date: 2022-10, post: 中央政治局常委, cite: b06-bbc-2022-10-23-psc }
  turns:
    - date: 1984
      h: 从团县委到省民政厅
      text: >-
        李强当过排灌站和工具厂工人，读的是农机化专业。1984年任共青团瑞安县委书记，同年调入浙江省民政厅农村救济处，1985年任副处长，其间借调民政部救灾司；1992年33岁时任民政厅副厅长。此后他在永康、省政府办公厅、省工商局、温州轮转任职。
      did: >-
        从县里的共青团调进省里一个不起眼的厅局，在救灾救济这条线上一步步升到副厅长，再下到县级市、地级市当一把手。
      who: []
      cites: [b06-xinhua-2017-10-25-li-qiang-resume, b06-bbc-2022-10-23-psc]
    - date: 2004-11
      h: 当上省委秘书长
      text: >-
        美国之音写道：“2004年11月，李强迎来仕途上重大的转折点”，出任时任省委书记习近平的省委秘书长。《卫报》称他在2004到2007年是习近平的幕僚长和实际上的首席私人助手，陪同习近平考察、修改讲话稿、参与起草施政方向；BBC报道说，两人“常常工作到深夜，给上级留下深刻印象”。
      did: >-
        给一把手当总管：安排日程、跟着出差、改稿子，在最近的距离上让领导看到自己的能力和可靠。
      who: [xi-jinping]
      cites: [b06-voa-2022-10-23-li-qiang, b06-guardian-2022-10-24-li-qiang, b06-bbc-2023-03-04-li-qiang-deputy]
    - date: 2012-12
      h: 老上级上台后外放主政
      text: >-
        《纽约时报》中文网写道，习近平在成为最高领导人后仅两个月就任命李强为浙江省省长；2016年再派他任江苏省委书记，2017年选他任上海市委书记并进入政治局。《卫报》认为，这几次任命为他补上了主政地方的经历和资历。
      did: >-
        从幕僚转为一把手，在老上级安排下连续主政三个经济大省市，把“秘书”的履历换成“地方大员”的履历。
      who: [xi-jinping]
      cites: [b06-nytcn-2023-03-14-li-qiang, b06-guardian-2022-10-24-li-qiang, b06-xinhua-2017-10-25-li-qiang-resume]
    - date: 2022-10
      h: 上海封城后升任二号人物
      text: >-
        2022年上海两个多月的严厉封锁使李强的升迁受到质疑，但他在二十大上排名第二进入常委会，2023年出任总理。BBC引述张扬的分析，“李强将成为第一个从省或直辖市直接升任总理而没有任何中央工作经验的官员”。《卫报》引述陈道银的看法，封城期间李强证明了自己是“清零”政策的忠实执行者。
      did: >-
        在最受争议的时刻坚决执行上级的方针，换来的是比政绩更被看重的信任。
      who: [xi-jinping]
      cites: [b06-bbc-2022-10-23-psc, b06-guardian-2022-10-24-li-qiang, b06-nytcn-2023-03-14-li-qiang]
  can:
    text: >-
      能学的是在给一把手当总管时做到细、做到可靠：BBC和《卫报》描述的长时间加班、陪同出行、修改讲话稿，都是一般办公室工作也能对照的基本功。他早年在民政、工商、地市轮转的经历，也让他后来主政时不至于没有底子。
    cites: [b06-bbc-2023-03-04-li-qiang-deputy, b06-guardian-2022-10-24-li-qiang, b06-xinhua-2017-10-25-li-qiang-resume]
  cannot:
    text: >-
      学不来的是碰上谁当省委书记。他在民政厅系统起步，没有特别的出身；把他从地方官员变成接班梯队成员的，是2004年给习近平当秘书长的那几年，以及习近平2012年上台后的几次任命。《卫报》引述林和立的话，李强清楚自己的仕途归功于习近平这位恩主；封城之后仍被提拔，也说明决定他位置的是信任而不是公众评价。
    cites: [b06-guardian-2022-10-24-li-qiang, b06-nytcn-2023-03-14-li-qiang]
  counter:
    - id: chen-miner
      name: 陈敏尔
      text: 同为习近平在浙江时期的部下，2017年与李强同时进入十九届政治局；二十大留任政治局委员而未入常，同年12月转任天津市委书记。
      cite: b11-xinhua-2022-12-08-chen-tianjin
  deep: true

ding-xuexiang:
  routes: [secretary, patron, technocrat]
  rungs:
    - { rung: vice, date: 2007, post: 上海市委常委、秘书长, cite: b06-people-2017-10-25-ding-resume }
    - { rung: minister, date: 2015, post: 中央办公厅主持常务工作的副主任（正部长级）, cite: b06-people-2017-10-25-ding-resume }
    - { rung: pb, date: 2017-10, post: 中央政治局委员、中央书记处书记, cite: b06-bbc-2022-10-23-psc }
    - { rung: psc, date: 2022-10, post: 中央政治局常委, cite: b06-bbc-2022-10-23-psc }
  turns:
    - date: 1999
      h: 研究所出来做官
      text: >-
        丁薛祥学机械锻压，1982年进上海材料研究所，在所里待了17年，从科研人员做到办公室主任、所长。1999年任上海市科委副主任（正局级），2001年任闸北区代区长、区长，2004年调任市委组织部副部长兼市人事局局长。人民报（传闻来源）称，时任上海市长徐匡迪欣赏科研单位出身的丁薛祥，力推他出任闸北区长。
      did: >-
        在一家科研单位从技术员做到单位负责人，再转到政府机关，补了一段区县主官和组织人事工作的经历。
      who: [xu-kuangdi]
      cites: [b06-people-2017-10-25-ding-resume, u03-renminbao-2025-07-23-ding]
    - date: 2006
      h: 陈良宇案后进市委办公厅
      text: >-
        2006年陈良宇案发，丁薛祥出任上海市委副秘书长、办公厅主任。人民报（传闻来源）的说法是，陈良宇的办公厅主任孙路一也落马，主持市委工作的韩正需要一个不属于陈良宇派系的人接手，丁薛祥由此得到机会；该文还称徐匡迪向新到任的习近平推荐了几个人，其中包括丁薛祥。
      did: >-
        前任出事、一个位置空出来时，因为身上没有旧派系的标签，被选去接手最贴近领导的岗位。
      who: [han-zheng, xu-kuangdi, chen-liangyu]
      cites: [b06-people-2017-10-25-ding-resume, u03-renminbao-2025-07-23-ding]
    - date: 2007-05
      h: 七个月赢得信任
      text: >-
        2007年3月习近平到上海任市委书记，成为就职市委办公厅主任不到三个月的丁薛祥的顶头上司；两个月后丁薛祥升任市委常委、秘书长，成为副部级官员。美国之音写道，两人在上海共事只有七个月，“然而就是在这短短的7个月里，丁薛祥赢得了习近平的信任”。BBC称他由此成为习近平的政治秘书。
      did: >-
        在新领导到任、局面最紧张的几个月里把办公室的事办妥，短时间内取得信任。
      who: [xi-jinping]
      cites: [f08-voa-2022-11-08-ding, b06-bbc-2022-10-23-psc]
    - date: 2013-05
      h: 调入中办当大管家
      text: >-
        2013年5月，习近平把丁薛祥调到身边，任中央办公厅副主任兼总书记办公室主任；BBC当时引述香港媒体，称他将“扮演类似当年令计划的角色”。2017年他进入政治局并任中办主任，2022年入常、2023年任常务副总理。BBC指出，丁薛祥从未主政一方；中央社说，除了近3年的闸北区长，他没有地方一、二把手经验。
      did: >-
        跟着老上级进入中枢，从办公室主任一路升到最高层，中间几乎没有再去地方带队伍。
      who: [xi-jinping, ling-jihua]
      cites: [f08-voa-2022-11-08-ding, f01-bbc-2013-05-17-ding-xuexiang, b06-bbc-2022-10-23-psc, b06-cna-2023-03-12-ding-vp]
  can:
    text: >-
      能学的是把管理和文字工作做到可以托付：他在研究所当过办公室主任，后来在上海和中央也一直做办公厅的事，这套本领在任何单位的综合部门都能对照。他到市委办公厅时身上没有旧派系标签，也是他能接手敏感岗位的原因之一。
    cites: [b06-people-2017-10-25-ding-resume, u03-renminbao-2025-07-23-ding]
  cannot:
    text: >-
      学不来的是时机。他升任副部级恰好发生在陈良宇案后上海换班、习近平短暂主政上海的那几个月，美国之音说两人只共事七个月；如果习近平没有在五年后成为总书记，这段经历只是一段普通的秘书履历。他几乎没有地方主官经历却升到常委会，靠的主要是这层信任，而不是可以复制的政绩。
    cites: [f08-voa-2022-11-08-ding, b06-bbc-2022-10-23-psc]
  counter:
    - id: ling-jihua
      name: 令计划
      text: 曾是胡锦涛身边的中央办公厅主任，与丁薛祥同样走总书记“大管家”的路子；胡锦涛卸任后他转任统战部长，2016年以受贿、非法获取国家秘密、滥用职权罪被判处无期徒刑。
      cite: b07-court-2016-07-04-ling-sentence
  deep: true

li-xi:
  routes: [secretary, patron, local]
  rungs:
    - { rung: county, date: 1985, post: 甘肃省委办公厅副处级秘书, cite: b06-xinhua-2017-10-25-li-xi-resume }
    - { rung: bureau, date: 1996, post: 兰州市委常委、组织部部长, cite: b06-xinhua-2017-10-25-li-xi-resume }
    - { rung: vice, date: 2004, post: 陕西省委常委、秘书长, cite: b06-xinhua-2017-10-25-li-xi-resume }
    - { rung: minister, date: 2014, post: 辽宁省代省长, cite: b06-xinhua-2017-10-25-li-xi-resume }
    - { rung: pb, date: 2017-10, post: 中央政治局委员, cite: b06-xinhua-2017-10-25-li-xi-resume }
    - { rung: psc, date: 2022-10, post: 中央政治局常委、中央纪委书记, cite: b06-bbc-2022-10-23-psc }
  turns:
    - date: 1982
      h: 给省委书记当秘书
      text: >-
        李希1982年从西北师范学院中文系毕业后，到1986年一直担任时任甘肃省委书记李子奇的秘书。美国之音写道，李子奇是习仲勋的老部下和陕西老乡；“有报道说，李希常陪伴李子奇到北京、深圳探望习仲勋，由此与习近平相熟”。此后他在甘肃省委组织部做了近十年干部工作。
