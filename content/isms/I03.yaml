      quote: true
  cites: [i01-gov-2022-10-16-20th-report, b04-gov-2021-11-16-resolution]

# ======== line 党内路线 ========

- id: crossing-river
  name: 摸着石头过河
  en: Crossing the river by feeling the stones
  kind: line
  from: 1980-12
  parents: [deng-theory]
  terms: [摸着石头过河]
  carriers: [chen-yun, deng-xiaoping]
  summary: >-
    陈云 1980 年提出、邓小平时代通行的改革方法论：不预设蓝图，先在特区与试点中试验，成功再推广。它容许地方先行先试，
    也是 1980—2000 年代地方竞争式增长的制度来源。2013 年三中全会决定改为顶层设计和摸着石头过河相结合，重心由此移向中央统一设计。
  pos:
    - { at: 1992, x: 0.5, y: -0.3, z: -0.6, note: 地方试验空间大，政治上默许一定分权 }
  voices:
    - voice: doc
      text: 胆子要大、步子要稳，加强顶层设计和摸着石头过河相结合
      cite: e03-gov-2013-11-15-reform-decision
      quote: true
  cites: [e03-gov-2013-11-15-reform-decision]

- id: top-level-design
  name: 顶层设计
  en: Top-level design
  kind: line
  from: 2010-10
  parents: [crossing-river]
  against: [crossing-river]
  terms: [顶层设计]
  carriers: [xi-jinping, liu-he]
  summary: >-
    十二五规划建议首次在中央文件中使用这个词，习近平 2012 年 12 月在广东提出要拿出全面深化改革的顶层设计和总体规划，
    2013 年设中央全面深化改革领导小组落实。它把改革决策权收归中央，地方从试验者变为执行者；历史决议把它列为新时代改革的特征之一。
  pos:
    - { at: 2013-11, x: 0.3, y: -0.6, z: 0.1, note: 改革议程本身仍偏市场，但决策高度集中 }
  voices:
    - voice: official
      text: 在深入调查研究的基础上提出全面深化改革的顶层设计和总体规划
      cite: e02-chinanews-2012-12-11-xi-guangdong
      quote: true
  cites: [e02-chinanews-2012-12-11-xi-guangdong, e03-gov-2013-11-15-reform-decision, b04-gov-2021-11-16-resolution]

- id: market-reform
  name: 市场化改革派
  short: 市场派
  en: Market reformers
  kind: line
  from: 1984
  parents: [deng-theory, socialist-market-economy]
  against: [guojin-mintui]
  terms: [市场化改革]
  carriers: [wu-jinglian, zhu-rongji, zhou-xiaochuan, li-yining, liu-he, li-keqiang]
  summary: >-
    党内与体制内经济学家、技术官僚中主张以价格、国企、金融改革走向市场经济的一路。1980 年代经济学界有吴市场之称的吴敬琏，
    1990 年代朱镕基的分税制、国企改革与入世谈判，周小川的金融改革，都属于这一路。他们多主张政治改革应与经济改革同步，
    但很少挑战四项基本原则；2008 年后在国进民退的争论中处于守势。
  pos:
    - { at: 1998, x: 0.8, y: -0.2, z: -0.6, note: 朱镕基时期：国企改制、入世，政治上不越线 }
    - { at: 2013-11, x: 0.8, y: -0.1, z: -0.5, note: 三中全会决定性作用的提法被视为市场派的胜利，随后执行受阻 }
  voices:
    - voice: zh
      text: 他呼吁政治改革要和经济改革同时推进，要建设一个能够为市场机制提供支持的制度平台。
      cite: i03-infzm-2008-12-10-wu-market
      quote: true
    - voice: zh
      text: “吴市场”，终于由贬词变成了美誉。
      cite: i03-infzm-2008-12-10-wu-market
      quote: true
  cites: [i03-infzm-2008-12-10-wu-market, c05-nytcn-2013-11-09-wu-jinglian]

- id: guojin-mintui
  name: 国进民退
  en: The state advances, the private sector retreats
  kind: line
  from: 2008-11
  parents: [scientific-development]
  against: [market-reform]
  terms: [国进民退]
  carriers: []
  summary: >-
    2008 年金融危机后四万亿刺激大量流向国企，舆论开始用国进民退形容国企扩张、民企收缩；2018 年民营上市公司被国资接盘时再起争论。
    这是批评者给中央实际路线起的名字，官方否认存在这一趋势，央视网称国资接盘是正常的市场化行为。本图仍把它作为党内路线收录，
    位置取批评者描述的实际政策取向。
  pos:
    - { at: 2009, x: -0.3, y: -0.4, z: -0.3, note: 四万亿后国企扩张；批评者如吴敬琏称改革停滞 }
    - { at: 2018-10, x: -0.5, y: -0.75, z: 0.5, note: BBC 采访的吴伟称控制深入社会每一个细胞，是历史性倒退 }
  voices:
    - voice: zh
      text: 可以说，从胡锦涛时代的后期，开始出现国进民退，这种现象在近几年加剧。
      cite: i03-bbc-2018-09-14-guojin-mintui
      quote: true
    - voice: zh
      text: 国进民退是事实，这一迹象从十八大以后就开始显露了。
      cite: i03-bbc-2018-09-14-guojin-mintui
      quote: true
    - voice: official
      text: 所谓的“国进民退”与当前的发展阶段、发展情况密切相关，是在当前环境下国企和民企的一种正常的市场化行为。
      cite: i03-cctv-2018-10-22-guojin-mintui
      quote: true
  cites: [i03-bbc-2018-09-14-guojin-mintui, i03-cctv-2018-10-22-guojin-mintui, e02-chinanews-2008-11-09-four-trillion]

- id: chongqing-model
  name: 重庆模式
  en: Chongqing model
  kind: line
  from: 2008
  to: 2012-03
  parents: [maoist-left, new-left]
  against: [guangdong-model]
  terms: [重庆模式, 唱红打黑]
  carriers: [bo-xilai, huang-qifan, wang-lijun]
  concept: cake-debate
  summary: >-
    薄熙来主政重庆期间的施政组合：唱红歌、打黑除恶、公租房与户籍改革，再加上国资主导的大规模投资。它得到毛派与新左派知识分子
    背书，被视为与广东模式对垒的分蛋糕路线；批评者称其复辟文革、践踏法治。2012 年王立军事件后薄熙来落马，重庆模式随之终结。
  pos:
    - { at: 2010, x: -0.6, y: -0.8, z: 0.4, note: 国资主导、运动式打黑、红色宣传 }
  voices:
    - voice: zh
      text: 他的民粹式“重庆模式”得到毛派知识分子与很多痛恨腐败与不公的普通民众拥护，但批评者说他复辟文革，践踏法治。
      cite: f01-voa-2012-11-04-who-is-who
      quote: true
    - voice: zh
      text: 许多人认为，“重庆模式”是文革式的危险尝试，孕育着危机，而“王立军事件”标志着危机的爆发。
      cite: b07-bbc-2012-03-15-bo-commentary
      quote: true
    - voice: zh
      text: 两人的分别是，薄熙来要更平均的分好蛋糕，达到公平公义，而汪洋认为只要将蛋糕做大，群众得到的好处就自然更多。
      cite: b05-rfi-2011-07-15-cake
      quote: true
  cites: [f01-voa-2012-11-04-who-is-who, b07-bbc-2012-03-15-bo-commentary, e02-bbc-2010-03-31-bo-anti-triad, e02-voa-2011-04-30-bo-red-songs]

- id: guangdong-model
  name: 广东模式
  en: Guangdong model
  kind: line
  from: 2008
  to: 2012-12
  parents: [market-reform]
  against: [chongqing-model]
  terms: [广东模式, 幸福广东]
  carriers: [wang-yang]
  concept: happy-guangdong
  summary: >-
    汪洋主政广东时的施政取向：腾笼换鸟、转型升级、建设幸福广东，强调先做大蛋糕，并对乌坎事件采取协商处理、放宽社会组织登记。
    它被外界视为与重庆模式唱对台戏的改革派路线。2012 年两人一升一落，但十八大后两种模式都不再作为模式被提起。
  pos:
    - { at: 2011, x: 0.5, y: 0.0, z: -0.4, note: 市场导向、社会组织登记放宽、乌坎协商 }
  voices:
    - voice: official
      text: 如果一提‘建设幸福广东’都只注意分蛋糕，而不注意如何转型升级，那么‘十二五’规划不可能实现，幸福广东就是无源之水、无本之木
      cite: i03-cntv-2011-01-21-wang-yang-cake
      quote: true
    - voice: zh
      text: 汪洋在广东提出以“建设幸福广东”作为广东省十二五计划的核心，但究竟如何提升人民的幸福感，却并没有看到他在政策上有什么突破。
      cite: i03-rfa-2011-06-29-wang-bo
      quote: true
  cites: [f01-voa-2012-11-04-who-is-who, i03-chinanews-2011-01-06-happy-guangdong, i03-cntv-2011-01-21-wang-yang-cake]

- id: political-reform
  name: 政治体制改革派
  short: 政改派
  en: Political reformers within the party
  kind: line
  from: 1986
  parents: [deng-theory]
  against: [neo-authoritarianism]
  terms: [政治体制改革]
  carriers: [zhao-ziyang, hu-yaobang, bao-tong, wen-jiabao, du-daozheng, hu-deping]
  summary: >-
    党内主张党政分开、权力制约、扩大民主的一路。1986—1989 年赵紫阳、鲍彤主持政治体制改革研讨，十三大提出党政分开；
    1989 年后这一路被清洗，只以炎黄春秋等刊物和退休老干部的形式存续。2010 年温家宝在深圳称没有政治体制改革的保障，
    经济改革成果会得而复失，被视为这一路在高层的最后回声。
  pos:
    - { at: 1987-10, x: 0.5, y: 0.4, z: -0.6, note: 十三大党政分开 }
    - { at: 2010-08, x: 0.4, y: 0.3, z: -0.5, note: 温家宝深圳讲话，但未获中央附和 }
  voices:
    - voice: official
      text: 没有政治体制改革的保障，经济体制改革的成果就会得而复失，现代化建设的目标就不可能实现。
      cite: b02-gov-2010-08-21-wen-shenzhen
      quote: true
    - voice: zh
      text: 温家宝说，不仅要推进经济改革，还要推进政治体制改革。
      cite: e02-bbc-2010-08-22-wen-shenzhen
      quote: true
  cites: [b02-gov-2010-08-21-wen-shenzhen, e02-bbc-2010-08-22-wen-shenzhen, b14-bbc-2005-01-17-zhao-profile]

- id: taoguang-yanghui
  name: 韬光养晦
  en: Hide one's capabilities and bide one's time
  kind: line
  from: 1990-12
  parents: [deng-theory]
  terms: [韬光养晦]
  carriers: [deng-xiaoping, jiang-zemin, hu-jintao]
  concept: taoguang-yanghui
  summary: >-
    1989 年后邓小平提出的对外方针：冷静观察、稳住阵脚、沉着应付、韬光养晦、决不当头、有所作为。它主导了此后二十多年的低调外交，
    配合入世与融入国际经济体系。官方从未正式废止这一提法，但 2013 年后外交话语转向奋发有为，学者普遍认为它已被扬弃。
  pos:
    - { at: 1992, x: 0.3, y: -0.45, z: -0.85, note: 以发展为先、决不当头 }
  voices:
    - voice: doc
      text: 我们再韬光养晦地干些年，才能真正形成一个较大的政治力量，中国在国际上发言的分量就会不同。
      cite: i01-ifeng-2012-10-28-taoguang
      quote: true
    - voice: zh
      text: 习近平治下的中国正在逐渐扬弃邓小平的“韬光养晦”战略思想，而转向“有所作为/大有作为”的新取向，一个新的中国外交大战略正在形成
      cite: i01-bbc-2013-12-02-taoguang
      quote: true
  cites: [i01-ifeng-2012-10-28-taoguang, i01-bbc-2013-12-02-taoguang]

- id: peaceful-rise
  name: 和平崛起 / 和平发展
  short: 和平崛起
  en: Peaceful rise / peaceful development
  kind: line
  from: 2003-11
  parents: [taoguang-yanghui]
  terms: [和平崛起, 和平发展道路]
  carriers: [zheng-bijian, hu-jintao, wen-jiabao]
  concept: peaceful-rise
  summary: >-
    郑必坚 2003 年在博鳌论坛提出，温家宝、胡锦涛随后采用；因崛起一词易引起邻国疑虑，2004 年后官方改称和平发展道路。
    它与和谐世界一起，构成胡温时代以融入、合作为主的对外路线，是韬光养晦的延续而非替代。
  pos:
    - { at: 2004, x: 0.3, y: -0.35, z: -0.6, note: 崛起但不称霸；在韬光养晦之上略为主动 }
  voices:
    - voice: official
      text: 第五，中国的崛起不会妨碍任何人，也不会威胁任何人。
      cite: i01-chinanews-2004-04-08-peaceful-rise
      quote: true
    - voice: scholar
      text: Hu’s non-use of the term “rise” indicates his agreement with analysts who favored a less confrontational phrase.
      cite: i01-yaleglobal-2004-peaceful-rise
      quote: true
      zh: 胡锦涛不再使用崛起一词，表明他认同那些主张用较少对抗意味的说法的分析人士。
    - voice: doc
      text: 第三，坚持包容精神，共建和谐世界。文明多样性是人类社会的基本特征，也是人类文明进步的重要动力。
      cite: i03-mfa-2005-09-15-hu-un
      quote: true
  cites: [i01-chinanews-2004-04-08-peaceful-rise, i01-yaleglobal-2004-peaceful-rise, i03-mfa-2005-09-15-hu-un]

- id: wolf-warrior
  name: 战狼外交
  en: Wolf warrior diplomacy
  kind: line
  from: 2019
  parents: [xi-diplomacy-thought, nationalism]
  against: [taoguang-yanghui]
  terms: [战狼外交]
  carriers: [wang-yi, qin-gang]
  concept: wolf-warrior
  summary: >-
    西方学者与媒体借电影《战狼》给 2019 年后中国外交官在社交媒体上对抗式发言起的名字，赵立坚是公认的代表人物。
    外交部否认存在战狼外交，称这是话语陷阱，但王毅表示对蓄意中伤要有力回击。本图把它作为外交路线的实际取向收录。
  pos:
    - { at: 2020-05, x: 0.0, y: -0.8, z: 0.9, note: 公开对抗、以牙还牙的表态风格 }
  voices:
    - voice: zh
      text: 与中国传统外交官的谨慎、保守相比，这些外交官倾向于主动展现对抗风格，并且多使用社交媒体Twitter发表言论，很多西方学者和观察家称之为“战狼”外交。
      cite: i03-bbc-2020-05-13-wolf-warrior
      quote: true
    - voice: doc
