  voices:
    - voice: doc
      text: 科学发展观同马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想一道，是党必须长期坚持的指导思想。
      cite: i01-cma-2012-12-17-scientific-development
      quote: true
  cites: [i01-cma-2012-12-17-scientific-development, i01-12371-2022-10-22-party-charter]

- id: harmonious-society
  name: 社会主义和谐社会
  short: 和谐社会
