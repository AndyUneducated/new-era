    列出人口规模巨大、共同富裕、物质文明与精神文明协调、人与自然和谐、走和平发展道路五个特征，明确现代化不等于西方化。
  pos:
    - { at: 2022-10, x: -0.3, y: -0.85, z: 0.7, note: 以党的领导界定现代化，与西方模式对立 }
  voices:
    - voice: doc
      text: 中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。
      cite: i01-gov-2022-10-16-20th-report
      quote: true
  cites: [i01-gov-2022-10-16-20th-report, i01-cpc-2022-10-31-deng-modernization]

- id: whole-process-democracy
  name: 全过程人民民主
