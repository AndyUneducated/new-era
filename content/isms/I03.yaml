# I03 主义谱系：官方正统（core）、党内路线（line）、民间思潮（trend）、外来·对立面（foreign）、罪名·标签（label）
# 三轴：x 经济（-1 国家主导 ↔ +1 市场）；y 政治（-1 集中管控 ↔ +1 宽松多元）；z 对外（-1 韬光养晦·融入 ↔ +1 强硬·对抗）
# 位置是编者对相对立场的判断；中央路线见 content/line/I03.yaml，同一时点的官方正统与中央路线取相近的值。

# ======== core 官方正统 ========

- id: mao-thought
  name: 毛泽东思想
  en: Mao Zedong Thought
  kind: core
  from: 1945
  terms: [毛泽东思想]
  carriers: []
  summary: >-
    1945 年七大写入党章的指导思想，1978 年后仍居指导思想之列，但十一届三中全会宣布大规模群众阶级斗争基本结束，
    把全党工作着重点转向现代化建设，实际上告别了以阶级斗争为纲。1981 年历史决议区分毛泽东思想与毛泽东晚年错误，
    使它既是改革的合法性来源，也成为毛左批评改革的旗帜。本图只把它当作 1978 年以后各条路线的源头。
  pos:
    - { at: 1978, x: -0.9, y: -0.8, z: 0.5, note: 计划经济、无产阶级专政下继续革命、反帝反修的毛时代路线，作为改革的起点 }
  voices:
    - voice: doc
      text: 毛泽东思想是马克思列宁主义在中国的运用和发展，是被实践证明了的关于中国革命和建设的正确的理论原则和经验总结，是中国共产党集体智慧的结晶。
      cite: i01-12371-2022-10-22-party-charter
      quote: true
    - voice: doc
      text: 大规模的急风暴雨式的群众阶级斗争已经基本结束
      cite: i03-qingdao-1978-12-22-3rd-plenum
      quote: true
  cites: [i01-12371-2022-10-22-party-charter, i03-qingdao-1978-12-22-3rd-plenum]

- id: four-cardinal-principles
  name: 四项基本原则
  short: 四个坚持
  en: Four Cardinal Principles
  kind: core
  from: 1979-03
  parents: [mao-thought]
  against: [bourgeois-liberalization]
  terms: [四项基本原则]
  carriers: [deng-xiaoping, deng-liqun]
  summary: >-
    1979 年 3 月邓小平在理论工作务虚会上提出：坚持社会主义道路、无产阶级专政（后改人民民主专政）、共产党的领导、
    马列主义毛泽东思想。它与改革开放并称党的基本路线中的两个基本点，划出了改革在政治上的边界。1989 年后邓小平把那场风波定性为
    资产阶级自由化与四个坚持的对立，此后历次党章都写明坚持四项基本原则、反对资产阶级自由化。
  pos:
    - { at: 1979-03, x: -0.3, y: -0.6, z: -0.3, note: 政治上划红线、经济上不设限；对外仍在打开国门，故 z 偏负 }
  voices:
    - voice: doc
      text: 中央认为，我们要在中国实现四个现代化，必须在思想政治上坚持四项基本原则。这是实现四个现代化的根本前提。
      cite: i03-reformdata-1979-03-30-four-principles
      quote: true
    - voice: doc
      text: 如果动摇了这四项基本原则中的任何一项，那就动摇了整个社会主义事业，整个现代化建设事业。
      cite: i03-reformdata-1979-03-30-four-principles
      quote: true
    - voice: doc
      text: 坚持社会主义道路、坚持人民民主专政、坚持中国共产党的领导、坚持马克思列宁主义毛泽东思想这四项基本原则，是我们的立国之本。
      cite: i01-12371-2022-10-22-party-charter
      quote: true
  cites: [i03-reformdata-1979-03-30-four-principles, i01-12371-2022-10-22-party-charter, e01-cpc-dsj-1989]

- id: deng-theory
  name: 邓小平理论
  en: Deng Xiaoping Theory
  kind: core
  from: 1997-09
  parents: [mao-thought, four-cardinal-principles]
  terms: [邓小平理论]
  carriers: [deng-xiaoping, jiang-zemin]
  concept: deng-theory
  summary: >-
    十五大把邓小平建设有中国特色社会主义理论定名为邓小平理论并写入党章，内容包括社会主义初级阶段论、一个中心两个基本点、
    计划与市场都是手段、一国两制、韬光养晦等。它在经济上为市场化开路，在政治上以四项基本原则设限，是 1978 年以来
    各派都援引的共同出发点：改革派引南方谈话，保守派引反自由化。
  pos:
    - { at: 1992, x: 0.4, y: -0.45, z: -0.6, note: 南方谈话时的邓小平：经济大胆放开，政治坚持 1989 年后的收紧，对外韬光养晦 }
  voices:
    - voice: doc
      text: 邓小平理论是当代中国的马克思主义，是马克思主义在中国发展的新阶段。
      cite: i01-wenming-1997-09-12-15th-report
      quote: true
    - voice: doc
      text: 邓小平理论是马克思列宁主义的基本原理同当代中国实践和时代特征相结合的产物，是毛泽东思想在新的历史条件下的继承和发展
      cite: i01-12371-2022-10-22-party-charter
      quote: true
  cites: [i01-wenming-1997-09-12-15th-report, i01-12371-2022-10-22-party-charter]

- id: socialist-market-economy
  name: 社会主义市场经济
  en: Socialist market economy
  kind: core
  from: 1992-10
  parents: [deng-theory]
  terms: [社会主义市场经济]
  carriers: [jiang-zemin, zhu-rongji, deng-xiaoping]
  concept: socialist-market-economy
  summary: >-
    十四大确定经济体制改革的目标是建立社会主义市场经济体制，让市场在国家宏观调控下对资源配置起基础性作用；
    2013 年十八届三中全会把基础性改为决定性，同时要求更好发挥政府作用。这个提法本身的张力，市场与社会主义各占一半，
    使它可以向两端解读：改革派强调市场，左派和后来的国进民退强调社会主义与公有制主体。
  pos:
    - { at: 1992-10, x: 0.4, y: -0.4, z: -0.6, note: 以市场为基础性配置手段，公有制为主体不变 }
    - { at: 2013-11, x: 0.5, y: -0.55, z: 0.1, note: 决定性作用的提法比 1992 年更市场化，但同时设国安委、收紧政治 }
  voices:
    - voice: doc
      text: 计划经济不等于社会主义，资本主义也有计划；市场经济不等于资本主义，社会主义也有市场。计划和市场都是经济手段。
      cite: i03-reformdata-1992-10-12-14th-report
      quote: true
    - voice: doc
      text: 市场决定资源配置是市场经济的一般规律，健全社会主义市场经济体制必须遵循这条规律，着力解决市场体系不完善、政府干预过多和监管不到位问题。
      cite: e03-gov-2013-11-15-reform-decision
      quote: true
    - voice: zh
      text: 只有进一步推进市场化的经济体制改革和加快民主化、法治化的进程，经济增长模式转型才有可能实现，舍此绝无他途。
      cite: c05-nytcn-2013-11-09-wu-jinglian
      quote: true
  cites: [i03-reformdata-1992-10-12-14th-report, e03-gov-2013-11-15-reform-decision]

- id: three-represents
  name: “三个代表”重要思想
  short: 三个代表
  en: Three Represents
  kind: core
  from: 2000-02
  parents: [deng-theory]
  terms: [三个代表]
  carriers: [jiang-zemin]
  concept: three-represents
  summary: >-
    江泽民 2000 年提出，党要始终代表先进生产力的发展要求、先进文化的前进方向、最广大人民的根本利益；2001 年七一讲话据此允许
    私营企业主入党，2002 年十六大写入党章。它把党从阶级党进一步改写为执政党，是 1978 年以来官方正统在经济上最靠市场一端的时刻，
    左派当时批评它背离工人阶级先锋队的性质。
  pos:
    - { at: 2002-11, x: 0.6, y: -0.3, z: -0.6, note: 吸收私营企业主入党、加入世贸，经济最市场化、对外最融入的一段 }
  voices:
    - voice: doc
      text: 始终做到“三个代表”，是我们党的立党之本、执政之基、力量之源。
      cite: i01-12371-2022-10-22-party-charter
      quote: true
  cites: [i01-12371-2022-10-22-party-charter, i01-chinanews-2002-11-14-16th-charter-resolution]

- id: scientific-development
  name: 科学发展观
  en: Scientific Outlook on Development
  kind: core
  from: 2003-10
  parents: [three-represents]
  terms: [科学发展观]
  carriers: [hu-jintao, wen-jiabao]
  concept: scientific-development
  summary: >-
    胡锦涛在非典之后提出，以人为本、全面协调可持续发展，2007 年十七大写入党章，2012 年十八大列为指导思想。
    它是对江泽民时代单纯追求增长的修正，强调城乡、区域、经济社会和人与自然的统筹，经济上比三个代表略向国家调节回摆，
    但政治与对外基本延续。
  pos:
