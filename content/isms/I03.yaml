  terms: [两面人]
  carriers: [zhou-yongkang, bo-xilai]
  summary: >-
    十八届六中全会前后用来定性落马高官的罪名，指表面忠诚、背后阳奉阴违、搞团团伙伙的干部，常与妄议中央、七个有之一起出现。
    历史决议把清除两面人列为维护集中统一领导的成果。它针对的是忠诚而非路线，罪名本身不指明被告的政治立场。
