- id: low-red-high-black
  name: 低级红、高级黑
  short: 低级红高级黑
  en: Low-level red, high-level black
  kind: label
  from: 2019-01
  terms: [低级红, 高级黑]
  carriers: []
  concept: two-safeguards
  summary: >-
    2019 年《中共中央关于加强党的政治建设的意见》写入。低级红指庸俗、过火的颂扬，高级黑指以颂扬为名的反讽，
    二者都被认为损害领袖与党的形象。它是少见的指向过度效忠一侧的罪名，说明表态的分寸本身也被纳入政治纪律。
  pos:
    - { at: 2019-02, x: -0.2, y: -0.9, z: 0.7, note: 被批判的是过度颂扬、调门过高者，取极端效忠的位置 }
  voices:
    - voice: doc
      text: 不得搞任何形式的“低级红”、“高级黑”，决不允许对党中央阳奉阴违做两面人、搞两面派、搞“伪忠诚”。
      cite: i03-xinhua-2019-02-27-political-building
      quote: true
  cites: [i03-xinhua-2019-02-27-political-building]

- id: two-faced-people
