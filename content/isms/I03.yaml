    - { at: 2013, x: 0.3, y: -0.6, z: 0.2, note: 萧功秦所说 2.0 版：集权程度更高，市场化退居其次 }
  voices:
    - voice: witness
      text: 1988年有一次我去小平那里。……我说有一种新权威主义，就是政治强人稳定形势发展经济。他说：”我就是这个主张。但是不必用这个提法。”
      cite: i03-ipkmedia-zhao-ziyang-yang-jisheng
      quote: true
    - voice: scholar
      text: 如果邓小平是中国新权威主义的1.0版本，习近平就是中国新权威主义的2.0版本
      cite: i03-aisixiang-2013-xiao-gongqin
      quote: true
    - voice: zh
      text: 绝大部分观察家都能从1980年代末中国改革开放关键时期的赵紫阳时代的新权威主义模式和习近平目前的做法中找到许多共同之处
      cite: i03-bbc-2014-03-18-xi-power
      quote: true
  cites: [i03-aisixiang-wu-jiaxiang-neo-authority, i03-ipkmedia-zhao-ziyang-yang-jisheng, i03-aisixiang-2013-xiao-gongqin]

- id: new-left
  name: 新左派
  en: New Left
  kind: trend
  from: 1997
  parents: [mao-thought]
  against: [neoliberalism, liberals]
  terms: [新左派]
  carriers: [wang-hui, cui-zhiyuan, wang-shaoguang, gan-yang]
  concept: new-left
  summary: >-
    1990 年代后期与自由派论战中形成的学院派，借西方左翼理论批评市场化、私有化与全球化造成的不公，主张以国家能力纠正市场。
    2008—2012 年不少人为重庆模式背书，薄熙来落马后一度尴尬；此后逐渐从体制批评者变为体制支持者，与国家主义合流。
  pos:
    - { at: 2000, x: -0.5, y: 0.0, z: 0.3, note: 批评市场化，政治上要求经济民主与参与 }
    - { at: 2010, x: -0.6, y: -0.5, z: 0.5, note: 为重庆模式提供理论论证 }
    - { at: 2020, x: -0.5, y: -0.75, z: 0.7, note: 中国研究评论（CBR）称其已由体制批评者转为支持者 }
  voices:
    - voice: west
      text: Their recommendations and criticisms are, instead, based on a belief that state power can redress the injustices created by free markets, privatization and globalization. Their views are also characterized by a fierce nationalism and criticism of the West.
      cite: i02-nbc-2009-new-left
      quote: true
      zh: 他们的建议和批评基于这样一种信念：国家权力可以纠正自由市场、私有化和全球化造成的不公。他们的观点还带有强烈的民族主义和对西方的批判。
    - voice: scholar
      text: The Chongqing model and its unhappy fate was one turning point through which the New Left slowly transformed from regime critics to regime supporters.
      cite: i02-cbr-2024-05-16-new-left-state
      quote: true
      zh: 重庆模式及其不幸的结局是一个转折点，新左派由此慢慢从体制批评者转变为体制支持者。
    - voice: zh
      text: 至于那些不遗余力地为重庆当局出谋划策，进行理论论证的新左学人们面临的尴尬可以说是不言而喻。
      cite: i02-bbc-2012-02-27-chongqing-trends
      quote: true
  cites: [i02-nbc-2009-new-left, i02-cbr-2024-05-16-new-left-state, i02-bbc-2012-02-27-chongqing-trends]

