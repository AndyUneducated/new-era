      cite: i03-gov-2017-12-20-xi-economic-thought
      quote: true
    - voice: official
      text: 坚持使市场在资源配置中起决定性作用，更好发挥政府作用，坚决扫除经济发展的体制机制障碍
      cite: i03-gov-2017-12-20-xi-economic-thought
      quote: true
  cites: [i03-gov-2017-12-20-xi-economic-thought, i02-gov-2024-gwr]

