- id: xi-thought
  name: 习近平新时代中国特色社会主义思想
  short: 习近平思想
  en: Xi Jinping Thought
  kind: core
  from: 2017-10
  parents: [deng-theory, scientific-development]
  against: [western-constitutional-democracy, historical-nihilism]
  terms: [习近平新时代中国特色社会主义思想]
  carriers: [xi-jinping, wang-huning]
  concept: xi-thought
  summary: >-
    十九大写入党章、2018 年写入宪法的指导思想，2021 年第三个历史决议称其实现了马克思主义中国化新的飞跃。它以党的全面领导为纲，
    此后又在经济、强军、外交、生态、法治、文化各领域分出子思想（见本图同族条目）。与前任相比，它把政治集中、意识形态安全
    与对外斗争放在更前的位置，经济上则从市场决定性作用的表述逐步转向安全与共同富裕。
  pos:
    - { at: 2017-10, x: 0.0, y: -0.7, z: 0.5, note: 十九大：党政军民学党是领导一切的，大国外交，经济上仍讲市场决定性作用 }
    - { at: 2022-10, x: -0.4, y: -0.85, z: 0.75, note: 二十大：统筹发展和安全、斗争精神；此前已有平台整顿与共同富裕 }
  voices:
    - voice: doc
      text: 习近平新时代中国特色社会主义思想是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化新的飞跃
      cite: b04-gov-2021-11-16-resolution
      quote: true
    - voice: zh
      text: 这次习近平的名字进去了，象征他是党内至高无上的领导人
      cite: i01-bbc-2017-10-24-xi-thought-charter
      quote: true
    - voice: zh
      text: 唯辛还表示，这份历史决议表明中国的体制已经完成转型，宣告过去三十年中共威权主义统治结束，确立了新的极权主义体制
      cite: i02-bbc-2021-11-19-resolution-analysis
      quote: true
  cites: [i01-gov-2017-10-18-19th-report, b04-gov-2021-11-16-resolution, i01-12371-2022-10-22-party-charter]

- id: xi-economic-thought
  name: 习近平经济思想
  en: Xi Jinping Thought on the Economy
