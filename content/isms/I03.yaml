- id: xi-rule-of-law-thought
  name: 习近平法治思想
  en: Xi Jinping Thought on the Rule of Law
  kind: core
  from: 2020-11
  parents: [xi-thought]
  against: [western-constitutional-democracy]
  terms: [习近平法治思想]
  carriers: [xi-jinping]
