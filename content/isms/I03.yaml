  voices:
    - voice: official
      text: 习近平法治思想是顺应实现中华民族伟大复兴时代要求应运而生的重大理论创新成果
      cite: i03-gov-2020-11-17-rule-of-law-conference
      quote: true
    - voice: doc
      text: 必须警惕和防范西方所谓“宪政”、多党轮流执政、“三权鼎立”等政治思潮的侵蚀影响。
      cite: b04-gov-2021-11-16-resolution
      quote: true
  cites: [i03-gov-2020-11-17-rule-of-law-conference, b04-gov-2021-11-16-resolution]

