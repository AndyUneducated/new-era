- id: promotion-tournament
  name: 晋升锦标赛
  en: Promotion Tournament
  kind: debate
  by: [zhou-lian]
  first:
    date: 2005
    text: Li和Zhou（2005）用1979—1995年省级领导人数据发现，经济绩效越好，省级领导晋升可能性越高，被视为这一理论的实证基础。
    cite: e16-cufe-li-zhou-vs-tao
    quote: 由此奠定了“官员晋升锦标赛”理论的实证基础
  summary: 晋升锦标赛是北京大学经济学者周黎安等提出的解释中国地方官员行为和经济增长的理论：中央集中掌握人事权，上级按地区经济增长等可比指标考核下级，地方官员为升迁彼此竞争，于是全力招商引资、上项目。Li和Zhou在2005年用1979—1995年省级数据发现，经济绩效越好，省级领导越可能晋升；周黎安2007年把这种模式称为中国经济奇迹的重要根源，同时认为它的扭曲后果是当前经济各种重大问题的主要根源。陶然等学者2010年质疑并不存在把提拔与经济增长直接挂钩的层层考核体系，认为GDP数字容易扭曲，政治网络更关键；史宗瀚（Victor Shih）等2012年用中央委员数据也未发现增长表现带来更高党内排名，派系关系、学历和财政收入才起作用。周黎安后来承认这在学术上仍有争议，并把理论扩展为行政发包制与政治锦标赛的结合。官方从2013年起强调不再简单以GDP论英雄，周黎安2018年说，中央淡化GDP考核后，以经济增长为中心的锦标赛经历了一系列调整。
  terms: [晋升锦标赛, 政治锦标赛]
  related: [correct-performance-view, scientific-development, good-cadre-standard]
  sections:
    - h: 理论的提出
      from: 2005
      to: 2007-07
      text: Li和Zhou（2005）利用1979年至1995年间中国省级高层领导人员的经济绩效数据，发现省级领导晋升的可能性随经济效益而上升，政治生命终止的可能性随经济效益而下降。周黎安2007年在《经济研究》发表《中国地方官员的晋升锦标赛模式研究》，认为从上世纪80年代起地方官员围绕GDP增长展开晋升锦标赛，“晋升锦标赛是将行政权力集中与强激励兼容在一起的一种治理政府官员的模式”，它的运行不依赖于政治体制的巨大变化；但它激励官员的目标与政府职能的合理设计之间存在严重冲突，又是当前经济各种重大问题的主要根源。他说这可以帮助理解中央提出科学发展观的背景。
      cites: [e16-cufe-li-zhou-vs-tao, i12-aisixiang-2007-zhou-lian-tournament]
    - h: 质疑
      from: 2010
      to: 2012-02
      text: 陶然等（2010）认为，改革开放以后的中国并不存在一个从中央到省、到地市、到县乡层层放大的，把政治提拔和经济增长或主要经济指标直接挂钩的考核体系。理由包括：如果升迁与客观的竞赛指标挂钩，上级就会丧失对下级任命的最终控制权，而这种控制权正是政治体制的基本特征；地方官员有动力扭曲GDP增长率，所谓“数字出官、官出数字”，上级不可能据此提拔；官员的政治网络对提拔起关键作用。史宗瀚、Christopher Adolph和刘明兴2012年在《美国政治科学评论》发文，用中央委员传记数据和贝叶斯方法估计排名，未发现历届党代会上增长表现带来更高的党内排名，派系关系、学历和省级财政收入才起显著作用。
      cites: [e16-cufe-li-zhou-vs-tao, e16-cambridge-2012-shih-adolph-liu]
    - h: 周黎安的修正
      from: 2014-03
      to: 2018-05
      text: 2014年周黎安对《南风窗》说，“经济发展是不是考核官员最重要的指标，在学术上还存在争议”，但执行中考核确实偏重经济指标。他发现各级经济增长指标“层层加码”，官场竞争比市场竞争“更具有零和性质”，容易出现产能过剩、基建投资急速增长和地方保护；地级市委书记换任的年份，GDP增速平均下降0.5%左右。他认为“仅靠完善指标体系，走不了很远”。2018年他把中国政府治理概括为纵向的行政发包与横向的政治锦标赛相结合，称干部考核对经济绩效的倚重引发了“以经济增长为中心的政治锦标赛”，而中央强调淡化GDP考核后，锦标赛正在调整。
      cites: [e16-sina-2014-03-20-zhou-lian-nfc, e16-thepaper-2018-05-25-zhou-lian-governance]
    - h: 官方的转向
      from: 2013-06
      to: 2024-07
      text: 2013年6月习近平在全国组织工作会议上说“再也不能简单以国内生产总值增长率来论英雄了”，12月中组部通知要求政绩考核不搞GDP排名。2021年历史决议把“不唯生产总值”列入选人用人原则。2024年二十届三中全会决定要求“健全有效防范和纠治政绩观偏差工作机制”。
      cites: [i12-gov-2013-06-29-org-work-conference, i12-people-2013-12-09-performance-notice, b04-gov-2021-11-16-resolution, i01-gov-2024-07-18-third-plenum-decision]
  sides:
    - label: 锦标赛说
      text: Li和Zhou（2005）、周黎安（2007）认为地方官员围绕经济增长竞争晋升，这是中国高增长的重要动力；周黎安也认为它与政府职能的合理设计存在严重冲突，是许多经济问题的根源。
      who: [zhou-lian]
      cites: [e16-cufe-li-zhou-vs-tao, i12-aisixiang-2007-zhou-lian-tournament]
    - label: 考核挂钩质疑说
      text: 陶然等（2010）认为不存在把提拔与GDP直接挂钩的层层考核体系，上级保留任命的最终控制权，GDP数字易被扭曲，政治网络更关键。
      who: []
      cites: [e16-cufe-li-zhou-vs-tao]
    - label: 派系与财政说
      text: 史宗瀚等（2012）用中央委员数据未发现增长表现带来更高党内排名，认为派系关系、学历和财政汇集能力更重要，晋升体系服务于政权和领导人的即时需要。
      who: []
      cites: [e16-cambridge-2012-shih-adolph-liu]
  voices:
    - voice: scholar
      text: 晋升锦标赛作为中国政府官员的激励模式，它是中国经济奇迹的重要根源，但由于晋升锦标赛自身的一些缺陷，尤其是其激励官员的目标与政府职能的合理设计之间存在严重冲突，它目前正面临着重要的转型。
      cite: i12-aisixiang-2007-zhou-lian-tournament
      quote: true
    - voice: scholar
      text: 用“官员晋升锦标竞赛理论”来解释中国转轨时期高增长无论在逻辑还是实证方面都存在较大缺陷。
      cite: e16-cufe-li-zhou-vs-tao
      quote: true
    - voice: scholar
      text: we find no evidence that strong growth performance was rewarded with higher party ranks at any of the postreform party congresses.
      zh: 我们没有发现证据表明，改革后历届党代会上强劲的增长表现换来了更高的党内排名。
      cite: e16-cambridge-2012-shih-adolph-liu
      quote: true
  policies:
    - date: 2013-06-28
      name: 全国组织工作会议
      text: 习近平要求不能简单以国内生产总值增长率论英雄。
      events: [i12-2013-org-work-conference]
      cite: i12-gov-2013-06-29-org-work-conference
    - date: 2013-12-06
      name: 关于改进地方党政领导班子和领导干部政绩考核工作的通知
      text: 中组部规定政绩考核不搞GDP排名。
      events: [i12-2013-performance-evaluation-notice]
      cite: i12-people-2013-12-09-performance-notice
  cites: [e16-cufe-li-zhou-vs-tao, i12-aisixiang-2007-zhou-lian-tournament, e16-cambridge-2012-shih-adolph-liu, e16-sina-2014-03-20-zhou-lian-nfc, e16-thepaper-2018-05-25-zhou-lian-governance]

- id: three-distinctions
  name: 三个区分开来
  en: The Three Distinctions
  kind: formula
  parent: strict-governance
  by: [xi-jinping]
  first:
    date: 2016-01-18
    text: 习近平在省部级主要领导干部专题研讨班上谈“为官不为”时提出。
    cite: e16-people-2016-05-10-xi-jan18-speech-p4
    quote: 要把干部在推进改革中因缺乏经验、先行先试出现的失误和错误，同明知故犯的违纪违法行为区分开来
  codified:
    - date: 2018-05-20
      where: 中办《关于进一步激励广大干部新时代新担当新作为的意见》
      cite: e16-gov-2018-05-20-incentive-opinion
      quote: 要全面落实习近平总书记关于“三个区分开来”的重要要求
    - date: 2022-10-16
      where: 二十大报告
      cite: i01-gov-2022-10-16-20th-report
      quote: 落实“三个区分开来”，激励干部敢于担当、积极作为。
    - date: 2023-12-27
      where: 中共中央关于印发《中国共产党纪律处分条例》的通知
      cite: e12-gov-2023-12-27-discipline-regulations
      quote: 落实“三个区分开来”，把从严管理监督和鼓励担当作为高度统一起来
    - date: 2024-07-18
      where: 二十届三中全会决定
      cite: i01-gov-2024-07-18-third-plenum-decision
      quote: 落实“三个区分开来”，激励干部开拓进取、干事创业。
  summary: 三个区分开来是习近平2016年1月提出的干部容错原则：把改革中因缺乏经验、先行先试出现的失误错误，把上级尚无明确限制的探索性试验中的失误错误，把为推动发展的无意过失，分别同明知故犯、明令禁止后我行我素、为谋取私利的违纪违法行为区分开来。它针对习近平所说部分干部积极性不高、存在一定程度“为官不为”的问题。2016年十八届六中全会公报提出建立容错纠错机制，2018年中办激励干部担当作为的意见把它写成容错依据，此后基层减负、问责条例、二十大报告、2023年纪律处分条例通知、2024年三中全会决定一再重申。官方同时强调容错不是纪律“松绑”。基层和媒体则反映落实难：容错制度多为原则性概括，干部担心“洗碗越多摔碗越多”；海外学者认为十年高压形成的框架下，干部仍会观望。
  quote:
    text: 把干部在推进改革中因缺乏经验、先行先试出现的失误和错误，同明知故犯的违纪违法行为区分开来；把上级尚无明确限制的探索性试验中的失误和错误，同上级明令禁止后依然我行我素的违纪违法行为区分开来；把为推动发展的无意过失，同为谋取私利的违纪违法行为区分开来
    cite: e16-people-2016-05-10-xi-jan18-speech-p4
  terms: [三个区分开来, 容错纠错]
  related: [strict-governance, good-cadre-standard, correct-performance-view, org-line-new-era]
  sections:
    - h: 为官不为与2016年讲话
      from: 2016-01
      to: 2016-05
      text: 2016年1月18日，习近平在省部级主要领导干部学习贯彻十八届五中全会精神专题研讨班上说，当前干部队伍“一个突出问题是部分干部思想困惑增多、积极性不高”，存在一定程度的为官不为，并归为能力不足、动力不足、担当不足三种情况。他把原因部分归于一些地方“政策尺度把握不够准确，方式方法有些简单生硬”，以及负面舆论和恶意炒作。他要求把严格管理干部和热情关心干部结合起来，提出三个区分开来，“保护那些作风正派又敢作敢为、锐意进取的干部”。讲话5月10日在人民日报发表。
      cites: [e16-people-2016-05-10-xi-jan18-speech-p4]
    - h: 容错纠错机制
      from: 2016-10
      to: 2018-05
      text: 2016年10月十八届六中全会公报要求“党的各级组织要旗帜鲜明为敢于担当的干部担当，为敢于负责的干部负责”，并提出“建立容错纠错机制，宽容干部在工作中特别是改革创新中的失误”。2018年5月中办意见把三个区分开来写成容错依据，要求结合“动机态度、客观条件、程序方法、性质程度、后果影响以及挽回损失等情况”综合分析，对该容的大胆容错，不该容的坚决不容，并防止拿容错当保护伞、搞纪律松绑。意见的文字比2016年讲话少了“上级”二字：讲话是“把上级尚无明确限制的探索性试验中的失误和错误，同上级明令禁止后依然我行我素的违纪违法行为区分开来”，意见是“把尚无明确限制的探索性试验中的失误错误，同明令禁止后依然我行我素的违纪违法行为区分开来”。
      cites: [i01-cpc-2016-10-27-6th-plenum-communique, e16-gov-2018-05-20-incentive-opinion, e16-people-2016-05-10-xi-jan18-speech-p4]
    - h: 与问责并行
      from: 2019-03
      to: 2022-10
      text: 2019年中办为基层减负的通知要求把三个区分开来的要求具体化，“正确把握干部在工作中出现失误错误的性质和影响”，同时修订问责条例、严肃查处诬告陷害行为。2020年1月中央纪委全会工作报告说落实这一要求，“既防止问责不力，又防止泛化、简单化”，同一报告称2019年全国4.5万名党员领导干部被问责。2022年中央纪委向二十大的报告说，五年来落实三个区分开来要求，“严肃查处诬告陷害行为，及时开展澄清正名工作”。
      cites: [lk3-gov-2019-03-11-base-burden, b05-ccdi-2020-01-zhao-leji-report, b05-saac-2022-10-ccdi-report]
    - h: 二十大后反复重申
      from: 2022-10
      to: 2024-10
      text: 二十大报告要求落实三个区分开来，“激励干部敢于担当、积极作为”。2023年1月习近平在二十届中央纪委二次全会上要求“坚持严管和厚爱结合、激励和约束并重”。2023年全国组织工作会议上，中组部部长李干杰要求细化实化三个区分开来，“解决好不敢为问题”，对哪些错能容、哪些错不能容、容到什么程度，“尽可能明确清晰、便于操作”，并研究制定落实三个区分开来的若干规定；他同时说容错纠错不是搞纪律松绑。2023年12月纪律处分条例的印发通知、2024年政府工作报告和7月三中全会决定都写入这一要求；9月26日中央政治局会议要求“为担当者担当、为干事者撑腰”。
      cites: [i01-gov-2022-10-16-20th-report, i11-gov-2023-01-09-xi-ccdi-2nd-plenum, i12-people-2023-08-22-org-conference-speeches, e12-gov-2023-12-27-discipline-regulations, i02-gov-2024-gwr, i01-gov-2024-07-18-third-plenum-decision, e16-ce-2024-10-08-three-distinctions]
    - h: 落实之难
      from: 2024-01
      to: 2026-04
      text: 2024年1月新华每日电讯报道，基层干部反映不担责没法干事，担了责如履薄冰，有“洗碗越多摔碗越多”的担忧；“一些地方的容错纠错制度多为原则性概括，与实践情形难以一一吻合，导致基层不敢轻易开展容错纠错”。北京探索重大创新和改革事项的容错预审备案，浙江推动部分单位建立容错清单。中国经济网2024年10月的评论也承认，实践中“对于容错纠错的定性标准把握不准、工作流程不够明晰”。美国之音2025年1月引述华尔街日报说，习近平试图传递无心之失会从宽处理的信息；胡平认为官方处分多因错误政绩观、盲目决策等，很少是因为努力工作但方法用错，张执中则认为十年形成的框架下干部仍会观望。2026年4月新华网评论仍说，治“太平官”的关键在于旗帜鲜明地落实三个区分开来。
      cites: [e16-gov-2024-01-rongcuo-xiwan, e16-ce-2024-10-08-three-distinctions, e16-voa-2025-01-23-rongcuo, i12-xinhua-2026-04-16-taiping-guan]
  lists:
    - title: 三个区分开来（2016年1月18日讲话）
      cite: e16-people-2016-05-10-xi-jan18-speech-p4
      items:
        - 把干部在推进改革中因缺乏经验、先行先试出现的失误和错误，同明知故犯的违纪违法行为区分开来
        - 把上级尚无明确限制的探索性试验中的失误和错误，同上级明令禁止后依然我行我素的违纪违法行为区分开来
        - 把为推动发展的无意过失，同为谋取私利的违纪违法行为区分开来
    - title: “为官不为”的三种情况（2016年1月18日讲话）
      cite: e16-people-2016-05-10-xi-jan18-speech-p4
      items: [能力不足而“不能为”, 动力不足而“不想为”, 担当不足而“不敢为”]
  voices:
    - voice: official
      text: 当然，宽容不是纵容。容错是一种好机制，不能异化为变相“纪律松绑”，给少数人发放“免责牌”、穿“保护衣”。
      cite: e16-gov-2024-01-rongcuo-xiwan
      quote: true
    - voice: official
      text: 但由于落实“三个区分开来”是一项政治性很强的工作，实践中仍然存在对于容错纠错的定性标准把握不准、工作流程不够明晰、理念弘扬不够深入，推动澄清查诬同向发力不够有力等问题。
      cite: e16-ce-2024-10-08-three-distinctions
      quote: true
    - voice: west
      text: 这10年所形成的这样的框架，对干部来讲，不会因为习讲一句话，他们就忽然间会觉得情势已有改变，因为风险实在是太大，所以干部基本上还是会观望。
      cite: e16-voa-2025-01-23-rongcuo
      quote: true
  policies:
    - date: 2016-01-18
      name: 省部级主要领导干部专题研讨班讲话
      text: 习近平提出三个区分开来。
      events: [e16-2016-three-distinctions-speech]
      cite: e16-people-2016-05-10-xi-jan18-speech-p4
    - date: 2016-10-27
      name: 十八届六中全会公报
      text: 公报提出建立容错纠错机制。
      events: [e03-2016-sixth-plenum-core]
      cite: i01-cpc-2016-10-27-6th-plenum-communique
    - date: 2018-05-20
      name: 关于进一步激励广大干部新时代新担当新作为的意见
      text: 中办意见建立激励机制和容错纠错机制。
      events: [e16-2018-cadre-incentive-opinion]
      cite: e16-gov-2018-05-20-incentive-opinion
    - date: 2019-03-11
      name: 关于解决形式主义突出问题为基层减负的通知
      text: 通知要求把三个区分开来的要求具体化。
      events: [e14-2019-base-burden-year]
      cite: lk3-gov-2019-03-11-base-burden
    - date: 2024-07-18
      name: 二十届三中全会决定
      text: 决定要求落实三个区分开来，激励干部开拓进取、干事创业。
      events: [third-plenum-20th]
      cite: i01-gov-2024-07-18-third-plenum-decision
