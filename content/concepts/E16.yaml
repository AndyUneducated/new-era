- id: good-cadre-standard
  name: 好干部标准
  en: The Standard for Good Cadres
  kind: formula
  parent: xi-party-building-thought
  by: [xi-jinping]
  first:
    date: 2013-06-28
    text: 习近平在全国组织工作会议上提出好干部的五条标准。
    cite: i12-gov-2013-06-29-org-work-conference
    quote: 好干部要做到信念坚定、为民服务、勤政务实、敢于担当、清正廉洁。
  codified:
    - date: 2013-11-12
      where: 十八届三中全会《中共中央关于全面深化改革若干重大问题的决定》
      cite: e03-gov-2013-11-15-reform-decision
      quote: 真正把信念坚定、为民服务、勤政务实、敢于担当、清正廉洁的好干部选拔出来。
    - date: 2016-10-27
      where: 十八届六中全会公报
      cite: i01-cpc-2016-10-27-6th-plenum-communique
      quote: 坚持信念坚定、为民服务、勤政务实、敢于担当、清正廉洁的好干部标准
    - date: 2017-10-24
      where: 党章（十九大修正案）第三十六条
      cite: d01-12371-2017-10-28-party-charter
      quote: 党的各级领导干部必须信念坚定、为民服务、勤政务实、敢于担当、清正廉洁
    - date: 2019-03-17
      where: 党政领导干部选拔任用工作条例（2019年修订）第七条
      cite: e16-gov-2019-03-17-cadre-selection-regs
      quote: 党政领导干部必须信念坚定、为民服务、勤政务实、敢于担当、清正廉洁
    - date: 2021-11-11
      where: 十九届六中全会历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 明确信念坚定、为民服务、勤政务实、敢于担当、清正廉洁的新时代好干部标准
  summary: 好干部标准是习近平2013年6月全国组织工作会议上提出的干部五条标准：信念坚定、为民服务、勤政务实、敢于担当、清正廉洁。同年十八届三中全会决定要求按此选拔干部、纠正唯票取人和唯分取人；2016年六中全会公报、2017年党章第三十六条、2019年干部任用条例第七条先后写入这二十个字。2014年古田全军政治工作会议另定军队好干部标准：对党忠诚、善谋打仗、敢于担当、实绩突出、清正廉洁。此后官方文件不断加重政治标准：2018年组织工作会议要求“把政治标准放在第一位”，同年中办意见要求突出信念、政治、责任、能力、作风五个过硬，2024年三中全会改为选拔政治过硬、敢于担当、锐意改革、实绩突出、清正廉洁的干部。名称上，2018至2019年的文件多称“新时期好干部标准”，2021年历史决议起统一称“新时代好干部标准”。
  quote:
    text: 好干部要做到信念坚定、为民服务、勤政务实、敢于担当、清正廉洁。
    cite: i12-gov-2013-06-29-org-work-conference
  terms: [好干部标准, 新时代好干部标准, 新时期好干部标准]
  related: [org-line-new-era, xi-party-building-thought, correct-performance-view, strict-governance, three-distinctions]
  sections:
    - h: 2013年提出
      from: 2013-06
      to: 2013-11
      text: 2013年6月28日至29日全国组织工作会议上，习近平说“好干部要做到信念坚定、为民服务、勤政务实、敢于担当、清正廉洁”，又说“好干部不会自然而然产生”，一靠自身努力，二靠组织培养。他要求改进考核，“再也不能简单以国内生产总值增长率来论英雄了”，并要求“坚决制止简单以票取人的做法”。11月十八届三中全会决定要求“坚决纠正唯票取人、唯分取人等现象”，把信念坚定、为民服务、勤政务实、敢于担当、清正廉洁的好干部选拔出来。
      cites: [i12-gov-2013-06-29-org-work-conference, e03-gov-2013-11-15-reform-decision]
    - h: 写入公报、党章与条例
      from: 2014-10
      to: 2019-03
      text: 2014年10月古田全军政治工作会议上，习近平说“军队好干部的标准，就是要做到对党忠诚、善谋打仗、敢于担当、实绩突出、清正廉洁”，五条中有两条与地方干部标准相同。2016年10月十八届六中全会公报要求选拔任用干部坚持这一好干部标准。2017年十九大修改的党章第三十六条规定，党的各级领导干部必须信念坚定、为民服务、勤政务实、敢于担当、清正廉洁；2019年修订的干部任用条例第七条对党政领导干部作了同样规定，第一条要求“坚持新时期好干部标准”。
      cites: [e03-gov-2014-11-01-gutian, i01-cpc-2016-10-27-6th-plenum-communique, d01-12371-2017-10-28-party-charter, e16-gov-2019-03-17-cadre-selection-regs]
    - h: 政治标准优先
      from: 2018-05
      to: 2024-07
      text: 2018年5月中办《关于进一步激励广大干部新时代新担当新作为的意见》要求“坚持好干部标准，突出信念过硬、政治过硬、责任过硬、能力过硬、作风过硬”。7月全国组织工作会议要求“坚持好干部标准，把政治标准放在第一位”。2019年干部任用条例第三条规定选拔任用“必须把政治标准放在首位”。2022年二十大报告要求“把新时代好干部标准落到实处”，坚持把政治标准放在首位。2024年7月二十届三中全会决定改用新的五项表述，要求“大力选拔政治过硬、敢于担当、锐意改革、实绩突出、清正廉洁的干部”，与2013年的二十字相比，信念坚定、为民服务、勤政务实被政治过硬、锐意改革、实绩突出取代。
      cites: [e16-gov-2018-05-20-incentive-opinion, i12-xinhua-2018-07-04-org-work-conference, e16-gov-2019-03-17-cadre-selection-regs, i01-gov-2022-10-16-20th-report, i01-gov-2024-07-18-third-plenum-decision]
    - h: 从“新时期”到“新时代”
      from: 2018-07
      to: 2023-08
      text: 2018年全国组织工作会议的新华社通稿说党“坚持贯彻新时期好干部标准”，要求年轻干部“符合新时期好干部标准”；2019年干部任用条例的通知和第一条也用“新时期”。2021年历史决议改称“新时代好干部标准”，并与“坚持不唯票、不唯分、不唯生产总值、不唯年龄”并列。2022年二十大报告和2023年全国组织工作会议沿用“新时代好干部标准”，后者说十年来四唯取人偏向“得到坚决纠正”。
      cites: [i12-xinhua-2018-07-04-org-work-conference, e16-gov-2019-03-17-cadre-selection-regs, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i12-people-2023-08-22-org-conference-speeches]
