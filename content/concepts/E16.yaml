# E16 (round 18): 城乡建设用地增减挂钩、新时代党的组织路线、好干部标准、晋升锦标赛、三个区分开来。

- id: land-linkage
  name: 城乡建设用地增减挂钩
  en: Linking Urban and Rural Construction Land Quotas
  kind: formula
  parent: sannong
  first:
    date: 2004-10-21
    text: 国务院《关于深化改革严格土地管理的决定》在村镇建设用地管理一条中提出城镇建设用地增加与农村建设用地减少相挂钩。
    cite: e16-gov-2004-10-21-guofa-28
    quote: 鼓励农村建设用地整理，城镇建设用地增加要与农村建设用地减少相挂钩。
  codified:
    - date: 2008-06-27
      where: 国土资源部《城乡建设用地增减挂钩试点管理办法》（国土资发〔2008〕138号）
      cite: e16-wuhan-2008-06-27-guagou-measures
      quote: 本办法所称城乡建设用地增减挂钩（以下简称挂钩）是指依据土地利用总体规划
    - date: 2010-12-27
      where: 国务院关于严格规范城乡建设用地增减挂钩试点切实做好农村土地整治工作的通知（国发〔2010〕47号）
      cite: e16-gov-2010-12-27-guofa-47
      quote: 严禁在农村地区盲目建高楼、强迫农民住高楼。
    - date: 2015-11
      where: 中共中央、国务院关于打赢脱贫攻坚战的决定
      cite: i06-gov-2015-12-07-poverty-decision
      quote: 利用城乡建设用地增减挂钩政策支持易地扶贫搬迁。
    - date: 2018-03-10
      where: 城乡建设用地增减挂钩节余指标跨省域调剂管理办法（国办发〔2018〕16号）
      cite: e16-gov-2018-03-10-cross-province-quota
      quote: 是指“三区三州”及其他深度贫困县城乡建设用地增减挂钩节余指标（以下简称节余指标）由国家统筹跨省域调剂使用。
  summary: 城乡建设用地增减挂钩是一种土地指标置换办法：把农村建设用地（多为宅基地）拆旧复垦为耕地，腾出的面积作为指标，用于城镇新增建设，在耕地总量不减的前提下扩大城镇用地。2004年国务院《关于深化改革严格土地管理的决定》首次提出“挂钩”，2006年4月山东、天津、江苏、湖北、四川五省市成为第一批试点，2008年国土资源部印发试点管理办法。指标可以换钱，各地借此拆村并居，2010年新京报报道二十多个省市农民“被上楼”，国务院11月叫停违背农民意愿的大拆大建，12月发出国发〔2010〕47号通知。2015年后这一政策转向扶贫：节余指标先获准在省域内流转，2018年又允许深度贫困地区跨省域调剂，按每亩数十万元结算。2020年山东大范围“合村并居”再次引发争议。官方把问题归于执行偏差，学者则认为指标交易本身给了地方拆村的动力，财新则把根源归于政府主导的城市化模式。
  quote:
    text: 严禁在农村地区盲目建高楼、强迫农民住高楼。
    cite: e16-gov-2010-12-27-guofa-47
  terms: [增减挂钩, 城乡建设用地增减挂钩, 合村并居, 节余指标]
  related: [new-socialist-countryside, sannong, poverty-alleviation, rural-revitalization]
  sections:
    - h: 缘起：耕地保护与城镇扩张
      from: 2004-10
      to: 2006-04
      text: 2004年10月21日国务院《关于深化改革严格土地管理的决定》要求严格执行占用耕地补偿制度，非农业建设经批准占用耕地的，“建设单位必须补充数量、质量相当的耕地”；在加强村镇建设用地管理一条中提出“鼓励农村建设用地整理，城镇建设用地增加要与农村建设用地减少相挂钩”，同一条还禁止城镇居民在农村购置宅基地。2006年4月，国土资源部把山东、天津、江苏、湖北、四川五省市列为城乡建设用地增减挂钩第一批试点。
      cites: [e16-gov-2004-10-21-guofa-28, i12-chinanews-2010-11-02-beishanglou]
    - h: 试点管理办法：项目区与周转指标
      from: 2008-06
      to: 2008-06
      text: 2008年6月27日国土资源部印发《城乡建设用地增减挂钩试点管理办法》，把拟复垦为耕地的农村建设用地地块（拆旧地块）和拟用于城镇建设的地块（建新地块）“等面积共同组成建新拆旧项目区”，在项目区内各类土地面积平衡的基础上增加耕地、节约集约利用建设用地。国土资源部向试点省份下达挂钩周转指标，周转指标“不得作为年度新增建设用地计划指标使用”，从项目区整体审批到归还指标一般不超过三年。办法要求选点布局举行听证、论证，“严禁违背农民意愿，大拆大建”。
      cites: [e16-wuhan-2008-06-27-guagou-measures]
    - h: 拆村并居与“被上楼”
      from: 2009
      to: 2010-11
      text: 2010年11月新京报报道，全国二十多个省市在推行让农民“上楼”的行动，各地“将农民的宅基地复垦，用增加的耕地，换取城镇建设用地指标。他们共同的政策依据是，城乡建设用地增减挂钩。”山东诸城1249个村合并为208个农村社区，江苏邳州坝头村一名村民因买不起足额面积的楼房自杀。中央农村工作领导小组副组长陈锡文说这场运动的实质是把农村建设用地倒过来给城镇用，如不有效遏制“恐怕要出大事”。11月10日国务院常务会议要求严格控制增减挂钩试点规模，村庄撤并须由农村集体经济组织和农户自主决定。
      cites: [i12-chinanews-2010-11-02-beishanglou, i12-jjckb-2010-11-11-state-council-guagou]
    - h: 国发〔2010〕47号
      from: 2010-12
      to: 2010-12
      text: 2010年12月27日国务院通知承认，试点中出现了“少数地方片面追求增加城镇建设用地指标、擅自开展增减挂钩试点和扩大试点范围、突破周转指标、违背农民意愿强拆强建等一些亟需规范的问题”。通知把“严禁盲目大拆大建和强迫农民住高楼”单列一条，要求严禁项目区跨县级行政区域设置、严禁循环使用周转指标，调剂给城镇使用的指标所得土地增值收益“必须及时全部返还农村”，并要求地方全面自查清理，对不符合政策规定的一律叫停。
      cites: [e16-gov-2010-12-27-guofa-47]
    - h: 转向扶贫：从省内流转到跨省调剂
      from: 2015-03
      to: 2018-03
      text: 2015年政府工作报告要求“完善和拓展城乡建设用地增减挂钩试点”。同年《中共中央、国务院关于打赢脱贫攻坚战的决定》提出“利用城乡建设用地增减挂钩政策支持易地扶贫搬迁”，在连片特困地区和国家扶贫开发工作重点县开展易地扶贫搬迁的，“允许将城乡建设用地增减挂钩指标在省域范围内使用”。2018年中央一号文件提出建立节余指标跨省域调剂机制，“将所得收益通过支出预算全部用于巩固脱贫攻坚成果和支持实施乡村振兴战略”。3月国务院办公厅印发跨省域调剂管理办法，调入价北京、上海每亩70万元，天津、江苏、浙江、广东每亩50万元；办法规定，监管中“发现弄虚作假、违背群众意愿强行实施的”，停止拨付并扣减调剂资金。
      cites: [i02-gov-2015-gwr, i06-gov-2015-12-07-poverty-decision, i06-gov-2018-02-04-rural-revitalization, e16-gov-2018-03-10-cross-province-quota]
    - h: 山东合村并居
      from: 2020-05
      to: 2020-06
      text: 2020年5月山东印发村庄布局专项规划，滨州、菏泽、聊城等地推行“合村并居”，被指要求过急、强制拆迁、先拆后建、补偿金过低。菏泽市当年政府工作报告要求“完成土地增减挂钩3万亩以上”。贺雪峰、桂华撰文说，新建社区基本是高层公寓，“大部分农民所获得的补偿款不够支付新房购置费用”，“各地通过行政压力推动合村并居，基层干群关系紧张”。桂华还认为地方政府对增减挂钩有错误想象：拆房、复垦、建安置房都要花钱，腾出的指标可能“最终在城市也使用不掉”。6月17日山东省政府新闻发布会上，自然资源厅厅长李琥说全省行政村6.95万个、平均人口530人，“没有下指标派任务，没有大规模的大拆大建”，村民同意率须达95%以上才能实施，也承认存在“个别项目论证不充分、政策宣讲不到位、工作作风不细致、方式方法简单等问题”。省委书记刘家义要求“规划引领、分类施策、有序推进”，代省长李干杰说搬不搬、建不建，“群众说了算”。
      cites: [e16-ifeng-2020-06-26-shandong-hecun, e16-sdaeu-2020-06-12-he-xuefeng-hecun, e16-thepaper-2020-06-17-shandong-response, e16-qq-2020-06-26-li-ganjie-hecun]
  sides:
    - label: 执行偏差论
      text: 国务院2010年通知肯定增减挂钩试点“对统筹城乡发展发挥了积极作用”，把强拆强建归于少数地方的违规操作；2020年山东官方同样说没有下指标派任务，问题出在个别项目论证不充分、方式方法简单，承诺纠偏而不停止农村社区建设。
      who: []
      cites: [e16-gov-2010-12-27-guofa-47, e16-thepaper-2020-06-17-shandong-response]
    - label: 指标驱动论
      text: 陈锡文2010年说，让农民上楼的实质是把农村建设用地倒过来给城镇用；贺雪峰、桂华2020年认为地方政府套用增减挂钩政策，一是想解决建设用地指标，二是想解决乡村建设资金，强推合村并居应当刹车。
      who: [chen-xiwen, he-xuefeng]
      cites: [i12-chinanews-2010-11-02-beishanglou, e16-sdaeu-2020-06-12-he-xuefeng-hecun]
    - label: 体制根源论
      text: 财新2010年评论认为，各地强制农民上楼不能归咎于增减挂钩政策本身，而是“现有政治体制下政府主导城市化模式的必然结果”。
      who: []
      cites: [i12-caixin-2010-11-13-guagou-brake]
  voices:
    - voice: doc
      text: 其土地增值收益必须及时全部返还农村，切实做到农民自愿、农民参与、农民满意。
      cite: e16-gov-2010-12-27-guofa-47
      quote: true
    - voice: scholar
      text: 地方政府希望增加财政收入可以理解，问题出在对“增减挂钩”的错误想象上。
      cite: e16-ifeng-2020-06-26-shandong-hecun
      quote: true
    - voice: zh
      text: 近年来各地此起彼伏强制“农民上楼”之举并不能归咎于“增减挂钩”，而是现有政治体制下政府主导城市化模式的必然结果
      cite: i12-caixin-2010-11-13-guagou-brake
      quote: true
  policies:
    - date: 2004-10-21
      name: 国务院关于深化改革严格土地管理的决定
      text: 提出鼓励农村建设用地整理，城镇建设用地增加与农村建设用地减少相挂钩。
      cite: e16-gov-2004-10-21-guofa-28
    - date: 2006-04
      name: 第一批增减挂钩试点
      text: 国土资源部把山东、天津、江苏、湖北、四川五省市列为第一批试点。
      events: [e16-2006-guagou-first-pilots]
      cite: i12-chinanews-2010-11-02-beishanglou
    - date: 2008-06-27
      name: 城乡建设用地增减挂钩试点管理办法
      text: 国土资源部规定项目区、周转指标和三年归还期限，要求听证、论证，严禁违背农民意愿大拆大建。
      cite: e16-wuhan-2008-06-27-guagou-measures
    - date: 2010-11-10
      name: 国务院常务会议规范增减挂钩试点
      text: 会议要求严格控制试点规模，村庄撤并由农村集体经济组织和农户自主决定。
      events: [i12-2010-land-swap-curb]
      cite: i12-jjckb-2010-11-11-state-council-guagou
    - date: 2010-12-27
      name: 国发〔2010〕47号
      text: 国务院通知严禁突破周转指标、严禁强迫农民住高楼，要求土地增值收益全部返还农村。
      events: [e16-2010-guofa-47]
      cite: e16-gov-2010-12-27-guofa-47
