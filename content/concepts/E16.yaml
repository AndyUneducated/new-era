      cite: i06-gov-2015-12-07-poverty-decision
    - date: 2018-03-10
      name: 城乡建设用地增减挂钩节余指标跨省域调剂管理办法
      text: 深度贫困地区的节余指标由国家统筹跨省域调剂，国家统一定价，资金用于脱贫攻坚和乡村振兴。
      events: [e16-2018-guagou-cross-province]
      cite: e16-gov-2018-03-10-cross-province-quota
    - date: 2022-04-10
      name: 中共中央、国务院关于加快建设全国统一大市场的意见
      text: 要求完善城乡建设用地增减挂钩节余指标、补充耕地指标跨区域交易机制。
      cite: i06-gov-2022-04-10-unified-market
  cites: [e16-gov-2004-10-21-guofa-28, i12-chinanews-2010-11-02-beishanglou, e16-wuhan-2008-06-27-guagou-measures, e16-gov-2010-12-27-guofa-47, i06-gov-2015-12-07-poverty-decision, e16-gov-2018-03-10-cross-province-quota, e16-ifeng-2020-06-26-shandong-hecun, e16-sdaeu-2020-06-12-he-xuefeng-hecun, i12-caixin-2010-11-13-guagou-brake]

- id: org-line-new-era
  name: 新时代党的组织路线
  en: The Party's Organizational Line for the New Era
  kind: formula
  parent: xi-party-building-thought
  by: [xi-jinping]
  first:
    date: 2018-07-03
    text: 习近平在全国组织工作会议上提出新时代党的组织路线，并给出完整定义。
    cite: i12-xinhua-2018-07-04-org-work-conference
    quote: 新时代党的组织路线是：全面贯彻新时代中国特色社会主义思想，以组织体系建设为重点
  codified:
    - date: 2019-03-17
      where: 党政领导干部选拔任用工作条例（2019年修订）第一条
      cite: e16-gov-2019-03-17-cadre-selection-regs
      quote: 深入贯彻新时代党的组织路线和干部工作方针政策
    - date: 2021-11-11
      where: 十九届六中全会《中共中央关于党的百年奋斗重大成就和历史经验的决议》
      cite: b04-gov-2021-11-16-resolution
      quote: 党提出和贯彻新时代党的组织路线
    - date: 2022-10-16
      where: 二十大报告
      cite: i01-gov-2022-10-16-20th-report
      quote: 提出和坚持新时代党的组织路线，突出政治标准选贤任能
    - date: 2022-10-22
      where: 党章（二十大修正案）总纲
      cite: i01-12371-2022-10-22-party-charter
      quote: 第三，坚持新时代党的组织路线。
  summary: 新时代党的组织路线是习近平2018年7月全国组织工作会议上提出的组织工作总纲，定义为：全面贯彻新时代中国特色社会主义思想，以组织体系建设为重点，着力培养忠诚干净担当的高素质干部，着力集聚爱国奉献的各方面优秀人才，坚持德才兼备、以德为先、任人唯贤，为坚持和加强党的全面领导、坚持和发展中国特色社会主义提供坚强组织保证。会议同时要求建立素质培养、知事识人、选拔任用、从严管理、正向激励五个体系，并强调好干部标准“把政治标准放在第一位”。2019年修订的干部任用条例第一条写入这一路线，2021年历史决议、2022年二十大报告把它列为新时代管党治党的成就，二十大修改的党章总纲把“坚持新时代党的组织路线”列为党的建设基本要求之一。2023年全国组织工作会议的讲话把它列为习近平关于党的建设的重要思想中的新理念之一。
  quote:
    text: 新时代党的组织路线是：全面贯彻新时代中国特色社会主义思想，以组织体系建设为重点，着力培养忠诚干净担当的高素质干部，着力集聚爱国奉献的各方面优秀人才，坚持德才兼备、以德为先、任人唯贤，为坚持和加强党的全面领导、坚持和发展中国特色社会主义提供坚强组织保证。
    cite: i12-xinhua-2018-07-04-org-work-conference
  terms: [新时代党的组织路线]
  related: [xi-party-building-thought, good-cadre-standard, strict-governance, party-leadership]
  sections:
    - h: 2018年全国组织工作会议提出
      from: 2018-07
      to: 2018-07
      text: 2018年7月3日至4日全国组织工作会议上，习近平说组织路线“对坚持党的领导、加强党的建设、做好党的组织工作具有十分重要的意义”，给出新时代党的组织路线的定义，称它“是理论的也是实践的”。他说贯彻这条路线，“建设忠诚干净担当的高素质干部队伍是关键”，要求建立源头培养、跟踪培养、全程培养的素质培养体系，日常考核、分类考核、近距离考核的知事识人体系，以德为先、任人唯贤、人事相宜的选拔任用体系，管思想、管工作、管作风、管纪律的从严管理体系，以及崇尚实干、带动担当、加油鼓劲的正向激励体系；选拔任用要“坚持好干部标准，把政治标准放在第一位”。中组部部长陈希总结讲话要求“践行新时代党的组织路线”。
      cites: [i12-xinhua-2018-07-04-org-work-conference]
    - h: 写入法规、决议与党章
      from: 2019-03
      to: 2022-10
      text: 2019年3月发布的修订版《党政领导干部选拔任用工作条例》第一条写明“深入贯彻新时代党的组织路线和干部工作方针政策”，中央通知要求围绕素质培养、知事识人、选拔任用、从严管理、正向激励体系完善配套制度。2021年历史决议说党“提出和贯彻新时代党的组织路线”，并与新时代好干部标准、不唯票、不唯分、不唯生产总值、不唯年龄并列。2022年二十大报告把“提出和坚持新时代党的组织路线，突出政治标准选贤任能”列入十年全面从严治党的成就；同月修改的党章总纲把“坚持新时代党的组织路线”列为党的建设基本要求的第三条，文字与2018年定义基本相同。2017年党章总纲此处尚无这一提法。
      cites: [e16-gov-2019-03-17-cadre-selection-regs, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i01-12371-2022-10-22-party-charter, d01-12371-2017-10-28-party-charter]
    - h: 2023年全国组织工作会议
      from: 2023-06
      to: 2023-08
      text: 2023年6月全国组织工作会议要求“深入落实新时代党的建设总要求和新时代党的组织路线”。会议讲话总结十年组织工作时说，各级组织部门“贯彻落实新时代党的建设总要求和新时代党的组织路线”，并把它列为习近平关于党的建设的重要思想中一系列新理念新思想新战略之一。新华社的会议观察文章在列举十年党建理论创新时，把“首次提出”新时代党的组织路线与“党的政治建设是党的根本性建设”并列。
      cites: [i12-people-2023-08-22-org-conference-speeches, i12-xinhua-2023-06-30-first-observation]
