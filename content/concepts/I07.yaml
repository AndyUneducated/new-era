      items:
        - 是否有利于发展社会主义社会的生产力
        - 是否有利于增强社会主义国家的综合国力
        - 是否有利于提高人民的生活水平
  policies:
    - date: 1997-09-12
      name: 以“三个有利于”衡量所有制形式
      text: 十五大报告调整和完善所有制结构时说，一切符合“三个有利于”的所有制形式都可以而且应该用来为社会主义服务，为此后国有经济布局调整和非公有制经济发展提供了依据。
      events: [e1997-15th-congress]
      cite: i01-wenming-1997-09-12-15th-report
