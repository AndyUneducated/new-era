# ---------- 开放与宏观经济 ----------
- id: going-out
  name: “走出去”战略
  en: Going Out Strategy
  kind: formula
  by: [jiang-zemin]
  first:
    date: 1997-12-24
    text: 江泽民会见全国外资工作会议代表时把“引进来”和“走出去”并称为对外开放的一个大战略。
    cite: e01-gov-2021-06-28-cpc-100y
    quote: “引进来”和“走出去”，是我们对外开放基本国策两个紧密联系、相互促进的方面，缺一不可，这是一个大战略
  codified:
    - date: 2001-03-05
      where: 2001年政府工作报告
      cite: i02-gov-2001-gwr
      quote: 鼓励有比较优势的企业到境外投资，开展加工贸易，合作开发资源，发展国际工程承包，扩大劳务出口等
    - date: 2002-11-08
      where: 十六大报告
      cite: i01-jszx-2002-11-08-16th-report
      quote: 实施“走出去”战略是对外开放新阶段的重大举措
    - date: 2007-10-15
      where: 十七大报告
      cite: b02-npc-2007-10-24-17th-report
      quote: 把“引进来”和“走出去”更好结合起来
  summary: “走出去”指鼓励中国企业到境外投资、承包工程和开发资源，与吸引外资的“引进来”相对。1997年12月江泽民首次把两者并称为一个大战略，后来又把它们比作对外开放的“两个轮子”。2001年政府工作报告正式把实施“走出去”战略列为任务，同时要求加强监管、防止国有资产流失；十六大报告称之为对外开放新阶段的重大举措。2005年中海油以185亿美元竞购美国优尼科，因美国国会反对而撤回报价。2009年金融危机期间，政府工作报告说企业“走出去”逆势上扬，非金融类对外直接投资433亿美元。2013年以后，“一带一路”成为对外投资的主要框架，2021年第三个历史决议提到要适应“走出去”日益扩大的新形势完善海外利益保护体系。
  terms: [走出去, 引进来和走出去相结合, 走出去战略]
  related: [wto-accession, belt-and-road, socialist-market-economy]
  voices:
    - voice: zh
      text: 其中最主要的政治原因是：中国经济迅速发展，而美国对华贸易赤字高达1600亿美元；此外，北京的政治和军事实力开始崛起。
      cite: e07-bbc-2005-07-03-cnooc
      quote: true
  sections:
    - h: 从“两个轮子”到国家战略
      from: 1997
      to: 2002
      text: 新华社2022年的江泽民生平说，江泽民提出实施“走出去”战略是对外开放新阶段的重大举措，引进来和走出去“必须同时转动起来”。2001年政府工作报告把它列为提高对外开放水平的四项任务之一，2002年政府工作报告要求鼓励各类所有制企业到国外特别是周边国家投资办厂和承包工程。
      cites: [b01-xinhua-2022-12-02-jiang-life, i02-gov-2001-gwr, i02-gov-2002-gwr]
    - h: 中海油—优尼科
      from: 2005
      text: 2005年6月30日美国众议院以398票对15票通过议案，要求布什政府检讨中海油收购优尼科的计划。8月2日中海油宣布撤回总价185亿美元的现金收购要约，称美国“非常遗憾的政治环境”使交易形成无法接受的风险；优尼科董事会接受了雪佛龙较低的出价。
      cites: [e07-bbc-2005-07-03-cnooc, e07-chinanews-2005-08-03-cnooc, e07-bbc-2005-08-02-cnooc]
    - h: 金融危机后的海外并购
      from: 2009
      to: 2010
      text: 2010年政府工作报告要求加快实施“走出去”战略，鼓励符合国外市场需求的行业有序向境外转移产能，支持有条件的企业开展海外并购，并提醒“走出去”的企业要依法经营、防止恶性竞争、维护国家整体利益和良好形象。
      cites: [i02-gov-2010-gwr]
  lists:
    - title: 走出去的五种方式（2001年政府工作报告）
      cite: i02-gov-2001-gwr
      items: [到境外投资, 开展加工贸易, 合作开发资源, 发展国际工程承包, 扩大劳务出口]
    - title: 在境外建立的三类机构（2006年政府工作报告）
      cite: i02-gov-2006-gwr
      items: [加工基地, 营销服务网络, 研发机构]
  policies:
    - date: 2005-08-02
      name: 中海油撤回优尼科收购要约
      text: 中海油在美国国会反对声中撤回对优尼科的185亿美元收购要约，成为“走出去”初期最受关注的受挫案例。
      events: [e07-2005-cnooc-unocal]
      cite: e07-chinanews-2005-08-03-cnooc
  cites: [e01-gov-2021-06-28-cpc-100y, b01-xinhua-2022-12-02-jiang-life, i02-gov-2001-gwr, i02-gov-2002-gwr, i01-jszx-2002-11-08-16th-report, i02-gov-2006-gwr, b02-npc-2007-10-24-17th-report, i02-gov-2010-gwr, b04-gov-2021-11-16-resolution, e07-bbc-2005-07-03-cnooc, e07-chinanews-2005-08-03-cnooc, e07-bbc-2005-08-02-cnooc]

- id: wto-accession
  name: 加入世贸组织
  en: WTO Accession
  kind: formula
  by: [jiang-zemin, zhu-rongji]
  first:
    date: 1999-11-15
    text: 中美签署关于中国加入世界贸易组织的双边协议，扫除入世的最大障碍。
    cite: e01-cpc-dsj-1999
    quote: 中美两国政府在京签署关于中国加入世界贸易组织的双边协议
  codified:
    - date: 2001-11-10
      where: 世界贸易组织第四届部长级会议（多哈）
      cite: e01-cpc-dsj-2001
      quote: 审议并通过了中国加入WTO的决定，标志着中国长达15年复关和加入WTO进程的结束
    - date: 2001-12-11
      where: 中国正式成为世贸组织成员
      cite: e01-gov-2021-06-28-cpc-100y
      quote: 中国正式成为世界贸易组织成员，中国对外开放进入新的阶段
  summary: 中国从申请恢复关贸总协定缔约国地位到加入世贸组织历时15年。1999年11月15日中美签署双边协议，2001年11月10日多哈部长级会议通过中国入世决定，12月11日中国成为第143个成员。官方把入世定为“重大战略决策”，江泽民提出三条原则，核心是中国只能以发展中国家身份加入、权利和义务要平衡。2002年政府工作报告说，入世“总体上有利于改革开放和经济发展”，但近期某些竞争力不强的行业、企业会受到较大冲击；全国清理了相关法规，关税总水平从15.3%降到12%。十六大报告说中国对外开放由此进入新阶段。2018年美国贸易代表办公室则认为，美国支持中国按当时条件入世是一个错误。
  quote:
    text: 我国加入世贸组织，标志着对外开放进入一个新阶段。我们要以积极的姿态，在更大范围和更深程度上参与国际经济合作与竞争，切实做好加入世贸组织第一年的各项工作。
    cite: i02-gov-2002-gwr
  terms: [入世, 加入世贸组织, 复关, WTO]
  related: [going-out, socialist-market-economy, soe-reform]
  voices:
    - voice: west
      text: But those hopes were disappointed. China largely remains a state-led economy today, and the United States and other trading partners continue to encounter serious problems with China’s trade regime.
      zh: 但这些希望落空了。中国今天在很大程度上仍是国家主导的经济，美国和其他贸易伙伴在中国的贸易体制上仍然遇到严重问题。
      cite: i07-usc-2018-01-ustr-wto
      quote: true
    - voice: west
      text: it seems clear that the United States erred in supporting China’s entry into the WTO on terms that have proven to be ineffective in securing China’s embrace of an open, market-oriented trade regime.
      zh: 看来很清楚，美国支持中国按照事后证明无法确保其接受开放、市场化贸易体制的条件加入世贸组织，是犯了错误。（美国贸易代表办公室《中国履行世贸承诺情况报告》，2018年1月）
      cite: i07-usc-2018-01-ustr-wto
      quote: true
  sections:
    - h: 中美谈判
      from: 1994
      to: 2000
      text: 澎湃新闻2019年回顾说，中国原本期望在1994年底前复关，因美国阻挠未能实现；1999年11月最后阶段，美方提出针对中国的特殊保障条款，外经贸部长吴仪怒称这“不是中国加入WTO的协议”。2000年3月朱镕基在记者会上说，中美双边协议是“经过13年的谈判”达成的，美国国会给予中国永久正常贸易关系是协议的基础和前提。
      cites: [b18-thepaper-2019-12-wto-48-hours, b01-gov-2000-03-15-zhu-presser]
    - h: 入世第一年
      from: 2001
      to: 2002
      text: 2001年11月11日外经贸部长石广生递交江泽民签署的批准书并签署入世议定书；19日龙永图等首次以正式成员身份出席总理事会。2002年政府工作报告要求按照法制统一、非歧视、公开透明的原则完善涉外经济法律法规，分期分批对县处级以上领导干部和大中型企业管理人员进行世贸规则培训。
      cites: [e01-cpc-dsj-2001, i02-gov-2002-gwr]
  lists:
    - title: 江泽民提出的入世三原则（新华社《江泽民同志生平》，2022）
      cite: b01-xinhua-2022-12-02-jiang-life
      items:
        - 中国加入世界贸易组织是中国经济发展和改革开放的需要，同样世界贸易组织也需要中国
        - 中国是一个发展中国家，社会生产力还不发达，只能以发展中国家的条件加入世界贸易组织
        - 中国加入世界贸易组织，其权利和义务一定要平衡，中国不会接受过高的、超出中国承受能力的要价
  policies:
    - date: 1999-11-15
      name: 中美入世双边协议
      text: 中美两国政府在北京签署关于中国加入世界贸易组织的双边协议并发表新闻公报。
      events: [e1999-us-wto-deal]
      cite: e01-cpc-dsj-1999
    - date: 2001-12-11
      name: 正式加入世贸组织
      text: 多哈部长级会议审议通过中国加入世贸组织的决定后，中国于12月11日正式成为成员。
      events: [e2001-wto-accession]
      cite: e01-gov-2021-06-28-cpc-100y
  cites: [e01-cpc-dsj-1999, e01-cpc-dsj-2001, e01-gov-2021-06-28-cpc-100y, b01-xinhua-2022-12-02-jiang-life, b01-gov-2000-03-15-zhu-presser, i02-gov-2002-gwr, i01-jszx-2002-11-08-16th-report, b18-thepaper-2019-12-wto-48-hours, i07-usc-2018-01-ustr-wto]

- id: macro-control
  name: 宏观调控与“四万亿”
  en: Macro-Control and the Four-Trillion Stimulus
  kind: formula
  by: [zhu-rongji, wen-jiabao]
  first:
    date: 1993-06-24
    text: 中共中央、国务院下发关于加强宏观调控的意见，提出十六条措施。
    cite: e01-cpc-dsj-1993
    quote: 文件提出了严格控制货币发行，稳定金融形势等十六条加强和改善宏观调控的措施
  codified:
    - date: 1993-11-14
      where: 十四届三中全会《中共中央关于建立社会主义市场经济体制若干问题的决定》
      cite: e01-cpc-dsj-1993
      quote: 转变政府管理经济的职能，建立以间接手段为主的完善的宏观调控体系
    - date: 2009-03-05
      where: 2009年政府工作报告
      cite: i02-gov-2009-gwr
      quote: 坚持把扭转经济增速下滑趋势作为宏观调控最重要的目标
  summary: “宏观调控”是社会主义市场经济体制中政府调节总量和结构的说法，十四届三中全会提出要使市场在国家宏观调控下对资源配置起基础性作用。1993年朱镕基主导的十六条措施治理通货膨胀，1997年初国家统计局称“软着陆”基本成功。1998年为应对亚洲金融危机实行积极的财政政策，靠发行长期建设国债扩大基础设施投资；2004年为遏制固定资产投资过快增长加强调控，2005年转为稳健的财政政策。2008年11月5日国务院常务会议确定扩大内需的十项措施，初步匡算到2010年底约需投资4万亿元，中央政府新增投资1.18万亿元，同时实行适度宽松的货币政策。“四万亿”稳住了增长，但此后不少经济学家批评它推高了债务风险、加剧产能过剩并吹起地产泡沫；连温家宝也说，信贷规模“不要过大，那就更好”。
  quote:
    text: 按照出手要快、出拳要重、措施要准、工作要实的要求，迅速推出进一步扩大内需、促进经济增长的十项措施，争分夺秒地加以落实
    cite: i02-gov-2009-gwr
  terms: [宏观调控, 四万亿, 积极的财政政策, 适度宽松的货币政策, 软着陆]
  related: [socialist-market-economy, scientific-development, supply-side]
  voices:
    - voice: zh
      text: 对于十年前的那一轮刺激，中国国务院发展研究中心研究员吴敬琏称，“这是饮鸩止渴的办法，它不但没有降低杠杆，相反进一步杠杆化了”
      cite: i07-bbc-2019-03-stimulus
      quote: true
    - voice: zh
      text: 香港中文大学助理教授胡荣进一步分析，这一轮的投资和信贷大多给了国有企业，银行也更倾向于借贷给国企，而非民营企业，后者只好用利率更高的影子银行，这种“挤出效应”进一步加大了系统性的金融风险。
      cite: i07-bbc-2019-03-stimulus
      quote: true
    - voice: zh
      text: 中国人民银行行长周小川表示，中国高达4万亿经济刺激计划中的某些投资项目浪费过大，而且效率很低。
      cite: i07-bbc-2009-07-05-zhou-xiaochuan
      quote: true
  sections:
    - h: 九十年代的治理通胀与“软着陆”
      from: 1993
      to: 1997
      text: 1993年6月中央下发加强宏观调控的意见，要求把加快发展的注意力集中到深化改革、转换机制、优化结构、提高效益上来；7月朱镕基在全国金融工作会议上要求强化中央银行职能。十四届三中全会要求建立以间接手段为主的宏观调控体系。1997年1月国家统计局发文称“软着陆”基本成功。
      cites: [e01-cpc-dsj-1993, e01-cpc-dsj-1997]
    - h: 积极财政政策与稳健财政政策
      from: 1998
      to: 2007
      text: 2000年政府工作报告说，两年来通过财政向银行发行2100亿元长期国债，带动4200多亿元银行贷款和自筹资金，建设5100多个基础设施项目。2004年中央加强宏观调控，遏制固定资产投资过快增长，江苏铁本项目被查处。2005年政府工作报告说，投资规模已经很大，有必要由扩张性的积极财政政策转向松紧适度的稳健财政政策。
      cites: [i02-gov-2000-gwr, e01-cpc-dsj-2004, i02-gov-2005-gwr]
    - h: 四万亿
      from: 2008
      to: 2010
      text: 2008年9月以后，宏观调控着力点转向防止经济增速过快下滑，实施积极的财政政策和适度宽松的货币政策，三次提高出口退税率，五次下调存贷款基准利率。2009年政府工作报告公布两年投资计划，并提出广义货币增长17%左右、新增贷款5万亿元以上，同时实施十大重点产业调整和振兴规划。BBC中文2019年的分析说，“四万亿”中45%投向了公路、铁路、机场和城乡电网；温家宝2009年底接受新华社采访时说：“如果我们信贷保持更平衡一些，结构更合理一些，规模不要过大，那就更好。”
      cites: [i02-gov-2009-gwr, i07-bbc-2019-03-stimulus]
  lists:
    - title: 2009年政府工作的四条原则（2009年政府工作报告）
      cite: i02-gov-2009-gwr
      items: [扩内需、保增长, 调结构、上水平, 抓改革、增活力, 重民生、促和谐]
    - title: 十大重点产业调整和振兴规划（2009年政府工作报告）
      cite: i02-gov-2009-gwr
      items: [汽车, 钢铁, 造船, 石化, 轻工, 纺织, 有色金属, 装备制造, 电子信息, 现代物流]
  policies:
    - date: 2004-12-01
      name: 遏制投资过热
      text: 政治局会议认为一年来有效遏制了固定资产投资过快增长，决定2005年实行稳健的财政政策和货币政策。
      events: [e07-2004-tieben]
      cite: e01-cpc-dsj-2004
    - date: 2008-11-05
      name: 扩大内需十项措施
