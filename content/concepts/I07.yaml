# I07: 2000–2012 与前史 — the Deng/Jiang/Hu-era formulas behind today's ideology. Sources in research/manifests/I07.yaml (new) and I01/I02/I03/E01/B22 (reused).

# ---------- 前史：邓小平时期的基本判断 ----------
- id: primary-stage
  name: 社会主义初级阶段
  en: Primary Stage of Socialism
  kind: component
  parent: deng-theory
  by: [deng-xiaoping, zhao-ziyang]
  first:
    date: 1981-06-27
    text: 十一届六中全会通过的第二个历史决议第一次写下“初级的阶段”这一判断，但还不是后来完整的“社会主义初级阶段”表述。
    cite: i07-12371-1981-06-27-history-resolution
    quote: 尽管我们的社会主义制度还是处于初级的阶段，但是毫无疑问，我国已经建立了社会主义制度
  codified:
    - date: 1987-10-25
      where: 十三大报告
      cite: i07-people-1987-10-25-13th-report
      quote: 我国正处在社会主义的初级阶段。这个论断，包括两层含义
    - date: 1997-09-12
      where: 十五大报告
      cite: i01-wenming-1997-09-12-15th-report
      quote: 最大的实际就是中国现在处于并将长时期处于社会主义初级阶段
    - date: 2022-10-22
      where: 党章总纲
      cite: i01-12371-2022-10-22-party-charter
      quote: 我国正处于并将长期处于社会主义初级阶段
  summary: 社会主义初级阶段是改革开放以来全部路线方针的国情前提。1981年历史决议说中国的社会主义制度“还是处于初级的阶段”；1987年十三大报告系统论述，称中国从五十年代社会主义改造基本完成到现代化基本实现，至少需要上百年时间，都属于这一阶段，并在此基础上提出“一个中心、两个基本点”的基本路线。1997年十五大报告把它称为“最大的实际”，并据此确立公有制为主体、多种所有制经济共同发展的基本经济制度。2017年十九大改写了社会主要矛盾，但仍强调初级阶段的基本国情没有变；现行党章仍以此开篇论述国情。
  quote:
    text: 我们讲一切从实际出发，最大的实际就是中国现在处于并将长时期处于社会主义初级阶段。
    cite: i01-wenming-1997-09-12-15th-report
  terms: [社会主义初级阶段, 初级阶段]
  related: [deng-theory, basic-line, principal-contradiction, socialist-market-economy]
  sections:
    - h: 从“初级的阶段”到系统理论
      from: 1981
      to: 1987
      text: 1981年历史决议第33段在肯定“我国已经建立了社会主义制度”的同时，承认这一制度“还是处于初级的阶段”，要经历由比较不完善到比较完善的长久过程。1987年十三大报告把它上升为“建设有中国特色的社会主义的首要问题”，说这一论断包括两层含义：中国已经是社会主义社会，不能离开社会主义；中国的社会主义还处在初级阶段，不能超越这个阶段。报告把否认前者称为右倾错误的认识根源，把超越后者称为“左”倾错误的认识根源。
      cites: [i07-12371-1981-06-27-history-resolution, i07-people-1987-10-25-13th-report]
    - h: 十五大的九条特征与基本纲领
      from: 1997
      text: 十五大报告重申初级阶段“至少需要一百年时间”，并用九个“历史阶段”概括这一阶段的特征。报告以此为依据，确立公有制为主体、多种所有制经济共同发展的基本经济制度，并提出建设有中国特色社会主义的经济、政治、文化三方面的基本纲领。
      cites: [i01-wenming-1997-09-12-15th-report]
    - h: 新时代的延续
      from: 2007
      text: 十七大报告说，中国仍处于并将长期处于社会主义初级阶段的基本国情没有变，要把它作为推进改革、谋划发展的根本依据。十九大报告改写了社会主要矛盾，但同样写明初级阶段的基本国情没有变，中国是世界最大发展中国家的国际地位没有变。
      cites: [b02-npc-2007-10-24-17th-report, i01-gov-2017-10-18-19th-report]
  lists:
    - title: 社会主义初级阶段的九个特征（十五大报告，1997）
      cite: i01-wenming-1997-09-12-15th-report
      items:
        - 是逐步摆脱不发达状态，基本实现社会主义现代化的历史阶段
        - 是由农业人口占很大比重、主要依靠手工劳动的农业国，逐步转变为非农业人口占多数、包含现代农业和现代服务业的工业化国家的历史阶段
        - 是由自然经济半自然经济占很大比重，逐步转变为经济市场化程度较高的历史阶段
        - 是由文盲半文盲人口占很大比重、科技教育文化落后，逐步转变为科技教育文化比较发达的历史阶段
        - 是由贫困人口占很大比重、人民生活水平比较低，逐步转变为全体人民比较富裕的历史阶段
        - 是由地区经济文化很不平衡，通过有先有后的发展，逐步缩小差距的历史阶段
        - 是通过改革和探索，建立和完善比较成熟的充满活力的社会主义市场经济体制、社会主义民主政治体制和其他方面体制的历史阶段
        - 是广大人民牢固树立建设有中国特色社会主义共同理想，自强不息，锐意进取，艰苦奋斗，勤俭建国，在建设物质文明的同时努力建设精神文明的历史阶段
        - 是逐步缩小同世界先进水平的差距，在社会主义基础上实现中华民族伟大复兴的历史阶段
  policies:
    - date: 1997-09-12
      name: 确立基本经济制度
      text: 十五大报告以初级阶段国情为依据，把公有制为主体、多种所有制经济共同发展确定为一项基本经济制度，并称一切符合“三个有利于”的所有制形式都可以用来为社会主义服务。
      events: [e1997-15th-congress]
      cite: i01-wenming-1997-09-12-15th-report
  cites: [i07-12371-1981-06-27-history-resolution, i07-people-1987-10-25-13th-report, i01-wenming-1997-09-12-15th-report, b02-npc-2007-10-24-17th-report, i01-gov-2017-10-18-19th-report, i01-12371-2022-10-22-party-charter]

- id: basic-line
  name: 一个中心、两个基本点
  en: "One Central Task, Two Basic Points"
  kind: formula
  parent: deng-theory
  by: [deng-xiaoping, zhao-ziyang]
  first:
    date: 1987-10-25
    text: 十三大报告正式表述党在社会主义初级阶段的基本路线，并用“以经济建设为中心，坚持两个基本点”概括其主要内容；十四大报告回顾说，这一思想在十一届三中全会后开始形成。
    cite: i07-people-1987-10-25-13th-report
    quote: 以经济建设为中心，坚持两个基本点，这就是我们的主要经验
  codified:
    - date: 1992-10-12
      where: 十四大报告
      cite: i03-reformdata-1992-10-12-14th-report
      quote: 在把握“一个中心、两个基本点”的问题上，在党内特别是领导干部中要警惕右，但主要是防止“左”
    - date: 2022-10-22
      where: 党章总纲
      cite: i01-12371-2022-10-22-party-charter
      quote: 中国共产党在社会主义初级阶段的基本路线是：领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生，艰苦创业
  summary: “一个中心、两个基本点”是党在社会主义初级阶段基本路线的简称：以经济建设为中心，坚持四项基本原则，坚持改革开放。1987年十三大报告正式提出，说两个基本点“相互贯通，相互依存”，既不能以僵化观点看待四项基本原则，也不能以自由化观点看待改革开放。1992年邓小平南方谈话说基本路线“要管一百年，动摇不得”。此后历届党章都写入基本路线全文，只是奋斗目标从“富强、民主、文明”逐步扩展为“富强民主文明和谐美丽”。十九大报告称基本路线是“党和国家的生命线、人民的幸福线”。
  quote:
    text: 基本路线要管一百年，动摇不得。
    cite: b22-reformdata-1992-01-18-southern-talks
  terms: [一个中心、两个基本点, 基本路线]
  related: [primary-stage, four-cardinal-principles, development-hard-truth, deng-theory]
  sections:
    - h: 十三大的表述
      from: 1987
      text: 十三大报告写道，坚持四项基本原则和坚持改革开放这两个基本点，“相互贯通，相互依存”，统一于建设有中国特色的社会主义的实践。报告同时说，由于“左”的积习很深，改革开放的阻力主要来自这种积习，从总体上说，克服僵化思想是相当长时期的主要任务。
      cites: [i07-people-1987-10-25-13th-report]
    - h: 1989年后的重心与南方谈话
      from: 1992
      text: 1992年南方谈话说，坚持三中全会以来的路线方针政策，关键是坚持“一个中心、两个基本点”；又说中国要警惕右，但主要是防止“左”。同年十四大报告把这句话写进党代会报告，并把“左”的表现概括为否定改革开放、认为和平演变的主要危险来自经济领域。
      cites: [b22-reformdata-1992-01-18-southern-talks, i03-reformdata-1992-10-12-14th-report]
    - h: 目标表述的扩展
      from: 2002
      to: 2017
      text: 基本路线的奋斗目标在党章中几经修改：2002年十六大党章为“富强、民主、文明的社会主义现代化国家”；2007年十七大党章加入“和谐”；2017年十九大党章改为“富强民主文明和谐美丽的社会主义现代化强国”。十七大报告则用三句话说明三者的地位：以经济建设为中心是兴国之要，四项基本原则是立国之本，改革开放是强国之路。
      cites: [d01-people-2002-11-18-party-charter, d01-people-2007-10-25-party-charter, d01-12371-2017-10-28-party-charter, b02-npc-2007-10-24-17th-report]
  lists:
    - title: 基本路线中三者的地位（十七大报告，2007）
      cite: b02-npc-2007-10-24-17th-report
      items:
        - 以经济建设为中心是兴国之要，是我们党、我们国家兴旺发达和长治久安的根本要求
        - 四项基本原则是立国之本，是我们党、我们国家生存发展的政治基石
        - 改革开放是强国之路，是我们党、我们国家发展进步的活力源泉
  cites: [i07-people-1987-10-25-13th-report, i03-reformdata-1992-10-12-14th-report, b22-reformdata-1992-01-18-southern-talks, d01-people-2002-11-18-party-charter, d01-people-2007-10-25-party-charter, d01-12371-2017-10-28-party-charter, b02-npc-2007-10-24-17th-report, i01-gov-2017-10-18-19th-report, i01-12371-2022-10-22-party-charter]

- id: four-cardinal-principles
  name: 四项基本原则
  en: Four Cardinal Principles
  kind: component
  parent: deng-theory
  by: [deng-xiaoping]
  first:
    date: 1979-03-30
    text: 邓小平在理论工作务虚会上提出，实现四个现代化必须在思想政治上坚持四项基本原则。
    cite: i03-reformdata-1979-03-30-four-principles
    quote: 我们要在中国实现四个现代化，必须在思想政治上坚持四项基本原则。这是实现四个现代化的根本前提。
  codified:
    - date: 1981-06-27
      where: 第二个历史决议
      cite: i07-12371-1981-06-27-history-resolution
      quote: 四项基本原则，是全党团结和全国各族人民团结的共同的政治基础
    - date: 2022-10-22
      where: 党章总纲
      cite: i01-12371-2022-10-22-party-charter
  summary: 四项基本原则是坚持社会主义道路、坚持人民民主专政、坚持中国共产党的领导、坚持马克思列宁主义毛泽东思想，1979年3月由邓小平在理论工作务虚会上提出，矛头主要指向社会上怀疑或反对社会主义和党的领导的思潮，同时也批评仍受林彪、“四人帮”影响的极左思潮。1979年讲话中第二条写作“无产阶级专政”，1981年历史决议写作“人民民主专政即无产阶级专政”，此后定为“人民民主专政”。1987年起它作为“两个基本点”之一写入基本路线，被称为“立国之本”，与改革开放并列。
  quote:
    text: 四项基本原则是立国之本，是我们党、我们国家生存发展的政治基石
    cite: b02-npc-2007-10-24-17th-report
  terms: [四项基本原则, 四个坚持]
  related: [basic-line, deng-theory, primary-stage]
  voices:
    - voice: zh
      text: 邓小平和习近平都是忠实的共产党人，邓小平有四个基本原则，习近平力主勿忘初心，对维护共产党一党专制政权的根本立场完全没有两样。
      cite: b22-bbc-2024-08-22-deng-120
      quote: true
  sections:
    - h: 提出背景
      from: 1979
      text: 邓小平在讲话中说，这四项基本原则“并不是新的东西”，但当时有必要强调宣传，因为一方面党内有人仍受极左思潮影响，另一方面社会上有极少数人散布怀疑或反对这四项原则的思潮。讲话着重批判从右面怀疑或反对四项基本原则的思潮。
      cites: [i03-reformdata-1979-03-30-four-principles]
    - h: 写入基本路线
      from: 1987
      text: 十三大报告把四项基本原则称为“我们的立国之本”，与改革开放并列为两个基本点，并说改革开放“赋予四项基本原则以新的时代内容”。十四大报告在概括邓小平理论主要内容时，把它归入“社会主义建设的政治保证问题”。
      cites: [i07-people-1987-10-25-13th-report, i03-reformdata-1992-10-12-14th-report]
  lists:
    - title: 四项基本原则（邓小平，1979）
      cite: i03-reformdata-1979-03-30-four-principles
      items:
        - 第一，必须坚持社会主义道路
        - 第二，必须坚持无产阶级专政
        - 第三，必须坚持共产党的领导
        - 第四，必须坚持马列主义、毛泽东思想
    - title: 四项基本原则（现行党章，2022）
      cite: i01-12371-2022-10-22-party-charter
      items:
        - 坚持社会主义道路
        - 坚持人民民主专政
        - 坚持中国共产党的领导
        - 坚持马克思列宁主义毛泽东思想
  cites: [i03-reformdata-1979-03-30-four-principles, i07-12371-1981-06-27-history-resolution, i07-people-1987-10-25-13th-report, i03-reformdata-1992-10-12-14th-report, b02-npc-2007-10-24-17th-report, i01-12371-2022-10-22-party-charter, b22-bbc-2024-08-22-deng-120]

- id: development-hard-truth
  name: 南方谈话与“发展才是硬道理”
  en: Southern Tour Talks — "Development Is the Hard Truth"
  kind: formula
  parent: deng-theory
  by: [deng-xiaoping]
  first:
    date: 1992-01-18
    text: 邓小平在武昌、深圳、珠海、上海等地的谈话要点中提出。
    cite: b22-reformdata-1992-01-18-southern-talks
    quote: 发展才是硬道理。这个问题要搞清楚。
  codified:
    - date: 1997-09-12
      where: 十五大报告
      cite: i01-wenming-1997-09-12-15th-report
      quote: 发展是硬道理，中国解决所有问题的关键在于依靠自己的发展。
  summary: 1992年初，邓小平在1989年后的保守气氛中南下视察，谈话核心是要加快改革开放和经济发展：基本路线要管一百年；判断姓“社”姓“资”主要看“三个有利于”；计划和市场都是经济手段，不是社会主义与资本主义的本质区别；中国要警惕右，但主要是防止“左”；“发展才是硬道理”。谈话直接促成同年十四大把建立社会主义市场经济体制定为改革目标。十五大报告称南方谈话是又一个解放思想、实事求是的“宣言书”，把这句话写成“发展是硬道理”；胡锦涛时期又提出，坚持发展是硬道理的本质要求就是坚持科学发展。
  quote:
    text: 计划多一点还是市场多一点，不是社会主义与资本主义的本质区别。
    cite: b22-reformdata-1992-01-18-southern-talks
  terms: [发展才是硬道理, 发展是硬道理, 南方谈话]
  related: [socialist-market-economy, three-favorables, no-debate, basic-line, scientific-development]
  voices:
    - voice: zh
      text: 邓小平对外开放、引进外资，对内则进行市场化改革，降低国有经济的比重，背后最重要的机制是“放权让利”。
      cite: b22-voa-2024-08-21-deng-120
      quote: true
  sections:
    - h: 谈话要点
      from: 1992-01
      to: 1992-02
      text: 谈话把姓“资”还是姓“社”称为改革开放迈不开步子的“要害”，说社会主义的本质是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。谈话还肯定1984年至1988年的加速发展“功劳不小”，提出经济发展隔几年上一个台阶，并说“看准了的，就大胆地试，大胆地闯”。
      cites: [b22-reformdata-1992-01-18-southern-talks]
    - h: 从“发展才是硬道理”到“科学发展”
      from: 1997
      to: 2010
      text: 十五大报告把这句话改写为“发展是硬道理”，并加上“中国解决所有问题的关键在于依靠自己的发展”。2010年十七届五中全会把它与科学发展观衔接，称坚持发展是硬道理的本质要求就是坚持科学发展，更加注重以人为本、全面协调可持续发展和统筹兼顾。
      cites: [i01-wenming-1997-09-12-15th-report, e02-chinanews-2010-10-18-plenum5]
  policies:
    - date: 1992-10-12
      name: 确立社会主义市场经济体制目标
      text: 十四大报告援引南方谈话中计划和市场都是经济手段的论断，明确提出我国经济体制改革的目标是建立社会主义市场经济体制。
      events: [e1992-southern-tour, e1992-14th-congress]
      cite: i03-reformdata-1992-10-12-14th-report
  cites: [b22-reformdata-1992-01-18-southern-talks, i03-reformdata-1992-10-12-14th-report, i01-wenming-1997-09-12-15th-report, e02-chinanews-2010-10-18-plenum5, b22-voa-2024-08-21-deng-120]

- id: three-favorables
  name: 三个有利于
  en: Three Favorables
  kind: formula
  parent: deng-theory
  by: [deng-xiaoping]
  first:
    date: 1992-01-18
    text: 南方谈话中作为判断姓“社”姓“资”的标准提出。
    cite: b22-reformdata-1992-01-18-southern-talks
    quote: 判断的标准，应该主要看是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民的生活水平。
  codified:
    - date: 1997-09-12
      where: 十五大报告
      cite: i01-wenming-1997-09-12-15th-report
      quote: 这“三个有利于”为根本判断标准
    - date: 2022-10-22
      where: 党章总纲
      cite: i01-12371-2022-10-22-party-charter
      quote: 作为总的出发点和检验标准
  summary: “三个有利于”是邓小平在南方谈话中提出的判断标准：是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民的生活水平。它的作用是把改革措施的评判从意识形态上的姓“社”姓“资”转到实际效果上。十四大报告把它写成“判断各方面工作的是非得失”的标准，十五大报告称之为“根本判断标准”，并据此说明一切符合这一标准的所有制形式都可以为社会主义服务。现行党章仍把三者作为各项工作“总的出发点和检验标准”。
  terms: [三个有利于]
  related: [development-hard-truth, primary-stage, socialist-market-economy]
  lists:
    - title: 三个有利于（南方谈话，1992）
