- id: two-hands
  name: 两手抓，两手都要硬
  en: "Grasp with Both Hands, Both Hands Firm"
  kind: formula
  parent: deng-theory
  by: [deng-xiaoping]
  first:
    date: 1992-01-18
    text: 库内最早的原文是邓小平南方谈话；十四大报告回顾说，这一系列方针在1980年代已经提出。
    cite: b22-reformdata-1992-01-18-southern-talks
    quote: 要坚持两手抓，一手抓改革开放，一手抓打击各种犯罪活动。这两只手都要硬
  codified:
    - date: 1992-10-12
      where: 十四大报告（邓小平理论九条之八）
      cite: i03-reformdata-1992-10-12-14th-report
      quote: 第八，坚持两手抓，两手都要硬，把社会主义精神文明建设提高到新水平
    - date: 1997-09-12
      where: 十五大报告
      cite: i01-wenming-1997-09-12-15th-report
      quote: 坚持物质文明和精神文明两手抓、两手都要硬的方针
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 党坚持物质文明和精神文明两手抓、两手硬
  summary: “两手抓”是邓小平时期的一组方针，十四大报告概括为一手抓改革开放、一手抓打击犯罪，一手抓经济建设、一手抓民主法制，一手抓物质文明、一手抓精神文明。1992年南方谈话说两只手“都要硬”，打击犯罪、扫除丑恶现象“手软不得”，并要求在整个改革开放过程中都要反对腐败。十四大把它列为邓小平理论的九条内容之一，江泽民时期的政府工作报告和人民日报社论反复使用；2024年习近平纪念邓小平诞辰120周年时，把“一手抓改革开放，一手抓惩治腐败”列为需要完整理解的邓小平论断之一。这一说法后来成为官场常用语，用于党建和业务、反腐与发展等各种成对任务。
  quote:
    text: 总之，只要我们的生产力发展，保持一定的经济增长速度，坚持两手抓，社会主义精神文明建设就可以搞上去。
    cite: b22-reformdata-1992-01-18-southern-talks
  terms: [两手抓, 两手都要硬, 两手抓两手都要硬]
  related: [deng-theory, basic-line, rule-by-virtue, stability-overrides-all]
  sections:
    - h: 新时代的用法
      from: 2015
      text: 2015年山西省委书记王儒林在全国人大会议上说，山西省委坚持两手抓、两手都要硬，反腐败做“减法”、抓发展做“加法”。2016年中央巡视组要求证监会党委坚持党建和业务“两手抓、两手硬”。2024年习近平说，对邓小平的这些论断如果“顾此失彼、畸轻畸重”，就容易导致实践偏差。
      cites: [cs1-people-2015-03-08-wang-rulin-npc, cs1-csrc-2016-02-04-inspection, c09-gov-2024-08-22-xi-deng-120]
  lists:
    - title: 一系列“两手抓”（十四大报告，1992）
      cite: i03-reformdata-1992-10-12-14th-report
