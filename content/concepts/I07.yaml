- id: no-debate
  name: 不争论
  en: '"No Debate"'
  kind: formula
  parent: deng-theory
  by: [deng-xiaoping]
  first:
    date: 1992-01-18
    text: 南方谈话中邓小平自称“不搞争论”是他的一个发明。
    cite: b22-reformdata-1992-01-18-southern-talks
    quote: 不搞争论，是我的一个发明。不争论，是为了争取时间干。一争论就复杂了，把时间都争掉了，什么也干不成。
  summary: “不争论”是邓小平在南方谈话中总结的改革推进方法：对改革开放一开始就有不同意见是正常的，农村家庭联产承包也是先有三分之一的省干起来，“允许看”，不搞强迫，不搞运动。他说不争论是为了争取时间干，要“大胆地试，大胆地闯”。同一篇谈话又说，“左”的东西根深蒂固，有些理论家、政治家拿大帽子吓唬人。“不争论”因此常与“摸着石头过河”并提，指先试验、看效果，而不先在理论上给改革措施定性。
  quote:
    text: 不争论，大胆地试，大胆地闯。农村改革是如此，城市改革也应如此。
    cite: b22-reformdata-1992-01-18-southern-talks
  terms: [不争论, 不搞争论]
  related: [crossing-river-stones, development-hard-truth, three-favorables]
  cites: [b22-reformdata-1992-01-18-southern-talks]

- id: crossing-river-stones
  name: 摸着石头过河
  en: Crossing the River by Feeling for the Stones
  kind: formula
  parent: deng-theory
  by: [chen-yun, deng-xiaoping, xi-jinping]
  first:
    date: 1950-04-07
    text: 据《光明日报》2014年文章，陈云在政务院第27次政务会议上最早从工作方法角度使用这句民间俗语；1980年12月他在中央工作会议上把它用于改革，邓小平在闭幕会上表示完全同意陈云的讲话。
    cite: i07-people-2014-04-09-crossing-river-origin
    quote: 物价涨不好，跌亦对生产不好。要‘摸着石头过河’，稳当点为好
  codified:
    - date: 2013-11-12
      where: 十八届三中全会《决定》
      cite: e03-gov-2013-11-15-reform-decision
      quote: 加强顶层设计和摸着石头过河相结合
  summary: “摸着石头过河”原是民间俗语，指在没有现成的桥和船时以身试水、摸索前进。陈云1950年起多次用它说明经济工作要稳妥，1980年12月在中央工作会议上说改革“要从试点着手，随时总结经验”；邓小平虽很少用这句话，但“看准了的，就大胆地试，大胆地闯”被视为同一思路。它成为改革开放渐进、试点先行方法的代称，也一直有人批评它缺乏理论和整体规划。2012年底习近平在十八届中央政治局第二次集体学习时肯定它是“富有中国特色、符合中国国情的改革方法”，同时提出要与“加强顶层设计”辩证统一；2013年三中全会《决定》写入“加强顶层设计和摸着石头过河相结合”。
  quote:
    text: 摸着石头过河，是富有中国特色、符合中国国情的改革方法。摸着石头过河就是摸规律，从实践中获得真知。
    cite: i07-gov-2013-01-01-xi-crossing-river
  terms: [摸着石头过河, 顶层设计]
  related: [no-debate, development-hard-truth, deng-theory]
  sections:
    - h: 陈云的用法
      from: 1950
      to: 1988
      text: 《光明日报》文章梳理，陈云1951年说“办法也应该稳妥，这叫摸着石头过河”，1961年又用来区分试验研究与推广。1980年12月16日他在中央工作会议讲话中说，改革“步子要稳”，“更重要的还是要从试点着手，随时总结经验”。1988年他在杭州说，有人批评“摸着石头过河”不对，但没有讲出道理来。
      cites: [i07-people-2014-04-09-crossing-river-origin]
    - h: 与顶层设计并提
      from: 2012-12
      text: 习近平2012年12月31日总结改革开放经验时提出5点意见，第二点是改革开放必须坚持正确的方法论，说摸着石头过河和加强顶层设计是辩证统一的：推进局部的阶段性改革开放要在加强顶层设计的前提下进行，加强顶层设计要在推进局部的阶段性改革开放的基础上来谋划。2014年人民日报任仲平文章则说，渐进式的路径选择决定了此前的改革往往是自发、零散和独立进行的，进一步加强顶层设计“已成当务之急”。
      cites: [i07-gov-2013-01-01-xi-crossing-river, i04-rmrb-2014-04-14-renzhongping]
  policies:
    - date: 2013-11-12
      name: 写入全面深化改革决定
      text: 十八届三中全会《决定》把“加强顶层设计和摸着石头过河相结合”列为改革开放必须长期坚持的经验之一，与整体推进和重点突破相促进并列。
      events: [e03-2013-third-plenum-reform-decision]
      cite: e03-gov-2013-11-15-reform-decision
  cites: [i07-people-2014-04-09-crossing-river-origin, i07-gov-2013-01-01-xi-crossing-river, e03-gov-2013-11-15-reform-decision, i04-rmrb-2014-04-14-renzhongping, b22-reformdata-1992-01-18-southern-talks]

- id: stability-overrides-all
  name: 稳定压倒一切
  en: Stability Overrides Everything
  kind: formula
  parent: deng-theory
  by: [deng-xiaoping, jiang-zemin]
  first:
    date: 1989-02-26
    text: 邓小平会见美国总统布什时说，中国的问题压倒一切的是需要稳定；3月4日同中央负责同志谈话时再次强调。
    cite: e01-cpc-dsj-1989
    quote: 中国的问题，压倒一切的是需要稳定。没有稳定的环境，什么都搞不成，已经取得的成果也会失掉。
  codified:
    - date: 2002-11-08
      where: 十六大报告（十三年基本经验之六）
      cite: i01-jszx-2002-11-08-16th-report
      quote: (六)坚持稳定压倒一切的方针,正确处理改革发展稳定的关系
    - date: 2004-09-19
      where: 十六届四中全会《关于加强党的执政能力建设的决定》
      cite: i01-wikisource-2004-09-19-governing-capacity-decision
      quote: 坚持稳定压倒一切的方针，落实维护社会稳定的工作责任制
  summary: “稳定压倒一切”源自邓小平1989年春的谈话，学潮前他对布什和中央负责同志说，中国的问题压倒一切的是需要稳定。此后它成为江泽民时期处理改革、发展、稳定关系的方针，常与“发展是硬道理”并提，2002年十六大报告列为十三年基本经验之一，要求把改革的力度、发展的速度和社会可承受的程度统一起来。2004年执政能力建设决定把它与维护社会稳定工作责任制、社会舆情汇集分析机制和社会预警体系连在一起，为此后的“维稳”体制提供了文件依据。习近平2024年纪念邓小平诞辰120周年时仍把它列为邓小平理论的重要论断。
  quote:
    text: 我们搞四化，搞改革开放，关键是稳定。压倒一切的是需要稳定。中国不能乱，这个道理要反复讲，放开讲。
    cite: e01-cpc-dsj-1989
  terms: [稳定压倒一切]
  related: [stability-maintenance, harmonious-society, development-hard-truth]
  voices:
    - voice: zh
      text: 有分析认为这显示中央对新疆政策的调整，从王乐泉的铁腕统治， 稳定压倒一切，到大力发展新疆经济。
      cite: b19-bbc-2010-05-06-xinjiang-policy
      quote: true
  sections:
    - h: 改革发展稳定的关系
      from: 2001
      to: 2003
      text: 2001年人民日报社论要求进一步提高“对稳定是压倒一切的重要思想的认识”，说没有稳定的社会环境，什么事情也干不成。2003年朱镕基政府工作报告回顾五年工作时说，政府坚持贯彻稳定压倒一切的方针，重大改革措施坚持先行试点，并妥善处理突发性、群体性事件，努力把矛盾和纠纷“消除在萌芽状态”。
      cites: [i04-rmrb-2001-03-16-editorial, i02-gov-2003-gwr]
    - h: 走向维稳机制
      from: 2004
      text: 十六届四中全会决定在“健全工作机制，维护社会稳定”一节中，把坚持稳定压倒一切的方针放在第一句，随后是落实维护社会稳定的工作责任制、建立社会舆情汇集和分析机制、建立健全社会预警体系和应急机制。2010年张春贤接替王乐泉主政新疆时，习近平称王乐泉“牢固树立稳定压倒一切的思想”，并要求新疆干部群众同样如此。
      cites: [i01-wikisource-2004-09-19-governing-capacity-decision, e02-xinhua-2010-04-24-xinjiang-secretary]
  policies:
    - date: 2004-09-19
      name: 维护社会稳定工作责任制
      text: 执政能力建设决定以“坚持稳定压倒一切的方针”开头，要求落实维护社会稳定的工作责任制，建立社会舆情汇集和分析机制，建立健全社会预警体系，形成统一指挥、功能齐全、反应灵敏、运转高效的应急机制。
      cite: i01-wikisource-2004-09-19-governing-capacity-decision
  cites: [e01-cpc-dsj-1989, i04-rmrb-2001-03-16-editorial, i01-jszx-2002-11-08-16th-report, i02-gov-2003-gwr, i01-wikisource-2004-09-19-governing-capacity-decision, e02-xinhua-2010-04-24-xinjiang-secretary, b19-bbc-2010-05-06-xinjiang-policy, c09-gov-2024-08-22-xi-deng-120]

- id: soe-reform
  name: 国企改革与下岗
  en: SOE Reform and Laid-off Workers (Xiagang)
  kind: formula
  parent: deng-theory
  by: [jiang-zemin, zhu-rongji]
  first:
    date: 1997-09-12
    text: 十五大报告提出鼓励兼并、规范破产、下岗分流、减员增效和再就业工程，并承认职工下岗难以避免。
    cite: i01-wenming-1997-09-12-15th-report
    quote: 随着企业改革深化、技术进步和经济结构调整，人员流动和职工下岗是难以避免的。
  codified:
    - date: 1999-09-22
      where: 十五届四中全会《中共中央关于国有企业改革和发展若干重大问题的决定》
      cite: k01-xinhua-1999-09-22-15-4-plenum
      quote: 首先要尽最大努力实现国有企业改革和脱困的三年目标
  summary: 1990年代后期，国有企业大面积亏损，十五大和十五届一中全会提出用三年左右时间使大多数国有大中型亏损企业摆脱困境。改革方针是鼓励兼并、规范破产、下岗分流、减员增效和再就业工程。“下岗”指职工离开岗位但名义上仍与原单位保留劳动关系，与正式失业不同。2003年政府工作报告说，1998年以来国有企业下岗职工达2700多万人，1800多万人实现再就业；国家建立了下岗职工基本生活保障、失业保险和城市居民最低生活保障“三条保障线”。2000年底官方宣布三年脱困目标基本实现。下岗潮此后成为中国文学和电影反复描绘的主题。
  quote:
    text: １９９８年以来，国有企业下岗职工达２７００多万人，９０％以上进入再就业服务中心，先后有１８００多万人通过多种渠道和方式实现了再就业。
    cite: i02-gov-2003-gwr
  terms: [下岗, 下岗职工, 三年脱困, 减员增效]
  related: [grasp-large-release-small, northeast-revitalization, socialist-market-economy, primary-stage]
  voices:
    - voice: zh
      text: 中国在上个世纪九十年代进行的国有企业改革、减员增效所导致的下岗失业浪潮曾经引起整个社会的恐慌。
      cite: i07-bbc-2005-03-21-soe-unemployment
      quote: true
    - voice: witness
      text: I worked at the factory for 16 years and now I have nothing.
      zh: 我在厂里干了16年，现在什么都没有了。（鞍钢下岗工人李春海，2002年）
      cite: i07-bbc-2002-11-li-chunhai
      quote: true
    - voice: wiki
      text: 下岗实质是一种变相的失业，虽然工人失去工作，但仍挂属于原单位，且没有工资。
      cite: i07-wiki-xiagang
      quote: true
  sections:
    - h: 三年脱困
      from: 1997
      to: 2000
      text: 1998年4月朱镕基为首批国有重点大型企业稽察特派员培训班开班时，重申用三年左右时间使大多数国有大中型亏损企业摆脱困境。2000年政府工作报告称纺织行业提前一年实现三年脱困目标，并把实现三年目标列为“今年政府工作的重中之重”。同年12月，国家经贸委主任盛华仁宣布三年目标已基本实现。
      cites: [e01-cpc-dsj-1998, i02-gov-2000-gwr, e01-cpc-dsj-2000]
    - h: 再就业与“三条保障线”
      from: 1998
      to: 2003
      text: 1998年6月中共中央、国务院发出通知，主要解决国有企业下岗职工的基本生活保障和再就业问题，争取用五年左右时间初步建立适应市场经济的社会保障体系和就业机制。下岗职工进入企业再就业服务中心领取基本生活费，由中心代缴社会保险。2003年后逐步推进下岗职工基本生活保障向失业保险并轨，辽宁全省率先试点。
      cites: [e01-cpc-dsj-1998, i02-gov-2000-gwr, i02-gov-2003-gwr]
    - h: 统计之外的失业
      from: 2005
      text: BBC中文2005年报道引述中国社科院学者唐钧说，官方统计的280多万下岗职工加600多万登记失业人员接近一千万，但真正没有工作岗位的人要远远超过这个数字；国有企业并轨改制中大规模的隐性失业令失业保险制度形同虚设。
      cites: [i07-bbc-2005-03-21-soe-unemployment]
  policies:
    - date: 1998-06-09
      name: 下岗职工基本生活保障和再就业
      text: 中共中央、国务院发出《关于切实做好国有企业下岗职工基本生活保障和再就业工作的通知》，提出争取用五年左右的时间，初步建立适应社会主义市场经济体制要求的社会保障体系和就业机制。
      events: [e1998-soe-layoffs]
      cite: e01-cpc-dsj-1998
    - date: 1999-09-22
      name: 国有企业改革和发展决定
      text: 十五届四中全会确定到2010年国有企业改革和发展的主要目标，要求从战略上调整国有经济布局，提高国有经济的控制力和整体素质。
      cite: e01-cpc-dsj-1999
  cites: [i01-wenming-1997-09-12-15th-report, e01-cpc-dsj-1998, e01-cpc-dsj-1999, e01-cpc-dsj-2000, k01-xinhua-1999-09-22-15-4-plenum, i02-gov-2000-gwr, i02-gov-2003-gwr, i07-bbc-2005-03-21-soe-unemployment, i07-bbc-2002-11-li-chunhai, i07-wiki-xiagang]

- id: grasp-large-release-small
  name: 抓大放小
  en: Grasp the Large, Let Go of the Small
  kind: formula
  parent: soe-reform
  by: [jiang-zemin]
  first:
    date: 1997-03
    text: 1997年政府工作报告提出集中力量抓好国有大型企业和企业集团，进一步放活国有小企业（库内所见最早出处；这一方针更早在1995年前后提出，确切首次出处待考）。
    cite: e01-cpc-dsj-1997
    quote: 要集中力量抓好国有大型企业和企业集团，进一步放活国有小企业
  codified:
    - date: 1997-09-12
      where: 十五大报告
      cite: i01-wenming-1997-09-12-15th-report
      quote: 要着眼于搞好整个国有经济，抓好大的，放活小的，对国有企业实施战略性改组。
  summary: 抓大放小是1990年代后期国有经济战略性调整的方针：国家集中力量办好关系国民经济命脉的大型企业和企业集团，对国有小型企业则通过改组、联合、兼并、租赁、承包经营、股份合作制和出售等形式放开搞活。十五大报告写作“抓好大的，放活小的”，提出以资本为纽带，形成跨地区、跨行业、跨所有制和跨国经营的大企业集团。“放小”中不少小企业被出售或改制，也引出国有资产流失的争论，2004年“郎顾之争”是其中最受关注的一次。“抓大”则延续为此后央企重组和做强做大国有资本的路线。
  terms: [抓大放小, 抓好大的，放活小的]
  related: [soe-reform, socialist-market-economy]
  sections:
    - h: 十五大的部署
      from: 1997
      text: 十五大报告把国有企业改革同改组、改造、加强管理结合起来，要求“着眼于搞好整个国有经济”，而不是搞好每一个国有企业；对小型企业则加快放开搞活的步伐。十五届四中全会进一步提出从战略上调整国有经济布局，在新兴技术和高技术产业，国有企业要占据重要地位。
      cites: [i01-wenming-1997-09-12-15th-report, e01-cpc-dsj-1999]
  policies:
    - date: 1997-09-12
      name: 国有经济战略性改组
      text: 十五大报告提出抓好大的，放活小的，以资本为纽带，通过市场形成具有较强竞争力的跨地区、跨行业、跨所有制和跨国经营的大企业集团，并采取改组、联合、兼并、租赁、承包经营和股份合作制、出售等形式，加快放开搞活国有小型企业的步伐。
      events: [e1997-15th-congress, e07-2004-lang-gu]
      cite: i01-wenming-1997-09-12-15th-report
  cites: [e01-cpc-dsj-1997, i01-wenming-1997-09-12-15th-report, e01-cpc-dsj-1999, p03-nfrb-2025-05-19-lu-ruihua-life]

- id: western-development
  name: 西部大开发
  en: Western Development Strategy
  kind: formula
  by: [jiang-zemin, zhu-rongji]
  first:
    date: 1999-06-17
    text: 江泽民在西安主持国有企业改革和发展座谈会时提出。
    cite: e01-gov-2021-06-28-cpc-100y
    quote: 实施西部大开发，是一项振兴中华的宏伟战略任务。
  codified:
    - date: 2002-11-08
      where: 十六大报告
      cite: i01-jszx-2002-11-08-16th-report
      quote: 实施西部大开发战略,关系全国发展的大局,关系民族团结和边疆稳定。
  summary: 西部大开发是1999年江泽民提出、2000年启动的区域发展战略，目标是缩小东西部差距。重点是基础设施、生态环境、产业结构、科技教育和改革开放，代表性工程有青藏铁路、西气东输、西电东送等。2003年政府工作报告说，三年来新开工建设36项重点工程，投资总规模6000多亿元。官方把它与“民族团结和边疆稳定”联系在一起；批评者则认为，投资的主要受益者是修路开矿的国企和迁入的汉族人口，经济决定论无法化解民族矛盾。十七大后它成为“区域发展总体战略”的第一项。
  quote:
    text: 要打好基础,扎实推进,重点抓好基础设施和生态环境建设,争取十年内取得突破性进展。
    cite: i01-jszx-2002-11-08-16th-report
  terms: [西部大开发, 西部开发]
  related: [northeast-revitalization, three-represents]
  voices:
    - voice: zh
      text: 批评这一政策的人士还说，对西北地区投资的主要的受惠者是修路开矿的国企。大批居民被从原住地迁离，牧民被迁入定居点，失去了谋生手段。
      cite: i07-bbc-2010-07-05-xinjiang-anniversary
      quote: true
  sections:
    - h: 启动
      from: 2000
      text: 2000年1月国务院西部地区开发领导小组召开会议，朱镕基阐述实施西部大开发的意义，会议提出加快基础设施建设、加强生态环境保护和建设、调整产业结构、发展科技和教育、加大改革开放力度五项重点。当年国家计委公布西部新开工十大工程，10月国务院发出关于实施西部大开发若干政策措施的通知。
      cites: [e01-cpc-dsj-2000, e01-gov-2021-06-28-cpc-100y]
    - h: 成效与批评
      from: 2003
      to: 2010
      text: 2003年政府工作报告称西部大开发开局良好，青藏铁路、西气东输、西电东送等重大项目进展顺利。BBC中文2010年的分析引述作家王力雄的观点，认为新疆的经济发展受益最多的是当权者和后迁入的以汉人为主的人口，“经济决定的思路”反而会加深民族矛盾。
      cites: [i02-gov-2003-gwr, i07-bbc-2010-07-05-xinjiang-anniversary]
  policies:
    - date: 2000-01-24
      name: 西部开发五项重点
      text: 国务院西部地区开发领导小组召开西部地区开发会议，提出加快基础设施建设、加强生态环境保护和建设、调整产业结构、发展科技和教育、加大改革开放力度，并于5月公布十大工程。
      events: [e2000-western-development, e2006-qinghai-tibet-railway]
      cite: e01-cpc-dsj-2000
  cites: [e01-gov-2021-06-28-cpc-100y, e01-cpc-dsj-2000, i01-jszx-2002-11-08-16th-report, i02-gov-2003-gwr, b02-npc-2007-10-24-17th-report, i07-bbc-2010-07-05-xinjiang-anniversary]

- id: northeast-revitalization
  name: 振兴东北老工业基地
  en: Revitalizing the Northeast
  kind: formula
  by: [hu-jintao, wen-jiabao]
  first:
    date: 2002-11-08
    text: 十六大报告提出支持东北地区等老工业基地加快调整和改造。
    cite: i01-jszx-2002-11-08-16th-report
    quote: 支持东北地区等老工业基地加快调整和改造
  codified:
    - date: 2007-10-15
      where: 十七大报告
      cite: b02-npc-2007-10-24-17th-report
      quote: 全面振兴东北地区等老工业基地
  summary: 东北是计划经济时期的重工业基地，国企改革中受冲击很大。2002年十六大报告提出支持东北地区等老工业基地加快调整和改造；2003年10月中共中央、国务院印发《关于实施东北地区等老工业基地振兴战略的若干意见》，重点是体制机制创新、扩大开放、重点行业和企业的调整改造，以及资源型城市转型和采煤沉陷区治理。连同西部大开发和2006年的中部崛起，形成“区域发展总体战略”。
  terms: [振兴东北, 东北地区等老工业基地]
  related: [western-development, soe-reform, scientific-development]
  sections:
    - h: 区域发展总体战略
      from: 2003
      to: 2007
      text: 2004年政府工作报告提出推进西部大开发，振兴东北地区等老工业基地，促进中部地区崛起，鼓励东部地区加快发展，形成东中西互动、优势互补、相互促进、共同发展的新格局，并要求东北振兴“今年要有一个良好的开端”。2007年十七大报告把这四项合称区域发展总体战略。
      cites: [i02-gov-2004-gwr, b02-npc-2007-10-24-17th-report]
  policies:
    - date: 2003-10-05
      name: 东北振兴意见
      text: 中共中央、国务院印发《关于实施东北地区等老工业基地振兴战略的若干意见》；2006年4月又印发《关于促进中部地区崛起的若干意见》。
      events: [e2003-northeast-revitalization]
      cite: e01-gov-2021-06-28-cpc-100y
  cites: [i01-jszx-2002-11-08-16th-report, e01-gov-2021-06-28-cpc-100y, i02-gov-2004-gwr, b02-npc-2007-10-24-17th-report]

# ---------- 江泽民后期的党建与道德建设 ----------
- id: rule-by-virtue
  name: 以德治国
  en: Rule by Virtue
  kind: formula
  by: [jiang-zemin]
  first:
    date: 2001-01-10
    text: 江泽民在全国宣传部长会议上讲话，把“以德治国”与“依法治国”并提。
    cite: i07-chinanews-2001-01-10-rule-by-virtue
    quote: 要坚持不懈地加强社会主义法制建设，依法治国，同时也要坚持不懈地加强社会主义道德建设，以德治国
  codified:
    - date: 2001-09-20
      where: 《公民道德建设实施纲要》
      cite: e01-gov-2021-06-28-cpc-100y
      quote: 提出要把法制建设与道德建设、依法治国与以德治国紧密结合起来
    - date: 2002-11-08
      where: 十六大报告（十条基本经验之五）
      cite: i01-jszx-2002-11-08-16th-report
      quote: 坚持物质文明和精神文明两手抓,实行依法治国和以德治国相结合
    - date: 2014-10-23
      where: 十八届四中全会《中共中央关于全面推进依法治国若干重大问题的决定》
      cite: e03-gov-2014-10-28-rule-of-law
      quote: 坚持依法治国和以德治国相结合。国家和社会治理需要法律和道德共同发挥作用
  summary: 以德治国是江泽民2001年1月在全国宣传部长会议上提出的口号，说“法治与德治，从来都是相辅相成、相互促进的”，要把依法治国与以德治国紧密结合起来。同年9月中共中央印发《公民道德建设实施纲要》，2002年政府工作报告据此倡导“爱国守法、明礼诚信、团结友善、勤俭自强、敬业奉献”的基本道德规范。十六大报告把“依法治国和以德治国相结合”列入十三年的十条基本经验。中共党史和文献研究院网站2019年的文章认为，这一提法最直接的针对性是反思宣传思想工作如何应对“法轮功”等思想，且从未单独出现，总是排在依法治国之后。十八大以后，“坚持依法治国和以德治国相结合”被写进十八届四中全会决定和十九大报告。
  quote:
    text: 对一个国家的治理来说，法治与德治，从来都是相辅相成、相互促进的。二者缺一不可，也不可偏废。
    cite: i07-chinanews-2001-01-10-rule-by-virtue
  terms: [以德治国, 依法治国和以德治国相结合, 公民道德建设实施纲要]
  related: [rule-of-law, three-represents, honor-disgrace]
  voices:
    - voice: zh
      text: 这些代表和委员向在北京采访的香港记者私下里表示，在现代社会提以德治国有很强烈的封建意味。
      cite: i07-bbc-2001-03-13-rule-by-virtue
      quote: true
    - voice: history
      text: 江泽民提出“以德治国”最直接的现实针对性，就是要对党的宣传思想工作如何应对“法轮功”及其他一切腐朽思想对社会生活的侵蚀进行深刻反思。
      cite: i07-dswxyjy-2019-07-09-rule-by-virtue
      quote: true
  sections:
    - h: 宣传部长会议上的提法
      from: 2001
      text: 2001年1月10日的讲话面向全国宣传部长。中新社的报道说，法治属于政治建设、政治文明，德治属于思想建设、精神文明，二者范畴不同但地位和功能都非常重要。同年4月全国社会治安工作会议和7月建党80周年讲话中，江泽民都重复了“把依法治国与以德治国结合起来”的说法。
      cites: [i07-chinanews-2001-01-10-rule-by-virtue, i07-dswxyjy-2019-07-09-rule-by-virtue]
    - h: 从十六大到执政能力决定
      from: 2002
      to: 2004
      text: 十六大报告在文化建设部分说“依法治国和以德治国相辅相成”，要求建立与社会主义市场经济相适应、与社会主义法律规范相协调、与中华民族传统美德相承接的社会主义思想道德体系，并以“社会公德、职业道德和家庭美德”为教育内容。2004年十六届四中全会执政能力决定再次写入两者相结合，提出实施公民道德建设工程。
      cites: [i01-jszx-2002-11-08-16th-report, i07-dswxyjy-2019-07-09-rule-by-virtue]
    - h: 新时代的沿用
      from: 2012
      text: 十八大报告在公民道德部分写“要坚持依法治国和以德治国相结合”，道德教育内容在“三德”之外加上“个人品德”。2014年十八届四中全会决定把“坚持依法治国和以德治国相结合”列为全面推进依法治国的五项原则之一，要求“一手抓法治、一手抓德治”。
      cites: [i01-wsyu-2012-11-08-18th-report, e03-gov-2014-10-28-rule-of-law]
  lists:
    - title: 基本道德规范（2002年政府工作报告）
      cite: i02-gov-2002-gwr
      items: [爱国守法, 明礼诚信, 团结友善, 勤俭自强, 敬业奉献]
    - title: 社会主义思想道德体系的三个“相”（十六大报告，2002）
      cite: i01-jszx-2002-11-08-16th-report
      items:
        - 与社会主义市场经济相适应
        - 与社会主义法律规范相协调
        - 与中华民族传统美德相承接
  policies:
    - date: 2001-09-20
      name: 公民道德建设实施纲要
      text: 中共中央印发《公民道德建设实施纲要》，提出逐步形成与发展社会主义市场经济相适应的社会主义道德体系。
      cite: e01-gov-2021-06-28-cpc-100y
  cites: [i07-chinanews-2001-01-10-rule-by-virtue, e01-gov-2021-06-28-cpc-100y, i02-gov-2002-gwr, i01-jszx-2002-11-08-16th-report, i07-dswxyjy-2019-07-09-rule-by-virtue, i01-wsyu-2012-11-08-18th-report, e03-gov-2014-10-28-rule-of-law, i01-gov-2017-10-18-19th-report, i07-bbc-2001-03-13-rule-by-virtue]

- id: three-stresses
  name: “三讲”教育
  en: "\"Three Stresses\" Education"
  kind: formula
  by: [jiang-zemin, hu-jintao]
  first:
    date: 1995-11-06
    text: 江泽民在北京市考察工作时提出干部教育要讲学习、讲政治、讲正气。
    cite: e01-cpc-dsj-1995
    quote: 在对干部进行教育时，要强调讲学习、讲政治、讲正气
  codified:
    - date: 1997-09-12
      where: 十五大报告
      cite: i01-wenming-1997-09-12-15th-report
      quote: 继续在县级以上领导干部中深入进行以讲学习、讲政治、讲正气为主要内容的党性党风教育
    - date: 1998-11-21
      where: 中共中央《关于在县级以上党政领导班子、领导干部中深入开展以“讲学习、讲政治、讲正气”为主要内容的党性党风教育的意见》
      cite: e01-cpc-dsj-1998
      quote: 中共中央召开电视电话会议，对“三讲”教育进行动员部署
  summary: “三讲”即讲学习、讲政治、讲正气，是江泽民1995年11月在北京考察时对干部教育提出的要求；1996年他又反复强调领导干部要“讲政治”。1997年十五大报告要求在县级以上领导干部中继续进行这一党性党风教育。1998年11月中共中央发出意见，从1998年底到2000年底在县级以上党政领导班子和领导干部中自上而下、分期分批开展集中教育，胡锦涛多次在全国“三讲”工作会议上讲话。江泽民1999年说，这是“当前党的建设的重中之重”，要以整风的精神进行，其核心是讲政治。2000年12月中央召开总结会议，胡锦涛称全国几十万领导干部和几百万干部群众参与。十六大报告把“三讲”集中教育列为过去五年党建的成绩之一。
  terms: [三讲, 讲学习、讲政治、讲正气, 讲政治]
  related: [three-represents, advanced-nature-education, self-revolution]
  voices:
    - voice: west
      text: 1983年，中国共产党发起了一场整风运动，目的是挖出那些继续支持“文化大革命”的目标和“四人帮”的人。1998年，中国共产党发起了讲学习、讲政治和讲正气的“三讲教育”活动。
      cite: i07-dzwww-2005-03-03-hoover-advanced-nature
      quote: true
  sections:
    - h: 从考察讲话到十五大
      from: 1995
      to: 1997
      text: 1995年11月江泽民在北京市考察，提出教育干部要讲学习、讲政治、讲正气；12月在中央军委扩大会议上说“任何时候在讲政治的问题上都必须有更高的要求和更高的自觉性”。1996年3月他解释说，要求领导干部讲政治“绝不会影响经济的发展”。
      cites: [e01-cpc-dsj-1995, e01-cpc-dsj-1996, i01-wenming-1997-09-12-15th-report]
    - h: 两年集中教育
      from: 1998
      to: 2000
      text: 1999年3月中央召开电视电话会议总结试点，胡锦涛说试点“在恢复和发扬批评与自我批评的优良传统方面有了明显进步”，要求继续自上而下、分期分批进行，“防止走过场”。2000年政府工作报告要求国务院各部门和省地级政府巩固“三讲”成果，同时切实搞好县级“三讲”教育。2000年12月的总结会议以“三个代表”重要思想为指导，对两年来的集中教育作了总结。
      cites: [e01-cpc-dsj-1999, i02-gov-2000-gwr, e01-cpc-dsj-2000]
  lists:
    - title: “三讲”（江泽民，1995）
      cite: e01-cpc-dsj-1995
      items: [讲学习, 讲政治, 讲正气]
    - title: 讲什么政治（江泽民七一讲话，1999）
      cite: e01-cpc-dsj-1999
      items:
        - 讲马克思主义的政治
        - 讲建设有中国特色社会主义的政治
        - 讲实现、维护和发展人民利益的政治
  policies:
    - date: 1998-11-21
      name: 部署“三讲”集中教育
      text: 中共中央发出意见，12月5日召开电视电话会议动员部署，在县级以上党政领导班子、领导干部中开展以讲学习、讲政治、讲正气为主要内容的党性党风教育。
      cite: e01-cpc-dsj-1998
  cites: [e01-cpc-dsj-1995, e01-cpc-dsj-1996, i01-wenming-1997-09-12-15th-report, e01-cpc-dsj-1998, e01-cpc-dsj-1999, e01-cpc-dsj-2000, i02-gov-2000-gwr, e01-gov-2021-06-28-cpc-100y, i01-jszx-2002-11-08-16th-report, i07-dzwww-2005-03-03-hoover-advanced-nature]

- id: advanced-nature-education
  name: 保持共产党员先进性教育活动
  en: Campaign to Maintain the Advanced Nature of Party Members
  kind: formula
  by: [hu-jintao]
  first:
    date: 2002-11-08
    text: 十六大报告提出在全党开展以实践“三个代表”为主要内容的先进性教育活动。
    cite: i01-jszx-2002-11-08-16th-report
    quote: 在全党开展以实践“三个代表”重要思想为主要内容的保持共产党员先进性教育活动
  codified:
    - date: 2004-11-07
      where: 中共中央《关于在全党开展以实践“三个代表”重要思想为主要内容的保持共产党员先进性教育活动的意见》
      cite: e01-gov-2021-06-28-cpc-100y
      quote: 2005年1月至2006年6月，全党开展了这一教育活动
    - date: 2007-10-15
      where: 十七大报告
      cite: b02-npc-2007-10-24-17th-report
      quote: 全面巩固和发展先进性教育活动成果，着力加强基层党的建设
  summary: 先进性教育活动是胡锦涛时期第一场全党性的集中教育。按中组部官员的说法，它源于2000年中组部对30万名党员的思想状况调查，十六大提出，2004年10月政治局决定、11月中央印发意见。活动从2005年1月到2006年6月分三批进行，每批半年左右，依次覆盖县级以上机关、城市基层和乡镇机关、农村基层。中组部副部长李景田2005年说，这“不是什么政治运动，也不是对党内的整肃运动”，但对经教育仍不合格的党员要按程序处理；BBC报道，2005年共有44738名党员因“不合格”被除名。2006年6月30日胡锦涛总结说，这是党“参加人数最多、规模最大的一次马克思主义集中教育活动”。十七大报告要求建立“永葆先进性长效机制”。
  quote:
    text: 这次先进性教育活动，是我们党参加人数最多、规模最大的一次马克思主义集中教育活动，实现了预期目标，取得了显著成效。
    cite: e01-cpc-dsj-2006
  terms: [先进性教育, 保持共产党员先进性教育活动, 先进性建设]
  related: [three-stresses, three-represents, scientific-development, self-revolution]
  voices:
    - voice: west
      text: 这场运动是中国共产党在毛泽东逝世后发起的第三场“整风”运动。
      cite: i07-dzwww-2005-03-03-hoover-advanced-nature
      quote: true
    - voice: west
      text: 保持党员先进性的活动让中央加强了对党员升迁的控制，这意味着这场运动可能有助于巩固领导集体的权威，并将有抱负的年轻干部团结在共产党领导层的周围。
      cite: i07-dzwww-2005-03-03-hoover-advanced-nature
      quote: true
    - voice: west
      text: The dismissals, a total of 44,738, were part of the party's largest-ever internal education campaign, launched in January 2005, which analysts view as an attempt by the party to re-engage with ordinary people.
      zh: 这44738人的除名是2005年1月启动、党内规模最大的教育活动的一部分；分析人士认为，这是党试图重新联系普通民众。
      cite: i07-bbc-2006-07-13-party-dismisses
      quote: true
  sections:
    - h: 缘起与决策
      from: 2000
      to: 2004
      text: 李景田说，2000年的党员思想状况调查表明，党员队伍中存在与保持先进性要求不相适应的问题，一些基层组织“软弱涣散、不起作用”，中组部据此提出建议。2004年10月21日政治局会议决定从2005年1月起开展，要求坚持正面教育为主，认真开展批评与自我批评，坚持区别情况、分类指导。
      cites: [i07-cyol-2005-07-08-advanced-nature, e01-cpc-dsj-2004]
    - h: 三批推进
      from: 2005
      to: 2006
      text: 2005年1月5日至6日中央召开工作会议后，第一批活动展开。到同年7月第一批基本结束，共有80.1万个基层党组织、1385.5万名党员参加，具体到每个单位集中学习教育约三个月。这是中组部首次在国务院新闻办发布会上公开回答记者提问，李景田还否认了海外网站关于大批党员退党的说法。
      cites: [e01-cpc-dsj-2005, i07-cyol-2005-07-08-advanced-nature]
    - h: 长效机制
      from: 2006
      to: 2007
      text: 2006年6月30日建党85周年大会同时总结先进性教育活动，胡锦涛要求把加强党的先进性建设作为一项重大战略任务。十七大报告说先进性教育活动“取得重大成果”，要求建立党员党性定期分析制度，及时处置不合格党员。
      cites: [e01-cpc-dsj-2006, b02-npc-2007-10-24-17th-report]
  lists:
    - title: 三批参加单位（《中国共产党大事记》2005）
      cite: e01-cpc-dsj-2005
      items: [县级以上机关, 城市基层和乡镇机关, 农村基层]
    - title: 目标要求（李景田，2005）
      cite: i07-cyol-2005-07-08-advanced-nature
      items: [提高党员素质, 加强基层组织, 服务人民群众, 促进各项工作]
  policies:
    - date: 2004-11-07
      name: 先进性教育活动意见
      text: 中共中央印发意见，2005年1月至2006年6月在全党开展以实践“三个代表”重要思想为主要内容的保持共产党员先进性教育活动。
      events: [e2004-advanced-nature-campaign]
      cite: e01-gov-2021-06-28-cpc-100y
  cites: [i01-jszx-2002-11-08-16th-report, e01-cpc-dsj-2004, e01-gov-2021-06-28-cpc-100y, e01-cpc-dsj-2005, e01-cpc-dsj-2006, b02-npc-2007-10-24-17th-report, i07-cyol-2005-07-08-advanced-nature, i07-dzwww-2005-03-03-hoover-advanced-nature, i07-bbc-2006-07-13-party-dismisses]

# ---------- 胡温时期的发展口号 ----------
- id: people-oriented
  name: 以人为本
  en: Putting People First
  kind: component
  parent: scientific-development
  by: [hu-jintao, wen-jiabao]
  first:
    date: 2003-10-14
    text: 十六届三中全会《中共中央关于完善社会主义市场经济体制若干问题的决定》提出坚持以人为本。
    cite: e01-gov-2021-06-28-cpc-100y
    quote: 提出坚持以人为本，树立全面、协调、可持续的发展观，促进经济社会和人的全面发展
  codified:
    - date: 2007-10-15
      where: 十七大报告
      cite: b02-npc-2007-10-24-17th-report
      quote: 科学发展观，第一要义是发展，核心是以人为本，基本要求是全面协调可持续，根本方法是统筹兼顾。
    - date: 2007-10-21
      where: 十七大关于党章修正案的决议
      cite: i01-gov-2007-10-21-17th-charter-resolution
      quote: 提出了以人为本、全面协调可持续发展的科学发展观
  summary: 以人为本是科学发展观的核心。2003年10月十六届三中全会首次在中央文件中提出“坚持以人为本”，2004年政府工作报告要求“更加注重以人为本”，2005年政府工作报告写“坚持以人为本、执政为民”。2007年十七大报告把它定为科学发展观的核心，并解释为“发展为了人民、发展依靠人民、发展成果由人民共享”。这三句话后来被习近平时期的“以人民为中心的发展思想”沿用。
  quote:
    text: 必须坚持以人为本。全心全意为人民服务是党的根本宗旨，党的一切奋斗和工作都是为了造福人民。
    cite: b02-npc-2007-10-24-17th-report
  terms: [以人为本, 坚持以人为本]
  related: [scientific-development, harmonious-society]
  sections:
    - h: 写进中央文件
      from: 2003
      to: 2005
      text: 2003年非典疫情后，胡锦涛提出“全面的发展观”；十六届三中全会决定提出坚持以人为本，树立全面、协调、可持续的发展观。2004年政府工作报告把“更加注重以人为本”与更加注重宏观调控、统筹兼顾、改革创新并列。2005年政府工作报告在政府自身建设部分写“坚持以人为本、执政为民”。
      cites: [i01-cma-2012-12-17-scientific-development, e01-gov-2021-06-28-cpc-100y, i02-gov-2004-gwr, i02-gov-2005-gwr]
    - h: 从以人为本到以人民为中心
      from: 2007
      to: 2016
      text: 十七大报告要求始终把实现好、维护好、发展好最广大人民的根本利益作为党和国家一切工作的出发点和落脚点，做到发展为了人民、依靠人民、成果由人民共享。2015年十八届五中全会公报在共享发展一节沿用这三句话，2016年政府工作报告写“坚持以人民为中心的发展思想”。
      cites: [b02-npc-2007-10-24-17th-report, i01-moe-2015-10-29-5th-plenum-communique, i02-gov-2016-gwr]
  lists:
    - title: 以人为本的三句话（十七大报告，2007）
      cite: b02-npc-2007-10-24-17th-report
      items: [发展为了人民, 发展依靠人民, 发展成果由人民共享]
    - title: 四个“更加注重”（2004年政府工作报告）
      cite: i02-gov-2004-gwr
      items: [更加注重搞好宏观调控, 更加注重统筹兼顾, 更加注重以人为本, 更加注重改革创新]
  policies:
    - date: 2003-10-14
      name: 完善社会主义市场经济体制决定
      text: 十六届三中全会通过决定，明确完善社会主义市场经济体制的主要任务，提出坚持以人为本和全面、协调、可持续的发展观。
      events: [e07-2003-third-plenum, e2003-scientific-development]
      cite: e01-gov-2021-06-28-cpc-100y
  cites: [e01-gov-2021-06-28-cpc-100y, i01-cma-2012-12-17-scientific-development, i02-gov-2004-gwr, i02-gov-2005-gwr, b02-npc-2007-10-24-17th-report, i01-gov-2007-10-21-17th-charter-resolution, i01-moe-2015-10-29-5th-plenum-communique, i02-gov-2016-gwr]

- id: innovative-country
  name: 建设创新型国家
  en: Building an Innovative Country
  kind: formula
  by: [hu-jintao, wen-jiabao]
  first:
    date: 2006-01-26
    text: 全国科学技术大会后，中共中央、国务院作出关于实施科技规划纲要、增强自主创新能力的决定。
    cite: e01-gov-2021-06-28-cpc-100y
    quote: 提出增强自主创新能力，努力建设创新型国家
  codified:
    - date: 2006-03-05
      where: 2006年政府工作报告
      cite: i02-gov-2006-gwr
      quote: 要以建设创新型国家为目标，全面实施《国家中长期科学和技术发展规划纲要》
    - date: 2007-10-15
      where: 十七大报告
      cite: b02-npc-2007-10-24-17th-report
      quote: 提高自主创新能力，建设创新型国家。这是国家发展战略的核心，是提高综合国力的关键。
  summary: 建设创新型国家是2006年1月全国科学技术大会提出的目标，配套《国家中长期科学和技术发展规划纲要（2006—2020年）》。2006年政府工作报告提出“自主创新、重点跨越、支撑发展、引领未来”的方针，要提高原始创新、集成创新和引进消化吸收再创新三种能力，并启动一批重大科技专项；当年中央财政科技投入716亿元，增长19.2%。2007年十七大报告把它称为“国家发展战略的核心”，目标是到2020年“进入创新型国家行列”。十八大报告改用“实施创新驱动发展战略”，保留了三种创新能力的提法。
  quote:
    text: 我国已进入必须更多地依靠科技进步和创新推动经济社会发展的历史阶段，要把加快科技发展放在更加突出的战略地位。
    cite: i02-gov-2006-gwr
  terms: [创新型国家, 自主创新, 自主创新能力]
  related: [scientific-development, new-quality-productive-forces]
  sections:
    - h: 科技大会与规划纲要
      from: 2006
      text: 2006年1月9日至11日中共中央、国务院召开全国科学技术大会，胡锦涛、温家宝讲话，部署实施规划纲要；26日作出增强自主创新能力的决定。同年8月胡锦涛把“建设创新型国家”与以人为本、和谐社会、新农村等并列为十六大以来的重大战略思想和重大战略任务。
      cites: [e01-cpc-dsj-2006, e01-gov-2021-06-28-cpc-100y]
    - h: 以企业为主体
      from: 2006
      to: 2012
      text: 2006年政府工作报告要求强化企业在自主创新中的主体地位，形成一批拥有自主知识产权的技术、产品和标准，并实行支持企业创新的财税、金融和政府采购等政策。十七大和十八大报告都要求建立以企业为主体、市场为导向、产学研相结合的技术创新体系。
      cites: [i02-gov-2006-gwr, b02-npc-2007-10-24-17th-report, i01-wsyu-2012-11-08-18th-report]
  lists:
    - title: 自主创新方针（2006年政府工作报告）
      cite: i02-gov-2006-gwr
      items: [自主创新, 重点跨越, 支撑发展, 引领未来]
    - title: 三种创新能力（2006年政府工作报告）
      cite: i02-gov-2006-gwr
      items: [原始创新能力, 集成创新能力, 引进消化吸收再创新能力]
  policies:
    - date: 2006-01-26
      name: 增强自主创新能力的决定
      text: 中共中央、国务院作出《关于实施科技规划纲要，增强自主创新能力的决定》，部署实施《国家中长期科学和技术发展规划纲要（2006—2020年）》。
      cite: e01-cpc-dsj-2006
  cites: [e01-gov-2021-06-28-cpc-100y, e01-cpc-dsj-2006, i02-gov-2006-gwr, b02-npc-2007-10-24-17th-report, i01-wsyu-2012-11-08-18th-report]

- id: sannong
  name: “三农”问题与取消农业税
  en: "\"Three Rural Issues\" and the End of the Agricultural Tax"
  kind: formula
  by: [hu-jintao, wen-jiabao]
  first:
    date: 2003-01-08
    text: 胡锦涛在中央农村工作会议上把解决农业、农村和农民问题定为全党工作的重中之重。
    cite: e01-gov-2021-06-28-cpc-100y
    quote: 把解决好农业、农村和农民问题作为全党工作的重中之重
  codified:
    - date: 2004-03-05
      where: 2004年政府工作报告
      cite: i02-gov-2004-gwr
      quote: 逐步降低农业税税率，平均每年降低１个百分点以上，五年内取消农业税
    - date: 2005-12-29
      where: 十届全国人大常委会第十九次会议
      cite: e01-cpc-dsj-2005
      quote: 自2006年1月1日起废止《中华人民共和国农业税条例》
    - date: 2007-10-15
      where: 十七大报告
      cite: b02-npc-2007-10-24-17th-report
      quote: 解决好农业、农村、农民问题，事关全面建设小康社会大局，必须始终作为全党工作的重中之重。
  summary: “三农”指农业、农村、农民。2003年1月胡锦涛提出把“三农”作为全党工作的重中之重，方针是“多予、少取、放活”。农村税费改革先在安徽试点，取消乡统筹、村提留等收费；2004年政府工作报告提出五年内取消农业税，2005年政府工作报告宣布“原定5年取消农业税的目标，3年就可以实现”。2005年12月29日全国人大常委会决定自2006年1月1日起废止农业税条例。2006年政府工作报告说，农村税费改革取消了336亿元农业税赋和700多亿元“三提五统”等。同期国家建立粮食直补等农业补贴，2005年十六届五中全会提出建设社会主义新农村，贯彻“工业反哺农业、城市支持农村”的方针。
  quote:
    text: 今年在全国彻底取消农业税，标志着在我国实行了长达2600年的这个古老税种从此退出历史舞台，这是具有划时代意义的重大变革。
    cite: i02-gov-2006-gwr
  terms: [三农, 农业税, 农村税费改革, 社会主义新农村, 多予少取放活]
  related: [scientific-development, harmonious-society, xiaokang]
  sections:
    - h: 农村税费改革
      from: 2000
      to: 2005
      text: 2001年政府工作报告要求在总结安徽省试点经验的基础上加快农村税费改革，取消乡统筹、村提留和其他面向农民的行政性收费，同时适当提高农业税和农业特产税税率。2004年起黑龙江、吉林先行免征农业税，12个粮食主产省区税率降低一个百分点；2005年592个国家扶贫开发工作重点县免征农业税，全部免征牧业税。
      cites: [i02-gov-2001-gwr, e01-cpc-dsj-2004, i02-gov-2005-gwr]
    - h: 农业税走入历史
      from: 2006
      text: 2006年1月1日起农业税条例废止。官方对这一税种历史的说法不一：2005年政府工作报告和中共中央党史和文献研究院的百年大事记都说“两千多年”，2006年政府工作报告说“长达2600年”，2007年政府工作报告说“延续2600多年”。2006年政府工作报告同时提醒，取消农业税后，关键是全面推进乡镇机构、农村义务教育和县乡财政管理体制等农村综合改革。
      cites: [i02-gov-2005-gwr, e01-gov-2021-06-28-cpc-100y, i02-gov-2006-gwr, i02-gov-2007-gwr]
    - h: 社会主义新农村
      from: 2005
      to: 2008
      text: 2005年10月十六届五中全会提出建设社会主义新农村，12月中央农村工作会议要求按照二十字要求全面推进农村建设，2006年2月21日新华社发布中共中央、国务院关于推进社会主义新农村建设的若干意见。2008年政府工作报告总结说，全部取消农业税、牧业税和特产税后每年减轻农民负担1335亿元，中央财政五年用于“三农”的支出累计1.6万亿元。
      cites: [e01-cpc-dsj-2005, i02-gov-2006-gwr, i02-gov-2008-gwr]
  lists:
