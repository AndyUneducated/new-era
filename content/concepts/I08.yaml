- id: historical-nihilism-debate
  name: 历史虚无主义之争
  en: Historical Nihilism Debate
  kind: debate
  by: [xi-jinping, yang-jisheng]
  first:
    date: 2013-01-05
    text: 习近平在新进中央委员会的委员、候补委员学习贯彻十八大精神研讨班上提出两个历史时期“不能互相否定”，并把苏联解体归因于“搞历史虚无主义”（讲话2019年在《求是》发表）。
    cite: i08-xinhua-2019-03-31-xi-2013-01-05
    quote: 不能用改革开放后的历史时期否定改革开放前的历史时期，也不能用改革开放前的历史时期否定改革开放后的历史时期
  summary: 历史虚无主义之争是2013年以后围绕党史、国史和英雄人物能否“重新评价”的论争。习近平2013年1月5日提出“两个不能否定”，引用“灭人之国，必先去其史”，并说苏联解体的一个重要原因是“全面否定苏联历史、苏共历史”。官方把以“重新评价”为名质疑党史和英雄的写作称为历史虚无主义；曲青山说，它“往往披着学术外衣、打着娱乐幌子”。《炎黄春秋》一方则反过来说自己“是坚定地反对历史虚无主义的”，杨继绳说历史虚无主义“就是否定历史，掩盖历史真相”，茅于轼说“政治干涉学术是非常有害而且是危险的一件事”。2016年6月，北京市西城区法院判决《炎黄春秋》前执行主编洪振快因两篇考证狼牙山五壮士细节的文章侵害名誉，须公开道歉，洪振快说“我当然不会道歉”。2021年党史学习教育和第三个历史决议都把反对历史虚无主义写入正式要求。
  quote:
    text: 古人说：“灭人之国，必先去其史。”国内外敌对势力往往就是拿中国革命史、新中国历史来做文章，竭尽攻击、丑化、污蔑之能事，根本目的就是要搞乱人心，煽动推翻中国共产党的领导和我国社会主义制度。
    cite: i08-xinhua-2019-03-31-xi-2013-01-05
  terms: [历史虚无主义]
  related: [third-resolution, document-9, liberals, maoist-left, universal-values-debate]
  sides:
    - label: 反对历史虚无主义是政治斗争（习近平、曲青山）
      text: 习近平说，正确处理改革开放前后两个时期的关系，“不只是一个历史问题，更主要的是一个政治问题”。曲青山认为，历史虚无主义的本质“就是以所谓‘重新评价’为名，歪曲近现代中国革命历史和党史国史军史”，其手法是“以细节代替整体，以局部代替全局”，反对它“绝不是一般的学术问题、思想问题、认识问题”。
      who: [xi-jinping, qu-qingshan]
      cites: [i08-xinhua-2019-03-31-xi-2013-01-05, i08-qstheory-2018-12-24-qu-qingshan]
    - label: 掩盖真相才是历史虚无主义（《炎黄春秋》、杨继绳、茅于轼）
      text: 杨继绳对美国之音说，“我们认为历史虚无主义就是否定历史，掩盖历史真相”，杜光称《炎黄春秋》是“反对历史虚无主义的大本营、重要基地”。茅于轼认为洪振快的文章属于学术讨论，并反问“关键是谁在搞历史虚无主义”。
      who: [yang-jisheng, mao-yushi]
      cites: [i08-voa-2015-05-21-yanhuang]
    - label: 考证细节是学术自由（洪振快）
      text: 洪振快在败诉后接受《纽约时报》采访说，“这是基本的学术自由，我需要保持作为一名知识分子的尊严”。
      who: []
      cites: [i08-nytcn-2016-08-16-hong-zhenkuai]
  sections:
    - h: 起因
      from: 2013-01-05
      text: 习近平2013年1月5日的讲话说，“国内外敌对势力往往就是拿中国革命史、新中国历史来做文章”，苏联“搞历史虚无主义，思想搞乱了”，最后“偌大一个党就作鸟兽散了”。同年9号文件把对党史的“虚无主义”批评列为七大危险之一。
      cites: [i08-xinhua-2019-03-31-xi-2013-01-05, e03-nytcn-2013-08-20-document-9]
    - h: 经过
      from: 2013
      to: 2016-08
      text: 洪振快在《炎黄春秋》等处发表两篇文章，考证狼牙山五壮士“在何处跳崖”“‘五壮士’是否拔了群众的萝卜”等细节。五壮士中葛振林、宋学义的后人起诉洪振快侵害名誉权。2015年美国之音采访《炎黄春秋》方面，杨继绳、茅于轼都否认自己在搞历史虚无主义。2016年6月27日一审宣判，法院认为洪振快“通过强调与主要事实无关或者关联不大的细节”否定主要史实，判他停止侵害、公开赔礼道歉。
      cites: [i08-xinhua-2016-06-27-langyashan, i08-voa-2015-05-21-yanhuang, i08-nytcn-2016-08-16-hong-zhenkuai]
    - h: 官方如何收场
      from: 2016-06
      to: 2021-11
      text: 法院判决认为，狼牙山五壮士的事迹和精神“是社会主义核心价值观的重要内容”，应视为社会公共利益，学术自由不足以抗辩侵权责任。2021年2月党史学习教育动员大会要求“旗帜鲜明反对历史虚无主义”；同年11月的第三个历史决议把历史虚无主义与拜金主义、享乐主义、极端个人主义并列为“不时出现”的错误思潮。
      cites: [i08-xinhua-2016-06-27-langyashan, i06-gov-2021-02-20-party-history, b04-gov-2021-11-16-resolution]
    - h: 影响
      from: 2018
      text: 曲青山2018年在《求是》网撰文，把反对历史虚无主义称为“一场没有硝烟的战争”，要求把正确认识历史、评价历史、研究历史“纳入制度化、法治化轨道”。二十大报告也把历史虚无主义列入十八大前“严重影响人们思想和社会舆论环境”的错误思潮之一。
      cites: [i08-qstheory-2018-12-24-qu-qingshan, i01-gov-2022-10-16-20th-report]
  voices:
    - voice: official
      text: 历史虚无主义往往披着学术外衣、打着娱乐幌子、潜藏在背后，具有极大的隐蔽性、欺骗性、迷惑性。
      cite: i08-qstheory-2018-12-24-qu-qingshan
      quote: true
    - voice: zh
      text: 政治干涉学术是非常有害而且是危险的一件事。历史虚无主义是很可恶的，就是伪造历史、或者掩盖历史。
      cite: i08-voa-2015-05-21-yanhuang
      quote: true
    - voice: official
      text: 被告完全可以在不损害他人合法权益和社会公共利益的前提下进行学术研究和自由发表言论，但被告却未采用这种方式
      cite: i08-xinhua-2016-06-27-langyashan
      quote: true
    - voice: zh
      text: “我当然不会道歉，”洪振快在周一接受采访时说。
      cite: i08-nytcn-2016-08-16-hong-zhenkuai
      quote: true
  cites:
    - i08-xinhua-2019-03-31-xi-2013-01-05
    - i08-qstheory-2018-12-24-qu-qingshan
    - i08-voa-2015-05-21-yanhuang
    - i08-nytcn-2016-08-16-hong-zhenkuai
    - i08-xinhua-2016-06-27-langyashan
    - e03-nytcn-2013-08-20-document-9
    - i06-gov-2021-02-20-party-history
    - b04-gov-2021-11-16-resolution

- id: family-planning-debate
  name: 计划生育存废之争
  en: Family Planning Debate
  kind: debate
  first:
    date: 2013-05-02
    text: 易富贤接受《纽约时报》中文网采访，主张彻底取消计划生育政策（库内所见最早出处）。
    cite: i08-nytcn-2013-05-02-yi-fuxian
    quote: 我建议中国应该彻底取消计划生育政策
  summary: 计划生育存废之争是2010年代围绕独生子女政策该不该放开、放开多快的论争。人口学者易富贤主张“彻底取消计划生育政策”，认为在控制人口的前提下放开二胎“犹如隔靴搔痒”，并说“政府的手不能伸入老百姓的身体中”；他提到顾宝昌等学者在2004年和2009年两次联署建议逐步过渡到二孩。中国人民大学翟振武则认为“立即全面放开二胎政策不利于人口的长期均衡发展”，支持更“平稳、渐进、可控”的单独二孩。官方采取逐步调整：2013年十八届三中全会启动单独二孩，2015年十八届五中全会决定“全面实施一对夫妇可生育两个孩子政策”，2021年5月政治局会议宣布三孩政策，7月中共中央、国务院决定取消社会抚养费，并把入户、入学、入职与个人生育情况“全面脱钩”。决定同时肯定“坚持计划生育基本国策”的历史作用。
  quote:
    text: 强制计划生育是计划经济时代的产物。用计划经济的思维来处理生育问题是荒唐的，也是极不道德、极不负责任的行为。
    cite: i08-nytcn-2013-05-02-yi-fuxian
  terms: [计划生育, 单独二孩, 全面二孩, 三孩]
  related: [involution-lying-flat, xiaokang]
  sides:
    - label: 彻底取消计划生育（易富贤）
      text: 易富贤说，二胎试点地区的生育率“仍然在1.5左右”，可见放开二胎解决不了问题；行政暴力对生育私权的侵犯“造成了很多悲剧”，“公权力不侵犯私权利，这是政府的底线”。
      who: []
      cites: [i08-nytcn-2013-05-02-yi-fuxian]
    - label: 渐进放开，单独二孩更稳妥（翟振武）
      text: 翟振武认为单独二孩“能缓解老龄化程度和过程，但无法改变中国老龄化的趋势”，应对老龄化的根本之策是建立社会保障和养老服务体系，应对劳动力减少要靠提高劳动生产率，“而不是再回到多生孩子的时代”。
      who: []
      cites: [i08-people-2013-12-03-zhai-zhenwu]
    - label: 坚持基本国策，逐步调整完善（中共中央）
      text: 官方一直把放开表述为“逐步调整完善生育政策”。2021年的决定说，党和国家“坚持计划生育基本国策，有力促进了经济发展和社会进步”，同时承认“经济负担、子女照料、女性对职业发展的担忧等成为制约生育的主要因素”。
      who: [xi-jinping]
      cites: [e03-gov-2013-11-15-reform-decision, i08-gov-2021-07-20-birth-decision]
  sections:
    - h: 起因
      from: 2004
      to: 2013-05
      text: 易富贤回顾，顾宝昌等学者2004年和2009年两次联署，提议在严格控制多孩生育的前提下逐步过渡到“每对夫妇生两个孩子的政策”；1980年代山西晋城等地农村也做过二胎试点。易富贤本人则主张一步取消。
      cites: [i08-nytcn-2013-05-02-yi-fuxian]
    - h: 经过
      from: 2013-11
      to: 2015-10
      text: 2013年11月十八届三中全会决定“启动实施一方是独生子女的夫妇可生育两个孩子的政策”。翟振武同年12月在《经济日报》撰文为这一渐进方案辩护。2015年10月十八届五中全会公报宣布“全面实施一对夫妇可生育两个孩子政策”，但仍写“坚持计划生育的基本国策”。
      cites: [e03-gov-2013-11-15-reform-decision, i08-people-2013-12-03-zhai-zhenwu, i01-moe-2015-10-29-5th-plenum-communique]
    - h: 官方如何收场
      from: 2021-05-31
      to: 2021-07-20
      text: 2021年5月31日，中共中央政治局会议审议优化生育政策的决定，要求“依法组织实施三孩生育政策”，同时对全面两孩政策前的独生子女家庭“继续实行现行各项奖励扶助制度和优惠政策”。7月20日公布的决定宣布“取消社会抚养费，清理和废止相关处罚规定”，并修改人口与计划生育法。
      cites: [i08-gov-2021-05-31-three-child, i08-gov-2021-07-20-birth-decision]
    - h: 影响
      from: 2021
      text: 决定把政策目标从控制人口转为“推动实现适度生育水平”，并承认群众生育观念“已总体转向少生优育”。限制性措施取消后，政策重心转向托育、教育、住房、税收等生育支持。
      cites: [i08-gov-2021-07-20-birth-decision, i08-gov-2021-05-31-three-child]
  voices:
    - voice: zh
      text: 我曾经说过，政府的手不能伸入老百姓的身体中。
      cite: i08-nytcn-2013-05-02-yi-fuxian
      quote: true
    - voice: scholar
      text: 综合全面地考量，立即全面放开二胎政策不利于人口的长期均衡发展。相对而言，“单独二孩”政策更加平稳、渐进、可控。
      cite: i08-people-2013-12-03-zhai-zhenwu
      quote: true
    - voice: doc
      text: 取消社会抚养费，清理和废止相关处罚规定。将入户、入学、入职等与个人生育情况全面脱钩。
      cite: i08-gov-2021-07-20-birth-decision
      quote: true
  cites:
    - i08-nytcn-2013-05-02-yi-fuxian
    - i08-people-2013-12-03-zhai-zhenwu
    - e03-gov-2013-11-15-reform-decision
    - i01-moe-2015-10-29-5th-plenum-communique
    - i08-gov-2021-05-31-three-child
    - i08-gov-2021-07-20-birth-decision

- id: second-generation-ethnic-policy
  name: “第二代民族政策”之争
  en: “Second-Generation Ethnic Policy” Debate
  kind: debate
  by: [hu-angang]
  first:
    date: 2011
    text: 胡鞍钢、胡联合在《新疆师范大学学报》发文，把2010年两次中央座谈会提出的“民族交往交流交融”看作民族政策转向第二代的标志。
    cite: i08-aisixiang-2011-hu-angang-ethnic
    quote: 这是我国民族政策从第一代开始向第二代转型的标志
  summary: “第二代民族政策”之争是2011年至2014年围绕是否淡化民族身份、改变民族区域自治的论争。2008年拉萨“3·14”和2009年乌鲁木齐“7·5”事件后，学界出现民族问题“去政治化”的主张。2011年胡鞍钢、胡联合提出“第二代民族政策”，主张“不断淡化公民的族群意识”、以“去标签化”处理民族问题，并研究适当增加省级行政区、取消地区级行政区划。中国社会科学院郝时远批评说，这是用“苏联模式”套用中国制度，“是一个违背事实的伪命题”，“所谓‘去政治化’，就是‘去制度化’，也就是‘去民族区域自治化’”。2014年9月中央民族工作会议说“民族区域自治制度是我国的一项基本政治制度”；国家民委随后的文章引述习近平：“我再次明确说一遍，取消民族区域自治制度这种说法可以休矣”。此后官方以“铸牢中华民族共同体意识”为民族工作主线，同时继续提“坚持和完善民族区域自治制度”。
  quote:
    text: 在民族工作方面，颠覆性错误就是取消民族区域自治制度。
    cite: i08-neac-2014-12-autonomy
  terms: [第二代民族政策, 去政治化, 民族区域自治]
  related: [statism, new-left, holistic-security, sinicization-of-religion]
  sides:
    - label: 淡化族群身份，促进交融一体（胡鞍钢、胡联合）
      text: 胡鞍钢、胡联合主张从保障个人公民权利平等而“不是强化国内各族群、民族的集体身份和集体权利”的角度处理民族问题，把以民族成分为对象的优惠政策调整为以贫困弱势公民为对象，并建议“民族”一词只用于中华民族，对汉族和各少数民族改称某某“族”或“族群”。
      who: [hu-angang]
      cites: [i08-aisixiang-2011-hu-angang-ethnic]
    - label: 民族区域自治是核心原则，不容改变（郝时远）
      text: 郝时远认为，中国的民族区域自治制度“不是‘苏联模式’”，以“第二代民族政策”之说取代“真正的民族平等”核心原则“是理论和实践的误导”，因为中国民族政策的基本原则和主要内容都体现在民族区域自治法中。
      who: []
      cites: [i08-tibetcn-2012-02-06-hao-shiyuan]
    - label: 坚持民族区域自治，不搞颠覆性错误（中央民族工作会议）
      text: 2014年中央民族工作会议说，“新中国成立65年来，党的民族理论和方针政策是正确的”，要“坚持统一和自治相结合、民族因素和区域因素相结合”。国家民委文章说，习近平指出“照搬论”是“张冠李戴”，“取消论”更是错误的。
      who: [xi-jinping]
      cites: [i08-gov-2014-09-29-ethnic-work-conference, i08-neac-2014-12-autonomy]
  sections:
    - h: 起因
      from: 2008-03
      to: 2010-05
      text: 郝时远说，民族问题“去政治化”的论说流行以后，随着2008年拉萨“3·14”和2009年乌鲁木齐“7·5”事件相继发生而成为“热点”。胡鞍钢、胡联合则以2010年1月和5月的中央第五次西藏工作座谈会、中央新疆工作座谈会提出“民族交往交流交融”为依据。
      cites: [i08-tibetcn-2012-02-06-hao-shiyuan, i08-aisixiang-2011-hu-angang-ethnic]
    - h: 经过
      from: 2011
      to: 2012-02
      text: 胡鞍钢、胡联合的文章提出以“去标签化”作为处理民族问题的基本策略，不在身份证明、升学、就业中强化公民的民族属性，并把“三个离不开”升华为“三个分不清”。2012年初郝时远在《中国民族报》连续发表评析文章，称胡鞍钢、胡联合对如何“去政治化”做出了“全方位的‘政策理念设计’”。
      cites: [i08-aisixiang-2011-hu-angang-ethnic, i08-tibetcn-2012-02-06-hao-shiyuan]
    - h: 官方如何收场
      from: 2014-09-28
      to: 2014-12
      text: 2014年9月的中央民族工作会议肯定“民族区域自治制度是我国的一项基本政治制度，是中国特色解决民族问题的正确道路的重要内容”，关键是“帮助自治地方发展经济、改善民生”。国家民委随后发文说，在改革问题上“绝不能出现颠覆性错误”，民族区域自治是“党的民族政策的源头和根本”。
      cites: [i08-gov-2014-09-29-ethnic-work-conference, i08-neac-2014-12-autonomy]
    - h: 影响
      from: 2021
      text: 第三个历史决议写入“坚持把铸牢中华民族共同体意识作为党的民族工作主线”，同时仍写“党坚持和完善民族区域自治制度”。库内2022年至2025年的政府工作报告都有“坚持和完善民族区域自治制度”的表述，2026年的政府工作报告民族工作一段只写“以铸牢中华民族共同体意识为主线，积极促进各民族广泛交往交流交融”，未再出现这一制度名称。
      cites: [b04-gov-2021-11-16-resolution, i02-gov-2025-gwr, i02-gov-2026-gwr]
  voices:
    - voice: scholar
      text: 不断淡化公民的族群意识，不断淡化 56个民族的观念，不断强化中华民族的身份意识，不断增强公民的中华民族认同
      cite: i08-aisixiang-2011-hu-angang-ethnic
      quote: true
    - voice: scholar
      text: 所谓“去政治化”，就是“去制度化”，也就是“去民族区域自治化”，当然也就是“去民族政策化”
      cite: i08-tibetcn-2012-02-06-hao-shiyuan
      quote: true
    - voice: official
      text: 民族区域自治制度是我国的一项基本政治制度，是中国特色解决民族问题的正确道路的重要内容。
      cite: i08-gov-2014-09-29-ethnic-work-conference
      quote: true
    - voice: official
      text: 强调“我再次明确说一遍，取消民族区域自治制度这种说法可以休矣”
      cite: i08-neac-2014-12-autonomy
      quote: true
  cites:
