- id: guojin-mintui
  name: 国进民退之争
  en: “The State Advances, the Private Sector Retreats” Debate
  kind: debate
  by: [wu-jinglian, li-rongrong]
  first:
    date: 2009-10-26
    text: 吴敬琏公开提醒领导注意“国进民退”现象（库内所见最早出处）。
    cite: i08-cnfol-2009-10-26-wu-jinglian
    quote: 现在发生一种情况叫做‘国进民退’。我建议我们的领导要充分地注意，这不是一个好的情况。
  summary: 国进民退之争是2009年至2010年围绕国有经济是否借金融危机扩张、挤压民营经济的论争，2018年又再度兴起。2009年10月，吴敬琏说国有大企业“拿到了很多的贷款”，“这不是一个好的情况”；许小年称“‘国进民退’与改革开放背道而驰”，茅于轼说山西煤矿整合“现在看来是改革的倒退”，张维迎则主张“重新启动‘国退民进’改革”。官方否认这种说法：国资委主任李荣融2009年12月说“中国现在并没有出现‘国进民退’的现象”，国家统计局局长马建堂说“普查数据从总体上不支持‘国进民退’的说法”。新左派学者则以重庆的“国民共进”为例，主张国资增值与民营经济可以并进。2013年十八届三中全会决定重申两个“毫不动摇”。2018年民营企业界和学者再提“国进民退是事实”，随后引出“民营经济离场论”风波。
  quote:
    text: 我们的所有制结构不合理，国有部门比重太大，占有资源太多，这使得2009年发生了明显的‘国进民退’现象。我们的出路就是要重新启动‘国退民进’改革
    cite: i08-people-2010-03-22-zgjjzk-guojin
  terms: [国进民退, 国退民进]
  related: [private-economy-exit, socialist-market-economy, chongqing-vs-guangdong, liberals, new-left]
  sides:
    - label: 国进民退是倒退（吴敬琏、张维迎、许小年、茅于轼）
      text: 吴敬琏2009年10月公开说“国进民退”不是好现象，原因是“大企业、国有企业拿到了很多的贷款，他们手里面非常有钱”。《中国经济周刊》汇总的言论中，许小年称它“会制造社会不公平”，茅于轼批评山西煤矿整合，张维迎说“国有部门比重太大，占有资源太多”。
      who: [wu-jinglian, mao-yushi]
      cites: [i08-cnfol-2009-10-26-wu-jinglian, i08-people-2010-03-22-zgjjzk-guojin]
    - label: 并没有出现国进民退（国资委、国家统计局）
      text: 李荣融说，国企、民企“都在竞争中共同发展，而不是‘有我没有你，有你没有我’”，并欢迎民营和外资企业重组并购央企。马建堂说，第二次全国经济普查显示国有企业的比重是下降的，私营企业的比重是上升的。
      who: [li-rongrong, ma-jiantang]
      cites: [i08-sina-2009-12-11-li-rongrong, i08-chinanews-2009-12-25-census]
    - label: 国民共进，国资增值可以藏富于民（王绍光、崔之元）
      text: 崔之元说，“一般认为国资增值和藏富于民是对立的，但重庆开创了一些先例，使国资增值和藏富于民携手并进”。王绍光把重庆的“国民共进”看作“中国式社会主义3.0版本的经济基础”。
      who: [cui-zhiyuan, wang-shaoguang]
      cites: [i08-wen-cui-zhiyuan-chongqing, i08-aisixiang-2011-wang-shaoguang-chongqing]
  sections:
    - h: 起因
      from: 2008-11
      to: 2009-10
      text: 2008年底的四万亿刺激计划之后，银行贷款大量流向国有企业。吴敬琏说，因为一些特别的原因，“大企业、国有企业拿到了很多的贷款，他们手里面非常有钱”。山西煤炭资源整合重组中，大批民营煤矿被国有企业兼并，成为批评者常举的例子。
      cites: [i08-cnfol-2009-10-26-wu-jinglian, i08-people-2010-03-22-zgjjzk-guojin]
    - h: 经过
      from: 2009-09
      to: 2010-03
      text: 2009年9月许小年公开批评，11月茅于轼批评山西煤改，2010年1月张维迎在光华新年论坛上称2009年发生了“明显的‘国进民退’现象”。同时期新左派学者则肯定重庆“国资增值和藏富于民携手并进”的做法。2010年3月，《中国经济周刊》以《“国进民退”之争》为题汇总各方言论。
      cites: [i08-people-2010-03-22-zgjjzk-guojin, i08-wen-cui-zhiyuan-chongqing]
    - h: 官方如何收场
      from: 2009-12
      to: 2013-11
      text: 2009年12月，李荣融和马建堂先后否认存在“国进民退”。2013年十八届三中全会决定说“公有制经济和非公有制经济都是社会主义市场经济的重要组成部分”，既要“毫不动摇巩固和发展公有制经济”，也要“毫不动摇鼓励、支持、引导非公有制经济发展”。
      cites: [i08-sina-2009-12-11-li-rongrong, i08-chinanews-2009-12-25-census, e03-gov-2013-11-15-reform-decision]
    - h: 影响
      from: 2018
      text: 2018年民营企业经营困难，这个话题再度兴起。BBC 中文采访的独立学者吴伟说，“从胡锦涛时代的后期，开始出现国进民退，这种现象在近几年加剧”。同年9月吴小平的“私营经济离场”文章引发舆论风波，11月习近平在民营企业座谈会上表态，称民营企业和民营企业家“是我们自己人”。
      cites: [i03-bbc-2018-09-14-guojin-mintui, i08-xinhua-2018-11-01-xi-private-symposium]
  voices:
    - voice: zh
      text: 中国现在并没有出现‘国进民退’的现象。这是因为国企、民企都在竞争中共同发展，而不是说‘有我没有你，有你没有我’。
      cite: i08-sina-2009-12-11-li-rongrong
      quote: true
    - voice: official
      text: 所以普查数据从总体上不支持“国进民退”的说法。
      cite: i08-chinanews-2009-12-25-census
      quote: true
    - voice: zh
      text: 国有企业贷款利率很低，但民企很难拿到贷款，即使拿到，利率也高。国进民退是事实，这一迹象从十八大以后就开始显露了。
      cite: i03-bbc-2018-09-14-guojin-mintui
      quote: true
  cites:
    - i08-cnfol-2009-10-26-wu-jinglian
    - i08-people-2010-03-22-zgjjzk-guojin
    - i08-sina-2009-12-11-li-rongrong
    - i08-chinanews-2009-12-25-census
    - i08-wen-cui-zhiyuan-chongqing
    - i08-aisixiang-2011-wang-shaoguang-chongqing
    - e03-gov-2013-11-15-reform-decision
    - i03-bbc-2018-09-14-guojin-mintui

- id: chongqing-vs-guangdong
  name: 重庆模式与广东模式之争
  en: Chongqing Model vs. Guangdong Model
  kind: debate
  by: [bo-xilai, wang-yang]
  first:
    date: 2011
    text: 王绍光撰文把重庆经验概括为“中国式社会主义3.0”的探索（库内所见对“重庆经验”最系统的理论表述）。
    cite: i08-aisixiang-2011-wang-shaoguang-chongqing
    quote: 在“匮乏阶段”，中国发展出社会主义1.0；在“温饱阶段”，中国发展出社会主义2.0.进入了“小康阶段”以后，中国正在探索社会主义3.0.重庆是诸多探索中比较突出的一个案例。
  summary: 重庆模式与广东模式之争是薄熙来主政重庆、汪洋主政广东期间（2007—2012）围绕两种地方发展路线的论争。重庆以“唱红打黑”、公租房、国资“第三财政”等为标志，王绍光称之为探索“中国式社会主义3.0”，崔之元说重庆“使国资增值和藏富于民携手并进”。广东以“腾笼换鸟”和“幸福广东”为口号，汪洋2011年说“分蛋糕不是重点工作，做蛋糕是重点”，薄熙来则主张“要一边分好蛋糕，一边做大蛋糕”，两人的分歧被称为“蛋糕论”。自由派法学者贺卫方2011年写公开信批评重庆“打黑”有“时光倒流、文革重演之感”。2012年王立军事件后，温家宝在3月14日的记者会上说“现任重庆市委和市政府必须反思”，次日薄熙来被免去重庆市委书记，“重庆模式”随之失去官方支持。
  quote:
    text: 两人的分别是，薄熙来要更平均的分好蛋糕，达到公平公义，而汪洋认为只要将蛋糕做大，群众得到的好处就自然更多。
    cite: b05-rfi-2011-07-15-cake
  terms: [重庆模式, 广东模式, 重庆经验]
  related: [cake-debate, happy-guangdong, new-left, liberals, common-prosperity, guojin-mintui]
  sides:
    - label: 重庆经验是社会主义的新探索（王绍光、崔之元）
      text: 王绍光把重庆经验概括为“五个重庆”“两翼农户万元增收工程”“国民共进”“群众路线”，认为它们“不仅创造出中国式社会主义3.0的新要素，也包含着中国式社会主义2.0和1.0的宝贵遗产”。崔之元强调重庆用国资收益建公租房、大学城，是“间接的社会分红”。
      who: [wang-shaoguang, cui-zhiyuan, bo-xilai]
      cites: [i08-aisixiang-2011-wang-shaoguang-chongqing, i08-wen-cui-zhiyuan-chongqing]
    - label: 先做大做好蛋糕（汪洋、广东）
      text: 汪洋认为转型升级与建设幸福广东不能割裂，“同样是做蛋糕，过去强调的只是做大蛋糕，并没有考虑做好蛋糕”；如果只注意分蛋糕而不转型升级，“幸福广东就是无源之水、无本之木”。
      who: [wang-yang]
      cites: [i03-cntv-2011-01-21-wang-yang-cake, b05-rfi-2011-07-15-cake]
    - label: 重庆“打黑”破坏法治（贺卫方）
      text: 贺卫方在给重庆法律界的公开信中说，“打黑”中“我们看到了运动式执法和司法在轰轰烈烈地开展”，公检法“不分彼此、联合办案”，三机关相互制约的机制“完全失灵了”。
      who: [he-weifang]
      cites: [i08-zhblawyer-2011-04-12-he-weifang]
    - label: 重庆必须反思（温家宝、中央）
      text: 温家宝在2012年3月14日的记者会上说重庆历届政府“取得了明显的成绩”，但“现任重庆市委和市政府必须反思，并认真从王立军事件中吸取教训”；他同时警告，不推进政治体制改革，“‘文化大革命’这样的历史悲剧还有可能重新发生”。
      who: [wen-jiabao]
      cites: [b02-sina-2012-03-14-wen-presser]
  sections:
    - h: 起因
      from: 2007-12
      to: 2010
      text: 薄熙来2007年底主政重庆后推行“唱红打黑”和一系列民生工程。崔之元说2002—2008年重庆国有资产总值增加了4倍，国资增值部分作为“第三财政”投资大学城、大剧院，“全部投资不是来自一般意义上的税收”。同一时期汪洋在广东推动产业转型升级。
      cites: [i08-wen-cui-zhiyuan-chongqing]
    - h: 经过
      from: 2011-01
      to: 2011-07
      text: 2011年1月，汪洋用“蛋糕”比喻转型升级与幸福广东的关系；7月他说“分蛋糕不是重点工作，做蛋糕是重点，这点是有针对性的”，法广等媒体视之为与薄熙来的公开斗法。同年王绍光发表《探索中国式社会主义3.0：重庆经验》；4月贺卫方发表致重庆法律界公开信，称在重庆“令人恍然有时光倒流、文革重演之感，法治的理想正在沦丧”。
      cites: [i03-cntv-2011-01-21-wang-yang-cake, b05-rfi-2011-07-15-cake, i08-aisixiang-2011-wang-shaoguang-chongqing, i08-zhblawyer-2011-04-12-he-weifang]
    - h: 官方如何收场
      from: 2012-03-14
      to: 2012-03-15
      text: 王立军事件后，温家宝在2012年3月14日的记者会上要求重庆市委和市政府反思。3月15日新华社发布消息，张德江兼任重庆市委书记，“薄熙来同志不再兼任重庆市委书记、常委、委员职务”。
      cites: [b02-sina-2012-03-14-wen-presser, e02-xinhua-2012-03-15-chongqing-secretary]
    - h: 影响
      from: 2012
      text: BBC 中文的评论说，重庆模式得到许多民族主义“愤青”和“新老左派”的追捧，薄熙来倒台对这些人是“相当大的冲击”，为重庆提供理论论证的新左派学人也陷入尴尬。“分蛋糕”的问题此后并入官方的共同富裕话语。
      cites: [i02-bbc-2012-02-27-chongqing-trends]
  voices:
    - voice: scholar
      text: 重庆可以做到的事，其它绝大多数省份也一定能做到。
      cite: i08-aisixiang-2011-wang-shaoguang-chongqing
      quote: true
    - voice: official
      text: 如果一提‘建设幸福广东’都只注意分蛋糕，而不注意如何转型升级，那么‘十二五’规划不可能实现，幸福广东就是无源之水、无本之木
      cite: i03-cntv-2011-01-21-wang-yang-cake
      quote: true
    - voice: scholar
      text: 打黑固然必要，但治本之策却是健全政府依法行政和司法正义的相关制度。
      cite: i08-zhblawyer-2011-04-12-he-weifang
      quote: true
    - voice: official
      text: 多年来，重庆市历届政府和广大人民群众，为改革建设事业付出了很大的努力，也取得了明显的成绩。但是，现任重庆市委和市政府必须反思，并认真从王立军事件中吸取教训。
      cite: b02-sina-2012-03-14-wen-presser
      quote: true
  cites:
    - i08-aisixiang-2011-wang-shaoguang-chongqing
    - i08-wen-cui-zhiyuan-chongqing
    - i03-cntv-2011-01-21-wang-yang-cake
    - b05-rfi-2011-07-15-cake
    - i08-zhblawyer-2011-04-12-he-weifang
    - b02-sina-2012-03-14-wen-presser
    - e02-xinhua-2012-03-15-chongqing-secretary
