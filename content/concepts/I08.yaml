- id: china-model-debate
  name: 中国模式之争
  en: China Model Debate
  kind: debate
  by: [zhang-weiwei, qin-hui]
  summary: 中国模式之争是2008年前后围绕中国是否形成了可供他国借鉴的“中国模式”或“北京共识”的论争。张维为认为“中国模式主要有八个特点，即实践理性、强势政府、稳定优先、民生为大、渐进改革、顺序差异、混合经济、对外开放”，其背后是“文明型国家”，“不会走向崩溃，只会进一步完善后走向更大的辉煌”。秦晖认为中国的高增长既不能解释为“政府成功”，也不能解释为“市场成功”，“更与所谓‘市场政府双重成功’的‘北京共识’不相干”，中国的“优势”在于“低人权”，并说“中国的崛起和‘中国模式的崛起’完全是两回事”。李君如从官方理论角度说“从科学研究的角度讲，我并不赞成‘中国模式’这个提法”，理由是“讲‘模式’，有定型之嫌”。官方最终没有采用“中国模式”，而是用“中国道路”“中国方案”：十九大报告说中国特色社会主义“给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了全新选择”。
  quote:
    text: 中国的“优势”既不在于其市场更“自由”，也不在于其国家更“福利”，而就在于其更专制。
    cite: i08-aisixiang-qin-hui-low-human-rights
  terms: [中国模式, 北京共识]
  related: [four-confidences, chinese-modernization, statism, liberals, new-left, neo-authoritarianism]
  sides:
    - label: 中国模式是文明型国家的成功（张维为）
      text: 张维为说，比较其他转型国家，“中国的模式属于‘稳健型’，原苏联和东欧的模式属于‘激进型’”；中国模式“并非十全十美，但其总体的成功是采用西方模式的非西方国家所望尘莫及的”。
      who: [zhang-weiwei]
      cites: [i08-people-2014-09-23-zhang-weiwei]
    - label: 所谓中国模式靠的是“低人权优势”（秦晖）
      text: 秦晖说，中国“以‘低人权’的‘优势’人为压低四大要素（人力、土地、资金和非再生资源）价格”，形成罕见的竞争力；他反对“中国威胁论”，但认为“中国模式的崛起”如果意味着低人权优势风行世界，“那决不是什么好事”。
      who: [qin-hui]
      cites: [i08-aisixiang-qin-hui-low-human-rights, i08-aisixiang-qin-hui-china-model-rise]
    - label: 只讲中国特色，慎提中国模式（李君如）
      text: 李君如认为，体制“还没有完全定型，还在继续探索”，说已形成“中国模式”一会“自我满足，盲目乐观”，二会“转移改革的方向”，所以他“赞成‘中国特色’，而不赞成‘中国模式’”。
      who: []
      cites: [i08-aisixiang-2009-li-junru-china-model]
    - label: 中国道路提供了全新选择（十九大报告）
      text: 十九大报告说，中国特色社会主义道路、理论、制度、文化不断发展，“拓展了发展中国家走向现代化的途径”，“为解决人类问题贡献了中国智慧和中国方案”。
      who: [xi-jinping]
      cites: [i01-gov-2017-10-18-19th-report]
  sections:
    - h: 起因
      from: 2007
      to: 2009-12
      text: 秦晖概括当时对中国经济的三种主流认识：“虚假论”“崩溃论”和“北京共识”式的成功论，并认为三者“都有严重偏差”。李君如2009年12月在《学习时报》撰文说，“最近一个时期来，国际社会对‘中国模式’的议论越来越多，中国国内也有不少议论”。
      cites: [i08-aisixiang-qin-hui-low-human-rights, i08-aisixiang-2009-li-junru-china-model]
    - h: 经过
      from: 2009
      to: 2014-09
      text: 李君如主张慎提“中国模式”；秦晖2010年进一步区分“中国的崛起”与“中国模式的崛起”。张维为则先后出版《中国震撼》《中国超越》，《纽约时报》称他“担当了政治和经济发展‘中国模式’领域的一名理论领军人物”；2014年他在《红旗文稿》发表《我的中国观》，系统阐述中国模式的八个特点。
      cites: [i08-aisixiang-2009-li-junru-china-model, i08-aisixiang-qin-hui-china-model-rise, c05-nytcn-2015-06-15-zhang-weiwei, i08-people-2014-09-23-zhang-weiwei]
    - h: 官方如何收场
      from: 2017-10
      text: 官方文件没有采用“中国模式”一词。2017年十九大报告用“中国智慧和中国方案”表述中国经验的世界意义，称其为发展中国家走向现代化提供了“全新选择”。
      cites: [i01-gov-2017-10-18-19th-report]
    - h: 影响
      from: 2015
      text: 《纽约时报》报道，许多学者和官员私下说习近平读过张维为的《中国震撼》并向外宾推荐，张维为回答“我很高兴主席这么做了”。张维为一方的论述逐渐接近官方的“四个自信”话语，而秦晖等批评者的“低人权优势”说则留在体制外的讨论中。
      cites: [c05-nytcn-2015-06-15-zhang-weiwei]
  voices:
    - voice: scholar
      text: 中国模式形成于全世界范围内的激荡和竞争之中，不会走向崩溃，只会进一步完善后走向更大的辉煌。
      cite: i08-people-2014-09-23-zhang-weiwei
      quote: true
    - voice: scholar
      text: 所以，中国的崛起和“中国模式的崛起”完全是两回事。
      cite: i08-aisixiang-qin-hui-china-model-rise
      quote: true
    - voice: scholar
      text: 讲“模式”，有定型之嫌。这既不符合事实，也很危险。
      cite: i08-aisixiang-2009-li-junru-china-model
      quote: true
  cites:
    - i08-people-2014-09-23-zhang-weiwei
    - i08-aisixiang-qin-hui-low-human-rights
    - i08-aisixiang-qin-hui-china-model-rise
    - i08-aisixiang-2009-li-junru-china-model
    - i01-gov-2017-10-18-19th-report
    - c05-nytcn-2015-06-15-zhang-weiwei

- id: confucian-revival
  name: 儒家复兴与儒家宪政之争
  en: Confucian Revival and Confucian Constitutionalism
  kind: debate
  by: [jiang-qing]
  summary: 儒家复兴与儒家宪政之争是2000年代以后围绕儒家能否、应否成为中国政治方向的论争。蒋庆提出“政治儒学”，主张“中国政治的发展方向是王道而不是民主”，设计由“通儒院”“庶民院”“国体院”组成的议会三院制，分别代表超越神圣、人心民意、历史文化三重合法性，“法案必须三院同时通过才能颁行”。姚中秋（秋风）提出“儒家宪政”命题，主张在文明框架中构建宪制。台湾新儒家李明辉2015年批评“蒋庆他们所讲的政治儒学在我看来就是乌托邦”，并说所谓“大陆新儒家”是“一小撮人的自我标榜”；蒋庆回应说，政治儒学是“在政治上‘问理不问势’的儒学”，并非不能实现。官方对儒学取有限肯定：习近平2014年在纪念孔子诞辰2565周年会上说“中国共产党人不是历史虚无主义者，也不是文化虚无主义者”，要求传统文化“创造性转化、创新性发展”，但不能“厚古薄今、以古非今”。
  quote:
    text: 中国政治的发展方向是王道而不是民主，这是中国文化回应西方文化挑战的应有之义。
    cite: i08-rujiazg-jiang-qing-wangdao
  terms: [政治儒学, 王道政治, 儒家宪政, 大陆新儒家]
  related: [constitutionalism-debate, statism, new-left, liberals, xiaokang]
  sides:
    - label: 王道政治优于民主（蒋庆）
      text: 蒋庆认为近代以来“中国所有的政治思潮都把民主作为中国政治的发展方向”，连新儒家也不例外，这是“当今中国思想界的最大悲剧”。他说王道政治“是义理上优胜于民主政治的中国式政治”，“政治儒学”因此“不是狭隘的文化民族主义，而是建立在政治义理优胜上的普世主义”。
      who: [jiang-qing]
      cites: [i08-rujiazg-jiang-qing-wangdao, i08-thepaper-2015-04-07-jiang-qing-reply]
    - label: 儒家宪政，在文明框架中构建宪制（姚中秋）
      text: 姚中秋说，提出“儒家宪政”是呼吁“有一个宪政的文明自觉、有一个社会治理模式的文明自觉”，让宪制构建者“有意识地在文明框架中思考我们优良治理的路径”。
      who: []
      cites: [i03-rujiazg-2015-11-03-yao-zhongqiu]
    - label: 政治儒学是乌托邦（李明辉）
      text: 李明辉说，公羊家的那套讲法“在中国历史上从来没有实现过”，而张君劢、牟宗三所讲的政治儒学“至少在台湾已经落实到宪法的层面了，比蒋庆的乌托邦实际多了”。
      who: []
      cites: [i08-thepaper-2015-01-24-li-minghui]
    - label: 创造性转化，不以古非今（习近平）
      text: 习近平说，传统文化“不可避免会存在陈旧过时或已成为糟粕性的东西”，要“坚持古为今用、以古鉴今，坚持有鉴别的对待、有扬弃的继承”；同时说中国共产党人“始终是中国优秀传统文化的忠实继承者和弘扬者”，“小康”概念就出自《礼记·礼运》。
      who: [xi-jinping]
      cites: [i08-gov-2014-09-24-xi-confucius]
  sections:
    - h: 起因
      from: 2004
      to: 2012-07
      text: 蒋庆在《王道政治是当今中国政治的发展方向》中提出“三重合法性”和议会三院制，“通儒院”议长由大儒担任，“国体院”议长由孔府衍圣公世袭。2012年7月，他与贝淡宁在《纽约时报》合写《中国的儒学宪政》，美国之音报道说“蒋庆不承认民主政治是人类最完善最理想的政治”。
      cites: [i08-rujiazg-jiang-qing-wangdao, i03-voa-2012-07-13-jiang-qing]
    - h: 经过
      from: 2012
      to: 2015-11
      text: 美国之音的报道引述作家余樟法的质疑，说这种新制度“目前还只是、也只能是一个空想”。2015年1月李明辉接受澎湃新闻采访，否认“大陆新儒家”的说法；4月蒋庆撰文回应，以孔子倡王道、孟子倡仁政为例，说儒家“首先确立超越、形上、绝对、普遍的‘理’，然后坚定地持守之而不动摇”。同年姚中秋撰文阐述“儒家宪政”的用意。
      cites: [i03-voa-2012-07-13-jiang-qing, i08-thepaper-2015-01-24-li-minghui, i08-thepaper-2015-04-07-jiang-qing-reply, i03-rujiazg-2015-11-03-yao-zhongqiu]
    - h: 官方如何收场
      from: 2014-09-24
      text: 官方没有直接回应政治儒学，而是把儒学作为优秀传统文化的一部分加以肯定。习近平2014年9月24日在国际儒学联合会会员大会开幕会上说，“从孔夫子到孙中山，我们都注意汲取其中积极的养分”，同时强调马克思主义基本原理“必须同中国具体实际紧密结合起来”。
      cites: [i08-gov-2014-09-24-xi-confucius]
    - h: 影响
      from: 2015
      text: 儒学在官方话语中的地位上升，但蒋庆一方以王道取代民主、以三院制分权的政治设计没有进入官方议程。蒋庆自己承认，“当今中国‘问势’的历史条件尚未成熟”，政治儒学只能“明理”“立理”“守理”。
      cites: [i08-thepaper-2015-04-07-jiang-qing-reply, i08-gov-2014-09-24-xi-confucius]
  voices:
    - voice: scholar
      text: 三院中每一院都拥有实质性的权力，法案必须三院同时通过才能颁行，最高行政长官也必须由三院共同同意才能产生。
      cite: i08-rujiazg-jiang-qing-wangdao
      quote: true
    - voice: zh
      text: 现在所谓的“大陆新儒家”是主要以蒋庆为中心，包括陈明在内的一小撮人的自我标榜。
      cite: i08-thepaper-2015-01-24-li-minghui
      quote: true
    - voice: scholar
      text: 故我提出的“政治儒学”，就是这种在政治上“问理不问势”的儒学。
      cite: i08-thepaper-2015-04-07-jiang-qing-reply
      quote: true
    - voice: official
      text: 中国共产党人是马克思主义者，坚持马克思主义的科学学说，坚持和发展中国特色社会主义，但中国共产党人不是历史虚无主义者，也不是文化虚无主义者。
      cite: i08-gov-2014-09-24-xi-confucius
      quote: true
  cites:
    - i08-rujiazg-jiang-qing-wangdao
    - i08-thepaper-2015-04-07-jiang-qing-reply
    - i03-rujiazg-2015-11-03-yao-zhongqiu
    - i08-thepaper-2015-01-24-li-minghui
    - i08-gov-2014-09-24-xi-confucius
    - i03-voa-2012-07-13-jiang-qing

- id: democracy-good-thing
  name: “民主是个好东西”之争
  en: “Democracy Is a Good Thing” Debate
  kind: debate
  by: [yu-keping, pan-wei]
  first:
    date: 2006-10-23
    text: 俞可平的文章以《关于“民主是个好东西”的辨正》为题在《北京日报》刊出，后经中央党校《学习时报》等转载（库内所见最早出处）。
    cite: i08-sina-2007-02-14-yu-keping
    quote: 民主是人类迄今最好的政治制度
  summary: “民主是个好东西”之争是2006年以后围绕中国是否需要、需要什么样的选举民主的论争。中共中央编译局副局长俞可平2006年10月在《北京日报》发表文章，2007年初又经中央党校《学习时报》刊出，说“民主是人类迄今最好的政治制度”，但“不顾条件而推行民主，会给国家和人民带来灾难性的结果”，并强调“我们不照搬国外的政治模式”。北京大学潘维则批评“选举迷信”，说选举体现普世价值的说法是一件“皇帝的新衣”，“选举不治腐败，选举导致腐败”。张博树撰文反驳潘维，称“说民主只是权力争夺的手段和游戏，就谬之千里了”。官方后来以“全过程的民主”作答：习近平2019年11月在上海说“人民民主是一种全过程的民主”；2021年12月的《中国的民主》白皮书说“民主不是装饰品，不是用来做摆设的”，“民主是各国人民的权利，而不是少数国家的专利”。
  quote:
    text: 民主是个好东西，不是说民主什么都好。民主决不是十全十美的，它有许多内在的不足。
    cite: i08-sina-2007-02-14-yu-keping
  terms: [民主是个好东西, 选举民主]
  related: [whole-process-democracy, universal-values-debate, china-model-debate, liberals, new-left, neo-authoritarianism]
  sides:
    - label: 民主是好东西，但要有条件、不照搬（俞可平）
      text: 俞可平承认民主会使决策变慢、增大行政成本，甚至让“夸夸其谈的政治骗子有可乘之机”，但认为“就实施民主的成本与收益比较而言，民主的收益总是要大大高于民主的成本或代价”；同时说推行民主的时机、速度和方式“则是有条件的”。
      who: [yu-keping]
      cites: [i08-sina-2007-02-14-yu-keping]
    - label: 破除选举迷信（潘维）
      text: 潘维认为，以多数决为原则的选举“是个简单的选拔领导人的手段，毫不‘神圣’，方便易行而已”，并说候选人、选民、金主构成的“铁三角”使选举必然产生以权谋私，“选举中的腐败是靠法治来控制的”。
      who: [pan-wei]
      cites: [i08-aisixiang-pan-wei-election]
    - label: 选举民主对今日中国有意义（张博树）
      text: 张博树在反驳潘维的文章中说，“说分权制衡有助于根治腐败，我举双手赞成”，但不能把民主贬为权力争夺的游戏。
      who: []
      cites: [i08-aisixiang-zhang-boshu-pan-wei]
    - label: 全过程人民民主（中共中央、国务院新闻办）
      text: 白皮书说，判断一个国家民主不民主，“要看人民有没有投票权，更要看人民有没有广泛参与权”，“一个国家是不是民主，应该由这个国家的人民来评判，而不应该由外部少数人指手画脚来评判”。
      who: [xi-jinping]
      cites: [i08-gov-2021-12-04-democracy-white-paper, i01-jhsjk-2019-11-02-whole-process-democracy]
  sections:
    - h: 起因
      from: 2006-10-23
      to: 2007-02
      text: 据新浪转载时的编者按，俞可平的文章2006年10月23日由《北京日报》以《关于“民主是个好东西”的辨正》为题刊出，经人民网、新华网转载，后在中央党校《学习时报》刊出，“引起了国内外广泛关注”。文章引用胡锦涛的话说，“没有民主，就没有现代化”。
      cites: [i08-sina-2007-02-14-yu-keping]
    - h: 经过
      from: 2006
      to: 2008
      text: 潘维在《评选举迷信》中逐条反驳选举民主，称“腐败是选举中必然包含的内在逻辑，选举游戏制造腐败”。张博树撰写《民主选举对今日中国的意义：驳潘维》予以回应。
      cites: [i08-aisixiang-pan-wei-election, i08-aisixiang-zhang-boshu-pan-wei]
    - h: 官方如何收场
      from: 2019-11-02
      to: 2021-12-04
      text: 2019年11月2日，习近平在上海古北市民中心说，“我们走的是一条中国特色社会主义政治发展道路，人民民主是一种全过程的民主”。2021年12月4日，国务院新闻办发表《中国的民主》白皮书，称“实现民主有多种方式，不可能千篇一律”，“用单一的标尺衡量世界丰富多彩的政治制度”本身就是不民主的。
      cites: [i01-jhsjk-2019-11-02-whole-process-democracy, i08-gov-2021-12-04-democracy-white-paper]
    - h: 影响
      from: 2021
      text: 官方没有否定“民主”一词，而是把它重新定义为以参与、协商和结果为标准的“全过程人民民主”，并以此回应西方以选举为标准的民主评价。俞可平所说的“我们不照搬国外的政治模式”与白皮书的立场一致，但他把民主视为“人类社会的基本价值观”的说法，与白皮书强调各国自行评判的立场侧重不同。
      cites: [i08-sina-2007-02-14-yu-keping, i08-gov-2021-12-04-democracy-white-paper]
  voices:
    - voice: scholar
      text: 民主是个好东西，不是说民主是无条件的。实现民主需要具备相应的经济、文化和政治条件，不顾条件而推行民主，会给国家和人民带来灾难性的结果。
      cite: i08-sina-2007-02-14-yu-keping
      quote: true
    - voice: scholar
      text: 选举体现“普世价值”和“人民当家作主”？这件“皇帝的新衣”该被说破了。
      cite: i08-aisixiang-pan-wei-election
      quote: true
    - voice: scholar
      text: 说分权制衡有助于根治腐败，我举双手赞成；但说民主只是权力争夺的手段和游戏，就谬之千里了。
      cite: i08-aisixiang-zhang-boshu-pan-wei
      quote: true
    - voice: doc
      text: 民主不是装饰品，不是用来做摆设的，而是要用来解决人民需要解决的问题的。
      cite: i08-gov-2021-12-04-democracy-white-paper
      quote: true
  cites:
    - i08-sina-2007-02-14-yu-keping
    - i08-aisixiang-pan-wei-election
    - i08-aisixiang-zhang-boshu-pan-wei
    - i01-jhsjk-2019-11-02-whole-process-democracy
    - i08-gov-2021-12-04-democracy-white-paper

- id: private-economy-exit
  name: 民营经济“离场论”风波
  en: “Private Economy Should Exit” Controversy (2018)
  kind: debate
  by: [xi-jinping]
  first:
    date: 2018-09-12
    text: 自称“资深金融人士”的吴小平发表文章，主张私营经济“逐渐离场”，在网上引发争议。
    cite: i08-ifeng-2018-09-12-wu-xiaoping
    quote: 下一步，私营经济不宜继续盲目扩大
  summary: 民营经济“离场论”风波是2018年秋围绕私营经济是否已完成历史任务的争论。2018年9月，吴小平发表《中国私营经济已完成协助公有经济发展的任务，应逐渐离场》，认为私营经济的任务是“协助公有经济实现跨越式发展”，如今已初步完成，“下一步，私营经济不宜继续盲目扩大”，应让位于“更加集中、更加团结、更加规模化的公私混合制经济”。文章发表时正值民营企业经营困难，BBC 中文采访的企业家说“国进民退是事实”，学者吴伟称这是“一种历史性倒退”。吴小平对《新京报》说“我认为很多人是没有读懂的”。11月1日，习近平在民营企业座谈会上点名批评“民营经济离场论”“新公私合营论”等说法“是完全错误的”，称“民营企业和民营企业家是我们自己人”，民营经济“不仅不能‘离场’，而且要走向更加广阔的舞台”。2025年2月习近平再次出席民营企业座谈会，说对民营经济的方针政策“不能变，也不会变”。
  quote:
    text: 我国民营经济只能壮大、不能弱化，不仅不能“离场”，而且要走向更加广阔的舞台。
    cite: i08-xinhua-2018-11-01-xi-private-symposium
  terms: [民营经济离场论, 私营经济离场, 新公私合营论]
  related: [guojin-mintui, socialist-market-economy, common-prosperity, liberals, maoist-left]
  sides:
    - label: 私营经济应逐渐离场（吴小平）
      text: 吴小平认为，国际竞争“开始倒退向百年前的重商主义”，美国等西方国家开始围堵中国，此时“如果不能集中国家力量，完全让市场说话，彻底走经济自由化的道路”，改革开放将面临难以想象的压力。
      who: []
      cites: [i08-ifeng-2018-09-12-wu-xiaoping]
    - label: 国进民退已成事实，是历史性倒退（民营企业家、吴伟）
      text: 企业家王彬对 BBC 中文说，“很多行业的准入，只有国有企业可以”。吴伟说，党和政府的控制“已经深入到了几乎每一个领域和层次”，“我认为这是一种历史性倒退”，民企在相当一段时间内“会越来越艰难”。
      who: []
      cites: [i03-bbc-2018-09-14-guojin-mintui]
    - label: 民营企业家是“自己人”（习近平）
      text: 习近平说，“有的人说加强企业党建和工会工作是要对民营企业进行控制”，这些说法“不符合党的大政方针”；民营经济“是我国经济制度的内在要素”，也是党“长期执政”的重要力量。
      who: [xi-jinping]
      cites: [i08-xinhua-2018-11-01-xi-private-symposium]
  sections:
    - h: 起因
      from: 2018
      to: 2018-09
      text: 2018年民营企业融资难、市场准入受限的抱怨增多。BBC 中文采访的企业家说，“国有企业贷款利率很低，但民企很难拿到贷款”；吴伟认为国进民退“从胡锦涛时代的后期”开始，近几年加剧。
      cites: [i03-bbc-2018-09-14-guojin-mintui]
    - h: 经过
      from: 2018-09-12
      text: 9月12日，吴小平的文章在网上流传，《新京报》称“该文一出，舆论哗然”，网站上反对的声音占大多数。吴小平向记者确认文章是他写的，但说“如果你要解释太多的话，就会有更多值得探讨的内容”，拒绝进一步解释。
      cites: [i08-ifeng-2018-09-12-wu-xiaoping]
    - h: 官方如何收场
      from: 2018-11-01
      text: 11月1日民营企业座谈会上，习近平说，“一段时间以来，社会上有的人发表了一些否定、怀疑民营经济的言论”，点名“民营经济离场论”和“新公私合营论”，并说“基本经济制度是我们必须长期坚持的制度”。
      cites: [i08-xinhua-2018-11-01-xi-private-symposium]
    - h: 影响
      from: 2025-02-17
      text: 2025年2月17日习近平再次出席民营企业座谈会，任正非、王传福、雷军等民营企业负责人发言。习近平说，党和国家对民营经济的基本方针政策“已经纳入中国特色社会主义制度体系，将一以贯之坚持和落实，不能变，也不会变”。
      cites: [b14-gov-2025-02-17-private-symposium]
  voices:
    - voice: zh
      text: 现在社会反响比较大，我认为很多人是没有读懂的。
      cite: i08-ifeng-2018-09-12-wu-xiaoping
      quote: true
    - voice: zh
      text: 党和政府的控制深入到社会每一个细胞，我认为这是一种历史性倒退。
      cite: i03-bbc-2018-09-14-guojin-mintui
      quote: true
    - voice: official
      text: 有的人提出所谓“民营经济离场论”，说民营经济已经完成使命，要退出历史舞台
      cite: i08-xinhua-2018-11-01-xi-private-symposium
      quote: true
  cites:
    - i08-ifeng-2018-09-12-wu-xiaoping
    - i03-bbc-2018-09-14-guojin-mintui
    - i08-xinhua-2018-11-01-xi-private-symposium
    - b14-gov-2025-02-17-private-symposium

- id: neoliberalism-debate
  name: 新自由主义与第三次改革论争
  en: Neoliberalism and the Third Reform Debate (2004–2006)
  kind: debate
  by: [wu-jinglian]
  first:
    date: 2005-07-15
    text: 刘国光谈经济学教学和研究，批评西方经济学在中国取代马克思主义经济学的指导地位。
    cite: i08-xinfajia-2005-liu-guoguang
    quote: 在经济学的教学和研究中，西方经济学现在好像成为了主流
  summary: 新自由主义与第三次改革论争是2004年至2006年围绕市场化改革方向和“主流经济学家”的论争，被称为继1980年代初和1989—1992年之后的“第三次改革争论”。2004年8月，香港学者郎咸平指责格林柯尔董事长顾雏军在“国退民进”中侵吞国有资产，引发国企产权改革之争。2005年7月，中国社会科学院原副院长刘国光说，在经济学教学和研究中“西方经济学现在好像成为了主流”，“新自由主义经济学的核心理论是我们所不能接受的”。被批评的一方回应：吴敬琏说“主流经济学家到底惹谁了？凭什么说中国主流经济学家误导了中国改革”，张维迎说“在目前有关中国经济改革的争论中，情绪发泄多于理性思考，直觉判断压过逻辑分析”。周瑞金再以“皇甫平”之名发表《改革不可动摇》。2006年3月温家宝说“前进中尽管有困难，但不能停顿，倒退没有出路”；2007年十七大报告写入“停顿和倒退没有出路”。
  quote:
    text: 争论关键性的认知差异在于，一方认为问题是由于市场化改革所致，因此必须全面后转；而另一方认为，这是改革不彻底、不配套所致，因此必须加速推进改革，方向不能动摇
    cite: i08-reformdata-2006-03-16-third-debate
  terms: [新自由主义, 第三次改革争论, 主流经济学家]
  related: [socialism-or-capitalism, guojin-mintui, socialist-market-economy, document-9, new-left, liberals]
  sides:
    - label: 反对新自由主义主导改革（刘国光）
      text: 刘国光认为，现代西方经济学“基于资产阶级意识形态的理论前提与我们根本不同，所以整体上它不适合于社会主义的中国，不能成为中国经济学的主流、主导”；新自由主义的分析方法可以借鉴，但其核心理论不能接受。
      who: []
      cites: [i08-xinfajia-2005-liu-guoguang]
    - label: 问题在改革不彻底，不能归咎于主流经济学（吴敬琏、张维迎）
      text: 吴敬琏说，指责主流经济学家“扰乱了市场化的方向，造成了各种灾难”的判断“根本上是不对的”。张维迎认为，改革不是把财富从一部分人手中无偿转移给另一部分人，而是在承认既定利益的前提下“通过权利和财产关系的重新安排，调动大家的积极性，增加社会总财富，实现帕累托改进”。
      who: [wu-jinglian]
      cites: [i08-sina-2006-01-04-wu-jinglian, i08-eeo-2006-03-13-zhang-weiying]
    - label: 改革方向不能动摇（十七大报告）
      text: 十七大报告说，改革开放“不可能一帆风顺，也不可能一蹴而就”，但“方向和道路是完全正确的，成效和功绩不容否定，停顿和倒退没有出路”。
      who: [hu-jintao]
      cites: [b02-npc-2007-10-24-17th-report]
  sections:
    - h: 起因
      from: 2004-08-09
      to: 2005-07
      text: 2004年8月9日，郎咸平在复旦大学演讲《格林柯尔：在“国退民进”的盛宴中狂欢》，指责顾雏军侵吞国有资产；他主张停止管理层收购，认为“国企不进行产权改革也可以搞好”。人民网党史频道的回顾说，郎咸平以情绪化的语言诉诸大众，吸引了很多人的注意。2005年7月刘国光的谈话把矛头转向经济学教育和“主流经济学家”。
      cites: [e07-people-2014-05-04-langgu, i08-xinfajia-2005-liu-guoguang]
    - h: 经过
      from: 2004-08-28
      to: 2006-01
      text: 南方周末的回顾说，郎咸平演讲后不久的8月28日，张维迎在深圳座谈会上系统回应郎咸平，称“要善待为社会做出贡献的人”。刘国光2005年的谈话使争论从国企改制扩大到经济学和改革方向。2006年初吴敬琏对《第一财经日报》说“主流经济学家到底惹谁了”；周瑞金以“皇甫平”之名在《财经》发表《改革不可动摇》。
      cites: [i08-reformdata-2006-03-16-third-debate, i08-sina-2006-01-04-wu-jinglian]
    - h: 官方如何收场
      from: 2006-03-14
      to: 2007-10
      text: 2006年3月14日，温家宝在全国人大闭幕后的记者会开场白中说，要坚定不移地推进改革开放，“前进中尽管有困难，但不能停顿，倒退没有出路”。2007年10月十七大报告把“停顿和倒退没有出路”写入正式文件。
      cites: [i08-reformdata-2006-03-16-third-debate, b02-npc-2007-10-24-17th-report]
    - h: 影响
      from: 2013
      text: 2013年的9号文件把“热衷于市场化的‘新自由主义’”列为七大危险之一，新自由主义从此成为官方批判的对象；第三个历史决议则重申“停顿和倒退没有出路”。
      cites: [e03-nytcn-2013-08-20-document-9, b04-gov-2021-11-16-resolution]
  voices:
    - voice: scholar
      text: 在西方经济学当中曾经居于主流地位的新自由主义经济学，其研究市场经济一般问题的分析方法有不少也可以借鉴、学习，我们不能完全否定它，但是新自由主义经济学的核心理论是我们所不能接受的。
      cite: i08-xinfajia-2005-liu-guoguang
      quote: true
    - voice: zh
      text: 主流经济学家到底惹谁了？凭什么说中国主流经济学家误导了中国改革，扰乱了市场化的方向，造成了各种灾难？我认为这个判断根本上是不对的。
      cite: i08-sina-2006-01-04-wu-jinglian
      quote: true
    - voice: scholar
      text: 我们必须学会理性思考，因为仅靠情绪发泄不能解决我们面临的问题。
      cite: i08-eeo-2006-03-13-zhang-weiying
      quote: true
    - voice: doc
      text: 改革开放符合党心民心、顺应时代潮流，方向和道路是完全正确的，成效和功绩不容否定，停顿和倒退没有出路。
      cite: b02-npc-2007-10-24-17th-report
      quote: true
  cites:
    - i08-xinfajia-2005-liu-guoguang
    - i08-sina-2006-01-04-wu-jinglian
    - i08-eeo-2006-03-13-zhang-weiying
    - i08-reformdata-2006-03-16-third-debate
    - e07-people-2014-05-04-langgu
    - b02-npc-2007-10-24-17th-report

- id: gongzhi-debate
  name: “公知”之争
  en: “Public Intellectuals” (Gongzhi) Debate
  kind: debate
  by: [lu-wei]
  first:
    date: 2013-02-20
    text: 刘瑜与慕容雪村在《纽约时报》中文网对谈，讨论“公知”一词被污名化（库内所见最早出处）。
    cite: i08-nytcn-2013-02-20-liu-yu-murong
    quote: 这个词正在变成一个可笑、可怜甚至是骂人的词汇
  summary: “公知”之争是2010年代初以后围绕“公共知识分子”（简称“公知”）及其在网络舆论中角色的论争。微博兴起后，批评政府的知识分子和“大V”影响力上升；到2013年，“公知”在社交网络上成为贬义词，刘瑜说这个词“正在变成一个可笑、可怜甚至是骂人的词汇”。网络作家周小平2013年6月在《环球时报》撰文，说“眼见身边的人一个个逐渐被微博催眠”，“我们正在经历着这场东方文明对西方霸权的逆袭”。慕容雪村反驳说，批评体制、对公共事务发言的人“是这个社会不可缺少的力量”，“一个批评缺席的社会是不可想象的”。官方的回应是整顿网络大V、扶植“正能量”：2013年8月国家互联网信息办公室主任鲁炜与网络名人座谈，要求他们“积极发挥凝聚正能量作用”；2014年10月文艺工作座谈会上，习近平对周小平、花千芳说“希望你们创作更多具有正能量的作品”。许纪霖后来总结说，“公共知识分子不等同于‘公知’”，而微博的“140个字是说不清楚理由的”。
  quote:
    text: 公共知识分子，具有三个特征，一是面向公共发言，二是讨论公共问题，三是从公共利益出发思考问题。
    cite: i08-ecnu-xu-jilin-public-intellectual
  terms: [公知, 公共知识分子, 大V]
  related: [positive-energy, little-pink, liberals, great-firewall, industrial-party]
  sides:
    - label: 公知误导民众，要为民族正本清源（周小平）
      text: 周小平说，如果“我们这代人都被催眠了，只剩极少数人醒着的话，那么我们怎么守护得了身边的一切”，这个时代赋予的使命是“为我们这个饱受了百年污蔑的民族和国家正本清源”。
      who: []
      cites: [i08-people-2013-06-21-zhou-xiaoping]
    - label: 公知被污名化，社会需要批评者（刘瑜、慕容雪村）
      text: 慕容雪村说，公知被污名化后成了“一块攻击标签”，批评者的言论被一概斥为“典型的公知意见”，“似乎想造成这样一个效果：公知说的都是错的”。
      who: []
      cites: [i08-nytcn-2013-02-20-liu-yu-murong]
    - label: 公共知识分子不等于“公知”（许纪霖）
      text: 许纪霖认为“公知”是被污名化的说法，公共知识分子“可以持不同价值立场”；微博时代“拼的不是说理，而是谁说的更刺激、立场更坚定，这就不是知识分子的特长了”。
      who: [xu-jilin]
      cites: [i08-ecnu-xu-jilin-public-intellectual]
    - label: 网络名人应传播正能量（鲁炜、习近平）
      text: 鲁炜对网络名人提出六点希望，包括“自觉维护国家利益”“自觉传播社会主义先进文化”“带头遵守法律和道德规范”。习近平在文艺工作座谈会上特别勉励周小平、花千芳。
      who: [lu-wei, xi-jinping]
      cites: [b12-xinhua-2013-08-12-lu-wei-bigv, e08-thepaper-2014-10-15-arts-forum]
  sections:
    - h: 起因
      from: 2011
      to: 2013-02
      text: 许纪霖说，继公共知识分子、知道分子之后，“第三代在公共空间领风骚的是网络大V和意见领袖”，微博在2011年温州动车事件以后“占据了中国公共空间的主流位置”。2013年初，“你们全家都是公知”成了社交网络上的说法。
      cites: [i08-ecnu-xu-jilin-public-intellectual, i08-nytcn-2013-02-20-liu-yu-murong]
    - h: 经过
      from: 2013-06
      to: 2013-08
      text: 2013年6月，周小平的《请不要辜负这个时代》经《环球时报》刊发、人民网转载。8月，鲁炜在国家网信办与纪连海、潘石屹、薛蛮子、周小平等网络名人座谈，对他们提出六点希望。
      cites: [i08-people-2013-06-21-zhou-xiaoping, b12-xinhua-2013-08-12-lu-wei-bigv]
    - h: 官方如何收场
      from: 2014-10-15
      text: 2014年10月15日文艺工作座谈会结束时，习近平走到周小平、花千芳面前说“希望你们创作更多具有正能量的作品”，网络上的“正能量”写作者由此获得最高层背书。
      cites: [e08-thepaper-2014-10-15-arts-forum]
    - h: 影响
      from: 2016
      text: “公知”成为网络民族主义话语中的常用贬义标签，知识分子的公开言论空间收窄。2016年10月，发表左右两派学者文章的“共识网”无法访问，BBC 中文引述《南华早报》称，“中国的知识分子正在丢失可以公开发表言论的空间，因为当局正在收紧控制”。
      cites: [i02-bbc-2016-10-03-gongshi]
  voices:
    - voice: zh
      text: 眼见身边的人一个个逐渐被微博催眠、被杂志报纸和畅销书侵蚀，一个个渐渐滑向是非不明、黑白不分的深渊时，我不得不忧心忡忡。
      cite: i08-people-2013-06-21-zhou-xiaoping
      quote: true
    - voice: zh
      text: 其实在当下中国，批评体制、政府，对公共事务发言这群人，是这个社会不可缺少的力量。一个批评缺席的社会是不可想象的。
      cite: i08-nytcn-2013-02-20-liu-yu-murong
      quote: true
    - voice: scholar
      text: 微博的特点，它有字数限制，只有140个字，140个字是说不清楚理由的，只能有一个态度、一个立场。
      cite: i08-ecnu-xu-jilin-public-intellectual
      quote: true
    - voice: official
      text: 网络名人应自觉维护国家利益，积极发挥凝聚正能量作用，鼓舞更多网民为中华民族伟大复兴做出贡献。
      cite: b12-xinhua-2013-08-12-lu-wei-bigv
      quote: true
  cites:
    - i08-nytcn-2013-02-20-liu-yu-murong
    - i08-people-2013-06-21-zhou-xiaoping
    - i08-ecnu-xu-jilin-public-intellectual
    - b12-xinhua-2013-08-12-lu-wei-bigv
    - e08-thepaper-2014-10-15-arts-forum
    - i02-bbc-2016-10-03-gongshi

- id: involution-lying-flat
  name: “内卷”与“躺平”之争
  en: Involution and Lying Flat
  kind: debate
  by: [xi-jinping]
  first:
    date: 2020-10-22
    text: 人类学家项飙接受澎湃新闻采访，把“内卷”解释为一种不允许失败和退出的竞争（库内所见最早出处）。
    cite: i08-thepaper-2020-10-22-xiang-biao
    quote: 现在内卷的一个很重要的机制，就是没有退出的机制，不允许你退出
  summary: “内卷”与“躺平”之争是2020年至2021年围绕年轻人过度竞争与退出竞争的社会论争。2020年下半年“内卷”从高校学生中“出圈”，入选《咬文嚼字》年度十大流行语，指“非理性内部竞争”。项飙说内卷的机制是“没有退出的机制”，“成功者要失败者一定要承认自己是失败的”。2021年4月，网名“好心的旅行家”的骆华忠在百度贴吧发帖《躺平即是正义》，被称为“躺平学大师”；他对《纽约时报》说“一个好的社会是可上可下的”，“我们是不可能富的”。官方媒体随即批评：新华网刊文说“在压力面前选择‘躺平’不仅不正义，还是可耻的”，《光明日报》提醒警惕“未富先躺”。2021年10月，习近平在《求是》发表的《扎实推动共同富裕》中要求“防止社会阶层固化，畅通向上流动通道”，“避免‘内卷’、‘躺平’”。此后“内卷”一词进入经济政策，2025年和2026年的政府工作报告都要求整治“内卷式”竞争。
  quote:
    text: 要防止社会阶层固化，畅通向上流动通道，给更多人创造致富机会，形成人人参与的发展环境，避免“内卷”、“躺平”。
    cite: i08-gov-2021-10-15-common-prosperity
  terms: [内卷, 躺平, 内卷式竞争]
  related: [common-prosperity, positive-energy, family-planning-debate, little-pink]
  sides:
    - label: 躺平是对过度竞争的拒绝（骆华忠）
      text: 骆华忠说，“现在都是紧绷着神经，我就感觉这个世界为什么这么不美好”；对“年轻人要奋斗”的说教，他反问“奋斗有什么用？我得到什么？我的精神位置在哪里？”
      who: []
      cites: [i08-nytcn-2021-07-14-luo-huazhong]
    - label: 内卷是不许退出的竞争（项飙）
      text: 项飙说，要退出竞争、过自己的生活，“你面对的道德压力是非常大的”，失败者“一定要在道德上低头”；他主张建立退出机制，让学习不好的孩子“有别的好的出路”。BBC 中文引述他说，躺平是年轻人对内卷的反抗，“说明大家开始反思过去的发展模式”。
      who: []
      cites: [i08-thepaper-2020-10-22-xiang-biao, e04-bbc-2021-06-01-tangping]
    - label: 躺平可耻，青春要奋斗（新华网、党媒）
      text: 新华网刊发的王庆峰文章说，“奋斗本身就是一种幸福，只有奋斗的人生才称得上是幸福的人生”，批评年轻人“一遇到压力就喊‘内卷’，一遇到挫折就想‘躺平’”。
      who: []
      cites: [e04-xinhua-2021-05-20-tangping]
    - label: 畅通向上流动通道，避免内卷躺平（习近平）
      text: 习近平在《扎实推动共同富裕》中说，“幸福生活都是奋斗出来的，共同富裕要靠勤劳智慧来创造”，同时要求“为人民提高受教育程度、增强发展能力创造更加普惠公平的条件”。
      who: [xi-jinping]
      cites: [i08-gov-2021-10-15-common-prosperity]
  sections:
    - h: 起因
      from: 2020-09
      to: 2020-12-04
      text: 《咬文嚼字》的释义说，2020年下半年“边骑车边用电脑”的学生被称为“卷王”登上热搜，“内卷”随后从大学生群体中“出圈”，各行各业的非理性竞争都以“内卷”称之。12月4日“内卷”入选年度十大流行语。
      cites: [e04-xinhua-2020-12-04-buzzwords]
    - h: 经过
      from: 2021-04
      to: 2021-07
      text: 2021年4月，《躺平即是正义》在百度贴吧走红，“只要我躺得够快，资本就剥削不到我”之类的说法广为流传。5月新华网刊文批评“躺平”，《光明日报》《中国科学报》等也发文谴责。7月骆华忠接受《纽约时报》采访，说明自己的想法。
      cites: [e04-bbc-2021-06-01-tangping, e04-xinhua-2021-05-20-tangping, i08-nytcn-2021-07-14-luo-huazhong]
    - h: 官方如何收场
      from: 2021-08-17
      to: 2021-10-15
      text: 2021年8月中央财经委员会会议研究扎实促进共同富裕问题，10月《求是》发表习近平在这次会议上的讲话，把“避免‘内卷’、‘躺平’”与防止社会阶层固化并列，把年轻人的情绪归入共同富裕的政策议程。
      cites: [i01-xinhua-2021-08-17-common-prosperity, i08-gov-2021-10-15-common-prosperity]
    - h: 影响
      from: 2024
      text: “内卷”从网络流行语变成官方经济词汇。2025年政府工作报告要求“综合整治‘内卷式’竞争”，2026年政府工作报告说整治“内卷式”竞争“成效显现”，并要求“深入整治‘内卷式’竞争，营造良好市场生态”。
      cites: [i02-gov-2025-gwr, i02-gov-2026-gwr]
  voices:
    - voice: zh
      text: 一个好的社会是可上可下的，你不用跟我强调这些，我随便做点什么，我慢慢生活就行了
      cite: i08-nytcn-2021-07-14-luo-huazhong
      quote: true
    - voice: scholar
      text: 所以，成功者要失败者一定要承认自己是失败的。你不仅是在钱上少一点，物质生活上差一点，而且你一定要在道德上低头，一定要去承认你是没有什么用的，是失败的。
      cite: i08-thepaper-2020-10-22-xiang-biao
      quote: true
    - voice: official
      text: 在压力面前选择“躺平”不仅不正义，还是可耻的，这样的“毒鸡汤”没有任何价值。
      cite: e04-xinhua-2021-05-20-tangping
      quote: true
    - voice: zh
      text: 《光明日报》发文指出，“躺平族”对经济社会发展“有很多不利”，在中国经济发展面临人口老龄化等挑战的背景下，社会需要青年带来“创造性贡献”，而“未富先躺”的倾向需要引起警惕。
      cite: e04-bbc-2021-06-01-tangping
      quote: true
  cites:
    - i08-thepaper-2020-10-22-xiang-biao
    - i08-nytcn-2021-07-14-luo-huazhong
    - e04-bbc-2021-06-01-tangping
    - e04-xinhua-2021-05-20-tangping
    - e04-xinhua-2020-12-04-buzzwords
    - i08-gov-2021-10-15-common-prosperity
    - i02-gov-2025-gwr
    - i02-gov-2026-gwr
