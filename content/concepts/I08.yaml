# I08: debates (kind: debate) — each with 2–4 sides, every side cited to its own texts.

- id: socialism-or-capitalism
  name: 姓社姓资之争
  en: Socialist or Capitalist? Debate
  kind: debate
  by: [deng-xiaoping]
  first:
    date: 1991-03-02
    text: 上海《解放日报》署名“皇甫平”的评论《改革开放要有新思路》说，计划与市场只是资源配置手段，不是区分社会主义与资本主义的标志（库内所见最早出处）。
    cite: i08-hbu-1991-03-02-huangfu-ping
    quote: 计划和市场只是资源配置的两种手段和形式，而不是划分社会主义与资本主义的标志
  summary: 姓社姓资之争是1990年至1992年围绕改革开放是“姓社”还是“姓资”的论争。1991年春，上海《解放日报》连续刊出署名“皇甫平”的评论，说“计划和市场只是资源配置的两种手段和形式，而不是划分社会主义与资本主义的标志”，主张不要再被姓社姓资的诘难束缚。《当代思潮》《真理的追求》等刊物随即反驳，称“在不问姓社姓资的口号流行时”，私有化、多党制等思潮曾把改革开放拖上绝路。1992年初邓小平在南方谈话中说“要害是姓‘资’还是姓‘社’的问题”，提出以是否有利于发展生产力等三条为判断标准，并说“计划多一点还是市场多一点，不是社会主义与资本主义的本质区别”。同年十四大报告要求“不要被一些姓‘社’姓‘资’的抽象争论束缚自己的思想和手脚”，并把改革目标定为社会主义市场经济体制。
  quote:
    text: 计划多一点还是市场多一点，不是社会主义与资本主义的本质区别。计划经济不等于社会主义，资本主义也有计划；市场经济不等于资本主义，社会主义也有市场。
    cite: b22-reformdata-1992-01-18-southern-talks
  terms: [姓社姓资, 姓“社”姓“资”, 皇甫平]
  related: [socialist-market-economy, deng-theory, neoliberalism-debate, maoist-left, liberals]
  sides:
    - label: 不要囿于“姓社姓资”的诘难（皇甫平）
      text: 皇甫平文章认为，把计划经济等同于社会主义、把市场经济等同于资本主义是旧观念，要防止陷入“新的思想僵滞”，不能“一讲市场调节就以为是资本主义”。执笔者周瑞金后来解释，文章“丝毫没有提倡改革开放不要问‘姓社姓资’的意思，只是说不要对改革开放乱扣‘姓资’的帽子”。
      who: []
      cites: [i08-hbu-1991-03-02-huangfu-ping, i08-eeo-2018-06-12-zhou-ruijin]
    - label: 改革开放必须问“姓社姓资”（《当代思潮》等）
      text: 反对者认为，不问姓社姓资正是“自由化思潮”的口号。1991年4月《当代思潮》刊文《改革开放可以不问姓社姓资吗？》说，“在不问姓社姓资的排斥下，有人确实把改革开放引向了资本主义化的邪路”。这一方的原刊未见网络全文，库内只能依据后来的引述。
      who: []
      cites: [i08-reformdata-2010-07-30-xingshe-xingzi, i08-people-2014-05-04-three-debates-2]
    - label: 以“三个有利于”为标准（邓小平、十四大）
      text: 邓小平在南方谈话中说，判断的标准“应该主要看是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民的生活水平”，并称“特区姓‘社’不姓‘资’”。十四大报告据此提出建立社会主义市场经济体制。
      who: [deng-xiaoping]
      cites: [b22-reformdata-1992-01-18-southern-talks, i03-reformdata-1992-10-12-14th-report]
  sections:
    - h: 起因
      from: 1990
      to: 1991-01
      text: 1989年以后，报刊上关于姓“社”姓“资”的文章增多，人民网党史频道称这些文章“一时间闹得人心惶惶”。1990年7月的一次中央高层会议上，薛暮桥批驳“计划取向”的言论。邓小平在1990年底和1991年初两次谈话中说，“不要以为，一说计划经济就是社会主义，一说市场经济就是资本主义，不是那么回事”。
      cites: [i08-people-2014-05-04-three-debates-2]
    - h: 经过
      from: 1991-02
      to: 1991-12
      text: 1991年2月15日起，《解放日报》依据邓小平1991年初在上海的讲话，先后发表4篇署名“皇甫平”的评论。周瑞金回忆，3月22日的第三篇《扩大开放的意识要更强些》提出“如果我们仍然囿于‘姓社还是姓资’的诘难，那就只能坐失良机”，引起的轰动和责难最大。随后《当代思潮》《真理的追求》《高校理论战线》等刊物发文围攻，坚持改革开放必须区分姓“社”还是姓“资”。
      cites: [i08-eeo-2018-06-12-zhou-ruijin, i08-people-2014-05-04-three-debates-2, i08-reformdata-2010-07-30-xingshe-xingzi]
    - h: 官方如何收场
      from: 1992-01
      to: 1992-10
      text: 1992年1月至2月，邓小平南方谈话说改革开放迈不开步子，“说来说去就是怕资本主义的东西多了，走了资本主义道路”，并提出“三个有利于”标准。10月的十四大报告复述“计划经济不等于社会主义，资本主义也有计划”，要求“不要被一些姓‘社’姓‘资’的抽象争论束缚自己的思想和手脚”，正式确定建立社会主义市场经济体制的改革目标。
      cites: [b22-reformdata-1992-01-18-southern-talks, i03-reformdata-1992-10-12-14th-report]
    - h: 影响
      from: 1992
      text: 这场论争以确立社会主义市场经济告终，“三个有利于”成为此后为改革辩护的常用标准。2004年至2006年第三次改革论争中，周瑞金再以“皇甫平”之名在《财经》发表《改革不可动摇》。2013年宪政之争中，张千帆反驳“宪政姓资”论时也借用这一说法，称“宪政不仅没有‘姓社姓资’之分”。
      cites: [i08-reformdata-2006-03-16-third-debate, i08-rmlt-2013-09-11-zhang-qianfan]
  voices:
    - voice: doc
      text: 要害是姓“资”还是姓“社”的问题。判断的标准，应该主要看是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民的生活水平。
      cite: b22-reformdata-1992-01-18-southern-talks
      quote: true
    - voice: witness
      text: 当时我们深感，由两个“凡是”变成一个“凡事”（即凡事都要问一问“姓社姓资”），这是阻碍深化改革、扩大开放的一个要害问题。
      cite: i08-eeo-2018-06-12-zhou-ruijin
      quote: true
    - voice: history
      text: 在不问姓社姓资的口号流行时，主张经济上私有化、市场化，政治上多党制、议会制，意识形态上多元化的思潮，曾把社会主义改革开放事业拖上绝路。
      cite: i08-reformdata-2010-07-30-xingshe-xingzi
      quote: true
    - voice: history
      text: 各类报刊上关于姓“社”姓“资”争论的文章，一时间闹得人心惶惶。
      cite: i08-people-2014-05-04-three-debates-2
      quote: true
  cites:
    - i08-hbu-1991-03-02-huangfu-ping
    - i08-eeo-2018-06-12-zhou-ruijin
    - i08-reformdata-2010-07-30-xingshe-xingzi
    - i08-people-2014-05-04-three-debates-2
    - b22-reformdata-1992-01-18-southern-talks
    - i03-reformdata-1992-10-12-14th-report

- id: universal-values-debate
  name: 普世价值之争
  en: Universal Values Debate
  kind: debate
  by: [wen-jiabao]
  first:
    date: 2008-05-22
    text: 汶川地震后，《南方周末》社论称国家救灾是在兑现对普世价值的承诺，成为2008年论战的导火索（库内所见最早出处）。
    cite: i08-infzm-2008-05-22-wenchuan
    quote: 国家正以这样切实的行动，向自己的人民，向全世界兑现自己对于普世价值的承诺
  summary: 普世价值之争是2008年前后围绕自由、民主、人权等价值是否“普世”的论战。2007年2月温家宝撰文说，科学、民主、法制、自由、人权“并非资本主义所独有”。2008年5月汶川地震后，《南方周末》社论称国家正“向全世界兑现自己对于普世价值的承诺”。9月，《人民日报》刊出冯虞章文章，称“超历史、超阶级的‘普世价值’是不存在的”；11月，《求是》署名秋石的文章说三权分立、多党制、极端个人主义“并不是也不可能是普世的”，并批评有人借抗震救灾宣布中国“走到了拐点”。12月，《零八宪章》称自由、平等、人权是“人类共同的普世价值”。2013年流传的“七不讲”和9号文件都把宣扬“普世价值”列为意识形态危险。官方此后改用“全人类共同价值”的提法。
  quote:
    text: 自由、民主、人权、公平、正义、法治等是人类共同的追求，但三权分立、多党制、极端个人主义等并不是也不可能是普世的。
    cite: i08-chinanews-2008-11-17-qiushi-universal
  terms: [普世价值]
  related: [charter-08, document-9, liberals, constitutionalism-debate, community-shared-future, democracy-good-thing]
  sides:
    - label: 普世价值存在，中国应当认同（《南方周末》、《零八宪章》）
      text: 《南方周末》社论把汶川救灾中“以国民的生命危机为国家的最高危机”的做法，看作国家对普世价值的践行。《零八宪章》更进一步，说“自由、平等、人权是人类共同的普世价值；民主、共和、宪政是现代政治的基本制度架构”，并据此提出宪政改革主张。
      who: [liu-xiaobo]
      cites: [i08-infzm-2008-05-22-wenchuan, i02-rfa-2016-07-13-charter08-text]
    - label: 人类共同价值，实现形式各异（温家宝）
      text: 温家宝2007年的文章说，科学、民主、法制、自由、人权“是人类在漫长的历史进程中共同追求的价值观和共同创造的文明成果”，但“在不同的历史阶段、不同的国家，它的实现形式和途径各不相同，没有统一的模式”。
      who: [wen-jiabao]
      cites: [i08-gov-2007-02-26-wen-jiabao]
    - label: 没有超阶级的普世价值（冯虞章、《求是》）
      text: 冯虞章认为价值观与道德观一样具有历史性和阶级性，“从来就没有什么‘一般民主’、‘纯粹民主’、‘普世民主’”。秋石文章承认自由、民主等是人类共同追求，但说宣扬“普世价值”的人是在推销西式政治制度，“这样的观点，不是讨论学术问题，而是要求彻底西化”。
      who: []
      cites: [i08-npc-2008-09-10-feng-yuzhang, i08-chinanews-2008-11-17-qiushi-universal]
  sections:
    - h: 起因
      from: 2007-02
      to: 2008-05
      text: 2007年2月，温家宝在《人民日报》发表《关于社会主义初级阶段的历史任务和我国对外政策的几个问题》，说科学、民主、法制、自由、人权“并非资本主义所独有”。2008年5月汶川地震后，《南方周末》社论《汶川震痛，痛出一个新中国》称，国家以举国之力拯救普通国民的生命，是在“向全世界兑现自己对于普世价值的承诺”。
      cites: [i08-gov-2007-02-26-wen-jiabao, i08-infzm-2008-05-22-wenchuan]
    - h: 经过
      from: 2008-09
      to: 2008-12
      text: 2008年9月10日，《人民日报》刊出冯虞章《怎样认识所谓“普世价值”》，以恩格斯的道德观论证不存在“永恒道德”。11月，《求是》刊出秋石文章，批评有人“把在中国共产党坚强领导下发挥社会主义制度优越性取得的抗震救灾的伟大胜利，说成是实施‘普世价值’的结果”。12月，刘晓波等人发布《零八宪章》，以“普世价值”为纲领提出宪政主张。
      cites: [i08-npc-2008-09-10-feng-yuzhang, i08-chinanews-2008-11-17-qiushi-universal, i02-rfa-2016-07-13-charter08-text]
    - h: 官方如何收场
      from: 2013
      to: 2015-09
      text: 2013年5月网上流传的“七不讲”把普世价值列为高校不要讲的第一项；同年披露的9号文件把宣扬人权“普世价值”列为七大危险之一。2015年9月习近平在联合国大会上改用另一种说法：“和平、发展、公平、正义、民主、自由，是全人类的共同价值”。
      cites: [e03-bbc-2013-05-13-document-9, e03-nytcn-2013-08-20-document-9, i05-gov-2015-09-29-unga]
    - h: 影响
      from: 2008
      text: 这场论战使“普世价值”成为官方话语中的负面词。法广2024年的评论回顾说，在胡锦涛执政末期，“温家宝都能提普世价值，社会上关于实施宪政的说法很流行”，吴邦国随后提出“五不搞”。论战的焦点随后转到宪政之争和“民主是个好东西”的讨论上。
      cites: [b02-rfi-2024-10-08-wu-five-nos]
  voices:
    - voice: zh
      text: 以国民的生命危机为国家的最高危机，以国民的生命尊严为国家的最高尊严，以整个国家的力量去拯救一个一个具体的生命，一个一个普通国民的生命。
      cite: i08-infzm-2008-05-22-wenchuan
      quote: true
    - voice: official
      text: 科学、民主、法制、自由、人权，并非资本主义所独有，而是人类在漫长的历史进程中共同追求的价值观和共同创造的文明成果。
      cite: i08-gov-2007-02-26-wen-jiabao
      quote: true
    - voice: official
      text: 由此也可以得出结论，超历史、超阶级的“普世价值”是不存在的。
      cite: i08-npc-2008-09-10-feng-yuzhang
      quote: true
    - voice: official
      text: 宣扬“普世价值”并不是什么纯粹的学术问题，而是有着鲜明的政治目的。
      cite: i08-chinanews-2008-11-17-qiushi-universal
      quote: true
  cites:
    - i08-infzm-2008-05-22-wenchuan
    - i08-gov-2007-02-26-wen-jiabao
    - i08-npc-2008-09-10-feng-yuzhang
    - i08-chinanews-2008-11-17-qiushi-universal
    - i02-rfa-2016-07-13-charter08-text
    - e03-bbc-2013-05-13-document-9
    - e03-nytcn-2013-08-20-document-9
    - i05-gov-2015-09-29-unga

- id: constitutionalism-debate
  name: 宪政之争
  en: Constitutionalism Debate (2013)
  kind: debate
  by: [zhang-qianfan]
  first:
    date: 2013-05-22
    text: 《红旗文稿》刊出杨晓青文章，称宪政的关键元素只属于资本主义（库内所见这轮论战的起点）。
    cite: i08-people-2013-05-22-yang-xiaoqing
    quote: 宪政的关键性制度元素和理念只属于资本主义和资产阶级专政，而不属于社会主义人民民主制度
  summary: 宪政之争是2013年夏天围绕“宪政”是否“姓资”的论战。2013年5月，《红旗文稿》刊出中国人民大学杨晓青的文章，称“宪政的关键性制度元素和理念只属于资本主义和资产阶级专政”，并说依宪治国不是实行宪政。《党建》杂志郑志学随后撰文说，“‘宪政’主张指向非常明确，就是要在中国取消共产党的领导，颠覆社会主义政权”；8月《人民日报海外版》文章称在中国搞所谓宪政“只能是缘木求鱼”。另一方面，中国宪政网转载韩大元、李林等人的文章，说宪政“不是资产阶级的专利”；北京大学张千帆撰文说“宪政不仅没有‘姓社姓资’之分”，并援引习近平“宪法的生命在于实施”的说法。同年的9号文件把“西方宪政民主”列为七大危险之首。2014年十八届四中全会提出“坚持依法治国首先要坚持依宪治国”，以“依宪治国”取代“宪政”。
  quote:
    text: 所谓宪政，无非是落实宪法的这些规定并以此约束政府权力。就像法治是依法治国一样，宪政就是依宪治国、依宪执政。
    cite: i08-rmlt-2013-09-11-zhang-qianfan
  terms: [宪政, 社会主义宪政]
  related: [document-9, charter-08, universal-values-debate, rule-of-law, liberals, confucian-revival]
  sides:
    - label: 宪政姓资（杨晓青、郑志学、马钟成）
      text: 杨晓青认为，宪政作为西方政治的基本制度架构，“而不属于社会主义人民民主制度”。郑志学说宪政主张的目的是取消共产党的领导。马钟成在《人民日报海外版》撰文，称流行的“宪政”概念“本质上是一种信息心理战武器”，“社会主义宪政”理论“有更大的迷惑性”。
      who: []
      cites: [i08-people-2013-05-22-yang-xiaoqing, i08-people-2013-05-29-zheng-zhixue, i08-people-2013-08-07-ma-zhongcheng]
    - label: 宪政无姓社姓资，就是落实宪法（张千帆、中国宪政网学者）
      text: 张千帆说，“淡化宪政，只会导致宪法虚无主义，使执政党长期执政丧失合法根基”。中国社会科学院法学所李林在中国宪政网上发表的文章说，宪政与民主、自由、人权等词语一样“不是资产阶级的专利，而是人类政治文明的共同财富”。
      who: [zhang-qianfan]
      cites: [i08-rmlt-2013-09-11-zhang-qianfan, i03-bbc-2013-05-23-scholars-constitutionalism]
    - label: 依宪治国、依宪执政，而不提宪政（中共中央）
      text: 十八届四中全会决定说，“坚持依法治国首先要坚持依宪治国，坚持依法执政首先要坚持依宪执政”。二十大报告在同一句话后加上“坚持宪法确定的中国共产党领导地位不动摇”，官方文件一直没有采用“宪政”一词。
      who: [xi-jinping]
      cites: [e03-gov-2014-10-28-rule-of-law, i01-gov-2022-10-16-20th-report]
  sections:
    - h: 起因
      from: 2012-12
      to: 2013-05
      text: 张千帆回顾说，2012年12月4日习近平在现行宪法公布30周年大会上强调“宪法的生命在于实施，宪法的权威在于实施”，被呼吁宪政的人视为“迄今为止呼吁宪政的最强音”。2013年5月，《红旗文稿》刊出杨晓青《宪政与人民民主制度之比较研究》，BBC 中文报道说，文章特别强调“依宪治国不是实行宪政”。
      cites: [i08-rmlt-2013-09-11-zhang-qianfan, i03-bbc-2013-05-21-constitutionalism]
    - h: 经过
      from: 2013-05
      to: 2013-09
      text: 5月下旬，《党建》刊出郑志学《认清“宪政”的本质》。中国人民大学的中国宪政网则重发韩大元《略论社会主义宪政的正当性》和李林的文章予以反驳。8月，《人民日报海外版》刊文称“搞所谓的宪政，则只能是缘木求鱼”。9月，张千帆在人民论坛网发表《捍卫社会主义宪法的权威与生命》，称“今年5月以来，反宪政言论甚嚣尘上”，宪政一时成了“敏感词”。
      cites: [i08-people-2013-05-29-zheng-zhixue, i03-bbc-2013-05-23-scholars-constitutionalism, i08-people-2013-08-07-ma-zhongcheng, i08-rmlt-2013-09-11-zhang-qianfan]
    - h: 官方如何收场
      from: 2013
      to: 2014-10
      text: 《纽约时报》披露，2013年的9号文件列出的七大危险“以‘西方宪政民主’为首”。2014年10月十八届四中全会决定提出健全宪法实施和监督制度，用“依宪治国”“依宪执政”的说法回应对宪法实施的诉求，同时不再给“宪政”留下空间。
      cites: [e03-nytcn-2013-08-20-document-9, e03-gov-2014-10-28-rule-of-law]
    - h: 影响
      from: 2014
      text: 此后“宪政”在官方话语中基本消失，而“依宪治国”写进了此后的党代会报告。2021年的第三个历史决议也写入“坚持依法治国首先要坚持依宪治国，坚持依法执政首先要坚持依宪执政”。
      cites: [b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report]
  voices:
    - voice: official
      text: “宪政”主张指向非常明确，就是要在中国取消共产党的领导，颠覆社会主义政权。
      cite: i08-people-2013-05-29-zheng-zhixue
      quote: true
    - voice: scholar
      text: 一时间，宪政成了“敏感词”，成为继“市场经济”、“法治”、“人权”之后的观念“禁区”。
      cite: i08-rmlt-2013-09-11-zhang-qianfan
      quote: true
    - voice: official
      text: 相对于资本主义，社会主义社会还是一个新生儿。只要将中国共产党建设成一个真正的为人民服务的政党，保障人民根本利益的社会主义宪法和法律就能得到彻底的贯彻和实施。
      cite: i08-people-2013-08-07-ma-zhongcheng
      quote: true
    - voice: zh
      text: 宪政与民主、自由、平等、宪法、人权、共和等词语一样，不是资产阶级的专利，而是人类政治文明的共同财富，是社会主义的应有之义。
      cite: i03-bbc-2013-05-23-scholars-constitutionalism
      quote: true
  cites:
    - i08-people-2013-05-22-yang-xiaoqing
    - i08-people-2013-05-29-zheng-zhixue
    - i08-people-2013-08-07-ma-zhongcheng
    - i08-rmlt-2013-09-11-zhang-qianfan
    - i03-bbc-2013-05-21-constitutionalism
    - i03-bbc-2013-05-23-scholars-constitutionalism
