- id: happy-guangdong
  name: 幸福广东
  en: Happy Guangdong
  kind: formula
  by: [wang-yang]
  first:
    date: 2011-01-06
    text: 汪洋在中共广东省委十届八次全会上提出，广东“十二五”的核心是加快转型升级、建设“幸福广东”。
    cite: i03-chinanews-2011-01-06-happy-guangdong
    quote: 落实到广东“十二五”的发展，核心就是要加快转型升级，建设“幸福广东”
  codified:
    - date: 2012-05-09
      where: 广东省第十一次党代会报告
      cite: b05-gd-2012-05-09-wang-yang-report
      quote: 坚持改革开放，加快转型升级，建设幸福广东，从严管党治党，是这一总体要求的核心内容
  summary: “幸福广东”是汪洋主政广东时的施政口号。2011年1月他在省委十届八次全会上提出，广东“十二五”的核心是加快转型升级、建设“幸福广东”，称转型升级是手段、“幸福广东”是目标，并提醒不要先造成“不幸福”再去追求“幸福”。此后广东编制了幸福广东指标体系。2012年省第十一次党代会报告把它列为今后五年总体要求的核心内容之一，并提出要破除“人民幸福是党和政府恩赐”的错误认识。汪洋还用“蛋糕”比喻它与转型升级的关系，由此引出与重庆薄熙来的“蛋糕论”分歧；自由亚洲电台评论说，口号提出后并没有看到政策上的突破。
  quote:
    text: 汪洋表示，对广东来说，转型升级是手段，“幸福广东”是目标。
    cite: i03-chinanews-2011-01-06-happy-guangdong
  terms: [幸福广东]
  related: [cake-debate, scientific-development, harmonious-society]
  voices:
    - voice: official
      text: 如果一提‘建设幸福广东’都只注意分蛋糕，而不注意如何转型升级，那么‘十二五’规划不可能实现，幸福广东就是无源之水、无本之木
      cite: i03-cntv-2011-01-21-wang-yang-cake
      quote: true
    - voice: doc
      text: 我们必须破除人民幸福是党和政府恩赐的错误认识，切实维护并发挥好人民群众建设幸福广东的主动性和创造性。
      cite: b05-gd-2012-05-09-wang-yang-report
      quote: true
    - voice: zh
      text: 汪洋在广东提出以“建设幸福广东”作为广东省十二五计划的核心，但究竟如何提升人民的幸福感，却并没有看到他在政策上有什么突破。
      cite: i03-rfa-2011-06-29-wang-bo
      quote: true
  cites:
    - i03-chinanews-2011-01-06-happy-guangdong
    - i03-cntv-2011-01-21-wang-yang-cake
    - b05-gd-2012-05-09-wang-yang-report
    - i03-rfa-2011-06-29-wang-bo

- id: one-country-two-systems
  name: 一国两制
  en: One Country, Two Systems
  kind: formula
  parent: deng-theory
  by: [deng-xiaoping]
  first:
    date: 1984-06-22
    text: 邓小平会见香港工商界访京团和钟士元等人时系统阐述“一个国家，两种制度”（收入《邓小平文选》第三卷）。这是库内所见最早的原文；谈话本身说这一政策此前已讲过多次并经全国人大通过，更早的出处待考。
    cite: i03-locpg-1984-06-22-deng-octs
    quote: 我们的政策是实行“一个国家，两种制度”，具体说，就是在中华人民共和国内，十亿人口的大陆实行社会主义制度，香港、台湾实行资本主义制度
  codified:
    - date: 1982-12-04
      where: 宪法第三十一条（1982年宪法，引现行文本）
      cite: i01-gov-2018-03-11-constitution
      quote: 国家在必要时得设立特别行政区。在特别行政区内实行的制度按照具体情况由全国人民代表大会以法律规定。
    - date: 1992-10-12
      where: 十四大报告
      cite: i03-reformdata-1992-10-12-14th-report
      quote: 在祖国统一的问题上，提出“一个国家、两种制度”的创造性构想
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 邓小平同志创造性提出“一个国家，两种制度”科学构想，开辟了以和平方式实现祖国统一的新途径
  summary: “一国两制”是邓小平为解决香港、澳门和台湾问题提出的方针：在一个中国之内，大陆实行社会主义，港澳台保持资本主义制度。1982年宪法第三十一条为设立特别行政区留下依据；1984年6月邓小平会见香港访京团时系统阐述，承诺香港现行社会经济制度和生活方式不变、“五十年不变”，并提出以爱国者为主体的“港人治港”。此后香港、澳门先后回归。香港局势动荡之后，中央强调对特别行政区的“全面管治权”和“爱国者治港”，制定香港国安法并修改香港选举制度，第三个历史决议称香港实现了“由乱到治的重大转折”。对台湾，习近平2019年提出探索“两制”台湾方案。批评者如香港民主党创党主席李柱铭认为，“一国两制”已被外界视为走样。
  quote:
    text: “一国两制”是中国特色社会主义的伟大创举，是香港、澳门回归后保持长期繁荣稳定的最佳制度安排，必须长期坚持。
    cite: i01-gov-2022-10-16-20th-report
  terms: [一国两制, 一个国家，两种制度]
  related: [deng-theory, rule-of-law, holistic-security]
  voices:
    - voice: doc
      text: 港人治港有个界线和标准，就是必须由以爱国者为主体的港人来治理香港。
      cite: i03-locpg-1984-06-22-deng-octs
      quote: true
    - voice: doc
      text: 落实中央对特别行政区全面管治权，坚定落实“爱国者治港”、“爱国者治澳”
      cite: b04-gov-2021-11-16-resolution
      quote: true
    - voice: doc
      text: 第二，探索“两制”台湾方案，丰富和平统一实践。
      cite: e03-gov-2019-01-02-taiwan-speech
      quote: true
    - voice: zh
      text: 提出香港的高度自治权的限度在于中央如何授予，引发香港民众不安。
      cite: c05-bbc-2022-11-10-bao-tong
      quote: true
    - voice: zh
      text: 事至今天，“一国两制”被外界认为走向“一国一点多制”，但李柱铭仍然坚信当天的理念，香港可以带领国家走向民主。
      cite: c04-bbc-2020-05-martin-lee
      quote: true
  cites:
    - i03-locpg-1984-06-22-deng-octs
    - i01-gov-2018-03-11-constitution
    - i03-reformdata-1992-10-12-14th-report
    - b04-gov-2021-11-16-resolution
    - i01-gov-2022-10-16-20th-report
