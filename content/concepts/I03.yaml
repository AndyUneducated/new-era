- id: wolf-warrior
  name: 战狼外交
  en: Wolf Warrior Diplomacy
  kind: formula
  by: [wang-yi, qin-gang]
  first:
    date: 2017
    text: 吴京自导自演的电影《战狼2》2017年7月27日上映，“战狼”一词由此被借用来形容中国外交官的强硬风格；BBC 中文称这类外交词汇出现在2017年。
    cite: i03-bbc-2020-05-13-wolf-warrior
    quote: “战狼式”的外交词汇出现在2017年
  summary: “战狼外交”是外界对中国外交官主动对抗、言辞激烈的风格的称呼，名字来自2017年上映的电影《战狼2》。BBC 中文2020年报道说，新冠疫情期间外交部发言人赵立坚和多名驻外使节在推特上的强硬言论，被许多西方学者和观察家称为“战狼”外交；美国之音则说这个词约在2019年浮出水面。中方一再拒绝这个标签：王毅2020年答记者问时说中国人“有原则、有骨气”，对蓄意中伤一定有力回击；外交部副部长乐玉成称它是“中国威胁论”的又一翻版；秦刚2023年称之为“话语陷阱”。外界普遍把王毅视为战狼外交的主要实践者，秦刚任发言人时也曾被称为“战狼”。
  quote:
    text: 其实，所谓“战狼外交”就是一个话语陷阱，制造这个话语陷阱的人，要么不懂中国和中国外交，要么无视事实，别有用心
    cite: b08-mfa-2023-03-07-qin-presser
  terms: [战狼外交]
  related: [taoguang-yanghui, peaceful-rise, little-pink, community-shared-future]
  voices:
    - voice: zh
      text: 与中国传统外交官的谨慎、保守相比，这些外交官倾向于主动展现对抗风格，并且多使用社交媒体Twitter发表言论，很多西方学者和观察家称之为“战狼”外交。
      cite: i03-bbc-2020-05-13-wolf-warrior
      quote: true
    - voice: zh
      text: 战狼外交一词约在2019年浮出水面。那时，战狼外交的代表人物之一，中国外交部发言人赵立坚利用推特抨击外国批评中国的声音。
      cite: i03-voa-2021-03-27-wolf-warrior
      quote: true
    - voice: doc
      text: 我们从来不会主动欺凌别人，但同时，中国人是有原则、有骨气的。对于蓄意的中伤，我们一定会作出有力回击，坚决捍卫国家的荣誉和民族尊严。
      cite: i03-fmprc-2020-05-24-wang-yi-presser
      quote: true
    - voice: official
      text: 显而易见，“战狼外交”实际上是“中国威胁论”的又一翻版，又一个“话语陷阱”，目的就是要让我们打不还手，骂不还口，放弃抗争。
      cite: i03-fmprc-2020-12-05-le-yucheng
      quote: true
    - voice: zh
      text: 中国战狼外交的特点仍很明显。我看不出有任何变化，现在只是由秦刚来扮演温和派角色，而王毅则会继续坚持强硬立场。
      cite: b09-dw-2023-01-wolf-warrior
      quote: true
    - voice: zh
      text: 王毅因此被外界视为战狼外交的主要实践者。
      cite: b09-abc-2023-07-25-wang-yi
      quote: true
  cites:
    - i03-bbc-2020-05-13-wolf-warrior
    - i03-bbc-2017-08-wolf-warrior-2
    - i03-voa-2021-03-27-wolf-warrior
    - i03-fmprc-2020-05-24-wang-yi-presser
    - i03-fmprc-2020-12-05-le-yucheng
    - b08-mfa-2023-03-07-qin-presser
    - b08-bbc-2023-07-25-qin-gang
    - b09-dw-2023-01-wolf-warrior
    - b09-abc-2023-07-25-wang-yi

- id: qishang-baxia
  name: 七上八下
  en: Seven Up, Eight Down (the 67/68 age rule)
  kind: formula
  by: [jiang-zemin]
  first:
    date: 2002-11
    text: 十六大换届时，中央委员会和政治局成员的年龄线由上届的70岁提前到68岁，BBC 中文当时的点评称之为“六十八一刀切”。
    cite: i03-bbc-2002-11-age-limit
    quote: 年齡邊界由上一屆的70歲提前到68歲
  summary: “七上八下”指中共高层换届时满67岁可以留任或晋升、满68岁则退下的不成文惯例，党章和公开文件中都没有这条规定。据中央社和时评作者高新的说法，它形成于2002年十六大：1997年十五大先以70岁为线让乔石退下，十六大再把线降到68岁，让当年正好68岁的李瑞环退休；两者对它是江泽民一人设计还是江胡共商说法不一。2016年六中全会文件起草组成员邓茂生对境外记者说它只是“民间说法”。2017年王岐山届龄卸任，被视为惯例依然有效；2022年二十大习近平本人超龄连任，69岁的王毅进入政治局，未满68岁的李克强、汪洋却退出中央委员会，联合早报因此说这一惯例“已经不再成立”。
  quote:
    text: “七上八下”为中共长久以来的潜规则，指67岁以下留任、68岁以上离任
    cite: f01-dw-2022-10-24-xi-jiajun
  terms: [七上八下]
  related: [core]
  voices:
    - voice: zh
      text: 於是江又設計出一個「67歲繼續幹、68歲下台」的潛規則，讓當年正好68歲的李瑞環乖乖下台。
      cite: i03-cna-2017-09-25-unwritten-rules
      quote: true
    - voice: zh
      text: 当然不是一项有红头文件向下传达的“明文规定”，而是在当年讨论十六大人事换届时由江泽民和胡锦涛共商出的“原则上掌握”的“入局”和“入常”（包括继任）的年龄限制。
      cite: i03-rfa-2018-02-09-gaoxin-age-limit
      quote: true
    - voice: zh
      text: 中共十八届六中全会文件起草组成员邓茂生暗示，明年满68岁的中共政治局常委不是非得退下，所谓“七上八下”只是“民间说法”，“不足为信”。
      cite: i03-zaobao-2016-11-01-deng-maosheng
      quote: true
    - voice: zh
      text: 早前外传王岐山可能打破政治局常委“七上八下”（67岁留任、68岁退休）的不成文年龄限制留任，他的卸任表明这个非正式政治规定依然有效。
      cite: b04-zaobao-2017-10-25-wang-exit
      quote: true
    - voice: zh
      text: 王毅进入政治局，也再次凸显中共高层多年来不成文的“七上八下”（67岁留任，68岁退休）换届惯例，已经不再成立。
      cite: b09-zaobao-2022-10-23-wang-yi-pb
      quote: true
    - voice: zh
      text: 但事实上除了习近平本人，也只有军方代表张又侠和外交界代表王毅两人是“例外”
      cite: b09-rfa-2023-05-26-age-rule
      quote: true
  cites:
    - i03-bbc-2002-11-age-limit
    - i03-cna-2017-09-25-unwritten-rules
    - i03-rfa-2018-02-09-gaoxin-age-limit
    - i03-zaobao-2016-11-01-deng-maosheng
    - i03-rfa-2016-11-01-qishang-baxia
    - b04-zaobao-2017-10-25-wang-exit
    - b09-zaobao-2022-10-23-wang-yi-pb
    - f01-dw-2022-10-24-xi-jiajun
    - b09-rfa-2023-05-26-age-rule
    - b06-bbc-2022-10-23-psc

- id: cake-debate
  name: 蛋糕论（分蛋糕与做蛋糕）
  en: Cake Debate
  kind: formula
  by: [wang-yang, bo-xilai]
  first:
    date: 2010-03-05
    text: 温家宝在政府工作报告中用“蛋糕”比喻发展与分配，要求既做大又分好（库内所见最早出处）。
    cite: i02-gov-2010-gwr
    quote: 我们不仅要通过发展经济，把社会财富这个“蛋糕”做大，也要通过合理的收入分配制度把“蛋糕”分好
  summary: “蛋糕论”指2011年广东省委书记汪洋与重庆市委书记薄熙来围绕先“做蛋糕”还是先“分蛋糕”的公开分歧。2010年温家宝的政府工作报告已提出既要把“蛋糕”做大、也要分好。2011年初汪洋用蛋糕比喻转型升级与建设幸福广东的关系；7月11日他在广东省委十届九次会议上说分蛋糕不是重点，“重点还是要把蛋糕做大”，并说“这点是有针对性的”。薄熙来则在重庆主张“要一边分好蛋糕，一边做大蛋糕”，不必等到发展的高级阶段再谈分配与共同富裕。法广和 BBC 中文都把它看作两人在十八大前的公开斗法；澳大利亚国立大学的《中国故事年鉴》称，这是中共领导人第一次借媒体公开争论不同的区域发展路线。
  quote:
    text: 分蛋糕不是重点工作，做蛋糕是重点，这点是有针对性的。这不是新话，但是在这个时候强调它就有新意
    cite: b05-rfi-2011-07-15-cake
  terms: [做蛋糕, 分蛋糕]
  related: [happy-guangdong, common-prosperity, scientific-development]
  voices:
    - voice: zh
      text: 两人的分别是，薄熙来要更平均的分好蛋糕，达到公平公义，而汪洋认为只要将蛋糕做大，群众得到的好处就自然更多。
      cite: b05-rfi-2011-07-15-cake
      quote: true
    - voice: zh
      text: 汪薄二人发展理念以及政治归属上的分歧，再一次明显地暴露在公众面前。
      cite: b05-bbc-2011-08-23-cake
      quote: true
    - voice: official
      text: 同样是做蛋糕，过去强调的只是做大蛋糕，并没有考虑做好蛋糕。现在讲转型升级，就是要以较小的社会成本去做质量高的蛋糕
      cite: i03-cntv-2011-01-21-wang-yang-cake
      quote: true
    - voice: scholar
      text: In 2011, the symbolic politics of the two places inspired what was dubbed the ‘cake debate’. It was the first time Communist Party leaders used the media to air contesting visions of regional development.
      zh: 2011年，两地的象征政治引出了所谓的“蛋糕之争”。这是中共领导人第一次借媒体公开争论不同的区域发展路线。
      cite: b05-chinastory-2012-cake
      quote: true
  cites:
    - i02-gov-2010-gwr
    - i03-cntv-2011-01-21-wang-yang-cake
    - b05-rfi-2011-07-15-cake
    - b05-bbc-2011-08-23-cake
    - b05-chinastory-2012-cake

- id: neo-authoritarianism
  name: 新权威主义
  en: Neo-authoritarianism
  kind: trend
  by: [wang-huning]
  first:
    date: 1986
    text: 据吴稼祥回忆，新权威主义思潮1986年前后首先在上海兴起，当年复旦讲师王沪宁写文章论述现代化过程中的政治集权作用。
    cite: i03-aisixiang-wu-jiaxiang-neo-authority
    quote: 就我所了解的情况看，新权威主义思潮首先兴起于上海
  summary: 新权威主义是1980年代后期中国知识界的一种主张：后发国家推进现代化和市场化时，需要强有力的政治权威维持秩序、推动改革，民主化要放在后面。吴稼祥回忆，这股思潮1986年起首先在上海兴起，王沪宁论述现代化中的政治集权作用，萧功秦提出“过渡权威论”；1989年1月《世界经济导报》刊出吴稼祥的《新权威主义述评》，引发公开论战。赵紫阳晚年对杨继绳说，他1988年向邓小平介绍过这种主张，邓答“我就是这个主张。但是不必用这个提法”；吴稼祥则把这次谈话记为1989年3月6日。萧功秦2013年称习近平是“中国新权威主义的2.0版本”，BBC 中文也报道许多学者把习近平集权看作新权威主义的表现。
  quote:
    text: 当时的中央主要领导向他汇报思想界流行的新权威主义思潮，他斩钉截铁地说，“我就是这个主张。”
    cite: i03-aisixiang-wu-jiaxiang-neo-authority
  terms: [新权威主义]
  related: [statism, new-left, liberals, deng-theory]
  voices:
    - voice: witness
      text: 1988年有一次我去小平那里。……我说有一种新权威主义，就是政治强人稳定形势发展经济。他说：”我就是这个主张。但是不必用这个提法。”
      cite: i03-ipkmedia-zhao-ziyang-yang-jisheng
      quote: true
    - voice: zh
      text: 紫阳对于“新权威主义”的提法，虽然没有明确地表示赞成或反对，但认为还是“有道理”的。
      cite: i03-nytcn-2019-10-16-zhao-conversation
      quote: true
    - voice: west
      text: In the nineteen-eighties, Wang helped devise what became known as the theory of “neo-authoritarianism”, the idea that developing countries like China needed a heavy-handed state to guide their market reforms.
      zh: 1980年代，王沪宁参与构建了后来所称的“新权威主义”理论，即像中国这样的发展中国家需要一个强势国家来引导市场改革。
      cite: b05-newyorker-wang-huning
      quote: true
    - voice: scholar
      text: 如果邓小平是中国新权威主义的1.0版本，习近平就是中国新权威主义的2.0版本
      cite: i03-aisixiang-2013-xiao-gongqin
      quote: true
    - voice: zh
      text: 绝大部分观察家都能从1980年代末中国改革开放关键时期的赵紫阳时代的新权威主义模式和习近平目前的做法中找到许多共同之处
      cite: i03-bbc-2014-03-18-xi-power
      quote: true
  cites:
    - i03-aisixiang-wu-jiaxiang-neo-authority
    - i03-ipkmedia-zhao-ziyang-yang-jisheng
    - i03-nytcn-2019-10-16-zhao-conversation
    - b05-newyorker-wang-huning
    - b05-lrb-2023-wang-huning
    - i03-aisixiang-2013-xiao-gongqin
    - i03-bbc-2014-03-18-xi-power

