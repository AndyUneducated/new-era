    - c05-bbc-2022-11-10-bao-tong
    - c04-bbc-2020-05-martin-lee

- id: socialist-market-economy
  name: 社会主义市场经济
  en: Socialist Market Economy
  kind: formula
  parent: deng-theory
  by: [deng-xiaoping, jiang-zemin]
  first:
    date: 1992-10-12
    text: 江泽民在十四大报告中明确经济体制改革的目标是建立社会主义市场经济体制（库内所见最早出处），报告援引了邓小平当年初南方谈话关于计划与市场的论断。
    cite: i03-reformdata-1992-10-12-14th-report
    quote: 实践的发展和认识的深化，要求我们明确提出，我国经济体制改革的目标是建立社会主义市场经济体制，以利于进一步解放和发展生产力
  codified:
    - date: 1993-03
      where: 宪法修正案（八届全国人大一次会议）
      cite: e01-gov-2021-06-28-cpc-100y
      quote: 国家实行社会主义市场经济
    - date: 1993-11-14
      where: 十四届三中全会《关于建立社会主义市场经济体制若干问题的决定》
      cite: e01-gov-2021-06-28-cpc-100y
      quote: 建立社会主义市场经济体制，就是要使市场在国家宏观调控下对资源配置起基础性作用
    - date: 2013-11-12
      where: 十八届三中全会《中共中央关于全面深化改革若干重大问题的决定》
      cite: e03-gov-2013-11-15-reform-decision
      quote: 使市场在资源配置中起决定性作用和更好发挥政府作用
    - date: 2024-07-18
      where: 二十届三中全会决定
      cite: i01-gov-2024-07-18-third-plenum-decision
      quote: 构建高水平社会主义市场经济体制
  summary: 社会主义市场经济是中共对改革后经济体制的定性：在公有制为主体、国家宏观调控的前提下由市场配置资源。1992年初邓小平南方谈话说“计划和市场都是经济手段”，同年10月江泽民在十四大报告中把建立社会主义市场经济体制定为经济体制改革的目标，要使市场“在社会主义国家宏观调控下对资源配置起基础性作用”。1993年3月写入宪法（“国家实行社会主义市场经济”），11月十四届三中全会勾画体制框架。2013年十八届三中全会把市场的作用从“基础性”改为“决定性”，同时要“更好发挥政府作用”；2024年二十届三中全会提出构建“高水平社会主义市场经济体制”。经济学家吴敬琏2013年说，只有推进市场化改革并加快民主化、法治化，增长模式转型才有可能实现。
  quote:
    text: 我们要建立的社会主义市场经济体制，就是要使市场在社会主义国家宏观调控下对资源配置起基础性作用
    cite: i03-reformdata-1992-10-12-14th-report
  terms: [社会主义市场经济]
  related: [deng-theory, supply-side, common-prosperity, new-quality-productive-forces]
  voices:
    - voice: doc
      text: 计划经济不等于社会主义，资本主义也有计划；市场经济不等于资本主义，社会主义也有市场。计划和市场都是经济手段。
      cite: i03-reformdata-1992-10-12-14th-report
      quote: true
    - voice: doc
      text: 市场决定资源配置是市场经济的一般规律，健全社会主义市场经济体制必须遵循这条规律，着力解决市场体系不完善、政府干预过多和监管不到位问题。
      cite: e03-gov-2013-11-15-reform-decision
      quote: true
    - voice: zh
      text: 只有进一步推进市场化的经济体制改革和加快民主化、法治化的进程，经济增长模式转型才有可能实现，舍此绝无他途。
      cite: c05-nytcn-2013-11-09-wu-jinglian
      quote: true
  cites:
    - i03-reformdata-1992-10-12-14th-report
    - e01-gov-2021-06-28-cpc-100y
    - i01-gov-2018-03-11-constitution
    - e03-gov-2013-11-15-reform-decision
    - i01-gov-2024-07-18-third-plenum-decision
    - c05-nytcn-2013-11-09-wu-jinglian

- id: honor-disgrace
  name: 八荣八耻
  en: Eight Honors and Eight Disgraces
  kind: formula
  parent: scientific-development
  by: [hu-jintao]
  first:
    date: 2006-03-04
    text: 胡锦涛参加全国政协十届四次会议民盟、民进联组讨论时提出社会主义荣辱观，即“八荣八耻”。
    cite: i03-sina-2006-03-05-honor-disgrace
    quote: 要引导广大干部群众特别是青少年树立社会主义荣辱观，坚持以热爱祖国为荣、以危害祖国为耻……以艰苦奋斗为荣、以骄奢淫逸为耻
  codified:
    - date: 2007-10-21
      where: 党章（十七大修正案）
      cite: i01-gov-2007-10-21-17th-charter-resolution
      quote: 倡导社会主义荣辱观
    - date: 2022-10-22
      where: 党章（二十大修正案，现行）
      cite: i01-12371-2022-10-22-party-charter
      quote: 培育和践行社会主义核心价值观，倡导社会主义荣辱观
  summary: “八荣八耻”是胡锦涛2006年3月4日在全国政协会议民盟、民进联组讨论时提出的社会主义荣辱观，用八组荣耻对举的句子列出道德标准，从热爱祖国、服务人民到艰苦奋斗。同年5月中央精神文明建设指导委员会发文要求深入学习实践；8月胡锦涛把“树立社会主义荣辱观”列为十六大以来的重大战略思想之一。2007年十七大写入党章，现行党章仍写“倡导社会主义荣辱观”。2012年十八大报告一面要求党员干部“模范践行社会主义荣辱观”，一面提出“社会主义核心价值观”，现行党章把两者并列。美国之音引述学者陈奎德的话，批评它与官员贪腐的现实严重脱节。
  quote:
    text: 引导广大干部群众特别是青少年树立以“八荣八耻”为主要内容的社会主义荣辱观
    cite: e01-cpc-dsj-2006
  terms: [八荣八耻, 社会主义荣辱观]
  related: [harmonious-society, scientific-development]
  voices:
    - voice: doc
      text: 用社会主义荣辱观引领风尚
      cite: b02-npc-2007-10-24-17th-report
      quote: true
    - voice: zh
      text: 陈奎德认为，从毛泽东时代提出的“毫不利己，专门利人”，到胡锦涛的八荣八耻，都是口是心非的高调。中共干部带头搞贪污腐化让胡锦涛提出的所谓社会主义荣辱观显得极为虚伪。
      cite: i03-voa-2006-03-30-honor-disgrace
      quote: true
  cites:
    - i03-sina-2006-03-05-honor-disgrace
    - e01-cpc-dsj-2006
    - b02-npc-2007-10-24-17th-report
    - i01-gov-2007-10-21-17th-charter-resolution
    - i01-wsyu-2012-11-08-18th-report
    - i01-12371-2022-10-22-party-charter
    - i03-voa-2006-03-30-honor-disgrace

- id: harmonious-world
  name: 和谐世界
  en: Harmonious World
  kind: formula
  parent: scientific-development
  by: [hu-jintao]
  first:
    date: 2005-04-22
    text: 胡锦涛在雅加达亚非峰会上讲话，提出推动不同文明“共同构建一个和谐世界”。
    cite: i03-chinanews-2005-04-22-hu-asia-africa
    quote: 推动不同文明友好相处、平等对话、发展繁荣，共同构建一个和谐世界
  summary: “和谐世界”是胡锦涛时期的外交口号，与对内的“和谐社会”相对应。2005年4月胡锦涛在雅加达亚非峰会上首次提出“共同构建一个和谐世界”，同年9月在联合国成立60周年首脑会议上以《努力建设持久和平、共同繁荣的和谐世界》为题系统阐述，强调尊重文明多样性和各国自主选择发展道路。2006年中央外事工作会议把它写入外事工作目标，胡锦涛并把它列为十六大以来的重大战略思想之一；2007年十七大报告提出“推动建设持久和平、共同繁荣的和谐世界”，2012年十八大报告仍沿用。十九大、二十大报告和现行党章都不再出现这个词，外交主轴换成了人类命运共同体；詹姆斯敦基金会2014年的分析把它列为习近平外交论述中沿用的胡锦涛时期概念。
  quote:
    text: 只有世界所有国家紧密团结起来，共同把握机遇、应对挑战，才能为人类社会发展创造光明的未来，才能真正建设一个持久和平、共同繁荣的和谐世界
    cite: i03-mfa-2005-09-15-hu-un
  terms: [和谐世界]
  related: [harmonious-society, peaceful-rise, community-shared-future, taoguang-yanghui]
  voices:
    - voice: doc
      text: 第三，坚持包容精神，共建和谐世界。文明多样性是人类社会的基本特征，也是人类文明进步的重要动力。
      cite: i03-mfa-2005-09-15-hu-un
      quote: true
    - voice: doc
      text: 我们主张，各国人民携手努力，推动建设持久和平、共同繁荣的和谐世界。
      cite: b02-npc-2007-10-24-17th-report
      quote: true
    - voice: scholar
      text: Also included are building a “harmonious world” and achieving “win-win progress,” concepts introduced by Xi’s predecessor Hu Jintao.
      zh: 其中还包括建设“和谐世界”和实现“共赢发展”，这些都是习近平的前任胡锦涛提出的概念。
      cite: i03-jamestown-2014-major-country-diplomacy
      quote: true
  cites:
    - i03-chinanews-2005-04-22-hu-asia-africa
    - i03-mfa-2005-09-15-hu-un
    - e01-cpc-dsj-2006
    - b02-npc-2007-10-24-17th-report
    - i01-wsyu-2012-11-08-18th-report
    - i03-jamestown-2014-major-country-diplomacy

- id: yingshou-jinshou
  name: 应收尽收
  en: Round Up Everyone Who Should Be Rounded Up
  kind: formula
  by: [chen-quanguo]
  first:
    date: 2002-03-05
    text: 政府工作报告用于税收征管，要求依法治税“做到应收尽收”（库内所见最早出处）。
    cite: i02-gov-2002-gwr
    quote: 严格依法治税，做到应收尽收，堵塞“跑、冒、滴、漏”
  summary: “应收尽收”原是财税用语，2002年起的政府工作报告多次要求税收征管“做到应收尽收”。2017年起它出现在新疆的内部文件中：《纽约时报》2019年11月披露的403页内部文件显示，2016年8月上任的新疆党委书记陈全国要求官员“应收尽收”，用于收押被认为有宗教极端或反政府“症状”的人；时报指出这个说法过去用于征税和粮食收成，现在被用到人身上。外交部发言人耿爽指责时报用“断章取义”的手法炒作所谓内部文件，但没有质疑文件的真实性。2020年初武汉新冠疫情期间，“应收尽收、应治尽治”又成为收治病人的口号。
  quote:
    text: 陈全国发布了一条影响广泛的命令：“应收尽收”。这个模糊说法自2017年开始，不断出现在内部文件中。
    cite: b09-nyt-2019-11-16-xinjiang-papers
  terms: [应收尽收]
  related: [stability-maintenance, holistic-security, dynamic-zero]
  voices:
    - voice: west
      text: 'The party had previously used the phrase — “ying shou jin shou” in Chinese — when demanding that officials be vigilant and comprehensive in collecting taxes or measuring harvests. Now it was being applied to humans in directives that ordered, with no mention of judicial procedures, the detention of anyone who displayed “symptoms” of religious radicalism or antigovernment views.'
      zh: 中共过去在要求官员警惕、全面地征税或统计收成时用过这个说法。如今，它被用在针对人的指令中：这些指令只字不提司法程序，下令拘押任何显示出宗教极端或反政府“症状”的人。
      cite: i03-nyt-2019-11-16-absolutely-no-mercy
      quote: true
    - voice: official
      text: 《纽约时报》不仅对上述事实闭目塞听，甚至用移花接木、断章取义的拙劣手法炒作所谓“内部文件”，诬蔑抹黑中国新疆的反恐和去极端化努力，其居心何在？
      cite: i03-mfa-2019-11-18-geng-shuang
      quote: true
    - voice: zh
      text: 中国外交部发言人耿爽批评了时报周日发表的长篇报道，称其是污蔑抹黑中国打击极端主义的努力。但他没有对泄露出来的403页内部文件的真实性提出质疑。
      cite: i03-nytcn-2019-11-19-china-responds
      quote: true
    - voice: official
      text: 她强调，要坚定不移落实应收尽收，加快增设床位并提高收治能力，宁可让床等人，也不要让人等床。
      cite: b11-gov-2020-02-11-sun-wuhan
      quote: true
  cites:
    - i02-gov-2002-gwr
    - i02-gov-2010-gwr
    - b09-nyt-2019-11-16-xinjiang-papers
    - i03-nyt-2019-11-16-absolutely-no-mercy
    - i03-mfa-2019-11-18-geng-shuang
    - i03-nytcn-2019-11-19-china-responds
    - b11-people-2020-02-07-sun-wartime
    - b11-gov-2020-02-11-sun-wuhan
