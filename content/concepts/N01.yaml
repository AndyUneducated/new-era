# ---------------- internet and propaganda ----------------
- id: great-firewall
  name: 防火长城
  en: Great Firewall
  kind: formula
  by: [li-changchun]
  first:
    date: 1997-06
    text: 澳大利亚学者白杰明（Geremie Barmé）和桑晔1997年6月在《连线》杂志发表《The Great Firewall of China》，通常被认为是这个名字的出处；文中说官方叫“防火墙”，民间叫“网关”。
    cite: n01-wired-1997-06-great-firewall
    quote: The Great Firewall of China
  summary: “防火长城”（Great Firewall，GFW）是外界和中国网民对中国国家级互联网过滤系统的称呼，借长城比喻阻隔境外网站。名字出自1997年白杰明和桑晔在《连线》杂志的文章；官方从不使用这个名字。北京邮电大学前校长方滨兴被视为它的主要设计者，被网民称为“防火墙之父”。他2011年对《环球时报》说，世界上约180个国家都监控互联网，又承认防火墙常因技术局限把含敏感词的网站整个屏蔽。《卫报》称李长春是“防火长城”背后的人。翻墙一直被按1996年的规定，以“擅自建立、使用非法定信道国际联网”为由处罚；2017年工信部清理无资质的VPN，称在中国经营这类业务须申请许可。没有任何法律或党的文件使用这个名字。
  quote:
    text: The computer cordon sanitaire that Chinese authorities are trying to build around China is called the fanghuo qiang, or "firewall," a direct translation from English.
    cite: n01-wired-1997-06-great-firewall
  terms: [防火长城, 防火墙, 翻墙]
  related: [stability-maintenance, holistic-security, positive-energy]
  voices:
    - voice: west
      text: Under construction since last year, what's officially known as the "firewall" is designed to keep Chinese cyberspace free of pollutants of all sorts
      zh: 这道官方所称的“防火墙”去年开始修建，目的是让中国网络空间不受各种污染。
      cite: n01-wired-1997-06-great-firewall
      quote: true
    - voice: official
      text: As far as I know, about 180 countries including South Korea and the US monitor the Internet as well.
      zh: 据我所知，包括韩国和美国在内约180个国家也在监控互联网。（方滨兴）
      cite: n01-chinaorg-2011-02-18-fang-binxing
      quote: true
    - voice: official
      text: So far, the GFW is lagging behind and still needs improvement
      zh: 到目前为止，防火长城还落后一步，仍需改进。（方滨兴）
      cite: n01-chinaorg-2011-02-18-fang-binxing
      quote: true
    - voice: zh
      text: 中國互聯網「長城防火牆」設計者、被稱為「中國防火牆之父」的方濱興承認，曾翻越防火牆去訪問被他屏蔽的網站。
      cite: n01-bbc-2011-02-18-fang-binxing
      quote: true
    - voice: official
      text: 在中国经营相关业务应该按照中国的法律法规来进行申请许可，这实际上在全世界很多国家都是这样做的。
      cite: n01-cnr-2017-07-25-miit-vpn
      quote: true
    - voice: zh
      text: 官方给出的所有处罚原因均为“擅自建立、使用非法定信道国际联网”，这条于1996年实施的暂行规定如今已成为惩戒翻墙行为的万能依据。
      cite: e09-cdt-space-fanqiang
      quote: true
    - voice: west
      text: the man behind the "great firewall of China"
      zh: “中国防火长城”背后的人（指李长春）
      cite: b03-guardian-2010-12-05-li-google
      quote: true
  cites:
    - n01-wired-1997-06-great-firewall
    - b03-guardian-2010-12-05-li-google
    - n01-chinaorg-2011-02-18-fang-binxing
    - n01-bbc-2011-02-18-fang-binxing
    - e09-cdt-space-fanqiang
    - n01-cnr-2017-07-25-miit-vpn

- id: positive-energy
  name: 正能量
  en: Positive Energy
  kind: formula
  by: [lu-wei, xi-jinping]
  first:
    date: 2012
    text: 英国心理学家理查德·怀斯曼的《Rip It Up》2012年以《正能量》为名出版中译本，“正能量”当年年底被《咬文嚼字》评为十大网络流行语之首；同年9月北京市宣传部门的座谈会上已用它谈宣传。
    cite: n01-cmp-2015-12-15-positive-energy
    quote: thanks to the 2012 publication of his self-help book Rip It Up, rendered in Chinese translation as Positive Energy
  codified:
    - date: 2017-10-18
      where: 十九大报告
      cite: i01-gov-2017-10-18-19th-report
      quote: 主旋律更加响亮，正能量更加强劲
    - date: 2021-11-11
      where: 十九届六中全会历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 唱响了主旋律、弘扬了正能量
  summary: “正能量”原是2012年一本英国自助书的中文书名，当年迅速成为网络流行语，随后被宣传系统吸收，用来指要求媒体和网民传播的积极、拥护性的内容。北京市委宣传部长鲁炜在2012年9月的座谈会上已拿它谈宣传；他出任国家网信办主任后，2013年8月要求网络名人凝聚正能量。2014年10月习近平在文艺工作座谈会上希望网络作家创作更多具有正能量的作品，此后它成为官方常用语，十九大报告和2021年历史决议都写入了，但没有写入党章或宪法。中国传媒研究计划指出，这个词听上去像心灵鸡汤，实质是网络舆论管控的核心口号；中国数字时代收录的网民段子说，同一块写着“自由、平等”的牌子，放在公园里是正能量，举上街就成了负能量。
  quote:
    text: 希望你们创作更多具有正能量的作品。
    cite: e08-thepaper-2014-10-15-arts-forum
  terms: [正能量]
  related: [chinese-dream, little-pink, great-firewall]
  voices:
    - voice: official
      text: 网络名人应自觉维护国家利益，积极发挥凝聚正能量作用，鼓舞更多网民为中华民族伟大复兴做出贡献。
      cite: b12-xinhua-2013-08-12-lu-wei-bigv
      quote: true
    - voice: scholar
      text: is now at the very heart of political discourse in the Xi Jinping era, having direct implications for media and Internet control
      zh: 如今已处在习近平时代政治话语的核心，直接关系到媒体与互联网管控。
      cite: n01-cmp-2015-12-15-positive-energy
      quote: true
    - voice: scholar
      text: Behind the feel-good vibe, of course, this is all about control.
      zh: 在令人愉悦的气氛背后，这当然全是为了控制。
      cite: n01-cmp-2015-12-15-positive-energy
      quote: true
    - voice: zh
      text: 2012年末，“正能量”被《咬文嚼字》选为中国2012年度十大网络流行语，并位居榜首。
      cite: e09-cdt-space-zhengnengliang
      quote: true
    - voice: zh
      text: 比如一块‘自由、平等、公正、法治’的牌子，放在公园里就是正能量，拿起来上街那就是负能量
      cite: e09-cdt-space-zhengnengliang
      quote: true
  cites:
    - n01-cmp-2015-12-15-positive-energy
    - e09-cdt-space-zhengnengliang
    - b12-xinhua-2013-08-12-lu-wei-bigv
    - e08-thepaper-2014-10-15-arts-forum
    - i01-gov-2017-10-18-19th-report
    - b04-gov-2021-11-16-resolution

# ---------------- government and society ----------------
- id: super-ministry
  name: 大部制
  en: Super-Ministry Reform
  kind: formula
  by: [hu-jintao, wen-jiabao]
  first:
    date: 2007-10-15
    text: 十七大报告在加快行政管理体制改革一节提出探索大部门体制。
    cite: b02-npc-2007-10-24-17th-report
    quote: 加大机构整合力度，探索实行职能有机统一的大部门体制，健全部门间协调配合机制。
  codified:
    - date: 2008-03-15
      where: 十一届全国人大一次会议批准国务院机构改革方案
      cite: e07-cpc-dsj-2008
      quote: 批准国务院机构改革方案，探索实行职能有机统一的大部门体制
  summary: “大部制”是“大部门体制”的简称，指把职能相近的部委合并成少数大部，以减少职责交叉和多头管理。十七大报告首次提出，2008年2月十七届二中全会讨论方案，3月十一届全国人大一次会议批准，组建工业和信息化部、交通运输部、人力资源和社会保障部、环境保护部、住房和城乡建设部，国务院组成部门减为27个。2013年政府工作报告称已初步建立大部门体制框架；广东在汪洋主政时把它推广到地方。它是行政体制改革的提法，没有写入党章或宪法。清华学者王名对BBC说它是解决部门利益的关键一步；美国之音采访的评论人则认为，合并部委牵涉利益集团，阻力很大，会反复。
  quote:
    text: 推进政府机构改革，初步建立职能统一的大部门体制框架
    cite: i02-gov-2013-gwr
  terms: [大部制, 大部门体制]
  related: [scientific-development]
  voices:
    - voice: doc
      text: 探索实行职能有机统一的大部门体制；针对职责交叉、权责脱节问题，明确界定部门分工和权限
      cite: i02-gov-2008-gwr
      quote: true
    - voice: scholar
      text: 他说，大部制的一个出发点是解决部门的问题，解决部门所有制问题，通过大部制的改革形成一种行政权力和公共资源的重新配置格局。
      cite: n01-bbc-2008-02-25-super-ministry
      quote: true
    - voice: zh
      text: 不过，有分析人士指出，中国的部委改革进行过多次，由于牵涉到很多利益集团，面临很大的阻力。
      cite: n01-voa-2008-02-19-super-ministry
      quote: true
    - voice: zh
      text: 多维网的负责人何频认为，要落实大部制，可能需要几年时间，还会出现多次反复。
      cite: n01-voa-2008-02-19-super-ministry
      quote: true
    - voice: official
      text: 继续完善推广大部门体制改革
      cite: b05-gd-2012-05-09-wang-yang-report
      quote: true
  cites:
    - b02-npc-2007-10-24-17th-report
    - n01-voa-2008-02-19-super-ministry
    - n01-bbc-2008-02-25-super-ministry
    - i02-gov-2008-gwr
    - e07-cpc-dsj-2008
    - b05-gd-2012-05-09-wang-yang-report
    - i02-gov-2013-gwr

- id: mass-incidents
  name: 群体性事件
  en: Mass Incidents
  kind: formula
  by: [luo-gan, he-guoqiang]
  first:
    date: 2003-03-05
    text: 本站所收文献中最早见于2003年政府工作报告对过去五年维护稳定工作的回顾。
    cite: i02-gov-2003-gwr
    quote: 正确处理新形势下的人民内部矛盾。妥善处理突发性、群体性事件，努力把矛盾和纠纷解决在基层，消除在萌芽状态。
  summary: “群体性事件”是官方对集体上访、示威、堵路、围攻政府机关和骚乱等集体抗争的统称，属于“人民内部矛盾”的说法，是维稳体制的主要处置对象。2003年起它多次出现在政府工作报告里，2005、2009年的报告都要求积极预防和妥善处置。政法委书记罗干2006年在《求是》撰文称它已成为影响社会稳定的突出问题。官方很少公布总数：BBC 引述公安部估计，2004年有7.4万起；《洛杉矶时报》引中国武警学院的数据说，1993年为8700起，2006年升到9万起；社会学家孙立平推算2010年至少18万起。几个数字口径不同，不能直接比较。典型事件包括汉源、东洲、瓮安、通钢、乌坎和什邡。这个说法从未写入党章或宪法。
  quote:
    text: 人民内部矛盾以及由此引发的群体性事件,已成为影响社会稳定的突出问题
    cite: b03-reformdata-2006-luo-qiushi
  terms: [群体性事件]
  related: [stability-maintenance, harmonious-society]
  voices:
    - voice: doc
      text: 积极预防和妥善处置群体性事件
      cite: i02-gov-2005-gwr
      quote: true
    - voice: west
      text: 中国公安部估计，2004年发生了7万4千起民众暴力冲突事件，参与的人多达370多万。
      cite: e01-bbc-2005-12-11-dongzhou
      quote: true
    - voice: zh
      text: 清华大学的社会学教授孙立平推算，2010年的群体性事件至少有18万起。
      cite: n01-rfa-2011-10-09-mass-incidents
      quote: true
    - voice: zh
      text: 大多数抗议民众并没有要求改变现有的一党专制
      cite: n01-rfa-2011-10-09-mass-incidents
      quote: true
    - voice: west
      text: 中国将会出现越来越多的这类群体性事件，而且会越来越暴力
      cite: e07-bbc-2009-07-27-tonghua
      quote: true
  cites:
    - i02-gov-2003-gwr
    - i02-gov-2005-gwr
    - e01-bbc-2005-12-11-dongzhou
    - b03-reformdata-2006-luo-qiushi
    - i02-gov-2009-gwr
    - e07-bbc-2009-07-27-tonghua
    - e07-xinhua-2009-07-31-tonghua
    - n01-rfa-2011-10-09-mass-incidents
    - b03-people-2014-01-05-he-mass-incidents
