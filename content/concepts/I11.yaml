- id: depoliticization-ethnic
  name: 民族问题“去政治化”之争
  en: Depoliticizing Ethnicity Debate
  kind: debate
  by: []
  first:
    date: 2004-11
    text: 北京大学社会学家马戎在《北京大学学报》发表《理解民族关系的新思路——少数族群问题的“去政治化”》。
    cite: i11-aisixiang-2004-ma-rong-depoliticize
    quote: 把少数族群问题逐步“去政治化”
  summary: 民族问题“去政治化”是北京大学社会学家马戎2004年提出的主张，后来成为“第二代民族政策”之争的思想来源。马戎说，中国传统上把族群差异主要当作文化差异，美国也把少数族群引导为“亚文化群体”，而前苏联和前南斯拉夫“把民族问题高度政治化、制度化”。他主张“把建国以来在族群问题上的“政治化”趋势改变为“文化化”的新方向”，强化国民意识、逐步淡化族群意识，把费孝通的“多元一体”具体化为“政治一体”和“文化多元”，并支持把56个“民族”改称“族群”。2011年胡鞍钢、胡联合提出“第二代民族政策”，延续了淡化族群身份的思路。中国社会科学院郝时远2012年反驳说，用“苏联模式”括套中国制度而主张“去政治化”，“是一个违背事实的伪命题”，“所谓“去政治化”，就是“去制度化””。2014年中央民族工作会议肯定“民族区域自治制度是我国的一项基本政治制度”，没有采纳改变民族区域自治的主张。
  quote:
    text: 在思考少数族群的有关问题时,应逐步把它们更看成是“文化群体”而逐步减少它们作为“政治群体”的色彩。
    cite: i11-aisixiang-2004-ma-rong-depoliticize
  terms: [去政治化, 文化化, 族群, 政治一体, 文化多元]
  related: [second-generation-ethnic-policy, chinese-nation-community, statism]
  sides:
    - label: 族群问题应“文化化”（马戎）
      text: 马戎把晚清保皇党的“中国文化主义”族群观与革命党的汉人“民族主义”族群观对比，认为中国几千年的主流是把族群“文化化”、以文化推动“自然融合”；建国后的民族识别和制度安排则使族群问题“政治化”。他建议借鉴美国，把少数族群更多看作“文化群体”而不是“政治群体”。
      who: []
      cites: [i11-aisixiang-2004-ma-rong-depoliticize]
    - label: 淡化族群身份，走向第二代民族政策（胡鞍钢、胡联合）
      text: 胡鞍钢、胡联合2011年主张“不断淡化公民的族群意识”，以“去标签化”处理民族问题，并建议“民族”一词只用于中华民族。
      who: [hu-angang]
      cites: [i08-aisixiang-2011-hu-angang-ethnic]
    - label: “去政治化”是伪命题（郝时远）
      text: 郝时远认为，中国的民族区域自治制度不是“苏联模式”，“去政治化”实际上是“去民族区域自治化”，而民族政策的基本原则和主要内容都体现在民族区域自治法中。
      who: [hao-shiyuan]
      cites: [i08-tibetcn-2012-02-06-hao-shiyuan]
    - label: 民族区域自治是基本政治制度（中央民族工作会议）
      text: 2014年中央民族工作会议说民族区域自治制度是“中国特色解决民族问题的正确道路的重要内容”。国家民委随后的文章引述习近平：“我再次明确说一遍，取消民族区域自治制度这种说法可以休矣”。
      who: [xi-jinping]
      cites: [i08-gov-2014-09-29-ethnic-work-conference, i08-neac-2014-12-autonomy]
  sections:
    - h: 起因
      from: 2004
      text: 马戎把美国的做法概括为在政治一体化的同时，把族群差异、宗教差异看作“多元文化社会”中的“文化差异”；他认为前苏联、前南斯拉夫把民族问题高度政治化，与这两国后来出现分裂主义运动“肯定有着密切的关系”。
      cites: [i11-aisixiang-2004-ma-rong-depoliticize]
    - h: 经过
      from: 2008-03
      to: 2012-02
      text: 郝时远说，民族问题“去政治化”的论说流行以后，随着2008年拉萨“3·14”和2009年乌鲁木齐“7·5”事件相继发生而成为“热点”。2011年胡鞍钢、胡联合的“第二代民族政策”被郝时远称为对如何“去政治化”做出的“全方位的“政策理念设计””。论争的后续见“第二代民族政策”之争。
      cites: [i08-tibetcn-2012-02-06-hao-shiyuan, i08-aisixiang-2011-hu-angang-ethnic]
    - h: 官方如何收场
      from: 2014-09
      to: 2014-12
      text: 中央民族工作会议重申坚持民族区域自治，同时要求“坚持统一和自治相结合、民族因素和区域因素相结合”。国家民委文章说，在改革问题上“绝不能出现颠覆性错误”。
      cites: [i08-gov-2014-09-29-ethnic-work-conference, i08-neac-2014-12-autonomy]
  voices:
    - voice: scholar
      text: 中国传统中把少数族群“文化化”的成功思路,没有被我们继承下来,却在太平洋彼岸的美国发挥着积极的作用,这种历史错位的现象应当引起我们的反思。
      cite: i11-aisixiang-2004-ma-rong-depoliticize
      quote: true
    - voice: scholar
      text: 所谓“去政治化”，就是“去制度化”，也就是“去民族区域自治化”，当然也就是“去民族政策化”
      cite: i08-tibetcn-2012-02-06-hao-shiyuan
      quote: true
  cites:
    - i11-aisixiang-2004-ma-rong-depoliticize
    - i08-aisixiang-2011-hu-angang-ethnic
    - i08-tibetcn-2012-02-06-hao-shiyuan
    - i08-gov-2014-09-29-ethnic-work-conference
    - i08-neac-2014-12-autonomy

- id: beijing-consensus
  name: 北京共识与华盛顿共识
  en: Beijing Consensus vs. Washington Consensus
  kind: debate
  by: []
  first:
    date: 2004-05-07
    text: 美国高盛公司高级顾问乔舒亚·库珀·雷默在伦敦《金融时报》首次使用“北京共识”一词，5月11日英国外交政策研究中心全文发表他的报告《北京共识》。
    cite: i11-ce-2009-11-19-yu-keping-beijing-consensus
    quote: 在伦敦《金融时报》上提出了“北京共识”
  summary: “北京共识”是美国高盛公司高级顾问乔舒亚·库珀·雷默2004年提出的说法，用来与“华盛顿共识”对照。“华盛顿共识”指经济学家约翰·威廉森为拉美债务问题概括的十条政策，包括财政纪律、利率和贸易自由化、私有化、放松管制等。雷默说“华盛顿共识是一种傲慢的历史终结的标志”，中国的新发展方针“推翻了私有化和自由贸易这样的传统思想”，并把“北京共识”归纳为创新、可持续与平等、自主自决三条“定理”。国内反应分化：俞可平说自己“更喜欢用“中国模式”的提法”；秦晖说中国的增长“与所谓“市场政府双重成功”的“北京共识”不相干”；《中国经济周刊》说“北京共识”“并不等于中国发展模式”，取代华盛顿共识“既不是中国的初衷，更不是中国追求的目标”。官方没有采用“北京共识”一词，十九大报告改说中国道路“为解决人类问题贡献了中国智慧和中国方案”。
  quote:
    text: 我把这种新的动力和发展物理学称为“北京共识”。它取代了广受怀疑的华盛顿共识。
    cite: i11-aisixiang-2004-ramo-beijing-consensus
  terms: [北京共识, 华盛顿共识, 后华盛顿共识, Beijing Consensus, Washington Consensus]
  related: [china-model-debate, neoliberalism-debate, peaceful-rise, statism]
  sides:
    - label: 北京共识正在取代华盛顿共识（雷默）
      text: 雷默说，他的分析基于与中国大学、智囊团和政府思想家“一百多次非正式的讨论”。第一条定理是“消除变化带来的问题的唯一方法是更多的变化和更多的创新”；第二条是超越人均国内生产总值，把可持续性和平等放在首位；第三条是“自主理论”，用不对称力量保障自决。他认为印度和中国这两个最无视华盛顿共识的国家取得了最大的经济成就。
      who: []
      cites: [i11-aisixiang-2004-ramo-beijing-consensus]
    - label: 宁称“中国模式”，兼含经验与教训（俞可平）
      text: 俞可平认为，拉美经济危机、东亚金融危机和俄罗斯休克疗法的失败都与新自由主义有关，“新自由主义正是“华盛顿共识”的基础”；“北京共识”更吸引眼球，是因为它与“早已声名远扬的“华盛顿共识”相对应”。他说完整意义上的发展模式“决不只有成功的经验，也必然有其沉痛的教训”。
      who: [yu-keping]
      cites: [i11-ce-2009-11-19-yu-keping-beijing-consensus]
    - label: 增长与北京共识无关，靠的是低人权（秦晖）
      text: 秦晖认为，中国的增长既不能解释为“政府成功”，也不能解释为“市场成功”，而是以“低人权”的“优势”人为压低人力、土地、资金和非再生资源的价格。
      who: [qin-hui]
      cites: [i08-aisixiang-qin-hui-low-human-rights]
    - label: 北京共识不等于中国发展模式（《中国经济周刊》）
      text: 文章说，“北京共识”是一位外国人送给中国人的头衔，没有也不可能揭示“中国特色社会主义这一中国发展模式的本质特征”；中国历来认为各国的发展应从各国的实际出发。
      who: []
      cites: [i11-zgjjzk-2011-07-26-beijing-consensus]
  sections:
    - h: 华盛顿共识
      from: 1989
      to: 2003
      text: 《中国经济周刊》说，1989年美国国际经济研究所在华盛顿召开研讨会，约翰·威廉姆森提出与世界银行、国际货币基金组织、美国财政部等达成共识的政策措施，后称“华盛顿共识”；斯蒂格利茨批评它并提出“后华盛顿共识”。另说：雷默文中写作威廉森“最早于1990年提出的10点主张”。
      cites: [i11-zgjjzk-2011-07-26-beijing-consensus, i11-aisixiang-2004-ramo-beijing-consensus]
    - h: 提出
      from: 2004-05
      text: 雷默说，文中的大部分思想“曾在亚洲经济危机之后在中国的智囊团和政府研究中心讨论”。俞可平回忆，雷默2004年7月曾来信约见他，说正在布鲁金斯学会筹建一个中国研究中心。
      cites: [i11-aisixiang-2004-ramo-beijing-consensus, i11-ce-2009-11-19-yu-keping-beijing-consensus]
    - h: 官方如何收场
      from: 2011
      to: 2017-10
      text: 官方媒体一面承认中国发展模式受到关注，一面否认“北京共识”代表中国，强调“走适合自己国情的道路”。此后官方表述转向“中国道路”“中国方案”，“北京共识”之争并入中国模式之争。
      cites: [i11-zgjjzk-2011-07-26-beijing-consensus, i01-gov-2017-10-18-19th-report]
  voices:
    - voice: scholar
      text: 华盛顿共识是一种傲慢的历史终结的标志。它使全球各地的经济受到一系列的破坏，使人们产生反感。
      cite: i11-aisixiang-2004-ramo-beijing-consensus
      quote: true
    - voice: scholar
      text: 我自己更喜欢用“中国模式”的提法，不过所谓的“北京共识”可能更容易吸引人们的眼球，因为它与早已声名远扬的“华盛顿共识”相对应。
      cite: i11-ce-2009-11-19-yu-keping-beijing-consensus
      quote: true
    - voice: zh
      text: “北京共识”并不等于中国发展模式，因为它没有也不可能揭示中国特色社会主义这一中国发展模式的本质特征。至于说“北京共识”将取代“华盛顿共识”，则既不是中国的初衷，更不是中国追求的目标。
      cite: i11-zgjjzk-2011-07-26-beijing-consensus
      quote: true
  cites:
    - i11-aisixiang-2004-ramo-beijing-consensus
    - i11-ce-2009-11-19-yu-keping-beijing-consensus
    - i08-aisixiang-qin-hui-low-human-rights
    - i11-zgjjzk-2011-07-26-beijing-consensus
    - i01-gov-2017-10-18-19th-report

- id: anti-involution
  name: 整治“内卷式”竞争
  en: Curbing "Involution-Style" Competition
  kind: debate
  by: [xi-jinping]
  first:
    date: 2024-07-30
    text: 中共中央政治局会议分析经济形势，首次在中央经济部署中提出防止“内卷式”恶性竞争。
    cite: i11-gov-2024-07-30-politburo
    quote: 要强化行业自律，防止“内卷式”恶性竞争。
  codified:
    - date: 2025-03-05
      where: 2025年政府工作报告
      cite: i02-gov-2025-gwr
      quote: 打通市场准入退出、要素配置等方面制约经济循环的卡点堵点，综合整治“内卷式”竞争
    - date: 2026-03-05
      where: 2026年政府工作报告
      cite: i02-gov-2026-gwr
      quote: 深入整治“内卷式”竞争，营造良好市场生态
  summary: 整治“内卷式”竞争（俗称“反内卷”）是2024年起进入中央经济政策的方针，针对企业同质化、低水平、相互压价的竞争。2024年7月30日中央政治局会议提出“防止“内卷式”恶性竞争”，要求“强化市场优胜劣汰机制，畅通落后低效产能退出渠道”。2025年政府工作报告把“综合整治“内卷式”竞争”列入全国统一大市场建设；7月1日中央财经委员会第六次会议要求“依法依规治理企业低价无序竞争”，并“引导干部树立和践行正确政绩观”。此后多个行业协会发布倡议或自律公约，部分行业开始涨价。经济观察报社论提醒“不是所有的价格竞争都是“内卷式”竞争”，不当干预价格会“延迟产能市场化出清的节奏”；经济学者杨瑞龙认为“内卷式”竞争“并非市场竞争过度，而是市场机制扭曲所导致的资源错配”，症结在地方补贴和国有企业的软预算约束。二十届四中全会再提综合整治，2026年政府工作报告称整治“成效显现”。
  quote:
    text: 要强化行业自律，防止“内卷式”恶性竞争。强化市场优胜劣汰机制，畅通落后低效产能退出渠道。
    cite: i11-gov-2024-07-30-politburo
  terms: [内卷式竞争, “内卷式”竞争, 反内卷, 低价无序竞争]
  related: [involution-lying-flat, unified-national-market, industry-revitalization-plans, private-economy-promotion-law]
  sides:
    - label: 综合整治，推动落后产能有序退出（中央）
      text: 中财委第六次会议把全国统一大市场的基本要求概括为“五统一、一开放”，要求规范政府采购、招标投标和地方招商引资。2026年政府工作报告要求“综合运用产能调控、标准引领、价格执法、质量监管等手段”，并出台地方政府招商引资鼓励和禁止事项清单。
      who: [xi-jinping]
      cites: [i11-gov-2025-07-01-cfac-6th, i02-gov-2025-gwr, i02-gov-2026-gwr]
    - label: 别只跟价格较劲（经济观察报社论）
      text: 社论举例说，西安市交通管理部门叫停了网约车的“一口价”“特惠价”，多个行业协会形成了所谓的“最低价”机制。社论认为价格战只是表象，“反内卷”的核心是“着力推动市场恢复其配置资源的能力”，要解决不正当竞争、政府不合理补贴和行业不合理准入限制。
      who: []
      cites: [i11-eeo-2025-08-22-anti-involution]
    - label: 遵循市场逻辑，硬化预算约束（杨瑞龙）
      text: 杨瑞龙说，价格下行时“有的国有企业可以凭借地方财政或信贷支持继续生产”，自负盈亏的民营企业反而率先退出；地方政府以零地价、财政补贴招商并保护低效企业。他反对限价，认为“用行政手段限制“内卷式”竞争不仅难以达到预期效果”，主张“通过硬化预算约束、剥离隐性补贴，建立由价格决定进退的市场出清机制”。
      who: []
      cites: [i11-people-2025-11-12-yang-ruilong]
  sections:
    - h: 起因
      from: 2024-07
      to: 2025-03
      text: “内卷”原是2020年前后的网络流行语。2024年7月政治局会议把防止“内卷式”恶性竞争写在培育新兴产业、推动传统产业转型升级一段之中。2025年政府工作报告把它与破除地方保护和市场分割并列。
      cites: [i11-gov-2024-07-30-politburo, i02-gov-2025-gwr]
    - h: 经过
      from: 2025-07
      to: 2025-11
      text: 中财委会议后，行业协会的倡议和自律公约提出抵制低价竞争、恶意压价和低于成本的倾销；经观社论说，一些论者把涨价看作“反内卷”见效的佐证。二十届四中全会提出综合整治“内卷式”竞争，强调“强化反垄断和反不正当竞争执法司法，形成优质优价、良性竞争的市场秩序”。
      cites: [i11-gov-2025-07-01-cfac-6th, i11-eeo-2025-08-22-anti-involution, i11-people-2025-11-12-yang-ruilong]
    - h: 官方如何收场
      from: 2026-03
      text: 2026年政府工作报告回顾说，“推进重点行业产能治理，综合整治“内卷式”竞争成效显现”，并要求制定全国统一大市场建设条例，规范税收优惠、财政补贴政策。
      cites: [i02-gov-2026-gwr]
  policies:
    - date: 2024-07-30
      name: 政治局会议提出防止“内卷式”恶性竞争
      text: 会议要求强化行业自律，强化市场优胜劣汰机制，畅通落后低效产能退出渠道。
      events: []
      cite: i11-gov-2024-07-30-politburo
    - date: 2025-07-01
      name: 中央财经委员会第六次会议
      text: 会议要求纵深推进全国统一大市场建设，依法依规治理企业低价无序竞争，推动落后产能有序退出，完善干部政绩考核评价体系。
      events: []
      cite: i11-gov-2025-07-01-cfac-6th
    - date: 2026-03-05
      name: 2026年政府工作报告：深入整治“内卷式”竞争
      text: 报告要求综合运用产能调控、标准引领、价格执法、质量监管等手段，深入整治“内卷式”竞争。
      events: [work-report-2026]
      cite: i02-gov-2026-gwr
  voices:
    - voice: zh
      text: 价格是市场供需的信号，不当干预价格会释放错误的供需信号，延迟产能市场化出清的节奏。
      cite: i11-eeo-2025-08-22-anti-involution
      quote: true
    - voice: scholar
      text: “内卷式”竞争并非市场竞争过度，而是市场机制扭曲所导致的资源错配，主要是市场出清机制的缺失，即过度或低效供给无法在市场竞争中自动退出市场，从而产生恶性价格竞争。
      cite: i11-people-2025-11-12-yang-ruilong
      quote: true
  cites:
    - i11-gov-2024-07-30-politburo
    - i02-gov-2025-gwr
    - i11-gov-2025-07-01-cfac-6th
    - i11-eeo-2025-08-22-anti-involution
    - i11-people-2025-11-12-yang-ruilong
    - i02-gov-2026-gwr

- id: heroes-martyrs-law
  name: 英雄烈士保护法
  en: Heroes and Martyrs Protection Law
  kind: formula
  by: []
  first:
    date: 2018-04-27
    text: 十三届全国人大常委会第二次会议通过《中华人民共和国英雄烈士保护法》，5月1日起施行。
    cite: i11-gov-2018-04-27-heroes-law
    quote: 禁止歪曲、丑化、亵渎、否定英雄烈士事迹和精神。
  codified:
    - date: 2020-12-26
      where: 《中华人民共和国刑法修正案（十一）》第三十五条（刑法第二百九十九条之一）
      cite: i11-npc-2020-12-26-criminal-amendment-11
      quote: 侮辱、诽谤或者以其他方式侵害英雄烈士的名誉、荣誉，损害社会公共利益，情节严重的，处三年以下有期徒刑、拘役、管制或者剥夺政治权利。
  summary: 英雄烈士保护法2018年4月27日由十三届全国人大常委会第二次会议通过，5月1日起施行，共30条。第三条说英雄烈士事迹和精神“是中华民族的共同历史记忆和社会主义核心价值观的重要体现”；第五条定每年9月30日为烈士纪念日；第二十二条“禁止歪曲、丑化、亵渎、否定英雄烈士事迹和精神”；第二十三条要求网信、电信、公安部门对来源于境外的相关信息“采取技术措施和其他必要措施阻断传播”；第二十五条规定英雄烈士没有近亲属或近亲属不起诉时，由检察机关提起诉讼。立法前，2016年北京市西城区法院在狼牙山五壮士名誉权案中判决《炎黄春秋》前执行主编洪振快公开道歉，认为英雄人物及其精神“应当视为社会公共利益”。2020年12月的刑法修正案（十一）增设刑法第二百九十九条之一，侵害英雄烈士名誉、荣誉、情节严重的，最高可处三年有期徒刑，2021年3月1日起施行。
  quote:
    text: 近代以来，为了争取民族独立和人民解放，实现国家富强和人民幸福，促进世界和平和人类进步而毕生奋斗、英勇献身的英雄烈士，功勋彪炳史册，精神永垂不朽。
    cite: i11-gov-2018-04-27-heroes-law
  terms: [英雄烈士保护法, 英烈保护法, 英烈法, 侵害英雄烈士名誉、荣誉罪]
  related: [historical-nihilism-debate, document-9, xi-culture-thought]
  sections:
    - h: 立法前的狼牙山案
      from: 2013
      to: 2016-08
      text: 洪振快在《炎黄春秋》等处发表两篇文章，考证狼牙山五壮士“在何处跳崖”等细节。2016年6月27日西城区法院判决他停止侵害、赔礼道歉，认为他“通过强调与主要事实无关或者关联不大的细节”否定主要史实，所主张的言论自由“明显不足以抗辩其侵权责任的成立”。洪振快对《纽约时报》说，“我当然不会道歉”。
      cites: [i08-xinhua-2016-06-27-langyashan, i08-nytcn-2016-08-16-hong-zhenkuai]
    - h: 主要条文
      from: 2018-04
      to: 2018-05
      text: 法律第一条把立法目的写为“传承和弘扬英雄烈士精神、爱国主义精神”；第二十六条规定，侵害英雄烈士姓名、肖像、名誉、荣誉，损害社会公共利益的，依法承担民事责任，并可给予治安管理处罚或追究刑事责任；第二十七条把在纪念设施保护范围内“宣扬、美化侵略战争和侵略行为”列为违法行为。
      cites: [i11-gov-2018-04-27-heroes-law]
    - h: 入刑
      from: 2020-12
      to: 2021-03
      text: 英烈法本身只规定“构成犯罪的，依法追究刑事责任”，没有专门罪名。刑法修正案（十一）第三十五条增设专门条款，自2021年3月1日起施行。
      cites: [i11-gov-2018-04-27-heroes-law, i11-npc-2020-12-26-criminal-amendment-11]
  policies:
    - date: 2018-04-27
      name: 英雄烈士保护法
      text: 全国人大常委会通过英烈法，规定烈士纪念日、纪念设施保护、禁止歪曲丑化英烈和检察公益诉讼。
      events: []
      cite: i11-gov-2018-04-27-heroes-law
    - date: 2020-12-26
      name: 刑法修正案（十一）增设侵害英雄烈士名誉、荣誉罪
      text: 修正案在刑法第二百九十九条后增加一条，情节严重的侵害英烈名誉、荣誉行为可处三年以下有期徒刑、拘役、管制或者剥夺政治权利。
      events: []
      cite: i11-npc-2020-12-26-criminal-amendment-11
  voices:
    - voice: doc
      text: 英雄烈士没有近亲属或者近亲属不提起诉讼的，检察机关依法对侵害英雄烈士的姓名、肖像、名誉、荣誉，损害社会公共利益的行为向人民法院提起诉讼。
      cite: i11-gov-2018-04-27-heroes-law
      quote: true
    - voice: zh
      text: “我当然不会道歉，”洪振快在周一接受采访时说。“这是基本的学术自由，我需要保持作为一名知识分子的尊严。”
      cite: i08-nytcn-2016-08-16-hong-zhenkuai
      quote: true
  cites:
    - i08-xinhua-2016-06-27-langyashan
    - i08-nytcn-2016-08-16-hong-zhenkuai
    - i11-gov-2018-04-27-heroes-law
    - i11-npc-2020-12-26-criminal-amendment-11

- id: private-economy-promotion-law
  name: 民营经济促进法
  en: Private Economy Promotion Law
  kind: formula
  parent: socialist-market-economy
  by: []
  first:
    date: 2025-03-05
    text: 2025年政府工作报告回顾说，国务院已于上一年提请全国人大常委会审议草案。
    cite: i02-gov-2025-gwr
    quote: 提请全国人大常委会审议民营经济促进法草案
  codified:
    - date: 2025-04-30
      where: 十四届全国人大常委会第十五次会议通过
      cite: i11-gov-2025-04-30-private-economy-law
      quote: 促进民营经济持续、健康、高质量发展，是国家长期坚持的重大方针政策。
  summary: 民营经济促进法2025年4月30日由十四届全国人大常委会第十五次会议通过，5月20日起施行，共9章78条。立法前，习近平2025年2月17日在民营企业座谈会上说，党和国家对民营经济的基本方针政策“已经纳入中国特色社会主义制度体系”，“不能变，也不会变”。法律第二条写入“毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展”；第三条称民营经济是“推进中国式现代化的生力军”，规定“平等对待、公平竞争、同等保护、共同发展的原则”；第五条要求民营经济组织及其经营者“拥护中国共产党的领导，坚持中国特色社会主义制度”。权益保护一章要求“严格区分经济纠纷与经济犯罪”，“禁止利用行政或者刑事手段违法干预经济纠纷”，“禁止为经济利益等目的滥用职权实施异地执法”，并要求地方政府清理拖欠民营企业账款。2026年政府工作报告要求“完善民营经济促进法配套法规政策”。
  quote:
    text: 民营经济是社会主义市场经济的重要组成部分，是推进中国式现代化的生力军，是高质量发展的重要基础，是推动我国全面建成社会主义现代化强国、实现中华民族伟大复兴的重要力量。
    cite: i11-gov-2025-04-30-private-economy-law
  terms: [民营经济促进法, 两个毫不动摇, 异地执法, 趋利性执法]
  related: [private-economy-exit, guojin-mintui, socialist-market-economy, unified-national-market, lang-gu-debate]
  lists:
    - title: 九章结构
      cite: i11-gov-2025-04-30-private-economy-law
      items:
        - 总则
        - 公平竞争
        - 投资融资促进
        - 科技创新
        - 规范经营
        - 服务保障
        - 权益保护
        - 法律责任
        - 附则
  sections:
    - h: 立法过程
      from: 2024
      to: 2025-05
      text: 2025年政府工作报告把提请审议草案列为上一年“全面深化改革扩大开放”的成果。2月17日的民营企业座谈会上，任正非、王传福、刘永好、虞仁荣、王兴兴、雷军6位企业负责人发言。4月30日法律通过，新华社同日公布全文。
      cites: [i02-gov-2025-gwr, b14-gov-2025-02-17-private-symposium, i11-gov-2025-04-30-private-economy-law]
    - h: 主要内容
      from: 2025-05-20
      text: 公平竞争一章规定“国家实行全国统一的市场准入负面清单制度”，清单以外的领域各类经济组织“可以依法平等进入”。权益保护一章规定查封、扣押、冻结财物要严格区分民营经济组织财产与经营者个人财产、涉案人财产与案外人财产；生产经营活动未违反刑法规定的，“不以犯罪论处”。第五条同时要求加强对民营经济组织经营者的“思想政治引领”。
      cites: [i11-gov-2025-04-30-private-economy-law]
    - h: 实施
      from: 2026-03
      text: 2026年政府工作报告要求“从法律和制度上保障平等使用生产要素、公平参与市场竞争、有效保护合法权益”，并“下更大力气解决拖欠企业账款问题”。
      cites: [i02-gov-2026-gwr]
  policies:
    - date: 2025-04-30
      name: 民营经济促进法通过
      text: 法律确立平等对待、公平竞争、同等保护、共同发展原则，规范涉企执法和异地执法，规定清理拖欠账款。
      events: [e08-2025-private-enterprise-symposium]
      cite: i11-gov-2025-04-30-private-economy-law
  voices:
    - voice: doc
      text: 办理案件应当严格区分经济纠纷与经济犯罪，遵守法律关于追诉期限的规定；生产经营活动未违反刑法规定的，不以犯罪论处；事实不清、证据不足或者依法不追究刑事责任的，应当依法撤销案件、不起诉、终止审理或者宣告无罪。
      cite: i11-gov-2025-04-30-private-economy-law
      quote: true
    - voice: official
      text: 党和国家对民营经济发展的基本方针政策，已经纳入中国特色社会主义制度体系，将一以贯之坚持和落实，不能变，也不会变。
      cite: b14-gov-2025-02-17-private-symposium
      quote: true
  cites:
    - i02-gov-2025-gwr
    - b14-gov-2025-02-17-private-symposium
    - i11-gov-2025-04-30-private-economy-law
    - i02-gov-2026-gwr
