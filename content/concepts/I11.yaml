- id: fox-hunt
  name: 天网与猎狐
  en: Sky Net and Fox Hunt
  kind: formula
  parent: strict-governance
  by: [liu-jinguo]
  first:
    date: 2014-07-22
    text: 公安部召开电视电话会议，部署“猎狐2014”专项行动，缉捕在逃境外经济犯罪嫌疑人。
    cite: i11-haiwainet-2014-07-22-fox-hunt
    quote: 即使犯罪分子逃到天涯海角，也要将其缉捕归案、绳之以法
  codified:
    - date: 2015-03-26
      where: 中央反腐败协调小组国际追逃追赃工作办公室会议
      cite: e08-people-2015-04-23-red-notice
      quote: 研究部署2015年反腐败国际追逃追赃工作，决定启动“天网”行动
    - date: 2017-10-18
      where: 十九大报告
      cite: i01-gov-2017-10-18-19th-report
      quote: 不管腐败分子逃到哪里，都要缉拿归案、绳之以法
  summary: “猎狐”是公安部缉捕外逃经济犯罪嫌疑人的专项行动，“天网”是中央反腐败协调小组国际追逃追赃工作办公室统筹的年度行动，猎狐是其中的一个专项。2014年7月22日公安部部署“猎狐2014”，副部长刘金国说“即使犯罪分子逃到天涯海角，也要将其缉捕归案、绳之以法”。2015年3月中央启动“天网”行动，由中组部、最高检、公安部、人民银行等牵头多个专项；4月22日国际刑警组织中国国家中心局集中公布100名外逃人员的红色通缉令。中央纪委2022年报告说，五年来“天网行动”追回外逃人员7089人；2026年报告说2025年追回外逃人员963人，“实现“百名红通人员”亚洲地区清零”。二十大报告把“猎狐”与“打虎”“拍蝇”并列。2020年10月美国司法部起诉8人在美为中国政府从事“猎狐”行动，外交部回应要求美方不要沦为犯罪分子的“避罪天堂”。
  quote:
    text: 各级公安机关要以坚定的决心和有力的措施，全力打赢境外追逃这场硬仗，即使犯罪分子逃到天涯海角，也要将其缉捕归案、绳之以法，坚决捍卫法律尊严，坚决维护人民利益。
    cite: i11-haiwainet-2014-07-22-fox-hunt
  terms: [天网, 天网行动, 猎狐, 猎狐行动, 猎狐2014, 百名红通, 追逃追赃, Operation Fox Hunt, Sky Net]
  related: [strict-governance, liuzhi, big-party-unique-problems]
  lists:
    - title: “天网”行动的五个“一批”（2015年）
      cite: e08-people-2015-04-23-red-notice
      items:
        - 抓捕一批腐败分子
        - 清理一批违规证照
        - 打击一批地下钱庄
        - 追缴一批涉案资产
        - 劝返一批外逃人员
  sections:
    - h: 猎狐2014
      from: 2014-07
      to: 2014-12
      text: 公安部要求从7月22日至年底集中开展行动。刘金国说，缉捕外逃经济犯罪嫌疑人“事关群众切身利益，事关社会公平正义”，一些外逃嫌疑人还牵涉腐败犯罪，“能否到案直接关系着反腐败斗争的深入开展”。新华社报道说，2008年以来公安机关已从54个国家和地区缉捕730余名重大经济犯罪嫌疑人回国。
      cites: [i11-haiwainet-2014-07-22-fox-hunt]
    - h: 天网与百名红通
      from: 2015-03
      to: 2026-01
      text: “天网”由多个专项组成，有关部门从2015年4月起“综合运用警务、检务、外交、金融等手段”。十八届中央纪委向十九大的报告说，2014年以来共从90多个国家和地区追回外逃人员3453名、追赃95.1亿元，“百名红通人员”中已有48人落网。此后“天网”逐年延续，二十届中央纪委五次全会报告说2025年开展“天网2025”行动。
      cites: [e08-people-2015-04-23-red-notice, b04-gov-2017-10-29-ccdi-report, b05-saac-2022-10-ccdi-report, b06-xinhua-2026-01-12-li-xi-ccdi-report]
    - h: 美国起诉与中方回应
      from: 2020-10
      text: 2020年10月28日，美国司法部在纽约布鲁克林联邦法院公开起诉书，指控8人在中国官员指挥下监视、骚扰、胁迫美国居民回国。次日外交部发言人汪文斌说，中国执法机关“严格根据国际法开展对外执法合作”，有关行动“无可非议”，敦促美方履行《联合国反腐败公约》等义务。
      cites: [i11-state-2020-10-28-fox-hunt-charges, i11-xinhua-2020-10-29-mfa-fox-hunt]
  policies:
    - date: 2014-07-22
      name: “猎狐2014”专项行动
      text: 公安部部署全国公安机关集中开展缉捕在逃境外经济犯罪嫌疑人的专项行动。
      events: []
      cite: i11-haiwainet-2014-07-22-fox-hunt
    - date: 2015-04-22
      name: “天网”行动与百名红色通缉令
      text: 中央反腐败协调小组国际追逃追赃工作办公室启动“天网”行动；国际刑警组织中国国家中心局集中公布100名外逃人员红色通缉令。
      events: [e08-2015-skynet-red-notices]
      cite: e08-people-2015-04-23-red-notice
  voices:
    - voice: west
      text: The defendants, allegedly acting at the direction and under the control of PRC government officials, conducted surveillance of and engaged in a campaign to harass, stalk and coerce certain residents of the United States to return to the PRC as part of a global, concerted and extralegal repatriation effort known as “Operation Fox Hunt.”
      zh: 被告据称在中华人民共和国政府官员的指挥和控制下，对部分美国居民进行监视，并开展骚扰、跟踪和胁迫，迫使他们返回中国，这是一项名为“猎狐行动”的全球性、协同一致且法外的遣返行动的一部分。
      cite: i11-state-2020-10-28-fox-hunt-charges
      quote: true
    - voice: official
      text: 中国执法机关严格根据国际法开展对外执法合作，充分尊重外国法律和司法主权，有关行动无可非议。
      cite: i11-xinhua-2020-10-29-mfa-fox-hunt
      quote: true
  cites:
    - i11-haiwainet-2014-07-22-fox-hunt
    - e08-people-2015-04-23-red-notice
    - b04-gov-2017-10-29-ccdi-report
    - i01-gov-2017-10-18-19th-report
    - b05-saac-2022-10-ccdi-report
    - i01-gov-2022-10-16-20th-report
    - b06-xinhua-2026-01-12-li-xi-ccdi-report
    - i11-state-2020-10-28-fox-hunt-charges
    - i11-xinhua-2020-10-29-mfa-fox-hunt

- id: birdcage-economy
  name: 鸟笼经济
  en: Birdcage Economy
  kind: formula
  by: [chen-yun]
  first:
    date: 1982-12-02
    text: 陈云在家中会见五届全国人大五次会议上海代表团部分代表时提出“鸟和笼子”的比喻。
    cite: i11-dswxyjy-2020-04-10-deng-chen-birdcage
    quote: 搞活经济是在计划指导下搞活，不是离开计划的指导搞活。
  summary: 1982年12月2日，陈云会见五届全国人大五次会议上海代表团部分代表时说，搞活经济要在计划指导下进行，“这就像鸟和笼子的关系一样，鸟不能捏在手里，捏在手里会死，要让它飞，但只能让它在笼子里飞。没有笼子，它就飞跑了。”笼子指国家计划，大小要适当，“可以跨省跨地区，甚至可以跨国跨洲”，本身也要经常调整。《中国新闻周刊》说，陈云当年11月、12月间多次借用黄克诚提出的“鸟笼”之说。海外有人把这番话称为“鸟笼经济”理论，视为“保守派经济理论”；中共党史研究院的文章则说，“笼子”是对指令性计划的纠偏，目的是“活而不乱”。1992年十四大确立社会主义市场经济体制，把“计划经济为主、市场调节为辅”一类提法归入认识逐步深化的过程。
  quote:
    text: 如果说鸟是搞活经济的话，那末，笼子就是国家计划。
    cite: i11-dswxyjy-2020-04-10-deng-chen-birdcage
  terms: [鸟笼经济, 鸟笼论, 笼鸟论, 鸟和笼子, “笼鸟”比喻论]
  related: [socialist-market-economy, socialism-or-capitalism, macro-control, crossing-river-stones]
  sections:
    - h: 提出
      from: 1982-11
      to: 1982-12
      text: 据中共中央党史和文献研究院的文章，这一比喻是为了“扭转资金分散的现象”，又不妨碍把经济搞活；党史专家对《中国新闻周刊》说，它“与当时的经济过热有很大关系”。另说：人民网党史频道所引陈云原话作“捏在手里就会死”，并多出“经济活动不一定限于一个省、一个地区，在国家计划指导下”一句，与《陈云文选》第三卷的文字略有出入。
      cites: [i11-dswxyjy-2020-04-10-deng-chen-birdcage, b22-jiemian-2015-06-chen-yun, i11-people-2014-05-14-chen-yun-birdcage]
    - h: 评价与后续
      from: 1984
      to: 1992
      text: 党史研究院文章说，把“鸟”捏在手里“会死”，指原有指令性计划往往把经济搞死，“笼子”则是有弹性的指导性计划，这一比喻为十二届三中全会提出“社会主义是有计划的商品经济”提供了思想指导。1988年10月陈云又说，“在我们这样一个社会主义国家里，学习西方市场经济的办法，看来困难不少”。人民网党史频道说，陈云在计划与市场关系上的意见“和邓小平的意见是一致的”。
      cites: [i11-dswxyjy-2020-04-10-deng-chen-birdcage, i11-people-2014-05-14-chen-yun-birdcage]
  voices:
    - voice: history
      text: 有人把陈云的话曲解为经济是“鸟”，社会主义制度是“笼子”，并由此把“鸟笼经济”视为“保守派经济理论”，把陈云视为“保守派经济专家”。
      cite: i11-people-2014-05-14-chen-yun-birdcage
      quote: true
    - voice: history
      text: 这个比喻虽然侧重点在于计划的指导作用，但它的出发点和归宿都是搞活经济。
      cite: b22-jiemian-2015-06-chen-yun
      quote: true
  cites:
    - i11-dswxyjy-2020-04-10-deng-chen-birdcage
    - b22-jiemian-2015-06-chen-yun
    - i11-people-2014-05-14-chen-yun-birdcage

- id: central-rise
  name: 中部崛起
  en: Rise of Central China
  kind: formula
  parent: scientific-development
  by: [wen-jiabao]
  first:
    date: 2004-03-05
    text: 2004年政府工作报告把促进中部地区崛起与西部大开发、振兴东北并列。
    cite: i02-gov-2004-gwr
    quote: 要坚持推进西部大开发，振兴东北地区等老工业基地，促进中部地区崛起，鼓励东部地区加快发展
  codified:
    - date: 2006-04-15
      where: 《中共中央、国务院关于促进中部地区崛起的若干意见》（中发〔2006〕10号）
      cite: e01-cpc-dsj-2006
      quote: 中共中央、国务院发出《关于促进中部地区崛起的若干意见》
    - date: 2007-10-15
      where: 十七大报告
      cite: b02-npc-2007-10-24-17th-report
      quote: 大力促进中部地区崛起
  summary: 中部崛起是胡温时期区域发展总体战略的一环。2004年政府工作报告首次提出“促进中部地区崛起”，要求中部加强现代农业和重要商品粮基地建设、发展有竞争力的制造业和高新技术产业。2005年报告要求“抓紧研究制定促进中部地区崛起的规划和措施”。2006年4月15日中共中央、国务院发出若干意见，要把中部建成全国重要的粮食生产基地、能源原材料基地、现代装备制造及高技术产业基地和综合交通运输枢纽；5月国务院办公厅分解任务，规定部分老工业基地城市“比照振兴东北老工业基地有关政策给予支持”，贫困、革命老区和少数民族地区“比照西部大开发政策执行”。十七大写入“大力促进中部地区崛起”，十九大改为“发挥优势推动中部地区崛起”，2024年政府工作报告作“中部地区加快崛起”。
  quote:
    text: 加快中部地区发展是区域协调发展的重要方面。
    cite: i02-gov-2004-gwr
  terms: [中部崛起, 中部地区崛起, 促进中部地区崛起, 三个基地一个枢纽]
  related: [western-development, northeast-revitalization, scientific-development, sannong]
  lists:
    - title: 中部地区的定位（2006年若干意见）
      cite: e01-cpc-dsj-2006
      items:
        - 全国重要的粮食生产基地
        - 能源原材料基地
        - 现代装备制造及高技术产业基地
        - 综合交通运输枢纽
  sections:
    - h: 提出
      from: 2004-03
      to: 2005-03
      text: 2004年报告说，要形成“东中西互动、优势互补、相互促进、共同发展的新格局”。2005年报告说，实施西部大开发、振兴东北、促进中部崛起、鼓励东部加快发展“是从全面建设小康社会和加快现代化建设全局出发作出的整体战略部署”，国家要“从政策、资金、重大建设布局等方面给予支持”。
      cites: [i02-gov-2004-gwr, i02-gov-2005-gwr]
    - h: 若干意见与分工
      from: 2006-04
      to: 2006-05
      text: 国务院办公厅的分工通知称若干意见是“指导当前和今后一个时期中部地区发展的纲领性文件”，把任务分给发展改革委等部门，要求有关部门将实施意见和工作计划报发展改革委汇总。通知中的煤炭基地建设一条点名山西、河南、安徽等煤炭资源丰富地区。
      cites: [e01-cpc-dsj-2006, i11-gov-2006-05-19-central-rise-tasks]
    - h: 延续
      from: 2007-10
      to: 2024-03
      text: 十七大报告把它与深入推进西部大开发、全面振兴东北、积极支持东部率先发展并列为区域发展总体战略。十九大报告改称“发挥优势推动中部地区崛起”；2024年政府工作报告写作“中部地区加快崛起”，并要求提升东北和中西部地区承接产业转移能力。
      cites: [b02-npc-2007-10-24-17th-report, i01-gov-2017-10-18-19th-report, i02-gov-2024-gwr]
  policies:
    - date: 2006-04-15
      name: 中共中央、国务院关于促进中部地区崛起的若干意见
      text: 意见要求中部在发挥承东启西和产业发展优势中崛起，建设粮食、能源原材料、装备制造及高技术产业三个基地和综合交通运输枢纽；5月国务院办公厅印发分工通知落实。
      events: [e2003-northeast-revitalization]
      cite: e01-cpc-dsj-2006
  cites:
    - i02-gov-2004-gwr
    - i02-gov-2005-gwr
    - e01-cpc-dsj-2006
    - i11-gov-2006-05-19-central-rise-tasks
    - b02-npc-2007-10-24-17th-report
    - i01-gov-2017-10-18-19th-report
    - i02-gov-2024-gwr

- id: no1-document
  name: 中央一号文件
  en: Central No. 1 Document
  kind: document
  parent: sannong
  by: []
  first:
    date: 1982-01-01
    text: 中共中央发出第一个以“三农”为主题的一号文件《全国农村工作会议纪要》。
    cite: i11-reformdata-2013-01-10-five-no1
    quote: 包产到户、包干到户或大包干“都是社会主义生产责任制”
  codified:
    - date: 2004-02-08
      where: 《中共中央国务院关于促进农民增加收入若干政策的意见》（一号文件重新聚焦“三农”）
      cite: i04-rmrb-2004-02-09-editorial
      quote: 农民增收难的问题已经到了非解决不可的时候
  summary: 中央一号文件是中共中央每年发布的第一份文件，新华社说它“在全年工作中具有纲领性和指导性的地位”。1982年至1986年，中央连续五年以一号文件部署农村改革：1982年文件肯定包产到户、包干到户“都是社会主义生产责任制”，1984年延长土地承包期，1985年取消农副产品统购派购制度，1986年肯定农村改革方针并要求增加农业投入。此后一号文件中断18年，新华社说当时的认识是“基本问题已经解决了，今后重要问题都在城市”。1997年至2003年农民收入增速大幅低于城镇居民，2004年一号文件提出“两免三补贴”，“至此一号文件重新锁定“三农””。此后一号文件每年都以“三农”为题：2006年宣布在全国取消农业税，2007年部署新农村建设，2018年部署乡村振兴。2026年2月发布的文件是“党的十八大以来连续发出的第十四个指导“三农”工作的中央一号文件”。
  quote:
    text: 一号文件中聚焦的主题往往是国家当前需要重点关注和亟须解决的问题，在全年工作中具有纲领性和指导性的地位
    cite: i11-gov-2015-02-01-no1-documents
  terms: [中央一号文件, 一号文件, 五个一号文件]
  related: [sannong, rural-revitalization, poverty-alleviation]
  lists:
    - title: 1982—1986年的五个一号文件
      cite: i11-reformdata-2013-01-10-five-no1
      items:
        - 全国农村工作会议纪要
        - 当前农村经济政策的若干问题
        - 关于一九八四年农村工作的通知
        - 关于进一步活跃农村经济的十项政策
        - 关于一九八六年农村工作的部署
  sections:
    - h: 五个一号文件
      from: 1982-01
      to: 1986-01
      text: 亲历起草的原四川省委农村政策研究室主任赵文欣回忆，第一个一号文件1981年12月21日经中央政治局通过、1982年元旦发出；1983年文件说家庭联产承包责任制“是在党的领导下中国农民的伟大创造”；起草第三个文件时对雇工问题意见不一，邓小平说“不急于限制，看三年再说”；1985年文件取消了实施30年的统购派购制度。
      cites: [i11-reformdata-2013-01-10-five-no1]
    - h: 中断与重启
      from: 1987
      to: 2004-02
      text: 新华社说，1988年至1997年农村改革进度变缓，城乡收入差距拉大，2003年还出现全国粮食产量罕见下滑。2004年一号文件以中共中央、国务院名义专门部署促进农民增收，《人民日报》社论说这“新中国成立以来还是第一次”。
      cites: [i11-gov-2016-01-27-18-no1-documents, i04-rmrb-2004-02-09-editorial]
    - h: 年年“三农”
      from: 2005
      to: 2026-02
      text: 2005年一号文件坚持“多予少取放活”，2006年宣布全国取消农业税，2011年首次以水利为主题，2013年首次写入“家庭农场”。2018年一号文件把十九大的乡村振兴战略落实为三步时间表；2026年文件题为《关于锚定农业农村现代化、扎实推进乡村全面振兴的意见》。
      cites: [i11-gov-2016-01-27-18-no1-documents, i04-rmrb-2026-02-04-editorial]
  policies:
    - date: 2004-02-08
      name: 促进农民增加收入的中央一号文件
      text: 文件针对农民收入连续多年增长缓慢，提出逐步降低农业税税率、取消除烟叶外的农业特产税，并给予粮食直补、良种补贴和农机具购置补贴。
      events: [e11-2004-farmer-income-document]
      cite: i11-gov-2016-01-27-18-no1-documents
    - date: 2006-02-21
      name: 推进社会主义新农村建设的中央一号文件
      text: 2006年一号文件提出在全国范围取消农业税，并说我国总体上已进入以工促农、以城带乡的发展阶段。
      events: [e11-2005-new-countryside-opinion, e2006-agricultural-tax-abolished]
      cite: i11-gov-2016-01-27-18-no1-documents
  voices:
    - voice: witness
      text: 改革之所以推进，完全是在中央高层领导支持和广大基层群众推动下，上下联动呼应而成的。
      cite: i11-reformdata-2013-01-10-five-no1
      quote: true
  cites:
    - i11-reformdata-2013-01-10-five-no1
    - i11-gov-2015-02-01-no1-documents
    - i11-gov-2016-01-27-18-no1-documents
    - i04-rmrb-2004-02-09-editorial
    - i04-rmrb-2026-02-04-editorial

- id: proactive-fiscal-policy
  name: 积极的财政政策
  en: Proactive Fiscal Policy
  kind: formula
  parent: macro-control
  by: [zhu-rongji]
  first:
    date: 1998-08-29
    text: 九届全国人大常委会第四次会议批准增发长期建设国债，积极财政政策由此启动。
    cite: e01-cpc-dsj-1998
    quote: 批准财政部向国有商业银行增发1000亿元国债，用于加大基础设施建设的投入
  codified:
    - date: 2000-03-05
      where: 2000年政府工作报告
      cite: i02-gov-2000-gwr
      quote: 实践证明，实行积极财政政策是完全正确的，取得的成效是明显的。
    - date: 2009-03-05
      where: 2009年政府工作报告
      cite: i02-gov-2009-gwr
      quote: 实施积极的财政政策和适度宽松的货币政策
    - date: 2025-03-05
      where: 2025年政府工作报告
      cite: i02-gov-2025-gwr
      quote: 实施更加积极的财政政策
  summary: “积极的财政政策”是中国对扩张性财政政策的官方说法，前后用过三轮。第一轮始于1998年应对亚洲金融危机：8月全国人大常委会批准增发1000亿元国债，中央财政赤字由460亿元扩大到960亿元；朱镕基2000年报告说两年来发行2100亿元长期国债，带动4200多亿元银行贷款和自筹资金。2005年政府转向“松紧适度的稳健财政政策”。第二轮始于2008年底应对国际金融危机，与适度宽松的货币政策和“四万亿”投资计划同时实施，2009年全国财政赤字合计9500亿元。此后“积极的财政政策”一直沿用到2024年；2020年提出“积极的财政政策要更加积极有为”。第三轮是2025年起的“更加积极的财政政策”：2025年赤字率提高到4%左右，2026年继续按4%左右安排，一般公共预算支出首次达到30万亿元。
  quote:
    text: 继续实施积极的财政政策。这是当前扩大内需最直接和有效的手段。
    cite: i02-gov-2000-gwr
  terms: [积极的财政政策, 积极财政政策, 更加积极的财政政策, 长期建设国债]
  related: [macro-control, industry-revitalization-plans, western-development, supply-side]
  sections:
    - h: 1998年启动
      from: 1998-08
      to: 2004
      text: 2000年政府工作报告说，国债资金重点投向水利、交通、通信等基础设施，加固大江大河大湖堤防近6100公里，并要求“严防“钓鱼”项目和“胡子”工程”。
      cites: [e01-cpc-dsj-1998, i02-gov-2000-gwr]
    - h: 转向稳健
      from: 2005-03
      text: 2005年报告说，鉴于投资规模已经很大、社会资金增加较多，“有必要也有条件由扩张性的积极财政政策转向松紧适度的稳健财政政策”，当年拟发行长期建设国债800亿元。
      cites: [i02-gov-2005-gwr]
    - h: 2008年重启
      from: 2008-09
      to: 2019
      text: 2009年报告说，9月份后国际经济形势急转直下，政府“果断地把宏观调控的着力点转到防止经济增速过快下滑上来”。报告把大幅度增加政府支出称为“扩大内需最主动、最直接、最有效的措施”，并实行结构性减税，全面实施增值税转型。
      cites: [i02-gov-2009-gwr]
    - h: 更加积极
      from: 2020-05
      to: 2026-03
      text: 2020年报告赤字率按3.6%以上安排，另发1万亿元抗疫特别国债。2025年报告说新增政府债务总规模11.86万亿元，“财政支出强度明显加大”。2026年报告“继续实施更加积极的财政政策”，拟发行超长期特别国债1.3万亿元，并要求各级政府“坚决落实过紧日子的要求”。
      cites: [i02-gov-2020-gwr, i02-gov-2025-gwr, i02-gov-2026-gwr]
  policies:
    - date: 1998-08-29
      name: 人大常委会批准增发1000亿元国债
      text: 九届全国人大常委会第四次会议批准财政部向国有商业银行增发1000亿元国债，用于基础设施建设。
      events: [e11-1998-treasury-bonds]
      cite: e01-cpc-dsj-1998
    - date: 2008-11
      name: 四万亿投资计划与积极财政政策重启
      text: 国际金融危机冲击下，国务院实施积极的财政政策和适度宽松的货币政策，推出扩大内需、促进经济增长的十项措施。
      events: [e2008-four-trillion-stimulus]
      cite: i02-gov-2009-gwr
  cites:
    - e01-cpc-dsj-1998
    - i02-gov-2000-gwr
    - i02-gov-2005-gwr
    - i02-gov-2009-gwr
    - i02-gov-2020-gwr
    - i02-gov-2025-gwr
    - i02-gov-2026-gwr

- id: industry-revitalization-plans
  name: 十大产业调整和振兴规划
  en: Ten Industry Adjustment and Revitalization Plans (2009)
  kind: document
  parent: macro-control
  by: [wen-jiabao]
  first:
    date: 2009-01-14
    text: 温家宝主持国务院常务会议，最先通过汽车、钢铁两个规划。
    cite: i11-npc-2009-01-15-auto-steel-plans
    quote: 审议并原则通过汽车产业和钢铁产业调整振兴规划
  codified:
    - date: 2010-03-05
      where: 2010年政府工作报告（回顾2009年工作）
      cite: i02-gov-2010-gwr
      quote: 制定并实施十大重点产业调整振兴规划
  summary: 2009年1月14日至2月25日，温家宝主持的国务院常务会议先后通过汽车、钢铁、纺织、装备制造、船舶、电子信息、轻工、石化、有色金属、物流十个产业的调整振兴规划，作为应对国际金融危机、配合“四万亿”投资的产业政策。汽车规划对小排量乘用车减半征收车辆购置税、补贴农民换购，并“以新能源汽车为突破口”；钢铁规划要求“严格控制钢铁总量，淘汰落后产能，不得再上单纯扩大产能的钢铁项目”。此前热议的房地产业没有列入。2010年政府工作报告一面说已“制定并实施十大重点产业调整振兴规划”，一面承认“部分行业产能过剩矛盾突出”；到2014年报告仍说“部分行业产能严重过剩”。
  quote:
    text: 至此中国十大产业调整振兴规划全部亮相，此前热议的房地产业最终未搭上振兴计划“末班车”。
    cite: i11-chinanews-2009-02-25-ten-plans
  terms: [十大产业调整振兴规划, 十大产业振兴规划, 重点产业调整振兴规划]
  related: [macro-control, proactive-fiscal-policy, guojin-mintui, made-in-china-2025]
  lists:
    - title: 十个产业（2009年1—2月）
      cite: i11-chinanews-2009-02-25-ten-plans
      items:
        - 汽车
        - 钢铁
        - 纺织
        - 装备制造
        - 船舶
        - 电子信息
        - 轻工
        - 石化
        - 有色金属
        - 物流
  sections:
    - h: 密集出台
      from: 2009-01
      to: 2009-02
      text: 中新网梳理，1月14日汽车和钢铁“率先推出调整振兴规划”，2月4日通过纺织工业和装备制造业规划，2月11日船舶，2月18日电子信息，2月19日轻工业和石化，2月25日有色金属和物流。汽车规划提出今后三年中央安排100亿元专项资金，重点支持企业技术创新、技术改造和新能源汽车。
      cites: [i11-chinanews-2009-02-25-ten-plans, i11-npc-2009-01-15-auto-steel-plans]
    - h: 产能过剩
      from: 2010-03
      to: 2014-03
      text: 2010年报告说，政府“下大力气抑制部分行业产能过剩和重复建设”，关停小火电机组、淘汰落后炼钢炼铁和水泥产能。2014年报告要求对产能严重过剩行业“消化一批存量，严控新上增量”。
      cites: [i02-gov-2010-gwr, i02-gov-2014-gwr]
  policies:
    - date: 2009-02-25
      name: 十大产业调整振兴规划
      text: 国务院常务会议在一个多月内先后原则通过十个重点产业的调整振兴规划，配合扩大内需的投资计划。
      events: [e2008-four-trillion-stimulus]
      cite: i11-chinanews-2009-02-25-ten-plans
  cites:
    - i11-npc-2009-01-15-auto-steel-plans
    - i11-chinanews-2009-02-25-ten-plans
    - i02-gov-2009-gwr
    - i02-gov-2010-gwr
    - i02-gov-2014-gwr

- id: lang-gu-debate
  name: 郎顾之争
  en: Lang–Gu Debate
  kind: debate
  by: [lang-xianping, gu-chujun]
  first:
    date: 2004-08-09
    text: 香港中文大学教授郎咸平在复旦大学演讲，指格林柯尔董事长顾雏军在“国退民进”中席卷国家财富。另说演讲在8月10日：《东方早报》8月11日的报道称演讲在“昨日”。
    cite: e07-people-2014-05-04-langgu
    quote: 格林柯尔：在“国退民进”的盛宴中狂欢
  summary: 郎顾之争是2004年8月起香港中文大学教授郎咸平与格林柯尔董事长顾雏军之间的冲突，随即扩大为对国企产权改革和管理层收购（MBO）的全国性争论。郎咸平在复旦大学演讲说，顾雏军收购科龙、美菱、亚星客车、ST襄轴四家公司，号称投资41亿元、实际只投入3亿多元，并把他的手法归纳为“七大板斧”，认为产权改革只是“民企瓜分国资的一场“盛宴””，主张“所有国有资产的移转应该全部停止”。顾雏军先发律师函，8月17日在香港高等法院起诉郎咸平诽谤。张维迎等经济学家随后反驳郎咸平，争论延伸为2004年至2006年的第三次改革论争。2005年7月29日顾雏军因涉嫌挪用上市公司资金被捕，2008年一审被判有期徒刑十年。2019年4月10日最高人民法院再审，撤销虚报注册资本罪和违规披露、不披露重要信息罪，挪用资金罪改判五年，六名同案人宣告无罪；最高法称这是一起“涉产权代表性案件”。
  quote:
    text: 现在的迫切问题也不是国有企业要退出市场竞争，而是政府的干预要退出国有企业。
    cite: i11-sina-2004-08-20-lang-interview
  terms: [郎顾之争, 七大板斧, 七板斧, 国退民进, 管理层收购, MBO]
  related: [neoliberalism-debate, soe-reform, grasp-large-release-small, guojin-mintui, private-economy-promotion-law]
  sides:
    - label: 改制就是瓜分国资，应停止产权转让（郎咸平）
      text: 郎咸平说他和学生研究了3个月，发现顾雏军先在被收购企业担任董事长，大幅提高运营费用制造亏损，再以亏损为由压低收购价。他认为国企的问题“不在所有人缺位，而在职业经理人信托责任的缺位”，中国的MBO“已经变了味，变成了一个掠夺国有资产的方法”。
      who: [lang-xianping]
      cites: [i11-sina-2004-08-11-lang-fudan, i11-ce-2004-08-17-lang-reply, i11-cyol-2004-08-18-gu-sues, i11-sina-2004-08-20-lang-interview]
    - label: 指控歪曲事实、无中生有（顾雏军）
      text: 科龙电器传媒副总裁严友松当时说，“科龙电器的改制是成功的，得到了包括竞争对手在内的业内公认。而郎咸平的说法歪曲了基本事实。”顾雏军2016年出狱后对周放生说，郎咸平“根本完全无中生有来编一个故事”，并称这场风波“使得最后的国企改革嘎然而止”；他还说郎咸平是收了钱写文章，这一说法没有得到调查证实。
      who: [gu-chujun]
      cites: [i11-cyol-2004-08-18-gu-sues, i11-ifeng-2016-06-21-gu-zhou-fangsheng]
    - label: 国企改革主流是好的（张维迎、周放生）
      text: 8月28日，张维迎在深圳座谈会上系统回应郎咸平，称“要善待为社会做出贡献的人”。自称国企改革亲历者的周放生回忆，当时他在《经济观察报》撰文说“国有企业改革的大方向是对的，主流是好的是规范的”，少数企业出现流失，不能把支流和局部问题扩大为对改革的全盘否定。
      who: [zhang-weiying]
      cites: [i08-reformdata-2006-03-16-third-debate, i11-ifeng-2016-06-21-gu-zhou-fangsheng]
    - label: 依法纠错，保护产权（最高人民法院）
      text: 最高法负责人说，再审按照“罪刑法定、疑罪从无、证据裁判”等原则处理民营企业经营中的不规范行为，同时认定挪用2.9亿元资金归个人使用有罪，体现“有错必纠、错到哪里纠到哪里、不搞“一风吹””。
      who: []
      cites: [i11-court-2019-04-10-gu-retrial-qa]
  sections:
    - h: 起因
      from: 2004-08-09
      to: 2004-08-14
      text: 演讲前，郎咸平已质疑海尔、TCL、德隆等企业的改制，被中小股民称为“郎监管”。复旦演讲后《东方早报》《香港商报》刊出摘要。顾雏军方面8月13日发出律师函，要求郎咸平核对报道、要求媒体撤稿道歉并提供讲稿；郎咸平8月14日签收后召开记者会说，“我个人及学术界绝不容许企业家以威胁口吻发律师函来践踏以研究为本的学术自由风气。”
      cites: [i11-sina-2004-08-11-lang-fudan, i11-ce-2004-08-17-lang-reply, i11-cyol-2004-08-18-gu-sues]
    - h: 经过
      from: 2004-08-17
      to: 2005-07-29
      text: 8月17日顾雏军在香港起诉郎咸平。郎咸平当晚在网上答问说，“我已经48岁了”，研究结果只能公开，“我不能掩盖或是放弃”。人民网党史频道的回顾说，郎咸平指出的问题内地学者早已揭露，但他“以情绪化的语言诉诸大众”，吸引了很多人注意。2005年《暂行规定》出台不久，7月29日顾雏军因涉嫌挪用上市公司资金罪被捕，“郎顾之争”似乎结束，但国企改革要不要触动产权的争论仍在继续。
      cites: [i11-cyol-2004-08-18-gu-sues, e07-people-2014-05-04-langgu]
    - h: 官方如何收场
      from: 2008-01-30
      to: 2019-04-10
      text: 2008年1月30日佛山市中级人民法院以虚报注册资本、违规披露不披露重要信息、挪用资金三罪判处顾雏军有期徒刑十年，并处罚金680万元；2009年3月25日广东省高级人民法院驳回上诉。顾雏军刑满后申诉，最高法2017年12月27日决定提审，2018年6月公开开庭。2019年4月10日再审宣判，前两项罪名不再认定，挪用资金罪改判五年。
      cites: [i11-court-2019-04-10-gu-retrial]
    - h: 影响
      from: 2016
      to: 2019-04
      text: 2016年顾雏军与周放生对谈时说，“郎顾之争”使国企改革停了下来；周放生则说郎咸平“既没吃过猪肉，也没看过猪跑”。最高法在宣判答问中把此案与张文中案并列，称“张文中案已被宣告无罪，顾雏军案也得到大幅度的改判”，作为纠正涉产权错案、保护民营企业家的例子。
      cites: [i11-ifeng-2016-06-21-gu-zhou-fangsheng, i11-court-2019-04-10-gu-retrial-qa]
  policies:
    - date: 2019-04-10
      name: 最高人民法院再审改判顾雏军案
      text: 最高法再审撤销顾雏军虚报注册资本罪、违规披露不披露重要信息罪，挪用资金罪改判有期徒刑五年，另六名原审被告人宣告无罪，可依法申请国家赔偿。
      events: []
      cite: i11-court-2019-04-10-gu-retrial
  voices:
    - voice: scholar
      text: 我个人及学术界绝不容许企业家以威胁口吻发律师函来践踏以研究为本的学术自由风气。
      cite: i11-ce-2004-08-17-lang-reply
      quote: true
    - voice: witness
      text: 国有企业改革的大方向是对的，主流是好的是规范的，在这个过程当中也出现了少数企业的一些流失的问题
      cite: i11-ifeng-2016-06-21-gu-zhou-fangsheng
      quote: true
    - voice: official
      text: 本案系我院提审的一起涉产权代表性案件，各方高度关注，社会影响巨大。
      cite: i11-court-2019-04-10-gu-retrial-qa
      quote: true
    - voice: history
      text: 郎咸平以情绪化的语言诉诸大众，再加上其香港学者的特殊身份，吸引了很多人的注意力。
      cite: e07-people-2014-05-04-langgu
      quote: true
  cites:
