- id: modern-chinese-civilization
  name: 中华民族现代文明
  en: Modern Chinese Civilization
  kind: component
  parent: xi-culture-thought
  by: [xi-jinping]
  first:
    date: 2023-06-02
    text: 习近平在文化传承发展座谈会上提出，称之为新时代新的文化使命。
    cite: i05-xinhua-2023-06-02-culture-symposium
    quote: 在新的起点上继续推动文化繁荣、建设文化强国、建设中华民族现代文明，是我们在新时代新的文化使命。
  codified:
    - date: 2023-10-08
      where: 全国宣传思想文化工作会议（提出习近平文化思想）
      cite: i03-gov-2023-10-08-culture-thought
      quote: 继续推动文化繁荣、建设文化强国、建设中华民族现代文明这一新的文化使命
  summary: 2023年6月2日，习近平在中国历史研究院和国家版本馆考察后出席文化传承发展座谈会，提出继续推动文化繁荣、建设文化强国、建设中华民族现代文明，“是我们在新时代新的文化使命”。讲话概括中华文明有连续性、创新性、统一性、包容性、和平性五个突出特性，说“第二个结合”“是又一次的思想解放”，经由“结合”形成的新文化要“成为中国式现代化的文化形态”。同年10月全国宣传思想文化工作会议提出习近平文化思想，把建设中华民族现代文明定为新的文化使命。这一提法把“两个结合”落到文化建设上，并把国家统一写成文明“统一性”的要求。
  quote:
    text: 中国式现代化赋予中华文明以现代力量，中华文明赋予中国式现代化以深厚底蕴。
    cite: i05-xinhua-2023-06-02-culture-symposium
  terms: [中华民族现代文明, 新的文化使命, 五个突出特性]
  related: [xi-culture-thought, two-combinations, cultural-confidence, new-form-human-civilization, chinese-nation-community]
  lists:
    - title: 中华文明的五个突出特性（2023年6月2日）
      cite: i05-xinhua-2023-06-02-culture-symposium
      items:
        - 中华文明具有突出的连续性
        - 中华文明具有突出的创新性
        - 中华文明具有突出的统一性
        - 中华文明具有突出的包容性
        - 中华文明具有突出的和平性
  sections:
    - h: 座谈会讲话
      from: 2023-06
      text: 讲话说统一性“决定了国家统一永远是中国核心利益的核心”，和平性决定了中国“不会把自己的价值观念与政治体制强加于人”。关于“两个结合”，讲话说结合的结果是“让马克思主义成为中国的，中华优秀传统文化成为现代的”。主持会议的蔡奇要求“扎实推进中华民族现代文明和社会主义文化强国建设”。
      cites: [i05-xinhua-2023-06-02-culture-symposium]
    - h: 写入习近平文化思想
      from: 2023-10
      text: 全国宣传思想文化工作会议要求“围绕在新的历史起点上继续推动文化繁荣、建设文化强国、建设中华民族现代文明这一新的文化使命”开展工作。新华社对习近平文化思想的解读把它概括为“聚焦新的文化使命”。
      cites: [i03-gov-2023-10-08-culture-thought, i05-xinhua-2023-10-08-culture-thought-first]
  cites:
    - i05-xinhua-2023-06-02-culture-symposium
    - i03-gov-2023-10-08-culture-thought
    - i05-xinhua-2023-10-08-culture-thought-first

- id: new-type-international-relations
  name: 新型国际关系
  en: New Type of International Relations
  kind: component
  parent: xi-diplomacy-thought
  by: [xi-jinping]
  first:
    date: 2013-03-23
    text: 习近平就任国家主席后首次出访，在莫斯科国际关系学院演讲中提出。
    cite: i11-gov-2013-03-24-xi-mgimo
    quote: 各国应该共同推动建立以合作共赢为核心的新型国际关系
  codified:
    - date: 2017-10-18
      where: 十九大报告
      cite: i01-gov-2017-10-18-19th-report
      quote: 推动建设相互尊重、公平正义、合作共赢的新型国际关系
    - date: 2022-10-16
      where: 二十大报告
      cite: i01-gov-2022-10-16-20th-report
      quote: 中国坚持在和平共处五项原则基础上同各国发展友好合作，推动构建新型国际关系
  summary: 2013年3月23日，习近平在莫斯科国际关系学院演讲说，“各国应该共同推动建立以合作共赢为核心的新型国际关系”，并提出各国共同享受尊严、发展成果和安全保障。2015年联大一般性辩论讲话把它与人类命运共同体并提：“构建以合作共赢为核心的新型国际关系，打造人类命运共同体”。十九大报告把内涵扩展为“相互尊重、公平正义、合作共赢”，并写入新时代思想的“明确”之一；二十大报告要求在和平共处五项原则基础上推动构建新型国际关系。它与“新型大国关系”不同，指的是整个国际秩序的原则，而非中美双边关系。
  quote:
    text: 世界的命运必须由各国人民共同掌握。各国主权范围内的事情只能由本国政府和人民去管，世界上的事情只能由各国政府和人民共同商量来办。
    cite: i11-gov-2013-03-24-xi-mgimo
  terms: [新型国际关系, 合作共赢]
  related: [xi-diplomacy-thought, community-shared-future, right-approach-justice-interests, peaceful-rise, harmonious-world, common-values]
  lists:
    - title: 三个“共同享受”（2013年莫斯科演讲）
      cite: i11-gov-2013-03-24-xi-mgimo
      items:
        - 各国和各国人民应该共同享受尊严
        - 各国和各国人民应该共同享受发展成果
        - 各国和各国人民应该共同享受安全保障
  sections:
    - h: 莫斯科演讲与联大讲话
      from: 2013-03
      to: 2015-09
      text: 莫斯科演讲说，要跟上时代，就不能停留在“冷战思维、零和博弈老框框内”，并说“合作安全、集体安全、共同安全才是解决问题的正确选择”。2015年联大讲话要求“奉行双赢、多赢、共赢的新理念，扔掉我赢你输、赢者通吃的旧思维”。
      cites: [i11-gov-2013-03-24-xi-mgimo, i05-gov-2015-09-29-unga]
    - h: 写入报告
      from: 2017-10
      to: 2022-10
      text: 十九大报告在新时代思想的“八个明确”中写入“中国特色大国外交要推动构建新型国际关系，推动构建人类命运共同体”。二十大报告把推动构建新型国际关系列为过去十年外交成就，并与“全球伙伴关系”“大国关系格局”一起写进外交部署。
      cites: [i01-gov-2017-10-18-19th-report, i01-gov-2022-10-16-20th-report]
  cites:
    - i11-gov-2013-03-24-xi-mgimo
    - i05-gov-2015-09-29-unga
    - i01-gov-2017-10-18-19th-report
    - i01-gov-2022-10-16-20th-report

- id: right-approach-justice-interests
  name: 正确义利观
  en: Correct Approach to Justice and Interests
  kind: component
  parent: xi-diplomacy-thought
  by: [xi-jinping, wang-yi]
  first:
    date: 2013-09-10
    text: 外交部长王毅在《人民日报》撰文转述习近平关于正确义利观的论述；文章说习近平“提出在外交工作中要坚持正确义利观”，未写明首次提出的时间。
    cite: i11-people-2013-09-10-wang-yi-yili
    quote: 利，就是要恪守互利共赢原则，不搞我赢你输，要实现双赢。
  codified:
    - date: 2017-10-18
      where: 十九大报告
      cite: i01-gov-2017-10-18-19th-report
      quote: 秉持正确义利观和真实亲诚理念加强同发展中国家团结合作
    - date: 2022-10-16
      where: 二十大报告
      cite: i01-gov-2022-10-16-20th-report
      quote: 秉持真实亲诚理念和正确义利观加强同发展中国家团结合作
  summary: 正确义利观是习近平提出的外交原则，主要用于处理同发展中国家的关系。王毅2013年9月在《人民日报》撰文引述习近平的阐述：义是“共产党人、社会主义国家的理念”，利是“恪守互利共赢原则，不搞我赢你输，要实现双赢”，对贫穷国家“有时甚至要重义轻利、舍利取义，绝不能惟利是图、斤斤计较”。王毅把援建坦赞铁路和派遣援外医疗队称为“中国外交重义轻利的生动写照”。2015年联大讲话说大国与小国相处要“践行正确义利观，义利相兼，义重于利”。2018年中央外事工作会议说广大发展中国家是“我国在国际事务中的天然同盟军”，要坚持正确义利观。十九大、二十大报告都把它与“真实亲诚”并列为对发展中国家的方针。
  quote:
    text: 我们有义务对贫穷的国家给予力所能及的帮助，有时甚至要重义轻利、舍利取义，绝不能惟利是图、斤斤计较。
    cite: i11-people-2013-09-10-wang-yi-yili
  terms: [正确义利观, 义利观, 义利相兼, 重义轻利]
  related: [new-type-international-relations, xi-diplomacy-thought, belt-and-road, community-shared-future]
  sections:
    - h: 王毅的阐释
      from: 2013-09
      text: 王毅从儒墨孟子讲起，说“重义轻利、先义后利、取利有道”是中华民族的道德准则；又说新中国在自身经济十分困难时仍向亚非拉国家提供帮助，迄今已向66个国家和地区派出援外医疗队员2.3万人次。文章说习近平秉承中华优秀文化和新中国外交传统，“提出在外交工作中要坚持正确义利观”。
      cites: [i11-people-2013-09-10-wang-yi-yili]
    - h: 从联大到外事工作会议
      from: 2015-09
      to: 2022-10
      text: 2015年联大讲话把它放在“建设全球伙伴关系”之下，要求大国之间“不冲突、不对抗、相互尊重、合作共赢”，大国与小国“平等相待”。十九大报告在“坚持推动构建人类命运共同体”一条中写入“坚持正确义利观”。2018年中央外事工作会议要求“做好同发展中国家团结合作的大文章”。
      cites: [i05-gov-2015-09-29-unga, i01-gov-2017-10-18-19th-report, i03-gov-2018-06-23-foreign-affairs-conference]
  voices:
    - voice: official
      text: 可以说，重义轻利、先义后利、取利有道，是中华民族数千年来一以贯之的道德准则和行为规范。
      cite: i11-people-2013-09-10-wang-yi-yili
      quote: true
  cites:
    - i11-people-2013-09-10-wang-yi-yili
    - i05-gov-2015-09-29-unga
    - i03-gov-2018-06-23-foreign-affairs-conference
    - i01-gov-2017-10-18-19th-report
    - i01-gov-2022-10-16-20th-report

- id: two-faced-people
  name: 两面人
  en: Two-Faced Officials
  kind: formula
  parent: strict-governance
  by: [xi-jinping]
  first:
    date: 2016-10-27
    text: 十八届六中全会公报转述《关于新形势下党内政治生活的若干准则》的要求。此前中央纪委2015年的警示材料已用“两面派”形容苏荣。
    cite: i01-cpc-2016-10-27-6th-plenum-communique
    quote: 反对搞两面派、做“两面人”
  codified:
    - date: 2017-10-18
      where: 十九大报告
      cite: i01-gov-2017-10-18-19th-report
      quote: 坚决反对搞两面派、做两面人
    - date: 2019-01-31
      where: 《中共中央关于加强党的政治建设的意见》
      cite: i03-xinhua-2019-02-27-political-building
      quote: 决不允许对党中央阳奉阴违做两面人、搞两面派、搞“伪忠诚”
  summary: “两面人”指当面表忠心、背后另搞一套的干部。2016年十八届六中全会通过的党内政治生活准则要求党员“对党忠诚老实、光明磊落”，“反对搞两面派、做“两面人””；习近平在全会讲话中把“对党不忠诚老实、阳奉阴违、弄虚作假、做“两面人””列为政治性强、破坏力大的问题。十九大报告写入“坚决反对搞两面派、做两面人”。2019年中共中央关于加强党的政治建设的意见要求把“政治上蜕变的两面人及时辨别出来、清除出去”，并在选人用人中“坚决把政治上的两面人挡在门外”。此后它成为中央纪委开除通报的常用定性：2018年鲁炜被称为“典型的“两面人””，2019年陈刚被指“搞两面派、做两面人”。第三个历史决议把清除“两面人”列为十八大以来维护党中央集中统一领导的措施。
  quote:
    text: 对党不忠诚老实、阳奉阴违、弄虚作假、做“两面人”问题，选人用人上任人唯亲、任人唯利和跑官要官、买官卖官、拉票贿选问题，结党营私、拉帮结派、政治野心膨胀问题，等等。这类问题，往往隐蔽性强，不到关键时刻难以暴露。
    cite: b03-xinhua-2017-01-01-xi-6th-plenum
  terms: [两面人, 两面派, 伪忠诚, 做两面人]
  related: [strict-governance, two-safeguards, big-party-unique-problems, four-consciousness]
  sections:
    - h: 由来
      from: 2015-05
      to: 2016-10
      text: 2015年中央纪委发布的苏荣案警示材料说，“两面派，是不少江西干部对苏荣的评价”，有人说他是“人前反腐、人后腐败”。2016年10月六中全会把“两面人”写进党内政治生活准则，与“弄虚作假、虚报浮夸”“隐瞒实情、报喜不报忧”并列为必须反对的行为。
      cites: [b12-xinhua-2015-05-29-su-rong-warning, i01-cpc-2016-10-27-6th-plenum-communique]
    - h: 成为处分定性
      from: 2017-10
      to: 2021-11
      text: 十九大后，“两面人”频繁出现在开除通报中。2018年2月中央纪委通报鲁炜“对党中央极端不忠诚”，“是典型的“两面人””；2019年7月通报陈刚“对党不忠诚不老实，搞两面派、做两面人，对抗组织审查”。2019年的政治建设意见把它和“低级红”“高级黑”、“伪忠诚”并列。2021年历史决议在讲十八大以来的政治建设时写入清除“两面人”。
      cites: [c03-xinhua-2018-02-13-lu-wei-expel, k04-xinhua-2019-07-11-chen-gang-expel, i03-xinhua-2019-02-27-political-building, b04-gov-2021-11-16-resolution]
  policies:
    - date: 2019-01-31
      name: 中共中央关于加强党的政治建设的意见
      text: 意见要求严肃查处“七个有之”问题，把政治上蜕变的两面人辨别出来、清除出去，并在干部考核中建立政治素质识别机制，把政治上的两面人挡在门外。
      events: []
      cite: i03-xinhua-2019-02-27-political-building
  voices:
    - voice: official
      text: 严肃查处“七个有之”问题，把政治上蜕变的两面人及时辨别出来、清除出去，坚决防止党内形成利益集团攫取政治权力、改变党的性质。
      cite: i03-xinhua-2019-02-27-political-building
      quote: true
  cites:
    - b12-xinhua-2015-05-29-su-rong-warning
    - i01-cpc-2016-10-27-6th-plenum-communique
    - b03-xinhua-2017-01-01-xi-6th-plenum
    - i01-gov-2017-10-18-19th-report
    - c03-xinhua-2018-02-13-lu-wei-expel
    - i03-xinhua-2019-02-27-political-building
