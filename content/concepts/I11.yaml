# I11: round-14 new concepts — party-building formulas, Xi-era diplomacy and culture terms, Hu–Wen-era economic policies,
# debates (郎顾之争, 去政治化, 北京共识, 反内卷), two laws, and 两面人 / 天网与猎狐 / 鸟笼经济.

- id: big-party-unique-problems
  name: 大党独有难题
  en: Problems Unique to a Big Party
  kind: formula
  parent: strict-governance
  by: [xi-jinping]
  first:
    date: 2022-10-16
    text: 二十大报告在全面从严治党一章提出。
    cite: i01-gov-2022-10-16-20th-report
    quote: 必须时刻保持解决大党独有难题的清醒和坚定
  codified:
    - date: 2023-12-27
      where: 修订后的《中国共产党纪律处分条例》第二条
      cite: e12-gov-2023-12-27-discipline-regulations
      quote: 推动解决大党独有难题、健全全面从严治党体系
  summary: 二十大报告说，党作为世界上最大的马克思主义执政党，要巩固长期执政地位，“必须时刻保持解决大党独有难题的清醒和坚定”，并说执政、改革开放、市场经济、外部环境四大考验和精神懈怠、能力不足、脱离群众、消极腐败四种危险“将长期存在”。2023年1月9日，习近平在二十届中央纪委二次全会上把难题具体化为六个“如何始终”，说解决这些难题“是全面从严治党适应新形势新要求必须啃下的硬骨头”。同年底修订的《纪律处分条例》把“推动解决大党独有难题”写进第二条；2024年中央纪委三次全会提出推进自我革命的“九个以”，其中一条是“以解决大党独有难题为主攻方向”。
  quote:
    text: 解决这些难题，是实现新时代新征程党的使命任务必须迈过的一道坎，是全面从严治党适应新形势新要求必须啃下的硬骨头。
    cite: i11-gov-2023-01-09-xi-ccdi-2nd-plenum
  terms: [大党独有难题, 六个如何始终, “六个如何始终”]
  related: [strict-governance, self-revolution, historical-cycle, three-musts, two-faced-people]
  lists:
    - title: 六个“如何始终”（2023年1月9日，二十届中央纪委二次全会）
      cite: i11-gov-2023-01-09-xi-ccdi-2nd-plenum
      items:
        - 如何始终不忘初心、牢记使命
        - 如何始终统一思想、统一意志、统一行动
        - 如何始终具备强大的执政能力和领导水平
        - 如何始终保持干事创业精神状态
        - 如何始终能够及时发现和解决自身存在的问题
        - 如何始终保持风清气正的政治生态
    - title: 四大考验与四种危险（二十大报告）
      cite: i01-gov-2022-10-16-20th-report
      items:
        - 执政考验、改革开放考验、市场经济考验、外部环境考验
        - 精神懈怠危险、能力不足危险、脱离群众危险、消极腐败危险
  sections:
    - h: 提出
      from: 2022-10
      to: 2023-01
      text: 二十大报告把大党独有难题放在“四大考验”“四种危险”之前，说经过十八大以来全面从严治党，“我们解决了党内许多突出问题”，但这些考验和危险将长期存在。三个月后，习近平在二十届中央纪委二次全会上列出六个“如何始终”，称这些“都是我们这个大党必须解决的独有难题”。主持会议的李希说，讲话“深刻分析大党独有难题的形成原因、主要表现和破解之道”。
      cites: [i01-gov-2022-10-16-20th-report, i11-gov-2023-01-09-xi-ccdi-2nd-plenum]
    - h: 写进党规与纪委全会
      from: 2023-12
      to: 2024-01
      text: 2023年12月中共中央印发修订后的《中国共产党纪律处分条例》，通知说党中央“着眼解决大党独有难题、健全全面从严治党体系”对条例作了修订。2024年1月二十届中央纪委三次全会公报说，过去一年纪检监察工作“以推动解决大党独有难题、健全全面从严治党体系为目标方向”。《人民日报》评论员文章把“以解决大党独有难题为主攻方向”列为“九个以”之一，要求紧紧围绕“六个如何始终”标本兼治。
      cites: [e12-gov-2023-12-27-discipline-regulations, cs2-ccdi-2024-01-10-ccdi-3rd-plenum, i04-rmrb-2024-01-11-commentator]
  policies:
    - date: 2023-12-27
      name: 修订《中国共产党纪律处分条例》
      text: 中共中央印发修订后的纪律处分条例，第二条要求党的纪律建设“推动解决大党独有难题、健全全面从严治党体系”。
      events: []
      cite: e12-gov-2023-12-27-discipline-regulations
  voices:
    - voice: official
      text: 讲话从新时代新征程党和国家事业发展全局的高度，深刻分析大党独有难题的形成原因、主要表现和破解之道，深刻阐述健全全面从严治党体系的目标任务、实践要求。
      cite: cs2-gov-2023-01-10-ccdi-2nd-plenum
      quote: true
  cites:
    - i01-gov-2022-10-16-20th-report
    - i11-gov-2023-01-09-xi-ccdi-2nd-plenum
    - cs2-gov-2023-01-10-ccdi-2nd-plenum
    - e12-gov-2023-12-27-discipline-regulations
    - cs2-ccdi-2024-01-10-ccdi-3rd-plenum
    - i04-rmrb-2024-01-11-commentator

- id: historical-cycle
  name: 历史周期率与“窑洞对”
  en: The Historical Cycle and the Yan'an Cave Dialogue
  kind: formula
  parent: self-revolution
  by: [xi-jinping]
  first:
    date: 1945-07
    text: 据后来的官方叙述，1945年7月黄炎培访问延安，在毛泽东的窑洞里提出如何跳出兴亡周期律的问题；库内没有当年的原始记录，以下据《人民日报》的转述。
    cite: i04-rmrb-2015-04-20-renzhongping
    quote: 如何找到一条新路，跳出“其兴也勃焉，其亡也忽焉”的周期律
  codified:
    - date: 2017-10-18
      where: 十九大报告
      cite: i01-gov-2017-10-18-19th-report
      quote: 保证干部清正、政府清廉、政治清明，才能跳出历史周期率
    - date: 2022-10-16
      where: 二十大报告
      cite: i01-gov-2022-10-16-20th-report
      quote: 党找到了自我革命这一跳出治乱兴衰历史周期率的第二个答案
  summary: 历史周期率指王朝兴亡“其兴也勃焉，其亡也忽焉”的循环。官方叙述说，1945年7月黄炎培访问延安时向毛泽东提出这一问题，毛泽东的回答被称为“第一个答案”，即“只有让人民来监督政府，政府才不敢松懈”，这段对话称“窑洞对”。十九大报告把反腐败与“跳出历史周期率”连在一起。2021年十九届六中全会上，习近平说党“又给出了第二个答案，这就是自我革命”；2022年1月中央纪委六次全会上他又说两个答案是统一的。二十大报告把“自我革命这一跳出治乱兴衰历史周期率的第二个答案”写进十年成就。另说：《人民日报》任仲平2016年文章写作“历史周期律”，见下文所引。
  quote:
    text: 毛泽东同志在延安的窑洞里给出了第一个答案，这就是“只有让人民来监督政府，政府才不敢松懈”。
    cite: i01-xinhua-2022-01-19-second-answer
  terms: [历史周期率, 历史周期律, 窑洞对, 第二个答案, 跳出历史周期率, 两个答案]
  related: [self-revolution, big-party-unique-problems, strict-governance, third-resolution]
  sections:
    - h: “窑洞对”
      from: 1945-07
      text: 官方纪录片《永远吹冲锋号》解说说，1945年7月初毛泽东迎接黄炎培一行来延安考察，“著名的‘窑洞对’正是发生在这间窑洞里”，毛泽东给出了第一个答案，“那就是‘让人民来监督政府’”。《人民日报》任仲平文章把它与梁启超之问、李约瑟之问并列，称为“黄炎培之问”。
      cites: [b12-chinanews-2023-01-07-bugle-ep1, i04-rmrb-2015-04-20-renzhongping]
    - h: 从反腐到“第二个答案”
      from: 2016-10
      to: 2022-10
      text: 2016年十八届六中全会上，习近平说早在延安时期毛泽东就提出跳出“历史周期率”的课题，党内监督的目的是形成“科学管用的防错纠错机制”。任仲平同期文章说，十八大以来习近平“多次引用‘跳出历史周期律’的窑洞对谈”。2021年11月十九届六中全会上，他提出“第二个答案”；2022年1月十九届中央纪委六次全会上又说，党“外靠发展人民民主、接受人民监督，内靠全面从严治党、推进自我革命”。
      cites: [b03-xinhua-2017-01-01-xi-6th-plenum, i04-rmrb-2016-10-24-renzhongping, i01-xinhua-2022-01-19-second-answer]
  policies:
    - date: 2022-01-18
      name: 十九届中央纪委六次全会阐述“第二个答案”
      text: 习近平在全会上再谈自我革命是跳出历史周期率的“第二个答案”，阐明它与人民监督这一“第一个答案”的统一。
      events: [e08-2022-ccdi-sixth-plenum]
      cite: i01-xinhua-2022-01-19-second-answer
  voices:
    - voice: history
      text: 毛泽东同志和黄炎培探讨跳出历史周期率的问题，给出了第一个答案，那就是“让人民来监督政府”。
      cite: b12-chinanews-2023-01-07-bugle-ep1
      quote: true
    - voice: zh
      text: 中国执政党的意识形态、组织机制与政治现实，排除了出现另一个独立于执政党的政治中心的可能。为避免自体监督的弊病，包含执政党的全体民众是考核领导人的最佳之选。
      cite: i11-zaobao-2021-04-15-huang-zhiping
      quote: true
  cites:
    - i04-rmrb-2015-04-20-renzhongping
    - i01-xinhua-2022-01-19-second-answer
    - b12-chinanews-2023-01-07-bugle-ep1
    - b03-xinhua-2017-01-01-xi-6th-plenum
    - i04-rmrb-2016-10-24-renzhongping
    - i01-gov-2017-10-18-19th-report
    - i01-gov-2022-10-16-20th-report
    - i11-zaobao-2021-04-15-huang-zhiping

- id: four-greats
  name: 四个伟大
  en: The Four Greats
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2017-10-18
    text: 十九大报告以四段排比阐述“伟大斗争、伟大工程、伟大事业、伟大梦想”。
    cite: i01-gov-2017-10-18-19th-report
    quote: 伟大斗争，伟大工程，伟大事业，伟大梦想，紧密联系、相互贯通、相互作用，其中起决定性作用的是党的建设新的伟大工程。
  codified:
    - date: 2017-10-24
      where: 十九大修改的党章总纲
      cite: d01-12371-2017-10-28-party-charter
      quote: 统揽伟大斗争、伟大工程、伟大事业、伟大梦想
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 统揽伟大斗争、伟大工程、伟大事业、伟大梦想
  summary: 十九大报告用四段排比说“实现伟大梦想，必须进行伟大斗争”，“必须建设伟大工程”，“必须推进伟大事业”。伟大梦想指中华民族伟大复兴，伟大工程指“党的建设新的伟大工程”，伟大事业指中国特色社会主义；报告说四者中“起决定性作用的是党的建设新的伟大工程”。同年修改的党章写入党领导人民“统揽伟大斗争、伟大工程、伟大事业、伟大梦想”，第三个历史决议和二十大报告沿用这一句。2019年习近平在中央党校讲话说，这四者“正在如火如荼进行”，要求全党发扬斗争精神。
  quote:
    text: 中华民族伟大复兴，绝不是轻轻松松、敲锣打鼓就能实现的，实现伟大梦想必须进行伟大斗争。
    cite: i05-gov-2019-09-03-struggle-speech
  terms: [四个伟大, 伟大斗争, 伟大工程, 伟大事业, 伟大梦想]
  related: [struggle-spirit, xi-thought, chinese-dream, strict-governance, new-era]
  lists:
    - title: 四个伟大（十九大报告）
      cite: i01-gov-2017-10-18-19th-report
      items:
        - 伟大斗争
        - 伟大工程
        - 伟大事业
        - 伟大梦想
  sections:
    - h: 十九大报告的排比
      from: 2017-10
      text: 报告说伟大斗争“具有许多新的历史特点”，要求“更加自觉地坚持党的领导和我国社会主义制度”；伟大工程“就是我们党正在深入推进的党的建设新的伟大工程”；伟大事业指中国特色社会主义道路、理论、制度、文化。三段都以“实现伟大梦想”开头，把民族复兴放在终点。
      cites: [i01-gov-2017-10-18-19th-report]
    - h: 写入党章与历史决议
      from: 2017-10
      to: 2022-10
      text: 十九大修改的党章总纲说，在新时代思想指导下，中国共产党领导全国各族人民“统揽伟大斗争、伟大工程、伟大事业、伟大梦想”，推动中国特色社会主义进入新时代。2021年第三个历史决议用同一句话概括十八大以来的工作，二十大报告在“新时代十年”部分再次使用。
      cites: [d01-12371-2017-10-28-party-charter, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report]
  voices:
    - voice: official
      text: 当今世界正处于百年未有之大变局，我们党领导的伟大斗争、伟大工程、伟大事业、伟大梦想正在如火如荼进行，改革发展稳定任务艰巨繁重。
      cite: i05-gov-2019-09-03-struggle-speech
      quote: true
  cites:
    - i01-gov-2017-10-18-19th-report
    - d01-12371-2017-10-28-party-charter
    - b04-gov-2021-11-16-resolution
    - i01-gov-2022-10-16-20th-report
    - i05-gov-2019-09-03-struggle-speech

- id: new-security-pattern
  name: 新安全格局
  en: New Security Architecture
  kind: component
  parent: holistic-security
  by: [xi-jinping]
  first:
    date: 2022-10-16
    text: 二十大报告国家安全一章提出。
    cite: i01-gov-2022-10-16-20th-report
    quote: 以新安全格局保障新发展格局
  codified:
    - date: 2024-07-18
      where: 二十届三中全会决定
      cite: i01-gov-2024-07-18-third-plenum-decision
      quote: 有效构建新安全格局
  summary: 二十大报告要求统筹外部安全和内部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全，统筹维护和塑造国家安全，“以新安全格局保障新发展格局”。2023年5月30日二十届中央国家安全委员会第一次会议把它作为国家安全工作的主题，要求“主动塑造于我有利的外部安全环境，更好维护开放安全，推动发展和安全深度融合”。2024年三中全会决定把“有效构建新安全格局”列为到2029年的改革目标之一。新安全格局与新发展格局成对出现，是统筹发展和安全在国家安全领域的具体说法。
  quote:
    text: 要以新安全格局保障新发展格局，主动塑造于我有利的外部安全环境，更好维护开放安全，推动发展和安全深度融合。
    cite: e10-gov-2023-05-30-nsc
  terms: [新安全格局, 以新安全格局保障新发展格局]
  related: [holistic-security, development-and-security, dual-circulation, bottom-line-thinking]
  lists:
    - title: 二十大报告的四个“统筹”
      cite: i01-gov-2022-10-16-20th-report
      items:
        - 外部安全和内部安全
        - 国土安全和国民安全
        - 传统安全和非传统安全
        - 自身安全和共同安全
  sections:
    - h: 从报告到国安委
      from: 2022-10
      to: 2024-07
      text: 二十大报告在国家安全一章的末尾提出以新安全格局保障新发展格局。2023年5月的国安委会议要求“推进维护和塑造国家安全手段方式变革”，完善应对国家安全风险综合体，“实时监测、及时预警”。2024年7月三中全会决定在“聚焦建设更高水平平安中国”一项下写入“有效构建新安全格局”。
      cites: [i01-gov-2022-10-16-20th-report, e10-gov-2023-05-30-nsc, i01-gov-2024-07-18-third-plenum-decision]
  policies:
    - date: 2023-05-30
      name: 二十届中央国家安全委员会第一次会议
      text: 会议要求加快推进国家安全体系和能力现代化，以新安全格局保障新发展格局，推进维护和塑造国家安全手段方式变革。
      events: [e10-2023-nsc-new-security-pattern]
      cite: e10-gov-2023-05-30-nsc
  cites:
    - i01-gov-2022-10-16-20th-report
    - e10-gov-2023-05-30-nsc
    - i01-gov-2024-07-18-third-plenum-decision

- id: new-form-human-civilization
  name: 人类文明新形态
  en: New Form of Human Civilization
  kind: component
  parent: chinese-modernization
  by: [xi-jinping]
  first:
    date: 2021-07-01
    text: 建党一百周年大会讲话提出。
    cite: i05-xinhua-2021-07-01-centenary-speech
    quote: 创造了中国式现代化新道路，创造了人类文明新形态
  codified:
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 党领导人民成功走出中国式现代化道路，创造了人类文明新形态
    - date: 2022-10-16
      where: 二十大报告（中国式现代化的本质要求）
      cite: i01-gov-2022-10-16-20th-report
      quote: 推动构建人类命运共同体，创造人类文明新形态
  summary: 建党百年讲话说，党推动物质文明、政治文明、精神文明、社会文明、生态文明协调发展，“创造了中国式现代化新道路，创造了人类文明新形态”。第三个历史决议说，这条道路“拓展了发展中国家走向现代化的途径”，给那些“既希望加快发展又希望保持自身独立性的国家和民族提供了全新选择”。二十大报告把“创造人类文明新形态”列为中国式现代化本质要求的最后一项。2023年3月习近平在全球政党高层对话会上说，中国式现代化“作为人类文明新形态，与全球其他文明相互借鉴”。这一提法把中国道路从发展模式提升为文明层面的主张，与“全人类共同价值”“全球文明倡议”配套使用。
  quote:
    text: 党领导人民成功走出中国式现代化道路，创造了人类文明新形态，拓展了发展中国家走向现代化的途径，给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了全新选择。
    cite: b04-gov-2021-11-16-resolution
  terms: [人类文明新形态]
  related: [chinese-modernization, community-shared-future, modern-chinese-civilization, global-initiatives, china-model-debate]
  lists:
    - title: 五个文明协调发展（建党百年讲话）
      cite: i05-xinhua-2021-07-01-centenary-speech
      items:
        - 物质文明
        - 政治文明
        - 精神文明
        - 社会文明
        - 生态文明
  sections:
    - h: 从百年讲话到二十大
      from: 2021-07
      to: 2023-03
      text: 2021年7月讲话首次使用这一说法，11月六中全会公报和历史决议都把它写进党的百年奋斗“深刻影响了世界历史进程”一条。2022年中宣部部长李书磊撰文说，“我们创造了人类文明新形态，拓展了发展中国家走向现代化的新途径”。二十大报告把它写入中国式现代化的本质要求；2023年3月全球文明倡议提出时，它被用来说明中国式现代化与其他文明的关系。
      cites: [i05-xinhua-2021-07-01-centenary-speech, e04-gov-2021-11-11-6th-plenum, b15-people-2022-11-10-li-shulei-article, i01-gov-2022-10-16-20th-report, i05-gov-2023-03-15-gci]
  voices:
    - voice: official
      text: 中国式现代化作为人类文明新形态，与全球其他文明相互借鉴，必将极大丰富世界文明百花园。
      cite: i05-gov-2023-03-15-gci
      quote: true
  cites:
