- id: industrial-party
  name: 工业党
  en: Industrial Party
  kind: trend
  first:
    date: 2011
    text: 王小东《中国的工业化将决定中国与世界的命运—兼论“工业党”对决“情怀党”》，载《绿叶》2011 年第 1 期
    cite: i02-guancha-2018-10-25-gongyedang
    quote: 这一命名最早出自王小东2011 年的文章
  summary: 活跃于军事论坛、知乎、观察者网和科技类自媒体的网络话语群体，把工程技术思维、生产力与技术至上理念同国家主义、民族主义立场结合。名称出自王小东 2011 年的文章《中国的工业化将决定中国与世界的命运—兼论“工业党”对决“情怀党”》，文中把主流知识界的左右两派都归为“情怀党”，认为工业化的价值超越政权更替和政治制度。2006 年起源于音速论坛的穿越小说《临高启明》被视为其代表作；评论者马前卒等人进入观察者网后，该网站被一些成员视为第一个以工业党思维为主的网络阵地。研究者吴靖、卢南峰强调，它只是一种思想倾向，并无实体组织。
  terms: [工业党]
  related: [statism, little-pink]
  voices:
    - voice: scholar
      text: “工业党”信奉生产力与技术至上，认为工业化的价值超越政党、政权的更替、政治制度与一时的文化思潮。
      cite: i02-guancha-2018-10-25-gongyedang
      quote: true
    - voice: scholar
      text: 当然需要注意的是，“工业党”只不过是一种思想倾向而不是具有实体的组织，观察者网也不是纯粹的“工业党”的“大本营”。
      cite: i02-guancha-2018-10-25-gongyedang
      quote: true
    - voice: scholar
      text: Wang is an ardent techno-nationalist who believes that industrial might and technological advance are the most meaningful measure of China’s national progress and the only proper source for the Communist Party’s ruling legitimacy.
      zh: 王小东是一位狂热的技术民族主义者，认为工业实力和技术进步是衡量中国国家进步最有意义的标准，也是中共执政合法性唯一正当的来源。
      cite: i02-coso-wang-xiaodong-industrial-party
      quote: true
    - voice: scholar
      text: 我们能识别出一支将工科和工程实践领域的知识方法、生产力和技术至上理念、国家主义和民族主义立场相结合的网络话语力量
      cite: i02-guancha-2019-06-17-gongyedang-pink
      quote: true
  cites:
    - i02-guancha-2018-10-25-gongyedang
    - i02-guancha-2019-06-17-gongyedang-pink
    - i02-coso-wang-xiaodong-industrial-party

- id: little-pink
  name: 网络民族主义 / 小粉红
  en: Online nationalism / Little Pinks
  kind: trend
  by: [hu-xijin]
  first:
    date: 2015
    text: 方可成考证，“小粉红”自 2015 年夏天起才被用来指年轻女性民族主义者
    cite: i02-initium-fang-kecheng-pink
    quote: 自从2015年夏天开始，借由大咕咕咕鸡的张冠李戴，“小粉红”这一称呼以“年轻女性民族主义者”的含义第一次真正出现在公共讨论中
  summary: 中国互联网上的民族主义表达。2008 年前后，Anti-CNN（后改名四月网）等网站以反击西方媒体报道为号召；2010 年代中期起，年轻的民族主义网民被称为“小粉红”。据方可成考证，“小粉红”原是晋江文学城论坛的昵称，2015 年夏天才被用来指年轻女性民族主义者。2016 年 1 月 20 日，百度“帝吧”网民翻墙到蔡英文等人的脸书专页集体留言，蔡英文专页三小时内新增近两万条留言，这次“帝吧出征”让标签广为人知。《环球时报》《半月谈》等官方媒体曾撰文称赞；前《环球时报》总编胡锡进被外媒视为强烈民族主义的代言人。研究者认为，他们与“工业党”同样认同中国崛起，但更多参与消费文化。
  terms: [小粉红, 帝吧出征, 网络民族主义]
  related: [industrial-party, statism]
  voices:
    - voice: zh
      text: 半年之后，帝吧出征，这一称呼的影响力被迅速放大，成为几乎尽人皆知的标签。
      cite: i02-initium-fang-kecheng-pink
      quote: true
    - voice: zh
      text: 活动组织者还制定了“出征”规则，禁止参与者使用侮辱性文字和图片，并表示只反“台独”，不反台湾人民。
      cite: e03-voa-2016-01-21-diba
      quote: true
    - voice: scholar
      text: 相对于“工业党”，“小粉红”群体更加积极地参与消费文化，更加具有多元文化和全球中产阶级的身份特征
      cite: i02-guancha-2019-06-17-gongyedang-pink
      quote: true
    - voice: zh
      text: 胡锡进在微博上拥有超过2400万粉丝，他被看作是强烈民族主义的主要代言人。
      cite: i02-dw-2021-12-16-hu-xijin
      quote: true
  cites:
    - i02-initium-fang-kecheng-pink
    - e03-bbc-2016-01-21-diba
    - e03-voa-2016-01-21-diba
    - i02-guancha-2018-10-25-gongyedang
    - i02-guancha-2019-06-17-gongyedang-pink
    - i02-dw-2021-12-16-hu-xijin
