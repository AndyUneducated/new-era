- id: document-9
  name: 九号文件（“七不讲”）
  en: Document No. 9
  kind: document
  by: [xi-jinping]
  first:
    date: 2013-04-22
    text: 中共中央办公厅印发《关于当前意识形态领域情况的通报》（ChinaFile 译本所载日期）
    cite: i02-chinafile-2013-11-08-document-9
    quote: April 22, 2013
  summary: 2013 年 4 月中共中央办公厅印发的《关于当前意识形态领域情况的通报》，因是当年第 9 号文件而被称为“九号文件”。文件列举七种需要警惕的思潮：宣扬西方宪政民主、“普世价值”、公民社会、新自由主义、西方新闻观、历史虚无主义，以及质疑改革开放和中国特色社会主义的性质；有分析认为网传高校“七不讲”就是它的民间版本。文件没有公开发布，5 月起地方媒体报道学习情况，8 月境外网站刊出全文，《纽约时报》和 ChinaFile 先后报道、翻译。记者高瑜 2014 年被捕，起诉书指她向境外网站泄露这份文件；2015 年她以“为境外非法提供国家秘密罪”一审被判七年，二审改为五年并监外执行。
  quote:
    text: 西方敌对势力和国内异见者还在不断向意识形态领域渗透。
    cite: e03-nytcn-2013-08-20-document-9
  terms: [九号文件, 七不讲, 关于当前意识形态领域情况的通报]
  related: [liberals, charter-08, third-resolution]
  voices:
    - voice: west
      text: 'These warnings were enumerated in a communiqué circulated within the Party by its General Office in April, and, because they constituted the ninth such paper issued this year, have come to be known as “Document 9.”'
      zh: 这些警示列在中共中央办公厅 4 月在党内传达的一份通报里，因为是当年第九份此类文件，后来被称为“九号文件”。
      cite: i02-chinafile-2013-11-08-document-9
      quote: true
    - voice: zh
      text: 这种……七不讲……的政策内容在体制内是一直执行的政策，《通报》的内容也仅在强调中共一贯的大方向，并无多少新意
      cite: e03-bbc-2013-05-13-document-9
      quote: true
    - voice: official
      text: 2013年8月，某境外网站全文刊发了一份中央机密文件，随后多家网站进行转载，引起了社会广泛关注。
      cite: i02-chinanews-2015-04-17-gao-yu
      quote: true
    - voice: west
      text: '“Document 9,” as it would come to be called, heralded the tone of the new Xi Jinping administration. It laid bare many major themes of Xi’s tenure: a disdain for genuine, grassroots civil society; a reassertion of Party control over any and all media messaging; an insistence that the Party alone can describe and interpret history.'
      zh: 后来被称为“九号文件”的这份文件，为习近平新一届领导层定下了基调。它揭示了习近平任内的许多主题：轻视真正的、草根的公民社会；重申党对一切媒体信息的控制；坚持只有党才能叙述和解释历史。
      cite: i02-chinafile-2023-document-9-10-years
      quote: true
  cites:
    - i02-chinafile-2013-11-08-document-9
    - e03-bbc-2013-05-13-document-9
    - e03-nytcn-2013-08-20-document-9
    - i02-chinanews-2015-04-17-gao-yu
    - i02-bbc-2015-04-17-gao-yu
    - i02-rfa-2015-11-26-gao-yu-appeal
    - i02-chinafile-2023-document-9-10-years

- id: third-resolution
  name: 第三个历史决议
  en: Resolution on the Major Achievements and Historical Experience of the Party over the Past Century
  kind: document
  by: [xi-jinping]
  codified:
    - date: 2021-11-11
      where: 中共十九届六中全会
      cite: b04-gov-2021-11-16-resolution
      quote: 党确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位，反映了全党全军全国各族人民共同心愿，对新时代党和国家事业发展、对推进中华民族伟大复兴历史进程具有决定性意义。
  summary: 《中共中央关于党的百年奋斗重大成就和历史经验的决议》，2021 年 11 月 11 日由十九届六中全会通过，是继 1945 年《关于若干历史问题的决议》、1981 年《关于建国以来党的若干历史问题的决议》之后的第三份历史决议。决议称前两份决议的基本论述和结论至今仍然适用，以大量篇幅叙述十八大以来的“新时代”，写明党确立习近平的核心地位和习近平思想的指导地位（后称“两个确立”），并称意识形态领域形势发生“全局性、根本性转变”。BBC 指出全会公报没有着墨于历史错误，决议对“六四”沿用原有说法；有学者认为它为习近平连任铺路，也有学者认为它没有前两份决议那样的路线转变。
  quote:
    text: 党的十八大以来，中国特色社会主义进入新时代。
    cite: b04-gov-2021-11-16-resolution
  terms: [党的百年奋斗重大成就和历史经验, 第三个历史决议]
  related: [two-establishes, xi-thought, new-era, core]
  voices:
    - voice: zh
      text: 与40年前邓小平主导的上一份决议批判中共一些错误做法不同，已公布的公报未着墨于任何历史错误，而是称中共过去一百年“书写了中华民族几千年历史上最恢宏的史诗”。
      cite: i02-bbc-2021-11-12-third-resolution
      quote: true
    - voice: zh
      text: 这次全会通过历史决议，是给他的权威封印了。”陈道银说。
      cite: i02-bbc-2021-11-19-resolution-analysis
      quote: true
    - voice: zh
      text: 唯辛还表示，这份历史决议表明中国的体制已经完成转型，宣告过去三十年中共威权主义统治结束，确立了新的极权主义体制
      cite: i02-bbc-2021-11-19-resolution-analysis
      quote: true
    - voice: zh
      text: 悉尼科技大学中国研究学副教授冯崇义认为，中共前两个历史决议都有重大的改变，而这次却没有任何的重大变化
      cite: i02-abc-2021-11-12-resolution
      quote: true
  cites:
    - b04-gov-2021-11-16-resolution
    - i02-bbc-2021-11-12-third-resolution
    - i02-bbc-2021-11-19-resolution-analysis
    - i02-abc-2021-11-12-resolution

- id: charter-08
  name: 零八宪章
  en: Charter 08
  kind: document
  by: [liu-xiaobo, bao-tong, gao-yu, he-weifang]
  first:
    date: 2008-12-09
    text: BBC 中文报道宪章内容与首批 303 名签署人；刘晓波此前一晚被北京警方带走
    cite: e02-bbc-2008-12-09-charter08
    quote: 这个“宪章”获得了303名著名学者及作家等的签署。
  summary: 2008 年 12 月公布的公民政治改革文件，由刘晓波等人起草，首批 303 人联署，签署人包括鲍彤、丁子霖、高瑜、戴晴等，法学家贺卫方也曾联署。宪章借《世界人权宣言》发表 60 周年之机，主张“自由、平等、人权是人类共同的普世价值”，提出修改宪法、分权制衡、司法独立、在民主宪政架构下建立中华联邦共和国等主张。刘晓波在宪章公布前夕被带走，2009 年 12 月以“煽动颠覆国家政权罪”被判十一年。2010 年他获诺贝尔和平奖，中国外交部称这是“对和平奖的亵渎”；2017 年他在服刑期间获保外就医，同年 7 月病逝。
  quote:
    text: 自由、平等、人权是人类共同的普世价值；民主、共和、宪政是现代政治的基本制度架构。
    cite: i02-rfa-2016-07-13-charter08-text
  terms: [零八宪章, 08宪章]
  related: [liberals, document-9]
  voices:
    - voice: witness
      text: 抽离了这些普世价值和基本政制架构的“现代化”，是剥夺人的权利、腐蚀人性、摧毁人的尊严的灾难过程。
      cite: i02-rfa-2016-07-13-charter08-text
      quote: true
    - voice: official
      text: 刘晓波是因触犯中国法律而被中国司法机关判处徒刑的罪犯，其所作所为与诺贝尔和平奖的宗旨背道而驰。诺委会把和平奖授予这样一个人，完全违背了该奖项的宗旨，也是对和平奖的亵渎。
      cite: b10-mfa-2010-10-08-liu-nobel
      quote: true
    - voice: west
      text: The Norwegian Nobel Committee has decided to award the Nobel Peace Prize for 2010 to Liu Xiaobo for his long and non-violent struggle for fundamental human rights in China.
      zh: 挪威诺贝尔委员会决定将 2010 年诺贝尔和平奖授予刘晓波，以表彰他长期以非暴力方式为中国基本人权所作的斗争。
      cite: b10-nobel-2010-10-08-press-release
      quote: true
    - voice: west
      text: he was a leading author behind Charter 08, the manifesto of such rights in China which was published on the 60th anniversary of the United Nations’ Universal Declaration of Human Rights, the 10th of December 2008.
      zh: 他是《零八宪章》的主要作者之一；这份关于中国人权的宣言发表于联合国《世界人权宣言》60 周年，即 2008 年 12 月 10 日。
      cite: b10-nobel-2010-10-08-press-release
      quote: true
  cites:
    - e02-bbc-2008-12-09-charter08
    - i02-rfa-2016-07-13-charter08-text
    - e02-bbc-2009-12-25-liu-sentenced
    - b10-nobel-2010-10-08-press-release
    - b10-mfa-2010-10-08-liu-nobel
    - b10-bbc-2017-07-13-liu-obit
    - i02-rfa-2019-09-27-he-weifang

# ---- trends

- id: liberals
  name: 自由派 / 宪政派
  en: Liberals / constitutionalists
  kind: trend
  by: [mao-yushi, qin-hui, he-weifang, xu-zhangrun]
  summary: 主张市场经济、法治、宪政民主、司法独立和公民权利的知识分子思潮。代表人物有经济学家茅于轼、历史学家秦晖、法学家贺卫方和许章润等；阵地包括 1993 年创办的天则经济研究所、时政杂志《炎黄春秋》和 2009 年创办的共识网，重要文本有《零八宪章》和许章润 2018 年的《我们当下的恐惧与期待》。2013 年九号文件把宣扬西方宪政民主、“普世价值”、公民社会列为错误思潮。此后这些阵地相继关闭：《炎黄春秋》2016 年 7 月因主管单位改组编辑部而宣布停刊，共识网同年 10 月被令关闭，天则所 2019 年被取缔；贺卫方的微博、微信相继被封，许章润 2019 年被停职、2020 年被清华大学开除。2021 年历史决议要求警惕西方所谓“宪政”等政治思潮。
  terms: [自由派, 宪政, 普世价值]
  related: [document-9, charter-08, new-left]
  voices:
    - voice: zh
      text: “天则研究所”上世纪90年代由茅于轼和盛洪等自由派学者共同创立，和敢言杂志“炎黄春秋”、思想文化网站“共识网”等，被视为自由派阵地。
      cite: i02-rfa-2019-08-28-unirule
      quote: true
    - voice: zh
      text: 我们是民间的独立智库，温和而富于建设性，取缔我们并不难……难的是如何让大家相信这种行为合法合宪
      cite: i02-bbc-2019-08-30-unirule
      quote: true
    - voice: zh
      text: 在意识形态上向毛时代回归，才会采取这种打压言论自由，思想学术自由的举措，跟现在最高领导人的思想意识是有关联的。
      cite: i02-rfa-2019-08-28-unirule
      quote: true
    - voice: doc
      text: 必须警惕和防范西方所谓“宪政”、多党轮流执政、“三权鼎立”等政治思潮的侵蚀影响。
      cite: b04-gov-2021-11-16-resolution
      quote: true
  cites:
