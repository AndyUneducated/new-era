- id: new-left
  name: 新左派
  en: New Left
  kind: trend
  by: [hu-angang]
  first:
    date: 1994-07-21
    text: 《北京青年报》上杨平评论崔之元的文章时称中国出现了“新左派”（李扬考证，据维基百科转述）
    cite: i02-wiki-new-left
    quote: 据李扬考证，中国“新左派”的称谓最早出现在1994年7月21日
  summary: 1990 年代形成的知识分子思潮，批评市场化、私有化和全球化造成的不平等，认为国家力量可以纠正市场带来的不公，也带有民族主义和批评西方的色彩。“新左派”这一称谓 1994 年出现在评论崔之元文章的报道中；汪晖在《天涯》发表《当代中国的思想状况与现代性问题》，引发新左派与自由派的论战。代表人物有汪晖、崔之元、甘阳、王绍光、胡鞍钢等，汪晖等人起初拒绝这一标签。2000 年代北京的乌有之乡书店是其主要聚会场所，部分学者曾为“重庆模式”作理论论证。研究者 David Ownby 认为，经过重庆模式的失败和 2008 年金融危机，新左派逐渐由体制批评者转为体制支持者。
  terms: [新左派]
  related: [maoist-left, statism, liberals]
  voices:
    - voice: west
      text: Their recommendations and criticisms are, instead, based on a belief that state power can redress the injustices created by free markets, privatization and globalization. Their views are also characterized by a fierce nationalism and criticism of the West.
      zh: 他们的主张和批评基于这样一种信念：国家权力可以纠正自由市场、私有化和全球化造成的不公。他们的观点还带有强烈的民族主义和对西方的批评。
      cite: i02-nbc-2009-new-left
      quote: true
    - voice: zh
      text: 至于那些不遗余力地为重庆当局出谋划策，进行理论论证的新左学人们面临的尴尬可以说是不言而喻。
      cite: i02-bbc-2012-02-27-chongqing-trends
      quote: true
    - voice: scholar
      text: The Chongqing model and its unhappy fate was one turning point through which the New Left slowly transformed from regime critics to regime supporters.
      zh: 重庆模式及其不幸的结局是一个转折点，新左派由此逐渐从体制批评者变成体制支持者。
      cite: i02-cbr-2024-05-16-new-left-state
      quote: true
    - voice: scholar
      text: he now favorably compares what he calls China’s “responsive democracy” to the failure of Western “representative democracy” (or “electocracy”)
      zh: 如今他（王绍光）把他所说的中国“回应型民主”与西方“代表型民主”（或“选主”）的失败相对照，予以肯定。
      cite: i02-cbr-2024-05-16-new-left-state
      quote: true
  cites:
    - i02-nbc-2009-new-left
    - i02-cbr-2024-05-16-new-left-state
    - i02-bbc-2012-02-27-chongqing-trends
    - i02-wiki-new-left

- id: maoist-left
  name: 毛左
  en: Maoist left
  kind: trend
  summary: 以毛泽东为旗帜、批评市场化改革的民间左翼，常被称为毛左或老左派，乌有之乡网站被视为其舆论大本营，活跃人物有张宏良和乌有之乡负责人范景刚等。他们曾公开支持薄熙来和“重庆模式”。2012 年 3 月薄熙来被免去重庆市委书记后，乌有之乡被要求删除直接支持他的文章；4 月 6 日国新办、北京网管和公安部门以网站“发布违反宪法，恶意攻击国家领导人，妄议十八大的文章”为由，令其关闭整顿一个月。2018 年深圳佳士工人维权中，来自乌有之乡的四十多名党员和退休干部与北大毕业生岳昕等马克思主义青年到场声援；8 月 24 日警方带走数十名左翼维权者，年底仍有 29 人失去自由。
  terms: [毛左, 乌有之乡]
  related: [new-left, statism]
  voices:
    - voice: zh
      text: 被视为毛泽东左派舆论大本营的乌有之乡网站，早在薄熙来下台那天就开始宕机
      cite: i02-voa-2012-04-06-utopia
      quote: true
    - voice: zh
      text: 在中国当局撤销中共政治局委员薄熙来兼任的中共重庆市委书记职务之后，中国的一些左翼学者出面公开发表支持薄熙来的言论，似乎让中国最高层感到愤怒。
      cite: i02-bbc-2012-04-06-utopia
      quote: true
    - voice: zh
      text: 对于此次被关闭整顿一个月，是否与重庆事件有关，范景刚表示，“很可能有关，但还不能确定。”
      cite: i02-rfi-2012-04-06-utopia
      quote: true
    - voice: scholar
      text: 香港大学社会学系教授潘毅对BBC中文表示，此次行动由工人自发，随后得到高校学生和国内的一些左派人士的支援，并不是由国内左派人士主导。
      cite: i02-bbc-2018-08-16-jasic
      quote: true
  cites:
    - i02-voa-2012-04-06-utopia
    - i02-bbc-2012-04-06-utopia
    - i02-rfi-2012-04-06-utopia
    - i02-bbc-2012-02-27-chongqing-trends
    - i02-bbc-2018-08-16-jasic
    - i02-bbc-2018-12-28-left-youth

- id: statism
  name: 国家主义
  en: Statism
  kind: trend
  by: [zhang-weiwei, hu-angang]
  summary: 2000 年代在知识界兴起、把国家强大和国家能力视为首要价值的思潮，与新左派、民族主义多有交叉。许纪霖 2011 年的批判文章梳理了它的几条脉络：刘小枫引入施米特学说，强世功据此论证党的意志是成文宪法之上的不成文宪法，强调政治就是分清敌友；张维为称“政府是必要的善”，潘维强调中国有一个先进的执政集团，王绍光把“高适应性体制”视为制度自信的依据。胡鞍钢 2017 年发表中国综合国力已超越美国的研究，2018 年千余名清华校友联署要求解除其职务，《环球时报》评论也称“过度的实力自信在中国没有市场”。2021 年 5 月中央政治局就国际传播能力建设集体学习，由张维为作讲解。
  terms: [国家主义, 中国模式]
  related: [new-left, industrial-party, little-pink]
  voices:
    - voice: scholar
      text: 国家主义是一种去政治化的政治，去价值的价值、去意识型态的意识型态。国家的价值目标变得无关紧要，唯一重要的只是国家自身的强大。
      cite: i02-aisixiang-xu-jilin-statism
      quote: true
