# I06: Xi-era policy slogans and the chain from slogan to policy to event.

- id: poverty-alleviation
  name: 精准扶贫 / 脱贫攻坚
  en: Targeted Poverty Alleviation
  kind: formula
  by: [xi-jinping]
  first:
    date: 2013-11-03
    text: 习近平在湖南湘西花垣县十八洞村座谈时提出“精准扶贫”。
    cite: i06-jhsjk-2013-11-03-shibadong
    quote: 要精准扶贫，切忌喊口号，也不要定好高骛远的目标
  codified:
    - date: 2015-10-29
      where: 十八届五中全会公报
      cite: i01-moe-2015-10-29-5th-plenum-communique
      quote: 实施脱贫攻坚工程，实施精准扶贫、精准脱贫
    - date: 2017-10-18
      where: 十九大报告
      cite: i01-gov-2017-10-18-19th-report
      quote: 坚持精准扶贫、精准脱贫
  summary: 精准扶贫是习近平2013年11月在湘西十八洞村提出的扶贫方法，要求把扶贫对象、项目、资金和干部落实到户到村。2015年中共中央、国务院作出《关于打赢脱贫攻坚战的决定》，把到2020年现行标准下农村贫困人口全部脱贫定为全面小康的硬任务；十九大把“精准脱贫”列为三大攻坚战之一。2021年2月25日，习近平宣布脱贫攻坚战“取得了全面胜利”。外界的讨论集中在贫困线标准偏低和脱贫成果能否持续。
  quote:
    text: 现行标准下9899万农村贫困人口全部脱贫，832个贫困县全部摘帽，12.8万个贫困村全部出列，区域性整体贫困得到解决，完成了消除绝对贫困的艰巨任务
    cite: i06-gov-2021-02-25-poverty-speech
  terms: [精准扶贫, 脱贫攻坚]
  related: [three-tough-battles, rural-revitalization, xiaokang, common-prosperity]
  lists:
    - title: 六个精准（全国脱贫攻坚总结表彰大会讲话，2021）
      cite: i06-gov-2021-02-25-poverty-speech
      items: [扶持对象, 项目安排, 资金使用, 措施到户, 因村派人, 脱贫成效]
    - title: 五个一批（全国脱贫攻坚总结表彰大会讲话，2021）
      cite: i06-gov-2021-02-25-poverty-speech
      items: [发展生产, 易地搬迁, 生态补偿, 发展教育, 社会保障兜底]
  sections:
    - h: 提出
      from: 2013-11
      to: 2015-11
      text: 2013年11月3日，习近平在湘西十八洞村座谈时说“扶贫要实事求是，因地制宜。要精准扶贫，切忌喊口号”，并提出发展生产、基本公共保障、下一代教育三件事要做实。2015年10月十八届五中全会公报写入“实施脱贫攻坚工程，实施精准扶贫、精准脱贫”。同年11月29日的《关于打赢脱贫攻坚战的决定》把目标定为“到2020年，稳定实现农村贫困人口不愁吃、不愁穿，义务教育、基本医疗和住房安全有保障”，即后来所说的“两不愁三保障”。
      cites: [i06-jhsjk-2013-11-03-shibadong, i01-moe-2015-10-29-5th-plenum-communique, i06-gov-2015-12-07-poverty-decision]
    - h: 落实机制
      from: 2015
      to: 2020
      text: 决定要求抓好“精准识别、建档立卡这个关键环节”，按扶持对象、项目安排、资金使用、措施到户、因村派人、脱贫成效“六个精准”的要求，对贫困户实行有进有出的动态管理，并对搞“数字脱贫”的弄虚作假严肃追究责任。习近平2021年的总结讲话说，中西部22个省份党政主要负责同志向中央签署脱贫攻坚责任书、立下“军令状”，全国累计选派25.5万个驻村工作队、300多万名第一书记和驻村干部；8年间各级财政专项扶贫资金累计投入近1.6万亿元。2020年6月，国务院副总理胡春华出席会议，督战尚未摘帽的52个贫困县。
      cites: [i06-gov-2015-12-07-poverty-decision, i06-gov-2021-02-25-poverty-speech, b09-xinhua-2020-06-18-hu-poverty]
    - h: 宣告胜利与过渡期
      from: 2021-02
      text: 2021年2月25日全国脱贫攻坚总结表彰大会上，习近平宣布“我国脱贫攻坚战取得了全面胜利”，并说960多万人通过易地扶贫搬迁“挪穷窝”。讲话同时要求对脱贫县“设立过渡期，保持主要帮扶政策总体稳定”，“坚决守住不发生规模性返贫的底线”，工作重心转向巩固脱贫成果同乡村振兴衔接。二十大报告把这一成果概括为“历史性地解决了绝对贫困问题”。
      cites: [i06-gov-2021-02-25-poverty-speech, i01-gov-2022-10-16-20th-report]
    - h: 标准之争
      from: 2021-02
      text: BBC中文网指出，中国2020年的脱贫收入标准为人均年收入4000元人民币左右，另加“不愁吃不愁穿”和教育、医疗、住房保障；若按经合组织以收入中位数一半划线，年收入13770元以下即为贫困人口。文章还提到李克强2020年5月所说的“6亿中低收入及以下人群，他们平均每个月的收入也就1000元左右”。《三联生活周刊》的评论则认为，中国的相对贫困问题仍然严峻，已脱贫人口也有返贫可能。
      cites: [i06-bbc-2021-02-25-poverty, i06-bbc-2021-02-27-poverty-numbers]
  policies:
    - date: 2015-11-29
      name: 中共中央 国务院关于打赢脱贫攻坚战的决定
      text: 确定到2020年现行标准下农村贫困人口实现脱贫、贫困县全部摘帽的目标，建立建档立卡、驻村帮扶、第三方评估等机制。
      cite: i06-gov-2015-12-07-poverty-decision
    - date: 2017-10-18
      name: 十九大把精准脱贫列为三大攻坚战之一
      text: 十九大报告要求“坚决打好防范化解重大风险、精准脱贫、污染防治的攻坚战”，“做到脱真贫、真脱贫”。
      events: [e03-2017-xi-thought-in-charter]
      cite: i01-gov-2017-10-18-19th-report
    - date: 2021-02-25
      name: 全国脱贫攻坚总结表彰大会
      text: 宣布脱贫攻坚战全面胜利，并为脱贫县设立过渡期。
      cite: i06-gov-2021-02-25-poverty-speech
  voices:
    - voice: scholar
      text: 脱贫是习近平谈得最多的一件事，这是他执政的一大政绩，按照中国自己的贫困线标准最容易做也最容易彰显成果
      cite: i06-bbc-2021-02-25-poverty
      quote: true
    - voice: west
      text: BBC中文网比较了中外贫困线：联合国发展署的全球绝对贫困线为人均日收入1.9美元，约合年收入4496元；按世界银行以收入中位数三分之一划线，中国年收入不足9180元者为贫困人口。
      cite: i06-bbc-2021-02-27-poverty-numbers
  cites: [i06-jhsjk-2013-11-03-shibadong, i01-moe-2015-10-29-5th-plenum-communique, i06-gov-2015-12-07-poverty-decision, i01-gov-2017-10-18-19th-report, b09-xinhua-2020-06-18-hu-poverty, i06-gov-2021-02-25-poverty-speech, i01-gov-2022-10-16-20th-report, i06-bbc-2021-02-25-poverty, i06-bbc-2021-02-27-poverty-numbers]

- id: three-tough-battles
  name: 三大攻坚战
  en: Three Tough Battles
  kind: formula
  by: [xi-jinping]
  first:
    date: 2017-10-18
    text: 十九大报告在决胜全面建成小康社会一节提出。
    cite: i01-gov-2017-10-18-19th-report
    quote: 特别是要坚决打好防范化解重大风险、精准脱贫、污染防治的攻坚战
  codified:
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 打好防范化解重大风险、精准脱贫、污染防治三大攻坚战等重大决策
  summary: 三大攻坚战指防范化解重大风险、精准脱贫、污染防治，是十九大为2017至2020年“决胜全面建成小康社会”定下的三项重点任务。2018年起历年政府工作报告按这三项汇报进展，财政支出向三大攻坚战倾斜。2021年政府工作报告说三大攻坚战“主要目标任务如期完成”，此后精准脱贫转为巩固脱贫成果和乡村振兴，污染防治并入碳达峰碳中和工作，防风险则延续到房地产和地方债务领域。
  terms: [三大攻坚战]
  related: [poverty-alleviation, xiaokang, ecological-civilization, three-red-lines, dual-carbon]
  lists:
    - title: 三大攻坚战（十九大报告，2017）
      cite: i01-gov-2017-10-18-19th-report
      items: [防范化解重大风险, 精准脱贫, 污染防治]
  sections:
    - h: 提出
      from: 2017-10
      text: 十九大报告说，从现在到2020年是全面建成小康社会决胜期，要“突出抓重点、补短板、强弱项，特别是要坚决打好防范化解重大风险、精准脱贫、污染防治的攻坚战，使全面建成小康社会得到人民认可、经得起历史检验”。
      cites: [i01-gov-2017-10-18-19th-report]
    - h: 年度部署
      from: 2018-03
      to: 2020
      text: 2018年政府工作报告要求“加大对三大攻坚战的支持”，2019年报告总结“三大攻坚战开局良好”：宏观杠杆率趋于稳定，农村贫困人口减少1386万，易地扶贫搬迁280万人。2021年报告称“坚决打好三大攻坚战，主要目标任务如期完成”，对工作难度大的贫困县和贫困村挂牌督战。
      cites: [i02-gov-2018-gwr, i02-gov-2019-gwr, i02-gov-2021-gwr]
    - h: 收官之后
      from: 2020-12
      text: 2020年底中央经济工作会议要求“继续打好污染防治攻坚战，实现减污降碳协同效应”，污染防治并入碳达峰碳中和工作；脱贫攻坚在2021年2月宣布完成后转入过渡期。第三个历史决议把“打好防范化解重大风险、精准脱贫、污染防治三大攻坚战”列为十八大以来经济工作的重大决策之一。
      cites: [i06-gov-2020-12-18-cewc, i06-gov-2021-02-25-poverty-speech, b04-gov-2021-11-16-resolution]
  policies:
    - date: 2018-03-05
      name: 政府工作报告把三大攻坚战列为年度重点
      text: 财政支出加大对三大攻坚战的支持，各项目标按年分解。
      cite: i02-gov-2018-gwr
    - date: 2020-08-20
      name: 房企融资“三条红线”
      text: 防范化解重大风险延伸到房地产融资，住建部和人民银行对重点房企设定资金监测和融资管理规则。
      events: [e08-2020-three-red-lines]
      cite: e08-jjckb-2020-08-28-three-red-lines
  cites: [e08-jjckb-2020-08-28-three-red-lines, i01-gov-2017-10-18-19th-report, i02-gov-2018-gwr, i02-gov-2019-gwr, i02-gov-2021-gwr, i06-gov-2020-12-18-cewc, i06-gov-2021-02-25-poverty-speech, b04-gov-2021-11-16-resolution]

- id: rural-revitalization
  name: 乡村振兴
  en: Rural Revitalization
  kind: formula
  by: [xi-jinping]
  first:
    date: 2017-10-18
    text: 十九大报告把“实施乡村振兴战略”列为建设现代化经济体系的一项任务。
    cite: i01-gov-2017-10-18-19th-report
    quote: 农业农村农民问题是关系国计民生的根本性问题
  codified:
    - date: 2022-10-22
      where: 党章（二十大修改后文本）列举的七大战略
      cite: i01-12371-2022-10-22-party-charter
      quote: 创新驱动发展战略、乡村振兴战略、区域协调发展战略
  summary: 乡村振兴战略由十九大提出，总要求是“产业兴旺、生态宜居、乡风文明、治理有效、生活富裕”，2018年中央一号文件为它定下2020、2035、2050年三步时间表。2021年脱贫攻坚宣布完成后，“三农”工作重心转向“巩固拓展脱贫攻坚成果同乡村振兴有效衔接”；二十大报告改提“全面推进乡村振兴”“加快建设农业强国”，并重申十八亿亩耕地红线。2024年主管部门农业农村部的部长唐仁健落马，次年以受贿罪被判死缓。
  terms: [乡村振兴]
  related: [poverty-alleviation, xiaokang, common-prosperity, chinese-modernization]
  lists:
    - title: 乡村振兴战略的总要求（2018年中央一号文件）
      cite: i06-gov-2018-02-04-rural-revitalization
      items: [产业兴旺, 生态宜居, 乡风文明, 治理有效, 生活富裕]
  sections:
    - h: 提出
      from: 2017-10
      to: 2018-02
      text: 十九大报告说“农业农村农民问题是关系国计民生的根本性问题”，要求坚持农业农村优先发展。2018年中央一号文件《关于实施乡村振兴战略的意见》设定目标：到2020年“制度框架和政策体系基本形成”，到2035年“农业农村现代化基本实现”，到2050年“乡村全面振兴，农业强、农村美、农民富全面实现”，并要求“五级书记抓乡村振兴”。
      cites: [i01-gov-2017-10-18-19th-report, i06-gov-2018-02-04-rural-revitalization]
    - h: 接续脱贫攻坚
      from: 2021-02
      text: 习近平在脱贫攻坚总结表彰大会上要求“切实做好巩固拓展脱贫攻坚成果同乡村振兴有效衔接各项工作”，保留驻村第一书记和工作队、东西部协作、对口支援等制度。十九届五中全会公报把“脱贫攻坚成果巩固拓展，乡村振兴战略全面推进”列为“十四五”目标。
      cites: [i06-gov-2021-02-25-poverty-speech, e04-xinhua-2020-10-29-5th-plenum]
    - h: 农业强国
      from: 2022-10
      text: 二十大报告说“全面建设社会主义现代化国家，最艰巨最繁重的任务仍然在农村”，提出“加快建设农业强国，扎实推动乡村产业、人才、文化、生态、组织振兴”，要求“牢牢守住十八亿亩耕地红线”。2023年中央一号文件发布后，《人民日报》社论说文件对“全面推进乡村振兴，加快建设农业强国，具有重大指导意义”。
      cites: [i01-gov-2022-10-16-20th-report, i04-rmrb-2023-02-14-editorial]
    - h: 主管部长落马
      from: 2024-05
      to: 2025-09
      text: 2024年5月18日，中央纪委国家监委宣布农业农村部党组书记、部长唐仁健接受审查调查。2025年9月28日，长春市中级人民法院以受贿罪判处唐仁健死刑，缓期二年执行。
      cites: [c03-ccdi-2024-05-18-tang-renjian-probe, c03-xinhua-2025-09-28-tang-renjian-verdict]
  policies:
    - date: 2018-01-02
      name: 中共中央 国务院关于实施乡村振兴战略的意见
      text: 2018年中央一号文件，确立总要求和三步时间表，提出制定国家乡村振兴战略规划（2018－2022年）和乡村振兴法。
      cite: i06-gov-2018-02-04-rural-revitalization
    - date: 2021-02-25
      name: 巩固拓展脱贫攻坚成果同乡村振兴有效衔接
      text: 脱贫县设立过渡期，驻村帮扶等制度保留并转用于乡村振兴。
      cite: i06-gov-2021-02-25-poverty-speech
    - date: 2024-05-18
      name: 农业农村部部长唐仁健被查
      text: 主管乡村振兴的部长落马，2025年一审被判死缓。
      events: [e08-2024-tang-renjian]
      cite: c03-ccdi-2024-05-18-tang-renjian-probe
  cites: [i01-gov-2017-10-18-19th-report, i06-gov-2018-02-04-rural-revitalization, i06-gov-2021-02-25-poverty-speech, e04-xinhua-2020-10-29-5th-plenum, i01-gov-2022-10-16-20th-report, i04-rmrb-2023-02-14-editorial, i01-12371-2022-10-22-party-charter, c03-ccdi-2024-05-18-tang-renjian-probe, c03-xinhua-2025-09-28-tang-renjian-verdict]

- id: dual-carbon
  name: 碳达峰碳中和
  en: Carbon Peaking and Carbon Neutrality
  kind: formula
  by: [xi-jinping]
  first:
    date: 2020-09-22
    text: 习近平在第七十五届联合国大会一般性辩论上（视频讲话）宣布。
    cite: i06-gov-2020-09-22-unga-carbon
    quote: 二氧化碳排放力争于2030年前达到峰值，努力争取2060年前实现碳中和
  codified:
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 作出力争二〇三〇年前实现碳达峰、二〇六〇年前实现碳中和的庄严承诺
  summary: “双碳”目标是习近平2020年9月在联合国大会宣布的减排承诺：二氧化碳排放2030年前达峰，2060年前实现碳中和。同年底中央经济工作会议把它列为次年八项重点任务之一；2021年9月中共中央、国务院发布“双碳”工作意见，定下2025、2030、2060年的量化指标。2021年底中央经济工作会议强调“不可能毕其功于一役”“传统能源逐步退出要建立在新能源安全可靠的替代基础上”，二十大报告改为“积极稳妥推进”，并写入“先立后破”。
  terms: [碳达峰, 碳中和]
  related: [ecological-civilization, new-development-philosophy, three-tough-battles, community-shared-future]
  lists:
    - title: 做好碳达峰碳中和工作的五项原则（2021年意见）
      cite: i06-gov-2021-10-24-carbon-opinion
      items: [全国统筹, 节约优先, 双轮驱动, 内外畅通, 防范风险]
  sections:
    - h: 承诺
      from: 2020-09
      to: 2020-12
      text: 习近平在联大讲话中说，中国将“提高国家自主贡献力度，采取更加有力的政策和措施”，二氧化碳排放力争2030年前达峰、2060年前实现碳中和。2020年12月中央经济工作会议把“做好碳达峰、碳中和工作”列为2021年第八项重点任务，要求“抓紧制定2030年前碳排放达峰行动方案”，推动煤炭消费尽早达峰，建设全国用能权、碳排放权交易市场。
      cites: [i06-gov-2020-09-22-unga-carbon, i06-gov-2020-12-18-cewc]
    - h: 顶层设计
      from: 2021-09
      text: 2021年9月22日中共中央、国务院印发意见，提出到2025年单位国内生产总值二氧化碳排放比2020年下降18%、非化石能源消费比重达到20%左右；到2030年单位国内生产总值二氧化碳排放比2005年下降65%以上，风电、太阳能发电总装机容量达到12亿千瓦以上，“二氧化碳排放量达到峰值并实现稳中有降”；到2060年非化石能源消费比重达到80%以上。意见要求把“双碳”指标纳入考核，对未完成目标的地区“依规依法实行通报批评和约谈问责”。
      cites: [i06-gov-2021-10-24-carbon-opinion]
    - h: 纠偏
      from: 2021-12
      to: 2022-10
      text: 2021年12月中央经济工作会议专门讲“正确认识和把握碳达峰碳中和”，说“要坚定不移推进，但不可能毕其功于一役”，要求“立足以煤为主的基本国情”、新增可再生能源和原料用能不纳入能源消费总量控制、“防止简单层层分解”，并要求大企业特别是国有企业“带头保供稳价”。二十大报告标题改为“积极稳妥推进碳达峰碳中和”，提出“坚持先立后破，有计划分步骤实施碳达峰行动”。
      cites: [i06-gov-2021-12-10-cewc, i01-gov-2022-10-16-20th-report]
  policies:
    - date: 2020-12-18
      name: 中央经济工作会议部署碳达峰碳中和
      text: 列为2021年八项重点任务之一，要求制定2030年前碳排放达峰行动方案、建设全国碳排放权交易市场。
      cite: i06-gov-2020-12-18-cewc
    - date: 2021-09-22
      name: 中共中央 国务院关于完整准确全面贯彻新发展理念做好碳达峰碳中和工作的意见
      text: 定下2025、2030、2060年三阶段量化目标，设碳达峰碳中和工作领导小组，严控煤电、钢铁、电解铝等高碳项目投资。
      cite: i06-gov-2021-10-24-carbon-opinion
    - date: 2021-12-10
      name: 中央经济工作会议调整“双碳”推进方式
      text: 强调先立后破、以煤为主的国情，能耗“双控”逐步转向碳排放总量和强度“双控”。
      cite: i06-gov-2021-12-10-cewc
  cites: [i06-gov-2020-09-22-unga-carbon, i06-gov-2020-12-18-cewc, i06-gov-2021-10-24-carbon-opinion, i06-gov-2021-12-10-cewc, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report]

- id: unified-national-market
  name: 全国统一大市场
  en: Unified National Market
  kind: formula
  by: [xi-jinping]
  first:
    date: 2020-12-18
    text: 库内所见最早是2020年中央经济工作会议，要求“建设统一大市场”。
    cite: i06-gov-2020-12-18-cewc
    quote: 要放宽市场准入，促进公平竞争，保护知识产权，建设统一大市场
  codified:
    - date: 2022-10-16
      where: 二十大报告
      cite: i01-gov-2022-10-16-20th-report
      quote: 构建全国统一大市场，深化要素市场化改革，建设高标准市场体系
  summary: 全国统一大市场是“双循环”新发展格局的配套政策，针对地方保护、市场分割和各地自定的准入门槛。2022年3月中共中央、国务院发布《关于加快建设全国统一大市场的意见》，称它是“构建新发展格局的基础支撑和内在要求”，要求统一产权保护、市场准入、公平竞争、社会信用等基础制度，并写入为资本设置“红绿灯”、防止资本无序扩张的要求。二十大报告重申这一目标。2025、2026年政府工作报告把它与综合整治“内卷式”竞争联系起来。
  terms: [全国统一大市场, 统一大市场]
  related: [dual-circulation, socialist-market-economy, supply-side, disorderly-capital]
  lists:
    - title: 《关于加快建设全国统一大市场的意见》的六项重点任务（2022）
      cite: i06-gov-2022-04-10-unified-market
      items: [强化市场基础制度规则统一, 推进市场设施高标准联通, 打造统一的要素和资源市场, 推进商品和服务市场高水平统一, 推进市场监管公平统一, 进一步规范不当市场竞争和市场干预行为]
  sections:
    - h: 由来
      from: 2017-10
      to: 2020-12
      text: 十九大报告已提出“清理废除妨碍统一市场和公平竞争的各种规定和做法”。2020年底中央经济工作会议在“构建新发展格局”的部署中要求“建设统一大市场，营造市场化、法治化、国际化营商环境”。
      cites: [i01-gov-2017-10-18-19th-report, i06-gov-2020-12-18-cewc]
    - h: 意见
      from: 2022-03
      text: 2022年3月25日的意见开头说“建设全国统一大市场是构建新发展格局的基础支撑和内在要求”，要求“打破地方保护和市场分割”，严格落实市场准入负面清单“全国一张清单”管理模式。意见要求各地不搞“小而全”的自我小循环，不得以“内循环”的名义搞地区封锁，并全面清理歧视外资企业和外地企业、实行地方保护的各类优惠政策。
      cites: [i06-gov-2022-04-10-unified-market]
    - h: 与“内卷式”竞争
      from: 2024-03
      text: 2024年政府工作报告把“加强全国统一大市场建设”列入回顾。2025年报告要求“破除地方保护和市场分割”，综合整治“内卷式”竞争，“实施全国统一大市场建设指引”；2026年报告称整治“内卷式”竞争“成效显现”。
      cites: [i02-gov-2024-gwr, i02-gov-2025-gwr, i02-gov-2026-gwr]
  policies:
    - date: 2022-03-25
      name: 中共中央 国务院关于加快建设全国统一大市场的意见
      text: 统一产权保护、市场准入、公平竞争、社会信用制度，建设统一的土地、劳动力、资本、技术、数据、能源和生态环境市场，清理地方保护政策。
      cite: i06-gov-2022-04-10-unified-market
    - date: 2025-03-05
      name: 实施全国统一大市场建设指引，综合整治“内卷式”竞争
      text: 政府工作报告把统一大市场与招标投标、招商引资领域的整治和重点行业产能治理放在一起部署。
      cite: i02-gov-2025-gwr
  cites: [i01-gov-2017-10-18-19th-report, i06-gov-2020-12-18-cewc, i06-gov-2022-04-10-unified-market, i01-gov-2022-10-16-20th-report, i02-gov-2024-gwr, i02-gov-2025-gwr, i02-gov-2026-gwr]

- id: new-whole-nation-system
  name: 新型举国体制
  en: New Whole-Nation System
  kind: formula
  by: [xi-jinping]
  first:
    date: 2020-05-14
    text: 库内所见最早是2020年5月14日中央政治局常委会会议，要求“发挥新型举国体制优势”攻关关键技术。
    cite: i01-gov-2020-05-14-dual-circulation
    quote: 要发挥新型举国体制优势，加强科技创新和技术攻关
  codified:
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 把科技自立自强作为国家发展的战略支撑，健全新型举国体制
    - date: 2022-10-16
      where: 二十大报告
      cite: i01-gov-2022-10-16-20th-report
      quote: 完善党中央对科技工作统一领导的体制，健全新型举国体制
  summary: 新型举国体制指在市场经济条件下，由党和国家集中统筹力量攻关“卡脖子”的关键核心技术。2020年起它与科技自立自强、新发展格局连用；2022年9月中央全面深化改革委员会审议通过《关于健全社会主义市场经济条件下关键核心技术攻关新型举国体制的意见》，要求“把政府、市场、社会有机结合起来”，“建立权威的决策指挥体系”。同年10月美国全面限制对华出口先进芯片；2023年党和国家机构改革组建中央科技委员会、重组科技部，美国之音称其目标是集中力量解决“卡脖子”难题。
  terms: [新型举国体制]
  related: [new-quality-productive-forces, dual-circulation, holistic-security, made-in-china-2025]
  sections:
    - h: 提出
      from: 2020-05
      to: 2020-12
      text: 2020年5月14日的中央政治局常委会会议要求“发挥新型举国体制优势，加强科技创新和技术攻关，强化关键环节、关键领域、关键产品保障能力”。同年底中央经济工作会议要求“发挥新型举国体制优势，发挥好重要院所高校国家队作用”。
      cites: [i01-gov-2020-05-14-dual-circulation, i06-gov-2020-12-18-cewc]
    - h: 意见
      from: 2022-09
      text: 2022年9月6日中央深改委第二十七次会议说，要“发挥我国社会主义制度能够集中力量办大事的显著优势”，健全新型举国体制要“科学统筹、集中力量、优化机制、协同攻关”，瞄准“事关我国产业、经济和国家安全的若干重点领域及重大任务”，“加强党中央集中统一领导，建立权威的决策指挥体系”，同时“强化企业技术创新主体地位”。
      cites: [i06-gov-2022-09-06-new-whole-nation]
    - h: 机构落地
      from: 2023-03
      text: 2023年3月的党和国家机构改革方案组建中央科技委员会，“加强党中央对科技工作的集中统一领导”，并重新组建科学技术部，加强其“推动健全新型举国体制”的职能。2023年2月的《数字中国建设整体布局规划》也要求健全关键核心技术攻关新型举国体制。
      cites: [e05-gov-2023-03-16-reform-plan, i06-gov-2023-02-27-digital-china]
  policies:
    - date: 2022-09-06
      name: 关于健全社会主义市场经济条件下关键核心技术攻关新型举国体制的意见
      text: 中央深改委审议通过，确立党中央集中统一领导下的关键核心技术攻关组织方式。
      events: [e08-2022-us-chip-export-controls]
      cite: i06-gov-2022-09-06-new-whole-nation
    - date: 2023-03-16
      name: 组建中央科技委员会、重组科技部
      text: 党和国家机构改革把科技领导权收归党中央的议事协调机构。
      events: [e05-2023-central-tech-commission]
      cite: e05-gov-2023-03-16-reform-plan
  voices:
    - voice: west
      text: 美国之音报道，机构改革方案重组科技部，目标是推动健全“新型举国体制”，集中力量解决“卡脖子”难题；但受访的科技领域专家认为，随着美中“科技战”加剧，在中短期内新举国体制可能仍无法助力中国实现战略技术的自给自足。
      cite: e05-voa-2023-03-13-tech
  cites: [i01-gov-2020-05-14-dual-circulation, i06-gov-2020-12-18-cewc, b04-gov-2021-11-16-resolution, i06-gov-2022-09-06-new-whole-nation, i01-gov-2022-10-16-20th-report, e05-gov-2023-03-16-reform-plan, i06-gov-2023-02-27-digital-china, e05-voa-2023-03-13-tech]

- id: disorderly-capital
  name: 防止资本无序扩张
  en: Preventing the Disorderly Expansion of Capital
  kind: formula
  by: [xi-jinping]
  first:
    date: 2020-12-18
    text: 2020年中央经济工作会议把它列为2021年八项重点任务的第六项。
    cite: i06-gov-2020-12-18-cewc
    quote: 六是强化反垄断和防止资本无序扩张
  codified:
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 强化市场监管和反垄断规制，防止资本无序扩张
  summary: “防止资本无序扩张”是2020年底至2022年平台经济整顿的总口号。2020年11月蚂蚁集团上市被叫停，一个多月后的中央经济工作会议提出“强化反垄断和防止资本无序扩张”；此后阿里巴巴被罚182.28亿元，滴滴赴美上市后遭网络安全审查，“双减”禁止学科类培训机构上市融资。2021年底中央经济工作会议改以“为资本设置“红绿灯””表述。二十大报告写的是“依法规范和引导资本健康发展”；2025年习近平出席民营企业座谈会，马云到场，外界视为政策转向的信号。
  terms: [资本无序扩张, 红绿灯]
  related: [common-prosperity, unified-national-market, socialist-market-economy]
  sections:
    - h: 叫停与提出
      from: 2020-11
      to: 2020-12
      text: 2020年11月3日，金融监管部门约谈马云等蚂蚁集团高管后，上海证券交易所暂停蚂蚁集团上市，蚂蚁随即暂缓H股上市；外界多认为这与马云10月24日外滩金融峰会上“我们必须改掉金融的当铺思想”的讲话有关。12月的中央经济工作会议说，国家支持平台企业创新发展，“同时要依法规范发展，健全数字规则”，“要完善平台企业垄断认定、数据收集使用管理、消费者权益保护等方面的法律规范”，并强调“金融创新必须在审慎监管的前提下进行”。
      cites: [e04-bbc-2020-11-03-ant-ipo, i06-gov-2020-12-18-cewc]
    - h: 整顿
      from: 2021-04
      to: 2022-07
      text: 2021年4月10日，市场监管总局对阿里巴巴处以其2019年境内销售额4%的罚款，计182.28亿元。7月，滴滴在美上市后旋即被网信办启动网络安全审查，2022年7月被以违反网络安全法、数据安全法和个人信息保护法罚款80.26亿元。2021年7月的“双减”意见规定“学科类培训机构一律不得上市融资，严禁资本化运作”，各地不再审批新的义务教育阶段学科类校外培训机构。2021年政府工作报告和2022年政府工作报告都写入反垄断和防止资本无序扩张。
      cites: [b10-xinhua-2021-04-10-alibaba-fine, e08-cac-2022-07-21-didi-fine, e04-gov-2021-07-24-double-reduction, i02-gov-2021-gwr, i02-gov-2022-gwr]
    - h: “红绿灯”
      from: 2021-12
      text: 2021年12月中央经济工作会议要求“正确认识和把握资本的特性和行为规律”，说“要发挥资本作为生产要素的积极作用，同时有效控制其消极作用。要为资本设置“红绿灯”，依法加强对资本的有效监管，防止资本野蛮生长”，同时“支持和引导资本规范健康发展”。2022年3月的全国统一大市场意见也写入同一表述。
      cites: [i06-gov-2021-12-10-cewc, i06-gov-2022-04-10-unified-market]
    - h: 问责官员
      from: 2022-01
      text: 2022年1月，中央纪委对杭州市委原书记周江勇的处分通报写有“与资本勾连，支持资本无序扩张”，这一口号由此进入党纪处分用语。
      cites: [c03-ccdi-2022-01-26-zhou-jiangyong-expel]
    - h: 转向
      from: 2022-10
      text: 二十大报告改称“依法规范和引导资本健康发展”。2023年政府工作报告在回顾五年工作时写“依法规范和引导资本健康发展，依法坚决管控资本无序扩张”。2025年2月17日习近平出席民营企业座谈会，称党和国家对民营经济发展的基本方针政策“不能变，也不会变”；BBC中文网引述分析人士说，马云到场“与数年前遏制‘资本无序扩张’的立场形成鲜明逆转”。
      cites: [i01-gov-2022-10-16-20th-report, i02-gov-2023-gwr, b14-gov-2025-02-17-private-symposium, b10-bbc-2025-02-17-symposium]
  policies:
    - date: 2020-11-03
      name: 蚂蚁集团上市被叫停
      text: 金融监管部门约谈后，上交所以“金融科技监管环境发生变化”等为由暂停蚂蚁上市。
      events: [ant-ipo-halted]
      cite: e04-bbc-2020-11-03-ant-ipo
    - date: 2021-04-10
      name: 阿里巴巴“二选一”反垄断处罚
      text: 市场监管总局罚款182.28亿元，并要求其全面整改。
      events: [e08-2021-alibaba-antitrust-fine]
      cite: b10-xinhua-2021-04-10-alibaba-fine
    - date: 2021-07-24
      name: “双减”意见
      text: 学科类培训机构统一登记为非营利性机构，不得上市融资，外资不得控股或参股。
      events: [double-reduction]
      cite: e04-gov-2021-07-24-double-reduction
    - date: 2022-07-21
      name: 滴滴被罚80.26亿元
      text: 网信办依据网络安全法、数据安全法、个人信息保护法处罚滴滴及其董事长、总裁。
      events: [e08-2021-didi-cybersecurity-review]
      cite: e08-cac-2022-07-21-didi-fine
    - date: 2025-02-17
      name: 民营企业座谈会
      text: 习近平称民营经济基本方针政策“不能变，也不会变”。
      events: [e08-2025-private-enterprise-symposium]
      cite: b14-gov-2025-02-17-private-symposium
  voices:
    - voice: west
      text: BBC亚洲商业记者瓦斯瓦尼分析，蚂蚁集团高层或许忘了一点，那就是他们的企业仍然在中国，而中国企业所作所为必须得到政府许可。
      cite: e04-bbc-2020-11-03-ant-ipo
    - voice: scholar
      text: 这实质承认中国需要民营企业参与中美科技博弈。虽然决策层更倾向依靠产业政策与国企实现技术突破，但颠覆性创新仍来自民营领域。
      cite: b10-bbc-2025-02-17-symposium
      quote: true
  cites: [e04-bbc-2020-11-03-ant-ipo, i06-gov-2020-12-18-cewc, b10-xinhua-2021-04-10-alibaba-fine, e08-cac-2022-07-21-didi-fine, e04-gov-2021-07-24-double-reduction, i02-gov-2021-gwr, i02-gov-2022-gwr, i06-gov-2021-12-10-cewc, i06-gov-2022-04-10-unified-market, b04-gov-2021-11-16-resolution, c03-ccdi-2022-01-26-zhou-jiangyong-expel, i01-gov-2022-10-16-20th-report, i02-gov-2023-gwr, b14-gov-2025-02-17-private-symposium, b10-bbc-2025-02-17-symposium]

- id: financial-power
  name: 金融强国
  en: Financial Power
  kind: formula
  by: [xi-jinping]
  first:
    date: 2023-10-30
    text: 2023年10月30日至31日中央金融工作会议提出。
    cite: cs2-gov-2023-10-31-financial-work-conf
    quote: 金融是国民经济的血脉，是国家核心竞争力的重要组成部分，要加快建设金融强国
  summary: 金融强国是2023年中央金融工作会议定下的金融工作目标。会议此前，2023年3月的机构改革已组建中央金融委员会和中央金融工作委员会，把金融决策和金融系统党建收归党中央。2024年1月省部级专题研讨班上，习近平把“中国特色金融发展之路”概括为八个“坚持”，并列出金融强国的六个“关键核心金融要素”，要求金融监管“长牙带刺”。2026年《求是》发表这篇讲话，同年全国人大常委会工作报告提出围绕建设金融强国制定金融法、金融稳定法。
  terms: [金融强国, 中国特色金融发展之路]
  related: [three-tough-battles, disorderly-capital, super-ministry, holistic-security]
  lists:
    - title: 金融强国的关键核心金融要素（省部级专题研讨班讲话，2024）
      cite: i06-gov-2024-01-16-finance-seminar
      items: [强大的货币, 强大的中央银行, 强大的金融机构, 强大的国际金融中心, 强大的金融监管, 强大的金融人才队伍]
    - title: 五篇大文章（中央金融工作会议，2023）
      cite: cs2-gov-2023-10-31-financial-work-conf
      items: [科技金融, 绿色金融, 普惠金融, 养老金融, 数字金融]
    - title: 中国特色金融文化（省部级专题研讨班讲话，2024）
      cite: i06-gov-2024-01-16-finance-seminar
      items: [诚实守信，不逾越底线, 以义取利，不唯利是图, 稳健审慎，不急功近利, 守正创新，不脱实向虚, 依法合规，不胡作非为]
  sections:
    - h: 机构先行
      from: 2023-03
      text: 2023年3月的党和国家机构改革方案组建中央金融委员会，“作为党中央决策议事协调机构”，不再保留国务院金融稳定发展委员会；组建中央金融工作委员会，“统一领导金融系统党的工作”；在银保监会基础上组建国家金融监督管理总局，作为国务院直属机构。
      cites: [e05-gov-2023-03-16-reform-plan]
    - h: 中央金融工作会议
      from: 2023-10
      text: 会议以“加快建设金融强国为目标”，提出“坚持党中央对金融工作的集中统一领导”等原则，要求“做好科技金融、绿色金融、普惠金融、养老金融、数字金融五篇大文章”，并要求“发挥好中央金融委员会的作用”“发挥好中央金融工作委员会的作用，切实加强金融系统党的建设”。
      cites: [cs2-gov-2023-10-31-financial-work-conf]
    - h: 八个坚持与六要素
      from: 2024-01
      text: 2024年1月16日省部级主要领导干部专题研讨班开班式上，习近平说中国特色金融发展之路“与西方金融模式有本质区别”，并说金融强国“应当基于强大的经济基础”，同时具备六个关键核心金融要素。他要求金融监管“长牙带刺”、有棱有角，“实现金融监管横向到边、纵向到底”。2026年1月出版的《求是》以《走好中国特色金融发展之路，建设金融强国》为题发表这篇讲话，把六要素逐条展开，如“拥有强大的货币，在国际贸易投资和外汇市场广泛使用，具有全球储备货币地位”。
      cites: [i06-gov-2024-01-16-finance-seminar, i06-gov-2026-01-31-qiushi-finance]
  policies:
    - date: 2023-03-16
      name: 组建中央金融委员会、中央金融工作委员会和国家金融监督管理总局
      text: 金融稳定和发展的顶层设计改由党中央决策议事协调机构负责，金融系统党建统一归口。
      cite: e05-gov-2023-03-16-reform-plan
    - date: 2023-10-30
      name: 中央金融工作会议
      text: 确立建设金融强国目标，部署全面加强金融监管和“五篇大文章”。
      cite: cs2-gov-2023-10-31-financial-work-conf
    - date: 2026-03
      name: 围绕金融强国的立法规划
      text: 全国人大常委会工作报告提出制定金融法、金融稳定法，修改中国人民银行法、银行业监督管理法。
      cite: b05-gov-2026-03-15-npc-report
  cites: [e05-gov-2023-03-16-reform-plan, cs2-gov-2023-10-31-financial-work-conf, i06-gov-2024-01-16-finance-seminar, i06-gov-2026-01-31-qiushi-finance, b05-gov-2026-03-15-npc-report]

- id: military-civil-fusion
  name: 军民融合
  en: Military-Civil Fusion
  kind: formula
  by: [xi-jinping]
  first:
    date: 2007-10-15
    text: 胡锦涛时期的十七大报告已提出“军民融合式发展”。
    cite: b02-npc-2007-10-24-17th-report
    quote: 走出一条中国特色军民融合式发展路子
  codified:
    - date: 2015-03-12
      where: 习近平在十二届全国人大三次会议解放军代表团全体会议上的讲话
      cite: i06-xinhua-2015-03-12-military-civil
      quote: 把军民融合发展上升为国家战略
    - date: 2017-10-24
      where: 党章（十九大修改后文本）列举的七大战略
      cite: d01-12371-2017-10-28-party-charter
      quote: 可持续发展战略、军民融合发展战略
  summary: 军民融合指打通国防建设与经济建设、军用技术与民用技术。十七大、十八大报告已提出走“中国特色军民融合式发展路子”；十八届三中全会决定要求“推动军民融合深度发展”。2015年3月，习近平首次明确提出“把军民融合发展上升为国家战略”，十九大把军民融合发展战略写入党章，与科教兴国、乡村振兴等并列为七大战略。二十大报告不再出现“军民融合”字样，改提“巩固提高一体化国家战略体系和能力”。
  terms: [军民融合, 军民融合发展战略]
  related: [new-whole-nation-system, holistic-security]
  sections:
    - h: 胡锦涛时期的“军民融合式发展”
      from: 2007-10
      to: 2013-11
      text: 十七大报告要求“建立和完善军民结合、寓军于民的武器装备科研生产体系”，“走出一条中国特色军民融合式发展路子”。十八大报告要求“加强军民融合式发展战略规划、体制机制建设、法规建设”。十八届三中全会决定第57条“推动军民融合深度发展”，要求“在国家层面建立推动军民融合发展的统一领导、军地协调、需求对接、资源共享机制”，“引导优势民营企业进入军品科研生产和维修领域”。
      cites: [b02-npc-2007-10-24-17th-report, i01-wsyu-2012-11-08-18th-report, e03-gov-2013-11-15-reform-decision]
    - h: 上升为国家战略
      from: 2015-03
      to: 2015-11
      text: 2015年3月12日，习近平在解放军代表团全体会议上说，“把军民融合发展上升为国家战略，是我们长期探索经济建设和国防建设协调发展规律的重大成果”，要求“加快形成全要素、多领域、高效益的军民融合深度发展格局”。新华社“新华视点”指出，这是习近平“第一次明确提出”这一说法。同年11月军队改革工作会议把“贯彻军民融合发展战略，推进跨军地重大改革任务”列为改革内容之一；十八届五中全会公报写入“实施军民融合发展战略”。
      cites: [i06-xinhua-2015-03-12-military-civil, i06-xinhua-2015-03-12-mcf-first, e03-gov-2015-11-26-military-reform, i01-moe-2015-10-29-5th-plenum-communique]
    - h: 写入党章与机构
      from: 2017-10
      to: 2019-04
      text: 十九大报告要求“形成军民融合深度发展格局，构建一体化的国家战略体系和能力”，修改后的党章把军民融合发展战略列入七大战略。地方也设立了党委军民融合发展委员会，例如2019年被查的四川省副省长彭宇行，任上兼任四川省委军民融合发展委员会办公室第一副主任。2018年政府工作报告称过去五年“军民融合深度发展”。
      cites: [i01-gov-2017-10-18-19th-report, d01-12371-2017-10-28-party-charter, r04-ccdi-2019-04-28-peng-yuxing-probe, i02-gov-2018-gwr]
    - h: 二十大的措辞变化
      from: 2022-10
      text: 二十大报告的国防部分不再出现“军民融合”，改为“巩固提高一体化国家战略体系和能力。加强军地战略规划统筹、政策制度衔接、资源要素共享”；党章所列七大战略仍保留军民融合发展战略。
      cites: [i01-gov-2022-10-16-20th-report, i01-12371-2022-10-22-party-charter]
  policies:
    - date: 2013-11-12
      name: 十八届三中全会决定“推动军民融合深度发展”
      text: 提出在国家层面建立统一领导、军地协调机制，引导民营企业进入军品科研生产。
      events: [e03-2013-third-plenum-reform-decision]
      cite: e03-gov-2013-11-15-reform-decision
    - date: 2015-03-12
      name: 军民融合发展上升为国家战略
      text: 习近平在全国人大解放军代表团提出，同年写入十八届五中全会公报。
      cite: i06-xinhua-2015-03-12-military-civil
    - date: 2015-11-24
      name: 军队改革工作会议
      text: 把推进跨军地重大改革任务、推动经济建设和国防建设融合发展列入国防和军队改革。
      events: [e03-2015-military-reform-conference]
      cite: e03-gov-2015-11-26-military-reform
  voices:
    - voice: west
      text: 美国之音引述《南华早报》报道，2022年接任工信部部长的金壮龙，曾担任由习近平主持的中央军民融合发展委员会办公室常务副主任。
      cite: f08-voa-2025-03-01-jin-zhuanglong
  cites: [b02-npc-2007-10-24-17th-report, i01-wsyu-2012-11-08-18th-report, e03-gov-2013-11-15-reform-decision, i06-xinhua-2015-03-12-military-civil, i06-xinhua-2015-03-12-mcf-first, e03-gov-2015-11-26-military-reform, i01-moe-2015-10-29-5th-plenum-communique, i01-gov-2017-10-18-19th-report, d01-12371-2017-10-28-party-charter, r04-ccdi-2019-04-28-peng-yuxing-probe, i02-gov-2018-gwr, i01-gov-2022-10-16-20th-report, i01-12371-2022-10-22-party-charter, f08-voa-2025-03-01-jin-zhuanglong]

- id: chinese-nation-community
  name: 铸牢中华民族共同体意识
  en: Forging a Strong Sense of Community for the Chinese Nation
  kind: formula
  by: [xi-jinping]
  first:
    date: 2014-05-28
    text: 第二次中央新疆工作座谈会上提出。
    cite: e08-gov-2014-05-29-xinjiang-forum
    quote: 在各民族中牢固树立国家意识、公民意识、中华民族共同体意识
  codified:
    - date: 2017-10-18
      where: 十九大报告
      cite: i01-gov-2017-10-18-19th-report
      quote: 深化民族团结进步教育，铸牢中华民族共同体意识
    - date: 2017-10-24
      where: 党章（十九大修改后文本）
      cite: d01-12371-2017-10-28-party-charter
      quote: 铸牢中华民族共同体意识，实现各民族共同团结奋斗、共同繁荣发展
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 坚持把铸牢中华民族共同体意识作为党的民族工作主线
  summary: “中华民族共同体意识”由习近平2014年在第二次中央新疆工作座谈会上提出，同年中央民族工作会议要求“积极培养”；十九大改为“铸牢”，并写入党章。第三个历史决议把它定为“党的民族工作主线”，此后政府工作报告进一步提出“推进中华民族共同体建设”。2024年三中全会决定要求制定民族团结进步促进法，该法2026年3月通过、7月1日施行。官方表述日益强调各民族“交往交流交融”；2020年内蒙古推行国家统编语文教材，曾引发蒙古族家长和学生抗议。
  terms: [中华民族共同体意识, 铸牢中华民族共同体意识]
  related: [sinicization-of-religion, stability-maintenance, chinese-dream]
  sections:
    - h: 提出
      from: 2014-05
      to: 2014-09
      text: 2014年5月28日至29日的第二次中央新疆工作座谈会上，习近平说“民族团结是各族人民的生命线”，要“在各民族中牢固树立国家意识、公民意识、中华民族共同体意识”。同年9月中央民族工作会议后，《人民日报》社论把“必须积极培养中华民族共同体意识”列为民族工作的要求之一，同时要求“做好城市民族工作”。
      cites: [e08-gov-2014-05-29-xinjiang-forum, i04-rmrb-2014-09-30-editorial]
    - h: 从“培养”到“铸牢”
      from: 2017-10
      to: 2021-11
      text: 十九大报告要求“深化民族团结进步教育，铸牢中华民族共同体意识，加强各民族交往交流交融”，修改后的党章写入同样表述。2019年十九届四中全会把“铸牢中华民族共同体意识”列为国家制度的显著优势之一；第三个历史决议称党“坚持把铸牢中华民族共同体意识作为党的民族工作主线”，并“确立新时代党的治藏方略、治疆方略”。
      cites: [i01-gov-2017-10-18-19th-report, d01-12371-2017-10-28-party-charter, i05-gov-2019-10-31-4th-plenum, b04-gov-2021-11-16-resolution]
    - h: 立法
      from: 2024-07
      to: 2026-07
      text: 二十届三中全会决定要求“制定民族团结进步促进法，健全铸牢中华民族共同体意识制度机制”。2025年政府工作报告提出“推进中华民族共同体建设”。2026年3月12日，十四届全国人大四次会议通过民族团结进步促进法，自2026年7月1日起施行；全国人大常委会工作报告称制定该法“是党中央部署的重大政治任务和立法任务”。
      cites: [i01-gov-2024-07-18-third-plenum-decision, i02-gov-2025-gwr, e04-miit-2026-03-12-npc-closing, b05-gov-2026-03-15-npc-report]
    - h: 争议
      from: 2012
      text: 早在2012年，学界已就胡鞍钢、胡联合提出的“第二代民族政策”发生争论，这一主张以民族问题“去政治化”为思路。民族学者郝时远撰文反对，认为以此取代“真正的民族平等”核心原则是误导。2020年8月，内蒙古要求民族语言授课学校逐步改用国家统编教材，通辽、鄂尔多斯、呼和浩特等地出现蒙古族民众抗议，警方以“寻衅滋事”罪名悬赏通缉上百人。
      cites: [i08-tibetcn-2012-02-06-hao-shiyuan, e08-bbc-2020-08-31-inner-mongolia, e08-bbc-2020-09-03-inner-mongolia]
  policies:
    - date: 2014-05-28
      name: 第二次中央新疆工作座谈会
      text: 首次提出树立中华民族共同体意识，并提出各民族“像石榴籽那样紧紧抱在一起”。
      events: [e08-2014-second-xinjiang-work-forum]
      cite: e08-gov-2014-05-29-xinjiang-forum
    - date: 2020-08-26
      name: 内蒙古民族语言授课学校使用国家统编语文教材
      text: 小学一年级和初中一年级起使用统编语文教材，此后政治、历史课逐步改用汉语授课。
      events: [e08-2020-inner-mongolia-language-protests]
      cite: e08-bbc-2020-08-31-inner-mongolia
    - date: 2026-03-12
      name: 民族团结进步促进法
      text: 十四届全国人大四次会议通过，2026年7月1日起施行。
      events: [ethnic-unity-law]
      cite: e04-miit-2026-03-12-npc-closing
  voices:
    - voice: scholar
      text: 郝时远批评“去政治化”与“第二代民族政策”之说，称用“苏联模式”括套中国民族政策而主张“去政治化”是一个违背事实的伪命题。
      cite: i08-tibetcn-2012-02-06-hao-shiyuan
    - voice: west
      text: BBC中文网引述多家外媒报道，内蒙古多地爆发抗议，反对政府加强汉语教育，有家长以拒绝送孩子入学表达抗议；奈曼旗一所中学通常有1000名学生，抗议期间仅剩约10人。
      cite: e08-bbc-2020-09-03-inner-mongolia
  cites: [e08-gov-2014-05-29-xinjiang-forum, i04-rmrb-2014-09-30-editorial, i01-gov-2017-10-18-19th-report, d01-12371-2017-10-28-party-charter, i05-gov-2019-10-31-4th-plenum, b04-gov-2021-11-16-resolution, i01-gov-2024-07-18-third-plenum-decision, i02-gov-2025-gwr, e04-miit-2026-03-12-npc-closing, b05-gov-2026-03-15-npc-report, i08-tibetcn-2012-02-06-hao-shiyuan, e08-bbc-2020-08-31-inner-mongolia, e08-bbc-2020-09-03-inner-mongolia]

- id: fengqiao-experience
  name: 新时代“枫桥经验”
  en: Fengqiao Experience for the New Era
  kind: formula
  by: [xi-jinping]
  first:
    date: 2013-10-11
    text: “枫桥经验”50周年之际，习近平作出指示。
    cite: i06-gov-2013-10-11-fengqiao
    quote: 把“枫桥经验”坚持好、发展好，把党的群众路线坚持好、贯彻好
  codified:
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 坚持和发展新时代“枫桥经验”
    - date: 2022-10-16
      where: 二十大报告
      cite: i01-gov-2022-10-16-20th-report
      quote: 在社会基层坚持和发展新时代“枫桥经验”
  summary: “枫桥经验”源自浙江枫桥干部群众“依靠群众就地化解矛盾”的做法，是政法综治系统的典型。2013年其50周年时，习近平要求把“枫桥经验”坚持好、发展好。库内所见，2020年中央全面依法治国工作会议已用新时代“枫桥经验”的提法，此后写入第三个历史决议、二十大报告和二十届三中全会决定。它指在基层就地预防和化解矛盾纠纷、推动信访工作法治化，在政府工作报告中与综治中心建设、扫黑除恶常态化和平安中国建设放在一起部署。
  terms: [枫桥经验, 新时代枫桥经验]
  related: [stability-maintenance, mass-incidents, rule-of-law]
  sections:
    - h: 五十周年指示
      from: 2013-10
      text: 2013年10月，习近平就坚持和发展“枫桥经验”作出指示，要求各级党委和政府“创新群众工作方法，善于运用法治思维和法治方式解决涉及群众切身利益的矛盾和问题”。指示说，50年前浙江枫桥干部群众创造了“依靠群众就地化解矛盾”的“枫桥经验”，它已“成为全国政法综治战线的一面旗帜”。
      cites: [i06-gov-2013-10-11-fengqiao]
    - h: 进入“新时代”
      from: 2019-01
      to: 2020-11
      text: 2019年1月省部级防范化解重大风险专题研讨班上，习近平要求“推进社会治理现代化，坚持和发展“枫桥经验””，“从源头上提升维护社会稳定能力和水平”。同年政府工作报告要求“推广促进社会和谐的“枫桥经验””。2020年11月中央全面依法治国工作会议要求“完善预防性法律制度，坚持和发展新时代“枫桥经验””，“促进社会和谐稳定”。
      cites: [i05-gov-2019-01-21-risk-seminar, i02-gov-2019-gwr, i03-gov-2020-11-17-rule-of-law-conference]
    - h: 写入决议与改革决定
      from: 2021-11
      to: 2024-07
      text: 第三个历史决议和二十大报告都写入坚持和发展新时代“枫桥经验”。二十届三中全会决定把它放在“健全社会治理体系”条目之首，接着要求“健全党组织领导的自治、法治、德治相结合的城乡基层治理体系”“探索建立全国统一的人口管理制度”。
      cites: [b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i01-gov-2024-07-18-third-plenum-decision]
    - h: 落地
      from: 2024-03
      text: 2024年政府工作报告把新时代“枫桥经验”与“推进矛盾纠纷预防化解，推动信访工作法治化”和“推进扫黑除恶常态化”放在同一段；2026年报告进一步要求“推进综治中心规范化建设”，“集中化解信访问题”。
      cites: [i02-gov-2024-gwr, i02-gov-2026-gwr]
  policies:
    - date: 2024-03-05
      name: 信访工作法治化与矛盾纠纷预防化解
      text: 政府工作报告以新时代“枫桥经验”统领基层矛盾化解和信访工作。
      cite: i02-gov-2024-gwr
    - date: 2026-03-05
      name: 综治中心规范化建设
      text: 政府工作报告要求推进综治中心规范化建设，推进矛盾纠纷预防和多元化解。
      cite: i02-gov-2026-gwr
  cites: [i06-gov-2013-10-11-fengqiao, i05-gov-2019-01-21-risk-seminar, i02-gov-2019-gwr, i03-gov-2020-11-17-rule-of-law-conference, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i01-gov-2024-07-18-third-plenum-decision, i02-gov-2024-gwr, i02-gov-2026-gwr]

- id: initial-mission
  name: 不忘初心、牢记使命
  en: Staying True to the Original Aspiration
  kind: formula
  by: [xi-jinping]
  first:
    date: 2017-10-18
    text: 十九大的大会主题以此开头。
    cite: i01-gov-2017-10-18-19th-report
    quote: 中国共产党人的初心和使命，就是为中国人民谋幸福，为中华民族谋复兴
  codified:
    - date: 2019-10-31
      where: 十九届四中全会公报
      cite: i05-gov-2019-10-31-4th-plenum
      quote: 要建立不忘初心、牢记使命的制度
  summary: “不忘初心，牢记使命”是十九大的大会主题，报告把“初心和使命”定义为“为中国人民谋幸福，为中华民族谋复兴”，并决定以县处级以上领导干部为重点在全党开展同名主题教育。2019年5月底启动的主题教育由王沪宁任中央领导小组组长，总要求是“守初心、担使命，找差距、抓落实”。同年十九届四中全会要求“建立不忘初心、牢记使命的制度”。此后党内集中教育延续为2021年党史学习教育和2023年学习贯彻习近平新时代中国特色社会主义思想主题教育。
  terms: [不忘初心, 牢记使命, 初心使命]
  related: [self-revolution, four-consciousness, eight-point-rules, party-history-education, three-musts]
  lists:
    - title: 主题教育的总要求（2019）
      cite: i06-gov-2019-05-31-theme-education
      items: [守初心, 担使命, 找差距, 抓落实]
    - title: 主题教育的具体目标（2019）
      cite: i06-gov-2019-05-31-theme-education
      items: [理论学习有收获, 思想政治受洗礼, 干事创业敢担当, 为民服务解难题, 清正廉洁作表率]
  sections:
    - h: 十九大主题
      from: 2017-10
      text: 十九大报告开篇说大会主题是“不忘初心，牢记使命，高举中国特色社会主义伟大旗帜”，接着说“不忘初心，方得始终”，“这个初心和使命是激励中国共产党人不断前进的根本动力”。报告在党建部分要求推进“两学一做”学习教育常态化制度化，“以县处级以上领导干部为重点，在全党开展“不忘初心、牢记使命”主题教育”。
      cites: [i01-gov-2017-10-18-19th-report]
    - h: 主题教育
      from: 2019-05
      to: 2020-01
      text: 2019年5月31日主题教育工作会议上，习近平说今年是中华人民共和国成立70周年，“也是我们党在全国执政第70个年头”，要求主题教育“力戒形式主义、官僚主义”，“解决实质问题”。中央“不忘初心、牢记使命”主题教育领导小组组长王沪宁作总结讲话。
      cites: [i06-gov-2019-05-31-theme-education]
    - h: 制度化与延续
      from: 2019-10
      text: 十九届四中全会公报称主题教育“成效明显”，并把“建立不忘初心、牢记使命的制度”列为党的领导制度体系的第一项。第三个历史决议把这次主题教育与“两学一做”、党史学习教育等并列为十八大以来的党内集中教育。2023年4月，学习贯彻习近平新时代中国特色社会主义思想主题教育同样“以县处级以上领导干部为重点”在全党开展，蔡奇任领导小组组长。
      cites: [i05-gov-2019-10-31-4th-plenum, b04-gov-2021-11-16-resolution, i05-gov-2023-04-03-theme-education]
  policies:
    - date: 2019-05-31
      name: “不忘初心、牢记使命”主题教育
      text: 以县处级以上领导干部为重点在全党开展，设中央主题教育领导小组。
      cite: i06-gov-2019-05-31-theme-education
    - date: 2019-10-31
      name: 建立不忘初心、牢记使命的制度
      text: 十九届四中全会把它列为坚持和完善党的领导制度体系的首项。
      events: [e08-2019-fourth-plenum]
      cite: i05-gov-2019-10-31-4th-plenum
    - date: 2023-04-03
      name: 学习贯彻习近平新时代中国特色社会主义思想主题教育
      text: 沿用2019年主题教育的组织方式，以县处级以上领导干部为重点。
      cite: i05-gov-2023-04-03-theme-education
  cites: [i01-gov-2017-10-18-19th-report, i06-gov-2019-05-31-theme-education, i05-gov-2019-10-31-4th-plenum, b04-gov-2021-11-16-resolution, i05-gov-2023-04-03-theme-education]

- id: party-history-education
  name: 党史学习教育
  en: Party History Learning and Education
  kind: formula
  by: [xi-jinping]
  first:
    date: 2021-02-20
    text: 党史学习教育动员大会在北京召开，习近平讲话。
    cite: i06-gov-2021-02-20-party-history
    quote: 全党同志要做到学史明理、学史增信、学史崇德、学史力行
  codified:
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: “不忘初心、牢记使命”主题教育、党史学习教育等
    - date: 2022-10-16
      where: 二十大报告
      cite: i01-gov-2022-10-16-20th-report
      quote: 坚持理论武装同常态化长效化开展党史学习教育相结合
  summary: 党史学习教育是建党一百周年前后在全党开展的集中教育，2021年2月20日动员，要求“学史明理、学史增信、学史崇德、学史力行”，并“旗帜鲜明反对历史虚无主义”、开展“我为群众办实事”实践活动。同年网信部门把“整治网上历史虚无主义”列为“清朗”专项行动首项任务；11月十九届六中全会通过第三个历史决议，称党史学习教育“扎实有效”。二十大报告要求它“常态化长效化”。外界常把它与习近平对苏共“搞历史虚无主义”的警告和对《炎黄春秋》等刊物的整顿联系起来。
  terms: [党史学习教育, 学史明理]
  related: [initial-mission, four-confidences, self-revolution, qinglang]
  lists:
    - title: 党史学习教育的目标要求（动员大会，2021）
      cite: i06-gov-2021-02-20-party-history
      items: [学史明理, 学史增信, 学史崇德, 学史力行, 学党史, 悟思想, 办实事, 开新局]
  sections:
    - h: 动员
      from: 2021-02
      text: 习近平在动员大会上说，在全党开展党史学习教育是党中央“立足党的百年历史新起点”作出的重大决策。他要求“准确把握党的历史发展的主题主线、主流本质，正确认识和科学评价党史上的重大事件、重要会议、重要人物”，“要旗帜鲜明反对历史虚无主义，加强思想引导和理论辨析”，并开展好“我为群众办实事”实践活动，“防止学习和工作“两张皮””。
      cites: [i06-gov-2021-02-20-party-history]
    - h: 与网络整治联动
      from: 2021-05
      text: 2021年5月8日国家网信办在国新办发布会上说，“今年党中央在全党开展党史学习教育，要求把群众利益摆在第一位”，当年网络“清朗”系列专项行动的8项任务以“整治网上历史虚无主义”居首。
      cites: [i06-cac-2021-05-08-qinglang]
    - h: 百年与决议
      from: 2021-07
      to: 2022-10
      text: 十九届六中全会公报把“党史学习教育扎实有效”与“成功举办庆祝中国共产党成立100周年系列活动”并列。第三个历史决议把它列入十八大以来的系列党内集中教育。2022年1月十九届中央纪委六次全会上，习近平要求“巩固拓展党史学习教育成果”，“持之以恒推进党史学习、教育、宣传，引导全党坚定历史自信”。二十大报告把“在全党开展党史学习教育”列为五年成就，并要求常态化长效化。
      cites: [e04-gov-2021-11-11-6th-plenum, b04-gov-2021-11-16-resolution, i01-gov-2022-01-18-self-revolution, i01-gov-2022-10-16-20th-report]
  policies:
    - date: 2021-02-20
      name: 党史学习教育动员大会
      text: 在全党开展党史学习教育，配套“我为群众办实事”实践活动。
      cite: i06-gov-2021-02-20-party-history
    - date: 2021-05-08
      name: 清朗·整治网上历史虚无主义
      text: 网信部门把整治网上历史虚无主义列为2021年清朗系列专项行动的首项任务。
      cite: i06-cac-2021-05-08-qinglang
    - date: 2021-11-11
      name: 十九届六中全会与第三个历史决议
      text: 全会总结党史学习教育成效，通过第三个历史决议。
      events: [cpc-centenary, sixth-plenum-19th]
      cite: e04-gov-2021-11-11-6th-plenum
  voices:
    - voice: west
      text: BBC中文网引述习近平上台后不久的党内讲话：“全面否定苏联历史、苏共历史、否定列宁，否定斯大林，一路否定下去，搞历史虚无主义，思想搞乱了，各级党组织几乎没什么作用了。”
      cite: b04-bbc-xi-cave-to-summit
    - voice: scholar
      text: 我们认为历史虚无主义就是否定历史，掩盖历史真相。
      cite: i08-voa-2015-05-21-yanhuang
      quote: true
  cites: [i06-gov-2021-02-20-party-history, i06-cac-2021-05-08-qinglang, e04-gov-2021-11-11-6th-plenum, b04-gov-2021-11-16-resolution, i01-gov-2022-01-18-self-revolution, i01-gov-2022-10-16-20th-report, b04-bbc-xi-cave-to-summit, i08-voa-2015-05-21-yanhuang]

- id: three-musts
  name: 三个务必
  en: Three Musts
  kind: formula
  by: [xi-jinping]
  first:
    date: 2022-10-16
    text: 二十大报告开篇提出。
    cite: i01-gov-2022-10-16-20th-report
    quote: 全党同志务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必敢于斗争、善于斗争
  summary: “三个务必”是二十大报告开篇对全党的要求，在毛泽东“两个务必”所讲的谦虚谨慎、艰苦奋斗之前加上“不忘初心、牢记使命”，之后加上“敢于斗争、善于斗争”。“两个务必”此前是历代领导人重温的话题，2002年底胡锦涛曾带中央书记处到西柏坡重温；建党百年时《人民日报》社论仍写“坚持“两个务必””。二十大后，“三个务必”进入中央纪委全会工作报告和新任地方领导的表态，与作风建设、纠“四风”和“三严三实”并提。
  terms: [三个务必, 两个务必]
  related: [initial-mission, self-revolution, eight-point-rules, four-winds]
  lists:
    - title: 三个务必（二十大报告，2022）
      cite: i01-gov-2022-10-16-20th-report
      items: [务必不忘初心、牢记使命, 务必谦虚谨慎、艰苦奋斗, 务必敢于斗争、善于斗争]
  sections:
    - h: 源流
      from: 2002-12
      to: 2021-07
      text: 中共党史年表记载，2002年12月5日至6日，胡锦涛带领中央书记处成员到西柏坡学习考察，“重温毛泽东关于“两个务必”的重要论述”。2021年7月1日建党百年的《人民日报》社论要求“牢记初心使命，坚持“两个务必””。
      cites: [e01-gov-2021-06-28-cpc-100y, i04-rmrb-2021-07-01-editorial]
    - h: 二十大提出
      from: 2022-10
      text: 二十大报告在开篇说“我们党立志于中华民族千秋伟业”，接着提出三个“务必”，再要求“坚定历史自信，增强历史主动”。新增的第三条“敢于斗争、善于斗争”与报告中的斗争精神论述呼应，第一条与十九大的“不忘初心，牢记使命”主题衔接。
      cites: [i01-gov-2022-10-16-20th-report, i01-gov-2017-10-18-19th-report]
    - h: 进入纪检与干部话语
      from: 2022-10
      text: 2022年10月，黄坤明任广东省委书记时表态“自觉践行“三个务必””。2023年1月二十届中央纪委二次全会工作报告要求“坚持纠“四风”树新风并举，教育引导党员干部牢记“三个务必””；2024年1月三次全会报告要求纪检监察干部“牢记“三个务必”、践行“三严三实””。
      cites: [b11-gd-2022-10-28-huang-guangdong, cs2-gov-2023-01-10-ccdi-2nd-plenum, cs2-ccdi-2024-01-10-ccdi-3rd-plenum]
  policies:
    - date: 2023-01
      name: 二十届中央纪委二次全会部署作风建设
      text: 把牢记“三个务必”写入纠治“四风”、推进作风建设常态化长效化的部署。
      cite: cs2-gov-2023-01-10-ccdi-2nd-plenum
    - date: 2024-01
      name: 纪检监察干部队伍自我革命
      text: 二十届中央纪委三次全会把“三个务必”列为纪检监察干部作风要求。
      cite: cs2-ccdi-2024-01-10-ccdi-3rd-plenum
  cites: [i01-gov-2022-10-16-20th-report, i01-gov-2017-10-18-19th-report, e01-gov-2021-06-28-cpc-100y, i04-rmrb-2021-07-01-editorial, b11-gd-2022-10-28-huang-guangdong, cs2-gov-2023-01-10-ccdi-2nd-plenum, cs2-ccdi-2024-01-10-ccdi-3rd-plenum]

- id: cultural-confidence
  name: 文化自信
  en: Cultural Confidence
  kind: component
  parent: four-confidences
  by: [hu-jintao, xi-jinping]
  first:
    date: 2011-10-18
    text: 胡锦涛时期的十七届六中全会公报已提出“文化自觉和文化自信”。
    cite: e07-cppcc-2011-10-18-6th-plenum
    quote: 培养高度的文化自觉和文化自信
  codified:
    - date: 2016-07-01
      where: 习近平在庆祝建党95周年大会上的讲话
      cite: i01-cpc-2016-07-01-95th-anniversary
      quote: 文化自信，是更基础、更广泛、更深厚的自信
    - date: 2017-10-24
      where: 党章（十九大修正案）
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 坚定道路自信、理论自信、制度自信、文化自信
  summary: 文化自信一词在胡锦涛时期已出现，十七届六中全会和十八大报告都写“文化自觉和文化自信”。习近平2016年把它列为“四个自信”的第四项，并称它“是更基础、更广泛、更深厚的自信”；十九大报告称它是“一个国家、一个民族发展中更基本、更深沉、更持久的力量”。二十大报告以“推进文化自信自强”为第八部分标题，并提出“历史自信、文化自信”。2023年文化传承发展座谈会把“坚定文化自信”与“建设中华民族现代文明”连用，二十届三中全会决定的文化体制改革部分也以“增强文化自信”开头。
  terms: [文化自信, 文化自信自强]
  related: [four-confidences, chinese-dream, positive-energy, chinese-modernization]
  sections:
    - h: 胡锦涛时期的“文化自觉和文化自信”
      from: 2011-10
      to: 2012-11
      text: 2011年十七届六中全会以文化体制改革为主题，公报要求“培养高度的文化自觉和文化自信，提高全民族文明素质，增强国家文化软实力”，提出建设社会主义文化强国。十八大报告要求“树立高度的文化自觉和文化自信，向着建设社会主义文化强国宏伟目标阔步前进”。
      cites: [e07-cppcc-2011-10-18-6th-plenum, i01-wsyu-2012-11-08-18th-report]
    - h: 第四个自信
      from: 2016-07
      to: 2017-10
      text: 2016年7月1日，习近平说“全党要坚定道路自信、理论自信、制度自信、文化自信”，并称中华优秀传统文化、革命文化和社会主义先进文化“积淀着中华民族最深层的精神追求”。2017年政府工作报告写入“坚定文化自信”。十九大报告称“文化自信是一个国家、一个民族发展中更基本、更深沉、更持久的力量”，修改后的党章写入四个自信。
      cites: [i01-cpc-2016-07-01-95th-anniversary, i02-gov-2017-gwr, i01-gov-2017-10-18-19th-report, e03-gov-2017-10-24-charter-resolution]
    - h: 文化自信自强
      from: 2022-10
      text: 二十大报告第八部分题为“推进文化自信自强，铸就社会主义文化新辉煌”，要求“围绕举旗帜、聚民心、育新人、兴文化、展形象建设社会主义文化强国”；报告还提出“必须坚定历史自信、文化自信，坚持古为今用、推陈出新”。2023年6月文化传承发展座谈会上，习近平说“建设中华民族现代文明，是我们在新时代新的文化使命”。2024年二十届三中全会决定说“中国式现代化是物质文明和精神文明相协调的现代化。必须增强文化自信”。
      cites: [i01-gov-2022-10-16-20th-report, i05-xinhua-2023-06-02-culture-symposium, i01-gov-2024-07-18-third-plenum-decision]
  policies:
    - date: 2011-10-18
      name: 十七届六中全会文化体制改革决定
      text: 提出建设社会主义文化强国，公报写入“文化自觉和文化自信”。
      cite: e07-cppcc-2011-10-18-6th-plenum
    - date: 2017-03-05
      name: 政府工作报告“坚定文化自信”
      text: 与实施中华优秀传统文化传承发展工程、全民阅读等一并部署。
      cite: i02-gov-2017-gwr
    - date: 2024-07-18
      name: 深化文化体制机制改革
      text: 二十届三中全会决定以“增强文化自信”统领意识形态工作责任制等文化领域改革。
      events: [third-plenum-20th]
      cite: i01-gov-2024-07-18-third-plenum-decision
  cites: [e07-cppcc-2011-10-18-6th-plenum, i01-wsyu-2012-11-08-18th-report, i01-cpc-2016-07-01-95th-anniversary, i02-gov-2017-gwr, i01-gov-2017-10-18-19th-report, e03-gov-2017-10-24-charter-resolution, i01-gov-2022-10-16-20th-report, i05-xinhua-2023-06-02-culture-symposium, i01-gov-2024-07-18-third-plenum-decision]

- id: digital-china
  name: 数字中国
  en: Digital China
  kind: formula
  by: [xi-jinping]
  first:
    date: 2017-10-18
    text: 库内所见最早是十九大报告，与网络强国、智慧社会等并列。
    cite: i01-gov-2017-10-18-19th-report
    quote: 网络强国、交通强国、数字中国、智慧社会
  codified:
    - date: 2020-10-29
      where: 十九届五中全会公报
      cite: e04-xinhua-2020-10-29-5th-plenum
      quote: 坚定不移建设制造强国、质量强国、网络强国、数字中国
    - date: 2022-10-16
      where: 二十大报告
      cite: i01-gov-2022-10-16-20th-report
      quote: 加快建设制造强国、质量强国、航天强国、交通强国、网络强国、数字中国
  summary: 数字中国是与网络强国配套的信息化建设目标，十九大报告把它与“智慧社会”等并列，此后写入十九届五中全会公报和二十大报告。2023年2月中共中央、国务院印发《数字中国建设整体布局规划》，提出“2522”整体框架和2025、2035年两阶段目标，称“建设数字中国是数字时代推进中国式现代化的重要引擎”。同年3月机构改革组建国家数据局，把中央网信办承担的数字中国建设方案拟订等职责划入，由国家发展改革委管理。规划也把“清朗”“净网”专项行动列为数字中国建设的一部分。
  terms: [数字中国]
  related: [new-quality-productive-forces, great-firewall, qinglang, chinese-modernization, cyber-power]
  lists:
    - title: 数字中国建设“2522”整体框架（2023年整体布局规划）
      cite: i06-gov-2023-02-27-digital-china
      items: [两大基础, 五位一体, 两大能力, 两个环境]
  sections:
    - h: 提出
      from: 2017-10
      to: 2021-03
      text: 十九大报告要求创新“为建设科技强国、质量强国、航天强国、网络强国、交通强国、数字中国、智慧社会提供有力支撑”。2018年政府工作报告以提速降费“为数字中国、网络强国建设加油助力”；2021年政府工作报告的“十四五”目标要求“协同推进数字产业化和产业数字化转型”“建设数字中国”。
      cites: [i01-gov-2017-10-18-19th-report, i02-gov-2018-gwr, i02-gov-2021-gwr]
    - h: 整体布局规划
      from: 2023-02
      text: 规划的“2522”框架是：夯实数字基础设施和数据资源体系“两大基础”，推进数字技术与经济、政治、文化、社会、生态文明建设“五位一体”深度融合，强化数字技术创新体系和数字安全屏障“两大能力”，优化数字化发展国内国际“两个环境”。目标是到2025年“数字中国建设取得重要进展”，到2035年“数字化发展水平进入世界前列”。规划还要求“推进“清朗”、“净网”系列专项行动”，高质量共建“数字丝绸之路”。
      cites: [i06-gov-2023-02-27-digital-china]
    - h: 国家数据局与“十五五”
      from: 2023-03
      text: 2023年机构改革组建国家数据局，“统筹推进数字中国、数字经济、数字社会规划和建设等”，由国家发展和改革委员会管理。二十届四中全会公报要求“深入推进数字中国建设”；2026年政府工作报告提出“十五五”期间数字经济核心产业增加值占国内生产总值比重达到12.5%。
      cites: [e05-gov-2023-03-16-reform-plan, i01-fmprc-2025-10-23-fourth-plenum-communique, i02-gov-2026-gwr]
  policies:
    - date: 2023-02-27
      name: 数字中国建设整体布局规划
      text: 中共中央、国务院印发，确立“2522”框架和2025、2035年目标，由中央网络安全和信息化委员会统筹，建设情况作为党政领导干部考核评价的参考。
      cite: i06-gov-2023-02-27-digital-china
    - date: 2023-03-16
      name: 组建国家数据局
      text: 承接中央网信办和国家发展改革委的数字中国、数字经济相关职责。
      cite: e05-gov-2023-03-16-reform-plan
    - date: 2026-03-05
      name: “十五五”数字经济目标
      text: 数字经济核心产业增加值占GDP比重目标定为12.5%。
      events: [npc-2026-fyp]
      cite: i02-gov-2026-gwr
  cites: [i01-gov-2017-10-18-19th-report, i02-gov-2018-gwr, i02-gov-2021-gwr, e04-xinhua-2020-10-29-5th-plenum, i01-gov-2022-10-16-20th-report, i06-gov-2023-02-27-digital-china, e05-gov-2023-03-16-reform-plan, i01-fmprc-2025-10-23-fourth-plenum-communique, i02-gov-2026-gwr]

- id: healthy-china
  name: 健康中国
  en: Healthy China
  kind: formula
  by: [xi-jinping]
  first:
    date: 2015-10-29
    text: 十八届五中全会公报提出。
    cite: i01-moe-2015-10-29-5th-plenum-communique
    quote: 推进健康中国建设，深化医药卫生体制改革
  codified:
    - date: 2017-10-18
      where: 十九大报告
      cite: i01-gov-2017-10-18-19th-report
      quote: 人民健康是民族昌盛和国家富强的重要标志
    - date: 2022-10-16
      where: 二十大报告
      cite: i01-gov-2022-10-16-20th-report
      quote: 人民健康是民族昌盛和国家强盛的重要标志
  summary: 健康中国由十八届五中全会提出，写入“十三五”目标；十九大报告升格为“健康中国战略”，称“人民健康是民族昌盛和国家富强的重要标志”。十九届五中全会把建成健康中国列为2035年远景目标之一。新冠疫情后，第三个历史决议和二十大报告的健康中国部分加重了公共卫生应急体系和“爱国卫生运动”的分量，二十大报告同时把生育支持和人口老龄化放进这一节。2026年政府工作报告把“十五五”人均预期寿命目标定为80岁。
  terms: [健康中国, 健康中国战略]
  related: [dynamic-zero, xiaokang, chinese-modernization]
  sections:
    - h: 提出
      from: 2015-10
      to: 2017-03
      text: 十八届五中全会公报要求“推进健康中国建设，深化医药卫生体制改革，理顺药品价格，实行医疗、医保、医药联动”。2016年政府工作报告的“十三五”目标写有“推进健康中国建设，人均预期寿命提高1岁”；2017年报告要求城乡居民医保财政补助由每人每年420元提高到450元，并“实现异地就医住院费用直接结算”。
      cites: [i01-moe-2015-10-29-5th-plenum-communique, i02-gov-2016-gwr, i02-gov-2017-gwr]
    - h: 战略
      from: 2017-10
      to: 2020-10
      text: 十九大报告说“人民健康是民族昌盛和国家富强的重要标志”，要求“为人民群众提供全方位全周期健康服务”，“全面建立中国特色基本医疗卫生制度”。十九届五中全会提出到2035年“建成文化强国、教育强国、人才强国、体育强国、健康中国”。
      cites: [i01-gov-2017-10-18-19th-report, e04-xinhua-2020-10-29-5th-plenum]
    - h: 疫情之后
      from: 2020-03
      text: 2020年3月《人民日报》任仲平文章称，人们若在疫情中养成更健康的生活方式，“必定能在人与自然、人与社会、人与自身的和谐相处中，成就一个更高水平的“健康中国””。第三个历史决议在健康中国条目下写入“及时推动完善重大疫情防控体制机制、健全国家公共卫生应急管理体系”。二十大报告要求“提高重大疫情早发现能力”，“深入开展健康中国行动和爱国卫生运动”，并在同一节要求“建立生育支持政策体系，降低生育、养育、教育成本”。
      cites: [i04-rmrb-2020-03-26-renzhongping, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report]
  policies:
    - date: 2016-03-05
      name: “十三五”健康目标
      text: 政府工作报告把人均预期寿命提高1岁列为“十三五”目标。
      cite: i02-gov-2016-gwr
    - date: 2017-03-05
      name: 医保补助提标与异地就医直接结算
      text: 城乡居民医保财政补助提高到每人每年450元，推进全国医保信息联网。
      cite: i02-gov-2017-gwr
    - date: 2026-03-05
      name: “十五五”人均预期寿命目标
      text: 提出加快建设健康中国和体育强国，人均预期寿命提高到80岁。
      events: [npc-2026-fyp]
      cite: i02-gov-2026-gwr
  cites: [i01-moe-2015-10-29-5th-plenum-communique, i02-gov-2016-gwr, i02-gov-2017-gwr, i01-gov-2017-10-18-19th-report, e04-xinhua-2020-10-29-5th-plenum, i04-rmrb-2020-03-26-renzhongping, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i02-gov-2026-gwr]

- id: qinglang
  name: “清朗”系列专项行动
  en: Qinglang (Clear and Bright) Campaigns
  kind: formula
  first:
    date: 2014-02-27
    text: 中央网络安全和信息化领导小组第一次会议上，习近平要求“使网络空间清朗起来”。
    cite: e08-gov-2014-02-27-cyber-group
    quote: 把握好网上舆论引导的时、度、效，使网络空间清朗起来
  codified:
    - date: 2017-10-18
      where: 十九大报告
      cite: i01-gov-2017-10-18-19th-report
      quote: 建立网络综合治理体系，营造清朗的网络空间
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 坚持依法管网治网，营造清朗的网络空间
  summary: “清朗”来自习近平2014年“使网络空间清朗起来”的要求，十九大报告写作“营造清朗的网络空间”。国家网信办以“清朗”为名组织系列专项行动，2021年列出整治网上历史虚无主义、打击网络水军、治理算法滥用、整治未成年人网络环境等8项任务，并在当年8月发布整治“饭圈”乱象的十项措施，要求从“维护网上政治安全和意识形态安全”的高度推进。2023年《数字中国建设整体布局规划》把“清朗”“净网”系列专项行动写入网络生态治理部分。第三个历史决议称“过不了互联网这一关就过不了长期执政这一关”。
  terms: [清朗, 清朗行动, 饭圈]
  related: [great-firewall, positive-energy, digital-china, party-history-education]
  lists:
    - title: 2021年网络“清朗”系列专项行动的8项任务（国新办发布会）
      cite: i06-cac-2021-05-08-qinglang
      items: [整治网上历史虚无主义, 整治春节期间网络环境, 打击网络水军、流量造假、黑公关, 治理算法滥用行为, 整治未成年人网络环境, 整治网上文娱及热点排行乱象, 规范网站账号运营, 整治PUSH弹窗突出问题]
    - title: 进一步加强“饭圈”乱象治理的十项措施（中央网信办秘书局，2021）
      cite: i06-cac-2021-08-25-fanquan
      items: [取消明星艺人榜单, 优化调整排行规则, 严管明星经纪公司, 规范粉丝群体账号, 严禁呈现互撕信息, 清理违规群组版块, 不得诱导粉丝消费, 强化节目设置管理, 严控未成年人参与, 规范应援集资行为]
  sections:
    - h: 由来
      from: 2014-02
      to: 2021-11
      text: 2014年2月中央网信领导小组成立时，习近平要求“弘扬主旋律，激发正能量”，“使网络空间清朗起来”。十九大报告要求“加强互联网内容建设，建立网络综合治理体系，营造清朗的网络空间”。第三个历史决议称互联网是“意识形态斗争的主阵地、主战场、最前沿”，党“健全互联网领导和管理体制，坚持依法管网治网”。
      cites: [e08-gov-2014-02-27-cyber-group, i01-gov-2017-10-18-19th-report, b04-gov-2021-11-16-resolution]
    - h: 2021年系列专项行动
      from: 2021-05
      text: 2021年5月8日国新办发布会上，国家网信办副主任盛荣华说，专项行动“在全网开展“大扫除””，把信息内容、行为过程、网络账号、平台运营、平台规则等全部纳入治理范围；对典型案例“依法依规坚决查处并全网曝光”，做到“查处一起，震慑一批”，并在12377网站开设举报专区。
      cites: [i06-cac-2021-05-08-qinglang]
    - h: “饭圈”整治
      from: 2021-08
      text: 2021年8月，中央网信办秘书局在“清朗·‘饭圈’乱象整治”专项行动基础上下发通知，要求取消所有涉明星艺人个人或组合的排行榜单，持续解散以打投、应援、集资、控评、八卦、爆料等为主题的粉丝社区、群组，严禁未成年人打赏和应援消费，并要求各地“从维护网上政治安全和意识形态安全、营造清朗网络空间的高度”推进。
      cites: [i06-cac-2021-08-25-fanquan]
    - h: 常态化
      from: 2023-02
      text: 《数字中国建设整体布局规划》要求“净化网络空间，深入开展网络生态治理工作，推进“清朗”、“净网”系列专项行动，创新推进网络文明建设”。
      cites: [i06-gov-2023-02-27-digital-china]
  policies:
    - date: 2021-05-08
      name: 2021年网络“清朗”系列专项行动
      text: 国新办发布会公布8项任务，网信部门对典型案例查处并全网曝光。
      cite: i06-cac-2021-05-08-qinglang
    - date: 2021-08-25
      name: 关于进一步加强“饭圈”乱象治理的通知
      text: 十项措施覆盖明星榜单、经纪公司、粉丝账号、未成年人和应援集资。
      cite: i06-cac-2021-08-25-fanquan
  cites: [e08-gov-2014-02-27-cyber-group, i01-gov-2017-10-18-19th-report, b04-gov-2021-11-16-resolution, i06-cac-2021-05-08-qinglang, i06-cac-2021-08-25-fanquan, i06-gov-2023-02-27-digital-china]

- id: modernization-five-features
  name: 中国式现代化的五个特征
  en: Five Features of Chinese Modernization
  kind: component
  parent: chinese-modernization
  by: [xi-jinping]
  first:
    date: 2021-01-22
    text: 库内所见最早是2021年1月《人民日报》任仲平文章，五个特征已按定型的顺序列出。
    cite: i04-rmrb-2021-01-22-renzhongping
    quote: 我们要实现的现代化，是人口规模巨大的现代化，是全体人民共同富裕的现代化
  codified:
    - date: 2022-10-16
      where: 二十大报告
      cite: i01-gov-2022-10-16-20th-report
      quote: 中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色
  summary: 二十大报告用五个“中国式现代化是……的现代化”界定中国特色：人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路。这组表述在2021年1月的《人民日报》任仲平文章中已完整出现，二十大报告为每一条配了一段解释，随后列出九项“本质要求”。五个特征大致各对应一条政策线：人口规模对应“保持历史耐心”和人口生育政策，共同富裕对应2021年中央财经委会议的分配改革，物质与精神对应文化自信和三中全会的文化体制改革，人与自然对应碳达峰碳中和，和平发展对应人类命运共同体的外交表述。
  terms: [中国式现代化, 五个特征]
  related: [chinese-modernization, common-prosperity, cultural-confidence, dual-carbon, community-shared-future, ecological-civilization]
  lists:
    - title: 中国式现代化的五个特征（二十大报告，2022）
      cite: i01-gov-2022-10-16-20th-report
      items: [人口规模巨大的现代化, 全体人民共同富裕的现代化, 物质文明和精神文明相协调的现代化, 人与自然和谐共生的现代化, 走和平发展道路的现代化]
  sections:
    - h: 成形
      from: 2021-01
      to: 2022-10
      text: 2021年1月22日《人民日报》任仲平文章写道：“我们要实现的现代化，是人口规模巨大的现代化，是全体人民共同富裕的现代化，是物质文明和精神文明相协调的现代化，是人与自然和谐共生的现代化，是走和平发展道路的现代化。”2022年9月二十大前夕的任仲平文章以同样的五句话概括中国式现代化，并称“生态之变，是观察中国式现代化的一扇绝佳窗口”。
      cites: [i04-rmrb-2021-01-22-renzhongping, i04-rmrb-2022-09-29-renzhongping]
    - h: 二十大的五段解释
      from: 2022-10
      text: 二十大报告对人口规模的解释是“我国十四亿多人口整体迈进现代化社会，规模超过现有发达国家人口的总和”，要求“保持历史耐心”；共同富裕一条说“共同富裕是中国特色社会主义的本质要求”，要“坚决防止两极分化”；物质与精神一条说“物质贫困不是社会主义，精神贫乏也不是社会主义”；和平发展一条说“我国不走一些国家通过战争、殖民、掠夺等方式实现现代化的老路”。
      cites: [i01-gov-2022-10-16-20th-report]
    - h: 落到政策
      from: 2021-08
      to: 2024-07
      text: 2021年8月中央财经委员会第十次会议称共同富裕“是中国式现代化的重要特征”，要求构建初次分配、再分配、三次分配协调配套的基础性制度安排。2021年9月的“双碳”意见为“人与自然和谐共生”一条提供了量化指标。2024年二十届三中全会决定的文化体制改革部分以“中国式现代化是物质文明和精神文明相协调的现代化。必须增强文化自信”开头。
      cites: [e04-gov-2021-08-17-common-prosperity, i06-gov-2021-10-24-carbon-opinion, i01-gov-2024-07-18-third-plenum-decision]
  policies:
    - date: 2021-08-17
      name: 中央财经委员会第十次会议部署共同富裕
      text: 把共同富裕定为中国式现代化的重要特征，提出三次分配和橄榄型分配结构。
      events: [common-prosperity-meeting]
      cite: e04-gov-2021-08-17-common-prosperity
    - date: 2022-10-16
      name: 二十大报告界定五个特征和本质要求
      text: 五个特征和九项本质要求一并写入报告第三部分，此后成为中国式现代化的标准表述。
      events: [charter-two-establishes]
      cite: i01-gov-2022-10-16-20th-report
    - date: 2024-07-18
      name: 二十届三中全会《关于进一步全面深化改革、推进中国式现代化的决定》
      text: 决定以推进中国式现代化为题，文化体制改革部分直接援引“物质文明和精神文明相协调”。
      events: [third-plenum-20th]
      cite: i01-gov-2024-07-18-third-plenum-decision
  cites: [i04-rmrb-2021-01-22-renzhongping, i04-rmrb-2022-09-29-renzhongping, i01-gov-2022-10-16-20th-report, e04-gov-2021-08-17-common-prosperity, i06-gov-2021-10-24-carbon-opinion, i01-gov-2024-07-18-third-plenum-decision]

- id: made-in-china-2025
  name: 中国制造2025 / 制造强国
  en: Made in China 2025
  kind: document
  by: [li-keqiang]
  first:
    date: 2015-03-05
    text: 李克强在2015年政府工作报告中提出。
    cite: i02-gov-2015-gwr
    quote: 要实施“中国制造2025”，坚持创新驱动、智能转型、强化基础、绿色发展，加快从制造大国转向制造强国
  codified:
    - date: 2015-10-29
      where: 十八届五中全会公报
      cite: i01-moe-2015-10-29-5th-plenum-communique
      quote: 加快建设制造强国，实施《中国制造二〇二五》
    - date: 2017-10-18
      where: 十九大报告
      cite: i01-gov-2017-10-18-19th-report
      quote: 加快建设制造强国
  summary: 《中国制造2025》是国务院2015年推出的制造业升级规划，目标是“从制造大国转向制造强国”。2015至2018年的政府工作报告连续提及，2017年报告承诺在享受该政策方面“对内外资企业一视同仁”。2018年中美贸易战后，这一名称从2019年起不再出现在政府工作报告中，报告改用“加快建设制造强国”；十九大、二十大报告和二十届四中全会公报都保留“制造强国”。前财政部长楼继伟2019年批评该计划“是浪费公款”，不久被免去全国社保基金理事长职务。
  terms: [中国制造2025, 制造强国]
  related: [new-whole-nation-system, supply-side, new-quality-productive-forces, digital-china]
  sections:
    - h: 提出与实施
      from: 2015-03
      to: 2017-03
      text: 2015年政府工作报告说“制造业是我们的优势产业”，要“实施“中国制造2025””。十八届五中全会公报把它写入“十三五”建议，与“实施工业强基工程”并列。2016年报告回顾称“启动实施《中国制造2025》”，同时设立国家新兴产业创业投资引导基金；2017年报告要求“全面实施《中国制造2025》”，并说在资质许可、标准制定、政府采购、享受《中国制造2025》政策等方面“对内外资企业一视同仁”。
      cites: [i02-gov-2015-gwr, i01-moe-2015-10-29-5th-plenum-communique, i02-gov-2016-gwr, i02-gov-2017-gwr]
    - h: 名称淡出
      from: 2018-03
      to: 2019-03
      text: 2018年政府工作报告最后一次提及，包括“创建“中国制造2025”示范区”和推动集成电路、第五代移动通信、飞机发动机等产业发展。同年中美贸易战爆发。2019年报告不再出现这一名称，改写为“围绕推动制造业高质量发展”“加快建设制造强国”。
      cites: [i02-gov-2018-gwr, i02-gov-2019-gwr]
    - h: 制造强国延续
      from: 2017-10
      text: 十九大报告要求“加快建设制造强国，加快发展先进制造业”；二十大报告列出“加快建设制造强国、质量强国、航天强国、交通强国、网络强国、数字中国”；二十届四中全会公报在“十五五”部署中要求“保持制造业合理比重”。
      cites: [i01-gov-2017-10-18-19th-report, i01-gov-2022-10-16-20th-report, i01-fmprc-2025-10-23-fourth-plenum-communique]
  policies:
    - date: 2015-03-05
      name: 政府工作报告提出实施“中国制造2025”
      text: 同一部分要求以财政贴息、加速折旧等措施推动传统产业技术改造，化解过剩产能。
      cite: i02-gov-2015-gwr
    - date: 2017-03-05
      name: 全面实施《中国制造2025》并对外资一视同仁
      text: 推进国家智能制造示范区、制造业创新中心建设，承诺内外资企业平等享受政策。
      cite: i02-gov-2017-gwr
    - date: 2019-03-05
      name: 改提“加快建设制造强国”
      text: 政府工作报告不再出现《中国制造2025》的名称，改为“加快建设制造强国”。
      events: [e03-2018-us-china-trade-war]
      cite: i02-gov-2019-gwr
  voices:
    - voice: west
      text: 美国之音引述《南华早报》，楼继伟在2019年两会期间说“中国制造2025”这个战略不应提出，他从一开始就反对，该计划说得很多、做得很少，是浪费公款；外界将他随后被免去社保基金理事长职务与这番言论联系起来。
      cite: c05-voa-2019-04-07-lou-jiwei
  cites: [i02-gov-2015-gwr, i01-moe-2015-10-29-5th-plenum-communique, i02-gov-2016-gwr, i02-gov-2017-gwr, i02-gov-2018-gwr, i02-gov-2019-gwr, i01-gov-2017-10-18-19th-report, i01-gov-2022-10-16-20th-report, i01-fmprc-2025-10-23-fourth-plenum-communique, c05-voa-2019-04-07-lou-jiwei]

- id: cyber-power
  name: 网络强国
  en: Cyber Superpower
  kind: formula
  by: [xi-jinping]
  first:
    date: 2014-02-27
    text: 中央网络安全和信息化领导小组第一次会议上提出。
    cite: e08-gov-2014-02-27-cyber-group
    quote: 努力把我国建设成为网络强国
  codified:
    - date: 2015-10-29
      where: 十八届五中全会公报
      cite: i01-moe-2015-10-29-5th-plenum-communique
      quote: 实施网络强国战略，实施“互联网+”行动计划
    - date: 2022-10-16
      where: 二十大报告
      cite: i01-gov-2022-10-16-20th-report
      quote: 加快建设制造强国、质量强国、航天强国、交通强国、网络强国、数字中国
  summary: 网络强国是习近平2014年2月出任中央网络安全和信息化领导小组组长时提出的目标，同时提出“没有网络安全就没有国家安全，没有信息化就没有现代化”。2015年十八届五中全会写入“实施网络强国战略”，2016年网络安全法、2021年数据安全法相继出台。官方此后把相关论述称为“习近平总书记关于网络强国的重要思想”，网信部门的“清朗”专项行动和《数字中国建设整体布局规划》都以它为指导。2025年政府工作报告提出“推动新时代网络强国建设”。
  terms: [网络强国, 网络强国战略]
  related: [digital-china, qinglang, great-firewall, holistic-security]
  sections:
    - h: 提出
      from: 2014-02
      text: 领导小组第一次会议上，习近平说网络安全和信息化“是事关国家安全和国家发展、事关广大人民群众工作生活的重大战略问题”。他提出建设网络强国“要有自己的技术，有过硬的技术”，要有信息服务、网络文化、信息基础设施和人才队伍，并说“建设网络强国的战略部署要与“两个一百年”奋斗目标同步推进”。会议同时要求“完善互联网信息内容管理、关键信息基础设施保护等法律法规”。
      cites: [e08-gov-2014-02-27-cyber-group]
    - h: 战略与立法
      from: 2015-10
      to: 2021-06
      text: 十八届五中全会公报把“实施网络强国战略”与“互联网+”行动计划、国家大数据战略并列。2016年11月全国人大常委会通过网络安全法，网信办称它是“我国网络领域的基础性法律”。十九大报告把网络强国与科技强国、数字中国、智慧社会并列。2021年数据安全法通过。
      cites: [i01-moe-2015-10-29-5th-plenum-communique, e08-cac-2016-11-07-cyber-law, i01-gov-2017-10-18-19th-report, i06-cac-2021-06-11-data-security-law]
    - h: “重要思想”
      from: 2021-05
      text: 2021年网信办在“清朗”专项行动发布会上说，全国网信系统“深入贯彻落实习近平总书记关于网络强国的重要思想”；2023年《数字中国建设整体布局规划》也要求以“习近平总书记关于网络强国的重要思想”为指导。2025年政府工作报告要求“健全网络生态治理长效机制，发展积极健康的网络文化，推动新时代网络强国建设”；二十届四中全会公报继续把网络强国列入“十五五”的强国目标。
      cites: [i06-cac-2021-05-08-qinglang, i06-gov-2023-02-27-digital-china, i02-gov-2025-gwr, i01-fmprc-2025-10-23-fourth-plenum-communique]
  policies:
    - date: 2014-02-27
      name: 中央网络安全和信息化领导小组成立
      text: 习近平任组长，提出建设网络强国，要求完善互联网信息内容管理等法律法规。
      events: [e08-2014-cyber-leading-group]
      cite: e08-gov-2014-02-27-cyber-group
    - date: 2016-11-07
      name: 网络安全法
      text: 规定关键信息基础设施保护和网络信息内容管理，2017年6月1日起施行。
      events: [e08-2016-cybersecurity-law]
      cite: e08-cac-2016-11-07-cyber-law
    - date: 2021-06-10
      name: 数据安全法
      text: 确立数据分类分级保护和国家核心数据管理制度，2021年9月1日起施行。
      cite: i06-cac-2021-06-11-data-security-law
  cites: [e08-gov-2014-02-27-cyber-group, i01-moe-2015-10-29-5th-plenum-communique, e08-cac-2016-11-07-cyber-law, i01-gov-2017-10-18-19th-report, i06-cac-2021-06-11-data-security-law, i06-cac-2021-05-08-qinglang, i06-gov-2023-02-27-digital-china, i02-gov-2025-gwr, i01-fmprc-2025-10-23-fourth-plenum-communique, i01-gov-2022-10-16-20th-report]

- id: anti-mafia-campaign
  name: 扫黑除恶专项斗争
  en: Campaign Against Organized Crime
  kind: formula
  by: [xi-jinping]
  first:
    date: 2018-01-24
    text: 中共中央、国务院发出《关于开展扫黑除恶专项斗争的通知》。
    cite: i06-gov-2018-01-24-saohei
    quote: 党中央、国务院决定，在全国开展扫黑除恶专项斗争
  codified:
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 开展扫黑除恶专项斗争，坚决惩治放纵、包庇黑恶势力甚至充当保护伞的党员干部
    - date: 2022-10-16
      where: 二十大报告
      cite: i01-gov-2022-10-16-20th-report
      quote: 推进扫黑除恶常态化
  summary: 扫黑除恶专项斗争是2018年1月由中共中央、国务院部署的全国运动，要求“把打击黑恶势力犯罪和反腐败、基层“拍蝇”结合起来”，深挖黑恶势力“保护伞”。中央扫黑除恶督导组分组进驻各省，云南孙小果案等成为标志性案件。2021年起官方改称“常态化开展扫黑除恶斗争”，二十大报告和二十届三中全会决定分别写入“推进扫黑除恶常态化”“健全扫黑除恶常态化机制”。曾参与这场运动的公安部副部长孙力军后来落马。
  terms: [扫黑除恶, 保护伞]
  related: [fengqiao-experience, stability-maintenance, rule-of-law, rural-revitalization]
  lists:
    - title: 专项斗争的方针（2018年通知）
      cite: i06-gov-2018-01-24-saohei
      items: [依法严惩, 打早打小, 除恶务尽]
  sections:
    - h: 启动
      from: 2018-01
      text: 通知称扫黑除恶“事关社会大局稳定和国家长治久安，事关人心向背和基层政权巩固”，要求“坚持依法严惩、打早打小、除恶务尽”，“把打击黑恶势力犯罪和反腐败、基层“拍蝇”结合起来”，“深挖黑恶势力“保护伞””。
      cites: [i06-gov-2018-01-24-saohei]
    - h: 督导与大案
      from: 2019
      to: 2020
      text: 2019年政府工作报告要求“深入推进扫黑除恶专项斗争”。同年中央扫黑除恶督导组进驻各省，原陕西省政协主席韩勇任第20督导组组长，进驻云南、宁夏等省份，查办孙小果等案。2020年1月中央纪委全会工作报告称，纪检机关“把扫黑除恶同基层“拍蝇”结合起来”，实地指导查处昆明孙小果案等涉黑腐败和“保护伞”案件。
      cites: [i02-gov-2019-gwr, k04-wiki-han-yong, b05-ccdi-2020-01-zhao-leji-report]
    - h: 常态化
      from: 2021-03
      text: 2021年政府工作报告回顾“持续推进扫黑除恶专项斗争”，并在当年任务中改称“常态化开展扫黑除恶斗争”。2022年1月十九届中央纪委六次全会上，习近平要求“巩固深化扫黑除恶专项斗争、政法队伍教育整顿成果”。二十大报告写入“推进扫黑除恶常态化”，二十届三中全会决定要求“健全扫黑除恶常态化机制，依法严惩群众反映强烈的违法犯罪活动”。
      cites: [i02-gov-2021-gwr, i01-gov-2022-01-18-self-revolution, i01-gov-2022-10-16-20th-report, i01-gov-2024-07-18-third-plenum-decision]
    - h: 执行者落马
      from: 2020-04
      to: 2023-10
      text: 2020年4月公安部副部长孙力军被查，BBC中文网指出，他的工作牵涉多种治安工作，“包括中国近年来推行的扫黑除恶运动”。2023年10月，曾任中央扫黑除恶督导组组长的韩勇也因涉嫌严重违纪违法被查。
      cites: [b12-bbc-2020-04-20-sun-lijun, k04-wiki-han-yong]
  policies:
    - date: 2018-01-24
      name: 关于开展扫黑除恶专项斗争的通知
      text: 部署全国专项斗争，与反腐败、基层“拍蝇”结合。
      cite: i06-gov-2018-01-24-saohei
    - date: 2021-02-27
      name: 政法队伍教育整顿
      text: 2021年政法队伍教育整顿启动，此后与扫黑除恶专项斗争的成果被一并要求“巩固深化”。
      events: [e08-2021-zhengfa-rectification]
      cite: i01-gov-2022-01-18-self-revolution
    - date: 2024-07-18
      name: 健全扫黑除恶常态化机制
      text: 二十届三中全会决定把它列入完善社会治安整体防控体系。
      events: [third-plenum-20th]
      cite: i01-gov-2024-07-18-third-plenum-decision
  voices:
    - voice: west
      text: BBC中文网报道孙力军落马时指出，他的工作牵涉多种治安工作，包括中国近年来推行的扫黑除恶运动。
      cite: b12-bbc-2020-04-20-sun-lijun
  cites: [i06-gov-2018-01-24-saohei, i02-gov-2019-gwr, k04-wiki-han-yong, b05-ccdi-2020-01-zhao-leji-report, i02-gov-2021-gwr, i01-gov-2022-01-18-self-revolution, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i01-gov-2024-07-18-third-plenum-decision, b12-bbc-2020-04-20-sun-lijun]

- id: mass-entrepreneurship
  name: 大众创业、万众创新
  en: Mass Entrepreneurship and Innovation
  kind: formula
  by: [li-keqiang]
  first:
    date: 2015-03-05
    text: 库内所见最早是2015年政府工作报告，作为经济“双引擎”之一。
    cite: i02-gov-2015-gwr
    quote: 打造大众创业、万众创新和增加公共产品、公共服务“双引擎”
  codified:
    - date: 2015-10-29
      where: 十八届五中全会公报
      cite: i01-moe-2015-10-29-5th-plenum-communique
      quote: 激发创新创业活力，推动大众创业、万众创新
  summary: “大众创业、万众创新”（“双创”）是李克强任总理期间的标志性口号，2015年政府工作报告把它与增加公共产品、公共服务并列为经济“双引擎”，同年写入十八届五中全会公报。政府以简政放权、商事制度改革、“双创”示范基地和全国双创活动周推动，历年报告以新登记企业数衡量成效。疫情期间它转为稳就业手段；2023年李克强最后一份报告称已连续举办8届全国双创活动周、超过5.2亿人次参与。2024年起的政府工作报告不再出现这一口号。
  terms: [大众创业, 万众创新, 双创]
  related: [supply-side, made-in-china-2025, socialist-market-economy]
  sections:
    - h: 双引擎
      from: 2015-03
      to: 2016-03
      text: 2015年政府工作报告说，推动大众创业、万众创新“既可以扩大就业、增加居民收入，又有利于促进社会纵向流动和公平正义”。2016年报告称“大众创业、万众创新蓬勃发展，全年新登记注册企业增长21.6%，平均每天新增1.2万户”，并提出建设一批“双创”示范基地，打造众创、众包、众扶、众筹平台。
      cites: [i02-gov-2015-gwr, i02-gov-2016-gwr]
    - h: 稳就业
      from: 2018-03
      to: 2023-03
      text: 2018年报告称五年间“日均新设企业由5千多户增加到1万6千多户”。2020年5月李克强在记者会上说，要努力做到“平均每日新注册企业2万户左右”。2021年报告说“支持大众创业万众创新带动就业”，2023年报告称“连续举办8届全国双创活动周、超过5.2亿人次参与”。
      cites: [i02-gov-2018-gwr, gov-2020-05-29-li-keqiang-presser, i02-gov-2021-gwr, i02-gov-2023-gwr]
  policies:
    - date: 2015-03-05
      name: 政府工作报告提出“双引擎”
      text: 把大众创业、万众创新列为经济提质增效的两大引擎之一，配套简政放权和商事制度改革。
      cite: i02-gov-2015-gwr
    - date: 2016-03-05
      name: “双创”示范基地
      text: 建设一批“双创”示范基地，发展天使、创业投资。
      cite: i02-gov-2016-gwr
  cites: [i02-gov-2015-gwr, i01-moe-2015-10-29-5th-plenum-communique, i02-gov-2016-gwr, i02-gov-2018-gwr, gov-2020-05-29-li-keqiang-presser, i02-gov-2021-gwr, i02-gov-2023-gwr]
