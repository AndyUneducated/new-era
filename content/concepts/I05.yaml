- id: xi-economic-thought
  name: 习近平经济思想
  en: Xi Jinping Thought on the Economy
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2017-12-20
    text: 2017年12月中央经济工作会议首次提出“习近平新时代中国特色社会主义经济思想”，并以“七个坚持”概括其内涵。
    cite: i03-gov-2017-12-20-xi-economic-thought
    quote: 这次会议首次提出习近平新时代中国特色社会主义经济思想
  summary: 习近平经济思想是习近平思想在经济领域的分支，2017年12月中央经济工作会议首次提出，全称“习近平新时代中国特色社会主义经济思想”，会议称它“以新发展理念为主要内容”，是“中国特色社会主义政治经济学的最新成果”，内涵概括为“七个坚持”，第一条是党对经济工作的集中统一领导。2018年政府工作报告用的仍是全称；2022年人民日报任仲平文章、2023年中央金融工作会议、2024年起的政府工作报告改用简称“习近平经济思想”。
  terms: [习近平经济思想, 习近平新时代中国特色社会主义经济思想]
  related: [new-development-philosophy, high-quality-development, supply-side, socialist-market-economy, dual-circulation]
  lists:
    - title: 七个坚持（中央经济工作会议，2017）
      cite: i03-gov-2017-12-20-xi-economic-thought
      items:
        - 坚持加强党对经济工作的集中统一领导，保证我国经济沿着正确方向发展
        - 坚持以人民为中心的发展思想，贯穿到统筹推进“五位一体”总体布局和协调推进“四个全面”战略布局之中
        - 坚持适应把握引领经济发展新常态，立足大局，把握规律
        - 坚持使市场在资源配置中起决定性作用，更好发挥政府作用，坚决扫除经济发展的体制机制障碍
        - 坚持适应我国经济发展主要矛盾变化完善宏观调控，相机抉择，开准药方，把推进供给侧结构性改革作为经济工作的主线
        - 坚持问题导向部署经济发展新战略，对我国经济社会发展变革产生深远影响
        - 坚持正确工作策略和方法，稳中求进，保持战略定力、坚持底线思维，一步一个脚印向前迈进
  sections:
    - h: 提出
      from: 2017-12
      text: 十九大闭幕两个月后，2017年12月18日至20日的中央经济工作会议首次提出这一思想。会议说，5年来“在实践中形成了以新发展理念为主要内容的习近平新时代中国特色社会主义经济思想”，称它是“5年来推动我国经济发展实践的理论结晶”。它是继党章写入“习近平强军思想”之后第二个以领导人冠名的领域思想。
      cites: [i03-gov-2017-12-20-xi-economic-thought, e03-gov-2017-10-24-charter-resolution]
    - h: 七个坚持
      text: 会议用“七个坚持”概括其内涵：党对经济工作的集中统一领导排在第一，其后是以人民为中心的发展思想、经济发展新常态、市场在资源配置中起决定性作用、以供给侧结构性改革为主线的宏观调控、问题导向的发展战略、稳中求进与底线思维。其中“使市场在资源配置中起决定性作用，更好发挥政府作用”沿用2013年十八届三中全会决定的提法，新增的是把党的领导置于首位。
      cites: [i03-gov-2017-12-20-xi-economic-thought, e03-gov-2013-11-15-reform-decision]
    - h: 从全称到简称
      from: 2018
      text: 2018年政府工作报告要求“认真贯彻习近平新时代中国特色社会主义经济思想”。2022年9月人民日报任仲平文章已用简称，说“习近平经济思想深刻回答了我国经济发展的重大理论和实践问题”；2023年10月中央金融工作会议称习近平的讲话“是习近平经济思想的重要组成部分”；2024、2025年政府工作报告都写“必须深入贯彻习近平经济思想”。二十大前后，其核心表述演变为“立足新发展阶段、贯彻新发展理念、构建新发展格局、推动高质量发展”。
      cites: [i02-gov-2018-gwr, i04-rmrb-2022-09-29-renzhongping, cs2-gov-2023-10-31-financial-work-conf, i02-gov-2024-gwr, i02-gov-2025-gwr]
  cites: [i03-gov-2017-12-20-xi-economic-thought, e03-gov-2013-11-15-reform-decision, i02-gov-2018-gwr, i04-rmrb-2022-09-29-renzhongping, cs2-gov-2023-10-31-financial-work-conf, i02-gov-2024-gwr, i02-gov-2025-gwr]

- id: xi-rule-of-law-thought
  name: 习近平法治思想
  en: Xi Jinping Thought on the Rule of Law
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2020-11-17
    text: 2020年11月中央全面依法治国工作会议首次明确提出“习近平法治思想”。
    cite: i03-gov-2020-11-17-rule-of-law-conference
    quote: 习近平法治思想是顺应实现中华民族伟大复兴时代要求应运而生的重大理论创新成果
  summary: 习近平法治思想由2020年11月16日至17日召开的中央全面依法治国工作会议确立，会议称它是“马克思主义法治理论中国化最新成果”和“全面依法治国的根本遵循和行动指南”。习近平在会上提出11个方面要求，第一条是坚持党对全面依法治国的领导。官方归纳的核心论断是“党的领导是中国特色社会主义法治之魂”，并称这是“我们的法治同西方资本主义国家的法治最大的区别”。
  terms: [习近平法治思想]
  related: [rule-of-law, four-comprehensives, governance-modernization, party-leadership]
  lists:
    - title: 十一个坚持（中央全面依法治国工作会议，2020）
      cite: i03-gov-2020-11-17-rule-of-law-conference
      items:
        - 坚持党对全面依法治国的领导
        - 坚持以人民为中心
        - 坚持中国特色社会主义法治道路
        - 坚持依宪治国、依宪执政
        - 坚持在法治轨道上推进国家治理体系和治理能力现代化
        - 坚持建设中国特色社会主义法治体系
        - 坚持依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设
        - 坚持全面推进科学立法、严格执法、公正司法、全民守法
        - 坚持统筹推进国内法治和涉外法治
        - 坚持建设德才兼备的高素质法治工作队伍
        - 坚持抓住领导干部这个“关键少数”
  sections:
    - h: 确立
      from: 2020-11
      text: 中央全面依法治国工作会议是十九大后组建的中央全面依法治国委员会召开的第一次全国性工作会议。新华社通稿以“会议强调”的形式宣布习近平法治思想，称它“是习近平新时代中国特色社会主义思想的重要组成部分”。习近平本人讲话说的是总结“党关于新时代加强法治建设的思想理论成果”，李克强主持时则称讲话“系统阐述了新时代中国特色社会主义法治思想”，冠名来自会议结论和王沪宁的总结讲话。
      cites: [i03-gov-2020-11-17-rule-of-law-conference]
    - h: 内容要点
      text: 11个“坚持”以党的领导开头，强调“党的领导是推进全面依法治国的根本保证”，要求“推进党的领导制度化、法治化”；“依宪治国、依宪执政”被解释为“坚持宪法确定的中国共产党领导地位不动摇”。新增的重点有“统筹推进国内法治和涉外法治”，即“综合利用立法、执法、司法等手段开展斗争，坚决维护国家主权、尊严和核心利益”。
      cites: [i03-gov-2020-11-17-rule-of-law-conference]
    - h: 法治之魂
      text: 2022年人民日报任仲平文章把这一思想的标志性论断归纳为“党的领导是中国特色社会主义法治之魂，是我们的法治同西方资本主义国家的法治最大的区别”，并强调要正确处理“依法治国和依规治党的关系”。按这一表述，党的领导与法治属于同一体系，党内法规与国家法律并行。
      cites: [i04-rmrb-2022-09-29-renzhongping]
  cites: [i03-gov-2020-11-17-rule-of-law-conference, i04-rmrb-2022-09-29-renzhongping]

- id: xi-diplomacy-thought
  name: 习近平外交思想
  en: Xi Jinping Thought on Diplomacy
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2018-06-23
    text: 2018年6月中央外事工作会议上，习近平把十八大以来的外交理论概括为“新时代中国特色社会主义外交思想”的10个方面；杨洁篪总结时称会议确立了“习近平外交思想的指导地位”。
    cite: i03-gov-2018-06-23-foreign-affairs-conference
    quote: 这次会议最重要的成果是确立了习近平外交思想的指导地位
  summary: 习近平外交思想由2018年6月22日至23日的中央外事工作会议确立，内容概括为10个“坚持以……为……”，第一条是“加强党对对外工作的集中统一领导”，并提出“外交大权在党中央”。它以推动构建人类命运共同体为总目标，以“一带一路”、全球伙伴关系和“引领全球治理体系改革”为主要抓手，后来又纳入全球发展倡议、全球安全倡议、全球文明倡议和全球治理倡议。BBC中文评论把“大国外交”看作中国扬弃“韬光养晦”的开始，并认为2018年的提法比2014年第一次中央外事工作会议更进一步。
  terms: [习近平外交思想, 新时代中国特色社会主义外交思想]
  related: [community-shared-future, belt-and-road, global-initiatives, great-changes, taoguang-yanghui, wolf-warrior, common-values]
  lists:
    - title: 十个坚持（中央外事工作会议，2018）
      cite: i03-gov-2018-06-23-foreign-affairs-conference
      items:
        - 坚持以维护党中央权威为统领加强党对对外工作的集中统一领导
        - 坚持以实现中华民族伟大复兴为使命推进中国特色大国外交
        - 坚持以维护世界和平、促进共同发展为宗旨推动构建人类命运共同体
        - 坚持以中国特色社会主义为根本增强战略自信
        - 坚持以共商共建共享为原则推动“一带一路”建设
        - 坚持以相互尊重、合作共赢为基础走和平发展道路
        - 坚持以深化外交布局为依托打造全球伙伴关系
        - 坚持以公平正义为理念引领全球治理体系改革
        - 坚持以国家核心利益为底线维护国家主权、安全、发展利益
        - 坚持以对外工作优良传统和时代特征相结合为方向塑造中国外交独特风范
  sections:
    - h: 确立
      from: 2018-06
      text: 这是习近平任内第二次中央外事工作会议。习近平讲话说的是“形成了新时代中国特色社会主义外交思想，概括起来主要有以下10个方面”；冠名出自杨洁篪的总结讲话：“这次会议最重要的成果是确立了习近平外交思想的指导地位”。次日人民日报评论员文章写明“习近平新时代中国特色社会主义外交思想即习近平外交思想”，此后官方通用简称。
      cites: [i03-gov-2018-06-23-foreign-affairs-conference, i05-gov-2018-06-24-rmrb-diplomacy-thought]
    - h: 内容要点
      text: 十个方面把党的领导、民族复兴、人类命运共同体、“四个自信”、“一带一路”、和平发展、全球伙伴关系、全球治理、核心利益和外交风范串成一个体系。会议同时提出“必须坚持外交大权在党中央”，要求政党、政府、人大、政协、军队、地方、民间形成“党总揽全局、协调各方的对外工作大协同局面”。对形势的判断是“我国处于近代以来最好的发展时期，世界处于百年未有之大变局，两者同步交织、相互激荡”。
      cites: [i03-gov-2018-06-23-foreign-affairs-conference]
    - h: 与2014年的比较
      text: BBC中文的分析把2018年的讲话与2014年11月第一次中央外事工作会议对照：2014年讲话中的“和平共处五项原则”“不干涉别国内政原则”等表述在2018年的报道中“已经不再提及”，“推动国际体系和全球治理改革”变成“积极参与引领全球治理体系改革”，文章认为这是中国“首次如此高调”地表示要引领改革；2014年讲话还提到邓小平理论、“三个代表”和科学发展观，2018年则只讲习近平外交思想。
      cites: [i05-bbc-2018-06-27-diplomacy-thought]
    - h: 后来的扩展
      from: 2021
      text: 2021年起习近平陆续提出全球发展倡议（2021年联合国大会）、全球安全倡议（2022年博鳌亚洲论坛）、全球文明倡议（2023年中共与世界政党高层对话会）和全球治理倡议（2025年“上海合作组织+”会议），官方把四大倡议和“全人类共同价值”一起视为这一思想的新发展。2022年人民日报任仲平文章称它回答了“建设一个什么样的世界，如何建设这个世界”的时代问题。
      cites: [i05-gov-2021-09-22-unga-gdi, i05-gov-2022-04-21-boao-gsi, i05-gov-2023-03-15-gci, i05-gov-2025-09-01-sco-plus, i04-rmrb-2022-09-29-renzhongping]
  voices:
    - voice: zh
      text: 这应该是中国首次如此高调地表示将“积极参与”而且要“引领改革”。
      cite: i05-bbc-2018-06-27-diplomacy-thought
      quote: true
    - voice: zh
      text: 在观察人士看来，本次理论上避而不谈“邓三科”，才是习近平外交思想的真正大不同。
      cite: i05-bbc-2018-06-27-diplomacy-thought
      quote: true
  cites: [i03-gov-2018-06-23-foreign-affairs-conference, i05-gov-2018-06-24-rmrb-diplomacy-thought, i05-bbc-2018-06-27-diplomacy-thought, i05-gov-2021-09-22-unga-gdi, i05-gov-2022-04-21-boao-gsi, i05-gov-2023-03-15-gci, i05-gov-2025-09-01-sco-plus, i04-rmrb-2022-09-29-renzhongping]

- id: xi-military-thought
  name: 习近平强军思想
  en: Xi Jinping Thought on Strengthening the Military
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2017-10-18
    text: 十九大报告提出确立“新时代党的强军思想”在国防和军队建设中的指导地位，报告未冠名。
    cite: i01-gov-2017-10-18-19th-report
    quote: 确立新时代党的强军思想在国防和军队建设中的指导地位
  codified:
    - date: 2017-10-24
      where: 党章（十九大修正案）
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 贯彻习近平强军思想，坚持政治建军、改革强军、科技兴军、依法治军
    - date: 2022-10-22
      where: 党章（二十大修正案）
      cite: i01-12371-2022-10-22-party-charter
      quote: 贯彻习近平强军思想，加强人民解放军的建设，坚持政治建军、改革强军、科技强军、人才强军、依法治军
  summary: 习近平强军思想是最早以领导人冠名写入党章的分支思想：十九大报告称“新时代党的强军思想”，6天后通过的党章修正案即写作“贯彻习近平强军思想”。其核心是“党对军队的绝对领导是我军的军魂和命根子”和“建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队”的强军目标。两份党代会报告至今都用“新时代党的强军思想”，党章、政府工作报告和军队文件则用冠名形式。
  terms: [习近平强军思想, 新时代党的强军思想]
  related: [xi-thought, holistic-security, core]
  lists:
    - title: 军队建设方针（十九大报告，2017）
      cite: i01-gov-2017-10-18-19th-report
      items: [政治建军, 改革强军, 科技兴军, 依法治军]
    - title: 军队建设方针（二十大报告，2022）
      cite: i01-gov-2022-10-16-20th-report
      items: [政治建军, 改革强军, 科技强军, 人才强军, 依法治军]
    - title: 五个更加注重（十九大报告，2017）
      cite: i01-gov-2017-10-18-19th-report
      items: [更加注重聚焦实战, 更加注重创新驱动, 更加注重体系建设, 更加注重集约高效, 更加注重军民融合]
  sections:
    - h: 两种名称
      from: 2017-10
      text: 十九大报告第三部分“坚持党对人民军队的绝对领导”一条写的是“确立新时代党的强军思想在国防和军队建设中的指导地位”；十九大关于党章修正案的决议则把“贯彻习近平强军思想”写入党章。此后形成分工：党代会报告沿用“新时代党的强军思想”（二十大报告写“必须贯彻新时代党的强军思想”，2021年七一讲话亦然），党章、2018年起的政府工作报告和军队系统文件用“习近平强军思想”。
      cites: [i01-gov-2017-10-18-19th-report, e03-gov-2017-10-24-charter-resolution, i01-gov-2022-10-16-20th-report, i05-xinhua-2021-07-01-centenary-speech, i02-gov-2018-gwr]
    - h: 内容要点
      text: 官方概括的要点包括：强军目标是“建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队”；“党对军队的绝对领导是我军的军魂和命根子，永远不能变，永远不能丢”；“深化国防和军队改革是实现中国梦、强军梦的时代要求”。政府工作报告同时要求“全面深入贯彻军委主席负责制”。
      cites: [i04-rmrb-2022-09-29-renzhongping, i02-gov-2018-gwr]
    - h: 版本变化
      from: 2017
      to: 2022
      text: 十九大报告和2017年党章的军队建设方针是“政治建军、改革强军、科技兴军、依法治军”；二十大报告和2022年党章改为“政治建军、改革强军、科技强军、人才强军、依法治军”，“科技兴军”变成“科技强军”并新增“人才强军”。二十大报告还增加了“坚持边斗争、边备战、边建设”和“如期实现建军一百年奋斗目标”。2025年全国人大解放军代表团会议要求“深入贯彻习近平强军思想”的同时“持续深化政治整训”。
      cites: [i01-gov-2017-10-18-19th-report, d01-12371-2017-10-28-party-charter, i01-gov-2022-10-16-20th-report, i01-12371-2022-10-22-party-charter, b08-xinhua-2025-03-06-pla-delegation]
  cites: [i01-gov-2017-10-18-19th-report, e03-gov-2017-10-24-charter-resolution, d01-12371-2017-10-28-party-charter, i01-gov-2022-10-16-20th-report, i01-12371-2022-10-22-party-charter, i05-xinhua-2021-07-01-centenary-speech, i02-gov-2018-gwr, i04-rmrb-2022-09-29-renzhongping, b08-xinhua-2025-03-06-pla-delegation]

- id: xi-culture-thought
  name: 习近平文化思想
  en: Xi Jinping Thought on Culture
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2023-10-08
    text: 2023年10月全国宣传思想文化工作会议首次提出“习近平文化思想”。
    cite: i03-gov-2023-10-08-culture-thought
    quote: 构成了习近平新时代中国特色社会主义思想的文化篇，形成了习近平文化思想
  summary: 习近平文化思想由2023年10月7日至8日全国宣传思想文化工作会议提出（此后2026年6月又提出习近平党建思想），会议名称首次加上“文化”二字。习近平没有出席，而是作重要指示，提出“七个着力”；会议称这一思想“构成了习近平新时代中国特色社会主义思想的文化篇”，是“一个不断展开的、开放式的思想体系”。其主要来源是2018年宣传思想工作会议的“举旗帜、聚民心、育新人、兴文化、展形象”和2023年6月文化传承发展座谈会上的“第二个结合”。邓聿文等批评者认为它是为意识形态管控提供理论依据。
  terms: [习近平文化思想]
  related: [two-combinations, shouzheng-chuangxin, four-confidences, positive-energy, xi-thought]
  lists:
    - title: 七个着力（习近平对宣传思想文化工作的重要指示，2023）
      cite: i03-gov-2023-10-08-culture-thought
      items:
        - 着力加强党对宣传思想文化工作的领导
        - 着力建设具有强大凝聚力和引领力的社会主义意识形态
        - 着力培育和践行社会主义核心价值观
        - 着力提升新闻舆论传播力引导力影响力公信力
        - 着力赓续中华文脉、推动中华优秀传统文化创造性转化和创新性发展
        - 着力推动文化事业和文化产业繁荣发展
        - 着力加强国际传播能力建设、促进文明交流互鉴
    - title: 宣传思想工作的使命任务（全国宣传思想工作会议，2018）
      cite: i05-gov-2018-08-22-propaganda-conference
      items: [举旗帜, 聚民心, 育新人, 兴文化, 展形象]
  sections:
    - h: 前史
      from: 2018-08
      to: 2023-06
      text: 2018年8月全国宣传思想工作会议上，习近平提出宣传思想工作要承担“举旗帜、聚民心、育新人、兴文化、展形象的使命任务”，并列出“坚持党对意识形态工作的领导权”等9个“坚持”，要求“旗帜鲜明坚持党管宣传、党管意识形态”；同场的黄坤明称之为“习近平总书记关于宣传思想工作的重要思想”。2023年6月文化传承发展座谈会上，他论述“第二个结合”，提出“建设中华民族现代文明”的新的文化使命。
      cites: [i05-gov-2018-08-22-propaganda-conference, i05-xinhua-2023-06-02-culture-symposium]
    - h: 提出
      from: 2023-10
      text: 新华社“第一观察”说，与以往相比，这次会议的名称增加了“文化”二字，“会议最重要的成果就是首次提出了习近平文化思想”。习近平未出席，会上传达了他的重要指示，由蔡奇讲话。指示的基本原则是“坚定文化自信，秉持开放包容，坚持守正创新”，任务是“七个着力”。会议称其“明体达用、体用贯通”，并特别说明它是“一个不断展开的、开放式的思想体系”。
      cites: [i03-gov-2023-10-08-culture-thought, i05-xinhua-2023-10-08-culture-thought-first]
    - h: 批评性解读
      text: 前《学习时报》副编审邓聿文在美国之音的评论中认为，相对于军事、经济、外交、法治等分支思想，文化思想是“习近平整个思想体系的‘基石’”，其精神内核是“文化专制主义”。他把各分支思想的提出时间列为2017年强军、经济，2018年生态文明、外交，2020年法治；但文中“当局自2015年提出习近平新时代中国特色社会主义思想”一说与事实不符，这一思想是2017年十九大提出的。
      cites: [i05-voa-2023-10-23-culture-thought, i01-gov-2017-10-18-19th-report]
  voices:
    - voice: official
      text: 习近平文化思想是一个不断展开的、开放式的思想体系，必将随着实践深入不断丰富发展。
      cite: i03-gov-2023-10-08-culture-thought
      quote: true
    - voice: zh
      text: 一切专制主义最深厚的基础其实就是文化专制主义。政治专制是建立在文化或意识形态专制基础上的。
      cite: i05-voa-2023-10-23-culture-thought
      quote: true
  cites: [i03-gov-2023-10-08-culture-thought, i05-xinhua-2023-10-08-culture-thought-first, i05-gov-2018-08-22-propaganda-conference, i05-xinhua-2023-06-02-culture-symposium, i05-voa-2023-10-23-culture-thought, i01-gov-2017-10-18-19th-report]

# ---------------- core tenets ----------------
- id: people-centered
  name: 以人民为中心
  en: People-Centered Development
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2012-11-08
    text: 十八大报告在文化部分提出“以人民为中心的创作导向”；作为发展思想的“以人民为中心的发展思想”，库内所见最早是2016年政府工作报告。
    cite: i01-wsyu-2012-11-08-18th-report
    quote: 要坚持以人民为中心的创作导向
  summary: “以人民为中心”最早是文艺政策用语，十八大报告和2013年三中全会决定分别写有“以人民为中心的创作导向”“以人民为中心的工作导向”。2015年起习近平把它提升为“以人民为中心的发展思想”，十九大列为“十四个坚持”的第二条，二十大列为五个重大原则之一，内容是“发展为了人民、发展依靠人民、发展成果由人民共享”。2020年以后官方常把它与“人民至上”连用。
  terms: [以人民为中心, 以人民为中心的发展思想]
  related: [common-prosperity, whole-process-democracy, new-development-philosophy, principal-contradiction]
  lists:
    - title: 共享发展的三句话（十八届五中全会公报，2015）
      cite: i01-moe-2015-10-29-5th-plenum-communique
      items: [发展为了人民, 发展依靠人民, 发展成果由人民共享]
  sections:
    - h: 从文艺口号到发展思想
      from: 2012
      to: 2016
      text: 2012年10月李长春在莫言获诺贝尔奖后要求作家“坚持以人民为中心的创作导向”，十八大报告文化部分沿用。2013年十八届三中全会决定写“坚持以人民为中心的工作导向”，仍限于文化体制。2015年十八届五中全会在共享发展一节提出“发展为了人民、发展依靠人民、发展成果由人民共享”，2016年政府工作报告已写“坚持以人民为中心的发展思想”。
      cites: [e07-xinhua-2012-10-12-li-changchun, i01-wsyu-2012-11-08-18th-report, e03-gov-2013-11-15-reform-decision, i01-moe-2015-10-29-5th-plenum-communique, i02-gov-2016-gwr]
    - h: 写入基本方略
      from: 2017
      text: 十九大把“坚持以人民为中心”列为“十四个坚持”的第二条，紧随“坚持党对一切工作的领导”，要求“坚持人民主体地位，坚持立党为公、执政为民”；“八个明确”和后来的“十个明确”都写入“必须坚持以人民为中心的发展思想”。二十大报告把“坚持以人民为中心的发展思想”列为前进道路上必须牢牢把握的五个重大原则之一。
      cites: [i01-gov-2017-10-18-19th-report, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report]
    - h: 人民至上
      from: 2020
      text: 2020年新冠疫情期间官方大量使用“人民至上、生命至上”；2021年第三个历史决议把“坚持人民至上”列为党百年奋斗十条历史经验的第二条，二十大报告“六个必须坚持”的第一条也是“必须坚持人民至上”。七一讲话的说法是“江山就是人民、人民就是江山”，并称党“从来不代表任何利益集团、任何权势团体、任何特权阶层的利益”。
      cites: [i04-rmrb-2020-07-01-editorial, i05-gov-2021-09-22-unga-gdi, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i05-xinhua-2021-07-01-centenary-speech]
  cites: [i01-wsyu-2012-11-08-18th-report, e07-xinhua-2012-10-12-li-changchun, e03-gov-2013-11-15-reform-decision, i01-moe-2015-10-29-5th-plenum-communique, i02-gov-2016-gwr, i01-gov-2017-10-18-19th-report, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i04-rmrb-2020-07-01-editorial, i05-xinhua-2021-07-01-centenary-speech]

- id: party-leadership
  name: 党的全面领导
  en: The Party's Overall Leadership
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2017-10-18
    text: 十九大报告把“坚持党对一切工作的领导”列为十四条基本方略之首，并提出“坚持和加强党的全面领导”。
    cite: i01-gov-2017-10-18-19th-report
    quote: 坚持党对一切工作的领导。党政军民学，东西南北中，党是领导一切的
  codified:
    - date: 2017-10-24
      where: 党章（十九大修正案）
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 党政军民学，东西南北中，党是领导一切的。大会同意把这一重大政治原则写入党章
    - date: 2018-03-11
      where: 宪法第一条（2018年修正案）
      cite: i01-gov-2018-03-11-constitution
      quote: 中国共产党领导是中国特色社会主义最本质的特征
  summary: 党的全面领导是习近平时期政治体制的总原则：“党政军民学，东西南北中，党是领导一切的”。十九大把它列为“十四个坚持”第一条并写入党章，2018年修宪把“中国共产党领导是中国特色社会主义最本质的特征”写入宪法第一条正文，同年的党和国家机构改革以“坚持党的全面领导”为第一原则。2019年十九届四中全会把“党的领导制度体系”列为国家制度的首要部分，2021年历史决议提出“党的领导是全面的、系统的、整体的”。它在“十个明确”“十三个方面成就”“十个坚持”中都居第一位。
  terms: [党的全面领导, 党是领导一切的, 党对一切工作的领导]
  related: [two-safeguards, two-establishes, core, four-consciousness, governance-modernization, strict-governance]
  lists:
    - title: 党的领导制度体系（十九届四中全会公报，2019）
      cite: i05-gov-2019-10-31-4th-plenum
      items:
        - 建立不忘初心、牢记使命的制度
        - 完善坚定维护党中央权威和集中统一领导的各项制度
        - 健全党的全面领导制度
        - 健全为人民执政、靠人民执政各项制度
        - 健全提高党的执政能力和领导水平制度
        - 完善全面从严治党制度
  sections:
    - h: 写入党章与宪法
      from: 2017-10
      to: 2018-03
      text: 十九大报告的“十四个坚持”以“坚持党对一切工作的领导”开头，要求“确保党始终总揽全局、协调各方”。党章修正案决议说，“中国共产党的领导是中国特色社会主义最本质的特征，是中国特色社会主义制度的最大优势”，同意把“党政军民学，东西南北中，党是领导一切的”这一“重大政治原则写入党章”。2018年3月的宪法修正案把“中国共产党领导是中国特色社会主义最本质的特征”写进总纲第一条第二款，此前宪法只在序言中写到党的领导。
      cites: [i01-gov-2017-10-18-19th-report, e03-gov-2017-10-24-charter-resolution, i01-gov-2018-03-11-constitution]
    - h: 机构改革与制度化
      from: 2018
      to: 2019
      text: 第三个历史决议回顾，2018年党和国家机构改革“按照坚持党的全面领导、坚持以人民为中心、坚持优化协同高效、坚持全面依法治国的原则”进行，实现“系统性、整体性重构”。2019年十九届四中全会把13个“显著优势”的第一条定为“坚持党的集中统一领导”，并要求健全“总揽全局、协调各方的党的领导制度体系，把党的领导落实到国家治理各领域各方面各环节”。
      cites: [b04-gov-2021-11-16-resolution, i05-gov-2019-10-31-4th-plenum]
    - h: 全面、系统、整体
      from: 2021
      text: 第三个历史决议提出“党的领导是全面的、系统的、整体的”，“党中央集中统一领导是党的领导的最高原则”，并要求完善党领导人大、政府、政协、监察机关、审判机关、检察机关、武装力量、人民团体、企事业单位、基层群众性自治组织、社会组织等的制度。二十大报告第十五部分第一条“坚持和加强党中央集中统一领导”重申这一表述，要求“完善党中央决策议事协调机构”。2021年七一讲话称中国共产党领导“是党和国家的根本所在、命脉所在”。
      cites: [b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i05-xinhua-2021-07-01-centenary-speech]
  cites: [i01-gov-2017-10-18-19th-report, e03-gov-2017-10-24-charter-resolution, i01-gov-2018-03-11-constitution, b04-gov-2021-11-16-resolution, i05-gov-2019-10-31-4th-plenum, i01-gov-2022-10-16-20th-report, i05-xinhua-2021-07-01-centenary-speech]

- id: strict-governance
  name: 全面从严治党
  en: Comprehensive and Strict Party Governance
  kind: component
  parent: four-comprehensives
  by: [xi-jinping]
  first:
    date: 2014-12-14
    text: 习近平在江苏调研时首次把“全面从严治党”与其他三个“全面”并提。
    cite: i01-xinhua-2014-12-14-jiangsu-four-comprehensives
    quote: 协调推进全面建成小康社会、全面深化改革、全面推进依法治国、全面从严治党
  codified:
    - date: 2017-10-24
      where: 党章（十九大修正案）
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 把党的十九大确立的坚持党要管党、全面从严治党……等要求写入党章
  summary: 全面从严治党是“四个全面”中的第四个，2014年12月提出。它把“从严治党”扩展为一整套党建方略：以中央八项规定开局，以反腐败、巡视全覆盖、党内法规体系建设为手段，以“党的政治建设”为统领。十九大提出“新时代党的建设总要求”，二十大要求“健全全面从严治党体系”，并称反腐败斗争“取得压倒性胜利并全面巩固”。官方把这一过程的理论概括称为“自我革命”，即跳出历史周期率的“第二个答案”。
  terms: [全面从严治党]
  related: [self-revolution, eight-point-rules, four-winds, liuzhi, four-comprehensives, party-leadership]
  lists:
    - title: 新时代党的建设总布局（十九大报告，2017）
      cite: i01-gov-2017-10-18-19th-report
      items: [党的政治建设, 思想建设, 组织建设, 作风建设, 纪律建设]
    - title: 二十大报告第十五部分的七项任务（2022）
      cite: i01-gov-2022-10-16-20th-report
      items:
        - 坚持和加强党中央集中统一领导
        - 坚持不懈用新时代中国特色社会主义思想凝心铸魂
        - 完善党的自我革命制度规范体系
        - 建设堪当民族复兴重任的高素质干部队伍
        - 增强党组织政治功能和组织功能
        - 坚持以严的基调强化正风肃纪
        - 坚决打赢反腐败斗争攻坚战持久战
    - title: 九个坚持（对管党治党的规律性认识，十九届中央纪委六次全会讲话，2022）
      cite: i01-gov-2022-01-18-self-revolution
      items:
        - 坚持党中央集中统一领导
        - 坚持党要管党、全面从严治党
        - 坚持以党的政治建设为统领
        - 坚持严的主基调不动摇
        - 坚持发扬钉钉子精神加强作风建设
        - 坚持以零容忍态度惩治腐败
        - 坚持纠正一切损害群众利益的腐败和不正之风
        - 坚持抓住“关键少数”以上率下
        - 坚持完善党和国家监督制度
  sections:
    - h: 提出
      from: 2014-12
      to: 2016-10
      text: 2014年12月习近平在江苏调研时提出“协调推进全面建成小康社会、全面深化改革、全面推进依法治国、全面从严治党”，“从严治党”由此加上“全面”二字，成为“四个全面”战略布局的一部分。2016年十八届六中全会把党内政治生活作为切入点，制定新形势下党内政治生活准则，理由是党要经受“四大考验”、克服“四种危险”，全会同时确立习近平的“核心”地位。
      cites: [i01-xinhua-2014-12-14-jiangsu-four-comprehensives, i01-cpc-2016-10-27-6th-plenum-communique]
    - h: 新时代党的建设总要求
      from: 2017-10
      text: 十九大报告提出“新时代党的建设总要求”：“坚持和加强党的全面领导，坚持党要管党、全面从严治党”，“以党的政治建设为统领”，“全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争”。与十八大相比，“政治建设”被置于首位并起“统领”作用；2022年党章把党的建设基本要求由五项增为六项。
      cites: [i01-gov-2017-10-18-19th-report, d01-12371-2017-10-28-party-charter, i01-12371-2022-10-22-party-charter]
    - h: 反腐败与官方评价
      from: 2022
      text: 二十大报告称十年来“开展了史无前例的反腐败斗争”，以“得罪千百人、不负十四亿”的使命担当，“不敢腐、不能腐、不想腐一体推进”，反腐败斗争“取得压倒性胜利并全面巩固”；同时强调“全面从严治党永远在路上，党的自我革命永远在路上”。2022年人民日报任仲平文章引习近平的话：“不得罪成百上千的腐败分子，就要得罪十四亿人民”。
      cites: [i01-gov-2022-10-16-20th-report, i04-rmrb-2022-09-29-renzhongping]
    - h: 规律性认识
      from: 2022-01
      text: 2022年1月十九届中央纪委六次全会上，习近平把十年经验概括为九个“坚持”，称对“建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党的规律性认识达到新的高度”，并说党“探索出依靠党的自我革命跳出历史周期率的成功路径”。这一论述随后被纳入“自我革命”的理论化表述。
      cites: [i01-gov-2022-01-18-self-revolution]
  cites: [i01-xinhua-2014-12-14-jiangsu-four-comprehensives, i01-cpc-2016-10-27-6th-plenum-communique, i01-gov-2017-10-18-19th-report, e03-gov-2017-10-24-charter-resolution, d01-12371-2017-10-28-party-charter, i01-12371-2022-10-22-party-charter, i01-gov-2022-10-16-20th-report, i04-rmrb-2022-09-29-renzhongping, i01-gov-2022-01-18-self-revolution]

- id: systems-thinking
  name: 坚持系统观念
  en: Applying a Systems Approach
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2020-10-29
    text: 十九届五中全会把“坚持系统观念”列为“十四五”时期经济社会发展必须遵循的五项原则之一。
    cite: e04-xinhua-2020-10-29-5th-plenum
    quote: 坚持以人民为中心，坚持新发展理念，坚持深化改革开放，坚持系统观念
  summary: “坚持系统观念”是习近平时期反复强调的思想方法，前身是2013年三中全会决定要求的“更加注重改革的系统性、整体性、协同性”。2020年十九届五中全会把它列为“十四五”五项原则的最后一项，2022年二十大报告把“必须坚持系统观念”列为习近平思想世界观和方法论“六个必须坚持”之一，要求处理好全局和局部、当前和长远等关系，并把“系统思维”加进领导干部须具备的思维能力清单。2024年二十届三中全会把它列为进一步全面深化改革的六项原则之一。
  terms: [系统观念, 坚持系统观念]
  related: [bottom-line-thinking, four-comprehensives, governance-modernization, high-quality-development]
  lists:
    - title: “十四五”时期经济社会发展的五项原则（十九届五中全会公报，2020）
      cite: e04-xinhua-2020-10-29-5th-plenum
      items: [坚持党的全面领导, 坚持以人民为中心, 坚持新发展理念, 坚持深化改革开放, 坚持系统观念]
    - title: 进一步全面深化改革的六项原则（二十届三中全会决定，2024）
      cite: i01-gov-2024-07-18-third-plenum-decision
      items: [坚持党的全面领导, 坚持以人民为中心, 坚持守正创新, 坚持以制度建设为主线, 坚持全面依法治国, 坚持系统观念]
  sections:
    - h: 前身
      from: 2013-11
      text: 2013年十八届三中全会决定提出“全面深化改革的总目标是完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化”，同时要求“必须更加注重改革的系统性、整体性、协同性”。这一说法2017年写入党章，是后来“系统观念”的直接来源。
      cites: [e03-gov-2013-11-15-reform-decision, e03-gov-2017-10-24-charter-resolution]
    - h: 成为原则
      from: 2020-10
      text: 十九届五中全会公报在“十四五”指导思想后列出五项原则，“坚持系统观念”排在党的全面领导、以人民为中心、新发展理念、深化改革开放之后。2021年历史决议在“新时代”的总要求中写入“坚持系统观念”，2023年全国生态环境保护大会上习近平讲重点攻坚和协同治理的关系时也说“要坚持系统观念”。
      cites: [e04-xinhua-2020-10-29-5th-plenum, b04-gov-2021-11-16-resolution, i05-gov-2023-07-18-eco-conference]
    - h: 世界观和方法论
      from: 2022-10
      text: 二十大报告把“必须坚持系统观念”列为“六个必须坚持”的第五条，理由是“万事万物是相互联系、相互依存的”，要求“把握好全局和局部、当前和长远、宏观和微观、主要矛盾和次要矛盾、特殊和一般的关系”。报告列出的思维能力也由十九大的五种（战略、创新、辩证、法治、底线）增为七种，新增历史思维和系统思维。2024年三中全会把它具体化为处理好“经济和社会、政府和市场、效率和公平、活力和秩序、发展和安全等重大关系”。
      cites: [i01-gov-2022-10-16-20th-report, i01-gov-2017-10-18-19th-report, i01-gov-2024-07-18-third-plenum-decision]
  cites: [e04-xinhua-2020-10-29-5th-plenum, e03-gov-2013-11-15-reform-decision, e03-gov-2017-10-24-charter-resolution, b04-gov-2021-11-16-resolution, i05-gov-2023-07-18-eco-conference, i01-gov-2022-10-16-20th-report, i01-gov-2017-10-18-19th-report, i01-gov-2024-07-18-third-plenum-decision]

- id: high-quality-development
  name: 高质量发展
  en: High-Quality Development
  kind: component
  parent: xi-economic-thought
  by: [xi-jinping]
  first:
    date: 2017-10-18
    text: 十九大报告宣布中国经济由高速增长阶段转向高质量发展阶段。
    cite: i01-gov-2017-10-18-19th-report
    quote: 我国经济已由高速增长阶段转向高质量发展阶段
  summary: 高质量发展是十九大以后经济工作的总提法。十九大报告说中国经济“已由高速增长阶段转向高质量发展阶段”，要求“坚持质量第一、效益优先”；2020年十九届五中全会把“以推动高质量发展为主题”定为“十四五”的主题；二十大报告称“高质量发展是全面建设社会主义现代化国家的首要任务”。2023年后它与“新质生产力”连用，政府工作报告每年以“推动高质量发展”统领经济部分，同时要求“坚持高质量发展和高水平安全良性互动”。
  terms: [高质量发展]
  related: [new-development-philosophy, new-quality-productive-forces, supply-side, dual-circulation, development-and-security]
  lists:
    - title: 二十大报告第四部分“加快构建新发展格局，着力推动高质量发展”的五项任务（2022）
      cite: i01-gov-2022-10-16-20th-report
      items: [构建高水平社会主义市场经济体制, 建设现代化产业体系, 全面推进乡村振兴, 促进区域协调发展, 推进高水平对外开放]
  sections:
    - h: 提出
      from: 2017-10
      text: 十九大报告说，中国经济“正处在转变发展方式、优化经济结构、转换增长动力的攻关期”，必须“坚持质量第一、效益优先，以供给侧结构性改革为主线，推动经济发展质量变革、效率变革、动力变革”。2018年政府工作报告随即把“大力推动高质量发展”列为全年工作的第一点。
      cites: [i01-gov-2017-10-18-19th-report, i02-gov-2018-gwr]
    - h: 主题与首要任务
      from: 2020-10
      to: 2022-10
      text: 十九届五中全会为“十四五”规划确定“以推动高质量发展为主题，以深化供给侧结构性改革为主线”。二十大报告第四部分开头即说“高质量发展是全面建设社会主义现代化国家的首要任务”，“本质要求”中也有“实现高质量发展”。2023年主题教育要求“紧紧围绕高质量发展这个全面建设社会主义现代化国家的首要任务”，2025年政府工作报告要求“紧抓高质量发展这个首要任务”。
      cites: [e04-xinhua-2020-10-29-5th-plenum, i01-gov-2022-10-16-20th-report, i05-gov-2023-04-03-theme-education, i02-gov-2025-gwr]
    - h: 与安全的关系
      from: 2024
      text: 2024年政府工作报告提出“坚持高质量发展和高水平安全良性互动，在坚守安全底线的前提下，更多为发展想办法、为企业助把力”。这一表述把高质量发展与“统筹发展和安全”联系起来。
      cites: [i02-gov-2024-gwr]
  cites: [i01-gov-2017-10-18-19th-report, i02-gov-2018-gwr, e04-xinhua-2020-10-29-5th-plenum, i01-gov-2022-10-16-20th-report, i05-gov-2023-04-03-theme-education, i02-gov-2024-gwr, i02-gov-2025-gwr]

- id: development-and-security
  name: 统筹发展和安全
  en: Balancing Development and Security
  kind: component
  parent: holistic-security
  by: [xi-jinping]
  first:
    date: 2017-10-18
    text: 十九大报告在“坚持总体国家安全观”一条中称统筹发展和安全是治国理政的一个重大原则。
    cite: i01-gov-2017-10-18-19th-report
    quote: 统筹发展和安全，增强忧患意识，做到居安思危，是我们党治国理政的一个重大原则
  summary: 统筹发展和安全是总体国家安全观在经济社会领域的展开。十九大报告称它是“治国理政的一个重大原则”；2019年起官方说法是“统筹国内国际两个大局、发展安全两件大事”；2020年十九届五中全会把它写入“十四五”指导思想并单列“建设更高水平的平安中国”；第三个历史决议把它扩展为五个“统筹”，二十大报告要求“以新安全格局保障新发展格局”，并说“国家安全是民族复兴的根基”。
  terms: [统筹发展和安全]
  related: [holistic-security, bottom-line-thinking, high-quality-development, great-changes, struggle-spirit]
  lists:
    - title: 五个统筹（第三个历史决议，2021）
      cite: b04-gov-2021-11-16-resolution
      items: [统筹发展和安全, 统筹开放和安全, 统筹传统安全和非传统安全, 统筹自身安全和共同安全, 统筹维护国家安全和塑造国家安全]
  sections:
    - h: 提出
      from: 2017-10
      to: 2019-10
      text: 十九大报告把统筹发展和安全放在“坚持总体国家安全观”条下，要求“统筹外部安全和内部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全”。2019年1月省部级专题研讨班上，习近平要求“统筹国内国际两个大局、发展安全两件大事”；同年十九届四中全会公报写“准确把握国内国际两个大局，着力抓好发展和安全两件大事”。
      cites: [i01-gov-2017-10-18-19th-report, i05-gov-2019-01-21-risk-seminar, i05-gov-2019-10-31-4th-plenum]
    - h: 写入五年规划
      from: 2020-10
      text: 十九届五中全会公报在“十四五”指导思想中写入“统筹发展和安全”，并单列一段“统筹发展和安全，建设更高水平的平安中国”，要求“把安全发展贯穿国家发展各领域和全过程”。第三个历史决议在国家安全部分把它扩展为发展和安全、开放和安全、传统和非传统安全、自身和共同安全、维护和塑造国家安全五个“统筹”。
      cites: [e04-xinhua-2020-10-29-5th-plenum, b04-gov-2021-11-16-resolution]
    - h: 新安全格局
      from: 2022-10
      text: 二十大报告第十一部分以“推进国家安全体系和能力现代化，坚决维护国家安全和社会稳定”为题，开头即说“国家安全是民族复兴的根基，社会稳定是国家强盛的前提”，提出“以新安全格局保障新发展格局”，并要求健全反制裁、反干涉、反“长臂管辖”机制。2024年政府工作报告则强调“坚持高质量发展和高水平安全良性互动”。
      cites: [i01-gov-2022-10-16-20th-report, i02-gov-2024-gwr]
  cites: [i01-gov-2017-10-18-19th-report, i05-gov-2019-01-21-risk-seminar, i05-gov-2019-10-31-4th-plenum, e04-xinhua-2020-10-29-5th-plenum, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i02-gov-2024-gwr]

- id: struggle-spirit
  name: 斗争精神 / 伟大斗争
  en: Fighting Spirit / The Great Struggle
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2017-10-18
    text: 十九大报告提出“实现伟大梦想，必须进行伟大斗争”，要求“发扬斗争精神，提高斗争本领”。
    cite: i01-gov-2017-10-18-19th-report
    quote: 发扬斗争精神，提高斗争本领，不断夺取伟大斗争新胜利
  summary: 斗争精神是习近平对干部的一贯要求。十九大报告把“伟大斗争”列为“四个伟大”之首，2019年9月中央党校讲话专讲“发扬斗争精神，增强斗争本领”，列出五个“凡是危害……”必须坚决斗争的情形；2021年历史决议把“坚持敢于斗争”列为十条历史经验之一，二十大报告把“坚持发扬斗争精神”列为五个重大原则之一，并写入“务必敢于斗争、善于斗争”。BBC中文报道称2019年那次讲话58次提及“斗争”，分析人士把它与对外强硬的“战狼”外交联系起来；官方则强调斗争“是有方向、有立场、有原则的”。
  terms: [斗争精神, 伟大斗争, 敢于斗争]
  related: [great-changes, bottom-line-thinking, wolf-warrior, development-and-security]
  lists:
    - title: 必须进行坚决斗争的五种风险挑战（中央党校中青年干部培训班讲话，2019）
      cite: i05-gov-2019-09-03-struggle-speech
      items:
        - 凡是危害中国共产党领导和我国社会主义制度的各种风险挑战
        - 凡是危害我国主权、安全、发展利益的各种风险挑战
        - 凡是危害我国核心利益和重大原则的各种风险挑战
        - 凡是危害我国人民根本利益的各种风险挑战
        - 凡是危害我国实现“两个一百年”奋斗目标、实现中华民族伟大复兴的各种风险挑战
  sections:
    - h: 伟大斗争
      from: 2017-10
      text: 十九大报告说“社会是在矛盾运动中前进的，有矛盾就会有斗争”，要求全党“必须进行具有许多新的历史特点的伟大斗争”，把伟大斗争、伟大工程、伟大事业、伟大梦想并称，其中“起决定性作用的是党的建设新的伟大工程”。“具有许多新的历史特点的伟大斗争”一语2016年十八届六中全会公报已经使用。
      cites: [i01-gov-2017-10-18-19th-report, i01-cpc-2016-10-27-6th-plenum-communique]
    - h: 2019年的专题讲话
      from: 2019
      text: 2019年1月省部级专题研讨班上，习近平说防范化解重大风险“需要有充沛顽强的斗争精神”，要求“年轻干部要到重大斗争中去真刀真枪干”。同年9月中央党校中青年干部培训班开班式讲话以斗争为主题，说民族复兴“绝不是轻轻松松、敲锣打鼓就能实现的”，斗争“至少要伴随我们实现第二个百年奋斗目标全过程”，同时强调“共产党人的斗争是有方向、有立场、有原则的，大方向就是坚持中国共产党领导和我国社会主义制度不动摇”，要求“在原则问题上寸步不让，在策略问题上灵活机动”。
      cites: [i05-gov-2019-01-21-risk-seminar, i05-gov-2019-09-03-struggle-speech]
    - h: 写入历史经验和重大原则
      from: 2021
      to: 2022
      text: 第三个历史决议把“坚持敢于斗争”列为十条历史经验的第八条，说党和人民取得的一切成就“是通过不断斗争取得的”。七一讲话的说法是“敢于斗争、敢于胜利，是中国共产党不可战胜的强大精神力量”。二十大报告把“坚持发扬斗争精神”列为五个重大原则的最后一项，并在开头写“务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必敢于斗争、善于斗争”。
      cites: [b04-gov-2021-11-16-resolution, i05-xinhua-2021-07-01-centenary-speech, i01-gov-2022-10-16-20th-report]
    - h: 外界解读
      from: 2021-09
      text: 2021年9月习近平在中央党校又说要“丢掉幻想、勇于斗争”。BBC中文指出这与毛泽东1949年的“丢掉幻想、准备斗争”高度相似，并统计2019年9月的讲话58次提及“斗争”。欧亚集团的牛犇（Neil Thomas）认为这表明习近平对自己的理念“更加坚决”；新加坡国立大学的庄嘉颖认为北京认为挑战“越来越大”；邓聿文则认为这“更多是一个惯例性的讲话”，主要用来锻炼后备干部的党性。
      cites: [i05-bbc-2021-09-06-struggle]
  voices:
    - voice: zh
      text: 这个讲话代表习近平对自己的理念更加坚决。他认为，中国上升的实力意味着它可以并且应该更果断地捍卫其政治制度和领土主张免受其它国家批评，尤其是美国这样的民主大国。
      cite: i05-bbc-2021-09-06-struggle
      quote: true
    - voice: zh
      text: 中央党校校刊《学习时报》前副编审邓聿文则认为，这更多是一个惯例性的讲话，主要还是用来提醒中共后备力量，加强锻炼党性。
      cite: i05-bbc-2021-09-06-struggle
      quote: true
  cites: [i01-gov-2017-10-18-19th-report, i01-cpc-2016-10-27-6th-plenum-communique, i05-gov-2019-01-21-risk-seminar, i05-gov-2019-09-03-struggle-speech, b04-gov-2021-11-16-resolution, i05-xinhua-2021-07-01-centenary-speech, i01-gov-2022-10-16-20th-report, i05-bbc-2021-09-06-struggle]

- id: shouzheng-chuangxin
  name: 守正创新
  en: Upholding Fundamentals and Breaking New Ground
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  summary: 守正创新是习近平思想的世界观和方法论之一，意为在不改变根本原则的前提下推进创新。2021年七一讲话和第三个历史决议用“自信自强、守正创新”概括新时代的成就，二十大把它写进大会主题，并把“必须坚持守正创新”列为“六个必须坚持”之一。按二十大报告的解释，“守正”指三个“不动摇”：马克思主义基本原理、党的全面领导、中国特色社会主义；“创新”指“敢于说前人没有说过的新话，敢于干前人没有干过的事情”。此后它成为文化工作的“基本遵循”和2024年改革决定的六项原则之一。
  terms: [守正创新]
  related: [xi-culture-thought, two-combinations, four-confidences, xi-thought]
  lists:
    - title: “守正”的三个“不动摇”（二十大报告，2022）
      cite: i01-gov-2022-10-16-20th-report
      items: [坚持马克思主义基本原理不动摇, 坚持党的全面领导不动摇, 坚持中国特色社会主义不动摇]
    - title: 宣传思想文化工作的基本遵循（全国宣传思想文化工作会议，2023）
      cite: i05-xinhua-2023-10-08-culture-thought-first
      items: [坚定文化自信, 秉持开放包容, 坚持守正创新]
  sections:
    - h: 概括新时代
      from: 2021-07
      to: 2021-11
      text: 七一讲话在回顾四个历史时期时说，新时代党“自信自强、守正创新，统揽伟大斗争、伟大工程、伟大事业、伟大梦想”。第三个历史决议沿用同一结构：新民主主义革命时期是“浴血奋战、百折不挠”，改革开放时期是“解放思想、锐意进取”，新时代则是“自信自强、守正创新”。
      cites: [i05-xinhua-2021-07-01-centenary-speech, b04-gov-2021-11-16-resolution]
    - h: 写入大会主题
      from: 2022-10
      text: 二十大的主题包含“自信自强、守正创新，踔厉奋发、勇毅前行”。报告在“六个必须坚持”中解释说，“守正才能不迷失方向、不犯颠覆性错误，创新才能把握时代、引领时代”，要求“坚持马克思主义基本原理不动摇，坚持党的全面领导不动摇，坚持中国特色社会主义不动摇”，同时“以满腔热忱对待一切新生事物”。
      cites: [i01-gov-2022-10-16-20th-report]
    - h: 文化与改革领域
      from: 2023
      text: 2023年6月文化传承发展座谈会上，习近平要求“以守正创新的正气和锐气，赓续历史文脉、谱写当代华章”；同年10月的全国宣传思想文化工作会议把“坚定文化自信，秉持开放包容，坚持守正创新”定为“基本遵循原则”。2024年三中全会决定把“坚持守正创新”列为改革原则，解释为“坚持中国特色社会主义不动摇，紧跟时代步伐，顺应实践发展，突出问题导向”。2025年政府工作报告的宏观政策要求也写有“守正创新、先立后破”。
      cites: [i05-xinhua-2023-06-02-culture-symposium, i05-xinhua-2023-10-08-culture-thought-first, i01-gov-2024-07-18-third-plenum-decision, i02-gov-2025-gwr]
  cites: [i05-xinhua-2021-07-01-centenary-speech, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i05-xinhua-2023-06-02-culture-symposium, i05-xinhua-2023-10-08-culture-thought-first, i01-gov-2024-07-18-third-plenum-decision, i02-gov-2025-gwr]

- id: great-changes
  name: 百年未有之大变局 / “两个大局”
  en: Profound Changes Unseen in a Century / The Two Overall Situations
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2017-12-28
    text: 习近平在2017年驻外使节工作会议上首次提出这一判断。
    cite: i05-gov-2017-12-28-envoys
    quote: 放眼世界，我们面对的是百年未有之大变局
  summary: “百年未有之大变局”是习近平对国际形势的总判断，2017年底提出，指新兴市场国家和发展中国家崛起、世界多极化、国际力量对比调整。2020年十九届五中全会起，它与“中华民族伟大复兴战略全局”合称新的“两个大局”，要求全党“统筹”二者。二十大报告改称大变局“加速演进”，世界“进入新的动荡变革期”。“两个大局”一词在中共文献里有过三种含义：邓小平关于沿海和内地发展先后的“两个大局”，长期沿用的“统筹国内国际两个大局”，以及习近平时期的“战略全局”和“大变局”。后两种至今在同一文件中并存。
  terms: [百年未有之大变局, 两个大局, 世界百年未有之大变局]
  related: [xi-diplomacy-thought, struggle-spirit, development-and-security, community-shared-future, chinese-dream]
  sections:
    - h: 提出
      from: 2017-12
      to: 2019
      text: 2017年12月驻外使节工作会议上，习近平说“放眼世界，我们面对的是百年未有之大变局”，理由是“新世纪以来一大批新兴市场国家和发展中国家快速发展，世界多极化加速发展，国际格局日趋均衡”，中国则“日益走近世界舞台中央”。2019年1月的风险研讨班上他说“世界大变局加速深刻演变，全球动荡源和风险点增多”；同年9月的党校讲话以“当今世界正处于百年未有之大变局”作为发扬斗争精神的前提。
      cites: [i05-gov-2017-12-28-envoys, i05-gov-2019-01-21-risk-seminar, i05-gov-2019-09-03-struggle-speech]
    - h: 新的“两个大局”
      from: 2020-10
      text: 十九届五中全会公报说“当今世界正经历百年未有之大变局，新一轮科技革命和产业变革深入发展，国际力量对比深刻调整”，要求全党“统筹中华民族伟大复兴战略全局和世界百年未有之大变局”。七一讲话、第三个历史决议和二十大报告都沿用这一提法。人民日报社论此后多以“胸怀两个大局”简称。
      cites: [e04-xinhua-2020-10-29-5th-plenum, i05-xinhua-2021-07-01-centenary-speech, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i04-rmrb-2020-07-01-editorial, i04-rmrb-2025-10-01-editorial]
    - h: 加速演进
      from: 2022-10
      text: 二十大报告的判断是“世界百年未有之大变局加速演进”，同时列举“逆全球化思潮抬头，单边主义、保护主义明显上升”，称“世界进入新的动荡变革期”，“来自外部的打压遏制随时可能升级”。2023年全国宣传思想文化工作会议和2025年“上海合作组织+”会议讲话也都用“加速演进”的说法。
      cites: [i01-gov-2022-10-16-20th-report, i05-xinhua-2023-10-08-culture-thought-first, i05-gov-2025-09-01-sco-plus]
    - h: “两个大局”的三种用法
      text: 2000年朱镕基说，西部开发早在80年代就是邓小平“两个大局”战略思想的内容；当年政府工作报告也说西部大开发是贯彻邓小平关于我国现代化建设“两个大局”战略思想，这里的两个大局指沿海先发展和随后帮助内地发展。“统筹国内国际两个大局”则是另一种用法，2007年十七大报告和此后历次党章的外交部分都写有这句话，习近平时期的全会公报也继续使用。五中全会以后的“两个大局”指“战略全局”和“大变局”，第三个历史决议同一篇文献里两种用法并存。
      cites: [b01-gov-2000-03-15-zhu-presser, i02-gov-2000-gwr, b02-npc-2007-10-24-17th-report, d01-people-2007-10-25-party-charter, i01-12371-2022-10-22-party-charter, b04-gov-2021-11-16-resolution]
  cites: [i05-gov-2017-12-28-envoys, i05-gov-2019-01-21-risk-seminar, i05-gov-2019-09-03-struggle-speech, e04-xinhua-2020-10-29-5th-plenum, i05-xinhua-2021-07-01-centenary-speech, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i04-rmrb-2020-07-01-editorial, i04-rmrb-2025-10-01-editorial, i05-xinhua-2023-10-08-culture-thought-first, i05-gov-2025-09-01-sco-plus, b01-gov-2000-03-15-zhu-presser, i02-gov-2000-gwr, b02-npc-2007-10-24-17th-report, d01-people-2007-10-25-party-charter, i01-12371-2022-10-22-party-charter]

- id: bottom-line-thinking
  name: 底线思维
  en: Bottom-Line Thinking
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  summary: 底线思维指先估计最坏情况、守住不可突破的界限，是习近平要求领导干部具备的几种“思维能力”之一。十九大报告列了五种思维，2019年风险研讨班列了六种，二十大报告列了七种，底线思维始终排在最后。2019年1月的省部级研讨班专以“坚持底线思维着力防范化解重大风险”为题，提出既防“黑天鹅”也防“灰犀牛”。此后“坚持底线思维”与“居安思危、未雨绸缪”连用，写入第三个历史决议和二十大报告关于国家安全和风险的段落，2024年政府工作报告也以此提醒经济风险。
  terms: [底线思维]
  related: [struggle-spirit, development-and-security, systems-thinking, holistic-security, great-firewall]
  lists:
    - title: 五种思维（十九大报告，2017）
      cite: i01-gov-2017-10-18-19th-report
      items: [战略思维, 创新思维, 辩证思维, 法治思维, 底线思维]
    - title: 六种思维（省部级主要领导干部专题研讨班讲话，2019）
      cite: i05-gov-2019-01-21-risk-seminar
      items: [战略思维, 历史思维, 辩证思维, 创新思维, 法治思维, 底线思维]
    - title: 七种思维（二十大报告，2022）
      cite: i01-gov-2022-10-16-20th-report
      items: [战略思维, 历史思维, 辩证思维, 系统思维, 创新思维, 法治思维, 底线思维]
  sections:
    - h: 思维能力清单
      from: 2017-10
      to: 2022-10
      text: 十九大报告要求“增强政治领导本领，坚持战略思维、创新思维、辩证思维、法治思维、底线思维”。2019年1月研讨班讲话加上“历史思维”，二十大报告又加“系统思维”，成为“战略思维、历史思维、辩证思维、系统思维、创新思维、法治思维、底线思维能力”。三份清单的顺序也有变化，“底线思维”一直在最后。
      cites: [i01-gov-2017-10-18-19th-report, i05-gov-2019-01-21-risk-seminar, i01-gov-2022-10-16-20th-report]
    - h: 防范化解重大风险
      from: 2019-01
      text: 2019年1月的研讨班全称是“省部级主要领导干部坚持底线思维着力防范化解重大风险专题研讨班”。习近平在开班式上要求既要高度警惕“黑天鹅”事件，也要防范“灰犀牛”事件，并要求建立风险研判、决策风险评估、风险防控协同和风险防控责任四项机制。此前2018年中央外事工作会议总结对外工作经验时也有“坚持底线思维和风险意识”一条。
      cites: [i05-gov-2019-01-21-risk-seminar, i03-gov-2018-06-23-foreign-affairs-conference]
    - h: 写入决议和报告
      from: 2020-10
      text: 十九届五中全会要求“发扬斗争精神，树立底线思维”。第三个历史决议的国家安全部分写“必须坚持底线思维、居安思危、未雨绸缪”；二十大报告在列出重大原则前说“我们必须增强忧患意识，坚持底线思维，做到居安思危、未雨绸缪，准备经受风高浪急甚至惊涛骇浪的重大考验”。2024年政府工作报告在说经济长期向好之后写“同时要坚持底线思维，做好应对各种风险挑战的充分准备”。
      cites: [e04-xinhua-2020-10-29-5th-plenum, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i02-gov-2024-gwr]
    - h: 网信领域的用法
      from: 2014-09
      text: 这个词也用于具体政策。2014年9月，时任国家网信办主任鲁炜在达沃斯论坛上说“互联网管理在中国的底线思维是遵守中国法律”，并把它解释为维护中国的国家利益和中国消费者的利益，称“我们不能允许的是，占着中国的市场，挣了中国的钱，又来伤害中国”。
      cites: [b12-xinhua-2014-09-10-lu-wei-davos]
  cites: [i01-gov-2017-10-18-19th-report, i05-gov-2019-01-21-risk-seminar, i01-gov-2022-10-16-20th-report, i03-gov-2018-06-23-foreign-affairs-conference, e04-xinhua-2020-10-29-5th-plenum, b04-gov-2021-11-16-resolution, i02-gov-2024-gwr, b12-xinhua-2014-09-10-lu-wei-davos]

- id: two-combinations
  name: “两个结合”
  en: The Two Integrations
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2021-07-01
    text: 习近平在建党百年讲话中把“同中华优秀传统文化相结合”加在传统的“同中国具体实际相结合”之后。
    cite: i05-xinhua-2021-07-01-centenary-speech
    quote: 坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合
  codified:
    - date: 2022-10-22
      where: 党章总纲（二十大修正案）
      cite: i01-12371-2022-10-22-party-charter
      quote: 坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合
  summary: “两个结合”指“把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合”。第一个结合沿袭“马克思主义中国化”的传统表述，第二个结合是2021年七一讲话新加的，当年写入第三个历史决议，2022年写入党章，被官方称为习近平思想得以“创立”的方法。2023年6月文化传承发展座谈会上，习近平称“结合”是“我们取得成功的最大法宝”，“第二个结合”是“又一次的思想解放”。它是同年提出的“习近平文化思想”的理论基础，此后坚持“两个结合”成为论证新理论的常用说法。
  terms: [两个结合, 第二个结合]
  related: [xi-culture-thought, shouzheng-chuangxin, xi-thought, four-confidences]
  lists:
    - title: “结合”的五点意义（文化传承发展座谈会讲话，2023）
      cite: i05-xinhua-2023-06-02-culture-symposium
      items:
        - “结合”的前提是彼此契合
        - “结合”的结果是互相成就
        - “结合”筑牢了道路根基
        - “结合”打开了创新空间
        - “结合”巩固了文化主体性
    - title: 二十大报告列举的中华优秀传统文化理念（2022）
      cite: i01-gov-2022-10-16-20th-report
      items: [天下为公, 民为邦本, 为政以德, 革故鼎新, 任人唯贤, 天人合一, 自强不息, 厚德载物, 讲信修睦, 亲仁善邻]
  sections:
    - h: 提出与写入决议、党章
      from: 2021-07
      to: 2022-10
      text: 七一讲话首次把两个“相结合”并提。第三个历史决议说习近平等“坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合”，“创立了习近平新时代中国特色社会主义思想”，又在十条历史经验中写道马克思主义“必须中国化才能落地生根、本土化才能深入人心”。2022年党章总纲写入同一句话。
      cites: [i05-xinhua-2021-07-01-centenary-speech, b04-gov-2021-11-16-resolution, i01-12371-2022-10-22-party-charter]
    - h: 二十大的阐述
      from: 2022-10
      text: 二十大报告说，只有“同中华优秀传统文化相结合”，“马克思主义真理之树才能根深叶茂”，并列举天下为公、民为邦本、为政以德等理念，称其“同科学社会主义价值观主张具有高度契合性”，要求“把马克思主义思想精髓同中华优秀传统文化精华贯通起来、同人民群众日用而不觉的共同价值观念融通起来”。
      cites: [i01-gov-2022-10-16-20th-report]
    - h: 文化传承发展座谈会
      from: 2023-06
      text: 2023年6月2日，习近平在文化传承发展座谈会上系统讲述“结合”：前提是彼此契合，结果是互相成就，“让马克思主义成为中国的，中华优秀传统文化成为现代的”，并说“第二个结合”是“又一次的思想解放”。同年10月的全国宣传思想文化工作会议把提出“两个结合”特别是“第二个结合”的重大论断列为习近平文化思想的内容之一。
      cites: [i05-xinhua-2023-06-02-culture-symposium, i05-xinhua-2023-10-08-culture-thought-first]
    - h: 成为论证方法
      from: 2024
      text: 2024年中央纪委全会和人民日报评论员文章在提出“习近平总书记关于党的自我革命的重要思想”时，称它是我们党坚持“两个结合”推进理论创新取得的新成果。2025年纪念胡耀邦诞辰110周年座谈会讲话也要求全党同志要坚持“两个结合”。
      cites: [cs2-ccdi-2024-01-10-ccdi-3rd-plenum, i04-rmrb-2024-01-11-commentator, b22-gov-2025-11-20-xi-hu-110]
  cites: [i05-xinhua-2021-07-01-centenary-speech, b04-gov-2021-11-16-resolution, i01-12371-2022-10-22-party-charter, i01-gov-2022-10-16-20th-report, i05-xinhua-2023-06-02-culture-symposium, i05-xinhua-2023-10-08-culture-thought-first, cs2-ccdi-2024-01-10-ccdi-3rd-plenum, i04-rmrb-2024-01-11-commentator, b22-gov-2025-11-20-xi-hu-110]

- id: governance-modernization
  name: 国家治理体系和治理能力现代化
  en: Modernization of the System and Capacity for Governance
  kind: component
  parent: four-comprehensives
  by: [xi-jinping]
  first:
    date: 2013-11-15
    text: 十八届三中全会决定把它与“完善和发展中国特色社会主义制度”并列为全面深化改革的总目标。
    cite: e03-gov-2013-11-15-reform-decision
    quote: 全面深化改革的总目标是完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化
  summary: 国家治理体系和治理能力现代化是2013年三中全会确定的全面深化改革总目标的后半句，2017年写入“八个明确”。2019年十九届四中全会专门作出决定，列举中国国家制度和国家治理体系的13个“显著优势”，提出到建党百年、2035年和新中国成立百年的三步目标，并要求“把我国制度优势更好转化为国家治理效能”。全会部署的各项制度中，第一项是党的领导制度体系。
  terms: [国家治理体系和治理能力现代化, 治理现代化]
  related: [systems-thinking, party-leadership, rule-of-law, xi-rule-of-law-thought, four-comprehensives]
  lists:
    - title: 国家制度和国家治理体系的13个显著优势（十九届四中全会公报，2019）
      cite: i05-gov-2019-10-31-4th-plenum
      items:
        - 坚持党的集中统一领导，坚持党的科学理论，保持政治稳定，确保国家始终沿着社会主义方向前进
        - 坚持人民当家作主，发展人民民主，密切联系群众，紧紧依靠人民推动国家发展
        - 坚持全面依法治国，建设社会主义法治国家，切实保障社会公平正义和人民权利
        - 坚持全国一盘棋，调动各方面积极性，集中力量办大事
        - 坚持各民族一律平等，铸牢中华民族共同体意识，实现共同团结奋斗、共同繁荣发展
        - 坚持公有制为主体、多种所有制经济共同发展和按劳分配为主体、多种分配方式并存，把社会主义制度和市场经济有机结合起来，不断解放和发展社会生产力
        - 坚持共同的理想信念、价值理念、道德观念，弘扬中华优秀传统文化、革命文化、社会主义先进文化，促进全体人民在思想上精神上紧紧团结在一起
        - 坚持以人民为中心的发展思想，不断保障和改善民生、增进人民福祉，走共同富裕道路
        - 坚持改革创新、与时俱进，善于自我完善、自我发展，使社会充满生机活力
        - 坚持德才兼备、选贤任能，聚天下英才而用之，培养造就更多更优秀人才
        - 坚持党指挥枪，确保人民军队绝对忠诚于党和人民，有力保障国家主权、安全、发展利益
        - 坚持“一国两制”，保持香港、澳门长期繁荣稳定，促进祖国和平统一
        - 坚持独立自主和对外开放相统一，积极参与全球治理，为构建人类命运共同体不断作出贡献
    - title: 三步目标（十九届四中全会公报，2019）
      cite: i05-gov-2019-10-31-4th-plenum
      items:
        - 到我们党成立一百年时，在各方面制度更加成熟更加定型上取得明显成效
        - 到二〇三五年，各方面制度更加完善，基本实现国家治理体系和治理能力现代化
        - 到新中国成立一百年时，全面实现国家治理体系和治理能力现代化，使中国特色社会主义制度更加巩固、优越性充分展现
  sections:
    - h: 提出
      from: 2013-11
      to: 2017-10
      text: 三中全会决定说，“全面深化改革的总目标是完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化”，同时要求“更加注重改革的系统性、整体性、协同性”。十九大报告把它写为“八个明确”的第四条：“明确全面深化改革总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化”。
      cites: [e03-gov-2013-11-15-reform-decision, i01-gov-2017-10-18-19th-report]
    - h: 十九届四中全会
      from: 2019-10
      text: 四中全会专题讨论国家制度和国家治理。公报称中国的制度和治理体系“是具有强大生命力和巨大优越性的制度和治理体系”，列出13个显著优势，并逐项部署坚持和完善党的领导制度体系、人民当家作主制度体系、中国特色社会主义法治体系、行政体制、基本经济制度等。全会要求“构建系统完备、科学规范、运行有效的制度体系”，“加强系统治理、依法治理、综合治理、源头治理”。
      cites: [i05-gov-2019-10-31-4th-plenum]
    - h: 与后续改革的关系
      from: 2024-07
      text: 2024年二十届三中全会决定的六项原则中有“坚持以制度建设为主线”，要求“筑牢根本制度，完善基本制度，创新重要制度”，并推动“国家治理和社会发展更好相适应”。二十大报告回顾五年工作时也把“坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化”列为七次全会讨论的重大问题之一。
      cites: [i01-gov-2024-07-18-third-plenum-decision, i01-gov-2022-10-16-20th-report]
  cites: [e03-gov-2013-11-15-reform-decision, i01-gov-2017-10-18-19th-report, i05-gov-2019-10-31-4th-plenum, i01-gov-2024-07-18-third-plenum-decision, i01-gov-2022-10-16-20th-report]

- id: common-values
  name: 全人类共同价值
  en: Common Values of Humanity
  kind: component
  parent: xi-diplomacy-thought
  by: [xi-jinping]
  first:
    date: 2015-09-28
    text: 习近平在第七十届联合国大会一般性辩论上提出“全人类的共同价值”。
    cite: i05-gov-2015-09-29-unga
    quote: 和平、发展、公平、正义、民主、自由，是全人类的共同价值
  codified:
    - date: 2022-10-22
      where: 党章总纲（二十大修正案）
      cite: i01-12371-2022-10-22-party-charter
      quote: 弘扬和平、发展、公平、正义、民主、自由的全人类共同价值
  summary: 全人类共同价值是习近平在外交场合提出的价值表述，包括和平、发展、公平、正义、民主、自由六项。2015年在联合国大会首次提出，2021年七一讲话和第三个历史决议采用“全人类共同价值”的说法，2022年写入二十大报告和党章，2023年全球文明倡议把“弘扬全人类共同价值”列为四项内容之一。它与此前官方批判的“普世价值”在概念上分开：2008年《求是》刊文批评宣扬“普世价值”的人是在推销西式政治制度，2013年的“九号文件”也把宣扬“普世价值”列为需要警惕的思潮。
  terms: [全人类共同价值]
  related: [community-shared-future, global-initiatives, document-9, charter-08, xi-diplomacy-thought]
  lists:
    - title: 全人类的共同价值（第七十届联合国大会讲话，2015）
      cite: i05-gov-2015-09-29-unga
      items: [和平, 发展, 公平, 正义, 民主, 自由]
  sections:
    - h: 提出
      from: 2015-09
      text: 2015年9月联合国成立70周年之际，习近平在联大一般性辩论上说“和平、发展、公平、正义、民主、自由，是全人类的共同价值，也是联合国的崇高目标”，随后提出“构建以合作共赢为核心的新型国际关系，打造人类命运共同体”。
      cites: [i05-gov-2015-09-29-unga]
    - h: 写入决议、报告和党章
      from: 2021-07
      to: 2022-10
      text: 七一讲话要求“弘扬和平、发展、公平、正义、民主、自由的全人类共同价值”，第三个历史决议在外交部分写入同一句话，并说要“引领人类进步潮流”。二十大报告“真诚呼吁”各国弘扬全人类共同价值，“以文明交流超越文明隔阂、文明互鉴超越文明冲突、文明共存超越文明优越”。同年党章总纲的外交部分加入这一提法。
      cites: [i05-xinhua-2021-07-01-centenary-speech, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i01-12371-2022-10-22-party-charter]
    - h: 与“普世价值”之争
      from: 2008
      to: 2013
      text: 2008年11月《求是》刊登署名秋石的文章说，“自由、民主、人权、公平、正义、法治等是人类共同的追求，但三权分立、多党制、极端个人主义等并不是也不可能是普世的”，批评宣扬“普世价值”是在“推销西式政治制度、价值观念”。同年的零八宪章则称“自由、平等、人权是人类共同的普世价值”。2013年流传的“九号文件”把宣扬“普世价值”列为七种危险之一。2015年以后官方的六项共同价值包含“民主”“自由”，不包含零八宪章所说的“平等”“人权”。
      cites: [i08-chinanews-2008-11-17-qiushi-universal, i02-rfa-2016-07-13-charter08-text, e03-nytcn-2013-08-20-document-9, i05-gov-2015-09-29-unga]
  cites: [i05-gov-2015-09-29-unga, i01-12371-2022-10-22-party-charter, i05-xinhua-2021-07-01-centenary-speech, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i05-gov-2023-03-15-gci, i08-chinanews-2008-11-17-qiushi-universal, i02-rfa-2016-07-13-charter08-text, e03-nytcn-2013-08-20-document-9]

- id: global-initiatives
  name: 四大全球倡议
  en: The Global Initiatives (GDI, GSI, GCI, GGI)
  kind: component
  parent: xi-diplomacy-thought
  by: [xi-jinping]
  first:
    date: 2021-09-21
    text: 习近平在第七十六届联合国大会一般性辩论上提出全球发展倡议。
    cite: i05-gov-2021-09-22-unga-gdi
    quote: 在此，我愿提出全球发展倡议
  summary: 四大全球倡议是习近平在2021年至2025年间先后提出的四个外交倡议：全球发展倡议（2021年联大）、全球安全倡议（2022年博鳌亚洲论坛）、全球文明倡议（2023年中国共产党与世界政党高层对话会）和全球治理倡议（2025年“上海合作组织+”会议）。官方把它们与推动构建人类命运共同体相联系。前三项写入二十大报告、2024年三中全会决定和政府工作报告；全球安全倡议提出“安全不可分割原则”，反对“把本国安全建立在他国不安全的基础之上”，反对滥用单边制裁和“长臂管辖”。
  terms: [全球发展倡议, 全球安全倡议, 全球文明倡议, 全球治理倡议]
  related: [community-shared-future, xi-diplomacy-thought, common-values, belt-and-road, holistic-security]
  lists:
    - title: 全球发展倡议（第七十六届联合国大会讲话，2021）
      cite: i05-gov-2021-09-22-unga-gdi
      items: [坚持发展优先, 坚持以人民为中心, 坚持普惠包容, 坚持创新驱动, 坚持人与自然和谐共生, 坚持行动导向]
    - title: 全球安全倡议（博鳌亚洲论坛2022年年会主旨演讲）
      cite: i05-gov-2022-04-21-boao-gsi
      items:
        - 坚持共同、综合、合作、可持续的安全观
        - 坚持尊重各国主权、领土完整
        - 坚持遵守联合国宪章宗旨和原则
        - 坚持重视各国合理安全关切
        - 坚持通过对话协商以和平方式解决国家间的分歧和争端
        - 坚持统筹维护传统领域和非传统领域安全
    - title: 全球文明倡议（中国共产党与世界政党高层对话会主旨讲话，2023）
      cite: i05-gov-2023-03-15-gci
      items: [共同倡导尊重世界文明多样性, 共同倡导弘扬全人类共同价值, 共同倡导重视文明传承和创新, 共同倡导加强国际人文交流合作]
    - title: 全球治理倡议（“上海合作组织+”会议讲话，2025）
      cite: i05-gov-2025-09-01-sco-plus
      items: [奉行主权平等, 遵守国际法治, 践行多边主义, 倡导以人为本, 注重行动导向]
  sections:
    - h: 全球发展倡议
      from: 2021-09
      text: 2021年9月，习近平在联大一般性辩论视频讲话中说“在此，我愿提出全球发展倡议”，六项内容以“坚持发展优先”开头、“坚持行动导向”结尾，重点领域包括减贫、粮食安全、抗疫和疫苗、发展筹资、气候变化和绿色发展、工业化、数字经济、互联互通。同一讲话宣布中国“不再新建境外煤电项目”。2022年4月他说这一倡议“得到联合国等国际组织和近百个国家响应和支持”。
      cites: [i05-gov-2021-09-22-unga-gdi, i05-gov-2022-04-21-boao-gsi]
    - h: 全球安全倡议
      from: 2022-04
      text: 2022年4月博鳌亚洲论坛年会上，习近平说“人类是不可分割的安全共同体”，批评“冷战思维只会破坏全球和平框架”“集团对抗只会加剧21世纪安全挑战”，提出全球安全倡议六个“坚持”，包括“秉持安全不可分割原则”“反对把本国安全建立在他国不安全的基础之上”。
      cites: [i05-gov-2022-04-21-boao-gsi]
    - h: 全球文明倡议与全球治理倡议
      from: 2023-03
      to: 2025-09
      text: 2023年3月，习近平在中国共产党与世界政党高层对话会上提出全球文明倡议，主张“以文明交流超越文明隔阂、文明互鉴超越文明冲突、文明包容超越文明优越”。2025年9月在天津“上海合作组织+”会议上，他提出全球治理倡议，五点从“奉行主权平等”到“注重行动导向”，要求上合组织“当好践行全球治理倡议的表率”。
      cites: [i05-gov-2023-03-15-gci, i05-gov-2025-09-01-sco-plus]
    - h: 写入文件
      from: 2022-10
      text: 二十大报告说“中国提出了全球发展倡议、全球安全倡议，愿同国际社会一道努力落实”。2024年三中全会决定要求“落实全球发展倡议、全球安全倡议、全球文明倡议”，并在国际传播部分提出“建设全球文明倡议践行机制”。2024年和2025年政府工作报告的外交部分都写有落实三大倡议。
      cites: [i01-gov-2022-10-16-20th-report, i01-gov-2024-07-18-third-plenum-decision, i02-gov-2024-gwr, i02-gov-2025-gwr]
  cites: [i05-gov-2021-09-22-unga-gdi, i05-gov-2022-04-21-boao-gsi, i05-gov-2023-03-15-gci, i05-gov-2025-09-01-sco-plus, i01-gov-2022-10-16-20th-report, i01-gov-2024-07-18-third-plenum-decision, i02-gov-2024-gwr, i02-gov-2025-gwr]
