- id: correct-performance-view
  name: 正确政绩观
  en: Correct View of Political Achievements
  kind: formula
  by: [hu-jintao, xi-jinping]
  first:
    date: 2004-01-12
    text: 人民日报“任仲平”文章把“办实事、务实效、求实绩的政绩观”列为十六大后党中央提出的“四观”之一，这是本库所见最早的系统表述。
    cite: i04-rmrb-2004-01-12-renzhongping
    quote: 办实事、务实效、求实绩的政绩观
  codified:
    - date: 2004-09-19
      where: 十六届四中全会《中共中央关于加强党的执政能力建设的决定》
      cite: i01-wikisource-2004-09-19-governing-capacity-decision
      quote: 抓紧制定体现科学发展观和正确政绩观要求的干部实绩考核评价标准
    - date: 2007-10-21
      where: 党章（十七大修改）
      cite: d01-people-2007-10-25-party-charter
      quote: 树立正确政绩观，做出经得起实践、人民、历史检验的实绩
    - date: 2024-07-18
      where: 二十届三中全会决定
      cite: i01-gov-2024-07-18-third-plenum-decision
      quote: 树立和践行正确政绩观，健全有效防范和纠治政绩观偏差工作机制
  summary: 正确政绩观是中共对干部什么是政绩、怎样树政绩、为谁树政绩的要求，矛头主要指向以经济增长速度论干部。2004年1月人民日报任仲平文章把“办实事、务实效、求实绩的政绩观”列为“四观”之一，同年政府工作报告和十六届四中全会决定把它与科学发展观并提，要求据此制定干部考核标准；2007年十七大修改党章，在干部条件中写入“树立正确政绩观”（2002年党章此处只有“做出实绩”）。2013年6月习近平在全国组织工作会议上说“再也不能简单以国内生产总值增长率来论英雄了”，12月中组部通知规定不能搞地区生产总值及增长率排名，限制开发区域不再考核地区生产总值。2024年三中全会要求健全纠治政绩观偏差的工作机制，2026年2月至7月全党开展树立和践行正确政绩观学习教育。经济学者周黎安把地方官员围绕GDP的“晋升锦标赛”视为增长奇迹的重要根源，也认为它带来种种扭曲；2026年联合早报转述的一名北京学者质疑，GDP目标不废除，单靠观念教育难以改变官员行为。
  quote:
    text: 政绩观问题是一个根本性问题，关乎立党为公、执政为民。
    cite: i04-rmrb-2026-02-25-commentator
  terms: [正确政绩观, 正确的政绩观, 树立和践行正确政绩观, 政绩观偏差, 不以GDP论英雄]
  related: [scientific-development, strict-governance, anti-involution, four-winds, eight-point-rules]
  sections:
    - h: 胡温时期提出
      from: 2004-01
      to: 2007-10
      text: 任仲平文章说，“树立正确的政绩观，核心是解决这样几个问题：什么是政绩？怎样树政绩？为谁树政绩？”并批评一些干部“只抓那些容易出成果的“显绩”，不啃“硬骨头””。2004年政府工作报告说，“弘扬求真务实精神，树立科学发展观和正确的政绩观，是加强政风建设的一项重要内容”，要求不搞劳民伤财的“形象工程”。十七大报告要求“完善体现科学发展观和正确政绩观要求的干部考核评价体系”。
      cites: [i04-rmrb-2004-01-12-renzhongping, i02-gov-2004-gwr, i01-wikisource-2004-09-19-governing-capacity-decision, b02-npc-2007-10-24-17th-report, d01-people-2002-11-18-party-charter, d01-people-2007-10-25-party-charter]
    - h: 不简单以GDP论英雄
      from: 2013-06
      to: 2013-12
      text: 2013年6月全国组织工作会议上，习近平提出好干部要做到“信念坚定、为民服务、勤政务实、敢于担当、清正廉洁”，要求考核“既看显绩又看潜绩”。12月6日中组部通知规定，各类考核“不能仅仅把地区生产总值及增长率作为考核评价政绩的主要指标，不能搞地区生产总值及增长率排名”，限制开发区域和生态脆弱的国家扶贫开发工作重点县不再考核地区生产总值，并把政府负债作为政绩考核的重要指标。中组部负责人答记者问说，这对干部“不是没有发展的压力了，而是压力更大了、要求更高了、任务更重了”。
      cites: [i12-gov-2013-06-29-org-work-conference, i12-people-2013-12-09-performance-notice, i12-people-2013-12-11-performance-qa]
    - h: 十八大后沿用
      from: 2014-10
      to: 2025-07
      text: 2014年10月群众路线教育实践活动总结大会上，习近平要求各级党委（党组）“必须树立正确政绩观”。二十大报告要求“完善干部考核评价体系，引导干部树立和践行正确政绩观”。2025年7月中央财经委员会第六次会议把“引导干部树立和践行正确政绩观，完善高质量发展考核体系和干部政绩考核评价体系”与治理企业低价无序竞争、规范地方招商引资写在同一段。
      cites: [e13-gov-2014-10-08-mass-line-conclusion, i01-gov-2022-10-16-20th-report, i11-gov-2025-07-01-cfac-6th]
    - h: 2026年学习教育
      from: 2026-02
      to: 2026-09
      text: 2026年2月中办通知在全党开展学习教育，“以立党为公、为民造福、科学决策、真抓实干为总要求”，要求查找“现行制度机制中不符合正确政绩观要求的规定”。《习近平关于树立和践行正确政绩观论述摘编》同期发行。4月人民日报文章把矛头转向不作为，引用习近平批评有些干部“只要不出事，宁愿不做事，满足于做四平八稳的‘太平官’”。9月王沪宁传达习近平对“巩固拓展树立和践行正确政绩观学习教育成果”的重要指示。
      cites: [e15-gov-2026-02-23-performance-view, i04-rmrb-2026-02-25-commentator, i12-xinhua-2026-04-16-taiping-guan, b05-xinhua-2026-09-24-wang-huning-cppcc]
  policies:
    - date: 2013-06-28
      name: 全国组织工作会议：不再简单以GDP增长率论英雄
      text: 习近平提出好干部五条标准，要求把民生改善、社会进步、生态效益等指标和实绩作为重要考核内容。
      events: [i12-2013-org-work-conference]
      cite: i12-gov-2013-06-29-org-work-conference
    - date: 2013-12-06
      name: 中组部改进地方党政领导班子和领导干部政绩考核工作的通知
      text: 通知规定不搞地区生产总值及增长率排名，限制开发区域不再考核地区生产总值，加强政府债务考核。
      events: [i12-2013-performance-evaluation-notice]
      cite: i12-people-2013-12-09-performance-notice
    - date: 2025-07-01
      name: 中央财经委员会第六次会议
      text: 会议要求引导干部树立和践行正确政绩观，完善高质量发展考核体系和干部政绩考核评价体系。
      events: [e14-2025-cfac-sixth]
      cite: i11-gov-2025-07-01-cfac-6th
    - date: 2026-02-23
      name: 全党开展树立和践行正确政绩观学习教育
      text: 学习教育以县处级以上领导班子和领导干部特别是“一把手”为重点，春节假期后启动、7月底基本结束。
      events: [e15-2026-performance-view-campaign]
      cite: e15-gov-2026-02-23-performance-view
  voices:
    - voice: scholar
      text: 晋升锦标赛作为中国政府官员的激励模式，它是中国经济奇迹的重要根源，但由于晋升锦标赛自身的一些缺陷，尤其是其激励官员的目标与政府职能的合理设计之间存在严重冲突，它目前正面临着重要的转型。
      cite: i12-aisixiang-2007-zhou-lian-tournament
      quote: true
    - voice: zh
      text: 要求他们转变观念是一回事，更新晋升规则和价值观是另一回事。如果GDP目标未被废除，官员们该怎么做？
      cite: i12-zaobao-2026-02-27-performance-view
      quote: true
    - voice: official
      text: 树立和践行正确政绩观，必须动真碰硬、系统施治，着力纠正做“太平官”的错误政绩观，鲜明树立重实干、重担当、重实绩的导向
      cite: i12-xinhua-2026-04-16-taiping-guan
      quote: true
