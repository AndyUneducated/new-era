- id: xi-party-building-thought
  name: 习近平党建思想
  en: Xi Jinping Thought on Party Building
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2023-06-28
    text: 全国组织工作会议以“十三个坚持”系统阐述“习近平总书记关于党的建设的重要思想”，这是这一思想的前身提法。
    cite: i12-xinhua-2023-06-30-first-observation
    quote: 这次会议提出了“习近平总书记关于党的建设的重要思想”这一提法。
  codified:
    - date: 2026-06-15
      where: 全国党建工作座谈会
      cite: i12-gov-2026-06-15-party-building-symposium
      quote: 提出一系列新理念新思想新战略，形成习近平党建思想
    - date: 2026-06-18
      where: 中央党的建设工作领导小组《关于学习贯彻习近平党建思想的通知》
      cite: e15-gov-2026-06-18-party-building-notice
      quote: 是习近平新时代中国特色社会主义思想的重要组成部分
  summary: 习近平党建思想是习近平新时代中国特色社会主义思想中关于党的建设的部分，2026年6月以此名提出，此前叫“习近平总书记关于党的建设的重要思想”。2018年全国组织工作会议提出“新时代党的组织路线”，陈希在总结讲话中要求“贯彻落实习近平总书记关于党的建设和组织工作重要思想”。2023年6月习近平给全国组织工作会议的指示用的是“党中央关于党的建设的重要思想”；会上蔡奇以“十三个坚持”系统阐述“习近平总书记关于党的建设的重要思想”，新华社称会议“提出了”这一提法。此后中纪委全会、七一社论把它与“关于党的自我革命的重要思想”并提。2026年6月15日全国党建工作座谈会改称“习近平党建思想”，内涵改为“十四个坚持”；中央党史和文献研究院院长曲青山说它是“高一个层级的概念和范畴”，分支思想由此形成“7+1”架构。联合早报报道这次是“首次提出”，就名称而言如此，但同一体系的前身在2023年已经提出。
  quote:
    text: 习近平党建思想是习近平新时代中国特色社会主义思想的重要组成部分，为发展马克思主义建党学说作出重大原创性贡献，对强党强国具有重大现实意义和长远指导意义。
    cite: i12-gov-2026-06-15-party-building-symposium
  terms: [习近平党建思想, 习近平总书记关于党的建设的重要思想, 十三个坚持, 十四个坚持]
  related: [xi-thought, strict-governance, self-revolution, party-leadership, two-establishes, xi-culture-thought]
  sections:
    - h: 前身：新时代党的组织路线
      from: 2018-07
      to: 2023-05
      text: 2018年7月全国组织工作会议上，习近平提出新时代党的组织路线，要求“以组织体系建设为重点，着力培养忠诚干净担当的高素质干部”，并说“党中央是大脑和中枢，党中央必须有定于一尊、一锤定音的权威”。中组部部长陈希总结时要求“贯彻落实习近平总书记关于党的建设和组织工作重要思想”。
      cites: [i12-xinhua-2018-07-04-org-work-conference]
    - h: 2023年提出“重要思想”
      from: 2023-06
      to: 2023-06
      text: 习近平6月26日的重要指示要求“深刻领会党中央关于党的建设的重要思想”，提出以坚持和加强党中央集中统一领导为“最高原则”。6月28日蔡奇讲话第二部分题为“深入学习领会习近平总书记关于党的建设的重要思想”，分十三条阐述。次日中组部部长李干杰总结说，“会议用“十三个坚持”集中概括了习近平总书记关于党的建设的重要思想”，称系统阐述这一思想是“这次会议的灵魂所在、精髓所在”。新华社“第一观察”说它构成习近平新时代中国特色社会主义思想的“党建篇”。
      cites: [i12-people-2023-08-22-org-conference-speeches, i12-xinhua-2023-06-30-first-observation]
    - h: 与自我革命思想并提
      from: 2024-01
      to: 2026-01
      text: 新华社2026年回顾说，全国组织工作会议和二十届中央纪委三次全会“系统阐述习近平总书记关于党的建设的重要思想、关于党的自我革命的重要思想”。2024年七一人民日报社论、2026年1月二十届中央纪委五次全会公报都沿用这一并提的说法。
      cites: [e15-xinhua-2026-06-15-party-building-thought, i04-rmrb-2024-07-01-editorial, b06-gov-2026-01-14-ccdi-5th]
    - h: 改称“习近平党建思想”
      from: 2026-06
      to: 2026-07
      text: 6月15日全国党建工作座谈会由蔡奇讲话、李希出席、石泰峰主持，会议称学习贯彻习近平党建思想是“当前和今后一个时期全党的一项重要政治任务”，要求“组织开展体系化学理化研究阐释”。6月18日中央党建工作领导小组发出学习通知，提出“十四个深刻领会”。6月22日王沪宁说，这一思想“在习近平新时代中国特色社会主义思想中有着特殊重要的地位”。
      cites: [i12-gov-2026-06-15-party-building-symposium, e15-gov-2026-06-18-party-building-notice, v01-xinhua-2026-06-22-cppcc-chairs]
    - h: 十三条到十四条
      from: 2026-07
      text: 曲青山逐条对照两版：“坚持和加强党的全面领导”拆为“坚持党的领导是中国特色社会主义最本质的特征”和“坚持党中央集中统一领导”；“坚持以党的自我革命引领社会革命”改为“坚持全面从严治党”；“坚持造就忠诚干净担当的高素质干部队伍”和“坚持聚天下英才而用之”合并；新增“坚持锤炼坚强党性”和“坚持用严明的纪律管全党治全党”；取消“坚持完善党和国家监督体系”。他说新版“比2023年6月全国组织工作会上提出的习近平总书记关于党的建设的重要思想的科学内涵多一个坚持”。
      cites: [i12-nju-2026-07-02-qu-qingshan]
  lists:
    - title: 十三个坚持（蔡奇在全国组织工作会议上的讲话，2023）
      cite: i12-people-2023-08-22-org-conference-speeches
      items:
        - 坚持和加强党的全面领导
        - 坚持以党的自我革命引领社会革命
        - 坚持以党的政治建设统领党的建设各项工作
        - 坚持江山就是人民、人民就是江山
        - 坚持思想建党、理论强党
        - 坚持严密党的组织体系
        - 坚持造就忠诚干净担当的高素质干部队伍
        - 坚持聚天下英才而用之
        - 坚持持之以恒正风肃纪
        - 坚持一体推进不敢腐、不能腐、不想腐
        - 坚持完善党和国家监督体系
        - 坚持制度治党、依规治党
        - 坚持落实全面从严治党政治责任
    - title: 十四个坚持（全国党建工作座谈会，2026）
      cite: i12-gov-2026-06-15-party-building-symposium
      items:
        - 坚持党的领导是中国特色社会主义最本质的特征
        - 坚持党中央集中统一领导
        - 坚持全面从严治党
        - 坚持不忘初心、牢记使命
        - 坚持以党的政治建设为统领
        - 坚持用党的创新理论凝心铸魂
        - 坚持锤炼坚强党性
        - 坚持健全上下贯通、执行有力的组织体系
        - 坚持建设堪当民族复兴重任的高素质干部队伍
        - 坚持推进作风建设常态化长效化
        - 坚持用严明的纪律管全党治全党
        - 坚持一体推进不敢腐不能腐不想腐
        - 坚持制度治党、依规治党
        - 坚持落实管党治党政治责任
