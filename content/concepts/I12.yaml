# I12 (round 17): 社会主义新农村建设、习近平党建思想、正确政绩观。
# 本轮点名的积极财政政策、十大产业振兴规划、自主创新、反内卷已有条目（proactive-fiscal-policy、industry-revitalization-plans、innovative-country、anti-involution），未重建。

- id: new-socialist-countryside
  name: 社会主义新农村建设
  en: Building a New Socialist Countryside
  kind: formula
  parent: sannong
  by: [hu-jintao, wen-jiabao]
  first:
    date: 2005-10-11
    text: 十六届五中全会通过“十一五”规划建议，把建设社会主义新农村列为专门一部分，提出二十字要求。
    cite: i12-npc-2005-10-18-11th-fyp-proposal
    quote: 建设社会主义新农村是我国现代化进程中的重大历史任务。
  codified:
    - date: 2006-02-21
      where: 中共中央、国务院关于推进社会主义新农村建设的若干意见（2006年中央一号文件）
      cite: e01-cpc-dsj-2005
      quote: 2006年2月21日，新华社全文发布了《中共中央、国务院关于推进社会主义新农村建设的若干意见》
    - date: 2006-03-05
      where: 2006年政府工作报告
      cite: i02-gov-2006-gwr
      quote: 建设社会主义新农村，是党的十六届五中全会提出的重大历史任务
    - date: 2007-10-15
      where: 十七大报告
      cite: b02-npc-2007-10-24-17th-report
      quote: 统筹城乡发展，推进社会主义新农村建设。
  summary: 社会主义新农村建设是胡锦涛、温家宝时期“三农”政策的总提法。1998年十五届三中全会已提出到2010年建设有中国特色社会主义新农村的目标；2005年10月十六届五中全会的“十一五”规划建议把它列为专门一部分，称之为“我国现代化进程中的重大历史任务”，提出生产发展、生活宽裕、乡风文明、村容整洁、管理民主的二十字要求。2006年2月中央以连续第三个“一号文件”部署，并举办省部级主要领导干部专题研讨班，此后一年内对5474名县委书记、县长专题培训。政策重点是把国家基础设施投入的重点转向农村、增加农业补贴、推进农村综合改革。政府工作报告一再要求尊重农民意愿、防止一哄而起；但2010年新京报报道二十多个省市借城乡建设用地增减挂钩“拆村并居”，农民“被上楼”，11月国务院常务会议要求坚决防止违背农民意愿大拆大建。十八大后这一提法渐少，2017年十九大提出乡村振兴战略，二十字要求改为产业兴旺、生态宜居、乡风文明、治理有效、生活富裕。
  quote:
    text: 要尊重农民意愿，不能搞形式主义和强迫命令，防止一哄而起
    cite: i02-gov-2006-gwr
  terms: [新农村建设, 建设社会主义新农村, 社会主义新农村建设, 被上楼, 拆村并居]
  related: [sannong, rural-revitalization, no1-document, harmonious-society, scientific-development]
  sections:
    - h: 前史
      from: 1998-10
      to: 2005-09
      text: 1998年10月十五届三中全会通过《关于农业和农村工作若干重大问题的决定》，“提出到2010年建设有中国特色社会主义新农村的奋斗目标”。2003年1月胡锦涛在中央农村工作会议上提出“把解决好农业、农村和农民问题作为全党工作的重中之重”。
      cites: [e01-gov-2021-06-28-cpc-100y]
    - h: 五中全会提出
      from: 2005-10
      to: 2005-12
      text: “十一五”规划建议第三部分题为“建设社会主义新农村”，要求坚持“多予少取放活”，“扩大公共财政覆盖农村的范围，强化政府对农村的公共服务，建立以工促农、以城带乡的长效机制”，并培养“有文化、懂技术、会经营的新型农民”。12月中央农村工作会议讨论一号文件讨论稿，强调新农村建设“必须因地制宜，从实际出发，尊重农民意愿，注重实效，稳步前进”。
      cites: [i12-npc-2005-10-18-11th-fyp-proposal, e01-cpc-dsj-2005]
    - h: 一号文件与研讨班
      from: 2006-02
      to: 2007-01
      text: 2006年2月21日新华社发布《中共中央、国务院关于推进社会主义新农村建设的若干意见》，人民日报社论说这是2004年以来中央连续第三年制定的“三农”一号文件。2月14日至20日中央举办省部级主要领导干部专题研讨班，胡锦涛强调“要真正使建设社会主义新农村成为惠及广大农民群众的民心工程”。2006年4月至2007年1月，中央连续举办50期培训班，对5474名县委书记、县长进行专题培训。同年8月，胡锦涛把建设社会主义新农村列为十六大以来提出的重大战略思想和重大战略任务之一。
      cites: [e01-cpc-dsj-2005, e01-cpc-dsj-2006, i04-rmrb-2006-02-22-editorial]
    - h: 投入转向农村
      from: 2006-03
      to: 2008-03
      text: 2006年政府工作报告说，“把国家对基础设施建设投入的重点转向农村，这是一个重大转变”，当年中央财政用于“三农”的支出达到3397亿元；2007年安排3917亿元。2008年政府工作报告总结五年来中央财政用于“三农”的支出累计1.6万亿元，其中用于农村基础设施建设近3000亿元，并说这些措施“有力地推动了社会主义新农村建设”。
      cites: [i02-gov-2006-gwr, i02-gov-2007-gwr, i02-gov-2008-gwr]
    - h: 拆村并居与“被上楼”
      from: 2006-04
      to: 2010-11
      text: 2006年4月，国土资源部把山东、天津、江苏、湖北、四川列为城乡建设用地增减挂钩第一批试点：农村宅基地复垦为耕地，可换取等面积城镇建设用地指标。2010年11月新京报报道，“一场让农民“上楼”的行动，正在全国二十多个省市进行。”各地拆村运动“打着各种旗号，例如城乡统筹、新农村建设、旧村改造、小城镇化等”；山东诸城1249个村合并为208个农村社区，江苏邳州坝头村一名村民因买不起足额楼房自杀。中央农村工作领导小组副组长陈锡文称和平时期大规模村庄撤并“古今中外，史无前例”。11月10日温家宝主持国务院常务会议，要求村庄撤并由农村集体经济组织和农户自主决定，“坚决防止违背农民意愿搞大拆大建、盲目建高楼等现象”。财新则认为强制“农民上楼”不能归咎于增减挂钩政策本身，而是“现有政治体制下政府主导城市化模式的必然结果”。
      cites: [i12-chinanews-2010-11-02-beishanglou, i12-jjckb-2010-11-11-state-council-guagou, i12-caixin-2010-11-13-guagou-brake]
    - h: 让位乡村振兴
      from: 2012-11
      to: 2018-02
      text: 十八大报告仍要求“深入推进新农村建设和扶贫开发”，2013年政府工作报告要求“使城镇化和新农村建设良性互动”。2017年十九大提出实施乡村振兴战略，按照“产业兴旺、生态宜居、乡风文明、治理有效、生活富裕的总要求”推进农业农村现代化。2018年中央一号文件回顾说，十八大以来“扎实推进农业现代化和新农村建设”，为实施乡村振兴战略奠定了基础。
      cites: [i01-wsyu-2012-11-08-18th-report, i02-gov-2013-gwr, i01-gov-2017-10-18-19th-report, i06-gov-2018-02-04-rural-revitalization]
  lists:
    - title: 新农村建设的二十字要求（“十一五”规划建议，2005）
      cite: i12-npc-2005-10-18-11th-fyp-proposal
      items: [生产发展, 生活宽裕, 乡风文明, 村容整洁, 管理民主]
    - title: 乡村振兴的总要求（十九大报告，2017）
      cite: i01-gov-2017-10-18-19th-report
      items: [产业兴旺, 生态宜居, 乡风文明, 治理有效, 生活富裕]
  policies:
    - date: 2005-12-31
      name: 中共中央、国务院关于推进社会主义新农村建设的若干意见
      text: 中共中央、国务院印发2006年中央一号文件，按照二十字要求部署社会主义新农村建设。
      events: [e11-2005-new-countryside-opinion]
      cite: e01-gov-2021-06-28-cpc-100y
    - date: 2006-02-14
      name: 省部级主要领导干部建设社会主义新农村专题研讨班
      text: 中共中央举办专题研讨班，胡锦涛、温家宝先后在开班式和结业式上讲话。
      events: [i12-2006-new-countryside-seminar]
      cite: e01-cpc-dsj-2006
    - date: 2010-11-10
      name: 国务院常务会议规范农村土地整治和增减挂钩试点
      text: 会议要求严格控制增减挂钩试点规模和范围，涉及村庄撤并的土地整治必须由农村集体经济组织和农户自主决定，不得强拆强建。
      events: [i12-2010-land-swap-curb]
      cite: i12-jjckb-2010-11-11-state-council-guagou
    - date: 2018-01-02
      name: 中央一号文件部署乡村振兴战略
      text: 2018年中央一号文件以实施乡村振兴战略为主题，取代新农村建设成为“三农”工作的总抓手。
      events: [e11-2018-rural-revitalization-document]
      cite: i06-gov-2018-02-04-rural-revitalization
  voices:
    - voice: official
      text: 建设社会主义新农村是一项长期而艰巨的任务。要坚持从实际出发，因地制宜，分类指导，搞好规划；要尊重农民意愿，不能搞形式主义和强迫命令，防止一哄而起
      cite: i02-gov-2006-gwr
      quote: true
    - voice: zh
      text: 拆村并居，无数村庄正从中国广袤的土地上消失，无数农民正在“被上楼”。
      cite: i12-chinanews-2010-11-02-beishanglou
      quote: true
    - voice: zh
      text: 近年来各地此起彼伏强制“农民上楼”之举并不能归咎于“增减挂钩”，而是现有政治体制下政府主导城市化模式的必然结果
      cite: i12-caixin-2010-11-13-guagou-brake
      quote: true
  cites:
