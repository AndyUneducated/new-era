  by: [hu-jintao, xi-jinping]
  first:
    date: 2012-11-08
    text: 十八大报告在经济、政治、文化、社会建设“四位一体”之外加入生态文明建设，提出“五位一体”总体布局。
    cite: i01-wsyu-2012-11-08-18th-report
    quote: 全面落实经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体总体布局
  codified:
