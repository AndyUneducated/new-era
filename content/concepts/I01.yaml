  codified:
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 发展全过程人民民主
    - date: 2022-10-22
      where: 党章（二十大修正案）
      cite: i01-12371-2022-10-22-party-charter
      quote: 发展更加广泛、更加充分、更加健全的全过程人民民主
  summary: 全过程人民民主是官方对中国政治制度的新概括。习近平2019年11月在上海古北市民中心考察时说“人民民主是一种全过程的民主”，2021年的历史决议改称“全过程人民民主”。二十大报告中出现9次，并写入修改后的党章。官方以立法征询、协商民主等实践说明其内容，用来与西方竞争性选举民主相区别。
  quote:
    text: 发展更加广泛、更加充分、更加健全的全过程人民民主，推进协商民主广泛多层制度化发展
    cite: i01-12371-2022-10-22-party-charter
  terms: [全过程人民民主]
  related: [rule-of-law, xi-thought]
  cites: [i01-jhsjk-2019-11-02-whole-process-democracy, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i01-12371-2022-10-22-party-charter]

- id: self-revolution
  name: 自我革命
  en: Self-revolution
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2017-10-18
    text: 十九大报告称勇于自我革命是党最鲜明的品格（库内所见最早出处，更早的用法待考）。
    cite: i01-gov-2017-10-18-19th-report
    quote: 勇于自我革命，从严管党治党，是我们党最鲜明的品格
  codified:
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 推进党的自我革命
    - date: 2022-10-22
      where: 党章（二十大修正案）
      cite: i01-12371-2022-10-22-party-charter
      quote: 以伟大自我革命引领伟大社会革命
  summary: 自我革命是习近平对全面从严治党的理论化概括。十九大报告称“勇于自我革命，从严管党治党，是我们党最鲜明的品格”。2021年十九届六中全会上，习近平说党找到了跳出历史周期率的“第二个答案”即自我革命，与毛泽东在延安窑洞里给出的“让人民来监督政府”这第一个答案并提。2022年1月中央纪委全会上他进一步阐述，二十大报告和修改后的党章都写入了这一表述。
  quote:
    text: 党找到了自我革命这一跳出治乱兴衰历史周期率的第二个答案
    cite: i01-gov-2022-10-16-20th-report
