- id: holistic-security
  name: 总体国家安全观
  en: Holistic National Security Outlook
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2014-04-15
    text: 习近平主持中央国家安全委员会第一次会议时提出。
    cite: i01-gov-2014-04-15-holistic-security
    quote: 必须坚持总体国家安全观，以人民安全为宗旨，以政治安全为根本
  codified:
    - date: 2017-10-24
      where: 党章（十九大修正案）
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 坚持总体国家安全观
  summary: 总体国家安全观是习近平2014年4月主持首次中央国家安全委员会会议时提出的安全理念，强调“以人民安全为宗旨，以政治安全为根本，以经济安全为基础”，把政治、国土、军事、经济、文化、社会、科技、信息、生态、资源、核安全等纳入一个国家安全体系。第三个历史决议把涵盖领域扩展到网络、海外利益、太空、深海、极地、生物等。2017年写入党章。
  quote:
    text: 习近平同志强调保证国家安全是头等大事，提出总体国家安全观
    cite: b04-gov-2021-11-16-resolution
  terms: [总体国家安全观]
  related: [xi-thought, stability-maintenance]
  cites: [i01-gov-2014-04-15-holistic-security, e03-gov-2017-10-24-charter-resolution, b04-gov-2021-11-16-resolution]

