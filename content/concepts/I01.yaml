# I01: the guiding thoughts, their components and the political formulas, 1997–2026.
# first = the earliest appearance found in the library; codified = written into the charter, the constitution, a resolution or a plenum document.

# ---------------- guiding thoughts ----------------
- id: deng-theory
  name: 邓小平理论
  en: Deng Xiaoping Theory
  kind: guiding
  by: []
  first:
    date: 1997-09-12
    text: 十五大报告以“邓小平理论”为旗帜，建议在党章中把它确立为党的指导思想（库内所见最早出处，更早的用法待考）。
    cite: i01-wenming-1997-09-12-15th-report
    quote: 中央建议十五大在党章中把邓小平理论确立为党的指导思想
  codified:
    - date: 1997-09-18
      where: 党章（十五大修正案）
      cite: i01-12371-1997-09-18-15th-charter-resolution
      quote: 在党章中把邓小平理论确立为党的指导思想
    - date: 1999-03-15
      where: 宪法序言（1999年修正案）
      cite: i01-gov-2004-03-14-constitution-amendment
      quote: 在马克思列宁主义、毛泽东思想、邓小平理论指引下
  summary: 邓小平理论是中共对邓小平改革开放以来路线和论述的总称，主题是“建设有中国特色社会主义”。1997年江泽民在十五大报告中高举这面旗帜，同月写入党章，1999年写入宪法序言。此后历次党代会报告都把它列为指导思想的第一环，但随着“三个代表”、科学发展观、习近平思想相继写入，它在报告中的出现次数从十五大的41次降到二十大的1次，变成指导思想序列中的固定名目。
  quote:
    text: 大会的主题是：高举邓小平理论伟大旗帜，把建设有中国特色社会主义事业全面推向二十一世纪
    cite: i01-wenming-1997-09-12-15th-report
  terms: [邓小平理论]
  related: [three-represents, xiaokang, taoguang-yanghui, chinese-modernization]
  cites: [i01-wenming-1997-09-12-15th-report, i01-12371-1997-09-18-15th-charter-resolution, i01-gov-2004-03-14-constitution-amendment]

- id: three-represents
  name: “三个代表”重要思想
  en: Three Represents
  kind: guiding
  by: [jiang-zemin]
  first:
    date: 2000-02
    text: 江泽民在广东考察党建工作时首次作出这一论断，同年5月在江苏、浙江、上海考察时归纳为“三个代表”。
    cite: b01-cpc-2000-02-three-represents
    quote: 我们党所以赢得人民的拥护，是因为我们党作为工人阶级先锋队，在革命、建设、改革的各个历史时期，总能代表着中国先进社会生产力的发展要求，代表着中国先进文化的前进方向，代表着中国最广大人民的根本利益
  codified:
    - date: 2002-11-14
      where: 党章（十六大修正案）
      cite: i01-chinanews-2002-11-14-16th-charter-resolution
      quote: “三个代表”重要思想是党必须长期坚持的指导思想
    - date: 2004-03-14
      where: 宪法序言（2004年修正案）
      cite: i01-gov-2004-03-14-constitution-amendment
      quote: 在马克思列宁主义、毛泽东思想、邓小平理论和‘三个代表’重要思想指引下
  summary: “三个代表”指中共要始终代表中国先进生产力的发展要求、中国先进文化的前进方向和中国最广大人民的根本利益。江泽民2000年2月在广东首次论述，5月归纳为这一提法。2002年十六大写入党章，同时把党员来源扩大到“其他社会阶层的先进分子”，为私营企业主入党打开了门；2004年写入宪法。与邓小平理论不同，它写入党章时没有冠以江泽民的名字。
  quote:
    text: 代表中国先进生产力的发展要求，代表中国先进文化的前进方向，代表中国最广大人民的根本利益
    cite: i01-chinanews-2002-11-14-16th-charter-resolution
  terms: [三个代表]
  related: [deng-theory, scientific-development, xi-thought]
  voices:
    - voice: zh
      text: 过去两个领导人江泽民的'三个代表'与胡锦涛的'科学发展观'写进了党章，可是江与胡的名字没有进去
      cite: i01-bbc-2017-10-24-xi-thought-charter
      quote: true
  cites: [b01-cpc-2000-02-three-represents, i01-chinanews-2002-11-14-16th-charter-resolution, i01-gov-2004-03-14-constitution-amendment, i01-bbc-2017-10-24-xi-thought-charter]

- id: scientific-development
  name: 科学发展观
  en: Scientific Outlook on Development
  kind: guiding
  by: [hu-jintao]
  first:
    date: 2003-08-28
    text: 胡锦涛在江西考察（8月28日至9月1日）时首次使用“科学发展观”一词；同年4月在广东已提出“全面的发展观”。
    cite: i01-cma-2012-12-17-scientific-development
    quote: 牢固树立协调发展、全面发展、可持续发展的科学发展观
  codified:
    - date: 2003-10-14
      where: 十六届三中全会《中共中央关于完善社会主义市场经济体制若干问题的决定》
      cite: i01-cma-2012-12-17-scientific-development
      quote: 坚持以人为本、全面协调可持续的科学发展观，促进经济社会和人的全面发展
    - date: 2007-10-21
      where: 党章（十七大修正案）
      cite: i01-gov-2007-10-21-17th-charter-resolution
      quote: 大会一致同意将科学发展观写入党章
    - date: 2012-11-14
      where: 党章（十八大修正案），确立为指导思想
      cite: i01-gov-2012-11-14-18th-charter-resolution
      quote: 大会一致同意在党章中把科学发展观同马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想一道确立为党的行动指南
    - date: 2018-03-11
      where: 宪法序言（2018年修正案）
      cite: i01-gov-2018-03-11-constitution
      quote: 在马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想指引下
  summary: 科学发展观是胡锦涛时期的指导思想，以“以人为本”为核心，要求全面、协调、可持续发展，针对的是高速增长中发展不平衡的问题。概念在2003年非典疫情之后形成，同年十六届三中全会正式提出；2007年十七大写入党章，2012年十八大确立为与马列、毛泽东思想、邓小平理论、“三个代表”并列的指导思想，2018年写入宪法。它在十七大报告中出现21次，到二十大报告只剩1次。
  quote:
    text: 科学发展观，是对党的三代中央领导集体关于发展的重要思想的继承和发展，是马克思主义关于发展的世界观和方法论的集中体现
    cite: i01-gov-2007-10-21-17th-charter-resolution
  terms: [科学发展观]
  related: [harmonious-society, three-represents, xi-thought, ecological-civilization]
  cites: [i01-cma-2012-12-17-scientific-development, i01-gov-2007-10-21-17th-charter-resolution, i01-gov-2012-11-14-18th-charter-resolution, i01-gov-2018-03-11-constitution]

- id: xi-thought
  name: 习近平新时代中国特色社会主义思想
  en: Xi Jinping Thought on Socialism with Chinese Characteristics for a New Era
  kind: guiding
  by: [xi-jinping]
  first:
    date: 2017-10-18
    text: 十九大报告提出“新时代中国特色社会主义思想”并列出基本方略，报告本身未冠习近平之名；十九大通过的党章修正案以全名写入。
    cite: i01-gov-2017-10-18-19th-report
    quote: 新时代中国特色社会主义思想和基本方略
  codified:
    - date: 2017-10-24
      where: 党章（十九大修正案）
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 在党章中把习近平新时代中国特色社会主义思想同马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观一道确立为党的行动指南
    - date: 2018-03-11
      where: 宪法序言（2018年修正案）
      cite: i01-gov-2018-03-11-constitution
      quote: 在马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想指引下
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 确立习近平新时代中国特色社会主义思想的指导地位
  summary: 习近平新时代中国特色社会主义思想是中共现行指导思想序列中的最新一项，涵盖中国梦、新发展理念、总体国家安全观、全面从严治党、人类命运共同体等论述。2017年十九大以领导人姓名写入党章，2018年写入宪法序言，2021年第三个历史决议称它是“当代中国马克思主义、二十一世纪马克思主义”，并把确立其指导地位列为“两个确立”之一。香港学者林和立对BBC中文说，江泽民、胡锦涛的理论入党章时都没有冠名，习近平冠名入章象征他在党内的至高地位。
  quote:
    text: 习近平新时代中国特色社会主义思想是对马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观的继承和发展，是马克思主义中国化最新成果
    cite: e03-gov-2017-10-24-charter-resolution
  terms: [新时代中国特色社会主义思想]
  related: [new-era, chinese-dream, two-establishes, core, third-resolution]
  voices:
    - voice: doc
      text: 习近平新时代中国特色社会主义思想是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化新的飞跃
      cite: b04-gov-2021-11-16-resolution
      quote: true
    - voice: zh
      text: 这次习近平的名字进去了，象征他是党内至高无上的领导人
      cite: i01-bbc-2017-10-24-xi-thought-charter
      quote: true
  lists:
    - title: 十个明确（第三个历史决议，2021）
      cite: b04-gov-2021-11-16-resolution
      items:
        - 明确中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，中国共产党是最高政治领导力量，全党必须增强“四个意识”、坚定“四个自信”、做到“两个维护”
        - 明确坚持和发展中国特色社会主义，总任务是实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国，以中国式现代化推进中华民族伟大复兴
        - 明确新时代我国社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，必须坚持以人民为中心的发展思想，发展全过程人民民主，推动人的全面发展、全体人民共同富裕取得更为明显的实质性进展
        - 明确中国特色社会主义事业总体布局是经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体，战略布局是全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党四个全面
        - 明确全面深化改革总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化
        - 明确全面推进依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家
        - 明确必须坚持和完善社会主义基本经济制度，使市场在资源配置中起决定性作用，更好发挥政府作用，把握新发展阶段，贯彻创新、协调、绿色、开放、共享的新发展理念，加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，推动高质量发展，统筹发展和安全
        - 明确党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队
        - 明确中国特色大国外交要服务民族复兴、促进人类进步，推动建设新型国际关系，推动构建人类命运共同体
        - 明确全面从严治党的战略方针，提出新时代党的建设总要求，全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争，落实管党治党政治责任，以伟大自我革命引领伟大社会革命
  cites: [i01-gov-2017-10-18-19th-report, e03-gov-2017-10-24-charter-resolution, i01-gov-2018-03-11-constitution, b04-gov-2021-11-16-resolution, i01-bbc-2017-10-24-xi-thought-charter]

# ---------------- components ----------------
- id: harmonious-society
  name: 社会主义和谐社会
  en: Socialist Harmonious Society
  kind: component
  parent: scientific-development
  by: [hu-jintao]
  first:
    date: 2004-09-19
    text: 十六届四中全会关于加强党的执政能力建设的决定，把“构建社会主义和谐社会的能力”列为党的五种执政能力之一。
    cite: i01-wikisource-2004-09-19-governing-capacity-decision
    quote: 不断提高驾驭社会主义市场经济的能力、发展社会主义民主政治的能力、建设社会主义先进文化的能力、构建社会主义和谐社会的能力、应对国际局势和处理国际事务的能力
  codified:
    - date: 2006-10
      where: 十六届六中全会《中共中央关于构建社会主义和谐社会若干重大问题的决定》
      cite: i01-cma-2012-12-17-scientific-development
      quote: 构建社会主义和谐社会，必须坚持以科学发展观统领经济社会发展全局
    - date: 2007-10-21
      where: 党章（十七大修正案）
      cite: i01-gov-2007-10-21-17th-charter-resolution
      quote: 构建社会主义和谐社会，团结带领全国各族人民把中国特色社会主义伟大事业不断推向前进
  summary: 社会主义和谐社会是胡锦涛时期与科学发展观并列的施政纲领，总要求是“民主法治、公平正义、诚信友爱、充满活力、安定有序、人与自然和谐相处”。2004年十六届四中全会首次以执政能力的形式提出，2006年十六届六中全会作出专门决定，2007年写入党章。它在十七大报告中出现7次、十八大4次，十九大、二十大报告已不再使用，但现行党章仍保留“中国共产党领导人民构建社会主义和谐社会”一句。
  quote:
    text: 中国共产党领导人民构建社会主义和谐社会
    cite: i01-12371-2022-10-22-party-charter
  terms: [和谐社会]
  related: [scientific-development, stability-maintenance]
  cites: [i01-wikisource-2004-09-19-governing-capacity-decision, i01-cma-2012-12-17-scientific-development, i01-gov-2007-10-21-17th-charter-resolution, i01-12371-2022-10-22-party-charter]

- id: new-era
  name: 新时代
  en: New Era
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2017-10-18
    text: 十九大报告宣布中国特色社会主义进入新时代。
    cite: i01-gov-2017-10-18-19th-report
    quote: 经过长期努力，中国特色社会主义进入了新时代，这是我国发展新的历史方位
  codified:
    - date: 2017-10-24
      where: 党章（十九大修正案）
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 推动中国特色社会主义进入了新时代
  summary: “新时代”是十九大对十八大以来阶段的定性：报告称“中国特色社会主义进入了新时代”，是“新的历史方位”，依据是社会主要矛盾已经转化。这一判断写入党章，并成为习近平思想正式名称的一部分。“新时代”一词在十九大报告中出现36次、二十大报告39次、第三个历史决议47次。香港学者林和立对BBC中文表示，在中国特色社会主义前面加上“新时代”并无特殊意义。
  quote:
    text: 这个新时代，是承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代
    cite: i01-gov-2017-10-18-19th-report
  terms: [新时代]
  related: [xi-thought, principal-contradiction]
  voices:
    - voice: zh
      text: 中国特色社会主义已经讲了好几十年了，只是加一个新时代没有特殊意义，14条方略也没有任何理论创新
      cite: i01-bbc-2017-10-24-xi-thought-charter
      quote: true
  cites: [i01-gov-2017-10-18-19th-report, e03-gov-2017-10-24-charter-resolution, i01-bbc-2017-10-24-xi-thought-charter]

- id: chinese-dream
  name: 中国梦
  en: Chinese Dream
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2012-11-29
    text: 习近平率新一届政治局常委参观国家博物馆《复兴之路》展览时提出。
    cite: i01-gov-2012-11-29-fuxing-zhilu
    quote: 现在，大家都在讨论中国梦，我以为，实现中华民族伟大复兴，就是中华民族近代以来最伟大的梦想
  codified:
    - date: 2017-10-24
      where: 党章（十九大修正案）
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 大会同意在党章中明确实现“两个一百年”奋斗目标、实现中华民族伟大复兴的中国梦的宏伟目标
  summary: 中国梦即“实现中华民族伟大复兴”，是习近平就任总书记后提出的第一个口号。2012年11月29日他在国家博物馆参观《复兴之路》时提出，此后成为宣传主线，2017年写入党章。口号刚提出时也有不同的解读：2013年元旦，《南方周末》新年献辞原题《中国梦，宪政梦》，遭广东省委宣传部长庹震撤换，引发编辑抗议。
  quote:
    text: 实现中华民族伟大复兴是一项光荣而艰巨的事业，需要一代又一代中国人共同为之努力
    cite: i01-gov-2012-11-29-fuxing-zhilu
  terms: [中国梦]
  related: [xi-thought, chinese-modernization]
  voices:
    - voice: zh
      text: 中国人本应就是自由人。中国梦本应就是宪政梦
      cite: i01-bbc-2013-01-04-nanfang-zhoumo
      quote: true
  cites: [i01-gov-2012-11-29-fuxing-zhilu, e03-gov-2017-10-24-charter-resolution, i01-bbc-2013-01-04-nanfang-zhoumo]

- id: four-comprehensives
  name: 四个全面
  en: Four Comprehensives
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2014-12-14
    text: 习近平在江苏调研时首次把四个“全面”并提。
    cite: i01-xinhua-2014-12-14-jiangsu-four-comprehensives
    quote: 协调推进全面建成小康社会、全面深化改革、全面推进依法治国、全面从严治党
  codified:
    - date: 2017-10-24
      where: 党章（十九大修正案）
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 协调推进全面建成小康社会、全面深化改革、全面依法治国、全面从严治党
  summary: “四个全面”战略布局指全面建成小康社会、全面深化改革、全面依法治国、全面从严治党。2014年12月习近平在江苏调研时首次把四者并提，2015年十八届五中全会公报已称“四个全面”战略布局，2017年写入党章。2021年7月1日宣告全面建成小康社会之后，第一项改为“全面建设社会主义现代化国家”，现行党章即用这一表述。
  quote:
