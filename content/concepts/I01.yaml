  summary: 人类命运共同体是习近平时期外交的总目标性提法。十八大报告已提出“倡导人类命运共同体意识”，十八大以后习近平在多边场合反复阐发，十九大报告出现6次。2017年“推动构建人类命运共同体”写入党章，2018年写入宪法序言，与“一带一路”、全人类共同价值等一起构成官方的对外话语。
  quote:
    text: 推动构建人类命运共同体，推动建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界
