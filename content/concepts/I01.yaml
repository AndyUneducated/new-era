- id: rule-of-law
  name: 全面依法治国
  en: Comprehensively Governing the Country according to Law
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2012-11-08
    text: 十八大报告把“全面推进依法治国”列为政治建设的一项任务；“依法治国”作为治国基本方略早在1997年十五大提出。
    cite: i01-wsyu-2012-11-08-18th-report
    quote: （四）全面推进依法治国
  codified:
    - date: 2017-10-24
      where: 党章（十九大修正案）
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 协调推进全面建成小康社会、全面深化改革、全面依法治国、全面从严治党
  summary: 全面依法治国是“四个全面”之一。“依法治国，建设社会主义法治国家”由1997年十五大报告提出，后写入宪法第五条；2012年十八大报告改为“全面推进依法治国”，十九大起称“全面依法治国”。官方强调“党的领导、人民当家作主、依法治国有机统一”，即法治在党的领导之下推进，这也是它与西方意义上的法治的根本区别。
  quote:
    text: 中华人民共和国实行依法治国，建设社会主义法治国家
    cite: i01-gov-2018-03-11-constitution
  terms: [全面依法治国, 全面推进依法治国]
  related: [four-comprehensives, whole-process-democracy]
