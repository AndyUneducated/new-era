- id: eight-point-rules
  name: 中央八项规定
  en: Eight-point Regulation
  kind: formula
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2012-12-04
    text: 十八届中央政治局会议审议通过。
    cite: i01-most-2012-12-04-eight-point-rules
    quote: 会议一致同意关于改进工作作风、密切联系群众的八项规定
  codified:
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 党中央从制定和落实中央八项规定破题
  summary: 中央八项规定是十八届中央政治局2012年12月通过的改进作风规定，要求调研轻车简从、精简会议和文件简报、规范出访、减少交通管制、不安排宴请、厉行勤俭节约等。规定以政治局成员为对象，同时要求各地区各部门制定落实办法，并由纪检监察机关监督执行。第三个历史决议把它称为全面从严治党的破题之举，此后违反中央八项规定精神成为官员处分通报中的常见事由。
  quote:
    text: 抓作风建设，首先要从中央政治局做起，要求别人做到的自己先要做到，要求别人不做的自己坚决不做
    cite: i01-most-2012-12-04-eight-point-rules
  terms: [八项规定]
  related: [self-revolution, four-comprehensives]
  cites: [i01-most-2012-12-04-eight-point-rules, b04-gov-2021-11-16-resolution]

- id: xiaokang
  name: 全面建成小康社会
  en: Moderately Prosperous Society
  kind: formula
  parent: deng-theory
  by: [jiang-zemin, hu-jintao, xi-jinping]
  first:
    date: 1979-12-06
    text: 邓小平会见日本首相大平正芳时用“小康之家”解释中国式的四个现代化。
    cite: i01-cpc-2022-10-31-deng-modernization
    quote: 我们的四个现代化的概念，不是像你们那样的现代化的概念，而是“小康之家”
  codified:
    - date: 2002-11-14
      where: 党章（十六大修正案）
      cite: i01-chinanews-2002-11-14-16th-charter-resolution
      quote: 把十六大确定的全面建设小康社会的奋斗目标写入党章
  summary: “小康”是邓小平1979年会见大平正芳时借用的传统概念，用来表述中国式现代化的阶段目标。1982年十二大提出到20世纪末人民生活达到小康水平；2002年十六大提出“全面建设小康社会”并写入党章，2012年十八大改为“全面建成小康社会”，目标定在2020年。2021年7月1日习近平宣告全面建成小康社会，此后这一提法让位于“全面建设社会主义现代化国家”。
  quote:
    text: 中国共产党第十八次全国代表大会，是在我国进入全面建成小康社会决定性阶段召开的一次十分重要的大会
    cite: i01-wsyu-2012-11-08-18th-report
  terms: [小康社会, 小康水平]
  related: [chinese-modernization, four-comprehensives, common-prosperity, deng-theory]
  cites: [i01-cpc-2022-10-31-deng-modernization, i01-chinanews-2002-11-14-16th-charter-resolution, i01-jszx-2002-11-08-16th-report, i01-wsyu-2012-11-08-18th-report, i01-moe-2015-10-29-5th-plenum-communique, i01-12371-2022-10-22-party-charter]

- id: taoguang-yanghui
  name: 韬光养晦
  en: Hide One's Capabilities and Bide One's Time
  kind: formula
  parent: deng-theory
  by: []
  first:
    date: 1992-04
    text: 据《邓小平年谱》，邓小平1992年4月谈话中说“再韬光养晦地干些年”；作为方针的确切首次提出时间待考。
    cite: i01-ifeng-2012-10-28-taoguang
    quote: 我们再韬光养晦地干些年，才能真正形成一个较大的政治力量，中国在国际上发言的分量就会不同
  summary: 韬光养晦是邓小平在1989年后西方制裁与苏东剧变背景下提出的对外方针之一，常与冷静观察、稳住阵脚、沉着应付、善于守拙、决不当头、有所作为并提，核心是低调发展、不当头。这一说法很少进入正式文件，十五大至二十大报告和现行党章、宪法中都没有出现。习近平时期转向“大国外交”，BBC中文刊发澳门大学王建伟的评论，认为习近平正在逐步扬弃韬光养晦，转向“有所作为/大有作为”。
  quote:
    text: 我们千万不要当头，这是一个根本国策
    cite: i01-ifeng-2012-10-28-taoguang
  terms: [韬光养晦]
  related: [peaceful-rise, deng-theory, community-shared-future]
  voices:
    - voice: zh
      text: 习近平治下的中国正在逐渐扬弃邓小平的“韬光养晦”战略思想，而转向“有所作为/大有作为”的新取向，一个新的中国外交大战略正在形成
      cite: i01-bbc-2013-12-02-taoguang
      quote: true
  cites: [i01-ifeng-2012-10-28-taoguang, i01-bbc-2013-12-02-taoguang]

- id: peaceful-rise
  name: 和平崛起 / 和平发展
  en: Peaceful Rise / Peaceful Development
  kind: formula
  parent: scientific-development
  by: [hu-jintao, wen-jiabao]
  first:
    date: 2003-11-03
    text: 中共中央党校原常务副校长郑必坚在博鳌亚洲论坛演讲中首次提出。
    cite: i01-chinanews-2004-04-08-peaceful-rise
    quote: 首次提出了“中国和平崛起”这一论题
  codified:
    - date: 2018-03-11
      where: 宪法序言（2018年修正案），作“和平发展道路”
      cite: i01-gov-2018-03-11-constitution
      quote: 坚持和平发展道路
  summary: “和平崛起”由郑必坚2003年11月在博鳌亚洲论坛首次提出，同年12月温家宝在哈佛大学演讲、胡锦涛在纪念毛泽东诞辰110周年座谈会上相继采用。2004年起领导人改用“和平发展”。YaleGlobal的分析认为转折点是胡锦涛2004年在博鳌论坛的讲话，国内反对者认为中国尚未崛起、谈“崛起”为时过早。此后“和平发展道路”成为正式提法，十七大报告专章论述，2018年写入宪法序言。
  quote:
    text: 中国将始终不渝走和平发展道路，坚定奉行独立自主的和平外交政策
    cite: i01-wsyu-2012-11-08-18th-report
  terms: [和平崛起, 和平发展道路]
  related: [taoguang-yanghui, community-shared-future]
  voices:
    - voice: scholar
      text: Hu’s non-use of the term “rise” indicates his agreement with analysts who favored a less confrontational phrase.
      zh: 胡锦涛不用“崛起”一词，表明他认同那些主张采用较少对抗色彩措辞的分析人士。
      cite: i01-yaleglobal-2004-peaceful-rise
      quote: true
  cites: [i01-chinanews-2004-04-08-peaceful-rise, i01-yaleglobal-2004-peaceful-rise, b02-npc-2007-10-24-17th-report, i01-wsyu-2012-11-08-18th-report, i01-gov-2018-03-11-constitution]

- id: stability-maintenance
  name: 维稳
  en: Stability Maintenance
  kind: formula
  parent: harmonious-society
  by: []
  first:
    date: 2002-11-08
    text: 十六大报告把“维护社会稳定”单列为政治建设的一项任务（库内所见最早出处；“维稳”这一简称的首用时间待考）。
    cite: i01-jszx-2002-11-08-16th-report
    quote: (九)维护社会稳定
  summary: 维稳是“维护社会稳定”的简称。官方预算中没有“维稳经费”科目，但香港媒体依据财政部预算报告附表的“公共安全”支出测算，称2011年至2013年连续三年超过国防预算；时任全国人大发言人李肇星等官员则批评这是“偷换概念”。路透社报道认为，维稳经费膨胀与周永康势力的增长有关。在库内的正式文件中，“维稳”只出现在“反恐维稳”这类军队任务的表述里。
  terms: [维稳, 维护社会稳定]
  related: [harmonious-society, holistic-security]
  voices:
    - voice: zh
      text: “维稳开支”究竟占多大比例，依然没有人说清楚
      cite: i01-bbc-2013-03-06-weiwen-budget
      quote: true
  cites: [i01-jszx-2002-11-08-16th-report, i01-bbc-2013-03-06-weiwen-budget, i01-gov-2017-10-18-19th-report, b04-gov-2021-11-16-resolution]

- id: dynamic-zero
  name: 动态清零
  en: Dynamic Zero-COVID
  kind: formula
  by: [xi-jinping]
  first:
    date: 2021-12-01
    text: 国家卫健委主任马晓伟接受新华社专访时正式阐释这一名称，并称“动态清零”阶段从2021年8月开始（这一说法更早的使用时间待考）。
    cite: i01-xinhua-2021-12-01-dynamic-zero
    quote: 我们将这一防控策略称为“动态清零”，这是中国控制疫情的“法宝”
  summary: 动态清零是中国2021年下半年至2022年底的新冠防控总策略，要求发现疫情后快速处置，力争在一个潜伏期左右控制住传播。官方称其为控制疫情的“法宝”，2022年10月的二十大报告仍写“坚持动态清零不动摇”。11月乌鲁木齐一处封控住宅区发生火灾，引发上海等地大规模抗议；12月7日国务院发布“新十条”，不再提坚持动态清零，防控随之放开。
  quote:
    text: 现阶段我们仍将坚持“动态清零”策略不动摇
    cite: i01-xinhua-2021-12-01-dynamic-zero
  terms: [动态清零]
  related: [holistic-security]
  voices:
    - voice: zh
      text: 没有人能劝阻习近平放弃“动态清零”，他也不会聆听民间沮丧的声音
      cite: i01-bbc-2022-12-07-new-ten-rules
      quote: true
  cites: [i01-xinhua-2021-12-01-dynamic-zero, i01-gov-2022-10-16-20th-report, i01-bbc-2022-12-07-new-ten-rules]
