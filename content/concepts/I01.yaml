  en: Whole-process People's Democracy
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2019-11-02
    text: 习近平在上海长宁区古北市民中心考察法律草案意见建议征询会时说“人民民主是一种全过程的民主”。
    cite: i01-jhsjk-2019-11-02-whole-process-democracy
