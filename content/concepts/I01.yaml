      where: 党章（十八大修正案）
      cite: i01-gov-2012-11-14-18th-charter-resolution
      quote: 大会同意将生态文明建设写入党章并作出阐述，使中国特色社会主义事业总体布局更加完善
  summary: “五位一体”是中国特色社会主义事业的总体布局，即经济建设、政治建设、文化建设、社会建设、生态文明建设统筹推进。2007年十七大把前四项作为“四位一体”写入党章，2012年十八大报告加入生态文明建设，同年写入党章。十八大以后它与“四个全面”战略布局并称，成为习近平时期政策文件的固定框架。
  quote:
    text: 必须按照中国特色社会主义事业“五位一体”总体布局和“四个全面”战略布局
    cite: i01-12371-2022-10-22-party-charter
  terms: [五位一体]
  related: [four-comprehensives, ecological-civilization, scientific-development]
  cites: [i01-wsyu-2012-11-08-18th-report, i01-gov-2007-10-21-17th-charter-resolution, i01-gov-2012-11-14-18th-charter-resolution, i01-12371-2022-10-22-party-charter]

- id: new-development-philosophy
  name: 新发展理念
  en: New Development Philosophy
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2015-10-29
    text: 十八届五中全会在审议“十三五”规划建议时提出创新、协调、绿色、开放、共享五大发展理念。
    cite: i01-moe-2015-10-29-5th-plenum-communique
    quote: 必须牢固树立并切实贯彻创新、协调、绿色、开放、共享的发展理念
  codified:
    - date: 2017-10-24
      where: 党章（十九大修正案）
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 坚持创新、协调、绿色、开放、共享的发展理念
    - date: 2018-03-11
      where: 宪法序言（2018年修正案）
      cite: i01-gov-2018-03-11-constitution
      quote: 贯彻新发展理念
  summary: 新发展理念指创新、协调、绿色、开放、共享五个发展理念。2015年10月十八届五中全会制定“十三五”规划建议时提出，公报称这是“关系我国发展全局的一场深刻变革”；2016年初的官方文件已统称“新发展理念”。2017年写入党章，2018年写入宪法序言。二十大前后它与“新发展阶段”“新发展格局”连用，现行党章写作“把握新发展阶段，贯彻……新发展理念，加快构建……新发展格局”。
  quote:
    text: 把握新发展阶段，贯彻创新、协调、绿色、开放、共享的新发展理念，加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，推动高质量发展
    cite: i01-12371-2022-10-22-party-charter
  terms: [创新、协调、绿色、开放、共享, 贯彻新发展理念]
  related: [scientific-development, dual-circulation, supply-side, common-prosperity]
