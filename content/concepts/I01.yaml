- id: chinese-modernization
  name: 中国式现代化
  en: Chinese Path to Modernization
  kind: component
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 1979-03-23
    text: 邓小平在中央政治局会议上正式提出“中国式的现代化”；两天前会见英中文化协会代表团时已说“中国式的四个现代化”。
    cite: i01-cpc-2022-10-31-deng-modernization
    quote: 现在搞建设，也要适合中国情况，走出一条中国式的现代化道路
  codified:
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 以中国式现代化推进中华民族伟大复兴
    - date: 2022-10-22
      where: 党章（二十大修正案）
      cite: i01-12371-2022-10-22-party-charter
      quote: 以中国式现代化全面推进中华民族伟大复兴
  summary: “中国式的现代化”原是邓小平1979年的说法，意思是标准不同于西方、以小康为阶段目标的现代化。习近平时期把它重新提升为核心论述：2021年历史决议写入“以中国式现代化推进中华民族伟大复兴”，二十大报告把党的中心任务表述为“以中国式现代化全面推进中华民族伟大复兴”，并写入党章。2024年二十届三中全会决定以“推进中国式现代化”为题，全文出现23次。
  quote:
    text: 从现在起，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴
    cite: i01-gov-2022-10-16-20th-report
  terms: [中国式现代化]
  related: [xiaokang, chinese-dream, deng-theory, common-prosperity]
  cites: [i01-cpc-2022-10-31-deng-modernization, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i01-12371-2022-10-22-party-charter, i01-gov-2024-07-18-third-plenum-decision]

- id: whole-process-democracy
