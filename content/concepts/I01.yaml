# ---------------- formulas ----------------
- id: belt-and-road
  name: 一带一路
  en: Belt and Road Initiative
  kind: formula
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2013-09-07
    text: 习近平在哈萨克斯坦纳扎尔巴耶夫大学演讲时倡议共同建设“丝绸之路经济带”。
    cite: i01-fmprc-2013-09-07-nazarbayev-speech
    quote: 我们可以用创新的合作模式，共同建设“丝绸之路经济带”
  codified:
    - date: 2017-10-24
      where: 党章（十九大修正案）
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 推进“一带一路”建设
  summary: “一带一路”是丝绸之路经济带和21世纪海上丝绸之路的合称。习近平2013年9月在纳扎尔巴耶夫大学演讲中倡议共建丝绸之路经济带，2017年写入党章。第三个历史决议称它已成为“深受欢迎的国际公共产品和国际合作平台”。批评一方面来自欧美政府和舆论的“债务陷阱”指责，老挝的中老铁路、斯里兰卡的港口和机场常被举为例证；BBC中文报道也指出，中国在这十年里成为世界最大债主，债务危机对中国同样意味着坏账。
  quote:
    text: 推动共建“一带一路”高质量发展
    cite: b04-gov-2021-11-16-resolution
  terms: [一带一路]
  related: [community-shared-future, dual-circulation]
  voices:
    - voice: zh
      text: 欧美国家从政府到舆论，一再批评“一带一路”是中国设置的“债务陷阱”
      cite: i01-bbc-2023-09-belt-and-road
      quote: true
  cites: [i01-fmprc-2013-09-07-nazarbayev-speech, e03-gov-2017-10-24-charter-resolution, b04-gov-2021-11-16-resolution, i01-bbc-2023-09-belt-and-road]

- id: supply-side
  name: 供给侧结构性改革
  en: Supply-side Structural Reform
  kind: formula
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2015-11-10
    text: 习近平主持中央财经领导小组第十一次会议时提出。
    cite: i01-cpc-2015-11-10-supply-side
    quote: 在适度扩大总需求的同时，着力加强供给侧结构性改革，着力提高供给体系质量和效率
  codified:
    - date: 2017-10-24
      where: 党章（十九大修正案）
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 推进供给侧结构性改革
  summary: 供给侧结构性改革是2015年底起中国经济政策的重点，主张在适度扩大总需求的同时，从供给端化解过剩产能、降低企业成本、化解房地产库存、防范金融风险。2015年11月中央财经领导小组第十一次会议首次提出，2017年写入党章；2020年提出新发展格局时，中央仍以“深化供给侧结构性改革”为前提。
  quote:
    text: 推进经济结构性改革，是贯彻落实党的十八届五中全会精神的一个重要举措
    cite: i01-cpc-2015-11-10-supply-side
  terms: [供给侧结构性改革]
  related: [new-development-philosophy, dual-circulation]
  cites: [i01-cpc-2015-11-10-supply-side, e03-gov-2017-10-24-charter-resolution, i01-gov-2020-05-14-dual-circulation]

- id: dual-circulation
  name: 新发展格局 / 双循环
  en: Dual Circulation
  kind: formula
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2020-05-14
    text: 中央政治局常委会会议在研究疫情防控和产业链供应链稳定时提出。
    cite: i01-gov-2020-05-14-dual-circulation
    quote: 构建国内国际双循环相互促进的新发展格局
  codified:
    - date: 2022-10-22
      where: 党章（二十大修正案）
      cite: i01-12371-2022-10-22-party-charter
      quote: 加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局
  summary: 新发展格局即“以国内大循环为主体、国内国际双循环相互促进”。2020年5月新冠疫情冲击全球供应链时，中央政治局常委会会议首次提出，要求发挥超大规模市场和内需潜力、提升产业链供应链稳定性和竞争力。此后与新发展阶段、新发展理念并称，2022年二十大修改党章时写入；二十大报告出现7次。
  quote:
    text: 要深化供给侧结构性改革，充分发挥我国超大规模市场优势和内需潜力，构建国内国际双循环相互促进的新发展格局
    cite: i01-gov-2020-05-14-dual-circulation
  terms: [新发展格局]
  related: [supply-side, new-development-philosophy, new-quality-productive-forces]
  cites: [i01-gov-2020-05-14-dual-circulation, i01-12371-2022-10-22-party-charter]

- id: common-prosperity
  name: 共同富裕
  en: Common Prosperity
  kind: formula
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 1953-12-16
    text: 《中共中央关于发展农业生产合作社的决议》首次在党的重要文件中使用“共同富裕”；同年9月25日《人民日报》国庆口号已出现这一概念。
    cite: i01-dangshi-2022-02-21-common-prosperity
    quote: 这是在党的重要文件中第一次使用“共同富裕”
  codified:
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 逐步实现全体人民共同富裕的时代
  summary: 共同富裕最早见于1953年中共推动农业合作化的文件。改革开放后，中共在“允许一部分人先富起来”的同时仍以共同富裕为目标。2021年8月中央财经委员会第十次会议专题研究“扎实促进共同富裕”，称它是“社会主义的本质要求”，提出合理调节过高收入、构建三次分配制度等措施，次日腾讯宣布追加500亿元的“共同富裕专项计划”。BBC中文引述纽约城市大学教授夏明的看法，认为若企业家投资乏力，这一政策可能变成“杀鸡取卵”。
  quote:
    text: 共同富裕是全体人民的富裕，是人民群众物质生活和精神生活都富裕，不是少数人的富裕，也不是整齐划一的平均主义
    cite: i01-xinhua-2021-08-17-common-prosperity
  terms: [共同富裕]
  related: [xiaokang, chinese-modernization, new-development-philosophy]
  voices:
    - voice: zh
      text: 如果企业家投资乏力，企业扩张缓慢，不再继续创造就业，也不再扩展财富创造，那么从长远来看，目前所谓的共同富裕政策就会变成杀鸡取卵
      cite: i01-bbc-2021-08-20-common-prosperity
      quote: true
  cites: [i01-dangshi-2022-02-21-common-prosperity, i01-xinhua-2021-08-17-common-prosperity, b04-gov-2021-11-16-resolution, i01-bbc-2021-08-20-common-prosperity]

- id: new-quality-productive-forces
  name: 新质生产力
  en: New Quality Productive Forces
  kind: formula
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2023-09-08
    text: 习近平在黑龙江考察（9月6日至8日）听取省委省政府汇报时提出。
    cite: i01-gov-2023-09-08-new-quality-productive-forces
    quote: 整合科技创新资源，引领发展战略性新兴产业和未来产业，加快形成新质生产力
  codified:
    - date: 2024-07-18
      where: 二十届三中全会决定
      cite: i01-gov-2024-07-18-third-plenum-decision
      quote: 健全因地制宜发展新质生产力体制机制
    - date: 2025-10-23
      where: 二十届四中全会公报
      cite: i01-fmprc-2025-10-23-fourth-plenum-communique
      quote: 加快高水平科技自立自强，引领发展新质生产力
  summary: 新质生产力是习近平2023年9月在黑龙江考察时提出的说法，指以科技创新整合资源、引领战略性新兴产业和未来产业形成的新生产力。2024年二十届三中全会决定专列一条“健全因地制宜发展新质生产力体制机制”，2025年二十届四中全会公报要求以高水平科技自立自强引领其发展。它没有出现在二十大报告和现行党章中。
  quote:
    text: 加快高水平科技自立自强，引领发展新质生产力
    cite: i01-fmprc-2025-10-23-fourth-plenum-communique
  terms: [新质生产力]
  related: [dual-circulation, chinese-modernization]
  cites: [i01-gov-2023-09-08-new-quality-productive-forces, i01-gov-2024-07-18-third-plenum-decision, i01-fmprc-2025-10-23-fourth-plenum-communique]

- id: core
  name: 核心（“习核心”）
  en: The Core
  kind: formula
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2016-10-27
    text: 十八届六中全会公报首次使用“以习近平同志为核心的党中央”。
    cite: i01-cpc-2016-10-27-6th-plenum-communique
    quote: 党的十八大以来，以习近平同志为核心的党中央身体力行、率先垂范
  codified:
    - date: 2017-10-24
      where: 党章（十九大修正案）
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 坚定维护以习近平同志为核心的党中央权威和集中统一领导
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 党确立习近平同志党中央的核心、全党的核心地位
  summary: “核心”指习近平作为“党中央的核心、全党的核心”的地位。中共此前提及自己的历史时一般只承认毛泽东、邓小平、江泽民三个“核心”，胡锦涛时期的官方提法是“以胡锦涛同志为总书记的党中央”。2016年10月十八届六中全会公报首次使用“以习近平同志为核心的党中央”，2017年写入党章，2021年历史决议把确立这一核心地位列为“两个确立”的第一项。BBC中文报道说，许多观察家认为此举显示他的权力进一步加强。
  quote:
    text: 党确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位
    cite: b04-gov-2021-11-16-resolution
  terms: [以习近平同志为核心, 党中央的核心、全党的核心]
  related: [two-establishes, two-safeguards, four-consciousness, xi-thought]
  voices:
    - voice: zh
      text: 许多观察家认为，习近平目前获得的权力已经超过了自毛泽东之后的任何中国领导人，而最新把他确定为领导“核心”的决定显示出他的权力得到了进一步加强
      cite: i01-bbc-2016-10-27-xi-core
      quote: true
  cites: [i01-cpc-2016-10-27-6th-plenum-communique, e03-gov-2017-10-24-charter-resolution, b04-gov-2021-11-16-resolution, i01-bbc-2016-10-27-xi-core]

- id: two-establishes
  name: 两个确立
  en: Two Establishes
  kind: formula
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2021-11-11
    text: 十九届六中全会公报和第三个历史决议写入“两个确立”的内容；“两个确立”这一简称在全会后数日内已见于官方媒体，简称的确切首用时间待考。
    cite: b04-gov-2021-11-16-resolution
    quote: 党确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位
  codified:
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 对新时代党和国家事业发展、对推进中华民族伟大复兴历史进程具有决定性意义
    - date: 2024-07-18
      where: 二十届三中全会决定
      cite: i01-gov-2024-07-18-third-plenum-decision
      quote: 必须深刻领悟“两个确立”的决定性意义
    - date: 2025-10-23
      where: 二十届四中全会公报
      cite: i01-fmprc-2025-10-23-fourth-plenum-communique
      quote: 全党要深刻领悟“两个确立”的决定性意义
  summary: “两个确立”指确立习近平党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位。内容出自2021年11月十九届六中全会公报和第三个历史决议，称其“具有决定性意义”；全会后数日官方媒体已普遍使用这一简称。值得注意的是，二十大报告和2022年修改的党章都没有出现“两个确立”这一简称，而二十届三中全会决定和四中全会公报又重新写入。
  quote:
    text: 必须深刻领悟“两个确立”的决定性意义，增强“四个意识”、坚定“四个自信”、做到“两个维护”
    cite: i01-gov-2024-07-18-third-plenum-decision
  terms: [两个确立]
  related: [core, two-safeguards, third-resolution, xi-thought]
  cites: [b04-gov-2021-11-16-resolution, i01-dangshi-2021-11-15-two-establishes, i01-gov-2022-10-16-20th-report, i01-12371-2022-10-22-party-charter, i01-gov-2024-07-18-third-plenum-decision, i01-fmprc-2025-10-23-fourth-plenum-communique]

- id: two-safeguards
  name: 两个维护
  en: Two Safeguards
  kind: formula
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2018-08
    text: 2018年修订的《中国共产党纪律处分条例》增写“两个维护”（库内所见最早出处；简称的首次使用时间待考）。
    cite: i01-cpc-2019-02-22-two-safeguards
    quote: 2018年修订的《中国共产党纪律处分条例》（以下简称《条例》）增写了“两个维护”的内容
  codified:
    - date: 2021-11-11
      where: 第三个历史决议
      cite: b04-gov-2021-11-16-resolution
      quote: 全党必须增强“四个意识”、坚定“四个自信”、做到“两个维护”
    - date: 2022-10-22
      where: 党章（二十大修正案），党员义务
      cite: i01-12371-2022-10-22-party-charter
      quote: 增强“四个意识”、坚定“四个自信”、做到“两个维护”
  summary: “两个维护”指坚决维护习近平党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导。2018年修订的纪律处分条例把它写入党规，中央纪委机关报称应把它作为“最根本、最重要的政治纪律和政治规矩”，秦岭违建别墅等案件即以此定性。2021年历史决议把它与“四个意识”“四个自信”并列为全党必须做到的要求，2022年写入党章的党员义务。
  quote:
    text: 坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导
    cite: i01-cpc-2019-02-22-two-safeguards
  terms: [两个维护]
  related: [two-establishes, four-consciousness, core]
  cites: [i01-cpc-2019-02-22-two-safeguards, b04-gov-2021-11-16-resolution, i01-12371-2022-10-22-party-charter]

- id: four-consciousness
  name: 四个意识
  en: Four Consciousnesses
  kind: formula
  parent: xi-thought
  by: [xi-jinping]
  first:
    date: 2016-01-29
    text: 中央政治局会议把政治意识、大局意识、核心意识、看齐意识并提（库内所见最早出处，首次并提的时间待考）。
    cite: i01-cpc-2016-01-29-four-consciousness
    quote: 只有增强政治意识、大局意识、核心意识、看齐意识
  codified:
    - date: 2016-10-27
      where: 十八届六中全会公报
      cite: i01-cpc-2016-10-27-6th-plenum-communique
      quote: 牢固树立政治意识、大局意识、核心意识、看齐意识
    - date: 2017-10-24
      where: 党章（十九大修正案）
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 牢固树立政治意识、大局意识、核心意识、看齐意识
  summary: “四个意识”指政治意识、大局意识、核心意识、看齐意识。2016年1月中央政治局会议已把四者并提，同年十八届六中全会公报号召全党牢固树立，其中核心意识、看齐意识要求全党向以习近平为核心的党中央看齐。2017年写入党章，此后与“四个自信”“两个维护”连用，成为党内政治表态的固定句式。
  quote:
    text: 牢固树立政治意识、大局意识、核心意识、看齐意识，坚定不移维护党中央权威和党中央集中统一领导
    cite: i01-cpc-2016-10-27-6th-plenum-communique
  terms: [四个意识, 看齐意识]
  related: [core, two-safeguards, four-confidences]
  cites: [i01-cpc-2016-01-29-four-consciousness, i01-cpc-2016-10-27-6th-plenum-communique, e03-gov-2017-10-24-charter-resolution, i01-12371-2022-10-22-party-charter]

- id: four-confidences
  name: 四个自信
  en: Four Confidences
  kind: formula
  parent: xi-thought
  by: [hu-jintao, xi-jinping]
  first:
    date: 2012-11-08
    text: 十八大报告提出道路自信、理论自信、制度自信；习近平2016年7月1日在建党95周年大会上加入文化自信。
    cite: i01-wsyu-2012-11-08-18th-report
    quote: 全党要坚定这样的道路自信、理论自信、制度自信
  codified:
    - date: 2012-11-14
      where: 党章（十八大修正案），三个自信
      cite: i01-gov-2012-11-14-18th-charter-resolution
      quote: 坚定道路自信、理论自信、制度自信
    - date: 2017-10-24
      where: 党章（十九大修正案），加入文化自信
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 坚定道路自信、理论自信、制度自信、文化自信
  summary: “四个自信”指对中国特色社会主义道路、理论、制度、文化的自信。十八大报告提出前三项并同年写入党章；习近平2016年7月1日在建党95周年大会上加入文化自信，称其“是更基础、更广泛、更深厚的自信”。2017年“四个自信”写入党章，现行党章把坚定四个自信列为党员义务之一。
  quote:
    text: 文化自信，是更基础、更广泛、更深厚的自信
    cite: i01-cpc-2016-07-01-95th-anniversary
  terms: [四个自信, 道路自信]
  related: [four-consciousness, xi-thought]
