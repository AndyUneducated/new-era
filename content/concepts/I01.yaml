- id: principal-contradiction
  name: 社会主要矛盾的新表述
  en: New Principal Contradiction
  kind: component
  parent: new-era
  by: [xi-jinping]
  first:
    date: 2017-10-18
    text: 十九大报告宣布社会主要矛盾已经转化。
    cite: i01-gov-2017-10-18-19th-report
    quote: 中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾
  codified:
    - date: 2017-10-24
      where: 党章（十九大修正案）
      cite: e03-gov-2017-10-24-charter-resolution
      quote: 我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾
  summary: 十九大把社会主要矛盾的表述从“人民日益增长的物质文化需要同落后的社会生产之间的矛盾”改为“人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾”。十七大党章修正案和十八大报告都还强调旧表述“没有变”。新表述是“新时代”判断的依据，随即写入党章；现行党章和第三个历史决议沿用。
  quote:
    text: 在现阶段，我国社会的主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾
    cite: i01-12371-2022-10-22-party-charter
  terms: [不平衡不充分的发展之间的矛盾]
  related: [new-era, xi-thought]
  cites: [i01-gov-2017-10-18-19th-report, e03-gov-2017-10-24-charter-resolution, i01-gov-2007-10-21-17th-charter-resolution, i01-wsyu-2012-11-08-18th-report, i01-12371-2022-10-22-party-charter]

