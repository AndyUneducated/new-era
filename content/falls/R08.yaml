  trigger: { kind: chain, text: 中央纪委专题片称足坛专案以李铁为突破口，随后中国足协十多名高层和中层干部接受审查调查，其中包括陈戌源, cite: cs2-people-2024-01-10-sanbufu-ep4 }
  with:
    - { id: li-tie, name: 李铁, rel: briber, text: 卓尔俱乐部为推荐李铁任国家选拔队主教练向他行贿 200 万元, cite: cs2-xinhua-2024-01-09-li-tie-bribe }
