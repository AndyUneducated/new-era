  voices:
    - { voice: official, text: 中央纪委专题片称他当选足协主席前一晚，两名地方足协负责人各送上 30 万元“拜码头”, cite: cs2-people-2024-01-10-sanbufu-ep4 }
    - { voice: zh, text: BBC 中文称 2009 年足坛反腐案被捕最高层官员涉案金额约 120 万至 200 万元，陈戌源公开的涉案金额超过 8100 万元, cite: cs2-bbc-2024-02-13-football }
