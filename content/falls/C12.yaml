# ───── 江西 · 苏荣 ─────
yu-lifang:
  sys: other
  grade: none
  trigger: { kind: chain, text: 苏荣 2014 年 6 月 14 日被中央纪委双规后，正在长春的于丽芳被中央纪委带走调查, cite: c12-yicai-2016-07-14-yu-lifang }
  with:
    - { id: su-rong, name: 苏荣, rel: kin, text: 丈夫，全国政协原副主席，中央纪委称其妻直接站前台插手干部任用和工程项目, cite: b12-xinhua-2015-05-29-su-rong-warning }
    - { id: li-anze, name: 李安泽, rel: briber, text: 第一财经称李安泽送给于丽芳一幅傅抱石山水画，价值或达千万, cite: c12-yicai-2016-07-14-yu-lifang }
  politics:
    level: linked
    why: 苏荣案的家族腐败部分，随苏荣被查一同被带走
    cites: [c12-yicai-2016-07-14-yu-lifang, b12-xinhua-2015-05-29-su-rong-warning]
  voices:
