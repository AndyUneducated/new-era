  outcome: missing

zhou-jianhua:
  sys: local
  grade: bureau
  amount: { yuan: 10233114, text: 法院认定 99 次收受和索取人民币 1023.3114 万元、美元 1.2 万元、港币 15 万元、金条三根及价值 23.58 万元的财物, cite: c12-people-2014-12-24-zhou-jianhua }
  trigger: { kind: unknown, text: 江西省纪委只说其涉嫌严重违纪；他此前曾实名举报于丽芳和新余市委主要领导，举报半年后被双规, cite: b12-caijing-2014-07-02-yu-lifang }
  with:
    - { name: 姚敏建, rel: kin, text: 前妻，向中央巡视组公开实名举报苏荣妻子涉及新余土地交易和建设工程的贪腐问题, cite: b12-bbc-2014-06-25-su-rong }
  politics:
    level: linked
    why: 他是苏荣之妻的举报人，境外媒体转述财新称他因举报遭苏荣构陷；本人受贿罪名由法院认定
    cites: [b12-rfa-2014-06-15-su-rong, b12-caijing-2014-07-02-yu-lifang]
  voices:
    - { voice: west, text: 自由亚洲电台转述财新称，周建华因前妻举报苏荣妻子而遭到苏荣构陷，被江西省纪委双规, cite: b12-rfa-2014-06-15-su-rong }
