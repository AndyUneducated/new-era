# C12 (round 13): case records for the fallen among the CS4 and CS5 people carded in this batch

# ───── 南充拉票贿选案 ─────
liu-hongjian-nanchong:
  sys: local
  grade: bureau
  trigger: { kind: chain, text: 四川省委查清杨建华拉票贿选后进一步调查，查清时任市委书记刘宏建和市纪委、市委组织部相关负责人失职渎职, cite: cs5-people-2015-09-15-nanchong }
  with:
    - { id: yang-jianhua, name: 杨建华, rel: colleague, text: 时任仪陇县委书记，用公款 80 万元送钱拉票当选南充市委常委，获刑 20 年, cite: cs5-people-2015-09-15-nanchong }
    - { id: gao-xianhai, name: 高先海, rel: colleague, text: 时任南充市长、后任市人大常委会主任，因涉南充拉票贿选案辞去全国人大代表, cite: a01-npc-2015-11-04-report }
  politics:
    level: none
    why: 地方换届中的有组织拉票贿选案，官方定性为严重违反组织人事纪律，刘宏建本人以失职渎职获罪
    cites: [cs5-people-2015-09-15-nanchong, cs5-ccdi-2015-09-15-nanchong-meeting]
  voices:
    - { voice: west, text: BBC 中文指出新华社的报道没有说明杨建华与刘宏建在何时、何地被判刑，也没有说明案件是否已经终审, cite: cs5-bbc-2015-09-15-nanchong }
  outcome: sentenced

yang-jianhua:
  sys: local
  grade: bureau
  amount: { yuan: 800000, text: 2011 年南充市委换届前用公款 80 万元送钱拉票；全案涉案金额 1671.9 万元, cite: cs5-people-2015-09-15-nanchong }
  trigger: { kind: unknown, text: 通报只说 2014 年下半年以来四川省委对南充拉票贿选案进行了调查处理，未说明线索来源, cite: cs5-people-2015-09-15-nanchong }
  with:
    - { id: liu-hongjian-nanchong, name: 刘宏建, rel: colleague, text: 时任南充市委书记，被认定失职渎职，以玩忽职守罪获刑 3 年, cite: cs5-people-2015-09-15-nanchong }
  politics:
    level: none
    why: 为当选市委常委而拉票贿选，官方定性为组织人事领域的严重违纪违法，未见政治关联报道
    cites: [cs5-people-2015-09-15-nanchong]
  outcome: sentenced

gao-xianhai:
