# A01 fall cases: PLA / PAP generals who fell, were recalled or went missing, first public news 2012-11 to 2022-12
# (list: research/falls-list/A01.yaml). Person id → what the card's fall records do not say
# (src/data/schema.ts CaseRecordSchema, research/howto-content.md §10).
# Most cases are known only from the one-line 中国军网 batch notices of 2015 or an NPC qualification report: they name
# the post, the month of 立案 and 移送, and nothing about the charges, sums or verdict. Those records carry no notice
# quotes, no discipline list and trigger unknown; politics follows the editor's reading of what sources link them to.
# Status policy: an official text saying 涉嫌严重违纪/违法犯罪 keeps the card at purged / outcome probe; a removal with no
# official reason at all is status missing / outcome missing.

# ───────── 郭徐 and the 2012–2014 cases ─────────
xu-caihou:
  sys: army
  grade: state
  notice:
    date: 2014-06-30
    cite: b07-xinhua-2014-06-30-xu-expulsion
    quotes:
      - 利用职务便利，为他人晋升职务提供帮助，直接和通过家人收受贿赂
      - 严重违反党的纪律并涉嫌受贿犯罪，情节严重，影响恶劣
  trigger:
    kind: chain
    text: BBC 称谷俊山被捕后供出徐才厚的犯罪详情，间接将徐拉下马；官方通报未说明线索来源
    cite: c03-bbc-2015-08-10-gu-junshan
  with:
    - { id: gu-junshan, name: 谷俊山, rel: protege, text: 总后勤部原副部长，BBC 称其与徐才厚关系密切, cite: c03-bbc-2015-08-10-gu-junshan }
    - { id: yu-daqing, name: 于大清, rel: protege, text: 第二炮兵原副政委，新京报“政事儿”称他是徐才厚的老乡兼部下, cite: f09-hkcd-2016-07-12-guo-xu-tigers }
    - { id: guo-boxiong, name: 郭伯雄, rel: colleague, text: 同期的军委副主席，2015 年落马，官方此后一直把两人并称郭徐, cite: b07-xinhua-2016-10-11-guo-xu-poison }
  politics:
    level: core
    why: 编者分析：徐才厚是新中国建军以来与郭伯雄并列“职务最高”的落马军人，开除通报只写卖官受贿，但此后官方的政治定性层层加码：《解放军报》称郭徐“其流毒影响是全面的、深层次的”，陈希把他列为“政治野心家、阴谋家”，2021 年历史决议写入“坚决查处郭伯雄、徐才厚、房峰辉、张阳等严重违纪违法案件并彻底肃清其流毒影响”。他是十八大后军队清洗的起点和核心。
    cites: [b07-xinhua-2016-10-11-guo-xu-poison, b09-xinhua-2017-11-16-chen-xi-article, b04-gov-2021-11-16-resolution]
  voices:
    - { voice: official, text: 环球人物称，习近平 2014 年 10 月 31 日在全军政治工作会议上提出“特别要高度重视和严肃看待徐才厚案件，深刻反思教训，彻底肃清影响”，这是他第一次公开谈及徐案, cite: f09-hqrw-2015-01-26-army-tigers }
    - { voice: west, text: 美国之音称徐才厚在军中被称为“东北虎”，是江泽民的亲信；评论认为习近平借查处他加强手中军权, cite: b07-voa-2014-07-03-xu-hu }
  outcome: died

gu-junshan:
  sys: army
  grade: lieutenant
  trigger:
    kind: report
    text: 观察者网引罗援称，刘源和总后党委其他同志“以党委的名义举报谷俊山的贪腐问题”
    cite: b13-guancha-2015-12-24-liu-yuan
  with:
    - { id: xu-caihou, name: 徐才厚, rel: patron, text: BBC 称两人关系密切，谷俊山被捕后供出徐才厚的犯罪详情, cite: c03-bbc-2015-08-10-gu-junshan }
    - { id: lan-weijie, name: 兰伟杰, rel: protege, text: 总后基建营房部工程管理局原局长，维基百科称是谷俊山的老部下，2015 年被判无期徒刑, cite: a01-wiki-lan-weijie }
  politics:
    level: linked
    why: 编者分析：判决只列贪污、受贿、挪用公款、行贿、滥用职权五罪，没有政治定性；但新华社宣布田修思立案时把他与郭伯雄、徐才厚、杨金山并列为“一批严重违纪违法人员”，军委国防动员部的肃流毒文章更点名郭徐把“品行低劣的谷俊山火箭般擢升为总后勤部副部长”。官方把他的提拔算作郭徐流毒的一部分，本站列为与郭徐清洗相关。
    cites: [c03-xinhua-2016-07-09-tian-xiusi-probe, f01-thepaper-2017-guo-xu, c03-bbc-2015-08-10-gu-junshan]
  voices:
    - { voice: official, text: 环球人物称查处谷俊山时从其家中搜出 1000 多箱茅台酒和大量名表、首饰、字画，总后领导曾向胡锦涛汇报谷案两个多小时, cite: f09-hqrw-2015-01-26-army-tigers }
    - { voice: west, text: BBC 称谷俊山与徐才厚关系密切，被捕后供出徐的犯罪详情，间接将徐拉下马, cite: c03-bbc-2015-08-10-gu-junshan }
  outcome: sentenced

# ───────── 2015-01-13 to 2015-01-15: 蔡广辽 and the first batch ─────────
cai-guangliao:
  sys: law
  grade: major
  amount:
    yuan: 3289057
    text: 法院认定其利用职务便利为他人谋利，索取或收受财物共计人民币 328.90569 万元及港币 160 万元、美元 0.7 万元、澳元 1.4 万元
    cite: a01-wiki-cai-guangliao
  trigger: { kind: unknown, text: 官方未说明线索来源；维基百科据腾讯网称 2014 年 10 月由军委纪委带走调查, cite: a01-wiki-cai-guangliao }
  politics:
    level: none
    why: 编者分析：蔡广辽是公安现役、长期在广东省警卫系统任职的武警少将，案情只涉受贿；本站所见报道未把他与某位落马高官或派系清洗联系起来。
    cites: [a01-wiki-cai-guangliao]
  outcome: sentenced

