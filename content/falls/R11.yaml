# R11 (round 14): case records for the people whose cards have fall steps but who had no record
# (research/scripts/R11-list.ts). Most rest on the sources the cards already cite; new ones are r11-*.
# Dissidents, businessmen and Hong Kong people are recorded too: politics is the editor's reading of how far
# a case belongs to the struggle for power inside the party, so their political cases read as none there.

# ───── 政治局委员与中央高层 ─────
bo-xilai:
  sys: local
  grade: state
  notice:
    date: 2012-09-28
    cite: b07-xinhua-2012-09-28-bo-expulsion
    quotes:
      - 在王立军事件和薄谷开来故意杀人案件中滥用职权，犯有严重错误、负有重大责任
      - 利用职权为他人谋利，直接和通过家人收受他人巨额贿赂
      - 与多名女性发生或保持不正当性关系
      - 违反组织人事纪律，用人失察失误，造成严重后果
  amount: { yuan: 25440000, text: 法院认定受贿折合 2044 万余元、贪污 500 万元, cite: b07-xinhua-2013-09-22-bo-sentence }
  trigger: { kind: incident, text: 中央在调查王立军事件、复查薄谷开来涉嫌杀害尼尔·伍德案时，认定他负有错误和责任，并发现其他违纪线索, cite: b07-xinhua-2012-09-28-bo-expulsion }
  with:
    - { id: gu-kailai, name: 谷开来, rel: kin, text: 妻子，2011 年投毒杀害英国公民尼尔·伍德，法院认定薄熙来明知并认可她和儿子收受徐明财物, cite: b07-xinhua-2013-09-22-bo-sentence }
    - { id: wang-lijun, name: 王立军, rel: colleague, text: 重庆市原副市长兼公安局长，向他报告谷开来涉嫌杀人后被打耳光、免职，随即叛逃美国驻成都总领事馆, cite: b07-xinhua-2013-09-22-bo-sentence }
    - { name: 徐明, rel: briber, text: 大连实德集团董事长，法院认定薄熙来妻子、儿子收受其财物折合 1933 万余元, cite: b07-xinhua-2013-09-22-bo-sentence }
    - { name: 唐肖林, rel: briber, text: 大连国际发展有限公司总经理，法院认定薄熙来直接收受其钱款 110 万余元, cite: b07-xinhua-2013-09-22-bo-sentence }
  politics:
    level: core
    why: 十八大前夕被停职、开除的在任政治局委员；他在重庆的唱红打黑被视为另立路线，BBC 评论认为当局以贪腐罪审理是为避开政治路线之争，同情者则把判决看作政治审判
    cites: [b07-bbc-2013-09-22-bo-sentence-politics, b07-xinhua-2012-09-28-bo-expulsion]

chen-liangyu:
  sys: local
  grade: state
  notice:
    date: 2007-07-26
    cite: b07-xinhua-2007-07-26-chen-expulsion
    quotes:
      - 支持上海市劳动和社会保障局违规贷给不法企业主和有关公司巨额社保基金，危害社保基金安全
      - 以权谋私，帮助亲属在经营活动中获取巨额非法利益
      - 道德败坏，利用职权玩弄女性，搞权色交易
      - 包庇有严重违纪违法问题的身边工作人员
  amount: { yuan: 2390000, text: 法院认定 1988—2006 年索取或收受财物折合 239 万余元, cite: b07-xinhua-2008-04-11-chen-sentence }
  trigger: { kind: chain, text: 2006 年 7 月 5 日起中央纪委调查上海市劳动和社会保障局违规运营社保基金问题，调查中发现他涉嫌严重违纪, cite: b07-xinhua-2007-07-26-chen-expulsion }
  with:
    - { name: 陈良军, rel: kin, text: 弟弟，法院认定陈良宇为徇私情同意违规为其征地，陈良军违规获得 354 亩土地使用权后变相倒卖获利 1.18 亿元, cite: b07-xinhua-2008-04-11-chen-sentence }
    - { id: qin-yu, name: 秦裕, rel: colleague, text: 宝山区原区长，社保案中同批被开除党籍和公职, cite: e07-bbc-2007-03-02-pension-expelled }
  politics:
    level: core
    why: 在任政治局委员、上海市委书记被免职；官方否认与高层权力斗争有关，但美国之音引述的分析人士和 BBC 所引海外媒体都把此案看作胡锦涛对以陈良宇、黄菊为代表的上海帮动手
    cites: [b07-voa-2006-09-27-chen-qiu, b06-bbc-2014-09-23-shanghai-gang]

