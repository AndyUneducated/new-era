    - { name: 邵力平, rel: briber, text: 法院认定刘志军为邵力平、丁羽心等 11 人在职务晋升、承揽工程等方面提供帮助并收受财物, cite: c08-xinhua-2013-07-08-liu-zhijun-verdict }
  politics:
