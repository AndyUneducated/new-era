wang-shouye:
  sys: army
  grade: lieutenant
  amount: { yuan: 160000000, text: 军事法庭认定他 1997 年至 2001 年在总后基建营房部任职期间贪污、挪用公款 1.6 亿元, cite: c11-ifeng-2006-12-22-wang-shouye }
  sentence: { date: 2006-12-14, term: life, cite: c11-ifeng-2006-12-22-wang-shouye }
  trigger:
    kind: report
    text: 新华社英文电讯称，一名未婚女性向当局告发他，承认与他有长期的不正常关系
    cite: c11-bbc-2006-06-29-wang-shouye
  with:
    - { id: gu-junshan, name: 谷俊山, rel: colleague, text: 后任总后基建营房部部长，2012 年落马；财新称二人都曾任该部部长, cite: b13-caixin-2014-01-14-gu-tiger }
  politics:
    level: none
    why: 编者分析：此案在胡锦涛时期查处，官方定性为经济犯罪和“道德败坏”，未见派系或靠山清洗的说法；后来的报道主要把它当作总后基建营房部“事故多发地”的前例，与谷俊山案并提。
    cites: [c11-bbc-2006-06-29-wang-shouye, f09-hqrw-2015-01-26-army-tigers]
  voices:
    - { voice: west, text: 当局没有具体说明王守业的犯罪内容；新华社中文稿只有两句话，英文电讯则报道他被情妇揭发, cite: c11-bbc-2006-06-29-wang-shouye }
    - { voice: zh, text: 《环球人物》称总后基建营房部是“事故多发地”，王守业在情妇出面举报后贪腐案败露, cite: f09-hqrw-2015-01-26-army-tigers }
    - { voice: wiki, text: 维基百科把一审判死缓的日期记为 2006 年 4 月 10 日，早于同年 6 月官方公布其免职；凤凰网转述的大公报只说一审判处死缓，财新则说他 2006 年被军事法庭判处死缓, cite: c11-wiki-wang-shouye }
  outcome: sentenced

