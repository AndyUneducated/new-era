      text: 《零容忍》称他“先是靠攀附时任辽宁省公安厅厅长李文喜”，被提拔为辽宁省公安厅副厅长、大连市公安局局长。
      cite: b12-xinhua-2022-01-15-zero-tolerance-ep1
    - name: 娄河
      rel: business
      text: 北镇涉黑组织头目，《零容忍》称二十多年里一路仰仗王立科庇护，累计送给王立科财物 8000 多万元。
      cite: b12-xinhua-2022-01-15-zero-tolerance-ep1
  politics:
    level: linked
    why: 通报称他“参与在党内搞团团伙伙”，《零容忍》把他列为孙力军团伙成员，判决认定他向孙力军行贿以谋求职务晋升。
    cites: [c03-ccdi-2021-09-22-wang-like-expel, b12-xinhua-2022-01-15-zero-tolerance-ep1, c03-xinhua-2022-09-22-wang-like-verdict]

