yang-jing:
  sys: central
  grade: state
  notice:
    date: 2018-02-24
    cite: c02-gov-2018-02-24-yang-jing
    quotes:
      - 长期与不法企业主、不法社会人员不当交往，为对方利用其职务影响实施违法行为、谋取巨额私利提供便利条件，其亲属收受对方财物
      - 在审查中，杨晶同志能够认错、悔错
  discipline: [political, integrity]
  trigger:
    kind: unknown
    text: 官方通报未说明线索来源
    cite: c02-gov-2018-02-24-yang-jing
  politics:
    level: none
    why: 通报只列与不法企业主交往、亲属收受财物，未移送司法，也没有“团团伙伙”一类政治定性；本站所见可靠来源未把他与某位落马高官或派系清洗联系起来。
    cites: [c02-gov-2018-02-24-yang-jing]

zhao-zhengyong:
  sys: local
  grade: minister
  notice:
    date: 2020-01-04
    cite: c03-ccdi-2020-01-04-zhao-zhengyong-expel
    quotes:
      - 拒不落实“两个维护”的政治责任，对党中央决策部署思想上不重视、政治上不负责、工作上不认真，阳奉阴违、自行其是、敷衍塞责、应付了事
      - 是典型的“两面人”、“两面派”
      - 培植个人势力，搞团团伙伙，纵容亲属肆意插手干部选拔任用工作
      - 政治问题和经济问题交织的腐败典型，其行为严重污染破坏了陕西的政治生态和发展环境
  discipline: [political, organization, integrity, life, eight]
  amount:
    yuan: 717000000
    text: 2003 年至 2018 年单独或伙同其妻等人非法收受财物共计折合人民币 7.17 亿余元，其中 2.9 亿余元尚未实际取得，属于犯罪未遂
    cite: c03-xinhua-2020-07-31-zhao-zhengyong-verdict
  trigger:
    kind: unknown
    text: 官方通报未说明线索来源
    cite: c03-ccdi-2020-01-04-zhao-zhengyong-expel
  retired: 2016-03
  politics:
    level: none
    why: 通报虽有“对党中央决策部署……阳奉阴违”“培植个人势力，搞团团伙伙”等政治定性，但所指是他在陕西培植的个人势力，没有点名他依附某位落马高官或某个派系；本站所见可靠来源也未作这种联系。
    cites: [c03-ccdi-2020-01-04-zhao-zhengyong-expel]

qin-guangrong:
