sun-lijun:
  sys: law
  grade: vice
  notice:
    date: 2021-09-30
    cite: c03-ccdi-2021-09-30-sun-lijun-expel
    quotes:
      - 政治野心极度膨胀，政治品质极为恶劣
      - 妄议党中央大政方针，制造散布政治谣言
      - 在党内大搞团团伙伙、拉帮结派、培植个人势力，形成利益集团，成伙作势控制要害部门，严重破坏党的团结统一，严重危害政治安全
      - 在抗击新冠肺炎疫情一线擅离职守，私藏私放大量涉密材料，长期搞迷信活动；使用公安侦查手段对抗组织审查
      - 大肆卖官鬻爵、安插亲信、布局人事，严重破坏公安政法系统政治生态
  discipline: [political, organization, integrity, eight]
  amount:
    yuan: 646000000
    text: 2001 年至 2020 年 4 月直接或通过他人非法收受财物，共计折合人民币 6.46 亿余元
    cite: c03-xinhua-2022-09-23-sun-lijun-verdict
  trigger:
    kind: unknown
    text: 官方通报未说明线索来源；2020 年 4 月他在武汉督导疫情期间被宣布审查调查。
    cite: c03-ccdi-2020-04-19-sun-lijun-probe
  with:
    - id: wang-like
      name: 王立科
      rel: briber
      text: 专题片《零容忍》称，王立科 2011 年起多次给他送银行卡、美元和公司股份；法院认定王立科向孙力军等人行贿共计 9731 万余元。
      cite: c03-xinhua-2022-09-22-wang-like-verdict
    - id: gong-daoan
      name: 龚道安
      rel: protege
      text: 《零容忍》称孙力军主动拉拢咸宁市公安局局长龚道安，“通过积极推荐运作”使其进入公安部技侦局，后任上海市副市长、公安局局长。
      cite: b12-xinhua-2022-01-15-zero-tolerance-ep1
    - id: deng-huilin
      name: 邓恢林
      rel: protege
      text: 经龚道安推荐，孙力军帮助宜昌市公安局局长邓恢林先后提任中央政法委办公室主任、重庆市公安局局长、重庆市副市长。
      cite: b12-xinhua-2022-01-15-zero-tolerance-ep1
    - name: 刘新云
      rel: protege
      text: 2014 年孙力军物色到济南市公安局局长刘新云，刘新云后任公安部网络安全保卫局局长，私下向他违规提供大量网络舆情。
      cite: b12-xinhua-2022-01-15-zero-tolerance-ep1
  politics:
    level: core
    why: 开除通报用“政治野心极度膨胀”“成伙作势控制要害部门”“严重危害政治安全”定性，《零容忍》首集称“孙力军政治团伙案”，与龚道安、邓恢林、王立科、刘新云、傅政华成串查处，是十九大后最典型的政治团伙案。
    cites: [c03-ccdi-2021-09-30-sun-lijun-expel, b12-xinhua-2022-01-15-zero-tolerance-ep1]

