# A02 fall cases: PLA / PAP generals and defence-industry leaders who fell, were recalled or went missing, first
# public news 2023-01 or later (list: research/falls-list/A02.yaml). Person id → what the card's fall records do not
# say (src/data/schema.ts CaseRecordSchema, research/howto-content.md §10).
# Status policy: an official text saying 涉嫌严重违纪违法 (a notice, or the NPC gazette giving the reason for a recall)
# keeps a card at purged / outcome probe; a recall, a removal from the CPPCC or the academies, or a long absence with no
# official reason at all is status missing / outcome missing.

# ───────── 中央军委 ─────────
li-shangfu:
  sys: army
  grade: state
  notice:
    date: 2024-06-27
    cite: b08-gov-2024-06-27-li-shangfu-expelled
    quotes:
      - 不履行全面从严治党政治责任，对抗组织审查
      - 违规为本人和他人谋取人事利益
      - 严重污染军队装备领域政治生态和行业领域风气
  discipline: [political, organization]
  trigger:
    kind: chain
    text: 通报称立案依据是“军委纪委监委查办案件中发现的问题线索”
    cite: b08-gov-2024-06-27-li-shangfu-expelled
  with:
    - { id: wei-fenghe, name: 魏凤和, rel: colleague, text: 前任国防部长，2026 年 5 月 7 日与李尚福同日被军事法院判处死缓并终身监禁, cite: b08-gov-2026-05-07-wei-li-sentenced }
    - { id: zhang-yulin, name: 张育林, rel: colleague, text: 李尚福任装备发展部部长时的副部长，2023 年 12 月被罢免全国人大代表, cite: c03-xinhua-2023-12-29-npc-notice-2 }
    - { id: rao-wenmin, name: 饶文敏, rel: colleague, text: 装备发展部原副部长，与张育林同日被罢免全国人大代表, cite: c03-xinhua-2023-12-29-npc-notice-2 }
  politics:
    level: linked
    why: 编者分析：通报的定性集中在受贿、行贿和“严重污染军队装备领域政治生态和行业领域风气”，没有团伙一类的政治用语；但他是在主管装备采购五年之后、出任国防部长仅半年就被立案，同期装备发展部多名高级官员也被调查，本站把它看作装备采购系统清洗的一环，而不是单纯的个人贪腐。
    cites: [b08-gov-2024-06-27-li-shangfu-expelled, b08-rfi-2023-09-15-li-probe]
  voices:
    - { voice: west, text: 法广转述路透社，对李尚福的调查与军事装备采购有关，他 2017—2022 年领导的装备发展部另有八名高级官员也在接受调查, cite: b08-rfi-2023-09-15-li-probe }
  outcome: sentenced

