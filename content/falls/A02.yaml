    - { id: he-weidong, name: 何卫东, rel: colleague, text: 军委副主席，同批被开除党籍、军籍, cite: b08-mod-2025-10-17-nine-generals }
  politics:
    level: core
    why: 编者分析：苗华长期在驻福建部队任政工干部，2017 年起任军委政治工作部主任、进入中央军委，掌管全军政治工作和干部；他先被停职检查，再与军委副主席何卫东等九人同批开除。主管将领任用的军委委员落马，意味着此前近十年的将领提拔链条整体受到审视，本站列为军委清洗的核心案。
    cites: [b08-mod-2024-11-28-miao-suspended, b08-mod-2025-10-17-nine-generals, f02-dw-2025-10-20-nine-generals]
