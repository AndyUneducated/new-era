he-weidong:
  sys: army
  grade: state
  notice:
    date: 2025-10-17
    cite: b08-mod-2025-10-17-nine-generals
    quotes:
      - 严重违反党的纪律，涉嫌严重职务犯罪，数额特别巨大，性质极为严重，影响极其恶劣
  trigger:
    kind: unknown
    text: 官方未说明线索来源；他 2025 年 3 月 11 日出席全国人大闭幕会后不再公开露面
    cite: e06-rfi-2025-03-27-he-weidong
  with:
    - { id: miao-hua, name: 苗华, rel: colleague, text: 军委委员、政治工作部主任，同批被开除党籍、军籍, cite: b08-mod-2025-10-17-nine-generals }
    - { id: lin-xiangyang, name: 林向阳, rel: colleague, text: 东部战区原司令员，同批被开除；同批九人多有原南京军区或东部战区履历, cite: c03-zaobao-2025-10-18-nine-generals }
  politics:
    level: core
    why: 编者分析：何卫东是军中“二号人物”，长期在原南京军区第 31 集团军任职，被认为与习近平关系密切。官方通报只说他“涉嫌严重职务犯罪，数额特别巨大”，没有政治定性；但同批开除的九人多出自原南京军区和东部战区，又与主管干部的苗华同案处理，本站列为军委清洗的核心案。
    cites: [b08-mod-2025-10-17-nine-generals, f02-dw-2025-10-20-nine-generals, c03-zaobao-2025-10-18-nine-generals]
  voices:
    - { voice: west, text: 德国之声称何卫东被认为与习近平关系密切，自 2025 年 3 月两会后未在公开场合露面, cite: f02-dw-2025-10-20-nine-generals }
    - { voice: west, text: 法广转述《华盛顿时报》，美国情报机构认为何卫东是解放军高层政治清洗的最新受害者；国防部发言人吴谦当时回应“没有这方面的消息，不了解这方面的情况”, cite: e06-rfi-2025-03-27-he-weidong }
    - { voice: zh, text: 香港电台报道，2026 年第一号人大常委会公报写明何卫东因涉嫌严重违纪违法，2025 年 11 月被中央军委办公厅军人代表大会罢免全国人大代表, cite: a02-rthk-2026-02-26-he-weidong }
  outcome: expelled
  fall:
