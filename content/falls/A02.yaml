    - { voice: west, text: 法广指出，2025 年 5 月公布的人大公报写明苗华因涉嫌严重违纪违法于 3 月 14 日被罢免全国人大代表，这是官方首度明确提到他涉嫌违法, cite: b08-rfi-2025-06-27-miao }
  outcome: expelled
  fall:
