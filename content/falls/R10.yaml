# ───── 中管企业 ─────
he-wenzhong:
  sys: soe
  grade: exec
  notice:
    date: 2024-10-11
    cite: r10-xinhua-2024-10-11-he-wenzhong-expel
    quotes:
      - 对抗组织审查
      - 在组织谈话时不如实说明问题，利用职权违规提拔任用干部
      - 廉洁底线失守，搞钱色交易
      - 靠军工吃军工”，大搞权钱交易
  discipline: [political, organization, integrity, life, eight]
  amount: { yuan: 289000000, text: 法院认定 2006—2023 年在第十一研究所和集团任职期间受贿及收受回扣共计 2.89 亿余元, cite: r10-court-2025-07-21-he-wenzhong-verdict }
  trigger: { kind: unknown, text: 官方通报未说明线索来源, cite: r10-xinhua-2024-10-11-he-wenzhong-expel }
  politics:
    level: none
    why: 通报与判决只涉及军工产品供应、货款方面的受贿，未见政治关联报道
    cites: [r10-xinhua-2024-10-11-he-wenzhong-expel, r10-court-2025-07-21-he-wenzhong-verdict]
  outcome: sentenced

