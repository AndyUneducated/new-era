# R03: fall cases for the centrally managed cadres (non-military) first named by the CCDI in 2016–2017
# (research/falls-list/R03.yaml). Notices quoted from the full CCDI texts; sums from the court verdicts.
# The 2016-01-29 round-up and the 2017 accountability notices name no disciplines or only 问责; there the
# discipline list follows what the text says and nothing more.

# ---- state and minister level ----
sun-zhengcai:
  sys: local
  grade: state
  notice:
    date: 2017-09-29
    cite: b07-xinhua-2017-09-29-sun-expulsion
    quotes:
      - 动摇理想信念，背弃党的宗旨，丧失政治立场
      - 选人用人唯亲唯利，泄露组织秘密
      - 本人或伙同特定关系人收受巨额财物
      - 官僚主义严重，庸懒无为
      - 腐化堕落，搞权色交易
  discipline: [political, eight, mass, organization, integrity, work, life]
  amount:
    yuan: 170000000
    text: 2002 年至 2017 年单独或者伙同特定关系人非法收受他人财物，共计折合人民币 1.7 亿余元；法院称绝大部分受贿财物系特定关系人直接收受
    cite: b07-xinhua-2018-05-08-sun-sentence
  trigger: { kind: inspect, text: 开除通报称，中央是根据中央巡视组巡视和中央纪委、政法机关查办案件发现及群众举报反映的线索和证据，将他调离重庆市委书记岗位并进行纪律审查, cite: b07-xinhua-2017-09-29-sun-expulsion }
  with:
    - { id: he-ting, name: 何挺, rel: colleague, text: 重庆市原副市长、公安局长；《联合早报》称两人关系要好，何挺 2017 年 4 月传出被查, cite: b07-zaobao-2017-07-16-sun }
  politics:
    level: core
    why: 中央纪委向十九大所作的工作报告把孙政才与周永康、令计划并列，称其“政治野心膨胀，搞阴谋活动”；中组部部长陈希撰文把他与周永康、薄熙来、郭伯雄、徐才厚、令计划并称“政治野心家、阴谋家”。他落马前，中央巡视组曾指重庆清除薄、王思想遗毒不彻底。
    cites: [b04-gov-2017-10-29-ccdi-report, b09-xinhua-2017-11-16-chen-xi-article, b07-ccdi-2017-02-13-chongqing-inspection]
  voices:
    - { voice: doc, text: 周永康、孙政才、令计划等人严重违反党的政治纪律和政治规矩，政治野心膨胀，搞阴谋活动。, quote: true, cite: b04-gov-2017-10-29-ccdi-report }
    - { voice: west, text: 孙政才是个牺牲品，这是向全党发出的信息, quote: true, cite: b07-nyt-2017-07-24-sun-fall }
    - { voice: zh, text: 让部分舆论进一步推断，与他关系要好的孙政才接下来“入常”机会进一步减低, quote: true, cite: b07-zaobao-2017-07-16-sun }

wang-min:
  sys: local
  grade: minister
  notice:
    date: 2016-08-10
    cite: c03-ccdi-2016-08-10-wang-min-expel
    quotes:
      - 对辽宁省有关选举发生拉票贿选问题负有主要领导责任和直接责任
      - 公开妄议并违反中央八项规定精神，公款大吃大喝、顶风违纪
      - 其亲属从利益输送中获得经济利益
      - 且在党的十八大后仍不收敛、不收手，造成恶劣政治影响
  discipline: [political, eight, organization, integrity]
  amount:
    yuan: 146000000
    text: 2004 年至 2016 年直接或者通过他人收受财物共计折合人民币 1.46 亿余元；另侵吞公款 100 万元，并因辽宁换届选举中的拉票贿选未被及时制止，以玩忽职守罪获刑
    cite: c03-people-2017-08-05-wang-min-verdict
  trigger: { kind: unknown, text: 官方通报未说明线索来源, cite: c03-ccdi-2016-03-04-wang-min-probe }
  politics:
    level: none
    why: 开除通报的政治问题是对辽宁拉票贿选负主要领导责任、公开妄议八项规定，未提结伙或靠山；本站所见报道未把他与某位落马高官或派系清洗联系起来。
    cites: [c03-ccdi-2016-08-10-wang-min-expel, c03-people-2017-08-05-wang-min-verdict]

