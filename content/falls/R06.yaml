ma-xingrui:
  sys: central
  grade: state
  notice:
    date: 2026-07-14
    cite: b08-xinhua-2026-07-14-ma-expelled
    quotes:
      - 马兴瑞丧失理想信念和政治立场，背弃党的宗旨和初心使命，严重违反政治纪律和政治规矩
      - 对身边工作人员严重违纪违法和涉嫌犯罪问题纵容失察失管
      - 搞权色、钱色交易，纵容放任亲属利用其职务影响谋取巨额利益，大搞家族腐败
      - 严重违背党中央对高级干部提出的政治要求
  discipline: [political, organization, integrity]
  trigger:
    kind: unknown
    text: 官方通报未说明线索来源
    cite: b08-xinhua-2026-04-03-ma-probe
  politics:
    level: core
    why: 在任中央政治局委员落马，开除通报称其“严重违背党中央对高级干部提出的政治要求”；BBC 指出二十大周期内已有三名在任政治局委员落马，并引学者说“反腐容易成为政治工具多过于廉政工具”。
    cites: [b08-xinhua-2026-07-14-ma-expelled, b08-bbc-2026-07-14-ma]
  voices:
    - voice: zh
      quote: true
      text: 中共中央政治局委員馬興瑞的落馬，意味著中共總書記習近平對軍工系統的反腐行動，已經延伸到中國國防工業的最高層級人物。
      cite: f02-cna-2026-07-14-ma-xingrui

