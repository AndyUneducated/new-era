# --- Li Yuanchao and Jiangsu ---
- a: li-yuanchao
  b: yang-weize
  kind: patron
  text: 高新称，李源潮主政江苏后是杨卫泽仕途的第一推手：2004年安排他任无锡市委书记，2006年提名他升任省委常委，后又提名他任南京市委书记。
  from: 2004
  to: 2015
  cite: f05-rfa-2015-01-08-yang-weize
  quote: '李源潮绝对是第一推手……两年后，杨卫泽被李源潮安排为无锡市委书记'
- a: li-yuanchao
  b: ji-jianye
  kind: patron
  text: 高新认为，季建业的升迁及出事都与李源潮这位江苏老书记有人事关连。
  cite: f05-rfa-2015-01-08-yang-weize
  quote: '已经迁入秦城监狱的前南京市长季建业和罗志军的迁升及发生问题都和李源潮这位江苏老书记有人事关连'
- a: li-yuanchao
  b: luo-zhijun
  kind: patron
  text: 高新认为，罗志军的升迁与李源潮这位江苏老书记有人事关连；李源潮任江苏省委书记时，罗志军任省委常委、南京市委书记。
  from: 2003
  cite: f05-rfa-2015-01-08-yang-weize
  quote: '已经迁入秦城监狱的前南京市长季建业和罗志军的迁升及发生问题都和李源潮这位江苏老书记有人事关连'
- a: li-yuanchao
  b: zhao-shaolin
  kind: colleague
  text: 李源潮任江苏省委书记期间，赵少麟任省委常委、秘书长，《南华早报》称他是李源潮的得力助手。
  from: 2002-12
  to: 2006-11
  cite: f05-scmp-2015-08-14-zhao-shaolin
  quote: 'Zhao was a top aide to Li as well as former vice-premier Hui Liangyu when they headed the party in Jiangsu.'
- a: hui-liangyu
  b: zhao-shaolin
  kind: colleague
  text: 回良玉任江苏省委书记期间（2000–2002），赵少麟任省委常委、秘书长，《南华早报》称他是回良玉的得力助手。
  from: 2000
  to: 2002
  cite: f05-scmp-2015-08-14-zhao-shaolin
  quote: 'Zhao was a top aide to Li as well as former vice-premier Hui Liangyu when they headed the party in Jiangsu.'
- a: hui-liangyu
  b: li-yuanchao
  kind: colleague
  text: 2000年初回良玉调任江苏省委书记，李源潮任省委副书记；2002年底李源潮接任书记。
  from: 2000
  to: 2002
  cite: f05-rfa-2015-01-08-yang-weize
  quote: '日后成为中央领导人的两任江苏省委书记回良玉和李源潮都是2000年初调赴江苏，一个任书记，一个任副书记'
- a: ling-jihua
  b: li-yuanchao
  kind: colleague
  text: 法广称李源潮处境危险的深层原因是他与令计划的密切关系；詹姆斯敦基金会称两人的妻子据说是亲密的生意伙伴。
  cite: f05-rfi-2015-01-20-jiangsu-gang
  quote: '更深层的原因在于他与现在被称为“新四人帮”成员之一的令计划的密切关系'

