# F05 (round 3): relations around tuanpai, populist, conservatives and jiangsu-gang.

# --- Hu Jintao and the CYL secretariat ---
- a: hu-jintao
  b: li-keqiang
  kind: patron
  text: 李克强1982年起在胡锦涛主持的团中央书记处任职，布鲁金斯学会称他是胡锦涛的门生，十八大后接替胡锦涛领导民粹联盟。
  from: 1982
  cite: f01-brookings-2013-02-10-princelings
  quote: 'is now headed by his protégé Li Keqiang'
- a: hu-jintao
  b: li-yuanchao
  kind: patron
  text: 1980年代初李源潮任团中央书记处书记，高新称他与刘延东是胡锦涛在团中央书记处的左右臂膀。
  from: 1983
  cite: f05-rfa-2023-01-13-wang-zhaoguo-xi
  quote: '在胡锦涛主政团中央时，即已经在当时的那届团中央书记处里成为胡锦涛的左右臂膀'
- a: hu-jintao
  b: liu-yandong
  kind: patron
  text: 刘延东1982年起任团中央书记处书记，高新称她与李源潮是胡锦涛在团中央书记处的左右臂膀。
  from: 1982
  cite: f05-rfa-2023-01-13-wang-zhaoguo-xi
  quote: '在胡锦涛主政团中央时，即已经在当时的那届团中央书记处里成为胡锦涛的左右臂膀'
- a: hu-jintao
  b: wang-yang
  kind: patron
  text: 汪洋1980年代初任共青团安徽省委副书记，布鲁金斯学会称他与时任团中央负责人胡锦涛由此建立了牢固的恩庇关系。
  from: 1982
  cite: f01-brookings-2017-new-politburo
  quote: 'with whom he developed strong patron-client ties in the early 1980s, when Hu was head of the CCYL'
- a: hu-jintao
  b: liu-qibao
  kind: patron
  text: 刘奇葆在团中央工作八年，《太阳报》称他是胡锦涛的十八罗汉之一，胡锦涛掌权后把他外放广西、四川。
  from: 1982
  cite: c02-sun-2012-11-28-liu-qibao
  quote: '被稱為胡錦濤的「十八羅漢」之一……胡錦濤掌權後，把他們外放地方，就順風順水，青雲直上。'
- a: hu-jintao
  b: zhang-baoshun
  kind: patron
  text: 张宝顺1982年起任团中央书记处候补书记，蔡文轩把他列为胡锦涛团中央时期的团派干部，并称这些干部因与胡共事建立了人脉。
  from: 1982
  cite: f05-sef-2012-10-tsai-fifth-gen
  quote: '如现任安徽省委书记张宝顺……这些干部由于曾和胡锦涛共事，因此建立了人脉关系'
- a: hu-jintao
  b: yuan-chunqing
  kind: patron
  text: 蔡文轩把袁纯清列为胡锦涛团中央时期的团派干部，认为他们因与胡共事建立了人脉。
  cite: f05-sef-2012-10-tsai-fifth-gen
  quote: '山西省委书记袁纯清……这些干部由于曾和胡锦涛共事，因此建立了人脉关系'
- a: hu-jintao
  b: shen-yueyue
  kind: patron
  text: 蔡文轩把时任中组部常务副部长沈跃跃列为团派，认为这些干部的升迁普遍被认为得自胡锦涛庇荫。
  cite: f05-sef-2012-10-tsai-fifth-gen
  quote: '与中组部常务副部长沈跃跃等人……外界普遍认为是得自于胡锦涛的庇荫'
- a: hu-jintao
  b: ling-jihua
  kind: secretary
  text: 令计划在团中央和中共中央长期担任胡锦涛的秘书，2007年至2012年任中办主任。
  cite: f05-sef-2012-10-tsai-fifth-gen
  quote: '他在团中央与党中央，长期担任胡锦涛的秘书'
- a: hu-jintao
  b: chen-shiju
  kind: secretary
  text: 1985年胡锦涛从团中央调任贵州省委书记后，陈世炬任其秘书，此后随胡到西藏和中央，2002年起任胡锦涛办公室主任。
  from: 1985
  to: 2013
  cite: f05-rfi-2015-01-08-chen-shiju
  quote: '成为当时刚从团中央调任贵州省委书记的胡锦涛的秘书。随后，胡锦涛调任西藏和中央期间，陈世炬一直紧随身旁'
- a: hu-jintao
  b: hu-chunhua
  kind: patron
  text: 詹姆斯敦基金会称，胡春华2012年进入政治局是胡锦涛、温家宝领导的上届常委会的安排。
  from: 2012
  cite: f05-jamestown-2016-cyl-eclipse
  quote: 'were put into the Politburo by the out-going PBSC led by former president Hu Jintao and former premier Wen Jiabao'
- a: hu-jintao
  b: sun-zhengcai
  kind: patron
  text: 詹姆斯敦基金会称，孙政才与胡春华2012年进入政治局是胡锦涛、温家宝领导的上届常委会的安排。
  from: 2012
  cite: f05-jamestown-2016-cyl-eclipse
  quote: 'Hu and Chongqing Party Secretary Sun Zhengcai, both born in 1963, were put into the Politburo by the out-going PBSC led by former president Hu Jintao and former premier Wen Jiabao.'

# --- Wang Zhaoguo ---
- a: wang-zhaoguo
  b: hu-jintao
  kind: colleague
  text: 1982年12月王兆国任团中央第一书记，胡锦涛任书记处书记，1984年12月胡锦涛接任第一书记。
  from: 1982-12
  to: 1984-12
  cite: f05-people-2013-06-21-cyl-secretaries
  quote: '1982年12月，共青团第十一次全国代表大会选举王兆国为书记处第一书记；胡锦涛（1984年12月接替王兆国出任第一书记）'
- a: wang-zhaoguo
  b: wen-jiabao
  kind: colleague
  text: 1984年王兆国任中办主任时，温家宝任中办副主任。
  from: 1984
  cite: f05-rfa-2023-01-13-wang-zhaoguo-xi
  quote: '1984年，任中共中央办公厅主任时，温家宝是副主任，也是王的副手。'
- a: wang-zhaoguo
  b: xi-jinping
  kind: patron
  text: 高新称，王兆国1987年后在福建任省长期间在省委内部竭力推荐习近平。
  from: 1988
  cite: f05-rfa-2023-01-13-wang-zhaoguo-xi
  quote: '正是这个“团派”出身的王兆国，在福建省任职时即在省委内部竭力推荐习近平担当重任'
- a: deng-xiaoping
  b: wang-zhaoguo
  kind: patron
  text: 高新转述的一种流传说法：1980年邓小平视察二汽时发现王兆国并向中央推荐，王兆国此后官运亨通。
  from: 1980
  cite: f05-rfa-2023-01-13-wang-zhaoguo-xi
  quote: '王兆国是邓小平在1980年发现的人才'
- a: hu-yaobang
  b: wang-zhaoguo
  kind: patron
  text: 高新转述，胡耀邦在湖北视察时专门召见王兆国，安排他到中央党校受训。
  from: 1980
  cite: f05-rfa-2023-01-13-wang-zhaoguo-xi
  quote: '胡耀邦去湖北视察时，也专门召见王兆国，并安排他到中央党校受训'

