# CS2 — case articles: political cliques and systemic graft
- id: sun-lijun-clique
  title: 孙力军政治团伙案
  kind: case
  years: '2001–2023'
  people: [sun-lijun, fu-zhenghua, wang-like, gong-daoan, deng-huilin, liu-xinyun, liu-yanping, lou-he]
  summary: '孙力军政治团伙案是十八大后少见的、被官方直接冠以“政治团伙”之名的案件：公安部原副部长孙力军靠举荐、运作和金钱往来，把傅政华、王立科、龚道安、邓恢林、刘新云、刘彦平等政法要员结成“小圈子”。2020年4月孙力军落马后，七人在2021年至2022年间相继被“双开”；2022年9月和2023年1月，四人被判死缓并终身监禁，其余三人分别被判无期徒刑和十余年有期徒刑。中央纪委称此案是“十九大以来我们查处的最严重的案件之一”。'
  sections:
    - h: 起因：从卫生系统到公安部的权钱循环
      from: '2001'
      to: 2018-03
      text: '孙力军1969年生于山东青岛，早年在上海卫生系统工作。据中央纪委专题片《零容忍》，他大学毕业后曾跟温州商人倒卖钢材，2001年就和一个医药老板商议，“由孙力军负责介绍政府、医院关系，老板负责出资和公司运营，约定利益三七分成”。专题片称他2008年调到北京工作，此后“利用职权和影响力为多名不法商人做生意提供帮助”；《联合早报》的履历则写作2010年由上海市外办副主任调任公安部办公厅副主任，此后历任国内安全保卫局局长、中央610办公室副主任，2018年3月升任公安部副部长，是部里最年轻的副部长。专题片说他给自己制订了一个“十五年规划”，“争取要五年上一个台阶”。'
      cites: [b12-xinhua-2022-01-15-zero-tolerance-ep1, b12-zaobao-2020-04-21-sun-lijun, c03-ccdi-2020-04-19-sun-lijun-probe]
    - h: 涉案人和关系：靠举荐、运作结成的圈子
      from: '2008'
      to: '2020'
      text: '按专题片的描述，这个圈子以孙力军为中心，向下吸纳地方政法“一把手”。王立科2008年下半年结识孙力军，2011年起多次进京，每次送30万美元，孙力军称之为“小海鲜”，累计折合9000多万元；孙力军说，王立科从江苏副省长、公安厅长一路做到省委常委、政法委书记，“这一路我都提供了帮助。我把他当作自己人。”对龚道安则反过来花钱收买：2010年孙力军在全国地市公安局长培训班上看中时任咸宁市公安局局长龚道安，“通过积极推荐运作”使其先后出任公安部技侦局副局长、局长和上海市公安局局长、副市长；龚道安又向孙力军推荐宜昌市公安局局长邓恢林，邓随后出任中央政法委办公室主任、重庆市公安局局长和副市长。2014年济南市公安局局长刘新云主动登门，同年12月调任公安部网安局局长。傅政华2008年在北京市公安局任职时结识孙力军，自称“对他有唯命是从的做法”，2010年至2017年经孙力军运作先后出任北京市公安局局长、公安部副部长。专题片说，刘新云、龚道安向孙力军违规提供大量网络舆情和案件信息，“绝大部分孙力军无权知悉”。刘彦平当过公安部警卫局局长、副部长，后任中央纪委驻国家安全部纪检监察组组长，通报称他“参加孙力军政治团伙，大搞政治利益交换”。'
      cites: [b12-xinhua-2022-01-15-zero-tolerance-ep1, b12-chinanews-2023-01-07-bugle-ep1, c03-xinhua-2023-01-10-liu-yanping-verdict, c03-people-2022-09-01-liu-yanping-expel]
    - h: 经过：从武汉督导到连环落马
      from: 2020-02
      to: 2022-09
      text: '2020年2月，孙力军以中央指导组成员身份赴湖北督导疫情防控，3月5日最后一次公开露面；4月19日，中央纪委国家监委宣布他接受审查调查。《联合早报》注意到，公安部党委会把孙力军与周永康、孟宏伟并列，要一并肃清“流毒影响”。专案此后沿着这个圈子展开：2020年10月，王立科在全国政法队伍教育整顿试点期间主动投案；2021年1月和2月，邓恢林、龚道安先后被“双开”；8月是刘新云，9月是王立科和孙力军。孙力军的通报写他“政治野心极度膨胀”，“成伙作势控制要害部门，严重破坏党的团结统一，严重危害政治安全”，还在“抗击新冠肺炎疫情一线擅离职守，私藏私放大量涉密材料”。2021年10月傅政华被查，2022年3月被“双开”，他的通报首次写明“参加孙力军政治团伙”；同年9月，刘彦平也被“双开”。'
      cites: [b12-zaobao-2020-04-21-sun-lijun, c03-ccdi-2020-04-19-sun-lijun-probe, r04-people-2021-01-15-2020-tigers, c03-xinhua-2021-01-04-deng-huilin-expel, c03-people-2021-02-10-gong-daoan-expel, r05-cctv-2021-08-16-liu-xinyun-expel, c03-ccdi-2021-09-22-wang-like-expel, c03-ccdi-2021-09-30-sun-lijun-expel, c03-ccdi-2022-03-31-fu-zhenghua-expel, c03-people-2022-09-01-liu-yanping-expel, b12-chinanews-2023-01-07-bugle-ep1]
    - h: 处理结果：三天之内六人宣判
      from: 2022-09-21
      to: 2023-01-10
      text: '2022年9月21日，龚道安在唐山被判无期徒刑（受贿7343万余元），邓恢林在保定被判有期徒刑15年（受贿4267万余元），刘新云在廊坊因受贿1333万余元和滥用职权被判14年。9月22日，长春中院判处傅政华死缓、终身监禁，认定他受贿1.17亿余元，并对弟弟付卫华的严重犯罪线索“隐瞒不报，不依法处置”；王立科同日被判死缓、终身监禁，认定他受贿4.4亿余元，向孙力军等人行贿9731万余元，并长期充当娄河涉黑组织的“保护伞”。9月23日，孙力军被判死缓、终身监禁，认定他受贿6.46亿余元，2018年操纵证券市场帮助他人避免损失1.45亿余元，非法持有枪支2支。2023年1月10日，刘彦平因受贿2.34亿余元被判死缓、终身监禁。德国之声注意到，孙力军的判决没有提及审查调查通报中的任何政治罪状。'
      cites: [c03-xinhua-2022-09-21-gong-daoan-verdict, c03-cnr-2022-09-21-deng-huilin-verdict, r05-xinhua-2022-09-21-liu-xinyun-verdict, c03-xinhua-2022-09-22-fu-zhenghua-verdict, c03-xinhua-2022-09-22-wang-like-verdict, c03-xinhua-2022-09-23-sun-lijun-verdict, c03-xinhua-2023-01-10-liu-yanping-verdict, b12-dw-2022-09-23-sun-lijun-verdict]
    - h: 后续影响：政法队伍教育整顿与“政治毒瘤”的定性
      from: 2021-02
      to: 2023-01
      text: '2021年2月起，全国政法队伍教育整顿分两批展开，提出“坚决清除害群之马、彻底整治顽瘴痼疾”。2022年1月，中央纪委专题片《零容忍》第一集以此案开篇，称“孙力军政治团伙案是党的十八大后，严重违反党的政治纪律的典型”。德国之声报道，公安部2022年1月称肃清孙力军流毒影响是“重大政治任务”。2023年1月，专题片《永远吹冲锋号》第一集又以傅政华开篇，中央纪委国家监委第十一监督检查室副主任李永红说，查处此案“及时清除了政法单位的政治毒瘤”。'
      cites: [b12-xinhua-2022-01-15-zero-tolerance-ep1, b12-dw-2022-09-23-sun-lijun-verdict, b12-chinanews-2023-01-07-bugle-ep1]
  editor:
    - text: '此案在官方叙事中的分量来自“政治”，而不是金额。孙力军的通报用了“成伙作势控制要害部门”“严重危害政治安全”这样的措辞，傅政华的通报写他“在重大问题上弄虚作假、欺瞒中央，危害党的集中统一”。但法院认定的只有受贿、操纵证券市场、非法持有枪支、徇私枉法等罪名，没有一项政治罪名。纪律定性与刑事定罪分开处理，外界对这个团伙究竟图谋什么也就各有解读：邓聿文认为，掌握刀把子的人抱团本身就是当政者不能容忍的；滕彪把二十大前夕的审判看作党内权力斗争加剧的信号。官方从未公开团伙政治图谋的具体内容，海外流传的“政变”说法只是传闻。'
      cites: [c03-ccdi-2021-09-30-sun-lijun-expel, c03-ccdi-2022-03-31-fu-zhenghua-expel, c03-xinhua-2022-09-23-sun-lijun-verdict, b12-dw-2022-09-23-sun-lijun-verdict, f03-bbc-2022-09-27-fu-sun, c10-secretchina-2021-10-21-sun-coup]
    - text: '从专题片披露的细节看，这个圈子能够成形，靠的是政法系统用人上的“推荐运作”和信息上的特权。四名地方公安“一把手”都由孙力军推荐、运作提拔，他们的回报除了金钱，更重要的是违规提供孙力军无权知悉的舆情和案情。技侦、网安、警卫这些部门本身就掌握侦查和监控手段，孙力军还“使用公安侦查手段对抗组织审查”。连负责监督国家安全部的纪检组长刘彦平也身在其中，可见对掌握要害部门的上级领导，同级和派驻监督都很难起作用。这正是十九届中央纪委四次全会要破解的“对一把手监督和同级监督难题”。'
      cites: [b12-xinhua-2022-01-15-zero-tolerance-ep1, c03-ccdi-2021-09-30-sun-lijun-expel, c03-people-2022-09-01-liu-yanping-expel, r04-people-2021-01-15-2020-tigers]
    - text: '处理方式可以概括为政治定性从严、量刑分档。七人中有四人被判死缓并终身监禁，与案件的政治定性相称；但孙力军、傅政华都因“提供其他重大案件线索经查证属实，有重大立功表现”而没有被判死刑立即执行，说明专案仍在向外延伸。集中宣判安排在二十大开幕前一个月，同时以全国政法队伍教育整顿把一个案件扩大为全系统的整肃，向掌握刀把子的政法系统传递了绝对服从的要求。'
      cites: [c03-xinhua-2022-09-23-sun-lijun-verdict, c03-xinhua-2022-09-22-fu-zhenghua-verdict, b12-xinhua-2022-01-15-zero-tolerance-ep1, f03-bbc-2022-09-27-fu-sun]
  voices:
    - voice: official
      text: '孙力军案件是一个典型的政治问题和经济问题交织的案件，特别是这些人顶风违纪、知法犯法，结党营私，搞团团伙伙，贪污贿赂数额巨大，影响非常恶劣，这是十九大以来我们查处的最严重的案件之一，体现了党中央对腐败分子和腐败行为零容忍的态度和决心。'
      cite: b12-xinhua-2022-01-15-zero-tolerance-ep1
      quote: true
    - voice: official
      text: '确实我对他有唯命是从的做法，在政治上他也是竭尽全力地举荐和做工作，这个在政治上实际上是互相利用。'
      cite: b12-chinanews-2023-01-07-bugle-ep1
      quote: true
    - voice: scholar
      text: '旅美政论家邓聿文（德国之声）：“也许他们并非对习不忠，然而，这样一些掌握刀把子的人抱团会做出什么事情来，任何一个当政者都是会戒备的，何况对树敌众多的习。”'
      cite: f03-dw-2022-01-18-deng-yuwen
    - voice: scholar
      text: '滕彪（BBC中文）认为，中国的贪腐是体制性、全局性、普遍性的，抓谁、判谁是政治斗争和清除政治对手的需要；独立政治学者陈道银则认为，通报中的“危害党的集中统一”“危害政治安全”意味着他们可能有反对习近平的行为。'
      cite: f03-bbc-2022-09-27-fu-sun
    - voice: west
      text: 'Xi’s long-running crackdown has seen millions of officials targeted, including hundreds of senior officials – often referred to as “big tigers”. There has been widespread speculation that the campaign has also been used to target political opponents or critics of Xi.'
      zh: '习近平长期的反腐行动已波及数以百万计的官员，其中包括数百名常被称为“大老虎”的高官。外界普遍猜测，这场运动也被用来打击习近平的政治对手或批评者。'
      cite: b12-guardian-2021-10-01-sun-lijun
      quote: true
    - voice: zh
      text: '据看中国引述知情人（传闻）：孙力军被拿下的真正原因是参与对习近平的政变。官方通报和判决均未提及政变。'
      cite: c10-secretchina-2021-10-21-sun-coup
    - voice: zh
      text: '据大纪元引述知情人（传闻）：孙力军私藏的枪支“就像個小軍火庫一樣”，可以装备一个排。法院认定的是非法持有枪支2支。'
      cite: c10-epoch-2022-01-14-sun-armory
  events: [e08-2020-sun-lijun-probe, e08-2021-zhengfa-rectification, e08-2022-fu-sun-verdicts, r01-2021-sun-lijun-coup-rumour, e03-2018-meng-hongwei-detained]
  factions: [sun-lijun-gang, zhengfa]
  cites: [b12-xinhua-2022-01-15-zero-tolerance-ep1, c03-ccdi-2021-09-30-sun-lijun-expel, c03-ccdi-2022-03-31-fu-zhenghua-expel, c03-xinhua-2022-09-23-sun-lijun-verdict, b12-chinanews-2023-01-07-bugle-ep1]

- id: football
  title: 足坛反腐：从李铁到陈戌源、杜兆才
  kind: system
  years: '2015–2025'
  people: [du-zhaocai, gou-zhongwen, li-tie, liu-yi, chen-xuyuan]
  summary: '2022年11月，国足原主教练李铁被留置，由此揭开中国足坛十余年来规模最大的一轮反腐：中国足协十多名高层和中层干部接受审查调查，国家体育总局原副局长、足协原党委书记杜兆才和足协原主席陈戌源先后落马，分别被判有期徒刑14年和无期徒刑，李铁被判20年。中央纪委称“足球领域出现了系统性、塌方式腐败”，把根源归于足协管办不分、权力缺乏监督，以及俱乐部“金元足球”的围猎。'
  sections:
    - h: 背景：十年前的扫赌打黑与2015年改革方案
      from: '2009'
      to: '2019'
      text: '中国足球并非第一次反腐。2009年至2010年那一轮打击中，足协副主席谢亚龙、南勇及一批足协官员被处理，著名裁判陆俊和多名球员、数家俱乐部受罚，联赛裁判改为抽签决定。2015年，国务院办公厅印发《中国足球改革发展总体方案》，要求足协与体育总局脱钩、“久久为功”。与此同时，恒大式的投资带动了“金元足球”：专题片说，河北华夏幸福俱乐部试图效仿恒大烧钱，给自己定下第一年冲超、第二年进亚冠、第三年夺中超冠军的目标。'
      cites: [cs2-bbc-2024-02-13-football, cs2-people-2024-01-10-sanbufu-ep4]
    - h: 经过：以李铁为突破口
      from: 2022-02
      to: 2023-10
      text: '2022年2月1日，国足负于越南，提前两轮无缘卡塔尔世界杯。从2022年底开始，中央纪委国家监委机关会同驻国家体育总局纪检监察组、湖北省纪委监委，以“室组地”联合办案机制彻查足球领域腐败。2022年11月26日李铁接受监察调查，专题片称“李铁是本次专案第一个接受监察调查并被留置的人员”。此后，“中国足球协会陆续有十多名高层和中层干部接受审查调查”，纪检监察机关还会同公安机关调查了教练、球员、裁判、俱乐部高管、经纪人等数十名涉案人员。2023年春，国家体育总局副局长杜兆才被宣布接受审查调查；10月他被“双开”，通报称他“严重破坏足球领域政治生态”，“靠体育吃体育”“靠足球吃足球”。'
      cites: [cs2-people-2024-01-10-sanbufu-ep4, cs2-thepaper-2025-04-30-li-tie-appeal, t02-cctv-2023-04-01-du-zhaocai-probe, t02-ccdi-2023-10-07-du-zhaocai-expel]
    - h: 涉案人和关系：假球、买帅与“拜码头”
      from: 2015-08
      to: 2021-12
      text: '据专题片，李铁2015年8月首次在华夏幸福担任主教练，俱乐部一上任就要他动用人脉收买对手；最后八场八连胜冲超，背后是俱乐部和教练团队分头收买对手。2017年到武汉卓尔后，李铁主动向俱乐部推销假球。法院后来认定，2015年至2019年华夏、卓尔两家俱乐部为赢得比赛向相关人员给付3905万余元。2019年8月22日陈戌源当选足协主席，前一晚就有两名地方足协负责人各送30万元“拜码头”。李铁为当上国家队主教练，一方面让卓尔俱乐部出200万元向陈戌源行贿，一方面自掏100万元送给足协秘书长刘奕；上任后又与卓尔签下总额6000万元的所谓合同，随即把四名卓尔球员选入国家队。李铁2020年1月2日出任国家队主教练，2021年12月3日下课。杜兆才在专题片中说，“经常通过送钱送物来疏通办事”在圈内已近乎惯例。'
      cites: [cs2-people-2024-01-10-sanbufu-ep4, cs2-thepaper-2025-04-30-li-tie-appeal]
    - h: 处理结果：无期、二十年与十四年
      from: 2024-03-26
      to: 2025-12-08
      text: '2024年3月26日，黄石中院以受贿罪判处陈戌源无期徒刑，认定他在2010年至2023年间受贿8103万余元，其中400万元未实际取得，并“为多个足球俱乐部和地方足协在赛事安排、联赛晋级、裁判判罚等事项上谋取不正当利益，严重破坏足球领域公平竞争秩序和行业生态环境”。12月13日，咸宁中院以受贿、行贿、单位行贿、非国家工作人员受贿、对非国家工作人员行贿五罪判处李铁有期徒刑20年；同日武汉中院以受贿4341万余元判处杜兆才有期徒刑14年。2025年4月30日，湖北高院驳回李铁上诉，维持原判。另一条线上，前国家体育总局局长苟仲文2024年5月被查，12月被“双开”，通报称他“严重破坏体育系统的政治生态”；2025年12月8日，他因受贿2.36亿余元和滥用职权被判死缓、终身监禁。法院认定的受贿主要发生在他任北京市副市长和体育总局局长期间，官方没有把他的案件与足球专案挂钩。'
      cites: [cs2-xinhua-2024-03-26-chen-xuyuan-verdict, cs2-xinhua-2024-12-13-li-tie-verdict, t02-xinhua-2024-12-13-du-zhaocai-verdict, cs2-thepaper-2025-04-30-li-tie-appeal, r06-rmrb-2024-12-12-gou-zhongwen-expel, k05-chinanews-2025-12-08-gou-zhongwen]
    - h: 后续影响：体育被列为重点整治领域
      from: 2024-01
      to: '2025'
      text: '2024年1月，二十届中央纪委三次全会公报把体育与金融、国企、高校、烟草、医药等并列，要求“坚决清除系统性腐败风险隐患”。同月播出的专题片《持续发力 纵深推进》第四集专讲足球案，陈戌源、杜兆才、李铁等人出镜认罪。中央纪委第二监督检查室主任严维耀说，查处足球系列腐败案件“不仅仅是查处那几个人”，更要推动体育部门“汲取教训、深化改革、完善制度、正本清源”。华夏幸福、武汉卓尔两家俱乐部此时都已解散。'
      cites: [cs2-ccdi-2024-01-10-ccdi-3rd-plenum, cs2-people-2024-01-10-sanbufu-ep4]
  editor:
    - text: '与孙力军案不同，足球案的官方定性是“严重破坏足球领域政治生态”，而不是团伙或政治问题，目前看不出背后有派系清算的线索。推动查案的更直接因素是国足成绩一路下滑、球迷不满累积，以及2015年改革方案迟迟没有落地：专题片用陈戌源、杜兆才的话说，他们觉得改革“难度大、见效慢”，于是把希望押在豪赌世界杯上。足球是最高领导人公开表示过关注的领域，这让足协的失败多了一层政治含义。'
      cites: [t02-ccdi-2023-10-07-du-zhaocai-expel, cs2-people-2024-01-10-sanbufu-ep4, cs2-bbc-2024-02-13-football]
    - text: '从制度上看，症结在于足协的双重身份：名义上是社会组织，实际掌握着联赛准入、裁判选派、国家队选材等公共资源。湖北省纪委监委的罗氚说：“联赛管理长期是管办不分，足协既监管又组织，权力过于集中”；而杜兆才接到假球线索后“把调查改成研究”，说明体育总局的监督也在空转。罗文对BBC说，这一轮和十年前“看起来一模一样”，只是人换了一批、钱多了很多。只处理人而不改结构，同样的问题就会反复出现。'
      cites: [cs2-people-2024-01-10-sanbufu-ep4, cs2-bbc-2024-02-13-football]
    - text: '选择李铁作为突破口，是因为他同时连着俱乐部、国家队和足协，知名度又高，便于向上追查，也便于对外说明。专题片让当事人出镜认罪、向球迷“谢罪”，案件处理因此也成了一次面向公众的教育。量刑上，陈戌源因“揭发他人犯罪行为，经查证属实，具有立功表现”被判无期而非死刑；李铁、杜兆才分别被判20年和14年。这种区别对待既是在追赃，也是在鼓励涉案人员交代。'
      cites: [cs2-people-2024-01-10-sanbufu-ep4, cs2-xinhua-2024-03-26-chen-xuyuan-verdict, t02-xinhua-2024-12-13-du-zhaocai-verdict]
  voices:
    - voice: official
      text: '足球领域出现了系统性、塌方式腐败，纪检监察机关重拳出击，不敢、不能、不想一体推进，惩治力度前所未有。'
      cite: cs2-people-2024-01-10-sanbufu-ep4
      quote: true
    - voice: official
      text: '我自己也收了俱乐部的钱，我就不会去抓这种风气，因为你去抓这个风气，那不是你自己抓自己吗，所以对这种现象事实上就基本上应该是放任了。'
      cite: cs2-people-2024-01-10-sanbufu-ep4
      quote: true
    - voice: official
      text: '我做球员的时候最憎恨的就是踢假球的人，但是因为我知道这些可能会帮助我们球队增加（冲超）几率，第一次独立成为一个球队的主教练，所以也是有特别想证明自己的这种心态。'
      cite: cs2-people-2024-01-10-sanbufu-ep4
      quote: true
    - voice: zh
      text: '长期观察中国足球的罗文（Rowan Simons）对BBC中文说：“在很多方面，现在这一次看起来和十年前就一模一样，不过当中的人物换了一批”；不同的是“这一次涉及的金钱又多得多了”。BBC采访的研究者认为，专业环节缺乏专业性，“因为每一环都不扎实，腐败的空间就非常大”，自上而下的官僚体系形成了恶性循环。'
      cite: cs2-bbc-2024-02-13-football
  events: [e10-2024-football-verdicts]
  factions: []
  cites: [cs2-people-2024-01-10-sanbufu-ep4, cs2-xinhua-2024-03-26-chen-xuyuan-verdict, cs2-xinhua-2024-12-13-li-tie-verdict, t02-xinhua-2024-12-13-du-zhaocai-verdict, t02-ccdi-2023-10-07-du-zhaocai-expel]

- id: mca-lottery
  title: 民政部福彩系统的系统性腐败与问责
  kind: system
  years: '2002–2018'
  people: [li-liguo, dou-yupei, chen-chuanshu, qu-shuhui, huang-shuxian, he-wen, wang-suying, bao-xuequan, wang-yunge, feng-lizhi]
  summary: '民政部福彩案的特殊之处在于：被处分的部级官员大多不是因为本人受贿，而是因为“所辖单位发生系统性腐败问题”被问责。中国福利彩票发行管理中心三任主任陈传书、鲍学全、王素英和两名副主任先后落马，旗下中彩在线公司被指向关联方输送数十亿元利益；2017年，民政部原部长李立国被降为副局级，副部长窦玉沛提前退休，驻部纪检组组长曲淑辉被降为正处级。驻部纪检监察组组长龚堂华的总结是：如果所有的鱼都死了，“那就是水的问题”。'
  sections:
    - h: 起因：“中福在线”与审计、巡视的发现
      from: '2002'
      to: 2015-06
      text: '中国福利彩票发行管理中心（中福彩中心）是民政部直属事业单位，负责全国福彩的发行和销售。旗下的中彩在线公司经营视频型彩票“中福在线”，据界面新闻，2002年至2014年“中福在线”总销售额超过1300亿元，总经理贺文“通过复杂而隐秘的持股方式”被疑非法获利至少27亿元。2015年，《经济参考报》曝光称，中彩在线已由名义上的国有控股企业悄然变成高管掌控的个人“财富帝国”。同年6月，审计署公布首次彩票资金审计结果，查出违法违规问题金额169.32亿元，并移送重大违法违纪问题线索90起；中央巡视组也指出，民政部“公共权力部门化利益化，利用主管社会组织的权力为干部谋职牟利，福利彩票发行管理也存在问题。”'
      cites: [cs2-jiemian-2017-01-mca-systemic, cs2-sina-2018-11-10-lottery-bjnews, cs2-chinanews-2015-06-25-lottery-audit, r03-wiki-dou-yupei]
    - h: 涉案人和关系：三任主任、分管副部长与派驻纪检组
      from: '2006'
      to: '2016'
      text: '中福彩中心三任主任陈传书、鲍学全、王素英先后被处理。陈传书担任主任后升任民政部党组成员、中国老龄协会会长；鲍学全2012年因举报多、线索明确，被调离福彩中心，出任全国老龄办副主任；王素英2015年1月至2017年5月任主任。部领导层面，《联合早报》称李立国2006年以副部长身份分管彩票，2009年前后由窦玉沛接手，窦玉沛主管福利彩票长达十年。派驻纪检组本应负责监督，但2008年至2016年任驻民政部纪检组组长的曲淑辉，后来被认定“长期干预和插手驻在部门下属单位相关工程项目，并从中谋取私利”。中纪委后来通报，中央巡视组和中央纪委先后向驻部纪检监察组移交了“数十件涉及民政部局处级干部的问题线索”。'
      cites: [r03-wiki-chen-chuanshu, cs2-jiemian-2017-01-mca-systemic, cs2-zaobao-2017-02-10-mca, r03-wiki-dou-yupei, cs2-people-2018-09-13-wang-suying, r03-ccdi-2017-06-20-qu-shuhui, r03-wiki-qu-shuhui, cs2-people-2018-11-09-lottery-14]
    - h: 经过：六中全会“请假”与部长问责
      from: 2016-05
      to: 2017-10
      text: '2016年5月，中彩在线总经理贺文落马。10月十八届六中全会期间，《新闻联播》画面上没有出现李立国。10月31日民政部召开干部大会，宣布黄树贤任党组书记，李立国、窦玉沛都没有出席。同日王岐山在全国政协常委会上说：“六中全会上，有一名中央委员和一名中央纪委委员就‘请假’了，因为他们所领导的部门出现了系统性腐败，中共中央决定对他们问责。”所指的是李立国和曲淑辉。2017年1月9日，中央纪委案件审理室主任罗东川证实正在审查李立国、窦玉沛。2月8日公布处理结果：李立国“对所辖单位发生系统性腐败问题负有主要领导责任”，受留党察看二年、行政撤职处分，降为副局级非领导职务；窦玉沛受党内严重警告处分，提前退休。4月，福彩中心老主任陈传书被降为正局级；6月，曲淑辉被降为正处级，10月由十八届中央纪委八次全会确认。'
      cites: [r03-wiki-dou-yupei, k04-wiki-li-liguo, r03-wiki-qu-shuhui, cs2-jiemian-2017-01-mca-systemic, cs2-thepaper-2017-02-08-mca-accountability, r03-ccdi-2017-02-08-li-liguo-dou-yupei, r03-people-2017-04-24-chen-chuanshu, r03-ccdi-2017-06-20-qu-shuhui, r03-ccdi-2017-10-09-ccdi-8th-plenum]
    - h: 处理结果：14名局处级干部
      from: 2017-08
      to: 2018-11
      text: '2017年8月，鲍学全和福彩中心副主任、中彩在线原董事长王云戈被“双开”，王云戈另涉嫌泄露国家秘密犯罪。2018年9月12日，王素英被宣布接受审查调查，福彩中心三任主任至此接连落马。11月，驻民政部纪检监察组公布：中福彩中心领导班子违反《彩票管理条例》，“集体研究同意中彩在线公司年度分红，造成国有资产巨额损失”，14名责任人员被问责，其中12人立案审查、2人诫勉；王素英、副主任冯立志被留置。通报还说，驻部纪检监察组先后与王素英谈话14次，她却与有关人员订立攻守同盟、转移赃款赃物。中央纪委网站同时公开了鲍学全、王素英、王云戈、冯立志四人的忏悔视频。'
      cites: [cs2-people-2017-08-28-bao-wang-expel, cs2-people-2018-09-13-wang-suying, cs2-people-2018-11-09-lottery-14]
    - h: 后续影响：问责条例下的部级样本与福彩整改
      from: 2016-07
      to: 2018-11
      text: '2016年7月颁布的《中国共产党问责条例》实施后不久，李立国成为十八大后第一位在任上落马的内阁部长。原民政部党组3名成员和派驻纪检组组长被追责，主体责任和监督责任同时被追究。驻部纪检监察组组长龚堂华说：“一条河里一条鱼、两条鱼死了，是鱼的问题，如果所有的鱼都死了，那就是水的问题。”此后民政部召开30余次会议部署整改，中福彩中心收回了中福在线的数据管理、开兑奖管理和资金归集等权限，中彩在线的股权整改也“取得实质性进展”。'
      cites: [cs2-thepaper-2017-02-08-mca-accountability, k04-wiki-li-liguo, cs2-people-2018-11-09-lottery-14]
  editor:
    - text: '这是十八大后少见的以问责为主的部级案件。李立国、窦玉沛、陈传书三人的处分理由都是“严重失职失责”，通报没有指控他们本人受贿；只有曲淑辉被认定插手工程项目并从中谋取私利。从公开材料看不出派系清算的痕迹，海外关于李立国治病、鲍学全“供出”上级的说法都只是传闻。真正带有政治意味的是时机和场合：在六中全会上让一名中央委员和一名中央纪委委员“请假”，把一起部门腐败案变成了全会上的警示。'
      cites: [r03-ccdi-2017-02-08-li-liguo-dou-yupei, r03-people-2017-04-24-chen-chuanshu, r03-ccdi-2017-06-20-qu-shuhui, r03-wiki-qu-shuhui]
    - text: '制度上的症结是管办不分。民政部既是福彩的主管部门，又通过直属事业单位发行彩票，事业单位再控股企业经营视频彩票，资金规模以千亿计。审计署把问题归因于“彩票管理制度不完备、管理体制未理顺”和行业监督不到位。派驻纪检组本应是最后一道防线，却“发现问题不报告不处置”，组长本人也牵涉其中。这正是龚堂华所说的“水的问题”。'
      cites: [cs2-chinanews-2015-06-25-lottery-audit, r03-wiki-qu-shuhui, cs2-people-2018-11-09-lottery-14]
    - text: '之所以降级问责而不是开除，是因为中央把重点放在“管党治党”上：官方的定性是“原民政部党组未履行管党治党政治责任，特别是对中福彩中心监督管理缺失”，放任干部被不法商人围猎。李立国从正部级降为副局级，是“断崖式降级”的典型；处理部长和派驻纪检组长，是为了给其他部委示范什么叫“失责必追究”。'
      cites: [cs2-sina-2018-11-10-lottery-bjnews, r03-ccdi-2017-02-08-li-liguo-dou-yupei, cs2-thepaper-2017-02-08-mca-accountability]
  voices:
    - voice: official
      text: '彩票系统腐败案件给民政、给福利彩票都造成了不可挽回的巨大的影响和损失，这简直是一场灾难。'
      cite: cs2-people-2018-11-09-lottery-14
      quote: true
    - voice: zh
      text: '《联合早报》称，李立国被连降三级，贬为不担任领导职务的副局级官员，窦玉沛被令提前退休，并把这次处罚视为政治局对部级“一把手”问责的信号。'
      cite: cs2-zaobao-2017-02-10-mca
    - voice: zh
      text: '界面新闻引述一名举报人说，窦玉沛长期分管彩票、与鲍学全关系很好，还参与了对鲍学全的调查，“他能查出什么来？”鲍学全被调往老龄办后，仍在窦玉沛的分管范围内。'
      cite: cs2-jiemian-2017-01-mca-systemic
    - voice: zh
      text: '据界面新闻转述彩票业内流传的说法（传闻）：2009年末李立国大病一场，一家与福彩中心有深度合作的彩票供应商为他安排治疗并最大限度保密，次年李立国升任部长；《联合早报》转述的版本是鲍学全牵线。官方通报从未提及此事。'
      cite: cs2-jiemian-2017-01-mca-systemic
    - voice: zh
      text: '据《星岛日报》引述知情人（传闻）：“（原中国福利彩票发行管理中心主任）鲍学全进去了，扛不住，把他们都供出来了！”'
      cite: k04-wiki-li-liguo
  events: [e03-2016-sixth-plenum-core, e10-2017-li-liguo-accountability]
  factions: []
  cites: [r03-ccdi-2017-02-08-li-liguo-dou-yupei, cs2-thepaper-2017-02-08-mca-accountability, cs2-people-2018-11-09-lottery-14, cs2-sina-2018-11-10-lottery-bjnews, r03-ccdi-2017-06-20-qu-shuhui]

- id: finance-2023
  title: 2023年金融反腐：从央行副行长到“一月一虎”
  kind: cluster
  years: '2021–2026'
  people: [liu-liange, fan-yifei, li-xiaopeng-everbright, tang-shuangning, wang-bin-chinalife, zhang-hongli, liu-lixian, lou-wenlong, zhu-congjiu, yi-huiman, bao-fan, li-yunze, fang-xinghai, ouyang-weimin, lai-xiaomin, wang-qishan, zhang-huayu, chen-gongyan, li-huatao, yuan-fei, wang-zeping, wang-junquan, ren-chunsheng, zhang-jinsong, huang-runzhong, liu-feng-cba, liu-zhangjun, gao-fei, zhang-huiye, guo-sanye, zhang-jianjun-pbc, duan-yindi, lu-chuncai, zhang-songbai, kong-fanbo, he-zeshu, wang-zhibin-icbc, guo-xingang, xu-xilong, zhang-xiaoli, liu-anlin, feng-jianlong, gao-qiang-ccb, shen-rongqin, chen-shuang, zhu-huimin, xue-feng-ebscn, bai-tianhui, zhuang-enyue, xu-xiang-citic, zhang-xu-citic, li-wei-zhongtai, gan-chengjiu, li-gong-huaan, jiang-chengjun]
  summary: '2023年前后的金融反腐，是十八大后金融系统最密集的一轮清查：人民银行副行长范一飞、中国银行原董事长刘连舸、光大集团前后两任董事长唐双宁和李晓鹏、工商银行原副行长张红力等国有大行、监管机构和金融央企的高层相继落马，财经媒体称2023年“一度到了一月一虎的频率”。官方把问题概括为“靠金融吃金融”和违法放贷制造风险，并在同年10月的中央金融工作会议上承认“金融乱象和腐败问题屡禁不止，金融监管和治理能力薄弱”。'
  sections:
    - h: 起因：巡视金融单位与“金融精英论”
      from: 2021-10
      to: 2023-03
      text: '2021年10月，十九届中央第八轮巡视进驻25家金融单位，其中包括中国银行、进出口银行和光大集团。巡视之后，中国人寿原总裁王滨（2022年1月）、人民银行副行长范一飞（2022年11月）先后被查。2023年1月，二十届中央纪委二次全会提出“深化整治金融、国有企业、政法、粮食购销等权力集中、资金密集、资源富集领域的腐败”，并要求“坚决防止领导干部成为利益集团和权势团体的代言人、代理人”。2月，中央纪委网站刊文要求破除“金融精英论”“唯金钱论”“西方看齐论”，查处“影子股东”“政商旋转门”等新型和隐性腐败。3月27日，二十届中央第一轮巡视宣布对国家开发银行、光大集团等5家中管金融企业开展巡视“回头看”。'
      cites: [cs2-thepaper-2023-04-05-liu-li, t02-chinanews-2022-01-08-wang-bin-probe, t02-ccdi-2022-11-05-fan-yifei-probe, cs2-gov-2023-01-10-ccdi-2nd-plenum, cs2-sina-2023-02-23-ccdi-finance-elite]
    - h: 经过：“一月一虎”
      from: 2023-02
      to: 2024-05
      text: '2023年2月，华兴资本创始人包凡失联，随后被证实正配合有关部门调查。3月31日，中国银行原董事长刘连舸被查；“6天之内”，光大集团原董事长李晓鹏也被查。5月是证监会出身的浙江省政协原副主席朱从玖，7月是光大集团另一位前董事长唐双宁，11月是工商银行原副行长张红力；工行原纪委书记刘立宪在2022年8月自动投案，2023年9月被公布接受审查调查。2024年5月，农业银行原副行长楼文龙被查。新浪财经称，在光大一家就有两任董事长落马，金融打虎“一度到了一月一虎的频率”。2024年1月，二十届中央纪委三次全会公报要求“严肃查处金融、国企、高校、体育、烟草、医药、粮食购销、统计等领域腐败问题”，工作报告则点名“范一飞、刘连舸、李晓鹏、唐双宁等腐败分子”。'
      cites: [c04-zaobao-2025-08-09-bao-fan, t02-ccdi-2023-03-31-liu-liange-probe, t02-ccdi-2023-04-05-li-xiaopeng-probe, cs2-thepaper-2023-04-05-liu-li, r05-ccdi-2023-05-04-zhu-congjiu-probe, r05-ccdi-2023-07-15-tang-shuangning-probe, t02-ccdi-2023-11-04-zhang-hongli-probe, r05-xinhua-2023-09-15-liu-lixian-probe, t02-court-2024-12-24-liu-lixian-verdict, t02-xinhua-2024-05-16-lou-wenlong-probe, cs2-sina-2024-10-29-everbright, cs2-ccdi-2024-01-10-ccdi-3rd-plenum, cs2-qq-2024-02-26-ccdi-report-tigers]
    - h: 涉案人和关系：“靠金融吃金融”
      from: 2010
      to: 2023
      text: '官方通报对这批人的描述高度相似。刘连舸被指“弃守金融风险防控职责，大肆违规插手信贷项目，违法发放贷款，造成重大金融风险”；王滨“既制造、放大金融风险，又大搞金融腐败”；范一飞被指“以钱生钱”；唐双宁大搞“雅腐”，“利用职权大肆宣传个人书法等作品”；张红力“官迷心窍，结交政治掮客，搞利益交换，捞取政治资本”。从人事关系看，光大集团是重灾区：新浪财经称李晓鹏执掌光大集团的五年间打造出所谓“河南帮”，其同学、老乡、光大银行原副行长张华宇把儿子、女婿、弟弟等数十人安排进光大系统，后也落马；唐双宁时期提拔的薛峰、陈爽、朱慧民、刘鹰等“爱将”也相继落马。这些人之间的关联多是同一机构内的上下级和提拔关系，而不是跨机构的政治派系。'
      cites: [t02-ccdi-2023-10-07-liu-liange-expel, t02-ccdi-2022-09-01-wang-bin-expel, r05-ccdi-2023-06-09-fan-yifei-expel, t02-xinhua-2024-01-06-tang-shuangning-expel, t02-ccdi-2024-05-09-zhang-hongli-expel, t02-xinhua-2023-10-09-li-xiaopeng-expel, cs2-sina-2024-10-29-everbright]
    - h: 中央金融工作会议：从查人到改体制
      from: 2023-10-30
      to: 2023-10-31
      text: '2023年10月30日至31日召开的中央金融工作会议承认“金融乱象和腐败问题屡禁不止，金融监管和治理能力薄弱”，要求“坚决惩治违法犯罪和腐败行为，严防道德风险”。会议强调“加强党中央对金融工作的集中统一领导”，要求发挥中央金融委员会、中央金融工作委员会以及地方党委金融委员会和金融工委的作用，并以“金融队伍的纯洁性、专业性、战斗力”为重要支撑。查办个案由此与金融管理体制的重组连在一起。'
      cites: [cs2-gov-2023-10-31-financial-work-conf]
    - h: 处理结果：死缓、终身监禁与长期徒刑
      from: 2023-09
      to: 2025-08
      text: '2023年9月12日，王滨因受贿3.25亿余元被判死缓并终身监禁。2024年10月10日，黄冈中院以受贿3.86亿余元判处范一飞死缓、终身监禁。11月19日，朱从玖因受贿1.05亿余元被判无期徒刑。11月26日，济南中院认定刘连舸受贿1.21亿余元，另在2017年底至2020年初明知企业不符合条件仍推动放贷33.2亿余元，造成本金损失1.907亿余元，以受贿罪、违法发放贷款罪决定执行死缓。12月10日，唐山中院以贪污、受贿判处唐双宁有期徒刑12年；12月24日，自首的刘立宪被判8年。2025年2月19日，张红力因受贿1.77亿余元被判死缓；3月18日，李晓鹏被判15年；8月25日，楼文龙因受贿8451万余元被判无期徒刑。'
      cites: [t02-xinhua-2023-09-12-wang-bin-verdict, t02-xinhua-2024-10-10-fan-yifei-verdict, r05-court-2024-11-19-zhu-congjiu-verdict, t02-xinhua-2024-11-26-liu-liange-verdict, t02-xinhua-2024-12-10-tang-shuangning-verdict, t02-court-2024-12-24-liu-lixian-verdict, t02-court-2025-zhang-hongli-verdict, t02-xinhua-2025-03-18-li-xiaopeng-verdict, t02-court-2025-08-25-lou-wenlong-verdict]
    - h: 后续影响：反腐进入监管层
      from: 2025-08
      to: 2026-07
      text: '此后，反腐延伸到金融监管的最高层。2025年9月，证监会原主席易会满被查；2026年4月他被开除党籍，通报称他对党中央关于资本市场的重大决策部署“阳奉阴违、推诿卸责”。2026年6月，曾任国家金融监督管理总局局长的李云泽被四川省人大常委会罢免全国人大代表职务；7月，国家开发银行原行长欧阳卫民、证监会原副主席方星海相继被查。另一方面，包凡在被带走两年多后于2025年8月获释；《联合早报》引述的分析认为，金融业仍处在反腐和限薪之下，与几年前的鼎盛时期相去甚远。'
      cites: [c03-xinhua-2025-09-06-yi-huiman-probe, c03-xinhua-2026-04-30-yi-huiman-expel, c03-xinhua-2026-06-26-npc-notice-18, t02-xinhua-2026-07-19-ouyang-weimin-probe, t02-xinhua-2026-07-24-fang-xinghai-probe, c04-zaobao-2025-08-09-bao-fan]
  editor:
    - text: '与孙力军案不同，这批金融高管的官方通报几乎没有团伙或派系定性。政治纪律方面的指控多是“落实党中央决策部署不坚决”之类的泛化表述，判决认定的也只是受贿、贪污和违法放贷。外界的政治解读主要围绕王岐山：美国之音引述的观察人士认为，金融行业是王岐山经营多年的领域，清查带有把金融权力收回来的意味，谢田也说其中“当然有权力斗争的因素”。这类说法没有官方材料支撑，本站只把它当作分析观点。官方自己的提法是防止领导干部成为“利益集团和权势团体的代言人、代理人”，但没有点名任何人。'
      cites: [t02-ccdi-2023-10-07-liu-liange-expel, cs2-voa-2024-02-22-finance-purge, cs2-gov-2023-01-10-ccdi-2nd-plenum]
    - text: '从制度上看，国有金融机构的权力集中在信贷审批、监管审批和人事上：刘连舸推动违规放贷，楼文龙在监管审批、入股城市商业银行等事项上收钱，范一飞的受贿从建设银行一直延续到人民银行，时间长达近三十年。中央纪委点名的“影子股东”“政商旋转门”，在资金规模大、专业门槛高的金融业尤其难被发现。中央金融工作会议承认“金融监管和治理能力薄弱”，说明官方也认为问题不只出在个人身上。'
      cites: [t02-xinhua-2024-11-26-liu-liange-verdict, t02-court-2025-08-25-lou-wenlong-verdict, t02-xinhua-2024-10-10-fan-yifei-verdict, cs2-sina-2023-02-23-ccdi-finance-elite, cs2-gov-2023-10-31-financial-work-conf]
    - text: '金融反腐被处理成“防范化解金融风险”的一部分：刘连舸除受贿外还被以违法发放贷款罪定罪，王滨被指“既制造、放大金融风险”。官方同时把金融业的高薪文化和“金融精英论”列为整风对象，并把惩处与中央金融委员会、中央金融工委等体制安排连在一起。量刑上，这批人普遍因主动交代、积极退赃而获死缓或长期徒刑：范一飞受贿3.86亿余元、王滨3.25亿余元，都被判死缓并终身监禁；而华融原董事长赖小民2021年因受贿17.88亿余元被判死刑立即执行，法院认为他虽有重大立功表现，也不足以从宽。'
      cites: [t02-xinhua-2024-11-26-liu-liange-verdict, t02-ccdi-2022-09-01-wang-bin-expel, cs2-sina-2023-02-23-ccdi-finance-elite, cs2-gov-2023-10-31-financial-work-conf, t02-xinhua-2024-10-10-fan-yifei-verdict, t02-xinhua-2023-09-12-wang-bin-verdict, c03-court-2021-01-05-lai-xiaomin-verdict]
  voices:
    - voice: official
      text: '破除“金融精英论”“唯金钱论”“西方看齐论”等错误思想，整治过分追求生活“精致化”、品味“高端化”的享乐主义和奢靡之风'
      cite: cs2-sina-2023-02-23-ccdi-finance-elite
      quote: true
    - voice: official
      text: '中央金融工作会议称，金融乱象和腐败问题屡禁不止，金融监管和治理能力薄弱，要坚决惩治违法犯罪和腐败行为，严防道德风险。'
      cite: cs2-gov-2023-10-31-financial-work-conf
    - voice: zh
      text: '美国之音引述经济学家谢田说，金融业腐败是彻头彻尾的制度性问题；他又说王岐山在金融系统“兵强马壮”，如今要把金融权力拿过来，“当然有权力斗争的因素在内”。另有未具名观察人士称，习近平唯恐王岐山“功高盖主”。这些都属于海外评论者的推测。'
      cite: cs2-voa-2024-02-22-finance-purge
    - voice: zh
      text: '《联合早报》报道包凡获释时引述佳富龙洲分析师贝多尔说：“中国金融业和几年前的鼎盛时期相比，相去甚远。”'
      cite: c04-zaobao-2025-08-09-bao-fan
    - voice: zh
      text: '新浪财经梳理光大系落马者时称，李晓鹏任内形成所谓“河南帮”，唐双宁的多名“爱将”也被查。这一说法来自媒体梳理，官方通报未使用。'
      cite: cs2-sina-2024-10-29-everbright
