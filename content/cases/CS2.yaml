- id: tobacco-system
  title: 烟草系统：政企合一的“独立王国”
  kind: system
  years: '2016–2025'
  people: [ling-chengxing, he-zehua, zhao-hongshun, pan-jiahua, xu-ying]
  summary: '中国烟草实行“一套人马，两套牌子”的政企合一体制，国家烟草专卖局和中国烟草总公司垄断着全球最大的卷烟市场。十九大后，国家烟草专卖局先后有5名副局长以上官员被查，被称为“烟草五虎”，其中原局长凌成兴被认定“靠烟吃烟、收钱敛财”，原副局长何泽华受贿9.43亿余元被判死缓并终身监禁。2024年中央巡视后，烟草局开展“靠烟吃烟”问题专项整治。'
  sections:
    - h: 起因：政企合一与2016年专项巡视
      from: 2016-02
      to: 2016-06
      text: '据业内人士介绍，中国烟草总公司和国家烟草专卖局在办公机制上是“一套人马，两套牌子”，从总公司到地方都是如此，主要领导集党务、政务、企务于一身。由于行业垄断和政企合一，系统内权力运作缺乏透明度，容易形成“独立王国”。2016年2月至4月，中央第二巡视组对国家烟草专卖局党组进行专项巡视，6月反馈指出“对权力缺乏监督制约，存在系统性廉洁风险”，通报整改时又点出“家族式腐败突出”问题。烟草局党组表示要“分权+制权”，防止一把手“管人+管钱”。十八届中央第九轮巡视此前也指出，烟草系统“买官卖官”“带病提拔”“近亲繁殖”问题比较突出。'
      cites: [cs2-sina-2020-12-29-tobacco-kingdom, cs2-jiemian-2024-12-tobacco-five-tigers]
    - h: 经过：“烟草五虎”相继落马
      from: 2019-02
      to: 2024-12
      text: '2019年2月16日，国家烟草专卖局原副局长赵洪顺被查，成为烟草系统“首虎”；中央纪委专题片披露，他在三处住房存放了近3000瓶茅台酒。2021年5月，中央纪委原驻烟草局纪检组组长潘家华被查，此时他已退休9年。2023年1月，原副局长何泽华被查。同年10月中央巡视组进驻烟草局后没几天，10月23日，原局长凌成兴被查；何泽华在2013年5月至2014年3月曾在凌成兴手下任副局长。界面新闻统计，十九大以来国家烟草专卖局已有5名副局长以上级别官员被查，被称“烟草五虎”，除徐𬎆和凌成兴外，还有赵洪顺、潘家华、何泽华；地方上，云南中烟系统近两年至少已有7名高级管理人员落马。'
      cites: [cs2-jiemian-2024-12-tobacco-five-tigers, cs2-qq-2024-01-09-tobacco-inspection, t02-ccdi-2023-10-23-ling-chengxing-probe, t02-ccdi-2023-01-06-he-zehua-probe, r07-ccdi-2021-05-11-pan-jiahua-probe]
    - h: 涉案人和关系：用人、采购与亲属
      from: 1998
      to: 2023
      text: '几名“老虎”的问题集中在人事和业务承揽上。赵洪顺被指“利用职务便利在职务晋升方面为他人谋取利益，与不法私营企业主沆瀣一气，大搞权钱交易，收受礼品、礼金，严重破坏烟草系统的政治生态”，受贿主要来自烟标印刷和烟草广告业务。潘家华身为派驻纪检组组长却“执纪违纪，帮助烟草行业私营企业主谋取私利”，并“将多名亲友安排在烟草系统工作；家风不正，纵容亲属利用其职务影响在烟草系统违规获取巨额利益”。何泽华被指“将手中的公权力和烟草资源异化为谋取私利的工具”，在职级晋升、职工录用、烟草业务承揽等方面谋利，退休后仍为亲属谋利。凌成兴则在收购股权的过程中徇私舞弊、滥用职权。'
      cites: [r04-xinhua-2019-07-12-zhao-hongshun-expel, r04-court-2020-06-18-zhao-hongshun-verdict, r07-xinhua-2021-11-13-pan-jiahua-expel, t02-ccdi-2023-07-06-he-zehua-expel, t02-ccdi-2024-04-22-ling-chengxing-expel]
    - h: 处理结果
      from: 2020-06
      to: 2025-05
      text: '2020年6月18日，淮安中院以受贿9032万余元判处赵洪顺无期徒刑。2023年4月4日，合肥中院以受贿1698万余元判处潘家华有期徒刑11年。2024年5月29日，大连中院认定何泽华受贿9.43亿余元，另有离职后利用影响力受贿147万余元，判处死缓并终身监禁。2025年5月21日，长春中院以受贿4311万余元、国有公司人员滥用职权造成国有资产损失2.08亿余元，判处凌成兴有期徒刑16年。'
      cites: [r04-court-2020-06-18-zhao-hongshun-verdict, r07-youth-2023-04-04-pan-jiahua-verdict, t02-chinanews-2024-05-29-he-zehua-verdict, t02-cctv-2025-05-21-ling-chengxing-verdict]
    - h: 后续影响：2023年巡视与“靠烟吃烟”专项整治
      from: 2023-10
      to: 2025-02
      text: '2023年10月至12月，中央第八巡视组对国家烟草专卖局党组开展巡视，2024年3月反馈意见。此后烟草局公布整改进展，把“靠烟吃烟”问题专项整治放在首位：制定行业人员与供应商交往行为规则，制定修订行业层面制度50多项、各直属单位相关制度2100余项；同时加大干部交流，对有关问题信访件全面起底排查，“坚决查处拉帮结派、请客送礼等问题”。2024年1月，二十届中央纪委三次全会把烟草与金融、国企、体育、医药等并列为重点整治领域。'
      cites: [cs2-bjd-2025-02-21-tobacco-rectify, cs2-qq-2024-01-09-tobacco-inspection, cs2-ccdi-2024-01-10-ccdi-3rd-plenum]
  editor:
    - text: '烟草系统的落马者看不出与高层政治斗争的直接联系：通报没有团伙或派系方面的定性，指控集中在用人、采购、亲属经商和违规收受上。连续几轮巡视点出的“家族式腐败突出”“近亲繁殖”，说明它更像一个封闭行业内部的利益网络。真正值得注意的是潘家华：他本人就是派驻烟草局的纪检组组长，监督者与被监督者一起成了问题的一部分。'
      cites: [cs2-sina-2020-12-29-tobacco-kingdom, cs2-jiemian-2024-12-tobacco-five-tigers, r07-xinhua-2021-11-13-pan-jiahua-expel]
    - text: '制度根源在于专卖体制本身：同一套班子既是监管者又是经营者，既管专卖执法又管企业利润，外部监督又弱。界面新闻引述北京大学的庄德水说，人事腐败和“近亲繁殖”是国企选人用人的一大顽疾，建议招聘由国资委统一监督、公开信息，“淡化企业的家族化色彩”；他也认为烟草行业资源富集、权力集中，未来仍将是反腐重点。日经亚洲则形容这个行业利润巨大、垂直管理，是滋生犯罪的温床。'
      cites: [cs2-sina-2020-12-29-tobacco-kingdom, cs2-jiemian-2024-12-tobacco-five-tigers, cs2-nikkei-2023-05-30-tobacco]
    - text: '官方处理的路径是先查人，再整改体制：一方面在巡视进驻后迅速查办局长一级的官员，以示“老虎”不分在职与退休；另一方面没有触动专卖体制本身，而是在体制内“分权+制权”，用制度清单、干部交流和供应商交往规则来压缩寻租空间。这与对金融、医药等“资金密集、资源富集”行业的处理方式一致。'
      cites: [cs2-qq-2024-01-09-tobacco-inspection, cs2-sina-2020-12-29-tobacco-kingdom, cs2-bjd-2025-02-21-tobacco-rectify, cs2-gov-2023-01-10-ccdi-2nd-plenum]
  voices:
    - voice: official
      text: '将党和人民赋予的公权力异化为谋取私利的工具，靠烟吃烟、收钱敛财'
      cite: t02-ccdi-2024-04-22-ling-chengxing-expel
      quote: true
    - voice: official
      text: '中央第二巡视组2016年反馈称，烟草局党组对权力缺乏监督制约，存在系统性廉洁风险。'
      cite: cs2-sina-2020-12-29-tobacco-kingdom
    - voice: japan
      text: 'Huge profits, vertical management structure seen as breeding ground for crime'
      zh: '利润巨大、垂直管理的结构被视为犯罪的温床'
      cite: cs2-nikkei-2023-05-30-tobacco
      quote: true
    - voice: scholar
      text: '北京大学公共政策研究中心副主任庄德水说，烟草企业属于国有企业，这个行业资源比较富集、权力比较集中，相信未来反腐败也会继续保持现在的态势。'
      cite: cs2-jiemian-2024-12-tobacco-five-tigers
  events: [e10-2019-zhao-hongshun-tobacco]
  factions: []
  cites: [cs2-jiemian-2024-12-tobacco-five-tigers, cs2-sina-2020-12-29-tobacco-kingdom, cs2-bjd-2025-02-21-tobacco-rectify, t02-ccdi-2024-04-22-ling-chengxing-expel]

- id: demotions-2016
  title: 2016年“断崖式降级”通报：十名中管干部
  kind: cluster
  years: '2014–2019'
  people: [liu-lizu, xu-aimin, yan-shiyuan, han-zhiran, sun-qingyun, zhang-yun-abc, liu-zhiyong-gx, zhu-fushou, cao-jianfang, fan-jian, zhang-tianxin, zhao-zhiyong, li-liguo, luo-min]
  summary: '2016年1月29日，中央纪委通报，2015年“依纪依规给予10名中管干部党纪重处分，并作出重大职务调整”，这是中纪委首次“批量”公布中管干部的重处分和降级名单。10人中5人被开除党籍，通报均未提及移送司法；江西省政协原副主席刘礼祖“从副省级降为科员”。这种被媒体称为“断崖式降级”的处理，被官方解释为“四种形态”的第三种，用来处理违纪严重但尚未进入司法程序的高官。'
  sections:
    - h: 起因：从张田欣开始的“断崖式”说法
      from: 2014-07-16
      to: 2015-02
      text: '2014年7月16日，中央纪委通报云南省委原常委、昆明市委原书记张田欣“失职渎职造成国有资产损失”，给予开除党籍处分，“取消其副省级待遇，降为副处级非领导职务”。同一天，江西省委原秘书长赵智勇被降为科员。人民网称，此后对严重违纪被重处分、一降多级的干部，媒体都冠以“断崖式”降级的字眼。2015年2月，江西省政协原副主席许爱民被开除党籍、降为副处级。按人民论坛网转载的新京报评论，降级处分在十八大之前不常用，“偶尔有降级，降幅基本不超过3级”。'
      cites: [t01-ccdi-2014-07-16-zhang-tianxin-expel, r01-ccdi-2014-07-16-zhao-zhiyong-expel, cs2-people-2016-01-29-ccdi-cliff-explain, r02-ccdi-2015-02-17-xu-aimin-expel, cs2-rmzxw-2016-02-01-bjnews-comment]
    - h: 经过：中纪委的解释与“四种形态”
      from: 2015-07
      to: 2016-01-15
      text: '2015年7月，中央出台《推进领导干部能上能下若干规定（试行）》，首次以党内法规形式明确干部“下”的标准、方式和渠道。2016年1月15日，中央纪委案件审理室主任罗东川在解读十八届中央纪委六次全会时说，“断崖式处理”是新闻媒体形象的说法，实际是对严重违纪的被审查人给予撤销党内职务、留党察看或开除党籍等重处分，同时作出重大职务调整，“如从省部级降为局级，有的降为处级，有的降为科级”，属于“四种形态”中的一种。人民网解释，这对应“四种形态”的第三种。'
      cites: [cs2-chinanews-2016-04-01-up-down, cs2-chinanews-2016-01-15-luo-dongchuan, cs2-people-2016-01-29-ccdi-cliff-explain]
    - h: 涉案人和关系：十个人、几条线索
      from: 2016-01-29
      to: 2016-01-29
      text: '1月29日的通报列出10人：江西省政协原副主席许爱民、刘礼祖，山东省委原常委颜世元，内蒙古自治区政协原副主席韩志然，陕西省政协原副主席孙清云，农业银行原行长张云，广西壮族自治区政协原副主席刘志勇，东风汽车公司原总经理朱福寿，云南省委原秘书长曹建方，国家税务总局原总经济师范坚。其中5人被开除党籍，4人留党察看二年，1人撤销党内职务。新京报统计，7人属于连降数级：刘礼祖处分最重，“从副省级降为科员”；许爱民、曹建方、范坚降为副处级，孙清云降为正处级；张云由农行按部门副职以下安排工作。10人中5人来自政协系统，5人是首次被披露严重违纪。10人并无共同的案件线索：据媒体报道，颜世元长期是济南市委原书记王敏的直接下属，韩志然卷入内蒙古宋文代案，张云曾被农行原副行长杨琨当庭举报，曹建方的问题则与其在财政厅的旧部罗敏落马有关。'
      cites: [r02-ccdi-2016-01-29-ten-cadres, cs2-xinhua-2016-01-30-bjnews-ten, cs2-people-2016-01-29-ten-detail, r03-wiki-yan-shiyuan, r03-wiki-han-zhiran, r03-wiki-zhang-yun-abc, r03-wiki-cao-jianfang]
    - h: 处理结果：党纪重处分代替刑事追诉
      from: 2016-01-29
      to: 2019-01-02
      text: '中央纪委称，处理时综合考虑了“违纪行为的性质和情节、造成的后果和影响、认错悔错态度”以及配合审查、退缴违纪所得等情况。按公务员相关规定，受降级处分后24个月内不得晋升职务、级别和工资档次，解除处分也“不视为恢复原级别、原职务”。新京报评论说，断崖式降级对“处在错与罪回旋地带、违纪严重但又不至于动用司法程序的官员”已成常用处分手段。但降级并不总是终点：曹建方被安排到云南省农垦总局任副调研员，2019年1月2日又被云南省监委以涉嫌受贿犯罪取消退休待遇、移送检察机关。'
      cites: [r02-ccdi-2016-01-29-ten-cadres, cs2-people-2016-01-29-ten-detail, cs2-rmzxw-2016-02-01-bjnews-comment, r03-ccdi-2019-01-04-cao-jianfang, r03-wiki-cao-jianfang]
    - h: 后续影响：从“断崖”到“能上能下”
      from: 2016-01
      to: 2017-02
      text: '官方媒体把这种处分的作用概括为“惩戒一个、警醒一片”，因为领导干部谁都不想“奋斗一辈子，断崖一下子”。据中新网引述的媒体统计，到2016年4月，十八大以来遭遇级别“跳水”的中管干部已达15人，其中7人被开除党籍；国家行政学院教授李拓称这是“中央在干部能上能下问题上的一种新的制度探索”。2017年2月，民政部原部长李立国因所辖单位发生系统性腐败被降为副局级非领导职务，降级从惩处违纪者扩展到问责失职的官员。'
      cites: [cs2-huanqiu-2016-01-30-four-forms, cs2-chinanews-2016-04-01-up-down, r03-ccdi-2017-02-08-li-liguo-dou-yupei]
  editor:
    - text: '这批人大多是副省级官员，一半在政协任上，其中多数已离开实权岗位，案发于各自的地方或行业。从公开材料看，他们分别牵连于王敏案、宋文代案、杨琨案、罗敏案等不同的腐败线索，没有共同的派系背景。把他们放在一起公布，主要是为了展示一种处分方式，而不是清算某个圈子。'
      cites: [cs2-xinhua-2016-01-30-bjnews-ten, r03-wiki-yan-shiyuan, r03-wiki-han-zhiran, r03-wiki-zhang-yun-abc, r03-wiki-cao-jianfang]
    - text: '断崖式降级的依据是“四种形态”：纪委用党纪重处分加职务调整来处理“违纪严重但又不至于动用司法程序”的人，把多数案件留在党内解决。这扩大了纪委的裁量空间：违纪事实大多不公开（人民网称当时只能查到许爱民的官方通报），降到哪一级也没有公开标准。人民论坛网转载的评论还指出，要让降级在地方普遍落地，“需地方相关部门跟上”。'
      cites: [cs2-rmzxw-2016-02-01-bjnews-comment, cs2-people-2016-01-29-ten-detail, cs2-people-2016-01-29-ccdi-cliff-explain]
    - text: '选择在六次全会后不久“批量”公布，中国纪检监察学院原副院长李永忠认为，是为了体现习近平在全会上“把纪律建设摆在更加突出位置，坚持纪严于法、纪在法前”的要求。中纪委2015年的说法是“该降级的予以降级，这应成为纪律检查工作的重头，而立案审查、移交司法则应是少数”。降级而不入刑，既维持了震慑，也符合官方“惩前毖后、治病救人”的表述。'
      cites: [cs2-xinhua-2016-01-30-bjnews-ten, cs2-rmzxw-2016-02-01-bjnews-comment, r02-ccdi-2016-01-29-ten-cadres]
  voices:
    - voice: official
      text: '通常情况下，一名干部一步一脚印，成长为省部级领导干部要很长的时间，而反过来从省部级降为处级科级，就像“一瞬间”从山巅一下子跌落到谷底。'
      cite: cs2-people-2016-01-29-ccdi-cliff-explain
      quote: true
    - voice: official
      text: '中央纪委案件审理室主任罗东川说，“断崖式处理”是新闻媒体形象的说法，属于纪委提出的“四种形态”中的一种。'
      cite: cs2-chinanews-2016-01-15-luo-dongchuan
    - voice: scholar
      text: '中国纪检监察学院原副院长李永忠对新京报说，中纪委首次“批量”通报10名中管干部受到党纪重处分，体现了六次全会提出的从严治党要求。'
      cite: cs2-xinhua-2016-01-30-bjnews-ten
    - voice: scholar
      text: '国家行政学院教授李拓认为，“断崖式”降级处分是中央在干部能上能下问题上的一种新的制度探索。'
      cite: cs2-chinanews-2016-04-01-up-down
    - voice: zh
      text: '香港《东方日报》报道称，十名被降职高官中有副部级高官降为科员，连降七级。'
      cite: cs2-orientaldaily-2016-01-30-ten
  events: [e10-2016-ten-cadres-demoted]
  factions: []
  cites: [r02-ccdi-2016-01-29-ten-cadres, cs2-people-2016-01-29-ccdi-cliff-explain, cs2-xinhua-2016-01-30-bjnews-ten, cs2-rmzxw-2016-02-01-bjnews-comment]

- id: guizhou
  title: 贵州官场“塌方”：从廖少华到孙志刚
  kind: cluster
  years: '2002–2026'
  people: [sun-zhigang, wang-fuyu, li-zaiyong, zhou-jiankun, qin-rupei, pu-bo, liao-shaohua, kong-lingzhong, wu-shenghua, liu-fangren, huang-yao, xu-lin, wang-xiaoguang, chen-yan]
  summary: '贵州是十八大后官场“塌方”最严重的省份之一：从2013年巡视发现的遵义市委书记廖少华，到2018年的副省长王晓光、蒲波，再到2021年以后的省政协主席王富玉、副主席周建琨和李再勇、前省委书记孙志刚、前常务副省长秦如培，省部级官员接连落马。官方把孙志刚、李再勇、周建琨等案并列为警示，要求“坚决查处政治问题和经济问题交织的腐败”；李再勇主政六盘水三年多，当地新增债务1500亿余元，被视为“好大喜功、盲目举债的负面典型”。'
  sections:
    - h: 前史：刘方仁与黄瑶
      from: 1993
      to: 2010-12
      text: '贵州的高层腐败并非始于十八大。1993年至2002年任省委书记的刘方仁，2004年6月因受贿677万余元被判无期徒刑，其中部分是伙同儿媳收受。2009年，省政协主席黄瑶被查，2010年12月以受贿954万余元被判死缓。自由亚洲电台的专栏统计，刘方仁之后的钱运录、石宗源、栗战书、赵克志、陈敏尔、孙志刚、谌贻琴七任省委书记中，“7个人里竟然有5个都先后晋升为党和国家领导人”。'
      cites: [p03-zqb-2004-06-30-liu-fangren, k03-chinanews-2009-10-24-huang-yao-probe, k03-xinhua-2010-12-09-huang-yao-verdict, cs2-rfa-2024-08-30-guizhou]
    - h: 巡视之后：廖少华、孔令中、王晓光、蒲波
      from: 2013-05
      to: 2018-11
      text: '2013年5月至7月，中央第六巡视组巡视贵州；10月28日，省委常委、遵义市委书记廖少华被查，成为首位被查的省委常委兼地级市委书记，而他此前一度被视为“廉政标兵”“反腐先锋”。2016年4月，省政协副主席孔令中受留党察看一年、行政撤职处分，降为正厅级非领导职务。2018年4月和5月，省委常委、前副省长王晓光和副省长蒲波先后被查。王晓光被指“热衷于阅看有严重政治问题的境外书刊，拉票助选，封官许愿”，违规推动国家明令禁止的高尔夫球场项目，还“痴迷兰花”，通报称他是“政治问题与经济问题相互交织”的典型。蒲波刚从四川调来贵州，被指以“大赌”“假赌”敛取钱财，“严重破坏任职地区的政治生态”。'
      cites: [t01-chinacourt-2015-04-09-liao-shaohua-verdict, r03-ccdi-2016-04-19-kong-lingzhong, r04-ccdi-2018-04-01-wang-xiaoguang-probe, r04-ccdi-2018-09-20-wang-xiaoguang-expel, t02-ccdi-2018-05-04-pu-bo-probe, t02-ccdi-2018-11-02-pu-bo-expel]
    - h: 经过：二十大前后的连环落马
      from: 2021-02
      to: 2026-01
      text: '2021年2月21日，已卸任三年的省政协原主席王富玉被查，通报称他“直至退休后仍大肆收钱敛财”。2023年3月27日，省政协副主席李再勇被查；6月，省政协原副主席周建琨被开除党籍；8月28日，已调任全国人大财经委的贵州省委原书记孙志刚被查。2024年4月16日，从贵州常务副省长转任广西的秦如培被查。2025年7月，省委常委、毕节市委书记吴胜华在任上被查，2026年1月被开除党籍。自由亚洲电台的专栏说，同一届省政协就有李再勇、周建琨、陈晏三名副主席落马，认为贵州官场的塌方“比当年山西省的官场塌方程度更甚”。'
      cites: [t02-ccdi-2021-02-21-wang-fuyu-probe, t02-ccdi-2021-08-16-wang-fuyu-expel, r05-ccdi-2023-03-27-li-zaiyong-probe, r05-ccdi-2023-06-09-zhou-jiankun-expel, r05-ccdi-2023-08-28-sun-zhigang-probe, r06-ccdi-2024-04-16-qin-rupei-probe, k05-chinanews-2026-01-07-wu-shenghua, cs2-rfa-2024-08-30-guizhou]
    - h: 涉案人和关系：举债、政绩工程与“七个有之”
      from: 2013
      to: 2023
      text: '这一轮案件的共同点是政绩工程和地方债。李再勇主政六盘水三年多，当地新增债务1500亿余元，2013年到2017年的债务增长率超过300%；他在警示片里说，自己“认为离中管干部只有最后一步了，希望搞一些大手笔、大动作，搞一点大动静，这样才能够引起上级的关注”。法院认定他强令开工旅游开发项目，造成生态破坏损失8645万余元。秦如培被指“违规举债，瞒报债务”“弄虚作假，欺瞒上级”；吴胜华被指落实防范化解地方债务风险的部署不力。政治定性上，孙志刚、周建琨、秦如培的通报都有搞“七个有之”的表述：孙志刚还被指任人唯亲、在干部考察中搞非组织活动，周建琨被指利用扶贫项目谋私、“大搞权力寻租和家族式腐败”。'
      cites: [cs2-jiemian-2024-01-li-zaiyong-film, r05-chinacourt-2024-08-li-zaiyong-verdict, r06-xinhua-2024-10-11-qin-rupei-expel, r06-xinhua-2026-01-07-wu-shenghua-expel, r05-ccdi-2024-02-05-sun-zhigang-expel, r05-ccdi-2023-06-09-zhou-jiankun-expel]
    - h: 处理结果
      from: 2015-04
      to: 2025-08
      text: '2015年4月9日，廖少华在西安被判有期徒刑16年。2019年4月23日，王晓光以受贿4870万余元、贪污480万余元和内幕交易获利1.63亿余元，被重庆市第一中级法院决定执行有期徒刑20年，并处罚金1.735亿元；7月18日，蒲波以受贿7126万余元在南京被判无期徒刑。2022年1月17日，王富玉以受贿4.34亿余元、离职后利用影响力受贿1735万余元被判死缓。2024年3月26日，周建琨以受贿1.08亿余元被判无期徒刑；8月13日，李再勇被认定受贿4.32亿余元（大部分未实际取得）并滥用职权，被判死缓；10月29日，孙志刚以受贿8.13亿余元被判死缓并终身监禁。2025年8月6日，秦如培以受贿2.16亿余元被判死缓。'
      cites: [t01-chinacourt-2015-04-09-liao-shaohua-verdict, r04-court-2019-04-23-wang-xiaoguang-verdict, t02-chinacourt-2019-07-pu-bo-verdict, t02-bjnews-2022-01-17-wang-fuyu-verdict, r05-xinhua-2024-03-26-zhou-jiankun-verdict, r05-chinacourt-2024-08-li-zaiyong-verdict, k05-chinanews-2024-10-29-sun-zhigang, r06-court-2025-08-06-qin-rupei-verdict]
    - h: 后续影响：警示教育与“10个教训”
      from: 2024-05-27
      to: 2024-07
      text: '2024年5月27日，贵州省召开警示教育大会，省委书记徐麟要求各级领导干部以孙志刚、李再勇、周建琨等案为镜鉴，深刻汲取“10个教训”。7月，省纪委书记李元平在《中国纪检监察》撰文，要求“把严惩政商勾连腐败作为攻坚战重中之重”，清除对党不忠诚不老实的“两面人”，严密防范政治隐患。据该刊报道，当年上半年贵州已有85名省管干部被立案。'
      cites: [cs2-jiemian-2024-08-13-li-zaiyong]
  editor:
    - text: '官方对贵州案件的定性同时强调政治问题：孙志刚被指违背“两个维护”、阳奉阴违、搞“七个有之”，王晓光阅看境外书刊、拉票助选，省纪委要求清除“两面人”、防范政治隐患。但官方没有把这些人归为同一个团伙。海外评论则把焦点放在提拔他们的上级：自由亚洲电台的专栏指出，刘方仁之后七任书记中有五人进入党和国家领导人行列，暗示问题与历任主政者的用人有关。这一推论没有官方材料支持，本站只作为评论观点列出。'
      cites: [r05-ccdi-2024-02-05-sun-zhigang-expel, r04-ccdi-2018-09-20-wang-xiaoguang-expel, cs2-jiemian-2024-08-13-li-zaiyong, cs2-rfa-2024-08-30-guizhou]
    - text: '制度上的症结是举债驱动的政绩竞争。李再勇自己说得很直白：“如果当时我借的这笔钱要由我来还，我肯定不会去借，但是由政府来还我就去借了”，干部几年一换岗，债务留给继任者，“有点击鼓传花的味道”。在一个财力薄弱、依赖投资和矿产的省份，工程承揽、土地征收和矿产资源审批是主要的寻租环节，这也是吴胜华、李再勇等人受贿的主要领域。'
      cites: [cs2-jiemian-2024-01-li-zaiyong-film, r05-chinacourt-2024-08-li-zaiyong-verdict, r06-xinhua-2026-01-07-wu-shenghua-expel]
    - text: '这些案件多是在当事人离开贵州或退休之后才查办：王富玉卸任三年后被查，孙志刚已调到全国人大，秦如培已调到广西。这说明巡视在持续追溯旧账。同时，化债被纳入政治纪律，“落实党中央关于防范化解地方债务风险的重大决策部署不力”成了新的问责条目。量刑上，孙志刚、王富玉、李再勇都因如实供述、立功或自首而获死缓，没有人被判处死刑立即执行。'
      cites: [t02-bjnews-2022-01-17-wang-fuyu-verdict, k05-chinanews-2024-10-29-sun-zhigang, r06-ccdi-2024-04-16-qin-rupei-probe, r06-xinhua-2026-01-07-wu-shenghua-expel, r05-chinacourt-2024-08-li-zaiyong-verdict]
  voices:
    - voice: official
      text: '要汲取孙志刚、李再勇、周建琨等案深刻教训，把严惩政商勾连腐败作为攻坚战重中之重，坚决查处政治问题和经济问题交织的腐败'
      cite: cs2-jiemian-2024-08-13-li-zaiyong
      quote: true
    - voice: witness
      text: '如果当时我借的这笔钱要由我来还，我肯定不会去借，但是由政府来还我就去借了，反正过几年一换（岗位），一拍屁股走人，后边继任者谁来接谁承担责任，有点击鼓传花的味道。'
      cite: cs2-jiemian-2024-01-li-zaiyong-film
      quote: true
    - voice: witness
      text: '我变成这样是因为自己没有约束好自己，贪婪地大肆收受贿赂，使自己走上了违法犯罪的道路'
      cite: t01-chinacourt-2015-04-09-liao-shaohua-verdict
      quote: true
    - voice: zh
      text: '自由亚洲电台专栏称，贵州已有省委书记孙志刚、省政协主席王富玉两名正省部级官员落马，同届省政协副主席落马三人，塌方程度超过当年的山西。'
      cite: cs2-rfa-2024-08-30-guizhou
  events: [e08-2024-hidden-debt-swap, e10-2023-sun-zhigang-fall]
  factions: []
  cites: [cs2-jiemian-2024-08-13-li-zaiyong, cs2-jiemian-2024-01-li-zaiyong-film, cs2-rfa-2024-08-30-guizhou, r05-ccdi-2024-02-05-sun-zhigang-expel, t02-ccdi-2021-08-16-wang-fuyu-expel]

- id: yunnan-collapse
  title: 云南官场“塌方”：两任省委书记与四任昆明市委书记
  kind: cluster
  years: '2001–2024'
  people: [bai-enpei, qin-guangrong, qiu-he, shen-peiping, zhang-tianxin, cao-jianfang, yang-chongyong, huang-yi-yunnan, cui-maohu, li-shisong, li-jiating, chen-hao, zhou-yongkang, zhao-shijie, gao-jinsong, su-hongbo, jiang-zhaogang, wan-renli]
  summary: '十八大后，云南连续两任省委书记白恩培、秦光荣和连续四任昆明市委书记杨崇勇、仇和、张田欣、高劲松被查，全省至少8名省部级官员落马，是全国唯一一个连续四任省会市委书记落马的省份。官方把根源归于白恩培、仇和的“余毒”，以及秦光荣时期的山头主义和政治掮客苏洪波，2017年起要求“坚决肃清白恩培、仇和等余毒影响，彻底净化云南政治生态”。'
  sections:
    - h: 前史：李嘉廷与“云南失去的10年”
      from: 1994
      to: 2011-08
      text: '2003年5月，云南省原省长李嘉廷以受贿1810万余元被判死缓，部分贿款是伙同其子收受的。2001年10月起，白恩培任云南省委书记长达十年，《中国新闻周刊》称这段时间被称为“云南失去的10年”。2007年12月，“明星官员”仇和从江苏调任云南省委常委、昆明市委书记，此后白恩培越来越器重仇和，与时任省长秦光荣的矛盾据报道“近乎公开化”。2011年8月，秦光荣接任省委书记，至2014年10月离任。'
      cites: [p03-chinanews-2003-05-09-li-jiating, cs2-chinanews-2019-06-22-yunnan-decode]
    - h: 经过：2014—2015年的连环落马
      from: 2014-07
      to: 2015-12
      text: '2014年7月，省委常委、昆明市委原书记张田欣被开除党籍、降为副处级；8月，原副省长沈培平被开除党籍；8月29日，已调任全国人大环资委副主任委员的白恩培被查，中央纪委称他的问题是通过巡视发现的。2015年2月，云南省委常委会在专题民主生活会上说，“白恩培、张田欣、沈培平这些身边的腐败警示我们”，并部署“六个严禁”专项整治。3月15日，省委副书记仇和被查；4月，昆明市委书记高劲松被查，BBC称他已是连续第三任落马的昆明市委书记，官场传出“昆明市委书记难当”的说法。12月，曹建方被免去省委秘书长职务。'
      cites: [t01-ccdi-2014-07-16-zhang-tianxin-expel, r01-ccdi-2014-08-06-shen-peiping-expel, c03-people-2014-08-29-bai-enpei-probe, c03-people-2015-01-13-bai-enpei-expel, cs2-chinanews-2015-02-14-yunnan-dem-life, c03-ccdi-2015-03-15-qiu-he-probe, cs2-bbc-2015-04-11-gao-jinsong, r03-wiki-cao-jianfang]
    - h: 涉案人和关系：矿权、周滨与“唯圈”论
      from: 2000
      to: 2014
      text: '法院认定，白恩培在房地产开发、获取矿权、职务晋升等事项上为他人谋利，直接或通过其妻收受财物约2.47亿元。BBC报道，周永康曾要求白恩培关照其子周滨参与的一个铅锌矿收购项目，该项目最终被四川富豪刘汉以超低价格收购；白恩培任青海省委书记时的副省长蒋洁敏后来也是周永康的亲信，因此有媒体称白恩培与周永康关系密切。仇和受贿2433.98万元，并有索贿情节。杨崇勇、仇和、张田欣、高劲松四人从2003年6月到2015年4月前后主政昆明长达12年。秦光荣时期，中央纪委网站称其用人搞“唯圈”论，曹建方、蒋兆岗、万仁礼等圈子里的人获得提拔重用。'
      cites: [c03-people-2016-10-09-bai-enpei-verdict, cs2-bbc-2016-10-09-bai-enpei, f04-bbc-2014-08-29-bai-enpei, c03-xinhua-2016-12-15-qiu-he-verdict, cs2-chinanews-2019-06-22-yunnan-decode, cs2-ccdi-2020-05-06-su-hongbo]
    - h: 秦光荣投案与政治掮客苏洪波
      from: 2019-04-06
      to: 2020-05
      text: '2019年4月6日，秦光荣主动到中央纪委国家监委投案，是中央纪委国家监委发布的第一个投案自首的原省部级一把手；9月他被开除党籍，通报称他“严重破坏党的组织路线，扭曲用人导向，大搞迷信活动”。2020年5月，中央纪委网站披露，商人苏洪波长期充当云南“地下组织部长”，秦光荣亲切地称他“洪波”。秦光荣在忏悔录中写道，“作为省委书记，我的这些行为，助长了云南个别干部找靠山”，并承认想通过苏洪波攀高枝、谋取更高职位。中央纪委网站评论说，秦光荣“不仅没有肃清白恩培的恶劣影响”，反而换个形式滋长山头主义和帮派现象。'
      cites: [c03-ccdi-2021-01-19-qin-guangrong-verdict, c03-ccdi-2019-09-26-qin-guangrong-expel, cs2-ccdi-2020-05-06-su-hongbo]
    - h: 处理结果
      from: 2015-12
      to: 2024-12
      text: '2015年12月，沈培平以受贿1615万元被北京市第一中级法院判处有期徒刑12年。2016年10月9日，安阳中院以受贿约2.47亿元和巨额财产来源不明罪判处白恩培死缓，期满减为无期徒刑后终身监禁，BBC称中国媒体称他为“终身监禁第一官”。12月15日，仇和在贵阳被判有期徒刑14年6个月。2019年1月，已降为副调研员的曹建方被移送检察机关。2021年1月19日，秦光荣因自首、受贿2389万余元，被成都中院减轻判处有期徒刑7年。此后余波未止：省政协原副主席黄毅2023年7月被判13年，曾任云南副省长的崔茂虎2024年7月被判11年，副省长李石松2024年12月被开除党籍，通报称他对统计造假失察。'
      cites: [t01-chinacourt-2015-12-shen-peiping-verdict, c03-people-2016-10-09-bai-enpei-verdict, cs2-bbc-2016-10-09-bai-enpei, c03-xinhua-2016-12-15-qiu-he-verdict, r03-ccdi-2019-01-04-cao-jianfang, c03-ccdi-2021-01-19-qin-guangrong-verdict, r05-nbd-2023-07-04-huang-yi-yunnan-verdict, t02-people-2024-07-23-cui-maohu-verdict, k06-xinhua-2024-12-17-li-shisong-expelled]
    - h: 后续影响：“肃清余毒”与孙小果案
      from: 2017-06
      to: 2020-05
      text: '2017年6月，中央第十一巡视组向云南反馈巡视“回头看”情况，指出云南肃清白恩培、仇和等余毒不彻底，组长徐令义还要求解决“烟、矿”独大局面。7月，省委书记陈豪主持理论学习中心组集中学习，承认问题根源在于过去很长一段时间“省委管党不严、治吏不严”，要求“坚决纠正只讲腐败问题不讲政治问题的倾向”。2019年，云南省高级法院原院长赵仕杰因在孙小果案再审中授意枉法裁判，被留党察看一年。2020年，秦光荣案后全省开展“肃流毒、除影响、清源头、树正气”专项整治。据云南媒体统计，2013年至2018年全省共立案省管干部280人。'
      cites: [cs2-yndaily-2017-07-06-yunnan-poison, cs2-chinanews-2019-06-22-yunnan-decode, r04-ccdi-2019-12-14-zhao-shijie-expel, cs2-ccdi-2020-05-06-su-hongbo]
  editor:
    - text: '云南是周永康案外围最明显的一个省：BBC报道的周滨矿权一事把白恩培与周永康联系在一起，但官方对白恩培的通报和判决都没有提到周永康，也没有使用团伙定性。官方的政治定性落在“政治生态”上，即“余毒”、山头主义、“唯圈”论，以及2017年省委要求的“坚决纠正只讲腐败问题不讲政治问题的倾向”。至于白、秦之间的矛盾和高劲松向白恩培买官的说法，只能视为媒体报道和传闻。'
      cites: [cs2-bbc-2016-10-09-bai-enpei, c03-people-2016-10-09-bai-enpei-verdict, cs2-yndaily-2017-07-06-yunnan-poison, cs2-ccdi-2020-05-06-su-hongbo, cs2-chinanews-2019-06-22-yunnan-decode]
    - text: '中国人民大学的毛昭晖认为，经济相对落后、市场竞争不充分的地区，卖官鬻爵更突出，也更容易出现群体性腐败，“一把手”一旦参与就会加速蔓延。云南经济倚重“烟、矿”，白恩培的受贿集中在房地产开发和矿权上；2015年省委部署的“六个严禁”，其中一条就是“严禁插手矿产资源开发利用”。'
      cites: [cs2-chinanews-2019-06-22-yunnan-decode, c03-people-2016-10-09-bai-enpei-verdict, cs2-chinanews-2015-02-14-yunnan-dem-life]
    - text: '两任书记的量刑差别很大：白恩培被判死缓并终身监禁，秦光荣因主动投案只被判7年，后者被当作投案自首可获从宽的示范。官方同时把云南当作“政治生态修复”的样板，多次召开专题民主生活会、开展专项整治，把对个案的清查延伸为对整个干部队伍的整风。'
      cites: [c03-people-2016-10-09-bai-enpei-verdict, c03-ccdi-2021-01-19-qin-guangrong-verdict, cs2-yndaily-2017-07-06-yunnan-poison, cs2-ccdi-2020-05-06-su-hongbo]
  voices:
    - voice: official
      text: '这些问题表明，白恩培、仇和等余毒依然影响着云南政治生态的改善。'
      cite: cs2-yndaily-2017-07-06-yunnan-poison
      quote: true
    - voice: witness
      text: '我担任省委书记后，不仅没有处理他，反而看重他所谓的关系背景，对其既讨好拉拢又忌惮畏惧'
      cite: cs2-ccdi-2020-05-06-su-hongbo
      quote: true
    - voice: scholar
      text: '一旦群体性腐败中‘一把手’参与其中，腐败将呈现加速度蔓延的态势。'
      cite: cs2-chinanews-2019-06-22-yunnan-decode
      quote: true
    - voice: west
      text: 'BBC中文网报道，周永康曾要求白恩培关照其子周滨参与的铅锌矿收购项目，并称中国媒体把白恩培称为“终身监禁第一官”。'
      cite: cs2-bbc-2016-10-09-bai-enpei
    - voice: zh
      text: '据《中国新闻周刊》引述云南消息人士（传闻）：昆明原市委书记高劲松曾花费100万直接向白恩培买官，“这在当地官场几乎尽人皆知”。'
      cite: cs2-chinanews-2019-06-22-yunnan-decode
    - voice: west
      text: '据BBC转述《环球时报》引述的一名不具名厅级干部（传闻）：云南官场传闻高劲松曾向白恩培行贿买官。官方从未公布高劲松的具体违纪内容。'
      cite: cs2-bbc-2015-04-11-gao-jinsong
