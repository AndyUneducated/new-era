# CS7 — navy and air force case articles
- id: navy-purge
  title: 海军：三任政委、装备线与没有宣布的继任者
  kind: system
  years: '2005–2026'
  people: [wang-shouye, ma-faxiang, wang-yu-navy, cheng-jie-pla, liu-xiaojiang, miao-hua, wu-shengli, li-hanjun, shen-jinlong, yang-shiguang, xu-caihou, qin-shengxiang, song-xue-navy, ju-xinchun, li-shangfu, xu-xueqiang, wang-houbin, dong-jun, hu-zhongming, li-pengcheng, kong-jun, wang-zhongcai, lin-xiangyang, he-weidong, yuan-huazhi, wang-renhua, liu-qingsong, zhang-zheng-navy, zhang-youxia]
  summary: 2012年以来，海军先后有副政委马发祥离奇死亡、政治工作部主任杨世光据报被查；2023年起清洗加速，南部战区海军前后两任司令员鞠新春、李鹏程，海军参谋长李汉军，政委袁华智，已退役的前司令员沈金龙、前政委秦生祥，都以“涉嫌严重违纪违法”被罢免全国人大代表，海军出身的火箭军司令员王厚斌与袁华智同批被开除党籍、军籍。海军司令员胡中明2025年5月后不再出现在公开报道中，官方至今没有宣布继任者；2014年以来的三任政委苗华、秦生祥、袁华智全部出局。
  sections:
    - h: 前史：王守业、马发祥与第一批海军将领
      from: 2005-12
      to: 2015-11
      text: 海军高级将领落马并非始于十八大。2005年12月，分管后勤的海军副司令员王守业在海军司令部例会上被中央军委纪委“双规”，后被判无期徒刑；他的问题主要发生在此前任总后勤部基建营房部部长期间。十八大后的第一批海军案件集中在政工和装备口。2014年11月13日，海军副政委马发祥中将去世，美国之音引述《南华早报》称他在海军大院跳楼身亡，“这是三个月内，第二名解放军海军高官疑因涉嫌贪腐跳楼自杀”，跳楼说法未获官方正式确认；马发祥2004年至2008年任海军装备研究院政委，2011年起任海军政治部主任。2015年1月，北海舰队副参谋长程杰被军事检察机关立案侦查。同年9月，曾任海军装备研究院院长、时任南海舰队装备部部长的汪玉“因严重违纪、涉嫌犯罪”辞去全国人大代表职务，媒体称他被查与马发祥有关。
      cites: [c11-wiki-wang-shouye, c11-voa-2014-11-18-ma-faxiang, f09-rmzxw-2015-03-03-army-tigers, a01-wiki-wang-yu-navy, a01-npc-2015-11-04-report]
    - h: 苗华的海军三年与杨世光
      from: 2014-12
      to: 2017-08
      text: 2014年12月，兰州军区政委苗华接替刘晓江出任海军政委。苗华出身陆军第31集团军，并非海军出身；据法广引述《人民海军》报，同月29日的海军将官晋衔仪式由司令员吴胜利宣读命令、苗华主持，晋升少将的12名军官中就有后来的海军参谋长李汉军。2017年1月，吴胜利卸任，曾任南海舰队司令员的沈金龙接任海军司令员。同年4月，香港《星岛日报》称海军政治工作部主任杨世光中将约在4月5日被“双规”，他长期在海军从事政治工作，“可能被视为徐才厚余毒”，官方始终没有证实（见相关事件）。8月，原军委办公厅主任秦生祥接替苗华任海军政委。
      cites: [f06-thepaper-2015-02-27-generals-npc, b04-bbc-2025-10-nine-generals, f10-rfi-2025-06-27-li-hanjun, f10-wiki-shen-jinlong, a01-zaobao-2017-04-14-yang-shiguang, f10-wiki-qin-shengxiang]
    - h: 2023年：装备线上的鞠新春，跨军种的王厚斌与董军
      from: 2021-04
      to: 2023-12-29
      text: 2021年4月8日，海军军人代表大会以“涉嫌严重违纪违法”罢免海军原副参谋长宋学的全国人大代表职务；宋学曾任海军装备部副部长，是航母舰载机起降试验副总指挥，此后再无官方消息。2023年火箭军和装备系统案发后，海军最先被点名的也是一名装备干部。鞠新春2015年任南海舰队装备部部长，2021年调任中央军委装备发展部副部长兼载人航天工程副总指挥，2023年2月回任南部战区海军司令员，11月27日即被海军军人代表大会罢免全国人大代表。12月29日全国人大常委会公告的九名将领里，他是唯一的海军将领，其余多来自火箭军和装备发展部；政治大学教授寇健文当时指出，这批人“背景大多为技术军官，且集中在火箭军与装备采购系统”（详见火箭军专题、装备系统专题）。同一年海军向外输出了两名高级将领：7月，海军副司令员王厚斌出任火箭军司令员，台湾中央广播电台称“海軍出身的王厚斌，成為首位非火箭軍內升的司令員”；12月29日，前海军司令员董军出任国防部长，是首位海军出身的防长，海军司令员由胡中明接任。
      cites: [a01-guancha-2021-04-30-song-xue, a01-wiki-song-xue, f10-wiki-ju-xinchun, a02-wikisource-npc-qualification-reports, e04-bjd-2023-12-29-npc-generals, f10-dw-2023-12-29-nine-generals, c08-rti-2023-08-01-wang-houbin, u09-voa-2023-12-29-dong-jun, u09-cna-2023-12-30-dong-jun, k06-wiki-hu-zhongming]
    - h: 2024年至2025年上半年：南部战区海军司令员与海军参谋长
      from: 2024-11-25
      to: 2025-06-27
      text: 2024年11月25日，继鞠新春之后出任南部战区海军司令员的李鹏程也被海军军人代表大会罢免，12月25日公告（另说罢免日期为11月29日，见维基百科；本站以全国人大常委会代表资格审查委员会的报告为准）。李鹏程曾任海军装备研究院院长、东海舰队参谋长和海军副参谋长，2024年才到南部战区。同年11月27日，英国《金融时报》报道国防部长董军卷入反腐调查，中国国防部次日称报道纯属捏造，同一天宣布苗华停职检查（见相关事件）。2025年5月6日，海军军人代表大会以“涉嫌严重违纪违法”罢免海军参谋长李汉军，6月27日公告，同日全国人大常委会免去苗华的国家中央军委委员职务。东部战区一线的海军将领也出现空位：美国智库CSIS认为，曾任海军陆战队司令员的东部战区陆军司令员孔军到2025年1月下旬很可能已被清洗，东部战区副司令员兼战区海军司令员王仲才可能在3月前后与战区司令员林向阳一并出事，官方对孔军、王仲才都没有任何说法。
      cites: [a02-wikisource-npc-qualification-reports, f10-npc-2024-12-25-notice-8, f10-wiki-li-pengcheng, e06-zaobao-2024-11-28-dong-jun, a02-guancha-2025-08-20-li-hanjun, f10-rfi-2025-06-27-li-hanjun, b08-csis-2026-02-purges]
    - h: 2025年：政委袁华智出局，司令员胡中明不再露面
      from: 2025-05
      to: 2025-12-27
      text: 美国海军战争学院中国海事研究所统计，海军司令员胡中明自2025年5月起就没有出现在公开报道的海军官方活动中。9月15日，海军军人代表大会罢免海军政委袁华智的全国人大代表职务；10月17日，国防部宣布袁华智与何卫东、苗华等九名将领被开除党籍、军籍，称九人“严重违反党的纪律，涉嫌严重职务犯罪，数额特别巨大，性质极为严重，影响极其恶劣”，同批的还有海军出身的火箭军原司令员王厚斌（详见九上将专题）。10月的二十届四中全会上，胡中明没有出现在新闻画面中。11月5日福建舰在三亚入列，新华社通稿只写南部战区、海军等单位“负责同志参加仪式”，据中央社转述《金融时报》，3名原本被视为海军指挥链关键的军官没有现身（详见战区缺席专题）。11月10日，中央军委政法委员会军人代表大会罢免海军上将、军委政法委书记王仁华的全国人大代表职务，12月27日公告。
      cites: [cs7-cmsi-2026-07-zhang-zheng, a02-wikisource-npc-qualification-reports, b08-mod-2025-10-17-nine-generals, a02-bbc-2025-10-fourth-plenum-absent, cs7-mod-2025-11-07-fujian-carrier, a02-cna-2025-11-14-ft-fujian, f10-wiki-wang-renhua, f10-xinhua-2025-12-27-npc-notice-14]
    - h: 2026年：前司令员、前政委与没有宣布的继任者
      from: 2026-01-13
      to: 2026-08-03
      text: 2026年1月13日，海军军人代表大会罢免已卸任的前司令员沈金龙和前政委秦生祥的全国人大代表职务，两人的全国人大常委会委员和专门委员会副主任委员职务相应撤销；2月26日全国人大常委会公告，此后的公报写明原因是“涉嫌严重违纪违法”，并披露沈金龙罢免前任中央军委战略规划委员会专职委员。寇健文对联合早报说，按惯例应让退休将领当完本届人大代表，两人快七十岁时被拿下，“说明出事的可能性还是比较大”。至此，2014年以来的三任海军政委苗华、秦生祥、袁华智全部出局；2017年以来的三任司令员中，沈金龙被罢免，胡中明长期不见，只有董军仍在国防部长任上。海军领导层的接替没有正式宣布：中国海事研究所根据2026年2月海军春节慰问视频的座次判断，曾任山东舰航母编队司令员的海军参谋长张峥已在主持海军工作，坐在他身边的海军政治工作部主任可能代行政委职责，但承认官方媒体从未明确证实。2026年8月，联合早报仍把胡中明和海军上将、东部战区政委刘青松列在久未露面的将领中。
      cites: [a02-wikisource-npc-qualification-reports, f09-xinhua-2026-02-26-npc-notice-16, f10-wiki-shen-jinlong, f10-zaobao-2026-02-27-five-generals, cs7-cmsi-2026-07-zhang-zheng, cs7-wiki-zhang-zheng, k06-zaobao-2026-08-03-fifth-plenum-generals]
  editor:
    - text: 编者分析：把海军清洗与苗华联系起来，依据主要有三条。其一，BBC中文网称袁华智“是苗华担任海军政委时提拔的旧部”，王厚斌“也是苗华的海军旧部”，两人与苗华同批被开除；其二，法广指出李汉军2014年在苗华主持的仪式上晋升少将；其三，2026年被罢免的秦生祥是苗华在海军政委任上的直接继任者。这些只能说明任职交集：苗华在海军不到三年，晋衔仪式由政委主持是职务使然，官方通报从未把任何海军将领与苗华案并提。传闻来源走得更远（见各方说法），本站不作为事实采用。
      cites: [b04-bbc-2025-10-nine-generals, f10-rfi-2025-06-27-li-hanjun, f10-wiki-qin-shengxiang, b08-mod-2025-10-17-nine-generals]
    - text: 编者分析：与火箭军、装备系统清洗的交集更具体。被罢免或被查的海军将领中，不少人有海军装备口的履历：马发祥做过海军装备研究院政委，汪玉、李鹏程做过该院院长，宋学做过海军装备部副部长，鞠新春做过南海舰队装备部部长，2021年至2023年又在中央军委装备发展部任副部长，任内部长先后是李尚福和许学强。2023年鞠新春与火箭军、装备发展部将领同批公告，2025年王厚斌在火箭军司令员任上出局，说明海军不是这场清洗的旁观者，而是通过装备采购和人员交流卷入其中。不过，官方从未说明这些海军将领的具体问题，本站不能断定他们都涉及装备采购。
      cites: [c11-voa-2014-11-18-ma-faxiang, a01-wiki-wang-yu-navy, f10-wiki-li-pengcheng, a01-wiki-song-xue, f10-wiki-ju-xinchun, f10-dw-2023-12-29-nine-generals, f10-wiki-xu-xueqiang, c08-rti-2023-08-01-wang-houbin]
    - text: 编者分析：派系归属上，海军落马者分属几条线。杨世光被港媒称为“徐才厚余毒”，属郭徐一线；袁华智、王厚斌被归入苗华一线；王仲才、孔军出事的时间与东部战区司令员林向阳被拘大致相同，林向阳后来与何卫东、苗华同批被开除；沈金龙、秦生祥被罢免于张又侠落马前十余天，寇健文把它放在苗华、张又侠等人落马的大背景下解读，但没有可靠报道把两人与张又侠连在一起。可以确定的只是结果：到2026年，海军司令员、政委都没有正式宣布的在任者；BBC中文网2026年1月统计，全军仅剩的4名上将中，海军只有国防部长董军一人。
      cites: [a01-zaobao-2017-04-14-yang-shiguang, b04-bbc-2025-10-nine-generals, b08-csis-2026-02-purges, b08-mod-2025-10-17-nine-generals, f10-zaobao-2026-02-27-five-generals, f01-bbc-2026-01-27-zhang-youxia, cs7-cmsi-2026-07-zhang-zheng]
  voices:
    - { voice: official, text: 经查，这9人严重违反党的纪律，涉嫌严重职务犯罪，数额特别巨大，性质极为严重，影响极其恶劣, cite: b08-mod-2025-10-17-nine-generals, quote: true }
    - { voice: zh, text: 海軍出身的王厚斌，成為首位非火箭軍內升的司令員, cite: c08-rti-2023-08-01-wang-houbin, quote: true }
    - { voice: zh, text: 按正常惯例，应该会让退休将领当完这届人大代表，下一届才换掉。这个时候换，特别是那些快70岁被拿下的，说明出事的可能性还是比较大。, cite: f10-zaobao-2026-02-27-five-generals, quote: true }
    - voice: scholar
      text: 'Vice Admiral (VADM) Zhang Zheng (张峥) appears to have been promoted to the most senior billet in the People’s Liberation Army (PLA) Navy (PLAN). He seems to have taken up this responsibility as early as December 2025.'
      zh: 张峥中将似已升任解放军海军的最高职位，最早可能在2025年12月就已承担这一职责。
      cite: cs7-cmsi-2026-07-zhang-zheng
      quote: true
    - voice: scholar
      text: 'As of this writing, official CCP/PRC/PLA media outlets have not explicitly confirmed Zhang’s selection to lead the PLAN.'
      zh: 截至本文写作时，中共、中国政府和解放军的官方媒体都没有明确证实张峥已被选定领导海军。
      cite: cs7-cmsi-2026-07-zhang-zheng
      quote: true
    - voice: west
      text: 'By late January 2025, ETC Army Commander Lieutenant General Kong Jun was likely purged.'
      zh: 到2025年1月下旬，东部战区陆军司令员孔军中将很可能已被清洗。
      cite: b08-csis-2026-02-purges
      quote: true
    - { voice: zh, text: （传闻）TNT时报称，苗华落马后，其嫡系海军同僚与旧部纷纷出事。, cite: f09-tnt-2026-hu-zhongming }
    - { voice: zh, text: （传闻）大纪元2020年称，军委审计署曾审计前海军司令员吴胜利任职期间的经济责任；吴胜利此后仍出席了2020年国庆招待会，官方从未提及他有问题。, cite: b21-epoch-2020-06-26-wu-audit }
