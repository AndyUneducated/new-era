- id: air-force-purge
  title: 空军：从较少波及到2026年的罢免潮
  kind: system
  years: '2014–2026'
  people: [chen-hongyan, wang-sheng-pla, wang-yufa, zhu-hongda, tian-xiusi, xu-caihou, guo-boxiong, liu-yazhou, xu-qiliang, xi-jinping, ma-xiaotian, ding-laihang, wang-qiang-pla, han-shengyan, yang-zhibin, lin-xiangyang, zhang-youxia, liu-zhenli, xu-xisheng, liu-qingsong, liu-faqing, yu-zhongfu, miao-hua, guo-puxiao, xu-xueqiang, li-fengbiao, wang-kangping, li-shangfu, wang-gang-af, chang-dingqiu]
  summary: 十八大后的第一轮军中反腐里，空军先后有广州军区空军原政委王玉发、空军后勤部原部长朱洪达和空军原政委田修思上将落马，退役上将刘亚洲则在没有任何通报的情况下传出被判重刑。2023年起的火箭军、装备系统清洗中，空军长期只有前司令员丁来杭一人被罢免，空军将领反而在2025年接掌东部、中部两大战区；同年12月，军方首次针对空军公开征集违规采购线索，空军原政委于忠福被罢免。2026年5月，在任政委郭普校与空军出身的装备发展部部长许学强、联勤保障部队司令员王抗平同批被罢免全国人大代表，司令员常丁求久未露面后由王刚接任。
  sections:
    - h: 第一轮：郭徐案后的空军将领
      from: 2015-01
      to: 2017-10-14
      text: 十八大后的第一轮军中反腐里，空军落马者以后勤、政工干部为主。2015年2月，北京军区空军政治部副主任陈红岩、广州军区空军后勤部部长王声先后被军事检察机关立案侦查。同年8月，2006年至2012年任广州军区副政委兼战区空军政委、已退役的王玉发被撤销全国政协委员资格，9月被立案侦查。2016年3月31日，空军后勤部原部长朱洪达被撤销全国政协委员资格，财新称这意味着“空军落马将领增至四人”。级别最高的是田修思：他曾任成都军区政委、空军政委，2016年7月新华社报道他“因涉嫌严重违纪被立案审查”，2017年10月十八届七中全会确认开除其党籍。BBC中文网称，中国媒体注意到他与徐才厚、郭伯雄及薄熙来都有不少往来（郭徐案的整体脉络见郭徐之后专题）。
      cites: [f09-rmzxw-2015-03-03-army-tigers, a01-thepaper-2015-10-army-tigers-44, a01-wiki-wang-yufa, a01-caixin-2016-03-31-zhu-hongda, c03-xinhua-2016-07-09-tian-xiusi-probe, c03-bbc-2016-07-09-tian-xiusi, c03-xinhua-2017-10-14-seventh-plenum]
    - h: 刘亚洲：没有通报的上将
      from: 2021-12
      to: 2024-03-24
      text: 刘亚洲是李先念的女婿、军旅作家，2012年7月晋升空军上将，2017年从国防大学政委任上退休。美国之音称，2021年12月下旬北京就传出他和曾任空军武汉基地政治部主任的五弟刘亚武被捕的消息。2023年4月，联合早报转引香港《星岛日报》称，军委纪委已完成调查，将他移送军队司法系统，军方2月底还通知清除涉及他的图书、文章、题字和讲稿；2024年3月，美国之音引述旅美学者王军涛称他已被判处无期徒刑。官方至今没有发布任何立案、罢免或判决消息，法广称他实质处于“秘密失踪”状态。
      cites: [c05-zaobao-2023-04-14-liu-yazhou, c05-voa-2024-03-23-liu-yazhou, v01-rfi-2024-03-24-liu-yazhou]
    - h: 许其亮的空军
      from: 1988
      to: 2026-09-30
      text: 空军在相当长的时间里被视为较受信任的军种。许其亮1988年至1993年在驻福州的空军第八军历任代理副军长、参谋长、军长，与当时在福州任职的习近平有工作交集，后来官至军委副主席，2025年6月病逝。台湾学者沈明室对联合早报说，许其亮在习近平成为最高领导人后受到重用，“许其亮经手拔擢的空军将领也因此受到信任”。前空军司令员马晓天卸任后从未被点名，2026年9月30日国庆招待会的央视画面中仍有他。联合早报2025年12月总结，在持续两年多的反腐行动中，空军受到的影响相对小于其他军种。
      cites: [rl1-zaobao-2025-12-14-air-force, b21-zaobao-2026-09-30-reception, cs7-zaobao-2025-12-18-air-force-procurement]
    - h: 丁来杭：火箭军名单里的空军前司令员
      from: 2023-10
      to: 2023-12-29
      text: 2023年的火箭军、装备系统清洗中，空军唯一被点名的是2017年至2021年任空军司令员的丁来杭。中央社11月9日转述香港《明报》，称据传他正接受调查，涉及北京西郊机场的工程贪腐案，但也说“有關丁來杭的傳言未知真假”。12月4日，空军军人代表大会以“涉嫌严重违纪违法”罢免丁来杭的全国人大代表职务，他的全国人大常委会委员、华侨委员会副主任委员职务相应撤销；12月29日，他与火箭军、装备发展部的八名将领一并公告（详见火箭军专题）。此后官方再没有关于他的消息。另说他已被开除党籍、军籍，见BBC中文网2025年10月的统计；本站未见官方通报，不采用。
      cites: [cs7-cna-2023-11-09-ding-laihang, f07-wiki-ding-laihang, a02-wikisource-npc-qualification-reports, e04-bjd-2023-12-29-npc-generals, b04-bbc-2025-10-nine-generals]
    - h: 2025年：空军将领执掌战区，调出的空军将领消失
      from: 2025-07-31
      to: 2026-08-03
      text: 2025年，空军将领在全军的位置反而上升。7月31日建军节招待会上，空军出身的中部战区司令员王强缺席；9月3日抗战胜利80周年阅兵，总指挥没有按惯例由中部战区司令员担任，而由中部战区空军司令员韩胜延担任，BBC中文网引香港与新加坡媒体指出，王强与政委徐德清都未获选任阅兵指挥官，“而是由比他们低级的空军将领担任”。12月22日，杨志斌、韩胜延以东部、中部战区司令员身份晋升上将，财新称“两名空军将领杨志斌、韩胜延晋升上将军衔”；东部战区原司令员林向阳两个月前已被开除党籍、军籍。BBC中文网2026年1月统计，张又侠、刘振立被查后，全军仅剩的4名上将中韩胜延和杨志斌均为空军。与此同时，几名调往其他军种和战区的空军出身将领先后不见：2017年任南部战区空军政委、后任火箭军政委的徐西盛，从空军政治工作部副主任转任东部战区海军政委、后升任东部战区政委的刘青松，以及在空降兵部队起家、做过空降兵军军长的国防动员部原部长刘发庆，2026年8月都在联合早报或其转引的《明报》所列久未露面将领中。
      cites: [k06-wiki-wang-qiang-pla, a02-bbc-2025-10-fourth-plenum-absent, cs7-gov-2025-12-22-generals-promoted, cs7-caixin-2025-12-23-air-force-theaters, b08-mod-2025-10-17-nine-generals, f01-bbc-2026-01-27-zhang-youxia, k06-wiki-xu-xisheng, k06-wiki-liu-qingsong, k05-wiki-liu-faqing, k06-zaobao-2026-08-03-fifth-plenum-generals]
    - h: 2025年12月：空军采购线索与于忠福
      from: 2025-12-15
      to: 2026-02-26
      text: 空军本身的问题在2025年底浮出水面。12月15日，军队采购网发布公告，面向社会征集空军部队违规采购问题的线索；联合早报引《南华早报》称，“这是解放军首次针对某一具体军种提出此类公开征集请求”，此前装备发展部曾在2023年7月公开征集装备采购领域的线索（见装备系统专题）。一周后的12月22日，也就是杨志斌、韩胜延晋升上将的同一天，空军军人代表大会以“涉嫌严重违纪违法”罢免空军原政委于忠福的全国人大代表职务，2026年2月26日公告。于忠福2015年7月接替田修思任空军政委；联合早报指出，他2010年至2012年任兰州军区空军政治部主任，与同在兰州军区任政治部主任的苗华有交集。维基百科记载，时任空军政委郭普校缺席了12月22日的晋衔仪式。
      cites: [cs7-zaobao-2025-12-18-air-force-procurement, a02-wikisource-npc-qualification-reports, f09-xinhua-2026-02-26-npc-notice-16, f10-wiki-yu-zhongfu, rl1-zaobao-2025-12-14-air-force, f10-wiki-guo-puxiao]
    - h: 2026年：政委、装备发展部部长与联勤司令同批出局
      from: 2026-05-25
      to: 2026-07-03
      text: 2026年5月25日至29日，空军、中央军委装备发展部、西部战区、东部战区先后召开军人代表大会，以“涉嫌严重违纪违法”分别罢免空军政委郭普校、装备发展部部长许学强、西部战区原政委李凤彪和联勤保障部队司令员王抗平的全国人大代表职务，6月26日全国人大常委会公告。郭普校、许学强、王抗平是空军将领；李凤彪是陆军上将，但长期在空降兵第15军任职，做过军长。许学强2022年10月接替李尚福任装备发展部部长并兼任载人航天工程总指挥；王抗平2017年至2021年任空军武器试验基地司令员；郭普校2014年任空降兵第15军政委，2019年调任军委后勤保障部政委，2022年1月起任空军政委。7月3日，空军副司令员王刚以空军司令员身份晋升上将，财新称“常丁求不再担任空军司令员”。据中央社，常丁求、郭普校此前都已超过半年未公开露面，“空軍軍事工作實際上已由王剛主持”。官方从未说明常丁求的去向。
      cites: [a02-wikisource-npc-qualification-reports, c03-xinhua-2026-06-26-npc-notice-18, f10-jamestown-2026-07-six-generals, f10-wiki-li-fengbiao, f10-wiki-xu-xueqiang, f10-wiki-wang-kangping, f10-wiki-guo-puxiao, cs7-caixin-2026-07-03-wang-gang, k05-cna-2026-07-03-air-force]
  editor:
    - text: 编者分析：空军确实是较晚被波及的军种。依据是本站所收的官方罢免记录：2023年至2025年11月，被军人代表大会罢免全国人大代表的海军将领有鞠新春、李鹏程、李汉军、袁华智等多人，空军只有已退役的丁来杭一人；转折点在2025年12月，采购线索征集和于忠福被罢免发生在同一周。美国詹姆斯敦基金会2026年7月也写道，空军此前基本没有受到前几轮清洗波及，而这一轮六名将领中有三人是空军军官（见各方说法）。外界对原因的一种解释是许其亮的福建渊源和他对空军将领的提拔（沈明室），但这只是推测；于忠福与苗华在兰州军区的交集也说明，这种“安全”并不绝对。
      cites: [a02-wikisource-npc-qualification-reports, cs7-zaobao-2025-12-18-air-force-procurement, f10-jamestown-2026-07-six-generals, rl1-zaobao-2025-12-14-air-force]
    - text: 编者分析：与装备系统清洗的关系，在2026年的名单上最清楚。许学强是李尚福在装备发展部的继任者；王抗平在李尚福主管装备发展部期间任空军武器试验基地司令员；詹姆斯敦基金会还指出，李凤彪指挥过李尚福做过副司令员的战略支援部队。丁来杭2023年也是与火箭军、装备发展部将领同批公告的。2025年12月针对空军的采购线索征集，与2023年7月装备发展部的线索征集形式相同。台湾学者丁树范认为，从火箭军到装备发展部，“可能是一串粽子挖出来”。但官方对这些人都只写“涉嫌严重违纪违法”，没有说明具体问题，也没有说明丁来杭、于忠福、郭普校与装备采购有关。
      cites: [f10-jamestown-2026-07-six-generals, a02-zaobao-2026-08-07-six-generals, cs7-zaobao-2025-12-18-air-force-procurement, e04-bjd-2023-12-29-npc-generals, a02-wikisource-npc-qualification-reports]
    - text: 编者分析：派系归属上，詹姆斯敦基金会认为2026年这一轮的主线是清除张又侠的人脉，但也承认郭普校与张又侠派系没有明确关联；把许学强与张又侠连在一起的依据，是装备发展部部长一职从张又侠、李尚福传到许学强的职务链，而不是任何通报。另一条值得注意的线是空降兵：郭普校、李凤彪都在空降兵第15军担任过要职，刘发庆做过空降兵军军长，三人2026年或被罢免、或久未露面，但本站未见可靠报道把空降兵将领作为一个派系。刘亚洲则是另一类：太子党出身、以言论著称，报道把他的结局与腐败和言论联系起来，与这几轮反腐案件没有已知交集。
      cites: [f10-jamestown-2026-07-six-generals, k05-wiki-liu-faqing, k06-zaobao-2026-08-03-fifth-plenum-generals, c05-zaobao-2023-04-14-liu-yazhou]
  voices:
    - { voice: official, text: 近日，空军原政委田修思因涉嫌严重违纪被立案审查。, cite: c03-xinhua-2016-07-09-tian-xiusi-probe, quote: true }
    - { voice: zh, text: 沈明室指出，许其亮不仅与习近平相识，后来在习近平成为最高领导人后还受重用，许其亮经手拔擢的空军将领也因此受到信任。, cite: rl1-zaobao-2025-12-14-air-force, quote: true }
    - { voice: zh, text: 據指出，丁來杭涉及北京西郊機場的工程貪腐案, cite: cs7-cna-2023-11-09-ding-laihang, quote: true }
    - voice: scholar
      text: 'The PLA Air Force had been largely insulated from previous rounds of purges. Western analysts speculated that this was because Xi placed relatively more trust in the PLA Air Force.'
      zh: 解放军空军此前基本没有受到前几轮清洗的波及。西方分析人士推测，这是因为习近平相对更信任空军。
      cite: f10-jamestown-2026-07-six-generals
      quote: true
    - voice: scholar
      text: 'This suggests that Xi intends to make good on his promise to overhaul the PLA’s officer corps, and no affiliation carries a promise of safety.'
      zh: 这表明习近平打算兑现彻底整顿解放军军官队伍的承诺，任何派系归属都不能保证安全。
      cite: f10-jamestown-2026-07-six-generals
      quote: true
    - { voice: zh, text: 可能是一串粽子挖出来, cite: a02-zaobao-2026-08-07-six-generals, quote: true }
    - { voice: west, text: 刘亚洲出事被捕的案情和判决的相关情况，至今没有任何官方通报或证实, cite: c05-voa-2024-03-23-liu-yazhou, quote: true }
