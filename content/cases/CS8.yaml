# CS8 — military-industry and energy SOE chiefs, 2024–2026
- id: soe-chiefs-2024
  title: 军工、能源央企负责人：2024–2026年的连串去职
  kind: cluster
  years: '2023–2026'
  people: [cao-jianguo, zhang-dongchen, zeng-yi, fan-youshan, liu-guoyue, yu-peigen, ma-zhengwu, wang-xinghuan, gao-tao, zhang-hongwen, liu-cangli, zhou-xinmin, luo-qi, zhang-kejian, xu-dazhe, song-zhiyuan, wu-yansheng, liu-shiquan, wang-changqing, wang-xiaojun, yuan-jie, chen-guoying, cheng-fubo, wang-yilin, li-yong-cnooc, he-wenzhong, tan-ruisong, kou-wei, gu-jun, yang-hongyong, wang-xiangxi, xu-liuping, wang-yihua, bian-zhigang, xin-baoan, guo-wenqing, yuan-guangyu, liu-weidong-csgc, ma-xingrui, li-shangfu]
  summary: 2024年至2026年，军工和能源央企的现任、前任负责人接连出局，走的却是两条路。中石油、中海油、中国电科、航空工业、国家电网等系统的一批人被中央纪委国家监委正式通报审查，随后开除、判刑；中国航发、中国电子、中国星网、国家能源集团、东方电气、中国融通等企业的前一把手，则多是先不再露面、被官网撤下，最后由全国政协撤销委员资格、人大罢免代表，官方不说原因。2025年12月24日全国政协一次撤销八人的委员资格，其中七人是军工、能源央企前负责人；2026年起正式立案再度密集，国家电网、中核、五矿、东方电气的前负责人和应急管理部部长王祥喜相继被查。
  sections:
    - h: 前史：装备系统清查和第一批航天、兵器负责人
      from: 2023-07-26
      to: 2024-04-30
      text: 2023年7月26日，中央军委装备发展部公开征集2017年10月以来装备采购招标评审活动中专家违规违纪的问题线索，起点与李尚福出任装备发展部部长的时间相近；同年下半年火箭军领导层被整体撤换，李尚福被免去国防部长（详见装备系统专题、火箭军专题）。12月27日，全国政协撤销航天科技集团董事长吴燕生、兵器工业集团董事长刘石泉、航天科工集团副总经理王长青的委员资格，2024年1月29日又撤销航天科技一院院长王小军的委员资格，都没有说明原因。2024年3月27日，中国商飞总经理周新民出任航空工业集团董事长；4月12日，中国电科总经理陈锡明出任航天科工董事长，自由亚洲电台专栏注意到“消息中只字未提袁洁”，兵器装备集团总经理陈国瑛同日被换下；4月30日，程福波接替已被撤销委员资格的刘石泉任兵器工业集团董事长。这一阶段出局的军工负责人，官方都没有发布立案消息。
      cites: [e10-jiemian-2023-07-26-equipment-clues, b08-zaobao-2023-09-15-li, e04-gov-2023-07-31-rocket-force, b08-gov-2023-10-24-order-14, a02-caixin-2023-12-27-cppcc-three, c11-people-2024-01-30-cppcc-wang-xiaojun, r08-xinhua-2024-03-27-zhou-xinmin-avic, k06-rfa-2024-04-15-yuan-jie, k08-caixin-2024-04-30-cheng-fubo]
    - h: 2024年：被正式通报的五人和此后的重判
      from: 2024-02-02
      to: 2026-04-01
      text: 与军工系统的沉默不同，2024年有五名央企现任、前任负责人被中央纪委国家监委正式通报审查，既有能源系统，也有军工系统。2月2日，中石油原董事长王宜林被查；3月15日，中海油原总经理李勇被查；4月7日，中国电科副总经理何文忠在任上被查，10月被开除党籍，通报称他“靠军工吃军工”；8月30日，航空工业原董事长谭瑞松被查，2025年2月的开除通报同样用了这句话；12月21日，大唐集团原总经理、曾任国家电网董事长的寇伟被查，2025年6月的开除通报称他“退而不休”、“靠能源吃能源”。此后的判决都很重：王宜林、李勇分别因受贿3501万余元、6794万余元被判有期徒刑13年、14年；何文忠受贿2.89亿余元，2025年7月被判死缓；谭瑞松受贿6.13亿余元、贪污8993万元，2026年3月被判死缓；寇伟受贿1.54亿余元，2026年4月被判死缓。同在2024年7月，国务院免去刘仓理的中国工程物理研究院院长职务，没有说明原因。
      cites: [t02-ccdi-2024-02-02-wang-yilin-probe, t02-ccdi-2024-03-15-li-yong-probe, r10-thepaper-2024-04-07-he-wenzhong-probe, r10-xinhua-2024-10-11-he-wenzhong-expel, t02-ccdi-2024-08-30-tan-ruisong-probe, t02-ccdi-2025-02-24-tan-ruisong-expel, k05-thepaper-2024-12-21-kou-wei, k05-chinanews-2025-06-06-kou-wei, t02-xinhua-2025-05-13-wang-yilin-verdict, t02-court-2025-li-yong-verdict, r10-court-2025-07-21-he-wenzhong-verdict, t02-xinhua-2026-03-25-tan-ruisong-verdict, k05-chinanews-2026-04-01-kou-wei, r08-12371-2024-07-05-liu-cangli-out]
    - h: 2024年底至2025年：不点名的去职
      from: 2024-09
      to: 2025-07
      text: 另一批人没有任何立案消息，只是先不再露面，再被换下。据维基百科，中国航发董事长曹建国2024年9月后动向不明；中央社称他2025年3月突然从集团官网董事长一职被撤下，另说他是5月被免职（联合早报）。航天科工出身的合肥市委书记张红文2024年12月10日主持市委常委会后未再露面，2025年3月14日被披露已不再担任安徽省委常委、合肥市委书记；中国电科出身的辽宁副省长高涛3月26日被免职。国家能源集团董事长刘国跃2025年2月由邹磊接替，此前已三个月未露面；中国电子董事长曾毅4月由李立功接替；东方电气董事长俞培根近半年未露面后，6月被官网撤下；中国融通董事长马正武7月由李文清接任。同在7月，程福波接替周新民任航空工业集团董事长。国防科工局局长张克俭2024年12月已由单忠德接任，2025年1月又卸任工业和信息化部副部长。中国星网董事长张冬辰何时去职，本站没有查到公开报道。
      cites: [k05-wiki-cao-jianguo, k05-cna-2025-12-24-cppcc, k07-zaobao-2025-12-26-cppcc, k07-cna-2025-03-15-zhang-hongwen, k07-wiki-zhang-hongwen, k07-thepaper-2025-12-27-gao-tao, k07-udn-2025-12-24-cppcc, k08-bjnews-2026-07-03-cheng-fubo, r08-wiki-zhang-kejian, r08-wiki-zhang-dongchen]
    - h: 2025年12月至2026年4月：政协、人大的程序性除名
      from: 2025-09-26
      to: 2026-04-18
      text: 2025年12月24日，全国政协主席会议审议通过撤销王行环、张冬辰、曹建国、刘国跃、马正武、樊友山、曾毅、俞培根全国政协委员资格的决定。联合早报指八人中七人是军工、能源央企负责人，其中四人来自军工系统；唯一的例外王行环是武汉大学中南医院原院长，12月29日即被湖北省纪委监委宣布审查调查，2026年4月被开除党籍和公职，通报称他“在医疗领域搞新型隐性腐败”。其余七人至今没有立案消息。地方人大随后跟进：12月27日辽宁公告高涛被罢免省人大代表，2026年元旦安徽公告张红文被罢免省人大代表。全国人大一侧，2025年12月30日、2026年1月9日、1月25日，航空工业原董事长周新民、中物院原院长刘仓理、中核集团原总工程师罗琦先后被罢免全国人大代表，资格审查报告写明三人“涉嫌违纪违法”；另说三人是在2月被罢免（联合早报）。更早的2025年9月26日，曾执掌航天科工、航天科技的许达哲被罢免全国人大代表，报告没有写原因。2026年3月2日，全国政协常委会追认撤销上述八人和田学斌、何松的委员资格，并免去张克俭的全国政协常委职务、撤销其委员资格。
      cites: [k07-xinhua-2025-12-24-cppcc, k07-zaobao-2025-12-26-cppcc, cs8-xinhua-2025-12-29-wang-xinghuan-probe, cs8-xinhua-2026-04-18-wang-xinghuan-expel, k07-lnd-2025-12-27-gao-tao, k07-anhuinews-2026-01-01-zhang-hongwen, a02-wikisource-npc-qualification-reports, a02-zaobao-2026-04-18-nine-generals, cs8-people-2013-04-24-casc, k05-xinhua-2026-03-02-cppcc]
    - h: 2026年：正式立案再度密集
      from: 2026-01-19
      to: 2026-09-08
      text: 2026年起，被正式通报的央企现任、前任负责人再度增多。1月19日，中核集团原总经理顾军被查，7月被开除党籍；1月24日，哈电集团原纪委书记杨宏勇主动投案；1月31日，2019年3月起任国家能源集团董事长、后调任应急管理部部长的王祥喜在任上被查，9月被开除党籍和公职。5月23日，兵器装备集团出身、曾任一汽集团董事长的全国总工会党组书记徐留平被查；5月30日，华能集团原总会计师王益华被查；6月24日，国防科工局副局长卞志刚在任上被查。7月31日，国家电网原董事长辛保安被查，五矿集团原总经理国文清主动投案；8月8日，东方电气原党组副书记宋致远被查。航天系统出身的政治局委员马兴瑞也在4月3日被查、7月被开除党籍。判决方面，兵器装备集团原副总经理刘卫东4月因受贿4139万余元被判有期徒刑13年，中海油原副总经理袁光宇6月因受贿1.52亿余元被判死缓。至本文写作时，除王行环外，上两节提到的十余名被换下或被除名的负责人，没有一人被正式通报立案。
      cites: [t02-xinhua-2026-01-19-gu-jun-probe, t02-xinhua-2026-07-25-gu-jun-expel, r08-people-2026-01-24-yang-hongyong-probe, c03-xinhua-2026-01-31-wang-xiangxi-probe, cs8-ce-2019-03-04-wang-xiangxi, c03-xinhua-2026-09-08-wang-xiangxi-expel, c03-xinhua-2026-05-23-xu-liuping-probe, c03-ce-2023-02-23-xu-liuping, r08-people-2026-05-30-wang-yihua-probe, r08-people-2026-06-24-bian-zhigang-probe, t02-xinhua-2026-07-31-xin-baoan-probe, t02-xinhua-2026-07-31-guo-wenqing-probe, r08-people-2026-08-09-song-zhiyuan-probe, b08-xinhua-2026-04-03-ma-probe, b08-bbc-2026-07-14-ma, c11-court-2026-04-14-liu-weidong, r08-people-2026-06-17-yuan-guangyu-verdict]
  editor:
    - text: 编者分析：这批人出局的方式分两类。一类走纪检程序：中央纪委国家监委发布立案消息，再发开除通报、移送起诉，判决写明金额，2024年的王宜林、李勇、何文忠、谭瑞松、寇伟和2026年的顾军、王祥喜、辛保安等属于此类。另一类只走人事和代表程序：先在公开场合消失，再被官网撤下、由新人接任，最后由政协撤销委员资格、人大罢免代表，官方不说原因，曹建国、张冬辰、刘国跃、曾毅、俞培根、马正武、樊友山、张克俭等至今停在这一步。按K07先例，本站把后一类的结局标为下落不明，不推定他们已被立案。措辞上也有细微差别：资格审查报告给周新民、刘仓理、罗琦写的是“涉嫌违纪违法”，给同一时期被罢免的海军政委袁华智写的是“涉嫌严重违纪违法”，许达哲的罢免则没有写任何原因。
      cites: [k07-xinhua-2025-12-24-cppcc, k05-xinhua-2026-03-02-cppcc, a02-wikisource-npc-qualification-reports, a02-zaobao-2026-04-18-nine-generals]
    - text: 编者分析：与装备系统、火箭军清洗的关系，时间上前后相接：2023年下半年装备发展部征集线索、火箭军领导层被撤换、李尚福被免职，12月第一批航天、兵器负责人就被撤销政协委员资格。2024年后出局的人里，曹建国、张红文出自航天科工，高涛、樊友山出自中国电科，张冬辰、曾毅先后执掌中国电子，刘仓理出自中物院，张克俭主管国防科工局，周新民执掌航空工业不到一年半。自由亚洲电台的专栏作者2024年4月就把吴燕生、刘石泉、王长青、王小军、袁洁、陈国瑛六人称为“火箭军窝案”的同案犯，但这是评论者的推断；官方从未把任何一位央企负责人与火箭军或装备发展部的案件并提。美国国防部的年度报告指出，文职人员从被拘押到正式移送刑事调查的间隔比军人长得多，这或可解释为什么多数军工负责人至今只有程序性消息，但本站不能据此断定他们已被拘押。
      cites: [e10-jiemian-2023-07-26-equipment-clues, e04-gov-2023-07-31-rocket-force, b08-gov-2023-10-24-order-14, a02-caixin-2023-12-27-cppcc-three, k07-wiki-zhang-hongwen, k07-thepaper-2025-12-27-gao-tao, k07-zaobao-2025-12-26-cppcc, r08-wiki-zhang-dongchen, r08-caixin-2015-09-24-liu-cangli-caep, r08-wiki-zhang-kejian, r08-xinhua-2024-03-27-zhou-xinmin-avic, k08-bjnews-2026-07-03-cheng-fubo, k06-rfa-2024-04-15-yuan-jie, cs8-erickson-2025-12-cmpr]
    - text: 编者分析：能源一线与军工一线同时展开，但处理方式并不按系统划一。国家电网前后两任董事长寇伟、辛保安都被正式立案；王宜林、李勇、袁光宇出自石油系统，都已判刑。国家能源集团的情况最能说明问题：2019年起任董事长的王祥喜被正式立案，2022年起任董事长的刘国跃却只有被撤销政协委员资格的消息。官方从未把能源系统的案件与军工系统并提，本专题把两者放在一起，是因为它们发生在同一时段、程序相似，这是本站的编排，不是官方的说法。
      cites: [k05-chinanews-2026-04-01-kou-wei, t02-xinhua-2026-07-31-xin-baoan-probe, t02-xinhua-2025-05-13-wang-yilin-verdict, t02-court-2025-li-yong-verdict, r08-people-2026-06-17-yuan-guangyu-verdict, cs8-ce-2019-03-04-wang-xiangxi, c03-xinhua-2026-01-31-wang-xiangxi-probe, k07-wiki-liu-guoyue, k07-udn-2025-12-24-cppcc]
    - text: 编者分析：本专题还有一条军工干部转任地方的线。张红文2020年由航天科工副总经理转任安徽副省长，高涛2021年由中国电科副总经理转任辽宁副省长，两人2025年先后去职、被罢免省人大代表；更早从航天系统转任地方的许达哲、马兴瑞，分别在2025年被罢免全国人大代表、2026年被查。中央社2025年3月称张红文是“近期屢傳「出事」的中國軍工系統出身的高官之一”。但除马兴瑞外，这些人都没有立案消息，官方也没有把他们放在同一个案件里，本站不据此认定“航天系”作为一个群体被整体清算。
      cites: [k07-wiki-zhang-hongwen, k07-thepaper-2025-12-27-gao-tao, k07-cna-2025-03-15-zhang-hongwen, a02-wikisource-npc-qualification-reports, b08-xinhua-2026-04-03-ma-probe, b08-bbc-2026-07-14-ma]
  voices:
    - { voice: official, text: 毫无纪法底线，“靠军工吃军工”，侵吞巨额公共财物, cite: t02-ccdi-2025-02-24-tan-ruisong-expel, quote: true }
    - { voice: official, text: 贪婪腐化，退而不休，“靠能源吃能源”，将公权力异化为谋取个人私利的工具, cite: k05-chinanews-2025-06-06-kou-wei, quote: true }
    - { voice: zh, text: 這也代表他們涉及嚴重違紀違法被查落馬，其中多人是軍工、能源系統的高官，此前突然去職後未再公開露面。, cite: k05-cna-2025-12-24-cppcc, quote: true }
    - { voice: zh, text: 自由亚洲电台专栏作者称，吴燕生、刘石泉、王长青、王小军以及袁洁、陈国瑛六人，全都是“火箭军窝案”的同案犯。这是评论者的判断，官方没有这样说过。, cite: k06-rfa-2024-04-15-yuan-jie }
    - { voice: zh, text: BBC中文网引述YouTube博主“中规中矩”称，这一轮军工央企反腐从与火箭军关系最密切的航天央企开始，全部11家副部级军工集团公司的负责人都被波及。这一统计未经官方证实。, cite: b08-bbc-2026-07-14-ma }
