# CS12 — fugitives-skynet: officials and managers who fled abroad, the central fugitive-recovery office (2014), Fox Hunt and Sky Net,
# the hundred red notices (2015), persuasion, repatriation, extradition and prosecution abroad, the 2018 laws and trial in absentia
- id: fugitives-skynet
  title: 外逃与追逃：“猎狐”“天网”与百名红通
  kind: system
  years: '1999–2026'
  people: [xi-jinping, huang-shuxian, liu-jianchao, liu-jinguo, zhao-leji, li-xi, meng-hongwei, cheng-weigao, lai-changxing, guo-wengui, ling-wancheng, jiang-chengjun, jiang-zhaogang]
  summary: '2000年前后，一批掌管资金的官员、国企和银行管理人员携款外逃，2011年央行网站的一份报告甚至称外逃者有1.6万至1.8万人，官方随即说数据失实。2014年中央设立追逃办，公安部“猎狐”、中央追逃办“天网”逐年开展，2015年4月公布“百名红通人员”名单；官方称截至2024年天网追回外逃人员14048人，其中党员和国家工作人员2999人，百名红通到2025年归案64人，亚洲清零，剩下的主要在美国、加拿大、新西兰、澳大利亚。本站人物卡和案件记录里，外逃后落网的官员和国企高管只有姜诚君一人，百名红通的100人没有一人有卡；美国政府和人权组织则把“猎狐”看作跨境施压和法外遣返。'
  sections:
    - h: 口径：谁算“外逃人员”
      from: 2014-01
      to: 2026-01-12
      text: '官方的“外逃人员”是从境外追回的犯罪嫌疑人，职务犯罪和经济犯罪都算，不只是官员。官方给过几组累计数，口径各不相同。十八届中央纪委工作报告：2014年以来从90多个国家和地区追回外逃人员3453名、追赃95.1亿元，“百名红通人员”48人落网。中央追逃办成立三周年时说，截至2017年5月31日“天网行动”追回3051人，其中国家工作人员541人。十九届中央纪委工作报告：五年来“天网行动”追回7089人，其中党员和国家工作人员1992人，追回赃款352.4亿元，“百名红通人员”61人归案。央广2023年说，十八大至二十大期间“天网行动”共追回10668人、赃款447.9亿元。之后按年：“天网2023”1624人，“天网2024”1597人、追赃182.8亿元，“天网2025”963人。中央纪委国家监委网站2025年3月的十周年文章说，截至2024年共从120多个国家和地区追回14048人，其中党员和国家工作人员2999人，“百名红通人员”62人归案，追回赃款666.2亿元；十年间引渡79人、遣返712人、缉捕1986人。这些数字的起点（2014年、2015年或十八大）和分段（按届或按年）不一样，不能直接相加：编者把10668、1624、1597相加得13889，比14048少159人。按十周年文章的分类计算，引渡占0.6%，遣返5.1%，缉捕14.1%，三项合计2777人、19.8%，其余约八成官方没有分类；党员和国家工作人员占21.3%。台湾中央社转述的“天网2025”1月至11月数字是782人，其中党员和国家工作人员61人，占7.8%。本站的口径更窄：2320名人物、962份案件记录中，结局标为“外逃”的只有4份，即耿和、金变玲、艾未未、罗冠聪，都是体制外的异见人士、家属或香港社运人士，没有一名官员。官员和国企高管里有外逃记录的只有海通证券原副总经理姜诚君一人，2024年7月外逃，8月在境外落网被遣返；西南林业大学原校长蒋兆岗2018年5月潜逃，20天后在国内被抓，不算外逃。本站有卡的商人里，赖昌星1999年逃往加拿大、2011年被遣返，郭文贵2014年出逃、2017年4月被国际刑警组织发出红色通缉令，令计划的弟弟令完成2015年被报道住在美国加州。“百名红通”的100人，本站没有一人有人物卡；本专题新建的程维高卡，是名单上程慕阳的父亲。'
      cites: [b04-gov-2017-10-29-ccdi-report, cs12-people-2017-06-27-office-three-years, b05-saac-2022-10-ccdi-report, cs12-cnr-2023-03-21-skynet-2023, cs12-gov-2024-02-25-ccdi-3rd-plenum-report, cs9-xinhua-2025-02-27-surrender-25k, b06-xinhua-2026-01-12-li-xi-ccdi-report, cs12-scjc-2025-03-27-skynet-ten-years, cs12-cna-2026-01-06-skynet-2025, r10-xinhua-2024-08-28-jiang-chengjun-return, r08-jiemian-2019-01-23-wan-renli-verdict, c13-wiki-lai-changxing, b14-bbc-2017-04-21-guo-baoliao, b07-nyt-2015-08-04-ling-wancheng]
    - h: 1999–2013年：“贪了就跑”
      from: 1999-08
      to: 2013-12
      text: '十八大前外逃的多是掌管钱的人。1999年远华案发后，厦门特大走私案首要嫌犯赖昌星逃到加拿大温哥华，数次申请难民身份未果，2011年7月被遣返，2012年被判无期徒刑；最高法院发言人2007年说，承诺不判他死刑是国际合作缉捕的必要条件。2000年8月，河北省委书记程维高的秘书李真案发，程维高的儿子程慕阳经香港去了加拿大；2003年中央纪委开除程维高党籍，通报说他“为他人和其子程慕阳谋利，给国家造成巨大经济损失”，并对举报人郭光允打击报复，但没有追究他的刑事责任。2001年10月，中国银行开平支行前后三任行长许超凡、余振东、许国俊共同贪污、挪用公款后逃往美国，中央纪委说此案涉及资金约4.85亿美元，被称为新中国最大的银行贪污案。同一年，漯河市委原书记、豫港（集团）董事长程三昌2月出逃，通化金马药业董事长闫永明侵占公司1.87亿余元后11月出逃；2002年8月，河南省高速公路管理局党委书记黄玉荣去了美国；2003年4月，浙江省建设厅副厅长杨秀珠获悉罪行败露后外逃。余振东2004年4月自愿回国受审，判12年。2011年6月，央行网站公布的一份2008年报告引述社科院数据，称1990年代中期以来1.6万至1.8万名党政干部和驻外中资机构人员外逃或失踪，携款8000亿元；中国金融学会随即声明数据“严重失实”，中央纪委发言人吴玉良也出面澄清。同年初，江西鄱阳县财政局经济建设股股长李华波套取9400万元后逃往新加坡。'
      cites: [c13-wiki-lai-changxing, e07-gov-2007-03-13-lai-no-death, cs12-chinanews-2003-08-09-cheng-weigao-expel, cs12-wiki-cheng-weigao, cs12-ccdi-2018-07-12-xu-chaofan, cs12-court-2023-12-13-kaiping-boc, cs12-ccdi-2021-12-10-cheng-sanchang-trial, cs12-cnr-2017-05-11-yan-yongming-nz, cs12-chinanews-2015-12-05-huang-yurong, cs12-xinhua-2016-11-16-yang-xiuzhu-return, cs12-bbc-2011-06-15-pboc-report, cs12-bbc-2011-06-17-pboc-denial, cs12-cntv-2011-06-23-ccdi-denial, cs12-xinhua-2017-01-23-li-huabo-verdict]
    - h: 2014–2015年：追逃办、“猎狐”与百名红通
      from: 2014-01
      to: 2016-03-11
      text: '2014年1月的十八届中央纪委三次全会上，习近平说：“腐败分子即使逃到天涯海角，也要把他们追回来绳之以法，五年、十年、二十年都要追，要切断腐败分子的后路。”6月27日，中央反腐败协调小组设立国际追逃追赃工作办公室（中央追逃办），成员单位是中央纪委、最高法、最高检、外交部、公安部、国家安全部、司法部、人民银行8家，具体工作由中央纪委国际合作局承担；10月，中央纪委副书记、监察部长黄树贤首次以办公室负责人身份亮相。7月22日，公安部副部长刘金国部署“猎狐2014”，到年底从69个国家和地区抓获外逃经济犯罪人员680名，其中缉捕290名、投案自首390名；10月，最高法、最高检、公安部、外交部联合发布通告，敦促在逃境外经济犯罪人员限期投案，通告发布后自首332人。12月，中美执法合作联合联络小组确定杨秀珠、王国强、黄玉荣、许超凡、乔建军5起重点个案。2015年3月，中央追逃办对1995年以来外逃的党员和国家工作人员“大起底”，称首次基本摸清底数；3月26日决定启动“天网”行动，下设公安部“猎狐2015”、最高检职务犯罪追逃、人民银行会同公安部打击地下钱庄和离岸公司、中组部会同公安部清理违规证照等专项行动。4月22日，国际刑警组织中国国家中心局集中公布100名外逃人员的红色通缉令，三天后第90号戴学民落网：他持英国护照于2014年10月入境，一直住在安徽老家。9月18日，杨秀珠的弟弟、第74号杨进军被美国强制遣返，到福州机场交接的刘建超当时有三个头衔：国家预防腐败局副局长、中央追逃办负责人、中央纪委国际合作局局长。刘建超2016年3月说，“天网2015”从国外追回一千多人，“红通人员”追回18个。'
      cites: [cs12-scjc-2025-03-27-skynet-ten-years, cs12-people-2017-06-27-office-three-years, cs12-people-2014-10-11-huang-shuxian-office, i11-haiwainet-2014-07-22-fox-hunt, cs12-chinanews-2015-01-08-fox-hunt-680, cs12-people-2015-03-26-skynet-launch, e08-people-2015-04-23-red-notice, cs12-ccdi-2019-01-11-red-notice-episode2, cs12-sina-2015-09-18-liu-jianchao-yang-jinjun, cs12-people-2016-03-11-liu-jianchao-24]
    - h: 劝返、遣返与异地追诉：几个典型案例
      from: 2015-05-09
      to: 2023-12-13
      text: '官方说，境外追逃的方式主要有引渡、遣返、劝返和异地追诉四种。中央纪委2017年写道，美、加、澳、新、英5国与中国没有引渡条约或条约尚未生效，从这些国家追人主要靠遣返、劝返和异地追诉。李华波案是异地追诉的样本：鄱阳县检察官2012年赴新加坡出庭作证，新加坡法院以不诚实接受赃款罪判他监禁15个月，他服刑10个月后被遣返；他在新加坡写了自首书，上饶中院认定自首，仍于2017年判处无期徒刑，此前还按违法所得没收程序裁定没收了部分赃款。杨秀珠是劝返：2014年6月在纽约被捕后申请避难，2015年9月弟弟杨进军被遣返，2016年7月她撤回避难申请，8月美国移民法庭发出遣返令，11月16日回国投案，是第37名归案的“百名红通人员”；2017年10月杭州中院认定她贪污1904.5155万元、受贿735.43万元，因自首减轻处罚，判8年。闫永明是“人赃俱获”：澳大利亚2007年把罚没的337.4万澳元返还中方，他2016年11月从新西兰回国投案，12月被通化中院判3年、缓刑3年，2017年1月又被移交新西兰受审，新西兰判他5个月家庭监禁，并把2785万新西兰元（约1.3亿元人民币）返还中国。黄玉荣2005年在洛杉矶被移民执法局逮捕，移民官司打了十年，百名红通公布后，她的真名和照片登上当地华文报纸，2015年12月回国投案，是“天网”开展以来第一个从美国主动回国投案的红通逃犯。开平中行三名主犯的结局最能说明政策：余振东2004年最早回国，判12年，2013年刑满；许超凡在美国被判25年，羁押近13年后于2018年7月被遣返，判13年；许国俊拒不回国，2021年11月被强制遣返，2023年12月被判无期徒刑。江门中院解释，许超凡、余振东是自愿接受遣返，可以认定自首，许国俊不能。中央追逃办2017年5月公布了已归案的40名“百名红通人员”的处理：被遣返的李华波和被缉捕的7人判得较重，其中付耀波、张清曌也是无期徒刑；劝返的7人判得较轻，张大伟免予刑事处罚，闫永明判缓刑。'
