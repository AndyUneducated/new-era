    - h: 追不回来的人：乔建军、程慕阳、彭旭峰
      from: 2011-11
      to: 2021-12-20
      text: '也有追不回来的。第3号乔建军是中储粮河南分公司周口直属库原主任，2011年外逃，美方2014年对他和前妻赵世兰提起刑事诉讼；瑞典2018年应中国要求逮捕他，后来又应美国要求把他引渡到洛杉矶，2021年12月他在洛杉矶联邦法院认罪，被判的刑期与已羁押的时间相同。中国把他列为5起中美重点个案之一，最后审判他的是美国法院。程慕阳1996年就取得加拿大永久居民身份，2000年夏天到加拿大定居；2015年7月，加拿大联邦法院裁定他对难民申请被拒的司法复核胜诉，发回移民及难民局重新考虑，理由之一是他并未在中国法庭出庭受审。据维基百科，加拿大联邦法院2018年再次判他胜诉，国际刑警组织同年以中国提供的资料不符合其规则为由把他从通缉名单上撤下，2020年他入籍加拿大。2017年4月中央追逃办公布22名在逃人员的藏匿线索，程慕阳和另外4人被列在加拿大，列在美国的有10人，最多。长沙市轨道交通集团原董事长彭旭峰和妻子贾斯语2017年3月外逃，至今未到案，岳阳中院2020年1月按违法所得没收程序，裁定没收他们在境内的违法所得约1.04亿元、黄金制品，以及在澳大利亚、塞浦路斯、新加坡、圣基茨和尼维斯的5处房产。'
      cites: [cs12-ccdi-2016-11-16-us-cases, cs12-qiaobao-2021-12-20-qiao-jianjun, cs12-wiki-qiao-jianjun, cs12-thepaper-2015-07-17-cheng-muyang, cs12-wiki-cheng-muyang, cs12-ccdi-2017-04-27-hiding-clues, cs12-people-2020-01-03-peng-xufeng]
    - h: 2017–2019年：监察法与两部法律
      from: 2017-04-27
      to: 2020-01
      text: '2017年4月27日，中央追逃办第一次以公告形式公布外逃人员藏匿线索，同时首次公布底数：截至3月31日，涉嫌职务犯罪外逃出境的国家工作人员还有365人，失踪不知去向的581人，共946人。十九大前的中央纪委工作报告说，新增外逃人员从2014年的101人降到2015年的31人、2016年的19人，2017年1月至9月为4人。2018年3月通过的《监察法》第五十二条规定，国家监察委员会加强对反腐败国际追逃追赃和防逃工作的组织协调。此后，中国银行江门分行原行长赖明敏6月回国投案，成为国家监委成立后首个到案的“百名红通人员”；许超凡7月被遣返，中央纪委称他是国家监委成立后首个境外遣返的外逃人员；11月，浙江新昌县原常务副县长姚锦旗从欧盟国家被引渡，官方称是国家监委成立后成功引渡第一案。10月26日，全国人大常委会通过《国际刑事司法协助法》，把国家监委列为国际刑事司法协助的主管机关之一，同日修改刑事诉讼法，增设缺席审判程序；人民日报的报道说，2014年中央反腐败协调小组会议就提出研究建立刑事缺席审判制度。国际刑警组织这条渠道本身也出过事：公安部副部长孟宏伟2016年11月起任国际刑警组织主席，2018年10月被国家监委调查，国际刑警组织随后收到他“立即生效”的辞职信。2019年，“天网2019”追回2041人，其中“百名红通人员”4人、党员和国家工作人员860人。'
      cites: [cs12-ccdi-2017-04-27-hiding-clues, b04-gov-2017-10-29-ccdi-report, n01-ccdi-2018-03-supervision-law, cs12-ccdi-2018-07-12-xu-chaofan, cs12-cnr-2023-03-21-skynet-2023, cs12-scjc-2025-03-27-skynet-ten-years, cs12-gov-2018-10-27-judicial-assistance-law, cs12-npc-2018-10-29-legal-net, e03-people-2018-10-08-meng-hongwei, e03-nytcn-2018-10-08-meng-hongwei, b05-ccdi-2020-01-zhao-leji-report]
    - h: 2021–2022年：缺席审判第一案
      from: 2020-08
      to: 2022-01-17
      text: '缺席审判2018年入法，第一案到2021年才开庭。程三昌1941年生，2001年2月外逃，2002年2月被国际刑警组织发布红色通报，2015年列入“百名红通人员”；国家监察体制改革后由郑州市监委办理，2020年8月移送起诉。2021年12月9日郑州中院缺席开庭，法院先把传票和起诉书副本送达他本人，他没有到案，近亲属代为委托两名辩护人出庭。2022年1月17日，法院以贪污罪判他有期徒刑12年、罚金50万元，认定他“逃匿境外逾20年，拒不到案接受审判，拒不退缴赃款，应予从重处罚”。中央纪委的文章强调，按《监察法实施条例》第二百三十三条，地方监委拟适用缺席审判必须先逐级报国家监委同意，证据要能排除合理怀疑。同期的追逃还有：2021年11月许国俊被强制遣返，12月“红通人员”范继萍被引渡；国家监委当年1月至11月对外提出执法合作请求13项、刑事司法协助请求12项。'
      cites: [cs12-ccdi-2021-12-10-cheng-sanchang-trial, cs12-xinhua-2022-01-17-cheng-sanchang]
    - h: 2023–2026年：亚洲清零，剩下的在西方
      from: 2023-03
      to: 2026-01-12
      text: '2023年起，中央追逃办的全称变成中央反腐败协调小组国际追逃追赃和跨境腐败治理工作办公室；“天网2023”由国家监委牵头职务犯罪追逃，公安部继续开展“猎狐”。2023年6月10日，外逃23年的郭洁芳回国投案，是第62名归案的“百名红通人员”。追逃也更快：2024年7月外逃的海通证券原副总经理姜诚君，8月28日就被从境外缉捕归案，距外逃不到一个月。2025年7月，第26号周静华从泰国被引渡，中央追逃办称亚洲地区“百名红通人员”清零；同年第99号梁锦文回国投案，“天网2025”1月至11月追回的“百名红通人员”共2人。中央纪委国家监委网站7月说，仍有37人在逃，“主要集中在美国、加拿大、新西兰、澳大利亚等少数几个西方发达国家”，并说有的国家在政治上充当腐败分子“避风港”。二十届中央纪委五次全会的工作报告说，2025年追回外逃人员963人，立案查处跨境腐败案件505件。按这些官方数字推算，百名红通到2025年底归案64人，在逃的至多36人。'
      cites: [cs12-cnr-2023-03-21-skynet-2023, cs12-scjc-2025-03-27-skynet-ten-years, r10-xinhua-2024-08-28-jiang-chengjun-return, cs12-cctv-2025-07-24-zhou-jinghua, cs12-scjc-2025-07-25-asia-cleared, cs12-cna-2026-01-06-skynet-2025, b06-xinhua-2026-01-12-li-xi-ccdi-report]
    - h: 境外的说法：美国政府、加拿大法院与人权组织
      from: 2015-07-15
      to: 2023-06-20
      text: '官方统计之外的说法，主要来自美国政府、外国法院和人权组织。联邦调查局局长雷伊2020年7月说，“猎狐”自2014年起由习近平主导，针对的是他视为威胁的海外中国人，包括政治对手、异见人士和批评者；他举例说，中方找不到一名目标时，派人到其在美国的家人那里传话：要么尽快回国，要么自杀。美国司法部2020年10月起诉8人在美国充当中国政府的非法代理人；2023年6月，布鲁克林联邦陪审团裁定3名被告有罪，认定他们2016年至2019年间参与中国政府人员主导的“猎狐”行动，威胁、骚扰、监视一名被中方以腐败罪名申请了红色通缉令的男子及其家人，逼他们回国。外交部的回应是，中国执法机关严格根据国际法开展对外执法合作，敦促美方不要沦为犯罪分子的“避罪天堂”。设在马德里的人权组织保护卫士（Safeguard Defenders）2022年1月发布报告，分析62起案例，称天网的成果大多是“非自愿遣返”，2018年约占官方所称成功遣返的64%，引渡只占1%；手段包括威胁国内家属、派人在当地施压和绑架。同年9月它又说，2021年4月至2022年7月中国警方“劝返”了23万人，多数来自缅甸等九个“禁止前往”的国家，这与反腐追逃的天网统计不是同一口径。加拿大联邦法院2015年发回程慕阳的难民申请时，批评移民及难民局依据的证据“模糊且是三手的”。'
      cites: [cs12-fbi-2020-07-07-wray-hudson, i11-state-2020-10-28-fox-hunt-charges, cs12-doj-2023-06-20-fox-hunt-verdict, i11-xinhua-2020-10-29-mfa-fox-hunt, cs12-voa-2022-01-18-involuntary-returns, cs12-safeguard-2022-09-110-overseas, cs12-peopleen-2015-07-17-cheng-canada]
  editor:
    - text: '编者分析：官方的追逃数字以“人”计，但大多数不是官员。十周年文章的14048人中党员和国家工作人员2999人，约21%；2025年1月至11月的782人中只有61人，约8%。2017年官方首次公布的在外国家工作人员底数也只有946人，新增外逃从2014年的101人降到2017年前9个月的4人。所以“追回上万人”主要是经济犯罪嫌疑人，衡量官员外逃要看党员和国家工作人员这一项，以及百名红通这份名单。'
      cites: [cs12-scjc-2025-03-27-skynet-ten-years, cs12-cna-2026-01-06-skynet-2025, cs12-ccdi-2017-04-27-hiding-clues, b04-gov-2017-10-29-ccdi-report]
    - text: '编者分析：正式司法渠道在追逃里占比很小。官方十年数字中引渡79人，不到1%；人权组织估计2018年引渡只占1%，两者方向一致。官方自己也说工作“从劝返为主逐步走向综合运用缉捕、遣返、引渡等多种手段”。劝返靠的是刑期上的差别：同是开平中行主犯，自愿接受遣返的许超凡判13年，被强制遣返的许国俊判无期；2017年公布的40人里，劝返者普遍轻判，缉捕者普遍重判。外界指责的“非自愿遣返”，和官方说的“劝返”，很多时候是同一批人从两边看。'
      cites: [cs12-scjc-2025-03-27-skynet-ten-years, cs12-voa-2022-01-18-involuntary-returns, cs12-court-2023-12-13-kaiping-boc, cs12-ccdi-2017-05-10-forty-returned]
    - text: '编者分析：外逃者的级别，大多在本站人物卡的门槛以下。本站来源中点名的百名红通人员，职务最高的是厅局级：杨秀珠是副厅长，黄玉荣是省高速公路管理局党委书记，程三昌是地级市委书记；其余多是基层财会人员、国企和民企老板。本站有卡、有外逃记录的官员和国企高管只有姜诚君，省部级落马者中没有一人外逃，最接近的是程维高：儿子在名单上，他本人只受党纪处分。可以说，2012年以后的高级官员几乎都是在境内被查的，追逃追的主要是厅局级以下和商人。'
      cites: [cs12-xinhua-2016-11-16-yang-xiuzhu-return, cs12-chinanews-2015-12-05-huang-yurong, cs12-xinhua-2022-01-17-cheng-sanchang, cs12-people-2017-06-27-office-three-years, r10-xinhua-2024-08-28-jiang-chengjun-return, cs12-chinanews-2003-08-09-cheng-weigao-expel]
    - text: '编者分析：《国际刑事司法协助法》第四条第三款规定，非经中国主管机关同意，外国机构、组织和个人不得在中国境内进行该法规定的刑事诉讼活动；而美国法院2023年认定的，正是中国政府人员指挥他人在美国境内监视、骚扰追逃对象。外交部说中方“严格根据国际法开展对外执法合作”，美国司法部则以“非法代理人”起诉。双方争的不是这些人有没有罪，而是谁有权在别国境内追人。'
      cites: [cs12-gov-2018-10-27-judicial-assistance-law, cs12-doj-2023-06-20-fox-hunt-verdict, i11-xinhua-2020-10-29-mfa-fox-hunt, i11-state-2020-10-28-fox-hunt-charges]
  voices:
    - { voice: official, text: 腐败分子即使逃到天涯海角，也要把他们追回来绳之以法，五年、十年、二十年都要追，要切断腐败分子的后路。, cite: cs12-scjc-2025-03-27-skynet-ten-years, quote: true }
    - { voice: official, text: 对投案自首的依法宽大处理，对劝返的依法从轻减轻处罚，对缉捕归案的从重处罚, cite: cs12-ccdi-2017-05-10-forty-returned, quote: true }
    - { voice: official, text: 外逃人员接受劝返、接受遣返和认罪的，与不接受和不认罪的，将面临不同的法律后果。, cite: cs12-court-2023-12-13-kaiping-boc, quote: true }
    - { voice: official, text: 有的国家在经济上贪图腐败分子“黑钱”，在政治上充当腐败分子“避风港”，公然阻挠、抹黑中方追逃追赃工作，站在了正义和法治对立面。, cite: cs12-scjc-2025-07-25-asia-cleared, quote: true }
    - { voice: official, text: 中国执法机关严格根据国际法开展对外执法合作，充分尊重外国法律和司法主权，有关行动无可非议。, cite: i11-xinhua-2020-10-29-mfa-fox-hunt, quote: true }
    - { voice: west, text: 'Now, China describes Fox Hunt as some kind of international anti-corruption campaign—it is not.', zh: 现在中国把“猎狐”说成某种国际反腐行动，它不是。, cite: cs12-fbi-2020-07-07-wray-hudson, quote: true }
    - { voice: west, text: 'the defendants participated in an international campaign with members of the PRC government as part of "Operation Fox Hunt" to threaten, harass, surveil and intimidate John Doe #1 and his family', zh: 被告参与了中国政府人员作为“猎狐行动”一部分的国际行动，威胁、骚扰、监视和恐吓一号无名氏及其家人。, cite: cs12-doj-2023-06-20-fox-hunt-verdict, quote: true }
    - { voice: west, text: 'in 2018, IR stood for some 64% of the claimed successful returns, while extradition — the appropriate judicial channel for such returns — represented but 1%', zh: 2018 年，非自愿遣返约占所称成功遣返的 64%，而引渡这一正当司法渠道只占 1%。, cite: cs12-voa-2022-01-18-involuntary-returns, quote: true }
    - { voice: west, text: 'a staggering number of 230,000 Chinese nationals were returned to face potential criminal charges in China through these methods', zh: 多达 23 万中国公民通过这些手段被送回国内，面临可能的刑事指控。, cite: cs12-safeguard-2022-09-110-overseas, quote: true }
    - { voice: official, text: 'The problem lies in the quality of the evidence on which the Refugee Protection Division relied on, which was "fuzzy and third-hand," according to the court decision', zh: 环球时报引述加拿大法院裁决：问题在于难民保护庭所依据证据的质量，这些证据“模糊且是三手的”。, cite: cs12-peopleen-2015-07-17-cheng-canada, quote: true }
    - { voice: zh, text: BBC 中文 2011 年报道，央行网站报告称 1990 年代中期以来 1.6 万至 1.8 万名干部外逃或失踪、携款 8000 亿元，多数中国网站一天内删除了相关报道；两天后中国金融学会称数据“严重失实”, cite: cs12-bbc-2011-06-15-pboc-report }
