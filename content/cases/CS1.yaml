- id: cnpc-system
  title: 石油系统：从中石油窝案到“东西二虎”
  kind: system
  years: 2013–2025
  people: [zhou-yongkang, jiang-jiemin, wang-yongchun, li-hualin, ran-xinquan, wang-daofu, wen-qingshan, liao-yongyuan, su-shulin, wang-tianpu, wu-zhenfang, wang-yilin, li-yong-cnooc, zhou-bin]
  summary: 石油系统是周永康仕途的起点，也是十八大后最早被成批清查的央企系统：2013 年 8–9 月，中石油四名高管和刚调任国资委主任的蒋洁敏相继落马。2015 年中央巡视进驻“三桶油”后，中石油总经理廖永远、中石化总经理王天普、中海油原副总吴振芳、曾任中石化总经理的福建省长苏树林又被查。巡视组要求中石油“全面清除蒋洁敏、廖永远等人的恶劣影响”，但 2024 年中石油、中海油原董事长王宜林和中海油原总经理李勇被开除党籍，说明清查并未到此为止。
  sections:
    - h: “石油帮”的来历
      from: 1967
      to: 2013-07
      text: 周永康从 1967 年到 1998 年在石油系统工作，官至中国石油天然气总公司总经理、党组书记。新京报引媒体报道称，他在石油系统培植了大量“门徒”，包括蒋洁敏、王永春、李华林、冉新权、王道富、温青山等。蒋洁敏出身胜利油田，2013 年 3 月由中石油董事长调任国资委主任；王永春历任吉林油田总经理、大庆石油管理局局长，BBC 引报道称他是周在大庆油田工作时的得力助手；李华林 1988–1992 年做过周的秘书。另一条线是两位同龄的“虎”：据《国企》杂志 2007 年报道，属虎的苏树林和廖永远被原石油部的部长们爱称为“东西二虎”，苏出身大庆、后任中石化总经理，廖出身塔里木、2013 年接替蒋洁敏任中石油总经理。
      cites: [b03-cnr-2015-10-15-zhou-disciples, b03-bbc-2013-08-30-zhou-clique, f06-bbc-2015-10-07-su-shulin]
    - h: 2013 年的中石油窝案
      from: 2013-08-26
      to: 2013-12
      text: 2013 年 8 月 26 日，中石油集团副总经理兼大庆油田总经理王永春被宣布接受组织调查；次日国资委宣布副总经理李华林、股份公司副总裁兼长庆油田总经理冉新权、总地质师兼勘探开发研究院院长王道富同时被查，中石油当晚公告三人已辞职。北京青年报发现三人都是西南石油大学校友，称三名升迁迅速的校友同日落马“并不完全是巧合”。9 月 1 日，刚任国资委主任半年的蒋洁敏被宣布调查。接替李华林出任昆仑能源董事会主席的总会计师温青山，当年 12 月也被传协助调查并辞去上市公司职务，此后未再公开露面。
      cites: [c08-ccdi-2013-08-26-wang-yongchun-probe, f06-chinanews-2013-08-28-cnpc-three, c03-12371-2013-09-01-jiang-jiemin-probe, f06-cnr-2013-12-19-wen-qingshan]
    - h: 巡视进驻与第二波
      from: 2015-02-28
      to: 2015-10-07
      text: 2015 年 2 月 28 日至 4 月 30 日，中央第二巡视组对中石油进行专项巡视，中海油、中石化当年也接受了巡视。巡视期间的 3 月 16 日，中石油总经理廖永远被宣布调查；4 月 27 日，中石化总经理王天普被查；中海油已退休两年的原副总吴振芳也在巡视组进驻后被立案。6 月的反馈指出中石油选人用人风气不正、“小圈子”问题突出，“一些领导干部以权谋私，帮助亲友承揽项目，甚至与私企老板绑定”，要求“全面清除蒋洁敏、廖永远等人的恶劣影响”。10 月 7 日，曾任中石化总经理的福建省长苏树林被查，BBC 写道，“东西二虎”至此双双落马。中央纪委事后统计，2015 年被查的 9 名央企高管中，有 6 人所在企业当年接受巡视，廖永远、王天普、吴振芳都在其列。
      cites: [cs1-xinhua-2015-06-16-cnpc-inspection, f06-bbc-2015-03-16-liao-yongyuan, t01-ccdi-2015-04-27-wang-tianpu-probe, r02-chinanews-2017-02-16-wu-zhenfang-verdict, f06-bbc-2015-10-07-su-shulin, r02-people-2016-01-02-ccdi-2015-tigers]
    - h: 授意链与各自的案子
      from: 2004
      to: 2015-06
      text: 判决书勾出了一条自上而下的授意链。周永康的判决认定，他要求蒋洁敏、李春城为周滨等人开展经营活动提供帮助；蒋洁敏的判决写明，2004 年至 2008 年他“在周永康指使或授意下，违反规定，为他人开展经营活动提供帮助”；王永春的判决则写明，2004 年夏他“在蒋洁敏的授意下为他人开展经营活动提供帮助”。温青山出现在周的判决里，是通过周滨夫妇向周行贿的人之一。廖永远、苏树林、王天普的判决没有提到周或蒋，各自以受贿为主：苏树林的开除通报指他“打探巡视消息，在党内搞非组织活动，对抗组织审查”，并在中石化任上违规决策造成国有资产巨额损失；BBC 称，中国媒体报道廖永远时都突出他与蒋洁敏在中石油的交集。
      cites: [e03-xinhua-2015-06-11-zhou-verdict, c03-xinhua-2015-10-12-jiang-jiemin-verdict, c08-people-2015-10-14-wang-yongchun-verdict, r02-ccdi-2017-07-04-su-shulin-expel, f06-bbc-2015-03-16-liao-yongyuan]
    - h: 判决
      from: 2015-10-12
      to: 2018-07-26
      text: 2015 年 10 月 12 日，蒋洁敏以受贿、巨额财产来源不明、国有公司人员滥用职权罪被判 16 年，受贿 1403 万余元；次日王永春被判 20 年，受贿 4856 万余元。2017 年 1 月，廖永远被判 15 年、王天普被判 15 年 6 个月；2 月，吴振芳以受贿 180 余万元被北京东城法院判 3 年 6 个月，其妻同案获缓刑。苏树林 2018 年 7 月被判 16 年。2013 年 8 月同日被查的李华林、冉新权、王道富，以及温青山，本站至今没有查到开除党籍、起诉或判决的公开通报。
      cites: [c03-xinhua-2015-10-12-jiang-jiemin-verdict, c08-people-2015-10-14-wang-yongchun-verdict, f06-xinhua-2017-01-20-liao-sentence, t01-court-2017-01-24-wang-tianpu-verdict, r02-chinanews-2017-02-16-wu-zhenfang-verdict, f06-court-2018-07-26-su-shulin, b03-cnr-2015-10-15-zhou-disciples]
    - h: 整改之后
      from: 2015-09-14
      to: 2025-05-13
      text: 2015 年 9 月中石油公布巡视整改情况，承认巡视组指出部分党组成员“拉帮结派、买官卖官、利益输送等问题突出，在企业内部造成严重政治雾霾问题”，表示要“坚决肃清周某等人的恶劣影响”；当年 1–7 月查处各级“一把手”案件 112 件。北京青年报梳理“三桶油”的整改通报，称三家都存在管党不严、用人不规范、以权谋私等五方面问题，中海油被通报“靠油吃油”。九年后，主持 2015 年整改表态的中石油董事长王宜林本人被查：2024 年 7 月开除党籍通报指他“长期结交政治骗子并被其利用，对抗组织审查”，2025 年 5 月以受贿 3501 万余元被判 13 年；2024 年 9 月，中海油原总经理李勇被开除党籍，通报称其肆无忌惮“靠石油吃石油”。
      cites: [cs1-chinacom-2015-09-15-cnpc-rectify, cs1-xinhua-2015-06-16-cnpc-inspection, t02-ccdi-2024-07-31-wang-yilin-expel, t02-xinhua-2025-05-13-wang-yilin-verdict, t02-bjnews-2024-09-11-three-expel]
  editor:
    - text: 石油系统的清查与周永康案高度重叠，但不完全等同。2013 年的第一波——王永春、李华林、冉新权、王道富、蒋洁敏、温青山——几乎都被媒体列为周的“门徒”，判决书里也写明了从周永康到蒋洁敏再到王永春的授意链；2015 年巡视带出的廖永远、王天普、吴振芳，判决中则没有提到周，开除通报也没有点名输送对象。把后一波也算作“周系”，主要依据是媒体对出身和交集的归纳，而非判决认定的事实。海外媒体另有石油帮实为曾庆红一手打造的说法，属于没有官方来源的传闻。
      cites: [b03-cnr-2015-10-15-zhou-disciples, c03-xinhua-2015-10-12-jiang-jiemin-verdict, c08-people-2015-10-14-wang-yongchun-verdict, r02-ccdi-2015-09-18-wang-tianpu-expel, f06-epoch-2016-09-18-petroleum-gang]
    - text: 制度原因，巡视反馈和整改通报说得很直白：“小圈子”“近亲繁殖”的选人用人，领导干部帮助亲友承揽项目、与私企老板绑定，海外投资决策不规范。巨型能源央企掌握油田合作开发、工程承揽和海外收购的决定权，集团内部纪检力量薄弱——中石化甚至有企业“十几年没有召开党代会进行换届选举”。王宜林案和李勇案说明，2015 年整改后，同类问题仍在新一届领导层身上出现。
      cites: [cs1-xinhua-2015-06-16-cnpc-inspection, cs1-chinacom-2015-09-15-cnpc-rectify, t02-bjnews-2024-09-11-three-expel]
    - text: 处理方式上，2013 年李华林等三人被查的消息由国资委发布，节奏是先查高管、后查前董事长，蒋洁敏在调任国资委主任半年后才被查；2015 年则改为以巡视为抓手，央企高管落马多半出现在巡视进驻之后。蒋洁敏因自首、积极退赃和如实供述与周有关的滥用职权事实获从轻处罚，显示他的供述对周案的定罪有用；而几名只以“接受组织调查”结尾的高管，至今没有下文。
      cites: [f06-chinanews-2013-08-28-cnpc-three, r02-people-2016-01-02-ccdi-2015-tigers, b03-cnr-2015-10-15-zhou-disciples]
  voices:
    - voice: official
      text: 部分党组成员背离大庆精神铁人精神，拉帮结派、买官卖官、利益输送等问题突出，在企业内部造成严重政治雾霾问题。
      quote: true
      cite: cs1-chinacom-2015-09-15-cnpc-rectify
    - voice: official
      text: 中央第二巡视组要求中石油“全面清除蒋洁敏、廖永远等人的恶劣影响，努力减少腐败存量，遏制腐败增量”。
      cite: cs1-xinhua-2015-06-16-cnpc-inspection
    - voice: zh
      text: 与此同时，石油系统当年被称为“东西二虎”的廖永远、苏树林已双双落马。
      quote: true
      cite: f06-bbc-2015-10-07-su-shulin
    - voice: zh
      text: BBC 把 2013 年的中石油高管落马与四川的郭永祥、李春城联系起来，认为“似乎显示周永康在石油系统和四川的利益集团正在逐一被清洗”。
      cite: b03-bbc-2013-08-30-zhou-clique
    - voice: zh
      text: （传闻）大纪元称周永康只是被外界封为“石油帮帮主”，一手打造石油帮的是曾庆红；此说没有官方或可靠媒体的佐证。
      cite: f06-epoch-2016-09-18-petroleum-gang
  events: [e08-2013-jiang-jiemin, e03-2015-zhou-yongkang-sentenced]
  factions: [petroleum, zhou-clique]
  cites: [b03-cnr-2015-10-15-zhou-disciples, f06-chinanews-2013-08-28-cnpc-three, cs1-xinhua-2015-06-16-cnpc-inspection, r02-people-2016-01-02-ccdi-2015-tigers, t02-ccdi-2024-07-31-wang-yilin-expel, t02-bjnews-2024-09-11-three-expel, f06-bbc-2015-10-07-su-shulin]

- id: xishanhui
  title: 令计划与“西山会”
  kind: cluster
  years: 2012–2016
  people: [ling-jihua, ling-zhengce, ling-gu, chen-chuanping, shen-weichen, liu-suiji, li-jiangong, huo-ke, pan-yiyang, liu-zhijun, ding-shumiao, liu-tienan, hu-jintao, bai-enpei, li-chuncheng, zhou-yongkang, bo-xilai, xu-caihou]
  summary: 令计划曾任中央办公厅主任，被视为胡锦涛的“心腹”。2012 年 3 月其子令谷驾驶法拉利身亡，他在十八大前被调离中办；2014 年其兄令政策和一批山西籍官员相继落马，12 月他本人被立案审查，2016 年 7 月以受贿、非法获取国家秘密、滥用职权罪被判无期徒刑。“西山会”是媒体人罗昌平描述的山西籍高官圈子，官方从未使用这一说法，但其报道所列成员大多已落马。
  sections:
    - h: 法拉利车祸与调离中办
      from: 2012-03-18
      to: 2012-11
      text: 2012 年 3 月 18 日凌晨，一辆在北京四环超速的法拉利撞上护墙，令计划之子令谷当场死亡，车上两名女乘客重伤。纽约时报 2012 年 12 月报道，此后有人用令谷的化名在社交网站发帖，以平息车祸传言；党内知情人士称，令计划还动用了负责领导人安全的中央警卫局协助掩盖。报道称，7 月领导层讨论人事安排时，以江泽民为首的老领导就此向胡锦涛发难，认为令计划“不具备进入政治局的资格”。9 月，令计划改任中央统战部部长，十八大上只当选中央委员。
      cites: [c05-nytcn-2012-12-05-ling-gu, b07-bbc-2015-07-20-ling-expulsion, f02-hqrw-2015-01-06-xishanhui]
    - h: 罗昌平笔下的“西山会”
      from: 2007
      to: 2013-10
      text: 2013 年，媒体人罗昌平在连载文章《打铁记》中描述，不晚于 2007 年，一个由进入或候补进入中委的山西籍官员组成的高官圈子“西山会”悄然成型，只有个别获得身份认可的同籍商人才能“埋单”。法广转述，这个派系以山西平陆籍的原中办主任令计划为首。环球人物 2015 年报道，罗昌平说成员以不低于三个月一次的频率聚会，多家媒体称令计划是“执牛耳者”，其他成员还包括令政策、陈川平、刘志军、丁书苗、刘铁男、申维辰等；在 2012 年 11 月前，令计划召集的三次饭局与法拉利车祸的“善后工作”余波有关。这些说法来自媒体，官方通报和判决从未使用“西山会”一词。
      cites: [f01-rfi-2013-10-15-xishanhui, f02-hqrw-2015-01-06-xishanhui]
    - h: 山西籍官员先倒，令计划后查
      from: 2014-04-12
      to: 2014-12-22
      text: 2014 年 4 月 12 日，中国科协党组书记、原山西省委常委申维辰被调查；6 月 18 日，山西副省长杜善学与山西省政协副主席令政策同天被带走，次日中纪委同一时段公布消息。8 月，太原市委书记陈川平被查，几乎同时太原市公安局长柳遂记被带走，11 月山西省国土资源厅厅长李建功被查，环球人物称柳、李都是与陈川平关系密切的平陆老乡。12 月 16 日，在中办任令计划下属 12 年的秘书局局长霍克调任国家旅游局，一周后的 12 月 22 日，中央政治局常委会决定对令计划立案审查。香港明报引汪玉凯说，令计划等人是很明显的“家族帮”。
      cites: [r01-hkcd-2014-09-03-shanxi, f02-hqrw-2015-01-06-xishanhui, r02-bbc-2015-08-12-huo-ke, b07-xinhua-2015-07-20-ling-expulsion, b07-bbc-2014-12-23-hk-press-ling]
    - h: 通报与判决
      from: 2015-07-20
      to: 2016-07-04
      text: 2015 年 7 月 20 日，中央政治局会议决定开除令计划党籍和公职，通报称他严重违反党的“政治纪律、政治规矩、组织纪律、保密纪律”，“违纪违法获取党和国家大量核心机密”，并对亲属利用其职务影响力敛财牟利负有重要责任。2016 年 7 月 4 日，天津一中院宣判：他为楼忠福父子、崔晓玉、潘逸阳、魏新、李春城、白恩培、霍克等人谋利，单独或与妻子谷丽萍收受财物共计 7708 万余元；在任统战部长和全国政协副主席期间，通过霍克等人非法获取大量国家秘密；滥用职权为特定关系人在调动、购房、户口等事项上提供帮助。法院以三罪并罚决定执行无期徒刑。和薄熙来案一样，妻子通过录像出庭指证。
      cites: [b07-xinhua-2015-07-20-ling-expulsion, b07-court-2016-07-04-ling-sentence, b07-bbc-2016-07-04-ling-sentence]
    - h: 兄弟、旧部与令完成
      from: 2014-06
      to: 2016-12-20
      text: 令家兄弟姐妹五人名为令路线、令政策、令方针、令计划、令完成。令政策 2016 年 12 月 16 日以受贿罪被判 12 年 6 个月；申维辰 10 月被判无期徒刑；陈川平 12 月 20 日以受贿、国有公司人员滥用职权罪被判 6 年 6 个月。行贿人中的潘逸阳有共青团背景，BBC 称这在一定程度上证实了令计划与周永康之间的“合谋”传闻；李春城向谷丽萍送过欧元，白恩培送过财物。最小的弟弟令完成则在案发前出走美国，纽约时报 2015 年 8 月引美国官员说，他如寻求政治庇护，可能成为中华人民共和国历史上“最具破坏力的叛逃者”；2016 年 1 月中国外交部首次承认他住在美国，称“中方正在处理，也在和美国进行沟通”。
      cites: [b07-bbc-2015-07-20-ling-expulsion, r01-court-2016-12-16-ling-zhengce-verdict, f09-court-2016-10-11-shen-weichen, f09-court-2016-12-20-chen-chuanping, b07-bbc-2016-07-04-ling-sentence, b07-court-2016-07-04-ling-sentence, b07-nyt-2015-08-04-ling-wancheng, b07-nyt-2016-01-18-ling-wancheng-us]
  editor:
    - text: 令计划案与周永康案在官方叙事里被并到一起：2016 年六中全会把他与周永康、薄熙来、郭伯雄、徐才厚并列为搞“政治阴谋活动”的人。但公开判决里，他的罪名是受贿、非法获取国家秘密和滥用职权，与周的交集只体现在行贿人名单上的李春城和潘逸阳。“新四人帮”和政变之说来自台湾、香港媒体，BBC 只称潘逸阳一节“在一定程度上”证实了合谋传闻。他的政治分量来自中办主任这个位置：这个职位离最高领导人最近，“非法获取国家秘密”一罪就是借霍克等中办旧部实现的。
      cites: [b03-xinhua-2017-01-01-xi-6th-plenum, b07-court-2016-07-04-ling-sentence, b07-bbc-2016-07-04-ling-sentence, b07-bbc-2014-12-23-hk-press-ling]
    - text: “西山会”提供的是解释框架，不是已证实的组织。罗昌平和环球人物描述的是以籍贯为纽带、官商混合的聚会圈子，并把它与山西各级的人事链条连起来；判决书能证实的只有个别关系，例如陈川平、柳遂记、李建功都被查，申维辰、令政策、杜善学几乎同时落马。籍贯网络之所以能运作，在于中办主任、省委常委、组织系统之间的人事推荐缺少回避和公开。这一点与同期山西塌方是同一个问题的两面。
      cites: [f01-rfi-2013-10-15-xishanhui, f02-hqrw-2015-01-06-xishanhui, r01-hkcd-2014-09-03-shanxi]
  voices:
    - voice: official
      text: 令计划的行为完全背离了党的性质和宗旨，严重违反党的纪律，极大损害党的形象，社会影响极其恶劣。
      quote: true
      cite: b07-xinhua-2015-07-20-ling-expulsion
    - voice: official
      text: 环球人物称，令谷之死“成了推倒令计划的第一张多米诺骨牌”，“西山会”的触角直接伸向山西官场。
      cite: f02-hqrw-2015-01-06-xishanhui
    - voice: zh
      text: 罗昌平认为，西山会虽然并非明确的政党，但实际已有派系之分，具备高度的身份认同感，存在一致的政治目标。
      quote: true
      cite: f01-rfi-2013-10-15-xishanhui
    - voice: zh
      text: 纽约时报报道，车祸和掩盖行为改变了十八大领导层换届的进程，老领导们认为令计划“不具备进入政治局的资格”。
      cite: c05-nytcn-2012-12-05-ling-gu
    - voice: scholar
      text: 汪玉凯对明报说，令计划等人是很明显的“家族帮”，家族中不少人落马，如果没有“大树庇荫”是不可思议的。
      cite: b07-bbc-2014-12-23-hk-press-ling
    - voice: zh
      text: （传闻）苹果日报称令计划是“新四人帮”最后一名落网成员，该集团曾计划在十八大前发动政变；此说未获官方证实。
      cite: b07-bbc-2014-12-23-hk-press-ling
  events: [e2012-ling-gu-ferrari-crash, e2012-ling-jihua-demoted, e03-2014-ling-jihua-investigated, e06-2015-ling-wancheng-defector, e03-2016-sixth-plenum-core]
  factions: [xishanhui, tuanpai, new-gang-of-four]
  cites: [b07-xinhua-2015-07-20-ling-expulsion, b07-court-2016-07-04-ling-sentence, c05-nytcn-2012-12-05-ling-gu, f01-rfi-2013-10-15-xishanhui, b07-bbc-2014-12-23-hk-press-ling]

- id: shanxi-collapse
  title: 山西“系统性、塌方式”腐败
  kind: cluster
  years: 2014–2017
  people: [jin-daoming, yang-senlin, shen-weichen, du-shanxue, ling-zhengce, nie-chunyu, chen-chuanping, bai-yun, ren-runhou, liu-suiji, li-jiangong, yuan-chunqing, wang-rulin, huang-xiaowei, liu-yunshan, zhao-leji, ling-jihua]
  summary: 2014 年 2 月至 8 月，山西有 7 名省级官员相继被调查，其中 4 人是在任省委常委；9 月 1 日中央宣布对山西省委班子作重大调整，省委书记袁纯清离任，王儒林接任。王儒林后来说山西发生了系统性、塌方式严重腐败问题，煤炭、交通、国土是重灾区，连纪检系统也未能幸免。落马者中有令政策、陈川平、申维辰等被媒体归入“西山会”的人，但更多人与令家并无公开关联。
  sections:
    - h: 从金道铭到令政策
      from: 2014-02-27
      to: 2014-07-23
      text: 2014 年 2 月 27 日，山西省人大常委会副主任、原省委副书记金道铭被宣布接受组织调查。香港商报写道，金道铭案牵出了他的副手们：3 月 6 日省监察厅副厅长谢克敏被查，7 月 23 日省纪委常务副书记杨森林被查。4 月 12 日，曾任山西省委常委、太原市委书记的中国科协党组书记申维辰被带走；6 月 18 日，副省长杜善学与省政协副主席令政策同日被带走，次日中纪委在同一时段公布两人被查的消息，香港商报称“山西打虎之势加码”。BBC 指出，申维辰的落马与他在山西任职期间有关。
      cites: [t01-ccdi-zjsc-list-p5, r01-hkcd-2014-09-03-shanxi, r01-ccdi-2014-07-23-yang-senlin-probe, cs1-bbc-2014-08-30-shanxi-yuan]
    - h: 八月塌方与换帅
      from: 2014-08-23
      to: 2014-09-30
      text: 8 月 23 日，省委常委、秘书长聂春玉和省委常委、太原市委书记陈川平被宣布调查；29 日，省委常委、统战部长白云和副省长任润厚被查，BBC 统计山西被调查的省级高官已达 7 名。BBC 注意到，30 日山西省委表态拥护中央决定的报道完全没有提到省委书记袁纯清，《南华早报》则已报道他将被调离。9 月 1 日，政治局常委刘云山出席山西领导干部大会，中组部长赵乐际宣布王儒林任省委书记、袁纯清另有任用；刘云山说，山西“政治生态存在不少问题”，中央“决定对山西省委班子作重大调整”。侠客岛评论说，即使当年局势异常敏感的重庆书记任免，也没有常委级领导出席。9 月 30 日，中央纪委常委黄晓薇接替李兆前任省纪委书记，吴政隆、孙绍骋、王伟中、付建华同时补入，省委常委班子补齐 13 人。
      cites: [t01-ccdi-zjsc-list-p4, cs1-bbc-2014-08-30-shanxi-yuan, cs1-bbc-2014-09-01-shanxi-wang-rulin, cs1-people-2014-09-01-shanxi-adjust, cs1-thepaper-2014-09-01-xiakedao, cs1-people-2014-09-30-shanxi-13]
    - h: “一坨一坨的”
      from: 2004
      to: 2015-03
      text: 2015 年全国人代会上，王儒林把山西的腐败概括为量大面广、集体坍塌、严峻复杂三个特征，说它“不是个案、孤立的，是一坨一坨的”。纵向看，从省到村都发生了严重腐败；省级干部被查处 7 人，太原三任市委书记、连续三任公安局长被查处，高平市连续两任市委书记、四任市长被查处。横向看，煤炭部门是“重灾区”，交通、国土是多发地带，纪检系统“两届四个班子成员都出了问题”。人际网络上，环球人物把陈川平、柳遂记、李建功等平陆籍官员连到令计划的人事布局；京华时报则统计，第十届山西省委 13 名常委中 7 人是山西本地人，18 名落马的省部级以下官员全部是山西人。
      cites: [cs1-people-2015-03-08-wang-rulin-npc, f02-hqrw-2015-01-06-xishanhui, cs1-chinanews-2014-09-02-wang-yukai]
    - h: 异地审判
      from: 2016-10-11
      to: 2017-07
      text: 这批省级官员的案子都被指定到江苏审理。2016 年 10 月 11 日申维辰在常州被判无期徒刑，14 日金道铭在镇江被判无期徒刑，19 日聂春玉、白云在南通分别被判 15 年和 12 年；12 月 16 日令政策在常州被判 12 年 6 个月，20 日杜善学在徐州被判无期徒刑，陈川平同日被判 6 年 6 个月。任润厚在审查期间病亡，2017 年 7 月扬州中院依检察机关申请裁定没收其违法所得。
      cites: [f09-court-2016-10-11-shen-weichen, t01-chinanews-2016-10-14-jin-daoming-verdict, t01-ccdi-2016-10-19-nie-chunyu-verdict, t01-ccdi-2016-10-19-bai-yun-verdict, r01-court-2016-12-16-ling-zhengce-verdict, t01-court-2016-12-20-du-shanxue-verdict, f09-court-2016-12-20-chen-chuanping, t01-people-2017-12-21-39-verdicts]
    - h: 收拾塌方：空缺、自首与谈话
      from: 2014-09
      to: 2016-06
      text: 王儒林说，2014 年 9 月到 12 月，全省纪检监察机关处分违纪党员干部 7376 人，其中移送司法机关 388 人；纪检系统查处 117 人，56 人被清除出纪检队伍。到 2015 年 3 月，省管干部空缺近 300 名，其中包括 3 位市委书记、16 位县委书记、13 位县长；一份县委书记候选名单上排第二的人，半个多月就“牵进去了”。他把吏治腐败、买官卖官称为“腐败之母”。2016 年 6 月他对中纪委网站说，一年多来查办了 5 名市委书记，扭转了此前 14 年没有查处过市委书记的局面，全省 18 名县委书记被查；同时推行谈话函询和主动交代政策，到 2016 年 4 月有 5646 人主动交代违纪问题，2 万多人次向“红包礼金专户”退交一亿七千多万元。
      cites: [cs1-people-2015-03-08-wang-rulin-npc, cs1-ccdi-2016-wang-rulin-interview]
  editor:
    - text: 山西塌方与令计划案在时间上紧密交错：令政策、申维辰、陈川平都在令计划立案前落马，BBC 称袁纯清也被广泛认为是令计划的亲信。但不能把山西塌方简单看成清洗令系。金道铭、杨森林所在的纪检线，聂春玉、白云、任润厚、杜善学，都没有可靠来源把他们与令家相连；袁纯清本人只是被调离，没有被立案。从结果看，中央处理的是一个省的整个官场，令家网络只是其中的一部分。
      cites: [cs1-bbc-2014-09-01-shanxi-wang-rulin, cs1-bbc-2014-08-30-shanxi-yuan, f02-hqrw-2015-01-06-xishanhui, cs1-people-2014-09-01-shanxi-adjust]
    - text: 制度原因，官方和学者的说法大体一致。王儒林列出四条：党不管党、权力失控、道德塌方、养痈成患，并说“省里连续14年没有查处市委书记腐败案件”。汪玉凯则强调煤炭资源靠行政权力而非市场配置，导致大量权钱交易和官商勾结；山西本地干部比例过高、异地交流太少，容易形成家族式、地域式的关系网。纪检系统本身成了重灾区，说明地方监督在同级党委面前基本失灵。
      cites: [cs1-people-2015-03-08-wang-rulin-npc, cs1-chinanews-2014-09-02-wang-yukai]
    - text: 处理方式有三点不同寻常：政治局常委亲自出席省委书记交接会；新省委书记、纪委书记和三名常委都从外省或中央部委调入；案件全部异地审理。随后在王儒林所说“一查就是一帮，一动就塌方”、干部大面积空缺的局面下，山西改用谈话函询和主动交代来消化“存量”，对主动交代者从轻处理。这种先重拳、后宽严相济的办法，后来在辽宁贿选案等案件中再次出现。
      cites: [cs1-thepaper-2014-09-01-xiakedao, cs1-people-2014-09-30-shanxi-13, cs1-people-2015-03-08-wang-rulin-npc, cs1-ccdi-2016-wang-rulin-interview, cs1-thepaper-liaoning-ccdi-paper]
  voices:
    - voice: official
      text: 山西省的政治生态存在不少问题，党风廉政建设和反腐败斗争形势严峻。
      quote: true
      cite: cs1-people-2014-09-01-shanxi-adjust
    - voice: official
      text: 所以说，现在一查就是一帮，一动就塌方。
      quote: true
      cite: cs1-people-2015-03-08-wang-rulin-npc
    - voice: official
      text: 资源被权力的过度垄断，形成了极为扭曲的官商关系和官场生态。
      quote: true
      cite: cs1-thepaper-2014-09-01-xiakedao
    - voice: scholar
      text: 汪玉凯对京华时报说，山西出事的干部大都与煤炭资源有关，又说明山西省部级领导干部异地交流太少，容易形成利益网、关系网。
      cite: cs1-chinanews-2014-09-02-wang-yukai
    - voice: zh
      text: BBC 称袁纯清被广泛认为是令计划的亲信，因此一直有传言说他可能不久后就会下台。
      cite: cs1-bbc-2014-09-01-shanxi-wang-rulin
    - voice: zh
      text: （传闻）《南华早报》和明镜新闻网报道袁纯清不会被调查，但会被架空；BBC 称这一说法当时无法证实。
      cite: cs1-bbc-2014-08-30-shanxi-yuan
  events: [e03-2014-ling-jihua-investigated]
  factions: [xishanhui]
  cites: [cs1-people-2014-09-01-shanxi-adjust, cs1-people-2015-03-08-wang-rulin-npc, cs1-bbc-2014-08-30-shanxi-yuan, cs1-chinanews-2014-09-02-wang-yukai, f02-hqrw-2015-01-06-xishanhui]

- id: liaoning-vote-buying
  title: 辽宁拉票贿选案
  kind: case
  years: 2011–2019
  people: [wang-min, wang-yang-liaoning, su-hongzhang, zheng-yuzhuo, li-wenke, liu-qiang-liaoning, li-xi]
  summary: 2013 年 1 月辽宁省十二届人大一次会议选举全国人大代表和省人大常委会领导时，发生大面积拉票贿选：45 名当选的全国人大代表以金钱或财物拉票，523 名省人大代表涉案。2016 年 9 月全国人大常委会确定这 45 人当选无效，又因辽宁省人大常委会组成人员已不足半数，作出“创制性安排”，成立筹备组代行其部分职权。官方称这是“新中国成立以来查处的第一起发生在省级层面”的此类案件，时任省委书记王珉以受贿、贪污、玩忽职守罪被判无期徒刑。
  sections:
    - h: 2011–2013 年的换届
      from: 2011
      to: 2013-01-27
      text: 法院后来认定，王珉作为辽宁省委书记、省人大常委会主任和省十二届人大一次会议筹备组组长，不履行或不认真履行职责，致使 2011 年省委换届选举、2013 年全国人大代表选举和省人大常委会换届选举中的拉票贿选“未被及时制止，不断蔓延”。2013 年 1 月 27 日，619 名省人大代表选出 102 名全国人大代表。想进入省人大常委会领导层和省政府的人各显神通：财政厅长郑玉焯为当选省人大常委会副主任，向省人大常委会有关领导送手机，并通过部分市财政局长向省人大代表拉票，涉及 11 个市的 76 名代表；阜新市委书记王阳以给代表财物、打招呼等方式拉票；抚顺市委书记刘强为当选副省长进行拉票贿选；省委政法委书记苏宏章则在民主推荐和选举中拉票贿选。
      cites: [c03-people-2017-08-05-wang-min-verdict, cs1-bbc-2016-09-15-liaoning-analysis, t01-people-2017-05-08-zheng-yuzhuo-verdict, t01-court-2017-05-31-wang-yang-verdict, r03-court-2019-04-09-liu-qiang-verdict, r03-ccdi-2016-07-25-su-hongzhang-expel]
    - h: 案发：王珉与专案组
      from: 2016-03-04
      to: 2016-08-26
      text: 2016 年 3 月 4 日，已调任全国人大教科文卫委员会副主任委员的王珉被宣布接受组织调查；王阳、苏宏章随后被查。6 月 2 日王阳被开除党籍，通报指他“搞拉票贿选等非组织活动”；7 月苏宏章、8 月郑玉焯相继被开除。8 月 10 日王珉被开除党籍和公职，通报称他“未按照中央要求履行换届工作第一责任人的职责，对辽宁省有关选举发生拉票贿选问题负有主要领导责任和直接责任”，并“公开妄议”中央。中国纪检监察报后来披露，辽宁省委成立了由省委书记李希任组长的专案调查领导小组，省纪委用三个多月查清违纪事实。
      cites: [c03-ccdi-2016-03-04-wang-min-probe, t01-ccdi-jlsc-list-p1, r03-ccdi-2016-06-02-chen-xuefeng-wang-yang-expel, r03-ccdi-2016-07-25-su-hongzhang-expel, r03-ccdi-2016-08-26-zheng-yuzhuo, c03-ccdi-2016-08-10-wang-min-expel, cs1-thepaper-liaoning-ccdi-paper]
    - h: 全国人大的“创制性安排”
      from: 2016-09-13
      to: 2016-09-17
      text: 9 月 13 日，委员长张德江主持全国人大常委会临时会议，BBC 称上一次召开这种会议是在 12 年前。会议确定 45 名拉票贿选的全国人大代表当选无效，十二届全国人大实有代表减为 2894 人。由于 523 名省人大代表涉案，辽宁省人大常委会 62 名组成人员中有 38 人职务终止，已无法开会。会议公报说，“一个省级人大常委会出现这种情况，新中国历史上还没有过，需要根据我国宪法和有关法律精神作出创制性安排”，决定成立辽宁省十二届人大七次会议筹备组，代行省人大常委会部分职权。李建国在说明中援引了 1997 年重庆、2009 年上海南汇和 2013 年衡阳成立筹备组的先例。随后筹备组公告又有 452 名省人大代表辞职，省人大常委会原副主任李峰被罢免。
      cites: [cs1-npc-2016-09-14-liaoning-session, cs1-npc-2016-09-13-li-jianguo-explanation, cs1-bbc-2016-09-15-liaoning-analysis, cs1-bbc-2016-09-18-liaoning-454]
    - h: 判决
      from: 2017-05-08
      to: 2019-04-09
      text: 2017 年 5 月，郑玉焯以破坏选举罪、受贿罪被判 3 年 6 个月，王阳以受贿罪、破坏选举罪被判 16 年 6 个月，苏宏章以受贿、行贿罪被判 14 年。8 月 4 日，王珉在洛阳被判无期徒刑：受贿 1.46 亿余元，任吉林省委书记期间贪污 100 万元，玩忽职守罪单独判 7 年，法院称其玩忽职守“犯罪情节特别严重，依法应从严惩处”。李文科 2018 年 9 月被判 16 年；刘强 2019 年 4 月以受贿罪、破坏选举罪被判 12 年。中国纪检监察报统计，全案共有 45 名涉嫌违法犯罪人员被移送司法机关。
      cites: [t01-people-2017-05-08-zheng-yuzhuo-verdict, t01-court-2017-05-31-wang-yang-verdict, t01-chinacourt-2017-05-su-hongzhang-verdict, c03-people-2017-08-05-wang-min-verdict, t01-ce-2018-09-13-li-wenke-verdict, r03-court-2019-04-09-liu-qiang-verdict, cs1-thepaper-liaoning-ccdi-paper]
    - h: 后续：换届大考
      from: 2016-09-18
      to: 2017-01
      text: 新华社评论员把辽宁案与湖南衡阳破坏选举案、四川南充拉票贿选案并列为换届选举的反面教材，总结教训说，“选举组织机构和相关责任人不执行党中央的决策部署，有法不依、执法不严、违法不究，对破坏选举的行为熟视无睹”，“一些代表候选人利用资本操纵选举，明目张胆拉票贿选”。2016 年辽宁换届时，全省纪检监察机关进行了 14.2 万人次提名推荐人廉政审核，对 2307 人提出不提名建议；11 月省人大重新选出 31 名常委会委员，12 月省党代会承诺“彻底肃清辽宁拉票贿选案的恶劣影响”。
      cites: [cs1-people-2016-09-18-xinhua-commentator, cs1-thepaper-liaoning-ccdi-paper]
  editor:
    - text: 官方把此案定性为政治案件而非单纯的选举舞弊：纪检监察报说要“严肃查处团团伙伙、拉帮结派，拉票贿选、买官卖官，政治利益和经济利益相互勾连等问题”，新华社评论员称它触碰了“中国共产党执政底线”。但没有可靠来源把辽宁案与中央层面的派系斗争联系起来。王珉被追究的核心是“第一责任人”的失职，即玩忽职守；BBC 采访的李文则把查处时机与十九大前的人事调整相联系，并认为买官跑官贿选是公开的秘密，不仅限于辽宁。
      cites: [cs1-thepaper-liaoning-ccdi-paper, cs1-people-2016-09-18-xinhua-commentator, c03-people-2017-08-05-wang-min-verdict, cs1-bbc-2016-09-15-liaoning-analysis]
    - text: 制度原因在于间接选举与人事安排的结合。省人大代表选全国人大代表、选省人大常委会领导和副省长，名额有限又有差额，市委书记、厅长要升任副省级，就需要在几百名代表中拉到票；地方主官又掌握财政局长、下级官员等可动员的资源，郑玉焯就是通过市财政局长向代表拉票。李文说，人大代表到北京开会时可能是举手机器，但在地方上可以在官场、生意场换取实际利益；财经网报道，有企业老板当选后以“司法建议书”的形式干预案件。
      cites: [t01-people-2017-05-08-zheng-yuzhuo-verdict, r03-court-2019-04-09-liu-qiang-verdict, cs1-bbc-2016-09-15-liaoning-analysis]
    - text: 处理方式上，当局对 523 名省人大代表没有一律追究刑责，而是让他们辞职或被罢免，45 人移送司法；纪检监察报说这是“宽严相济、区别对待，教育挽救大多数、惩治极少数”。法律上，全国人大常委会借用了衡阳案中筹备组的做法，并上升到全国人大层面；时间上，处理恰好在 2016 年地方换届和十九大之前完成，随后各地以此为反面教材开展换届审查。
      cites: [cs1-thepaper-liaoning-ccdi-paper, cs1-npc-2016-09-13-li-jianguo-explanation, cs1-people-2016-09-18-xinhua-commentator]
  voices:
    - voice: official
      text: 辽宁拉票贿选案是新中国成立以来查处的第一起发生在省级层面、严重违反党纪国法、严重违反政治纪律和政治规矩、严重违反组织纪律和换届纪律、严重破坏党内选举制度和人大选举制度的重大案件。
      quote: true
      cite: cs1-people-2016-09-14-zero-tolerance
    - voice: official
      text: 查处辽宁拉票贿选案，就是一次根治“政治毒瘤”的大手术。
      quote: true
      cite: cs1-thepaper-liaoning-ccdi-paper
    - voice: zh
      text: 李文分析说，中国官场买官跑官贿选已经是公开的秘密，决不仅限于辽宁省。
      quote: true
      cite: cs1-bbc-2016-09-15-liaoning-analysis
    - voice: zh
      text: BBC 引财经网报道，部分有实力的企业老板不惜重金贿选，当选后插手司法，甚至以“司法建议书”的形式干预案件办理。
      cite: cs1-bbc-2016-09-15-liaoning-analysis
  events: []
  factions: []
  cites: [cs1-npc-2016-09-14-liaoning-session, cs1-people-2016-09-14-zero-tolerance, c03-people-2017-08-05-wang-min-verdict]

- id: hengyang-election
  title: 衡阳破坏选举案
  kind: case
  years: 2012–2014
  people: [tong-mingqian]
  summary: 2012 年底至 2013 年初，湖南衡阳市十四届人大一次会议差额选举省人大代表时，56 名当选者送钱拉票，涉案金额 1.1 亿余元，527 名出席会议的市人大代表中有 518 人、另有 68 名大会工作人员收受钱物。2013 年 12 月，湖南省人大常委会确认 56 人当选无效，512 名市人大代表辞职；时任衡阳市委书记童名谦 2014 年以玩忽职守罪被判 5 年。学者郑磊称，这是“1949年以来公开披露的涉案金额最大、涉及党政官员和人大代表最多的一起选举弊案”。
  sections:
    - h: 一次差额选举
      from: 2012-12-28
      to: 2013-01-03
      text: 2012 年 12 月 28 日至 2013 年 1 月 3 日，衡阳市第十四届人大一次会议召开，527 名市人大代表出席，差额选举湖南省人大代表。BBC 点评中国专栏统计，大会从 93 名候选人中选出 76 名省人大代表，其中 56 人被查明有送钱拉票行为，“干净”当选的只有 20 人。秦前红解释，省人大代表候选人有省里“带帽下达”的、市委组织部等提名的和代表联合提名的三类，组织上会力保前两类当选，所以贿选通常集中在可能被“差掉”的人身上；点评文章发现，贿选者中民营企业董事长、总经理有 32 名，占 57%。
      cites: [cs1-people-2013-12-28-hengyang, cs1-bbc-2014-01-27-hengyang-comment, cs1-aisixiang-2013-qin-qianhong-hengyang]
    - h: 举报与调查
      from: 2013-02
      to: 2013-12
      text: 据湖南日报，从 2013 年 2 月开始，有群众陆续向中央有关部门、湖南省委举报；4 月上旬，省委成立由省委主要领导任组长的调查处理领导小组，省纪委成立专案组；6 月中旬，专案组进驻衡阳全面调查。法院后来认定，时任衡阳市委书记、换届工作领导小组组长童名谦，在选举省人大代表之前、之中对贿选情况反映未严格调查处理，选举之后对贿选举报也未立案调查。
      cites: [cs1-bbc-2013-12-28-hengyang, t01-chinacourt-2014-08-tong-mingqian-verdict]
    - h: 当选无效、集体辞职与筹备组
      from: 2013-12-27
      to: 2013-12-29
      text: 2013 年 12 月 27 日至 28 日，湖南省人大常委会确认 56 名以贿赂手段当选的省人大代表当选无效，并终止 5 名未送钱拉票但严重失职的省人大代表资格；衡阳各县市区人大常委会接受 512 名收受钱物和 3 名严重失职的市人大代表辞职，另有 6 名受贿代表此前已因调离终止资格。官方初步查明，涉案金额 1.1 亿余元，518 名市人大代表和 68 名大会工作人员收受钱物。BBC 据衡阳市资料计算，市人大共有 529 名代表，处理后“整个衡阳市人大只余下八名代表”。湖南省纪委对 431 名党员和国家工作人员立案；湖南省人大常委会成立衡阳市十四届人大三次会议筹备组，负责重新补选。
      cites: [cs1-people-2013-12-28-hengyang, cs1-bbc-2013-12-29-hengyang-431, cs1-npc-2016-09-13-li-jianguo-explanation]
    - h: 童名谦
      from: 2013-12-18
      to: 2014-08-18
      text: 童名谦时任湖南省政协副主席，2013 年 12 月 18 日被宣布接受组织调查。2014 年 1 月 2 日他被开除党籍和公职，通报说他作为“严肃换届纪律第一责任人”不正确履行职责，对贿选问题没有及时采取有效措施严肃查处，“政治影响和社会影响极其恶劣”。8 月 18 日，北京二中院以玩忽职守罪判他有期徒刑五年，认定他“严重不负责任，不正确履行职责，致使省人大代表选举贿选大面积蔓延”；因主动投案自首，量刑时酌予考虑。点评中国专栏另称，前衡阳市人大常委会主任已被刑拘。
      cites: [t01-ccdi-zjsc-list-p6, r01-ccdi-2014-01-02-tong-mingqian-expel, t01-chinacourt-2014-08-tong-mingqian-verdict, cs1-bbc-2014-01-27-hengyang-comment]
    - h: 后续：法律空白与先例
      from: 2014-01
      to: 2016-09
      text: 秦前红称此案在法律上“余韵未了”：为什么对受贿代表适用辞职而不是罢免，受贿 5000 元以上是否都应追究刑责，当选无效是否自始无效等问题都没有答案。郑磊进一步指出，当选无效的溯及力、代表辞职的条件和效力都是法律空白，由上级人大授权筹备组主持“解散式补选”的做法也需尽快补充法律依据。三年后，全国人大常委会处理辽宁拉票贿选案时，明确援引了衡阳的筹备组做法；新华社评论员也把衡阳案列为各地换届选举的反面教材。
      cites: [cs1-aisixiang-2013-qin-qianhong-hengyang, cs1-aisixiang-2014-zheng-lei-hengyang, cs1-npc-2016-09-13-li-jianguo-explanation, cs1-people-2016-09-18-xinhua-commentator]
  editor:
    - text: 制度原因，学者的分析集中在受操控的差额选举。秦前红指出，组织上力保带帽和组织提名的候选人当选，竞争只留给少数可能被差掉的人，贿选便集中在这个缝隙里；人大代表的言论免责和人身保障被视为“护身符”，对民营企业老板尤其有吸引力。点评中国专栏说，“差额选举之所以成为贪腐政治的空间，一个原因就在于它是操控下的选举，不是自由竞选”。
      cites: [cs1-aisixiang-2013-qin-qianhong-hengyang, cs1-bbc-2014-01-27-hengyang-comment]
    - text: 此案与高层政治斗争没有可见联系，唯一被追究刑责的厅级以上官员童名谦，罪名是玩忽职守而不是受贿。官方把它上升为“对我国人民代表大会制度的挑战”，重点在维护人大选举的权威：处理的对象主要是选举结果和代表资格，而不是追查每一笔钱。
      cites: [cs1-people-2013-12-28-hengyang, t01-chinacourt-2014-08-tong-mingqian-verdict]
    - text: 处理方式上，当局选择让 512 名受贿代表集体辞职、宣布 56 人当选无效，再由筹备组主持补选，用最短时间恢复人大运作；党纪处分 431 人，移送司法的只是少数。秦前红质疑为什么不用罢免程序、受贿者是否都应追究刑责，正是这种以政治处理替代逐一法律追究的方式留下的问题。衡阳的筹备组做法后来成为辽宁案的先例。
      cites: [cs1-people-2013-12-28-hengyang, cs1-bbc-2013-12-29-hengyang-431, cs1-aisixiang-2013-qin-qianhong-hengyang, cs1-npc-2016-09-13-li-jianguo-explanation]
  voices:
    - voice: official
      text: 是对我国人民代表大会制度的挑战，是对社会主义民主政治的挑战，是对国家法律和党的纪律的挑战
      quote: true
      cite: cs1-people-2013-12-28-hengyang
    - voice: scholar
      text: 此次事件无疑是人大制度历史上一次最强烈的地震，其对人大制度权威的冲击和消解乃是前所未有的。
      quote: true
      cite: cs1-aisixiang-2013-qin-qianhong-hengyang
    - voice: scholar
      text: 郑磊认为，此案暴露的“当选无效”溯及力、辞职标准和补选机构等问题都是制度空白，危机中也有完善人大制度的契机。
      cite: cs1-aisixiang-2014-zheng-lei-hengyang
    - voice: zh
      text: 民主还没有来临，贿选已经成为风习。
      quote: true
      cite: cs1-bbc-2014-01-27-hengyang-comment
    - voice: zh
      text: 有网民评论说，527名市人大代表，竟有518人受贿，这在世界选举史上估计也是独有了。
      cite: cs1-bbc-2013-12-28-hengyang
  events: []
  factions: []
  cites: [cs1-people-2013-12-28-hengyang, t01-chinacourt-2014-08-tong-mingqian-verdict, cs1-aisixiang-2014-zheng-lei-hengyang]

- id: china-resources
  title: 华润案：宋林与金业收购
  kind: case
  years: 2010–2017
  people: [song-lin, wang-shuaiting, su-rong]
  summary: 2010 年华润电力高价收购山西金业集团煤矿资产，新华社《经济参考报》记者王文志 2013 年 7 月和 2014 年 4 月两次在微博实名举报华润董事长宋林渎职、贪腐，第二次举报两天后宋林即被中央纪委宣布调查。此后华润电力原董事长王帅廷、总裁王玉军等多名高管和金业老板张新明被查；宋林 2017 年以贪污、受贿罪被判 14 年，但公开判决没有提到金业收购。中央巡视组 2015 年反馈说，宋林在任期间“弱化虚化淡化党的作用，长期不设纪检监察机构”。
  sections:
    - h: 金业收购
      from: 2009-09
      to: 2010-05-31
      text: 金业集团是山西一家集采煤、洗选、炼焦和铁路运输为一体的民营企业，老板张新明曾被称为“山西首富”。环球人物报道，2009 年 9 月金业曾与大同煤矿集团接触，双方对相关资产估价约 52 亿元，收购不久因故被叫停；2010 年 2 月 9 日，华润电力旗下的山西华润联盛与金业签订重组主协议，以不高于 79 亿元收购金业资产包 80% 股权。王文志按协议统计，加上土地出让金等支出，资产包权益整体作价 103 亿元；澎湃新闻则称同年 5 月 31 日的资产转让协议整体作价 117 亿元。环球人物还写道，华润电力在宋林直接指示下向金业支付 81 亿元，其中违反协议提前支付 50 多亿元。牵线的华润联盛，是山西联盛能源老板邢利斌 2009 年与华润合资设立的。
      cites: [cs1-hqrw-2014-04-26-song-lin, cs1-thepaper-2014-08-cr-wang-yujun]
    - h: 两次实名举报
      from: 2013-07-17
      to: 2014-04-17
      text: 2013 年 7 月 17 日，王文志在微博向中纪委实名举报宋林等高管在金业并购案中故意“放水”，致使数十亿元国资流失。华润集团当天称举报存在“诸多揣测、臆断乃至恶意诽谤之辞”，并致信全体员工，称这是“一起由幕后人指使，通过重金收买网络推手，精心策划、有组织、有预谋的抹黑行动”。国资委 7 月 19 日表示正在审计华润，但 25 日华润仍获国资委“业绩优秀企业奖”，外界认为宋林已脱身。前山西晚报记者李建军 8 月赴香港廉政公署举报宋林，六名香港股东也起诉华润电力董事。2014 年 4 月 15 日，王文志第二次实名举报，增加了宋林包养情妇、涉嫌贪腐的内容；16 日宋林发声明称举报“纯属捏造和恶意中伤”，17 日晚 18 时 30 分中纪委宣布他接受组织调查。环球人物引知情人士说，第一次举报曾获高层批示严查，但遇到阻力，被“顶”了近一年。
      cites: [cs1-people-2014-04-18-song-lin-timeline, cs1-bbc-2014-04-15-cr-probe, cs1-bbc-2014-04-16-wang-wenzhi, cs1-hqrw-2014-04-26-song-lin]
    - h: 华润系九人
      from: 2014-03-12
      to: 2014-08-26
      text: 澎湃新闻梳理，截至 2014 年 8 月，涉“宋林案”的当事人已有九人。中间人邢利斌 3 月 12 日在太原机场被警方带走；华润置地副主席王宏琨 4 月下旬被带走；5 月 16 日，在华润工作 17 年、曾在宋林支持下扩张华润电力的香港中旅总经理王帅廷，因在华润任职期间的问题被查；8 月 4 日金业董事长张新明被警方带走，他被称为“太原第二组织部长”；华润集团原审计总监黄道国涉嫌非法获取国家秘密罪，经济参考报称与他获取审计署对华润的审计报告并交给宋林有关；8 月 26 日华润电力总裁王玉军被江苏检察机关立案。华润金融原首席执行官吴丁、集团协同办主任张春也被带走，张春在收购金业时任华润电力发展规划总监。
      cites: [cs1-thepaper-2014-08-cr-wang-yujun, r01-ccdi-2014-05-16-wang-shuaiting-probe]
    - h: 开除与判决
      from: 2015-09-11
      to: 2017-06-01
      text: 2015 年 9 月 11 日，宋林与王帅廷同日被开除党籍。宋林的通报称他“严重违反政治规矩和组织纪律”，在干部选拔任用、企业经营等方面为他人谋利、索取收受贿赂，用公款打高尔夫球，贪污公款，与他人通奸；王帅廷的通报称他“为谋求个人职务升迁搞利益输送”。2017 年 2 月 28 日，王帅廷在深圳被判 16 年，认定他受贿 4008 万余元（绝大部分尚未实际交付，属未遂），并 11 次违规获取火电项目开发奖、贪污 708 万余元。6 月 1 日，宋林在广州被判 14 年：贪污罪部分是以领取华润创业认股权、在下属公司报销个人费用等方式侵吞 974 万余元，受贿罪部分是在项目合作、投资入股、职务调整等事项上收受 2332 万余元。判决通稿没有提到金业收购或国有资产流失。
      cites: [r01-ccdi-2015-09-11-song-lin-expel, r01-people-2015-09-11-wang-shuaiting-expel, r01-qinfeng-2017-02-28-wang-shuaiting-verdict, t01-ccdi-2017-06-01-song-lin-verdict]
    - h: 巡视与“肃清影响”
      from: 2015-07-04
      to: 2015-10-19
      text: 2015 年 7 月 4 日至 8 月 30 日，中央第六巡视组对中国华润总公司进行专项巡视，10 月反馈指出，“原主要负责人宋林在任期间弱化虚化淡化党的作用，长期不设纪检监察机构”，一些“三重一大”事项未经集体决策，违规自定薪酬、超额发薪，“特别是收购并购和招标采购中输送利益”。巡视组要求破除“小圈子”、小团伙，并要求华润干部“不止于做职业经理人，不混同于普通生意人，首先要做政治明白人”。新任董事长傅育宁表态，要“全面肃清“宋林案件”的负面影响”。
      cites: [cs1-people-2015-10-22-cr-inspection]
  editor:
    - text: 此案最初以舆论事件出现：举报人是官方通讯社旗下报纸的记者，被举报方则指控有“幕后人”操纵。环球人物所说第一次举报被“顶”了近一年，与刘铁男案相似，说明实名举报能否奏效，取决于高层是否决定立案，而不取决于证据本身。官方从未把宋林案与任何高层派系相连；李建军曾对自由亚洲电台说苏荣落马与宋林有关，这一说法没有官方或其他可靠来源佐证。
      cites: [cs1-hqrw-2014-04-26-song-lin, cs1-bbc-2014-04-15-cr-probe, b12-rfa-2014-06-15-su-rong]
    - text: 制度原因，巡视反馈说得很具体：华润长期不设纪检监察机构，“三重一大”事项未经集体决策，收购并购中输送利益。华润在宋林任上进行了 40 多起重组整合，业务横跨能源、零售、医药、水泥、金融，旗下有多家香港上市公司；并购规模越大、越分散，集团内部的决策越依赖少数人。黄道国涉嫌非法获取审计署报告一节，说明外部审计本身也可能被提前获知和应对。
      cites: [cs1-people-2015-10-22-cr-inspection, cs1-hqrw-2014-04-26-song-lin, cs1-thepaper-2014-08-cr-wang-yujun]
    - text: 处理结果与举报焦点之间有明显落差。举报针对的是金业收购中的高价和国资流失，但宋林被判的是认股权、报销等贪污和 2332 万余元受贿，判决通稿没有提到金业交易，也没有认定渎职或滥用职权。可能的原因是商业决策中的高价难以证明为犯罪，而贪污、受贿事实更易认定；宋林“主动交待了办案机关未掌握的大部分贪污、受贿事实”，也获得从轻处罚。对金业收购是否造成国有资产损失，至今没有官方结论。
      cites: [t01-ccdi-2017-06-01-song-lin-verdict, cs1-people-2014-04-18-song-lin-timeline]
  voices:
    - voice: official
      text: 原主要负责人宋林在任期间弱化虚化淡化党的作用，长期不设纪检监察机构
      quote: true
      cite: cs1-people-2015-10-22-cr-inspection
    - voice: official
      text: 环球人物称宋林是继刘铁男之后，“第二个因个人实名举报落马的副部级高官”。
      cite: cs1-hqrw-2014-04-26-song-lin
    - voice: zh
      text: 中央反腐的决心给了我勇气。
      quote: true
      cite: cs1-bbc-2014-04-16-wang-wenzhi
    - voice: zh
      text: 华润集团 2013 年致员工的公开信说，举报是“一起由幕后人指使，通过重金收买网络推手，精心策划、有组织、有预谋的抹黑行动”。
      cite: cs1-bbc-2014-04-15-cr-probe
    - voice: zh
      text: （传闻）前山西晚报记者李建军对自由亚洲电台说，苏荣落马“肯定和华润有关系”，因为他与宋林关系非常好；此说未见官方或其他可靠来源证实。
      cite: b12-rfa-2014-06-15-su-rong
  events: [e08-2014-su-rong]
  factions: []
  cites: [cs1-people-2014-04-18-song-lin-timeline, cs1-hqrw-2014-04-26-song-lin, t01-ccdi-2017-06-01-song-lin-verdict, cs1-people-2015-10-22-cr-inspection, cs1-thepaper-2014-08-cr-wang-yujun]

- id: csrc-2015
  title: 2015 年股灾后的证监会
  kind: system
  years: 2015–2019
  people: [xiao-gang, zhang-yujun, yao-gang, liu-shiyu]
  summary: 2015 年 6 月股灾和救市之后，监管层的重点从托市转向整肃“内鬼”：8 月起证监会多名处长、局长和中信证券总经理程博明等券商高管相继被查，9 月和 11 月，救市小组成员、主席助理张育军和副主席姚刚落马。中央巡视组 2015 年底进驻后指证监会“防止利益冲突机制不健全”；2016 年 1 月熔断机制实施四天即暂停，2 月主席肖钢被免，由刘士余接任。
  sections:
    - h: 股灾与救市
      from: 2015-06-12
      to: 2015-08-14
      text: 上证综指 2015 年 6 月 12 日收于七年来最高点 5166.35 点，到 7 月 3 日已下挫 29%。7 月 8 日，证监会发言人说“目前股市存在恐慌情绪，投资者非理性抛售股份的情况大量增加，令股市出现流动性紧张”；此前 12 家券商出资 1200 亿元稳定股市，国资委要求央企在异常波动期间不得减持，央行协助证金公司获得流动性。8 月 14 日证监会公告，证金公司今后若干年不会退出。财新后来写道，证监会的救市四人小组由主席肖钢、分管证金公司的副主席刘新华、分管市场的副主席姚刚和分管机构的主席助理张育军组成，其中姚刚、张育军后来都被彻查。
      cites: [e03-bbc-2015-07-06-stock-review, e03-bbc-2015-07-08-stock-plunge, e03-jjckb-2015-08-15-csf, r02-caixin-2021-09-01-zhang-yujun-dies]
    - h: 从处长到主席助理
      from: 2015-08-25
      to: 2015-11-13
      text: 继投资者保护局局长李量、发行监管部处长李志玲之后，8 月 25 日，在职的发行部三处处长刘书帆和 5 月离职的原处罚委主任欧阳健生接受调查。中信证券在一个月内有 11 名人员被证实接受调查，包括总经理程博明，罪名大多为涉嫌内幕交易；7 月采访过程博明的《财经》记者王晓璐也以涉嫌编造并传播虚假信息被调查。9 月 16 日，主席助理张育军被宣布调查，财新称他与程博明都在五道口金融学院学习过；同期，副主席庄心一到龄卸任，由外管局副局长李超接替。11 月 13 日，副主席姚刚被查。中央纪委后来说，2015 年接受巡视的金融单位中，证监会被查处 2 人，即张育军和姚刚。
      cites: [cs1-bbc-2015-09-17-csrc-scandal, r02-people-2015-09-16-zhang-yujun-probe, r02-ccdi-2015-11-13-yao-gang-probe, r02-people-2016-01-02-ccdi-2015-tigers]
    - h: 巡视、熔断与换帅
      from: 2015-10-31
      to: 2016-02-20
      text: 2015 年 10 月 31 日至 12 月 25 日，中央第七巡视组对证监会党委专项巡视，2016 年 1 月 31 日反馈说，证监会对重要权力部门、关键环节和敏感岗位监督制约不够有力，“防范廉政风险不到位，防止利益冲突机制不健全，存在滋生腐败的隐患”。其间，肖钢力推的指数熔断机制于 2016 年 1 月 4 日实施，四个交易日中两天触发熔断至收盘，1 月 7 日即被暂停。路透社等报道，肖钢在 1 月 7 日的国务院紧急会议上遭高层质问；1 月 18 日路透称他已请辞，证监会当晚否认。2 月 20 日新华社宣布，免去肖钢的证监会主席职务，由农业银行董事长刘士余接任。
      cites: [cs1-csrc-2016-02-04-inspection, cs1-bbc-2016-02-20-xiao-gang]
    - h: 两只“老虎”的罪名
      from: 2006
      to: 2021-09
      text: 姚刚 2017 年 7 月被开除党籍，通报称他“为搞政治攀附，利用职权为他人及企业提供帮助”，但没有说明攀附对象。2018 年 9 月，邯郸中院认定他 2006 年至 2015 年为相关单位在并购重组、股份转让中的股票停复牌、避免行政处罚等事项提供帮助，通过近亲属收受 6961 万余元，另在 2007 年任发行监管部主任时利用内幕信息炒股获利 210 万余元，两罪并罚判 18 年。张育军 2017 年 7 月被开除，通报说他“靠山吃山”，“纵容、默许亲属利用其职务影响谋取巨额不当利益”；9 月最高检对他立案侦查，此后一直没有公布结论，财新 2021 年报道他已在调查期间病逝。市场一侧，泽熙投资的徐翔 2017 年 1 月以操纵证券市场罪被判 5 年 6 个月。
      cites: [r02-ccdi-2017-07-20-yao-gang-expel, r02-court-2018-09-28-yao-gang-verdict, r02-xinhua-2017-07-21-zhang-yujun-expel, r02-caixin-2021-09-01-zhang-yujun-dies, cs1-cctv-2017-01-23-xu-xiang]
    - h: 后来的刘士余
      from: 2017-10-19
      to: 2019-10-04
      text: 接任后的刘士余在 2017 年十九大分组讨论中说，薄熙来、周永康、令计划等人“阴谋篡党夺权”，自由亚洲电台指出这段话未见于大陆媒体。他 2019 年 1 月调任供销合作总社，5 月主动投案；10 月被给予留党察看二年、政务撤职处分，降为一级调研员，通报称他“落实党中央重大决策部署不力，公开发表不当言论，缺乏政治警觉和保密意识”，并为他人谋取私利、违规安排他人到金融系统工作。
      cites: [b03-rfa-2017-10-20-liu-shiyu, k05-cctv-2019-10-04-liu-shiyu]
  editor:
    - text: 股灾后的整肃有明显的问责色彩。财新指出，救市四人小组中有两人后来被彻查；肖钢虽未被立案，但在熔断失败后被免职。BBC 当时写道，有评论称肖钢应为股灾负责，也有评论称他只是领导层意图的执行者；首创证券分析师郑春明对彭博社说，熔断暂停后总得有人负责。官方通报则只讲受贿、内幕交易和“政治攀附”，从未把这些人的落马与救市决策本身联系起来。
      cites: [r02-caixin-2021-09-01-zhang-yujun-dies, cs1-bbc-2016-02-20-xiao-gang, cs1-bbcen-2016-02-20-xiao-gang, r02-ccdi-2017-07-20-yao-gang-expel]
    - text: 制度原因集中在审批权。北京商报引业内人士说，审批制下事前集中监管容易造成权力集中，发审委成了控制上市公司的权力直接掌控者；姚刚案的判决也正落在停复牌、并购重组和避免处罚这些审批环节上。谢国忠对 BBC 说，审批本身合法，问题在于参与者把信息透露给家人和朋友牟利，这就是内幕交易的源头；他还认为同学会、商学院等网络可能形成金融利益集团。巡视反馈的“防止利益冲突机制不健全”，指的就是这种监管者与被监管者之间的信息和人脉流动。
      cites: [cs1-chinadaily-2016-02-05-csrc-risk, r02-court-2018-09-28-yao-gang-verdict, cs1-bbc-2015-09-17-csrc-scandal, cs1-csrc-2016-02-04-inspection]
    - text: 处理方式上，证监会案件是 2015 年金融系统巡视全覆盖的一部分，中央纪委把张育军、姚刚列为巡视后查处的典型。被查的人以违纪违法立案，主席本人则以免职方式退出；刘士余 2019 年的处理又显示另一种尺度：他主动投案、认错悔错，只受留党察看和撤职。同一个机构的三任负责人和高官，分别以立案、免职和从轻处分收场。
      cites: [r02-people-2016-01-02-ccdi-2015-tigers, cs1-bbc-2016-02-20-xiao-gang, k05-cctv-2019-10-04-liu-shiyu]
  voices:
    - voice: official
      text: 巡视发现的问题，根本原因在于党的领导弱化、党的建设缺失、全面从严治党不力。
      quote: true
      cite: cs1-csrc-2016-02-04-inspection
    - voice: official
      text: 北京商报引肖磊说，要解决证监会腐败问题，只有实行注册制，把事前审批为主改为事中事后监管为主。
      cite: cs1-chinadaily-2016-02-05-csrc-risk
    - voice: zh
      text: 有评论称，肖钢应该为去年中国发生的股灾负责。但也有评论称肖钢只是领导层意图的执行者。
      quote: true
      cite: cs1-bbc-2016-02-20-xiao-gang
    - voice: west
      text: Somebody needed to bear responsibility after the suspension of the circuit-breaker system
      quote: true
      cite: cs1-bbcen-2016-02-20-xiao-gang
    - voice: scholar
      text: 独立经济学家谢国忠对 BBC 说，证监会和中信证券官员被查是纪检部门巡视国有金融企业的结果，五道口金融学院等同学网络可能形成金融利益集团。
      cite: cs1-bbc-2015-09-17-csrc-scandal
  events: [e03-2015-stock-market-crash, e08-2016-circuit-breaker, e06-2017-liu-shiyu-usurp]
  factions: []
  cites: [cs1-bbc-2015-09-17-csrc-scandal, r02-people-2016-01-02-ccdi-2015-tigers, cs1-csrc-2016-02-04-inspection, cs1-bbc-2016-02-20-xiao-gang]
