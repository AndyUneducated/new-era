# CS1 案件专题：周永康案、石油系统、西山会、山西塌方、辽宁贿选、衡阳贿选、华润、证监会

- id: zhou-yongkang-network
  title: 周永康案与石油、政法、四川三条线
  kind: case
  years: 2012–2017
  people: [zhou-yongkang, zhou-bin, wu-bing, jiang-jiemin, wang-yongchun, li-hualin, wen-qingshan, li-chuncheng, guo-yongxiang, li-chongxi, tan-li, li-dongsheng, wu-changshun, zhou-benshun, zhang-yue, liang-ke, ji-wenlin, shen-dingcheng, yu-gang, tan-hong, wang-dongming, meng-jianzhu, xi-jinping, bo-xilai, ling-jihua, xu-caihou, guo-boxiong]
  summary: 前政治局常委、中央政法委书记周永康 2014 年 7 月被立案审查，2015 年 6 月以受贿、滥用职权、故意泄露国家秘密三罪被判无期徒刑。在他本人被查之前一年多，他在四川、石油系统、政法系统和秘书班子里的旧部已成批落马；新京报把这些人归为四川系、石油帮、政法系、秘书帮，“门徒”之说由此成了观察这场清洗的常用框架。官方定性起初只讲违纪和受贿，2016 年起升级为“政治阴谋活动”。
  sections:
    - h: 三十年石油、三年四川、十年政法
      from: 1967
      to: 2012-11
      text: 周永康 1967 年进入大庆油田六七三厂地质队，此后在辽河油田、石油工业部和中国石油天然气总公司一路升迁，到 1998 年离开时已是总经理、党组书记，新京报统计他在石油系统工作了 31 年。此后他任首任国土资源部部长，1999 年到 2002 年任四川省委书记，2002 年起任中央政法委副书记、公安部长，2007 年进入政治局常委会并接任中央政法委书记，直到 2012 年十八大退休。新京报写道，他几乎在每一个仕途阶段都有不少“门徒”，并按阶段排出了他先后六任秘书：李华林（1988–1992）、沈定成（1992–1998）、冀文林（1998–2008）、郭永祥（2000–2002）、余刚和谈红（2008–2012）。郭永祥一路随他从中石油到国土资源部再到四川，BBC 称他被称为周永康的“心腹大秘”。
      cites: [b03-cnr-2015-10-15-zhou-disciples, b03-bbc-2013-08-30-zhou-clique]
    - h: 外围先倒：四川与石油
      from: 2012-12
      to: 2013-12
      text: 十八大闭幕不到一个月，2012 年 12 月 6 日，四川省委副书记李春城被宣布接受组织调查；2013 年 6 月，曾任四川副省长的郭永祥落马。8 月 26 日起，中石油集团副总经理王永春，副总经理李华林、副总裁冉新权、总地质师王道富相继被宣布调查，9 月 1 日刚从中石油调任国资委主任的蒋洁敏也被查。BBC 当时评论，联系到先前落马的郭永祥和李春城，“似乎显示周永康在石油系统和四川的利益集团正在逐一被清洗”，并引《南华早报》说，北戴河会议已敲定对周展开调查。12 月，中石油总会计师温青山被传协助调查；12 月 20 日公安部副部长李东生、12 月 29 日四川省政协主席李崇禧先后被宣布调查，清查从石油、四川延伸到政法系统。
      cites: [c03-ccdi-2012-12-06-li-chuncheng-probe, f06-chinanews-2013-08-28-cnpc-three, c03-12371-2013-09-01-jiang-jiemin-probe, b03-bbc-2013-08-30-zhou-clique, c03-mos-2013-12-20-li-dongsheng-probe, r01-ccdi-2013-12-29-li-chongxi-probe]
    - h: 核查、立案与审判
      from: 2013-12-01
      to: 2015-06-11
      text: 2014 年 12 月的官方通报披露，2013 年 12 月 1 日中央政治局常委会已听取“中央纪委在查办案件中发现的周永康违纪线索情况的汇报”，决定开展核查；这一步当时没有公布。路透社 2014 年 3 月引述消息来源称（BBC 转述），已有超过 300 名周的亲友和亲信被拘押或审问，没收财产至少 900 亿元，周本人拒不配合并坚称遭到政治迫害。2014 年 7 月 29 日中央政治局会议决定立案审查，12 月 5 日开除党籍、移送司法。2015 年 5 月 22 日，天津一中院以涉及国家秘密为由不公开开庭，6 月 11 日宣判：认定他本人收受蒋洁敏财物 73.11 万元，周滨、贾晓晔收受吴兵、丁雪峰、温青山、周灏财物 1.29 亿余元并事后告知他；滥用职权要求蒋洁敏、李春城为周滨等人经营提供帮助，使其非法获利 21.36 亿余元；把 5 份绝密级、1 份机密级文件交给曹永正。三罪并罚决定执行无期徒刑。他在最后陈述中说，“有关人员对我家人的贿赂，实际上是冲着我的权力来的”。
      cites: [b03-people-2014-12-06-zhou-expelled, b03-bbc-2014-03-30-zhou-assets, b03-gov-2014-07-29-zhou-probe, e03-xinhua-2015-06-11-zhou-verdict]
    - h: 三条线上的人
      from: 1988
      to: 2015-06
      text: 石油线以蒋洁敏为首。他的判决书写明，2004 年至 2008 年他“在周永康指使或授意下，违反规定，为他人开展经营活动提供帮助”；王永春的判决书没有提到周，但写明他“在蒋洁敏的授意下为他人开展经营活动提供帮助”，BBC 引报道称王是周在大庆时的得力助手。温青山的名字出现在周的判决书里，他通过周滨夫妇向周行贿。四川线以李春城为代表，检方指控他任成都市长、市委书记期间“在周永康的授意下”为他人谋取不当利益；李崇禧、谭力被新京报称为获周提拔走上高位的官员。时任四川省委书记王东明 2015 年说，周长期插手四川事务，给四川政治生态造成的恶劣影响不可低估。政法线上，李东生 2009 年由宣传系统突然调任公安部副部长，天津公安局长武长顺、在中央政法委协助周工作十年的周本顺也被列入。把三条线串起来的是家族：判决认定的行贿人吴兵、丁雪峰、温青山、周灏，都是通过周滨、贾晓晔送钱。
      cites: [c03-xinhua-2015-10-12-jiang-jiemin-verdict, c08-people-2015-10-14-wang-yongchun-verdict, b03-bbc-2013-08-30-zhou-clique, b03-cnr-2015-10-15-zhou-disciples, e03-xinhua-2015-06-11-zhou-verdict]
    - h: 门徒的结局
      from: 2015-10-12
      to: 2017-02
      text: 周永康宣判后，旧部的案子集中审结。2015 年 10 月 12 日至 13 日，蒋洁敏被判 16 年、李春城 13 年、王永春 20 年、郭永祥 20 年；李东生 2016 年 1 月被判 15 年，冀文林 3 月被判 12 年，周滨 6 月 15 日在宜昌被判 18 年，谭力 10 月被判无期徒刑，周本顺 2017 年 2 月被判 15 年。新京报注意到，蒋洁敏、李春城都因如实供述与周有关的滥用职权事实等情节获从轻或减轻处罚。另一部分人始终没有公开结论：李华林、冉新权、王道富 2013 年 8 月被调查后，截至 2015 年 10 月仍未通报调查结果；温青山辞职后“再未出现在公众视野”；沈定成据报道已处于“失去联系”状态。
      cites: [b03-cnr-2015-10-15-zhou-disciples, c03-xinhua-2016-01-12-li-dongsheng-verdict, c07-court-2016-03-30-ji-wenlin, b03-court-2016-06-15-zhou-bin, f09-people-2016-10-14-tan-li, c03-xinhua-2017-02-15-zhou-benshun-verdict]
    - h: 从“腐败”到“政治阴谋”
      from: 2016-10
      to: 2017-10
      text: 判决只涉及受贿、滥用职权和泄密，但官方定性此后逐步升级。2016 年 10 月，习近平在十八届六中全会上点名周永康、薄熙来、郭伯雄、徐才厚、令计划等人，说他们不仅经济上贪婪、生活上腐化，而且“政治上野心膨胀，大搞阳奉阴违、结党营私、拉帮结派等政治阴谋活动”；BBC 认为这似乎显示导致他们下台的是党内权力斗争而不是腐败。2017 年十九大分组讨论时，证监会主席刘士余进一步说这些人“阴谋篡党夺权”，自由亚洲电台指出这话未见于大陆媒体，学者洪振快则说公开的审判材料中“并没有正式指控他们篡党夺权或者阴谋政变”。
      cites: [b03-xinhua-2017-01-01-xi-6th-plenum, b03-bbc-2017-01-02-xi-conspiracy, b03-rfa-2017-10-20-liu-shiyu]
  editor:
    - text: 这场清洗的顺序是先剪羽翼、后动本人。从 2012 年 12 月的李春城到 2013 年底的李东生、李崇禧，外围官员落马的顺序与周永康的仕途阶段大致对应；官方通报则把立案说成是“在查办案件中发现”线索的结果。北京学者张鸣对 BBC 分析，这是通过薄熙来案件一层一层把周的羽翼逐一击破，再拿下周本人。官方从不承认权力斗争，但 2016 年起的“政治阴谋活动”定性，实际上承认了这些案件的政治性质；在可公开的判决层面，罪名仍只有受贿、滥用职权和泄密。
      cites: [b03-people-2014-12-06-zhou-expelled, f01-bbc-2014-07-30-zhou-analysis, b03-xinhua-2017-01-01-xi-6th-plenum, e03-xinhua-2015-06-11-zhou-verdict]
    - text: 制度上，周永康的网络依托的是三种长期缺少外部监督的结构：石油央企对项目和油田合作的支配权、省委书记离任后对原省人事的影响力，以及政法委书记以常委身份统管公检法和国安的体制。判决认定的 21 亿余元非法获利，正是靠蒋洁敏、李春城分别在石油和成都“开绿灯”实现的；王东明所说的“长期插手四川事务”，指的也是离任后的人事影响。十八大后政法委书记改由政治局委员兼任、不再进入常委会，可视为对这一体制的直接调整。
      cites: [e03-xinhua-2015-06-11-zhou-verdict, b03-cnr-2015-10-15-zhou-disciples, b03-bbc-2012-11-19-zhou-zhengfa]
    - text: 处理方式上，当局在“刑不上常委”的惯例与稳定之间取了中间路线：立案前先做了七个多月的秘密核查，立案和开除都只发简短通报；审判以涉及国家秘密为由不公开进行，只播放周滨、贾晓晔的作证录像；量刑上采纳了“绝大部分贿赂系其亲属收受且其系事后知情”等从轻情节，判无期而非死缓。周当庭表示不上诉，并称对他的处理“体现了全面从严治党、全面依法治国的决心”。
      cites: [b03-people-2014-12-06-zhou-expelled, e03-xinhua-2015-06-11-zhou-verdict]
  voices:
    - voice: official
      text: 周永康的所作所为完全背离党的性质和宗旨，严重违反党的纪律，极大损害党的形象，给党和人民事业造成重大损失，影响极其恶劣。
      quote: true
      cite: b03-people-2014-12-06-zhou-expelled
    - voice: official
      text: 新京报把周的旧部归为四川系、石油帮、政法系、秘书帮，称他几乎在每一个仕途阶段都有不少“门徒”。
      cite: b03-cnr-2015-10-15-zhou-disciples
    - voice: zh
      text: BBC 认为，习近平指责五人搞“政治阴谋活动”，似乎显示导致他们下台的是党内权力斗争而不是腐败；章立凡对《南华早报》说，反腐不仅是要廉政，也涉及权力斗争。
      cite: b03-bbc-2017-01-02-xi-conspiracy
    - voice: scholar
      text: 张鸣认为，当局是通过薄熙来案件一层一层击破周的羽翼，再拿下周本人，以扫除“习李新政”的改革阻碍。
      cite: f01-bbc-2014-07-30-zhou-analysis
    - voice: scholar
      text: 洪振快说，公开的审判材料“并没有正式指控他们篡党夺权或者阴谋政变”，刘士余的说法与官方文件不同。
      cite: b03-rfa-2017-10-20-liu-shiyu
    - voice: zh
      text: （传闻）台湾《苹果日报》等报道称，周与薄熙来、徐才厚、令计划组成“新四人帮”并图谋政变；此说从未获官方证实，审判材料中也没有相应指控。
      cite: b03-bbc-2014-07-30-taiwan-media
