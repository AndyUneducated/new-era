- id: gu-junshan
  title: 谷俊山案：从总后营房部到徐才厚
  kind: case
  years: 2012–2015
  people: [gu-junshan, liu-yuan, liao-xilong, hu-jintao, xu-caihou, guo-boxiong, lan-weijie, liu-zheng, wang-shouye]
  summary: >-
    谷俊山是胡锦涛、习近平交接军权前后落马的总后勤部副部长、中将。他长期执掌总后勤部基建营房部，经手全军营房建设和军产土地出让，2012 年初在总后政委刘源以党委名义举报后被拿下，2015 年 8 月被军事法院以五罪判处死缓。
    他的案子之所以重要，不在于金额，而在于它牵出了谁：官方说他归案后揭发他人有“重大立功表现”，外媒普遍报道他供出了靠山徐才厚。从谷俊山到徐才厚、郭伯雄，再到此后多年的“肃清郭徐流毒”，军队反腐的第一条线索从这里开始。
  sections:
    - h: 从濮阳军分区到总后营房部
      from: 1971
      to: 2009
      text: >-
        谷俊山 1971 年参军，在沈阳军区航空兵当地勤。1985 年百万大裁军时，岳父托关系把他调回河南老家濮阳军分区搞第三产业，他由此躲过转业，以善于接待上级见长，一路升到济南军区生产办公室。2001 年 7 月他进京任总后勤部基建营房部副部长，2007 年任部长，2009 年升总后勤部副部长，2011 年晋中将。
        财新记述，一位老上级说他“我曾说他无德无才无貌。现在看来，也不能说是无才，会来事就是一种才能”。案发后军方的说法更严厉：解放军报称郭伯雄、徐才厚“将品行低劣的谷俊山火箭般擢升为总后勤部副部长，甚至不惜改年龄、涂档案”。他的官方出生年月是 1956 年 10 月，发小和战友则说他实际生于 1954 年。
      cites: [b13-caixin-2014-01-14-gu-tiger, f01-thepaper-2017-guo-xu]
    - h: 军产土地与“事故多发地”
      from: 2001
      to: 2012
      text: >-
        基建营房部管全军营房和军用土地出让，正赶上军队大规模营区整治和城市土地升值。财新援引知情人士报道，谷俊山在多宗城市黄金地段军产土地出让中收受巨额回扣，还与地产商约定差价利润的六成归他；上海一块卖了 20 多亿元的军产地，约 6% 是他的回扣。路透社则报道调查发现他在北京市中心拥有数十套公寓。
        这个部门并非第一次出事。《环球人物》称总后基建营房部是“事故多发地”，谷俊山的前任王守业早已落马。2013 年 8 月，国防大学教授公方彬大校首次公开提及此案时说：“谷俊山及其前任犯罪，连续两个军队高官出现犯罪，老百姓不满意。”
      cites: [b13-caixin-2014-01-14-gu-tiger, b13-cnbc-2014-01-15-gu-raid, f09-hqrw-2015-01-26-army-tigers]
    - h: 刘源举报
      from: 2011-12
      to: 2012-02
      text: >-
        2010 年刘少奇之子刘源出任总后勤部政委，成为谷俊山的上级。据观察者网转述军事科学院罗援少将的说法，刘源和总后党委“以党委的名义举报谷俊山的贪腐问题”；谷俊山扬言“我后面也有人”，总后部长廖锡龙回应“我廖锡龙上过战场，死都不怕，还怕一个贪官？”刘源则说“我宁可乌纱帽不要了，也要拿下这个贪官！”
        刘源在总后会议上公开谈腐败的讲话，时间有两种记载：长安街知事记为 2011 年 12 月 28 日，胡佛研究所《中国领导人观察》记为 2012 年 1 月 18 日，并称讲话后几天谷俊山即被拿下。公方彬后来披露，总后领导向时任军委主席胡锦涛汇报此案两个多小时，“胡主席下决心惩处谷俊山，才将其绳之以法”。2012 年 2 月，谷俊山不再担任总后副部长。
      cites: [c05-caixin-2016-02-26-liu-yuan, b13-guancha-2015-12-24-liu-yuan, b13-hoover-2012-04-liu-yuan, f09-hqrw-2015-01-26-army-tigers, b13-caixin-2014-01-14-gu-tiger]
    - h: 查抄、公诉与死缓
      from: 2013-01
      to: 2015-08
      text: >-
        2013 年 1 月 12 日，军事检察人员查抄谷俊山在濮阳东白仓村的宅邸，运走四卡车财物；《环球人物》称从其家中搜出 1000 多箱茅台酒和大量名表、首饰、字画。2014 年 3 月 31 日，军事检察院以涉嫌贪污、受贿、挪用公款、滥用职权罪提起公诉。
        2015 年 8 月 10 日，军事法院一审以贪污、受贿、挪用公款、行贿、滥用职权五罪判处他死缓，剥夺中将军衔。法院负责人说，“鉴于案件中一些犯罪事实证据涉及军事秘密，依法进行不公开开庭审理”，又说“谷俊山归案后揭发他人犯罪行为，经查证属实，具有重大立功表现”，这是从轻处罚的理由之一。
      cites: [b13-cnbc-2014-01-15-gu-raid, f09-hqrw-2015-01-26-army-tigers, b13-people-2014-03-31-gu-prosecuted, c03-xinhua-2015-08-10-gu-junshan-verdict, b13-court-2015-08-10-gu-qa]
    - h: 牵出徐才厚
      from: 2012
      to: 2014-06
      text: >-
        官方从未说明谷俊山揭发了谁，但外媒的说法大体一致。BBC 中文写道“谷俊山在審訊中供出了他的主要靠山徐才厚”，纽约时报在徐才厚被开除党籍当天写道：“调查进一步指向了谷的靠山，前中央军委副主席徐才厚。”2014 年 3 月徐才厚被组织调查，6 月 30 日被开除党籍。
        法院答问中另有一句：“对军事检察机关提起公诉的涉谷俊山案其他人员，军事法院严格依法进行审理”，说明此案从一开始就不是单人案。
      cites: [b13-bbc-2014-08-01-liu-yuan, b07-nyt-2014-06-30-xu-caihou, c03-bbc-2015-08-10-gu-junshan, b07-xinhua-2014-06-30-xu-expulsion, b13-court-2015-08-10-gu-qa]
    - h: 旧部与接班人
      from: 2012-12
      to: 2015-03
      text: >-
        谷俊山的老部下、基建营房部工程管理局原局长兰伟杰，后任湖北省军区副司令员，2015 年 1 月被广州军区军事法院以受贿、巨额财产来源不明和非法持有枪支弹药罪判处无期徒刑，名列军方公布的第二批 14 名军级以上落马干部。
        接替谷俊山的人也没能幸免。2012 年末接任总后副部长的刘铮，2014 年 11 月被军事检察机关立案侦查；香港商报称他“也是徐才厚的老乡”。同一份报道把谷俊山和郭伯雄之子郭正钢称为以徐才厚为更大靠山的人。
      cites: [f09-rmzxw-2015-03-03-army-tigers, a01-wiki-lan-weijie, f09-hqrw-2015-01-26-army-tigers, f09-hkcd-2016-07-12-guo-xu-tigers]
    - h: 举报人的去向
      from: 2012-11
      to: 2016-02
      text: >-
        刘源没有进入 2012 年 11 月产生的十八届军委，继续任总后政委。2015 年底他退役，2016 年 2 月出任全国人大财经委副主任委员。美国之音称他曾协助胡锦涛打掉谷俊山这只大老虎，之后却“刘源莫名其妙地退出了军界政界”。
      cites: [c02-xinhua-2012-11-15-18-1-plenum, c05-caixin-2016-02-26-liu-yuan, f02-voa-2024-04-princelings, c05-voa-2024-04-04-princelings]
  editor:
    - text: >-
        谷俊山案发生在胡锦涛交出军权前夕，结案却在习近平任内，因而同时被两种叙事使用：海外媒体把它记为胡锦涛的军中反腐成果，官方此后则把它当作郭伯雄、徐才厚用人腐败的头号例证。两种说法并不矛盾——案子由总后党委举报、胡锦涛拍板启动，而它的政治分量要等到谷俊山供述牵出徐才厚后才真正显现。
        纽约时报引述分析人士的话说，此前军队已有五年多没有高调腐败案，这更多反映政治约束而非真实腐败程度；换言之，这个案子能被查，本身就是军中权力格局松动的信号。
      cites: [f02-voa-2024-04-princelings, f01-thepaper-2017-guo-xu, b13-nyt-2012-11-15-pla-corruption, b13-bbc-2014-08-01-liu-yuan]
    - text: >-
        从制度上看，此案暴露的是后勤系统的结构性风险：营房与军产土地出让由少数部门把持，前后两任主官相继落马，接班人随后也被立案。军方后来的检讨把重点放在选人用人——“改年龄、涂档案”——而不是土地交易本身，这也预示了此后“肃清郭徐流毒”以人事网络为主要对象的走向。
      cites: [f09-hqrw-2015-01-26-army-tigers, f01-thepaper-2017-guo-xu]
  voices:
    - voice: official
      text: 将品行低劣的谷俊山火箭般擢升为总后勤部副部长，甚至不惜改年龄、涂档案
      quote: true
      cite: f01-thepaper-2017-guo-xu
    - voice: official
      text: 谷俊山案件重大复杂，犯罪涉及面广
      quote: true
      cite: b13-court-2015-08-10-gu-qa
    - voice: witness
      text: 这已经涉及到共产党和解放军的生死存亡，我宁死也不会放手。
      quote: true
      cite: b13-guancha-2015-12-24-liu-yuan
    - voice: zh
      text: 在谷俊山被捕之前，中国人民解放军已经有五年多没有发生备受瞩目的腐败案件了，这说明的更多是反腐执法所受的政治约束，而不是人民解放军真实的腐败程度
      quote: true
      cite: b13-nyt-2012-11-15-pla-corruption
    - voice: zh
      text: 谷俊山涉贪被捕后，供出徐才厚之犯罪详情，间接将徐拉下马
      quote: true
      cite: c03-bbc-2015-08-10-gu-junshan
  events: [e05-2012-gu-junshan-removed, e03-2014-xu-caihou-expelled]
  factions: [guo-xu]
  cites: [b13-caixin-2014-01-14-gu-tiger, b13-guancha-2015-12-24-liu-yuan, b13-hoover-2012-04-liu-yuan, b13-court-2015-08-10-gu-qa, c03-xinhua-2015-08-10-gu-junshan-verdict, f01-thepaper-2017-guo-xu, c03-bbc-2015-08-10-gu-junshan, f09-hqrw-2015-01-26-army-tigers]

- id: guo-xu-legacy
  title: 郭徐之后：“肃清流毒”的十年
  kind: cluster
  years: 2014–2021
  people: [guo-boxiong, xu-caihou, xi-jinping, zhang-yang, gu-junshan, guo-zhenggang, liu-zheng, liu-hongjie, yu-daqing, yang-jinshan, tian-xiusi, yang-shiguang, fang-fenghui, chen-xi]
  summary: >-
    郭伯雄、徐才厚是胡锦涛时期的两位军委副主席，也是解放军建军以来因违纪违法被查处的职务最高的军官。两人落马后，“肃清郭徐流毒影响”成为军队政治工作的长期主题，提法从 2014 年的“彻底肃清影响”一路升到“全面彻底肃清”，定性从经济腐败扩展到“政治野心家、阴谋家”。
    这场运动的主要对象不是钱，而是人：凡由郭徐提拔、与郭徐有乡谊或旧部关系的将领都被重新审视。十九大前后，田修思、王建平、房峰辉、张阳相继落马，后两人被写进与郭徐并列的名单，2021 年的历史决议给这一阶段作了结论。
  sections:
    - h: 两名副主席
      from: 2014-03
      to: 2016-07
      text: >-
        2014 年 3 月 15 日，中共中央决定对已退休的前军委副主席徐才厚进行组织调查，6 月 30 日开除其党籍，受贿问题移送军事检察机关。2015 年 3 月 15 日徐才厚因膀胱癌死亡，军事检察院依法作出不起诉决定。
        郭伯雄 2015 年 4 月 9 日被组织调查，7 月 30 日被开除党籍。2016 年 7 月 25 日军事法院以受贿罪判处他无期徒刑，认定他“利用职务便利为他人谋取职务提拔或者调整”收受财物，并以涉及军事秘密为由不公开审理。法院同样提到将审理“涉郭伯雄案其他人员”。
      cites: [b07-xinhua-2014-06-30-xu-expulsion, b07-xinhua-2015-03-16-xu-death, b07-xinhua-2015-07-30-guo-expulsion, b07-xinhua-2016-07-25-guo-sentence]
    - h: 提法的升级
      from: 2014-10
      to: 2017-04
      text: >-
        2014 年 10 月 31 日古田全军政治工作会议上，习近平第一次公开谈及徐才厚案：“特别要高度重视和严肃看待徐才厚案件，深刻反思教训，彻底肃清影响”。12 月 10 日解放军报头版评论把徐才厚斥为“国妖”。据政知圈统计，仅 2015 年头三个月，总政治部主任张阳就至少在 6 个公开场合提到肃清徐才厚案的影响。
        郭伯雄被判刑后，提法再次加码。胡佛研究所的《中国领导人观察》注意到官方媒体自 2016 年 7 月起使用肃清郭徐“流毒影响”的新表述；联合早报 2017 年 4 月引述港媒消息概括，提法从“彻底肃清”“更加彻底肃清”“深入彻底肃清”，一直发展到“全面彻底肃清”。
      cites: [f09-hqrw-2015-01-26-army-tigers, b21-sina-2017-11-28-zhang-xu, b07-hoover-clm-guo-xu-poison, a01-zaobao-2017-04-14-yang-shiguang]
    - h: 肃清什么
      from: 2016-08
      to: 2016-10
      text: >-
        2016 年 8 月 26 日，张阳以全军贯彻落实古田政工会精神领导小组组长身份讲话，要求扭住“六个肃清”全面起底问题积弊，领导干部要做到情感上憎恨、政治上决裂，与郭徐的圈子、品行、套路、作风划清界限，并在医疗卫生、军需能源、物资采购、装备系统、有偿服务等领域开展专项清理整治。
        10 月新华社长文说，郭伯雄、徐才厚“其流毒影响是全面的、深层次的”，要求“把见怪不怪的潜规则清干净，把扭曲颠倒的价值标准正过来”。解放军报的总结更直白：两人“表面任人唯贤，背后任人为钱；表面五湖四海，背后拉帮结派”，并称这是“郭徐严重违纪违法最突出的要害”。
      cites: [b21-cnr-2016-08-27-zhang-gutian, b07-xinhua-2016-10-11-guo-xu-poison, f01-thepaper-2017-guo-xu]
    - h: 被点名与被牵连的人
      from: 2014-07
      to: 2017-04
      text: >-
        官方点名的郭徐用人案例有两个：被“火箭般擢升”的谷俊山，和被“拔苗助长般地提升”为“70 后”将军的郭伯雄之子郭正钢，后者晋升少将仅 46 天就被立案。香港商报还列出接替谷俊山的刘铮（徐才厚老乡）和被称为郭徐“大管家”的军委办公厅直属工作局原局长刘洪杰。
        与徐才厚有总政干部部渊源的二炮原副政委于大清 2014 年 12 月被立案；成都军区原副司令员杨金山 2014 年被查，官方 2016 年把他与郭徐、谷俊山并列为已查处的“一批严重违纪违法人员”。空军原政委田修思 2016 年 7 月被立案审查，BBC 称他与郭徐和薄熙来均有往来。海军政治工作部主任杨世光 2017 年 4 月后再未见公开活动，官方至今没有公布对他的处理。
      cites: [f01-thepaper-2017-guo-xu, f09-rmzxw-2015-03-03-army-tigers, f09-hkcd-2016-07-12-guo-xu-tigers, f09-hqrw-2015-01-26-army-tigers, c03-xinhua-2016-07-09-tian-xiusi-probe, c03-bbc-2016-07-09-tian-xiusi, a01-zaobao-2017-04-14-yang-shiguang]
    - h: 从腐败到“政治野心家”
      from: 2016-10
      to: 2017-11
      text: >-
        2016 年 10 月六中全会上，习近平在关于党内政治生活准则的说明中把郭徐与周永康、薄熙来、令计划并列，称这些案件“不仅暴露出他们在经济上存在严重问题，而且暴露出他们在政治上也存在严重问题”。2017 年十九大的中纪委工作报告要求全党深刻剖析周永康、薄熙来、郭伯雄、徐才厚、孙政才、令计划等案件。
        十九大后，中组部部长陈希撰文，直接把这六人称为“政治野心家、阴谋家”。至此，郭徐的定性已与政治局层面的周永康、薄熙来等完全并列。
      cites: [b07-people-2016-11-03-xi-explanation, b04-gov-2017-10-29-ccdi-report, b09-xinhua-2017-11-16-chen-xi-article]
    - h: 名单从两人变成四人
      from: 2017-11
      to: 2021-11
      text: >-
        十九大前落马的张阳和房峰辉被直接纳入同一框架。解放军报评论称对张阳组织谈话是“全面彻底肃清郭伯雄、徐才厚流毒影响工作的重要组成部分”，对房峰辉也用了几乎相同的措辞。到 2020 年，人民日报的提法已变成“全面彻底肃清郭伯雄、徐才厚、房峰辉、张阳流毒影响”。
        2021 年 11 月的第三份历史决议写道，人民军队曾有一个时期“党的领导弱化问题突出”，党中央“坚决查处郭伯雄、徐才厚、房峰辉、张阳等严重违纪违法案件并彻底肃清其流毒影响”，推动政治生态“根本好转”。
      cites: [b21-81cn-2017-11-28-zhang-commentary, b13-people-2018-01-10-pla-daily-fang, f02-rmrb-2020-12-03-guo-xu, b04-gov-2021-11-16-resolution]
  editor:
    - text: >-
        “肃清流毒”是一种以人事为中心的清理方式。官方把郭徐的要害定为“任人为钱”“拉帮结派”，等于宣布由他们经手提拔的整批将领都需要重新甄别；定性从经济问题升到“政治野心家、阴谋家”，又让清理获得了超出反腐的政治正当性。这场运动与 2015 年底开始的军改同步推进，张阳部署的专项清理也覆盖了装备、物资采购等此后反复出事的领域。
      cites: [f01-thepaper-2017-guo-xu, b09-xinhua-2017-11-16-chen-xi-article, b21-cnr-2016-08-27-zhang-gutian]
    - text: >-
        从制度原因看，历史决议把问题归结为军队“党的领导弱化”，开出的药方是“全面深入贯彻军委主席负责制”，即把人事和指挥权收归军委主席。值得注意的是，在“全面彻底肃清”运动中担任组长、多次痛批郭徐的张阳，本人后来也被列入流毒名单——这说明这套框架既能用来清理前任的网络，也能随时延伸到执行者身上。
      cites: [b04-gov-2021-11-16-resolution, c02-wiki-zhang-yang, b21-81cn-2017-11-28-zhang-commentary]
  voices:
    - voice: official
      text: 郭伯雄、徐才厚是我军建军以来因违纪违法被查处的职务最高的领导干部
      quote: true
      cite: b07-xinhua-2016-10-11-guo-xu-poison
    - voice: official
      text: 表面任人唯贤，背后任人为钱；表面五湖四海，背后拉帮结派
      quote: true
      cite: f01-thepaper-2017-guo-xu
    - voice: doc
      text: 坚决查处郭伯雄、徐才厚、房峰辉、张阳等严重违纪违法案件并彻底肃清其流毒影响，推动人民军队政治生态根本好转
      quote: true
      cite: b04-gov-2021-11-16-resolution
    - voice: scholar
      text: In July 2016, Chinese state media began using a new formulation about “eliminating the baneful [pernicious] influence of Guo Boxiong and Xu Caihou” from the military.
      quote: true
      cite: b07-hoover-clm-guo-xu-poison
    - voice: zh
      text: （传闻）港媒引述接近海军的消息称，杨世光约于 2017 年 4 月 5 日被双规，可能被视为徐才厚余毒；官方从未证实。
      cite: a01-zaobao-2017-04-14-yang-shiguang
  events: [e03-2014-xu-caihou-expelled, e03-2014-gutian-political-work, e03-2015-guo-boxiong-expelled, e03-2016-sixth-plenum-core, e10-2016-guo-boxiong-sentenced, e10-2016-guo-xu-poison-campaign]
  factions: [guo-xu]
  cites: [b07-xinhua-2014-06-30-xu-expulsion, b07-xinhua-2015-07-30-guo-expulsion, b07-xinhua-2016-07-25-guo-sentence, f09-hqrw-2015-01-26-army-tigers, b07-xinhua-2016-10-11-guo-xu-poison, b21-cnr-2016-08-27-zhang-gutian, b09-xinhua-2017-11-16-chen-xi-article, b04-gov-2021-11-16-resolution]

- id: cmc-2017
  title: 十九大前的军委换班：房峰辉、张阳与四位上将
  kind: cluster
  years: 2016–2019
  people: [fang-fenghui, zhang-yang, wang-jianping, tian-xiusi, liu-shengjie, xi-jinping, li-zuocheng, xu-qiliang, zhang-youxia, wei-fenghe, miao-hua, zhang-shengmin, fan-changlong, chang-wanquan, zhao-keshi, wu-shengli, ma-xiaotian]
  summary: >-
    2016 年夏到 2017 年秋，两名现任军委委员和两名上将在十九大前相继出局：空军原政委田修思、联合参谋部副参谋长王建平先被立案，联合参谋部参谋长房峰辉、政治工作部主任张阳在大会前两个月突然消失，张阳在接受组织谈话期间自缢身亡。后勤保障部副部长刘生杰也在同期被撤销中央纪委委员。
    十九届军委由 11 人缩为 7 人，十八届委员中只有许其亮、张又侠、魏凤和留任。这次换班确立了此后军中先消失、再缺席、数月后才官宣的处理模式。
  sections:
    - h: 十八届军委
      from: 2012-11
      to: 2016-01
      text: >-
        2012 年 11 月十八届一中全会决定的军委有 11 人：主席习近平，副主席范长龙、许其亮，委员常万全、房峰辉、张阳、赵克石、张又侠、吴胜利、马晓天、魏凤和，委员中包括四总部首长和海空军、二炮司令员。
        军改撤销四总部，2016 年 1 月军委机关改为 15 个职能部门。原总参谋长房峰辉改任联合参谋部参谋长，原总政治部主任张阳改任政治工作部主任。
      cites: [c02-xinhua-2012-11-15-18-1-plenum, e08-xinhua-2016-01-11-cmc-organs, c02-wiki-zhang-yang]
    - h: 田修思与王建平
      from: 2016-07
      to: 2017-10
      text: >-
        2016 年 7 月 9 日，新华社报道空军原政委、全国人大外事委副主任委员田修思上将因涉嫌严重违纪被立案审查。8 月，香港南华早报引述消息来源称联合参谋部副参谋长、武警部队原司令员王建平上将已被捕，BBC 转述称他被视为周永康的亲信。
        王建平缺席了 2016 年 10 月的六中全会。12 月 29 日，国防部发言人在记者会上被问及此事，答称王建平“因涉嫌受贿犯罪，军事检察机关已对其立案侦查”。2017 年 10 月 14 日，十八届七中全会审议通过中央军委关于王建平、田修思严重违纪问题的审查报告，确认开除两人党籍。
      cites: [c03-xinhua-2016-07-09-tian-xiusi-probe, f02-bbc-2016-08-26-wang-jianping, c03-bbc-2016-12-29-wang-jianping, c03-mod-2016-12-29-wang-jianping, c03-xinhua-2017-10-14-seventh-plenum]
    - h: 两名军委委员消失
      from: 2017-08
      to: 2017-11
      text: >-
        房峰辉最后一次公开露面是 2017 年 8 月 21 日会见泰国武装部队最高司令。此前几个月他还随习近平访美、出席中美外交安全对话，并与来访的美军参联会主席邓福德签署两军联合参谋部对话框架文件。此后不久，李作成接任联合参谋部参谋长的消息传出，房峰辉去向未作说明。
        9 月公布的军队十九大代表名单中没有房峰辉和张阳，国防部被美国之音问及时既未确认也未否认。11 月 28 日新华社发布：8 月 28 日中央军委决定对张阳进行组织谈话，调查核实其涉郭伯雄、徐才厚等案问题线索；接受组织谈话期间他一直在家中居住，11 月 23 日上午在家中自缢死亡。12 月国防部发言人被问及房峰辉，答称“你谈到的这个情况我不了解”。
      cites: [b13-bbc-2018-01-10-fang-fenghui, b13-voa-2017-09-07-fang-zhang, c02-xinhua-2017-11-28-zhang-yang]
    - h: 刘生杰
      from: 2017-10
      to: 2017-10
      text: >-
        2017 年 10 月十八届中央纪委八次全会确认了中央纪委常委会此前作出的“撤销刘生杰同志中央纪委委员职务”的决定，没有说明原因，公报仍称他为“同志”。刘生杰时任军委后勤保障部副部长，此前是总后勤部副政委兼纪委书记。此后官方未公布对他的立案或处分。
      cites: [r03-ccdi-2017-10-09-ccdi-8th-plenum]
    - h: 七人军委
      from: 2017-10-25
      to: 2017-10-25
      text: >-
        2017 年 10 月 25 日十九届一中全会决定的新一届军委只有 7 人：主席习近平，副主席许其亮、张又侠，委员魏凤和、李作成、苗华、张升民。十八届的 11 人中，范长龙、常万全、赵克石、吴胜利、马晓天未进入新一届，房峰辉、张阳出局，只有许其亮、张又侠、魏凤和留任。新进入的李作成、苗华都是在房峰辉、张阳消失前后接掌联合参谋部和政治工作部的。
      cites: [c02-xinhua-2012-11-15-18-1-plenum, c02-xinhua-2017-10-25-19-1-plenum, b13-voa-2017-09-07-fang-zhang, f02-dw-2025-10-20-nine-generals]
    - h: 定案
      from: 2018-01
      to: 2019-02
      text: >-
        2018 年 1 月，房峰辉涉嫌行贿、受贿犯罪被移送军事检察机关，解放军报称这是“全面彻底肃清郭伯雄、徐才厚流毒影响的重要组成部分”。10 月 16 日，中央军委同日公布开除房峰辉、张阳党籍，对两人都用了“对党不忠诚不老实，搞两面派做两面人”的定性；对张阳还写明他“以自杀方式企图逃避党纪国法的惩处”。
        2019 年 2 月 20 日，军事法院以受贿、行贿、巨额财产来源不明罪判处房峰辉无期徒刑。
      cites: [b13-people-2018-01-10-pla-daily-fang, c02-xinhua-2018-10-16-fang-fenghui, b21-xinhua-2018-10-16-zhang-yang-expel, c02-court-2019-02-20-fang-fenghui]
  editor:
    - text: >-
        这次换班的政治意义在于时间点：四名上将都在十九大人事定盘前被移出，新一届军委只由留任者和习近平任内提拔的人组成，委员人数从 11 人压到 7 人，权力更集中到军委主席和少数机构首长手中。房峰辉、张阳被写进“郭徐流毒”名单，使这次清理在官方叙事中成为肃清前任网络的延续，而不是新一轮权力调整。
      cites: [c02-xinhua-2017-10-25-19-1-plenum, b13-people-2018-01-10-pla-daily-fang, b04-gov-2021-11-16-resolution]
    - text: >-
        这次换班也确立了一种信息模式：先是公开活动中断，再是缺席代表名单或重要会议，官方在记者会上既不确认也不否认，数月后才公布处理结果。这一模式在 2023 年以后的火箭军、装备系统和军委高层案件中被反复重复。而 2017 年组成的七人军委，此后几乎全部出局：魏凤和 2026 年被判死缓并终身监禁，苗华 2025 年被开除党籍，张又侠 2026 年被开除党籍。
      cites: [b13-voa-2017-09-07-fang-zhang, b13-bbc-2018-01-10-fang-fenghui, b08-gov-2026-05-07-wei-li-sentenced, e04-gov-2025-10-23-4th-plenum, b08-mod-2026-09-21-zhang-liu-expelled]
  voices:
    - voice: official
      text: 对张阳进行组织谈话，调查核实他的涉案问题，这是全面彻底肃清郭伯雄、徐才厚流毒影响工作的重要组成部分
      quote: true
      cite: b21-81cn-2017-11-28-zhang-commentary
    - voice: official
      text: 张阳对党不忠诚不老实，搞两面派做两面人，政治蜕变、经济贪婪、生活腐化、品行低劣
      quote: true
      cite: b21-xinhua-2018-10-16-zhang-yang-expel
    - voice: zh
      text: 评论认为，军方高层人事异动凸显中共领导人习近平急于抓军权，排除隐患以确保十九大人事布局平稳顺利。
      quote: true
      cite: b13-voa-2017-09-07-fang-zhang
    - voice: zh
      text: （传闻）香港《星岛日报》称房峰辉是郭伯雄的老乡兼旧部、张阳是徐才厚的嫡系，两人由习近平亲自下令调查；官方未作此说明。
      cite: c02-zaobao-2018-01-10-fang-fenghui
  events: [e08-2016-cmc-organs-reorganized, e08-2017-zhang-yang-suicide, e08-2019-fang-fenghui-sentenced, e10-2017-liu-shengjie-ccdi-removed]
  factions: [guo-xu]
  cites: [c02-xinhua-2012-11-15-18-1-plenum, c02-xinhua-2017-10-25-19-1-plenum, c03-mod-2016-12-29-wang-jianping, c03-xinhua-2017-10-14-seventh-plenum, c02-xinhua-2017-11-28-zhang-yang, b13-bbc-2018-01-10-fang-fenghui, r03-ccdi-2017-10-09-ccdi-8th-plenum, c02-xinhua-2018-10-16-fang-fenghui, c02-court-2019-02-20-fang-fenghui]

- id: rocket-force
  title: 火箭军窝案：两任司令员与“空降”的接班人
  kind: system
  years: 2023–2026
  people: [li-yuchao, zhou-yaning, lyu-hong, li-tongjian, li-chuanguang, zhang-zhenzhong, liu-guangbin, sun-jinming, xu-zhongbo, wei-fenghe, wang-houbin, xu-xisheng, zhang-fengzhong, wang-zhibin, yang-guang-pla, miao-hua]
  summary: >-
    2023 年夏，掌管中国核导弹力量的火箭军司令员、政委同时被撤换，接任者分别来自海军和空军。此后半年，两任火箭军司令员李玉超、周亚宁和装备部长吕宏等人被罢免人大代表，前火箭军司令员、国防部长魏凤和被开除党籍。
    清理并未就此结束：2023 年空降而来、负责收拾局面的司令员王厚斌，以及新上任的政治工作部主任张凤中、纪委书记汪志斌，又在 2025 年相继落马。火箭军成为习近平第三个任期军队清洗的起点，也是至今被清理得最彻底的军种之一。
  sections:
    - h: 魏凤和之后的火箭军
      from: 2016
      to: 2023-06
      text: >-
        二炮改建为火箭军后，首任司令员魏凤和 2018 年转任国防部长，继任的周亚宁、李玉超分别是火箭军第二、三任司令员，李玉超 2022 年 1 月上任。同一时期升任火箭军副职的还有 2016 年先后出任副司令员的张振中和李传广，后者兼任参谋长；孙金明 2022 年 3 月由 64 基地司令员升任火箭军参谋长。
      cites: [b13-guardian-2024-06-27-wei-li, a02-caixin-2024-02-04-nine-generals, f01-bbc-2023-08-01-rocket-force, c08-thepaper-2016-08-zhang-zhenzhong, f10-wiki-sun-jinming]
    - h: 司令员和政委同时换人
      from: 2023-07
      to: 2023-07-31
      text: >-
        2023 年 7 月 31 日，中央军委晋升王厚斌、徐西盛为上将，并宣布两人分别任火箭军司令员和政治委员，间接证实李玉超和政委徐忠波已经离职。BBC 指出李玉超任职仅一年半，而“新晋升的王厚斌和徐西盛都从未在火箭军服役”：王厚斌来自海军，徐西盛来自空军。
        火箭军前副司令员、时任联合参谋部副参谋长张振中其实早在 7 月 7 日就已被联合参谋部军人代表大会罢免全国人大代表，但这一消息直到 12 月底才公布。另一名副司令员刘光斌，官方至今从未提及。
      cites: [f01-bbc-2023-08-01-rocket-force, a02-wikisource-npc-qualification-reports]
    - h: 先罢免，后公布
      from: 2023-09
      to: 2024-02
      text: >-
        2023 年 9 月 26 日，火箭军军人代表大会罢免了装备部原部长吕宏、司令员李玉超和前司令员周亚宁的全国人大代表职务；两天后，火箭军装备部原副部长李同建以“涉嫌严重违纪和职务犯罪”被驻京部队罢免北京市人大代表；12 月 5 日又罢免了前副司令员李传广。
        这些决定直到 12 月 29 日全国人大常委会才一并公告，与张振中、装备发展部两名副部长张育林和饶文敏、海军的鞠新春、空军的丁来杭共九人，当时未说明原因。2024 年 2 月人大公报才写明九人全部“涉嫌严重违纪违法”，财新指出，李玉超由此成为“205名二十届中央委员中首名被官方确认涉嫌严重违纪违法者”。
      cites: [a02-wikisource-npc-qualification-reports, a02-bjrd-2023-li-tongjian, c03-xinhua-2023-12-29-npc-notice-2, a02-caixin-2024-02-04-nine-generals]
    - h: 党纪处理
      from: 2023-09
      to: 2024-07
      text: >-
        2024 年 6 月 27 日，中央政治局会议决定开除魏凤和党籍，通报说军委纪委监委早在 2023 年 9 月 21 日就对他立案，认定他违规为他人谋取人事利益、收受巨额钱款，“严重污染部队政治生态”。7 月三中全会确认开除李尚福、李玉超、孙金明三人党籍。
        处理并不一致。被免职的政委徐忠波 2024 年 3 月仍以全国人大代表身份公开出席会议，港媒据此认为“说明其被免职只是为腐败案负领导责任”；周亚宁、吕宏、李传广、张振中被罢免人大代表后，未见官方公布对他们的立案或处分。2026 年 5 月，魏凤和以受贿罪被判处死缓并终身监禁。
      cites: [c02-gov-2024-06-27-wei-fenghe-expelled, c03-gov-2024-07-18-third-plenum, c08-zaobao-2024-03-06-xu-zhongbo, b08-gov-2026-05-07-wei-li-sentenced]
    - h: 接班人也落马
      from: 2023-12
      to: 2025-10
      text: >-
        2023 年后进入火箭军的新领导层同样没能站住。从陆军调任火箭军纪委书记的汪志斌，2025 年 7 月 18 日被陆军军人代表大会以涉嫌严重违纪违法罢免全国人大代表。2025 年 10 月 17 日，国防部宣布司令员王厚斌与何卫东、苗华等九名上将一并被开除党籍、军籍；BBC 称王厚斌是“苗华的海军旧部，后跨军种升任火箭军司令”。
        2023 年 4 月升任火箭军政治工作部主任的张凤中没有出现在国防部的九人名单里，他的名字只出现在四中全会公报中：全会确认了对他的开除党籍处分。政委徐西盛此后长期未公开露面，联合早报 2026 年 8 月仍把他列为久未露面的上将之一，官方未通报其去向。
      cites: [a02-wikisource-npc-qualification-reports, f10-wiki-wang-zhibin, b08-mod-2025-10-17-nine-generals, b04-bbc-2025-10-nine-generals, f10-wiki-zhang-fengzhong, e04-gov-2025-10-23-4th-plenum, k06-zaobao-2026-08-03-fifth-plenum-generals]
    - h: 基地一级
      from: 2026-01
      to: 2026-04
      text: >-
        2026 年 1 月 19 日，火箭军军人代表大会以涉嫌严重违纪违法罢免了第 64 基地原司令员杨光的全国人大代表职务。4 月公布的人大公报披露，他此时的最后职务已是湖北省军区正职副司令员。64 基地也是孙金明升任参谋长前任职的基地。
      cites: [a02-wikisource-npc-qualification-reports, a02-zaobao-2026-04-18-nine-generals, f10-wiki-sun-jinming]
  editor:
    - text: >-
        2023 年的撤换方式——两名外军种将领同时空降——被分析人士解读为有意打散火箭军内部的庇护网络。但两年后，空降司令员王厚斌本人被归入苗华的海军旧部，与何卫东、苗华同批出局。也就是说，用来清理火箭军的人选，本身就出自后来被整体清算的人事系统。火箭军案因此不只是一个军种的腐败案，而是连接 2023 年装备系统清查与 2025 年政工系统清洗的枢纽。
      cites: [b13-guardian-2024-06-27-wei-li, b04-bbc-2025-10-nine-generals, b08-mod-2025-10-17-nine-generals]
    - text: >-
        从制度原因看，史宗瀚认为近年对战略核力量的大规模投资带来庞大资金，使一批军官在更少监督下腐化；火箭军案中被点名最多的岗位恰是装备部和装备采购。信息公开方面，此案也显示了人大代表资格报告的作用：罢免决定往往比公告早数月，原因又比公告晚数月才写进公报，外界只能靠这些文件和公开活动拼出时间线。
      cites: [b04-bbc-2025-10-nine-generals, a02-wikisource-npc-qualification-reports, a02-caixin-2024-02-04-nine-generals]
  voices:
    - voice: official
      text: 魏凤和身为党和军队高级领导干部，信仰坍塌、忠诚失节，其行为辜负党中央、中央军委信任重托，严重污染部队政治生态
      quote: true
      cite: c02-gov-2024-06-27-wei-fenghe-expelled
    - voice: west
      text: Analysts said that this suggested an attempt to break patronage networks in the unit.
      quote: true
      cite: b13-guardian-2024-06-27-wei-li
    - voice: zh
      text: 有分析认为， 这是近十年来中国军方领导层最大一次意料之外的改组。
      quote: true
      cite: f01-bbc-2023-08-01-rocket-force
    - voice: zh
      text: （传闻）南华早报 2023 年 7 月引述两名知情人士称，李玉超、副司令员刘光斌和前副司令员张振中已被军委纪委调查人员带走；对刘光斌，官方至今没有任何说法。
      cite: c03-zaobao-2023-07-28-rocket-force
    - voice: zh
      text: （传闻）彭博社报道美国情报评估称，腐败导致导弹中注水而不是燃料、西部基地导弹发射井井盖无法有效开合；报道同时说明，该评估无法得到独立证实。
      cite: e06-dw-2024-01-07-water-missiles
  events: [rocket-force-reshuffle, generals-npc-removed, e06-2024-water-missiles, third-plenum-20th, nine-generals-expelled, e10-2023-cppcc-three-aerospace, e10-2023-equipment-clues-notice]
  factions: [rocket-equipment]
  cites: [f01-bbc-2023-08-01-rocket-force, a02-wikisource-npc-qualification-reports, c03-xinhua-2023-12-29-npc-notice-2, a02-caixin-2024-02-04-nine-generals, c02-gov-2024-06-27-wei-fenghe-expelled, c03-gov-2024-07-18-third-plenum, b08-mod-2025-10-17-nine-generals, e04-gov-2025-10-23-4th-plenum]

- id: equipment-aerospace
  title: 装备系统与军工航天：从李尚福到许学强
  kind: system
  years: 2023–2026
  people: [li-shangfu, zhang-yulin, rao-wenmin, xu-xueqiang, wu-yansheng, liu-shiquan, wang-changqing, yuan-jie, cao-jianguo, liu-guozhi, zhao-xiaozhe, yang-wei, zhang-youxia, wei-fenghe, shang-hong, wang-xiaojun, chen-guoying, chen-ximing-casic, luo-qi, zhou-xinmin, liu-cangli, ding-shufan]
  summary: >-
    与火箭军案同时展开的，是对中央军委装备发展部和军工央企的清查。国防部长、前装备发展部部长李尚福 2023 年消失，2026 年被判死缓并终身监禁；装备发展部两名副部长、接替他的部长许学强先后被罢免人大代表。军工一侧，航天科技、兵器工业、航天科工、中国航发、航空工业、中国工程物理研究院的负责人相继被撤政协委员、罢免人大代表或悄然去职。
    军委科学技术委员会的两任主任刘国治、赵晓哲则被两院从院士名单中删除。这条线最终延伸到长期主管装备系统的张又侠。
  sections:
    - h: “2017 年 10 月以来”
      from: 2017-09
      to: 2023-07
      text: >-
        李尚福长期在航天发射和装备部门工作，曾任西昌卫星发射中心主任、总装备部副部长，2016 年任战略支援部队副司令员兼参谋长，2017 年 9 月出任中央军委装备发展部部长，2023 年 3 月接替魏凤和任国务委员兼国防部长。
        2023 年 7 月，装备发展部发布公告，开展“装备采购招标评审专家违规违纪清查整肃治理活动”，公开征集 2017 年 10 月以来的问题线索。联合早报指出，这个起点与李尚福接掌装备发展部的时间高度重合，活动实际是在清查他主管时期的问题。
      cites: [b08-zaobao-2023-09-15-li, f02-zaobao-2024-06-27-li-wei, f01-bbc-2023-08-01-rocket-force]
    - h: 国防部长消失
      from: 2023-07
      to: 2024-06
      text: >-
        李尚福 2023 年 7 月下旬从公众视线消失。后来的通报显示，军委纪委监委 8 月 31 日即已对他立案；10 月 24 日全国人大常委会免去他的国务委员、国防部长职务，未说明原因。2024 年 7 月 11 日，中央军委办公厅军人代表大会罢免了他的全国人大代表。
        2024 年 6 月 27 日他被开除党籍，通报认定他“违规为本人和他人谋取人事利益”、受贿并行贿，“严重污染军队装备领域政治生态和行业领域风气”。2026 年 5 月 7 日，军事法院以受贿、行贿罪判处他死缓，期满减为无期徒刑后终身监禁，与魏凤和同日宣判。
      cites: [f02-zaobao-2024-06-27-li-wei, b08-gov-2024-06-27-li-shangfu-expelled, b08-gov-2023-10-24-order-14, a02-wikisource-npc-qualification-reports, b08-gov-2026-05-07-wei-li-sentenced]
    - h: 副部长与第一批军工老总
      from: 2023-11
      to: 2024-04
      text: >-
        2023 年 11 月 28 日，装备发展部军人代表大会罢免副部长张育林、饶文敏的全国人大代表。12 月 27 日，全国政协撤销航天科技集团董事长吴燕生、兵器工业集团董事长刘石泉、航天科工集团副总经理王长青的政协委员资格，未说明原因。运载火箭技术研究院院长王小军的委员资格由 2024 年 1 月 29 日的全国政协主席会议撤销，3 月 2 日政协常委会把四人的撤销一并追认；另说自由亚洲电台把王小军与 12 月的三人并列，未给出单独日期。
        2024 年 4 月 12 日，航天科工召开会议宣布陈锡明任董事长，自由亚洲电台注意到“消息中只字未提袁洁”——这位二十届中央候补委员此前已数月未露面；兵器装备集团总经理陈国瑛也同日被替换。
      cites: [a02-wikisource-npc-qualification-reports, a02-caixin-2023-12-27-cppcc-three, c11-people-2024-01-30-cppcc-wang-xiaojun, c11-cppcc-2024-03-02-ratify, k06-rfa-2024-04-15-yuan-jie]
    - h: 第二批军工高管
      from: 2025-03
      to: 2026-04
      text: >-
        2025 年 3 月，中国航发董事长曹建国从集团官网撤下，此后未再露面；12 月 24 日全国政协撤销他与另外七人的委员资格。随后的人大代表资格报告又披露：航空工业集团原董事长周新民 2025 年 12 月 30 日被上海市人大常委会罢免，中国工程物理研究院原院长刘仓理 2026 年 1 月 9 日被四川省人大常委会罢免，中核集团原总工程师罗琦 1 月 25 日被山东省人大常委会罢免。
        与军人代表常见的“涉嫌严重违纪违法”不同，三人的罢免理由写的是“涉嫌违纪违法”。联合早报指出，三人此前同样已缺席重要场合或不明原因去职。
      cites: [k05-cna-2025-12-24-cppcc, a02-wikisource-npc-qualification-reports, a02-zaobao-2026-04-18-nine-generals]
    - h: 院士名单上的删除
      from: 2025-01
      to: 2026-08
      text: >-
        2026 年 3 月，联合早报报道中国科学院院士名单中“名单上现在没有刘国治的名字”。刘国治曾任中国核试验基地司令员、总装备部科技委主任和中央军委科技委主任，是十九届中央委员；同一时期，歼-20 总设计师杨伟的简历被中科院撤下，刘仓理也不在院士名单内。
        8 月 18 日，中国工程院官网院士名单“由978人减为977人”，被删去的是另一位军委科技委原主任、二十届中央委员赵晓哲。两人都没有官方立案或处分通报，删除院士名衔是外界唯一能看到的信号。
      cites: [k05-zaobao-2026-03-20-cas, k06-zaobao-2026-08-18-zhao-xiaozhe]
    - h: 许学强
      from: 2022-10
      to: 2026-08
      text: >-
        空军出身的许学强 2022 年 10 月接替李尚福任装备发展部部长。2026 年 5 月 26 日，装备发展部军人代表大会以涉嫌严重违纪违法罢免了他的全国人大代表职务，6 月 26 日全国人大常委会公告，8 月公报写明原因；官方未公布立案消息。
        台湾学者丁树范分析，军中反腐从火箭军开始，之后扩大到装备发展部，“可能是一串粽子挖出来”。
      cites: [f10-wiki-xu-xueqiang, a02-wikisource-npc-qualification-reports, c03-xinhua-2026-06-26-npc-notice-18, a02-zaobao-2026-08-07-six-generals]
  editor:
    - text: >-
        装备系统与张又侠的关系是理解这条线的关键。张又侠在习近平第一个任期执掌总装备部和装备发展部，李尚福是他的继任者。海外分析人士在张又侠 2026 年 1 月落马后普遍指出，他长期掌管的装备采购系统正是这轮腐败丑闻的中心；李尚福倒台、多名秘书被查，被视为张又侠出事的前兆。从 2023 年的评审专家清查到 2026 年张又侠被开除党籍，装备系统案在政治上的终点，是军委最高层的一次重大人事清算。
      cites: [f01-bbc-2026-01-27-zhang-youxia, b08-mod-2026-09-21-zhang-liu-expelled, b08-zaobao-2023-09-15-li]
    - text: >-
        制度上，军方采购、军工央企和两院院士构成一个高度封闭的圈子：同一批航天和装备专家在部队、央企、评审专家库和院士名单之间流动，外部监督很弱。这批案件的信息几乎全部来自政协、人大和院士名单的删改，官方很少发布正式立案通报；军工高管的罢免理由写“涉嫌违纪违法”，与军人代表的“涉嫌严重违纪违法”措辞不同，可能反映两者分属不同的纪检和罢免程序。
      cites: [k06-rfa-2024-04-15-yuan-jie, a02-wikisource-npc-qualification-reports, k05-zaobao-2026-03-20-cas]
  voices:
    - voice: official
      text: 李尚福身为党和军队高级领导干部，背弃初心使命、丧失党性原则，其行为辜负党中央、中央军委信任重托，严重污染军队装备领域政治生态和行业领域风气
      quote: true
      cite: b08-gov-2024-06-27-li-shangfu-expelled
    - voice: zh
      text: 有关人士分析，虽然这次清查活动主要针对的是评审专家，但2017年10月这个时间点，却与李尚福2017年9月接掌中央军委装备发展部部长的时间高度重合。
      quote: true
      cite: b08-zaobao-2023-09-15-li
    - voice: zh
      text: 已经被撤消十四届全国政协委员资格的四个人加上在很可能会在未来三中全会上被逐出中央委员会的袁洁以及陈国瑛六人，全都是“火箭军窝案”的同案犯。
      quote: true
      cite: k06-rfa-2024-04-15-yuan-jie
    - voice: scholar
      text: 他长期掌管解放军装备采购系统——这正是腐败丑闻的“震中”。
      quote: true
      cite: f01-bbc-2026-01-27-zhang-youxia
  events: [e06-2023-li-shangfu-missing, li-shangfu-removed, generals-npc-removed, third-plenum-20th, e10-2023-equipment-clues-notice, e10-2023-cppcc-three-aerospace, e10-2024-yuan-jie-replaced, e10-2025-cppcc-eight-removed, e10-2026-npc-gazette-reasons, e10-2026-liu-guozhi-cas-removed, e10-2026-zhao-xiaozhe-cae-removed]
  factions: [equipment-system, aerospace, rocket-equipment]
  cites: [b08-zaobao-2023-09-15-li, b08-gov-2024-06-27-li-shangfu-expelled, b08-gov-2026-05-07-wei-li-sentenced, a02-wikisource-npc-qualification-reports, a02-caixin-2023-12-27-cppcc-three, k06-rfa-2024-04-15-yuan-jie, k05-cna-2025-12-24-cppcc, k05-zaobao-2026-03-20-cas, k06-zaobao-2026-08-18-zhao-xiaozhe]

- id: nine-generals-2025
  title: 九上将案：何卫东、苗华与“31 军”
  kind: cluster
  years: 2024–2025
  people: [he-weidong, miao-hua, he-hongjun, lin-xiangyang, qin-shutong, wang-xiubin, yuan-huazhi, wang-chunning, wang-houbin, zhang-fengzhong, zhang-shengmin, xi-jinping, tang-yong-pla, wang-peng-pla, wang-renhua, zhang-hongbing, wu-qian]
  summary: >-
    2025 年 10 月 17 日，四中全会召开前三天，国防部一次公布九名上将被开除党籍、军籍：军委副主席何卫东、军委委员苗华，以及政治工作部、联合作战指挥中心、东部战区、陆军、海军、火箭军、武警部队的主官或副手。何卫东是近 60 年来首位在任期间被清洗的军委副主席。
    这批人大多出身原南京军区和驻福建的第 31 集团军，几乎都是习近平任内快速提拔的将领，又多与主管全军人事七年的苗华有上下级关系。四中全会确认处分后，张升民被增补为军委副主席。
  sections:
    - h: 苗华停职
      from: 2024-11-28
      to: 2025-06-27
      text: >-
        2024 年 11 月 28 日，国防部宣布军委委员、政治工作部主任苗华上将“涉嫌严重违纪”，经党中央研究决定停职检查。2025 年 3 月 14 日，政治工作部军人代表大会罢免了他的全国人大代表职务，人大公报写的理由是“涉嫌严重违纪违法”，自由亚洲电台称这是官方首度明确提到他涉嫌违法。6 月 27 日，全国人大常委会免去他的国家军委委员职务。
        苗华长期在驻福建部队担任政工干部，2017 年 8 月接掌政治工作部，同年 10 月进入军委，此后主管全军干部人事直到停职。
      cites: [b08-mod-2024-11-28-miao-suspended, a02-wikisource-npc-qualification-reports, b08-rfi-2025-06-27-miao, b08-xinhua-2025-06-27-miao-removed, f02-dw-2025-10-20-nine-generals, b08-jamestown-2025-10-cronyism]
    - h: 何卫东消失
      from: 2025-03-11
      to: 2025-10
      text: >-
        何卫东最后一次公开露面是 2025 年 3 月 11 日的十四届全国人大三次会议闭幕式，此后接连缺席高层重要活动。3 月下旬美国媒体报道他可能被查，国防部发言人吴谦回应“没有这方面的消息，不了解这方面的情况”；三、四月的记者会上，两位发言人都没有证实或否认。
        何卫东在十九大时还不是中央委员或候补委员，二十大直接进入政治局并任军委副主席，主管军队政治和纪律事务。
      cites: [b04-bbc-2025-10-nine-generals, e06-rfi-2025-03-27-he-weidong, b08-rfi-2025-06-27-miao, b08-jamestown-2025-04-he-weidong]
    - h: 九人通报
      from: 2025-07
      to: 2025-10-17
      text: >-
        公布前，部分人已先在人大代表名单上消失：武警部队原司令员王春宁 2025 年 7 月 25 日被武警部队军人代表大会罢免，海军原政委袁华智 9 月 15 日被海军军人代表大会罢免。
        10 月 17 日国防部发言人张晓刚宣布，中央军委纪委监委对何卫东、苗华、何宏军、王秀斌、林向阳、秦树桐、袁华智、王厚斌、王春宁 9 人立案审查调查，认定他们“涉嫌严重职务犯罪，数额特别巨大”，开除党籍并移送军事检察机关，其中 8 名中央委员的处分待中央全会追认；立案日期没有公布。
      cites: [a02-wikisource-npc-qualification-reports, b08-mod-2025-10-17-nine-generals]
    - h: 四中全会
      from: 2025-10-20
      to: 2025-11-13
      text: >-
        10 月 23 日闭幕的四中全会审议通过中央军委关于何卫东、苗华、何宏军、王秀斌、林向阳、秦树桐、袁华智、王春宁、张凤中的审查报告，确认开除党籍——名单上多出了火箭军政治工作部主任张凤中，而非中央委员的王厚斌不在其中。全会同时增补张升民为军委副主席。
        此后的人大代表资格报告补齐了程序：11 月 10 日军委办公厅军人代表大会罢免何卫东，11 月 13 日政治工作部罢免何宏军，同批还有训练管理部原部长王鹏、军委政法委原书记王仁华，以及 10 月 30 日被罢免的武警部队原政委张红兵。
      cites: [e04-gov-2025-10-23-4th-plenum, a02-wikisource-npc-qualification-reports]
    - h: 31 军与东部战区
      from: 1985
      to: 2025
      text: >-
        BBC 指出，何卫东、苗华、林向阳、秦树桐、王秀斌都出身第 31 集团军，该军军部驻福建厦门同安；习近平 1985 至 2002 年在福建工作 17 年，期间曾 14 次视察该部队，2014 年建军节又专程视察。王春宁不属 31 军，但同属原南京军区；何宏军曾在兰州军区和军委政治工作部任苗华的下属或副手，袁华智、王厚斌则被 BBC 称为苗华在海军的旧部。
        詹姆斯敦基金会统计，九人中七人曾在东部战区一带任职；除何卫东、王春宁 2017 年 7 月晋升中将外，其余六人都是在苗华主管人事期间从少将升到上将的。
      cites: [b04-bbc-2025-10-nine-generals, b08-jamestown-2025-10-cronyism]
  editor:
    - text: >-
        九上将案的政治分量在于对象：BBC 统计，习近平上台后已有 22 名上将被开除党籍军籍，其中 14 人由他本人提拔，这次的 9 人全部在内。被清洗的是与他福建经历相连的 31 军系统，而不是前任留下的网络，官方叙事因此只能落在腐败与“职务犯罪”，不再沿用“肃清流毒”式的前任框架。海外分析多把此案与张又侠一方的较量联系起来，认为“东南—政工系”在 2024–2025 年的人事斗争中失势，但这一说法没有官方材料可以印证。
      cites: [b04-bbc-2025-10-nine-generals, b08-mod-2025-10-17-nine-generals, f01-bbc-2026-01-27-zhang-youxia]
    - text: >-
        制度上，此案暴露的是人事权的集中：政治工作部主任掌管全军晋升，军委副主席又分管政治和纪律，两人同属一个地缘网络时，提拔链条缺乏外部制衡。詹姆斯敦基金会认为何卫东在二十大后的人事推荐问题重重，许多晋升后的将领被查出腐败；BBC 则指出，官方对何卫东、苗华已使用“破坏军委主席负责制”的表述，问题被定性为对军委主席权力的侵蚀，而不仅是贪腐。
      cites: [b08-jamestown-2025-04-he-weidong, b08-jamestown-2025-10-cronyism, f01-bbc-2026-01-27-zhang-youxia]
  voices:
    - voice: official
      text: 对何卫东、苗华、何宏军等人的严肃查处，再次表明了党中央、中央军委将反腐败斗争进行到底的坚定决心，彰显了军中绝不允许有腐败分子藏身之地的鲜明态度
      quote: true
      cite: b08-mod-2025-10-17-nine-generals
    - voice: scholar
      text: The nine appear to have formed an improper network centered around Miao Hua and He Weidong.
      quote: true
      cite: b08-jamestown-2025-10-cronyism
    - voice: scholar
      text: >-
        The key question is this: if Xi Jinping can no longer trust the confidants who came up with him in the old 31st Group Army in Fujian Province, who can he still trust?
      quote: true
      cite: b08-jamestown-2025-10-cronyism
    - voice: zh
      text: 他们试图建立威胁军内权力平衡的权力基础，所以陷入麻烦。
      quote: true
      cite: b04-bbc-2025-10-nine-generals
    - voice: zh
      text: （传闻）2025 年 3 月下旬，《华盛顿时报》引述未具名美国防官员称，美国情报机构认为何卫东已是解放军高层清洗的最新对象；当时官方未证实。
      cite: e06-rfi-2025-03-27-he-weidong
  events: [miao-hua-suspended, e08-2025-miao-hua-deputy-removed, e06-2025-he-weidong-missing, nine-generals-expelled, fourth-plenum-20th, e10-2026-npc-gazette-reasons, e10-2024-info-support-force]
  factions: [he-miao, fujian-generals]
  cites: [b08-mod-2024-11-28-miao-suspended, b08-mod-2025-10-17-nine-generals, e04-gov-2025-10-23-4th-plenum, a02-wikisource-npc-qualification-reports, b04-bbc-2025-10-nine-generals, b08-jamestown-2025-10-cronyism, f02-dw-2025-10-20-nine-generals]

- id: zhang-youxia-2026
  title: 张又侠、刘振立案：军委只剩两人
  kind: case
  years: 2026
  people: [zhang-youxia, liu-zhenli, xi-jinping, zhang-shengmin, zhong-shaojun, ju-qiansheng, li-shangfu, he-weidong, miao-hua, dong-jun, gu-jun, jiang-bin, zhang-zongxun]
  summary: >-
    2026 年 1 月 24 日，排名第一的军委副主席张又侠和军委联合参谋部参谋长刘振立被宣布立案审查调查，次日解放军报社论指两人“严重践踏破坏军委主席负责制”。8 月 28 日两人被免去国家军委职务，9 月 21 日被开除党籍、军籍，罪名包括“搞团团伙伙，对党不忠诚不老实”。
    张又侠是开国上将张宗逊之子、少数有实战经历的将领，2022 年以 72 岁超龄留任，曾被视为习近平在军中最核心的盟友。他落马后，2022 年组成的七人军委只剩习近平和张升民，解放军首次没有一名现役陆军上将。处分仍待即将召开的五中全会追认。
  sections:
    - h: 超龄留任的副主席
      from: 1968
      to: 2022-10
      text: >-
        张又侠 1968 年入伍，参加过对越作战，是少数拥有实战经验的高级军官之一。他的父亲张宗逊是开国上将，曾与习近平之父习仲勋并肩作战，但 BBC 指出两人早年并无交集。习近平第一个任期内他执掌总装备部和装备发展部，继任者是后来落马的李尚福；2017 年他出任军委副主席。
        2022 年二十大上，72 岁的张又侠打破“七上八下”的惯例，留任政治局委员并升为排名第一的军委副主席，德国之声称这被视为对他支持习近平第三任期的回报。
      cites: [b04-bbc-2026-01-zhang-youxia, f01-bbc-2026-01-27-zhang-youxia, cs3-dw-2026-09-zhang-21st]
    - h: 立案与社论
      from: 2026-01-24
      to: 2026-01-25
      text: >-
        2026 年 1 月 24 日，国防部宣布张又侠、刘振立“涉嫌严重违纪违法，经党中央研究”，决定立案审查调查。亚洲协会的牛犇对 BBC 说，据他所知这种措辞在军队清洗公告中前所未有，暗示习近平本人异常深度的介入。
        次日解放军报社论称两人“严重践踏破坏军委主席负责制”，“对军队政治建军、政治生态和战斗力建设造成极大破坏”。BBC 比较指出，此前对何卫东、苗华的表述只是“破坏”，对张又侠加上了“严重践踏”，并且只有张、刘两人被指损害战斗力建设。
      cites: [b08-mod-2026-01-24-zhang-liu-probe, b08-mod-2026-01-24-pla-daily-editorial, f01-bbc-2026-01-27-zhang-youxia]
    - h: 外界说法与官方回应
      from: 2026-01-25
      to: 2026-01-29
      text: >-
        立案次日起，美国媒体援引知情人士报道了对张又侠的多项指控，包括泄露核武器技术资料、收受贿赂换取晋升（详见各方说法），称部分线索来自 1 月 20 日被宣布接受调查的中核集团前总经理顾军。国防部发言人蒋斌回应记者时说，“要以官方发布的信息为准”，“不要妄加揣测”。美国国务卿鲁比奥则在国会听证会上把原因归为贪腐。
      cites: [c10-dw-2026-01-26-zhang-nuclear, c10-zaobao-2026-01-29-zhang-denial]
    - h: 七个月的程序空档
      from: 2026-02
      to: 2026-08-28
      text: >-
        立案后，全国人大常委会多次罢免军队代表，张、刘却一直留在名单上。2026 年 2 月 26 日李桥铭等五名上将被罢免时，联合早报注意到“张又侠刘振立仍在代表名单”，受访学者对原因看法不一，有人认为军内尚未达成共识，有人认为只是案子未查完。
        8 月 28 日，全国人大常委会免去张又侠的国家军委副主席和刘振立的国家军委委员职务；同日公告显示，军委办公厅军人代表大会罢免了张又侠和钟绍军的全国人大代表，联合参谋部罢免了刘振立，信息支援部队罢免了巨乾生。美国之音指出，钟绍军曾长期任习近平的贴身秘书，此前任军委办公厅主任和国防大学政委；两人尚未被公开免去中共中央军委职务，官方也没有宣布接替人选。
      cites: [f10-zaobao-2026-02-27-five-generals, b08-xinhua-2026-08-28-zhang-liu-removed, c07-xinhua-2026-08-28-npc-deputies, b08-voa-2026-08-28-zhang-liu]
    - h: 开除党籍
      from: 2026-09-21
      to: 2026-09-23
      text: >-
        9 月 21 日，中央政治局会议审议通过中央军委关于两人问题的审查报告。通报称张、刘“搞团团伙伙，对党不忠诚不老实”，“利用职务便利为他人职务晋升等提供帮助，收受巨额钱款”，并“政治问题和经济问题交织，贪腐敛财与失职渎职并存”，决定开除党籍、终止二十大代表资格并移送军事检察机关，处分“待召开中央委员会全体会议时予以追认”。联合早报注意到，这次通报没有再用“严重践踏破坏军委主席负责制”的说法。
        9 月 23 日解放军报社论称，对两人的查处“为党和军队消除了重大政治隐患”。
      cites: [b08-mod-2026-09-21-zhang-liu-expelled, r01-zaobao-2026-09-23-zhang-liu, cs3-qstheory-2026-09-23-pla-daily-editorial]
    - h: 只剩两人的军委
      from: 2022-10
      to: 2026-10
      text: >-
        2022 年组成的军委，除习近平外原有六名将领，李尚福、苗华、何卫东先后落马，张又侠、刘振立之后只剩 2025 年 10 月增补为副主席的张升民。张升民长期主管纪律工作，中央社指出他增补副主席时并未进入政治局；国防部长董军接任后也一直没有进入军委。
        CSIS 认为军委中已没有一名作战系统出身的领导人；BBC 指出，解放军自实行军衔制以来首次出现现役陆军上将全部清零的局面。新加坡学者詹姆斯·查尔预计，军委要到 2027 年秋二十一大才会补齐。
      cites: [b04-bbc-2026-01-zhang-youxia, e04-gov-2025-10-23-4th-plenum, cs3-cna-2025-10-23-zhang-shengmin, b08-csis-2026-02-purges, f01-bbc-2026-01-27-zhang-youxia, cs3-dw-2026-09-zhang-21st]
  editor:
    - text: >-
        张又侠案在官方措辞上是十年来最重的一次：立案时“经党中央研究”，社论用“严重践踏破坏军委主席负责制”，结案时写“搞团团伙伙”并称消除“重大政治隐患”。这些词把案件定为政治案而不仅是贪腐案。海外分析对动机的解释分为两类：一类认为张又侠在何卫东一系倒台后权势过大，构成直接政治威胁；另一类认为装备采购腐败和备战目标落空被解读为不忠。CSIS 认为两者高度重叠，这种争论可能是伪命题。可以确定的是，此前被海外视为对立的“东南—政工系”与“西北—装备系”两条线，到 2026 年都已被清除。
      cites: [b08-mod-2026-01-24-zhang-liu-probe, b08-mod-2026-01-24-pla-daily-editorial, b08-mod-2026-09-21-zhang-liu-expelled, cs3-qstheory-2026-09-23-pla-daily-editorial, b08-csis-2026-02-purges, f01-bbc-2026-01-27-zhang-youxia]
    - text: >-
        制度上，“军委主席负责制”把最终权力集中于主席一人，而这起案件又把作为集体的军委掏空。CSIS 指出军委已无法作为有效的决策机构运作。程序上，此案也显示党、国两套职务的处理不同步：国家军委职务和人大代表资格 8 月已由人大常委会解除，党内处分则要等中央全会追认，军委的补缺要么在五中全会，要么推迟到二十一大。
      cites: [b08-csis-2026-02-purges, b08-voa-2026-08-28-zhang-liu, b08-mod-2026-09-21-zhang-liu-expelled, cs3-dw-2026-09-zhang-21st]
  voices:
    - voice: official
      text: 张又侠、刘振立身为党和军队的高级干部，却严重辜负党中央、中央军委信任重托，严重践踏破坏军委主席负责制
      quote: true
      cite: b08-mod-2026-01-24-pla-daily-editorial
    - voice: official
      text: 对他们的严肃查处，为党和军队消除了重大政治隐患，是军队反腐败斗争攻坚战持久战总体战的重大胜利
      quote: true
      cite: cs3-qstheory-2026-09-23-pla-daily-editorial
    - voice: scholar
      text: The Central Military Commission has ceased to function as an effective decisionmaking body, reduced to just Xi Jinping and anti-corruption czar Zhang Shengmin.
      quote: true
      cite: b08-csis-2026-02-purges
    - voice: zh
      text: 中国在军事上投入巨资，显然有人在侵吞这些资金，他们正试图解决这个问题。
      quote: true
      cite: c10-zaobao-2026-01-29-zhang-denial
    - voice: zh
      text: （传闻）《华尔街日报》引述知情人士称，张又侠在内部通报中被指控向美国泄露核武器核心技术资料，并收受贿赂、协助李尚福出任国防部长；中国国防部间接否认。
      cite: c10-dw-2026-01-26-zhang-nuclear
    - voice: zh
      text: （传闻）《华尔街日报》称张又侠 1 月 19 日在前往中央党校开会途中被捕，住所被搜查，其在军中任研究员的儿子被拘留。
      cite: cs3-chinatimes-2026-08-01-pla-purge
    - voice: zh
      text: （传闻）海外网站称习近平在行动前得知“阴谋”，双方在京西宾馆发生枪战；报道本身也承认未获证实。
      cite: e06-bannedbook-2026-01-26-jingxi
    - voice: zh
      text: （传闻）时评人蔡慎坤 2026 年 7 月称，张又侠在办案人员以其儿子为突破口后承认曾试图逼习近平交权；官方通报未出现这类说法。
      cite: r01-aboluowang-2026-08-29-zhang
  events: [zhang-youxia-investigated, e06-2026-jingxi-gunfight-rumour, r01-2026-zhang-coup-confession-rumour, e08-2026-zhang-liu-state-cmc-removed, zhang-liu-expelled, e10-2026-pla-daily-editorial, e10-2026-bayi-reception-dong-jun-only]
  factions: [zhang-liu, northwest-army, equipment-system]
  cites: [b08-mod-2026-01-24-zhang-liu-probe, b08-mod-2026-01-24-pla-daily-editorial, b08-xinhua-2026-08-28-zhang-liu-removed, c07-xinhua-2026-08-28-npc-deputies, b08-mod-2026-09-21-zhang-liu-expelled, cs3-qstheory-2026-09-23-pla-daily-editorial, b04-bbc-2026-01-zhang-youxia, f01-bbc-2026-01-27-zhang-youxia, b08-csis-2026-02-purges]

- id: theatre-absences
  title: 缺席与罢免：如何从公开记录看军中清洗
  kind: system
  years: 2023–2026
  people: [huang-ming-general, liu-qingsong, hu-zhongming, wu-yanan, wang-wenquan, wang-haijiang, li-fengbiao, wang-kai-pla, wang-qiang-pla, xu-deqing, yang-cheng-pla, xu-xisheng, xu-qiling, chang-dingqiu, guo-puxiao, yang-xuejun, liu-faqing, zhao-xiaozhe, zhang-hongbing, wang-chunning, yuan-huazhi, lin-xiangyang, wang-kangping, zhang-zhenzhong, deng-zhiping, you-haitao, li-pengcheng, wang-zhibin, yang-guang-pla, dong-jun, zheng-xuan, zhang-shaoying, wang-gang-af]
  summary: >-
    2023 年以来军中清洗的绝大部分信息，并不来自立案通报，而来自两类公开记录：将领在例行场合的缺席，以及全国人大常委会代表资格审查委员会的报告。前者只能提示“可能出事”，后者则写明哪一天、由哪个单位的军人代表大会、以什么理由罢免了谁。
    到 2026 年 8 月，五大战区的司令员、政委中，多人已长期不见公开活动而没有任何官方说法；同期，解放军和武警部队的全国人大代表三年内减少了数十人。本文整理这两条线索各自能说明什么、不能说明什么。
  sections:
    - h: 例行场合的空位
      from: 2025-07-31
      to: 2025-09
      text: >-
        2025 年 7 月 31 日建军节招待会上，据星岛日报比对央视画面，主桌上的现役上将从前一年的 19 人降到 12 人，缺席者包括武警部队司令员王春宁、政委张红兵和海军司令员胡中明、政委袁华智，军委政治工作部和中部战区都没有代表出席；次日辽宁的八一座谈会报道只见北部战区政委，“未提北部战区司令员黄铭”。
        8 月下旬习近平视察新疆时，西部战区司令员汪海江、政委李凤彪和西藏军区司令员王凯缺席；中部战区司令员王强、政委徐德清没有出任九三阅兵指挥官；9 月下旬习近平在新疆接见部队，新疆军区政委杨诚缺席。
      cites: [cs3-zaobao-2025-08-04-bayi-absent, a02-bbc-2025-10-fourth-plenum-absent]
    - h: 四中全会与福建舰
      from: 2025-10
      to: 2025-11
      text: >-
        2025 年 10 月的四中全会是一次集中检验。BBC 根据央视画面和港台媒体报道，列出北部战区司令员黄铭、东部战区政委刘青松、海军司令员胡中明等 13 名未出现的军方中央委员，但强调他们“只能说是被怀疑出事”，因为没有任何官方通报。
        11 月福建舰在三亚服役，金融时报注意到海军司令员胡中明、南部战区司令员吴亚男和政委王文全都不在场；该报称，上月全会缺席的军方高级将领有 27 人，“占該會議有軍方背景成員的64%”。
      cites: [a02-bbc-2025-10-fourth-plenum-absent, a02-cna-2025-11-14-ft-fujian]
    - h: 代表资格报告怎么读
      from: 2023-07
      to: 2026-06
      text: >-
        军人当选的全国人大代表，在被追究前须先由所在单位的军人代表大会罢免。人大常委会每两个月左右通过一份代表资格报告，固定格式是：“由中国人民解放军和中国人民武装警察部队选出的第十四届全国人民代表大会代表”某某，因涉嫌严重违纪违法，某日由某单位召开军人代表大会决定罢免。
        这份格式化的文件提供了三条信息。一是罢免日期，往往比公告早得多：张振中 2023 年 7 月 7 日被罢免，12 月底才公布；邓志平 2024 年 6 月 6 日被罢免，9 月才公布；何卫东 2025 年 11 月 10 日被罢免，12 月底的报告才写入。二是罢免单位，透露了当事人的组织归属：火箭军纪委书记汪志斌由陆军罢免，已调任湖北省军区的杨光仍由火箭军罢免。三是理由，有时比公告晚数月才在公报中出现，2023 年底的九名将领就是到次年 2 月才被写明“涉嫌严重违纪违法”。
      cites: [a02-wikisource-npc-qualification-reports, f10-caixin-2024-09-13-deng-zhiping, a02-caixin-2024-02-04-nine-generals]
    - h: 2026 年的罢免潮
      from: 2025-12
      to: 2026-08
      text: >-
        2026 年 2 月的报告一次列出九名军人代表：陆军原司令员李桥铭、73 集团军原军长丁来富，海军的沈金龙、秦生祥，空军的于忠福，火箭军的杨光，信息支援部队的李伟，以及政治工作部的边瑞峰和国防动员部的王东海。6 月的报告又有装备发展部长许学强、东部战区的王抗平、西部战区政委李凤彪、陆军的尹红星、空军政委郭普校和网络空间部队的张明华；8 月则轮到张又侠、钟绍军、刘振立和巨乾生。
        联合早报统计，解放军和武警部队的全国人大代表三年内减少了 38 人，台湾学者寇健文说“这个比例很吓人”；华尔街日报 2026 年 3 月的统计是约 36 人，占军队代表团最初 281 人的近 13%。
      cites: [a02-wikisource-npc-qualification-reports, c07-xinhua-2026-08-28-npc-deputies, f10-zaobao-2026-02-27-five-generals, cs3-chinatimes-2026-08-01-pla-purge]
    - h: 仍无说法的人
      from: 2025-10
      to: 2026-08
      text: >-
        截至 2026 年 8 月，联合早报整理的长期未公开露面的军方中央委员包括：东部战区原政委刘青松、南部战区原司令员吴亚男和原政委王文全、西部战区原司令员汪海江、北部战区原司令员黄铭、中部战区原政委徐德清，以及海军原司令员胡中明、火箭军原政委徐西盛、联合参谋部原副参谋长徐起零、中部战区原司令员王强、空军原司令员常丁求、军事科学院原院长杨学军，中将王凯、杨诚、刘发庆、赵晓哲。对这些人，官方没有发布任何立案、罢免或去向说明。
        中央社 7 月报道，在常丁求和刚被终止人大代表资格的空军政委郭普校超过半年未露面的情况下，“空軍軍事工作實際上已由王剛主持”，王刚随后晋升上将、任空军司令员。
      cites: [k06-zaobao-2026-08-03-fifth-plenum-generals, k05-cna-2026-07-03-air-force]
    - h: 没有点名的招待会
      from: 2026-07-31
      to: 2026-07-31
      text: >-
        2026 年 7 月 31 日的建军 99 周年招待会，新华社通稿只点名国防部长董军出席并致辞，其余只写“军委机关各部门、军队驻京有关单位领导等出席招待会”，没有提及任何军委成员。此时军委在任的只剩习近平和张升民。
      cites: [cs3-xinhua-2026-07-31-bayi-reception, e04-bbc-2026-09-21-cmc-two-left]
  editor:
    - text: >-
        缺席本身不是证据。一名将领可能因为调任、退役、生病或单纯没被拍到而不出现，BBC 也提醒这些人只是“被怀疑出事”；但当战区司令员、政委在全会、阅兵、迎春座谈会等多个固定场合连续缺席，而接任者陆续以新职务露面时，空位就成了外界判断人事变动的主要依据。这本身是信息高度管控的结果：军队高层的去留很少以通报形式公布，观察者只能从仪式反推权力。CSIS 认为，大量战区和军种领导岗位的空缺或新近补任，已经影响到指挥运作。
      cites: [a02-bbc-2025-10-fourth-plenum-absent, k05-cna-2026-07-03-air-force, b08-csis-2026-02-purges]
    - text: >-
        相比之下，人大代表资格报告是最系统、也最可核对的官方来源，原因在于制度：代表法要求追究在任代表前先罢免，这一步留下了日期、单位和理由。但它也有明显的局限：报告按会期汇总，公布一般滞后数月；罢免理由有时要等公报才出现；不是人大代表的将领根本不会出现在报告里。把缺席记录、代表资格报告和政协、院士名单的删改放在一起，才能拼出一个人从消失到被官方确认的大致时间线。
      cites: [a02-wikisource-npc-qualification-reports, a02-caixin-2024-02-04-nine-generals, a02-zaobao-2026-04-18-nine-generals]
  voices:
    - voice: zh
      text: 但这13名军方中央委员只能说是被怀疑出事，因为他们未被“官宣被查”
      quote: true
      cite: a02-bbc-2025-10-fourth-plenum-absent
    - voice: doc
      text: 由中国人民解放军和中国人民武装警察部队选出的第十四届全国人民代表大会代表李尚福，因涉嫌严重违纪违法，2024年7月11日，中央军委办公厅召开军人代表大会决定罢免李尚福的第十四届全国人民代表大会代表职务。
      quote: true
      cite: a02-wikisource-npc-qualification-reports
    - voice: zh
      text: 按正常惯例，应该会让退休将领当完这届人大代表，下一届才换掉。这个时候换，特别是那些快70岁被拿下的，说明出事的可能性还是比较大。
      quote: true
      cite: f10-zaobao-2026-02-27-five-generals
    - voice: scholar
      text: These include theater commands, service headquarters, and key national level departments such as for training and the joint staff.
      quote: true
      cite: b08-csis-2026-02-purges
