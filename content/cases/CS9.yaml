    - h: 2026年下半年：政治局委员和军委副主席被开除
      from: 2026-06-30
      to: 2026-10-20
      text: '6月30日中央政治局会议审议马兴瑞案，7月14日公布他被开除党籍和公职，通报称他“搞权色、钱色交易”，纵容放任亲属谋利，“大搞家族腐败”。7月7日，候补委员方红卫被开除。8月27日，江西省长叶建春在任上被查。8月28日，全国人大常委会免去张又侠的国家中央军委副主席、刘振立的国家中央军委委员职务，两人和钟绍军、巨乾生的全国人大代表资格同时终止；钟、巨两人被罢免没有公布原因，此前都没有立案消息。9月8日、9日，王祥喜、孙绍骋先后被开除党籍；孙绍骋的通报称他“对抗组织审查，搞迷信活动”，并“违规干预和插手司法活动”。9月21日，政治局会议决定五中全会10月26日至29日召开；同日国防部公布张又侠、刘振立被开除党籍，通报称两人“搞团团伙伙，对党不忠诚不老实”，“政治问题和经济问题交织，贪腐敛财与失职渎职并存，涉案金额特别巨大”；深圳原市长、候补委员覃伟中也在同一天被宣布审查调查。四中全会已确认开除的金湘军9月8日被判死缓；易会满9月30日被提起公诉。截至10月20日，易炼红、胡衡华、叶建春和候补委员费高云、徐留平、覃伟中仍只有立案消息，没有处分通报。'
