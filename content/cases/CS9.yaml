    - h: 通报措辞
      from: 2025-12-04
      to: 2026-09-21
      text: '这一批开除通报有几处共同的写法。第一，凡是中央委员、候补委员，通报末尾都写明“给予其开除党籍的处分，待召开中央委员会全体会议时予以追认”，张又侠、刘振立一份写作“给予2人开除党籍的处分”。文职人员的通报写“经中央纪委常委会会议研究并报中央政治局会议审议”，张、刘两人则是“经中央军委常务会议研究并报中共中央政治局会议审议”。第二，政治问题集中在几类说法：“对抗组织审查”见于蓝天立、费东斌、吴胜华、方红卫、孙绍骋的通报，“搞迷信活动”见于吴胜华、方红卫、孙绍骋、易会满，“结交政治骗子”见于蓝天立、费东斌、吴胜华，王莉霞、易会满被指“阳奉阴违”，方红卫被指“对组织不忠诚不老实”、“干扰巡视工作”。第三，最重的定性给了张又侠、刘振立：“与党离心离德”，“性质极其严重，影响极为恶劣”；马兴瑞的通报也用了“性质极其严重，影响极其恶劣”。第四，王祥喜的通报写他“严重违反党的组织纪律、廉洁纪律和生活纪律”，没有列入政治纪律，同批其他通报大多列在第一位。军队方面，除张又侠、刘振立外，没有一名将领有立案或开除通报，只能从人大代表资格审查报告里读到“涉嫌严重违纪违法”；巨乾生、钟绍军8月被罢免时，公告没有写原因。'
      cites: [k04-xinhua-2025-12-04-lan-tianli-expel, k06-xinhua-2025-12-05-fei-dongbin-expelled, k05-chinanews-2026-01-07-wu-shenghua, k05-xinhua-2026-02-12-wang-lixia, c03-xinhua-2026-04-30-yi-huiman-expel, k06-xinhua-2026-07-07-fang-hongwei-expelled, b08-xinhua-2026-07-14-ma-expelled, c03-xinhua-2026-09-08-wang-xiangxi-expel, c03-xinhua-2026-09-09-sun-shaocheng-expel, b08-mod-2026-09-21-zhang-liu-expelled, a02-wikisource-npc-qualification-reports, c07-xinhua-2026-08-28-npc-deputies]
    - h: 五中全会前夕
      from: 2026-09-21
      to: 2026-10-20
      text: '五中全会定于10月26日至29日召开，主要议程是审议《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》，本文写作时（10月20日）尚未举行。联合早报10月11日指出，“官方尚未公布全会是否增补政治局或中央军委成员，也没有公布中央委员、候补中央委员递补名单”。按本站口径，五中全会至少要追认8名中央委员和3名候补委员的开除党籍处分，共11人，已接近四中全会的14人；只有立案或罢免消息的19人会不会同时处理，取决于审查报告是否已经提交。'
      cites: [e04-news-2026-09-21-5th-plenum-set, cs9-zaobao-2026-10-11-fifth-plenum-vacancies, e04-gov-2025-10-23-4th-plenum, e03-ccdi-2015-10-29-5th-plenum]
  editor:
    - text: '编者分析：同样是“出事”，这30人走的是两条程序。文职人员先由中央纪委国家监委宣布立案，几个月后发开除通报，再移送起诉，每一步都有公开文件；将领除张又侠、刘振立外，只在所在单位军人代表大会罢免人大代表时留下记录，此后再无消息。四中全会追认的9名将领也是如此：他们在2025年10月17日由国防部一次宣布开除，此前除苗华被宣布停职检查外，没有一人有立案通报。按这一先例，11名只被罢免的中央委员将领和王抗平，很可能要等五中全会公报或国防部的集中通报才第一次被官方定性；在此之前，本站只按罢免记录写，不推定他们已被开除。'
      cites: [b08-mod-2025-10-17-nine-generals, b08-mod-2024-11-28-miao-suspended, e04-gov-2025-10-23-4th-plenum, a02-wikisource-npc-qualification-reports, b08-mod-2026-09-21-zhang-liu-expelled]
    - text: '编者分析：递补顺序是观察“出事”的一个提前信号，但不能单独作证据。四中全会跳过的8人中，方红卫两周后被查，王抗平七个月后被罢免，说明在全会召开时，组织上对其中至少两人已有判断；可另外6人至今没有任何消息，跳过也可能出于年龄、任职或其他本站不知道的原因。寇健文所说“有可能就是他们也出事了”，是推测，不是官方说法。'
      cites: [k02-xinhua-2022-10-22-20-cca, e04-gov-2025-10-23-4th-plenum, k06-xinhua-2025-11-07-fang-hongwei-probe, a02-wikisource-npc-qualification-reports, cs9-zaobao-2026-10-11-fifth-plenum-vacancies]
    - text: '编者分析：与十八届、十九届比较，能直接从公报读出的只有出席人数、递补人数和追认人数。四中全会出席中央委员168人，比十八届届末七中全会的191人还少23人；但公报只给出席人数，不说明缺席原因，出席人数的下降包括被开除、被罢免、长期不露面和因病因事请假等多种情况，不等于实有人数。十九届从四中全会到六中全会，出席中央委员在197到202人之间，只递补过2人，本站没有收录十九届内大批中央委员出局的记录。'
      cites: [e04-gov-2025-10-23-4th-plenum, c03-xinhua-2017-10-14-seventh-plenum, i05-gov-2019-10-31-4th-plenum, e04-xinhua-2020-10-29-5th-plenum, e04-gov-2021-11-11-6th-plenum]
    - text: '编者分析：2026年被查的中央委员里，在任者不少：王祥喜、胡衡华、叶建春三名部长、市长、省长，费高云、徐留平两名候补委员，以及政治局委员马兴瑞、军委副主席张又侠，都是在任上被查。通报中“结交政治骗子”“搞迷信活动”“对抗组织审查”反复出现，与本站《政治骗子》专题的案件相互印证；但这些套语在非中央委员的通报中同样常见，本站不据此把30人归为同一个案件或派系。'
      cites: [c03-xinhua-2026-01-31-wang-xiangxi-probe, c03-xinhua-2026-03-20-hu-henghua-probe, f07-chinanews-2026-08-27-ye-jianchun, k06-xinhua-2026-05-06-fei-gaoyun-probe, c03-xinhua-2026-05-23-xu-liuping-probe, b08-xinhua-2026-04-03-ma-probe, b08-mod-2026-01-24-zhang-liu-probe, k04-xinhua-2025-12-04-lan-tianli-expel, k05-chinanews-2026-01-07-wu-shenghua]
  voices:
    - { voice: doc, text: 中央委员会委员出缺，由中央委员会候补委员按照得票多少依次递补。, cite: i01-12371-2022-10-22-party-charter, quote: true }
    - { voice: official, text: 搞团团伙伙，对党不忠诚不老实, cite: b08-mod-2026-09-21-zhang-liu-expelled, quote: true }
    - { voice: official, text: 在党内搞拉帮结派，培植个人势力，搞投机钻营，结交政治骗子，对抗组织审查, cite: k04-xinhua-2025-12-04-lan-tianli-expel, quote: true }
    - { voice: zh, text: 报道称，再加上多名长时间未公开露面的军方中央委员，以及中共中央对外联络部前部长刘建超等人也出现不寻常卸任情况，届时被逐出中央委员会者或多达约30人。, cite: cs9-zaobao-2026-08-03-thirty-members, quote: true }
    - { voice: zh, text: 除已正式被处分者，张林、李桥铭、钟绍军、巨乾生等军方中央委员也已被罢免或终止全国人大代表资格，另有多名高级将领长期未公开露面，但尚不能据此认定均已落马。, cite: cs9-zaobao-2026-10-11-fifth-plenum-vacancies, quote: true }
    - { voice: scholar, text: 若把部分“失踪”、实际状况尚不明确的中央委员计算在内，最终可能需要递补约18至30人。, cite: cs9-zaobao-2026-10-11-fifth-plenum-vacancies, quote: true }
    - { voice: zh, text: 路透社引述知情人士称，李云泽因违纪问题被降职（联合早报转述）。官方没有公布他的任免消息，也没有立案通报。, cite: k06-zaobao-2026-08-07-li-yunze }
