    - h: 四中全会之后到2026年2月：先开除的一批
      from: 2025-07-21
      to: 2026-06-03
      text: '四中全会闭幕后，此前已被立案的几名中央委员、候补委员相继被开除党籍。2025年12月4日为广西壮族自治区政府原主席蓝天立（同年5月被查），通报称他“在党内搞拉帮结派，培植个人势力，搞投机钻营，结交政治骗子，对抗组织审查”；12月5日为国家铁路局原局长、候补委员费东斌；2026年1月7日为贵州毕节市委原书记、候补委员吴胜华；2月12日为内蒙古自治区政府原主席王莉霞，通报称她严重背离“两个维护”，落实党中央决策部署“阳奉阴违、自行其是”。此后进入司法程序：费东斌4月27日、蓝天立4月29日被提起公诉，王莉霞6月3日被最高检决定逮捕并在大庆提起公诉。军队一侧，四中全会没有处理此前已被罢免全国人大代表的军委后勤保障部原部长张林（2025年7月21日罢免，9月12日公告）。全会之后，军委训练管理部原部长王鹏、军委政法委原书记王仁华、武警部队原政委张红兵也在10月30日至11月10日间被所在单位的军人代表大会罢免，12月27日公告代表资格终止；人大代表资格审查报告称三人涉嫌严重违纪违法。这四名中央委员至今没有立案或处分通报。'
      cites: [k04-xinhua-2025-05-16-lan-tianli-probe, k04-xinhua-2025-12-04-lan-tianli-expel, k06-xinhua-2025-12-05-fei-dongbin-expelled, k05-chinanews-2026-01-07-wu-shenghua, k05-xinhua-2026-02-12-wang-lixia, k06-xinhua-2026-04-27-fei-dongbin-charged, k04-xinhua-2026-04-29-lan-tianli-charged, k05-chinanews-2026-06-03-wang-lixia, f10-xinhua-2025-09-12-npc-notice-12, f10-xinhua-2025-12-27-npc-notice-14, a02-wikisource-npc-qualification-reports, cs9-zaobao-2026-08-03-thirty-members]
    - h: 2026年上半年：在任者被查
      from: 2026-01-09
      to: 2026-06-26
      text: '2026年1月24日，国防部宣布中央政治局委员、中央军委副主席张又侠和中央军委委员、联合参谋部参谋长刘振立涉嫌严重违纪违法，“经党中央研究，决定对张又侠、刘振立立案审查调查”。半个月内，中央纪委国家监委又宣布孙绍骋（1月29日）、王祥喜（1月31日）、易炼红（2月10日）接受审查调查；孙、易两人已从省委书记转任全国人大专门委员会副主任委员，王祥喜是在任的应急管理部部长。3月20日，重庆市长胡衡华在任上被查，5月辞去市长；4月3日，政治局委员马兴瑞被查。4月30日，易会满被开除党籍，通报称他贯彻党中央关于资本市场的决策部署“阳奉阴违、推诿卸责，搞迷信活动”；同日易炼红被浙江省人大常委会罢免全国人大代表。5月，两名候补委员在任上被查：6日为合肥市委书记费高云，23日为全国总工会党组书记徐留平。人大代表一侧，信息支援部队原政委李伟、陆军原司令员李桥铭1月被罢免，2月26日公告；空军原政委郭普校、军委装备发展部原部长许学强、西部战区原政委李凤彪5月25日至27日被罢免，候补委员王抗平5月29日被罢免，6月26日一并公告，资格审查报告称他们都涉嫌严重违纪违法。同一份6月26日公告里还有胡衡华、马兴瑞、费高云和国家金融监督管理总局原局长、候补委员李云泽。据联合早报转述四川省人大常委会公报，李云泽被罢免的理由是严重违纪违法，但中央纪委没有发布立案消息，本站把他标为下落不明。判决方面，5月7日军事法院以受贿罪、行贿罪判处李尚福死缓并终身监禁；6月23日，候补委员朱芝松被南昌中院判处死缓。'
