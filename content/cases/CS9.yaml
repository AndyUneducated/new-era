    - h: 局限
      from: 2016-04-18
      to: 2026-10-20
      text: '这份统计有几项局限。第一，样本是本站已建卡的人，以省部级和中管企业、金融机构高管为主，不代表全部职务犯罪案件。第二，投案组只有21人，分档后每档1至5人，平均数受个案影响很大，比如5000万至1亿元一档如果去掉龚建华，平均刑期会降到9.3年。第三，“投案”取自纪委通报和判决报道，中央纪委2018年7月才开始在通报中写明投案，此前判决的人即使投案也可能没有记录。第四，同一档内金额并不相同，本篇没有控制档内金额差异。第五，判决报道是摘要，没有写某项情节不等于判决书没有认定，认罪认罚尤其如此，本站不能据此判断被告是否签署了具结书。第六，本篇与《数额与刑期》专题共用样本：那一篇按金额档看刑期，本篇按情节看刑期，两篇的数字口径一致，但本篇补读了“鉴于其”句，个别人的情节与网站页面显示的不同。'
      cites: [r04-ccdi-2018-07-31-ai-wenli-probe, cs9-gov-2018-10-26-cpl-amendment, cs6-court-2016-04-19-graft-interpretation]
  editor:
    - text: '编者分析：站内数据显示，影响刑期最大的情节是投案自首，而且关键在于法院是否写“减轻处罚”。受贿几千万元、本应判十年以上的人，投案后判7至9年的有艾文礼、张晓霈、秦光荣、任羽中、刘立宪等多人；没有投案的人，在5000万元以上一档已有三分之一判无期。金额再大，自首的作用就从减少刑期变成保住性命：董宏、王富玉受贿4亿多元，判决都写明“论罪应当判处死刑”，因自首等情节改判死缓。相反，只有立功而没有自首的人，刑期与什么情节都没有的人相差不到一年，而且法院可以像赖小民、沈德咏两案那样明确认定立功“不足以”从宽。'
      cites: [r04-ce-2019-04-18-ai-wenli-verdict, r05-sina-2024-04-30-zhang-xiaopei-verdict, c03-ccdi-2021-01-19-qin-guangrong-verdict, r08-people-2026-08-24-ren-yuzhong-verdict, t02-court-2024-12-24-liu-lixian-verdict, r04-court-2022-01-28-dong-hong-verdict, t02-bjnews-2022-01-17-wang-fuyu-verdict, c03-court-2021-01-05-lai-xiaomin-verdict, k04-xinhua-2023-08-04-shen-deyong-verdict]
    - text: '编者分析：投案的效果并不均等。王立科、杨发森都被中央纪委通报为“主动投案”，判决却没有认定自首，结果一个死缓并终身监禁、一个无期，与同金额档没有投案的人差别不大；陈雪枫“自动到案”，也判无期。判决没有解释原因，本站只能指出：通报里的“主动投案”和法律上的“自首”是两回事，后者还要求如实供述罪行。另一方面，“其他自首”组53人的有期刑期平均14.2年，比对照组还长，说明到案后主动交代一部分罪行而被认定为自首，常常只对那一项罪名减轻，对总刑期影响有限，徐鸣、唐双宁、李春良等人的判决都是对贪污罪或利用影响力受贿罪减轻、对受贿罪从轻。'
      cites: [c03-ccdi-2020-10-24-wang-like-probe, c03-xinhua-2022-09-22-wang-like-verdict, k06-xinhua-2024-10-14-yang-fasen-probe, k06-court-2025-10-29-yang-fasen-verdict, t01-people-2017-06-01-8-verdicts, r07-xinhua-2023-06-20-xu-ming-verdict, t02-xinhua-2024-12-10-tang-shuangning-verdict, r07-people-2026-07-22-li-chunliang-verdict]
    - text: '编者分析：中央纪委把投案人数当作反腐成效来公布，2020年1月的工作报告提出“对主动投案者依规依纪依法从宽处理”，此后投案人数从1万多人升到2.6万人。但在高官一级，每年真正投案的仍只有几人，2022年以后亿元以上的受贿案普遍判死缓，对没有投案的人刑罚在加重。投案的从宽和不投案的从重同时发生，两者合起来，才是这几年“宽严相济”在高官案件上的样子。认罪认罚从宽在法律上是普遍适用的制度，检察环节适用率八九成，可它几乎没有出现在高官判决的公开文字里，高官案件的从宽仍主要通过自首、立功和监察机关的从宽建议来体现。'
      cites: [b05-ccdi-2020-01-zhao-leji-report, b06-xinhua-2026-01-12-li-xi-ccdi-report, cs9-xinhua-2025-02-27-surrender-25k, cs9-spp-2026-03-09-plea-rate, n01-ccdi-2018-03-supervision-law]
  voices:
    - { voice: doc, text: 犯罪嫌疑人、被告人自愿如实供述自己的罪行，承认指控的犯罪事实，愿意接受处罚的，可以依法从宽处理。, cite: cs9-gov-2018-10-26-cpl-amendment, quote: true }
    - { voice: doc, text: 涉嫌职务犯罪的被调查人主动认罪认罚，有下列情形之一的，监察机关经领导人员集体研究，并报上一级监察机关批准，可以在移送人民检察院时提出从宽处罚的建议, cite: n01-ccdi-2018-03-supervision-law, quote: true }
    - { voice: official, text: 对主动投案者依规依纪依法从宽处理, cite: b05-ccdi-2020-01-zhao-leji-report, quote: true }
    - { voice: official, text: 秦光荣是中央纪委国家监委发布的第一个投案自首的原省部级一把手。, cite: c03-ccdi-2021-01-19-qin-guangrong-verdict, quote: true }
    - { voice: official, text: 但鉴于其长期在最高人民法院担任要职，执法犯法，非法干预司法活动，严重败坏司法形象，破坏司法公信力，并插手干部人事提拔调整，造成恶劣的社会影响，依法不足以从轻处罚。, cite: k04-xinhua-2023-08-04-shen-deyong-verdict, quote: true }
    - { voice: zh, text: 近两年，在纪检监察部门发布的违纪官员通报中，“投案自首”“主动投案”已成为高频词。, cite: r04-jiemian-2019-12-2019-tigers, quote: true }
    - { voice: official, text: 84.8%的犯罪嫌疑人在检察环节自愿认罪认罚, cite: cs9-spp-2026-03-09-plea-rate, quote: true }
