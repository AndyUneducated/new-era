# CS9 — the 20th Central Committee members and alternates who fell after the fourth plenum; surrender, meritorious service and sentencing
- id: cc20-fallen-2026
  title: 五中全会之前：二十届中央委员会的三十个缺口
  kind: cluster
  years: '2025–2026'
  people: [lan-tianli, wang-lixia, yi-huiman, ma-xingrui, wang-xiangxi, sun-shaocheng, zhang-youxia, liu-zhenli, yi-lianhong, hu-henghua, ye-jianchun, zhang-lin-pla, wang-peng-pla, wang-renhua, zhang-hongbing, li-wei-pla, li-qiaoming, guo-puxiao, xu-xueqiang, li-fengbiao, ju-qiansheng, zhong-shaojun, fei-dongbin, wu-shenghua, fang-hongwei, fei-gaoyun, xu-liuping, qin-weizhong, wang-kangping, li-yunze, ding-xingnong, wang-liyan, wang-jiayi, fang-yongxiang, shi-yugang, shi-zhenglu, lu-hong, lu-dongliang, ding-xiangqun, he-weidong, miao-hua, tang-renjian, jin-xiangjun, li-shisong, yang-fasen, zhu-zhisong, zhang-fengzhong, li-shangfu, li-yuchao, sun-jinming, qin-gang, liu-jianchao, jin-zhuanglong, lei-fanpei, wang-kai-pla, wang-qiang-pla, wang-wenquan, liu-faqing, liu-qingsong, yang-cheng-pla, yang-xuejun, wu-yanan, wang-haijiang, zhao-xiaozhe, hu-zhongming, xu-xisheng, xu-qiling, xu-deqing, huang-ming-general, chang-dingqiu]
  summary: '2025年10月的二十届四中全会一次确认14人被开除党籍、递补11名候补委员，出席的中央委员只剩168人。到2026年10月20日，本站统计又有22名中央委员、8名候补中央委员已被官方立案、开除或罢免人大代表，而尚未经中央全会处理：11人已被开除党籍，处分待全会追认；6人只有立案消息；13人只被罢免全国人大代表，其中12人是将领。两名政治局委员马兴瑞、张又侠也在其中。另有16名将领和刘建超、金壮龙等人长期不露面，官方没有任何说法。五中全会定于10月26日至29日召开，本文写作时尚未举行，追认和递补名单要等公报。'
  sections:
    - h: 规则与前两次全会
      from: 2022-10-23
      to: 2025-10-23
      text: '党章规定，中央委员会委员出缺，“由中央委员会候补委员按照得票多少依次递补”；对中央委员、候补委员给予开除党籍等处分，须由中央委员会全体会议三分之二以上多数决定，闭会期间可以先由中央政治局作出决定，“待召开委员会全体会议时予以追认”。所以中央委员会每次全会都要做两件事：追认此前的处分，再用候补委员补上空缺。二十届一中全会出席中央委员203人、候补中央委员168人。2024年7月的三中全会出席199人、165人，递补丁向群、于立军、于吉红为中央委员，确认李尚福、李玉超、孙金明被开除党籍，并接受秦刚辞职、免去其中央委员职务。2025年10月的四中全会出席中央委员只有168人、候补中央委员147人；全会确认何卫东、苗华、何宏军、王秀斌、林向阳、秦树桐、袁华智、王春宁、张凤中9名将领和唐仁健、金湘军、李石松、杨发森、朱芝松共14人被开除党籍，递补于会文、马汉成、王健、王曦、王永红、王庭凯、王新伟、韦韬、邓亦武、邓修明、卢红11人为中央委员。对照往届：十九届四中全会（2019年）出席中央委员202人，递补2人；五中全会198人，六中全会197人。十八届五中全会（2015年）出席199人，确认10人被开除党籍；届末的七中全会（2017年）出席191人，递补11人，确认12人被开除党籍。二十届在第四次全会就递补了11人，与十八届届末的规模相当；确认开除的14人，也多于十八届五中全会的10人和七中全会的12人。'
      cites: [i01-12371-2022-10-22-party-charter, e04-gov-2022-10-23-1st-plenum, c03-gov-2024-07-18-third-plenum, b08-wikisource-2024-07-18-20-3-plenum, e04-gov-2025-10-23-4th-plenum, i05-gov-2019-10-31-4th-plenum, e04-xinhua-2020-10-29-5th-plenum, e04-gov-2021-11-11-6th-plenum, e03-ccdi-2015-10-29-5th-plenum, c03-xinhua-2017-10-14-seventh-plenum]
    - h: 递补顺序：被跳过的候补委员
      from: 2022-10-22
      to: 2026-10-11
      text: '二十届候补中央委员名单“按得票多少为序排列，得票相等的，按姓氏笔画为序排列”。两次全会递补的14人都出自名单前22位，但并不连续：三中全会递补第1、3、4位，跳过第2位的丁兴农；四中全会一直递补到第22位的卢红，排在她前面的丁兴农、王立岩、王抗平、王嘉毅、方永祥、方红卫、石玉钢、石正露8人没有递补，其中5人是将领。官方从未说明跳过的原因。被跳过的人里后来有两人出事：西安市委原书记方红卫在四中全会闭幕两周后的11月7日被宣布审查调查，2026年7月被开除党籍；联勤保障部队原司令员王抗平2026年5月29日被东部战区军人代表大会罢免全国人大代表，代表资格审查报告称其涉嫌严重违纪违法。其余6人本站没有查到处理消息。若按卢红往后顺推，下一批依次是卢东亮、付文化、丛亮、包钢、邢善萍、吉林、曲莹璞、吕军等人（联合早报）。2026年被查或被罢免的候补委员费高云、徐留平、覃伟中、王抗平、李云泽，和已被开除的费东斌、吴胜华、方红卫，都已不可能递补；2026年5月接替李云泽任国家金融监督管理总局党委书记的丁向群，正是三中全会第一个递补的候补委员。'
