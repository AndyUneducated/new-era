- id: surrender-sentencing
  title: 自首、立功与刑期：投案的人判得多轻
  kind: system
  years: '2016–2026'
  people: [ai-wenli, qin-guangrong, long-fei, liu-lixian, meng-yongshan, wen-guodong, ren-yuzhong, liu-jinming, zhang-xiaopei, li-shixiang, li-chunsheng, gong-jianhua, chen-gang-beijing, luo-baoming, yang-fasen, dong-hong, wang-fuyu, wang-like, chen-xuefeng, xiang-junbo, wang-sanyun, tang-shuangning, gao-jinsong, xu-ming, li-chunliang, li-shangfu, wei-fenghe, fang-fenghui, shen-deyong, lai-xiaomin, fu-zhenghua, pu-bo, li-wei-zhongtai]
  summary: '2016年4月以后判决、本站有人物卡的394名受贿或贪污官员中，法院写明自首的69人，有立功表现的72人。本站把纪委通报“主动投案”或判决写“自动投案”“主动到案”的21人单独分组：其中16人判有期徒刑，平均10.8年，中位数10年。只犯受贿罪、金额相近的人里，既没有自首也没有立功的，有期刑期普遍长2至4年；受贿1亿元以上的，没有自首立功者全部判无期以上，投案的陈刚、罗保铭判15年。立功能救命也可能无效：同是重大立功，傅政华判死缓并终身监禁，赖小民仍被判死刑。2018年认罪认罚从宽写入刑事诉讼法，检察环节适用率此后超过八成，但本站收录的高官判决通稿中，写明“认罪认罚”的只有3份。'
  sections:
    - h: 法律：从轻、减轻和“可不立即执行”
      from: 2015-11-01
      to: 2018-10-26
      text: '对高官受贿案，从宽有几层依据。2015年《刑法修正案（九）》规定，贪污受贿犯罪“在提起公诉前如实供述自己罪行、真诚悔罪、积极退赃，避免、减少损害结果的发生”的，数额较大的可以从轻、减轻或者免除处罚，数额巨大或特别巨大的“可以从轻处罚”，即在法定刑幅度内从轻，而数额特别巨大的法定刑是十年以上。判决书通常把自首、立功称作“法定”情节，把认罪悔罪、退赃称作“酌定”情节；受贿数额特别巨大而判十年以下的，判决大多写明自首或立功并“减轻处罚”，如艾文礼案判决写他“具有法定、酌定从轻、减轻处罚情节，依法可对其减轻处罚”。2016年两高解释第四条规定，数额特别巨大、可以判处死刑的，“具有自首，立功，如实供述自己罪行、真诚悔罪、积极退赃，或者避免、减少损害结果的发生等情节，不是必须立即执行的，可以判处死刑缓期二年执行”。2018年3月的监察法第三十一条规定，被调查人“主动认罪认罚”，并有自动投案、真诚悔罪悔过，积极配合调查、如实供述监察机关还未掌握的违法犯罪行为，或积极退赃、减少损失等情形的，监察机关可以“在移送人民检察院时提出从宽处罚的建议”；第三十二条对揭发他人、提供重要线索的涉案人员作了同样规定。2018年10月26日修改的刑事诉讼法新增第十五条：“犯罪嫌疑人、被告人自愿如实供述自己的罪行，承认指控的犯罪事实，愿意接受处罚的，可以依法从宽处理。”认罪认罚案件由检察院提出量刑建议，法院“一般应当采纳人民检察院指控的罪名和量刑建议”。'
      cites: [cs5-gov-2015-08-30-criminal-law-9, cs6-court-2016-04-19-graft-interpretation, r04-ce-2019-04-18-ai-wenli-verdict, n01-ccdi-2018-03-supervision-law, cs9-gov-2018-10-26-cpl-amendment, cs9-npc-2018-11-06-cpl-anticorruption]
    - h: 政策：从艾文礼到“2.6万人主动投案”
      from: 2018-07-31
      to: 2026-01-12
      text: '2018年7月31日，中央纪委国家监委网站发布河北省政协原副主席艾文礼“已投案自首”的消息，网站称这是首次在中管干部审查调查消息中使用这一表述；10月的开除通报写明移送起诉时“并提出减轻处罚的建议”。界面新闻2019年底称，“投案自首”“主动投案”已成为纪检通报中的高频词，中央纪委三次全会报告显示十九大以来共有5000余名党员干部主动投案。2019年，云南省委原书记秦光荣主动投案；2021年1月他被判7年，法院通报称他“是中央纪委国家监委发布的第一个投案自首的原省部级一把手”，国家监委提出了从宽处罚的建议，检察机关认可他构成自首、可以减轻处罚。中央纪委的年度报告开始逐年公布投案人数：2019年“全国有10357人主动投案，其中中管干部5人、省管干部119人”，同年制定了《纪检监察机关处理主动投案问题的规定（试行）》；2024年2.5万人，2025年2.6万人。这些是全国各级的数字。本站样本里，2019年以后判决、属于投案的高官每年只有1至5人。'
      cites: [r04-ccdi-2018-07-31-ai-wenli-probe, r04-ccdi-2018-10-19-ai-wenli-expel, r04-jiemian-2019-12-2019-tigers, c03-ccdi-2021-01-19-qin-guangrong-verdict, b05-ccdi-2020-01-zhao-leji-report, cs9-xinhua-2025-02-27-surrender-25k, b06-xinhua-2026-01-12-li-xi-ccdi-report]
    - h: 样本与分组口径
      from: 2016-04-18
      to: 2026-10-20
      text: '本篇数字由脚本research/scripts/CS9-pleas.ts算出，样本口径与《数额与刑期》专题相同：判决在2016年4月18日以后（含当日）、罪名含受贿或贪污、本站有人物卡的人，截至2026年10月20日共394人，其中380人有法院认定的金额。情节取网站的解析结果，来源是落马步骤、判决报道中含本人名字的句子和案件记录的plea字段，分自首、立功、退赃、认罪四类；判决写明“不足以从轻”的、退赃只是法院责令追缴的，不计。网站解析会漏掉不写名字、以“鉴于其”开头的判决句，例如罗保铭案，脚本补读了这些句子，有42人因此多读出一项或几项情节。按情节由强到弱分四组，每人只进一组。投案组21人：案件记录载明纪委通报其“主动投案”，或判决写“自动投案”“主动投案”“主动到案”，或写其携带赃款投案；其中18人法院认定自首，王立科、杨发森、陈雪枫3人的判决没有写自首。其他自首53人：法院认定自首，但不是投案，多是到案后主动交代办案机关尚未掌握的罪行，例如项俊波、王三运交代了尚未掌握的全部受贿事实，唐双宁只就贪污罪构成自首，高劲松交代的受贿与已掌握的行贿“属不同种罪行，应认定为自首”。立功无自首62人。无自首无立功258人，只有退赃、认罪悔罪等酌定情节，其中36人读不出任何情节。全样本另有14人没有金额记录，其中李尚福、魏凤和、房峰辉由军事法院判决，未公布数额。'
      cites: [cs6-court-2016-04-19-graft-interpretation, k03-xinhua-2025-12-09-luo-baoming-verdict, b08-gov-2026-05-07-wei-li-sentenced, c02-court-2019-02-20-fang-fenghui, c03-xinhua-2022-09-22-wang-like-verdict, k06-court-2025-10-29-yang-fasen-verdict, t01-people-2017-06-01-8-verdicts, c03-rmzxw-2020-06-16-xiang-junbo-verdict, c03-gmw-2019-04-12-wang-sanyun-verdict, t02-xinhua-2024-12-10-tang-shuangning-verdict, r08-legaldaily-2017-02-24-gao-jinsong-verdict]
    - h: 四组的刑期
      from: 2016-04-18
      to: 2026-10-20
      text: '全样本看：投案组21人中5人判无期以上，即王立科（死缓并终身监禁）、董宏、王富玉（死缓）、杨发森、陈雪枫（无期），其余16人判有期徒刑，平均10.8年，中位数10年，金额中位数7940万元。其他自首53人中15人判无期以上，有期38人平均14.2年。立功无自首62人中38人判无期以上，金额中位数1.20亿元，是四组中最高的。无自首无立功258人中91人判无期以上，有期166人平均13.4年，金额中位数5197万元。各组金额不同，直接比平均刑期意义有限，下面只看只犯受贿罪的261人，按金额分档比较投案组和无自首无立功组。1000万元以下：投案的龙飞（613万余元）判7年，对照组15人平均9.0年。1000万至3000万元：投案4人平均9.3年（秦光荣7年、刘立宪8年、蒙永山11年、文国栋11年），对照组36人平均12.4年。3000万至5000万元：投案2人（任羽中8年、刘金明12年），对照组34人平均13.4年，1人判无期。5000万至1亿元：投案5人全部判有期，平均10.4年（艾文礼8年、张晓霈9年、李士祥10年、李春生10年、龚建华15年），对照组48人中17人判无期以上，其余31人平均14.6年。1亿至2亿元：投案3人中陈刚、罗保铭判15年，杨发森判无期；对照组28人全部判无期以上。2亿元以上：投案的董宏判死缓，对照组15人全部判无期以上。只有立功、没有自首的人，与对照组相差不大：5000万至1亿元一档12人，2人判无期，有期平均13.9年；1亿至2亿元一档17人，14人判无期以上。'
      cites: [r04-court-2022-01-28-dong-hong-verdict, t02-bjnews-2022-01-17-wang-fuyu-verdict, c03-xinhua-2022-09-22-wang-like-verdict, k06-court-2025-10-29-yang-fasen-verdict, t01-people-2017-06-01-8-verdicts, r08-people-2025-06-10-long-fei-verdict, c03-ccdi-2021-01-19-qin-guangrong-verdict, t02-court-2024-12-24-liu-lixian-verdict, r05-chinanews-2022-07-12-meng-yongshan-verdict, r04-nbd-2022-03-29-wen-guodong-verdict, r08-people-2026-08-24-ren-yuzhong-verdict, c13-nbd-2021-01-03-liu-jinming, r04-ce-2019-04-18-ai-wenli-verdict, r05-sina-2024-04-30-zhang-xiaopei-verdict, k04-court-2019-11-12-li-shixiang-verdict, r05-chinacourt-2024-07-li-chunsheng-verdict, r05-court-2023-09-19-gong-jianhua-verdict, k04-court-2021-02-05-chen-gang-verdict, k03-xinhua-2025-12-09-luo-baoming-verdict]
    - h: 法院的写法
      from: 2017-05-31
      to: 2026-08-24
      text: '判得最轻的几人，判决都写“减轻处罚”：艾文礼“依法可对其减轻处罚”，秦光荣“依法对其予以减轻处罚”，任羽中“依法可以对其减轻处罚”，刘立宪“依法可予减轻处罚”，所以刑期能低于十年。同样投案自首，龚建华的判决只写“对其依法可从轻处罚”，判15年；文国栋“依法可以对其从轻处罚”，判11年；李士祥自首并有重大立功，判决写“依法可从轻处罚”，判10年。在死刑一档，自首决定的是生死：董宏、王富玉的判决都先写“论罪应当判处死刑”，再写鉴于自动投案、自首等情节，“对其判处死刑，可不立即执行”。投案而未被认定自首的，从宽有限：王立科的判决只写他“主动到案”，主动交代部分犯罪事实，判死缓并终身监禁；杨发森的通报写“主动投案”，判决写“自动投案后主动交代了办案机关尚未掌握的大部分受贿事实”，“依法可予从轻处罚”，判无期；两份判决都没有说明为何不认定自首。立功也不是一定有用：赖小民有重大立功表现，法院认为“不足以对其从宽处罚”，判死刑；沈德咏揭发他人犯罪，有重大立功表现，法院以他长期在最高人民法院担任要职、“执法犯法，非法干预司法活动”为由，认定“依法不足以从轻处罚”，判15年；傅政华有重大立功表现，“对其判处死刑，可不立即执行”，判死缓并终身监禁。监察机关的建议也写进判决报道：艾文礼案报道称，中央纪委国家监委的通报首次使用了“提出减轻处罚的建议”的表述，检察机关的量刑建议也提出减轻处罚。'
      cites: [r04-ce-2019-04-18-ai-wenli-verdict, c03-ccdi-2021-01-19-qin-guangrong-verdict, r08-people-2026-08-24-ren-yuzhong-verdict, t02-court-2024-12-24-liu-lixian-verdict, r05-court-2023-09-19-gong-jianhua-verdict, r04-nbd-2022-03-29-wen-guodong-verdict, k04-court-2019-11-12-li-shixiang-verdict, r04-court-2022-01-28-dong-hong-verdict, t02-bjnews-2022-01-17-wang-fuyu-verdict, c03-xinhua-2022-09-22-wang-like-verdict, c03-ccdi-2020-10-24-wang-like-probe, k06-xinhua-2024-10-14-yang-fasen-probe, k06-court-2025-10-29-yang-fasen-verdict, c03-court-2021-01-05-lai-xiaomin-verdict, k04-xinhua-2023-08-04-shen-deyong-verdict, c03-xinhua-2022-09-22-fu-zhenghua-verdict]
    - h: 认罪认罚入法前后
      from: 2016-04-18
      to: 2026-03-09
      text: '以2018年10月26日刑事诉讼法修改为界：此前判决的112人中，法院认定自首的12人（11%），有立功的14人（13%）；此后判决的282人中，自首57人（20%），立功58人（21%）。投案组21人中，只有陈雪枫（2017年，判决写“自动到案”，未认定自首）在此之前判决；艾文礼2019年4月的判决是此后第一例，各年依次为2019年2人、2020年1人、2021年2人、2022年5人、2023年2人、2024年3人、2025年3人、2026年2人。比例上升的时间与监察法施行、中央纪委鼓励投案相重合，不能单独归因于刑事诉讼法的修改。认罪认罚本身在高官判决报道里很少出现：入法后判决的282人中，判决报道写明“认罪认罚”的只有3人。2019年蒲波案判决写他“在庭审中表示认罪认罚，依法可对其从轻处罚”，判无期；2020年刘金明案判决先认定自首，再写他“自愿认罪认罚，酌情可以对其从轻处罚”，判12年；2025年李玮案把“自愿认罪认罚”与坦白、未遂等情节并列。其余判决仍用“认罪悔罪”。检察机关公布的数字高得多：最高检2023年的工作报告称认罪认罚从宽制度的检察环节适用率“已超过90%”，2022年量刑建议采纳率98.3%；2025年“84.8%的犯罪嫌疑人在检察环节自愿认罪认罚”。职务犯罪起初用得少，广西检察机关称，针对此前该区职务犯罪案件适用率低的问题，2020年1月至8月适用率达到80.50%。'
