    - h: 按程序和系统统计
      from: 2025-07-21
      to: 2026-10-20
      text: '本站的口径是：二十届中央委员、候补中央委员中，已被官方宣布立案、开除党籍或罢免全国人大代表，而尚未经中央全会处理的人，截至2026年10月20日。中央委员22人：已开除党籍、待追认的8人（蓝天立、王莉霞、易会满、马兴瑞、王祥喜、孙绍骋、张又侠、刘振立）；只有立案消息的3人（易炼红、胡衡华、叶建春）；只被罢免全国人大代表、没有立案消息的11人，全是将领（张林、王鹏、王仁华、张红兵、李伟、李桥铭、郭普校、许学强、李凤彪、巨乾生、钟绍军）。候补中央委员8人：已开除的费东斌、吴胜华、方红卫，只有立案消息的费高云、徐留平、覃伟中，只被罢免人大代表的王抗平、李云泽。30人中军队14人，只有张又侠、刘振立两人有立案通报；其余16人中，地方党政主官和前主官10人，中央和国家机关、群团4人（马兴瑞、王祥喜、费东斌、徐留平），金融监管2人（易会满、李云泽）。被宣布审查调查时仍担任现职的有张又侠、刘振立、王祥喜、胡衡华、马兴瑞、费高云、徐留平、叶建春、覃伟中9人。明报8月3日统计“过去一年已有19名二十届中央委员被官宣落马、或者被罢免全国人大代表等职务”，党政8人、军方11人，与本站同期的名单一致；此后又有叶建春被查、巨乾生和钟绍军被罢免，合为22人。不在这30人之内的还有一批长期不露面者：联合早报8月梳理的16名中央委员将领，即王凯、王强、王文全、刘发庆、刘青松、杨诚、杨学军、吴亚男、汪海江、赵晓哲、胡中明、徐西盛、徐起零、徐德清、黄铭、常丁求，没有任何官方处理消息；党政方面，中联部原部长刘建超、工信部原部长金壮龙长期不公开露面，联合早报称雷凡培已被免去中央军民融合办公室常务副主任。本站把这些人标为下落不明，不推定他们已被立案。'
