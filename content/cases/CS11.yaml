# CS11 — land-quota (城乡建设用地增减挂钩：从试点、拆村并居与“被上楼”，到地票、扶贫指标交易与 2020 年山东合村并居)
- id: land-quota
  title: 土地指标与拆村并居：增减挂钩的二十年
  kind: system
  years: '2004–2024'
  people: [chen-xiwen, zhou-lian, he-xuefeng, han-jun, wen-jiabao, liu-jiayi, li-ganjie, bo-xilai, lu-xinshe, zhou-qiren, xi-jinping]
  summary: '城乡建设用地增减挂钩让地方把农村宅基地复垦成耕地，换出等面积的城镇建设用地指标。2006年起试点，2008—2010年各地借它拆村并居，农民“被上楼”，国务院2010年发文严禁强迫农民住高楼；此后指标被用来给扶贫筹钱，2018年准许深度贫困地区跨省出售，财政部称脱贫攻坚以来指标调剂和流转资金共4400多亿元。2020年山东合村并居再起争议，自然资源部、农业农村部发文“不得强制农民搬迁和上楼居住”，2021年同类禁令写进《乡村振兴促进法》。'
  sections:
    - h: 制度：从“相挂钩”到周转指标
      from: 2004-10-21
      to: 2010-11-17
      text: '增减挂钩的源头是2004年10月国务院《关于深化改革严格土地管理的决定》（国发〔2004〕28号）里的一句话：“鼓励农村建设用地整理，城镇建设用地增加要与农村建设用地减少相挂钩。”同一文件还写着“禁止城镇居民在农村购置宅基地”：农民的宅基地不能卖给城里人，但可以先复垦成耕地，再把腾出的面积变成城镇的建设用地指标。2006年4月，国土资源部把山东、天津、江苏、湖北、四川五省市列为第一批试点；另说试点始于2005年，第一财经2019年的报道和韩俊2010年在央视的说法都是2005年。2008年6月27日，国土资源部印发《城乡建设用地增减挂钩试点管理办法》，规定拆旧地块和建新地块组成项目区，由国家下达挂钩周转指标，指标“不得作为年度新增建设用地计划指标使用”，并须在规定时间内用复垦的耕地面积归还。新京报2010年报道，2008、2009年国土资源部又分别批准了19个省加入试点。时任国务院发展研究中心副主任韩俊2010年11月在央视说，试点已扩展到24个省，2005年到2009年的规模约40万亩，2010年一年的指标就将近40万亩；还有许多非试点地区不叫增减挂钩，而叫“三集中”“双置换”，做的是同一件事。'
      cites: [e16-gov-2004-10-21-guofa-28, i12-chinanews-2010-11-02-beishanglou, cs11-yicai-2019-cross-province-quota, cs11-cntv-2010-11-18-xinwen1plus1, e16-wuhan-2008-06-27-guagou-measures, cs11-cntv-2010-11-02-beishanglou]
    - h: 媒体：2010年的“被上楼”调查
      from: 2009-10
      to: 2010-11-17
      text: '2010年11月初，新京报连续刊发调查。第一篇说，拆村并居正在全国二十多个省市进行，各地的共同目标是“将农民的宅基地复垦，用增加的耕地，换取城镇建设用地指标”；记者认为这项政策被地方政府利用和曲解，有的地方突破指标范围，甚至没有指标也搞挂钩。山东诸城取消行政村编制，把1249个村合并为208个农村社区；江苏邳州坝头村整体拆迁，35岁的徐传玲因补偿款买不起足额面积的楼房，2009年10月自杀，2010年1月当地强制农民上楼，十多人被打伤住院。报道还算了试点的账：周转指标要求三年归还，第一批试点到2009年底却只拆旧复垦5.58万亩，约占下达指标的80%。第二篇写河北：2009年河北需要新增建设用地约21万亩，国家指标只有17万亩，国土资源部批给河北的挂钩周转指标仅1.2万亩，而河北计划到2012年建成7500个新民居示范村，估算可增加建设用地50多万亩；省里的文件允许新民居建设“需要占用农用地的，可采取先占后补的方法周转使用”。廊坊市国土资源局总工郭立平对记者说，置换出的建设用地由政府统一调配，“收益将归政府，农民不再享受土地级差收益”；廊坊从2009年起把农村土地整治纳入对各县（市、区）政府的考核。11月17日，央视《新闻1+1》播出江苏盱眙桂五镇的“万亩良田”工程，村民说楼房每平方米补偿700元、瓦房450元，买安置房却要1000元。'
      cites: [i12-chinanews-2010-11-02-beishanglou, cs11-cntv-2010-11-02-beishanglou, cs11-cntv-2010-11-03-hebei-xinminju, cs11-cntv-2010-11-18-xinwen1plus1]
    - h: 官方：2010年的刹车
      from: 2010-03
      to: 2010-12-27
      text: '官方最早的警告来自中央农办。据新京报引述，陈锡文在2010年全国两会期间说，让农民上楼运动的实质是把农村建设用地倒过来给城镇用，如不有效遏制“恐怕要出大事”，呼吁“急刹车”；8月在海口的国际论坛上，他说和平时期大规模的村庄撤并运动“古今中外，史无前例”。国土资源部的口径不同：6月26日，总规划师胡存智在一个房地产论坛上透露，通过增减挂钩，大约有2700万亩农村建设用地将纳入城市建设用地。11月10日，温家宝主持国务院常务会议，承认“少数地方片面追求增加城镇建设用地指标，擅自开展城乡建设用地增减挂钩试点或扩大试点范围，擅自扩大挂钩周转指标规模”，要求“坚决防止违背农民意愿搞大拆大建、盲目建高楼等现象”，违规的要追究地方政府负责人的责任并扣减年度用地计划指标。12月27日，国务院印发《关于严格规范城乡建设用地增减挂钩试点切实做好农村土地整治工作的通知》（国发〔2010〕47号），写明“严禁在农村地区盲目建高楼、强迫农民住高楼”，严禁项目区跨县级行政区域设置、严禁循环使用周转指标，要求“确保所获土地增值收益及时全部返还农村”，对不符合政策规定的一律叫停。文件对这项政策本身的评价仍是“对统筹城乡发展发挥了积极作用”。'
      cites: [i12-chinanews-2010-11-02-beishanglou, cs11-cntv-2010-11-02-beishanglou, i12-jjckb-2010-11-11-state-council-guagou, i12-caixin-2010-11-13-guagou-brake, e16-gov-2010-12-27-guofa-47]
    - h: 指标变现：地票、扶贫与跨省调剂
      from: 2008-12-04
      to: 2022-12
      text: '把指标拿出去卖的做法先在重庆出现。2008年12月4日，重庆农村土地交易所成立，国土资源部副部长鹿心社出席挂牌仪式，中国青年报报道市委书记薄熙来到场见证首场竞拍。地票是农村宅基地、乡镇企业用地等集体建设用地复垦验收后产生的指标，购得者可增加等量城镇建设用地；首场两宗300亩和800亩的地票拍出2560万元和6420万元。截至2022年底，重庆累计交易地票36.9万亩、724.42亿元。指标随后成了扶贫的筹资工具。2015年11月，中共中央、国务院关于打赢脱贫攻坚战的决定允许在连片特困地区和国家扶贫开发工作重点县开展易地扶贫搬迁时，“将城乡建设用地增减挂钩指标在省域范围内使用”。2018年中央一号文件提出建立节余指标跨省域调剂机制，所得收益“全部用于巩固脱贫攻坚成果和支持实施乡村振兴战略”；3月10日国务院办公厅印发管理办法，调出价每亩30万元（复垦为高标准农田的40万元），调入价北京、上海每亩70万元，天津、江苏、浙江、广东50万元，福建、山东等其他省份30万元。同年10月，自然资源部党组成员张德霖说，节余指标省域内流转已覆盖26个省份1250多个贫困县，17个省份累计流转28万余亩、收益约800亿元。2019年11月，自然资源部答复人大代表建议时说跨省调剂供求矛盾突出：2018年19个深度贫困地区所在省份调出19.43万亩、获资金607.28亿元，2019年任务20.88万亩、拟调剂资金647.30亿元；第一财经据此算出，两年里东部八省份出资超过1200亿元，换来约40万亩指标，约合每亩30万元。脱贫攻坚结束后，财政部引用习近平的讲话说，打响脱贫攻坚战以来，“土地增减挂指标跨省域调剂和省域内流转资金4400多亿元”。2022年3月的全国统一大市场意见又要求“完善城乡建设用地增减挂钩节余指标、补充耕地指标跨区域交易机制”。'
      cites: [cs11-chinanews-2008-12-05-chongqing-dipiao, cs11-jjckb-2008-12-05-first-dipiao, cs11-moa-2023-02-21-chongqing-dipiao, i06-gov-2015-12-07-poverty-decision, i06-gov-2018-02-04-rural-revitalization, e16-gov-2018-03-10-cross-province-quota, cs11-people-2018-10-18-guagou-poverty, cs11-yicai-2019-cross-province-quota, cs11-mof-2021-03-03-poverty-finance, i06-gov-2022-04-10-unified-market]
    - h: 2020年山东：官方的回应与再次叫停
      from: 2020-05-06
      to: 2021-06-01
      text: '2020年5月6日，山东省自然资源厅发出《山东省村庄布局专项规划》的通知，滨州、菏泽、聊城等地随即大范围推行合村并居；菏泽市当年的政府工作报告要求“完成土地增减挂钩3万亩以上”。舆论升温后，6月17日山东省政府新闻发布会上，省自然资源厅厅长李琥说全省行政村6.95万个，农村社区建设“没有下指标派任务，没有大规模的大拆大建”，2019年以来全省批复实施增减挂钩项目114个、涉及村庄268个，村民同意率达到95%以上才能实施。李干杰随后在调研中说，搬不搬、建不建“群众说了算”；刘家义要求决不搞一刀切。6月27日，刘家义召开视频会议，一面说这项工作“方向是正确的，政策是妥当的，推进是有成效的”，一面要求对“正在实施但群众意见较大的”项目“先一律暂停，进行重新甄别”。中央没有发专门的叫停文件，最明确的是7月29日自然资源部、农业农村部的《关于保障农村村民住宅建设合理用地的通知》（自然资发〔2020〕128号），写明“不提倡、不鼓励在城市和集镇规划区外拆并村庄、建设大规模农民集中居住区，不得强制农民搬迁和上楼居住”，同时把农民建房用地计划指标单列，原则上不低于新增建设用地计划指标的5%。2021年2月公布的中央一号文件写入“严格规范村庄撤并，不得违背农民意愿、强迫农民上楼”；4月29日通过、6月1日施行的《乡村振兴促进法》第五十一条规定“严禁违背农民意愿、违反法定程序撤并村庄”。'
      cites: [e16-ifeng-2020-06-26-shandong-hecun, e16-thepaper-2020-06-17-shandong-response, e16-qq-2020-06-26-li-ganjie-hecun, cs11-guancha-2020-06-28-liu-jiayi-pause, cs11-gov-2020-07-29-natres-128, cs11-xinhua-2020-07-31-no-forced-upstairs, cs11-gov-2021-02-21-no1-document, cs11-npc-2021-04-29-rural-revitalization-law]
    - h: 2020年山东：媒体与学者看到的
      from: 2020-06-12
      to: 2020-07-02
      text: '《中国慈善家》报道，滨州、菏泽、聊城的一些基层政府要求过急、强制拆迁农民住房，存在先拆后建、边拆边建、补偿金过低等问题；报道还引述“有专家称”，这一轮推行意在新冠疫情之下缓解政府债务压力，把腾退的宅基地变成城市建设用地卖出。《法人》杂志报道，有网友向刘家义留言，反映巨野县柳林镇的文件规定，2020年7月10日前未腾空院落且未选择临时安置的住户“取消一切奖励，并且由村委会依法强制拆除”；6月21日，枣庄市山亭区山城街道人员到善崮村拆迁时与村民发生身体冲突，两名街道工作人员被免职，拆迁停止。学者方面，贺雪峰、桂华6月12日撰文说，新社区基本是高层公寓，“大部分农民所获得的补偿款不够支付新房购置费用”，“各地通过行政压力推动合村并居，基层干群关系紧张”，地方政府套用增减挂钩，一是想解决建设用地指标，二是想解决乡村建设资金，“山东合村并居强推之风当刹！”南京师范大学的王丽惠说，农民要自己贴5至8万元购新房，“村民家庭经济状况至少倒退5-10年”；武汉大学的吕德文说，有的村民还得倒贴数万元才能住进楼房。贺雪峰同时认为，“合村并居会造成地方财政破产”的说法有过度担忧之嫌。'
      cites: [e16-ifeng-2020-06-26-shandong-hecun, cs11-sohu-2020-07-02-faren-hecun, e16-sdaeu-2020-06-12-he-xuefeng-hecun]
    - h: 学者：指标能不能生财
      from: 2007-07
      to: 2021-04-25
      text: '学者争论的核心是腾出来的指标值多少钱、钱归谁。周其仁主张农地确权，“逐步收缩征地规模、探索农地农房入市”，批评现行制度是“政府一手征地、一手卖地”的制度怪胎。贺雪峰2009年写成《地权的逻辑》，书出版后周其仁在《经济观察报》撰长文批评，贺雪峰又撰文回应。他在《学术月刊》2019年第1期的文章里说，增减挂钩“属于虚拟市场性质”，拆旧形成的指标“并不会产生财富，仅仅是一种财富转移”。他举的例子是：德州曾计划拆掉全市8000多个自然村，按当地估算腾出100万亩宅基地，“按每亩40万元将指标卖给青岛，德州市就可以获得4000亿元指标费”，三年后不得不停止，留下巨额债务和农民的不满；成都按每亩30万元筹资，为近千个自然村提供了接近1000亿元的重建资金；他引用的数据称，重庆农村土地交易所成立至2016年2月底累计交易地票17.4万亩、347.61亿元。桂华的看法相近：拆房、复垦、建安置都要花钱，“比这更麻烦的是政府花大力气腾出指标后，却最终在城市也使用不掉”。陈锡文从宏观角度批评。2016年他说“我觉得没有必要开这个口子”，用占补平衡就够了；中心城市把国家指标留在市区，县城的商品房“基本都不是国家的建设用地指标”，“批了你1000万亩，实际上你搞了1300万亩，不少房地产的库存都是这么弄出来的”。2021年他又说，不少地方“逆向操作”，没有获得新增建设用地指标就到农村拆房并村，2009—2012年间年度实际使用的新增建设用地比国家指标超出约四分之一到三分之一。周黎安没有专门研究增减挂钩，但他的晋升锦标赛理论认为，干部考核倚重经济绩效，“直接引发了地方官员围绕着区域经济发展的晋升竞争”；他与合作者2020年在《Review of Economics and Statistics》发表过城市领导人晋升激励与城市空间扩张的论文。陶然等学者则质疑中国存在把政治提拔与经济指标直接挂钩的考核体系。'
      cites: [i09-bimba-zhou-qiren-land, cs11-wen-he-xuefeng-reply-zhou-qiren, cs11-aisixiang-2019-he-xuefeng-guagou, e16-ifeng-2020-06-26-shandong-hecun, cs11-cs-2016-03-25-chen-xiwen-interview, cs11-whu-2021-04-25-chen-xiwen-interview, e16-thepaper-2018-05-25-zhou-lian-governance, cs11-pku-lmeqf-zhou-lian, e16-cufe-li-zhou-vs-tao]
    - h: 基层：挂钩项目里的腐败
      from: 2009
      to: 2024-09-26
      text: '本站没有找到与增减挂钩直接相关、又有人物卡的落马官员；公开通报里的案子集中在村和县一级。2016年12月中央纪委通报的典型案例中，江苏徐州市铜山区张集镇水口村原党支部书记郑帅2009年至2013年利用协助镇政府实施增减挂钩复垦项目的便利，把村集体土地地上附着物补偿款111.40万元据为己有，被开除党籍、移送司法机关。四川甘孜州巴塘县自然资源局原局长李兆勇2023年落马，经查2017年至2023年以“借”为名收受财物共计190万元；新华社称他被查与商人张某某输送利益、中标土地增减挂钩项目“密切相关”，此后他陆续把4个增减挂钩项目安排给张某某。同一商人承揽丹巴县增减挂钩项目时，又向时任丹巴县自然资源局局长任先博行贿30万元。截至2024年9月，甘孜州自然资源系统已立案9人，开除党籍、开除公职并移送司法机关4人。'
      cites: [cs11-people-2016-12-13-ccdi-nine-cases, cs11-scjc-2024-09-26-ganzi]
  editor:
    - text: '编者分析：增减挂钩把地方政府最缺的两样东西，建设用地指标和钱，绑在了一起。2020年全国国有土地使用权出让收入84142亿元，同比增长15.9%，而出让的前提是有指标。按陈锡文的描述，国家下达的年度指标多被中心城市留在市区，县一级只能“到农村去拆房、并村”自行解决；河北的新民居计划、廊坊把土地整治纳入县级考核、菏泽“完成土地增减挂钩3万亩以上”的政府工作目标，都是把指标当任务往下分。但指标能不能变成钱，要看有没有城市来买：贺雪峰算过德州4000亿元的设想落空，桂华提醒腾出的指标可能“在城市也使用不掉”，2019年自然资源部也承认东部帮扶省份需求减弱。拆村并居的收益多是预期，拆迁、安置、复垦的成本却要当期支付，这是2010年和2020年两轮都出现先拆后建、补偿不足甚至安置社区烂尾的一个原因。'
      cites: [cs11-mof-2021-01-28-fiscal-2020, cs11-whu-2021-04-25-chen-xiwen-interview, cs11-cntv-2010-11-03-hebei-xinminju, e16-thepaper-2020-06-17-shandong-response, cs11-aisixiang-2019-he-xuefeng-guagou, e16-ifeng-2020-06-26-shandong-hecun, cs11-yicai-2019-cross-province-quota, cs11-sohu-2020-07-02-faren-hecun]
    - text: '编者分析：晋升锦标赛能解释拆村并居到什么程度，现有材料只能说到一半。能对上的是：廊坊2009年起把农村土地整治纳入对各县政府的考核并加大权重，陈锡文说中心城市为了招商引资把指标留在市区；周黎安的研究说，各级经济增长指标存在层层加码，官场竞争“没有财务盈亏的底线”。对不上的是：本站没有找到任何来源把某位省市主官的升迁同他任内的增减挂钩规模联系起来，也没有找到2010年、2020年两轮被点名的诸城、邳州、德州、菏泽、巨野等地主官因此被问责的公开记录；陶然等人对锦标赛理论本身的质疑也还没有定论。本文因此只把锦标赛当作背景机制，不把任何个人的仕途归因于拆村并居。'
      cites: [cs11-cntv-2010-11-03-hebei-xinminju, cs11-whu-2021-04-25-chen-xiwen-interview, e16-sina-2014-03-20-zhou-lian-nfc, e16-cufe-li-zhou-vs-tao]
    - text: '编者分析：中央对增减挂钩本身的定性十多年没有变。2010年国务院说它“对统筹城乡发展发挥了积极作用”，2018年把它变成扶贫筹资渠道，2020年刘家义仍说方向是正确的。变的是约束强迫上楼的文件层级：2010年是国务院常务会议和国务院通知，2020年是两部委通知，2021年写进中央一号文件和法律。同一时期，指标交易的范围从县域、省域扩大到跨省，价格由国家统一定为每亩30万至70万元。禁令针对的是拆的方式，没有针对拆的激励，这可以解释为什么2010年刹车十年后又出现山东的合村并居。'
      cites: [e16-gov-2010-12-27-guofa-47, e16-gov-2018-03-10-cross-province-quota, cs11-guancha-2020-06-28-liu-jiayi-pause, cs11-gov-2020-07-29-natres-128, cs11-npc-2021-04-29-rural-revitalization-law]
  voices:
    - { voice: official, text: 严禁在农村地区盲目建高楼、强迫农民住高楼。, cite: e16-gov-2010-12-27-guofa-47, quote: true }
    - { voice: official, text: 实践表明，土地政策在改善贫困地区生产生活条件、促进农民脱贫致富方面发挥了重要作用。, cite: cs11-people-2018-10-18-guagou-poverty, quote: true }
    - { voice: official, text: 拆不拆、搬不搬、建不建，由农民群众说了算，村民同意率必须达到95%以上才能实施，不搞强迫命令‘一刀切’，不能增加农民负担。, cite: e16-thepaper-2020-06-17-shandong-response, quote: true }
    - { voice: official, text: 那么在这个过程当中，可能农民的话语权是最弱的。农民的利益是最容易受到损害的。, cite: cs11-cntv-2010-11-18-xinwen1plus1, quote: true }
    - { voice: official, text: 中央农村工作领导小组副组长陈锡文2010年说，和平时期大规模的村庄撤并运动“古今中外，史无前例”。, cite: i12-chinanews-2010-11-02-beishanglou }
    - { voice: scholar, text: 实际上，增减挂钩没有创造出任何财富，只是转移了财富。, cite: cs11-aisixiang-2019-he-xuefeng-guagou, quote: true }
    - { voice: scholar, text: 地方政府希望增加财政收入可以理解，问题出在对“增减挂钩”的错误想象上。, cite: e16-ifeng-2020-06-26-shandong-hecun, quote: true }
    - { voice: zh, text: 记者调查发现，这项政策被地方政府利用、“曲解”，成为以地生财的新途径。, cite: cs11-cntv-2010-11-02-beishanglou, quote: true }
    - { voice: witness, text: 像这个房子，楼房它补偿是700块钱一平方，我们那个瓦房，就是像外面那个瓦房，只有450块钱一平方，而我们买它（安置房）要一千块。, cite: cs11-cntv-2010-11-18-xinwen1plus1, quote: true }
