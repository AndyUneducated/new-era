- id: stock-crash-2015
  title: 2015年股灾之后：救市追责与“一行三会”的整肃
  kind: system
  years: '2015–2026'
  people: [xiao-gang, zhang-yujun, yao-gang, liu-shiyu, wang-huimin, fang-xinghai, shang-fulin, xiang-junbo, wu-xiaohui, yang-jiacai, cai-esheng, guo-shuqing, ma-kai, xi-jinping, xu-xiang, liu-xinhua, ling-wancheng, cheng-boming, zhuang-xinyi]
  summary: '2015年夏天的股灾之后，追责从“恶意做空”转向金融监管系统内部：公安部副部长带队进驻证监会，中信证券十多名高管和业务骨干被查，证监会参与救市的五位高层先后离开；2015年底中央巡视组对银监会、保监会专项巡视，此后保监会主席项俊波、银监会主席助理杨家才相继落马，银监会原副主席蔡鄂生后来被判死缓并终身监禁。2017年全国金融工作会议决定设立国务院金融稳定发展委员会，2018年银监会、保监会合并。被指在股灾中“做空”的三家券商，2018年以违法事实不成立结案。'
  sections:
    - h: 公安部进驻证监会
      from: 2015-07-09
      to: 2015-07-22
      text: '2015年7月上旬，股指已连续三周下跌，管理层的多项措施都不见效。7月9日上午，公安部副部长孟庆丰带队到证监会，“会同证监会排查近期恶意卖空股票与股指的线索”；10日他率跨部门工作组到上海，称已发现个别贸易公司涉嫌操纵证券期货交易的线索。据人民网7月13日的报道，公安部出手后，“两市连续两天上演千股涨停的场景”。国内一些媒体随即把股灾归咎于“外国做空势力”。BBC中文网指出，截至当年3月，合格境外机构投资者（QFII）的额度只占A股流动市值的1.4%，难以冲击万亿级别的中国股市。'
      cites: [cs5-people-2015-07-09-police-csrc, cs5-people-2015-07-13-police-shanghai, cs5-bbc-2015-07-22-short-conspiracy]
    - h: 中信证券：从“内鬼”风波到结案
      from: 2015-08
      to: 2019-02
      text: '2015年下半年，“券商龙头”中信证券陷入高管被调查风波。9月15日中信证券公告，总经理程博明等人“因涉嫌内幕交易、泄露内幕信息被公安机关依法要求接受调查”；2016年4月，青岛市公安机关批准逮捕程博明、经纪业务发展委员会行政负责人刘军、权益投资部负责人许骏等人。程博明2010年起任总经理，地位仅次于董事长王东明；据新浪报道，他与证监会主席助理张育军是同学，都是刘鸿儒的学生。但据财新了解，程博明2016年12月被判有期徒刑三年六个月，罪名是“非国家公务人员的受贿罪”，起因是替安徽老乡办事、对方为他在老家购地建房，罪名与股灾无关。2018年11月5日，中信、海通、国信三家券商公告，证监会认为它们在股灾期间被指协助司度公司做空A股一案“涉案违法事实不成立”，决定结案。财新2019年总结，中信证券十多名高管和业务骨干被要求协助调查，最终三人被判刑，罪名都与股灾无关，部分人后来回到中信体系官复原职。同在青岛受审的泽熙投资总经理徐翔，2017年1月以操纵证券市场罪被判5年6个月。'
      cites: [cs5-sina-2017-11-13-cheng-boming, cs5-caixin-2018-11-05-short-case-closed, cs5-caixin-2019-02-19-citic-aftermath, cs1-cctv-2017-01-23-xu-xiang]
    - h: 证监会班子的“真空”
      from: 2015-09-15
      to: 2016-02-20
      text: '救市之后，证监会领导层几乎整体更替。界面新闻统计，“曾经参与救市工作的五位高层人士均因各种原因离开证监会”：主席助理张育军9月被查；9月15日，排名第一的副主席庄心一到龄卸任，由外管局副局长李超接替；10月30日，同样到了退休年龄的副主席刘新华被免，由方星海接替；11月13日副主席姚刚被查，12月9日被免；2016年2月20日，主席肖钢被免，农业银行董事长刘士余接任。至此，救市以来的高级领导班子只剩副主席姜洋和主席助理黄炜。原证监会纪委书记王会民2015年12月起出任中央纪委驻证监会纪检组长，证监会纳入派驻全覆盖。张育军、姚刚两案详见股灾后证监会专题。多年后，这一轮接任和派驻的人中也有人落马：王会民2025年被查，11月被开除党籍，通报称他“执纪违纪，执法犯法，大搞利益交换”，为他人在企业上市、定增融资等方面谋利；方星海2026年7月被宣布接受纪律审查和监察调查。'
      cites: [cs5-jiemian-2016-08-csrc-team, cs5-thepaper-2015-09-15-zhuang-xinyi, r02-people-2015-09-16-zhang-yujun-probe, r07-people-2025-11-24-wang-huimin-expel, t02-xinhua-2026-07-24-fang-xinghai-probe]
    - h: 银监会、保监会的专项巡视
      from: 2015-11-02
      to: 2016-02-04
      text: '2015年11月起，中央巡视组对金融单位开展专项巡视。中央第十二巡视组11月3日至12月31日巡视银监会，2016年2月2日向主席尚福林等反馈，除“党的领导弱化，党的建设缺失，全面从严治党不力”这一通用结论外，具体指出“利用监管职权谋取私利的问题反映多”，“对会管金融机构的监管存在薄弱环节，一些机构问题多发”。中央第十四巡视组11月2日至12月31日巡视保监会，2月1日向主席项俊波反馈：“保险监管权力行使不规范，一些干部存在以权谋私，违规兼职取酬等问题”，还有突击提拔干部的现象，并要求“高度关注领导干部利用行政审批权搞权力寻租、利用行政处罚权搞人情执法等问题”。两份反馈都说，巡视期间收到的一些领导干部问题线索已转中央纪委、中组部等处理。'
      cites: [cs5-people-2016-02-04-cbrc-inspection, cs5-chinacom-2016-02-04-circ-inspection]
    - h: 保监会：吴小晖、项俊波与“肃清流毒”
      from: 2011-10
      to: 2020-06-16
      text: '项俊波2011年10月由农业银行董事长调任保监会主席（另说为当年11月，见澎湃新闻）。安邦案就发生在他任内：2018年5月，上海一中院认定安邦原董事长吴小晖从2011年起“指令他人使用虚假材料骗取原保监会批准和延续销售投资型保险产品”，超规模向公众销售，实际骗取652亿余元，另侵占保费资金100亿元，判处有期徒刑18年，没收财产105亿元；据BBC中文网引知情人士，他2017年6月8日已被警车从北京的安邦办公楼带走。项俊波本人2017年4月9日落马，副主席陈文辉从4月13日起暂时负责保监会工作。9月的开除通报称项俊波“为谋取个人政治利益，滥用审批权和监管权”，还“对抗组织审查，搞迷信活动”。保监会把肃清他的影响当作政治任务：2017年11月16日的党委中心组学习会上，陈文辉提出“要进一步坚决全面彻底肃清项俊波流毒”，会议要求“全面重塑保险监管”。2020年6月，项俊波因受贿1862万余元被判有期徒刑11年，法院认定他有自首情节。'
      cites: [c03-ccdi-2017-09-23-xiang-junbo-expel, cs5-thepaper-2023-05-05-chen-wenhui, c04-bbc-2018-05-10-wu-xiaohui, cs5-iachina-2017-11-20-xiang-poison, c03-rmzxw-2020-06-16-xiang-junbo-verdict]
    - h: 银监会：杨家才与蔡鄂生
      from: 2017-05-23
      to: 2023-12-29
      text: '银监会方面，2017年5月主席助理兼办公厅主任杨家才被查，8月的开除通报称他“打探巡视和纪律审查信息，为个人职务提拔搞非组织活动”，“破坏金融系统政治生态和市场秩序”。2018年7月，濮阳中院认定他1998年至2017年受贿2308.62万元，另有3159万余元财产不能说明来源，合并执行有期徒刑16年。原副主席蔡鄂生2022年1月被开除党籍，通报称他“滥用金融监管权，严重扰乱金融市场秩序，严重污染金融领域政治生态”，并且“退而不休”。2023年12月29日，镇江中院认定他2006年至2021年受贿4.07亿余元，离任后利用影响力受贿1.1亿余元，并在2010年至2013年履行监管职责时徇私舞弊、滥用职权，判处死缓并终身监禁。'
      cites: [t01-ccdi-jlsc-list-p0, r03-people-2017-08-01-yang-jiacai-expel, r03-thepaper-2018-07-26-yang-jiacai-verdict, t02-ccdi-2022-01-24-cai-esheng-expel, t02-thepaper-2023-12-cai-esheng-verdict]
    - h: 监管重组：金融工作会议、金稳委与银保监会
      from: 2017-07-14
      to: 2018-08-31
      text: '2017年7月14日至15日的全国金融工作会议上，习近平说“金融安全是国家安全的重要组成部分”，要求“坚持党中央对金融工作集中统一领导”，“强化对关键岗位、重要人员特别是一把手的监督”，并宣布设立国务院金融稳定发展委员会。11月8日，金稳委成立并召开第一次全体会议，由国务院副总理马凯任主任，定位为国务院统筹协调金融稳定和改革发展重大问题的议事协调机构，职责包括“对金融管理部门和地方政府进行业务监督和履职问责”。2018年4月，银监会与保监会合并为银保监会，原银监会主席郭树清任主席，陈文辉为排名第二的副主席；5个月后他调任社保基金会副理事长，8月31日离开银保监会。'
      cites: [cs5-gov-2017-07-15-fin-work-conf, cs5-gov-2017-11-08-fsdc, cs5-thepaper-2023-05-05-chen-wenhui]
  editor:
    - text: '这一轮整肃与政治斗争的关系，官方和海外的说法差别很大。官方从未把股灾本身定性为政治事件：公安部追查“恶意做空”的结果，是三家券商以违法事实不成立结案，中信证券被判刑的三人罪名也与股灾无关。大纪元等海外媒体则把姚刚、程博明与令计划之弟令完成联系起来，称当局把股灾定性为“经济政变”，这只是传闻，判决中没有对应内容（见“各方说法”）。真正写进通报的政治罪状落在监管者个人身上：项俊波“为谋取个人政治利益”滥用审批权和监管权，杨家才“打探巡视和纪律审查信息”，指向的是个人仕途，而不是救市决策。'
      cites: [cs5-caixin-2018-11-05-short-case-closed, cs5-caixin-2019-02-19-citic-aftermath, cs5-epoch-2015-11-14-yao-gang-coup, c03-ccdi-2017-09-23-xiang-junbo-expel, r03-people-2017-08-01-yang-jiacai-expel]
    - text: '制度原因集中在分业监管下的审批权和对会管机构的软监管。两份巡视反馈都指向监管者以权谋私：银监会“利用监管职权谋取私利的问题反映多”，保监会则被要求警惕“利用行政审批权搞权力寻租”；吴小晖案的判决显示，一家保险集团可以靠虚假材料骗取保监会批准，在六年里非法募集数百亿元。中央的回应不是放松审批，而是加强集中：金融工作会议强调党中央对金融工作的集中统一领导和对一把手的监督，金稳委被赋予对各金融管理部门“履职问责”的职责，随后银监会、保监会合并。'
      cites: [cs5-people-2016-02-04-cbrc-inspection, cs5-chinacom-2016-02-04-circ-inspection, c04-bbc-2018-05-10-wu-xiaohui, cs5-gov-2017-07-15-fin-work-conf, cs5-gov-2017-11-08-fsdc]
    - text: '处理方式上，股灾后的问责分了层次：证监会主席以免职退出，参与救市的副主席或到龄卸任、或被立案；保监会、银监会高官的落马，则发生在2015年底专项巡视、问题线索移交中央纪委之后。清查也没有在2019年结束：蔡鄂生离任多年后被追究，判决认定的受贿延续到2021年；当年派驻证监会的纪检组长王会民和接替刘新华的副主席方星海，又分别在2025年、2026年被查。为整顿证监会而派驻和接任的人，后来本身也成了清查对象。'
      cites: [cs5-jiemian-2016-08-csrc-team, cs5-people-2016-02-04-cbrc-inspection, t02-thepaper-2023-12-cai-esheng-verdict, r07-people-2025-11-24-wang-huimin-expel, t02-xinhua-2026-07-24-fang-xinghai-probe]
  voices:
    - voice: official
      text: '金融管理部门要努力培育恪尽职守、敢于监管、精于监管、严格问责的监管精神，形成有风险没有及时发现就是失职、发现风险没有及时提示和处置就是渎职的严肃监管氛围。'
      cite: cs5-gov-2017-07-15-fin-work-conf
      quote: true
    - voice: official
      text: '要以高度的政治自觉和刀刃向内的勇气和行动，彻底纯净干部思想，纯洁干部队伍'
      cite: cs5-iachina-2017-11-20-xiang-poison
      quote: true
    - voice: zh
      text: '当年闹得沸沸扬扬的中信证券参与救市却私自谋利的大案，就此草草画上句号。'
      cite: cs5-caixin-2019-02-19-citic-aftermath
      quote: true
    - voice: scholar
      text: '美国康奈尔大学政府学院副教授白洁曦（BBC中文网）：“通过怪罪外国势力操纵中国股市，是典型的将人们的注意力从关注中国金融体系弱点转移的方法”，北京害怕的是普通百姓因股市下跌而对政府丧失信心。'
      cite: cs5-bbc-2015-07-22-short-conspiracy
    - voice: zh
      text: '据大纪元（传闻）：股灾和金融界“内鬼”事件据传被当局定性为一场“经济政变”；时事评论员石久天称，姚刚、程博明等人都与令完成有很深的联系。官方通报和判决均未提及。'
      cite: cs5-epoch-2015-11-14-yao-gang-coup
  events: [e03-2015-stock-market-crash, e08-2016-circuit-breaker, e10-2015-csrc-zhang-yao, e10-2016-xiao-gang-removed]
  factions: []
  cites: [cs5-jiemian-2016-08-csrc-team, cs5-caixin-2018-11-05-short-case-closed, cs5-people-2016-02-04-cbrc-inspection, cs5-chinacom-2016-02-04-circ-inspection, c03-ccdi-2017-09-23-xiang-junbo-expel, cs5-gov-2017-07-15-fin-work-conf]

- id: jiangxi-su-rong
  title: 苏荣与江西：“最后一站”的家族腐败与连锁落马
  kind: case
  years: '2001–2023'
  people: [su-rong, jiang-jiemin, mao-xiaobing, lu-wucheng, yu-haiyan, chen-anzhong, yao-mugen, zhao-zhiyong, xu-aimin, liu-lizu, lu-xinshe, zhou-yongkang, song-lin, xi-jinping, li-jianjun-cr]
  summary: '苏荣2001年至2013年先后主政青海、甘肃、江西，2013年升任全国政协副主席，2014年6月成为十八大后第一个落马的副国级官员。官方称他在江西“大肆卖官鬻爵”，13名家庭成员涉案，2017年以受贿1.16亿余元等罪被判无期徒刑。江西随后有陈安众、姚木根、赵智勇等省级干部落马；2016年中央巡视“回头看”批评江西对苏荣案后续处理不力，涉案的43名省管干部此后才基本处理完毕；2017年甘肃也被指对苏荣的负面影响“肃清不力”。'
  sections:
    - h: 前两站：青海与甘肃
      from: '2001'
      to: '2007'
      text: '苏荣1948年生于吉林，从公社会计做到吉林省委副书记，2001年调任青海省委书记，2003年转任甘肃省委书记，2006年任中央党校副校长。据《青海日报》等报道，他主政青海时曾在副省长蒋洁敏陪同下调研西宁，与时任西部矿业集团董事长毛小兵“亲切交谈”。对这两段任期，官方说法并不一致：中央纪委专题片《永远在路上》说，调查发现他在青海和甘肃期间“虽然也发现了一些问题，但都是小问题”，儿子苏铁志也说父亲在青海、甘肃时从不把下属介绍给家人。另说，2017年的判决认定他受贿始于2002年，即青海任内；2017年2月，中央巡视组又向甘肃省委指出“苏荣在甘肃造成的负面影响肃清不力”。'
      cites: [b12-xinhua-2013-03-11-su-rong-resume, cs5-people-2014-07-16-mao-xiaobing, b12-people-2016-10-21-su-rong-documentary, c03-people-2017-01-23-su-rong-verdict, cs5-caijing-2017-07-26-gansu]
    - h: 江西：“最后一站”与苏家生意
      from: '2007'
      to: '2013'
      text: '2007年苏荣任江西省委书记。中央纪委2015年的警示文章记载，他初到江西就在干部大会上说：“我到江西是最后一站了，希望离任时老百姓能说，苏荣这个人还行”。文章称，他的亲属把江西视为最后捞一把的机会，“苏荣所收贿赂中大部分发生在2011年换届前后”，其后已超过规定年龄的苏荣连任省委书记。妻子于丽芳直接给省市领导打招呼提拔干部，并频繁插手土地出让、工程建设和招投标；儿子多次插手干部任免和土地、工程项目；围绕苏家还出现了一批买官卖官的掮客，社会人员郭某被称为“地下组织部长”。文章说，已查实苏荣有13名家庭成员涉案，“夫妻联手、父子上阵、兄弟串通、七大姑八大姨共同敛财”。2009年，苏荣违反决策程序拍板南昌某钢铁公司改制，致使57.97%的国有股权被某集团低价收购。他在忏悔录里写道，“副厅级以上干部给我送钱款和贵重物品的人数达40多人”。'
      cites: [b12-xinhua-2013-03-11-su-rong-resume, b12-xinhua-2015-05-29-su-rong-warning]
    - h: 举报与巡视
      from: '2011'
      to: 2014-06-25
      text: '据《财经》报道，2011年，新余市人大常委会主任周建华在系统内部实名举报于丽芳和时任新余市委主要领导，称新余高专土地出让中的腐败致国有资产损失10亿元；半年后，周建华本人于2012年1月4日被江西省纪委“双规”，2014年1月以受贿罪一审被判死缓。中央第八巡视组2013年5月27日至8月20日巡视江西，周建华的前妻姚敏建向巡视组实名举报苏荣之妻。巡视组副组长宁延令后来说，巡视中有干部反映，苏荣在省人大常委会主任选举中丢了将近50票，在全国人大代表选举中又丢了将近70票。9月18日巡视组反馈，陈安众等人的问题线索随后被转交中央纪委。2014年6月14日，中央纪委宣布苏荣接受调查，《财经》称于丽芳此前已被带走；6月25日，全国政协常委会免去他的副主席职务。'
      cites: [b12-caijing-2014-07-02-yu-lifang, t01-chinacourt-2015-06-chen-anzhong-verdict, b12-people-2016-10-21-su-rong-documentary, b12-rfa-2014-06-15-su-rong, c03-ccdi-2014-06-14-su-rong-probe, b12-bbc-2014-06-25-su-rong]
    - h: 江西的连锁落马
      from: 2013-12-06
      to: 2016-01-29
      text: '苏荣落马前后，江西一批省级干部被查。2013年12月，省人大常委会副主任陈安众被查，2015年以受贿810万余元被判12年；2014年3月，副省长姚木根被查，2015年12月被判13年；2014年7月，省委原常委、秘书长赵智勇被开除党籍、降为科员，他出身工商银行，2001年进入江西省政府，2008年起任省委秘书长，是苏荣的下属；2015年2月，省政协副主席许爱民被开除党籍、降为副处级非领导职务；2016年1月，省政协副主席刘礼祖被开除党籍、降为科员。据《中国新闻周刊》报道，苏荣被查后3个多月里，省发改委主任李安泽、新余市委书记陈卫民等多名与他关系密切的厅级干部落马。警示文章写道，陈安众、姚木根、赵智勇等人的腐败行为“多发生在苏荣主政期间，且都存在给苏荣送钱送物问题”，并点名“苏荣力排众议让姚木根成为副省级干部”，明知陈安众问题反映多仍予重用。'
      cites: [t01-chinacourt-2015-06-chen-anzhong-verdict, t01-ccdi-zjsc-list-p5, t01-163-2015-12-18-yao-mugen-verdict, r01-ccdi-2014-07-16-zhao-zhiyong-expel, cs5-bbc-2014-07-16-three-expelled, r02-ccdi-2015-02-17-xu-aimin-expel, r02-ccdi-2016-01-29-ten-cadres, cs5-sina-2015-02-17-su-rong-expel, b12-xinhua-2015-05-29-su-rong-warning]
    - h: 双开与审判
      from: 2015-02-16
      to: 2017-01-23
      text: '2015年2月，苏荣被开除党籍和公职。通报称他“大肆卖官鬻爵，带坏了干部队伍，败坏了社会风气”，“支持、纵容亲属利用其特殊身份擅权干政，谋取巨额非法利益”，对江西出现的严重腐败问题“负有主要领导责任”。2016年10月，他在专题片《永远在路上》中露面，中央纪委工作人员说全案有十多位亲属涉案，苏荣自称是全家腐败窝案的“掌门人”。2017年1月23日，济南中院认定他2002年至2014年收受财物1.16亿余元，滥用职权致使国家和人民利益遭受重大损失，另有8027万余元财产不能说明来源，三罪并罚决定执行无期徒刑；法院因他主动交代办案机关尚未掌握的部分受贿事实、赃款赃物全部追缴而从轻处罚，他当庭表示不上诉。'
      cites: [c03-ccdi-2015-02-16-su-rong-expel, b12-people-2016-10-21-su-rong-documentary, c03-people-2017-01-23-su-rong-verdict]
    - h: 2016年“回头看”：43名省管干部
      from: 2016-06-30
      to: 2016-12-29
      text: '2016年6月30日至8月30日，中央第十一巡视组对江西进行巡视“回头看”，10月8日反馈。反馈点出“苏荣案后续处理工作不力，造成负面政治影响”，具体包括省委落实习近平“坚定不移肃清苏荣等人腐败案件的毒害”的指示不及时，以及“涉苏荣案省管干部问题线索处理不及时、不透明”。鹿心社任书记的江西省委在整改通报中承认，“既有求稳思想，也没有及时在全省开展有声势的警示教育”。通报公布，涉苏荣案的43名省管干部已基本处理到位：移送司法机关9人，纪律处分16人，因违纪情节轻微或不构成违纪予以了结18人。12月1日，省委向全省印发苏荣案及相关人员违纪案的教训警示通报；苏荣力推的“造绿工程”也被列为反面教材。通报还说，2014年以来因违纪违法受到处理的省管干部有81人，并已按中央巡视组指出的11名买官卖官涉案人员名单逐一甄别处理。'
      cites: [cs5-yyzx-2016-12-29-jiangxi-rectify]
    - h: 甘肃、青海的余波
      from: 2014-04-24
      to: 2018-07-18
      text: '苏荣主政过的另外两省也有人被追究。青海省委原常委、西宁市委书记毛小兵2014年4月被查，7月被开除党籍，BBC中文网注意到他曾与苏荣、蒋洁敏在西宁共事；2017年5月，兰州中院以受贿1.04亿余元、挪用公款4亿元判他无期徒刑。甘肃方面，据《财经》援引多个信源，甘肃省人大常委会原副主任陆武成在苏荣主政期间由金昌市委书记升任副省长，升迁中曾向苏荣行贿巨款，苏荣被查后供出了他；陆武成2015年1月被查，2016年11月以受贿1626万余元被判12年6个月，判决只涉及他本人2006年起的受贿。2017年2月中央巡视组指甘肃对苏荣的负面影响“肃清不力”后，省委原常委、副省长虞海燕被查，知情人士称他在苏荣主政期间从酒钢高管升任省国资委主任；他的开除通报称其“搞团团伙伙，培植私人势力”，2018年7月以受贿6563万余元被判15年。'
      cites: [t01-qq-2017-05-11-mao-xiaobing-verdict, cs5-bbc-2014-07-16-three-expelled, cs5-caijing-2017-07-26-gansu, t01-ifeng-2016-11-18-lu-wucheng-verdict, r03-ccdi-2017-06-04-yu-haiyan-expel, r03-court-2018-07-18-yu-haiyan-verdict]
  editor:
    - text: '苏荣案在官方叙事里是家族腐败和卖官鬻爵的案子，而不是政治案件：通报虽有“无视党的政治规矩”“擅权干政”这样的重话，指的都是用人和纵容亲属，判决也只有受贿、滥用职权和巨额财产来源不明三项。外界对他的靠山各有说法：BBC称他被认为与周永康关系密切，俞梅荪认为他“跟周永康势力都有盘根错节的关系”，李建军则认为他落马与周案牵涉不大，而与华润的宋林有关（见“各方说法”）。这些说法都没有得到官方材料印证。从专题片披露的经过看，案子的起点是江西本地的实名举报和他在选举中大量丢票，更像是本地的不满经巡视渠道上达，而不是某次派系清洗的副产品。'
      cites: [c03-ccdi-2015-02-16-su-rong-expel, c03-people-2017-01-23-su-rong-verdict, b12-bbc-2015-02-16-su-rong, b12-rfa-2014-06-15-su-rong, b12-people-2016-10-21-su-rong-documentary]
    - text: '制度原因，官方自己总结得很直白。警示文章写道，“苏荣的问题社会上早有反映，但上级发现不了、同级不敢监督、下级不敢抵制”；他超龄连任，亲属反而更急于捞最后一把。苏荣兼任省人大常委会主任，口头禅是“叫纪委查你”，持不同意见的干部被搁置任职。周建华的遭遇说明了省内监督的代价：他在系统内部实名举报于丽芳，半年后自己被江西省纪委“双规”，最终被判死缓。省内渠道走不通，问题最后是靠中央巡视组的个别谈话和实名举报才被捅破。'
      cites: [b12-xinhua-2015-05-29-su-rong-warning, b12-xinhua-2013-03-11-su-rong-resume, b12-caijing-2014-07-02-yu-lifang, b12-people-2016-10-21-su-rong-documentary]
    - text: '处理方式上，苏荣本人从严，涉案干部却拖了两年多。43名涉案省管干部中有18人以批评教育了结，赵智勇、许爱民、刘礼祖等副省级干部只被开除党籍、降为科员或副处级，没有移送司法；直到中央巡视“回头看”点名“不及时、不透明”，江西才集中处理并公开数字。降级也未必是终点：赵智勇2015年以驻京办科员身份退休，2023年11月又因涉嫌严重违法接受江西省监委调查。'
      cites: [cs5-yyzx-2016-12-29-jiangxi-rectify, r01-ccdi-2014-07-16-zhao-zhiyong-expel, r02-ccdi-2015-02-17-xu-aimin-expel, r02-ccdi-2016-01-29-ten-cadres, t01-ce-2023-11-20-zhao-zhiyong-probe]
  voices:
    - voice: official
      text: '正常的同志关系，完全变成了商品交换关系。'
      cite: b12-xinhua-2015-05-29-su-rong-warning
      quote: true
    - voice: official
      text: '作为一个省委书记，他丢这么多的票，那显然就是说一些干部也好，包括一些代表也好，已经对他的意见很大了。'
      cite: b12-people-2016-10-21-su-rong-documentary
      quote: true
    - voice: official
      text: '我们对苏荣案的后续处理，既有求稳思想，也没有及时在全省开展有声势的警示教育，根源在于政治敏锐性不够'
      cite: cs5-yyzx-2016-12-29-jiangxi-rectify
      quote: true
    - voice: zh
      text: '苏荣被认为与前中共政治局常委，中共中央政法委前书记周永康关系密切。'
      cite: b12-bbc-2015-02-16-su-rong
      quote: true
    - voice: zh
      text: '前国务院办公厅秘书俞梅荪（自由亚洲电台）认为，苏荣“靠打击法轮功上台，跟周永康势力都有盘根错节的关系”；前《山西晚报》记者李建军则认为他的落马与周案牵涉不大，“肯定和华润有关系，因为他跟宋林关系非常好”。两种说法均属推测，未获官方证实。'
      cite: b12-rfa-2014-06-15-su-rong
    - voice: zh
      text: '肃清苏荣余毒，是此轮甘肃政界再现反腐风暴的深层逻辑。'
      cite: cs5-caijing-2017-07-26-gansu
      quote: true
  events: [e08-2014-su-rong]
  factions: []
  cites: [c03-ccdi-2015-02-16-su-rong-expel, c03-people-2017-01-23-su-rong-verdict, b12-xinhua-2015-05-29-su-rong-warning, b12-people-2016-10-21-su-rong-documentary, cs5-yyzx-2016-12-29-jiangxi-rectify, cs5-caijing-2017-07-26-gansu]

- id: life-sentences
  title: 终身监禁：死缓之上的“牢底坐穿”
  kind: system
  years: '2015–2026'
  people: [bai-enpei, wu-changshun, xing-yun, zhao-zhengyong, yun-gongmin, fu-zhenghua, wang-like, sun-lijun, liu-yanping, liu-guoqiang, li-wenxi, wang-bin-chinalife, sun-deshun, cai-esheng, he-zehua, fan-yifei, wang-dawei-liaoning, sun-zhigang, li-pengxin, luo-yulin, wang-bo-nm, gou-zhongwen, wei-fenghe, li-shangfu, jiang-chaoliang, lai-xiaomin, song-chaohua, zhu-mingguo]
  summary: '终身监禁由2015年8月通过、11月施行的《刑法修正案（九）》设立，只适用于被判死缓的贪污受贿犯：死缓期满减为无期徒刑后终身监禁，不得减刑、假释。2016年10月白恩培成为第一案，此后到2026年8月，本站统计至少有28名官员和国企、金融高管被判此刑，包括两任国防部长魏凤和、李尚福。判决几乎都先认定“论罪应当判处死刑”，再因认罪、退赃或立功而“可不立即执行”；受贿认定额多在2亿元以上，最高的超过10亿元，但金额并不机械决定结果。'
  sections:
    - h: 立法：堵住“后门”
      from: 2014-02
      to: 2015-11-01
      text: '终身监禁是2015年《刑法修正案（九）》新设的刑罚。据新华社，2015年8月24日提请全国人大常委会审议的草案三审稿新增一款：对犯贪污、受贿罪被判处死缓的，法院可以同时决定在死缓期满减为无期徒刑后终身监禁，不得减刑、假释。立法的直接指向是减刑、假释和监外执行被滥用：山东泰安原市委书记胡建学经批准保外就医1年，此后连续7年续保；广东江门原副市长林崇中宣判当日从法院直接回家保外就医。2014年2月，中央政法委已出台文件严格规范减刑、假释和暂予监外执行。刑法学者阮齐林说，“要增加刑罚的力度，不能法院前门判了，后门就出来了”。8月29日全国人大常委会通过修正案，自2015年11月1日起施行；新条款写入刑法第三百八十三条：属于数额特别巨大等情形被判处死缓的，“人民法院根据犯罪情节等情况可以同时决定在其死刑缓期执行二年期满依法减为无期徒刑后，终身监禁，不得减刑、假释”。'
      cites: [cs5-npc-2015-08-26-life-draft, cs5-gov-2015-08-30-criminal-law-9]
    - h: 司法解释与第一案
      from: 2016-04-18
      to: 2017-01-01
      text: '2016年4月18日，最高法、最高检发布贪污贿赂刑事案件司法解释，明确终身监禁适用于“判处死刑立即执行过重、判处一般死缓又偏轻”的重大贪污受贿罪犯，必须在一、二审作出死缓裁判时一并决定，一经作出应无条件执行。10月9日，安阳中院判处全国人大环资委原副主任委员白恩培死缓并终身监禁，认定受贿2.46亿余元，这是适用终身监禁的第一案，白恩培也是首个适用此刑的正部级官员。随后，国家能源局煤炭司原副司长魏鹏远（受贿2.1亿余元）和黑龙江龙煤集团物资供应分公司原副总经理于铁义（受贿3.06亿余元）也被判死缓并终身监禁。新华社称，于铁义案是当时法院认定的全国受贿金额最高的案件，魏鹏远案则是检察机关一次起获赃款现金数额最大的案件。11月15日，最高法发布减刑、假释司法解释，自2017年1月1日起施行，其中新增了对决定终身监禁的贪污受贿罪犯不得再减刑、假释的规定。'
      cites: [cs5-xinhua-2016-10-10-bai-enpei-first, c03-people-2016-10-09-bai-enpei-verdict, cs5-xinhua-2016-11-15-life-three, cs5-xinhua-2016-10-23-yu-tieyi, cs5-xinhua-2016-11-16-sentence-rules]
    - h: 名单：2016年至2026年
      from: 2016-10-09
      to: 2026-08-28
      text: '按本站人物卡和判决统计，到2026年8月，因贪腐被判死缓并终身监禁的至少有28人（含尚无人物卡的魏鹏远、于铁义、张中生）。2017年是天津市公安局原局长武长顺；2019年至2021年有内蒙古自治区党委原政法委书记邢云、陕西省委原书记赵正永和山西吕梁原副市长张中生；2022年至2023年最为密集，有华电集团原总经理云公民，孙力军团伙的傅政华、王立科、孙力军、刘彦平，辽宁的刘国强、李文喜，中国人寿原董事长王滨，中信银行原行长孙德顺和银监会原副主席蔡鄂生；2024年有国家烟草专卖局原副局长何泽华、人民银行原副行长范一飞、辽宁省原副省长兼公安厅长王大伟和贵州省委原书记孙志刚；2025年有新疆党委原副书记李鹏新、青海原常务副省长骆玉林、内蒙古原副主席王波和体育总局原局长苟仲文；2026年5月，军事法院判处两任国防部长魏凤和、李尚福死缓并终身监禁，8月湖北省委原书记蒋超良也被判此刑。新浪2024年10月转载的一份不完全统计为20人，并注意到“其中多人来自金融系统”。'
      cites: [cs5-xinhua-2016-11-15-life-three, c07-court-2017-05-27-wu-changshun, r04-yicai-2019-12-03-xing-yun-verdict, c03-xinhua-2020-07-31-zhao-zhengyong-verdict, cs5-court-2021-10-29-zhang-zhongsheng, t02-cnstock-2022-06-yun-gongmin-verdict, c03-xinhua-2022-09-22-fu-zhenghua-verdict, c03-xinhua-2022-09-22-wang-like-verdict, c03-xinhua-2022-09-23-sun-lijun-verdict, c03-xinhua-2023-01-10-liu-yanping-verdict, r04-xinhua-2022-11-08-liu-guoqiang-verdict, r05-chinanews-2023-01-06-li-wenxi-verdict, t02-xinhua-2023-09-12-wang-bin-verdict, r04-court-2023-11-10-sun-deshun-verdict, t02-thepaper-2023-12-cai-esheng-verdict, t02-chinanews-2024-05-29-he-zehua-verdict, t02-xinhua-2024-10-10-fan-yifei-verdict, t02-people-2024-10-14-wang-dawei-verdict, k05-chinanews-2024-10-29-sun-zhigang, t02-cctv-2025-04-22-li-pengxin-verdict, r05-court-2025-07-14-luo-yulin-verdict, r07-people-2025-10-14-wang-bo-nm-verdict, k05-chinanews-2025-12-08-gou-zhongwen, b08-gov-2026-05-07-wei-li-sentenced, k04-xinhua-2026-08-28-jiang-chaoliang-verdict, cs5-sina-2024-10-30-life-list]
    - h: 金额：从1亿到10亿
      from: 2011-07-19
      to: 2026-09-22
      text: '已公布金额的案件中，受贿认定额大多在2亿元以上：最低的是傅政华的1.17亿余元，他另犯徇私枉法罪；最高的是张中生的10.4亿余元，其次是孙德顺9.795亿余元、何泽华9.43亿余元、李鹏新8.22亿余元、孙志刚8.13亿余元和蒋超良7.46亿余元。武长顺的主要数额来自贪污，他通过实际控制的公司非法占有公共财物3.42亿余元。军事法院对魏凤和、李尚福的判决没有公布金额。新华社2016年指出，单看金额不足以决定是否终身监禁：此前姜人杰受贿1.0857亿元、许迈永受贿1.45亿余元并贪污5300余万元，2011年7月19日同时被执行死刑；而涉案金额超过2亿元的朱明国并未被判终身监禁。2021年，华融原董事长赖小民受贿17.88亿余元，被判死刑并执行；2026年，四川省人大常委会原副主任宋朝华受贿1.48亿余元，被判死缓而没有附加终身监禁。'
      cites: [c03-xinhua-2022-09-22-fu-zhenghua-verdict, cs5-court-2021-10-29-zhang-zhongsheng, r04-court-2023-11-10-sun-deshun-verdict, t02-chinanews-2024-05-29-he-zehua-verdict, t02-cctv-2025-04-22-li-pengxin-verdict, k05-chinanews-2024-10-29-sun-zhigang, k04-xinhua-2026-08-28-jiang-chaoliang-verdict, c07-court-2017-05-27-wu-changshun, b08-gov-2026-05-07-wei-li-sentenced, cs5-xinhua-2016-11-15-life-three, c03-court-2021-01-05-lai-xiaomin-verdict, c03-xinhua-2021-01-29-lai-xiaomin-executed, r07-xinhua-2026-09-22-song-chaohua-verdict]
    - h: 判词：为什么“可不立即执行”
      from: 2016-10-09
      to: 2023-12-29
      text: '各案判决的结构几乎相同。先认定“论罪应当判处死刑”，首批三案的表述是“受贿数额特别巨大、犯罪情节特别严重、社会影响特别恶劣、给国家和人民利益造成特别重大损失”；再列出从宽理由，通常是如实供述、主动交代办案机关尚未掌握的事实、认罪悔罪、积极退赃，因此“可不立即执行”；最后根据犯罪情节和危害，决定附加终身监禁。有些案件还有重大立功：张中生在二审期间检举他人重大受贿犯罪线索，经查证属实构成重大立功，仍被判终身监禁。蔡鄂生案的判决同样先说他“论罪应当判处死刑”，又因主动交代大部分受贿事实、部分受贿未遂而判死缓，并决定终身监禁。刑法学者赵秉志认为，终身监禁的立法本意是作为死刑立即执行的替代措施，适用对象应是本应判处死刑立即执行、基于慎用死刑政策才判死缓的罪犯。'
      cites: [cs5-xinhua-2016-11-15-life-three, cs5-court-2021-10-29-zhang-zhongsheng, t02-thepaper-2023-12-cai-esheng-verdict]
    - h: 谁被判终身监禁
      from: 2016-10-09
      to: 2026-08-28
      text: '从职务看，名单分布很散：省委书记或原省委书记有白恩培、赵正永、孙志刚、蒋超良；政法系统有武长顺、邢云、李文喜、王大伟和孙力军团伙的四人；金融系统有王滨、孙德顺、蔡鄂生、范一飞；还有烟草局、体育总局、国资委和央企的高管，以及两名曾任国务委员的前国防部长。级别上从国家部委的副司长、国企分公司副总经理到中央军委委员都有。官方明确作政治定性的只有孙力军团伙四人，官方通报和报道称其属于孙力军“政治团伙”；其余多数人的判决只涉及受贿，部分附有滥用职权、徇私枉法、操纵证券市场、非法持有枪支或隐瞒境外存款等罪名。'
      cites: [c03-xinhua-2022-09-23-sun-lijun-verdict, c03-ccdi-2022-03-31-fu-zhenghua-expel, t02-xinhua-2023-09-12-wang-bin-verdict, b08-gov-2026-05-07-wei-li-sentenced, cs5-xinhua-2016-11-15-life-three]
  editor:
    - text: '终身监禁是一项刑罚制度，而不是政治清洗的专门工具：名单上大多数人没有政治定性，孙力军团伙四人、两名前国防部长和普通巨贪被放在同一个刑罚尺度上处理。政治含义更多体现在时机和程序上：孙力军团伙的宣判集中在二十大前一个月，魏凤和、李尚福由军事法院同日宣判。对高级官员而言，“死缓加终身监禁”已成为不判死刑立即执行时的最高刑；BBC在赖小民被判死刑时指出，近年中国对经济类犯罪判处死刑较为少见。'
      cites: [c03-xinhua-2022-09-23-sun-lijun-verdict, b08-gov-2026-05-07-wei-li-sentenced, b12-bbc-2021-01-07-lai-xiaomin, cs5-xinhua-2016-11-15-life-three]
    - text: '设立终身监禁的制度原因有两条。一是堵住刑罚执行中的漏洞：立法时举出的胡建学、林崇中等案说明，判决之后的减刑、假释和保外就医可以被权力运作；终身监禁由法院在判决时一并决定，“不得减刑、假释”，等于拿掉了执行环节的裁量空间。二是在减少死刑的方向下保留威慑：立法讨论和赵秉志都把它定位为死刑立即执行的替代措施。争议也在刑罚目的上：一些专家和司法工作者在立法时就提出，“终身监禁让罪犯看不到希望，有违教育改造的刑罚目的”。'
      cites: [cs5-npc-2015-08-26-life-draft, cs5-xinhua-2016-10-10-bai-enpei-first, cs5-xinhua-2016-11-15-life-three]
    - text: '量刑上看不出固定的金额门槛。受贿1亿多元的傅政华被判终身监禁，受贿1.48亿余元的宋朝华只判死缓；受贿10亿余元的张中生和受贿17亿余元的赖小民，一个终身监禁、一个死刑立即执行。起决定作用的是判决书里的“情节”：是否主动交代、退赃多少、有无重大立功，以及是否“社会影响特别恶劣”。这些因素由法院综合判断，判决很少说明各自的权重，外界难以从金额推断结果。'
      cites: [c03-xinhua-2022-09-22-fu-zhenghua-verdict, r07-xinhua-2026-09-22-song-chaohua-verdict, cs5-court-2021-10-29-zhang-zhongsheng, c03-court-2021-01-05-lai-xiaomin-verdict, cs5-xinhua-2016-11-15-life-three]
  voices:
    - voice: doc
      text: '犯第一款罪，有第三项规定情形被判处死刑缓期执行的，人民法院根据犯罪情节等情况可以同时决定在其死刑缓期执行二年期满依法减为无期徒刑后，终身监禁，不得减刑、假释。'
      cite: cs5-gov-2015-08-30-criminal-law-9
      quote: true
    - voice: scholar
      text: '草案三审稿新增这一条款，意味着被判死缓的贪官很可能要把牢底坐穿。'
      cite: cs5-npc-2015-08-26-life-draft
      quote: true
    - voice: scholar
      text: '其立法的本意是将终身监禁作为死刑立即执行的替代措施。'
      cite: cs5-xinhua-2016-11-15-life-three
      quote: true
    - voice: official
      text: '新增了对决定终身监禁的贪污、受贿罪犯不得再减刑、假释的规定。'
      cite: cs5-xinhua-2016-11-16-sentence-rules
      quote: true
    - voice: official
      text: '终身监禁让罪犯看不到希望，有违教育改造的刑罚目的。可考虑借鉴其他国家规定，对于不得假释的终身监禁，经过严格评估也可以释放或予以特赦，为这部分人保留出路。'
      cite: cs5-npc-2015-08-26-life-draft
      quote: true
  events: [e08-2022-fu-sun-verdicts, e08-2021-lai-xiaomin-executed]
  factions: [sun-lijun-gang]
  cites: [cs5-gov-2015-08-30-criminal-law-9, cs5-npc-2015-08-26-life-draft, cs5-xinhua-2016-11-15-life-three, cs5-xinhua-2016-10-10-bai-enpei-first, cs5-sina-2024-10-30-life-list]

- id: political-brokers
  title: 政治掮客：牵线的商人、“地下组织部长”与政治骗子
  kind: system
  years: '1999–2026'
  people: [ding-shumiao, liu-zhijun, ling-jihua, pan-yiyang, li-chuncheng, bai-enpei, huo-ke, si-xinliang, ma-jian, zhang-yue, guo-wengui, su-rong, qin-guangrong, wang-sanyun, ye-jianming, hu-huaibang, shen-deyong, fu-zhenghua, liu-guoqiang, liu-xinyun, li-jiexiang, cao-guangjing, xu-wenrong, han-yong, zhang-hongli, yang-kening, wang-yixin, peng-guofu, wang-yilin, wang-yong-xz, dou-wangui, luo-baoming, li-gang-zzb, lu-kehua, zhang-xiaolian, zhou-jiabin, wang-zhonghe, duan-chenggang, fei-dongbin, lan-tianli, wu-shenghua, gao-xingfu, liu-hui, wu-lan, su-hongbo, gu-liping]
  summary: '政治掮客指在官员之间或官商之间牵线、代人运作升迁、项目和案件的人。十八大前后的判决和通报中，最典型的是借刘志军运作铁路工程的丁书苗、在令计划案中出庭指证的广厦创始人楼忠福、与国家安全部副部长马建结成利益同盟的郭文贵，以及苏荣、秦光荣身边被称为“地下组织部长”的商人。不少掮客本身就是骗子，丁书苗和傅政华都曾被骗。2021年起“结交政治骗子”成为中央纪委通报的常见用语，新修订的党纪处分条例也为此专设条款。'
  sections:
    - h: 丁书苗与铁道部
      from: '2004'
      to: 2014-12-16
      text: '丁书苗又名丁羽心，山西女商人，北京博宥投资管理集团法定代表人，是十八大前后最典型的“权力掮客”。2014年12月北京二中院认定，2004年至2011年，她通过时任铁道部部长刘志军，为自己和亲属控制的公司获得铁路货运计划和动车组轮对项目公司股权，运作铁路工程中标并解决资金困难；2007年至2010年，她与郑朋等5人同投标企业商定“有偿运作”，经铁道部相关人员帮助，先后使23家公司中标57个铁路工程项目，以中介费名义获利30亿余元，其中她个人获利20亿余元。另说，人民网转发的新华网简讯称中标额达1800多亿元、她个人非法获利25亿余元。法院还认定，她为刘志军“跑官”“办事”行贿4900万元，并为“树立正面形象以逃避有关部门查处”，先后38次向国务院扶贫办外资项目管理中心主任范增玉行贿4000万余元。她在庭审供述中说：“只要他安排我做的事我都会尽力去办，花多少钱我都不吝啬。”刘志军的判决把她列为11名请托人之一，开除通报则单独写明他“滥用职权帮助北京博宥投资管理集团公司董事长丁羽心获取巨额非法利益”。丁书苗2011年初归案后很快供出刘志军，最终以行贿罪、非法经营罪被判有期徒刑20年，罚金25亿元。'
      cites: [cs5-court-2014-12-17-ding-shumiao, f09-people-2014-12-16-ding-shumiao, cs5-chinadaily-2013-09-26-ding-4900, c08-xinhua-2013-07-08-liu-zhijun-verdict, c08-cyol-2012-05-29-liu-zhijun-expel]
    - h: 令计划案的请托人
      from: 2014-12
      to: 2016-12-13
      text: '令计划案判决列出的行贿人共七人：楼忠福、崔晓玉、潘逸阳、魏新、李春城、白恩培和霍克，其中潘逸阳、李春城、白恩培、霍克是官员。法院认定，令计划承诺为楼忠福及其子谋取利益，单独或与妻子谷丽萍收受楼忠福财物1465万余元，是七人中最多的；崔晓玉的1438万元由谷丽萍收受，令计划明知并认可；魏新一项，是其子令谷为魏新所在单位办事而向魏新等人索取财物，令计划事后知情未予退还。2016年6月不公开开庭时，楼忠福、崔晓玉出庭当庭指证。据《新京报》报道，楼忠福是浙江广厦控股集团创始人，令计划2014年12月22日被宣布调查后数日，他就被中纪委带走协助调查，2016年9月已回到家中；他此前接受采访时说，与谷丽萍合伙开公司实质是“赞助”谷丽萍的基金会。《新京报》转述《中国经济周刊》称，楼忠福的政界资源由东阳、金华延至浙江省外，他结识令氏家族的中间人是浙江省委原组织部长斯鑫良；斯鑫良2016年12月以受贿罪被判13年。'
      cites: [b07-court-2016-07-04-ling-sentence, cs5-bjnews-2016-09-27-lou-zhongfu, t01-ccdi-2016-12-13-si-xinliang-verdict]
    - h: 郭文贵、马建与张越
      from: '1999'
      to: 2026-06-29
      text: '郭文贵案是商人与安全、政法官员结盟的例子。2018年12月大连中院认定，国家安全部原副部长马建1999年至2014年为郭文贵及其实际控制的北京政泉置业等提供帮助，收受财物1.09亿余元；2008年至2014年两人共谋，指派人员以威胁等手段强迫他人转让股份、放弃优先购买权，使政泉公司控股中国民族证券；2013年马建获取方正证券与民族证券重组的内幕信息后，指使亲属买卖方正证券股票获利4929万余元。BBC指出三项罪名都与郭文贵相关，马建被判无期徒刑。BBC转引腾讯新闻称，郭文贵曾以社交圈“盘古会”为平台结交高官。法广引述财新报道称，郭文贵通过公安部国保局副局长林强认识了时任河北省委政法委书记张越，张越又把马建介绍给郭文贵，三人结成攫取财富的同盟，借助安全部门的特殊权力和河北政法力量，对竞争对手或合作伙伴进行豪夺、构陷和勒索。张越2018年7月以受贿罪被判15年。郭文贵2014年出逃，2017年在海外“爆料”期间被国际刑警组织发出红色通缉令，《南华早报》称他涉嫌向马建行贿；2026年6月，他在美国因欺诈等罪被判30年监禁。'
      cites: [f06-court-2018-12-27-ma-jian, b14-bbc-2018-12-27-ma-jian, f06-rfi-2016-04-17-zhang-yue, f06-hk01-2018-07-12-zhang-yue, b14-bbc-2017-04-21-guo-baoliao, b14-bbc-2024-07-18-guo-machine, c04-bbc-2026-06-30-guo-wengui]
    - h: “地下组织部长”
      from: '2007'
      to: 2020-05-06
      text: '在地方，掮客经营的主要是官位。中央纪委2015年的苏荣案警示文章说，围绕苏荣及其亲属产生了一些买官卖官的掮客，“这些掮客有真有假”，四处寻找有买官欲望的干部，常说“你也够条件了，花点钱，我介绍你和于大姐、苏公子认识”；社会人员郭某与苏荣之妻于丽芳熟稔后，经常插手人事安排，被称为“地下组织部长”。吉林私企老板王某曾是苏荣的下属，苏荣应他的要求提拔了多名干部，以致他每次到江西都有干部抢着接送、宴请、送钱送物。云南也有一个“地下组织部长”：2020年5月中央纪委网站披露，商人苏洪波长期充当政治掮客，“把政治资本和政治外衣转化为攫取经济利益的资本”，被秦光荣亲切地称为“洪波”。秦光荣在忏悔录中承认想通过苏洪波攀高枝，任省委书记后“对其既讨好拉拢又忌惮畏惧，在一些干部问题上也听从他的意见”。这两份材料都没有交代郭某、王某和苏洪波本人受到何种处理。'
      cites: [b12-xinhua-2015-05-29-su-rong-warning, cs2-ccdi-2020-05-06-su-hongbo]
    - h: 官员当掮客
      from: 2014-10-28
      to: 2022-09-07
      text: '掮客不都是商人，也有在任官员。中央纪委专题片《零容忍》披露，华信系掌门人叶简明与国家开发银行董事长胡怀邦之间的“掮客”，是甘肃省委原书记王三运：叶简明经王三运介绍认识胡怀邦，2015年华信能源向国开行申请48亿美元贷款授信时，又请王三运出面请托。王三运在片中说：“我觉得叶简明对我不错，他找到我，我也跟胡怀邦熟，我也觉得不是个难事儿。”专题片称，王三运和胡怀邦各自收受叶简明数千万元，国开行最终批准了这笔“从一开始就潜藏重大风险”的贷款。在司法领域，这类中间人被称为“司法掮客”：2014年十八届四中全会决定要求“坚决惩治司法掮客行为，防止利益输送”；2022年最高人民法院原常务副院长沈德咏被开除党籍，通报称他“纵容默许亲属、秘书利用其职务影响充当司法掮客”。'
      cites: [b12-xinhua-2022-01-15-zero-tolerance-ep1, e03-gov-2014-10-28-rule-of-law, k04-ccdi-2022-09-07-shen-deyong-expel]
    - h: 被骗的买官者：从刘琳到石晓春
      from: '2007'
      to: 2023-01-07
      text: '不少掮客其实是骗子。2007年底，铁道部政治部主任何宏达被中纪委调查，刘志军担心他交代自己收受10万美元一事，让丁书苗“想办法尽快把何宏达弄出来”；丁书苗经女儿推荐找到号称“有关系”的刘琳，先后付给刘琳等人4400万元。2013年8月法院终审认定，刘琳等人根本不认识、也没有去找所谓司法机关的关系，钱被用于投资、公司经营和个人消费，刘琳等人以诈骗罪被判刑。2008年胶济铁路事故后，刘志军想离开铁道部到地方任职，丁书苗又向自称认识中组部领导秘书的于振永汇款500万元；于振永作证说，“自己根本不认识什么中组部领导的秘书”。这两笔合计4900万元，与法院认定的丁书苗为刘志军行贿的数额相同。十多年后，中央纪委专题片披露了傅政华被骗的经过：北京市公安局退休干部石晓春2018年向他吹嘘有特殊门路，能帮他“搭天线”谋升迁；另一名中专学历的李全自称领导身边的高级智囊，蒙骗他长达约20年，反过来让傅政华在土地开发、经济纠纷诉讼和亲属到银行工作等事上为自己办事。辽宁省原副省长刘国强2021年被开除党籍时，通报也写他盲目听信政治骗子，“花费巨资跑官买官被骗”。'
      cites: [cs5-chinadaily-2013-09-26-ding-4900, cs5-court-2014-12-17-ding-shumiao, b12-chinanews-2023-01-07-bugle-ep1, c03-ccdi-2022-03-31-fu-zhenghua-expel, r04-xhby-2021-01-11-liu-guoqiang-expel]
    - h: 写进通报与党纪
      from: 2021-08
      to: 2026-04
      text: '2021年以后，“结交政治骗子”成为中央纪委通报中的常见用语。本站收录的省部级通报中，除傅政华、刘国强外，2021年至2022年有山西省原副省长刘新云、青海省委原常委李杰翔（写作“结交政治掮客”）和三峡集团原董事长曹广晶；2024年有中石油原副总经理徐文荣、陕西省政协原主席韩勇、工商银行原副行长张红力（写作“结交政治掮客”）、四川省政协原副主席杨克宁、中石油原董事长王宜林等9人；2025年有海南省委原书记罗保铭、广西壮族自治区原主席蓝天立等9人；2026年1月至4月又有吴胜华、高兴夫、刘慧、乌兰。罗保铭的通报写他“长期与政治骗子不正当交往，造成财政资金重大损失和恶劣政治影响”，王宜林则是“长期结交政治骗子并被其利用”。据中国纪检监察报，二十届中央纪委三次全会对严惩政治骗子作出部署，新修订的《中国共产党纪律处分条例》新增第五十五条，对结交政治骗子或者被其利用的党员给予严重警告直至开除党籍处分，充当政治骗子的党员也要处分。澎湃新闻援引的定义是，政治骗子以“提拔重用”“摆案抹案”等政治利益为诱惑；认定干部违纪，要求其有谋取不正当政治利益的动机，并且明知或应当知道对方是政治骗子。2024年12月，四川召开全省严防政治骗子警示教育大会；2026年1月的中央纪委全会工作报告要求“严查买官卖官、跑官要官以及结交政治掮客、政治骗子等行为”。'
      cites: [r05-cctv-2021-08-16-liu-xinyun-expel, r05-ccdi-2022-09-19-li-jiexiang-expel, k04-ccdi-2022-09-29-cao-guangjing-expel, r07-people-2024-01-07-xu-wenrong-expel, k04-ccdi-2024-04-22-han-yong-expel, t02-ccdi-2024-05-09-zhang-hongli-expel, r05-ccdi-2024-05-23-yang-kening-expel, t02-ccdi-2024-06-17-wang-yixin-expel, r07-people-2024-07-07-peng-guofu-expel, t02-ccdi-2024-07-31-wang-yilin-expel, r07-people-2024-07-31-wang-yong-xz-expel, r07-people-2024-10-07-dou-wangui-expel, k03-xinhua-2025-01-24-luo-baoming-expel, r07-people-2025-04-07-li-gang-zzb-expel, r06-xinhua-2025-04-23-lu-kehua-expel, t02-ccdi-2025-04-23-zhang-xiaolian-expel, r07-people-2025-06-20-zhou-jiabin-expel, r07-people-2025-07-30-wang-zhonghe-expel, r07-people-2025-09-28-duan-chenggang-expel, k04-xinhua-2025-12-04-lan-tianli-expel, k06-xinhua-2025-12-05-fei-dongbin-expelled, r06-xinhua-2026-01-07-wu-shenghua-expel, r07-people-2026-02-06-gao-xingfu-expel, k04-xinhua-2026-03-26-liu-hui-expel, k04-xinhua-2026-04-13-wu-lan-expel, cs5-scjc-2024-06-05-swindlers, cs5-cjn-2024-05-24-political-swindlers, cs5-scol-2024-12-20-sichuan-swindlers, b06-xinhua-2026-01-12-li-xi-ccdi-report]
  editor:
    - text: '掮客与派系政治的关系是间接的。媒体把丁书苗列入令计划“西山会”圈子，郭文贵则与马建、张越等安全和政法官员结盟，这些官员在周永康、令计划等案前后相继落马。但官方材料始终把掮客问题归入腐败和“政治生态”，而不是派系斗争：判决写的是行贿、受贿、强迫交易，通报写的是“结交政治骗子”。同时带有团伙定性的只有傅政华，他的通报既写他参加孙力军政治团伙，也写他长期结交多名政治骗子，两者是并列的两项问题，官方并未说政治骗子是团伙的一部分。'
      cites: [f02-hqrw-2015-01-06-xishanhui, f06-rfi-2016-04-17-zhang-yue, f06-court-2018-12-27-ma-jian, c03-ccdi-2022-03-31-fu-zhenghua-expel]
    - text: '掮客能够生存，靠的是干部任用和审批的不透明。升迁取决于少数上级，外人无法判断谁真的“有关系”，真假掮客于是都能出售接近权力的机会；买官者也无从核实，刘志军、傅政华这样的部级官员同样会被骗。官方的诊断也落在用人风气上：秦光荣在忏悔录中说，自己的行为助长了干部找靠山、走捷径的心理，“给云南一些政治骗子、政治掮客创造了生存空间”；中国纪检监察报的评论把根源归于少数领导干部遇事习惯走“特殊门路”，为了提拔重用或逃避追究而热衷旁门左道。2024年的纪律条款因此主要针对需求方：认定干部违纪不看其是否受骗，而看其有无谋取不正当政治利益的动机、是否明知对方是政治骗子。'
      cites: [cs2-ccdi-2020-05-06-su-hongbo, cs5-scjc-2024-06-05-swindlers, cs5-cjn-2024-05-24-political-swindlers, cs5-chinadaily-2013-09-26-ding-4900, b12-chinanews-2023-01-07-bugle-ep1]
    - text: '处理上存在明显的不对称：官员一方的结局写得清楚，掮客一方往往不清楚。丁书苗被判20年，刘琳等人以诈骗罪被判刑；但楼忠福出庭作证后回家，苏荣案的郭某、王某只以代称出现，苏洪波、石晓春、李全的下场在本文所引官方材料中未见交代。党纪条款只能约束党员，对体制外的掮客要靠刑法，四川2024年的警示大会因此要求“各级纪委监委和公安机关要加大对政治骗子的惩治力度”。这类问题也不限于省部级：澎湃新闻列举了湖南省纪委监委驻省委统战部纪检监察组原组长李超“为逃避查处，结交政治骗子，被骗巨额财产”，纪检报道还提到湖南衡阳市农业农村局原局长秦方进为谋求晋升被骗300万元。'
      cites: [cs5-court-2014-12-17-ding-shumiao, cs5-chinadaily-2013-09-26-ding-4900, cs5-bjnews-2016-09-27-lou-zhongfu, b12-xinhua-2015-05-29-su-rong-warning, cs2-ccdi-2020-05-06-su-hongbo, b12-chinanews-2023-01-07-bugle-ep1, cs5-scol-2024-12-20-sichuan-swindlers, cs5-cjn-2024-05-24-political-swindlers, cs5-scjc-2024-06-05-swindlers]
