      text: '搞投机钻营，结交政治骗子或者被政治骗子利用的，给予严重警告或者撤销党内职务处分；情节严重的，给予留党察看或者开除党籍处分。充当政治骗子的，给予撤销党内职务、留党察看或者开除党籍处分。'
