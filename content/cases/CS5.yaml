# CS5 — case articles: local and financial cases, sentencing and brokers
- id: nanchong-sichuan
  title: 南充拉票贿选案与周永康的四川旧部
  kind: case
  years: '1999–2026'
  people: [zhou-yongkang, li-chuncheng, guo-yongxiang, li-chongxi, tan-li, li-chengyun, wei-hong, wang-dongming, liu-qibao, ke-zunping, peng-qinghua, wang-xiaohui, pu-bo, song-chaohua, chen-xi]
  summary: '2011年10月南充市委换届前，仪陇县委书记杨建华用80万元公款送钱拉票，当选市委常委；四川省委后来查明，这次党代会前的干部民主推荐中存在大面积送钱拉票，共涉及477人、1671.9万元，时任市委书记刘宏建因玩忽职守被判3年。此案由2014年中央巡视组发现，2015年9月中共中央专门发出通报。四川官方先把本省问题归于周永康的“恶劣影响”，2019年省委书记彭清华撰文，把南充案与李春城、李崇禧、郭永祥等案并列为政治生态受污染的结果；“肃清流毒”在四川一直持续到2022年。'
  sections:
    - h: 背景：周永康离川之后
      from: 1999-12
      to: 2015-01-29
      text: '周永康1999年12月至2002年11月任四川省委书记。澎湃新闻2014年写道，四川政界普遍认为，在他三年任内，李春城、李崇禧、郭永祥、谭力等人均获得了重用；他离任时说，“无论走到哪里，我都将尽心尽力地关心和支持四川的工作”。这些人十八大后相继落马（详见周永康专题）。2014年7月28日至9月28日，中央第九巡视组巡视四川，10月31日反馈。2015年1月29日四川省委的整改通报提出“三个不可低估”，第一条就是“对周永康给四川政治生态造成的恶劣影响不可低估”，并要求严肃查处“攀附周永康，搞官官勾结、官商勾结、利益输送等严重违纪违法案件”。同一份通报在选人用人部分写道，全省“集中治理拉票贿选，对已经查证属实的4件所涉及的当事人和责任人作出严肃处理”，但没有点出南充的名字。'
      cites: [cs5-bbc-2016-02-04-wei-hong, cs5-thepaper-2014-08-zhou-sichuan, cs5-xinhua-2015-01-30-sichuan-rectify]
    - h: 案情：80万元公款与477名涉案人
      from: 2011-10
      to: 2011-10-19
      text: '据四川省委2015年9月公布的调查结果，2011年10月19日南充市委五届一次全会前，时任仪陇县委书记杨建华用公款80万元，自己出面或安排下属，向一些可能成为市委委员的人送钱拉票，借此当选市委常委。省委顺着这条线索继续调查，查清了这次党代会之前南充市有关干部民主推荐中的送钱拉票问题，以及时任市委书记刘宏建和市纪委、市委组织部相关负责人的失职渎职问题。全案涉及477人：组织送钱拉票的16人，帮助送钱拉票的227人，接受拉票钱款的230人，失职渎职的4人，涉案金额1671.9万元。刘宏建1962年生于四川彭州，航空发动机专业毕业，做过成都市委副书记兼市纪委书记，2007年6月起任南充市委书记。'
      cites: [cs5-people-2015-09-15-nanchong, cs5-thepaper-2015-05-23-liu-hongjian]
    - h: 发现与曝光：巡视、专栏和一份被整肃的报纸
      from: 2014-07
      to: 2015-05
      text: '官方说法是此案由巡视发现。2014年12月25日，四川省委宣布李仲彬接任南充市委书记，刘宏建“另有任用”；2015年3月26日，四川省检察院批捕杨建华。4月12日晚，中央纪委网站刊文称，“山西塌方式腐败、衡阳人大代表贿选案、南充市党代会发生的有组织公款拉票贿选案，都是巡视发现的”，此案才首次出现在官方文字中（另说该文刊发于4月13日，见澎湃新闻）。4月15日，李仲彬在全市会议上承认，“全市政治生态遭到严重破坏”；据《长江商报》报道，《南充日报》4月16日首次提及此案。5月，刘宏建的四川省人大代表资格终止，据《四川日报》，是南充市人大常委会接受了他的辞职，资阳市人大常委会接受的是原资阳市委书记李佳的辞职（另说批准刘宏建辞职的是资阳市人大常委会，见BBC中文网）。湖北《长江商报》5月4日刊发长篇报道后，该报员工向BBC中文网证实，报社因南充贿选案等报道触怒相关省份的宣传部，遭湖北省委宣传部整肃。'
      cites: [cs5-thepaper-2015-05-23-liu-hongjian, cs5-bbc-2015-09-15-nanchong, cs5-people-2015-04-12-inspection-findings, cs5-thepaper-2015-08-14-nanchong-mianyang, cs5-bbc-2015-05-24-changjiang-daily]
    - h: 处理：中央通报与全案判决
      from: 2015-08
      to: 2015-11-17
      text: '《检察日报》2015年8月披露，四川省检察院把“南充贿选案”指定给绵阳市检察院办理。9月15日，四川省领导干部大会在成都召开，省纪委书记王雁飞宣读《中共中央关于四川南充拉票贿选案查处情况及其教训警示的通报》，省委书记王东明称此案是“一宗严重违反党纪国法、严重违反党的政治纪律和政治规矩、严重违反组织人事纪律的恶劣案件”。处理结果是：开除党籍、开除公职并移送司法的33人，撤销党内外职务以上处分的77人，严重警告、免职、警告或记过等处分的267人，诫勉谈话、批评教育的100人；杨建华犯行贿、受贿、滥用职权罪被判有期徒刑20年，刘宏建犯玩忽职守罪被判3年。BBC中文网指出，新华社没有说明两人何时何地被判、是否终审。9月25日，南充市人大常委会原主任高先海因涉此案辞去全国人大代表；11月16日至17日的四川省委十届七次全会确认开除刘宏建党籍。'
      cites: [cs5-thepaper-2015-08-14-nanchong-mianyang, cs5-ccdi-2015-09-15-nanchong-meeting, cs5-people-2015-09-15-nanchong, cs5-bbc-2015-09-15-nanchong, a01-npc-2015-11-04-report, cs5-thepaper-2015-11-17-liu-hongjian-expel]
    - h: 从南充到“肃清”：2016年至2019年的四川
      from: 2016-02
      to: 2019-08
      text: '南充案之后，四川仍在清理旧账。2016年2月，李春城落马后补任省委副书记、随即出任省长的魏宏被降为副厅级非领导职务，通报称他“对抗组织审查，在组织谈话和书面函询时不如实说明问题”，没有提到周永康或南充；BBC注意到他的提拔经历与周永康在川时期重合。2018年中央第四巡视组反馈，四川“彻底肃清周永康恶劣影响、营造风清气正的良好政治生态持续深化不够”，批评省委“满足于对具体人和事的处理”。省委书记彭清华随后归纳了周永康流毒的五种表现：搞团团伙伙、拉帮结派，当“两面人”“两面派”，践踏党管干部原则，搞权钱交易、利益输送，家风败坏。2018年10月，省委出台《关于彻底肃清周永康流毒影响持续净化四川政治生态的决定》，提出5个方面17条措施，要求汲取“李春城、郭永祥、李崇禧、李成云等严重违纪违法案件教训”。同年，2010年至2015年任四川省委组织部常务副部长的蒲波在贵州副省长任上被查，通报称他“利用职务便利违规为他人在干部选拔任用方面提供帮助”。2019年彭清华撰文，第一次把南充案和周永康明确连在一起：“李春城、李崇禧、郭永祥等严重违纪违法和南充拉票贿选案都与政治生态受到严重污染直接相关”。'
      cites: [cs5-bbc-2016-02-04-wei-hong, cs5-scgov-2018-10-26-sichuan-rectify, cs5-sina-2019-07-11-peng-qinghua, cs5-thepaper-2018-10-10-sichuan-decision, t02-ccdi-2018-05-04-pu-bo-probe, t02-ccdi-2018-11-02-pu-bo-expel, cs5-youth-2019-08-02-peng-qinghua]
    - h: 余波：后任市委书记与2022年的总结
      from: 2016-07
      to: 2026-09-22
      text: '此后的南充市委书记中也有人落马。宋朝华2016年7月任南充市委书记，2021年当选四川省人大常委会副主任，2025年4月被查；2026年9月22日，贵阳中院以受贿1.48亿余元判他死缓，认定的受贿期间从1993年延续到2025年，所凭职务包括南充市委书记。2022年8月，时任省委书记王晓晖总结十年，说四川一段时期政治生态遭到严重破坏，要“彻底肃清周永康流毒影响和南充拉票贿选案恶劣影响”，十八大以来全省纪检监察机关查处违反政治纪律3903人。在全国层面，中央纪委向十九大所作的工作报告把此案与衡阳破坏选举案、辽宁拉票贿选案并列，写明“对四川南充拉票贿选案涉及的477人严肃处理”；中组部部长陈希也以“衡阳破坏选举案和南充、辽宁拉票贿选案”作为干部政治能力不足的例证。'
      cites: [r07-wiki-song-chaohua, r07-xinhua-2026-09-22-song-chaohua-verdict, cs5-newssc-2022-08-18-wang-xiaohui, b04-gov-2017-10-29-ccdi-report, b09-xinhua-2017-11-16-chen-xi-article]
  editor:
    - text: '官方叙事对南充案与周永康关系的说法前后有变化。2015年9月的中央通报和四川省委的结论，把责任落在杨建华、刘宏建和市纪委、市委组织部负责人身上，归因于理想信念丧失和管党治党责任缺位，没有提到周永康；把两者明确连在一起的，是2019年彭清华的文章。案发的2011年，周永康离开四川已近十年，时任省委书记是刘奇葆。BBC中文网引湖北消息人士说，刘奇葆当年曾派人调查举报，结论是没有问题，整肃《长江商报》的指示也来自他后来执掌的中宣部；这一说法没有得到官方证实（见“各方说法”）。可以确定的是，公开处理止于市一级：通报追究的最高层级是市委书记，当时省委和省委组织部的监督责任没有公开说法。'
      cites: [cs5-people-2015-09-15-nanchong, cs5-youth-2019-08-02-peng-qinghua, cs5-bbc-2016-02-04-wei-hong, cs5-bbc-2015-05-24-changjiang-daily, cs5-ccdi-2015-09-15-nanchong-meeting]
    - text: '从制度上看，此案暴露的是地方换届中推荐票和选举票的价值。市委委员、常委人选要经过干部民主推荐和全会选举，票数直接决定能否入围，杨建华花钱买的正是这些票；涉案者多达477人，接受拉票钱款的就有230人，说明送钱拉票在当时的南充已成风气，而本应监督的市纪委、市委组织部负责人也在失职渎职名单上。四川省委事后开出的药方之一是“坚决克服唯票倾向”，并在市县换届前严禁拉票贿选、跑官要官。同一时期的衡阳、辽宁两案也都出在选举环节，中央纪委在十九大报告中把三案并列。'
      cites: [cs5-people-2015-09-15-nanchong, cs5-ccdi-2015-09-15-nanchong-meeting, b04-gov-2017-10-29-ccdi-report]
    - text: '处理方式上，此案以党纪为主、刑罚为辅：477人中移送司法的只有33人，其余多为党纪政纪处分和诫勉。中央专门发通报、四川召开全省领导干部大会，把一个市的案件变成全省警示教育的教材，直接服务于随后的市县换届。另一方面，“肃清周永康流毒”在四川至少延续了七年，从2015年的“三个不可低估”到2018年的《决定》和2022年的总结，提法层层加码，但每一次都是在中央巡视反馈之后由省委回应，可见这项政治任务主要靠巡视推动。'
      cites: [cs5-people-2015-09-15-nanchong, cs5-ccdi-2015-09-15-nanchong-meeting, cs5-xinhua-2015-01-30-sichuan-rectify, cs5-scgov-2018-10-26-sichuan-rectify, cs5-newssc-2022-08-18-wang-xiaohui]
  voices:
    - voice: official
      text: '南充拉票贿选案是一宗严重违反党纪国法、严重违反党的政治纪律和政治规矩、严重违反组织人事纪律的恶劣案件，教训极其深刻。'
      cite: cs5-ccdi-2015-09-15-nanchong-meeting
      quote: true
    - voice: official
      text: '近年南充发生的一些腐败案件，特别是南充党代会发生的有组织公款拉票贿选案，全市政治生态遭到严重破坏，代价极其惨痛，教训极其深刻。'
      cite: cs5-thepaper-2015-08-14-nanchong-mianyang
      quote: true
    - voice: official
      text: '周永康离开四川后还直接插手四川事务，把四川搞得乌烟瘴气。'
      cite: cs5-youth-2019-08-02-peng-qinghua
      quote: true
    - voice: zh
      text: '离开四川后，周永康仍葆有对四川的影响。这源于他在四川的一些人事安排。'
      cite: cs5-thepaper-2014-08-zhou-sichuan
      quote: true
    - voice: zh
      text: '据BBC中文网引湖北消息人士（传闻）：南充贿选案发生后不久就有人向四川省委举报，时任省委书记刘奇葆派省委副书记柯尊平和省委组织部长调查，结论是没有问题；整肃《长江商报》的指示来自刘奇葆任部长的中宣部。官方未证实。'
      cite: cs5-bbc-2015-05-24-changjiang-daily
    - voice: zh
      text: '据BBC中文网（传闻）：杨建华以每票20万元的价钱收买投票代表，习近平曾亲自下令调查。官方通报只说他用公款80万元送钱拉票。'
      cite: cs5-bbc-2015-05-24-changjiang-daily
