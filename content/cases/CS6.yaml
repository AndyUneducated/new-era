- id: sentencing-tiers
  title: 数额与刑期：2016年司法解释以后的受贿量刑档次
  kind: system
  years: '2016–2026'
  people: [lai-xiaomin, zhao-liping, bai-enpei, wu-changshun, xing-yun, zhao-zhengyong, zhu-mingguo, li-zhiling, chen-shulong, cao-guangjing, yang-chongyong, tan-ruisong, ji-binchang, zhao-jingwen, zhang-yue, xue-heng, chen-gang-beijing, zhang-jiehui, zhou-bin, zhou-yongkang, luo-baoming, li-gang-zzb, li-shisong, li-wenke, ai-wenli, zhang-xiaopei, qin-guangrong, ren-yuzhong, liu-lixian, li-wei-bj, wang-suyi, qi-pingjing, zhou-zhenhong, liu-tienan, yang-kun, guo-boxiong, fang-fenghui, wei-fenghe, li-shangfu, ling-jihua, sun-zhengcai, fu-zhenghua, sun-lijun, wei-pengyuan, yu-tieyi, zhang-zhongsheng, jiang-renjie, xu-maiyong, jin-xiangjun, li-tongshu, lin-xiong, luo-yinguo, jin-wei, liu-zhihua]
  summary: '2016年4月18日施行的两高司法解释把贪污受贿“数额特别巨大”的起点定为300万元，对应十年以上有期徒刑、无期徒刑或死刑。本站统计此后判决、已有人物卡的360名官员和国企、金融高管（352人有金额）：受贿5000万元以下的139人只有2人判无期以上，1亿至2亿元的87%判无期以上，2亿元以上的全部判无期以上。2022年起同样金额判得更重：1亿元以上的90人中有60人判死缓或更重，此前五年多的28人中只有6人。'
  sections:
    - h: 解释：300万元起算“特别巨大”
      from: 2015-11-01
      to: 2016-04-18
      text: '2015年《刑法修正案（九）》修改了刑法第三百八十三条，贪污受贿罪按“数额较大或者有其他较重情节”“数额巨大或者有其他严重情节”“数额特别巨大或者有其他特别严重情节”分三档处罚，第三档为十年以上有期徒刑或者无期徒刑，数额特别巨大并使国家和人民利益遭受特别重大损失的，处无期徒刑或者死刑；受贿罪依照这一条处罚。2016年4月18日起施行的最高法、最高检《关于办理贪污贿赂刑事案件适用法律若干问题的解释》给出了具体数额：贪污或受贿3万元以上不满20万元为“数额较大”，判三年以下有期徒刑或拘役；20万元以上不满300万元为“数额巨大”，判三年以上十年以下有期徒刑；300万元以上为“数额特别巨大”，“依法判处十年以上有期徒刑、无期徒刑或者死刑”；150万元以上不满300万元并有规定情节的，按“其他特别严重情节”同样处理。第四条规定，数额特别巨大，且犯罪情节特别严重、社会影响特别恶劣、给国家和人民利益造成特别重大损失的，可以判处死刑；符合这些情形、根据情节可判死缓的，法院可以同时决定死缓期满减为无期徒刑后终身监禁。判十年以上有期徒刑或无期徒刑的，应并处50万元以上、犯罪数额二倍以下的罚金或者没收财产。本站收录的省部级落马者受贿额几乎都在300万元以上，也就是落在同一档里；档内从十年有期徒刑到死刑如何选择，由法院根据数额和情节裁量。'
      cites: [cs5-gov-2015-08-30-criminal-law-9, cs6-court-2016-04-19-graft-interpretation]
    - h: 样本与口径
      from: 2016-04-18
      to: 2026-10-12
      text: '本篇的数字由脚本research/scripts/CS6-tiers.ts算出。它读取站内人物卡的落马步骤和content/falls/下的案件记录，解析方式与网站显示一致。样本是判决日期在2016年4月18日以后（含当日）、罪名含受贿或贪污的人；没有写罪名但案件记录载有法院认定金额的也计入，只犯行贿罪的不计。截至2026年10月共360人，以副部级（242人）和正部级（37人）官员为主，也有中管企业、金融机构的高管，以及少数厅局级官员和周滨这样的非官员。刑期取站内记录的判决结果；有23人的判决步骤写作以某罪“决定执行”某刑，网站目前没有把这些步骤读成判决，脚本补读了它们。金额取案件记录中法院认定的数额（350人），没有记录的取判决步骤文字里的数额（2人）；8人在站内没有金额记录，其中郭伯雄、房峰辉、魏凤和、李尚福4名上将由军事法院判决，未公布数额，这8人只计入刑种分布，不进入金额档。刑种分为死刑立即执行、死缓并终身监禁、死缓、无期徒刑和有期徒刑（16年以上、10至15年、10年以下），另有1人判缓刑。对照组是2013年1月1日至2016年4月17日判决的36人。'
      cites: [cs6-court-2016-04-19-graft-interpretation, b07-xinhua-2016-07-25-guo-sentence, c02-court-2019-02-20-fang-fenghui, b08-gov-2026-05-07-wei-li-sentenced]
    - h: 金额档与刑种
      from: 2016-04-18
      to: 2026-10-12
      text: '在有金额的352人中，按法院认定的数额分档：300万元以下6人、300万至1000万元17人，全部判有期徒刑；1000万至3000万元57人，只有赵黎平一人判死刑，他同时犯故意杀人罪；3000万至5000万元59人，只有证监会原处长李志玲一人判无期，她受贿4205万余元；5000万至1亿元95人，25人判无期（26%），17人判16年以上，51人判10至15年，2人判10年以下；1亿至2亿元69人，60人判无期以上（87%），其中20人判死缓以上，判有期徒刑的9人刑期都在15至18年；2亿至5亿元37人全部判无期以上，34人判死缓以上（92%），判无期的只有陈树隆（2.76亿余元）、曹广晶（2.16亿余元）和杨崇勇（2.06亿余元）3人；5亿元以上12人全部判死缓以上，其中赖小民（17.88亿余元）被判死刑，9人判死缓并终身监禁，谭瑞松（6.13亿余元）和汲斌昌（5.26亿余元）判死缓。判有期徒刑者的平均刑期随金额上升：300万元以下5.6年，300万至1000万元10.4年，1000万至3000万元12.8年，3000万至5000万元13.7年，5000万至1亿元14.9年，1亿元以上15.9年。按刑种看金额的中位数：有期10至15年4001万元，有期16年以上5351万元，无期徒刑1.09亿元，死缓2.13亿元，死缓并终身监禁4.49亿元。'
      cites: [t01-chinacourt-2016-11-zhao-liping-verdict, r08-thepaper-2018-09-28-li-zhiling-ruling, t01-court-2019-04-03-chen-shulong-verdict, k04-court-2024-05-24-cao-guangjing-verdict, k04-chinanews-2018-09-27-yang-chongyong-verdict, c03-court-2021-01-05-lai-xiaomin-verdict, t02-xinhua-2026-03-25-tan-ruisong-verdict, r05-chinacourt-2024-12-ji-binchang-verdict]
    - h: 15年的上限与减轻处罚
      from: 2016-06-15
      to: 2026-08-24
      text: '只犯受贿一罪的241人中，判有期徒刑的147人有131人在10至15年之间，站内记录中唯一超过15年的李文科（16年），判决实际认定的是受贿罪和行贿罪，数罪并罚。判16至20年的35人都有两项以上罪名。所以受贿1亿元以上仍判有期徒刑的9人，刑期都在15至18年：赵景文（1.92亿余元，含贪污，18年）、张越（1.57亿余元，15年）、薛恒（1.35亿余元，另有利用影响力受贿，17年）、陈刚（1.29亿余元，15年）、张杰辉（1.27亿余元，15年）、周滨（1.24亿余元，18年）、罗保铭（1.13亿余元，15年）、李刚（1.02亿余元，15年）和李石松（1.00亿余元，15年）。其中只犯受贿罪的6人，判决都认定了重大立功表现，张越、陈刚、罗保铭还有自首情节，法院据此减轻处罚。另一端，受贿300万元以上而判10年以下的单一受贿罪案件有11人，多数是主动投案构成自首：艾文礼受贿6478万余元，携带赃款赃物主动投案，判8年；张晓霈受贿6934万余元，自首并立功，判9年；秦光荣、任羽中、刘立宪分别受贿2389万余元、3195万余元、1776万余元，都构成自首，分别判7年、8年、8年；李伟（北京）受贿3296万余元，有重大立功表现，判9年。'
      cites: [t01-ce-2018-09-13-li-wenke-verdict, r04-xinhua-2021-09-18-zhao-jingwen-verdict, f09-court-2018-07-13-zhang-yue, r05-bjd-2023-12-13-xue-heng-verdict, k04-court-2021-02-05-chen-gang-verdict, r03-court-2020-zhang-jiehui-verdict, b03-court-2016-06-15-zhou-bin, k03-xinhua-2025-12-09-luo-baoming-verdict, r07-people-2025-12-03-li-gang-zzb-verdict, k06-xinhua-2025-11-18-li-shisong-verdict, r04-ce-2019-04-18-ai-wenli-verdict, r05-sina-2024-04-30-zhang-xiaopei-verdict, c03-ccdi-2021-01-19-qin-guangrong-verdict, r08-people-2026-08-24-ren-yuzhong-verdict, t02-court-2024-12-24-liu-lixian-verdict, r04-xinhua-2022-03-18-li-wei-bj-verdict]
    - h: 2022年前后：同样金额，判得更重
      from: 2016-04-18
      to: 2026-10-12
      text: '以2022年1月1日为界分两段看。2016年4月18日至2021年底判决的152人中，受贿1亿元以上的28人，判死缓以上的只有6人：白恩培、武长顺、邢云、赵正永被判死缓并终身监禁，朱明国被判死缓，赖小民被判死刑；另有17人判无期，5人判有期徒刑。2022年起判决的208人中，1亿元以上的90人，判死缓以上的60人，判无期的26人，判有期徒刑的4人。不附加终身监禁的普通死缓，前一段只有朱明国1人，后一段有41人。变化最明显的是1亿至2亿元一档：前一段21人中只有朱明国判死缓，15人判无期；后一段48人中19人判死缓以上，25人判无期。5000万至1亿元一档没有变重：前一段35人中12人判无期，后一段60人中13人。样本中的金额也在上升，各年中位数从2016年的1977万元、2019年的5212万元，升到2022年的7656万元和2025年的9684万元。本文所引判决都没有说明量刑尺度的变化，本站也没有收录这一时期关于受贿量刑的新司法解释。'
      cites: [c03-people-2016-10-09-bai-enpei-verdict, c07-court-2017-05-27-wu-changshun, r04-yicai-2019-12-03-xing-yun-verdict, c03-xinhua-2020-07-31-zhao-zhengyong-verdict, c03-cyol-2016-11-12-zhu-mingguo-verdict, c03-court-2021-01-05-lai-xiaomin-verdict]
    - h: 对照：解释施行以前
      from: '2011'
      to: 2016-04-17
      text: '2013年至2016年4月17日判决、已有人物卡的36人中，受贿一两千万元就判无期或死缓的有好几例：内蒙古统战部原部长王素毅受贿1073万余元，判无期；齐平景受贿1004万余元、贪污60万元，判无期；周镇宏受贿2464万余元，另有3700万余元财产不能说明来源，判死缓；刘铁男受贿3558万余元、杨琨受贿3079万余元，都判无期。2016年4月18日以后的样本里，受贿5000万元以下的139人只有两人判无期以上，即犯故意杀人罪的赵黎平和李志玲。新华社2016年的报道提到，2011年受贿1.0857亿元的姜人杰和受贿1.45亿余元、贪污5300余万元的许迈永同时被执行死刑，这一信号“在当时被许多人理解为贪腐亿元是被判处死刑的参考标准”；2016年以后，样本中因受贿被判死刑并执行的只有受贿17.88亿余元的赖小民。'
      cites: [t01-chinacourt-2014-07-17-wang-suyi-verdict, r01-caixin-2015-02-12-qi-pingjing, r01-people-2014-02-28-zhou-zhenhong-verdict, c03-chinacourt-2014-12-10-liu-tienan-verdict, r01-people-2015-02-05-yang-kun-big5, cs5-xinhua-2016-11-15-life-three, c03-court-2021-01-05-lai-xiaomin-verdict]
    - h: 局限
      from: 2016-04-18
      to: 2026-10-12
      text: '这份统计有几项局限。第一，样本不是全部受贿案件，而是本站已建卡的人，以省部级和中管企业、金融机构高管为主，厅局级及以下的大量案件不在其中，选择上偏向金额大、报道多的案件。第二，金额取案件记录中的数额，一般是法院认定的受贿总额，个别记录并入了贪污额（武长顺的主要数额来自贪污），或者是利用影响力受贿额（周滨的1.24亿余元，他作为周永康受贿共犯另被认定9804.66万元）。第三，数罪并罚案件的刑期包含其他罪名，16年以上的有期徒刑不能单独归因于受贿额。第四，判决日期一般是一审宣判日，少数记录是二审裁定日，如李志玲的2018年9月20日。第五，8人在站内没有金额记录，不进入金额档。第六，本篇只计已建卡的人，所以死缓并终身监禁是25人，比《终身监禁》专题统计的28人少了尚无人物卡的魏鹏远、于铁义、张中生3人。第七，脚本补读的23条“决定执行”步骤，网站页面目前仍不显示为判决，人物页上这些人的刑期可能缺失。'
      cites: [c07-court-2017-05-27-wu-changshun, b03-court-2016-06-15-zhou-bin, r08-thepaper-2018-09-28-li-zhiling-ruling, cs5-xinhua-2016-11-15-life-three]
  editor:
    - text: '解释只划出“300万元以上”一个最高档，从十年有期徒刑到死刑的跨度由法院在档内裁量。站内数据显示，法院的实际做法形成了相当稳定的隐性台阶：5000万元以下几乎都判有期徒刑，1亿元前后进入无期，2亿元以上进入死缓，死缓并终身监禁的中位数在4.5亿元上下。偏离台阶的案件，判决几乎都写明自首、重大立功或受贿未遂。解释第四条把死刑留给数额特别巨大且“犯罪情节特别严重、社会影响特别恶劣、给国家和人民利益造成特别重大损失”的情形；2016年以后，样本中只有赖小民一人因受贿被判死刑并执行。新华社2016年也说，“光考虑涉案金额是不够的，还要考虑犯罪情节”。'
      cites: [cs6-court-2016-04-19-graft-interpretation, c03-court-2021-01-05-lai-xiaomin-verdict, cs5-xinhua-2016-11-15-life-three]
    - text: '量刑与反腐政策的联系，主要体现在“从宽”的制度化上。2019年的艾文礼案被称为监察法实施后首例携带赃款赃物主动到中央纪委国家监委投案的案件，中央纪委通报首次使用了“提出减轻处罚的建议”的表述；2021年被判7年的秦光荣，是中央纪委国家监委发布的第一个投案自首的原省部级一把手。以投案、检举换取减轻处罚，是鼓励主动交代的政策工具；与此同时，2022年以后亿元以上的案件普遍判死缓，对没有投案的巨额受贿者刑罚在加重。政治定性并不直接体现在刑期上：令计划受贿7708万余元，另有非法获取国家秘密罪和滥用职权罪，判无期，在同一金额档中属于较重的四分之一；孙政才受贿1.7亿余元判无期，与同档多数案件一致。孙力军团伙四人被判死缓并终身监禁，其中傅政华受贿1.17亿余元，是这一刑种中金额最低的，他另犯徇私枉法罪。'
      cites: [r04-ce-2019-04-18-ai-wenli-verdict, c03-ccdi-2021-01-19-qin-guangrong-verdict, b07-court-2016-07-04-ling-sentence, b07-xinhua-2018-05-08-sun-sentence, c03-xinhua-2022-09-22-fu-zhenghua-verdict, c03-xinhua-2022-09-23-sun-lijun-verdict]
  voices:
    - voice: doc
      text: '贪污或者受贿数额在三百万元以上的，应当认定为刑法第三百八十三条第一款规定的“数额特别巨大”，依法判处十年以上有期徒刑、无期徒刑或者死刑，并处罚金或者没收财产。'
      cite: cs6-court-2016-04-19-graft-interpretation
      quote: true
    - voice: doc
      text: '贪污、受贿数额特别巨大，犯罪情节特别严重、社会影响特别恶劣、给国家和人民利益造成特别重大损失的，可以判处死刑。'
      cite: cs6-court-2016-04-19-graft-interpretation
      quote: true
    - voice: doc
      text: '犯第一款罪，在提起公诉前如实供述自己罪行、真诚悔罪、积极退赃，避免、减少损害结果的发生，有第一项规定情形的，可以从轻、减轻或者免除处罚；有第二项、第三项规定情形的，可以从轻处罚。'
      cite: cs5-gov-2015-08-30-criminal-law-9
      quote: true
    - voice: official
      text: '但光考虑涉案金额是不够的，还要考虑犯罪情节。'
      cite: cs5-xinhua-2016-11-15-life-three
      quote: true
    - voice: official
      text: '人民法院对艾文礼的依法判处，对腐败分子具有强大震慑和示范效应。'
      cite: r04-ce-2019-04-18-ai-wenli-verdict
      quote: true
