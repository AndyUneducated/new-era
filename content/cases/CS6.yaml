# CS6: case essays, round 13 (Huaxin, Tomorrow Group, Zhejiang Guangsha, sentencing tiers after the 2016 interpretation)

- id: huaxin-ye-jianming
  title: 华信叶简明：从远华旧牌照到国开行48亿美元授信
  kind: case
  years: '2002–2025'
  people: [ye-jianming, wang-sanyun, hu-huaibang, zhao-huan, xi-jinping, li-guangjin, wang-hongyuan, yang-qinglong, he-zhiping, lai-changxing, zeng-decheng]
  summary: '中国华信能源由叶简明2002年创立，靠收购远华案旧资产进入石油业，2014年至2017年连续四年进入《财富》世界500强。官方材料显示，叶简明通过时任安徽省长、后任甘肃省委书记的王三运请托胡怀邦，先后使上海华信入股海南银行、海南华信获得国家开发银行48亿美元授信；王三运、胡怀邦分别被判有期徒刑12年和无期徒刑。叶简明2018年初被调查后，官方没有公布对他的处理结果；华信70家关联企业经实质合并破产清算，程序于2023年2月终结。'
  sections:
    - h: 起家：远华旧资产与“友联会”
      from: '2002'
      to: '2017'
      text: '据BBC中文网综合的公开资料，叶简明1977年出生，2002年25岁时创立中国华信能源有限公司。中国媒体报道称，他进入石油业始于赖昌星远华案的资产拍卖：远华的子公司厦门华航拥有在中国进行石油贸易的牌照，叶简明拍得这部分资产后建立了中国华信；《纽约时报》援引《财富》杂志2016年的采访说，叶简明自称是“靠收购曾经属于赖昌星的石油资产起家”。另说，《联合早报》综合报道称他生于1977年6月5日，大纪元则称他的公开出生日期有1977年2月23日、4月19日、6月5日三个。2009年华信在上海设立总部，2013年在捷克设立欧洲总部。据证券时报，上海华信2014年至2017年连续四年进入《财富》世界500强；能见转述的数据显示，上海华信的营业收入从2009年的3.35亿元增长到2016年的2472.55亿元，七年增长700多倍。叶简明的官方简历写有他曾任中国国际友好联络会副秘书长，《纽约时报》引美国前驻华武官石明凯说，这个机构隶属解放军。外界曾猜测他是“官二代”，他在华信官网发声明否认是叶选宁之子、叶剑英之孙，声明后来被删除。'
      cites: [c04-bbc-2018-03-02-ye-jianming, cs6-nytcn-2018-03-15-cefc, c04-zaobao-2018-03-01-ye-jianming, cs6-epoch-2024-10-22-ye-jianming, cs6-stcn-2025-10-31-cefc-bonds, cs6-jiemian-2018-10-12-li-guangjin]
    - h: 牵线：李光金、王宏源与王三运
      from: '2006'
      to: 2013-05-20
      text: '据BBC中文网转述《财新》，华信在上海成立华信公益基金会，由上海警备区原政委李光金任执行理事长、中央军委办公厅管理局原副局长王宏源任常务理事；李光金为叶简明牵线结识王三运，叶简明还通过王宏源结识了央企珠海振戎公司的杨庆龙。能见转述财新称，李光金2006年起任福建省委常委、省军区政委，2009年5月调任上海警备区政委，次年7月退休；华信进入上海与李光金调沪同步，一位华信早期核心成员说“李光金给了叶简明很多指点”。2011年，陷入困境的安徽华星化工着手重组，叶简明想拿下这个上市公司壳资源。当时负责华信外交的张奇对财新说：“当时上市公司的壳资源，不到副省长级别，谁说了也不算。”得益于李光金介绍他在福建任职时的老同事、时任安徽省长王三运，2011年7月张奇拜访了合肥市主要领导。2013年5月20日，华星化工向上海华信定向增发7.29亿股，上海华信持股60.78%，成为控股股东。重组基本敲定后，王三运于2011年12月调任甘肃省委书记，直到2017年4月。'
      cites: [c04-bbc-2018-03-02-ye-jianming, cs6-jiemian-2018-10-12-li-guangjin]
    - h: 起诉书：海南银行与国开行授信
      from: '2011'
      to: 2018-10-11
      text: '2018年10月11日，郑州中院公开审理王三运受贿案。检察院指控，1993年至2017年，王三运在六盘水市委书记、贵州省委副书记、安徽省长和甘肃省委书记等任上，为相关单位和个人在“入股银行、工程承揽和职务晋升”等事项上提供帮助，收受财物共计6685万余元。界面新闻根据央视播出的庭审画面报道，起诉书列出的第一起就是叶简明：王三运通过时任交通银行董事长胡怀邦，为上海华信入股海南银行提供帮助。海南银行2015年由12家股东出资40.8亿元发起设立，上海华信占股12%，比交通银行还多2个百分点。按叶简明的供述，请托发生在2011年，王三运夫妇向他提出：“王畅两口子（王畅为王三运之子）想在上海买个大点的房子，他们家也没有什么钱，让我在买房和其他方面支持一下。我当时表态一定会支持的。”起诉书的第二项，是王三运再通过已调任国家开发银行董事长的胡怀邦，为海南华信获得国开行48亿美元综合授信提供帮助。能见转述的公开数据显示，海南银行2016年共有四笔重大关联授信，合计6.55亿元，其中给上海华信集团商业保理有限公司4亿元，比另外三家加起来还多。'
      cites: [cs6-court-2018-10-11-wang-sanyun-trial, cs6-jiemian-2018-10-12-ye-hainan-bank, cs6-jiemian-2018-10-12-li-guangjin]
    - h: 《零容忍》：胡怀邦“画圈”
      from: '2014'
      to: 2021-01-07
      text: '中央纪委2022年1月播出的专题片《零容忍》第一集，把胡怀邦案作为金融领域“政治问题与经济问题相交织、金融腐败与金融风险相叠加”的典型。片中说，2014年党中央、国务院启动深化国开行改革，要求聚焦服务国家战略、压减商业性项目，胡怀邦却抢在改革方案印发之前，帮助华信的商业性项目获得巨额授信。叶简明经王三运介绍认识胡怀邦；2015年华信能源申请48亿美元授信时，又请王三运出面。胡怀邦在片中说：“叶简明怕我不同意，所以又找我，叫王三运一起吃饭。我到次年2月份，这个圈就画了。”专题片称王三运和胡怀邦各自收受叶简明数千万元，国开行至今有巨额贷款难以收回。两人的结局不同：王三运2017年7月被查，2019年4月被郑州中院以受贿罪判处有期徒刑12年，法院认定他主动交代办案机关不掌握的受贿事实，系自首，并有重大立功表现；胡怀邦2018年9月卸任国开行董事长，由农业银行原行长赵欢接任，2019年7月被查，2021年1月被承德中院认定受贿8552万余元，判处无期徒刑。'
      cites: [b12-xinhua-2022-01-15-zero-tolerance-ep1, c03-ccdi-2017-07-11-wang-sanyun-probe, c03-gmw-2019-04-12-wang-sanyun-verdict, cs6-jiemian-2018-10-12-li-guangjin, r04-ccdi-2019-07-31-hu-huaibang-probe, k04-xinhua-2021-01-07-hu-huaibang-verdict]
    - h: 海外线：俄油交易与何志平案
      from: '2015'
      to: 2019-03
      text: '华信在海外的扩张更早引起外界注意。2017年9月，华信同意从嘉能可和卡塔尔投资局手中收购俄罗斯国家石油公司14.2%的股权，《纽约时报》说出资约90亿美元，这打破了俄中能源交易限于两国国企的模式；另说，BBC中文网称收购比例为14.16%，合同金额预计约91亿美元。同年11月，华信旗下香港中华能源基金会秘书长、香港民政事务局前局长何志平在美国被捕，被控向乍得、乌干达政要行贿，为华信谋取石油权益；检方说他还建议叶简明向乌干达总统穆塞韦尼提供50万美元政治献金。2018年12月他被纽约南区联邦法院裁定七项罪名成立，2019年3月被判监禁三年。《纽约时报》2018年3月报道，检方在庭审中表示华信和叶简明不是调查目标；华信在2017年9月的文件中披露了约200亿美元债务。叶简明也经营政治形象：据《财富》，他上海办公室的墙上挂着装裱的习近平书法，桌上有一部模仿“红机”的红色电话；2015年起他担任香港新民党主席叶刘淑仪的政治顾问，叶刘淑仪说他“从不参与我们党内的任何政治活动”。'
      cites: [cs6-nytcn-2018-03-15-cefc, c04-bbc-2018-03-02-ye-jianming, cs6-bbc-2019-03-26-patrick-ho, c04-zaobao-2018-03-01-ye-jianming]
    - h: 失踪、违约与破产
      from: 2018-02
      to: 2025-10
      text: '据BBC中文网，叶简明自2018年2月以后下落不明；3月1日《财新》报道他被调查，华信当天声明报道“没有事实依据”。此后官方只在《零容忍》中说他“于2018年涉嫌违法被调查”，没有公布罪名、强制措施或判决。上海华信的债券随即违约：到2019年12月已有13只违约，累计违约金额265.61亿元，违约公告把原因归于控股股东中国华信的“董事会主席不能正常履职”。2019年11月15日，上海三中院受理上海华信破产清算。据上海破产法庭发布的典型案例，华信集团由近两百家关联企业组成，2018年末账面资产约800余亿元、负债1700余亿元；法院分批把70家关联企业纳入实质合并破产清算，香港高等法院2019年12月认可了这一程序；核查确认债权800余笔、1400余亿元，管理人归集可偿债资金75亿余元，2023年2月法院裁定终结程序。另说，《零容忍》2022年称华信旗下“71家公司已经合并破产”；大纪元称上海三中院2020年3月清查的资产为570.6亿元、负债1878.1亿元。上海华信2014年至2017年发行的各类债券共400亿余元，2025年上海金融法院在银行间市场首例虚假陈述案中，判邮储银行、中金公司等五家中介机构在0.5%到5%的范围内承担连带责任，赔偿共1854万元。'
      cites: [cs6-bbc-2019-03-26-patrick-ho, c04-bbc-2018-03-02-ye-jianming, c04-zaobao-2018-03-01-ye-jianming, b12-xinhua-2022-01-15-zero-tolerance-ep1, cs6-nbd-2019-12-09-cefc-bonds, cs6-tahota-2024-04-29-cefc-bankruptcy, cs6-epoch-2024-10-22-ye-jianming, cs6-stcn-2025-10-31-cefc-bonds]
  editor:
    - text: '官方把华信案放在金融反腐的框架里处理：被审判、被公开的是王三运、胡怀邦两名官员，叶简明本人的结局至今没有公布。《零容忍》对胡怀邦的指控重点是“违反党中央重大决策部署”，既抢在国开行改革方案之前批贷，又在2017年全国金融工作会议后不召开党委会传达讲话。海外报道则把华信与军方背景、江泽民和曾庆红一派联系起来，这些说法没有官方材料支持（见“各方说法”）。可以确认的是华信政治资源的结构：退休将领李光金、王宏源介绍关系，地方大员王三运出面请托，国有大行和政策性银行的一把手批准入股和授信。'
      cites: [b12-xinhua-2022-01-15-zero-tolerance-ep1, c04-bbc-2018-03-02-ye-jianming, cs6-nytcn-2018-03-15-cefc, cs6-epoch-2024-10-22-ye-jianming]
    - text: '这条请托链能走通，靠的是信贷和金融牌照的审批高度集中在少数人手里。胡怀邦自述“这个圈就画了”，说明一笔48亿美元的授信可以由一把手推动；民营企业入股地方银行，也需要大股东和主管领导点头。华信的扩张依赖高负债和关联授信：营业收入七年增长700多倍，账面负债却是资产的两倍多。损失最后落在债权人身上：1400余亿元的确认债权，只归集到75亿余元可偿债资金；国开行巨额贷款难以收回，债券投资人只能向中介机构追回一小部分。'
      cites: [b12-xinhua-2022-01-15-zero-tolerance-ep1, cs6-jiemian-2018-10-12-li-guangjin, cs6-tahota-2024-04-29-cefc-bankruptcy, cs6-stcn-2025-10-31-cefc-bonds]
  voices:
    - voice: official
      text: '叶简明怕我不同意，所以又找我，叫王三运一起吃饭。我到次年2月份，这个圈就画了。'
      cite: b12-xinhua-2022-01-15-zero-tolerance-ep1
      quote: true
    - voice: doc
      text: '王畅两口子（王畅为王三运之子）想在上海买个大点的房子，他们家也没有什么钱，让我在买房和其他方面支持一下。我当时表态一定会支持的。'
      cite: cs6-jiemian-2018-10-12-ye-hainan-bank
      quote: true
    - voice: witness
      text: '由于出现关于我个人的不实揣测，特此声明，我并不是叶选宁少将儿子，也不是叶剑英元帅孙子。'
      cite: c04-bbc-2018-03-02-ye-jianming
      quote: true
    - voice: west
      text: '据专家称，他似乎得到了政府的支持，并同一群与中国军方有往来的人建立了联系。'
      cite: cs6-nytcn-2018-03-15-cefc
      quote: true
    - voice: zh
      text: '据大纪元转引《南华早报》（传闻）：叶简明2018年2月16日被带走，调查命令直接由习近平下达；大纪元还称叶简明与江泽民、曾庆红一派关系密切，他的主要关系人王宏源、李光金、胡怀邦、王三运、何志平等都可“直通江、曾”。官方未证实。'
      cite: cs6-epoch-2024-10-22-ye-jianming
  events: [e12-2017-fin-work-conference, e13-2018-wang-sanyun-trial, e13-2019-huaxin-bankruptcy]
  cites: [b12-xinhua-2022-01-15-zero-tolerance-ep1, cs6-court-2018-10-11-wang-sanyun-trial, cs6-jiemian-2018-10-12-ye-hainan-bank, cs6-tahota-2024-04-29-cefc-bankruptcy, c04-bbc-2018-03-02-ye-jianming]

- id: tomorrow-group
  title: 明天系肖建华：金融控股帝国、“白手套”与接管处置
  kind: case
  years: '1999–2025'
  people: [xiao-jianhua, xi-jinping, qi-qiaoqiao, jia-qinglin, zeng-qinghong, zeng-wei, zhang-xinqi, zhou-hongwen, deng-jiagui, jiao-wei, zhou-xuedong, li-zhenxi, liu-jinming, jia-qizhen, xue-jining, zou-wanyin]
  summary: '明天控股由肖建华1999年创办，2004年起以分散股权、层层控股、隐名控股等手段控制新时代信托、包商银行、华夏人寿等多家金融机构。肖建华2017年1月27日在香港四季酒店被带回内地；2019年5月包商银行被接管，2020年7月银保监会接管明天系六家机构。2022年8月上海一中院认定明天控股非法吸收公众存款3116亿余元、向多名国家工作人员行贿6.8亿余元，对明天控股判处罚金550.3亿元，判处肖建华有期徒刑13年。海外媒体称他为高层家族理财的“白手套”，判决没有公开受贿官员的名字。'
  sections:
    - h: 北大学生会主席与明天控股
      from: '1986'
      to: 2017-06
      text: '据BBC中文网，肖建华1971年生于山东肥城一个教师家庭，15岁考入北京大学法律系，18岁任北大学生会主席，27岁任上市公司华资实业总经理，30岁掌控四家上市公司。《纽约时报》2014年的报道讲述了他在1989年天安门广场示威之后作为商人崛起的经历。德国之声称，他1993年创办北大明天资源科技有限公司，1999年创办明天控股有限公司；据《新财富》统计，到2017年6月底，明天系控股、参股44家金融公司，这些金融机构的资产规模高达3万亿元。2016年胡润百富榜上，肖建华和妻子周虹文以400亿元排名第32位。他拥有加拿大国籍和香港永久居民身份。2022年的判决认定，2004年起，明天控股、肖建华违反金融管理法律和监管规定，“采用分散股权、层层控股、隐名控股等手段”，实际控制新时代信托、天安财险、天安金交中心、包商银行、华夏人寿、天安人寿、易安财险等多家金融机构和互联网金融平台。'
      cites: [c04-bbc-2022-08-19-xiao-jianhua, r01-nytcn-2014-06-05-xiao-statement, cs6-dw-2022-08-19-xiao, cs6-chinanews-2022-08-19-xiao-verdict]
    - h: 权贵交易：习家股份、鲁能与“白手套”
      from: '2006'
      to: 2014-06-27
      text: '明天系与高层家族的交集，主要见于海外报道，官方材料没有涉及。2014年6月，《纽约时报》报道，肖建华参与创建的康海天达公司2013年1月出资1500万元，收购了习近平的姐姐齐桥桥和姐夫邓家贵所持建银国际远为基金管理公司的50%股份；肖建华通过女发言人说，习家决意出售股份，“哪怕遭受损失也在所不惜”，是为了尽快处理掉这笔资产。《纽约时报》查阅中文记录后说，2012年至2014年齐桥桥夫妇退出了至少10家公司的投资。法广转述《纽约时报》称，2006年大型国有能源企业鲁能被一组鲜为人知的投资公司收购，记录显示几家涉及交易的公司均属肖建华名下；明天系发表声明，否认“曾先生”介入鲁能重组，法广说根据海外媒体和《财经》等报道，“曾先生”应指曾庆红之子曾伟。德国之声说，《纽约时报》2014年查阅的企业记录显示，肖建华促成的交易对象包括习近平的姐姐和前政治局常委贾庆林的女婿；肖建华被认为曾为某些高层充当投资顾问，这种为权贵转移、隐匿资产的角色被称为“白手套”。'
      cites: [r01-nytcn-2014-06-05-xiao-statement, r01-nytcn-2014-06-18-xi-assets, c09-rfi-2014-06-27-tomorrow-luneng, cs6-dw-2022-08-19-xiao]
    - h: 四季酒店：被带回内地
      from: 2017-01-27
      to: 2022-07-04
      text: '2017年1月27日凌晨，肖建华在香港四季酒店被带走。德国之声引一名与他关系密切的人士对路透社说，他坐在轮椅上，头上蒙着床单或毯子一样的东西；BBC中文网称他此前在这家酒店住了两年多。他的家人向香港当局报失踪，一天后撤回；香港警方说监控录像显示他不是在被胁迫的情况下离开酒店，但拒绝公布录像。肖建华随后在香港报纸头版刊登声明，称自己在国外接受治疗，没有被绑架到大陆。此事引发外界对内地跨境执法、破坏香港“一国两制”的担忧。此后几年没有关于他下落的正式消息，直到2020年明天系证实他在大陆协助政府重组集团。2022年7月4日案件开庭前后，当局没有公布任何信息，消息最先由加拿大驻华使馆披露；加拿大领事官员多次要求旁听被拒。中国外交部说，中国不承认双重国籍，肖建华具有中国国籍，“不享有他国领事保护的权利”。'
      cites: [cs6-dw-2022-08-19-xiao, c04-bbc-2022-08-19-xiao-jianhua]
    - h: 包商银行：1560亿元占款
      from: '2005'
      to: 2021-02-07
      text: '明天系最先暴露的窟窿在包商银行。包商银行接管组组长周学东2020年在《中国金融》撰文说，2017年5月专案组介入明天系案后发现，包商银行自2005年以来仅大股东占款就累计高达1500亿元，每年利息多达百亿元，长期无法还本付息；而2015年包商银行发行二级资本债时，募集说明书写的不良贷款率只有1.60%。包商银行79户机构股东中，明确归属明天集团的35户合计持股89.27%；清产核资显示，2005年至2019年明天系注册209家空壳公司，以347笔借款套取信贷资金，形成占款1560亿元，全部成了不良贷款。李镇西2002年任行长、2008年起任董事长，周学东说，行内董事长“一个人说了算”的局面早已形成。2019年5月24日，人民银行、银保监会联合接管包商银行，委托建设银行托管，由存款保险基金出资保障近500万储户等债权人；2020年4月30日蒙商银行开业，承接包商银行的主要业务，4家区外分行由徽商银行承接。2021年2月7日，北京一中院裁定包商银行破产；此前确认的无争议债权合计2013.98亿元，专项审计显示其净资产为-2055.16亿元。财新称，包商银行是改革开放以来第一家经司法破产程序完成清盘退出的商业银行。'
      cites: [cs6-thepaper-2020-08-03-zhou-xuedong, cs6-bbtnews-2021-03-09-baoshang-bankrupt, cs6-caixin-2025-01-27-li-zhenxi]
    - h: 被“围猎”的官员
      from: '2001'
      to: 2024-01-03
      text: '判决认定，2001年至2021年，明天控股、肖建华为逃避金融监管和谋取其他不正当利益，向多名国家工作人员行贿股份、房产、现金等财物，共计6.8亿余元；受贿人另案处理，判决没有点名。公开材料中能对上的有两类人。一类是地方主政官员。中央纪委2023年1月播出的专题片《永远吹冲锋号》披露，山东省人大常委会原副主任张新起2001年刚任潍坊市长时，在上海认识了明天系实际控制人，回去后17个月就把潍坊银行70%的股权转给明天系；明天系的回报通过他的“白手套”商人焦伟完成，张新起还以焦伟资金困难为由向明天系要了4000万元。张新起在片中说：“有什么事你就帮焦伟就行了，你帮他就是帮我。”2023年2月，南京中院认定他受贿1.55亿余元，判处无期徒刑。另一类是监管官员。周学东写道，从内蒙古银监局原副局长刘金明、贾奇珍等案件发现，部分地方监管高官收受贿赂，还插手包商银行的人事任命和工程承揽。澎湃新闻2024年报道的一份裁定书显示，邹万银2008年至2016年受贿1732万元，其中1710万元来自李镇西，李镇西为谋取全国政协委员等先后6次送他1150万元。刘金明回忆，李镇西对他说：“领导，我们跟随你，你给我们撑住腰，我们在前面冲，等老了我们一块玩。”内蒙古银监局原局长薛纪宁则被李镇西走通“夫人路线”，为包商银行在深圳、成都、北京设立区外分行四处奔走。'
      cites: [cs6-chinanews-2022-08-19-xiao-verdict, b12-chinanews-2023-01-07-bugle-ep1, r05-xinhua-2023-02-20-zhang-xinqi-verdict, cs6-thepaper-2020-08-03-zhou-xuedong, cs6-thepaper-2024-01-03-li-zhenxi]
    - h: 接管、判决与拆分
      from: 2020-07-17
      to: 2025-08-06
      text: '2020年7月17日，银保监会以触发保险法、银行业监督管理法和信托公司管理办法规定的接管条件为由，接管天安财险、华夏人寿、天安人寿、易安财险、新时代信托、新华信托六家机构，期限一年，分别由太保财险、国寿健康、新华人寿、人保财险、中信信托、交银国际信托托管；银保监会答问说，将“优先采取股权重组的方式”化解风险。德国之声称，连同证监会接管的机构，明天系在2020年共有九家公司被接管。2022年7月4日上海一中院公开开庭，8月19日宣判：2010年1月至2017年1月，明天控股、肖建华操控新时代信托、天安财险、天安金交中心向社会公众非法吸收资金3116亿余元；2012年7月至2017年1月，操控包商银行擅自运用客户资金及受托财产1486亿余元；2013年11月至2017年1月，操控华夏人寿、天安人寿、易安财险违法运用保险资金1909亿余元，所得主要用于收购金融机构、证券交易和海外投资。法院以非法吸收公众存款、背信运用受托财产、违法运用资金、单位行贿四罪，对明天控股决定执行罚金550.3亿元，判处肖建华有期徒刑13年、罚金650万元，理由包括自首、认罪认罚、配合追赃挽损和立功表现。四家保险机构的接管延长到2022年7月16日，此后瑞众人寿整体受让华夏人寿，中汇人寿受让天安人寿，新设的申能财险受让天安财险的保险业务，比亚迪受让易安财险全部股份；到2025年8月，华夏人寿、天安人寿、天安财险已被吊销业务许可证。'
      cites: [cs6-people-2020-07-17-takeover, cs6-shgov-2020-07-20-cbirc-qa, cs6-dw-2022-08-19-xiao, cs6-chinanews-2022-08-19-xiao-verdict, cs6-ce-2025-08-06-insurers]
  editor:
    - text: '这个案子的政治性，主要体现在处置方式和保密上，而不在判决文字里。判决只写向“多名国家工作人员”行贿6.8亿余元，没有点名；跨境带人、开庭前后不公布信息、拒绝领事旁听，都说明当局把它当作高度敏感的案件。海外媒体的解释是肖建华掌握领导人家族的财产信息，《纽约时报》说“很少有人比肖建华更了解中国政治领导人家族的财产状况了”；BBC的消息源则称，当局想借此表明不再容忍对领导人家人的贿赂（见“各方说法”）。官方材料中能对上的，只有张新起这样的地方官员和内蒙古的监管官员。从带回到宣判相隔五年多，其间明天系在官方主导下被接管、拆分，判决把“配合追赃挽损”和立功列为从宽理由，对一个非法吸收资金3000亿元以上的案件，13年刑期是在这些从宽情节下作出的。'
      cites: [cs6-chinanews-2022-08-19-xiao-verdict, cs6-dw-2022-08-19-xiao, e06-bbc-2017-02-19-xiao, b12-chinanews-2023-01-07-bugle-ep1, cs6-thepaper-2020-08-03-zhou-xuedong]
    - text: '明天系的手法是监管套利。它用分散股权、层层控股、隐名控股绕开对单一股东持股比例的限制，再让自己控制的银行、保险、信托购买自家设立的虚假融资项目，把储户、投保人和信托投资人的钱转到集团手里。外部约束几乎全部失灵：包商银行公开披露的指标与实际情况相差悬殊，地方监管官员被收买，周学东说“包商银行不是一天被搞垮的，也不是被一个人搞垮的”。处置的路径是国家兜底加市场化重组：存款保险基金保障储户，新设机构承接保单，打破了刚性兑付，也把巨额损失留给了存款保险基金和接手的国有机构。包商银行负债2059.62亿元、资产只剩4.47亿元，这个窟窿最终由公共资金和破产程序消化。'
      cites: [cs6-chinanews-2022-08-19-xiao-verdict, cs6-thepaper-2020-08-03-zhou-xuedong, cs6-bbtnews-2021-03-09-baoshang-bankrupt, cs6-ce-2025-08-06-insurers]
  voices:
    - voice: doc
      text: '明天控股、肖建华具有自首、认罪认罚、配合追赃挽损等情节，肖建华还具有立功表现，依法可以从宽处罚。'
      cite: cs6-chinanews-2022-08-19-xiao-verdict
      quote: true
    - voice: official
      text: '包商银行不是一天被搞垮的，也不是被一个人搞垮的。'
      cite: cs6-thepaper-2020-08-03-zhou-xuedong
      quote: true
    - voice: official
      text: '“明天系”就说，老张你看你需要什么都可以。我说，我什么也不要，我们俩别弄这个事，太危险了。'
      cite: b12-chinanews-2023-01-07-bugle-ep1
      quote: true
    - voice: official
      text: '肖建华具有中国国籍，中方依法对本国公民犯罪行为进行审判，其不享有他国领事保护的权利。'
      cite: c04-bbc-2022-08-19-xiao-jianhua
      quote: true
    - voice: west
      text: '很少有人比肖建华更了解中国政治领导人家族的财产状况了。'
      cite: cs6-dw-2022-08-19-xiao
      quote: true
    - voice: west
      text: '据BBC中文网引大陆消息源（传闻）：肖建华很清楚1月27日会有人来找他，这是此前漫长讨价还价的了结，他同意回大陆协助调查2015年股市风暴中的违规操作；另一消息源称他手里有贿赂中共领导层家人的信息。官方未证实。'
      cite: e06-bbc-2017-02-19-xiao
  events: [e06-2017-xiao-jianhua-taken, r01-2014-xi-relatives-divest, r01-2007-luneng-privatisation, e13-2019-baoshang-takeover, e13-2020-mengshang-bank-opens, e13-2020-tomorrow-six-takeover, e13-2021-baoshang-bankrupt, e13-2022-xiao-jianhua-verdict]
  cites: [cs6-chinanews-2022-08-19-xiao-verdict, cs6-thepaper-2020-08-03-zhou-xuedong, cs6-people-2020-07-17-takeover, cs6-dw-2022-08-19-xiao, c04-bbc-2022-08-19-xiao-jianhua]

- id: zhejiang-guangsha
  title: 浙江广厦：楼忠福、斯鑫良与令家
  kind: case
  years: '1983–2023'
  people: [si-xinliang, ling-jihua, gu-liping, ling-wancheng, li-chuncheng, lou-zhongfu, cui-xiaoyu, lou-ming, lou-jiangyue, si-li, jin-huifang, wu-ying, wu-yongzheng, lou-zhonghua, wu-jian]
  summary: '广厦集团创始人楼忠福是浙江东阳的建筑商，连任两届东阳市人大常委会副主任。他与同乡、任浙江省委组织部长8年多的斯鑫良交往多年，又通过合办公司“赞助”令计划之妻谷丽萍。2014年12月27日楼忠福被中纪委带走，两个月后斯鑫良被查；2016年法院认定令计划收受楼忠福财物1465万余元，斯鑫良受贿1955万余元被判13年，楼忠福出庭作证后回家，本文所引材料未见他被起诉。此后广厦债务缠身，2021年失去上市公司东望时代的控制权。'
  sections:
    - h: 东阳建筑商与“抓政治”
      from: '1990'
      to: 2014-10
      text: '《中国经济周刊》2015年7月的封面报道《楼忠福的红与黑》称，楼忠福在30年里织就了庞大的政商关系网，政界资源由东阳而金华、由金华而浙江，再延至省外，直到攀上令氏家族。中国青年报的评论概括说，他曾把“抓机遇就是抓政治”作为成功哲学，也曾聚拢一些走出体制的官员。楼忠福连续担任十一届、十二届东阳市人大常委会副主任，卸任后，其子以广厦集团董事局主席的身份当选东阳市人大常委会委员。《中国经济周刊》引述的东阳人士说，在东阳土地招拍挂中，楼忠福看中的地块很少有人敢去竞拍；上世纪90年代，在一位被他认作“干爹”的人担任金华市主要领导期间，他与东阳当时的一位主要领导结怨，后者不久被调离东阳；他还结交了一位浙江省政法系统的主要领导，这在一定程度上助长了其弟楼忠华在金华的势力。这些说法都来自匿名受访者。2014年10月，楼忠福出版《我要富过四代：楼忠福内部讲话》，宣讲时说：“我要富过四代，这句话在中国谁敢说，只有我敢。”'
      cites: [cs6-chinanews-2015-07-28-lou-zhongfu, cs6-cyol-2015-07-30-lou-comment, cs5-bjnews-2016-09-27-lou-zhongfu]
    - h: 同乡斯鑫良：从东阳到省委组织部
      from: 1983-11
      to: 2013-02
      text: '斯鑫良也出身东阳，仕途分四段：1983年11月任东阳县副县长，升至东阳市（县）委副书记，1989年11月调任同属金华的浦江县委书记；1992年6月起在湖州任市委常委、组织部长，直至市委书记、市人大常委会主任；短暂任省委宣传部长后，2001年6月任浙江省委组织部长，任期8年多，2009年12月免职；2010年1月任省政协副主席，2013年2月届龄退休。据广厦集团官网，2002年时任省委组织部长的斯鑫良考察了广厦重点开发的天都城项目，并给予肯定；2001年广厦与团省委合作组建浙江青年信息传播有限公司，共同主办《青年时报》，楼忠福之子楼明后来任浙江省青年联合会副主席。《中国经济周刊》引东阳一位企业家说，同样来自东阳的斯鑫良是楼忠福在浙江官场上最亲密的朋友，在斯鑫良仕途的巅峰时期，楼忠福通过他巩固了楼家在东阳的权和势。东阳一位建筑公司负责人对无界新闻说：“楼忠福出事后，斯鑫良就知道自己跑不掉了，他们一条裤子很多年了。”'
      cites: [cs6-thepaper-2015-02-16-si-xinliang, cs6-thepaper-2015-02-16-si-li, cs6-chinanews-2015-07-28-lou-zhongfu, cs6-sohu-2015-07-14-lou-sponsor]
    - h: 中青红舰：给谷丽萍的“赞助”
      from: 2002-07
      to: 2016-07-04
      text: '楼忠福与令家的交集，最清楚的是一家公司。澎湃新闻查阅的工商资料显示：2002年7月，北京中青红舰网络技术有限公司成立，谷丽萍任法定代表人，同样由她任法定代表人的中青红舰科技以18万元出资占股60%；2005年10月，楼忠福受让两家公司的出资额并投入988万元，以共计1000万元出资入股，却与只出资18万元的中青红舰科技按6比4分红；2007年5月，中青红舰科技把18万元出资额转给北京强势合力国际会展有限公司，该公司法定代表人郭磊与令计划之弟令完成曾在新华社共事，其所属机构的多家子公司由令计划的嫂子孙淑敏、侄子令狐剑参股创办；2009年10月公司注销，强势合力分得剩余资产204万元，是出资额的11倍多。另说，《中国经济周刊》称这家公司是2002年由楼忠福与强势合力合资成立的，2007年注销。楼忠福曾对媒体说，这一合作实质是“赞助”谷丽萍的基金会、支持青年人创业，他只出钱，不过问业务。《中国经济周刊》还说，谷丽萍担任要职的瀛公益基金会和中国青年创业国际计划成立时，楼忠福都进行了巨额捐助。无界新闻引知情人士说，这种类似“政治献金”的捐助，起因是楼忠福2001年办《青年时报》时遭到主管部门刁难，捐助其实是到北京买一张入行许可证。2016年7月4日，天津一中院判决认定，令计划承诺为楼忠福及其子谋取利益，单独或与谷丽萍共同索取、收受楼忠福财物1465万余元，在七名行贿人中数额最大；楼忠福出庭当庭指证。'
      cites: [cs6-thepaper-2015-01-01-lou-taken, cs6-chinanews-2015-07-28-lou-zhongfu, cs6-sohu-2015-07-14-lou-sponsor, b07-court-2016-07-04-ling-sentence, cs5-bjnews-2016-09-27-lou-zhongfu]
    - h: 落马顺序：楼忠福、斯力、斯鑫良
      from: 2014-11
      to: 2016-12-13
      text: '2014年11月，中央第五巡视组向浙江反馈，指出一些领导干部插手土地出让、工程建设、房地产开发问题反映集中，领导干部“一家两制”、利益输送出现新的表现形式。12月22日令计划被宣布调查。据《中国经济周刊》引目击者，12月27日中午，楼忠福乘坐的广州飞杭州航班在萧山机场落地，他在廊桥下被带走。另说，澎湃新闻转述腾讯财经援引的权威人士、BBC中文网援引的报道称，他是从澳大利亚过完圣诞节回国时，在广州白云机场被中纪委直接带走的。广厦集团一位高管当时对澎湃新闻称这是“谣言”。2015年2月16日，中央纪委通报斯鑫良接受组织调查；据澎湃新闻，其子、团省委常委兼组织部长斯力此前也被带走。另说，无界新闻称斯力当时挂职杭州市上城区副区长，与父亲同时被带走。《中国经济周刊》引东阳一位企业家说，“斯鑫良确由楼忠福供出”。6月，斯鑫良被开除党籍，通报说他在得知组织调查其问题线索后，与妻子及部分行贿人订立攻守同盟，转移赃款赃物。2016年12月13日，九江中院认定他2001年至2014年在湖州市委书记、省委组织部长、省政协副主席任上，为相关单位和个人在房地产开发、企业经营、职务提拔等事项上提供帮助，直接或通过其妻金惠芳收受财物1955.442万元，以受贿罪判处有期徒刑13年；财新报道，起诉书涉及14家单位或个人。判决和通报都没有写出行贿人的名字。楼忠福则在2016年9月回到家中，其子楼明向媒体证实了这一点。'
      cites: [cs6-thepaper-2015-02-16-si-xinliang, cs5-bjnews-2016-09-27-lou-zhongfu, cs6-chinanews-2015-07-28-lou-zhongfu, cs6-thepaper-2015-01-01-lou-taken, cs6-bbc-2015-01-01-lou-zhongfu, t01-ccdi-2015-02-16-si-xinliang-probe, cs6-thepaper-2015-02-16-si-li, cs6-sohu-2015-07-14-lou-sponsor, r02-ccdi-2015-06-19-si-xinliang-expel, t01-ccdi-2016-12-13-si-xinliang-verdict, cs6-caixin-2016-08-18-si-trial]
    - h: 东阳与义乌的争议：吴英、江南生态园与吴坚
      from: '2006'
      to: 2015-07
      text: '楼家在东阳、义乌的势力，主要见于媒体引述的指控和传闻，官方材料没有涉及。吴英之父吴永正公开指称，楼忠福之弟楼忠华是东阳最大的黑恶势力，背后有楼忠福庇护；他说楼忠华曾暗示吴英上交2000万元保护费，并介入吴英案的资产拍卖，本色集团旗下的本色酒店被楼忠华以450万元拍下，转手以780万元卖出。广厦集团随即声明，广厦及楼忠福家族与吴英案无任何牵扯，并保留追究吴永正“炮制谣言、恶意中伤”的法律责任。中国青年报的评论引中新网说，另一个传闻是斯鑫良深度介入吴英案，纵容楼家低价鲸吞吴英资产（见“各方说法”）。在义乌，据无界新闻，江南生态园的配套地块2011年1月以11.5亿元底价挂牌出让，条件之一是摘牌企业必须与义乌市政府签有生态园开发经营合同，3月1日广厦建设集团以39亿元摘牌；义乌一家房地产公司负责人说：“谁都知道这块地就是给广厦的，这地就是人家圈走的。”义乌商人吴坚是广厦2006年至2007年资金荒中的债权人，曾到银行系统举报、向媒体曝光，给广厦施压；2010年2月8日，他被杭州市公安局西湖分局以涉嫌诈骗刑拘，2011年底被判刑9年6个月，债权官司随之中止。'
      cites: [cs6-chinanews-2015-07-28-lou-zhongfu, cs6-cyol-2015-07-30-lou-comment, cs6-sohu-2015-07-14-lou-sponsor]
    - h: 之后的广厦
      from: 2016-09
      to: 2023-12-07
      text: '楼忠福2016年9月回家后，本文所引材料中未见他被起诉。广厦随后陷入债务危机。第一财经2023年报道，广厦控股因债务逾期，质押的东望时代股份被东阳金投申请冻结并司法拍卖，东阳金投以5.47亿元拍得，于2021年6月成为东望时代的实际控制人，广厦控股退为第二大股东，持股降至21.93%；第三方信息显示，广厦控股累计被司法执行802次，历史被执行金额49.6亿元。东阳国资的介入使广厦的债务危机有所缓解。2023年12月，浙江证监局认定广厦控股及其一致行动人未及时披露放弃东望时代表决权和股份被法院裁定转移的权益变动，对广厦控股、广厦建设、广厦投资和楼江跃、楼忠福、楼明分别出具警示函。'
      cites: [cs5-bjnews-2016-09-27-lou-zhongfu, cs6-yicai-2023-05-24-guangsha-debt, cs6-csrc-2023-12-07-guangsha-warning]
  editor:
    - text: '广厦案在官方叙事里是令计划案的外围。判决把楼忠福写成令计划案的行贿人和证人：令计划为楼忠福及其子谋利，楼忠福出庭指证；斯鑫良的判决只写受贿，没有提到令计划或楼忠福。把楼、斯、令三者连起来的是《中国经济周刊》、澎湃新闻等媒体的报道，其中不少关键说法来自匿名的东阳人士。浙江省委主要领导在一次讲话中称斯鑫良为“独狼”，说明官方倾向于把此案说成个人问题，而不是牵连浙江组织系统的窝案。楼忠福作证后回家，与行贿人配合调查、换取宽大的常见处理一致；中国青年报的评论说，商人身陷囹圄时“多会和盘供出所行贿的官员”，斯鑫良就是在楼忠福被抓后落马的。'
      cites: [b07-court-2016-07-04-ling-sentence, t01-ccdi-2016-12-13-si-xinliang-verdict, cs6-chinanews-2015-07-28-lou-zhongfu, cs6-sohu-2015-07-14-lou-sponsor, cs6-cyol-2015-07-30-lou-comment, cs5-bjnews-2016-09-27-lou-zhongfu]
    - text: '这是县域政商一体的典型：企业家兼任市人大常委会副主任，企业与团省委合办报纸，土地可以通过附加条件定向出让给特定企业，一名省委组织部长掌握干部任免八年多。中央巡视组2014年反馈的“插手土地出让、工程建设、房地产开发”，与斯鑫良判决认定的“房地产开发、企业经营、职务提拔”等受贿事项基本吻合。斯鑫良案发后，一些经他提拔的干部担心受牵连。企业失去政治靠山后，地方国资从庇护者变成纾困者，以司法拍卖的方式接手了广厦控制的上市公司。'
      cites: [cs6-chinanews-2015-07-28-lou-zhongfu, cs6-sohu-2015-07-14-lou-sponsor, cs6-thepaper-2015-02-16-si-xinliang, t01-ccdi-2016-12-13-si-xinliang-verdict, cs6-yicai-2023-05-24-guangsha-debt]
  voices:
    - voice: witness
      text: '我要富过四代，这句话在中国谁敢说，只有我敢。'
      cite: cs5-bjnews-2016-09-27-lou-zhongfu
      quote: true
    - voice: zh
      text: '楼忠福出事后，斯鑫良就知道自己跑不掉了，他们一条裤子很多年了。'
      cite: cs6-sohu-2015-07-14-lou-sponsor
      quote: true
    - voice: official
      text: '在得知组织对其有关问题线索进行调查后，与其妻及部分行贿人订立攻守同盟，转移赃款赃物，干扰、妨碍组织审查'
      cite: r02-ccdi-2015-06-19-si-xinliang-expel
      quote: true
    - voice: zh
      text: '利益结盟并不会带来什么牢固的联盟关系，当商人身陷囹圄时，反噬就出现了。'
      cite: cs6-cyol-2015-07-30-lou-comment
      quote: true
    - voice: zh
      text: '据中国青年报评论转引中新网（传闻）：斯鑫良深度介入吴英案，纵容楼家低价鲸吞吴英资产。官方未证实。'
      cite: cs6-cyol-2015-07-30-lou-comment
    - voice: zh
      text: '据无界新闻（传闻）：义乌商界流传，江南生态园配套地块定向挂牌给广厦后，有一笔20余亿元的钱款从义乌返给广厦；当地一名房地产界人士称这是楼忠福“空手套白狼”，巨额资金可能辗转流向北京。无界新闻说这一指认没有证据，官方未证实。'
      cite: cs6-sohu-2015-07-14-lou-sponsor
  events: [e03-2014-ling-jihua-investigated, e13-2014-lou-zhongfu-taken, e13-2016-si-xinliang-verdict]
