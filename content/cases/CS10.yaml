    - h: 纪检“灯下黑”
      from: 2013-12
      to: 2026-10-08
      text: '十八大后，纪检系统最早出事的是省纪委的一把手和二把手。山西省委副书记、原省纪委书记金道铭2014年2月被查，2016年被判无期徒刑，法院认定他收受的财物中有为人在“纪检调查”等事项上谋利所得；同年7月，他的副手、省纪委常务副书记杨森林被查。广东省政协主席朱明国当过重庆市公安局长和广东省纪委书记，2014年11月被查，2016年被判死缓。广东省纪委副书记、监察厅长钟世坚2015年4月被查，通报称他“干预案件查处，违反保密纪律，向被审查人泄露案情”，澎湃新闻称他是纪检系统“内鬼”的典型。中央纪委派驻机构2017年集中出事：驻交通运输部纪检组原组长李建波被严重警告、责令辞去中央纪委委员，2026年7月又被立案；驻民政部纪检组原组长曲淑辉因驻在部门所辖单位系统性腐败失职失责，降为正处级；驻财政部纪检组组长莫建成8月被查，2019年被判14年。此后有驻国家烟草专卖局纪检组原组长潘家华（“靠烟吃烟”，判11年）、驻中央组织部纪检监察组组长李刚（2024年9月在任上被查，2025年以受贿1.02亿余元判15年）、驻证监会纪检监察组原组长王会民（2025年被查，被指“执纪违纪，执法犯法”）。地方纪委中，吉林省纪委副书记邱大明被指“泄露中央巡视移交线索处置情况”，判14年；哈尔滨市纪委书记近十年的姜国文、辽宁省纪委原副书记郝宏军都被判无期徒刑；南京市纪委原书记龙翔被法院认定在处置违纪违法问题线索时包庇他人不被查处，2026年8月被判死缓；郴州市纪委原书记李超为逃避查处结交政治骗子，反被骗走巨额财产。官方给过三组数字。十八届中央纪委的工作报告说：“十八大以来，中央纪委机关立案查处22人，组织调整24人，谈话函询232人；全国纪检系统处分1万余人，组织处理7600余人，谈话函询1.1万人。”十九届的报告说：“五年来，全国谈话函询纪检监察干部4.3万人，组织处理721人，处分1.6万人，移送检察机关620人。”二十大后，2023年2月全国纪检监察干部队伍教育整顿启动，李希要求坚决查处“两面人”、坚决防治“灯下黑”，“严肃认真坚决清理门户”；当年立案纪检监察干部8977人、处分7817人，2024年立案3375人、处分3917人，2025年“全系统立案4119人、留置313人”。本站的56人中，十八届任内首次被查16人，十九届9人，二十大以后31人。'
      cites: [t01-chinanews-2016-10-14-jin-daoming-verdict, r01-ccdi-2014-07-23-yang-senlin-probe, r01-hkcd-2014-09-03-shanxi, c03-ccdi-2014-11-28-zhu-mingguo-probe, c03-cyol-2016-11-12-zhu-mingguo-verdict, r02-people-2015-07-21-zhong-shijian-expel, r02-thepaper-2018-06-zhong-shijian-verdict, r03-ccdi-2017-01-08-ccdi-7th-plenum, r07-people-2026-07-10-li-jianbo-probe, r03-ccdi-2017-06-20-qu-shuhui, c08-cnr-2017-08-27-mo-jiancheng-probe, c08-court-2019-01-23-mo-jiancheng-verdict, r07-xinhua-2021-11-13-pan-jiahua-expel, r07-people-2024-09-30-li-gang-zzb-probe, r07-people-2025-12-03-li-gang-zzb-verdict, r07-people-2025-11-24-wang-huimin-expel, r04-people-2018-12-20-qiu-daming-expel, r04-court-2019-11-05-qiu-daming-verdict, r04-xinhua-2023-08-29-jiang-guowen-verdict, r05-chinacourt-2024-12-hao-hongjun-verdict, r08-people-2026-08-11-long-xiang-verdict, c12-xinhua-2024-02-04-li-chao-hunan, b04-gov-2017-10-29-ccdi-report, b05-saac-2022-10-ccdi-report, cs10-xinhua-2023-02-24-ccdi-rectification, cs10-xinhua-2024-01-25-ccdi-cadres-2023, cs10-people-2025-01-22-ccdi-cadres-2024, b06-xinhua-2026-01-12-li-xi-ccdi-report]
    - h: 纪检干部的案情：泄密、包庇和退休后
      from: 2015-04-01
      to: 2026-10-08
      text: '纪检干部的通报和判决里，有几类别的系统没有的问题。一是向被查对象泄密：钟世坚“向被审查人泄露案情”，邱大明泄露中央巡视移交线索的处置情况，并“违规干预、插手违纪违法案件查处并跑风漏气”。二是包庇：龙翔的判决单列滥用职权罪，认定他2009年至2016年处置线索时包庇他人。三是把监督权当生意：陈玉祥被指“干预和插手司法及执纪执法活动”，判12年；贵州省纪委原副书记张平被法院认定在案件处理等事项上为人谋利，受贿4772万余元，判13年。四是退休以后：许传智2023年退休，2025年10月被查，法院认定他在职时受贿1072万余元，退休后又利用原任中央巡视组副部级巡视专员的影响受贿2587万余元，2026年10月8日被判12年；工商银行原纪委书记刘立宪2022年8月自动投案，开除通报称他“执纪违纪，执法犯法，严重损害纪检监察干部形象”，2024年被判8年；央企纪检组长龙飞、杨宏勇也先后被查，杨宏勇是2026年1月主动投案。本站在当事人自己的通报和判决里检索到“执纪违纪”的18人是：钟世坚、张化为、邱大明、姜国文、郝宏军、潘家华、周清玉、陈玉祥、许传智、王会民、李建波、张平、龙飞、杨宏勇、张孝礼、商黎光、刘立宪、李超。'
      cites: [r02-people-2015-07-21-zhong-shijian-expel, r04-people-2018-12-20-qiu-daming-expel, r08-people-2026-08-11-long-xiang-verdict, r07-ccdi-2024-06-17-chen-yuxiang-expel, r07-court-2025-05-20-chen-yuxiang-verdict, r08-people-2025-06-30-zhang-ping-gz-verdict, r07-people-2025-10-14-xu-chuanzhi-probe, r07-people-2026-10-08-xu-chuanzhi-verdict, t02-ccdi-2024-01-19-liu-lixian-expel, t02-court-2024-12-24-liu-lixian-verdict, r08-people-2024-02-05-long-fei-probe, r08-people-2026-01-24-yang-hongyong-probe]
    - h: 与孙力军、周永康两个专题的分工
      from: 2013-12-01
      to: 2023-01-10
      text: '本站42名政法副部级以上落马者中，孙力军、傅政华、王立科、刘新云、龚道安、邓恢林、刘彦平7人属于官方认定的孙力军政治团伙，周永康本人及其政法旧部另见周永康专题，两案的组织关系、案情和审判在各自专题里写。本文只用他们的数字：孙力军案7人全部已判，其中5人无期以上；死缓并终身监禁的7名政法高官中，4人出自这一案。2022年5月中央政法委部署巩固教育整顿成果，仍写“坚决肃清孙力军政治团伙等流毒影响”，可见教育整顿和孙力军案在官方叙述里是绑在一起的。'
      cites: [c03-xinhua-2023-01-10-liu-yanping-verdict, c03-xinhua-2022-09-22-fu-zhenghua-verdict, c03-xinhua-2022-09-22-wang-like-verdict, cs10-chinapeace-2022-05-05-rectification-2022]
  editor:
    - text: '编者分析：政法高官判得重，一部分是孙力军案拉高的。42人中已判33人，无期以上17人，约52%；去掉孙力军案的7人，其余26名已判者中无期以上12人，约46%，仍高于其他系统同级的约39%。另一部分是金额：李文喜5.4亿余元、王大伟5.55亿余元、刘跃进1.21亿余元，都远超判无期的一般数额。本站没有按金额配对比较政法与非政法官员的刑期，所以不能说法院对政法官员额外从重，只能说政法高官的受贿额和政治定性都偏重。'
      cites: [r05-chinanews-2023-01-06-li-wenxi-verdict, t02-people-2024-10-14-wang-dawei-verdict, t02-court-2025-06-23-liu-yuejin-verdict]
    - text: '编者分析：教育整顿的大数字要按形态读。处理处分的178431人中83%是第一种形态，也就是谈话提醒、批评教育、诫勉之类；移送司法、判处刑罚的第四种形态1985人，占1.1%。19847人“主动投案”是在“自查从宽、被查从严”政策下发生的，包括交代轻微问题的人。厅局级只有195人，第一批本来只到市县两级，省部级的清理要看第二批和中央纪委的立案。按首次落马年份，政法副部级以上2020年4人、2021年6人、2022年5人，整顿当年并没有比前后两年多出很多，可见对高层的清理更多靠孙力军案的牵连，而不是整顿本身。'
      cites: [cs10-chinapeace-2021-08-30-rectification-presser, cs10-gmw-2021-08-19-second-batch]
    - text: '编者分析：纪检落马者在二十大以后明显增多，56人中有31人，原因至少有三：2023年起的纪检监察干部队伍教育整顿；军队纪检系统的将领，56人中有6人，其中5人是2025—2026年被查或下落不明的；还有一批退休多年后才被查的人，如许传智退休两年，王会民退休六年，李建波距2017年第一次受处分九年。官方的立案数也显示教育整顿当年是高峰：2023年立案8977人，2024年3375人，2025年4119人。'
      cites: [cs10-xinhua-2024-01-25-ccdi-cadres-2023, cs10-people-2025-01-22-ccdi-cadres-2024, b06-xinhua-2026-01-12-li-xi-ccdi-report, r07-people-2025-03-21-wang-huimin-probe, r07-people-2026-07-10-li-jianbo-probe]
  voices:
    - { voice: official, text: 刮骨疗毒式的自我革命、激浊扬清式的“延安整风”、铸魂扬威式的主题教育, cite: cs10-chinapeace-2021-08-30-rectification-presser, quote: true }
    - { voice: official, text: 坚决肃清孙力军政治团伙等流毒影响, cite: cs10-chinapeace-2022-05-05-rectification-2022, quote: true }
    - { voice: official, text: 五年来，全国谈话函询纪检监察干部4.3万人，组织处理721人，处分1.6万人，移送检察机关620人。, cite: b05-saac-2022-10-ccdi-report, quote: true }
    - { voice: zh, text: 说到纪检系统影响恶劣的“内鬼”，广东省纪委原副书记、监察厅原厅长钟世坚无疑是其中的典型。, cite: r02-thepaper-2018-06-zhong-shijian-verdict, quote: true }
    - { voice: zh, text: 由这起案件，可以说明习的“反腐”为什么要刀把子向内，指向政法队伍自身。, cite: f03-dw-2022-01-18-deng-yuwen, quote: true }
    - { voice: scholar, text: 随着政法系统整顿，以及公安部原副部长孙力军政治团伙案相继告一段落，中共领导层下一阶段也将更大程度依赖忠诚度得到提高的“刀把子”。, cite: b16-zaobao-2022-10-30-chen-stability, quote: true }
