    - h: 2009–2017年：从文强到赵黎平
      from: 2009-08
      to: 2017-05-26
      text: '十八大前后几起最极端的案子都出在公安。2009年重庆“打黑”中落马的市司法局长、原市公安局副局长文强，2010年4月被重庆五中院以受贿，包庇、纵容黑社会性质组织，巨额财产来源不明和强奸罪判处死刑，7月7日被执行。2012年2月，重庆副市长兼公安局长王立军进入美国驻成都总领事馆，9月被成都中院以徇私枉法、滥用职权、叛逃和受贿罪判处15年；他指派负责尼尔·伍德死亡案的副局长郭维国，8月被合肥中院以徇私枉法罪判处11年，法院认定郭维国等人为使薄谷开来不受追诉而伪造、隐匿、毁灭证据。2013年2月，山西省公安厅副厅长兼太原市公安局长李亚力因处理其子违章驾车、妨碍交警执行公务时滥用职权被留党察看，次年以受贿罪被捕。2014年7月，执掌天津市公安局多年的武长顺被查，2017年5月被郑州中院以贪污、受贿、挪用公款、单位行贿、滥用职权、徇私枉法六罪判处死缓并终身监禁。最高人民法院副院长奚晓明2015年7月被查，2017年被判无期徒刑；当过湖南省公安厅长、中央政法委秘书长的周本顺同年7月被查，2017年被判15年。最极端的是内蒙古自治区公安厅原厅长、政协副主席赵黎平：2015年3月20日他在赤峰持枪杀人，开除通报称他“知纪违纪，执法犯法，性质恶劣、情节严重，社会影响极坏”；2016年11月，太原中院以故意杀人、受贿、非法持有枪支弹药和非法储存爆炸物罪判他死刑，法院认定他在公安厅长任上受贿2368万元，2017年5月26日被执行死刑。政法系统最高层的周永康2014年7月被立案、2015年被判无期徒刑，另有专题。'
