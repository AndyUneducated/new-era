# CS10 — insiders-law-enforcement (fallen officials of the political-legal and discipline systems themselves) and central-inspection (the central inspection system since 2013, how its findings map onto later falls, and inspectors who fell)
- id: insiders-law-enforcement
  title: “内鬼”与执法犯法：政法和纪检系统自己的人
  kind: system
  years: '2009–2026'
  people: [zhao-liping, wen-qiang, wang-lijun, guo-weiguo, li-yali, wu-changshun, xi-xiaoming, zhou-benshun, wang-like, liu-xinyun, gan-rongkun, meng-yongshan, meng-xiang, yang-fulin, xue-heng, fu-zhenghua, li-wenxi, wang-dawei-liaoning, shen-deyong, zhang-jian-ah, yang-keqin, xu-qianfei, hu-yifeng, zhang-bencai, zheng-xuelin, liu-yuejin-mps, lu-kehua, bi-baowen, liu-zhiqiang, sun-lijun, liu-yanping, zhou-yongkang, jin-daoming, yang-senlin, zhu-mingguo, zhong-shijian, qiu-daming, jiang-guowen, hao-hongjun, chen-yuxiang, zhang-ping-gz, long-xiang, li-chao-hunan, li-jianbo, qu-shuhui, mo-jiancheng, pan-jiahua, li-gang-zzb, wang-huimin, liu-lixian, long-fei, yang-hongyong, xu-chuanzhi, chen-yixin, guo-shengkun, li-xi]
  summary: '政法机关和纪检机关是查办别人的机关，它们自己的人出事，官方通报的说法是“执法犯法”“执纪违纪”和“灯下黑”。本站收录政法系统（公安、国家安全、检察、法院、司法行政和政法委）副部级以上落马者42人，已判刑的33人中17人被判无期徒刑以上，约52%；其他系统同级已判362人中141人无期以上，约39%。2021年2月至2022年1月的全国政法队伍教育整顿，第一批在市县两级就处理处分干警178431人，19847人主动投案。纪检一侧，本站有56名落马者担任过纪委、派驻纪检组、监委或巡视机构的领导职务，其中31人是二十大以后出事的；2023年起又开展全国纪检监察干部队伍教育整顿，当年立案纪检监察干部8977人。孙力军政治团伙和周永康案另有专题，本文只用它们的数字，不重述案情。'
  sections:
    - h: 口径：谁算“内鬼”
      from: 2012-11-15
      to: 2026-10-20
      text: '本文把两类人放在一起。第一类是政法系统的人：本站案件记录把系统标为政法的落马者共54人，其中副部级以上42人，即正国级1人（周永康）、正部级3人、副部级38人，另有12人为厅局级或少将级。系统按落马前的主要任职记，赵黎平、薛恒、朱明国这类当过公安厅长或公安局长、落马时已转任政协或地方党委的人记在地方系统，不在42人里，但本文照样写到他们。42人的处理结果是：有期徒刑16人，无期徒刑8人，死缓并终身监禁7人，死缓2人，只受党纪政务处分5人，已被开除、尚未判决3人，只有立案消息1人。被判死缓一类的9人是孙力军、傅政华、王立科、刘彦平、武长顺、李文喜、王大伟（以上死缓并终身监禁）和陆克华、刘跃进（死缓）。第二类是纪检的人：编者逐一核对人物卡履历，找出担任过纪委书记或副书记、中央纪委派驻纪检组组长、监委负责人、中央巡视组正副组长或巡视专员、巡视办主任的落马者56人，“巡视员”这一职级不算在内。两类重叠的有沈德咏（曾任上海市纪委书记）和刘彦平（驻国家安全部纪检监察组组长）。通报用语只在当事人自己的审查、开除通报和判决原文里检索：“执法犯法”出现在42名政法高官中12人的通报里，即傅政华、沈德咏、杨克勤、张坚、李文喜、蒙永山、胡毅峰、张本才、孟祥、郑学林、毕宝文、刘跃进；“以案谋私”5人，即许前飞、杨克勤、张坚、蒙永山、胡毅峰。“执纪违纪”只出现在纪检一侧，56人中18人。'
