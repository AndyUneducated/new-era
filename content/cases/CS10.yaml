- id: central-inspection
  title: 中央巡视：发现线索的人与被发现的人
  kind: system
  years: '1990–2026'
  people: [wang-qishan, zhao-leji, li-xi, li-xiaohong-xunshi, he-jiatie, zhang-huawei, dong-hong, liu-lixian, liu-yanping, xu-chuanzhi, ning-yanling, xu-lingyi, liao-shaohua, guo-youming, chen-baihuai, chen-anzhong, tong-mingqian, dai-chunning, su-rong, zhu-mingguo, wan-qingliang, jin-daoming, wu-changshun, qin-yuhai, wang-tianpu, liao-yongyuan, wu-zhenfang, leng-rongquan, deng-qilin, chang-xiaobing, zhang-yujun, yao-gang, zhou-laizhen, si-xianmin, xiang-junbo, yang-jiacai, sun-zhengcai, lu-wei, zhou-benshun, wang-min, bai-enpei, wang-sanyun, huang-xingguo, lu-enguang, cai-xiyou, wang-yincheng, luo-jiamang, fang-hongwei, su-shulin, zhang-xiwu, yu-haiyan, wang-xiaolin, gong-jianhua, wang-zhibin-icbc, li-xiangang, xue-jining, qiu-daming, hu-huaibang, li-guohua-unicom, liu-haichang, sun-bo-csic, dong-guoqun]
  summary: '巡视是中共中央派组进驻地方和单位查找问题的制度，1996年中央纪委第一次开展，2009年定名中央巡视组。2013年5月起，组长、对象和两者关系都不固定，王岐山要求巡视组找出“老虎”和“苍蝇”。十八届12轮巡视了277个党组织，官方称“中央纪委审查的案件中，超过60%的线索来自巡视”；十九届9轮巡视282个单位，二十届到2025年完成对中管企业和省区市的全覆盖。本站961份案件记录中，有可靠来源明确写明线索来自巡视的只有31份，口径不同，不能拿来和官方比例相比。巡视的人自己也出事：贺家铁、张化为、董宏、刘立宪、刘彦平、许传智都当过中央巡视组正副组长或巡视专员；2026年6月，十八届的中央巡视办主任黎晓宏也被立案。'
  sections:
    - h: 来历：1990年到2012年
      from: 1990-03
      to: 2012-11
      text: '中纪委网站2015年的一篇文章回顾了这项制度的来历：1990年十三届六中全会决定，中央和省区市党委可根据需要派出巡视工作小组；1996年中央纪委第一次开展巡视；十六大提出建立和完善巡视制度，十七大把它写入党章；2009年中央颁布《中国共产党巡视工作条例（试行）》，成立中央巡视工作领导小组，把中央纪委、中央组织部巡视组改称中央巡视组。官方后来说，陈良宇、侯伍杰等高级干部案发，最初的线索都与巡视工作有关。巡视专员是常设职位：法院认定张化为从2006年起就担任中央纪委、中央组织部巡视组副部级巡视专员，并利用这一职务受贿。十八大前的巡视组长基本固定，北京大学的庄德水说，那时组长“更像是一种人事或官职安排”。'
      cites: [cs5-people-2015-04-12-inspection-findings, r01-gov-2014-01-09-inspection-review, r03-court-2019-05-27-zhang-huawei-verdict]
    - h: 2013年：“不固定”与首轮
      from: 2013-05-17
      to: 2014-06-14
      text: '2013年5月17日，中央巡视工作动员暨培训会议在京召开，新一轮巡视启动。王岐山在会上打比方，要巡视组当好党中央的“千里眼”，找出“老虎”和“苍蝇”。中央巡视办介绍的新办法是组长、巡视的地区和单位、巡视组与巡视对象的关系都不固定，建立组长库，一次一授权；巡视内容收窄到“四个着力”，重点找违纪违法线索。当年10个巡视组分两轮巡视20个地方和单位，有价值的线索比过去增加了5倍。第一轮结束后，问题清单移交中央纪委、中组部，中央纪委随后对廖少华、郭有明、陈柏槐、陈安众、童名谦、戴春宁立案。第八巡视组5月27日至8月20日巡视江西，副组长宁延令后来在专题片中说，巡视组在个别谈话中得知省委书记苏荣在选举中丢票；2014年6月苏荣落马，成为十八大后首个落马的副国级官员。这一年的副组长中有后来出事的人：贺家铁是第五组副组长，黎晓宏是第七组副组长，10月黎晓宏出任中央巡视工作领导小组办公室主任。'
      cites: [r01-gov-2014-01-09-inspection-review, t01-chinacourt-2015-06-chen-anzhong-verdict, b12-people-2016-10-21-su-rong-documentary, c03-ccdi-2014-06-14-su-rong-probe, r03-wiki-he-jiatie, cs10-thepaper-2018-03-06-li-xiaohong, cs10-people-2013-11-01-li-xiaohong]
    - h: 2014–2015年：专项巡视进入央企
      from: 2014-07
      to: 2016-02-04
      text: '2014年起，常规巡视之外增加了专项巡视。中央第六巡视组2014年11月24日至12月24日专项巡视中石化，2015年2月5日、6日反馈时说，巡视组收到的领导人员问题线索已转中央纪委、中央组织部；4月，中石化总经理王天普被查。2015年2月11日的动员部署会确定，当年首轮巡视26家央企，13个组“一托二”，人民网称“巡视对象全部针对央企尚属首次”。到3月6日各组全部进驻：第二组巡视中石油、中海油，第八组巡视国家电网、南方电网，第十一组（组长张化为，副组长有刘立宪）巡视大唐、国电，第十二组（组长董宏）巡视中国电信、中国移动，第十三组巡视宝钢、武钢。随后中石油总经理廖永远3月16日被查，中海油原副总经理吴振芳4月2日被查，中国电信已退休五年的原副总经理冷荣泉4月17日被查，武钢原董事长邓崎琳8月被查。中国电信董事长常小兵8月才从联通调来，12月被查，开除通报称他“干扰中央专项巡视工作”，对巡视组反馈的问题整改落实不力。南航董事长司献民被指“干扰巡视工作”。年末人民网盘点：2015年中央巡视了43家央企、21家金融单位和17个中央国家机关；接受调查的9名央企高管中6人所在企业当年接受巡视；接受巡视的证监会有主席助理张育军、副主席姚刚两人被查，民航局副局长周来振是在巡视组进驻后被查的，开除通报称他“干扰、妨碍巡视工作，对抗组织审查”。年底银监会、保监会也被专项巡视，银监会主席助理杨家才后来被指“打探巡视和纪律审查信息”。'
      cites: [cs10-xinhua-2015-02-06-sinopec-feedback, cs10-people-2015-03-02-first-round-soe, cs10-ce-2015-03-09-first-round-leaders, f06-bbc-2015-03-16-liao-yongyuan, r02-ccdi-2015-04-02-wu-zhenfang-probe, r02-people-2015-04-17-leng-rongquan-probe, t01-ccdi-jlsc-list-p2, t01-ccdi-2015-12-27-chang-xiaobing-probe, r02-ccdi-2016-07-11-chang-xiaobing-expel, r02-ccdi-2016-02-03-si-xianmin-expel, r02-people-2016-01-02-ccdi-2015-tigers, r02-hebcdi-2016-01-20-zhou-laizhen-expel, cs5-people-2016-02-04-cbrc-inspection, r03-people-2017-08-01-yang-jiacai-expel]
    - h: 一届全覆盖与“回头看”
      from: 2015-04-12
      to: 2018-03-06
      text: '2015年4月，中纪委网站称中央巡视组不到2年就对31个省区市和新疆生产建设兵团巡视了一轮，山西塌方式腐败、衡阳破坏选举案、南充拉票贿选案都是巡视发现的，“苏荣、朱明国、万庆良、金道铭、武长顺、秦玉海等40多人的问题线索也是巡视发现的”。人民网2016年初的盘点说，十八大以来中央纪委立案审查的领导干部中，“一半以上是根据巡视移交的问题线索查处的”。此后巡视开始“回头看”。2016年6月至8月，中央第十一巡视组对江西回头看，江西省委12月公布的整改情况承认苏荣案后续处理工作不力。2016年11月至2017年1月，第十一巡视组（组长徐令义）对重庆回头看，2017年2月11日当面向市委书记孙政才指出，上轮巡视发现的一些重点问题整改不到位，清除“薄、王”思想遗毒不彻底；7月孙政才被调离、立案，2018年被判无期徒刑。中央网信办也被巡视，原主任鲁炜2017年11月被查，次年的开除通报称他“干扰中央巡视”。十八届中央纪委的工作报告总结：中央政治局及其常委会23次研究巡视工作，两次修订巡视工作条例，领导小组开了115次会，12轮巡视277个党组织，“在党的历史上首次实现一届任期内巡视全覆盖”，对16个省区市回头看，对4个中央单位“机动式”巡视，中央巡视组受理信访159万件、谈话5.3万人次，“中央纪委审查的案件中，超过60%的线索来自巡视”。2018年3月，黎晓宏对澎湃新闻说，每轮巡视启动前“打虎”没有指标要求；澎湃同期列出按巡视线索查处的孙政才、苏荣、周本顺、王珉、白恩培、王三运、黄兴国、卢恩光等人。'
      cites: [cs5-people-2015-04-12-inspection-findings, r02-people-2016-01-02-ccdi-2015-tigers, cs5-yyzx-2016-12-29-jiangxi-rectify, b07-ccdi-2017-02-13-chongqing-inspection, b07-ccdi-2017-07-24-sun-investigation, b07-xinhua-2018-05-08-sun-sentence, c03-ccdi-2017-11-21-lu-wei-probe, c03-xinhua-2018-02-13-lu-wei-expel, b04-gov-2017-10-29-ccdi-report, cs10-thepaper-2018-03-06-li-xiaohong]
    - h: 官方比例与本站记录
      from: 2012-11-15
      to: 2026-10-20
      text: '本站案件记录的“线索来源”字段，只有来源明确把案发归于巡视时才标为巡视。961份记录中这样标的有21份：2013年5份、2014年2份、2015年9份、2017年3份、2018年2份；级别上是正国级1人（孙政才）、正部级1人（白恩培）、副部级7人、央企和金融机构高管7人、厅局级5人。十八届任内（2012年11月至2017年10月24日）首次落马的196名副部级以上官员中，标为巡视的16人，标为来源不明的154人。官方的“超过60%”说的是中央纪委审查案件的线索来源，本站的16/196是公开资料能查实的下限，两个数不能相减。差距的一部分来自本站旧记录没有吸收官方的点名：澎湃2018年列出的8人中，本站只把孙政才、白恩培标为巡视，苏荣标为举报，周本顺、王珉、王三运、黄兴国、卢恩光5人标为来源不明；中纪委网站2015年点名的6人中，苏荣以外的朱明国、万庆良、金道铭、武长顺、秦玉海也都标为来源不明。另一个角度是通报措辞。本站案件记录摘录的通报原文中，写到巡视的有26人：干扰或妨碍巡视的9人（邓崎琳、司献民、周来振、常小兵、蔡希有、王银成、鲁炜、骆家駹、方红卫）；打探、窃取巡视信息的8人（苏树林、张喜武、虞海燕、杨家才、王晓林、龚建华、王芝斌、李显刚）；泄露巡视秘密或巡视移交线索处置情况的3人（贺家铁、薛纪宁、邱大明）；不落实巡视整改的3人（胡怀邦、李国华、刘海昌）；另有孙波在接受巡视期间隐瞒实情，董国群在中央巡视期间仍多次接受宴请，张化为利用巡视权干预被巡视单位。'
      cites: [b04-gov-2017-10-29-ccdi-report, cs10-thepaper-2018-03-06-li-xiaohong, cs5-people-2015-04-12-inspection-findings, r02-people-2016-01-02-ccdi-2015-tigers]
    - h: 十九届与二十届：轮次、提级与全覆盖
      from: 2017-10-25
      to: 2026-07-07
      text: '十九届中央纪委的工作报告说，习近平22次听取巡视汇报，中央巡视工作领导小组开了79次会，组织9轮巡视，巡视282个中央单位和地方党组织，各省区市党委巡视了8194个党组织，实现中央和省级巡视一届全覆盖；中央巡视组谈话5.8万人次，发现问题1.6万个，并开展专项巡视、提级巡视和巡视“回头看”。二十届中央纪委三次全会说，2023年“高质量完成对中管企业党组织巡视全覆盖”。2025年开展二十届中央第五轮、第六轮巡视，实现对省区市巡视全覆盖，同步提级巡视昆明市、联动巡视15个副省级城市，并对中管企业的巡视整改情况“回头看”；2026年安排第七轮、第八轮。巡视发现与落马的对应仍在继续：二十届候补中央委员、西安市委原书记方红卫2025年11月被查，2026年7月的开除通报列有“干扰巡视工作，对抗组织审查”；国开行原董事长胡怀邦被指落实中央巡视整改要求不到位，联通原副总李国华被指不落实中央巡视整改要求。'
      cites: [b05-saac-2022-10-ccdi-report, cs2-ccdi-2024-01-10-ccdi-3rd-plenum, b06-xinhua-2026-01-12-li-xi-ccdi-report, k06-xinhua-2025-11-07-fang-hongwei-probe, k06-xinhua-2026-07-07-fang-hongwei-expelled, k04-xinhua-2020-01-11-hu-huaibang-expel, t02-ccdi-2022-09-30-li-guohua-expel]
    - h: 巡视的人被查
      from: 2016-02-04
      to: 2026-10-08
      text: '本站有人物卡的中央巡视组正副组长、巡视专员和巡视办主任中，落马的有7人。贺家铁2013年任第五组副组长、2014年任第四组副组长，2016年2月中央纪委通报他“特别是担任中央巡视组副组长期间”泄露巡视工作秘密，降为正厅级，维基百科称他是首个被处分的中央巡视组领导成员。张化为2014年7月起任第十一组组长，2015年首轮专巡大唐、国电；2017年4月被查，开除通报称他“长期利用巡视权违规干预插手被巡视单位相关工作”，“知纪破纪、执纪违纪”，2019年以受贿3284.93万余元被判12年。他在2015年的副手刘立宪后任工商银行纪委书记，2022年8月自动投案，2024年被判8年。董宏2015年首轮任第十二组组长，巡视的中国电信当年有冷荣泉、常小兵两人被查；他本人2020年10月被查，开除通报称他“大搞迷信活动，违规干预和插手执纪执法活动”，2022年以受贿4.63亿余元被判死缓，判决列明的职务包括中央巡视组副组长。刘彦平当过十九届中央第五轮巡视第十四组组长，2023年作为孙力军政治团伙成员被判死缓并终身监禁。许传智2019年卸任宁夏纪委书记后，“在十九届中央多轮巡视中，许传智担任中央巡视组组长”；2025年10月被查，2026年10月8日被判12年，退休后受贿的2587万余元正是利用原任巡视专员的影响所得。最后是黎晓宏：他2013年10月起任中央巡视办主任，2014年进入中央巡视工作领导小组，2017年由王鸿津接任，2026年6月2日被宣布接受审查调查，至今没有处分通报。此外，地方纪委干部邱大明泄露中央巡视移交线索的处置情况，工商银行的王芝斌打探、窃取纪律审查和巡视秘密，说明巡视线索在移交以后的环节也会外泄。'
      cites: [r03-ccdi-2016-02-04-he-jiatie, r03-wiki-he-jiatie, r03-wiki-zhang-huawei, cs10-ce-2015-03-09-first-round-leaders, r03-ccdi-2017-04-17-zhang-huawei-probe, r03-ccdi-2017-08-02-zhang-huawei-expel, r03-court-2019-05-27-zhang-huawei-verdict, r05-xinhua-2023-09-15-liu-lixian-probe, t02-court-2024-12-24-liu-lixian-verdict, r04-ccdi-2020-10-02-dong-hong-probe, r04-ccdi-2021-04-12-dong-hong-expel, r04-court-2022-01-28-dong-hong-verdict, c03-xinhua-2023-01-10-liu-yanping-verdict, cs10-chinanews-2025-10-14-xu-chuanzhi, r07-people-2026-10-08-xu-chuanzhi-verdict, cs10-people-2013-11-01-li-xiaohong, cs10-thepaper-2018-03-06-li-xiaohong, cs10-caixin-2017-11-30-wang-hongjin, t02-xinhua-2026-06-02-li-xiaohong-probe, r04-people-2018-12-20-qiu-daming-expel]
  editor:
    - text: '编者分析：“超过60%”和本站的16/196说的不是一回事。官方数字的分母是中央纪委审查的案件，分子是线索来自巡视的，但没有公布名单；本站只在官方或可靠媒体点名某人线索来自巡视时才这样标，结果必然偏低。可以肯定的是两点：一是巡视发现集中在2013—2015年，本站21份标为巡视的记录中16份在这三年；二是此后官方提到巡视，更多是“干扰巡视”“打探巡视信息”“不落实巡视整改”这样的通报措辞，说明巡视已从发现线索的工具，变成衡量被查者态度的一把尺子。'
      cites: [b04-gov-2017-10-29-ccdi-report, cs10-thepaper-2018-03-06-li-xiaohong]
    - text: '编者分析：“三个不固定”防的是被巡视单位提前做工作、组长被围猎，但巡视专员本身是常设岗位。张化为、董宏、许传智落马时的身份都是“中央巡视组副部级巡视专员”，三人受贿的时间都与巡视任职重叠或延续到退休以后。通报没有说他们在哪一次巡视中受贿，判决也只写“利用职务上的便利”，本站不把2015年第十二组巡视中国电信与冷荣泉、常小兵被查，同董宏的受贿联系起来。'
      cites: [r03-court-2019-05-27-zhang-huawei-verdict, r04-court-2022-01-28-dong-hong-verdict, r07-people-2026-10-08-xu-chuanzhi-verdict]
    - text: '编者分析：十八届巡视的几个关键人物，黎晓宏、董宏、张化为都已落马。黎晓宏当过王岐山任北京市长时的市政府秘书长，又与董宏合著《金融反腐论》；美国之音称董宏是王岐山的老部下。这些是公开履历上的交集，官方没有把三案并案，也没有任何通报涉及王岐山，本站不据此推断巡视系统被整体清洗。黎晓宏案目前只有立案消息，原因要等开除通报。'
      cites: [cs10-wiki-li-xiaohong, c10-voa-2020-10-02-dong-hong, t02-xinhua-2026-06-02-li-xiaohong-probe]
  voices:
