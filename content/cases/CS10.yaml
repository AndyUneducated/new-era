    - h: 2020–2022年：政法队伍教育整顿
      from: 2020-07
      to: 2022-05-05
      text: '教育整顿先试点、后分两批铺开。2020年7月试点启动，中央政法委秘书长陈一新称之为“刮骨疗毒式的自我革命”；同年10月24日，江苏省委政法委书记王立科主动投案，2022年9月被认定向孙力军等人行贿，判处死缓并终身监禁。2021年2月27日全国动员部署会议召开，第一批2月底至6月底在市县两级开展，7月起“回头看”，全国教育整顿办挑出86件重点案件挂牌攻坚。8月30日的发布会公布：270万名政法干警参加，截至7月31日处理处分178431人，19847人主动投案，立案审查调查49163人，留置2875人，移送司法机关1562人；按四种形态，第一种148076人占83%，第四种1985人占1.1%。处理处分厅局级干部195人，只占总数的0.1%，占参加整顿的厅局级干部的3%，官方自己也说这一比例低于县处级的6.3%。市县两级班子成员被处理处分10326人，其中严重违纪违法413人，这些人里54%违规干预执法司法，47%违规选人用人，53%违规参与营利性活动；乡科级严重违纪违法问题4960件，“人情案”“关系案”占比超过70%。整顿还筛查了上世纪90年代以来的减刑、假释、暂予监外执行案件1524万件，认定问题案件8.7万件、纠正7.2万件；认定离任法官检察官违规从事律师职业、充当司法掮客2145人。最高检同期立案侦查司法工作人员职务犯罪598件732人，其中厅级3人。第二批8月中旬启动，覆盖中央政法委、中央政法单位和省级政法机关，为期3个月左右，重点是干预司法、插手案件处理、充当司法掮客等。2022年1月16日总结会要求“全面彻底肃清流毒影响”，5月的巩固成果部署写明“坚决肃清孙力军政治团伙等流毒影响”。本站统计，整顿期间（2021年2月27日至2022年1月16日）首次被宣布审查的政法岗位副部级以上官员7人：刘新云（4月9日，山西副省长兼公安厅长）、甘荣坤（6月1日，河南省委政法委书记）、蒙永山（6月2日，青海省检察长，主动投案）、孟祥（7月16日，最高法执行局长）、杨福林（7月29日，兵团政法委书记）、薛恒（8月23日，辽宁原副省长兼公安厅长，主动投案）、傅政华（10月2日，原司法部长）。蒙永山的开除通报写他“甚至在政法队伍开展教育整顿期间仍然不知收敛”。'
