    - h: 公安厅长、两院与政法委书记
      from: 2002-05
      to: 2026-10-16
      text: '辽宁是公安厅长连续出事的样本。财新2022年指出，王大伟被查意味着从2002年以来辽宁省公安厅“连续三任厅长落马”：李文喜2002年5月至2011年3月任厅长，2021年1月被查，2023年1月被泰安中院以受贿5.4亿余元判处死缓并终身监禁，法院称他检举揭发有关中管干部问题，有重大立功表现；薛恒2011年3月至2013年3月以副省长兼任厅长，2021年8月主动投案，2023年12月以受贿1.35亿余元等被判17年；王大伟2022年3月在副省长兼公安厅长任上被查，2024年10月被襄阳中院以受贿5.55亿余元判处死缓并终身监禁。别的省也有公安厅长出身的副省长落马：黑龙江的毕宝文退休后于2025年11月被查，开除通报称他“违规核发机动车号牌”，“贪婪腐化、执法犯法，将公安职权作为谋取私利的工具”，2026年10月16日被提起公诉；青海原副省长兼公安厅长、后任司法部副部长的刘志强2025年被判13年。公安部原部长助理、禁毒局长刘跃进2025年6月被判死缓，受贿1.21亿余元。法院一侧，最高法原常务副院长沈德咏的开除通报称他“执法犯法、靠案吃案，大搞司法腐败”，并“纵容默许亲属、秘书利用其职务影响充当司法掮客”，2023年被判15年；最高法执行局原局长孟祥2023年被判12年；民一庭原庭长郑学林被指“执法犯法，靠案吃案”，2024年被判15年，法院认定他退休后仍为人在案件处理上谋利。省高院院长中，安徽的张坚被指“违规帮助涉黑涉恶罪犯减刑假释、再审改判”，判15年；内蒙古的胡毅峰判14年；江苏的许前飞因干预具体案件审判被降为正局级。检察一侧，吉林省检察长杨克勤、青海省检察长蒙永山、上海市检察长张本才分别被判13年、11年、13年。政法委书记中，河南的甘荣坤2023年被判无期徒刑，兵团的杨福林被判13年，重庆的陆克华2026年5月被判死缓。'
