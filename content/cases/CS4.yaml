    - voice: zh
      text: 中央軍委政工部相當於軍委的中組部加中宣部
      quote: true
      cite: cs4-cna-2025-05-19-zhang-shengmin
    - voice: scholar
      text: 自苗华2017年担任中央军委政治工作部主任之后被提拔的高级将领，可能绝大部分都被调查。
      quote: true
      cite: cs4-zaobao-2025-09-13-four-generals
    - voice: scholar
      text: In essence, the regulation suggests that He Weidong and Miao Hua likely lost Xi Jinping’s trust due to shortcomings in political work and personnel management.
      quote: true
      cite: cs4-jamestown-2025-pwd-reshape
    - voice: zh
      text: （传闻）中央社转述的香港媒体文章称，苗华长期在驻福建第 31 集团军服役，盛传一名厦门著名房地产商 2024 年底涉案，被军委监察委员会留置。
      cite: cs4-cna-2025-05-19-zhang-shengmin
    - voice: scholar
      text: （传闻）丁树范转述前中央党校教授蔡霞在美国的说法，称苗华与何卫东曾在河北廊坊秘密组建一支只听命于两人的师级部队。
      cite: cs4-iccs-2026-pwd
