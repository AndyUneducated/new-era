- id: political-work
  title: 军委政治工作部：管干部的部门和它的主任们
  kind: system
  years: 2014–2026
  people: [zhang-yang, miao-hua, he-hongjun, bian-ruifeng, zhong-shaojun, zhang-shengmin, xi-jinping, xu-caihou, guo-boxiong, he-weidong, zhang-youxia, liu-zhenli, qin-shutong, yuan-huazhi, zhang-hongbing, wang-renhua, qin-shengxiang, yu-zhongfu, li-wei-pla, fang-yongxiang]
  summary: >-
    军委政治工作部 2016 年由总政治部改组而来，主管全军干部的考核、任免和宣传思想工作，中央社形容它“相當於軍委的中組部加中宣部”。它的前两任主任都没有善终：张阳 2017 年在接受组织谈话期间自缢，苗华 2024 年被停职、2025 年被开除党籍；常务副主任何宏军、主任助理边瑞峰也相继被罢免人大代表。到 2026 年，这个部门仍没有公开任命的新主任。
    在两轮军中清洗里，政工系统的角色前后颠倒：第一轮它是“肃清郭徐流毒”的执行者，第二轮它本身成了清查的主线。
  sections:
    - h: 古田与改组
      from: 2014-10-30
      to: 2016-01-11
      text: >-
        2014 年 10 月 30 日，全军政治工作会议在福建古田召开。习近平要求“高度重视和严肃看待徐才厚案件，深刻反思教训，彻底肃清影响”，并提出军队好干部的标准，要求“坚决整治用人风气，纯洁干部队伍”。时任总政治部主任张阳和其他军委委员参加了会议。
        2016 年 1 月，军委机关由四总部改为 15 个职能部门，总政治部改组为军委政治工作部，张阳任首任主任；同时单列的还有军委纪委、政法委和审计署。中央社后来概括，政工部主要负责宣传思想文化工作和组织建设，“包括高級將領考核”。
      cites: [e03-gov-2014-11-01-gutian, e08-xinhua-2016-01-11-cmc-organs, b21-cnr-2016-08-27-zhang-gutian, cs4-cna-2025-05-19-zhang-shengmin]
    - h: 张阳：主持肃清的人
      from: 2016-08
      to: 2018-10-16
      text: >-
        2016 年 8 月，张阳以“全军贯彻落实古田政工会精神领导小组组长”的身份主持会议，要求“彻底肃清郭徐流毒影响”，与郭徐的“圈子、品行、套路、作风等彻底划清界限”，并点名清理医疗卫生、军需能源、物资采购、有偿服务等领域。
        一年后情况反转。新华社通报，2017 年 8 月 28 日中央军委决定对张阳进行组织谈话，“调查核实其涉郭伯雄、徐才厚等案问题线索”；谈话期间他一直在家中居住，11 月 23 日上午在家中自缢死亡。2018 年 10 月 16 日，他被追加开除党籍，通报称他“最终以自杀方式企图逃避党纪国法的惩处”，“严重玷污军队政治工作和领导干部形象”。张阳与房峰辉在十九大前出局的经过，见《十九大前的军委换班》与《郭徐之后》两文。
      cites: [b21-cnr-2016-08-27-zhang-gutian, c02-xinhua-2017-11-28-zhang-yang, b21-xinhua-2018-10-16-zhang-yang-expel]
    - h: 苗华的七年与延安会议
      from: 2017-09
      to: 2024-11-28
      text: >-
        苗华 2017 年 9 月接任政治工作部主任。联合早报写道，他“在位超过七年，掌握人事提拔大权”。
        2024 年 6 月 17 日至 19 日，中央军委政治工作会议在延安召开。习近平说“10年前我们到古田召开全军政治工作会议，今天我们来延安召开军委政治工作会议”，提出“明确枪杆子要始终掌握在对党忠诚可靠的人手中”，并要求“军委政治工作部、纪律检查委员会、政法委员会要加强协调配合”。出席会议的军委成员是张又侠、何卫东、刘振立、苗华、张升民；此后两年里，除张升民外四人都被查处。会后五个多月，2024 年 11 月 28 日，苗华被停职检查。苗华案本身的经过，见《九上将案》一文。
      cites: [cs4-zaobao-2025-09-13-four-generals, cs4-mod-2024-06-19-yanan-plad, b08-mod-2024-11-28-miao-suspended, b08-mod-2025-10-17-nine-generals, b08-voa-2026-08-28-zhang-liu]
    - h: 主任、常务副主任与主任助理
      from: 2025-03-14
      to: 2026-01-23
      text: >-
        苗华 2025 年 3 月 14 日被政治工作部军人代表大会罢免全国人大代表，6 月 27 日被免去国家军委委员，10 月 17 日与常务副主任何宏军等九人一同被开除党籍。何宏军 11 月 13 日、主任助理边瑞峰 2026 年 1 月 23 日先后被政治工作部军人代表大会以涉嫌严重违纪违法罢免。台湾中共研究杂志社统计，2026 年 1 月二十届中纪委五次全会上缺席的十名军队委员中，也有政治工作部主任助理李军。
        谁来接管这个部门一直没有官方说法。2025 年 5 月，中央社转述香港媒体文章的推断，称张升民已“接替苗華主管政治工作部”。2025 年 10 月四中全会把张升民由军委纪委书记升为军委副主席，但没有增补新的军委委员。丁树范 2026 年写道，政工部仍然没有主任；台湾中共研究杂志社梳理，目前由副主任陈德民主持日常工作。
      cites: [a02-wikisource-npc-qualification-reports, b08-xinhua-2025-06-27-miao-removed, b08-mod-2025-10-17-nine-generals, cs4-iccs-411-acting-generals, cs4-cna-2025-05-19-zhang-shengmin, b08-zaobao-2025-10-23-fourth-plenum, cs4-iccs-2026-pwd]
    - h: 被清查的政委们
      from: 2025-07-21
      to: 2026-02-26
      text: >-
        2025 年 7 月 21 日，解放军报公布军委《关于大力弘扬优良传统、全面肃清流毒影响 重塑政治干部形象威信的若干规定》。詹姆斯敦基金会分析，官方解读把政工系统的核心问题归于不当的人际关系而非财务腐败，并把选人用人放在整改中心。
        联合早报引丁树范的推断，苗华任内被提拔的高级将领“可能绝大部分都被调查”。被开除或罢免的人里政工干部很多：九人名单中有政工部主任苗华、常务副主任何宏军、陆军原政委秦树桐、海军原政委袁华智；武警政委张红兵、军委政法委书记王仁华 2025 年 12 月被公告罢免人大代表；2026 年 2 月的公告又列出海军原政委秦生祥、空军原政委于忠福、信息支援部队原政委李伟三名上将。
      cites: [cs4-jamestown-2025-pwd-reshape, cs4-zaobao-2025-09-13-four-generals, b08-mod-2025-10-17-nine-generals, cs4-cna-2025-12-27-five-generals, f09-dw-2026-02-26-pla-deputies]
    - h: 钟绍军与办公厅一线
      from: 2013-06
      to: 2026-08-28
      text: >-
        在政工部之外，军委办公厅和军委主席办公室是另一个贴近最高层的岗位。习近平在浙江、上海和中央的长期秘书钟绍军，2013 年 6 月进入军委办公厅任副主任兼军委主席办公室主任，2017 年 8 月任办公厅主任；另说，美国之音称他 2013 年即调任军委办公厅主任。他 2024 年春卸任办公厅主任，转任国防大学政委。
        2025 年 10 月，中国驻朝鲜使馆的消息显示夏志和已以国防大学政委身份出访，BBC 转述台湾《联合报》的解读，称钟绍军“被悄悄免職”。2026 年 8 月 28 日，中央军委办公厅军人代表大会罢免了张又侠和钟绍军的全国人大代表，美国之音称这是他首次被证实出事。不迟于 2024 年 3 月接任办公厅主任的方永祥，2025 年 6 月起也不再露面，10 月四中全会递补中央委员时被跳过。
      cites: [c07-wiki-zhong-shaojun, b08-voa-2026-08-28-zhang-liu, cs4-bbc-2025-10-cc-changes-trad, c07-xinhua-2026-08-28-npc-deputies, k06-wiki-fang-yongxiang]
  editor:
    - text: >-
        政工系统在两轮清洗里的位置正好相反。古田会议后，政工部是“肃清郭徐流毒”的主持者，张阳亲任领导小组组长；但他本人随即被查出涉郭徐案，以自杀告终，官方说他“严重玷污军队政治工作”。第二轮清洗的主线则直接穿过政工部：苗华掌管干部提拔七年，联合早报和丁树范都把大批将领落马与他的任期联系起来。詹姆斯敦基金会的判断是，何卫东和苗华失去信任，主要是因为政治工作和人事管理上的失败。
      cites: [b21-cnr-2016-08-27-zhang-gutian, b21-xinhua-2018-10-16-zhang-yang-expel, cs4-zaobao-2025-09-13-four-generals, cs4-jamestown-2025-pwd-reshape]
    - text: >-
        制度上的原因在于，干部考核、提拔和宣传思想工作集中在同一个部门，主任一旦出事，经他提拔的整条干部链都要重新审查。2024 年延安会议要求政工部与纪委、政法委“加强协调配合”，而到 2026 年，主持各军种政治日常工作的多为纪委系统出身的将领，政工部本身只有副主任主持工作；职位长期空缺，本身就说明最高层对既有政工干部的信任尚未恢复。
      cites: [cs4-cna-2025-05-19-zhang-shengmin, cs4-mod-2024-06-19-yanan-plad, cs4-iccs-411-acting-generals, cs4-iccs-2026-pwd]
  voices:
    - voice: official
      text: 严重玷污军队政治工作和领导干部形象
      quote: true
      cite: b21-xinhua-2018-10-16-zhang-yang-expel
    - voice: official
      text: 明确枪杆子要始终掌握在对党忠诚可靠的人手中
      quote: true
