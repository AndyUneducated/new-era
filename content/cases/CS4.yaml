    - voice: zh
      text: 他被指是已经落马的前中央政法委书记周永康的亲信
      quote: true
      cite: c03-bbc-2016-12-29-wang-jianping
    - voice: scholar
      text: A native of Hebei Province, General Wang is deemed a protégé of President Hu’s.
      quote: true
      cite: cs4-jamestown-2010-pap-reshuffle
    - voice: west
      text: （传闻）自由亚洲电台转述博闻社，称王建平 2017 年 4 月 23 日在北京沙河总政看守所自杀身亡；报道同时注明消息未得到官方证实。
      cite: cs4-rfa-2017-04-26-wang-jianping-rumor
    - voice: zh
      text: （传闻）希望之声称，曹均章是张又侠第 13 集团军的旧部，张又侠的另一旧部、北京卫戍区司令员付文化也调任武警副司令员；又称王春宁、张红兵都在苗华主管政工系统时期获重用。
