- id: pap
  title: 武警：从双重领导到军委建制
  kind: system
  years: 1982–2025
  people: [wang-jianping, wu-shuangzhan, wang-ning-pap, wang-chunning, zhang-hongbing, niu-zhizhong, liu-zhanqi, wang-xin-pap, miao-guirong, qu-mutian, yang-hai-pap, zhou-yongkang, bo-xilai, xu-caihou, hu-jintao, xi-jinping, he-weidong, miao-hua, zhang-youxia]
  summary: >-
    武警部队长期由国务院和中央军委双重领导，地方政府可以调动兵力，司令员同时是中央政法委委员。十八大后武警出过两轮高层落马：第一轮以 2016 年被立案的前司令员王建平为顶点，外界普遍把他与周永康联系在一起；第二轮发生在 2018 年武警完全划归军委之后，2025 年司令员王春宁、政委张红兵在同一年被罢免人大代表，代理司令员的状态到年底仍不明朗。
    两轮之间，2018 年 1 月 1 日起武警“不再列国务院序列”，地方失去了调兵权；武警高层的进退也从此完全落在军委的人事线上。
  sections:
    - h: 双重领导与政法系统
      from: 1982
      to: 2012
      text: >-
        武警部队成立于 1982 年，承担内卫、抢险救灾等任务，由国务院和中央军委双重领导。德国之声指出，由于这一体制，地方政府对武警兵力有指挥、调动的权力，“一段时间里，地方政府以维稳名义调动武警部队的现象曾司空见惯”。
        武警司令员也在中央政法系统任职，例如 2014 年接任司令员的王宁兼任中央政法委委员。德国之声写道，在周永康时代“政法委和武警的关系非常密切”；2012 年 2 月王立军出逃美国驻成都领事馆后，时任重庆市委书记薄熙来曾派武警包围领事馆。
      cites: [cs4-dw-2017-12-27-pap, f10-wiki-wang-ning]
    - h: 王建平：从西藏总队到武警司令
      from: 1992
      to: 2014-12
      text: >-
        王建平 1969 年参军，早年在沈阳军区服役。BBC 记他 1992 年升任第 40 集团军 120 师师长；另说，北京青年报记为 1994 年 2 月任该师师长，其后转任武警 120 师师长。北京青年报还指出，他在沈阳军区服役时正值徐才厚在沈阳军区任职的后期。
        詹姆斯敦基金会称他是河北人，1996 年至 2000 年任武警西藏总队主官，2009 年一年内由武警参谋长升任副司令员，12 月下旬接替任职十年的吴双战出任武警部队司令员。2012 年 7 月他晋升上将，同年递补为中央委员。2014 年冬，他与副总参谋长王宁对调，离开武警系统。
      cites: [c03-bbc-2016-12-29-wang-jianping, cs4-cyol-2017-01-03-wang-jianping, cs4-jamestown-2010-pap-reshuffle]
    - h: 交通指挥部与第一轮落马
      from: 2014-11
      to: 2016-10
      text: >-
        2014 年 11 月，武警交通指挥部原司令员刘占琪被立案，原政委王信、原总工程师缪贵荣、原副司令员瞿木田在 2015 年 9 月至 11 月间相继被立案。2015 年 11 月，武警福建总队原司令员杨海被罢免全国人大代表，财新称他是“首位被查的省级武警总队军政主官”。
        2016 年 10 月，十八届六中全会确认开除武警部队原副司令员牛志忠的党籍。北京青年报在年终盘点中说，这一年武警和空军成为军中反腐的重灾区，武警原副司令、原司令以及省总队司令落马的消息陆续传出。
      cites: [a01-people-2015-06-16-army-batch5, a01-thepaper-2015-10-army-tigers-44, a01-people-2015-11-13-army-batch, a01-caixin-2015-11-26-yang-hai, i01-cpc-2016-10-27-6th-plenum-communique, cs4-cyol-2017-01-03-wang-jianping]
    - h: 王建平被带走与立案
      from: 2016-08
      to: 2017-10-14
      text: >-
        北京青年报梳理，官方媒体最后一次提到王建平，是 2016 年 8 月 7 日军网刊登的训练座谈会发言摘登。美国之音转述《南华早报》，他 8 月 25 日在四川成都视察期间被军方纪检人员带走，妻子和秘书同日在北京被带走；10 月的十八届六中全会画面中也没有他。
        12 月 29 日，国防部发言人杨宇军证实，王建平“因涉嫌受贿犯罪，军事检察机关已对其立案侦查”。财新称他是十八大后首个被官方证实落马的现役上将，此前的徐才厚、郭伯雄、田修思被查时都已退役。2017 年 10 月 14 日，十八届七中全会确认开除其党籍。本站未查到此后对他起诉、审判或其下落的官方通报。他与田修思在十九大前出局的经过，见《十九大前的军委换班》一文。
      cites: [cs4-cyol-2017-01-03-wang-jianping, cs4-voa-2016-12-29-wang-jianping, c03-mod-2016-12-29-wang-jianping, cs4-caixin-2016-12-29-wang-jianping, c03-xinhua-2017-10-14-seventh-plenum]
    - h: 收归军委
      from: 2016-01
      to: 2018-01-01
      text: >-
        2016 年 1 月的《中央军委关于深化国防和军队改革的意见》提出，按“军是军、警是警、民是民”的原则调整武警指挥管理体制。2017 年 12 月 27 日，新华社公布中共中央决定：“自2018年1月1日零时起，武警部队由党中央、中央军委集中统一领导”，武警部队“归中央军委建制，不再列国务院序列”，中央和国家机关、地方党委政府只与武警“建立任务需求和工作协调机制”。这一调整完成时，武警司令员是王建平的继任者王宁。
        德国之声引述学者吴强的看法，认为这是习近平主导的军队改革“最后一步，也可能是最重要的一步”。官方评论同时强调，调整后武警“不列入人民解放军序列”。
      cites: [cs4-dw-2017-12-27-pap, cs4-gov-2017-12-27-pap-leadership, f10-wiki-wang-ning]
    - h: 第二轮：司令员与政委同年出局
      from: 2024-11
      to: 2025-12-27
      text: >-
        王宁之后的司令员王春宁长期在原南京军区服役，2016 年出任北京卫戍区司令员，2020 年 12 月以武警部队司令员身份晋升上将。联合早报说，他自 2024 年 11 月起缺席上将晋衔仪式、中纪委全会和中央政法工作会议；2025 年 7 月 21 日，原副司令员曹均章以武警部队代理司令员身份出席活动。人大代表资格审查报告显示，武警部队军人代表大会 7 月 25 日以王春宁“涉嫌严重违纪违法”为由罢免其全国人大代表；10 月 17 日，国防部宣布开除何卫东、苗华和他在内九人的党籍。
        政委张红兵 7 月 31 日缺席八一招待会，10 月 30 日被武警部队军人代表大会罢免全国人大代表，12 月 27 日人大常委会公告后，中央社称他与王仁华、王鹏“首度被證實涉嫌嚴重違紀違法落馬”。12 月 22 日的上将晋衔仪式上，代表武警出席的是驻港部队司令员彭京堂和原海军陆战队政委王洪斌。九名上将同案的经过，见《九上将案》一文。
      cites: [cs4-zaobao-2025-09-13-four-generals, cs4-caixin-2025-07-24-cao-junzhang, a02-wikisource-npc-qualification-reports, b08-mod-2025-10-17-nine-generals, a02-bbc-2025-10-fourth-plenum-absent, cs4-cna-2025-12-27-five-generals, cs4-zaobao-2025-12-24-peng-jingtang]
  editor:
    - text: >-
        两轮武警落马被放进了不同的政治叙事。王建平出事时，外媒普遍把他归入周永康一线：BBC 写他“被指是已经落马的前中央政法委书记周永康的亲信”，美国之音强调周永康是他任司令员时的直接上司。但 2009 年他出任司令员时，詹姆斯敦基金会把他看作胡锦涛提拔的人。官方通报只提受贿，两种标签都来自外部观察；能确定的是，双重领导体制下武警与政法系统关系紧密，这是外界把武警案和周永康案联系起来的制度背景。
        第二轮则发生在武警完全归军委之后。联合早报把王春宁等人的落马放在何卫东、苗华一案的脉络里，而不是政法系统里——武警高层的风险，已经从地方和政法线转到了军队人事线。
      cites: [c03-bbc-2016-12-29-wang-jianping, cs4-voa-2016-12-29-wang-jianping, cs4-jamestown-2010-pap-reshuffle, cs4-zaobao-2025-09-13-four-generals]
    - text: >-
        2018 年的调整解决的是“谁能调动武警”：吴强说它“剥夺了地方、各地政府对武警的控制权”。此后武警主官的任免完全取决于军委，武警也因此更直接地承受军委层面人事清洗的冲击。2025 年司令员、政委在同一年被罢免，代理司令员此后也不再代表武警露面；台湾学者丁树范 2026 年写道，武警与陆、海、空、火箭军一样仍没有正式任命的司令员和政委。
      cites: [cs4-dw-2017-12-27-pap, cs4-gov-2017-12-27-pap-leadership, cs4-zaobao-2025-12-24-peng-jingtang, cs4-iccs-2026-pwd]
