- id: logistics-audit
  title: 后勤与审计：从总后勤部到联勤保障部队
  kind: system
  years: 2012–2026
  people: [gu-junshan, liu-zheng, fu-linguo, zhu-heping-pla, wang-aiguo-pla, zhan-guoqiao, zhang-wansong, deng-ruihua, dong-mingxiang, chen-jianfeng-pla, zhou-guotai, zhou-linhe, liu-shengjie, zhao-keshi, fan-changlong, xu-qiliang, zhang-shengmin, zhang-yang, zhang-lin-pla, gao-daguang, sun-bin-pla, he-song-pla, wang-kangping, xu-caihou, he-weidong, miao-hua, zhang-youxia]
  summary: >-
    总后勤部掌管军队的营房、基建、物资和油料，是十八大后第一轮军中反腐最集中的系统之一：副部长谷俊山之后，接替他的刘铮和多个大军区联勤部部长相继被查。随后的改革把审计署从总后划归军委，2016 年撤销总后、分设后勤保障部和机关事务管理总局，组建联勤保障部队，并用三年停止军队有偿服务。
    改革之后，这个系统的主官仍接连出事：2025 年后勤保障部部长张林、联勤保障部队政委高大光同日被罢免人大代表，军委审计长孙斌随后被罢免，2026 年后勤保障部原副部长何松、联勤保障部队司令员王抗平也相继出局。
  sections:
    - h: 谷俊山之后的总后勤部
      from: 2012
      to: 2016-08
      text: >-
        2012 年初，分管营房、基建的总后勤部副部长谷俊山落马，这一案件的经过见《谷俊山案》一文。当年末接替他的刘铮，2014 年 11 月也因涉嫌违法犯罪被军事检察机关立案侦查；总后司令部副参谋长符林国更早在 2014 年 5 月被立案。环球人物把总后基建营房部称为“事故多发地”。2015 年 1 月，总政、总后和军委纪委联合发出通知，用两年时间在全军和武警部队专项清理整治经济适用住房建设项目。
        同一时期，各大军区联勤部也成为查处重点：成都军区联勤部部长朱和平、沈阳军区联勤部原部长王爱国、兰州军区联勤部原部长占国桥和张万松、原政委邓瑞华、北京军区联勤部原部长董明祥、广州军区联勤部原副部长陈剑锋在 2014—2015 年相继被立案。2015 年 10 月，总后军需物资油料部原副部长周国泰被立案；2016 年 8 月，该部原部长周林和因涉嫌违纪违法辞去全国人大代表。
      cites: [f09-hqrw-2015-01-26-army-tigers, a01-thepaper-2015-10-army-tigers-44, a01-npc-2016-09-03-report]
    - h: 审计署划归军委
      from: 2014-11-06
      to: 2014-11-06
      text: >-
        2014 年 11 月，习近平签署命令，解放军审计署“由总后勤部划归中央军委建制”，主管全军审计工作，对军委负责并报告工作，“其党的建设、政治工作和行政管理由军委办公厅领导”。11 月 6 日的宣布大会由范长龙讲话、许其亮宣读命令，总后勤部部长赵克石出席。
        新华社的报道说，这一调整是为了加强对军队经济活动的审计监督，“增强审计监督的独立性、权威性和实效性”。在此之前，审计署隶属于它要审计的总后勤部。
      cites: [cs4-people-2014-11-06-audit-office]
    - h: 拆分总后与组建联勤保障部队
      from: 2016-01-11
      to: 2017-10-09
      text: >-
        2016 年 1 月军委机关改革，四总部改为 15 个职能部门，总后勤部不再保留，新设的部门中包括军委后勤保障部、军委审计署和军委机关事务管理总局。张升民 2016 年出任后勤保障部政委，次年转任军委纪委书记；原总后副政委兼纪委书记刘生杰改任后勤保障部副部长，2017 年 10 月被撤销中央纪委委员职务，官方未说明原因。
        2016 年 9 月 13 日，中央军委联勤保障部队成立，习近平向武汉联勤保障基地和无锡、桂林、西宁、沈阳、郑州五个联勤保障中心授旗，武汉联勤保障基地司令员李士生、政委殷志红接旗。习近平称这支部队是“实施联勤保障和战略战役支援保障的主体力量”。
      cites: [e08-xinhua-2016-01-11-cmc-organs, b08-zaobao-2025-10-23-fourth-plenum, a01-wiki-liu-shengjie, r03-ccdi-2017-10-09-ccdi-8th-plenum, cs4-gov-2016-09-13-jlsf]
    - h: 停止有偿服务
      from: 1998
      to: 2019-07-10
      text: >-
        新华社 2019 年回顾说，“有偿服务是特殊历史条件下的产物”：1998 年军队停止经商后，仍暂时保留一些领域可以对外开展有偿服务。2016 年 3 月 27 日，新华社报道中央军委近日印发通知，计划用 3 年左右时间分步骤停止军队和武警部队一切有偿服务活动，新项目、新合同一律停止；另说，新华社 2019 年的回顾把通知下发时间记为 2016 年 2 月。
        同年 8 月，张阳主持的古田政工会精神领导小组会议把有偿服务与医疗卫生、军需能源、物资采购、装备系统一起列为专项清理整治的重点领域。2019 年 7 月，新华社宣布停偿任务基本完成，“军队不从事经营活动的目标基本实现”，并通过“收支两条线”制度使所有收益与单位和个人利益脱钩。
      cites: [cs4-xinhua-2019-07-10-paid-services, cs4-chinanews-2016-03-27-paid-services, b21-cnr-2016-08-27-zhang-gutian]
    - h: 张林、高大光同日出局
      from: 2019
      to: 2025-10-25
      text: >-
        据维基百科，张林曾任海军青岛综合保障基地司令员、联勤保障部队副参谋长，2019 年升任联勤保障部队参谋长，2020 年调任武警部队后勤部部长，2021 年 3 月任军委机关事务管理总局局长，2022 年 1 月升任军委后勤保障部部长并晋升中将；另说，联合早报引中共新闻网资料，称张林 2004 年任陆军第 39 集团军政治部主任、2006 年转任该集团军副政委，与前一种履历差别较大。高大光早年在沈阳军区第 39 集团军任师政委，后任军委政治工作部老干部局局长，不晚于 2021 年 7 月任机关事务管理总局政委，不晚于 2024 年 9 月任联勤保障部队政委。
        2025 年 7 月 21 日，后勤保障部军人代表大会以涉嫌严重违纪违法为由，同时罢免张林和高大光的全国人大代表。BBC 称张林是“被傳落馬”军官中“間接但最肯定已出事的一位”。同日以武警代理司令员身份露面的曹均章，此前也担任过联勤保障部队副司令员。台湾中共研究杂志社梳理，后勤保障部部长此后由副部长陈炽接任。
      cites: [f10-wiki-zhang-lin, cs4-zaobao-2025-09-13-four-generals, f10-wiki-gao-daguang, a02-wikisource-npc-qualification-reports, cs4-bbc-2025-10-cc-changes-trad, cs4-caixin-2025-07-24-cao-junzhang, cs4-iccs-411-acting-generals]
    - h: 审计长与联勤司令员
      from: 2025-09-16
      to: 2026-06-26
      text: >-
        2025 年 9 月 16 日，军委办公厅军人代表大会罢免军委审计署审计长孙斌的全国人大代表——这与 2014 年审计署党建和行政管理归办公厅领导的安排一致。财新称他是“两届中央纪委委员”；另说，联合早报在同日报道中称他为副审计长，维基百科记他先后任副审计长、审计长。2026 年 1 月的中纪委五次全会上，孙斌是缺席的十名军队委员之一。财新统计，到 2025 年 10 月，十四届全国人大的军队代表已有 22 名将军被罢免。
        2026 年 2 月，全国政协撤销军委后勤保障部原副部长何松的委员资格，3 月 2 日政协常委会予以追认。6 月 26 日，东部战区军人代表大会罢免王抗平的全国人大代表；维基百科记他 2024 年 10 月起任联勤保障部队司令员，另说，詹姆斯敦基金会的名单称他为东部战区副司令员。詹姆斯敦基金会指出，这一轮被清洗的将领多在航天、网络、后勤和采购岗位。
      cites: [a02-wikisource-npc-qualification-reports, cs4-people-2014-11-06-audit-office, cs4-caixin-2025-10-29-sun-bin, cs4-zaobao-2025-10-29-xu-dazhe, a02-wiki-sun-bin-pla, cs4-iccs-411-acting-generals, a02-wiki-he-song, k05-xinhua-2026-03-02-cppcc, c03-xinhua-2026-06-26-npc-notice-18, f10-wiki-wang-kangping, f10-jamestown-2026-07-six-generals]
  editor:
    - text: >-
        后勤系统的两轮落马被放进了不同的派系叙事。第一轮的总后案件多与郭伯雄、徐才厚联系在一起：新京报“政事儿”把谷俊山归在徐才厚这座“山”下，并指出接替他的刘铮也是徐才厚的辽宁老乡。第二轮里，联合早报把张林、高大光的落马放在何卫东、苗华一案的脉络中，詹姆斯敦基金会则把王抗平与李尚福、张又侠一线联系起来。官方通报从未给出这些关联；可以确定的是，同一个系统在不同的清洗主线里都被波及。
      cites: [f09-hkcd-2016-07-12-guo-xu-tigers, cs4-zaobao-2025-09-13-four-generals, f10-jamestown-2026-07-six-generals]
    - text: >-
        制度上，后勤系统掌握营房、土地、物资和采购，2014—2019 年的改革都针对资金流向：审计独立、拆分总后、停止有偿服务、收支两条线。这些措施改变了钱从哪里来、由谁审计，但后勤部门主官仍由同一套干部提拔体制产生；2025—2026 年后勤保障部、联勤保障部队和审计署的主官相继被罢免，说明制度改革之后，人事层面的清查并没有结束。
      cites: [cs4-people-2014-11-06-audit-office, cs4-xinhua-2019-07-10-paid-services, a02-wikisource-npc-qualification-reports, c03-xinhua-2026-06-26-npc-notice-18]
  voices:
    - voice: official
      text: 增强审计监督的独立性、权威性和实效性
      quote: true
      cite: cs4-people-2014-11-06-audit-office
    - voice: official
      text: 有偿服务是特殊历史条件下的产物。
      quote: true
      cite: cs4-xinhua-2019-07-10-paid-services
    - voice: zh
      text: 刘铮是辽宁营口人，也是徐才厚的老乡。
      quote: true
      cite: f09-hkcd-2016-07-12-guo-xu-tigers
    - voice: zh
      text: 間接但最肯定已出事的一位
      quote: true
      cite: cs4-bbc-2025-10-cc-changes-trad
    - voice: scholar
      text: Many of the six are officers in aerospace, cyberspace, logistics, and procurement billets
      quote: true
      cite: f10-jamestown-2026-07-six-generals
    - voice: zh
      text: （传闻）独立评论人杜政推测，张林被罢免人大代表后，后勤保障部部长可能已由副手陈炽接任。
      cite: cs4-ntdtv-2025-11-10-acting-generals
  events: [e1998-army-out-of-business, e05-2012-gu-junshan-removed, e08-2016-cmc-organs-reorganized]
  factions: [guo-xu, he-miao, zhang-liu]
  cites: [cs4-people-2014-11-06-audit-office, cs4-gov-2016-09-13-jlsf, cs4-chinanews-2016-03-27-paid-services, cs4-xinhua-2019-07-10-paid-services, f09-hqrw-2015-01-26-army-tigers, a01-thepaper-2015-10-army-tigers-44, a02-wikisource-npc-qualification-reports, c03-xinhua-2026-06-26-npc-notice-18]

- id: mobilization
  title: 国防动员部与省军区：“戎装常委”的系统
  kind: system
  years: 2010–2026
  people: [sheng-bin, zhu-shengling, liu-faqing, wang-donghai, fang-wenping, ye-wanyong, yuan-shijun, kou-tie, huang-xianjun, zhang-daixin, zhan-jun, guo-zhenggang, fu-yi, zhu-heping-pla, yang-jinshan, ye-qing-pla, meng-zhongkang, yang-longxi, yang-guang-pla, guo-boxiong, xu-caihou]
  summary: >-
    省军区既是军队机关，也是同级党委的军事部和政府的兵役机构，司令员或政委通常兼任省委常委。2014—2015 年，省军区是军中反腐的重灾区之一，山西、四川、湖北、黑龙江、浙江等省军区的主官和副职相继被查。2016 年军改把省军区从各大军区划出，转隶新组建的军委国防动员部。
    第二轮清洗波及国防动员部本身：部长刘发庆 2025 年起不再露面，政委王东海 2026 年 1 月被罢免全国人大代表；青海省军区政委杨龙溪、湖北省军区原副司令员杨光也在同月被罢免人大代表。
  sections:
    - h: 省军区的双重身份
      from: 2010
      to: 2015-07
      text: >-
        澎湃新闻介绍，省军区属军区建制，同时是省级党委的军事工作部门和政府的兵役工作机构，“受军区和省（市、自治区）党委、政府的双重领导”。香港商报指出，省、市、县各级党委都有一个常委职位由当地军事机关首长担任，在省一级由省军区司令员或政委出任，这一职位常被称为“戎装常委”。
        国防动员部首任部长盛斌 2016 年概括，按相关法律，省军区系统是“同级党委的军事部、地方政府的兵役机构、当地驻军的协调机关”。这一身份让省军区同时连接军队、地方党委和地方政府。
      cites: [cs4-thepaper-2015-01-15-fang-wenping, cs4-hkcd-2015-07-16-military-standing, cs4-chinacom-2016-03-11-sheng-bin]
    - h: 2014—2015：省军区成重灾区
      from: 2014-03
      to: 2015-10
      text: >-
        2015 年 1 月，军队公布 2014 年 16 起军级以上干部重大案件，人民网报道其中省军区和军事院校各有四人。山西省军区原司令员方文平 2014 年 3 月被立案（他 2010 年 9 月已被免去司令员职务），四川省军区原政委叶万勇 2014 年 5 月被立案；此后湖北省军区原司令员苑世军、黑龙江省军区原司令员寇铁、山西省军区政治部原主任黄献军、湖北省军区原副司令员占俊在 2014 年 10 月至 12 月相继被立案，黑龙江省军区副司令员张代新后以贪污罪被判有期徒刑 10 年。
        2015 年 2 月，郭伯雄之子、浙江省军区副政委郭正钢晋升少将仅 46 天即被立案侦查；财经网披露，与他有关的烂尾五金城占用的正是省军区农副业基地的土地。香港商报统计，十八大后落马的 37 名“军老虎”中近半数是省军区领导，认为这与省军区掌握大量军事用地、设施和物资有关，并列出曾任省军区正职的朱和平、方文平、傅怡、寇铁、苑世军、叶万勇。
      cites: [cs4-people-2015-01-16-army-tigers, cs4-thepaper-2015-01-15-fang-wenping, a01-thepaper-2015-10-army-tigers-44, a01-people-2015-06-16-army-batch5, f09-rmzxw-2015-03-03-army-tigers, cs4-hkcd-2015-07-16-military-standing]
    - h: 转隶国防动员部
      from: 2016-01
      to: 2016-03
      text: >-
        2016 年 1 月军委机关改革，新设军委国防动员部，盛斌任首任部长，朱生岭任政委。盛斌在接受中国国防报采访时说，军委组建国防动员部，“履行组织指导国防动员和后备力量建设职能，领导管理省军区”，并把省军区的任务概括为应急应战的指挥部、地方党委的军事部、后备力量的建设部、同级政府的兵役部、军民融合的协调部。
        澎湃新闻转述军报记者公众号的报道说，省军区系统由此“转隶军委国防动员部领导管理”；报道也承认转隶初期部分单位存在等待观望的情况。此前省军区属军区建制，此后改由军委的一个职能部门领导管理。
      cites: [e08-xinhua-2016-01-11-cmc-organs, k05-wiki-sheng-bin, cs4-chinacom-2016-03-11-sheng-bin, cs4-thepaper-2016-02-18-msd]
    - h: 停偿与 2019 年的两名政委
      from: 2016-03
      to: 2019-12-28
      text: >-
        在 2016 年开始的停止有偿服务中，新华社说“国防动员系统所属省军区充分发挥桥梁纽带作用”，例如辽宁省军区把地方厅局的分管领导纳入停偿领导小组办公室，协调军地合同的解除。
        2019 年 9 月 3 日，国防动员部选举委员会接受海南省军区原政委叶青、江苏省军区原政委孟中康辞去全国人大代表；全国人大常委会代表资格审查委员会的报告说，两人都“因严重违纪，被责令辞去”代表职务，报告没有披露具体案情。
      cites: [cs4-xinhua-2019-07-10-paid-services, a01-npc-2019-12-28-report]
    - h: 部长与政委相继出局
      from: 2021-12
      to: 2026-08-03
      text: >-
        2021 年 12 月，空降兵出身的陆军副司令员刘发庆接替盛斌任国防动员部部长，2022 年当选二十届中央委员；维基百科记他不迟于 2025 年 11 月卸任。联合早报 2026 年 8 月列出的久未露面将领中包括他。本站未查到对刘发庆立案、免职或罢免的官方通报；台湾中共研究杂志社梳理，部长一职已由副部长张立克接任。
        政委王东海出身济南军区保卫部门，历任山东省军区政治部主任、副政委兼纪委书记，2018 年任国防动员部副部长，2021 年 12 月任政委，是十九届中央纪委委员。2026 年 1 月 26 日，国防动员部军人代表大会以涉嫌严重违纪违法罢免其全国人大代表，2 月 26 日全国人大常委会公告。
      cites: [k05-wiki-liu-faqing, k05-wiki-sheng-bin, k06-zaobao-2026-08-03-fifth-plenum-generals, cs4-iccs-411-acting-generals, f10-wiki-wang-donghai, a02-wikisource-npc-qualification-reports, f09-dw-2026-02-26-pla-deputies]
    - h: 省军区一线
      from: 2026-01-12
      to: 2026-02-26
      text: >-
        2026 年 1 月 12 日，青海省人大常委会公告，青海省军区军人代表大会罢免了省军区政委、青海省委常委杨龙溪的省人大代表职务，公告未说明原因。1 月 19 日，火箭军军人代表大会以涉嫌严重违纪违法罢免“湖北省军区原正职副司令员杨光”的全国人大代表，他此时已在火箭军任职。
        这些处理多以罢免人大代表的方式首次公开，本站未查到对杨龙溪的立案通报。从缺席和罢免记录观察军中清洗的方法，见《缺席与罢免》一文。
      cites: [a02-qinghai-2026-01-13-yang-longxi, a02-wikisource-npc-qualification-reports, f09-dw-2026-02-26-pla-deputies]
  editor:
    - text: >-
        第一轮省军区案件与郭徐案联系紧密：郭伯雄之子郭正钢在浙江省军区任职，新京报“政事儿”指出浙江省军区原司令员傅怡与他共事数年，黑龙江省军区副司令员张代新出自徐才厚起家的第 16 集团军。第二轮则直接触及国防动员部的部长和政委，官方没有公布任何派系或案情说明，外界也缺少可靠的归类。
      cites: [f09-rmzxw-2015-03-03-army-tigers, f09-hkcd-2016-07-12-guo-xu-tigers, a02-wikisource-npc-qualification-reports]
    - text: >-
        制度上，省军区的风险来自它的双重身份：主官兼任地方党委常委，又掌握军事用地、设施和物资。2016 年的转隶取消了大军区这一层，停偿又切断了对外经营的收入，但省军区与地方党政的结合并没有改变；国防动员部部长、政委在第二轮中相继出局后，这一系统的领导层同样处在调整之中。
      cites: [cs4-hkcd-2015-07-16-military-standing, cs4-chinacom-2016-03-11-sheng-bin, cs4-xinhua-2019-07-10-paid-services, cs4-iccs-411-acting-generals]
