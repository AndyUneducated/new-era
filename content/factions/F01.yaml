  basis: 胡锦涛时期两名军委副主席郭伯雄、徐才厚把持军队人事期间形成的部属网络
  summary: >-
    郭伯雄、徐才厚在胡锦涛时期任军委副主席近十年，分管军事和政治工作，掌握军队高级干部任免。2014年徐才厚被开除党籍，次年病逝；2015年郭伯雄被开除党籍，2016年被判无期徒刑。此后军方媒体反复要求彻底肃清郭徐流毒影响。澎湃新闻2017年转述的一篇军委国防动员部文章称，郭徐在位期间“表面五湖四海，背后拉帮结派”，搞小山头、小圈子，把谷俊山火箭般擢升为总后勤部副部长，甚至不惜改年龄、涂档案；其最突出的要害是严重违反军委主席负责制。习近平2016年的讲话也把郭伯雄、徐才厚与周永康、薄熙来、令计划并列为搞政治阴谋活动的人。郭徐因此成为少数被官方直接定性为结帮营私的军中网络。
  voices:
    - voice: official
      text: >-
        三是严重违反军委主席负责制。这是郭徐严重违纪违法最突出的要害。
      cite: f01-thepaper-2017-guo-xu
      quote: true
    - voice: official
      text: >-
        表面五湖四海，背后拉帮结派，搞‘小山头’‘小圈子’，在圈内不讲原则讲关系，开口‘哥们’、闭口‘伙计’
      cite: f01-thepaper-2017-guo-xu
      quote: true
  cites:
    - f01-thepaper-2017-guo-xu
    - b03-xinhua-2017-01-01-xi-6th-plenum

- id: rocket-equipment
  name: 火箭军与装备系统（2023–）
  en: Rocket Force and equipment purge
  aka: [火箭军窝案, 装备系统清查]
  frame: purged
  color: '#2f5d8a'
  from: 2023
  core: [li-shangfu, wei-fenghe, li-yuchao]
  basis: 2023年起因火箭军和武器装备采购腐败被清洗的将领，含两任国防部长
  summary: >-
    2023年7月，火箭军司令员李玉超、政委徐忠波被撤换，由新晋上将王厚斌、徐西盛接任，BBC称此举引发对这支掌管核武器部队进行清洗的猜测；同月军委装备发展部开始清查2017年10月以来装备采购招标评审中的违规问题。同年李尚福、魏凤和两任国防部长先后被立案，2024年6月二人被开除党籍，官方称李尚福严重污染军队装备领域政治生态，魏凤和信仰坍塌、忠诚失节。李尚福曾任装备发展部部长，魏凤和是首任火箭军司令员，两案把火箭军与装备系统连在一起。此后清查扩展到航天、兵器等军工央企，BBC引述博主说法称11家军工集团负责人被一网打尽。史宗瀚认为，对战略核武器的大量投资使一批军官在较少监督下腐化。这批人的共同点是职务领域而非人脉，外界并不把他们视为一个派系。
  voices:
    - voice: official
      text: >-
        李尚福身为党和军队高级领导干部，背弃初心使命、丧失党性原则，其行为辜负党中央、中央军委信任重托，严重污染军队装备领域政治生态和行业领域风气
      cite: f01-xinhua-2024-06-27-li-shangfu
      quote: true
    - voice: zh
      text: >-
        中国突然宣布更换解放军火箭军的两名领导人，引发有关北京对这一掌管中国核武器的精英部队进行清洗的猜测。
      cite: f01-bbc-2023-08-01-rocket-force
      quote: true
    - voice: scholar
      text: >-
        此前的火箭军窝案，是因近年对战略核武器大量投资涉及庞大资金，使一批军官在更少监督下腐化
      cite: b04-bbc-2025-10-nine-generals
      quote: true
  cites:
