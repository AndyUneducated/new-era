- id: zhou-clique
  name: 周永康系（石油、四川、政法）
  en: Zhou Yongkang network
  aka: [周系, 四川帮]
  frame: purged
  color: '#922b21'
  to: 2015
  core: [zhou-yongkang, jiang-jiemin, li-chuncheng, li-dongsheng, zhou-benshun]
  basis: 周永康在石油、四川、公安政法三段仕途及其秘书圈中培植的部属
  summary: >-
    周永康的仕途横跨石油、四川和政法三个系统，每个阶段都留下部属。央广网2015年称，他形成了四川系、石油帮、政法系、秘书帮等团团伙伙，李东生、郭永祥、王永春、蒋洁敏、李春城、冀文林等是重要成员。十八大后，从成都市委书记李春城起，四川、石油、政法三线的亲信在一年多内纷纷被查，BBC称周永康的羽翼被一层层剪除。2014年7月周永康本人被立案，成为首位因违纪被查的前政治局常委；2015年6月他以受贿、滥用职权和故意泄露国家秘密罪被判无期徒刑。判决书称他要求蒋洁敏、李春城为其子周滨经营提供帮助，造成公共财产损失14.86亿余元。这是习近平反腐中少数被官方媒体明确按“系”和“帮”描述的网络。
  voices:
    - voice: official
      text: >-
        起自大庆油田六七三厂地质队的周永康，仕途生涯历经中石油总经理、四川省委书记、公安部部长、中央政法委书记等重要岗位，其几乎在每一个仕途阶段，都有不少“门徒”，形成了四川系、石油帮、政法系、秘书帮等团团伙伙。
      cite: b03-cnr-2015-10-15-zhou-disciples
      quote: true
    - voice: zh
      text: >-
        一年时间内，周永康在四川、石油和政法系统的亲信人马纷纷因“严重违纪”而下台受调查。
      cite: b03-bbc-2015-06-11-zhou-profile
      quote: true
    - voice: zh
      text: >-
        官方媒体没有透露周永康涉及什么“违纪”事件，但不少媒体及外媒不时透过消息发放关于周永康与其关系良好的“石油帮”、“政法系统”、“四川帮”等官员，尤其是涉及薄熙来的关连消息。
      cite: f01-bbc-2014-07-30-zhou-analysis
      quote: true
  cites:
    - b03-cnr-2015-10-15-zhou-disciples
    - b03-bbc-2015-06-11-zhou-profile
    - f01-bbc-2014-07-30-zhou-analysis

- id: xishanhui
  name: 西山会（令计划与山西官员）
  en: Xishan Society
  aka: [西山会, 山西帮]
  frame: purged
  color: '#c26a1b'
  from: 2007
  to: 2015
  core: [ling-jihua, liu-tienan]
  basis: 进入或候补进入中央委员会的山西籍官员的饭局圈子，以令计划为首
  summary: >-
    调查记者罗昌平在举报刘铁男的网络书《打铁记》中披露，不晚于2007年，一个由进入或候补进入中央委员会的山西籍官员组成的高官圈子“西山会”悄然成型，以山西平陆籍的中办主任令计划为首。罗昌平称，令计划是这个圈子名副其实的“党鞭”，谁拿到西山饭局的门票，就像坐上了权力晋级的直梯；原发改委副主任刘铁男即借此仕途畅达，令计划还召集过三次拉票饭局。法广转述罗昌平的判断：西山会虽然并非明确的政党，但实际已有派系之分。2012年令计划被调离中办；2013年刘铁男落马，2014年起山西官场塌方式腐败，令计划本人2014年12月被查，2016年被判无期徒刑。这一说法主要来自罗昌平的叙述，官方从未使用西山会的名称。
  voices:
    - voice: zh
      text: >-
        不晚于2007年，一个名叫“西山会”的高官圈子悄然成型，由进入或候补进入中委的山西籍官员组成。
      cite: f01-rfi-2013-10-15-xishanhui
      quote: true
    - voice: zh
      text: >-
        罗昌平认为，西山会虽然并非明确的政党，但实际已有派系之分，具备高度的身份认同感，存在一致的政治目标。
      cite: f01-rfi-2013-10-15-xishanhui
      quote: true
  cites:
    - f01-rfi-2013-10-15-xishanhui
    - f01-bbc-2014-12-22-ling-jihua

