- id: army-princelings
  name: 军中太子党
  en: Military princelings
  aka: [军中红二代]
  frame: army
  color: '#556b2f'
  core: [zhang-youxia, liu-yuan, liu-yazhou]
  basis: 出身中共元老家庭的将领
  summary: >-
    指出身中共元老家庭的将领。刘少奇之子刘源曾任总后勤部政委，美国之音称他是太子党中的顶级人物，但在郭伯雄、徐才厚落马后，他未能进入军委，随后退出军界。李先念的女婿刘亚洲曾任国防大学政委，2024年被确认判处重刑，美国之音称这标志着习近平与曾帮助他稳固大位的红二代、太子党彻底决裂。张宗逊之子张又侠被称为习近平执政团队中硕果仅存的太子党，2022年超龄留任军委副主席，2026年也被开除党籍。薄智跃认为，习近平已基本清除了来自太子党、尤其是军中太子党的潜在竞争者。至此，军中太子党在军委层面已无人留任。
  voices:
    - voice: zh
      text: >-
        刘源曾经担任解放军军事科学院和总后勤部的政委，是“太子党”中的顶级人物。
      cite: c05-voa-2024-04-04-princelings
      quote: true
    - voice: zh
      text: >-
        在习近平的执政团队中，硕果仅存的“太子党”就是张又侠，尽管已经超龄，仍然留任中央军委副主席。
      cite: c05-voa-2024-04-04-princelings
      quote: true
    - voice: scholar
      text: >-
        He has practically eliminated his potential competitors from princelings (especially military princelings such as General Liu Yuan and General Liu Yazhou) and from the Youth League group such as Li Yuanchao, Liu Qibao and Lu Hao.
      zh: 他实际上已经清除了来自太子党（尤其是刘源上将、刘亚洲上将等军中太子党）和团派（如李源潮、刘奇葆、陆昊）的潜在竞争者。
      cite: f01-thinkchina-2022-09-27-factions
      quote: true
  cites:
    - c05-voa-2024-04-04-princelings
    - f01-thinkchina-2022-09-27-factions
    - f01-dw-2026-01-26-zhang-youxia

- id: fujian-generals
  name: 东南系 / 第 31 集团军旧部
  en: Southeast clique / 31st Group Army
  aka: [31军系, 东南军, 东南-政工系]
  frame: army
  color: '#2f7f6f'
  to: 2025-10
  core: [he-weidong, miao-hua, lin-xiangyang, qin-shutong, wang-xiubin]
  basis: 出身驻福建厦门的原南京军区第31集团军，习近平在闽期间多次视察的部队
  summary: >-
    第31集团军军部驻福建厦门同安，习近平1985至2002年在福建工作期间曾14次视察该部队。2015年军改后，一批31军出身的将领火速晋升：苗华2017年任军委政治工作部主任，何卫东由东部战区司令员破格升任军委副主席，林向阳、秦树桐、王秀斌等也升任上将，BBC称“31军”成为习近平时代军内一个显著的派系标签。海外观察者常把军中斗争描述为张又侠为首的“西北-装备系”与苗华、何卫东为核心的“东南-政工系”之争。2024年苗华被停职；2025年10月，何卫东、苗华、林向阳、秦树桐、王秀斌等九名上将同时被开除党籍，何卫东由此成为落马的在任军委副主席。史宗瀚认为，其中一些人不只因为腐败，而是变得太有野心。
  voices:
    - voice: zh
      text: >-
        随着与 31 军有关的派系在军改之后强势崛起，“31 军”也成为习近平时代军队内部一个显著的“派系标签”。
      cite: b04-bbc-2025-10-nine-generals
      quote: true
    - voice: zh
      text: >-
        一方是张又侠为首的“西北-装备系”，包括李尚福等人；另一方是苗华、何卫东为核心的“东南-政工系”，扎根福建第31集团军。
      cite: f01-bbc-2026-01-27-zhang-youxia
      quote: true
    - voice: scholar
      text: >-
        但还有些人不仅因腐败，而是变得太有野心
      cite: b04-bbc-2025-10-nine-generals
      quote: true
  cites:
    - b04-bbc-2025-10-nine-generals
    - f01-bbc-2026-01-27-zhang-youxia

- id: equipment-system
  name: 总装 / 装备发展部系
  en: General Armament / Equipment Development Department network
  aka: [总装系, 装备系, 西北-装备系]
  frame: army
  color: '#2f5d8a'
  core: [zhang-youxia, li-shangfu]
  basis: 原总装备部及其后身军委装备发展部的历任领导和部属
  summary: >-
    原总装备部设于1998年，负责全军武器装备的发展计划、科研试验和订购，还管载人航天和卫星发射，2016年军改后改为军委装备发展部。德国之声称，这个部门掌握上万亿的武器装备采购权，长期被视为军中油水极丰厚的肥缺，外部难以监督。张又侠2012至2017年任总装备部和装备发展部部长，继任者李尚福曾是他的副手，后升任国防部长。BBC称海外观察者把张又侠、李尚福一系称为“西北-装备系”，与以31集团军为根基的“东南-政工系”相对。2023年起的调查先拿下李尚福和一批军工企业负责人，牛犇认为张又侠也是被卷入装备采购系统的腐败丑闻而倒台。装备系是否构成派系主要来自外部观察，官方只称李尚福“严重污染军队装备领域政治生态”。
  voices:
    - voice: zh
      text: >-
        由于解放军原总装备部（现中央军委装备发展部）掌握上万亿的武器装备采购权，长期被视为军中“油水”极丰厚的“肥缺”部门，极易产生腐败，特别是在航天、兵器工业等领域。
      cite: f01-dw-2026-01-26-zhang-youxia
      quote: true
    - voice: scholar
      text: >-
        牛犇认为最可能的解释是，张又侠被卷入了过去几年震动装备采购系统的腐败丑闻，这也是李尚福落马的原因。
      cite: f01-bbc-2026-01-27-zhang-youxia
      quote: true
  cites:
    - f01-dw-2026-01-26-zhang-youxia
    - f01-bbc-2026-01-27-zhang-youxia
    - f01-xinhua-2024-06-27-li-shangfu

- id: northwest-army
  name: 西北军系（原兰州军区）
  en: Northwest army clique
  aka: [西北系, 西北帮]
  frame: army
  color: '#a0522d'
  core: [zhang-youxia, fang-fenghui]
  basis: 以陕西籍和西北出身为纽带的将领，部分源于父辈在西北野战军的渊源
  summary: >-
    “西北”在中共军史中指以高岗、刘志丹、习仲勋为首的陕甘根据地，以及彭德怀的西北野战军。张又侠之父张宗逊曾任西北野战军副司令员，与副政委习仲勋是陕西同乡和世交，美国之音称两家同属“陕北帮”或“西北帮”；BBC也称两人的父辈都是陕西籍的西北军领袖。习近平时代，海外观察者把以张又侠为首、包括李尚福在内的一派称为“西北-装备系”；杨光的文章则把陕籍上将张又侠、房峰辉列为颇受习近平信任的“陕军”。房峰辉长期在兰州军区任职，后升任联合参谋部参谋长，2019年被判无期徒刑；张又侠2026年被开除党籍。这一标签的边界并不清楚：它有时指陕西籍将领，有时指原兰州军区出身者，常与装备系、陕西帮重叠。
  voices:
    - voice: zh
      text: >-
        他们同属以高岗、刘志丹、习仲勋为首的“陕北帮”或者“西北帮”。
      cite: c05-voa-2024-04-04-princelings
      quote: true
    - voice: zh
      text: >-
        两人的父辈是革命战友，都是陕西籍的西北军领袖。
      cite: f01-bbc-2026-01-27-zhang-youxia
      quote: true
    - voice: zh
      text: >-
        陕籍上将张又侠、房峰辉虽年龄偏大，亦颇受习近平信任
      cite: f01-rfa-2019-02-22-shaanxi
      quote: true
  cites:
    - c05-voa-2024-04-04-princelings
    - f01-bbc-2026-01-27-zhang-youxia
    - f01-rfa-2019-02-22-shaanxi
