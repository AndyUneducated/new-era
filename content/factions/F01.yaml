- id: zhang-liu
  name: 张又侠、刘振立案（2026）
  en: Zhang Youxia–Liu Zhenli case
  aka: [张又侠案]
  frame: purged
  color: '#8b5e3c'
  from: 2026-01
  core: [zhang-youxia, liu-zhenli]
  basis: 2026年同案被查的军委副主席张又侠与联合参谋部参谋长刘振立
  summary: >-
    2026年1月24日，国防部宣布中央军委副主席张又侠、联合参谋部参谋长刘振立涉嫌严重违纪违法，经党中央研究被立案审查调查；9月21日二人被开除党籍、军籍，官方通报称他们搞团团伙伙，对党不忠诚不老实，涉案金额特别巨大。张又侠是解放军最高现役将领、习近平的红二代陕西老乡，两家父辈同在西北野战军，曾被视为习近平最信任的世交。牛犇对BBC指出，“经党中央研究”的措辞在军队清洗公告中前所未有，张又侠长期掌管的装备采购系统正是腐败丑闻的震中；前中情局分析师韦德宁则认为，张又侠在摧毁何卫东的派系之后在军中权势滔天。纽约时报称，此后军委只剩习近平和张升民两人。“团团伙伙”的定性说明，此案不只被当作贪腐，而是被当作派系问题处理。
  voices:
    - voice: official
      text: >-
        经查，张又侠、刘振立背弃初心使命、与党离心离德、丧失党性原则、逾越红线底线，严重违反政治纪律和政治规矩，搞团团伙伙，对党不忠诚不老实
      cite: f01-xinhua-2026-09-21-zhang-liu
      quote: true
    - voice: scholar
      text: >-
        他长期掌管解放军装备采购系统——这正是腐败丑闻的“震中”。
      cite: f01-bbc-2026-01-27-zhang-youxia
      quote: true
    - voice: zh
      text: >-
        随着这两名将领（张又侠、刘振立，编者）实际上被撤职，中央军委只剩下两名成员：主席习近平以及负责监督习近平军队清洗行动的张升民将军
      cite: f01-dw-2026-01-26-zhang-youxia
      quote: true
  cites:
