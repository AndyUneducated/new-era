# --- classic ---
- id: conservatives
  name: 保守派（李鹏、陈云系）
  en: Conservatives (Chen Yun–Li Peng line)
  aka: [保守派, 陈云派, 陈派]
  frame: classic
  color: '#5c5470'
  core: [li-peng]
  basis: 改革开放时期主张中央计划和意识形态控制、对市场化改革持保留态度的元老与其提拔的干部
  summary: >-
    指改革开放时期中共党内主张维持中央计划和意识形态控制、对市场化改革持保留态度的一派，通常以陈云为代表，李鹏被视为其在国务院的代表人物。1987年《洛杉矶时报》报道李鹏出任代总理时称，这一任命被普遍视为以邓小平为中心的改革派与较正统的元老之间达成的妥协，李鹏被视为陈云的门生，而陈云是邓小平、赵紫阳市场化改革最有力的批评者。BBC称李鹏政绩平平，但获得以陈云为代表的中共保守派鼎力扶持。1989年学运期间，李鹏被普遍视为政府中的保守派代表人物之一，支持邓小平的镇压立场，并以总理身份签署戒严令；1993年他以88.63%的得票率连任总理。纽约时报中文网一篇评论把“六四”前的高层分为赵紫阳为代表的改革派、陈云为代表的保守派和邓小平为代表的有限改革派，认为邓最终与更保守的陈派联手。2002年李鹏的亲信罗干进入政治局常委会，《南华早报》称李鹏有意栽培罗干作为自己在常委会中的代理人，但罗干未能出任中纪委书记，说明李鹏的影响力正在减弱。
  voices:
    - voice: west
      text: >-
        Li is also considered a protege of Chen Yun, 82, the ailing central planner who stepped down from the Politburo at a party congress that concluded early this month.
      zh: 李鹏也被视为陈云的门生。陈云现年82岁，是一位抱病的中央计划经济主导者，已在本月初闭幕的党代会上退出政治局。
      cite: f03-latimes-1987-11-25-li-peng
      quote: true
    - voice: zh
      text: >-
        他的政绩平平，但获得以陈云为代表的中共保守派鼎力扶持。
      cite: b01-bbc-2019-07-23-li-peng-obit
      quote: true
    - voice: zh
      text: >-
        “六四”之前中国内部其实存在三种政治力量的博弈，一是以赵紫阳为代表的具有民主倾向的改革派；二是以陈云为代表的固守专制制度的保守派
      cite: f03-nytcn-2019-04-16-tiananmen-today
      quote: true
  cites:
    - f03-latimes-1987-11-25-li-peng
    - b01-bbc-2019-07-23-li-peng-obit
    - f03-dw-2019-07-23-li-peng
    - f03-nytcn-2019-04-16-tiananmen-today
    - b03-scmp-2002-11-16-luo-gan
    - f01-bbc-2002-11-15-new-team

# --- xi ---
- id: hebei-zhengding
  name: 河北 / 正定旧部
  en: Hebei / Zhengding associates
  aka: [河北帮, 正定旧部]
  frame: xi
  color: '#9c6644'
  from: 1982
  core: [li-zhanshu]
  basis: 习近平1982至1985年在河北正定县任职期间结识的同僚
  summary: >-
    习近平1982至1985年先后任河北正定县委副书记、书记，这是他从政的起点。同一时期栗战书任毗邻的无极县委书记，两县同属石家庄地区，BBC称两地相距约30公里。布鲁金斯学会称两人由此建立起良好的工作关系和延续三十多年的友谊；联合早报称这短短两年为栗战书后来的政治生涯作了铺垫，也是外界判断他属于习家班嫡系的主要依据。栗战书后来出任中办主任并进入政治局常委会。吴国光把习近平时代新晋的高层精英按与习的关系分为七类，河北是其中之一。不过，现有资料中这一派系几乎只指栗战书一人；2012年法广还称栗战书是团派人马，同时提到他与习近平在河北相熟。
  voices:
    - voice: scholar
      text: >-
        Their friendship began over three decades ago, when Xi served as deputy party secretary and then party secretary of Zhengding County in Hebei from 1982 to 1985.
      zh: 两人的友谊始于三十多年前，当时习近平在1982至1985年间先后任河北正定县委副书记、书记。
      cite: f01-brookings-2017-new-politburo
      quote: true
    - voice: zh
      text: >-
        这短短两年为栗战书后来的政治生涯发挥了重要铺垫作用，也成为外界判断他是“习家班”嫡系人马的主要依据。
      cite: b05-zaobao-2017-10-23-li-zhanshu
      quote: true
    - voice: zh
      text: >-
        根据资料，栗战书是团派人马，当然得胡锦涛支持，但栗上世纪80年代曾在河北无极县任书记，传与在毗邻的正定县书记习近平相熟
      cite: b05-rfi-2012-09-02-li-zhongban
      quote: true
  cites:
    - f01-brookings-2017-new-politburo
    - b05-zaobao-2017-10-23-li-zhanshu
    - b05-bbc-2018-03-20-li-zhanshu-npc
    - f02-orf-2021-xi-gang
    - b05-rfi-2012-09-02-li-zhongban

# --- purged ---
- id: sun-lijun-gang
  name: 孙力军政治团伙
  en: Sun Lijun political clique
  aka: [孙力军团伙, 孙力军政治团伙案, 政法虎]
  frame: purged
  color: '#34495e'
  to: 2022-09
  core: [sun-lijun, fu-zhenghua]
  basis: 经公安部原副部长孙力军举荐、提拔或与之结伙的公安政法官员，官方通报直接以“政治团伙”定性
  summary: >-
    孙力军曾任公安部副部长，2020年4月被查，2021年9月被开除党籍和公职，官方通报称他在党内大搞团团伙伙、拉帮结派、培植个人势力，形成利益集团，成伙作势控制要害部门。2022年1月，中纪委专题片《零容忍》称孙力军政治团伙案是政治问题和经济问题交织的典型，并点名紧随其后被查处的龚道安、邓恢林、王立科、刘新云：龚道安为孙力军效命，还向他推荐了邓恢林；刘新云则是孙力军物色到的又一个自己人。2022年3月傅政华、9月刘彦平被开除党籍时，通报都写明其参加孙力军政治团伙；王立科的判决认定他曾多次向孙力军等人行贿。2022年9月下旬，龚道安、邓恢林、刘新云分别被判无期徒刑和15年、14年有期徒刑，傅政华、孙力军被判死缓，判决明确两人必须终身监禁。德国之声称此案被中共视为十九大以来最严重的案件。邓聿文指出，这样的政治指控在被查处官员中相当罕见，掌握刀把子的人抱团本身就为当政者所不容；滕彪则认为，二十大前夕的审判意在向潜在的政治对手释放信号。
  voices:
    - voice: official
      text: >-
        孙力军政治团伙案是政治问题和经济问题交织、极度腐化堕落的典型。孙力军搞团团伙伙、拉帮结派、培植个人势力，形成利益集团，严重危害政治安全。
      cite: f03-xinhua-2022-01-15-zero-tolerance
      quote: true
    - voice: zh
      text: >-
        也许他们并非对习不忠，然而，这样一些掌握刀把子的人抱团会做出什么事情来，任何一个当政者都是会戒备的，何况对树敌众多的习。
      cite: f03-dw-2022-01-18-deng-yuwen
      quote: true
    - voice: scholar
      text: >-
        在二十大前夕审判傅政华和孙力军，反映中共党内权力斗争加剧，习近平意图给潜在的政治对手释放一些信号，让他们不敢轻举妄动。
      cite: f03-bbc-2022-09-27-fu-sun
      quote: true
  cites:
    - c03-ccdi-2021-09-30-sun-lijun-expel
    - f03-xinhua-2022-01-15-zero-tolerance
    - c03-ccdi-2022-03-31-fu-zhenghua-expel
    - c03-people-2022-09-01-liu-yanping-expel
    - c03-xinhua-2022-09-22-wang-like-verdict
    - f03-dw-2022-01-18-deng-yuwen
    - f03-dw-2022-07-15-fu-zhenghua
    - f03-cna-2022-09-23-sun-lijun
    - f03-bbc-2022-09-27-fu-sun

- id: he-miao
  name: 何卫东、苗华案（2024–）
  en: He Weidong–Miao Hua case
  aka: [九上将案, 何卫东苗华案]
  frame: purged
  color: '#1e6f5c'
  from: 2024-11
  core: [he-weidong, miao-hua]
  basis: 2025年10月同案被开除党籍的九名上将，以苗华主管军队人事、何卫东任军委副主席时期的部属关系为纽带
  summary: >-
    2024年11月，军委政治工作部主任苗华被停职调查；2025年3月全国两会后，军委副主席何卫东不再公开露面。詹姆斯敦基金会当年4月就指出，何卫东与已落马的唐勇、苗华同出南京军区，习近平可能认为他们的崛起带有派系和任人唯亲的成分。2025年10月17日，国防部宣布何卫东、苗华、何宏军、王秀斌、林向阳、秦树桐、袁华智、王厚斌、王春宁九人被开除党籍、军籍。詹姆斯敦基金会的分析称，九人似乎形成了一个以苗华、何卫东为中心的不当网络：七人曾在东部战区辖区任职，何卫东、苗华、林向阳长期在原第31集团军；除何卫东、王春宁外，其余六人都是在苗华主管全军人事期间由少将升为上将。BBC指出，何宏军、袁华智、王厚斌三人不在31军出身者之列，而是苗华在兰州军区、海军和政治工作部的下属或旧部。这份名单与东南系 / 第31集团军旧部大半重合，但还包括海军和政工系统出身、与苗华关系密切的将领。史宗瀚认为，他们试图建立的权力基础威胁到军内权力平衡；韦德宁则认为，何卫东的派系被摧毁后，张又侠在军中权势滔天，直到2026年他本人也落马。
  voices:
    - voice: official
      text: >-
        对何卫东、苗华、何宏军等人的严肃查处，再次表明了党中央、中央军委将反腐败斗争进行到底的坚定决心
      cite: b08-mod-2025-10-17-nine-generals
      quote: true
    - voice: scholar
      text: >-
        The nine appear to have formed an improper network centered around Miao Hua and He Weidong.
      zh: 这九人似乎形成了一个以苗华和何卫东为中心的不当网络。
      cite: b08-jamestown-2025-10-cronyism
      quote: true
    - voice: scholar
      text: >-
        他们试图建立威胁军内权力平衡的权力基础，所以陷入麻烦。
      cite: b04-bbc-2025-10-nine-generals
      quote: true
  cites:
    - b08-mod-2025-10-17-nine-generals
    - b08-jamestown-2025-10-cronyism
    - b08-jamestown-2025-04-he-weidong
    - b04-bbc-2025-10-nine-generals
    - f02-dw-2025-10-20-nine-generals
    - f01-bbc-2026-01-27-zhang-youxia

# --- army ---
- id: southwest-army
  name: 西南军系（原成都军区、第 14 集团军）
  en: Southwest army clique / 14th Group Army
  aka: [西南军, 14集团军系]
  frame: army
  color: '#3d7a3a'
  core: [zhang-youxia]
  basis: 出身长期驻守西南、军部设在昆明的原第14集团军的将领
  summary: >-
    原第14集团军的前身是抗日战争时期的山西青年抗敌决死队，1949年组成第14军，此后长期驻守西南，号称“丛林猛虎”，1985年改编为第14集团军。香港《明报》2018年的评论称，与郭伯雄、徐才厚代表的西北军、东北军没落形成对照，解放军近年崛起东南军和西南军两大势力，西南军即原14集团军（现陆军75集团军）。该军军部设在昆明，是1979年中越战争的主力；薄熙来2012年垮台前夕曾走访这支由其父薄一波创建的部队，被指有意染指军队。张又侠1968至1994年在第14集团军第40师从战士升至师长，1979年和1984年两次参加对越作战；《明报》称他升任军委副主席后，该军出身的将领再获青睐，并点名东部战区政委何平。现有资料中，西南军的说法主要来自这篇《明报》评论，点名的也只有张又侠、何平二人；BBC等则把张又侠列为西北-装备系之首。
  voices:
    - voice: zh
      text: >-
        出身原14集团军的高级将领则有中央军委副主席张又侠、东部战区政委何平等。
      cite: f02-rfi-2018-10-25-southeast-army
      quote: true
    - voice: zh
      text: >-
        惟出身该军的张又侠升任军委副主席后，该军出身的将领再获青睐。
      cite: f02-rfi-2018-10-25-southeast-army
      quote: true
    - voice: official
      text: >-
        新中国成立后第14军长期驻守在祖国西南，号称“丛林猛虎”。
      cite: f03-xinhua-2017-04-28-18-armies
      quote: true
  cites:
    - f02-rfi-2018-10-25-southeast-army
    - f03-xinhua-2017-04-28-18-armies
    - b08-dw-2026-01-zhang-who
    - f01-bbc-2026-01-27-zhang-youxia

- id: dongbei-army
  name: 东北军系（原沈阳军区）
  en: Northeast army clique (Shenyang MR)
  aka: [东北军, 东北系, 沈阳军区系]
  frame: army
  color: '#466d8f'
  core: [xu-caihou]
  basis: 原沈阳军区出身的将领，常被视为徐才厚的权力基础
  summary: >-
    指原沈阳军区出身或与之关系密切的将领，通常与徐才厚联系在一起。徐才厚曾任军委副主席，《南华早报》和詹姆斯敦基金会都称沈阳军区是他的权力基础。徐才厚落马后，2014年沈阳、兰州两大军区高层出现人事变动；詹姆斯敦基金会的文章称，习近平对与沈阳军区有关的高级将领心存戒备，转而提拔南京军区出身者。香港《明报》2018年的评论把郭伯雄、徐才厚分别与西北军（原兰州军区）、东北军（原沈阳军区）对应，称两系均已没落。不过《南华早报》把兰州、沈阳两大军区都算作徐才厚的权力基础，与把兰州归于郭伯雄的说法并不一致。张又侠2007至2012年曾任沈阳军区司令员，但BBC把他列为西北-装备系之首，《明报》则把他算作原14集团军出身，都没有把他归入东北军。
  voices:
    - voice: scholar
      text: >-
        By contrast, Xi views with suspicion senior officers associated with the Shenyang MR, which was the power base of General Xu, and those with links to the Lanzhou MR, which is deemed a bastion of the influence of another former CMC vice-chairman and Politburo member, General Guo Boxiong.
      zh: 与此相反，习近平对与沈阳军区（徐才厚上将的权力基础）有关的高级将领心存戒备，对与兰州军区（被视为另一位前军委副主席、政治局委员郭伯雄上将的势力堡垒）有关的将领也是如此。
      cite: f03-jamestown-2015-01-nanjing-alumni
      quote: true
    - voice: west
      text: >-
        Recent changes in the senior ranks have taken place in the Lanzhou and Shenyang military commands, the power bases of Xu Caihou.
      zh: 近期的高层人事变动发生在兰州和沈阳两大军区，这两地都是徐才厚的权力基础。
      cite: f03-scmp-2014-10-01-xu-associates
      quote: true
    - voice: zh
      text: >-
        与郭伯雄、徐才厚代表的西北军（原兰州军区）、东北军（原沈阳军区）的没落形成鲜明对照
      cite: f02-rfi-2018-10-25-southeast-army
      quote: true
  cites:
    - f03-jamestown-2015-01-nanjing-alumni
    - f03-scmp-2014-10-01-xu-associates
    - f02-rfi-2018-10-25-southeast-army
    - b08-dw-2026-01-zhang-who
    - f01-bbc-2026-01-27-zhang-youxia
