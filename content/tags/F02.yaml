    zh: '年轻一辈的张（又侠）与习，如今分别75岁和72岁，都是“太子党”——指受益于家庭关系的革命领导人子女'
  - f: jiang-shanghai
    cite: f02-brookings-2017-pb
    quote: 'Xi Jinping is widely considered to be a protégé of both former PRC president Jiang Zemin and former PRC vice-president Zeng Qinghong'
