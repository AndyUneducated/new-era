  - f: jiang-shanghai
    cite: f02-orf-2021-xi-gang
    quote: 'Xi, a member of the Shanghai Gang had replaced Hu, the leader of the CCYL'
    zh: '身为上海帮成员的习接替了团派领袖胡（锦涛）'

