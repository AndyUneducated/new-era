# F02: faction labels for Xi-era leaders, generals and the fallen of 2012–2026. person id → labels.
# Every quote is the sentence in the cited source that makes the label.

xi-jinping:
  - f: princelings
    cite: f02-brookings-2017-pb
    quote: 'Xi is a princeling, the son of Xi Zhongxun'
    zh: '习近平是太子党，是习仲勋之子'
  - f: princelings
    cite: f02-reuters-2012-11-princelings-factbox
    quote: 'Below are some of the high and low points of the princelings...Current party chief Xi Jinping, a son of late vice premier Xi Zhongxun'
    zh: '以下是太子党们的一些高光与低谷……现任党的总书记习近平，已故副总理习仲勋之子'
