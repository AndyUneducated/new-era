# --- hebei-zhengding ---
li-zhanshu:
  - f: hebei-zhengding
    cite: f01-brookings-2017-new-politburo
    quote: 'Their friendship began over three decades ago, when Xi served as deputy party secretary and then party secretary of Zhengding County in Hebei from 1982 to 1985. Li Zhanshu served as party secretary of Wuji County in the same province during roughly the same period'
    zh: '两人的友谊始于三十多年前，当时习近平在1982至1985年间先后任河北正定县委副书记、书记，栗战书大致同期在同省的无极县任县委书记'
  - f: hebei-zhengding
    cite: f02-orf-2021-xi-gang
    quote: 'Substantively, Xi’s political career began working in the suburban county of Zhengding, in the province of Hebei. Here Xi developed a close friendship with Li Zhanshu'
    zh: '实质上，习近平的政治生涯始于河北省的郊县正定。他在这里与栗战书结下了密切的友谊'
  - f: hebei-zhengding
    cite: b05-zaobao-2017-10-23-li-zhanshu
    quote: '1983年至1985年，他在河北省无极县担任县委书记，现任中共总书记习近平当时就在毗邻的正定县担任县委书记，两人在工作上有一定交集'
  - f: hebei-zhengding
    cite: b05-bbc-2018-03-20-li-zhanshu-npc
    quote: '1983年至1985年期间，栗战书在河北省无极县担任书记期间，习近平在30公里外的河北正定县任县委书记'

