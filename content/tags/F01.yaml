  - f: princelings
    cite: f01-voa-2022-10-24-xi-jiajun
    quote: '习近平是中共老一代领导人之一习仲勋之子，因此被称为“太子党”'
  - f: elitist
    cite: f01-brookings-zh-team-of-rivals
    quote: '第五代领导中的“精英派”核心成员包括习近平、副总理王岐山和重庆市委书记薄熙来'
  - f: elitist
    cite: f01-brookings-2013-02-10-princelings
