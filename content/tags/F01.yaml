# F01: classic and binary labels (江派/上海帮, 团派, 太子党, 石油帮, 政法系, 精英联盟, 民粹联盟) for 15th–18th Politburo and Hu-era figures.
# Every quote is the sentence in the cited source that makes the label. Quotes from the two BBC 2012 pages skip quoted terms
# with …… because the source stores the quote marks as control characters.

# --- 江泽民、胡锦涛、温家宝 ---
jiang-zemin:
  - f: jiang-shanghai
    cite: f01-bbc-2002-11-16-jiang-shadow
    quote: '从江泽民坐上了中共第一把交椅开始，“上海帮”也就开始形成聚拢了'
  - f: jiang-shanghai
    cite: f01-bbc-2012-09-22-xi-factions
    quote: '由前任中共总书记江泽民率领的……上海帮'
  - f: jiang-shanghai
    cite: f01-bbc-2022-10-28-pb-24
    quote: '如“上海帮”，指江泽民提拔曾在上海的僚属'
  - f: jiang-shanghai
    cite: f01-reuters-2022-10-26-youth-league
    quote: 'They famously included the so-called "Shanghai Gang" of former leader Jiang Zemin, who is now 96'
    zh: '其中著名的有前领导人江泽民（现年96岁）的所谓“上海帮”'
  - f: elitist
    cite: f01-brookings-2013-02-10-princelings
    quote: 'the “elitist coalition,” which emerged in the Jiang Zemin era and used to be headed by Jiang and is currently led by Xi Jinping'
    zh: '“精英联盟”在江泽民时代兴起，曾由江泽民领导，现由习近平领导'

hu-jintao:
  - f: populist
    cite: f01-brookings-2009-one-party-two-coalitions
    quote: 'The Populist Coalition is currently led by President Hu Jintao and Premier Wen Jiabao'
    zh: '民粹联盟目前由胡锦涛主席和温家宝总理领导'
  - f: populist
    cite: f01-brookings-zh-team-of-rivals
    quote: '“平民派”目前由胡锦涛主席和温家宝总理领导'
  - f: populist
    cite: f01-brookings-2012-11-powerful-factions
    quote: 'One of the two intra-party groups in China is the “populist coalition”, which is led by President Hu Jintao and Premier Wen Jiabao'
    zh: '中国党内两大群体之一是“民粹联盟”，由胡锦涛主席和温家宝总理领导'
  - f: populist
    cite: f01-bbc-2012-11-06-cheng-li-factions
    quote: '这两派之一是以胡锦涛和温家宝为首的……民粹主义者联盟'
  - f: populist
    cite: f01-voa-2012-05-25-factions
    quote: '一派是胡锦涛领导的民粹联盟'
  - f: tuanpai
    cite: f01-brookings-zh-team-of-rivals
    quote: '团派的领导人都被视为胡锦涛的心腹，胡锦涛本人也是团派的一员'
  - f: tuanpai
    cite: f01-bbc-2012-09-22-xi-factions
    quote: '由中共总书记兼国家主席胡锦涛所领导的……共青团派'
  - f: tuanpai
    cite: f01-bbc-2022-10-28-pb-24
    quote: '再比如“团派”，指共青团出身的高官，如胡锦涛、李克强、胡春华等'
  - f: tuanpai
    cite: f01-reuters-2022-10-26-youth-league
    quote: 'Xi''s predecessor, Hu Jintao, who is 79 and a Youth League veteran'
    zh: '习近平的前任、79岁的共青团元老胡锦涛'

wen-jiabao:
  - f: populist
    cite: f01-brookings-2009-one-party-two-coalitions
    quote: 'The Populist Coalition is currently led by President Hu Jintao and Premier Wen Jiabao'
    zh: '民粹联盟目前由胡锦涛主席和温家宝总理领导'
  - f: populist
    cite: f01-brookings-zh-team-of-rivals
    quote: '“平民派”目前由胡锦涛主席和温家宝总理领导'
  - f: populist
    cite: f01-bbc-2012-11-06-cheng-li-factions
    quote: '这两派之一是以胡锦涛和温家宝为首的……民粹主义者联盟'

# --- 16th–17th Standing Committee ---
zeng-qinghong:
  - f: jiang-shanghai
    cite: f01-bbc-2002-11-15-psc-profiles
    quote: '曾庆红：63岁，过去10年来一直是江泽民最信赖的左右手'
  - f: princelings
    cite: f01-bbc-2012-09-22-xi-factions
    quote: '同样身为……太子党……的曾庆红据称在促成习近平被选为继任领导人上担当着关键角色'

wu-bangguo:
  - f: jiang-shanghai
    cite: f01-bbc-2002-11-15-psc-profiles
    quote: '吴邦国：61岁，政治局委员，国务院副总理。被视为是江泽民的亲信'
  - f: jiang-shanghai
    cite: f01-voa-2012-11-04-who-is-who
    quote: '入常前曾任上海市委书记和副总理，被认为有“江派”背景'
  - f: jiang-shanghai
    cite: f01-brookings-2013-02-10-princelings
    quote: 'Wu Bangguo, the second-highest ranking leader in the previous PSC and a heavyweight leader in the Jiang camp'
    zh: '吴邦国，上届政治局常委中排名第二的领导人，江派的重量级人物'
  - f: elitist
    cite: f01-brookings-zh-team-of-rivals
    quote: '“精英派”诞生于江泽民时代。尽管该派的两位领导人——人大委员长吴邦国和政协主席贾庆林——很少为国外所知'
  - f: elitist
    cite: f01-brookings-2012-04-16-power-shift
    quote: 'the “elitist coalition,” which emerged in the Jiang era and is currently led by Wu Bangguo, chairman of the national legislature'
    zh: '“精英联盟”兴起于江泽民时代，目前由全国人大委员长吴邦国领导'
  - f: elitist
    cite: f01-brookings-2012-11-powerful-factions
    quote: 'currently led by both Wu Bangguo, chairman of the national legislature, and Jia Qinglin, head of a national political advisory body'
    zh: '（精英联盟）目前由全国人大委员长吴邦国和全国政协主席贾庆林共同领导'
  - f: elitist
    cite: f01-bbc-2012-11-06-cheng-li-factions
    quote: '现在以人大委员长吴邦国和政协主席贾庆林为首的……精英联盟'
  - f: elitist
    cite: f01-voa-2012-05-25-factions
    quote: '一派是产生于江泽民时代而如今由吴邦国领导的精英联盟'

jia-qinglin:
  - f: jiang-shanghai
    cite: f01-bbc-2002-11-15-psc-profiles
    quote: '贾庆林：62岁，江泽民的另一名亲信'
  - f: jiang-shanghai
    cite: f01-bbc-2007-10-23-succession
    quote: '像被视为"江派"的李长春和贾庆林仍然留在政治局常委'
  - f: jiang-shanghai
    cite: f01-voa-2012-11-04-who-is-who
    quote: '工程师出身的贾被视为具有“江派”背景'
  - f: elitist
    cite: f01-brookings-zh-team-of-rivals
    quote: '“精英派”诞生于江泽民时代。尽管该派的两位领导人——人大委员长吴邦国和政协主席贾庆林——很少为国外所知'
  - f: elitist
    cite: f01-brookings-2012-11-powerful-factions
    quote: 'currently led by both Wu Bangguo, chairman of the national legislature, and Jia Qinglin, head of a national political advisory body'
    zh: '（精英联盟）目前由全国人大委员长吴邦国和全国政协主席贾庆林共同领导'
  - f: elitist
    cite: f01-bbc-2012-11-06-cheng-li-factions
    quote: '现在以人大委员长吴邦国和政协主席贾庆林为首的……精英联盟'

huang-ju:
  - f: jiang-shanghai
    cite: f01-bbc-2002-11-15-psc-profiles
    quote: '黄菊：64岁，江泽民的亲信。1994-2002年担任上海市委书记'

li-changchun:
  - f: jiang-shanghai
    cite: f01-bbc-2002-11-15-psc-profiles
    quote: '李长春：58岁，据信也是江泽民的亲信'
  - f: jiang-shanghai
    cite: f01-bbc-2007-10-23-succession
    quote: '像被视为"江派"的李长春和贾庆林仍然留在政治局常委'
  - f: jiang-shanghai
    cite: f01-voa-2012-11-04-who-is-who
    quote: '李为工程师出身，被认为有“江派”背景'

he-guoqiang:
  - f: jiang-shanghai
    cite: f01-voa-2012-11-04-who-is-who
    quote: '工程师出身的贺国强被视为有“江派”背景'

zhou-yongkang:
  - f: jiang-shanghai
    cite: f01-voa-2012-11-04-who-is-who
    quote: '周为工程师出身，早年在石油部门任职，人常前为国务委员兼公安部长。他被视为有“江派”背景'
  - f: jiang-shanghai
    cite: f01-nyt-2012-11-20-reformists
    quote: '江派里则既有王岐山这样1980年代就崭露头脚的改革大将，也有曾执掌政法机器的周永康'
  - f: petroleum
    cite: f01-cnr-2015-10-15-zhou-disciples
    quote: '从1967年到1998年，周永康在石油系统工作了31年，官至中国石油天然气总公司总经理、党组书记'
  - f: petroleum
    cite: f01-bbc-2014-07-30-zhou-analysis
    quote: '关于周永康与其关系良好的“石油帮”、“政法系统”、“四川帮”等官员'
  - f: zhengfa
    cite: f01-cnr-2015-10-15-zhou-disciples
    quote: '其几乎在每一个仕途阶段，都有不少“门徒”，形成了四川系、石油帮、政法系、秘书帮等团团伙伙'
  - f: zhengfa
    cite: f01-bbc-2015-06-11-zhou-profile
    quote: '其实权之大非中共其他政治局常委可比，被人称为“政法王”'

# --- 18th Standing Committee and Politburo ---
xi-jinping:
  - f: princelings
    cite: f01-voa-2012-11-04-who-is-who
    quote: '习被视为“太子党”，其父为已故中共元老习仲勋'
  - f: princelings
