    上海交通大学自动控制系毕业，曾在英国国防语言学院和三军联合指挥与参谋学院深造。2012 年 9 月任辽宁舰首任舰长，2016 年任海军参谋长助理，2017 年任山东舰航母编队首任司令员，后任南部战区副参谋长。
    中国海事研究所 2026 年 7 月据春节慰问视频的座次判断，海军司令员胡中明久未露面后，由他主持海军工作。
