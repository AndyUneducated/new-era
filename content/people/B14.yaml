  status: dead
  statusNote: 2002 年 5 月 24 日在北京逝世，享年 89 岁；2005 年骨灰迁回富平安葬。
  tier: 1
  headline: 中共元老，国务院原副总理（1959–1962）、全国人大常委会副委员长，习近平之父
  ids: { wikidata: Q301282 }
  bio: >-
    陕甘边根据地的主要创建者之一，1959 年任国务院副总理兼秘书长，1962 年因所谓“《刘志丹》小说问题”受审查、关押、监护前后长达 16 年。1978 年后主政广东，率先请求让广东在改革开放中先走一步，促成深圳、珠海、汕头经济特区；后任中央书记处书记、政治局委员和全国人大常委会副委员长。
    他 2002 年去世，但在 2000 年后的政治里分量反而加重：他是习近平“太子党”家世的源头，媒体所说的“陕北帮”“西北帮”以他为首之一；2013 年百年诞辰座谈会上，已任总书记的习近平以亲属身份出席。海外评论则常拿他反对批判胡耀邦、提议保护不同意见的往事，与儿子收紧言论的做法对照。
