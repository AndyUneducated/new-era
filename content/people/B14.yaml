  bio: >-
    陕甘边根据地的主要创建者之一，1959 年任国务院副总理兼秘书长，1962 年因所谓“《刘志丹》小说问题”受审查、关押前后长达 16 年。1978 年后主政广东，率先请求让广东在改革开放中先走一步，促成经济特区；后任中央书记处书记、全国人大常委会副委员长。
