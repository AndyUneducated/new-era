  ids: { wikidata: Q99829 }
  bio: >-
    改革开放前期主持经济改革，1980 年进入政治局常委会，1987 年任总书记。1989 年天安门运动期间因同情学生失去邓小平信任而下台。2005 年 1 月去世前，曾庆红代表中央领导前往医院看望；新华社称他在 1989 年“政治风波中”犯了严重错误。其秘密录音整理成的回忆录中文版《改革历程》2009 年在香港出版。
