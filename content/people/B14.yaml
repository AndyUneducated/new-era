  factions:
    - f: shaanxi
      cite: f02-voa-2024-04-princelings
      quote: 他们同属以高岗、刘志丹、习仲勋为首的“陕北帮”或者“西北帮”。
  life:
    - h: 关中少年与陕甘边
      from: 1913
      to: 1935
      text: >-
        1913 年 10 月 15 日生于陕西富平县淡村镇一户农民家庭，在三原师范等校读书。1926 年 5 月加入共青团，1928 年春因参加学生运动被国民党当局关押，在狱中转为中共党员。1930 年起到杨虎城部做兵运工作，儿子习远平说他 19 岁即领导发动了震惊陕甘的“两当兵变”。
        1933 年起与刘志丹等创建照金陕甘边根据地，1934 年 11 月当选陕甘边区苏维埃政府主席。1935 年 9 月，他和刘志丹等在“错误肃反”中被关押，中央红军到陕北后才获释平反；官方说这块根据地由此成为长征的“落脚点”。
      cites: [c05-chinanews-2002-05-30-xi-zhongxun-life, c05-people-2013-10-12-xi-yuanping]
    - h: 西北局
      from: 1936
      to: 1952
      text: >-
        抗战时期他守卫陕甘宁边区南大门关中长达 6 年，1943 年 1 月毛泽东亲笔为他题写“党的利益在第一位”，随后调任绥德地委书记。1945 年在中共七大当选候补中央委员，任中央组织部副部长。
        内战爆发后任中央西北局书记，习远平引述毛泽东撤出延安前的命令：“陕甘宁一切部队从即日起统归彭德怀、习仲勋指挥”。1947 年他协同彭德怀取得青化砭、羊马河、蟠龙镇“三战三捷”。1949 年后任西北局第二书记、西北军政委员会副主席，长期主持西北五省党政军工作，处理民族宗教问题。
      cites: [c05-chinanews-2002-05-30-xi-zhongxun-life, c05-people-2013-10-12-xi-yuanping]
    - h: 国务院“大管家”与十六年
      from: 1952
      to: 1978
      text: >-
        1952 年 9 月调任中宣部部长，1953 年起任政务院、国务院秘书长，1959 年 4 月任国务院副总理兼秘书长，协助周恩来工作长达 10 年，被称为国务院的“大管家”。
        1962 年 9 月八届十中全会上，他因所谓“《刘志丹》小说问题”遭康生诬陷，此后“被审查、关押、监护前后长达16年之久”。说法细节不一：美国之音称他在文革中“坐了8年监狱”，BBC 说他被下放到工厂并被开除党籍，官方生平未提开除党籍。纽约时报写他文革中遭殴打和残酷审讯；BBC 称他的女儿习和平很可能不堪迫害自杀。
      cites: [c05-chinanews-2002-05-30-xi-zhongxun-life, c05-gov-2013-10-15-xi-zhongxun-centenary, f02-voa-2024-04-princelings, b04-bbc-xi-lost-princeling, b14-nytcn-2015-11-22-hu-yaobang, b04-bbc-xi-cave-to-summit]
    - h: 平反与主政广东
      from: 1977
      to: 1980
      text: >-
        1977 年 12 月，妻子齐心找到时任中组部部长胡耀邦申诉。据官方传记，胡耀邦表示“凡是冤假错案都要实事求是地坚决平反昭雪”。1978 年 4 月他赴广东任省委第二书记、第一书记，上任时说：“北方的水土养育了我大半辈子，现在到了广东，要靠南方的水土养我下半辈子。”
        他调研偷渡外逃香港问题，在中央工作会议上提出“希望中央给点权，让广东能够充分利用自己的有利条件先走一步”，并提议在深圳、珠海、汕头划出“贸易合作区”。人民网记述，邓小平说“还是叫特区好”，要广东“杀出一条血路来”。1979 年 7 月中央批准广东实行特殊政策、创办经济特区。他主政广东仅两年零八个月。
      cites: [b14-nytcn-2015-11-22-hu-yaobang, c05-people-2013-10-12-xi-yuanping, b14-people-2017-12-27-xi-zhongxun-sez, c05-chinanews-2002-05-30-xi-zhongxun-life]
    - h: 书记处与胡耀邦下台
      from: 1980
      to: 1987
      text: >-
        1980 年 9 月补选为全国人大常委会副委员长，兼法制委员会主任；1981 年 6 月增选为中央书记处书记，1982 年 9 月当选政治局委员，负责书记处日常工作，分管组织人事、统战和民族宗教。
        1986 年底，邓小平指责胡耀邦没能对意识形态松动和学生抗议采取有力行动，胡耀邦在随后的会议上遭到围攻。纽约时报转述胡耀邦史料网的文章，习仲勋在批判会上说：“这不正常！”“你们开了这样的头，只会给将来党和国家的安定团结埋下祸根。”这被视为他对胡耀邦当年助其平反的回报。1987 年中共十三大后，他不再担任政治局委员和书记处书记。
      cites: [c05-chinanews-2002-05-30-xi-zhongxun-life, b14-nytcn-2015-11-22-hu-yaobang]
    - h: 七届人大与“不同意见保护法”
      from: 1988
      to: 2002
      text: >-
        1988 年 4 月当选七届全国人大常委会副委员长兼内务司法委员会主任委员，1993 年 3 月退休，晚年多住在广东。赵紫阳的秘书鲍彤和流亡学者胡平都说，他任副委员长时提议制定“不同意见保护法”；胡平引他的话说，“从党的历史看，压制不同意见惹起的灾祸太大了”。
        香港评论员刘锐绍还说他反对用高压方式镇压六四，但官方纪念中刻意忽略这些“开明表现”。官方生平只写他退休后拥护“三个代表”重要思想。2002 年 5 月 24 日他在北京逝世，灵前供奉照金、南梁和延安的小米。
      cites: [b14-voa-2013-09-04-bao-tong-dissent-law, b14-nytcn-2016-10-25-hu-ping, b14-bbc-2013-10-17-xi-zhongxun-analysis, c05-chinanews-2002-05-30-xi-zhongxun-life, c05-people-2013-10-12-xi-yuanping]
    - h: 百年诞辰：父亲与儿子
      from: 2013
      to: 2016
      text: >-
        2013 年 10 月 15 日，人民大会堂举行纪念座谈会，“习近平作为亲属参加座谈会”，张德江出席，李建国讲话称他的一生“是革命的一生，光辉战斗的一生”。郑永年认为纪念焦点是改革开放，“希望从习仲勋那里找回一些改革的精神”；刘锐绍则说官方不提他比邓小平更开放，“可以看出习近平并没有他父亲那样的政治气魄”。
        胡平 2016 年写道：“习仲勋提议制定“保护不同意见法”，习近平却公然下令“不准妄议”。”同年美国之音报道，富平故居 2005 年重建、2012 年起大规模扩建为陵园，人民大学教授周孝正称之为“造神运动”，历史学者章立凡说“上有所好，下必甚焉”。
      cites: [c05-gov-2013-10-15-xi-zhongxun-centenary, b14-bbc-2013-10-17-xi-zhongxun-analysis, b14-nytcn-2016-10-25-hu-ping, b14-voa-2016-04-06-xi-zhongxun-mausoleum]
    - h: “陕北帮”的源头
      from: 2000
      to: 2024
      text: >-
        习近平当政后，与习家有渊源的陕甘人脉被媒体归为“陕西帮”或“陕军”。美国之音称，中央军委副主席张又侠之父张宗逊与习仲勋在西北野战军共事，两家是世交，“他们同属以高岗、刘志丹、习仲勋为首的“陕北帮”或者“西北帮””。
        2000 年 6 月，时任陕西省委常委栗战书陪同齐心等人拜谒渭北革命烈士纪念碑；中央纪委书记李希曾任“习仲勋的老部下及陕西老乡”李子奇的秘书，常陪他探望习仲勋。自由亚洲电台评论称栗战书、赵乐际是“陕军”头领，景俊海“以扩建习仲勋陵墓而闻名”。
      cites: [f02-voa-2024-04-princelings, b05-zaobao-2017-10-23-li-zhanshu, b06-voa-2022-10-23-li-xi, f01-rfa-2019-02-22-shaanxi]
  assess:
    - voice: official
      quote: true
      text: 中国共产党的优秀党员，伟大的共产主义战士，杰出的无产阶级革命家，我党、我军卓越的政治工作领导人
      cite: c05-chinanews-2002-05-30-xi-zhongxun-life
    - voice: zh
      quote: true
      text: 中国官方在对习仲勋的高度评价中刻意忽略了习仲勋在政治方面的开明表现
      cite: b14-bbc-2013-10-17-xi-zhongxun-analysis
    - voice: witness
      quote: true
      text: 习仲勋的思想非常开放，他在广东的长期工作都是采取开放的态度，他本人就是压制不同意见的受害者
      cite: b14-voa-2013-09-04-bao-tong-dissent-law
    - voice: scholar
      quote: true
      text: 当年的中国经济改革实际上就是政治改革
      cite: b14-bbc-2013-10-17-xi-zhongxun-analysis
    - voice: zh
      quote: true
      text: 习近平上台后的举止作派，不象是习仲勋的儿子，倒更象是毛泽东的孙子
      cite: b14-nytcn-2016-10-25-hu-ping
  family:
    - name: 齐心
      rel: 妻子
      text: >-
        1977 年 12 月为丈夫平反向胡耀邦申诉。2000 年 6 月由时任陕西省委常委栗战书陪同拜谒渭北革命烈士纪念碑。习仲勋墓地坐像背面刻着她题写的“战斗一生，快乐一生；天天奋斗，天天快乐。”
      cites: [b14-nytcn-2015-11-22-hu-yaobang, b05-zaobao-2017-10-23-li-zhanshu, c05-people-2013-10-12-xi-yuanping]
    - name: 习近平
      rel: 儿子
      text: >-
        习仲勋的第六个孩子，1953 年生于北京。父亲 1962 年被打倒后，他成了“反党分子”的子弟；BBC 称父亲平反后，“习仲勋通过他的关系网不断为儿子的政治生涯铺路”。2012 年起任中共中央总书记。
      cites: [b04-bbc-xi-lost-princeling, f02-voa-2024-04-princelings, b04-bbc-xi-cave-to-summit]
    - name: 习远平
      rel: 儿子
      text: >-
        2013 年 10 月在西安的纪念座谈会上代表母亲齐心和全家发言，回顾父亲在陕西的经历和“为改革开放杀出一条血路”。
      cites: [c05-people-2013-10-12-xi-yuanping]
    - name: 齐桥桥
      rel: 女儿
      text: >-
        习近平的姐姐。彭博社 2012 年 6 月报道习近平家人在多家公司拥有约 3.76 亿美元资产，大部分为齐桥桥和丈夫邓家贵所有；彭博网站随后在中国被屏蔽。
      cites: [c05-bbc-2012-06-29-bloomberg-xi]
    - name: 习和平
      rel: 女儿
      text: >-
        习近平同父异母的姐姐，BBC 称她在文革中很可能不堪迫害自杀。
      cites: [b04-bbc-xi-cave-to-summit]
  cites: [c05-chinanews-2002-05-30-xi-zhongxun-life, c05-gov-2013-10-15-xi-zhongxun-centenary, c05-people-2013-10-12-xi-yuanping, b14-people-2017-12-27-xi-zhongxun-sez, b14-bbc-2013-10-17-xi-zhongxun-analysis, b14-nytcn-2015-11-22-hu-yaobang, f02-voa-2024-04-princelings, wd-Q301282]

- id: zhao-ziyang
  name: 赵紫阳
  pinyin: Zhào Zǐyáng
  gender: m
  born: 1919-10-17
  died: 2005-01-17
  birthplace: 河南滑县
  joinedParty: 1938-02
  joinedWork: 1937
  roles: [psc, pb, cc]
  status: dead
  statusNote: 1989 年下台后被软禁，2005 年 1 月 17 日在北京逝世，终年 85 岁；2019 年骨灰安葬于北京昌平天寿园。
  tier: 1
  headline: 中共中央总书记（1987–1989）、国务院总理（1980–1987），六四后软禁至死
  ids: { wikidata: Q99829 }
  bio: >-
    改革开放前期主持经济改革：在四川推行包产到户式的农村改革，1980 年进入政治局常委会并出任国务院总理，1987 年接替胡耀邦任总书记，提出政治体制改革。1989 年天安门运动期间反对戒严、同情学生，被撤销全部党内职务，此后在北京家中被软禁约 15 年。
    他与 2000 年后政治的关联在于“六四”定性：2005 年 1 月去世时，新华社只用两句话报道，悼词式通稿仍称他在 1989 年“犯了严重错误”；骨灰 14 年未能下葬。秘书鲍彤推动整理的秘密录音 2009 年以《国家的囚徒》和中文版《改革历程》出版，成为研究 1989 年高层斗争的核心材料。
