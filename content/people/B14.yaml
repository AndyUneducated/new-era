  life:
    - h: 地主之子与地方大员
      from: 1919
      to: 1966
      text: >-
        1919 年 10 月生于河南滑县一个地主家庭，1932 年 3 月加入共青团，1937 年参加革命工作，1938 年 2 月、19 岁时加入中共。战争年代和 1949 年后，他先后担任县委、地委、省委主要领导，在广东、内蒙古和四川任职；Wikidata 记载他 1965 至 1967 年已是广东省委书记。
        文革中他受到冲击，BBC 后来认为这段经历让他在出任总书记后“希望中国有真正的司法独立”。
      cites: [c05-xinhua-2005-01-29-zhao-ziyang, b14-bbc-2005-01-17-zhao-profile, wd-Q99829]
    - h: 四川：“要吃粮找紫阳”
      from: 1974
      to: 1980
      text: >-
        1974 至 1975 年再任广东省委书记后，他在文革后期调任四川省委书记兼成都军区政委。原新华社四川分社社长孙振 2008 年在《炎黄春秋》回忆，他刚到任两名主要助手就被造反派绑架，他一面应付造反派，一面微服私访；1976 年 8 月四川连发强震，他不顾“反对用抗震救灾压革命”的大字报赶赴灾区。
        文革结束后他在四川推行类似“包产到户”的政策，农业迅速恢复，民间流传“要吃粮找紫阳”。BBC 称，正是因为四川改革成功，他在 1980 年十一届五中全会上进入政治局常委会。
      cites: [wd-Q99829, b14-rfa-2008-09-12-zhao-sichuan, b14-bbc-2005-01-17-zhao-profile]
    - h: 总理
      from: 1980
      to: 1987
      text: >-
        1980 年 2 月当选政治局常委，4 月任国务院副总理，9 月接替华国锋任国务院总理，1981 至 1982 年兼任中共中央副主席。BBC 写道，他出任总理时文革刚结束，邓小平提出“中国特色的社会主义”和四个现代化的目标，却“没有具体的方法”，全面负责经济工作的赵紫阳主导了 1980 年代资本主义式的经济改革。
        这一时期鲍彤任他的政治秘书，辅佐他对政治经济体制改革进行高层设计；后来的现任领导人延续了他的经济改革，政治改革却被冻结。
      cites: [wd-Q99829, c01-gov-2018-03-19-state-council-history, b14-bbc-2005-01-17-zhao-profile, b14-bbc-2005-01-17-zhao-analysis, c05-bbc-2022-11-10-bao-tong]
    - h: 总书记与学潮初起
      from: 1987
      to: 1989
      text: >-
        1987 年 1 月胡耀邦被迫辞职，他出任代理总书记，同年正式担任总书记，身兼党政，在继续经济改革的同时力求政治突破，严家其等人为他筹划渐进的政改方案。1989 年 4 月 15 日胡耀邦去世，22 日追悼大会由他致悼词。
        4 月 23 日他出访朝鲜。澳大利亚学者孙万国说，他行前从邓小平处获悉将接任中央军委主席；回国后他却试图淡化谴责学生“动乱”的四·二六社论，惹恼了邓小平。纽约时报说他“赞成捍卫一党专制”，但希望以对话和加快改革来平息抗议。
      cites: [b14-bbc-2005-01-17-zhao-profile, e01-cpc-dsj-1989, b14-nytcn-2014-05-12-zhao-fall]
    - h: “我们来得太晚了”
      from: 1989-05
      to: 1989-05
      text: >-
        5 月 4 日他会见亚洲开发银行代表，官方党史称他“发表了同中央的立场和方针不同的谈话”。16 日他告诉戈尔巴乔夫，重大问题仍需邓小平掌舵；他在回忆录中说“我本来出于好心，在维护他，保护他的形象”，邓家却认为他意在让分歧公开化。
        17 日在邓小平家中的会议上邓提出戒严，他当天写了辞职信，被杨尚昆劝回，当晚表示不能主持宣布戒严的大会，并说“看来我的历史使命已经完成。”19 日约凌晨 4 点，他到天安门广场劝绝食学生回校，说“我们来得太晚了”，时任中办主任温家宝在他身边。
      cites: [e01-cpc-dsj-1989, b14-nytcn-2014-05-12-zhao-fall, b14-bbc-2005-01-17-zhao-analysis]
    - h: 撤职与软禁
      from: 1989-06
      to: 2004
      text: >-
        1989 年 6 月 23 至 24 日十三届四中全会认定他“犯了支持动乱和分裂党的错误”，撤销其全部党内职务并继续审查；七届全国人大常委会随后撤销其国家中央军委副主席职务。1992 年 10 月十三届九中全会同意“维持十三届四中全会对赵紫阳同志所犯错误的结论并结束审查”。
        此后他在北京富强胡同 6 号家中被软禁，BBC 称是生命最后 15 年，美国之音说“被罢黜软禁直至2005年1月17日去世”。鲍彤 1989 年 5 月 28 日失去自由，1992 年被判刑七年，1996 年刑满后仍受严密监控。
      cites: [e01-cpc-dsj-1989, e01-cpc-dsj-1992, b14-bbc-2005-01-17-zhao-analysis, b14-voa-2019-10-18-zhao-burial, b14-bbc-2019-10-18-zhao-burial, c05-bbc-2022-11-10-bao-tong]
    - h: 秘密录音与《改革历程》
      from: 2000
      to: 2009
      text: >-
        据鲍彤说，他约在 2000 年决定根据以前的文字草稿口述回忆录，31 盒伪装成儿童歌谣或京剧的磁带由四位仍能登门的挚友秘密带出；编辑认为草稿可能早在 1993 年就有了。鲍彤约 2007 年得知录音并参与整理，听后确认口述者是赵本人。
        2009 年 5 月，英文版《国家的囚徒》由西蒙与舒斯特出版，中文版《改革历程》由鲍彤之子鲍朴的出版社在香港推出，香港支联会摊位约半小时售罄。鲍朴说出版是为了驳斥中共对六四的结论；鲍彤在序言中写道：“赵紫阳的遗言属于全体中国人。”林培瑞指出书中直言李鹏等人“阻挠、抗拒和破坏”他化解对峙的努力。
      cites: [b14-bbc-2009-05-14-zhao-memoir, c05-bbc-2009-05-29-zhao-memoir, c05-bbc-2022-11-10-bao-tong]
    - h: 去世与安葬
      from: 2005
      to: 2019
      text: >-
        2005 年 1 月 17 日他在北京病逝，弥留时曾庆红代表中央领导前往医院看望。BBC 称新华社的首条报道“只有两句话”，电视新闻没有报道；1 月 29 日新华社通稿说他“为党和人民的事业作出过有益的贡献”，同时仍称他犯了严重错误，遗体在八宝山火化。
        骨灰此后一直存放在富强胡同故居，家属申请安葬民间公墓多年被拒。2019 年 10 月 18 日，在他百岁冥诞次日，骨灰与夫人梁伯琪合葬于昌平天寿园，约百人出席。前部下吴伟对 BBC 说，大规模纪念他“就要重新评价六四”。
      cites: [c05-xinhua-2005-01-29-zhao-ziyang, b14-bbc-2005-01-17-zhao-analysis, b14-bbc-2019-10-18-zhao-burial, b14-voa-2019-10-18-zhao-burial]
  assess:
    - voice: history
      quote: true
      text: 赵紫阳在关系党和国家生死存亡的关键时刻犯了支持动乱和分裂党的错误，对动乱的形成和发展负有不可推卸的责任
      cite: e01-cpc-dsj-1989
    - voice: official
      quote: true
      text: 赵紫阳同志先后担任过中央和国家重要领导职务，为党和人民的事业作出过有益的贡献
      cite: c05-xinhua-2005-01-29-zhao-ziyang
    - voice: zh
      quote: true
      text: 赵紫阳难能可贵地坚守了自己的原则，是一位开明的领导人，宁可选择放弃权力，也不愿指挥一场大屠杀
      cite: b14-nytcn-2014-05-12-zhao-fall
    - voice: witness
      quote: true
      text: 赵是一个开明的政治家，但他不是一个非常成熟的政治家
      cite: b14-nytcn-2014-05-12-zhao-fall
    - voice: witness
      quote: true
      text: 如果要大规模纪念赵，就要重新评价六四，重新评价他当年的历史功过
      cite: b14-bbc-2019-10-18-zhao-burial
  family:
    - name: 梁伯琪
      rel: 妻子
      text: >-
        2019 年 10 月 18 日，她与赵紫阳的骨灰合葬于北京昌平区民间公墓天寿陵园。
      cites: [b14-voa-2019-10-18-zhao-burial]
    - name: 王雁南
      rel: 女儿
      text: >-
        在父母墓前致纪念词，说他们“一辈子没有私产，没有属于自已的片瓦和寸土，今天有了”，并为未能提前告知安葬日期致歉。
      cites: [b14-voa-2019-10-18-zhao-burial]
    - name: 赵二军
      rel: 儿子
      text: >-
        对香港电台说，墓地距北京市中心 60 多公里，占地约 40 平方米；当局曾希望把骨灰葬在河南老家，以便控制前来拜祭的民众和境外记者，家人最终决定葬在北京。
      cites: [b14-bbc-2019-10-18-zhao-burial]
  cites: [c05-xinhua-2005-01-29-zhao-ziyang, e01-cpc-dsj-1989, b14-bbc-2005-01-17-zhao-profile, b14-bbc-2005-01-17-zhao-analysis, b14-nytcn-2014-05-12-zhao-fall, b14-bbc-2009-05-14-zhao-memoir, c05-bbc-2009-05-29-zhao-memoir, c05-bbc-2022-11-10-bao-tong, b14-bbc-2019-10-18-zhao-burial, wd-Q99829]

- id: ren-zhengfei
  name: 任正非
  pinyin: Rèn Zhèngfēi
  gender: m
  born: 1944-10-25
  birthplace: 贵州镇宁
  education:
    - { school: 重庆建筑工程学院, from: 1963 }
  roles: [biz]
  status: active
  statusNote: 仍主持华为；2026 年 9 月华为在纽约联邦法院受审期间，他在深圳会见东风汽车总经理。
  tier: 1
  headline: 华为创始人（1987）、总裁，中美科技战的标志人物
  ids: { wikidata: Q712802 }
  bio: >-
    基建工程兵出身、出席过中共十二大，1987 年在深圳集资 2.1 万元创立华为并任总裁至今。他本人只持股约 1%，其余股权由公司工会持有；美国政府长期指华为实际上是中国国家的一只手臂，学者也质疑工会持股使它在某种程度上近似国企。
    2018 年女儿孟晚舟在温哥华被捕、2019 年华为被列入美国“实体清单”后，华为成为中美科技战的焦点，他罕见地频繁受访，称美国“不可能扼杀掉”华为。2025 年 2 月他在习近平主持的民营企业座谈会上第一个发言；2026 年 9 月美国检方在纽约以 12 项重罪指控把华为送上法庭。
  positions:
    - { title: 基建工程兵技术员、工程师、副所长（技术副团级）, sys: army, from: 1974, to: 1983, cite: b14-huawei-ren-zhengfei-bio }
    - { title: 华为公司创始人、总裁, sys: other, place: 广东, from: 1988, cite: b14-huawei-ren-zhengfei-bio }
  life:
    - h: 贵州山区与基建工程兵
      from: 1944
      to: 1983
      text: >-
        1944 年生，父母是乡村中学教师，中小学在贵州边远山区的少数民族县城就读。1963 年考入重庆建筑工程学院，毕业后在建筑工程单位工作。1974 年为建设从法国引进的辽阳化纤总厂应征入伍，加入基建工程兵，历任技术员、工程师、副所长，华为官方简历强调是“技术副团级”且“无军衔”。
        因技术贡献，他 1978 年出席全国科学大会，1982 年出席中共十二大。
      cites: [b14-huawei-ren-zhengfei-bio]
    - h: 两万一千元起家
      from: 1983
      to: 2003
      text: >-
        1983 年基建工程兵整建制撤销，他复员转业到深圳南海石油后勤服务基地，简历自述“工作不顺利”，于是在 1987 年集资 21000 元人民币创立华为，1988 年起任总裁至今。
        BBC 形容他“深居简出和低调隐忍”。华为后来实行员工持股：2003 年两名资深员工因回购价格起诉公司，广东省高院认定只有发起股东才能登记，员工所持股份只是员工与华为之间的合同。
      cites: [b14-huawei-ren-zhengfei-bio, c04-bbc-2019-02-18-ren-zhengfei-interview, b14-voa-2019-04-20-who-owns-huawei]
    - h: 谁拥有华为
      from: 2014
      to: 2019
      text: >-
        工商登记显示华为只有两个股东：任正非约 1%，其余 99% 由华为投资控股有限公司工会委员会持有；华为称约 8 万名员工通过“虚拟股份”持有这部分股权。
        2019 年 4 月，法学教授郭丹青和鲍尔丁发表报告，认为虚拟股只有分红权，没有所有权和表决权，工会层级可追溯到政府控制的中华全国总工会，华为“在某种程度上是一家国有企业”。华为回应说工会代表由持股员工选出，“他们不必对任何国家机构或政党报告，他们也从未被要求这样做”。
      cites: [b14-voa-2019-04-20-who-owns-huawei]
    - h: 孟晚舟被捕与 BBC 专访
      from: 2018-12
      to: 2019-02
      text: >-
        2018 年 12 月 1 日，加拿大警方应美国要求在温哥华逮捕他的女儿、华为首席财务官孟晚舟。2019 年 2 月，他在事件后首次接受国际媒体专访，对 BBC 说逮捕带有政治动机，美国“它不可能扼杀掉我们”，“因为这世界离不开我们，因为我们比较先进”。
        他否认华为参与间谍活动或按任何人指使安装后门：“如果我们有这个行为，那我就把这个公司解散了”。BBC 记者的结论是，采访中“仍然揭示出任正非与政府密切联系的一些迹象”。
      cites: [c04-bbc-2019-02-18-ren-zhengfei-interview, c04-bbc-2019-02-19-ren-zhengfei]
    - h: 实体清单
      from: 2019-05
      to: 2019-05
      text: >-
        2019 年 5 月，美国商务部宣布把华为及 70 家关联企业列入“实体清单”，没有许可不得向美国企业购买元器件。华为回应称“如果美国限制华为，不会让美国更安全，也不会使美国更强大”。
        5 月 21 日他在深圳接受五家中国媒体集体采访，说美国政客“低估了他们的力量”，又说“大家要骂就骂美国政客，这件事不关美国企业什么事情”。他提醒国内“不能说用华为产品就爱国”，“千万不能煽动民族主义”，并说家人都用苹果手机。BBC 指出，华为每年约 700 亿美元采购中有 100 多亿来自美国企业。
      cites: [b14-bbc-2019-05-16-entity-list, b14-bbc-2019-05-21-ren-ban]
    - h: 孟晚舟回国
      from: 2021-09
      to: 2021-09
      text: >-
        2021 年 9 月，孟晚舟与美国司法部达成暂缓起诉协议，获纽约东区法院法官安·唐纳利批准，加拿大终止引渡程序。9 月 25 日她乘中国政府包机抵达深圳，说“经过1000多天的煎熬，我终于回到了祖国的怀抱”；同一天，被中国拘押近三年的加拿大人康明凯、斯帕弗回到加拿大。
        外交部发言人华春莹称这是一起“政治迫害事件，目的是打压中国的高技术企业”；美国参议员鲁比奥则批评拜登政府应对华为威胁的“能力和意愿”。
      cites: [b14-bbc-2021-09-25-meng-release]
    - h: 座谈会与“干就完了”
      from: 2025
      to: 2025
      text: >-
        2025 年 2 月 17 日，习近平出席民营企业座谈会，强调党和国家对民营经济的方针“不能变，也不会变”；以“华为技术有限公司首席执行官”身份出席的任正非在六位发言企业家中排在首位。
        6 月 10 日《人民日报》头版刊出他逾 3000 字的专访，这是美国对昇腾芯片实施全球禁令后他首次回应。他说“不去想困难，干就完了，一步一步往前走”，承认“我们单芯片还是落后美国一代”，但可用集群计算弥补。联合早报引述分析说，他意在提振业界信心、淡化美国管制的影响。
      cites: [b14-gov-2025-02-17-private-symposium, b14-people-2025-06-10-ren-interview, b14-zaobao-2025-06-10-ren-chips]
    - h: 纽约审判
      from: 2026
      to: 2026
      text: >-
        美国司法部起诉华为近八年后，案件 2026 年 9 月在纽约东区联邦法院开审。据国际调查记者同盟报道，检方称华为是“犯罪企业”，提出 12 项重罪指控，包括共谋窃取美国竞争对手技术、就伊朗业务欺骗西方银行；没有个人被起诉，孟晚舟在暂缓起诉协议中承认向汇丰等银行隐瞒伊朗业务的陈述可能被作为证据。法官唐纳利希望圣诞节前结束审理。
        审判期间的 9 月 22 日，央广网报道他在深圳会见东风汽车总经理冯长军，听取合作车型汇报。
      cites: [b14-icij-2026-09-18-huawei-trial, b14-cnr-2026-09-23-ren-dongfeng]
  assess:
    - voice: zh
      quote: true
      text: 我们的采访过程中仍然揭示出任正非与政府密切联系的一些迹象
      cite: c04-bbc-2019-02-18-ren-zhengfei-interview
    - voice: scholar
      quote: true
      text: 如果华为99%的股权由工会所有，那么我们可以说这家公司在某种程度上是一家国有企业
      cite: b14-voa-2019-04-20-who-owns-huawei
    - voice: official
      quote: true
      text: 这是一起针对中国公民的政治迫害事件，目的是打压中国的高技术企业
      cite: b14-bbc-2021-09-25-meng-release
    - voice: west
      quote: true
      text: The U.S. government has long warned, in sweeping terms, that the Chinese tech giant Huawei is effectively an arm of the Chinese state that acts with impunity on the global stage
      zh: 美国政府长期笼统地警告，这家中国科技巨头实际上是中国国家的一只手臂，在全球舞台上肆无忌惮。
      cite: b14-icij-2026-09-18-huawei-trial
  family:
    - name: 孟晚舟
      rel: 女儿
      text: >-
        华为首席财务官。2018 年 12 月在温哥华应美国要求被捕，任正非称逮捕带有政治动机；2021 年与美国司法部达成暂缓起诉协议，承认就华为子公司在伊朗的业务向汇丰等银行说谎，9 月回国。任正非 2019 年说，女儿被捕让他意识到美国针对华为的时间提前了。
      cites: [c04-bbc-2019-02-18-ren-zhengfei-interview, b14-bbc-2021-09-25-meng-release, b14-icij-2026-09-18-huawei-trial, b14-bbc-2019-05-21-ren-ban]
  cites: [b14-huawei-ren-zhengfei-bio, c04-bbc-2019-02-18-ren-zhengfei-interview, c04-bbc-2019-02-19-ren-zhengfei, b14-bbc-2019-05-21-ren-ban, b14-voa-2019-04-20-who-owns-huawei, b14-people-2025-06-10-ren-interview, b14-icij-2026-09-18-huawei-trial, wd-Q712802]

- id: guo-wengui
  name: 郭文贵
  pinyin: Guō Wénguì
  aka: [郭浩云, Miles Guo, Miles Kwok, 七哥]
  gender: m
  born: 1967-02-02
  birthplace: 山东莘县
  roles: [biz, dissent]
  status: detained
  statusNote: 在美国服刑，2026 年 6 月 29 日被纽约南区联邦法院判处 30 年监禁。
  fall:
    - { date: 2017-04-18, text: 国际刑警组织应中国要求发出红色通缉令, cite: b14-bbc-2017-04-21-guo-baoliao }
    - { date: 2023-03, text: 在纽约被捕，被控电信欺诈、证券欺诈、银行欺诈和洗钱, cite: b14-bbc-2023-03-16-guo-charged }
    - { date: 2024-07-16, text: 陪审团认定串谋敲诈勒索、电汇欺诈、证券欺诈及洗钱等罪成立, cite: c04-voa-2026-06-30-guo-wengui }
    - { date: 2026-06-29, text: 纽约南区联邦法院判处 30 年监禁，没收 8.89 亿美元, cite: c04-bbc-2026-06-30-guo-wengui }
  tier: 1
  headline: 北京地产商、流亡美国的“爆料”者，2026 年因诈骗被判 30 年
  ids: { wikidata: Q19840320 }
  positions:
    - { title: 北京政泉置业有限公司实际控制人, sys: other, place: 北京, cite: b14-bbc-2018-12-27-ma-jian }
    - { title: GTV 传媒集团联合创办人, sys: other, cite: b14-bbc-2024-07-18-guo-machine }
  bio: >-
    北京房地产商，开发盘古大观，曾借“盘古会”结交高官，与国家安全部原副部长马建长期利益勾连。2014 年出逃，2017 年起在美国通过推特、YouTube 和海外媒体“爆料”，指控王岐山、孟建柱等高官腐败，成为十九大前搅动北京政治的海外变量；中国则对他发出红色通缉令。
    他随后与班农结盟，创办 GTV、发起“新中国联邦”，在海外华人中聚集大批追随者，又以“惩治叛徒”攻击其他异见者。2023 年 3 月被捕，2024 年 7 月被认定欺诈、洗钱等罪成立，2026 年 6 月被判 30 年监禁。
  life:
    - h: 山东出身与北京地产
      from: 1967
      to: 2013
      text: >-
        Wikidata 记他 1967 年 2 月 2 日生；BBC 引《纽约客》人物稿则说他 1970 年生于山东一个贫困家庭，兄弟姐妹八人，媒体报道的年龄也前后不一。他祖籍山东，在北京以房地产起家，开发了北京火炬形建筑盘古大观。
        据中国媒体报道，他以社交圈“盘古会”为平台结交高官，织成利益网络。BBC 称他早年“与中国政府关系良好”。2016 年 10 月的胡润百富榜上，他的资产为 180 亿元人民币。
      cites: [wd-Q19840320, b14-bbc-2024-07-18-guo-machine, b14-bbc-2017-04-21-guo-baoliao, b14-bbc-2018-12-27-ma-jian, c04-bbc-2026-06-30-guo-wengui]
    - h: 马建与民族证券
      from: 1999
      to: 2018
      text: >-
        2018 年 12 月 27 日，大连中院以受贿、强迫交易、内幕交易罪判处国家安全部原副部长马建无期徒刑，三项罪名都与郭文贵相关。判决认定，马建 1999 至 2014 年为郭文贵及其实际控制的北京政泉置业等提供帮助，本人或通过亲属收受财物折合 1.09 亿余元；2008 至 2014 年两人共谋以威胁等手段，让政泉公司控股中国民族证券。
        马建在 2017 年的认罪视频中承认收过郭文贵超过 1 亿元的财物。BBC 写道，马建的强迫交易“情节特别严重，影响特别恶劣”。
      cites: [b14-bbc-2018-12-27-ma-jian, b14-bbc-2023-03-16-guo-charged]
    - h: 出逃与“爆料”
      from: 2014
      to: 2017
      text: >-
        2014 年，在一场商业纠纷和他的一名情报联系人被捕后，他逃离中国，经伦敦到纽约；此后两个兄弟和许多前雇员被判入狱。2017 年 1 月和 3 月他在明镜电视直播指控公安政法高官，4 月 18 日国际刑警组织发出红色通缉令，《南华早报》称涉嫌向马建行贿。
        4 月 19 日美国之音原定 3 小时的直播中途中断。他指控王岐山家人是海航股东，BBC 记述，他的指控遍及高官，“唯一没受到他指控的，只有习近平。”评论认为这场“爆料”可能是十九大前博弈的一部分。
      cites: [b14-bbc-2024-07-18-guo-machine, b14-bbc-2017-12-10-guo-bannon, b14-bbc-2017-04-21-guo-baoliao, b04-bbc-2018-03-17-wang-vp, b04-bbc-xi-cave-to-summit]
    - h: 与班农结盟
      from: 2017-10
      to: 2020
      text: >-
        2017 年 10 月他与刚离开白宫的班农首次会面，12 月对法新社说“我想尝试实现民主和自由，这是我的终极目标……政权变化”。2018 年 11 月两人宣布设立 1 亿美元的“法治基金”，班农任主席；他说“我们都鄙视中共，这是自然的”，班农则称他是有潜在价值的“情报资产”。
        BBC 根据泄露文件称他的一家公司向班农支付了 100 万美元咨询费，两人共同创办 GTV，并在 2020 年发起旨在推翻中共的“新中国联邦”。同年 8 月班农在他的游艇上因另案被捕。
      cites: [b14-nytcn-2018-12-05-guo-bannon, b14-bbc-2017-12-10-guo-bannon, b14-bbc-2024-07-18-guo-machine, b14-bbc-2023-03-16-guo-charged]
    - h: 追随者与“惩治叛徒”
      from: 2018
      to: 2023
      text: >-
        起诉书称，约 5500 名投资者向他声称估值 20 亿美元、实际没有收入的 GTV 投入 4.52 亿美元；GTV 还因加密货币项目向美国证交会支付 5.39 亿美元和解。BBC 采访的前追随者说，捐款十多万美元可成为核心圈子的“老椅子”。
        他发起所谓“惩治叛徒”运动，粉丝聚集到滕彪、傅希秋等异见者家门外，指他们是中共间谍。前追随者可可后悔地说：“那些人并不像郭文贵所说的那样是中共间谍。”批评者包括在美国法庭上指他是为中国政府工作的“双面间谍”。
      cites: [b14-bbc-2024-07-18-guo-machine]
    - h: 被捕与定罪
      from: 2023-03
      to: 2024-07
      text: >-
        2023 年 3 月他在纽约被捕，与伦敦的商业伙伴余建明被控从数千名追随者处骗取约 10 亿美元，起诉书用名郭浩云；钱被指用于豪宅、游艇、跑车，甚至价值 100 万美元的地毯。他的基金会称指控“捏造及毫无根据”。中国官媒只发简短通稿，称他为“潜逃美国的国际刑警组织红色通报在逃人员”。
        2024 年 7 月 16 日，陪审团经七周审判，认定他 12 项指控中的 9 项成立，包括敲诈勒索、欺诈和洗钱；他此前宣布破产，名下不足 10 万美元。
      cites: [b14-bbc-2023-03-16-guo-charged, b14-bbc-2024-07-18-guo-machine, c04-voa-2026-06-30-guo-wengui, c04-bbc-2026-06-30-guo-wengui]
    - h: 判刑 30 年
      from: 2026-06
      to: 2026-06
      text: >-
        2026 年 6 月 29 日，联邦法官托雷斯在曼哈顿判处他 30 年监禁，没收 8.89 亿美元所得及新泽西豪宅、兰博基尼等财产；2022 至 2023 年当局已没收逾 6.3 亿美元。托雷斯说他“利用那些希望为中国带来民主的人”。
        检察官巴克利称他“利用数以千计人士对他的信任，为自身贪婪牟利”。他在庭上称羁押期间遭不当对待，并否认指控，称资金用于政治活动。
      cites: [c04-voa-2026-06-30-guo-wengui, c04-bbc-2026-06-30-guo-wengui]
  assess:
    - voice: official
      quote: true
      text: 潜逃美国的国际刑警组织红色通报在逃人员
      cite: b14-bbc-2023-03-16-guo-charged
    - voice: west
      quote: true
      text: 郭文贵策划了一项庞大的骗局，通过谎言和欺骗手段从数千名美国人和世界各地的受害者那里窃取了超过10亿美元
      cite: c04-voa-2026-06-30-guo-wengui
    - voice: scholar
      quote: true
      text: 郭文贵在中国逃过司法起诉是得益于强权者的庇护
      cite: b14-bbc-2023-03-16-guo-charged
    - voice: zh
      quote: true
      text: 但也正是这些关系，让批评者指责他……是一名为中国政府工作的双面间谍
      cite: b14-bbc-2024-07-18-guo-machine
  family:
    - name: 两名兄弟（未具名）
      rel: 兄弟
      text: >-
        BBC 2017 年报道，郭文贵 2014 年出逃后，他的两位兄弟以及很多前雇员已在中国被判入狱。
      cites: [b14-bbc-2017-12-10-guo-bannon]
    - name: 儿子（未具名）
      rel: 儿子
      text: >-
        美国检方称，郭文贵及家人用受害者资金挥霍，其中包括为儿子购买的两辆价值数百万美元的跑车。
      cites: [c04-voa-2026-06-30-guo-wengui]
  cites: [b14-bbc-2017-04-21-guo-baoliao, b14-bbc-2018-12-27-ma-jian, b14-bbc-2023-03-16-guo-charged, b14-bbc-2024-07-18-guo-machine, b14-nytcn-2018-12-05-guo-bannon, c04-voa-2026-06-30-guo-wengui, c04-bbc-2026-06-30-guo-wengui, wd-Q19840320]

- id: xu-jiayin
  name: 许家印
  pinyin: Xǔ Jiāyìn
  aka: [Hui Ka Yan]
  gender: m
  born: 1958-10-09
  birthplace: 河南太康
  education:
    - { school: 武汉科技大学（时为武汉钢铁学院） }
  roles: [biz]
  status: detained
  statusNote: 2023 年 9 月被采取强制措施，2026 年 8 月 20 日一审被判无期徒刑。
  fall:
    - { date: 2023-09-28, text: 中国恒大公告其因涉嫌违法犯罪被依法采取强制措施, cite: b14-xinhua-2023-09-28-xu-detained }
    - { date: 2024-03-18, text: 证监会事先告知书拟对其采取终身证券市场禁入措施, cite: b14-bjd-2024-03-18-evergrande-fraud }
    - { date: 2024-05-31, text: 证监会作出处罚决定，顶格罚款 4700 万元并终身证券市场禁入, cite: b14-xinhua-2024-05-31-evergrande-penalty }
    - { date: 2026-04-14, text: 深圳中院公开开庭审理，当庭表示认罪悔罪, cite: b14-xinhua-2026-04-14-xu-trial }
    - { date: 2026-08-20, text: 深圳中院一审数罪并罚判处无期徒刑，剥夺政治权利终身，没收个人全部财产, cite: c04-xinhua-2026-08-20-xu-jiayin }
  tier: 1
  headline: 恒大集团创始人、前全国政协常委，2026 年一审被判无期徒刑
  ids: { wikidata: Q1454895 }
  positions:
    - { title: 恒大集团董事局主席, sys: other, place: 广东, from: 1996, to: 2023-09, cite: b14-xinhua-2023-09-28-xu-detained }
    - { title: 全国政协委员, sys: other, from: 2008, to: 2013, cite: b14-zaobao-2022-03-09-xu-cppcc }
    - { title: 全国政协常委, sys: other, from: 2013, to: 2023, cite: b14-bbc-2023-03-xu-cppcc }
  bio: >-
    河南农村出身，1996 年在广州创立恒大，借城市化和高杠杆扩张，2017 年成为中国首富。他是中共党员，2008 年起任全国政协委员、2013 年起任常委，2021 年 7 月 1 日登上天安门城楼，自称“我和恒大的一切，都是党给的”。
    在“三道红线”“房住不炒”之下，恒大 2021 年爆雷，留下逾 2 万亿元债务和大量烂尾楼，成为习近平时代整顿房地产和金融风险的标志案例。他 2023 年 9 月被采取强制措施，证监会认定恒大两年虚增收入 5640 亿元；2026 年 8 月深圳中院以集资诈骗等八项罪名判处他无期徒刑。
  life:
    - h: 河南农村少年
      from: 1958
      to: 1996
      text: >-
        1958 年生于河南周口太康县。纽约时报记述，他一岁时母亲因家里付不起医疗费去世，由奶奶在贫困的农村养大，上学带的窝头在潮湿的夏天发霉，就洗干净再吃。他 2018 年演讲时回忆，“非常渴望能够有一份工作，非常渴望能够走出农村、吃上白面”。
        文革后恢复高考，他考入武汉科技大学（时为武汉钢铁学院），毕业后在一家国有钢厂工作了十年。
      cites: [b14-bbc-2023-09-29-xu-probe, b14-nytcn-2023-10-09-xu-rise-fall]
    - h: 恒大扩张
      from: 1996
      to: 2017
      text: >-
        1996 年他在广州创立恒大，正值政府推动数亿人口进城。恒大购入数百块土地，承诺建成配有交通和好学校的中产楼盘，销量超过同行。2008 年恒大一度陷入债务危机，靠香港富豪郑裕彤注资 5 亿美元翻盘；2009 年在香港上市。
        此后他把利润投向足球、矿泉水、电动汽车和中药等与中共优先事项一致的领域，2010 年收购广州最好的足球俱乐部。2017 年他以约 425 亿美元身家成为亚洲首富，胡润估计他身家最高达 438 亿美元。
      cites: [b14-nytcn-2023-10-09-xu-rise-fall, b14-zaobao-2022-03-09-xu-cppcc, c04-bbc-2026-08-20-xu-jiayin]
    - h: 政协常委与“党给的”
      from: 2008
      to: 2021
      text: >-
        身为中共党员，他 2008 年当选全国政协委员，2013 年起任全国政协常委，是少有达到这个层级的企业家。2012 年两会他腰系爱马仕金扣皮带小跑进会场，被网民称为“皮带哥”；次年改系国产七匹狼。此后他积极参政，发言紧扣足球改革、扶贫、乡村振兴等政策主旋律。
        他 2018 年说：“我和恒大的一切，都是党给的，国家给的，社会给的。”2021 年 7 月 1 日中共建党百年庆典上，他作为嘉宾登上天安门城楼，彭博社称此举被投资者解读为他仍获北京支持。
      cites: [b14-zaobao-2022-03-09-xu-cppcc, b14-bbc-2023-03-xu-cppcc, b14-nytcn-2023-10-09-xu-rise-fall]
    - h: 爆雷
      from: 2020
      to: 2022
      text: >-
        2020 年监管部门对重点房企融资划出“三道红线”，恒大资金链吃紧。恒大财富向员工层层摊派理财产品，集资约 400 亿元，2021 年 9 月爆雷。他变卖个人资产、质押股权向集团注资逾 70 亿元仍杯水车薪；12 月 3 日恒大公告无法履行担保责任，广东省政府当晚约谈他，惠誉随后将恒大列入“限制性违约”。
        2022 年全国两会他以“公司在全力化解经营危机”为由请假，联合早报称有消息说他是被告知不要出席；网民调侃“钱必须国家印，不能许家印”。
      cites: [b14-bbc-2023-03-xu-cppcc, b14-bbc-2023-09-29-xu-probe, b14-zaobao-2022-03-09-xu-cppcc, e04-nytcn-2021-12-10-evergrande]
    - h: 退出政协与被抓
      from: 2023
      to: 2023
      text: >-
        2023 年春，他未进入十四届全国政协名单，结束 15 年两会生涯。8 月恒大在纽约申请破产保护。9 月 28 日恒大在港交所公告，他“因涉嫌违法犯罪，已被依法采取强制措施”，多名高管同被调查。
        BBC 称恒大身背 2.4 万亿元债务，中国媒体估算烂尾楼达 162 万套、涉及 600 万业主。此前他与妻子丁玉梅离婚、在美国为儿子设立信托，被舆论质疑转移资产。
      cites: [b14-bbc-2023-03-xu-cppcc, b14-nytcn-2023-10-09-xu-rise-fall, b14-xinhua-2023-09-28-xu-detained, b14-bbc-2023-09-29-xu-probe]
    - h: 清盘与证监会处罚
      from: 2024
      to: 2024
      text: >-
        2024 年 1 月 29 日，香港高等法院对中国恒大颁布清盘令。3 月 18 日恒大地产披露证监会事先告知书：2019 年虚增收入 2139.89 亿元，2020 年虚增 3501.57 亿元，两年合计 5640 亿元；证监会称“许家印决策并组织实施财务造假，手段特别恶劣，情节特别严重”。
        5 月 31 日证监会正式决定，对恒大地产罚款 41.75 亿元，对许家印“处以顶格罚款4700万元并采取终身证券市场禁入措施”。
      cites: [e04-bbc-2024-02-02-evergrande-liquidation, b14-bjd-2024-03-18-evergrande-fraud, b14-xinhua-2024-05-31-evergrande-penalty]
