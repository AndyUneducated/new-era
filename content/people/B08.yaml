    - { title: 陆军参谋长, sys: army, from: 2015-12, to: 2021-06, cite: b08-wiki-liu-zhenli }
    - { title: 陆军司令员, sys: army, from: 2021-06, to: 2023-03, cite: b08-wiki-liu-zhenli }
    - { title: 中共中央军委委员, sys: party, from: 2022-10, to: 2026-09, cite: b08-wikisource-2022-10-23-20-1-plenum }
    - { title: 中央军委联合参谋部参谋长, sys: army, from: 2023-03, to: 2026-01, cite: b08-wiki-liu-zhenli }
    - { title: 国家中央军委委员, sys: army, from: 2023-03, to: 2026-08, cite: b08-xinhua-2026-08-28-zhang-liu-removed }
  fall:
    - date: 2026-01-24
      text: 国防部宣布，张又侠、刘振立涉嫌严重违纪违法，经党中央研究，被立案审查调查。
      cite: b08-mod-2026-01-24-zhang-liu-probe
    - date: 2026-08-28
      text: 全国人大常委会免去其国家中央军委委员职务，未说明原因，也未宣布接替人选。
      cite: b08-xinhua-2026-08-28-zhang-liu-removed
    - date: 2026-09-21
      text: 经中央军委常务会议研究并报中央政治局会议审议，给予开除党籍处分，终止其二十大代表资格，移送军事检察机关；此前已被开除军籍。
      cite: b08-mod-2026-09-21-zhang-liu-expelled
  life:
    - h: 侦察兵与两山轮战
      from: 1983
      to: 1990
      text: >-
        河北栾城人，1983 年 9 月入伍，编入陆军第 112 师侦察连，1984 年入党。1986 年 4 月 30 日起作为第十二侦察大队一员编入兰州军区对越轮战部队，参加两山战役，在前线一年多，击退越军 36 次进攻，获一等战功。
        詹姆斯敦基金会指出，他与张又侠是军委里仅有的两名有作战经历的人，两人当连长时都打过老山之战（该文写作 1984 年），亲眼见过解放军面对人数更少的越军时表现不佳；文章认为，这种亲身经历可能让他们在筹划对台作战时更倾向于联合火力打击。
      cites: [b08-wiki-liu-zhenli, b08-jamestown-2025-11-purification]
    - h: 北京军区的集团军
      from: 1990
      to: 2015
      text: >-
        此后历任学员、排长、副连长、连长、副营职参谋、营长、副处长、处长、旅参谋长、军炮兵指挥部主任，升任第 38 集团军 112 机械化步兵师师长。2009 年 12 月任北京军区第 65 集团军参谋长，2012 年 2 月任军长，2014 年 3 月调任第 38 集团军军长。
      cites: [b08-wiki-liu-zhenli]
    - h: 武警与陆军
      from: 2015
      to: 2023
      text: >-
        2015 年 7 月任武警部队参谋长，同年 12 月军改时进入新组建的陆军领导机构，任首任陆军参谋长。2021 年 6 月升任陆军司令员，次月晋升上将；2022 年 10 月二十届一中全会进入中央军委。
      cites: [b08-wiki-liu-zhenli, b08-wikisource-2022-10-23-20-1-plenum]
    - h: 联合参谋部
      from: 2023
      to: 2026-01
      text: >-
        2023 年 3 月调任中央军委联合参谋部参谋长，并在十四届全国人大一次会议上当选国家中央军委委员。同年 10 月出席张又侠致辞的香山论坛开幕式。
        2025 年 3 月两会上，他在解放军代表团称过去一年“面对外部压力加大、内部困难增多的复杂严峻形势”，要求持续深化政治整训、聚力提高备战打仗质效，“坚定灵活开展军事斗争，坚决完成党中央、中央军委和习主席赋予的各项任务”。
      cites: [b08-wiki-liu-zhenli, b08-xinhua-2023-03-11-cmc-announcement, b08-xinhua-2023-10-30-zhang-xiangshan, b08-xinhua-2025-03-06-pla-delegation]
    - h: 落马
      from: 2026-01
      to: 2026-09
      text: >-
        2026 年 1 月 24 日与张又侠同时被立案，国防部只说“经党中央研究”。次日《解放军报》社论把两人并列，称他们“严重践踏破坏军委主席负责制”“严重影响军委班子形象威信”，对军队政治建军、政治生态和战斗力建设“造成极大破坏”。8 月 28 日人大常委会免去他的国家军委委员职务并终止其人大代表资格；美国之音指出，此时官方仍未公开免去两人的党内军委职务。9 月 21 日被开除党籍军籍，通报称两人“搞团团伙伙，对党不忠诚不老实”。
      cites: [b08-mod-2026-01-24-zhang-liu-probe, b08-mod-2026-01-24-pla-daily-editorial, b08-xinhua-2026-08-28-zhang-liu-removed, b08-voa-2026-08-28-zhang-liu, b08-mod-2026-09-21-zhang-liu-expelled]
    - h: 解读
      from: 2026
      to: 2026
      text: >-
        BBC 分析指出，《解放军报》社论特意写了对“战斗力建设造成极大破坏”，对何卫东、苗华则没有这一条：苗华长期负责政工，而刘振立作为总参谋长负责具体的作战指挥，问题直接触及备战打仗的核心能力。BBC 还指出，他落马后解放军自实行军衔制以来首次没有一名陆军上将，剩下的四名上将分属火箭军、海军和空军。
        CSIS 认为，张、刘两人的倒台让军委失去了仅有的实战经验；联合参谋部等全军级关键部门也出现了空缺或刚刚补人的情况，军委里已不再有作战系统出身的领导人。
      cites: [f01-bbc-2026-01-27-zhang-youxia, b08-csis-2026-02-purges]
