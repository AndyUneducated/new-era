- id: zheng-yongnian
  name: 郑永年
  pinyin: Zhèng Yǒngnián
  gender: m
  born: 1962
  birthplace: 浙江
  education:
    - { school: 北京大学, degree: 法学学士, to: 1985 }
    - { school: 北京大学, degree: 法学硕士, to: 1988 }
    - { school: 普林斯顿大学, degree: 政治学博士, to: 1995 }
  roles: [scholar]
  status: active
  tier: 1
  headline: 香港中文大学（深圳）公共政策学院院长、前海国际事务研究院院长，前新加坡国立大学东亚研究所所长
  ids: { wikidata: Q8462925 }
  bio: >-
    政治学者，北京大学和普林斯顿大学出身，2008–2020 年任新加坡国立大学东亚研究所所长，常在《联合早报》发表评论，以论述“中国模式”与中国改革著称，
    国家副主席李源潮 2014 年说读过他不下五本著作。2019 年他接受《人民日报》海外版“侠客岛”采访时的“断水”说法引发争议。2020 年新加坡国立大学认定他曾未经同意拥抱下属，
    违反员工守则；同年他回国，在香港中文大学（深圳）创办前海国际事务研究院，并在习近平主持的经济社会领域专家座谈会上发言，2024 年任该校公共政策学院院长。
  positions:
    - { title: 北京大学政治与行政管理系讲师, sys: other, from: 1988, to: 1990, cite: i09-cuhksz-iia-zheng-yongnian-en }
    - { title: 新加坡国立大学东亚研究所研究员、资深研究员, sys: other, place: 新加坡, from: 1997, to: 2005, cite: i09-cuhksz-iia-zheng-yongnian-en }
    - { title: 诺丁汉大学中国政策研究所教授、研究主任, sys: other, place: 英国, from: 2005, to: 2008, cite: i09-cuhksz-iia-zheng-yongnian-en }
    - { title: 新加坡国立大学东亚研究所所长, sys: other, place: 新加坡, from: 2008, to: 2020, cite: i09-cuhksz-iia-zheng-yongnian-en }
    - { title: 香港中文大学（深圳）前海国际事务研究院院长, sys: other, place: 广东, from: 2020, cite: i09-cuhksz-2024-zheng-yongnian-decade }
    - { title: 香港中文大学（深圳）公共政策学院院长, sys: other, place: 广东, from: 2024, cite: i09-cuhksz-2024-zheng-yongnian-decade }
  life:
    - h: 北大与普林斯顿
      from: 1962
      to: 1997
      text: >-
        1962 年生于浙江。1985、1988 年先后获北京大学法学学士、硕士，1988–1990 年在北大政治与行政管理系任讲师。
        此后赴美，1992 年获普林斯顿大学政治学硕士，1995 年获博士，又在哈佛大学做博士后研究，1995–1997 年为美国社会科学研究会—麦克阿瑟基金会研究员。
      cites: [i09-cuhksz-spp-zheng-yongnian, i09-cuhksz-iia-zheng-yongnian-en, i09-cuhksz-2024-zheng-yongnian-decade]
    - h: 新加坡与诺丁汉
      from: 1997
      to: 2008
      text: >-
        1997 年起在新加坡国立大学东亚研究所任研究员、资深研究员，1998–2000 年获麦克阿瑟基金会研究资助，2005–2008 年任英国诺丁汉大学中国政策研究所教授和研究主任。
        他同时在新加坡《联合早报》等华文媒体发表时评，评论中国的政治改革与国家转型；他自述从北大毕业后辗转美国、新加坡和英国，一直在思考大学教育与学术研究的意义。
      cites: [i09-cuhksz-iia-zheng-yongnian-en, i09-chinanews-2010-05-04-zheng-china-model, i09-cuhksz-2024-zheng-yongnian-decade]
    - h: 中国模式
      from: 2008
      to: 2014
      text: >-
        2008 年回新加坡出任东亚研究所所长。2010 年他在《联合早报》撰文说，“中国模式”的争论“已经过于政治化甚至道德化”，主张承认这一模式客观存在，
        并认为“如何改进‘中国模式’，是目前所面临的最大问题”。2014 年他对《时代周报》说“中国模式可以说就是改革模式”，主张一种
        “通过主动的国家转型来应对大转型带来的各种问题和挑战的战略选择”；又说“在政府与市场的关系上,中国的政府肯定是强于市场的”，中国“绝对不会走向西方的民主”。
        同年国家副主席李源潮会见学者时对他说，看过“不下五本”他的著作，“对中国很有借鉴”。
      cites: [i09-chinanews-2010-05-04-zheng-china-model, i09-people-2014-09-16-zheng-yongnian]
    - h: 断水风波
      from: 2019-08
      to: 2019-08
      text: >-
        2019 年 8 月香港反修例运动期间，他接受“侠客岛”采访，谈到运动如何收尾时转述一位新加坡前高官的话，“你只需要威脅斷水就好了”，随即说“這當然是玩笑說法”，又称香港“大部分人也知道自己跟內地分不開”，只是少数激进的人利用了国际化的便利。
        中国数字时代披露，官方曾下令各媒体推送这篇访谈，部分媒体以“斷水就可終結香港亂局”为题转载，引发香港舆论反感。他随后发表声明，指这一标题严重歪曲原意，要求删文道歉。
      cites: [i09-hket-2019-08-20-zheng-water, i09-cdt-2019-08-29-zheng-water]
    - h: 新加坡国立大学调查
      from: 2019
      to: 2020-11
      text: >-
        一名东亚研究所女职员 2019 年报警，指控他猥亵。新加坡警方 2020 年 4 月就此事对他发出严厉警告。2020 年 11 月新加坡国立大学公布内部调查结果，
        认定他在一次工作会议中未经同意拥抱该下属，违反员工行为守则，本应给予书面警告；因他已于当年离职，校方将结果记入员工档案。
      cites: [i09-straitstimes-2020-11-17-zheng-nus]
    - h: 回国与前海
      from: 2020
      to: 2026
      text: >-
        2020 年他回国，在香港中文大学（深圳）创立前海国际事务研究院。同年 8 月 24 日，他以该校全球与当代中国高等研究院院长身份在习近平主持的经济社会领域专家座谈会上发言。
        2021 年初他撰文说中国正处于“第三次开放的前夜”，主张“即使美国的强硬派围堵我们，封锁我们，我们也要向美西方国家开放”，认为“内循环的核心是统一国内的规则”。2024 年他任该校公共政策学院创始院长，校方称研究院的不少政策建议报告“被国家领导层审阅和采纳”。
      cites: [i09-cuhksz-2024-zheng-yongnian-decade, i09-gov-2020-08-24-expert-symposium, i09-zaobao-2021-01-02-zheng-third-opening]
  assess:
    - voice: scholar
      quote: true
      text: 理性而言，“中国模式”是客观存在的。就像是盖房子，房子盖好了肯定有个模式。
      cite: i09-chinanews-2010-05-04-zheng-china-model
    - voice: official
