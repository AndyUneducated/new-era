- id: lin-yifu
  name: 林毅夫
  pinyin: Lín Yìfū
  aka: [林正义, 林正谊, Justin Yifu Lin]
  gender: m
  born: 1952-10-15
  birthplace: 台湾宜兰
  education:
    - { school: 台湾大学农业工程系（肄业）, to: 1971 }
    - { school: 台湾政治大学企业管理研究所, degree: MBA, to: 1978 }
    - { school: 北京大学经济学系, degree: 政治经济学硕士, to: 1982 }
    - { school: 芝加哥大学经济系, degree: 经济学博士, to: 1986 }
  roles: [scholar]
  status: active
  tier: 1
  headline: 北京大学新结构经济学研究院院长、全国政协常委，前世界银行首席经济学家
  ids: { wikidata: Q709764 }
  bio: >-
    台湾宜兰人，原为驻守金门的国军连长，1979 年泅海投奔大陆，后获芝加哥大学经济学博士。1994 年参与创办北京大学中国经济研究中心，
    2008–2012 年任世界银行高级副行长兼首席经济学家，是出任此职的第一位发展中国家学者。他倡导“新结构经济学”，主张“有效市场”与“有为政府”并重，
    2016 年与张维迎的产业政策之争广受关注。他长期任全国政协委员、常委和国务院参事；台湾方面认定其叛逃属“继续犯”，至今维持通缉。
  positions:
    - { title: 国务院农村发展研究中心发展研究所副所长, sys: gov, from: 1987, to: 1990, cite: i09-pku-scholar-lin-yifu }
    - { title: 国务院发展研究中心农村部副部长, sys: gov, from: 1990, to: 1993, cite: i09-pku-scholar-lin-yifu }
    - { title: 北京大学中国经济研究中心主任, sys: other, from: 1994, to: 2008, cite: i09-pku-scholar-lin-yifu }
    - { title: 世界银行高级副行长兼首席经济学家, sys: other, from: 2008, to: 2012, cite: i09-pku-scholar-lin-yifu }
    - { title: 北京大学国家发展研究院荣誉院长, sys: other, from: 2012, cite: i09-pku-scholar-lin-yifu }
    - { title: 国务院参事, sys: gov, from: 2013, cite: i09-zhwiki-lin-yifu }
    - { title: 全国工商联专职副主席, sys: other, from: 2013, to: 2017, cite: i09-zhwiki-lin-yifu }
    - { title: 全国政协常委、经济委员会副主任, sys: other, from: 2013, cite: i09-cppcc-2023-01-18-lin-yifu }
  life:
    - h: 宜兰到金门
      from: 1952
      to: 1979
      text: >-
        1952 年生于台湾宜兰，原名林正义。他曾就读台湾大学农业工程系，1972 年转入陆军军官学校，1978 年取得政治大学企业管理研究所硕士；
        下部队后因与长官同名改名林正谊。1979 年 2 月出任金门马山连连长，国际货币基金组织的人物特写称他当时是“a model officer in the Taiwanese army”。
      cites: [i09-zhwiki-lin-yifu, i09-pku-scholar-lin-yifu, i09-imf-2012-09-lin-yifu]
    - h: 泅渡与求学
      from: 1979
      to: 1987
      text: >-
        1979 年 5 月 16 日夜，他从金门泅海约 2 公里到厦门，后再改名林毅夫，进入北京大学经济系读政治经济学硕士。其间他为来访的诺贝尔奖得主舒尔茨担任翻译，
        舒尔茨回美后为他安排了芝加哥大学的奖学金。1986 年他获芝加哥大学经济学博士，次年在耶鲁大学做博士后，随后回国。
      cites: [i09-zhwiki-lin-yifu, i09-imf-2012-09-lin-yifu, i09-pku-scholar-lin-yifu]
    - h: 智库与北大
      from: 1987
      to: 2008
      text: >-
        回国后他先在国务院农村发展研究中心发展研究所任副所长，1990–1993 年任国务院发展研究中心农村部副部长。1994 年他参与创办北京大学中国经济研究中心并任主任至 2008 年，
        国际货币基金组织的特写说该中心对中国经济政策的影响日增。美国之音 2002 年报道，他当时是全国政协委员。
      cites: [i09-pku-scholar-lin-yifu, i09-imf-2012-09-lin-yifu, i09-voa-2002-11-19-lin-yifu-wanted]
    - h: 世界银行
      from: 2008
      to: 2012
      text: >-
        2008–2012 年任世界银行高级副行长兼首席经济学家。他说自己“Not only the first from a developing country, but also [the first] to have a good understanding of developing countries”。
        任内他提出后来称为“新结构经济学”的发展框架，核心之一是由政府扶持与本国要素禀赋相符的产业，以推动结构转型，被视为对华盛顿共识的批评。
        国际货币基金组织的特写指出，这种俗称“picking winners and losers”的产业政策历史上毁誉参半，金融危机后又重新受到重视。
      cites: [i09-pku-scholar-lin-yifu, i09-imf-2012-09-lin-yifu]
    - h: 产业政策之争
      from: 2012
      to: 2016
      text: >-
        卸任后回北大任国家发展研究院荣誉院长。2013 年两会上他称中国经济未来 20 年仍有潜力维持 8% 的增长，对质疑回应说“我从来不认为自己是乐观派，我是客观派”。
        他反对“休克疗法”，人民日报海外版说他虽是“芝加哥经济学派”的嫡传弟子，却没有选择该学派的“自由市场”理论，认为私有化不能解决国企问题。2016 年 11 月他与张维迎公开辩论产业政策，张称“产业政策是穿着马甲的计划经济”，
        他则说“我郑重的说我是既要有市场，也要有政府”。
      cites: [i09-pku-scholar-lin-yifu, i09-rmrbhwb-2013-05-03-lin-yifu, i09-thepaper-2016-11-lin-zhang-debate]
    - h: 体制内的位置
      from: 2013
      to: 2026
      text: >-
        2013 年起任国务院参事，2013–2017 年任全国工商联专职副主席，并任全国政协常委、经济委员会副主任。2020 年 8 月 24 日，
        习近平在中南海主持经济社会领域专家座谈会，新华社列出的 9 位发言专家中他排在首位，就“十四五”规划提出建议。他还获得 2022 年度全国政协委员优秀履职奖。
      cites: [i09-zhwiki-lin-yifu, i09-cppcc-2023-01-18-lin-yifu, i09-gov-2020-08-24-expert-symposium]
    - h: 无法返台
      from: 2002
      to: 2014
      text: >-
        2002 年父亲在宜兰去世，台湾方面仍视他为叛逃军官，他取消了返台奔丧的计划，并通过家人声明“我不願因我返台之事而引起爭議”。
        同年 11 月台湾国防部正式通缉他。2014 年 1 月案件由军法移交金门的检察机关，检方认定他的“通敌现况并未消失”，属“继续犯”，继续通缉。
        台湾舆论对此分为两派：一派认为按当时刑法通缉时效早已过期，应让他返台探亲；另一派认为投敌行为仍在持续，不存在时效问题。
      cites: [i09-bbc-2002-06-02-lin-yifu-funeral, i09-voa-2002-11-19-lin-yifu-wanted, i09-rfi-2014-01-13-lin-yifu, i09-zhwiki-lin-yifu]
  assess:
    - voice: west
      quote: true
      text: But his theories are a deliberate and sharp critique of the Washington Consensus, the broad range of “neoliberal” policies previously closely associated with Washington D.C. institutions, including the IMF, the U.S. Treasury, and the World Bank.
      zh: 但他的理论是对华盛顿共识有意且尖锐的批评；华盛顿共识指过去与国际货币基金组织、美国财政部和世界银行等华盛顿机构紧密相关的一整套“新自由主义”政策。
      cite: i09-imf-2012-09-lin-yifu
    - voice: official
      quote: true
      text: 林毅夫一直强调在市场的基础上发挥政府作用，在他看来，对于发展中国家而言，政府干预的重要性不言而喻。
      cite: i09-rmrbhwb-2013-05-03-lin-yifu
    - voice: zh
      quote: true
      text: 认为“经济发展有产业政策才能成功”的林毅夫和表示“产业政策是穿着马甲的计划经济”的张维迎，在该不该实施产业政策上意见相左。
      cite: i09-thepaper-2016-11-lin-zhang-debate
  family:
    - name: 陈云英
      rel: 妻
      text: 林毅夫在芝加哥读博期间，妻子陈云英带两个孩子赴美团聚，后在乔治·华盛顿大学获博士学位。
      cites: [i09-imf-2012-09-lin-yifu]
