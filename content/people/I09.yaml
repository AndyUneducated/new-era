# I09 thinkers (round 9): scholars and theorists, with their views and their standing with the authorities

# --- 传记 ---
- id: yu-keping
  name: 俞可平
  pinyin: Yú Kěpíng
  gender: m
  born: 1959-07
  birthplace: 浙江诸暨
  education:
    - { school: 北京大学国际政治系, degree: 政治学博士, from: 1985 }
  roles: [scholar]
  status: active
  tier: 1
  headline: 深圳大学政府管理学院院长、北京大学讲席教授，曾任中央编译局副局长
  ids: { wikidata: Q3573073 }
  bio: >-
    政治学者，中国自己培养的第一代政治学博士之一，2001–2015 年任中共中央编译局副局长，以倡导“增量民主”“善治”闻名。
    2007 年初《学习时报》刊登、中新网转载他的《民主是个好东西》，文中称民主是“人类迄今最好的政治制度”，同时强调中国“不照搬国外的政治模式”，
    在国内外引起广泛反响，《外交事务》称他为胡锦涛的顾问。2015 年他请辞编译局职务，转任北京大学政府管理学院院长，2022 年起任深圳大学政府管理学院首任院长。
  positions:
    - { title: 中共中央编译局副局长, sys: party, from: 2001, to: 2015-10, cite: i09-zhwiki-yu-keping }
    - { title: 北京大学中国政治学研究中心主任、讲席教授, sys: other, from: 2015-10, cite: i09-caixin-2015-10-28-yu-keping }
    - { title: 北京大学政府管理学院院长, sys: other, from: 2015-10, to: 2020-11, cite: i09-zhwiki-yu-keping }
    - { title: 北京大学城市治理研究院院长, sys: other, cite: i09-szu-2022-07-11-yu-keping }
    - { title: 马克思主义理论研究和建设工程重点课题首席专家, sys: other, cite: i09-szu-yu-keping-profile }
    - { title: 深圳大学政府管理学院院长, sys: other, place: 广东, from: 2022-07, cite: i09-szu-2022-07-11-yu-keping }
  life:
    - h: 求学与编译局
      from: 1959
      to: 2000
      text: >-
        1959 年生于浙江诸暨。1985 年考入北京大学国际政治系攻读政治学博士，财新称他由此“成为中国自己培养的第一代政治学博士”。
        毕业后在北大政治学与行政管理系任教，不久调入中共中央编译局，曾任编译局比较政治与经济研究中心主任，2001 年起任副局长，直到 2015 年。
      cites: [i09-caixin-2015-10-28-yu-keping, i09-zhwiki-yu-keping]
    - h: 增量民主与善治
      from: 2000
      to: 2008
      text: >-
        在编译局期间，他先后提出“增量政治改革”与“增量民主”等概念，出版《增量民主与善治》等书，把中国治理改革的方向概括为
        “从一元治理到多元治理；从集权到分权；从人治到法治；从管制政府到服务政府；从党内民主到社会民主”。
        他还创办“中国地方政府创新奖”，主持研制中国国家治理评估指标体系，并长期担任马克思主义理论研究和建设工程课题的首席专家。
      cites: [i09-eeo-2008-yu-keping-good-governance, i09-szu-2022-07-11-yu-keping, i09-szu-yu-keping-profile]
    - h: 民主是个好东西
      from: 2007
      to: 2009
      text: >-
        2007 年初，《学习时报》刊登他的文章《民主是个好东西》，中新网全文转载。文章承认民主有许多内在不足，但说
        “在人类迄今发明和推行的所有政治制度中，民主是弊端最少的一种”；又说“不顾条件而推行民主，会给国家和人民带来灾难性的结果”，
        主张建设中国特色社会主义民主政治，“不照搬国外的政治模式”。美国布鲁金斯学会随后出版了他的英文文集，书名即 Democracy Is a Good Thing。
        《外交事务》的书评说，他把民主称为普世价值，却拒绝西方模式。
      cites: [i09-sina-2007-01-05-yu-keping-democracy, i09-fa-2009-05-yu-keping-review]
    - h: 参与中央决策调研
      from: 2000
      to: 2015
      text: >-
        深圳大学的简介说，他“长期参与中央重大决策调研并负责多项国家重大研究课题”，先后主持“党内民主研究”“党和国家领导体制改革研究”
        “中国治理改革30年：1978-2008”等课题，并担任由 18 个国家社科基金重大项目组成的马工程重点课题“马克思主义经典著作基本观点研究”的首席专家和第一责任人。
        美国《外交事务》的书评称他为胡锦涛的顾问。
      cites: [i09-szu-yu-keping-profile, i09-fa-2009-05-yu-keping-review]
    - h: 善政与政治学的公理
      from: 2014
      to: 2016
      text: >-
        2014 年他在《学习时报》撰文，提出善政应具备“民主、责任、服务、质量、效益、专业、透明和廉洁”八个要素，主张确保各级官员
        “由公民通过自由而公正的选举产生”。2015 年底在北大讲座中他提出政治学的“公理”，认为民主政治是最理想的社会制度、民主不独属于西方，
        并用“谁产生权力，权力就对谁负责”解释腐败屡禁不止：“如果是一片官员腐败，那肯定是制度出了问题”。
      cites: [i09-people-2014-11-03-yu-keping-good-gov, i09-pku-2015-12-yu-keping-axioms, i09-chinareform-2016-yu-keping-axioms]
    - h: 辞官回北大
      from: 2015
      to: 2022
      text: >-
        2012 年 12 月他受聘为新成立的中国红十字会社会监督委员会委员。2015 年 10 月，他在一次研讨会上宣布“经多次申请”获准辞去中央编译局副局长，转任北京大学新组建的政治学研究中心主任、讲席教授，
        并接替罗豪才兼任北大政府管理学院院长，2020 年 11 月卸任院长。此后他提出“官本主义”的分析框架，称“民主法治是破解官本主义的不二法门”，
        并主持编纂多卷本《政治通鉴》。
      cites: [i09-caixin-2015-10-28-yu-keping, i09-zhwiki-yu-keping, i09-caixin-2016-02-19-yu-keping-officialism, i09-szu-2022-07-11-yu-keping]
    - h: 南下深圳
      from: 2022
      to: 2026
      text: >-
        2022 年 7 月出任深圳大学政府管理学院首任院长。就职时他说，“比起做官来，他更愿意做事”，在北京专心做政治学基础研究，
        在深圳则侧重国家治理和城市治理的现实问题。到 2026 年他仍任深大政府管理学院院长、北大中国政治学研究中心主任，
        当年 6 月在清华大学的论坛上以“数智化对国家主权的新挑战”为题作主旨发言。
      cites: [i09-szu-2022-07-11-yu-keping, i09-szu-2026-06-17-yu-keping]
  assess:
    - voice: official
      quote: true
      text: 因倡导“治理”“善治”“社会治理”“全球治理”“官民共治”“增量民主”“政府创新”“动态稳定”“协商民主”等而广受关注，其《民主是个好东西》一文曾引起极大反响
      cite: i09-szu-yu-keping-profile
    - voice: zh
      quote: true
      text: 俞可平重视中国现实政治问题，先后提出“增量政治改革”与“增量民主”等概念，在学术界引起广泛影响。
      cite: i09-eeo-2008-yu-keping-good-governance
    - voice: scholar
      quote: true
      text: The puzzle is whether such arguments are intended to push for reform from within the system or to appropriate the label of democracy for practices that are anything but.
      zh: 问题在于，这些论点究竟是要从体制内推动改革，还是要把民主的标签挪用到根本谈不上民主的做法上。
      cite: i09-fa-2009-05-yu-keping-review
