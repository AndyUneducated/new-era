    胡耀邦长子，曾任全国工商联党组书记、全国政协常委兼经济委员会副主任。BBC 报道，他在十八大前几个月曾到习近平家中恳谈，随后撰文《改革不可废 承诺不可弃》，主张破除国企垄断、落实宪政法治，批评“权大于法”。2013 年他又呼吁中共在宪法范围内活动，学者汪玉凯称其观点代表改革派的呼声。
