- id: gu-junshan
  name: 谷俊山
  pinyin: Gǔ Jùnshān
  gender: m
  born: 1956-10
  birthplace: 河南濮阳
  joinedWork: 1971-01
  roles: [tiger, general]
  status: detained
  statusNote: 2015 年 8 月被军事法院判处死缓，剥夺中将军衔。
  fall:
    - { date: 2012, text: 因涉贪被查, cite: c03-bbc-2015-08-10-gu-junshan }
    - { date: 2012-02, text: 总后勤部人事调整，不再担任副部长, cite: b13-caixin-2014-01-14-gu-tiger }
    - { date: 2013-01-12, text: 濮阳老家被军事检察院人员查抄，运走四卡车财物, cite: b13-cnbc-2014-01-15-gu-raid }
    - { date: 2014-03-31, text: 军事检察院以涉嫌贪污、受贿、挪用公款、滥用职权犯罪向军事法院提起公诉, cite: b13-people-2014-03-31-gu-prosecuted }
    - { date: 2015-08-10, text: 军事法院以贪污、受贿、挪用公款、行贿、滥用职权罪判处死缓，剥夺中将军衔, cite: c03-xinhua-2015-08-10-gu-junshan-verdict }
  tier: 1
  headline: 总后勤部原副部长，中将，2015 年被判死缓
  ids: { wikidata: Q8317191 }
  bio: >-
    空军地勤出身，1985 年靠岳父关系调回河南老家濮阳军分区搞经营，2001 年进京任总后勤部基建营房部副部长，2007 年任部长，2009 年任总后勤部副部长，2011 年晋中将。
    他执掌全军营房和军产土地多年，财新报道他在军产土地出让中收受巨额回扣。2012 年初在总后政委刘源举报下落马，2013 年老家被查抄出成箱军用茅台和纯金毛泽东像；他在审讯中供出的问题牵出徐才厚。
    2015 年以贪污、受贿、挪用公款、行贿、滥用职权五罪被判死缓，剥夺中将军衔。
  positions:
    - { title: 濮阳军分区后勤部长, sys: army, from: 1993-03, to: 1995, cite: b13-caixin-2014-01-14-gu-tiger }
    - { title: 解放军总后勤部基建营房部副部长, sys: army, from: 2001-07, to: 2007-06, cite: b13-caixin-2014-01-14-gu-tiger }
    - { title: 解放军总后勤部基建营房部部长、全军房改办公室主任, sys: army, from: 2007-06, to: 2009, cite: b13-caixin-2014-01-14-gu-tiger }
    - { title: 解放军总后勤部副部长, sys: army, from: 2009, to: 2012-02, cite: c03-bbc-2015-08-10-gu-junshan }
  factions:
    - f: guo-xu
      cite: c03-bbc-2015-08-10-gu-junshan
      quote: 谷俊山与已故中央军委前副主席徐才厚关系密切，谷俊山涉贪被捕后，供出徐才厚之犯罪详情，间接将徐拉下马。
  life:
    - h: 东白仓
      from: 1954
      to: 1985
      text: >-
        官方资料说他 1956 年 10 月生，但发小和战友说他实际生于 1954 年 10 月，案发后调查组专门到濮阳孟轲乡东白仓村和他读过的小学查证年龄。1971 年 1 月初中毕业不久参军，被分到驻吉林柳河的沈阳军区航空兵 16 师 48 团当地勤。
        一位老上级对财新说：“我曾说他无德无才无貌。现在看来，也不能说是无才，会来事就是一种才能”。妻子张曙艳原是柳河县制药厂职工。
      cites: [b13-caixin-2014-01-14-gu-tiger]
    - h: 濮阳军分区
      from: 1985
      to: 2001
      text: >-
        1985 年百万大裁军时，岳父张龙海通过在济南军区的战友把他调到河南老家濮阳军分区，躲过了转业潮。他因不懂业务被安排搞第三产业，擅长迎来送往，从此平步青云：1993 年 3 月升任军分区后勤部长，1994 年接待济南军区首长时受到赏识，次年调到济南军区生产办公室任副主任。
        解放军报后来批评郭伯雄、徐才厚为提拔他“不惜改年龄、涂档案”。
      cites: [b13-caixin-2014-01-14-gu-tiger, f01-thepaper-2017-guo-xu]
    - h: 总后营房
      from: 2001
      to: 2009
      text: >-
        2001 年 7 月进京任总后勤部基建营房部副部长，两年后晋少将，2007 年 6 月任部长兼全军房改办公室主任。这些年正值军队大幅提高住房标准、营房大修大建，2007 年总后启动为期九年的全军营区综合配套整治，他对记者说现代营房要“让战士们喝上干净水，洗上热水澡，如厕很方便”。
        2009 年他主持修订营房面积标准，称老标准指标偏低，导致“无标准、超标准建房现象时有发生”。
      cites: [b13-caixin-2014-01-14-gu-tiger, b13-gmw-2007-07-22-barracks, b13-chinanews-2009-12-07-gu-standards]
    - h: 军产生意
      from: 2001
      to: 2012
      text: >-
        财新援引知情人士报道，他在多宗城市黄金地段军产土地出让中收受巨额回扣，还与地产商约定差价利润的六成归他；上海一块军产地卖了 20 多亿元，约 6% 是他的回扣。路透社说调查发现他在北京市中心拥有数十套公寓，他交代说是准备送人的。
        弟弟谷献军在濮阳仿照故宫修建宅邸，说“将军府”这个名字是大哥起的。2009 年他升任总后勤部副部长，2011 年晋中将。
      cites: [b13-caixin-2014-01-14-gu-tiger, b13-cnbc-2014-01-15-gu-raid]
    - h: 刘源举报
      from: 2011-12
      to: 2012-02
      text: >-
        时任总后政委刘源和总后党委以党委名义举报他。据军事科学院罗援少将转述，他扬言“我后面也有人”，总后部长廖锡龙怒称“我廖锡龙上过战场，死都不怕，还怕一个贪官？”
        长安街知事记载，2011 年 12 月 28 日的总后会议上，刘源称腐败已“涉及到共产党和解放军的生死存亡”，谷俊山与他同坐主席台；胡佛研究所的《中国领导人观察》则记为 2012 年 1 月 18 日的讲话，几天后谷俊山被捕。2012 年 2 月他不再担任副部长。
      cites: [b13-guancha-2015-12-24-liu-yuan, b13-hoover-2012-04-liu-yuan, b13-caixin-2014-01-14-gu-tiger]
    - h: 查抄与牵出徐才厚
      from: 2013-01
      to: 2014-06
      text: >-
        2013 年 1 月 12 日，军事检察院人员查抄他在东白仓村的老宅，运走四卡车财物，有成箱的军用茅台、寓意“一帆风顺”的金船、金脸盆和一尊纯金毛泽东像。8 月，公方彬大校首次公开提到他涉贪。
        2014 年 1 月财新刊出调查，何兵教授对美国之音说这传递出“反贪努力没有禁区”的信号。3 月 31 日军事检察院对他提起公诉。BBC 说他在审讯中供出了主要靠山徐才厚；同年 6 月徐才厚被开除党籍。
      cites: [b13-caixin-2014-01-14-gu-tiger, b13-cnbc-2014-01-15-gu-raid, b13-voa-2014-01-17-gu, b13-people-2014-03-31-gu-prosecuted, b13-bbc-2014-08-01-liu-yuan, b07-bbc-2014-06-30-xu-expulsion]
    - h: 死缓
      from: 2015-08
      to: 2019-04
      text: >-
        2015 年 8 月 10 日，军事法院一审以五罪判他死缓、剥夺政治权利终身、没收个人全部财产、剥夺中将军衔。法院说，案件证据涉及军事秘密，因此不公开开庭；他归案后“揭发他人犯罪行为，经查证属实，具有重大立功表现”，赃款赃物又已全部追缴，因此从宽处罚。
        2019 年 4 月，濮阳开始拆除“将军府”。
      cites: [b13-court-2015-08-10-gu-qa, c03-xinhua-2015-08-10-gu-junshan-verdict, b13-caixin-2014-01-14-gu-tiger]
  assess:
    - voice: official
      quote: true
      text: 将品行低劣的谷俊山火箭般擢升为总后勤部副部长，甚至不惜改年龄、涂档案
      cite: f01-thepaper-2017-guo-xu
    - voice: witness
      quote: true
      text: 我曾说他无德无才无貌。现在看来，也不能说是无才，会来事就是一种才能，可以说他情商很高。
      cite: b13-caixin-2014-01-14-gu-tiger
    - voice: zh
      quote: true
      text: 在谷俊山被捕之前，中国人民解放军已经有五年多没有发生备受瞩目的腐败案件了，这说明的更多是反腐执法所受的政治约束，而不是人民解放军真实的腐败程度
      cite: b13-nyt-2012-11-15-pla-corruption
    - voice: zh
      quote: true
      text: 他曾经协助前中共总书记胡锦涛打掉军中“大老虎”、解放军总后勤部副部长谷俊山。
      cite: f02-voa-2024-04-princelings
  family:
    - name: 张曙艳
      rel: 妻子
      text: 原柳河县制药厂职工，岳父张龙海是谷俊山的老首长。随丈夫调入濮阳市公安局，从信访工作做起，升任高新公安分局局长、市公安局政委；谷俊山进京后她也到北京，在濮阳驻京办负责信访接待和截访。
      cites: [b13-caixin-2014-01-14-gu-tiger]
    - name: 谷献军
      rel: 弟弟
      text: 1972 年 6 月生，兄弟中排行老三，人称谷三。在濮阳仿照故宫修建“将军府”，2009 年动工、2011 年夏初步竣工，2019 年 4 月被拆除。
      cites: [b13-caixin-2014-01-14-gu-tiger]
    - name: 谷彦生
      rel: 父亲
      text: 谷俊山为父亲争得“雨花台烈士”名号，修建专属陵园，2011 年 5 月又出版《生死记忆：周镐与谷彦生的故事》为他立传。
      cites: [b13-caixin-2014-01-14-gu-tiger]
  cites: [wd-Q8317191, c03-xinhua-2015-08-10-gu-junshan-verdict, c03-bbc-2015-08-10-gu-junshan, b13-caixin-2014-01-14-gu-tiger, b13-court-2015-08-10-gu-qa, b13-guancha-2015-12-24-liu-yuan]
