  life:
    - h: 马咸阳
      from: 1951
      to: 1968
      text: >-
        官方简历称他 1951 年 4 月生、陕西彬县人。《环球人物》到旬邑县赤道乡上官庄村探访发现，他原名马咸阳，生父马国选是 1938 年参加革命的老干部，后在湖北任职，39 岁就病逝；母亲房林江（音）带他改嫁到旬邑县城，小学高年级时又改嫁到彬县东街村，他随母姓改名峰辉。
        1968 年 2 月，不到 17 岁的他参军入伍。
      cites: [b13-ifeng-2019-02-20-fang-cv, b13-thepaper-2017-fang-past]
    - h: 西北参谋
      from: 1968
      to: 2003
      text: >-
        入伍后长期在新疆地区服役，历任作训参谋、团参谋长、师参谋长、新疆军区副参谋长，基层经历大多是参谋工作，1975 年 12 月入党。
        1998 年晋升少将，1999 年任兰州军区第 21 集团军军长。《环球人物》指出，他任军长时郭伯雄正任兰州军区司令员，两人是上下级，祖籍又同为陕西咸阳。《解放军报》曾报道他是个电子发烧友，订阅《无线电》杂志二十多年，爱钻研军事指挥软件。
      cites: [b13-thepaper-2017-fang-past, b13-sina-2014-08-13-fang-old-staff, b13-ifeng-2019-02-20-fang-cv]
    - h: 广州与北京
      from: 2003
      to: 2012
      text: >-
        2003 年 12 月跨区任广州军区参谋长，在那里和后来与他几乎同时落马的张阳搭班三年。2005 年晋中将，2007 年以 56 岁接替朱启任北京军区司令员，是当时七大军区司令员中最年轻的。
        2009 年任国庆 60 周年阅兵总指挥，接受采访时感慨自己“经历了骡马化、摩托化、半机械化到机械化和信息化复合发展的过程”。2010 年 7 月晋上将。维基百科汇集的说法称，他在北京军区任上卖出不少军产地皮，仅 292 医院一块就卖了 47 亿。
      cites: [b13-thepaper-2017-fang-past, b13-sina-2014-08-13-fang-old-staff, c02-wiki-fang-fenghui]
    - h: 总参谋长
      from: 2012
      to: 2015
      text: >-
        2012 年 10 月十八大前夕接替陈炳德任总参谋长，是第一个由北京军区司令员直升总参谋长的人，11 月进入中央军委。
        2014 年 5 月访问五角大楼，受到美方三年来首次给予中国军队领导人的全套军礼。他在与邓普西的记者会上说日本“购岛”使东海南海不再平静，“老祖宗留下的土地，一寸也不能丢！”，又说西沙的钻井“一定要打成”；他还借习近平的醒狮比喻，称中国是一头和平、可亲、文明的狮子。
      cites: [c02-wiki-fang-fenghui, c02-sina-2012-10-25-pla-hq, b13-defenseone-2014-05-15-fang, b13-sina-2014-05-16-fang-pentagon, b13-people-2014-05-16-fang-drilling]
    - h: 联合参谋部
      from: 2015-11
      to: 2017-09
      text: >-
        军委机关改革后，他出任新成立的联合参谋部首任参谋长。2017 年 4 月陪同习近平赴美与特朗普首次会面，6 月出席在华盛顿举行的首次中美外交与安全对话，8 月中旬与访华的美军参联会主席邓福德签署两军联合参谋部对话机制框架文件。
        8 月 21 日与泰国武装部队最高司令素拉蓬会谈后，他再未公开露面，随即传出李作成接任参谋长；9 月公布的军队十九大代表名单里没有他和张阳，国防部既不确认也不否认。
      cites: [c02-wiki-fang-fenghui, b13-voa-2017-09-07-fang-zhang, b13-bbc-2019-02-20-fang-sentence, b13-bbc-2018-01-10-fang-fenghui]
    - h: 落马与判决
      from: 2017-11
      to: 2019-02
      text: >-
        2017 年 11 月张阳在家中自缢，国防部发言人吴谦被问到房峰辉时只说“你谈到的这个情况我不了解”。军中知情人士对《环球人物》说，两人是同一天在各自家中接受调查的。
        2018 年 1 月他被移送军事检察机关，《解放军报》评论员称他“政治上变质、经济上贪婪”，把处理他定为肃清郭伯雄、徐才厚流毒的一部分。10 月被开除党籍、军籍。2019 年 2 月 20 日，军事法院以受贿、行贿、巨额财产来源不明三罪判他无期徒刑，没收个人全部财产。
      cites: [b13-bbc-2018-01-10-fang-fenghui, b13-thepaper-2017-fang-past, b13-people-2018-01-10-pla-daily-fang, c02-xinhua-2018-10-16-fang-fenghui, c02-court-2019-02-20-fang-fenghui]
    - h: 向谁行贿
      from: 2018
      to: 2025
      text: >-
        他究竟向谁行贿，官方没有说。联合早报转引星岛日报称，他是郭伯雄的老乡兼旧部，调查由习近平亲自下令。《环球人物》记录了战友在朋友圈传的诗：“工人用下岗买断了工龄，他们用晋升买断了将军。”
        2021 年的历史决议写入“坚决查处郭伯雄、徐才厚、房峰辉、张阳等严重违纪违法案件”。BBC 统计，习近平执政后被开除党籍军籍的 22 名上将中，只有他等 8 人在习之前就已是上将。
      cites: [c02-zaobao-2018-01-10-fang-fenghui, b13-thepaper-2017-fang-past, b04-gov-2021-11-16-resolution, b04-bbc-2025-10-nine-generals]
  assess:
    - voice: official
      quote: true
      text: 房峰辉对党不忠诚不老实，搞两面派做两面人，政治上蜕变、经济上贪婪，严重损害党的事业和军队形象
      cite: c02-xinhua-2018-10-16-fang-fenghui
    - voice: history
      quote: true
      text: 坚决查处郭伯雄、徐才厚、房峰辉、张阳等严重违纪违法案件并彻底肃清其流毒影响，推动人民军队政治生态根本好转
      cite: b04-gov-2021-11-16-resolution
    - voice: zh
      quote: true
      text: 此前，他曾於2009年指揮在北京市中心舉行的紀念中華人民共和國成立60週年閱兵式，似乎是習近平軍事現代化政策的積極擁護者。
      cite: b13-nyt-2018-01-10-fang
    - voice: zh
      quote: true
      text: 其中只有徐才厚、郭伯雄、张阳、房峰辉、王建平、王喜斌、田修思、刘亚洲八人在习近平执政之前就已是上将
      cite: b04-bbc-2025-10-nine-generals
  family:
