  tier: 1
  headline: 总参谋长、联合参谋部参谋长（2012–2017），2019 年被判无期徒刑
  bio: >-
    兰州军区参谋军官出身，1999 年任第 21 集团军军长，2003 年跨区任广州军区参谋长，2007 年以 56 岁出任北京军区司令员，2009 年任国庆 60 周年阅兵总指挥。
    2012 年由北京军区司令员直升总参谋长并进入中央军委，2014 年访问五角大楼时说“中国不惹事，但也不怕事”；军委机关改革后任联合参谋部首任参谋长。
    2017 年 8 月被李作成接替后消失，与老搭档张阳几乎同时落马，2019 年以受贿、行贿、巨额财产来源不明罪被判无期徒刑。
    2021 年的第三个历史决议把他与郭伯雄、徐才厚、张阳并列点名。
