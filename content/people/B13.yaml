      rel: 生父
      text: 旬邑县赤道乡上官庄村人，1938 年参加革命，1941 年入党，1957 年转业后任湖北省人事局科长、省文化局党委书记，1960 年 12 月在武昌病逝。旬邑县委、县政府 2008 年为他立碑。
      cites: [b13-thepaper-2017-fang-past]
    - name: 房林江（音）
      rel: 母亲
      text: 旬邑县人，丈夫去世后带着儿子两次改嫁，最后落脚彬县东街村，后任彬县印刷厂厂长；房峰辉随她改姓。
      cites: [b13-thepaper-2017-fang-past]
