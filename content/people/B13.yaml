    - f: rocket-equipment
      cite: f02-zaobao-2024-06-27-li-wei
      quote: 这显示魏凤和可能在他主管火箭军以及担任中央军委委员、国务委员兼国防部长期间，违规提拔火箭军高官，甚至推荐李尚福接替自己职位。
  life:
    - h: 导弹兵
      from: 1970
      to: 2003
      text: >-
        1954 年生于山东茌平，1970 年 12 月入伍，在第二炮兵五十四基地八一三团通信连当战士、班长，1972 年 1 月入党。
        此后他在这支部队待了近三十年：排长、作训参谋、作训股长、作训科长、副参谋长、参谋长，1994–1999 年任八一三旅旅长。其间他到国防科工委二十基地学导弹控制，又进修于第二炮兵学院和国防大学。1999 年起任五十四基地副参谋长、参谋长，2003 年任五十三基地司令员。
      cites: [c02-gov-2018-03-19-wei-fenghe-cv]
    - h: 二炮掌门
      from: 2004
      to: 2017
      text: >-
        2004 年调任第二炮兵副参谋长，2006 年任参谋长，2010 年任副总参谋长。2012 年回任二炮司令员，十八大进入中央军委；文汇报当时把他与房峰辉、张阳、张又侠、马晓天等人并列为一批具有现代军事思维、脱颖而出的新生代将领。
        2015 年底二炮改为火箭军，他任首任司令员。他是中共第十七届中央候补委员，十八届、十九届中央委员。
        2014 年底出任二炮政治部主任的张升民就在他手下工作，后来张升民任军委纪委书记八年，查处了一大批高级将领，2025 年升任军委副主席。
      cites: [c02-gov-2018-03-19-wei-fenghe-cv, b13-wenweipo-2012-11-05-fan-xu, b08-zaobao-2025-10-23-fourth-plenum]
    - h: 军委委员
      from: 2012-11
      to: 2022-10
      text: >-
        他在十八届、十九届两届中央军委都任委员，2013 年和 2018 年两度由全国人大任命为国家军委委员；十八届军委的八名委员中，只有他和张又侠进入了十九届军委。
        十九届军委只有七人，他和李作成、苗华、张升民四名委员多次一起出席习近平签署命令的晋升上将仪式。他的继任者李尚福和当年的同僚苗华后来也先后落马。
      cites: [c02-gov-2018-03-19-wei-fenghe-cv, c02-xinhua-2013-03-15-npc-cmc, c02-xinhua-2012-11-15-18-1-plenum, c02-xinhua-2017-10-25-19-1-plenum, c03-xinhua-2021-09-06-generals-promoted, b08-zaobao-2025-10-23-fourth-plenum]
    - h: 防长出访
      from: 2018-03
      to: 2019-06
      text: >-
        2018 年 3 月任国务委员兼国防部长。4 月他把首次出访定在莫斯科，说此行要“让美国人知道中国与俄罗斯军队之间的紧密关系”，美国之音指出这正值中美贸易战爆发、俄罗斯与西方关系恶化之际。
        2019 年 6 月他首次以防长身份出席香格里拉对话会，演讲中以林肯打赢南北战争、防止国家分裂类比台湾问题，说如果有人胆敢把台湾分裂出去，中国军队“必将不惜一战，必将不惜一切代价，坚决维护祖国统一”。
      cites: [c02-rmzxw-2018-03-19-state-council, b13-zaobao-2018-04-05-wei-moscow, b13-voa-2018-04-04-wei-moscow, b13-thepaper-2019-06-02-wei-shangri-la]
    - h: 香会答问
      from: 2019-06
      to: 2022-06
      text: >-
        同一场对话会答问时，他出乎众人意料地主动回到记者提出的六四问题，称那是“一场政治的风波，是一场政治的动乱”，中央平息动乱是正确的。他还说新疆的高等职业培训学校是为了去除极端化思想，并称华为没有和中国军方合作。
        2022 年 6 月他再赴香会，新华社报道他强调对台“我们一定会不惜一战、不惜代价”；法广引法新社说，他以攻击的口吻表示将为阻止台独战斗到底，听起来像在反驳美国防长奥斯汀前一天的讲话。
      cites: [b13-zaobao-2019-06-03-wei-june4, b13-cna-2019-06-02-wei-june4, b13-xinhua-2022-06-12-wei-shangri-la, b13-rfi-2022-06-12-wei-fight]
    - h: 消失与立案
      from: 2023-03
      to: 2023-09
      text: >-
        2023 年 3 月他卸任防长，由李尚福接替，此后基本从公开活动中消失。同年火箭军两名主官被换成来自其他军种的将领，《卫报》引分析人士称，这是要打破该军种的庇护网络。
        9 月 21 日，军委纪委监委根据查办案件中发现的线索对他立案。联合早报的分析认为，李尚福被控行贿，对象可能就包括前任魏凤和，而魏可能违规提拔火箭军高官，甚至推荐李尚福接替自己。
      cites: [f02-zaobao-2024-06-27-li-wei, b13-guardian-2024-06-27-wei-li, c02-gov-2024-06-27-wei-fenghe-expelled]
    - h: 开除与死缓
      from: 2024-06
      to: 2026-05
      text: >-
        2024 年 6 月 27 日，中央政治局会议决定开除他党籍，通报称他“信仰坍塌、忠诚失节”，违规为他人谋取人事利益，收受礼品礼金和巨额钱款，“严重污染部队政治生态”；此前他已被开除军籍、取消火箭军上将军衔。中央社注意到，通报没有提到外界盛传的火箭军集体贪腐案。
        2026 年 5 月 7 日，他与李尚福同日被军事法院判处死缓，期满减为无期徒刑后终身监禁，不得减刑、假释。
      cites: [c02-gov-2024-06-27-wei-fenghe-expelled, b13-cna-2024-06-27-wei-li, b08-gov-2026-05-07-wei-li-sentenced]
  assess:
    - voice: official
      quote: true
      text: 魏凤和身为党和军队高级领导干部，信仰坍塌、忠诚失节，其行为辜负党中央、中央军委信任重托，严重污染部队政治生态
      cite: c02-gov-2024-06-27-wei-fenghe-expelled
    - voice: zh
      quote: true
      text: 提拔李尚福的决定可以归咎于他的前任、前国防部长魏凤和（他已经被清洗了）。
      cite: b08-bbc-2024-07-18-third-plenum
    - voice: zh
      quote: true
      text: 其余 14人都是他任内提拔，除了此次公布的 9 人外，还有李尚福、魏凤和、丁来杭、李玉超、周亚宁。
      cite: b04-bbc-2025-10-nine-generals
  ids: { wikidata: Q7929529 }
  cites: [wd-Q7929529, c02-gov-2018-03-19-wei-fenghe-cv, c02-rmzxw-2018-03-19-state-council, b13-thepaper-2019-06-02-wei-shangri-la, b13-zaobao-2019-06-03-wei-june4, c02-gov-2024-06-27-wei-fenghe-expelled, b08-gov-2026-05-07-wei-li-sentenced, b13-guardian-2024-06-27-wei-li]

- id: fan-changlong
  name: 范长龙
  pinyin: Fàn Chánglóng
  gender: m
  ethnicity: 汉族
  born: 1947-05
  birthplace: 辽宁丹东
  education:
    - { school: 宣化炮兵学院, from: 1975-02, to: 1975-12 }
    - { school: 解放军军事学院完成班, from: 1980, to: 1982 }
    - { school: 中央党校领导干部函授班经济管理专业, degree: 大学, from: 1992, to: 1994 }
  joinedParty: 1969-09
  joinedWork: 1968-10
  roles: [pb, cmc, cc, general]
  status: retired
  statusNote: 2018 年 3 月卸任国家军委副主席后退休。
  tier: 1
  headline: 中央军委副主席（2012–2017）、政治局委员、上将
  bio: >-
    炮兵出身，1968 年在辽宁东沟当知青，次年入伍，在沈阳军区第 16 军（集团军）从战士一路做到军长，历任沈阳军区参谋长、总参谋长助理，2004–2012 年任济南军区司令员。
    2012 年 11 月十七届七中全会上，他由大军区司令员越过军委委员一级直接增补为军委副主席，十八大进入政治局，排名在许其亮之前。任内在《求是》撰文称“战场打不赢，一切等于零”，在古田会议上表态反腐，与许其亮一起协助习近平推进军队改革。
    2017 年十九大卸任，2018 年 3 月退休；同年初港媒称他被调查，军方罕见地公开辟谣。
  positions:
    - { title: 第 16 军炮兵团团长, sys: army, from: 1982, to: 1985, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 第 16 集团军 46 师师长, sys: army, from: 1990, to: 1993, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 第 16 集团军参谋长, sys: army, from: 1993, to: 1995, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 第 16 集团军军长, sys: army, from: 1995, to: 2000, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 沈阳军区参谋长, sys: army, from: 2000, to: 2003, cite: c02-wiki-fan-changlong }
    - { title: 总参谋长助理, sys: army, from: 2003-12, to: 2004-09, cite: c02-wiki-fan-changlong }
    - { title: 济南军区司令员, sys: army, from: 2004-09, to: 2012-11, cite: c02-wiki-fan-changlong }
    - { title: 中央军委副主席, sys: army, from: 2012-11, to: 2018-03, cite: c02-xinhua-2012-11-15-18-1-plenum }
    - { title: 中央政治局委员, sys: party, from: 2012-11, to: 2017-10, cite: c02-xinhua-2012-11-15-18-1-plenum }
  factions:
    - f: guo-xu
      cite: b13-voa-2018-01-25-fan-rumor
      quote: 范长龙被视为徐才厚的嫡系，两人既是辽宁同乡也是上下级
  life:
    - h: 炮兵团
      from: 1947
      to: 1985
      text: >-
        1947 年 5 月生于辽宁丹东。1968 年 10 月在东沟县孤山公社当知青，1969 年 1 月入伍，到陆军第十六军炮兵团当战士、班长，9 月入党。
        此后在炮兵团历任排长、宣传干事、组织干事和连政治指导员；据文汇报，他 1976 年连升三级，由连队指导员升为团首长。1979 年起任副团长兼参谋长，其间入解放军军事学院学习，1982–1985 年任炮兵团团长。
      cites: [c02-cyol-2012-11-16-18th-cvs, b13-wenweipo-2012-11-05-fan-xu]
    - h: 第 16 集团军
      from: 1985
      to: 2003
      text: >-
        1985 年起任第 16 集团军 48 师参谋长，1990 年任 46 师师长，1993 年任集团军参谋长，1995–2000 年任军长。詹姆斯敦基金会指出，这支拥有四个装甲师和多个旅的集团军是沈阳军区最大的部队之一。
        2000 年任沈阳军区参谋长，2002 年晋中将，2003 年 12 月调任总参谋长助理。他在沈阳军区系统前后三十多年，星岛日报后来称这里是徐才厚的根据地。
      cites: [c02-cyol-2012-11-16-18th-cvs, b13-jamestown-2012-11-new-vice-chairmen, c02-wiki-fan-changlong, b13-voa-2018-01-25-fan-rumor]
    - h: 济南军区
      from: 2004
      to: 2012
      text: >-
        2004 年 9 月由总参谋长助理转任济南军区司令员，一干八年，2008 年 7 月晋上将。詹姆斯敦基金会写道，济南军区在他任内进行了联合后勤、指挥结构和训练方式方面的关键试验。到 2012 年，文汇报称他已是七大军区中资历最老的司令员。
        他是十六届中央候补委员，十七届、十八届中央委员。他与许其亮的增补，是中共十六大以来第三次在中央全会上调整军委副主席，前两次分别让徐才厚、习近平进入这一职位。
      cites: [c02-wiki-fan-changlong, b13-jamestown-2012-11-high-command, b13-wenweipo-2012-11-05-fan-xu, c02-cyol-2012-11-16-18th-cvs, b13-caixin-2012-11-04-fan-xu-cmc]
    - h: 破格升任
      from: 2012-11
      to: 2012-11
      text: >-
        2012 年 11 月 4 日，十七届七中全会增补他和许其亮为军委副主席。财新指出这打破惯例，他成为“首位由大军区司令员升任的中共中央军委副主席”。
        詹姆斯敦基金会写道，外界原本长期预期总装备部部长常万全升任，他却越过常万全，还跳过了一个军职等级，这极为罕见；文汇报也说这一晋升轨迹在军内罕有。十八大上他进入政治局，任排名在许其亮之前的军委副主席。
        詹姆斯敦当时就判断，到下届党代会时他已超过退休年龄，大概只会干一届。
      cites: [b13-caixin-2012-11-04-fan-xu-cmc, b13-jamestown-2012-11-high-command, b13-wenweipo-2012-11-05-fan-xu, c02-xinhua-2012-11-15-18-1-plenum, b13-zaobao-2025-06-02-xu-death]
    - h: 反腐表态
      from: 2014
      to: 2014-11
      text: >-
        2014 年 10 月他在《求是》撰文，以甲午战败为鉴，称“国家综合实力竞争起托底作用的是军事实力”，又把徐才厚、谷俊山列为反面教材，说“军中绝不能有腐败分子藏身之地”。
        11 月古田全军政治工作会议闭幕时，他说习近平的讲话“听了很震撼、很受教育”，徐才厚案“影响极其恶劣，教训极其深刻”，要通过反腐把利剑悬在头上。
      cites: [b13-sina-2014-10-06-fan-qiushi, b13-xinhua-2014-11-02-gutian-close]
    - h: 对美交涉
      from: 2015-06
      to: 2016-07
      text: >-
        2015 年 6 月访美，在华盛顿与国防部长卡特会谈，称在南沙驻守岛礁搞建设是为改善驻守人员条件，敦促美方不选边站，并引诗“望远能知风浪小，凌空始觉海波平”。法新社注意到，这次宾主没有举行联合记者会。
        2016 年 7 月南海仲裁案裁决后，他对来访的美国总统国家安全事务助理说中国不接受、不承认裁决，并警告美国在韩国部署萨德将直接危害中国的战略安全。
      cites: [b13-consulate-2015-06-13-fan-carter, b13-voacantonese-2015-06-12-fan-carter, b13-thepaper-2016-07-25-fan-rice]
    - h: 退休与传闻
      from: 2017
      to: 2018
      text: >-
        2017 年十九大后他卸任党的军委副主席，2018 年 3 月卸任国家军委副主席退休。2018 年 1 月，星岛日报称房峰辉案“牵出他（范长龙）不少事”，中央决定把他拿下。国防部发言人吴谦被问到时，只建议记者去看《解放军报》的一篇文章。
        解放军报微博随后转载那篇文章，把他的名字标成红字，法广认为用意明显是辟谣；他的战友刘文善也撰文驳斥，称他正在海南过冬。
      cites: [b13-zaobao-2025-06-02-xu-death, c02-wiki-fan-changlong, b13-voa-2018-01-25-fan-rumor, b13-rfi-2018-01-26-fan-rumor]
  assess:
    - voice: scholar
      quote: true
      text: Fan is eminently qualified, having served in senior positions in two MRs and in the General Staff Department (GSD) in Beijing.
      zh: 范长龙完全够格：他在两个大军区和北京的总参谋部都担任过高级职务。
      cite: b13-jamestown-2012-11-high-command
    - voice: zh
      quote: true
      text: 在范长龙和许其亮之前，担任中共政治局委员、中央军委副主席的郭伯雄和徐才厚都在卸任后出事。
      cite: b13-zaobao-2025-06-02-xu-death
    - voice: official
      quote: true
      text: 从徐才厚、谷俊山等反面教材中吸取深刻教训，筑牢思想防线，永葆政治本色
      cite: b13-sina-2014-10-06-fan-qiushi
  ids: { wikidata: Q348143 }
  cites: [wd-Q348143, c02-cyol-2012-11-16-18th-cvs, c02-wiki-fan-changlong, b13-caixin-2012-11-04-fan-xu-cmc, b13-sina-2014-10-06-fan-qiushi, b13-jamestown-2012-11-high-command, b13-voa-2018-01-25-fan-rumor]

- id: xu-qiliang
  name: 许其亮
  pinyin: Xǔ Qíliàng
  gender: m
  ethnicity: 汉族
  born: 1950-03-29
  died: 2025-06-02
  birthplace: 山东临朐
  education:
    - { school: 空军第五航空学校, degree: 大专, from: 1968-11 }
    - { school: 国防大学基本系, from: 1986-09 }
  joinedParty: 1967-07
  joinedWork: 1966-07
  roles: [pb, cmc, cc, general]
  status: dead
  statusNote: 2023 年 3 月卸任，2025 年 6 月 2 日在北京病逝。
  tier: 1
  headline: 中央军委副主席（2012–2023）
  bio: >-
    飞行员出身，16 岁参军，在同批学员中第一个放单飞，33 岁任空军航空兵师长、40 岁任空军第 8 军军长，被港媒称为军中神童。历任空军参谋长、沈阳军区空军司令员、副总参谋长，2007 年任空军司令员并进入中央军委。
    2012 年成为首位由空军司令员升任的军委副主席，筹备古田会议、任军改领导小组常务副组长，2017 年起协助习近平负责军委日常工作，是习近平第一个十年里军改和军中反腐的主要执行者之一。
    2023 年退休，2025 年 6 月病逝，官方称他是“无产阶级军事家”。
  positions:
    - { title: 空军航空兵第 26 师师长, sys: army, from: 1983-05, to: 1984-08, cite: c01-news-2025-06-08-xu-qiliang-life }
    - { title: 空军第 8 军军长, sys: army, from: 1990-06, to: 1993-01, cite: c01-news-2025-06-08-xu-qiliang-life }
    - { title: 空军参谋长, sys: army, from: 1994-10, to: 1999-02, cite: c01-news-2025-06-08-xu-qiliang-life }
    - { title: 沈阳军区副司令员兼沈阳军区空军司令员, sys: army, from: 1999-02, to: 2004-06, cite: c01-news-2025-06-08-xu-qiliang-life }
    - { title: 副总参谋长, sys: army, from: 2004-06, to: 2007-09, cite: c01-news-2025-06-08-xu-qiliang-life }
    - { title: 空军司令员, sys: army, from: 2007-09, to: 2012-11, cite: c01-news-2025-06-08-xu-qiliang-life }
    - { title: 中央军委委员, sys: army, from: 2007-10, to: 2012-11, cite: c01-news-2025-06-08-xu-qiliang-life }
    - { title: 中央军委副主席, sys: army, from: 2012-11, to: 2023-03, cite: c01-news-2025-06-08-xu-qiliang-life }
    - { title: 中央政治局委员, sys: party, from: 2012-11, to: 2022-10, cite: c01-news-2025-06-08-xu-qiliang-life }
  life:
    - h: 飞行学员
      from: 1950
      to: 1969
      text: >-
        1950 年 3 月 29 日生于山东临朐五井镇花园河村一个农民家庭。1965 年考入山东省青少年业余航空学校学滑翔，1966 年 7 月参军进入空军第一航空预备学校，随后到陆军第 38 军 112 师 335 团当兵锻炼，1967 年 7 月入党。
        他先后在空军第八、第五航空学校学飞，是同批学员中第一个放单飞的。
      cites: [c01-news-2025-06-08-xu-qiliang-life, c02-cyol-2012-11-16-18th-cvs]
    - h: 少年师长
      from: 1969
      to: 1993
      text: >-
        1969 年起在空军航空兵第 26 师当飞行员，后任独立大队大队长，组织当时极少进行的夜间低空云中截击和夜间海上低空飞行训练。1980 年任副师长，1983 年 5 月任师长，时年 33 岁；1984 年任空 4 军副军长，1990 年 6 月任空 8 军军长，时年 40 岁。
        文汇报称他是当时最年轻的飞行师长和空军最年轻的军长，詹姆斯敦基金会也称他是全军最年轻的军级主官。
      cites: [c01-news-2025-06-08-xu-qiliang-life, b13-wenweipo-2012-11-05-fan-xu, b13-jamestown-2012-11-new-vice-chairmen]
    - h: 从空军参谋长到副总长
      from: 1993
      to: 2007
      text: >-
        1993 年任空军副参谋长，1994 年任空军参谋长，1997 年组织指挥香港回归时的空中警巡，1998 年指挥空军参加抗洪。1999 年任沈阳军区副司令员兼军区空军司令员。
        2004 年任副总参谋长，围绕反台独军事斗争准备抓一体化训练和复杂电磁环境下的演练，筹划指挥上海合作组织“和平使命－2007”联合反恐演习。2007 年 6 月授空军上将军衔。
      cites: [c01-news-2025-06-08-xu-qiliang-life, b13-zaobao-2025-06-02-xu-death]
    - h: 空军司令员
      from: 2007-09
      to: 2012-11
      text: >-
        2007 年 9 月任空军司令员，10 月任中央军委委员，推进“四网一体”建设和空军战略转型。2009 年 11 月，他对媒体说军事力量竞争正向空天领域转移，“控制了空天，就控制了地面、海洋和电磁空间”；又说空天军事化是对人类和平的挑战，“没有足够的力量就没有发言权”。
        英国《每日电讯报》把这番话解读为北京反对太空武器化立场的明显转变。
      cites: [c01-news-2025-06-08-xu-qiliang-life, b13-cyol-2009-11-02-xu-interview, b13-chinanews-2009-11-01-xu-space, b13-telegraph-2009-11-02-xu-space]
    - h: 军委副主席
      from: 2012-11
      to: 2017-10
      text: >-
        2012 年 11 月他成为“首位由空军司令员升任的中共中央军委副主席”，十八大进入政治局，排名在范长龙之后。2013 年他在《人民日报》撰文称“解放和发展生产力靠改革，解放和发展战斗力同样靠改革”。
        他组织筹备古田全军政治工作会议，在闭幕讲话中宣布次年全军政治工作的基调是整风整改；又任军委深化国防和军队改革领导小组常务副组长，讣告称这些改革“推动实现军队组织形态革命性重塑”。
      cites: [b13-caixin-2012-11-04-fan-xu-cmc, b13-zaobao-2025-06-02-xu-death, b13-people-2013-11-21-xu-reform, b13-xinhua-2014-11-02-gutian-close, c01-news-2025-06-08-xu-qiliang-life]
    - h: 第一副主席
      from: 2017-10
      to: 2023-03
      text: >-
        2017 年十九大后范长龙退出，他连任并升为排名第一的军委副主席，讣告称他“协助习近平主席负责军委日常工作”，组织了国庆 70 周年阅兵和第七届世界军人运动会。2020–2022 年的几次晋升上将仪式，都由他宣读习近平签署的命令，张又侠主持。
        联合早报评论，他主抓军队思想政治和人事，在军改和反腐两方面立下功劳；而在他之前，两位兼任政治局委员的军委副主席郭伯雄、徐才厚都在卸任后出事。2022 年二十大他以 72 岁卸任政治局委员和军委副主席，2023 年 3 月退出领导岗位。
      cites: [c01-news-2025-06-08-xu-qiliang-life, b13-zaobao-2025-06-02-xu-death, b09-rfa-2022-10-22-20th-cc, c03-xinhua-2020-12-18-generals-promoted, c03-xinhua-2021-09-06-generals-promoted, c03-xinhua-2022-01-21-generals-promoted]
    - h: 病逝
      from: 2025-01
      to: 2025-06-02
      text: >-
        2025 年 1 月 27 日他出席春节团拜会，这是他最后一次公开露面，画面中精神状态良好。6 月 2 日中午他在北京逝世，享年 75 岁。新华社没有说明病因，星岛网引北京媒体人马玲称他早上跑步时突发心梗，抢救无效。
        讣告称他“光明磊落、清正廉洁”，严格要求亲属和身边工作人员。
      cites: [b13-zaobao-2025-06-02-xu-death, b13-cna-2025-06-02-xu-death, c01-news-2025-06-08-xu-qiliang-life]
  assess:
    - voice: official
      quote: true
      text: 中国共产党的优秀党员，久经考验的忠诚的共产主义战士，无产阶级军事家，中国人民解放军的卓越领导人
      cite: c01-news-2025-06-08-xu-qiliang-life
    - voice: scholar
      quote: true
      text: His appointment as a CMC vice chairman testifies to the increasing prominence of the missions of the services at the expense of the traditionally dominant ground force.
      zh: 他出任军委副主席，说明军兵种的使命日益突出，传统上占主导地位的陆军相应让位。
      cite: b13-jamestown-2012-11-high-command
    - voice: zh
      quote: true
      text: 许其亮作为主抓军队思想政治和人事的军委副主席，在军改和反腐两大方面立下功劳。
      cite: b13-zaobao-2025-06-02-xu-death
  ids: { wikidata: Q276049 }
