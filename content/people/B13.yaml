  tier: 1
  headline: 国防部部长（2018–2023）、首任火箭军司令员，2026 年被判死缓
  bio: >-
    二炮导弹兵出身，1970 年入伍后在五十四基地八一三团（旅）从通信连战士一直做到旅长，此后历任五十三基地司令员、二炮参谋长、副总参谋长。
    2012 年任二炮司令员并进入中央军委，2015 年二炮改为火箭军后任首任司令员；2018–2023 年任国务委员兼国防部长，在香格里拉对话会上以“那还要解放军干什么”的对台表态和为六四辩护引人注目。
    卸任后从公众视野消失，2023 年 9 月被立案，2024 年被开除党籍、军籍，2026 年以受贿罪被判死缓并终身监禁。
  positions:
