  status: active
  statusNote: 中央政治局委员、广东省委书记，2026 年 9 月仍以此身份出席亚太媒体高端论坛。
  tier: 1
  headline: 广东省委书记（2022– ）、前中宣部部长（2017–2022）
  bio: >-
    福建上杭人，当过兵、回乡当过大队文书，在闽西龙岩工作 17 年，官至龙岩市长。1999 年调浙江，习近平主政浙江时他任湖州市长、嘉兴市委书记，
    2007 年接替陈敏尔任浙江省委宣传部长，后任杭州市委书记，被视为“之江新军”成员，也是少数在福建、浙江两地都与习近平共事过的官员。
    2013 年进京任中宣部副部长，2016 年说习近平成为核心“是全党的高度共识”；2017 年进入政治局和书记处并执掌中宣部。2022 年二十大未入常，外放广东任省委书记至今。
