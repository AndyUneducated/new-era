  life:
    - h: 当兵与龙岩
      from: 1956
      to: 1993
      text: >-
        1956 年 11 月生于上杭，1974–1977 年在陆军部队当战士、副班长，1976 年入党，退伍后回上杭通贤大队当文书。1978–1982 年读福建师范大学政教系，
        毕业后进入龙岩地委组织部青年干部科，1988 年起任办公室副主任，1991–1993 年任地区办公室主任、副秘书长；1985–1988 年在中央党校在职读经济管理硕士。
      cites: [c02-gov-2017-10-25-19th-cvs, b11-brookings-2022-10-16-20th-candidates]
    - h: 闽西旧部
      from: 1993
      to: 1999
      text: >-
        1993–1998 年任永定县委书记，1998 年任龙岩市长。香港01 指出，他在家乡龙岩工作长达 17 年，这段时间习近平也在福建工作。
        日本国际问题研究所的研究报告说，黄坤明因此也被称为习近平“闽江旧部”的一员，但两人当时并无直接上下级关系，私交深浅存疑。
      cites: [c02-gov-2017-10-25-19th-cvs, b11-hk01-2017-10-30-huang-propaganda, c02-jiia-2019-04-huang-kunming]
    - h: 湖州与嘉兴
      from: 1999
      to: 2007
      text: >-
        1999 年调浙江任湖州市委副书记、代市长，2000 年任市长，2003 年任嘉兴市委书记，与省委书记习近平是直接上下级。日本国际问题研究所引《读卖新闻》说，
        习近平当时称赞他“人柄が良く、苦労を惜しまない”（为人好、不辞辛劳）。李成写道，外界相信他大量协助了习近平的《之江新语》专栏。
      cites: [c02-gov-2017-10-25-19th-cvs, c02-jiia-2019-04-huang-kunming, b11-brookings-2022-10-16-20th-candidates]
    - h: 浙江宣传部长与杭州
      from: 2007
      to: 2013
      text: >-
        2007 年 6 月接替升任副省长的陈敏尔任浙江省委宣传部长，进入省委常委。李成写道是习近平在 2007 年任命他做宣传部长；日本国际问题研究所则指出，他上任时习近平已调往上海，没有近距离看过他在宣传口的表现。
        2005–2008 年在职获清华大学管理学博士。2010 年任杭州市委书记，2012 年十八大当选候补中央委员。
      cites: [c02-gov-2017-10-25-19th-cvs, b11-hk01-2017-10-30-huang-propaganda, c02-jiia-2019-04-huang-kunming, b11-brookings-2022-10-16-20th-candidates]
    - h: 中宣部副部长
      from: 2013
      to: 2017
      text: >-
        2013 年 10 月调任中宣部副部长，2014 年 12 月任主持常务工作的副部长（正部长级）兼中央文明办主任；日本国际问题研究所指出，此前他只在浙江当过两年多宣传部长，其余时间都是地方行政官员。2016 年 10 月十八届六中全会后，
        他在中宣部发布会上说习近平作为党中央的核心、全党的核心，“是众望所归，当之无愧、名副其实”。香港01 说，前任部长刘奇葆主管的中宣部被外界批评跟不上习近平的思路，甚至被指成了习近平的“高级黑”。
      cites: [c02-gov-2017-10-25-19th-cvs, b11-people-2016-10-28-huang-core, b11-hk01-2017-10-30-huang-propaganda, c02-jiia-2019-04-huang-kunming]
    - h: 中宣部部长
      from: 2017
      to: 2022
      text: >-
        2017 年十九届一中全会当选政治局委员、书记处书记，随即接替刘奇葆任中宣部部长。10 月 30 日他在全国宣传系统电视电话会议上，要求把学习宣传贯彻十九大精神作为“首要政治任务”。
        李成写道，他在宣传习近平治国理念和第一任期成就上发挥了重要作用，一度被看作接替王沪宁出任常务书记、进入常委的人选；李成同时提醒，他年龄不占优势，也可能在二十大退出政治局，转任礼仪性的政府职务。
      cites: [b11-xinhua-2017-10-30-huang-propaganda, b11-hk01-2017-10-30-huang-propaganda, b11-brookings-2022-10-16-20th-candidates]
    - h: 广东
      from: 2022
      to: 2026
      text: >-
        二十大揭晓后，BBC 中文引述学者宋文笛的分析，这届是黄坤明和李鸿忠入常的最后时机，但习近平没有这样做。10 月 28 日中组部宣布他接替李希任广东省委书记，
        他表示要“自觉做好新时代新征程上为民服务的孺子牛、创新发展的拓荒牛、艰苦奋斗的老黄牛”。2026 年 9 月他仍以省委书记身份出席在深圳举行的亚太媒体高端论坛。
      cites: [b06-bbc-2022-10-23-psc, b11-gd-2022-10-28-huang-guangdong, c02-xinhua-2026-09-05-apac-media]
