- id: meng-jianzhu
  name: 孟建柱
  pinyin: Mèng Jiànzhù
  gender: m
  ethnicity: 汉族
  born: 1947-07-28
  birthplace: 江苏吴县
  education:
    - { school: 上海机械学院系统工程专业（在职）, degree: 工学硕士, from: 1987, to: 1991 }
  joinedWork: 1968-08
  joinedParty: 1971-06
  roles: [pb, cc, prov, minister]
  status: retired
  statusNote: 2017 年 10 月十九大后卸任中央政法委书记。
  tier: 1
  headline: 中央政法委书记（2012–2017）、政治局委员
  bio: >-
    上海郊区农场的船队水手出身，在前卫农场一直做到场长，1986 年起任川沙、嘉定县委书记，1990 年代升至上海市副市长、市委副书记。
    2001 年外放江西任省委书记六年，2007 年接替周永康任公安部部长，次年兼国务委员。十八大后任中央政法委书记，是十年来第一位不在常委会里的政法委书记，
    任内宣布停止使用劳教制度，又多次赴新疆、昆明督导反恐维稳。2015 年以习近平特使身份赴华盛顿谈网络安全，2017 年十九大后退休。
  positions:
    - { title: 川沙县委书记, sys: party, place: 上海, from: 1986, to: 1990, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 上海市副市长, sys: gov, place: 上海, from: 1993, to: 1996, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 上海市委副书记, sys: party, place: 上海, from: 1996, to: 2001, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 江西省委书记, sys: party, place: 江西, from: 2001-04, to: 2007-10, cite: c02-chubun-2008-09-04-meng-jianzhu }
    - { title: 公安部部长, sys: gov, from: 2007-10, to: 2012-12, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 国务委员, sys: gov, from: 2008-03, to: 2013-03, cite: wd-Q1365182 }
    - { title: 中央政治局委员、中央政法委书记, sys: party, from: 2012-11, to: 2017-10, cite: c02-xinhua-2012-11-15-18-1-plenum }
  life:
    - h: 农场与郊县
      from: 1968
      to: 1991
      text: >-
        1968 年 8 月到上海前卫农场，从供销运输站船队水手、调度、轮机副队长做起，1973 年任运输连党支部书记，1977–1986 年任农场党委副书记、政治处主任、场长，其间业余读工业企业管理专科。
        1986 年年近四十才调任川沙县委书记，1990 年转任嘉定县委书记。
        日本华文报纸《中文导报》写道，他的才干“逐渐被江泽民和朱镕基等市委领导赏识”，1991 年升任上海市农村工作党委书记。
      cites: [c02-cyol-2012-11-16-18th-cvs, c02-chubun-2008-09-04-meng-jianzhu]
    - h: 上海副市长
      from: 1991
      to: 2001
      text: >-
        1987–1991 年在上海机械学院读系统工程在职研究生，获工学硕士。1992 年兼任上海市政府副秘书长，1993 年任副市长，1996 年进入市委常委，同年升任市委副书记，一直做到 2001 年。
        2001 年 4 月调任江西省委书记，《中文导报》称他是“早年失意上海官场，被排挤到江西”的“上海帮”成员。
      cites: [c02-cyol-2012-11-16-18th-cvs, c02-chubun-2008-09-04-meng-jianzhu]
    - h: 江西六年
      from: 2001
      to: 2007
      text: >-
        2001 年 5 月兼任江西省人大常委会主任，2002 年十六大当选中央委员。《中文导报》说他在经济乏善可陈的中部省份闷声苦干了六年，民间有“江西要致富，留住孟建柱”的民谣。
        2007 年 10 月调任公安部部长，BBC 中文当时分析说，他接任部长但没有进入政治局和书记处，是有意降低公安在权力架构中的权重。
      cites: [c02-chubun-2008-09-04-meng-jianzhu, b03-bbc-2007-10-28-meng-replaces-zhou]
    - h: 公安部长
      from: 2007
      to: 2012
      text: >-
        2008 年 3 月兼任国务委员和中央政法委副书记，人大表决时，国务委员一项他得到 28 张反对票、8 张弃权票，公安部长一项 26 张反对票、2 张弃权票，《中文导报》形容为差强人意。2009 年乌鲁木齐“7·5”事件后受中央委托赶赴新疆，
        称这是“一起由境外分裂势力遥控煽动，境内分裂分子组织实施”的事件，说对凶手要“坚决依法严惩，绝不手软”。
      cites: [c02-cyol-2012-11-16-18th-cvs, c02-chubun-2008-09-04-meng-jianzhu, b11-cctv-2009-07-08-meng-urumqi]
    - h: 降格的政法委
      from: 2012-11
      to: 2012-12
      text: >-
        2012 年 11 月十八届一中全会进入政治局，接替周永康任中央政法委书记。法广指出，这是十年来第一次由非政治局常委出任，被指“降格”；BBC 中文说这反映出领导层对这一职位权力过大的担忧。
        维权律师浦志强预期政法委的地位会随之下降、作用变弱；BBC 英文网则引述学者 David Zweig 的话说，这只是管理安全口的一种方式，政府并没有淡化国内安全的重要性。
      cites: [b11-rfi-2012-11-20-meng-zhengfa, b03-bbc-2012-11-19-zhou-zhengfa, b11-bbcen-2012-11-security-portfolio]
    - h: 停止劳教
      from: 2013-01
      to: 2013-01
      text: >-
        2013 年 1 月 7 日全国政法工作会议上，他要求“把以人为本、公平正义作为法治建设的灵魂”，并强调对坚持信访的访民不能采取劳教措施。
        据《法制日报》记者陈东升向美联社转述，他宣布当年“停止使用劳教制度”，称劳教“在以前确实起到了很重要的作用，但是现在局势改变了”；最初披露此事的几篇报道随后被删，只剩新华社的简短消息。
      cites: [b11-gov-2013-01-07-meng-zhengfa-meeting, b11-bbc-2013-01-07-meng-laojiao, b11-nytcn-2013-01-08-laojiao-reform]
    - h: 新疆与反恐
      from: 2013
      to: 2017
      text: >-
        2013 年 6 月到新疆和田、阿克苏，要求“始终保持严打高压态势，坚决打掉暴力恐怖分子的嚣张气焰”。2014 年 3 月昆明火车站暴恐案发生后，他率工作组次日清晨抵达昆明，在现场说凶手“丧尽天良、残害无辜，手段极其残忍”。
        2017 年 8 月最后一次以政法委书记身份赴新疆调研，说严厉打击暴恐“就是对各族人民群众的最大保护和热爱”，要把反分裂斗争作为头等大事。
      cites: [b11-12371-2013-06-30-meng-xinjiang, b11-yndaily-2014-03-02-meng-kunming, b11-people-2017-08-29-meng-xinjiang]
    - h: 特使与退休
      from: 2015
      to: 2017
      text: >-
        2015 年 9 月 9 日至 12 日以习近平特使身份访问华盛顿，与国土安全部长约翰逊、联邦调查局局长科米和国家安全顾问赖斯讨论网络安全等问题，为习近平的国事访问铺路。
        2017 年十九大时他已年满 70 岁，退出政治局；10 月 31 日官方披露，公安部长郭声琨接替他任中央政法委书记。
      cites: [b11-whitehouse-2015-09-12-meng-readout, b11-cna-2017-10-31-guo-replaces-meng]
  assess:
