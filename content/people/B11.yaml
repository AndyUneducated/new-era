- id: yang-jiechi
  name: 杨洁篪
  pinyin: Yáng Jiéchí
  gender: m
  ethnicity: 汉族
  born: 1950-05-01
  birthplace: 上海
  education:
    - { school: 英国伊林学院、巴斯大学、伦敦政治经济学院, from: 1973, to: 1975 }
    - { school: 南京大学历史学系世界史专业（在职）, degree: 历史学博士, from: 2001, to: 2006 }
  joinedWork: 1968-09
  joinedParty: 1971-12
  roles: [pb, cc, minister]
  status: retired
  statusNote: 二十大后退出政治局，卸任中央外办主任，由王毅接任。
  tier: 1
  headline: 中央外办主任（2013–2022）、政治局委员（2017–2022）、前外交部部长
  bio: >-
    上海工人出身的职业外交官。1970 年代初被选派赴英国学英语，回国后在外交部翻译室工作，给老布什一家当过翻译，得了“老虎杨”的外号。
    此后三度常驻华盛顿，2000 年代初任驻美大使，2007–2013 年任外交部部长；2013 年起任国务委员兼中央外办主任，十九大进入政治局，是习近平前两个任期的外事总管。
    2021 年阿拉斯加会谈上那句“中国人不吃这一套”在国内广为流传。2022 年二十大退休，外办主任一职由王毅接任。
  positions:
    - { title: 外交部副部长, sys: gov, from: 1998, to: 2000, cite: c02-gov-2017-10-25-19th-cvs }
    - { title: 驻美国大使, sys: gov, from: 2000, to: 2004, cite: c02-gov-2017-10-25-19th-cvs }
    - { title: 外交部部长, sys: gov, from: 2007-04, to: 2013-03, cite: wd-Q58211 }
    - { title: 国务委员, sys: gov, from: 2013-03, to: 2018-03, cite: c02-chinanews-2013-03-16-state-council }
    - { title: 中央外事工作领导小组（委员会）办公室主任, sys: party, from: 2013, to: 2022, cite: c02-gov-2017-10-25-19th-cvs }
    - { title: 中央政治局委员, sys: party, from: 2017-10, to: 2022-10, cite: c02-xinhua-2017-10-25-19-1-plenum }
  life:
    - h: 工人与留英
      from: 1950
      to: 1975
      text: >-
        1950 年生于上海，1968 年 9 月进上海浦江电表厂当工人，1971 年入党。1972 年进入外交部出国学习集训班，1973–1975 年先后在英国伊林学院、巴斯大学和伦敦政治经济学院学习。
        央视网的文章说，1970 年代派往英国进修的第一批外交干部里有他和后来的夫人乐爱妹，还有王光亚、沙祖康、周文重等人；1975 年 6 月他从伦敦回国，进入外交部翻译室。
      cites: [c02-gov-2017-10-25-19th-cvs, b11-cctv-2007-04-29-yang-tiger]
    - h: 翻译室与“老虎杨”
      from: 1975
      to: 1990
      text: >-
        1975–1983 年在翻译室任科员，为邓小平等领导人做英语翻译。1977 年老布什一家获准访问西藏，他全程担任翻译，后来的美国驻华大使李洁明回忆“我们大家都喜欢他”；
        老布什称他“老虎杨”，因为他生于虎年，名字里的“篪”字也藏着虎字。1983–1987 年第一次常驻华盛顿，任使馆二秘、一秘、参赞，1987–1990 年回翻译室任参赞兼处长。
      cites: [c02-gov-2017-10-25-19th-cvs, b11-cctv-2007-04-29-yang-tiger, b11-jamestown-2018-yang-element]
    - h: 对美专家
      from: 1990
      to: 2007
      text: >-
        1990 年起在美大司任参赞兼处长、副司长，1993–1995 年任驻美使馆公使，1995 年任部长助理并一度兼美大司司长，1998 年升副部长。
        官方简历记他 2000–2004 年任驻美国大使，詹姆斯敦基金会的文章则记为 2001–2005 年；任内遇上 2001 年 4 月的中美南海撞机事件。之后回任副部长，2001–2006 年在职读完南京大学历史学博士。
      cites: [c02-gov-2017-10-25-19th-cvs, b11-jamestown-2018-yang-element]
    - h: 外交部长
      from: 2007
      to: 2013
      text: >-
        2007 年 4 月出任外交部部长。詹姆斯敦基金会的文章认为，胡锦涛时期民族主义情绪高涨，强硬派指外交部对外软弱，他因此不得不表现出强硬的一面；面对记者，他有时拿自己属虎开玩笑，暗示会像老虎护崽一样维护国家利益。
        2010 年 7 月东盟地区论坛河内会议上，十二国提出南海争端，据詹姆斯敦基金会《中国简报》记述，他盯着新加坡外长说，中国是大国，别的国家是小国，这就是事实。文章认为这句话是中国那一年在东南亚外交失分的缩影。
      cites: [b11-jamestown-2018-yang-element, b11-jamestown-2010-china-missteps]
    - h: 外事总管
      from: 2013
      to: 2020
      text: >-
        2013 年 3 月任国务委员，同年起任中央外事工作领导小组办公室主任，2014 年 2 月前还兼中央国家安全工作领导小组办公室主任，并兼中央维护海洋权益工作领导小组办公室主任。
        2017 年十九届一中全会当选政治局委员，此后以中央外事工作委员会办公室主任的身份统筹对外工作，2021 年的中美高层战略对话即由他与外长王毅共同出席。
      cites: [c02-gov-2017-10-25-19th-cvs, c02-xinhua-2017-10-25-19-1-plenum, b11-mfa-2021-03-19-yang-anchorage]
    - h: 阿拉斯加对话
      from: 2021-03
      to: 2021-03
      text: >-
        2021 年 3 月 18 日与王毅在安克雷奇同布林肯、沙利文举行中美高层战略对话。美方开场白后他发言十几分钟（BBC 中文两篇报道分别记为 16 分钟和约 18 分钟），
        说“美国没有资格居高临下同中国说话，中国人不吃这一套”，又说“中美有过对抗的年代，中国都挺过来了”。BBC 中文说他还讲了许多重大外交场合不常出现的大白话，例如“难道我们吃洋人的苦头还少吗”，在中国社交平台上广为流传。
      cites: [b11-mfa-2021-03-19-yang-anchorage, b11-bbc-2021-03-19-anchorage-plain, b11-bbc-2021-03-20-anchorage-close]
    - h: 退休
      from: 2022
      to: 2022
      text: >-
        2022 年 10 月二十大，72 岁的他没有出现在二十届中央委员名单上，按年龄惯例退出政治局；自由亚洲电台列出的九名不再连任的政治局委员里，他与刘鹤、孙春兰等人同在其中。
        联合早报报道，王毅打破“七上八下”的惯例进入政治局，显示他将替杨洁篪担任政治局委员、中央外事工作委员会办公室主任。王毅自 2013 年起任外长，此前长期在外事系统工作。
      cites: [b09-zaobao-2022-10-23-wang-yi-cc, b09-zaobao-2022-10-23-wang-yi-pb, b09-rfa-2022-10-22-20th-cc]
  assess:
