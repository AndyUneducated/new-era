- id: sun-chunlan
  name: 孙春兰
  pinyin: Sūn Chūnlán
  gender: f
  ethnicity: 汉族
  born: 1950-05-24
  birthplace: 河北饶阳
  education:
    - { school: 鞍山工业技术学校, from: 1965, to: 1969 }
  joinedWork: 1969-11
  joinedParty: 1973-05
  roles: [pb, cc, prov, minister]
  status: retired
  statusNote: 2023 年 3 月卸任国务院副总理后退休。
  tier: 1
  headline: 国务院副总理（2018–2023）、政治局委员（2012–2022）
  bio: >-
    河北饶阳人，鞍山钟表厂女工出身，在辽宁工作近 40 年，经工会、妇联系统升至省委副书记、大连市委书记。2005 年任全国总工会第一书记，2009 年起先后主政福建、天津，2012 年进入政治局。
    2014 年接替令计划任中央统战部部长，2018–2023 年任国务院副总理，新冠疫情期间坐镇武汉、上海，被外媒称为“清零沙皇”；
    2022 年 11 月底又是她在座谈会上说疫情防控“面临新形势新任务”，随后清零政策迅速退场。2023 年退休。
  positions:
    - { title: 辽宁省委副书记、大连市委书记, sys: party, place: 辽宁, from: 1997, to: 2005, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 全国总工会副主席、第一书记, sys: other, from: 2005, to: 2009, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 福建省委书记, sys: party, place: 福建, from: 2009-11, to: 2012-11, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 天津市委书记, sys: party, place: 天津, from: 2012-11, to: 2014-12, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 中央政治局委员, sys: party, from: 2012-11, to: 2022-10, cite: c02-xinhua-2017-10-25-19-1-plenum }
    - { title: 中央统战部部长, sys: party, from: 2014-12, to: 2017-11, cite: wd-Q195379 }
    - { title: 国务院副总理, sys: gov, from: 2018-03, to: 2023-03, cite: c02-rmzxw-2018-03-19-state-council }
  life:
    - h: 鞍山女工
      from: 1950
      to: 1988
      text: >-
        1965–1969 年就读鞍山工业技术学校，1969 年 11 月进鞍山钟表厂当工人，1973 年入党。1974 年起任鞍山市一轻局、轻纺局团委书记，1977–1988 年在鞍山化纤毛纺织总厂工作。
        BBC 中文统计，她在辽宁任职近 40 年，其中在鞍山就工作了 26 年。
      cites: [c02-gov-2017-10-25-19th-cvs, b11-bbc-2014-12-31-sun-ufwd]
    - h: 妇联与工会
      from: 1988
      to: 2001
      text: >-
        1988 年任鞍山市妇联主任，1991 年调任辽宁省总工会副主席，1993 年任省妇联主席，1994 年任省总工会主席，1995 年进入省委常委，1997 年升任省委副书记，1998–2001 年兼省委党校校长。
        布鲁金斯学会的李成推测，她与胡锦涛的关系可能形成或巩固于 1990 年代初在中央党校学习期间，当时胡锦涛是党校校长。
      cites: [c02-gov-2017-10-25-19th-cvs, b11-brookings-2018-03-new-gov-leaders]
    - h: 大连与全总
      from: 2001
      to: 2009
      text: >-
        2001–2005 年任大连市委书记。大连是薄熙来起家之地，李成写道，据一些中国观察者说，她接手后有效压制了薄熙来在大连的势力，在薄倒台之前就清除了他在当地的亲信。
        2005 年调任中华全国总工会党组书记、副主席、书记处第一书记。
      cites: [c02-gov-2017-10-25-19th-cvs, b11-brookings-2018-03-new-gov-leaders, b11-bbc-2014-12-31-sun-ufwd]
    - h: 福建与天津
      from: 2009
      to: 2014
      text: >-
        2009 年 11 月调任福建省委书记，2012 年 11 月十八大进入政治局，随即调任天津市委书记。李成认为，主政一个重要省份和天津、大连两座大城市的经历，加上全总和统战部的任职，为她进入更高层做了准备。美国之音的节目说，被认为是团派的她曾被称为胡锦涛的“五朵金花”之一，
        又问她是否因为同样在福建担任要职而获得习近平的信任。
      cites: [c02-gov-2017-10-25-19th-cvs, b11-brookings-2018-03-new-gov-leaders, b11-voa-2015-01-06-sun-jinhua]
    - h: 统战部长
      from: 2014
      to: 2017
      text: >-
        2014 年 12 月令计划被免职并接受调查后，她接任中央统战部部长。BBC 中文指出，由政治局委员出任统战部长打破了近年的惯例，此前多任部长都只是中央委员；
        美国之音节目中则有分析认为这是名升暗降，也有人认为是习近平清理统战部的一步棋。2017 年十九大连任政治局委员。
      cites: [b11-bbc-2014-12-31-sun-ufwd, b11-brookings-2018-03-new-gov-leaders, b11-voa-2015-01-06-sun-jinhua]
    - h: 坐镇武汉
      from: 2018
      to: 2020
      text: >-
        2018 年 3 月任国务院副总理。2020 年初率中央赴湖北指导组坐镇武汉，2 月 6 日在动员会上要求全民拉网式排查、“确保不落一户、不漏一人”，并说“战时状态决不能当逃兵，否则就会被钉在历史的耻辱柱上”，
        2 月 11 日要求方舱医院“宁可让床等人，也不要让人等床”。3 月初她视察武汉小区时，居民隔窗高喊“假的、假的、全部都是假的”，央视报道没有说明现场情况。
      cites: [c02-rmzxw-2018-03-19-state-council, b11-people-2020-02-07-sun-wartime, b11-gov-2020-02-11-sun-wuhan, b11-bbc-2020-03-06-sun-fake]
    - h: 清零沙皇
      from: 2020
      to: 2022
      text: >-
        此后她辗转各地疫区。2022 年 4 月 2 日前往上海监督全面封控，接受央视采访时说从全国调集了近 5 万名医务和检测人员，“早日实现社会面清零的目标指日可待”，要“早日打赢这场歼灭战”。
        《纽约时报》说，她被视为中国的“清零”沙皇，每到一个疫情暴发的城市，常被网民塑造成宣告封城即将到来的末日预言者。
      cites: [b11-dw-2023-03-zero-exit, b06-cctv-2022-04-17-shanghai-zero, b11-nytcn-2022-10-20-sun-zero-czar]
    - h: 转向与退休
      from: 2022
      to: 2023
      text: >-
        2022 年 10 月二十大，72 岁的她与杨洁篪、刘鹤等人一同不再连任政治局委员。《纽约时报》统计，1949 年以来只有八名女性进入过中央政治局，她是其中之一，而从未有女性进入常委会。11 月 30 日，在各地抗议之后数日，她在国家卫健委座谈会上说，随着奥密克戎致病性减弱、疫苗接种普及，
        “我国疫情防控面临新形势新任务”；德国之声转述美媒报道，她在会上告诉医学专家，国家计划“迅速地”结束清零。2023 年 3 月卸任副总理。
      cites: [b09-rfa-2022-10-22-20th-cc, b11-gov-2022-11-30-sun-new-situation, b11-dw-2023-03-zero-exit]
  assess:
    - voice: scholar
      quote: true
      text: her low-profile personality and her demonstrated tenacity and political acumen……are indicative of her potential for leadership and political nerve
      zh: 她低调的个性和表现出的韧劲与政治敏锐……显示出她的领导潜力和政治胆识
      cite: b11-brookings-2018-03-new-gov-leaders
    - voice: zh
      quote: true
      text: 随着不断晋升，她建立了自己的支持者网络，包括前国家主席胡锦涛，使她能够创造出提拔到高层所需的履历——以及靠山。
      cite: b11-nytcn-2022-10-20-sun-zero-czar
    - voice: zh
      quote: true
      text: 有分析认为，孙春兰其实是名升暗降，凸显了习近平的十九大人事布局。
      cite: b11-voa-2015-01-06-sun-jinhua
  family:
    - name: 父亲（姓名不详）
      rel: 父亲
      text: >-
        工厂工人。李成写道，她出身寒微，父亲是工人，此外没有关于她家庭的更多公开信息。
      cites: [b11-brookings-2018-03-new-gov-leaders]
  factions:
    - f: tuanpai
      cite: b11-voa-2015-01-06-sun-jinhua
      quote: 被认为是团派的孙春兰，曾经被称为胡锦涛的”五朵金花”之一
  ids: { wikidata: Q195379 }
  cites: [wd-Q195379, c02-cyol-2012-11-16-18th-cvs, c02-gov-2017-10-25-19th-cvs, c02-rmzxw-2018-03-19-state-council, b11-nytcn-2022-10-20-sun-zero-czar, b11-gov-2022-11-30-sun-new-situation]

- id: chen-miner
  name: 陈敏尔
  pinyin: Chén Mǐn'ěr
  gender: m
  ethnicity: 汉族
  born: 1960-09-29
  birthplace: 浙江诸暨
  education:
    - { school: 绍兴师范专科学校中文系, from: 1978, to: 1981 }
    - { school: 中央党校研究生院（在职）, degree: 法学硕士, from: 1995, to: 1998 }
  joinedWork: 1981-08
  joinedParty: 1982-09
  roles: [pb, cc, prov]
  status: active
  statusNote: 中央政治局委员、天津市委书记，2026 年 10 月仍以市委书记身份公开活动。
  tier: 1
  headline: 天津市委书记（2022– ）、政治局委员（2017– ）
  bio: >-
    浙江诸暨人，绍兴师专中文系毕业，从宣传干事做到绍兴县委书记，又任宁波市委副书记、浙江日报报业集团社长。习近平主政浙江时他任省委常委、宣传部长，
    外界相信他协助习近平写《浙江日报》的《之江新语》专栏，是“之江新军”的代表人物。2012 年调贵州，先后任省长、省委书记；
    2017 年孙政才落马后接掌重庆，誓言清除“薄王”影响，十九大进入政治局，一度被看作常委热门。2022 年二十大仍未入常，年底转任天津市委书记至今。
  positions:
    - { title: 绍兴县委书记, sys: party, place: 浙江, from: 1994, to: 1997, cite: c02-gov-2017-10-25-19th-cvs }
    - { title: 浙江日报报业集团社长, sys: other, place: 浙江, from: 1999, to: 2001, cite: c02-gov-2017-10-25-19th-cvs }
    - { title: 浙江省委常委、宣传部部长, sys: party, place: 浙江, from: 2002, to: 2007, cite: c02-gov-2017-10-25-19th-cvs }
    - { title: 浙江省副省长, sys: gov, place: 浙江, from: 2007, to: 2012, cite: c02-gov-2017-10-25-19th-cvs }
    - { title: 贵州省省长, sys: gov, place: 贵州, from: 2012-12, to: 2015-10, cite: wd-Q4504692 }
    - { title: 贵州省委书记, sys: party, place: 贵州, from: 2015-07, to: 2017-07, cite: b11-xinhua-2022-12-08-chen-tianjin }
    - { title: 重庆市委书记, sys: party, place: 重庆, from: 2017-07, to: 2022-12, cite: b11-xinhua-2022-12-08-chen-tianjin }
    - { title: 中央政治局委员, sys: party, from: 2017-10, cite: b08-wikisource-2022-10-23-20-1-plenum }
    - { title: 天津市委书记, sys: party, place: 天津, from: 2022-12, cite: b11-xinhua-2022-12-08-chen-tianjin }
  life:
    - h: 绍兴
      from: 1960
      to: 1997
      text: >-
        1960 年 9 月生于诸暨，1978–1981 年读绍兴师专中文系，1981 年 8 月参加工作，1982 年入党，先后在学校和绍兴市委宣传部做宣传干事。
        李成整理的履历显示，他 1987–1989 年任绍兴县委常委、宣传部长，1989 年任绍兴市委宣传部副部长，1990 年回绍兴县任县委副书记，1991 年起兼任县长，
        1994–1997 年任绍兴县委书记，1996 年进入绍兴市委常委；1995–1998 年在中央党校在职读研，获法学硕士。
      cites: [c02-gov-2017-10-25-19th-cvs, b11-brookings-2022-10-16-20th-candidates]
    - h: 浙江宣传部长
      from: 1997
      to: 2007
      text: >-
        1997 年任宁波市副市长，1999 年任宁波市委副书记，同年转任浙江日报报业集团社长；2001 年任浙江省委宣传部部长，2002 年 6 月进入省委常委。
        他任宣传部长期间，《浙江日报》头版推出署名“哲欣”的《之江新语》专栏，哲欣就是时任省委书记习近平的笔名。李成写道，外界普遍相信陈敏尔在那几年大量协助习近平准备这些每周专栏。
      cites: [c02-gov-2017-10-25-19th-cvs, b11-xinhua-2022-12-08-chen-tianjin, b11-bbc-2015-07-31-chen-guizhou, b11-brookings-2022-10-16-20th-candidates]
    - h: 副省长与“之江新军”
      from: 2007
      to: 2012
      text: >-
        2007 年任浙江省副省长，同年十七大当选候补中央委员，宣传部长一职由嘉兴市委书记黄坤明接替。李成说他在浙江被视为强力支持民营经济。
        BBC 中文引述《大公报》马浩亮的说法，陈敏尔与蔡奇、黄坤明、李强等人是《之江新语》的第一批读者，“堪称是一支‘之江新军’”。
      cites: [c02-gov-2017-10-25-19th-cvs, b11-hk01-2017-10-30-huang-propaganda, b11-brookings-2022-10-16-20th-candidates, b11-bbc-2015-07-31-chen-guizhou]
    - h: 贵州
      from: 2012
      to: 2017
      text: >-
        2012 年初调任贵州省委副书记，2013 年 1 月任省长，2015 年 7 月升任省委书记，是当时仅有的三名 60 后省委书记之一。
        纽约时报中文网报道，他在贵州强力推行把农村家庭的小块土地并进合作社的做法，还加上了自己的创新；李成写道，他在贵州致力于扶贫、环保和大数据，贵州由此成为全国的大数据中心。
      cites: [b11-xinhua-2022-12-08-chen-tianjin, b11-nytcn-2017-09-13-chen-miner, b11-brookings-2022-10-16-20th-candidates]
    - h: 接掌重庆
      from: 2017
      to: 2017
      text: >-
        2017 年 7 月 15 日，孙政才被免去重庆市委书记，陈敏尔接任，在干部大会上表示要“坚决清除‘薄王’案件的恶劣影响”，说“中央派我到重庆来，我就是重庆的一员”。
        十九大重庆代表团开放日上，他称中央对孙政才案的处理“完全正确，非常英明，十分及时”，要把清除孙政才恶劣影响与肃清“薄、王”思想遗毒结合起来。
      cites: [b07-zaobao-2017-07-16-sun, b11-chinanews-2017-07-15-chen-chongqing, b11-ifeng-2017-10-20-chen-presser]
    - h: 两次与常委失之交臂
      from: 2017
      to: 2022
      text: >-
        2017 年十九届一中全会当选政治局委员。BBC 中文报道，会前呼声颇高的胡春华和陈敏尔都未能进入常委名单。此后五年他继续主政重庆，
        李成写道，他强调要营造新的“政治生态”，以别于薄熙来和孙政才时期的治理不善，还提倡发展在文化、商业和地貌上各具特色的小城镇。
        2022 年二十大前，布鲁金斯学会的李成仍预测他可能晋升常委，结果他与黄坤明、马兴瑞都只留任政治局委员。
      cites: [b05-bbc-2017-10-25-psc-profiles, b11-brookings-2022-10-16-20th-candidates]
    - h: 天津
      from: 2022
      to: 2026
      text: >-
        2022 年 12 月 8 日，中组部部长陈希在天津宣布，陈敏尔接替李鸿忠任天津市委书记，称这是中央根据工作需要和天津班子建设实际、通盘考虑后的决定。主政天津后，他以京津冀协同发展为“战略牵引”，要唱好京津“双城记”，筑牢首都政治、安全“护城河”。
        2026 年 10 月 12 日他仍以市委书记身份，在天津会见出席国际议员友好交流论坛的各国议员。
      cites: [b11-xinhua-2022-12-08-chen-tianjin, b11-tjnews-2025-05-15-chen-jjj, c02-tjnews-2026-10-13-chen-miner]
  assess:
