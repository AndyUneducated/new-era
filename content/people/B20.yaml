  factions:
    - f: equipment-system
      cite: c01-people-2008-03-17-chen-bingde
      quote: 中国人民解放军总装备部部长、党委书记
      rank: periphery
  life:
    - h: 南通兵
      from: 1941
      to: 1979
      text: >-
        1941 年 7 月生于江苏南通，1958 年 9 月参加工作，1961 年 4 月入伍，从战士、副班长、班长当起，1962 年 3 月入党。
        1964 年任排长，1965 年起在军司令部作训处当参谋六年，其后任师作训科副科长、科长，团参谋长、师副参谋长，1977 年 5 月任团长。官方简历只写“陆军”某军某师，没有公开部队番号。
      cites: [c01-people-2008-03-17-chen-bingde, b20-0513-2023-10-20-chen-donation]
    - h: 军长与院长
      from: 1979
      to: 1999
      text: >-
        1979 年任师参谋长，其间在军事学院基本系学习；1982 年任师长，1983 年任副军长并入军事学院高级指挥班，1985 年任集团军副军长兼参谋长，1988 年 9 月授少将。
        1990 年 6 月任南昌陆军学院院长，1992 年 8 月任陆军指挥学院院长，1993 年 2 月回部队任集团军军长，同年 12 月任南京军区参谋长；1995 年 7 月晋中将，1996 年 1 月升任南京军区司令员。
      cites: [c01-people-2008-03-17-chen-bingde, b20-0513-2023-10-20-chen-donation]
    - h: 济南到总装
      from: 1999
      to: 2005
      text: >-
        1999 年 12 月任济南军区司令员，2002 年 6 月晋上将。2004 年 9 月十六届四中全会胡锦涛接任军委主席，同时增补陈炳德、乔清晨、张定发、靖志远为军委委员，他随即接任总装备部部长、党委书记，2005 年 3 月任国家军委委员。
        他同时兼任中国载人航天工程总指挥，2005 年的神舟六号载人飞行由他统筹。
      cites: [c01-people-2008-03-17-chen-bingde, b20-0513-2023-10-20-chen-donation, k01-xinhua-2004-09-19-16-4-plenum, b20-sohu-2005-10-08-chen-guarantee]
    - h: 神舟六号
      from: 2005-10
      to: 2007
      text: >-
        2005 年 10 月发射神舟六号前，他在酒泉听取汇报时说已三次向党中央、国务院保证发射万无一失，又要求各项目负责人“请不要说可能、大概之类不确定、不负责、不讲党性的话”。
        10 月 12 日上午，他宣布“我现在郑重宣布，神舟六号载人飞船发射取得圆满成功”。2007 年 1 月中国用导弹击毁一颗旧气象卫星时，他仍在总装备部任上；同年他接替梁光烈任总参谋长，总装备部部长由常万全接任。
      cites: [b20-sohu-2005-10-08-chen-guarantee, b20-sina-2005-10-12-chen-shenzhou6, b20-bbc-2007-02-12-cao-asat, b20-docslib-2008-clm23-mulvenon]
    - h: 访美
      from: 2011-05
      to: 2011-05
      text: >-
        2011 年 5 月他率团访美一周，18 日在五角大楼与马伦举行联合记者会，说解放军在台湾沿海“只有驻防部署没有作战部署”，又问“台湾是中国领土，美国人凭什么售台武器”。
        同日在美国国防大学演讲，他说中美军力有 20 年差距，“中国没这个文化，中国也没这个能力”挑战美国；人民网报道他坦言看到美军先进感到“很难过”，但又说中国军队在装备落后的情况下也能打胜仗。
      cites: [b20-bbc-2011-05-19-chen-us, b20-cyol-2011-05-20-chen-us, b20-sina-2011-05-20-chen-20years, b20-fox-2011-05-18-chen-ndu]
    - h: 与马伦交锋
      from: 2011-07
      to: 2011-07
      text: >-
        2011 年 7 月马伦回访北京，两人在联合记者会上针锋相对。陈炳德说美国在南海与菲律宾、越南搞军演，“在这个时候搞军事演习，是极不妥当的”；他还说美军无人侦察机离中国海岸线最近只有 16 海里，并问美国花这么多钱搞军事“是否给纳税人太大压力了”。
        马伦回应说，美国几十年来一直与地区盟友联合演习，“美国将继续这样做”。
      cites: [b20-voa-2011-07-11-chen-mullen, b20-sina-2011-07-12-chen-recon]
    - h: 退出军委
      from: 2012
      to: 2023
      text: >-
        2012 年 10 月十八大前夕，北京军区司令员房峰辉接替他任总参谋长；11 月十八大期间他仍以老同志身份出席胡锦涛、习近平会见军队代表的场合。
        2023 年 10 月 17 日，南通市委常委、宣传部部长陈冬梅到北京登门拜访，他把珍藏多年的神舟六号火箭模型、返回舱模型、发射录像和汶川大地震救灾纪实书籍等十余件藏品捐给南通群英馆，捐赠清单由他的秘书傅岩松大校签署。
