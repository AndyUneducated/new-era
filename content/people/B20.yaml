# B20: full biographies of five generals who served as defence minister or chief of the general staff, copied from C01 and expanded to tier 1.
- id: chi-haotian
  name: 迟浩田
  pinyin: Chí Hàotián
  gender: m
  ethnicity: 汉族
  born: 1929-07-09
  birthplace: 山东招远
  education:
    - { school: 解放军总高级步兵学校, from: 1958, to: 1959 }
    - { school: 解放军军事学院合成系, degree: 大专, from: 1959, to: 1960 }
  joinedParty: 1946-10
  joinedWork: 1944-06
  roles: [pb, cmc, cc, general, minister]
  status: retired
  statusNote: 2002 年 11 月卸任政治局委员和党的军委副主席，2003 年 3 月卸任国家军委副主席和国务委员兼国防部长后退休；2026 年 2 月仍在新华社春节看望老同志名单中。
  tier: 1
  headline: 中央军委副主席、国务委员兼国防部长（1993–2003）
  bio: >-
    山东招远人，1945 年入伍，在胶东战场当过战斗模范，后随第 27 军入朝，是政工干部出身。
    文革后期先后进入《解放军报》和《人民日报》领导班子，1977 年任副总参谋长，1987 年任总参谋长。1989 年北京戒严时，他是戒严部队指挥部成员。
    1993 年起任国务委员兼国防部长十年，1995 年增补为军委副主席，1997 年进入政治局，此后与张万年同为江泽民身边的两名军人副主席。
    1996 年 12 月访美时，他在美国国防大学说天安门广场上没有一个人丧生，这句话一直被外界引用。2003 年退休。
  positions:
    - { title: 陆军第 27 军第 81 师政委, sys: army, from: 1970, to: 1973, cite: c01-people-2013-02-26-chi-haotian }
    - { title: 北京军区副政委, sys: army, from: 1973-12, to: 1977-10, cite: b20-wiki-chi-haotian }
    - { title: 人民日报社负责人、副总编辑, sys: other, from: 1976-10, to: 1977, cite: b20-wiki-chi-haotian }
    - { title: 解放军副总参谋长, sys: army, from: 1977-10, to: 1985-05, cite: b20-wiki-chi-haotian }
    - { title: 济南军区政委, sys: army, from: 1985-05, to: 1987-11, cite: b20-wiki-chi-haotian }
    - { title: 解放军总参谋长, sys: army, from: 1987-11, to: 1992, cite: c01-people-2013-02-26-chi-haotian }
    - { title: 中央军委委员, sys: army, from: 1988, to: 1995-09, cite: c01-people-2013-02-26-chi-haotian }
    - { title: 国务委员兼国防部部长, sys: gov, from: 1993-03, to: 2003-03, cite: c01-people-2013-02-26-chi-haotian }
    - { title: 中央军委副主席, sys: army, from: 1995-09, to: 2003-03, cite: c01-people-2013-02-26-chi-haotian }
    - { title: 中央政治局委员, sys: party, from: 1997-09, to: 2002-11, cite: c01-people-2013-02-26-chi-haotian }
  life:
    - h: 胶东小兵
      from: 1929
      to: 1950
      text: >-
        1929 年 7 月生于山东招远，1944 年 6 月在家乡区中队当文书，1945 年 7 月入伍，1946 年 10 月入党。
        维基百科记载，1946 年 6 月攻打胶县县城时，他从城墙上跳下追俘三名敌兵，战后向连队汇报说“我感到打仗很有意思，要想获胜就得往上冲，不怕死！”，后来被评为战斗模范。
        此后他在华东九纵和三野第 27 军第 79 师第 235 团当连队文书、指导员，随军南下。
      cites: [c01-people-2013-02-26-chi-haotian, b20-wiki-chi-haotian]
    - h: 第二十七军
      from: 1950
      to: 1970
      text: >-
        1950 年随志愿军第 27 军入朝，任第 235 团三营教导员、团政治处副主任，1952 年荣立一等功。回国后历任第 235 团政治处主任、副政委、团政委，第 79 师政治部主任、副政委和第 27 军政治部副主任；
        其间 1958 至 1960 年先后在总高级步兵学校和军事学院合成系学习。人民网的简历说他喜爱读中外文学名著、鲁迅著作和军事书籍，擅长游泳、骑马、摔跤，还当过中国摔跤协会名誉主席。
      cites: [c01-people-2013-02-26-chi-haotian]
    - h: 两报
      from: 1970
      to: 1977
      text: >-
        1970 年任第 27 军第 81 师政委。维基百科称，九一三事件后他调入《解放军报》社任核心小组成员、副总编辑，分管政工；1973 年 12 月任北京军区副政委，1976 年率北京军区部队参加唐山大地震救灾。
        1976 年 10 月“四人帮”被捕后，他兼任《人民日报》社工作组组长、第一总编辑，前后一年零二十天。官方简历把这几年合写为“北京军区副政委，《人民日报》社负责人、副总编辑”。
      cites: [c01-people-2013-02-26-chi-haotian, b20-wiki-chi-haotian]
    - h: 总参谋长
      from: 1977
      to: 1992
      text: >-
        1977 年 10 月任副总参谋长兼总参政治部主任，1982 年免去兼职，1985 年 5 月任济南军区政委。1987 年 11 月任总参谋长，次年进入中央军委，1988 年 9 月恢复军衔制时被授予上将。
        1989 年 5 月北京戒严，维基百科称戒严部队在总指挥刘华清、副指挥迟浩田的指挥下进行了清场。据华夏文摘刊载的《六四军人列传》（传闻），戒严部队指挥部由刘华清、迟浩田和北京军区司令员周衣冰组成，他是“三巨头”之一。
      cites: [c01-people-2013-02-26-chi-haotian, b20-wiki-chi-haotian, b20-cnd-2009-05-19-pla-1989]
    - h: 国防部长
      from: 1993
      to: 1997
      text: >-
        1993 年 3 月任国务委员兼国防部长，10 月兼任国防法起草委员会主任。1995 年 9 月十四届五中全会增补他为军委副主席。
        1996 年 12 月他访问华盛顿，在美国国防大学的演讲会上被问到六四，回答说可以负责任地、认真地讲，当时天安门广场上没有一个人丧生。《洛杉矶时报》评论说，中国领导人说的“天安门广场”只指围栏以内的区域；北京没有证明围栏内无人死亡，外国人也没有证明有人死在里面。
      cites: [c01-people-2013-02-26-chi-haotian, b20-latimes-1996-12-27-tiananmen]
    - h: 政治局委员
      from: 1997
      to: 2003
      text: >-
        1997 年 9 月十五大当选政治局委员，与张万年同任军委副主席，1998 年 3 月连任国防部长。2000 年 3 月在人大解放军代表团发言时，他要求全军“坚决维护以江泽民同志为核心的党中央、中央军委的权威”。
        2001 年 8 月在北戴河会见美国参议员拜登，说美国发展导弹防御系统“美国的理由是站不住脚的”。2002 年 11 月十六届一中全会后，74 岁的他卸任政治局委员和党的军委副主席，2003 年 3 月卸任国家职务退休，国防部长由曹刚川接任。
      cites: [k01-xinhua-1997-09-19-15-1-plenum, b20-rmrb-2000-03-07-chi-npc, b20-rmrb-2001-08-09-chi-biden, b20-wiki-chi-haotian, k06-wiki-dong-jun]
    - h: 退休以后
      from: 2003
      to: 2026
      text: >-
        退休后他以老同志身份出席重大场合，2008 年北京奥运会开幕式、2012 年十八大期间胡锦涛会见军队代表时都在列。
        据大纪元 2005 年的一档节目（传闻），网上流传过两篇署名迟浩田的内部讲话《战争正在向我们走来》和《战争离我们不远，它是中华世纪的产婆》，节目主持人也承认很多人怀疑其真实性，官方从未承认这两篇讲话。
        2009 年解放军出版社出版《迟浩田军事文选》。2023 年 6 月夫人姜青萍去世；2026 年 2 月新华社春节看望老同志的名单里仍有他。
      cites: [e02-consulate-2008-08-08-olympics, b02-people-2012-11-18-cmc-meeting, b20-epoch-2005-08-25-chi-speech, b20-wiki-chi-haotian, b20-thepaper-2023-06-05-jiang-qingping, b19-xinhua-2026-02-13-old-comrades]
  assess:
    - voice: official
      quote: true
      text: 身居高位之后，迟浩田尤其注意对家人的严格要求，从不让家人享受任何特殊照顾。
      cite: b20-thepaper-2023-06-05-jiang-qingping
    - voice: west
      quote: true
      text: When China’s leaders claim that no one died “in Tiananmen Square,” they mean the area inside the fence. And while Beijing has not proved that no one died inside the fence, foreigners have not proved that anyone did.
      zh: 中国领导人说“天安门广场”上没有人死亡时，指的是围栏以内的区域。北京没有证明围栏内无人死亡，外国人也没有证明有人死在里面。
      cite: b20-latimes-1996-12-27-tiananmen
    - voice: wiki
      quote: true
      text: 长久以来，迟浩田都被指是六四天安门事件的关键人物。
      cite: b20-wiki-chi-haotian
  family:
    - name: 姜青萍
      rel: 妻子
      text: 江苏常州人，海军总医院医生，原总参谋部管理局第二服务处副主任医师，专业技术五级离休干部。澎湃新闻称她有 50 年党龄、军龄，退休时只是海军医院放射科主任。2023 年 6 月 4 日病逝，享年 90 岁。
      cites: [b20-thepaper-2023-06-05-jiang-qingping, b20-wiki-chi-haotian]
    - name: 迟星北
      rel: 儿子
      text: 1957 年 9 月生，2008 年晋升少将。维基百科称他历任总参通信部政治部主任、南京陆军指挥学院政治部主任、总装备部陆军装备科研订购部政委，2016 年 2 月任陆军首任后勤部政委。
      cites: [b20-wiki-chi-haotian]
    - name: 迟星红
      rel: 女儿
      text: 维基百科只列出姓名，未见公开职务。
      cites: [b20-wiki-chi-haotian]
  ids: { wikidata: Q983848 }
