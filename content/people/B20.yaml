  statusNote: 2012 年十八大退出中央军委。2023 年 10 月仍在北京家中接待南通市委来访并捐赠藏品。
  tier: 1
  headline: 解放军总参谋长（2007–2012）
  bio: >-
    江苏南通人，1961 年当兵，从战士、团长做到集团军军长，两度出任陆军院校院长，1996 年起先后任南京、济南军区司令员。
    2004 年进入军委任总装备部部长，兼载人航天工程总指挥，2005 年 10 月宣布神舟六号发射成功。2007 年任总参谋长。
    2011 年 5 月访美时公开说中美军力有 20 年差距，“中国没这个文化，中国也没这个能力”挑战美国；同年 7 月又当着来访的美军参联会主席马伦，批评美军在南海演习和在中国近海侦察。2012 年十八大前由房峰辉接任，退出军委。
  positions:
    - { title: 南昌陆军学院院长, sys: army, from: 1990-06, to: 1992-08, cite: c01-people-2008-03-17-chen-bingde }
