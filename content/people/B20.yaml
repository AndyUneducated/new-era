- id: chang-wanquan
  name: 常万全
  pinyin: Cháng Wànquán
  gender: m
  ethnicity: 汉族
  born: 1949-01
  birthplace: 河南南阳
  education:
    - { school: 陕西省渭南师范专科学校（函授）, degree: 在职大专, from: 1985, to: 1987 }
    - { school: 国防大学基本系, from: 1994-03, to: 1995-01 }
  joinedParty: 1968-11
  joinedWork: 1968-03
  roles: [cmc, cc, general, minister]
  status: retired
  statusNote: 2018 年 3 月卸任国防部长。据《南华早报》2019 年 7 月引述接近解放军的消息人士报道（德国之声、法广、美国之音转述），他因与郭伯雄、徐才厚关系密切被降两级为副大军区级；官方从未公布，也没有找到其他独立来源证实。2026 年 2 月他仍列入新华社春节看望老同志名单，9 月 30 日出席国庆招待会。
  tier: 1
  headline: 国务委员兼国防部长（2013–2018）
  bio: >-
    河南南阳人，1968 年入伍，在第 47 军和兰州军区从警卫连战士做到军长、军区参谋长，2004 年起任沈阳军区司令员。
    2007 年进入军委任总装备部部长，兼载人航天工程总指挥，2012 年主持辽宁舰交接入列仪式。十八大前他被普遍看好升任军委副主席，结果被范长龙越过，2013 年改任国务委员兼国防部长。
    任内对美表态中国在领土主权问题上“不会妥协，不会退让，不会交易”，又提出打赢海上人民战争。2018 年退休后，《南华早报》报道他因与郭伯雄、徐才厚关系密切被降两级，官方从未证实。
  positions:
