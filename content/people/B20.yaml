- id: liang-guanglie
  name: 梁光烈
  pinyin: Liáng Guāngliè
  gender: m
  ethnicity: 汉族
  born: 1940-12-09
  died: 2024-11-12
  birthplace: 四川三台
  joinedParty: 1959-11
  joinedWork: 1958-01
  roles: [cmc, cc, general, minister]
  status: dead
  statusNote: 2024 年 11 月 12 日在北京病逝，享年 84 岁。
  tier: 1
  headline: 国务委员兼国防部长（2008–2013）、总参谋长（2002–2007）
  bio: >-
    四川三台贫农之子，1958 年初入伍即赴朝鲜，后在武汉军区作战部近十年，1979 年随前指上过对越战场。
    从第 20 军师长、军长做到第 54 集团军军长，再任北京军区参谋长、沈阳和南京军区司令员，1998 年在东北带十余万官兵抗洪，在南京主抓对台军事斗争准备。
    2002 年任总参谋长并进入军委，2008 年接替曹刚川任国务委员兼国防部长。2009 年他对日本防卫相说中国“不能永远没有航母”，2011 年成为第一个出席香格里拉对话会的中国国防部长。2013 年退休，2024 年 11 月在北京病逝。
  positions:
    - { title: 武汉军区作战部副部长, sys: army, from: 1974-12, to: 1979-07, cite: c01-gov-2024-11-18-liang-guanglie-life }
    - { title: 陆军第 20 军第 58 师师长, sys: army, from: 1981-02, to: 1983-05, cite: c01-gov-2024-11-18-liang-guanglie-life }
    - { title: 第 20 集团军军长, sys: army, from: 1985-08, to: 1990-06, cite: c01-gov-2024-11-18-liang-guanglie-life }
    - { title: 第 54 集团军军长, sys: army, from: 1990-06, to: 1993-12, cite: c01-gov-2024-11-18-liang-guanglie-life }
    - { title: 北京军区参谋长, sys: army, from: 1993-12, to: 1995-07, cite: c01-gov-2024-11-18-liang-guanglie-life }
    - { title: 北京军区副司令员, sys: army, from: 1995-07, to: 1997-11, cite: c01-gov-2024-11-18-liang-guanglie-life }
    - { title: 沈阳军区司令员, sys: army, from: 1997-11, to: 1999-12, cite: c01-gov-2024-11-18-liang-guanglie-life }
    - { title: 南京军区司令员, sys: army, from: 1999-12, to: 2002-10, cite: c01-gov-2024-11-18-liang-guanglie-life }
    - { title: 解放军总参谋长, sys: army, from: 2002-10, to: 2007, cite: c01-gov-2024-11-18-liang-guanglie-life }
    - { title: 中央军委委员, sys: army, from: 2002-11, to: 2012-11, cite: c01-gov-2024-11-18-liang-guanglie-life }
    - { title: 国务委员兼国防部部长, sys: gov, from: 2008-03, to: 2013-03, cite: c01-gov-2024-11-18-liang-guanglie-life }
  life:
    - h: 入朝新兵
      from: 1940
      to: 1970
      text: >-
        1940 年 12 月 9 日生于四川三台县新生镇太建村一个贫苦农民家庭。1957 年 11 月报名参军，次年 1 月成为陆军第 1 军第 1 师第 2 团战士，一入伍就到了停战后的朝鲜，1959 年 11 月入党。
        此后在第 1 军当工兵连副排长、排长，1963 年起任团作训股参谋，1966 年先后任第 1 师工兵科和作训科参谋，长期在一线抓训练。
      cites: [c01-gov-2024-11-18-liang-guanglie-life]
    - h: 武汉军区作战部
      from: 1970
      to: 1979
      text: >-
        1970 年 2 月调任武汉军区作战部作战科参谋，1974 年 12 月任作战部副部长，前后近十年，参与组织部队调防、徐海地区战役勘察和冬季千里野营拉练。
        1979 年 2 月对越自卫反击战，他以武汉军区作战部副部长身份与第 43 军第 127 师前指一起行动，亲历战场。《南华早报》的讣闻说他战时是第 20 军的副师长，与官方生平不符：官方生平记他 1979 年 7 月才任第 58 师副师长。
      cites: [c01-gov-2024-11-18-liang-guanglie-life, b20-scmp-2024-11-13-liang-death]
    - h: 二十军到五十四军
      from: 1979
      to: 1993
      text: >-
        1979 年 7 月任第 20 军第 58 师副师长，1981 年 2 月任师长，1983 年 5 月任第 20 军副军长，1985 年 8 月任第 20 集团军军长。
        官方生平说，他在这里推行新兵训练体制改革试点，实行“先训后补”，把集团军做成全军训练改革的“试验田”。1990 年 6 月改任第 54 集团军军长，试点新纲目训练和夜训，抓应急机动作战部队建设。
      cites: [c01-gov-2024-11-18-liang-guanglie-life]
    - h: 三大军区
      from: 1993
      to: 2002
      text: >-
        1993 年 12 月任北京军区参谋长，1995 年 7 月任副司令员。1997 年 11 月任沈阳军区司令员，带部队完成总参交给的“辽阳集训”；1998 年嫩江、松花江特大洪灾，他在一线带领军区十余万官兵抗洪。
        当时葛振峰任沈阳军区参谋长、副司令员，维基百科称两人工作关系密切。1999 年 12 月调任南京军区司令员，面对台海紧张局势，组织大规模海上练兵，推进反“台独”军事斗争准备。
      cites: [c01-gov-2024-11-18-liang-guanglie-life, k03-wiki-ge-zhenfeng]
    - h: 总参谋长
      from: 2002
      to: 2008
      text: >-
        2002 年 5 月授上将，10 月任总参谋长，11 月进入中央军委。官方生平称他主持拟制体制编制调整改革方案、军队信息化建设规划纲要，组织“和平使命－2005”“和平使命－2007”等中外联合演习。
        Mulvenon 2008 年引述一家中国官方背景报纸说，新一届中央委员中有九名上将曾在南京军区任要职、熟悉对台作战，梁光烈“内定”为下一任国防部长。2007 年十七大前后，总参谋长一职由陈炳德接任。
      cites: [c01-gov-2024-11-18-liang-guanglie-life, b20-docslib-2008-clm23-mulvenon]
    - h: 国防部长
      from: 2008
      to: 2013
      text: >-
        2008 年 3 月任国务委员兼国防部长，是第一位兼任国家边海防委员会主任的军队领导，做了 56 天边海防调研，推动出台第一部《国防动员法》。
        2009 年 3 月会见日本防卫相滨田靖一时，据共同社报道，他说“大国中没有航母的只有中国”。2011 年 6 月他率团出席香格里拉对话会，这是中国国防部长第一次与会；有日本代表当场质疑中国“说一套做的却是另一套”。2012 年 5 月他访问五角大楼，是九年来中国国防部长首次访美。
      cites: [c01-gov-2024-11-18-liang-guanglie-life, b20-bbc-2009-03-21-liang-carrier, b20-bbc-2011-06-05-liang-shangri-la, b20-cntv-2011-06-07-liang-kissinger, b20-cntv-2012-05-09-liang-us]
    - h: 晚年
      from: 2013
      to: 2024
      text: >-
        2013 年 3 月卸任，国防部长由常万全接任。官方生平说，他退下来以后“坚定支持党风廉政建设和反腐败斗争”。
        2024 年 11 月 12 日凌晨在北京病逝，享年 84 岁；新华社的生平称他“待人宽厚、严于律己、清正廉洁”。《南华早报》的讣闻按周岁说他享年 83 岁，概括他打过对越战争，并在美国重返亚洲时处理过中美两军关系。
      cites: [c01-gov-2024-11-18-liang-guanglie-life, k06-wiki-dong-jun, b20-scmp-2024-11-13-liang-death]
  assess:
    - voice: official
      quote: true
      text: 中国共产党的优秀党员，久经考验的忠诚的共产主义战士，我国国防建设和军队军事工作的杰出领导人
      cite: c01-gov-2024-11-18-liang-guanglie-life
    - voice: west
      quote: true
      text: Liang Guanglie, a former Chinese defence minister who fought for China against Vietnam and navigated military ties with the US when it shifted its focus back to Asia early this century, has died at the age of 83.
      zh: 曾为中国在对越战争中作战、并在本世纪初美国重返亚洲时处理两军关系的前国防部长梁光烈去世，享年 83 岁。
      cite: b20-scmp-2024-11-13-liang-death
    - voice: scholar
      quote: true
      text: nine high-ranking generals in the new Central Committee have held important posts in Nanjing Military Region and have a good command of and are familiar with Taiwan-related military combat; these include Liang Guanglie, internally designated as the next minister of national defense
      zh: 新一届中央委员会中有九名上将曾在南京军区担任要职，熟悉并精通涉台军事作战；其中包括内定为下一任国防部长的梁光烈。（Mulvenon 转引中国官方背景报纸）
      cite: b20-docslib-2008-clm23-mulvenon
  ids: { wikidata: Q929373 }
  cites: [wd-Q929373, c01-gov-2024-11-18-liang-guanglie-life, b20-bbc-2009-03-21-liang-carrier, b20-scmp-2024-11-13-liang-death]

- id: chen-bingde
  name: 陈炳德
  pinyin: Chén Bǐngdé
  gender: m
