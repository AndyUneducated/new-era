  factions:
    - f: guo-xu
      cite: v01-scmp-2019-07-11-chang-wanquan
      quote: was demoted two grades to a deputy regional commander-level officer because of his close relationship with former commission vice-chairmen Guo Boxiong and Xu Caihou
      zh: 因与前军委副主席郭伯雄、徐才厚关系密切，被降两级为副大军区级军官。
      rank: periphery
  life:
    - h: 第四十七军
      from: 1968
      to: 1990
      text: >-
        1949 年 1 月生于河南南阳，1968 年 3 月入伍，在第 47 军第 140 师独立警卫连当战士、班长、排长，同年 11 月入党。
        此后长期做作训参谋，1978 年在兰州军区司令部作战部和办公室秘书科当过参谋、秘书，1980 年回第 47 军任作训处副处长、处长，1983 年任第 140 师参谋长，1985 年任第 47 集团军第 139 师副师长，其间函授读完渭南师范专科学校。
      cites: [c01-ce-2013-03-16-chang-wanquan]
    - h: 师长到军长
      from: 1990
      to: 2002
      text: >-
        1990 年任兰州军区司令部作战部部长，1992 年任第 21 集团军第 61 师师长，1994 年任第 47 集团军参谋长，并在国防大学基本系学习近一年。
        1998 年任国防大学战役教研室主任，2000 年回任第 47 集团军军长。到 2002 年为止，他三十多年的军旅生涯除了在国防大学的几年，都在兰州军区第 47 军和第 21 集团军系统度过。
      cites: [c01-ce-2013-03-16-chang-wanquan]
    - h: 三大军区
      from: 2002
      to: 2007
      text: >-
        2002 年任兰州军区参谋长，2003 年调北京军区参谋长，2004 年升任沈阳军区司令员，三年里跨了三个大军区。
        2007 年十七大前后，Mulvenon 记录他由沈阳军区司令员升任总装备部部长，接替调任总参谋长的陈炳德；十七届一中全会他进入中央军委，次年 3 月十一届全国人大任命他为国家军委委员。
      cites: [c01-ce-2013-03-16-chang-wanquan, b20-docslib-2008-clm23-mulvenon, k01-xinhua-2007-10-22-17-1-plenum]
    - h: 总装备部
      from: 2007
      to: 2012
      text: >-
        总装备部部长兼任载人航天工程总指挥。2012 年 6 月 16 日他在酒泉宣布神舟九号发射成功，6 月 29 日又宣布天宫一号与神舟九号载人交会对接任务圆满成功。
        2012 年 9 月 25 日第一艘航空母舰交接入列，郭伯雄宣布舰名舷号，仪式由“中央军委委员、总装备部部长常万全主持”。同年他的总装备部部长一职由张又侠接任。
      cites: [b20-cmse-2012-06-16-shenzhou9, e02-ce-2012-09-25-liaoning, b08-dw-2026-01-zhang-who]
    - h: 落选副主席
      from: 2012-11
      to: 2013-03
      text: >-
        十八大前，外界长期预计他会升任军委副主席。詹姆斯敦基金会分析说，他升任副主席本来符合只从现任军委委员中提拔的惯例，结果 65 岁的济南军区司令员范长龙越过 63 岁的他，成为排名第一的军人副主席。
        他留任军委委员，2013 年 3 月改任国务委员兼国防部长。
      cites: [b13-jamestown-2012-11-high-command, e02-xinhua-2012-11-15-plenum1, c02-chinanews-2013-03-16-state-council]
    - h: 国防部长
      from: 2013
      to: 2016
      text: >-
        2014 年 4 月美国国防部长哈格尔访华，他在联合记者会上说中国在领土主权问题上“不会妥协，不会退让，不会交易”，军队只要党和人民需要，“召之即来，来之能战，战之必胜”；又说“我和哈格尔部长都是上过战场的人，深知战争的危害”。
        2016 年 7 月海牙仲裁庭就南海作出裁决，8 月初他在浙江调研国防动员时强调要“充分发挥海上人民战争威力”，美国之音报道称，他说中国应当准备打一场“海上人民战争”。
      cites: [b20-people-2014-04-09-chang-hagel, b20-chinanews-2014-04-09-chang-battlefield, b20-gov-2016-08-02-chang-zhejiang, b20-voa-2016-08-02-people-war]
    - h: 十九大与退休
      from: 2017
      to: 2018
      text: >-
        2017 年 10 月十九大解放军代表团讨论时，他说这五年“习主席顶天立地的历史担当托起伟大梦想”，接连用了五个“天”字排比，称习近平成为众望所归的领导核心。
        据看中国（传闻），这段话在军方媒体 21 日公布的全文中被删掉了。十九大上他退出中央军委，2018 年 3 月国防部长由魏凤和接任。
      cites: [b20-cdt-2017-10-chang-xi-praise, b20-secretchina-2017-10-22-chang-deleted, k06-wiki-dong-jun]
    - h: 降级传闻
      from: 2019-07
      to: 2026
      text: >-
        2019 年 7 月 11 日《南华早报》引述一名接近解放军的消息人士说，他因与郭伯雄、徐才厚关系密切被降两级为副大军区级，依据是退休待遇下调；法广转述说他的住所被迁到北京海淀区的前装甲兵大楼。各家都指出官方没有公布。美国之音分析说，如果消息准确，说明他的问题足以连降两级，又不至于倒台。
        据看中国（传闻），明镜新闻网早在 2014 年就说他被内部调查。但 2026 年 2 月新华社春节看望老同志的名单里仍有他，9 月 30 日他还现身国庆招待会。
      cites: [v01-scmp-2019-07-11-chang-wanquan, v01-rfi-2019-07-12-chang-wanquan, c01-dw-2019-07-12-chang-wanquan, b20-voa-2019-07-generals-demoted, b20-kzg-2019-07-12-chang-demoted, b19-xinhua-2026-02-13-old-comrades, b21-zaobao-2026-09-30-reception]
  assess:
    - voice: scholar
      quote: true
      text: Chang had long been expected to become vice chairman, and his promotion would have followed the pattern of only elevating existing CMC members to that body’s top posts.
      zh: 外界早就预计常万全会成为军委副主席，而且提拔他也符合只把现任军委委员擢升到军委最高职位的惯例。
      cite: b13-jamestown-2012-11-high-command
    - voice: west
      quote: true
      text: There had not been an official announcement of Chang’s demotion, but military insiders said that the downgrading of his retirement benefits indicated his reduction in military rank.
      zh: 官方没有宣布常万全被降级，但军内人士说，他的退休待遇被下调，表明他的军衔级别已被降低。
      cite: v01-scmp-2019-07-11-chang-wanquan
    - voice: zh
      quote: true
      text: 如果这一消息准确，那就说明这位前国务委员的问题严重到足以连降两级，而没有严重到需要更严厉处分甚至倒台的地步，或者问题虽很严重，但习近平当局“怀柔”处理，让他软着陆。
      cite: b20-voa-2019-07-generals-demoted
