- id: cao-gangchuan
  name: 曹刚川
  pinyin: Cáo Gāngchuān
  gender: m
  ethnicity: 汉族
  born: 1935-12-09
  birthplace: 河南舞钢
  education:
    - { school: 解放军南京第三炮兵军械技术学校、第一军械技术学校, from: 1954-07, to: 1956-11 }
    - { school: 解放军大连俄语专科学校, from: 1956-11, to: 1957-09 }
    - { school: 苏联炮兵军事工程学院, degree: 大学, from: 1957-09, to: 1963-10 }
  joinedParty: 1956-07
  joinedWork: 1954-07
  roles: [pb, cmc, cc, general, minister]
  status: retired
  statusNote: 2007 年十七大退出政治局和军委，2008 年 3 月卸任国务委员兼国防部长；2026 年 2 月仍在新华社春节看望老同志名单中。
  tier: 1
  headline: 中央军委副主席（2002–2007）、国防部长（2003–2008）
  bio: >-
    河南舞钢人，1954 年入伍学军械，在苏联炮兵军事工程学院读了六年，回国后在总后、总参的军械和装备部门干了近三十年，是解放军中少见的技术装备型将领。
    1990 年起主管军品贸易，后任副总参谋长、国防科工委主任，1998 年任新组建的总装备部部长并进入军委，同时是载人航天工程总指挥。
    2002 年十六大成为政治局委员、军委副主席，次年接替迟浩田任国防部长。任内在北京接待美国国防部长拉姆斯菲尔德；2007 年反卫星试验后，他对日方表示中国没有再做类似试验的计划。2008 年退休。
  positions:
    - { title: 解放军总参谋部装备部副部长, sys: army, from: 1982-08, to: 1989-07, cite: b20-xinhua-2002-11-16-cao-cv }
    - { title: 解放军总参谋部军务部部长, sys: army, from: 1989-07, to: 1990-08, cite: b20-xinhua-2002-11-16-cao-cv }
    - { title: 中央军委军品贸易办公室主任, sys: army, from: 1990-08, to: 1992-11, cite: b20-xinhua-2002-11-16-cao-cv }
    - { title: 解放军副总参谋长, sys: army, from: 1992-11, to: 1996-11, cite: b20-xinhua-2002-11-16-cao-cv }
    - { title: 国防科学技术工业委员会主任, sys: army, from: 1996-11, to: 1998-04, cite: b20-xinhua-2002-11-16-cao-cv }
    - { title: 解放军总装备部部长, sys: army, from: 1998-04, to: 2002-11, cite: b20-xinhua-2002-11-16-cao-cv }
    - { title: 中央军委委员, sys: army, from: 1998-10, to: 2002-11, cite: k01-xinhua-1998-10-14-15-3-plenum }
    - { title: 中央军委副主席, sys: army, from: 2002-11, to: 2007-10, cite: k01-xinhua-2002-11-15-16-1-plenum }
    - { title: 中央政治局委员, sys: party, from: 2002-11, to: 2007-10, cite: k01-xinhua-2002-11-15-16-1-plenum }
    - { title: 国务委员兼国防部部长, sys: gov, from: 2003-03, to: 2008-03, cite: c01-gov-2018-03-19-state-council-history }
  factions:
    - f: equipment-system
      cite: b20-xinhua-2002-11-16-cao-cv
      quote: 中央军委委员，解放军总装备部部长、党委书记
      rank: backbone
  life:
    - h: 留苏
      from: 1935
      to: 1963
      text: >-
        1935 年 12 月生于河南舞钢，1954 年 7 月入伍，先后在南京第三炮兵军械技术学校和第一军械技术学校学习，1956 年留校当教员，同年 7 月入党。
        随后进大连俄语专科学校学俄语，1957 年 9 月赴苏联炮兵军事工程学院留学，1963 年 10 月回国。胡佛研究所《中国领导观察》的 James Mulvenon 写道，他是被挑出来专门学俄语、准备赴苏深造六年的人。
      cites: [b20-xinhua-2002-11-16-cao-cv, b20-hoover-cao-biography]
    - h: 军械与装备
      from: 1963
      to: 1990
      text: >-
        回国后在总后勤部军械部弹药处、装备部兵工处当了十二年助理员，整个文革都在这个岗位上。1975 年 10 月转到总参谋部装备部，从综合计划处参谋、副处长做起，1982 年 8 月升任装备部副部长，1989 年 7 月任总参军务部部长。
        Mulvenon 引述接近曹刚川的人士说，他在装备部任职期间经常随采购代表团去欧洲和俄国。
      cites: [b20-xinhua-2002-11-16-cao-cv, b20-hoover-cao-biography]
    - h: 军品贸易
      from: 1990
      to: 1998
      text: >-
        1990 年 8 月出任中央军委军品贸易办公室主任。Mulvenon 认为，1989 年之后，正是他在这个位置上直接主管对外军品买卖。
        1992 年 11 月升任副总参谋长，1996 年 11 月调任国防科学技术工业委员会主任。1998 年 4 月解放军组建总装备部，他出任部长；10 月十五届三中全会增补他为中央军委委员。
      cites: [b20-xinhua-2002-11-16-cao-cv, b20-hoover-cao-biography, k01-xinhua-1998-10-14-15-3-plenum]
    - h: 总装与航天
      from: 1998
      to: 2002
      text: >-
        总装备部统管全军武器装备的发展计划、科研试验和订购，也负责载人航天和卫星发射。他是载人航天工程的第二任总指挥，前任是丁衡高，后由李继耐接任。
        2002 年 11 月十六大上他当选政治局委员，十六届一中全会决定他与郭伯雄同任中央军委副主席；新华社当时公布的简历仍写他兼任总装备部部长、党委书记。
      cites: [f10-wiki-xu-xueqiang, b20-xinhua-2002-11-16-cao-cv, k01-xinhua-2002-11-15-16-1-plenum]
    - h: 国防部长
      from: 2003
      to: 2006
      text: >-
        2003 年 3 月接替迟浩田任国务委员兼国防部长。2004 年 7 月建军节招待会上，他说台独没有和平、分裂没有稳定，“中国的主权和领土完整是至高无上的”，如果台独势力一意孤行，解放军有决心、有能力粉碎任何台独图谋。
        2005 年 10 月 19 日他在八一大楼与美国国防部长拉姆斯菲尔德会谈。BBC 报道，拉姆斯菲尔德是 39 年来第一个获准参观二炮部队的外国访客，曹刚川则坚持中国当年公布的 302 亿美元就是实际国防预算。
      cites: [k06-wiki-dong-jun, b20-sina-2004-07-31-cao-taidu, b20-sina-2005-10-19-cao-rumsfeld, b20-bbc-2005-10-20-rumsfeld]
    - h: 反卫星试验
      from: 2007-01
      to: 2007-02
      text: >-
        2007 年 1 月 11 日，中国用弹道导弹击毁一颗旧气象卫星，近两周后才承认。2 月 12 日他会见日本前防卫厅长官额贺福志郎，据额贺转述，他说这次试验不针对任何国家，中国没有再次进行类似实验的计划。
        美国之音注意到新华社报道这次会见时对这一表态只字不提；旧金山大学的乌海利教授认为这很反常，或许说明中国高层在这个问题上意见不一。
      cites: [b20-bbc-2007-02-12-cao-asat, b20-voa-2007-02-12-cao-asat]
    - h: 退休
      from: 2007
      to: 2026
      text: >-
        2007 年 10 月十七大退出政治局和军委。Mulvenon 分析十七大军队人事时记下，他把军委副主席一职交给了前总政治部主任徐才厚，国防部长一职很可能交给即将卸任总参谋长的梁光烈；2008 年 3 月梁光烈果然接任国防部长。
        此后他以老同志身份出席北京奥运会开幕式、十八大期间会见军队代表等场合；2026 年 2 月新华社春节看望老同志的名单中仍有他。
      cites: [b20-docslib-2008-clm23-mulvenon, k06-wiki-dong-jun, e02-consulate-2008-08-08-olympics, b02-people-2012-11-18-cmc-meeting, b19-xinhua-2026-02-13-old-comrades]
  assess:
    - voice: scholar
      quote: true
      text: During this period, sources close to General Cao confirm that he often traveled to Europe and Russia on procurement delegations. After Tiananmen in 1989, General Cao directly oversaw this commerce as director of the Office of Military Trade under the Central Military Commission.
      zh: 接近曹将军的消息人士证实，这一时期他经常随采购代表团前往欧洲和俄国。1989 年天安门事件之后，曹将军以中央军委军品贸易办公室主任的身份直接主管这类买卖。
      cite: b20-hoover-cao-biography
    - voice: zh
      quote: true
      text: 旧金山大学的乌海利教授说，曹刚川的最新表态本来是很有新闻价值的事件，但新华社在报导中却对这一表态只字不提。他认为，这是一种很反常的现象，或许意味着中国高层内部在这个问题上的观点存在分歧。
      cite: b20-voa-2007-02-12-cao-asat
