    - { date: 2016-07-04, text: 以受贿、非法获取国家秘密、滥用职权罪一审判处无期徒刑，剥夺政治权利终身，没收个人全部财产, cite: b07-court-2016-07-04-ling-sentence }
  tier: 1
  headline: 中央办公厅主任（2007–2012）、全国政协副主席（2013–2014），2016 年被判无期徒刑
  ids: { wikidata: Q497091 }
  factions:
    - f: tuanpai
      cite: b07-bbc-2015-07-20-ling-expulsion
      quote: 他与胡锦涛一样，都是共青团出身，因此深受胡绵涛重用。
    - f: xishanhui
      cite: f02-hqrw-2015-01-06-xishanhui
      quote: 多家媒体称，令计划正是“西山会”的“执牛耳者”
    - f: new-gang-of-four
      cite: b07-bbc-2014-12-23-hk-press-ling
      quote: 《苹果日报》则指令计划是中共党内高层“新四人帮”的最后一名落网成员，其他成员则包括中共前政治局常委周永康、前政治局委员薄熙来和前中央军委副主席徐才厚。
  bio: >-
    共青团出身，长期在胡锦涛身边工作，2007 年起任中办主任、中央书记处书记，被视为胡锦涛的“心腹”，一度有望进入最高领导层。
    2012 年 3 月其子令谷驾驶法拉利跑车在北京撞车身亡，外媒报道他动用中央警卫局掩盖真相；同年 9 月被调任统战部长，十八大未能进入政治局。2014 年 12 月落马，2016 年以受贿、非法获取国家秘密、滥用职权罪被判无期徒刑。
    港媒和官方系刊物称他是山西籍官员圈子“西山会”的核心，香港媒体把他列入“新四人帮”；其弟令完成出走美国。
  positions:
    - { title: 共青团中央宣传部部长, sys: party, cite: b07-bjnews-2014-12-22-ling-resume }
    - { title: 中央办公厅调研室主任, sys: party, cite: b07-bjnews-2014-12-22-ling-resume }
    - { title: 中央办公厅主任, sys: party, from: 2007-09, to: 2012-08, cite: wd-Q497091 }
    - { title: 中央书记处书记, sys: party, from: 2007-10, to: 2012-11, cite: b07-bjnews-2014-12-22-ling-resume }
    - { title: 中央统战部部长, sys: party, from: 2012-09, to: 2014-12, cite: wd-Q497091 }
    - { title: 全国政协副主席, sys: other, from: 2013-03, to: 2015-01, cite: wd-Q497091 }
  life:
    - h: 平陆与团中央
      from: 1956
      to: 1995
      text: >-
        1956 年生于山西平陆，父亲是山西一名处级干部，按报上常见的词给五个子女取名路线、政策、方针、计划、完成。早年下过乡，在印刷厂当过工人，1975 年进入平陆县团委。
        1979 年调入团中央，历任宣传部理论处副处长、宣传部部长。《纽约时报》称，他早年就得到胡锦涛的庇护；胡锦涛 80 年代初领导共青团，1995 年把他安排进中央办公厅。
      cites: [b07-bjnews-2014-12-22-ling-resume, b07-bbc-2015-07-20-ling-expulsion, c05-nytcn-2012-12-05-ling-gu]
    - h: 中办大管家
      from: 1995
      to: 2012
      text: >-
        在中办从调研室三组负责人做起，历任调研室主任、中编办副主任，2007 年 9 月任中办主任，同年进入中央书记处。
        《纽约时报》引一名组织部官员说：“官员们说，令计划打的电话就相当于胡锦涛的电话。”2012 年 1 月，他以中直机关工委书记身份要求中直机关做好“保持党的纯洁性”各项工作，以迎接十八大。
      cites: [b07-bjnews-2014-12-22-ling-resume, wd-Q497091, c05-nytcn-2012-12-05-ling-gu, b07-xinhua-2012-01-16-ling-purity]
    - h: 法拉利事件与降职
      from: 2012-03
      to: 2012-11
      text: >-
        据《纽约时报》报道，2012 年 3 月 18 日凌晨，一辆黑色法拉利 Spider 在北京四环撞上护墙、车身裂成两半，令谷当场死亡，同车两名年轻藏族女子重伤。党内知情人士称，令计划动用中央警卫局协助掩盖。
        7 月讨论十八大人事时，党内元老提出此事，称“这个人不具备进入政治局的资格”。9 月 1 日他卸任中办主任，改任实权较小的统战部长；十八大仅当选中央委员。
      cites: [c05-nytcn-2012-12-05-ling-gu, e02-nyt-2012-09-04-ling-ferrari, wd-Q497091, b07-bbc-2015-07-20-ling-expulsion]
    - h: 西山会与“新四人帮”之说
      from: 2007
      to: 2014
      text: >-
        人民网旗下的《环球人物》引媒体人罗昌平的《打铁记》说，“西山会”出现不晚于 2007 年，成员主要是山西籍高官，也有个别山西籍商人，令计划被称为其“执牛耳者”，成员还包括令政策、陈川平、刘志军、丁书苗、刘铁男、申维辰等。
        BBC 称媒体报道牵出令计划、周永康与薄熙来的“三角政治同盟”；香港《苹果日报》称“新四人帮”曾计划在十八大前发动政变，因薄熙来被捕而流产。
      cites: [f02-hqrw-2015-01-06-xishanhui, b07-bbc-2015-07-20-ling-expulsion, b07-bbc-2014-12-23-hk-press-ling]
    - h: 落马
      from: 2013-03
      to: 2015-07
      text: >-
        2013 年 3 月任全国政协副主席，但 BBC 说他在党内的位置“已大不如前”。2014 年 6 月其兄、山西省政协副主席令政策被查；12 月 15 日《求是》还刊出他的署名文章，22 日新华社宣布他接受组织调查。
        2015 年 7 月 20 日被开除党籍、公职，通报称他“违纪违法获取党和国家大量核心机密”，收受巨额贿赂，并“与多名女性通奸，进行权色交易”。
      cites: [b07-bbc-2015-07-20-ling-expulsion, b07-bjnews-2014-12-22-ling-resume, b07-xinhua-2014-12-22-ling-investigation, b07-xinhua-2015-07-20-ling-expulsion]
    - h: 天津受审
      from: 2016-05
      to: 2016-07
      text: >-
        2016 年 5 月被起诉，6 月 7 日天津一中院因案涉国家秘密不公开审理。法院认定他单独或与妻子谷丽萍收受楼忠福、崔晓玉、潘逸阳、魏新、李春城、白恩培等人财物共 7708.5383 万元；通过时任中办秘书局局长霍克等人非法获取大量国家秘密；为特定关系人调动工作、迁移户口提供帮助。
        7 月 4 日数罪并罚判处无期徒刑；他当庭表示接受全部指控、不上诉。谷丽萍以录像方式作证。
      cites: [b07-court-2016-07-04-ling-sentence, b07-bbc-2016-07-04-ling-sentence]
  assess:
    - voice: doc
      quote: true
      text: 令计划的行为完全背离了党的性质和宗旨，严重违反党的纪律，极大损害党的形象，社会影响极其恶劣
      cite: b07-xinhua-2015-07-20-ling-expulsion
    - voice: zh
      quote: true
      text: 他是胡锦涛关系最紧密的亲信，也是胡锦涛的政治掮客
      cite: c05-nytcn-2012-12-05-ling-gu
    - voice: zh
      quote: true
      text: 被视为胡锦涛的“心腹”，甚至一度有望进入最高领导核心
      cite: b07-bbc-2014-12-23-hk-press-ling
    - voice: scholar
      quote: true
      text: 令计划等人是很明显的“家族帮”，他作为家族中官员级别最高的人，现在家族中不少人落马，如果没有“大树庇荫”是不可思议的
      cite: b07-bbc-2014-12-23-hk-press-ling
  family:
    - name: 谷丽萍
      rel: 妻
      text: >-
        法院认定她与令计划共同或单独收受楼忠福、崔晓玉、潘逸阳等人财物，庭审中公诉方播放了她的作证录像。通报称令计划“为其妻经营活动谋取利益”。
      cites: [b07-court-2016-07-04-ling-sentence, b07-xinhua-2015-07-20-ling-expulsion]
    - name: 令谷
      rel: 子
      text: >-
        令计划与谷丽萍的独生子。2012 年 3 月 18 日在北京驾驶法拉利撞车身亡。法院认定他曾向魏新等人索取财物，令计划事后知情未予退还。
      cites: [f02-hqrw-2015-01-06-xishanhui, c05-nytcn-2012-12-05-ling-gu, b07-court-2016-07-04-ling-sentence]
    - name: 令政策
      rel: 兄
      text: >-
        家中次子，长期在山西发改系统任职，后任山西省政协副主席。2014 年 6 月被查，2015 年 8 月被开除党籍、公职，2016 年被起诉。
      cites: [b07-bjnews-2014-12-22-ling-resume, b07-zaobao-2016-09-19-ling-zhengce]
    - name: 令完成
      rel: 弟
      text: >-
        经商，别名“王诚”，是业余高尔夫好手。《纽约时报》2015 年 8 月报道他已到美国，在加州有住宅，美国官员称他若寻求庇护，“将可能成为中华人民共和国历史上最具破坏力的叛逃者”。2016 年 1 月中方首次承认他住在美国，称“中方正在处理，也在和美国进行沟通”。
      cites: [b07-bjnews-2014-12-22-ling-resume, b07-nyt-2015-08-04-ling-wancheng, b07-nyt-2016-01-18-ling-wancheng-us]
  cites: [b07-bjnews-2014-12-22-ling-resume, b07-xinhua-2015-07-20-ling-expulsion, b07-court-2016-07-04-ling-sentence, c05-nytcn-2012-12-05-ling-gu, b07-bbc-2014-12-23-hk-press-ling, f02-hqrw-2015-01-06-xishanhui, wd-Q497091]

- id: xu-caihou
  name: 徐才厚
  pinyin: Xú Cáihòu
  gender: m
  ethnicity: 汉族
