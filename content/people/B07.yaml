  tier: 1
  headline: 中央军委副主席（2004–2012）、中央政治局委员（2007–2012），2015 年病亡于审查起诉期间
  ids: { wikidata: Q1335434 }
  factions:
    - f: jiang-shanghai
      cite: b07-voa-2014-07-03-xu-hu
      quote: 有评论认为，习近平打掉徐才厚这只军中大老虎，能借反贪之力加强手中军权，跟徐才厚所效忠的前领导核心江泽民叫板。
    - f: guo-xu
      cite: b07-xinhua-2016-10-11-guo-xu-poison
      quote: 郭伯雄、徐才厚是我军建军以来因违纪违法被查处的职务最高的领导干部。
    - f: new-gang-of-four
      cite: b07-bbc-2014-12-23-hk-press-ling
      quote: 《苹果日报》则指令计划是中共党内高层“新四人帮”的最后一名落网成员，其他成员则包括中共前政治局常委周永康、前政治局委员薄熙来和前中央军委副主席徐才厚。
  bio: >-
    辽宁瓦房店人，哈军工毕业，从连队副指导员起一直做军队政治工作，1999 年进入中央军委，2002 年任总政治部主任，2004 年起任军委副主席，2007 年进入政治局，长期掌管军官人事。
    外媒普遍把他看作江泽民在军中的亲信，认为他在 2004 年升任军委副主席是为了掣肘胡锦涛。2014 年 3 月被调查、6 月被开除党籍，是习近平反腐中落马的最高级别军人之一；2015 年 3 月因膀胱癌病亡，未经审判。此后官方把肃清“郭伯雄、徐才厚流毒影响”列为全军政治任务。
  positions:
    - { title: 济南军区政委, sys: army, from: 1996, to: 1999, cite: b07-people-2014-06-30-xu-resume }
    - { title: 中央军委委员、总政治部常务副主任, sys: army, from: 1999, to: 2002, cite: b07-people-2014-06-30-xu-resume }
    - { title: 总政治部主任, sys: army, from: 2002, to: 2004, cite: b07-people-2014-06-30-xu-resume }
    - { title: 中央书记处书记, sys: party, from: 2002, to: 2007, cite: b07-people-2014-06-30-xu-resume }
    - { title: 中央军委副主席, sys: army, from: 2004-09, to: 2012-11, cite: b07-people-2014-06-30-xu-resume }
    - { title: 中央政治局委员, sys: party, from: 2007-10, to: 2012-11, cite: b07-people-2014-06-30-xu-resume }
  life:
    - h: 哈军工与吉林
      from: 1943
      to: 1984
      text: >-
        1943 年 6 月生于辽宁瓦房店，美国之音说他“没有显赫的家世背景”。1963 年入伍、考入哈尔滨军事工程学院电子工程系，1968 年毕业后先在第三十九军农场劳动、吉林省军区独立师当兵锻炼。
        1971 年入党，任沈阳军区守备第三师炮兵团副指导员，此后在吉林省军区政治部干部处工作十年，1983 年升任吉林省军区政治部副主任。
      cites: [b07-people-2014-06-30-xu-resume, b07-voa-2014-07-03-xu-hu]
    - h: 从集团军到总政
      from: 1984
      to: 1999
      text: >-
        1984 年任沈阳军区政治部群众工作部部长，1985 年任第十六集团军政治部主任，1990 年任政委。1992 年调入总政治部任主任助理并兼解放军报社社长，1993 年升总政副主任，1996 年出任济南军区政委。
        从连队副指导员起三十多年，他一直从事政治工作，美国之音称他后来“平步青云一路高升”。
      cites: [b07-people-2014-06-30-xu-resume, b07-voa-2014-07-03-xu-hu]
    - h: 江泽民后期的升迁
      from: 1999
      to: 2004
      text: >-
        1999 年十五届四中全会增补为中央军委委员，任总政常务副主任，同年晋上将；2000 年兼军委纪委书记，2002 年十六大进入中央书记处并任总政治部主任。
        2004 年 9 月江泽民把军委主席职务交给胡锦涛，徐才厚同时升任军委副主席。美国之音认为，这一安排“显然是为了增加对胡的掣肘”；BBC 也指出郭、徐两人都是 1999 年进入军委的。
      cites: [b07-people-2014-06-30-xu-resume, b07-nyt-2014-06-30-xu-caihou, b07-voa-2014-07-03-xu-hu, b07-bbc-2015-07-30-guo-xu]
    - h: 军委副主席
      from: 2004
      to: 2013
      text: >-
        2005 年任国家军委副主席，2007 年十七大进入政治局。BBC 引报道称，他掌管军中高层人事升迁十余年，是军中人脉最深的将领之一；美国之音说他在军中被称为“东北虎”。
        2008 年他在国防大学毕业典礼上要求部队“坚决听从党中央、中央军委和胡主席指挥”。2012 年十八大卸任党的军委副主席，2013 年 3 月卸任国家军委副主席。
      cites: [b07-people-2014-06-30-xu-resume, b07-bbc-2014-06-30-xu-expulsion, b07-voa-2014-07-03-xu-hu, b07-xinhua-2008-07-23-xu-speech]
    - h: 谷俊山案与落马
      from: 2012
      to: 2014-06
      text: >-
        原总后勤部副部长谷俊山被查后，《纽约时报》报道调查转向他的“主要靠山”徐才厚。官方后来披露，徐才厚 2013 年 2 月已确诊膀胱癌。
        2014 年 3 月 15 日中央决定对他组织调查；BBC 引匿名人士称，他在医院被带走，妻子、女儿和一名秘书也被带走调查。6 月 30 日他被开除党籍，通报称他“为他人晋升职务提供帮助，直接和通过家人收受贿赂”。
      cites: [b07-nyt-2014-06-30-xu-caihou, b07-bbc-2014-06-30-xu-expulsion, b07-81cn-2015-03-16-xu-qa, b07-xinhua-2014-06-30-xu-expulsion]
    - h: 病亡与“肃流毒”
      from: 2014-10
      to: 2016
      text: >-
        2014 年 10 月 27 日军事检察院侦查终结、移送审查起诉，认定他受贿数额特别巨大。2015 年 3 月 15 日他因膀胱癌终末期多器官衰竭死亡，军事检察院依刑事诉讼法第十五条作出不起诉决定。
        2016 年起官方提出“全面彻底肃清郭伯雄、徐才厚流毒影响”。胡佛研究所学者 James Mulvenon 指出，这一新提法 2016 年 7 月开始出现在官方媒体。
      cites: [b07-xinhua-2015-03-16-xu-death, b07-81cn-2015-03-16-xu-qa, b07-xinhua-2016-10-11-guo-xu-poison, b07-hoover-clm-guo-xu-poison]
    - h: 从受贿案到政治案
      from: 2014
      to: 2018
      text: >-
        官方通报只列受贿，外界解读则偏重政治。美国之音认为，打掉这只“军中大老虎”能让习近平加强军权，并向徐才厚效忠的江泽民叫板；香港《苹果日报》把他与周永康、薄熙来、令计划并称“新四人帮”。
        官方随后也改用政治语言：2016 年习近平在六中全会的说明中点名徐才厚等人，称其案件暴露出“在政治上也存在严重问题”；2018 年刘士余把他和薄熙来、孙政才等并列，说这些人“既巨贪又巨腐”。
      cites: [b07-voa-2014-07-03-xu-hu, b07-bbc-2014-12-23-hk-press-ling, b07-people-2016-11-03-xi-explanation, b07-bbc-2018-04-12-sun-trial]
  assess:
    - voice: doc
      quote: true
      text: 徐才厚利用职务便利，为他人晋升职务提供帮助，直接和通过家人收受贿赂；利用职务影响为他人谋利，其家人收受他人财物，严重违反党的纪律并涉嫌受贿犯罪，情节严重，影响恶劣
      cite: b07-xinhua-2014-06-30-xu-expulsion
    - voice: official
      quote: true
      text: 他们的所作所为，彻底背离党的宗旨，严重践踏党纪国法，给党的事业造成严重损害，给军队建设带来严重危害
      cite: b07-xinhua-2016-10-11-guo-xu-poison
    - voice: zh
      quote: true
      text: 徐才厚被提升为中央军委副主席，显然是为了增加对胡的掣肘
      cite: b07-voa-2014-07-03-xu-hu
    - voice: scholar
      quote: true
      text: Guo and Xu are the highest-ranking Chinese military officers indicted in Xi Jinping’s ongoing anti-corruption purge
      zh: 郭伯雄和徐才厚是习近平持续进行的反腐清洗中被起诉的最高级别中国军官。
      cite: b07-hoover-clm-guo-xu-poison
  family:
    - name: 妻子与女儿（未具名）
      rel: 妻、女
      text: >-
        BBC 2014 年引匿名知情人称，徐才厚被带走时，妻子、女儿和一名秘书也被带走调查。官方通报说他“直接和通过家人收受贿赂”，但没有公布家属姓名或处理结果。
      cites: [b07-bbc-2014-06-30-xu-expulsion, b07-xinhua-2014-06-30-xu-expulsion]
  cites: [b07-people-2014-06-30-xu-resume, b07-xinhua-2014-06-30-xu-expulsion, b07-xinhua-2015-03-16-xu-death, b07-voa-2014-07-03-xu-hu, b07-xinhua-2016-10-11-guo-xu-poison, wd-Q1335434]

