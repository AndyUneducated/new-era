  factions:
    - f: princelings
      cite: b07-nyt-2012-09-29-bo-bribery
      quote: 人们认为他是党总书记和国家主席接班人习近平的潜在竞争对手，后者跟他一样，也是太子党。
    - f: new-gang-of-four
      cite: b07-bbc-2014-12-23-hk-press-ling
      quote: 《苹果日报》则指令计划是中共党内高层“新四人帮”的最后一名落网成员，其他成员则包括中共前政治局常委周永康、前政治局委员薄熙来和前中央军委副主席徐才厚。
  bio: >-
    中共元老薄一波之子，历任大连市长、辽宁省长、商务部长，2007 年进入政治局并主政重庆，以“唱红打黑”和大规模修建公租房形成所谓“重庆模式”，一度被视为十八大常委的有力人选。
    2012 年 2 月重庆公安局长王立军进入美国驻成都总领事馆，牵出其妻谷开来毒杀英国商人尼尔·海伍德一案，薄熙来随即被免职、立案、开除党籍，2013 年在济南以受贿、贪污、滥用职权罪被判无期徒刑。
    官方把此案定性为腐败与违纪；不少媒体和学者则把它看作十八大前的高层权力与路线之争，香港媒体把他列入“新四人帮”。
  positions:
    - { title: 大连市市长, sys: gov, place: 辽宁, from: 1993, to: 2000, cite: b07-xinhua-2007-10-22-bo-resume }
    - { title: 大连市委书记, sys: party, place: 辽宁, from: 1999, to: 2000, cite: b07-xinhua-2007-10-22-bo-resume }
    - { title: 辽宁省代省长、省长, sys: gov, place: 辽宁, from: 2000, to: 2004, cite: b07-xinhua-2007-10-22-bo-resume }
