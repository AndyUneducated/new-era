  died: 2015-03-15
  birthplace: 辽宁瓦房店
  origin: 辽宁瓦房店
  education:
    - { school: 哈尔滨军事工程学院电子工程系, from: 1963, to: 1968 }
  joinedParty: 1971-04
  joinedWork: 1963-08
  roles: [pb, sec, cmc, cc, general, tiger]
  status: dead
  statusNote: 2015 年 3 月 15 日在审查起诉阶段因膀胱癌病亡，军事检察院依法作出不起诉决定，未经审判。
  fall:
    - { date: 2014-03-15, text: 中共中央决定对徐才厚涉嫌违纪问题进行组织调查, cite: b07-xinhua-2014-06-30-xu-expulsion }
    - { date: 2014-06-30, text: 中央政治局会议决定开除党籍，涉嫌受贿问题移送军事检察机关, cite: b07-xinhua-2014-06-30-xu-expulsion }
