  life:
    - h: 军校与工厂
      from: 1946
      to: 1985
      text: >-
        1946 年 10 月生，籍贯浙江宁波。1963 年考入解放军后勤工程学院建筑系结构专业，1968 年到 6716 部队当兵锻炼，1970 年进入上海彭浦机器厂，从工人、设计员做到基建科副科长、副厂长，其间在同济大学进修，1980 年入党。
        1983 年起先后任上海冶金矿山机械公司党委副书记、上海电器公司党委书记，1985 年调任市委老干部局副局长、局长。
      cites: [b07-xinhua-2002-11-16-chen-resume, wd-Q715087]
    - h: 黄浦区与市委
      from: 1987
      to: 2001
      text: >-
        1987 年任黄浦区委副书记、区长，主持旧城改造，1992 年曾到英国伯明翰大学学习，同年升任市委副秘书长、市委副书记，1996 年兼任副市长。
        法院后来认定，他从 1988 年起就利用黄浦区长等职务为上海新黄浦集团、申花足球俱乐部等谋利；《光明网》转载的庭审纪实说，港商杨崧才在闽江饭店拆迁中靠他帮助获利 2100 万元，并多次向他行贿。
      cites: [b07-xinhua-2002-11-16-chen-resume, b07-xinhua-2008-04-11-chen-sentence, b07-gmw-2008-04-27-chen-trial]
    - h: 市长与市委书记
      from: 2001-12
      to: 2006
      text: >-
        2001 年 12 月任代市长，2002 年 2 月任市长，10 月接任市委书记，11 月十六大进入政治局。2005 年他在动拆迁会议上说，“大动迁是城市大发展的需要，也是执政为民的需要”，要求“视发展机遇为生命、待动迁居民如亲人”。
        香港学者邱震海对美国之音说，据内部消息，2004 年他曾在政治局会议上公开顶撞温家宝的宏观调控，把上海搞成“独立王国”。
      cites: [b07-xinhua-2002-11-16-chen-resume, b07-gov-2005-11-27-chen-relocation, b07-voa-2006-09-27-chen-qiu]
    - h: 社保案与免职
      from: 2006-07
      to: 2006-09
      text: >-
        2006 年 7 月 5 日起，中纪委调查上海市劳动和社会保障局违规运营社保基金问题，发现时任市委书记的陈良宇涉嫌严重违纪；8 月 24 日政治局常委会决定初核。9 月 24 日政治局会议认定他涉及“违规使用社保资金、为一些不法企业主谋取利益”、袒护身边工作人员、为亲属谋利等问题，决定免职并立案检查。
        庭审纪实说，这场社保风暴波及上海政要、国企高管和民营富豪近 30 人。
      cites: [b07-xinhua-2007-07-26-chen-expulsion, b07-xinhua-2006-09-25-chen-removal, b07-gmw-2008-04-27-chen-trial]
    - h: 开除党籍
      from: 2007-07
      to: 2007-10
      text: >-
        2007 年 7 月 24 日上海市人大常委会罢免他的全国人大代表职务，26 日中央政治局决定开除党籍、公职。中纪委副书记夏赞忠说，他支持社保局违规把巨额社保基金贷给不法企业主，帮助不法企业主收购国有股权，并“道德败坏，利用职权玩弄女性，搞权色交易”。
        10 月，十六届七中全会确认开除党籍处分。
      cites: [b07-xinhua-2007-07-26-chen-expulsion, b07-xinhua-2008-04-11-chen-sentence]
    - h: 天津受审
      from: 2008-03
      to: 2008-04
      text: >-
        2008 年 3 月 25 日在天津二中院受审，庭审纪实说，现场没有媒体记者和家属，检方指控受贿、滥用职权、玩忽职守三项罪名。他在最后陈述中说：“我对不起党，对不起上海人民，对不起我的家人。”
        4 月 11 日一审认定他受贿 239 万余元，违规让福禧投资低价收购路桥股权，为弟弟陈良军违规征地，并致 10 亿元社保基金被违规动用，判处有期徒刑十八年。路透社引其律师说，法院没有认定玩忽职守罪，他庭上对部分指控不认罪。
      cites: [b07-gmw-2008-04-27-chen-trial, b07-xinhua-2008-04-11-chen-sentence, b07-reuters-2008-04-11-chen-jailed]
    - h: 上海帮的挫败
      from: 2006
      to: 2008
      text: >-
        BBC 引述报道说，上海是江泽民的根据地，胡锦涛借此机会“铲除贪污腐败官员，安插自己的亲信”。香港城市大学郑宇硕说：“这意味着胡锦涛现在可以说是大权在握，江泽民时代已经结束。”
        邱震海则认为不能完全用权力斗争解释此案，曾庆红、吴邦国等人仍在中央。官方舆论强调反腐决心，否认此事与高层权力斗争有关。
      cites: [b07-bbc-2006-10-08-chen-shanghai-gang, b07-voa-2006-09-27-chen-qiu]
  assess:
    - voice: doc
      quote: true
      text: 陈良宇的行为严重违反了党纪政纪，给国家和人民的利益造成重大损失，给党的形象带来严重损害，社会影响极其恶劣
      cite: b07-xinhua-2007-07-26-chen-expulsion
    - voice: official
      quote: true
      text: 陈良宇被依法惩处，体现了中共中央加强党风廉政建设、坚决惩治腐败的坚强决心和鲜明态度
      cite: b07-xinhua-2008-04-11-chen-sentence
    - voice: scholar
      quote: true
      text: 不可否认，陈良宇下台这里面有权力斗争的影子，因为所谓的上海帮以陈良宇和黄菊为代表的都是江泽民提拔的人
      cite: b07-voa-2006-09-27-chen-qiu
    - voice: west
      quote: true
      text: Chen, widely seen as a close associate of former president Jiang Zemin, pleaded not guilty to some of the charges during his March 25 trial
      zh: 普遍被视为前国家主席江泽民亲信的陈良宇，在 3 月 25 日的庭审中对部分指控不认罪。
      cite: b07-reuters-2008-04-11-chen-jailed
  family:
