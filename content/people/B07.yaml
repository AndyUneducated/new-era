  bio: >-
    陕西礼泉人，工人出身，1961 年入伍，前半生几乎都在第十九军和兰州军区度过，1997 年任兰州军区司令员，1999 年进入中央军委任常务副总参谋长，2002 年起任军委副主席、政治局委员十年。
    2015 年 4 月被调查、7 月被开除党籍；2016 年 7 月军事法院以受贿罪判处无期徒刑并剥夺上将军衔。官方称他与徐才厚是“建军以来”被查处职务最高的军队领导干部；媒体称他是江泽民在军中的亲信，网上称他“西北狼”，兰州军区被视为他的势力范围。
  positions:
    - { title: 第四十七集团军军长, sys: army, from: 1990, to: 1993, cite: b07-xinhua-2015-07-30-guo-resume }
    - { title: 北京军区副司令员, sys: army, from: 1993, to: 1997, cite: b07-xinhua-2015-07-30-guo-resume }
    - { title: 兰州军区司令员, sys: army, from: 1997, to: 1999, cite: b07-xinhua-2015-07-30-guo-resume }
    - { title: 中央军委委员、常务副总参谋长, sys: army, from: 1999, to: 2002, cite: b07-xinhua-2015-07-30-guo-resume }
    - { title: 中央军委副主席, sys: army, from: 2002-11, to: 2012-11, cite: b07-xinhua-2015-07-30-guo-resume }
    - { title: 中央政治局委员, sys: party, from: 2002-11, to: 2012-11, cite: wd-Q1337947 }
  life:
    - h: 工人与第十九军
      from: 1942
      to: 1983
      text: >-
        1942 年 7 月生于陕西礼泉，1958 年在兴平县四〇八厂当工人，1961 年入伍到陆军第十九军五十五师一六四团，从战士做到班长、排长，1963 年入党。
        此后在团、军司令部的作训部门当参谋、股长、处长近二十年，1981 年起在解放军军事学院学习，任五十五师参谋长、兰州军区司令部作战部副部长。
      cites: [b07-xinhua-2015-07-30-guo-resume]
    - h: 兰州与北京
      from: 1983
      to: 1999
      text: >-
        1983 年任第十九军参谋长，1985 年任兰州军区副参谋长，1990 年任第四十七集团军军长，1993 年调任北京军区副司令员，1997 年回兰州任军区司令员。
        德国之声引《南华早报》说，原七大军区中最大的兰州军区是他的“势力范围”。《纽约时报》说他在网上被称作“西北狼”，既因早年在西北服役，也因他贪婪的名声。
      cites: [b07-xinhua-2015-07-30-guo-resume, b07-dw-2016-07-25-guo-sentence, b07-nyt-2016-07-25-guo-conviction]
    - h: 中央军委
      from: 1999
      to: 2013
      text: >-
        1999 年十五届四中全会增补为军委委员，任常务副总参谋长；新华社简历记为 2002 年十六届一中全会任军委副主席并进入政治局，2003 年任国家军委副主席。
        2008 年在南京调研时，他强调“从严治军是军队建设的铁律”，要求各级领导带头做从严治军的模范。2012 年十八大卸任，2013 年 3 月卸任国家军委副主席。美国之音指出，他也是在江泽民主政后期升任军委副主席的。
      cites: [b07-xinhua-2015-07-30-guo-resume, b07-cctv-2016-07-25-guo-recap, b07-xinhua-2008-07-24-guo-speech, b07-voa-2014-07-03-xu-hu]
    - h: 父子落马
      from: 2015-02
      to: 2015-07
      text: >-
        2015 年 2 月，其子、浙江省军区副政委郭正钢被军事检察机关立案侦查，BBC 说外界由此开始猜测郭伯雄也将被查。4 月 9 日中央决定对他组织调查，7 月 30 日开除党籍，通报称他“为他人谋取职务晋升等方面利益，直接或通过家人收受贿赂”。
        BBC 指出，这是中共近年首次两位同期军委副主席先后落马，也“反映出中国军中买官卖官问题的严重性”。
      cites: [b07-dw-2016-07-25-guo-sentence, b07-bbc-2015-07-30-guo-xu, b07-xinhua-2015-07-30-guo-expulsion]
    - h: 军事法院宣判
      from: 2016-04
      to: 2016-07
      text: >-
        2016 年 4 月 5 日侦查终结移送起诉，官方称他“对涉嫌受贿犯罪事实供认不讳”。5 月 3 日军事法院立案，因部分证据涉及军事秘密不公开审理。7 月 25 日宣判：受贿数额特别巨大，判处无期徒刑，剥夺上将军衔，他当庭表示不上诉。
        官方没有公布受贿金额；德国之声引《南华早报》消息说，实际受贿金额远超 8000 万元。
      cites: [b07-cctv-2016-07-25-guo-recap, b07-xinhua-2016-07-25-guo-sentence, b07-dw-2016-07-25-guo-sentence]
    - h: 郭徐“流毒”
      from: 2016
      to: 2016-10
      text: >-
        判决前后，官方把郭伯雄、徐才厚并列批判。《纽约时报》援引《解放军报》读本说，两人贪腐“骇人听闻”，但要害是“他们触犯了政治底线”。2016 年 10 月新华社文章称，两人的流毒影响“是全面的、深层次的”，要求全军全面彻底肃清。
        胡佛研究所学者 James Mulvenon 认为，这场肃清运动关系到党军关系的走向。
      cites: [b07-nyt-2016-07-25-guo-conviction, b07-xinhua-2016-10-11-guo-xu-poison, b07-hoover-clm-guo-xu-poison]
    - h: 江泽民时代的军头
      from: 1999
      to: 2016
      text: >-
        BBC 指出，郭伯雄、徐才厚都是 1999 年进入中央军委，又先后在 2002 年和 2004 年以军方最高代表身份升任军委副主席。美国之音说，徐才厚在军中被称为“东北虎”，郭伯雄则有“西北狼”之称。
        德国之声引《南华早报》报道，两人都曾是江泽民的亲信，是江泽民控制军界的重要人物。官方没有使用派系说法；2016 年习近平的六中全会说明把郭伯雄与周永康、薄熙来、徐才厚、令计划并列，称其案件暴露出政治问题。
      cites: [b07-bbc-2015-07-30-guo-xu, b07-voa-2014-07-03-xu-hu, b07-dw-2016-07-25-guo-sentence, b07-people-2016-11-03-xi-explanation]
  assess:
    - voice: doc
      quote: true
      text: 郭伯雄受贿数额特别巨大，犯罪情节特别严重，归案后如实供述罪行，真诚认罪悔罪，赃款赃物全部追缴
      cite: b07-xinhua-2016-07-25-guo-sentence
    - voice: official
      quote: true
      text: 郭伯雄、徐才厚贪腐问题骇人听闻……但这还不是他们问题的要害，要害是他们触犯了政治底线
      cite: b07-nyt-2016-07-25-guo-conviction
    - voice: zh
      quote: true
      text: 也反映出中国军中买官卖官问题的严重性，而且难免令人对中共军中的腐败程度乍舌
      cite: b07-bbc-2015-07-30-guo-xu
    - voice: zh
      quote: true
      text: 军委纪检人员对郭伯雄受贿金额有遮掩，实际受贿金额远远超过8000万元人民币这个数字
      cite: b07-dw-2016-07-25-guo-sentence
  family:
    - name: 郭正钢
      rel: 子
      text: >-
        解放军少将，曾任浙江省军区副政委。德国之声报道他 2015 年 2 月被军事检察机关立案侦查；《纽约时报》称他可能是郭案中将要受审的其他嫌疑人之一。
      cites: [b07-dw-2016-07-25-guo-sentence, b07-nyt-2016-07-25-guo-conviction, b07-bbc-2015-07-30-guo-xu]
  cites: [b07-xinhua-2015-07-30-guo-resume, b07-xinhua-2015-07-30-guo-expulsion, b07-xinhua-2016-07-25-guo-sentence, b07-dw-2016-07-25-guo-sentence, b07-xinhua-2016-10-11-guo-xu-poison, wd-Q1337947]

- id: sun-zhengcai
  name: 孙政才
  pinyin: Sūn Zhèngcái
  gender: m
  ethnicity: 汉族
  born: 1963-09-25
  origin: 山东荣成
  education:
    - { school: 莱阳农学院农学系, from: 1980, to: 1984 }
    - { school: 北京市农林科学院、北京农业大学, degree: 硕士, from: 1984, to: 1987 }
    - { school: 中国农业大学, degree: 农学博士, from: 1990, to: 1997 }
  joinedParty: 1988-07
  joinedWork: 1987-05
  roles: [pb, cc, prov, minister, tiger]
  status: detained
  statusNote: 2018 年 5 月被判无期徒刑，当庭表示不上诉，在押服刑。
  fall:
    - { date: 2017-07-14, text: 中央决定将其调离重庆市委书记岗位，由中央纪委进行纪律审查, cite: b07-xinhua-2017-09-29-sun-expulsion }
    - { date: 2017-07-24, text: 中央决定由中央纪委对其立案审查, cite: b07-ccdi-2017-07-24-sun-investigation }
    - { date: 2017-09-29, text: 中央政治局会议决定开除党籍、开除公职，移送司法机关, cite: b07-xinhua-2017-09-29-sun-expulsion }
    - { date: 2018-04-12, text: 天津市第一中级人民法院公开开庭审理, cite: b07-court-2018-04-12-sun-trial }
    - { date: 2018-05-08, text: 以受贿罪一审判处无期徒刑，剥夺政治权利终身，没收个人全部财产, cite: b07-xinhua-2018-05-08-sun-sentence }
  tier: 1
  headline: 中央政治局委员、重庆市委书记（2012–2017），2018 年被判无期徒刑
  ids: { wikidata: Q72870 }
  bio: >-
    农学博士出身，从北京市农林科学院、顺义区、北京市委秘书长做到农业部长、吉林省委书记，2012 年以 49 岁进入政治局并接掌薄熙来倒台后的重庆，与胡春华同被视为第六代领导人人选。
    2017 年 2 月中央巡视组批评重庆清除“薄、王”遗毒不彻底；7 月，十九大前三个月，他突然被调离、立案，9 月被开除党籍；2018 年以受贿 1.7 亿余元被判无期徒刑。官方把他与薄熙来、周永康等并列；学者多认为他倒台的关键是未能充分效忠，这也打破了既定的接班次序。
  positions:
    - { title: 北京市顺义县（区）县长、区长, sys: gov, place: 北京, from: 1997, to: 2002, cite: b07-mj-2012-11-16-sun-resume }
    - { title: 北京市委常委、秘书长, sys: party, place: 北京, from: 2002, to: 2006, cite: b07-mj-2012-11-16-sun-resume }
    - { title: 农业部部长, sys: gov, from: 2006-12, to: 2009-12, cite: wd-Q72870 }
    - { title: 吉林省委书记, sys: party, place: 吉林, from: 2009-11, to: 2012-11, cite: wd-Q72870 }
    - { title: 中央政治局委员, sys: party, from: 2012-11, to: 2017-09, cite: wd-Q72870 }
    - { title: 重庆市委书记, sys: party, place: 重庆, from: 2012-11, to: 2017-07, cite: b07-xinhua-2017-09-29-sun-expulsion }
  life:
    - h: 玉米专家
      from: 1963
      to: 1997
      text: >-
        1963 年 9 月生，官方简历记籍贯山东荣成。1980–1984 年在莱阳农学院读农学，随后在北京市农林科学院、北京农业大学读作物栽培硕士，1987 年参加工作，任农科院作物所玉米研究室副主任，1988 年入党，1991 年到英国洛桑试验站做访问学者。
        此后任土肥所所长、农科院副院长、常务副院长，1997 年获中国农业大学农学博士。
      cites: [b07-mj-2012-11-16-sun-resume, wd-Q72870]
    - h: 顺义与北京市委
      from: 1997
      to: 2006
      text: >-
        1997 年任顺义县代县长、县长，撤县设区后任区长，2002 年任顺义区委书记、北京市委常委，同年转任市委秘书长兼市直机关工委书记。法院后来认定，他的受贿从 2002 年任顺义区委书记时开始。
        《纽约时报》引李成等分析人士说，他是与江泽民关系亲密的贾庆林的门生，也有人说温家宝可能是他的另一位庇护人。
      cites: [b07-mj-2012-11-16-sun-resume, b07-xinhua-2018-05-08-sun-sentence, b07-nyt-2012-11-26-leaders]
    - h: 农业部与吉林
      from: 2006
      to: 2012
      text: >-
        2006 年底任农业部部长，2009 年底调任吉林省委书记，次年兼任省人大常委会主任。2010 年夏吉林发生严重洪灾，造成 47 人遇难，他因此面临危机。
        他常讲自己对农村的感情：2007 年在江西参观革命旧址时收到两张 1934 年红军向农民借粮的欠条，2009 年他对新华社记者说，从那以后一直把欠条放在钱包里。
      cites: [b07-mj-2012-11-16-sun-resume, wd-Q72870, b07-nyt-2012-11-26-leaders]
    - h: 重庆五年
      from: 2012-11
      to: 2016
      text: >-
        2012 年十八大进入政治局，成为少有的“60后”委员，11 月出任重庆市委书记。《纽约时报》指出他和胡春华都不是太子党，与习近平的关系也不清楚。
        《联合早报》引评论人陈杰人说，他主政重庆五年作风谨慎、温和，让重庆“平稳过渡”，但经济社会发展并无特别突出的成就。
      cites: [b07-bbc-2018-04-12-sun-trial, wd-Q72870, b07-nyt-2012-11-26-leaders, b07-zaobao-2017-07-16-sun]
    - h: 巡视“回头看”
      from: 2016-11
      to: 2017-07
      text: >-
        2016 年 11 月至 2017 年 1 月，中央第十一巡视组对重庆开展巡视“回头看”。2 月反馈会上指出党的领导弱化、选人用人把关不严、上轮问题整改不到位、清除“薄、王”思想遗毒不彻底，孙政才表态“严肃对待、诚恳接受、照单全收、坚决整改”。
        4 月底，与他关系要好的副市长何挺被查。据《纽约时报》报道，他被拿下前五天还公开表态效忠习近平。
      cites: [b07-ccdi-2017-02-13-chongqing-inspection, b07-zaobao-2017-07-16-sun, b07-nyt-2017-07-24-sun-fall]
    - h: 十九大前落马
      from: 2017-07
      to: 2017-09
      text: >-
        2017 年 7 月 14 日中央决定将他调离重庆，次日由习近平旧部陈敏尔接任；官方通报没有说他“另有任用”。7 月 24 日立案审查，9 月 29 日被开除党籍、公职，通报列举他“严重违反党的政治纪律和政治规矩”，“讲排场、搞特权”，泄露组织秘密，并“搞权色交易”。
        学者林和立对《卫报》说，他的调查结束得异常快。
      cites: [b07-xinhua-2017-09-29-sun-expulsion, b07-zaobao-2017-07-16-sun, b07-ccdi-2017-07-24-sun-investigation, b07-guardian-2017-09-30-sun]
    - h: 天津受审
      from: 2018-04
      to: 2018-05
      text: >-
        2018 年 4 月 12 日天津一中院公开开庭，检方指控他 2002–2017 年单独或伙同特定关系人收受财物 1.7 亿余元。他在最后陈述中说自己“咎由自取、罪有应得”。开庭前两天，《重庆日报》称“孙政才和薄熙来把对党忠诚当成口号喊”。
        5 月 8 日被判无期徒刑；法院称大部分财物由特定关系人直接收受，他主动交代了部分未掌握的事实。他当庭表示不上诉。
      cites: [b07-court-2018-04-12-sun-trial, b07-bbc-2018-04-12-sun-trial, b07-xinhua-2018-05-08-sun-sentence, b07-bbc-2018-05-08-sun-sentence]
    - h: 官方定性与外界解读
      from: 2017
      to: 2018
      text: >-
        官方把他与薄熙来、周永康、令计划、徐才厚、郭伯雄并列，刘士余称这些人“既巨贪又巨腐、又阴谋篡党夺权”。《卫报》指出，他到重庆的任务之一是清除薄熙来的影响，却在巡视中被点名未能完成。
        学者吴强对《纽约时报》说，他“是个牺牲品”，习近平借此表明自己不受上一代领导人定下的晋升次序约束；傅士卓则说他只是在错误的地方出现的错误的人。
      cites: [b07-bbc-2018-04-12-sun-trial, b07-guardian-2017-09-30-sun, b07-nyt-2017-07-24-sun-fall]
  assess:
    - voice: doc
      quote: true
      text: 孙政才的行为完全背离了党性原则，严重违背了党中央对高级干部提出的政治要求，辜负了党中央的信任和人民的期待
      cite: b07-xinhua-2017-09-29-sun-expulsion
    - voice: official
      quote: true
      text: 这些人在党内位高权重，既巨贪又巨腐、又阴谋篡党夺权
      cite: b07-bbc-2018-04-12-sun-trial
    - voice: scholar
      quote: true
      text: 孙政才是个牺牲品，这是向全党发出的信息
      cite: b07-nyt-2017-07-24-sun-fall
    - voice: scholar
      quote: true
      text: Sun Zhengcai’s major problem was not corruption or womanising but failure to profess full loyalty to Xi Jinping
      zh: 孙政才的主要问题不是腐败或玩弄女性，而是没能对习近平表示完全的忠诚。（林和立）
      cite: b07-guardian-2017-09-30-sun
  cites: [b07-mj-2012-11-16-sun-resume, b07-xinhua-2017-09-29-sun-expulsion, b07-xinhua-2018-05-08-sun-sentence, b07-ccdi-2017-02-13-chongqing-inspection, b07-nyt-2017-07-24-sun-fall, wd-Q72870]

