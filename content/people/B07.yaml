  tier: 1
  headline: 中央政治局委员、上海市委书记（2002–2006），2008 年被判有期徒刑十八年
  ids: { wikidata: Q715087 }
  factions:
    - f: jiang-shanghai
      cite: b07-bbc-2006-10-08-chen-shanghai-gang
      quote: '报道还评论认为，陈良宇下台严重削弱了所谓"上海帮" - 也就是江泽民的亲信和门徒的势力。'
  bio: >-
    籍贯浙江宁波，军队院校毕业后在上海工厂起家，历任黄浦区长、上海市委副书记、副市长、市长，2002 年任上海市委书记并进入政治局。
    2006 年 9 月因上海社保基金违规案被免职、立案，2007 年被开除党籍，2008 年天津二中院以受贿、滥用职权罪判处有期徒刑十八年，是继陈希同之后第二位因腐败受审的政治局委员。
    外媒普遍把他看作江泽民“上海帮”的干将，认为他下台是胡锦涛打击江系、巩固权力的一步；官方否认此案与高层权力斗争有关。
  positions:
