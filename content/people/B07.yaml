  life:
    - h: 元老之子
      from: 1949
      to: 1982
      text: >-
        1949 年 7 月生，籍贯山西定襄，父亲薄一波是中共元老、后任国务院副总理。文革中薄一波被扣上“六十一个叛徒集团”的帽子入狱，BBC 说少年薄熙来和兄弟姐妹一下子都成了“黑五类”。
        官方简历记载他 1968–1972 年进“学习班”劳动，此后在北京二轻局五金机修厂当了六年工人；1978 年入北大历史系，次年考入社科院研究生院国际新闻专业，获文学硕士。BBC 称这是“在父亲安排下”。
      cites: [b07-xinhua-2007-10-22-bo-resume, b07-bbc-2012-04-30-bo-family]
    - h: 大连、辽宁与商务部
      from: 1984
      to: 2007
      text: >-
        1982 年进入中央书记处研究室和中办，1984 年下放辽宁金县，历任县委书记、大连市委宣传部长、副市长，1993 年任大连市长，1999 年兼市委书记，2000 年调任辽宁代省长、次年任省长。BBC 记载，当时的省委书记闻世震据说讥讽大连的做法是城市像欧洲、农村像非洲。
        2004 年任商务部部长，2007 年十七大进入政治局，年底调任重庆市委书记。法院后来认定，他在大连、辽宁和商务部任内收受唐肖林、大连实德徐明的财物。
      cites: [b07-xinhua-2007-10-22-bo-resume, b07-bbc-2012-03-15-bo-profile, b07-xinhua-2013-09-22-bo-sentence]
    - h: 重庆：唱红打黑
      from: 2007
      to: 2012
      text: >-
        在重庆，他推动经济增长、大量修建公租房，并高调开展“唱红”和打黑除恶，这些做法被称为“重庆模式”。BBC 记载，打黑专项行动导致三千多人被捕；批评者认为他要恢复毛泽东时代的做法，拥护者则认为改革开放造成了社会分化。
        2012 年两会上他说，重庆打黑“负责任地讲，没有刑讯逼供”。《卫报》引政治学者张鸣的话说，薄熙来真正的问题出在打黑上，而打黑中酷刑被广泛使用。
      cites: [b07-bbc-2013-09-22-bo-sentence-politics, b07-bbc-2012-03-15-bo-profile, b07-voa-2012-03-09-bo-presser, b07-guardian-2013-09-22-bo-line]
    - h: 王立军事件与海伍德案
      from: 2011-11
      to: 2012-04
      text: >-
        据法院认定，2011 年 11 月 13 日谷开来与家中勤务人员张晓军在重庆南山丽景度假酒店毒杀英国人尼尔·伍德（海伍德）。2012 年 1 月 28 日王立军向薄熙来报告此事，薄熙来斥责他并打他耳光，随后主持常委会免去他的公安局长职务。
        2 月 6 日王立军进入美国驻成都总领事馆，次日深夜离开。3 月 14 日温家宝在记者会上说“现任重庆市委和市政府必须反思”，次日薄熙来被免职；4 月 10 日被停止政治局委员职务、立案调查。
      cites: [b07-xinhua-2013-09-22-bo-sentence, b07-xinhua-2012-09-24-wang-lijun-sentence, b07-cntv-2012-03-14-wen-presser, b07-xinhua-2012-04-10-bo-investigation]
    - h: 审判
      from: 2012-08
      to: 2013-10
      text: >-
        2012 年 8 月谷开来在合肥被判死缓，法院称她“有完全刑事责任能力，但患有精神障碍”；9 月王立军在成都被判十五年；薄熙来被开除党籍。
        2013 年 8 月济南中院开庭五天，并用微博直播庭审。薄熙来当庭推翻庭前供词，称谷开来“疯了”，说起诉书对他贪腐的指控“是严重失实的”。9 月 22 日一审认定受贿 2044 万余元、贪污 500 万元并滥用职权，判处无期徒刑；10 月 25 日二审维持原判。
      cites: [b07-xinhua-2012-08-20-gu-kailai-sentence, b07-xinhua-2012-09-24-wang-lijun-sentence, b07-bbc-2013-08-23-bo-trial, b07-bbc-2013-08-26-bo-trial-wrap, b07-xinhua-2013-09-22-bo-sentence, b07-xinhua-2013-10-25-bo-appeal]
    - h: 权力斗争还是腐败案
      from: 2012
      to: 2018
      text: >-
        BBC 评论认为，温家宝及中共最高层希望把事件提升到路线斗争的高度；判决后又说当局以贪腐罪审理，“避重就轻，避免再次引发政治路线的争议”。《纽约时报》称，同意严惩他的领导人中可能包括“曾支持薄熙来的江泽民”。
        香港《苹果日报》称，周永康、薄熙来、令计划、徐才厚组成的“新四人帮”曾计划在十八大前夺权。官方后来也用政治语言定性：2016 年习近平称周、薄等人案件暴露出“在政治上也存在严重问题”，2018 年刘士余说他们“阴谋篡党夺权”。
      cites: [b07-bbc-2012-03-15-bo-commentary, b07-bbc-2013-09-22-bo-sentence-politics, b07-nyt-2012-09-29-bo-bribery, b07-bbc-2014-12-23-hk-press-ling, b07-people-2016-11-03-xi-explanation, b07-bbc-2018-04-12-sun-trial]
  assess:
    - voice: doc
      quote: true
      text: 薄熙来的行为造成了严重后果，极大损害了党和国家声誉，在国内外产生了非常恶劣的影响，给党和人民的事业造成了重大损失
      cite: b07-xinhua-2012-09-28-bo-expulsion
    - voice: doc
      quote: true
      text: 周永康、薄熙来、郭伯雄、徐才厚、令计划等人严重违纪违法案件，不仅暴露出他们在经济上存在严重问题，而且暴露出他们在政治上也存在严重问题
      cite: b07-people-2016-11-03-xi-explanation
    - voice: zh
      quote: true
      text: 在薄熙来的同情者眼中，判薄熙来无期徒刑无疑印证了薄熙来接受的是政治审判，中共核心领导层才是幕后真正的法官和陪审团
      cite: b07-bbc-2013-09-22-bo-sentence-politics
    - voice: scholar
      quote: true
      text: "We all know Bo's real crime was to do with 'striking the black'……It is aimed at destroying his reputation"
      zh: 我们都知道薄熙来真正的罪行与“打黑”有关……（以腐败定罪）是为了毁掉他的名声。（政治学者张鸣，《卫报》引述）
      cite: b07-guardian-2013-09-22-bo-line
  family:
    - name: 薄一波
      rel: 父
      text: >-
        中共元老，曾任国务院副总理；BBC 记载他生有三女四子。文革中被扣上叛徒集团的帽子入狱，文革后平反。BBC 写道，作为薄一波之子，薄熙来与习仲勋之子习近平一样被视为太子党成员。
      cites: [b07-bbc-2012-04-30-bo-family, b07-bbc-2012-03-15-bo-profile]
    - name: 谷开来（薄谷开来）
      rel: 妻
      text: >-
        律师，薄熙来 2012 年称她在大连办律师所“搞得很成功”。2012 年 8 月以故意杀人罪被判死缓；法院认定她和儿子收受徐明财物 1933 万余元，薄熙来受审时她通过录像作证指控丈夫。
      cites: [b07-voa-2012-03-09-bo-presser, b07-xinhua-2012-08-20-gu-kailai-sentence, b07-xinhua-2013-09-22-bo-sentence, b07-bbc-2016-07-04-ling-sentence]
    - name: 薄瓜瓜
      rel: 子
      text: >-
        与谷开来所生。BBC 记载他曾就读哈罗公学、牛津，2012 年是哈佛学生。薄熙来 2012 年否认他开红色法拉利，称学费来自全额奖学金。《卫报》引海伍德的朋友说，海伍德与他比与薄家其他人更亲近。
      cites: [b07-bbc-2012-04-30-bo-family, b07-voa-2012-03-09-bo-presser, b07-guardian-2012-08-09-heywood-questions]
    - name: 李丹宇
      rel: 前妻
      text: >-
        1976 年与薄熙来结婚，生一子（BBC 写作薄望知）；父亲李雪峰曾任北京市委书记。BBC 称薄熙来后来与谷开来交往，这段婚姻随之结束。
      cites: [b07-bbc-2012-04-30-bo-family]
  cites: [b07-xinhua-2007-10-22-bo-resume, b07-xinhua-2012-09-28-bo-expulsion, b07-xinhua-2013-09-22-bo-sentence, b07-bbc-2012-03-15-bo-profile, b07-bbc-2013-09-22-bo-sentence-politics, wd-Q21822]

- id: ling-jihua
  name: 令计划
  pinyin: Lìng Jìhuà
  gender: m
  ethnicity: 汉族
  born: 1956-10-22
  birthplace: 山西平陆
  origin: 山西平陆
  roles: [sec, cc, minister, tiger]
  status: detained
  statusNote: 2016 年 7 月被判无期徒刑，当庭表示不上诉，在押服刑。
  fall:
    - { date: 2014-12-22, text: 新华社宣布令计划涉嫌严重违纪接受组织调查, cite: b07-xinhua-2014-12-22-ling-investigation }
    - { date: 2015-07-20, text: 中央政治局会议决定开除党籍、开除公职，移送司法机关, cite: b07-xinhua-2015-07-20-ling-expulsion }
