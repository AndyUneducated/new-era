      text: 我生命中的這一部分既非我所能改變，也非他人所能改變
      cite: b10-dw-2026-01-ai-passport
  family:
    - name: 艾青
      rel: 父亲
      text: 著名诗人。艾未未幼年随父母被下放到东北和新疆。
      cites: [b10-dw-2026-01-ai-passport]
    - name: 艾未未之子
      rel: 儿子
      text: 2025 年 12 月，17 岁的他随父亲回国探望祖母。
      cites: [b10-cna-2026-01-16-ai, b10-dw-2026-01-ai-passport]
  cites: [b10-reuters-2011-04-07-ai-mfa, b10-rfa-2011-06-22-ai-bail, b10-rfi-2012-09-27-ai-tax, b10-voa-2011-04-07-ai, b10-bbc-2009-05-ai-quake-list, b10-dw-2026-01-ai-passport, wd-Q160115]

- id: li-wenliang
  name: 李文亮
  pinyin: Lǐ Wénliàng
  gender: m
  ethnicity: 满族
  born: 1985-10-12
  died: 2020-02-07
  origin: 辽宁锦州
  education:
    - { school: 武汉大学临床医学七年制专业, from: 2004, to: 2011 }
  roles: [dissent]
  status: dead
  statusNote: 2020 年 2 月 7 日感染新冠病毒去世；4 月被湖北省评定为首批烈士。
  fall:
    - { date: 2020-01-03, text: 因在微信群转发 SARS 信息被中南路派出所训诫, cite: b10-xinhua-2020-03-19-li-report }
  tier: 1
  headline: 武汉市中心医院眼科医生，新冠疫情“吹哨人”
  ids: { wikidata: Q84497471 }
  bio: >-
    武汉市中心医院眼科医生。2019 年 12 月 30 日，他在大学同学微信群转发“华南水果海鲜市场确诊了7例SARS”等信息，提醒同学和家人防范；2020 年 1 月 3 日被派出所训诫。他在接诊一名患者时感染新冠，2 月 7 日去世，年仅 34 岁，被许多人视为疫情“吹哨人”，网上随即出现要求言论自由的呼声。
    国家监委调查组 3 月 19 日认定派出所出具训诫书不当，武汉警方撤销训诫书并向家属道歉；4 月 2 日湖北省评定他为首批烈士。
  positions:
    - { title: 武汉市中心医院眼科主治医师, sys: other, place: 湖北, from: 2014, to: 2020-02, cite: b10-cdt-2020-01-31-caixin-li }
  life:
    - h: 早年
      from: 1985
      to: 2014
      text: >-
        1985 年 10 月出生，辽宁锦州人，满族，中共党员。财新记者记述，他因为不太喜欢熟人社会和人情世故，想去南方上大学，2004 年考入武汉大学临床医学七年制专业，毕业后先在厦门工作三年，2014 年回到武汉，进入武汉市中心医院，后任眼科主治医师。
      cites: [b10-xinhua-2020-04-02-martyrs, b10-cdt-2020-01-31-caixin-li]
    - h: 微信群里的提醒
      from: 2019-12
      to: 2019-12
      text: >-
        据国家监委调查组通报，2019 年 12 月 30 日 17 时 43 分，他以“李文亮 武汉 眼科”昵称在微信群“武汉大学临床04级”转发“华南水果海鲜市场确诊了7例SARS”等文字、一张检测报告图片和一段肺部 CT 视频，18 时 42 分又写道“大家不要外传，让家人亲人注意防范”。
        截图随即在网上流传；同一天下午和傍晚，武汉市卫健委在系统内下发的两份紧急通知也被人上传到网上。12 月 31 日医院领导找他谈话，他说转发未经核实的信息是为了提醒同学注意防范，医院让他写一份认识材料。同日 13 时 38 分，武汉市卫健委通报“已发现27例病例”，并称“到目前为止调查未发现明显人传人现象，未发现医务人员感染”。
      cites: [b10-xinhua-2020-03-19-li-report]
    - h: 训诫书
      from: 2020-01
      to: 2020-01
      text: >-
        2020 年 1 月 3 日，武昌分局中南路派出所民警与他谈话，制作笔录并出具训诫书。他后来对财新说，“不签的话怕不能脱身”，走完流程就签字走了。他对《纽约时报》说，警方“认为不能确定是SARS，认为我造谣，让我认识错误”，自己“觉得比较委屈，但是只能接受”。
        中央社报道，当时共有 8 人被警方通报为造谣，遭训诫处理。官方通报后来还披露，训诫书上签了当天并未参加谈话的值班民警的名字。
      cites: [b10-xinhua-2020-03-19-li-report, b10-cdt-2020-01-31-caixin-li, b10-nyt-2020-02-08-li-interview, b10-cna-2020-04-02-li-martyr]
    - h: 感染
      from: 2020-01
      to: 2020-02
      text: >-
        1 月 6 日他接诊一名 82 岁的眼病患者，对方次日发热，后确诊新冠。他 1 月 10 日开始发热，1 月 12 日住院，23 日转入重症监护室。官方通报说，医院 1 月 27 日才开始试运行核酸检测，两次检测中第二次呈阳性；财新则报道他自称是第三次检测阳性。
        1 月 30 日他实名接受财新采访，说：“我觉得一个健康的社会不该只有一种声音，不同意利用公权力过分干预。”
      cites: [b10-xinhua-2020-03-19-li-report, b10-cdt-2020-01-31-caixin-li]
    - h: 去世
      from: 2020-02
      to: 2020-02
      text: >-
        2 月 6 日晚他病情恶化，经插管、体外心肺复苏和 ECMO 等抢救，2 月 7 日凌晨 2 时 58 分宣告临床死亡，3 时 48 分医院发布消息。官方通报引组织抢救的医生说，“只要有一点希望我们就不愿放弃”，所以抢救了很长时间。BBC 引 CNN 的说法，他“死了两次”：官媒先报出死讯又删除，最后医院才证实。
        微博上“武汉政府欠李文亮医生一个道歉”和“我们要言论自由”等话题短暂流传后被删除；路透社指出有迹象显示涉及他死讯的言论遭到删查。
      cites: [b10-xinhua-2020-03-19-li-report, b10-bbc-2020-02-07-li-death]
    - h: 官方定性
      from: 2020-02
      to: 2020-04
      text: >-
        2 月 7 日国家监委派调查组赴武汉。3 月 19 日调查组通报认定“中南路派出所出具训诫书不当，执法程序不规范”，建议撤销训诫书、追究责任。武汉市公安局当晚宣布撤销训诫书，“并就此错误向当事人家属郑重道歉”，派出所副所长杨力被行政记过，民警胡桂芳被行政警告。
        3 月 4 日，国家卫健委等部门把他列为全国卫生健康系统疫情防控工作先进个人。4 月 2 日湖北省人民政府把他和另外 13 人评定为首批烈士，新华社称他“不顾个人被感染的风险，仍然坚守一线岗位”。中央社称此为“更改定性”。
      cites: [b10-xinhua-2020-03-19-li-report, b10-paper-2020-03-19-wuhan-police, b10-xinhua-2020-03-19-wuhan-police-discipline, b10-xinhua-2020-04-02-martyrs, b10-cna-2020-04-02-li-martyr]
  assess:
    - voice: official
      quote: true
      text: 属处置不当、适用法律错误、执法程序不规范
      cite: b10-paper-2020-03-19-wuhan-police
    - voice: official
      quote: true
      text: 表现出医者仁心、不惧危险、救死扶伤的优秀品质
      cite: b10-xinhua-2020-04-02-martyrs
    - voice: zh
      quote: true
      text: 李文亮“吹哨人”之举使他成为全国民众心目中的英雄
      cite: b10-bbc-2020-02-07-li-death
    - voice: zh
      quote: true
      text: 已逝的武漢中心醫院醫師李文亮因披露疫情而遭訓誡，被公眾視為「吹哨者」
      cite: b10-cna-2020-04-02-li-martyr
    - voice: witness
      quote: true
      text: 如果官方提前公布疫情信息我想会好很多
      cite: b10-nyt-2020-02-08-li-interview
  family:
    - name: 父母、妻子和孩子
      rel: 家属
      text: >-
        国家监委通报说，他去世当天医院领导探望了他的父母、妻子和孩子，并应妻子要求安排她和孩子休养；武汉市人社局认定他为工伤，已全额发放工亡补助金。
      cites: [b10-xinhua-2020-03-19-li-report]
  cites: [b10-xinhua-2020-03-19-li-report, b10-paper-2020-03-19-wuhan-police, b10-xinhua-2020-04-02-martyrs, b10-cdt-2020-01-31-caixin-li, b10-bbc-2020-02-07-li-death, wd-Q84497471]
