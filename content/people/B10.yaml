    - { date: 2020-11-02, text: 人民银行、银保监会、证监会、外汇局对他进行监管约谈, cite: b10-csrc-2020-11-02-ant-interview }
    - { date: 2020-11-03, text: 上海证券交易所决定蚂蚁集团暂缓上市, cite: b10-sse-2020-11-03-ant-ipo }
    - { date: 2021-04-10, text: 市场监管总局对阿里巴巴处以 182.28 亿元反垄断罚款, cite: b10-xinhua-2021-04-10-alibaba-fine }
    - { date: 2023-01-07, text: 蚂蚁集团调整股权结构，他不再是实际控制人, cite: b10-stcn-2023-01-07-ant-control }
  tier: 1
  headline: 阿里巴巴集团创始人
  ids: { wikidata: Q1137062 }
  bio: >-
    阿里巴巴集团创始人，英语教师出身，1999 年在杭州创办阿里巴巴，后来又创立淘宝和支付宝（蚂蚁集团），2019 年卸任董事局主席。2020 年 10 月 24 日他在外滩金融峰会上批评监管“用昨天的办法来管未来”，十天后蚂蚁集团的上市被上交所暂缓，此前四部门对他进行了监管约谈。
    阿里巴巴随后被处 182.28 亿元反垄断罚款，2023 年他交出蚂蚁的实际控制权。此后他长居日本、行踪低调，被视为民企处境的风向标；2025 年 2 月出席习近平主持的民营企业座谈会，2026 年重新频繁露面，并增持阿里股票支持其 AI 投入。
  positions:
    - { title: 杭州电子工业学院英语教师, sys: other, place: 浙江, from: 1988-08, to: 1995-06, cite: b10-wiki-ma-yun }
    - { title: 阿里巴巴集团首席执行官, sys: other, place: 浙江, from: 1999, to: 2013-05, cite: b10-wiki-ma-yun }
    - { title: 阿里巴巴集团董事局主席, sys: other, place: 浙江, from: 1999, to: 2019-09-10, cite: b10-wiki-ma-yun }
  life:
    - h: 英语教师
      from: 1964
      to: 1995
      text: >-
        1964 年 9 月 10 日生于杭州，祖籍浙江嵊州。前两次高考落榜，1984 年第三次参加高考，数学考了 89 分，才考上杭州师范学院外语系。1988 年毕业后分配到杭州电子工业学院教英语，1994 年调任外事办公室主任，1995 年 6 月辞职。
      cites: [b10-wiki-ma-yun, wd-Q1137062]
    - h: 阿里巴巴帝国
      from: 1999
      to: 2019
      text: >-
        1999 年正式辞去公职，创办阿里巴巴网站，开拓 B2B 电子商务；2003 年成立淘宝网，2004 年创立第三方支付平台支付宝。2011 年他在未获董事会通过的情况下终止支付宝与阿里巴巴的协议控制关系，以取得央行支付牌照，引起投资者不满。
        2013 年 5 月卸任集团首席执行官，2014 年起多次被列为中国首富。2017 年 1 月他在纽约与候任美国总统特朗普会谈约 40 分钟，双方谈到阿里巴巴如何通过中小企业对华贸易帮助美国创造 100 万个就业机会。2019 年 9 月 10 日卸任董事局主席，由张勇接任，2020 年 10 月 1 日卸任集团董事。
      cites: [b10-wiki-ma-yun]
    - h: 外滩讲话
      from: 2020-10
      to: 2020-10
      text: >-
        2020 年 10 月 24 日，蚂蚁集团在沪港两地上市前夕，他在第二届外滩金融峰会上演讲。他说“很多时候，把风险控制为零才是最大的风险”，又说现在“管的能力很强，监的能力不够”，“好的创新不怕监管，但是怕昨天的方式去监管”。
        他称中国的问题“是缺乏系统的风险”，把巴塞尔协议比作“老年人俱乐部”，并说“我们必须改掉金融的当铺思想，依靠信用体系”。
      cites: [b10-sina-2020-10-24-bund-speech]
    - h: 蚂蚁上市叫停
      from: 2020-11
      to: 2021-04
      text: >-
        11 月 2 日，人民银行、银保监会、证监会、外汇局对“蚂蚁集团实际控制人马云、董事长井贤栋、总裁胡晓明进行了监管约谈”。次日上交所以公司“实际控制人及董事长、总经理被有关部门联合进行监管约谈”、监管环境变化为由，决定原定 11 月 5 日的科创板上市暂缓。
        BBC 转述《华尔街日报》援引知情人士的说法：习近平本人对他的高调批评不满，“直接下令暂停蚂蚁上市”。2021 年 4 月 10 日，市场监管总局以“二选一”垄断行为对阿里巴巴处以 182.28 亿元罚款，相当于其 2019 年境内销售额的 4%。
      cites: [b10-csrc-2020-11-02-ant-interview, b10-sse-2020-11-03-ant-ipo, b10-bbc-2025-02-17-symposium, b10-xinhua-2021-04-10-alibaba-fine]
    - h: 隐退与交权
      from: 2021
      to: 2023
      text: >-
        此后他很少公开露面，BBC 称他“避走海外，长居日本，偶尔现身泰国”，有一年多没有公开踏足中国。2023 年 1 月蚂蚁集团调整股东结构，他的表决权由 53.46% 降至 6.208%，蚂蚁称此后“不再存在任何直接或间接股东单一或共同控制蚂蚁集团的情形”。
        同年 3 月 27 日他现身杭州，次日阿里巴巴宣布拆分为六大业务板块；5 月东京大学宣布聘他为东京学院客座教授。路透社称他留居海外是中国民营企业“时运倒转的象征”。
      cites: [b10-bbc-2025-02-17-symposium, b10-stcn-2023-01-07-ant-control, b10-voa-2023-05-01-ma-tokyo]
    - h: “过关”与再露面
      from: 2025
      to: 2026
      text: >-
        2025 年 2 月 17 日他出席习近平主持的民营企业座谈会。BBC 写道，会前社交媒体上“马云已过关”成为热点；分析人士白安儒认为，他“作为科技监管整顿的象征人物参会，极具政策转向意味”。
        2026 年 3 月 3 日，他与阿里巴巴、蚂蚁集团核心管理层到杭州云谷学校谈 AI 教育，说“AI时代已经快速到来，对社会的冲击超出想象”。8 月，彭博社援引知情人士报道，在阿里巴巴 800 亿港元增发期间，他买入逾 6 亿港元股票，以示支持公司的 AI 投入。
      cites: [b10-bbc-2025-02-17-symposium, b10-36kr-2026-03-03-ma-yungu, b10-bt-2026-08-25-ma-shares]
  assess:
    - voice: official
      quote: true
      text: 对蚂蚁集团实际控制人马云、董事长井贤栋、总裁胡晓明进行了监管约谈
