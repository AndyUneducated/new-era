# B10: outside the system — full biographies (tier 1)
- id: liu-xiaobo
  name: 刘晓波
  pinyin: Liú Xiǎobō
  gender: m
  born: 1955-12-28
  died: 2017-07-13
  birthplace: 吉林长春
  education:
    - { school: 吉林大学中文系, degree: 学士, from: 1977, to: 1982 }
    - { school: 北京师范大学中文系, degree: 硕士 }
    - { school: 北京师范大学中文系, degree: 博士, from: 1986 }
  roles: [dissent]
  status: dead
  statusNote: 服刑期间确诊肝癌晚期，2017 年 6 月保外就医，7 月 13 日在沈阳病逝。
  fall:
    - { date: 2008-12-08, text: 《零八宪章》发表前夕被刑事拘留, cite: b10-bbc-2017-07-13-liu-obit }
    - { date: 2009-06-23, text: 以涉嫌煽动颠覆国家政权罪被正式逮捕, cite: b10-bbc-2017-07-13-liu-obit }
    - { date: 2009-12-25, text: 北京市第一中级人民法院判处有期徒刑 11 年、剥夺政治权利 2 年, cite: b10-dw-2009-12-28-liu-verdict }
    - { date: 2017-06-26, text: 确诊肝癌，辽宁省监狱管理局批准保外就医, cite: b10-bbc-2017-07-13-liu-obit }
  tier: 1
  headline: 作家，《零八宪章》主要起草人，2010 年诺贝尔和平奖得主
  ids: { wikidata: Q41617 }
  bio: >-
    文学评论家，北京师范大学中文系前讲师。1989 年从美国回国参加天安门广场的抗议，此后多次被羁押、劳教。2008 年发起并起草《零八宪章》，2009 年 12 月被北京市第一中级人民法院以煽动颠覆国家政权罪判处有期徒刑 11 年。
    2010 年在狱中获诺贝尔和平奖，外交部称授奖“是对和平奖的亵渎”。2017 年确诊肝癌晚期后保外就医，7 月 13 日在沈阳病逝，终年 61 岁。官方始终称他是“因触犯中国法律而被判刑的罪犯”；挪威诺贝尔委员会则说中国政府对他的过早死亡“负有重大责任”。
  positions:
    - { title: 北京师范大学中文系讲师, sys: other, place: 北京, cite: b10-bbc-2017-07-13-liu-obit }
    - { title: 独立中文笔会主席, sys: other, from: 2003, to: 2007, cite: wd-Q41617 }
  life:
    - h: 早年与“黑马”
      from: 1955
      to: 1988
      text: >-
        1955 年 12 月 28 日生于吉林长春，当过知青和建筑工人。1977 至 1982 年在吉林大学中文系读本科，随后在北京师范大学读硕士并留校任教，1986 年在北师大攻读博士，多次到北欧和美国讲学。
        BBC 记述，他在 1980 年代中期“因对李泽厚的批判而名震文坛”，被称为“黑马”。他在 2009 年的法庭陈述中自称是“文革后恢复高考的第一届大学生”，“从学士到硕士再到博士，我的读书生涯是一帆风顺”。
      cites: [b10-bbc-2017-07-13-liu-obit, b10-bbc-2010-12-10-liu-final-statement]
    - h: 八九与三次失去自由
      from: 1989
      to: 1999
      text: >-
        1989 年他从美国回国参加八九民运，与侯德建、高新、周舵一起被称为“天安门四君子”。6 月 6 日以“反革命宣传煽动罪”被捕，9 月被开除公职，1991 年 1 月获释；后来的判决书记载他当时被“免予刑事处分”。
        此后他只能通过境外媒体发言，1995 年 5 月至 1996 年 1 月被监视居住，1996 年 9 月以“扰乱社会秩序”被劳动教养三年。他后来在法庭上说：“1989年6月是我生命的重大转折时刻。”
      cites: [b10-bbc-2017-07-13-liu-obit, b10-bbc-2010-12-10-liu-final-statement, b10-dw-2009-12-28-liu-verdict]
    - h: 《零八宪章》
      from: 2008
      to: 2009
      text: >-
        2008 年 9 月至 12 月，他与张祖桦等人起草《零八宪章》，提出“取消一党垄断执政特权”“在民主宪政的架构下建立中华联邦共和国”等主张，征集 300 余人签名后在境外网站发表。BBC 称宪章在 12 月 10 日世界人权日发表；判决书则记录境外网站 12 月 8 日、9 日已经刊出，并引公安统计称至 2009 年 12 月签名“共计10390人”。
        12 月 8 日他被刑事拘留，次日被监视居住，2009 年 6 月 23 日被正式逮捕。
      cites: [b10-dw-2009-12-28-liu-verdict, b10-bbc-2017-07-13-liu-obit]
    - h: 审判与《我没有敌人》
      from: 2009
      to: 2010
      text: >-
        2009 年 12 月 23 日北京市第一中级人民法院开庭，12 月 25 日宣判。判决书认定他以推翻“人民民主专政的国家政权和社会主义制度为目的”在互联网发表文章，其行为“显已超出言论自由的范畴”，判处有期徒刑 11 年、剥夺政治权利 2 年。
        他在庭上的最后陈述题为《我没有敌人》，说“所有监控过我，捉捕过我、审讯过我的警察，起诉过我的检察官，判决过我的法官，都不是我的敌人”，并期待自己是“中国绵绵不绝的文字狱的最后一个受害者”。2010 年 5 月 26 日起在辽宁服刑。
      cites: [b10-dw-2009-12-28-liu-verdict, b10-bbc-2010-12-10-liu-final-statement, b10-bbc-2017-07-13-liu-obit]
    - h: 诺贝尔和平奖
      from: 2010
      to: 2010
      text: >-
        2010 年 10 月 8 日，挪威诺贝尔委员会宣布授予他和平奖，表彰他“for his long and non-violent struggle for fundamental human rights in China”，并称他是《零八宪章》的主要作者之一。BBC 指出，他是首位居住在中国境内获诺贝尔奖的中华人民共和国公民。
        外交部发言人马朝旭当天说，他“是因触犯中国法律而被中国司法机关判处徒刑的罪犯”，授奖“完全违背了该奖项的宗旨”，也会给中挪关系带来损害。获奖后，妻子刘霞在没有任何罪名的情况下被软禁在家。
      cites: [b10-nobel-2010-10-08-press-release, b10-bbc-2017-07-13-liu-obit, b10-mfa-2010-10-08-liu-nobel, b10-bbc-2018-07-10-liu-xia]
    - h: 狱中病逝
      from: 2017
      to: 2017
      text: >-
        2017 年 6 月 26 日，辽宁省监狱管理局公布他确诊肝癌、获准保外就医；BBC 称他 5 月 23 日已被确诊为肝癌晚期。沈阳市司法局 7 月 13 日公告说，医院曾邀请“美、德权威肝癌治疗专家参加会诊”，他当晚“因多脏器功能衰竭，经抢救无效死亡”。
        外交部发言人耿爽次日称，处理刘晓波案“纯属中国内政，外国无权说三道四”。诺贝尔委员会主席贝安德森则说，他在病情进入晚期前没有被送往能获得适当治疗的机构，“中国政府对他的过早死亡负有重大责任”。
      cites: [b10-bbc-2017-07-13-liu-obit, e03-voa-2017-07-13-shenyang, b10-dw-2017-07-14-mfa-liu, e03-bbc-2017-07-13-liu-reactions]
  assess:
    - voice: doc
      quote: true
      text: 刘晓波的行为显已超出言论自由的范畴，构成犯罪
      cite: b10-dw-2009-12-28-liu-verdict
    - voice: official
      quote: true
      text: 刘晓波是因触犯中国法律而被中国司法机关判处徒刑的罪犯，其所作所为与诺贝尔和平奖的宗旨背道而驰
      cite: b10-mfa-2010-10-08-liu-nobel
    - voice: west
      quote: true
      text: for his long and non-violent struggle for fundamental human rights in China
      zh: 表彰他“在中国为基本人权进行的长期非暴力斗争”（挪威诺贝尔委员会授奖公告）
      cite: b10-nobel-2010-10-08-press-release
    - voice: zh
      quote: true
      text: 中国政府对他的过早死亡负有重大责任
      cite: e03-bbc-2017-07-13-liu-reactions
    - voice: witness
      quote: true
      text: 我没有敌人，也没有仇恨
      cite: b10-bbc-2010-12-10-liu-final-statement
  family:
    - name: 刘霞
      rel: 妻子
      text: >-
        诗人、摄影师和画家。刘晓波在最后陈述中写她“你在无形的心狱中等待”。他获奖后她在没有任何罪名的情况下被软禁八年，2018 年 7 月 10 日获准经赫尔辛基飞抵柏林；外交部发言人华春莹称她是“按照其本人意愿前往德国接受治疗”。其弟刘晖 2013 年被以欺诈罪判刑 11 年，未能同行。
      cites: [b10-bbc-2018-07-10-liu-xia, b10-bbc-2010-12-10-liu-final-statement]
  cites: [b10-dw-2009-12-28-liu-verdict, b10-mfa-2010-10-08-liu-nobel, b10-dw-2017-07-14-mfa-liu, e03-bbc-2017-07-13-liu-reactions, b10-bbc-2017-07-13-liu-obit, e03-voa-2017-07-13-shenyang, wd-Q41617]

- id: xu-zhiyong
  name: 许志永
  pinyin: Xǔ Zhìyǒng
  gender: m
  born: 1973-03-02
  birthplace: 河南民权
  education:
    - { school: 兰州大学法律系, degree: 学士, from: 1990 }
    - { school: 北京大学法学院, degree: 博士, from: 1999, to: 2002 }
  roles: [dissent, scholar]
  status: detained
  statusNote: 2023 年以颠覆国家政权罪被判有期徒刑 14 年，二审维持；据中央社报道须服刑至 2034 年 2 月。
  fall:
    - { date: 2013-07-16, text: 以涉嫌聚众扰乱公共场所秩序罪被刑事拘留, cite: b10-court-2014-01-26-xu-verdict }
    - { date: 2014-01-26, text: 北京市第一中级人民法院判处有期徒刑四年, cite: b10-court-2014-01-26-xu-verdict }
    - { date: 2020-02-15, text: 逃亡数月后在广州被警方带走, cite: b10-voa-2023-04-10-xu-ding }
    - { date: 2023-04-10, text: 据维权网与家属消息，以颠覆国家政权罪被判有期徒刑 14 年, cite: c04-bbc-2023-04-10-ding-jiaxi }
    - { date: 2023-11-24, text: 二审驳回上诉、维持原判, cite: b10-cna-2023-11-24-xu-appeal }
  tier: 1
  headline: 法学博士，新公民运动发起人
  ids: { wikidata: Q3571070 }
  bio: >-
    北京大学法学博士、北京邮电大学前讲师。2003 年孙志刚案后与另两名法学博士联名上书，推动废除收容遣送制度，同年当选北京市海淀区人大代表。他参与创办的“阳光宪政”和公盟为上访者等提供法律援助，2010 年后倡导以“自由、公义、爱”为主旨的新公民运动，推动教育平权和官员财产公示。
    2014 年以聚众扰乱公共场所秩序罪被判刑四年；2020 年在逃亡中发表致习近平的《劝退书》后被捕，2023 年 4 月以颠覆国家政权罪被判有期徒刑 14 年。审判不公开，官方未公布判决，刑期由维权网和家属披露。
  positions:
    - { title: 北京邮电大学文法学院讲师, sys: other, place: 北京, from: 2002, cite: b10-wiki-xu-zhiyong }
    - { title: 北京市海淀区人大代表, sys: gov, place: 北京, from: 2003-11, cite: b10-wiki-xu-zhiyong }
  life:
    - h: 求学
      from: 1973
      to: 2002
      text: >-
        1973 年 3 月 2 日生于河南民权县。1990 年入兰州大学法律系，获法学学士学位；1995 年回兰大攻读硕士，毕业论文批评法学家朱苏力，未能拿到硕士学位。1998 年至 1999 年在《南方周末》等单位实习，1999 年考入北京大学法学院，反而师从朱苏力，2002 年获法学博士学位，此后在北京邮电大学文法学院任讲师。
      cites: [b10-wiki-xu-zhiyong, b10-court-2014-01-26-xu-verdict]
    - h: 孙志刚案与公盟
      from: 2003
      to: 2009
      text: >-
        2003 年大学生孙志刚在广州收容站被殴打致死，他与俞江、滕彪三名法学博士联名上书全国人大常委会，要求审查《城市流浪乞讨人员收容遣送办法》，对该办法的废止起到推动作用。同年他与滕彪等人创办“阳光宪政社会科学研究中心”，11 月当选海淀区人大代表，2006 年连任。
        2005 年机构改名公盟，为上访者、三聚氰胺奶粉受害者提供法律援助。2009 年 7 月公盟被取缔，他以“偷税罪”被捕，后取保候审。
      cites: [b10-wiki-xu-zhiyong, c04-bbc-2023-04-10-ding-jiaxi]
    - h: 新公民运动
      from: 2010
      to: 2013
      text: >-
        2010 年公盟改名“公民”，倡导以“自由，公义，爱”为主旨的新公民精神，被称为新公民运动。参与者组织集会，呼吁官员财产公开，并为随迁子女争取就地高考的“教育平权”。
        他在法庭陈述中解释，新公民运动“倡导每个中国人堂堂正正做公民，把公民的身份当真”，并说“我们是新时代的公民，理念上，彻底告别了敌人、江山、推翻、打倒的专制意识”。2013 年 4 月他在赴港参加孙志刚案十周年研讨会前被限制人身自由，7 月 16 日被刑事拘留。
      cites: [b10-wiki-xu-zhiyong, b10-rfi-2014-01-22-xu-statement, b10-bbc-2014-01-26-xu-verdict]
    - h: 第一次入狱
      from: 2013
      to: 2017
      text: >-
        2014 年 1 月 22 日北京市第一中级人民法院开庭，26 日判决认定他构成聚众扰乱公共场所秩序罪，判处有期徒刑四年，刑期自 2013 年 7 月 16 日起算。法院公告称庭审和宣判“公开”进行，他的亲属旁听。
        他准备的最后陈述说，指控“实际上，这是你们是否把公民的宪法权利当真的问题”。他在陈述中说，推动教育平权、随迁子女就地高考、呼吁官员财产公示，“倡导大家堂堂正正做公民，在这荒诞的后极权社会，成了我的三大罪状”。BBC 报道，国际特赦组织称判决“可恥”。2017 年 7 月 15 日他刑满出狱。
      cites: [b10-court-2014-01-26-xu-verdict, b10-rfi-2014-01-22-xu-statement, b10-bbc-2014-01-26-xu-verdict, b10-wiki-xu-zhiyong]
    - h: 厦门聚会与《劝退书》
      from: 2019
      to: 2020
      text: >-
        2019 年 12 月，他与丁家喜等二十多名维权律师和朋友在厦门聚会，当局随后大举抓捕，官方称“厦门聚会案”。他在中国南方流亡数月，2020 年初发表致习近平的公开信《劝退书》，BBC 概括其内容为“文中指习近平不是政治家，无能力处理重大危机，劝其让位”。
        2 月 15 日他在广州被警方带走。女友李翘楚此后披露，他在羁押中曾被限制饮食，“每餐只有一个馒头”；BBC 称未能核实这些说法。
      cites: [b10-voa-2023-04-10-xu-ding, c04-bbc-2023-04-10-ding-jiaxi]
    - h: 十四年
      from: 2021
      to: 2023
      text: >-
        2021 年初，他和丁家喜的“煽动颠覆国家政权”案被拆分，罪名升级为“颠覆国家政权”。2022 年 6 月，山东临沂市临沭县法院不公开审理此案。2023 年 4 月 10 日，据维权网报道并经丁家喜妻子罗胜春向 BBC 确认，他被判有期徒刑 14 年、剥夺政治权利 8 年，丁家喜被判 12 年；美国之音称审判闭门进行，“被指充满程序问题和虐待嫌疑人”。
        法院没有公开判决书。同年 11 月 24 日二审驳回上诉、维持原判，中央社报道他当庭斥判决荒谬。
      cites: [c04-bbc-2023-04-10-ding-jiaxi, b10-voa-2023-04-10-xu-ding, b10-cna-2023-11-24-xu-appeal]
  assess:
    - voice: doc
      quote: true
      text: 认定许志永构成聚众扰乱公共场所秩序罪，依法判处许志永有期徒刑四年
      cite: b10-court-2014-01-26-xu-verdict
    - voice: zh
      quote: true
      text: 中國當局再次選擇以恐怖治國而不是以法治國
      cite: b10-bbc-2014-01-26-xu-verdict
    - voice: zh
      quote: true
      text: 两人的审判皆为闭门进行，被指充满程序问题和虐待嫌疑人
      cite: b10-voa-2023-04-10-xu-ding
    - voice: witness
      quote: true
      text: 你们试图打压新公民运动，阻碍中国和平改良的民主宪政之路
      cite: b10-rfi-2014-01-22-xu-statement
  family:
    - name: 李翘楚
      rel: 女友
      text: >-
        劳工维权人士。许志永 2020 年被捕后她一度被带走、监视居住，获释后公开披露他在羁押中遭受的待遇；2022 年 3 月她本人也以涉嫌煽动颠覆国家政权罪被起诉。
      cites: [c04-bbc-2023-04-10-ding-jiaxi, b10-wiki-xu-zhiyong]
  cites: [b10-court-2014-01-26-xu-verdict, c04-bbc-2023-04-10-ding-jiaxi, b10-voa-2023-04-10-xu-ding, b10-wiki-xu-zhiyong, b10-rfi-2014-01-22-xu-statement, wd-Q3571070]

