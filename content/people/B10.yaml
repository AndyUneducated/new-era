  cites: [b10-sina-2020-10-24-bund-speech, b10-csrc-2020-11-02-ant-interview, b10-sse-2020-11-03-ant-ipo, b10-xinhua-2021-04-10-alibaba-fine, b10-stcn-2023-01-07-ant-control, b10-bbc-2025-02-17-symposium, b10-bt-2026-08-25-ma-shares, b10-wiki-ma-yun, wd-Q1137062]

- id: ren-zhiqiang
  name: 任志强
  pinyin: Rèn Zhìqiáng
  aka: [任大炮]
  gender: m
  born: 1951-03-08
  origin: 山东
  roles: [biz, dissent]
  status: detained
  statusNote: 2020 年 9 月被判有期徒刑 18 年，当庭表示不上诉。
  fall:
    - { date: 2016-05, text: 因微博言论被给予留党察看一年处分, cite: b10-voa-2020-09-22-ren }
    - { date: 2020-03-12, text: 一篇署名任志强的批评文章流传后失联, cite: b10-bbc-2020-04-07-ren-probe }
    - { date: 2020-04-07, text: 西城区纪委监委通报其接受纪律审查和监察调查, cite: b10-bbc-2020-04-07-ren-probe }
    - { date: 2020-07-23, text: 被开除党籍，涉嫌犯罪问题移送检察机关, cite: b10-bjjw-2020-07-23-ren-expelled }
    - { date: 2020-09-22, text: 北京市第二中级人民法院以四项罪名判处有期徒刑十八年, cite: b10-bjjw-2020-09-22-ren-verdict }
  tier: 1
  headline: 北京华远集团原董事长，“任大炮”
  ids: { wikidata: Q9028218 }
  bio: >-
    北京市华远集团原董事长，前商业部副部长任泉生之子，被视为典型的“红二代”。他在微博上以敢言著称，绰号“任大炮”，2016 年因质疑“央视姓党”被关闭微博、留党察看一年。
    2020 年 2 月，一篇署名任志强、批评当局抗疫失职的长文在网上流传，文中把领导人形容为“剥光了衣服也要坚持当皇帝的小丑”；3 月 12 日起他失联。7 月他被开除党籍，9 月被北京市第二中级人民法院以贪污、受贿、挪用公款、国有公司人员滥用职权四罪判处有期徒刑 18 年。官方的定性是经济犯罪，他的友人称这是“政治迫害”。
  positions:
    - { title: 北京市华远集团董事长, sys: other, place: 北京, to: 2011-04, cite: b10-voa-2020-09-22-ren }
  life:
    - h: 红二代与华远
      from: 1951
      to: 2014
      text: >-
        1951 年 3 月生，籍贯山东，父亲任泉生曾任商业部副部长。他长期执掌北京国有企业华远集团，做房地产生意致富，曾当选北京市西城区人大代表和北京市政协委员。2011 年 4 月他被上级免去华远集团董事长职务，但仍担任旗下地产上市公司董事长，三年后才在微博宣布正式退休。美国之音引述评论称，他集“红二代”、地产富豪、权贵密友和公共知识分子四重身份于一身。
      cites: [b10-voa-2020-09-22-ren, e04-bbc-2020-09-22-ren-zhiqiang]
    - h: “任大炮”
      from: 2010
      to: 2016
      text: >-
        微博兴起后他成为拥有大量粉丝的“大V”。2016 年 2 月习近平视察中央电视台，央视打出“央视姓党，绝对忠诚，请您检阅”的标语，他在微博质疑“官媒姓党”，写道“当所有的媒体有了姓，并且不代表人民的利益时，人民就被抛弃到被遗忘的角落了”。
        《纽约时报》概括说，他因为宣称中国的新闻媒体应该为人民而不是为党服务，“违背了习近平的高调讲话而受到审查”。2 月 28 日国家网信办责令关闭他的微博账号，指其“持续公开发布违法信息”；三个月后，西城区委以他“多次在微博、博客等网络平台和其他公开场合公开发表违背四项基本原则、违背党的路线方针政策等方面的错误言论”为由，给予他留党察看一年处分。
      cites: [e04-bbc-2020-09-22-ren-zhiqiang, b10-voa-2020-09-22-ren, b10-nyt-2020-03-16-ren]
    - h: “剥光了衣服的小丑”
      from: 2020-02
      to: 2020-03
      text: >-
        2020 年 2 月 23 日习近平召开疫情防控和经济发展工作部署会议后，一篇署名任志强、超过 8500 字的长文在网上流传，批评当局抗疫失职，认为钳制言论导致疫情暴发。文中最常被引用的一句说，那里站着的“不是一位皇帝在展示自己的新衣，而是一位剥光了衣服也要坚持当皇帝的小丑”。德国之声称这篇文章“据信”出自他手。文章开头还说，四年前他批评“央视姓党”后遭到“十日文革”式的全网大批判，因此每年 2 月 19 日他都“堅決的放下手中的筆”。
        3 月 12 日晚起朋友已联系不上他，企业家王瑛对路透社说：“我们很多朋友都在找他。”
      cites: [b10-dw-2020-03-13-ren-missing, b10-bbc-2020-04-07-ren-probe, b10-rti-2020-03-09-ren]
    - h: 开除党籍
      from: 2020-04
      to: 2020-07
      text: >-
        4 月 7 日，西城区纪委监委通报他“涉嫌严重违纪违法”接受审查调查，BBC 引知情人士称他的儿子也被带走调查。7 月 23 日纪委通报开除他的党籍，所列问题首先是“公开发表反对四项基本原则的文章，丑化党和国家形象，歪曲党史、军史”，还包括违规公款吃喝、持有公款购买的高尔夫球卡，以及“家风败坏，家教不严，伙同子女大肆敛财”，并将其涉嫌犯罪问题移送检察机关。
      cites: [b10-bbc-2020-04-07-ren-probe, b10-bjjw-2020-07-23-ren-expelled]
    - h: 十八年
      from: 2020-09
      to: 2020-09
      text: >-
        9 月 11 日北京市第二中级人民法院开庭。法院称公开审理，美国之音则报道只有“特别邀请的人”才能旁听。9 月 22 日宣判：法院认定他 2003 至 2017 年间贪污公款 4974 万余元、受贿 125 万余元、挪用公款 6120 万元，滥用职权致国有控股企业损失 1.167 亿余元；鉴于他“自愿如实供述自己的全部罪行”，数罪并罚判处有期徒刑十八年，并处罚金 420 万元。法院称他当庭表示服从判决、不上诉。
        这一年他 69 岁。官方通报只谈贪污、受贿等经济罪行，没有提到那篇网文；BBC 报道，他的友人认为对他的处理是政治迫害。
      cites: [b10-bjjw-2020-09-22-ren-verdict, b10-voa-2020-09-22-ren, e04-bbc-2020-09-22-ren-zhiqiang]
  assess:
    - voice: official
      quote: true
      text: 在重大原则问题上不同党中央保持一致，公开发表反对四项基本原则的文章
      cite: b10-bjjw-2020-07-23-ren-expelled
    - voice: official
      quote: true
      text: 被告人任志强的行为分别构成贪污罪、受贿罪、挪用公款罪、国有公司人员滥用职权罪
      cite: b10-bjjw-2020-09-22-ren-verdict
    - voice: zh
      quote: true
      text: 他的友人曾表示，中共对任志强的处理是“政治迫害”
      cite: e04-bbc-2020-09-22-ren-zhiqiang
    - voice: zh
      quote: true
      text: 他的言论提供了一个窗口，让人们看到中国知识分子和企业家对习近平日益专制的统治不断增长的失望情绪
      cite: b10-nyt-2020-03-16-ren
    - voice: zh
      quote: true
      text: 任志强集四重身份于一身，分别是红二代、亿万富豪的地产商、中共权贵密友，以及公共知识分子
      cite: b10-voa-2020-09-22-ren
  family:
    - name: 任泉生
      rel: 父亲
      text: 曾任商业部副部长，任志强因此被视为“红二代”。
      cites: [b10-voa-2020-09-22-ren]
    - name: 任志强之子
      rel: 儿子
      text: >-
        BBC 引知情人士称，2020 年 4 月任志强接受调查时他的儿子也被带走调查；纪委通报指任志强“伙同子女大肆敛财”。
      cites: [b10-bbc-2020-04-07-ren-probe, b10-bjjw-2020-07-23-ren-expelled]
  cites: [b10-bjjw-2020-07-23-ren-expelled, b10-bjjw-2020-09-22-ren-verdict, b10-dw-2020-03-13-ren-missing, e04-bbc-2020-09-22-ren-zhiqiang, b10-nyt-2020-03-16-ren, b10-voa-2020-09-22-ren, wd-Q9028218]

- id: li-zhiying
  name: 黎智英
  pinyin: Lí Zhìyīng
  aka: [Jimmy Lai, 肥佬黎]
  gender: m
  born: 1947-12-08
  birthplace: 广东广州
  roles: [hkmt, biz, dissent]
  status: detained
  statusNote: 2026 年 2 月依《香港国安法》被判监禁 20 年，没有上诉；欺诈罪定罪撤销后，据 BBC 须服刑至 2040 年。
  fall:
