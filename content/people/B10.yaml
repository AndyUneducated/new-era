    - { date: 2026-02-09, text: 被判监禁 20 年, cite: b10-hkgov-2026-02-09-lai-sentence }
  tier: 1
  headline: 壹传媒、《苹果日报》创办人
  ids: { wikidata: Q1447095 }
  bio: >-
    香港企业家，佐丹奴、壹传媒和《苹果日报》创办人。十二岁从内地偷渡到香港做童工，1981 年创立服装品牌佐丹奴；1989 年六四事件后转投传媒，1990 年创办《壹周刊》，1995 年创办《苹果日报》，长期支持香港民主派。
    2020 年 8 月依《香港国安法》被捕，《苹果日报》2021 年 6 月停刊。2025 年 12 月 15 日他被裁定两项串谋勾结外国势力罪和一项串谋发布煽动刊物罪成立，2026 年 2 月 9 日被判监禁 20 年。特区政府称他“罪行滔天”；英国政府称这是出于政治动机的起诉，人权观察说刑期“实际上等同于死刑”。
  positions:
    - { title: 佐丹奴创办人, sys: other, place: 香港, from: 1981, cite: b10-wiki-li-zhiying }
    - { title: 壹传媒集团创办人, sys: other, place: 香港, from: 1990, cite: b10-wiki-li-zhiying }
    - { title: 《苹果日报》创办人, sys: other, place: 香港, from: 1995-06-20, to: 2021-06-24, cite: e04-bbc-2021-06-24-apple-daily }
  life:
    - h: 偷渡客与佐丹奴
      from: 1947
      to: 1988
      text: >-
        1947 年 12 月 8 日生于广州，童年在内地度过。中央社据纪录片报道，他在火车站帮人搬行李时，一位来自香港的男人给了他巧克力，他觉得香港是天堂，决定偷渡，“那時他只有12歲”。维基百科记载，他 1960 年只身经澳门偷渡到香港，在深水埗手套厂当杂工，月薪 60 港元，后来在假发厂当小职员、做过销售经理，1981 年创立连锁服装品牌佐丹奴。
      cites: [b10-cna-2023-04-21-lai-doc, b10-wiki-li-zhiying, wd-Q1447095]
    - h: 六四与壹传媒
      from: 1989
      to: 2014
      text: >-
        他说六四事件对他影响深远，“没有六四就没有《壹周刊》和《苹果日报》”。1989 年佐丹奴印制大量民运 T 恤，1994 年他在《壹周刊》发表痛骂李鹏的公开信，自称此后佐丹奴在内地遭封杀，被迫出售股份；维基百科引佐丹奴年报指出，其内地门店在 1994、1995 年仍快速增长，无法证实封杀之说。
        1990 年他创办壹传媒和《壹周刊》，1995 年 6 月 20 日创办《苹果日报》，2001 年进军台湾。他后来在庭上说，六四后创办传媒是想传递自由的讯息，“越知情越自由”。
      cites: [b10-wiki-li-zhiying, e04-bbc-2021-06-24-apple-daily, b10-voa-2024-11-20-lai-testimony]
    - h: 《苹果》与民主派
      from: 1995
      to: 2020
      text: >-
        《苹果日报》的创刊社论《我们属于香港》是他唯一写过的社论，辩方在庭上引述其中一句：“在资讯透明的今日，人民选择自由的威力比任何力量都要强大”。他在法庭上把《苹果》形容为拥护民主、自由和法治的反对派报纸，反对暴力和港独，并说“我认为主张港独是阴谋，令你跌入陷阱之中”。
        2019 年反修例运动爆发，他说：“我們要為最後一根稻草而戰，我們要奮戰，否則我們會失去自由，失去所有。”
      cites: [b10-voa-2024-11-20-lai-testimony, b10-bbc-2025-12-15-lai-profile, b10-zaobao-2024-11-20-lai-testimony, b10-cna-2023-04-21-lai-doc]
    - h: 被捕与停刊
      from: 2020
      to: 2021
      text: >-
        2020 年 8 月 10 日，警方以涉嫌勾结外国或者境外势力危害国家安全等罪名在家中拘捕他，并搜查《苹果日报》总部。12 月 3 日他因欺诈案被拒绝保释，此后一直羁押，同月被加控勾结外国势力罪，成为首名被控此罪的人。《人民日报》称他是“祸港四人帮”之首，无国界记者则授予他年度新闻自由奖。
        报社资产和银行账户被冻结后，《苹果日报》于 2021 年 6 月 24 日最后一次出版，“终年”26 年又四日。
      cites: [b10-wiki-li-zhiying, b10-bbc-2026-02-09-jimmy-lai, e04-bbc-2021-06-24-apple-daily]
    - h: 国安法审判
      from: 2023
      to: 2025
      text: >-
        审讯 2023 年 12 月开始，由三名国安法指定法官审理，历时 156 日。2024 年 11 月他首次出庭作供，承认曾向英国组织“香港监察”和美国智库捐款，但被问到是否试图通过海外联系人影响外国对华政策时回答“从未”。
        2025 年 12 月 15 日法庭裁定他三项罪名成立。特区政府新闻公报转述法庭的裁断：不论国安法实施前后，他的“唯一意圖就是，即使要犧牲中國和香港特區人民的利益，也要謀求中國共產黨倒台”，他是各项串谋的首脑。
      cites: [b10-bbc-2025-12-15-lai-profile, b10-zaobao-2024-11-20-lai-testimony, b10-hkgov-2025-12-15-lai-verdict]
    - h: 二十年
      from: 2026
      to: 2026
      text: >-
        2026 年 2 月 9 日，法庭认定他是各项串谋的“幕后主脑和推动者”，提高量刑起点，扣减高龄、健康和单独囚禁等因素后判监禁 20 年；八名同案被告判 6 年 3 个月至 10 年，三家公司各罚款 3,004,500 港元。行政长官李家超称判决“彰顯法治，伸張正義，大快人心”。
        2 月 26 日上诉庭撤销他 2022 年的欺诈罪定罪，他仍须服刑至 2040 年；3 月 6 日他的律师确认不会上诉。9 月底美国总统特朗普说曾与习近平讨论释放他，此前曾转述习近平称此案是“tough one for him to do”。
      cites: [b10-bbc-2026-02-09-jimmy-lai, b10-hkgov-2026-02-09-lai-sentence, b10-bbc-2026-02-26-lai-fraud, b10-hkfp-2026-03-06-lai-no-appeal, b10-independent-2026-10-01-lai-trump]
  assess:
    - voice: official
      quote: true
      text: 黎智英是三項控罪所指的串謀的首腦，他的所作所為顯示他意圖實施該等串謀，對中國和香港特區的國家安全構成威脅和傷害
      cite: b10-hkgov-2025-12-15-lai-verdict
    - voice: official
      quote: true
      text: 黎智英長期利用《蘋果日報》荼毒市民、煽動仇恨、歪曲事實、蓄意製造社會對立、美化暴力
      cite: b10-hkgov-2026-02-09-lai-sentence
    - voice: zh
      quote: true
      text: 实际上等同于死刑，如此严厉的判决既残酷又极不公正
      cite: b10-bbc-2026-02-09-jimmy-lai
    - voice: zh
      quote: true
      text: 案件属出于政治动机的起诉
      cite: b10-bbc-2026-02-09-jimmy-lai
    - voice: witness
      quote: true
      text: 如果我繼續賺錢，對我沒有任何意義，但如果我投身傳媒行業，然後提供資訊，這就是選擇，選擇就是自由
      cite: b10-cna-2023-04-21-lai-doc
  family:
    - name: 李韵琴
      rel: 妻子
      text: 原为《南华早报》记者，与黎智英同为天主教徒，两人育有三个孩子。
      cites: [b10-wiki-li-zhiying]
    - name: 黎采
      rel: 女儿
      text: 2026 年 2 月判刑后，她说过去五年看到父亲的健康状况急剧恶化，若刑期执行，他将“在狱中殉难而死”。
      cites: [b10-bbc-2026-02-09-jimmy-lai]
  cites: [b10-hkgov-2025-12-15-lai-verdict, b10-hkgov-2026-02-09-lai-sentence, b10-bbc-2026-02-09-jimmy-lai, b10-bbc-2025-12-15-lai-profile, e04-bbc-2021-06-24-apple-daily, b10-wiki-li-zhiying, wd-Q1447095]

- id: lin-zheng-yuee
  name: 林郑月娥
  pinyin: Lín Zhèng Yuè'é
  aka: [Carrie Lam]
  gender: f
  born: 1957-05-13
  birthplace: 香港
  education:
    - { school: 香港大学, to: 1980 }
  roles: [hkmt]
  status: retired
  statusNote: 2022 年 6 月 30 日卸任行政长官，结束 42 年政府生涯，此后未任公职。
  tier: 1
  headline: 香港特别行政区第五任行政长官（2017–2022）
  ids: { wikidata: Q19217 }
  bio: >-
    香港特区第五任行政长官（2017–2022），回归后首位女性特首。1980 年港大毕业后加入香港政府，历任社会福利署署长、发展局局长，2012 年任政务司司长。2019 年她推动修订《逃犯条例》，引发持续数月的大规模抗议和警民冲突；9 月一段闭门会面录音流出，她在录音中说如有选择“第一件要做的事就是辞职”，次日公开否认曾向中央请辞，随后宣布撤回修例。
    2020 年她因推动《香港国安法》被美国制裁，2022 年 6 月卸任，此后以前特首身份从事青少年交流等活动。
  positions:
    - { title: 社会福利署署长, sys: gov, place: 香港, from: 2000, cite: b10-gov-2017-03-26-lam-elected }
    - { title: 发展局局长, sys: gov, place: 香港, from: 2007-07-01, to: 2012-06-30, cite: wd-Q19217 }
    - { title: 政务司司长, sys: gov, place: 香港, from: 2012-07-01, to: 2017-01-16, cite: wd-Q19217 }
    - { title: 香港特别行政区行政长官, sys: gov, place: 香港, from: 2017-07-01, to: 2022-06-30, cite: wd-Q19217 }
  life:
    - h: 政务官
      from: 1957
      to: 2012
      text: >-
        1957 年 5 月 13 日生于香港。新华社介绍，她 1980 年从香港大学毕业后加入香港政府；2000 年起先后担任社会福利署署长、房屋及规划地政局常任秘书长、驻伦敦经济贸易办事处处长、民政事务局常任秘书长，2007 年 7 月出任发展局局长。她与丈夫林兆波育有两个儿子。
      cites: [b10-gov-2017-03-26-lam-elected, b10-voa-2017-03-01-ce-candidates, wd-Q19217]
    - h: 政务司司长与当选
      from: 2012
      to: 2017
      text: >-
        2012 年 7 月出任政务司司长，2016 年 7 月获特区政府颁授大紫荆勋章。2017 年 1 月 16 日宣布参选，3 月 26 日在近 1200 名选举委员会委员中获 777 票，曾俊华得 365 票、胡国兴得 21 票，她成为香港回归后首位女性行政长官人选。新华社报道，她当选后表示将竭尽所能维护“一国两制”，坚守香港的核心价值；7 月 1 日就职。
      cites: [b10-gov-2017-03-26-lam-elected, b10-voa-2017-03-01-ce-candidates]
    - h: 修例风波
      from: 2019-02
      to: 2019-08
      text: >-
        2019 年特区政府提出修订《逃犯条例》，引发 6 月起一连串大型游行和警民冲突。她自己在 9 月的讲话中说，6 月 15 日已宣布暂缓条例草案，之后表明修例工作已完全停止，草案将在 2020 年 7 月自动失效；BBC 指她曾以“寿终正寝”形容修例工作，但几个月来一直拒绝撤回。示威者提出“五大诉求”，包括撤回修例、释放被捕者、成立独立调查委员会调查警民冲突、撤回“暴动”定性和实行“双普选”。
      cites: [b10-hkgov-2019-09-04-lam-address, b10-bbc-2019-09-04-withdraw]
    - h: “我会辞职”录音
      from: 2019-08
      to: 2019-09
      text: >-
        8 月底她与商界人士两次闭门会面。路透社 9 月 2 日公布录音，她用英语说“If I have a choice, the first thing is to quit, having made a deep apology”，并称特首给香港造成如此巨大的破坏“unforgivable”；又说特首“has to serve two masters by constitution”，即中央人民政府和香港市民，政治空间“very, very, very limited”。
        9 月 3 日她说公开私人聚会的讲话“非常不適當”，并称“由開始到現在，我並沒有向中央提出請辭”。BBC 引述的评论员林和立认为是她或政府内部故意让录音流出，以回应外界对她“恋栈权力”的批评。
      cites: [b10-reuters-2019-09-02-lam-audio, b10-bt-2019-09-03-lam-transcript, b10-hkgov-2019-09-03-lam-presser, b10-bbc-2019-09-03-lam-denies]
    - h: 撤回与制裁
      from: 2019-09
      to: 2020
      text: >-
        9 月 4 日她发表电视讲话，宣布政府会“正式撤回條例草案”，但拒绝另设独立调查委员会，坚持交由监警会处理，并提出“四項行動”，希望“以對話代替對立”。BBC 引述建制派议员田北辰的话说，撤回来得太迟，社会焦点已不在此。
        2020 年 8 月 7 日，美国宣布制裁她等 11 名中港官员，指她在修例和推动《香港国安法》中扮演关键角色，“施行北京打压自由和民主程序的政策”；她回应说在美国没有资产，“不发签证就不去”。
      cites: [b10-hkgov-2019-09-04-lam-address, b10-bbc-2019-09-04-withdraw, b10-bbc-2020-08-07-lam-sanction]
    - h: 不再连任
      from: 2022
      to: 2026
      text: >-
        2022 年 4 月 4 日，她在抗疫记者会上宣布不参加第六届行政长官选举，说不寻求连任的意愿早在 2021 年初已向中央表达，“得到中央理解和尊重”；她说自己上任不到两年就因“修例风波”、外部势力干预和疫情“承受前所未有的巨大壓力”。6 月 30 日卸任。
        11 月她对《联合早报》说，新角色“这个就是家庭主妇”，希望到内地重点大学讲“一国两制”。2026 年 7 月她率港澳青年到浙江参访，与宇树科技王兴兴等交流。
      cites: [b10-hkgov-2022-04-04-not-run, b10-zaobao-2022-11-10-lam-retire, b10-udn-2026-07-06-lam-youth]
  assess:
    - voice: official
      quote: true
      text: 林郑月娥成为香港回归后首位女性行政长官人选
      cite: b10-gov-2017-03-26-lam-elected
    - voice: official
      quote: true
      text: 我仍然認為我可以帶領我的團隊幫香港走出這困局
      cite: b10-hkgov-2019-09-03-lam-presser
    - voice: west
      quote: true
      text: For a chief executive to have caused this huge havoc to Hong Kong is unforgivable
      zh: 一个行政长官给香港造成如此巨大的破坏，是不可原谅的（路透社取得的闭门会面录音）
      cite: b10-reuters-2019-09-02-lam-audio
    - voice: zh
      quote: true
      text: 过去已经多次有媒体报道指林郑月娥希望辞职，但被北京拒绝，因此录音没有新鲜内容
      cite: b10-bbc-2019-09-03-lam-denies
  family:
    - name: 林兆波
      rel: 丈夫
      text: 两人育有两个儿子。她卸任后说想“做回我丈夫的太太，两个孩子的妈妈”。
      cites: [b10-voa-2017-03-01-ce-candidates, b10-zaobao-2022-11-10-lam-retire]
  cites: [b10-gov-2017-03-26-lam-elected, b10-hkgov-2019-09-03-lam-presser, b10-reuters-2019-09-02-lam-audio, b10-bbc-2019-09-03-lam-denies, b10-hkgov-2019-09-04-lam-address, b10-bbc-2020-08-07-lam-sanction, b10-hkgov-2022-04-04-not-run, wd-Q19217]

- id: ai-weiwei
  name: 艾未未
  pinyin: Ài Wèiwèi
  gender: m
  born: 1957-05-18
  birthplace: 北京
  roles: [dissent]
  status: exiled
  statusNote: 2015 年取回护照后旅居德国、英国，后定居葡萄牙；仍持中国护照，2025 年底曾回国探亲。
  fall:
    - { date: 2011-04-03, text: 在北京首都机场被带走，羁押 81 天, cite: b10-rfa-2011-06-22-ai-bail }
    - { date: 2011-06-22, text: 以其公司涉嫌逃税等为由被取保候审, cite: b10-rfa-2011-06-22-ai-bail }
    - { date: 2012-09-27, text: 公司税案终审败诉，须缴税款及罚款 1522 万元, cite: b10-rfi-2012-09-27-ai-tax }
  tier: 1
  headline: 艺术家、社会活动人士
  ids: { wikidata: Q160115 }
  bio: >-
    艺术家，诗人艾青之子，曾参与设计北京奥运会主体育场“鸟巢”。2008 年四川地震后他组织志愿者“公民调查”遇难学生名单，2009 年在成都被警察殴打。2011 年 4 月他在北京机场被带走，羁押 81 天后取保候审；外交部称他涉嫌经济犯罪，此事“与人权或言论自由没有任何关系”，他的公司随后被追缴税款和罚款 1522 万元。
    2015 年取回护照后移居德国，2019 年迁居英国，后定居葡萄牙。2025 年底他回国探望母亲，此后称赞中国的言论在海外异见圈引发争议。
  life:
    - h: 艾青之子
      from: 1957
      to: 2007
      text: >-
        1957 年生于北京，父亲是著名诗人艾青。德国之声介绍，他幼年随父母被下放到东北和新疆；1980 年代在美国留学，从事艺术创作和影视项目；90 年代回到中国后成为备受关注的先锋艺术家，并参与公共讨论、发表批评政府的言论。他的作品曾在世界一些最著名的画廊展出，并参与设计 2008 年北京奥运会“鸟巢”体育场。
      cites: [b10-dw-2026-01-ai-passport, b10-voa-2011-04-07-ai, wd-Q160115]
    - h: 地震遇难学生名单
      from: 2008
      to: 2009
      text: >-
        2008 年四川地震后，政府在 300 多天里没有公布遇难者名单，他和四川学者冉云飞等人对遇难学生进行“公民调查”，据他的博客，截至 2009 年 5 月 3 日整理出 5161 名死难学生。他的志愿者到四川拍摄采访失去子女的家庭。
        2009 年 8 月他到成都准备出庭，就他对地震灾区校舍的调查作证。据美国之音报道，他质问进门的警察时被“警察殴打他的脸”，和其他人在饭店房间被软禁 11 个小时。
      cites: [b10-bbc-2009-05-ai-quake-list, b10-voa-2009-08-12-ai-chengdu]
    - h: 八十一天
      from: 2011
      to: 2011
      text: >-
        2011 年 4 月 3 日他在北京首都机场被带走。外交部发言人洪磊 4 月 7 日说，他“涉嫌经济犯罪，正在接受公安机关的依法调查”，此事“与人权或言论自由没有任何关系”；美国驻华大使洪博培则说美国决不会停止支持他这样的社会活动人士。
        6 月 22 日新华网称，他实际控制的北京发课文化发展有限公司逃避缴纳巨额税款、故意销毁会计凭证，“鉴于艾未未认罪态度好、患有慢性疾病等原因”，对他取保候审。自由亚洲电台指出，81 天里家人没有收到任何法律文书，只是在国际舆论高度谴责、怀疑他受到酷刑的情况下，被警方安排在秘密地点见过他一面。美国之音则说，他是在当局扩大打压异议人士之际被捕的，此前一直在推特上记录打压情况。
      cites: [b10-reuters-2011-04-07-ai-mfa, b10-voa-2011-04-07-ai, b10-rfa-2011-06-22-ai-bail]
    - h: 税案
      from: 2011
      to: 2015
      text: >-
        德国之声概括说，2010 年左右他开始在中国受到当局封杀，工作室被强拆，随后又被指控逃税、被拘押、护照被扣。当局随后要求发课公司缴付税款连罚款 1522 万元人民币。他不服，缴付八百多万元押金后上诉，2012 年 7 月一审被驳回。9 月 27 日北京市第二中级法院二审终审判他败诉，他在庭上向审判长喊道：“耻辱，你们都将被记住。”他的护照此后被扣留，直到 2015 年取回护照后才前往德国，在柏林创建工作室。
      cites: [b10-rfi-2012-09-27-ai-tax, b10-dw-2026-01-ai-passport]
    - h: 欧洲岁月
      from: 2015
      to: 2025
      text: >-
        德国之声说，他在德国对公众赋予他的“异议艺术家”标签并不自在。2019 年他和家人迁居英国，后来又移居葡萄牙南部。2021 年 6 月里斯本展览开幕时，他对记者说：“欢迎来到我的国家，葡萄牙！”他在国外生活了二十多年，但一直没有改变国籍，始终拿着中国护照。他说那本护照“是我生命中不可或缺的一部分”，自己身上的这一部分别人改变不了，自己也改变不了。
      cites: [b10-dw-2026-01-ai-passport, b10-rfi-2021-06-03-ai-portugal]
    - h: 回国探亲
      from: 2025
      to: 2026
      text: >-
        2025 年 12 月他带着 17 岁的儿子回国探望 93 岁的母亲。他对《柏林报》说中国护照“它就像胎記：並非選擇，而是與生俱來”，又盛赞北京美食和服务业，称“中國從未追求擴張”。中央社报道，流亡美国的吴祚来嘲讽他“回到黨國母親的懷抱”，网红王志安则认为他的回归象征“燈塔”熄灭。
      cites: [b10-dw-2026-01-ai-passport, b10-cna-2026-01-16-ai]
  assess:
    - voice: official
      quote: true
      text: 此事与人权或言论自由没有任何关系
      cite: b10-reuters-2011-04-07-ai-mfa
    - voice: official
      quote: true
      text: 已查明其实际控制的北京发课文化发展有限公司存在逃避缴纳巨额税款、故意销毁会计凭证等犯罪行为
      cite: b10-rfa-2011-06-22-ai-bail
    - voice: zh
      quote: true
      text: 家人并未收到只字片纸的法律依据
      cite: b10-rfa-2011-06-22-ai-bail
    - voice: zh
      quote: true
      text: 艾未未是在中国当局扩大打压异议人士范围之际被逮捕的
      cite: b10-voa-2011-04-07-ai
    - voice: witness
