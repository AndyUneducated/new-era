  ids: { wikidata: Q688508 }
  bio: >-
    祖籍江苏镇江，生于上海，血液学家、中国科学院院士。知青和赤脚医生出身，瑞金医院读研，在法国巴黎第七大学获博士学位，回国后任上海血液学研究所所长，2000 年任中科院副院长。
    2007 年 6 月以非中共人士身份任卫生部部长，2012 年 9 月加入农工党，同年 12 月任农工党中央主席，2013–2023 年任全国人大常委会副委员长。
