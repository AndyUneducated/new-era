  headline: 原科学技术部部长、全国政协副主席，致公党中央原主席
  ids: { wikidata: Q95023 }
  bio: >-
    上海人，致公党成员。知青出身，同济大学硕士，1985 年赴德国克劳斯塔尔工业大学读博，后在奥迪公司工作十年。2001 年回同济大学，2004 年任校长；
    2006 年任致公党中央副主席，2007 年 4 月任科技部部长，是 1972 年以来首位非中共党籍的国务院组成部门正职，同年 12 月任致公党中央主席，2008–2023 年任全国政协副主席。
