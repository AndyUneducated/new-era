  life:
    - h: 引信专业与军工厂
      from: 1962
      to: 1990
      text: >-
        1962 年 7 月生于黑龙江望奎。1978–1982 年在华东工程学院炮弹系学触发引信设计与制造，毕业后进哈尔滨建成机械厂当干部，1985–1988 年回哈尔滨工业大学读金属材料及工艺系压力加工专业硕士，之后又在哈工大管理学院学系统工程，1986 年入党。
        官方简历只写工厂名；自由亚洲电台的文章说他“曾进入中国第一所航空炸弹制造工厂工作”，中央社则说他曾任职于中国兵器工业集团。
      cites: [b16-cctv-2020-07-31-liu-guozhong-cv, f02-rfa-2023-02-13-jungong, f02-cna-2026-07-14-ma-xingrui]
    - h: 黑龙江省府三十年
      from: 1990
      to: 2013
      text: >-
        1990 年进黑龙江省经委综合规划处，从科员做到主任科员；1993 年转省政府办公厅一处，在这个处待了七年，1996 年任副处长，1998 年任处长；2000 年任省政府研究室副主任，2003 年升主任。2004 年 10 月任鹤岗市委书记，
        2007 年 4 月进黑龙江省委常委并任秘书长，2011 年 9 月改任省委常委、副省长（维基百科记为常务副省长）。从参加工作算起，他在黑龙江工作了约三十年。
      cites: [b16-cctv-2020-07-31-liu-guozhong-cv, c02-wiki-liu-guozhong]
    - h: 全总、四川、吉林
      from: 2013
      to: 2017
      text: >-
        2013 年 10 月调北京任中华全国总工会副主席、书记处书记、党组副书记；2016 年 2 月任四川省委副书记，12 月转任吉林省委副书记、副省长、代省长，晋升正部级，2017 年 1 月由吉林省人大选为省长。
        2017 年 12 月调往陕西时，他仍兼着吉林省长，直到 2018 年 1 月。新华社 2020 年宣布他主政陕西时附的简历，同样列出了全总和四川这两段经历。2018 年 2 月他当选第十三届全国人大代表。
      cites: [b16-cctv-2020-07-31-liu-guozhong-cv, c02-wiki-liu-guozhong, p02-xinhua-2020-07-31-shaanxi-sec]
    - h: 陕西省长与书记
      from: 2017
      to: 2021
      text: >-
        2017 年 12 月调任陕西省委副书记、省政府党组书记。2018 年 1 月 4 日陕西省人大常委会接受胡和平辞去省长职务，任命他为副省长、代省长，1 月 30 日省人代会选他为省长。
        2020 年 7 月 31 日，中组部副部长姜信治在陕西宣布中央决定，刘国中接替胡和平任陕西省委书记（官方简历记为 2020 年 8 月），8 月 25 日他又被补选为省人大常委会主任。
      cites: [p02-xinhua-2018-01-04-liu-guozhong-acting, p02-xinhua-2018-01-30-liu-guozhong-elected, p02-xinhua-2020-07-31-shaanxi-sec, b16-cctv-2020-07-31-liu-guozhong-cv, c02-wiki-liu-guozhong]
    - h: 西安封城
      from: 2021-12
      to: 2022-01
      text: >-
        2021 年 12 月西安暴发疫情，23 日起全城封闭管理。当天他在西安市疫情防控指挥部主持会议，要求落实“逢阳必报、逢阳即报、接报即查、先管后筛”。
        联合早报报道，封闭管理期间食品短缺、物资配送不到位引发民怨，雁塔区两名主要官员被罢免；2022 年 1 月初他要求重点疫区“尽快扭转被动局面”，对风险人群“宁可范围大一些，也不能漏控一人”，
        并要领导干部“身子往前扑，时间往前抢，工作往细做，服务往实做”。“西安买菜难”一度成为微博热搜词，他回应时提出要打通生活物资保障“最后一百米”。也有网友批评“社会面清零”是自欺欺人。
      cites: [b16-cri-2021-12-24-liu-xian, b16-zaobao-2022-01-04-xian-villages, b16-zaobao-2022-01-04-liu-zero]
    - h: 进入政治局
      from: 2022-10
      to: 2023-03
      text: >-
        二十大上进入政治局。路透社在新一届政治局名单公布后的介绍中说他与习近平没有已知的联系；希望之声（传闻来源）则认为，不管他本来与哪派接近，现在都已被收编进习家军，大纪元（传闻来源）把他归入“新陕西帮”。
        自由亚洲电台介绍，境外媒体把他与张国清、袁家军、马兴瑞、李干杰并称“军工五人帮”。2022 年 11 月 27 日他不再兼任陕西省委书记，由赵一德接任；2023 年 3 月 12 日十四届全国人大一次会议决定他为国务院副总理。
      cites: [f02-reuters-2022-10-24-elites, f07-soh-shaanxi, f07-epoch-2023-11-09-five-cliques, f02-rfa-2023-02-13-jungong, p02-xinhua-2022-11-27-shaanxi-sec, b16-gov-2023-03-12-vice-premiers]
    - h: 分管三农与卫生健康
      from: 2023
      to: 2026
      text: >-
        任副总理后的公开活动以农业、粮食、防汛和卫生健康为主。2024 年 7 月在黑龙江调研时强调秋粮产量占全年粮食产量的四分之三，要严密防范洪涝、干旱等灾害；
        2025 年 11 月在内蒙古、辽宁调研时要求扎实抓好“三农”和卫生健康重点工作，既讲秋粮收储、黑土地保护和防止规模性返贫，也讲传染病防控、紧密型县域医共体、育儿补贴和居民医保集中参保。2026 年 7 月同为军工出身的马兴瑞被“双开”，中央社引述 BBC 的专家分析，称习近平对军工系统的反腐已延伸到国防工业最高层级；
        同年 9 月，他仍以副总理身份到湖北调研，出席中国农民丰收节全国主场活动。
      cites: [b16-gov-2024-07-04-liu-heilongjiang, b16-gov-2025-11-05-liu-health, f02-cna-2026-07-14-ma-xingrui, c02-gov-2026-09-23-liu-guozhong]
