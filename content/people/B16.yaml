  life:
    - h: 派出所民警
      from: 1960
      to: 1994
      text: >-
        1960 年 1 月生于四川仁寿。1980–1984 年在西南政法学院法律系读法律专业，1983 年入党。毕业后到乐山市彭山县公安局谢家镇派出所当民警，不久任金口河区公安分局副局长；
        1986 年起任五通桥区公安分局副局长、局长，1990 年任乐山市公安局副局长，1992 年底升局长。他从基层派出所一路做到地级市公安局长，联合早报说他曾长期在四川省公安、国安系统工作。
      cites: [b16-chinanews-2016-11-07-chen-mss, b16-zaobao-2022-10-29-chen-zhengfa]
    - h: 国安厅与检察长
      from: 1994
      to: 2006
      text: >-
        1994 年 8 月调任四川省国家安全厅副厅长，1997 年起兼党组副书记、书记，1998 年 1 月升厅长，同年 9 月兼省政府副秘书长；其间在四川联合大学读企业管理研究生课程班。
        2002 年 4 月任四川省人民检察院检察长，跻身副省级，联合早报称他是当时中国最年轻的省级检察长（副省级），时年 42 岁。他在检察长任上做了四年多，直到 2006 年 8 月调离四川。
      cites: [b16-chinanews-2016-11-07-chen-mss, b16-zaobao-2022-10-29-chen-zhengfa]
    - h: 福建七年
      from: 2006
      to: 2012
      text: >-
        2006 年 8 月首次离开四川，任福建省委常委、省纪委书记（中央社记为“福建省政法委書記”，与官方简历不同），2007 年当选中纪委委员。2011 年 5 月升福建省委副书记，9 月卸下纪委书记一职；
        2012 年 1 月起兼任福建陆军预备役高射炮兵师第一政治委员。联合早报指出，习近平 1996–1999 年也曾任福建省委副书记兼高炮预备役师第一政委，两人经历有相似之处。
      cites: [b16-chinanews-2016-11-07-chen-mss, b16-cna-2022-10-29-chen-zhengfa, c02-wiki-chen-wenqing, b16-zaobao-2022-10-30-chen-stability]
    - h: 中纪委副书记
      from: 2012
      to: 2015
      text: >-
        2012 年 11 月十八大前后，他被增选为十七届中纪委常委、副书记，明确为正部长级，随后当选十八届中纪委常委、副书记，在时任中纪委书记王岐山领导下工作，福建高炮预备役师第一政委一职则兼到 2013 年 4 月；2014 年 4 月他兼任中国纪检监察学院院长。
        官方简历记他的中纪委副书记任期到 2015 年 5 月，中央社和联合早报则记他 2015 年 4 月已出任国家安全部党委书记。
      cites: [b16-chinanews-2016-11-07-chen-mss, b16-zaobao-2022-10-29-chen-zhengfa, c02-wiki-chen-wenqing, b16-cna-2022-10-29-chen-zhengfa, b16-zaobao-2022-10-30-chen-stability]
    - h: 国家安全部
      from: 2015
      to: 2022
      text: >-
        2015 年 1 月国安部副部长马建落马，同年 4 月他出任国安部党委书记，联合早报说这项任命当时被认为与纠正国安系统存在的问题有关。
        2016 年 11 月 7 日，十二届全国人大常委会免去耿惠昌的国家安全部部长职务，任命陈文清接任，同日还任命了新的民政部长和财政部长；同月他任中央政法委委员，2018 年 5 月起兼任中央国家安全委员会办公室分管日常工作的副主任。
      cites: [b16-zaobao-2022-10-30-chen-stability, b16-chinanews-2016-11-07-chen-mss, b16-cna-2022-10-29-chen-zhengfa]
    - h: 执掌“刀把子”
      from: 2022-10
      to: 2022-10
      text: >-
        2022 年 10 月二十届一中全会上当选政治局委员、书记处书记。联合早报称他是首名从国安部长位置进入中共最高决策机构的人；维基百科说他是罗干之后 15 年来首位不是公安部长出身的政法委书记，
        路透社也说这是间谍头子第一次出任这一最高安全职位。10 月 24 日他主持国安部党委会议，称国家安全机关作为“刀把子”，最重要的是领悟“两个确立”的决定性意义；
        10 月 28 日接替郭声琨任中央政法委书记，30 日国安部长一职由陈一新接任。
      cites: [b16-zaobao-2022-10-30-chen-stability, c02-wiki-chen-wenqing, b16-reuters-2022-10-30-chen-yixin, b16-zaobao-2022-10-29-chen-zhengfa, c05-voa-2022-10-29-chen-yixin]
    - h: 政法委书记
      from: 2022-11
      to: 2026
      text: >-
        11 月 28 日他首次主持中央政法委员会全体会议，会议要求强化底线思维和斗争精神，“坚决依法打击敌对势力渗透破坏活动”，切实维护社会大局稳定，王小洪、周强、张军出席。新加坡国立大学学者吴木銮对联合早报分析，这次任命主要是为了加强维稳和对国内局面的控制。
        2026 年 1 月的中央政法工作会议上，他要求落实国家安全责任制、维护社会稳定责任制，加快构建中国自主的法学知识体系、推进政法工作数字化平台建设，“锻造忠诚干净担当的新时代政法铁军”，会议由王小洪主持并作总结讲话。
      cites: [b16-xinhua-2022-11-29-chen-plenary, b16-zaobao-2022-10-30-chen-stability, c02-court-2026-01-19-zhengfa-meeting]
