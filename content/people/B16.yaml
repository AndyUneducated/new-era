      text: >-
        1956 年 9 月生于山西榆社。1974 年 5 月到榆社县大寨公社插队当知青，1975–1977 年读山西机床厂技工学校，之后在该厂第五车间当了一年工人。
        恢复高考后，1978 年 9 月考入北京大学法律系读法律专业，1982 年入党，毕业后接着读北大法律系法理学专业硕士研究生，1985 年毕业，获法学硕士学位。二十大公布的简历把他的硕士专业写作法学基础理论。
