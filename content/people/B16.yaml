  headline: 中央政法委书记（2022– ）、政治局委员、前国家安全部部长
  bio: >-
    四川仁寿人，西南政法学院毕业，从乐山的派出所民警干起，在四川公安、国家安全系统工作近二十年，1998 年任四川省国家安全厅厅长，2002 年任四川省检察长，联合早报称他是当时中国最年轻的省级检察长。
    2006 年调福建任省纪委书记，2011 年升省委副书记；2012 年任中纪委副书记，在王岐山手下工作。2015 年国安部副部长马建落马后出任国安部党委书记，2016 年任部长。
    二十大成为首个进入政治局的国安部长，随后接替郭声琨任中央政法委书记，是罗干之后首位不是公安部长出身的政法委书记。
