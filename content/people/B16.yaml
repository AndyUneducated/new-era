  tier: 1
  headline: 北京市委书记（2022– ）、政治局委员
  bio: >-
    山东临邑人，学医出身，在俄罗斯医学科学院读完卫生经济与卫生事业管理博士，回国后进国务院研究室，2003 年转入卫生部，历任国际合作司司长、办公厅主任，2008 年升副部长，
    2012 年兼任国家食品药品监督管理局局长，接手铬超标胶囊事件的善后。2015 年首次到地方，任四川省委副书记兼宣传部部长，2016–2020 年任四川省长，2020 年 11 月调任福建省委书记。
    二十大进入政治局，2022 年 11 月接替蔡奇任北京市委书记，上任时正值北京疫情升温、防疫政策随即转向；2023 年夏又主持特大暴雨后的救灾和重建。
