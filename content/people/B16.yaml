      text: >-
        1985 年 7 月进中央党校法学教研室任教，1987–1988 年挂职河北宁晋县委副书记，1991–1992 年在荷兰阿姆斯特丹大学法学院进修。
        此后历任科学社会主义教研部法学室副主任、主任，1995 年 11 月评为教授，1996 年起任政法教研部副主任，1999 年升主任，同年 11 月进中央党校校务委员会，2000 年兼党校组织部部长。从讲台到校委，他用了十四年。
