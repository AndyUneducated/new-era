- id: liu-guozhong
  name: 刘国中
  pinyin: Liú Guózhōng
  gender: m
  ethnicity: 汉族
  born: 1962-07
  birthplace: 黑龙江望奎
  education:
    - { school: 华东工程学院炮弹系触发引信设计与制造专业, from: 1978, to: 1982 }
    - { school: 哈尔滨工业大学金属材料及工艺系压力加工专业, degree: 工学硕士, from: 1985, to: 1988 }
    - { school: 哈尔滨工业大学管理学院系统工程专业, from: 1988, to: 1990 }
  joinedParty: 1986-11
  joinedWork: 1982-08
  roles: [pb, cc, prov, minister]
  status: active
  statusNote: 中央政治局委员、国务院副总理，2026 年 9 月仍以此身份到湖北调研。
  tier: 1
  headline: 国务院副总理（2023– ）、政治局委员
  bio: >-
    黑龙江望奎人。本科读的是华东工程学院炮弹系的引信专业，毕业后在哈尔滨建成机械厂当了三年干部，再回哈尔滨工业大学读金属压力加工硕士。
    此后在黑龙江省经委、省政府办公厅和研究室一路升迁，2004 年任鹤岗市委书记，2007 年进省委常委任秘书长，2011 年任副省长。2013 年调全国总工会任副主席，
    2016 年起历任四川省委副书记、吉林省长、陕西省长，2020 年 7 月任陕西省委书记，任内遇上 2021 年底的西安封城。二十大进入政治局，2023 年 3 月任国务院副总理，公开活动以粮食、三农、防汛和卫生健康为主。
  positions:
