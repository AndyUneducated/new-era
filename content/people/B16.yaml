  life:
    - h: 学医与留俄
      from: 1962
      to: 1993
      text: >-
        1962 年 8 月生于山东临邑。1980–1986 年在山东医科大学医学系读医学专业，接着在该校卫生系读社会医学与卫生事业管理专业硕士研究生，其间 1983 年入党，1987–1988 年在上海外国语学院出国留学预备人员培训部受训。
        1988 年 11 月赴俄罗斯医学科学院社会卫生、经济与卫生事业管理研究所读博士，1993 年 11 月毕业，获医学博士学位。联合早报称他是“公共卫生领域的学者型官员”。
      cites: [b16-cctv-2020-12-01-yin-li-cv, b16-zaobao-2022-11-14-yin-li-beijing]
    - h: 国务院研究室与卫生部
      from: 1993
      to: 2012
      text: >-
        1993 年回国进国务院研究室教科文卫司，后转社会发展研究司，从干部做到处长、助理巡视员、巡视员，其间 2001 年在中央党校中央国家机关分校学习，2002–2003 年在美国哈佛大学做访问学者；联合早报的说法是他在哈佛大学公共卫生学院进修过。
        2003 年 5 月调卫生部任办公厅副主任（正司级），10 月任国际合作司司长，2004–2005 年担任世界卫生组织执委并当选执委会副主席；2005–2006 年读中央党校一年制中青年干部培训班，2006 年任卫生部办公厅主任，2008 年 9 月升任卫生部副部长、党组成员，2009–2011 年兼任中央社会治安综合治理委员会委员，2012–2015 年还是中央保健委员会委员。
      cites: [b16-cctv-2020-12-01-yin-li-cv, b16-zaobao-2022-11-13-yin-li-beijing]
    - h: 药监局长
      from: 2012
      to: 2015
      text: >-
        2012 年 2 月兼任国家食品药品监督管理局局长、党组书记，此时铬超标胶囊事件刚过去不久。8 月他接受新华社采访说，问题出现后固然要“救火”，更重要的是完善制度，从源头“防火”；
        新出台的药用辅料规定把辅料的生产和使用也纳入监管，他说过去这是“一个比较薄弱的环节”。维基百科称他任内妥善化解了企业用工业明胶生产胶囊问题。
        2013 年 4 月机构改革后，任国家食品药品监督管理总局副局长、党组副书记，兼国家卫生和计划生育委员会副主任。
      cites: [b16-xinhua-2012-08-03-yin-li-capsule, c02-wiki-yin-li, b16-cctv-2020-12-01-yin-li-cv]
    - h: 四川
      from: 2015
      to: 2020
      text: >-
        2015 年 3 月首次到地方，任四川省委副书记，4 月起兼省委宣传部部长（维基百科记为“专职副书记”、5 月兼宣传部长）。2016 年 1 月任副省长、代省长，1 月 29 日当选四川省长，次日由省人大常委会补选为十二届全国人大代表，2018 年 2 月又当选十三届全国人大代表，省长一直做到 2020 年底。
        他 2012 年十八大当选中央候补委员，2017 年十九大升为中央委员。联合早报记他“担任四川省长近四年后”于 2020 年 11 月转任福建；按官方简历，他实际当了将近五年省长。
      cites: [b16-cctv-2020-12-01-yin-li-cv, c02-wiki-yin-li, b16-zaobao-2022-11-13-yin-li-beijing]
    - h: 福建
      from: 2020
      to: 2022
      text: >-
        2020 年 11 月 30 日，中共中央决定尹力调任福建省委书记（新华社 2022 年的简历记为 2020 年 11 月，官方个人简历记为 12 月），2021 年 1 月当选福建省人大常委会主任。
        南华早报指出福建是习近平的权力基地之一；希望之声和大纪元（均为传闻来源）把他归入“福建帮”，大纪元说他因 2020 年起任福建省委书记而被算作福建帮。二十大后，福建省委书记由人社部部长周祖翼接任。
      cites: [p01-xinhua-2022-11-13-yin-li, c02-wiki-yin-li, b16-cctv-2020-12-01-yin-li-cv, b16-scmp-2022-11-13-yin-li-beijing, f07-soh-song-tao, f07-epoch-2023-11-09-five-cliques]
    - h: 北京：疫情与转向
      from: 2022-10
      to: 2022-12
      text: >-
        2022 年 10 月二十届一中全会当选政治局委员。11 月 13 日，中组部部长陈希在北京宣布中央决定，尹力接替升任政治局常委的蔡奇兼任北京市委书记；南华早报说这项任命反映党的高层向技术官僚倾斜。
        他上任时北京疫情升温，11 月 15 日以北京新冠肺炎疫情防控工作领导小组组长身份到市涉疫风险应急处置指挥部和市疾控中心调研，晚上在朝阳区主持会议，要求“尽快遏制疫情上升势头，坚决打赢疫情歼灭战”，
        同时提出疫情要防住、经济要稳住、发展要安全，希望朝阳区“探索出高效统筹疫情防控与经济社会发展的新路子”。一个月后防疫政策急转，12 月 14 日他主持的市委常委会提出“进一步把工作重心从防控感染转到医疗救治上来”，以保健康、防重症为目标。
      cites: [p01-xinhua-2022-11-13-yin-li, b16-scmp-2022-11-13-yin-li-beijing, b16-bjrb-2022-11-16-yin-li-covid, b16-beijing-2022-12-15-yin-li-covid]
    - h: 北京：暴雨与重建
      from: 2023
      to: 2026
      text: >-
        2023 年 7 月底，受台风“杜苏芮”影响，北京遭遇极端降雨。据联合早报 8 月 1 日报道，京冀两地已至少 20 人死亡，其中北京 11 人，受灾最重的是门头沟区和房山区。
        8 月 6 日他在全市领导干部会议上称这是“百年罕见的特大暴雨”，要求“以不获全胜决不收兵的干劲”打赢防汛救灾和恢复重建攻坚战，并定下“一年基本恢复、三年全面提升、长远可持续发展”的重建思路，对灾损最严重的 18 个山区乡镇建立“一对二”结对帮扶。
        此后他继续以政治局委员、北京市委书记身份主政首都，2026 年 9 月出席北京文化论坛并致辞。
      cites: [b16-zaobao-2023-08-01-beijing-flood, b16-beijing-2023-08-06-yin-li-flood, c02-cyol-2026-09-23-beijing-forum]
