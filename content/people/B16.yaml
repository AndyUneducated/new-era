  tier: 1
  headline: 中央组织部部长（2025– ）、政治局委员、书记处书记
  bio: >-
    山西榆社人，知青、技校生和机床厂工人出身，1978 年考进北大法律系，读完法理学硕士即进中央党校，在党校工作 25 年，2001–2010 年任副校长。
    2010 年外放江苏，历任组织部长、省委副书记、苏州市委书记和省长，2017 年起先后主政宁夏、内蒙古，2020 年在内蒙古推行蒙古语授课学校改用国家统编教材，引发蒙古族抗议。
    2022 年 4 月转任社科院院长，外界一度以为他将退居二线，二十大却进入政治局，任书记处排名第二的书记和中央统战部部长，2023 年兼全国政协副主席；2025 年 3 月与李干杰对调，改任中组部部长。
