      to: 2010
      text: >-
        2001 年 7 月升中央党校副校长，2002 年起专任副校长，2010 年 9 月离开党校，同时还是第十一届全国人大常委、法律委员会委员。
        联合早报说他在党校工作长达 25 年，先后在胡锦涛、曾庆红、习近平三任校长手下工作；自由亚洲电台写他在习近平兼任党校校长期间（该台记为 2007 至 2012 年）是其副手，但官方简历显示他 2010 年已调离党校。
      cites: [b16-cctv-2019-10-26-shi-taifeng-cv, c02-zaobao-2025-04-03-shi-li-swap, b16-rfa-2022-10-26-shi-ufwd]
    - h: 江苏
      from: 2010
      to: 2017
      text: >-
        2010 年 9 月调任江苏省委常委、组织部部长，2011 年 8 月升省委副书记，9 月兼省委党校校长；2014 年 6 月兼任苏州市委书记。
        2015 年 12 月任江苏省代省长（维基百科记为 2015 年 11 月，并称他由此晋升正部级），2016 年 1 月当选省长，同月补选为十二届全国人大代表，省长做到 2017 年 4 月。
        他在江苏前后近七年，先管干部、再管党校、后到苏州和省政府；十八大上当选中央候补委员，十九大升为中央委员。
      cites: [b16-cctv-2019-10-26-shi-taifeng-cv, p01-wiki-shi-taifeng]
    - h: 宁夏与内蒙古
      from: 2017
      to: 2020
      text: >-
        2017 年 4 月任宁夏回族自治区党委书记，6 月兼自治区人大常委会主任；2019 年 10 月调任内蒙古自治区党委书记，2020 年 1 月兼人大常委会主任。
        2020 年 8 月，内蒙古教育厅规定从秋季开学起，民族语言授课学校的小学一年级开始使用国家统编语文教材，此后政治、历史课也逐步改用汉语授课。
        纽约时报中文网报道，数千名蒙古族人聚集在学校外抗议，活动人士称这是内蒙古自 2011 年以来规模最大的一次示威，几名抗议者遭殴打并被带走；教育厅则称“现有的双语教育体系并没有改变”。
      cites: [b16-cctv-2019-10-26-shi-taifeng-cv, e08-bbc-2020-08-31-inner-mongolia, b16-nytcn-2020-09-01-mongolian]
    - h: 民主生活会
      from: 2020-10
      to: 2022
      text: >-
        2020 年 10 月 23 日，他主持自治区党委常委会加强和改进民族工作专题民主生活会，中央第八巡视组组长宁延令到会指导。他带头作检视剖析，总结时称这是对双语教学改革问题的“一次再深思再反思”，
        要求“绝不能在方向性、原则性问题上出现偏差”，同时“要坚定不移推进双语教学改革”。台湾政大国关中心主任寇健文后来说，他获习近平重用的因素之一正是在内蒙古推行汉语。2022 年 4 月他转任中国社会科学院院长。
      cites: [b16-people-2020-10-24-shi-review, b16-rfa-2022-10-26-shi-ufwd, c02-zaobao-2025-04-03-shi-li-swap]
    - h: 统战部长
      from: 2022-10
      to: 2025-03
      text: >-
        联合早报说，他转任社科院时外界一度以为他将退居二线，二十大上他却进入政治局，在书记处排名仅次于蔡奇。10 月 27 日他出任中央统战部部长，中央社说这“出乎各界预料”：
        此前历任统战部长中只有乌兰夫、孙春兰有政治局委员资格。中央社 2025 年又称他是首名与中组部长、中宣部长平起平坐的统战部长。2023 年 3 月他当选全国政协副主席，联合早报称是第一副主席。
      cites: [c02-zaobao-2025-04-03-shi-li-swap, b16-zaobao-2022-10-28-shi-ufwd, b16-cna-2022-10-28-shi-ufwd, c02-cna-2025-04-02-shi-li-swap, b05-gov-2023-03-10-wang-huning-cppcc]
    - h: 中组部长
      from: 2025-03
      to: 2026
      text: >-
        2025 年 3 月底，他与中组部部长李干杰罕见地对调职务，改任中央组织部部长，李干杰执掌统战部；中央社说这次对调原因不明，引起外界揣测。
        此后他以政治局委员、中组部部长身份公开活动，2026 年 9 月 18 日出席学习贯彻习近平关于基层工作方法的重要论述座谈会并讲话，同月仍以全国政协副主席身份出席全国政协会议。
      cites: [c02-zaobao-2025-04-03-shi-li-swap, c02-cna-2025-04-02-shi-li-swap, c02-xinhua-2026-09-18-shi-taifeng, b05-xinhua-2026-09-24-wang-huning-cppcc]
  assess:
    - voice: official
      quote: true
      text: 这次专题民主生活会是对习近平总书记关于民族工作的重要论述和推广普及国家通用语言文字工作的重要指示精神的一次再对标再对表，是对我区双语教学改革问题的一次再深思再反思
      cite: b16-people-2020-10-24-shi-review
    - voice: scholar
      quote: true
      text: 石泰峰获得习近平重用的因素之一是在内蒙古自治区党委书记任内，在蒙古族小学里面推行汉语。
      cite: b16-rfa-2022-10-26-shi-ufwd
    - voice: zh
      quote: true
      text: 但出任中央統戰部長，則出乎各界預料。
      zh: 但出任中央统战部长，则出乎各界预料。
      cite: b16-cna-2022-10-28-shi-ufwd
    - voice: zh
      quote: true
      text: 分析指出，中央统战部在中共党内地位明显提升，显示中共下来将加强统战工作。
      cite: b16-zaobao-2022-10-28-shi-ufwd
  ids: { wikidata: Q8292435 }
  cites: [wd-Q8292435, c02-gov-2022-10-23-20th-cvs, c02-zaobao-2025-04-03-shi-li-swap, c02-cna-2025-04-02-shi-li-swap, b05-xinhua-2026-09-24-wang-huning-cppcc, c02-xinhua-2026-09-18-shi-taifeng, b16-cctv-2019-10-26-shi-taifeng-cv]

- id: li-hongzhong
  name: 李鸿忠
  pinyin: Lǐ Hóngzhōng
  gender: m
  ethnicity: 汉族
  born: 1956-08
  birthplace: 辽宁沈阳
  origin: 山东昌乐
  education:
    - { school: 吉林大学历史系历史学专业, from: 1978, to: 1982 }
  joinedParty: 1976-12
  joinedWork: 1975-08
  roles: [pb, cc, prov]
  status: active
  statusNote: 中央政治局委员、全国人大常委会副委员长，2026 年 9 月仍以此身份主持人大执法检查会议。
  tier: 1
  headline: 全国人大常委会副委员长（2023– ）、政治局委员（2017– ）
  bio: >-
    生于沈阳、祖籍山东昌乐，知青出身，吉林大学历史系毕业后在沈阳市政府、辽宁省委办公厅和电子工业部当秘书，1988 年挂职广东惠州，此后在广东近二十年，历任惠州市长、市委书记、广东副省长、深圳市长和市委书记。
    2007 年底调湖北任省长，2010 年两会期间抢走追问邓玉娇案的记者的录音笔，媒体人联名要求他道歉辞职。2010 年底任湖北省委书记，2016 年 1 月率先公开称习近平是党中央的领导核心，
    同年 9 月接替落马的黄兴国主政天津，十九大进入政治局。二十大连任政治局委员但未入常，2023 年转任全国人大常委会副委员长。
  positions:
    - { title: 惠州市委书记, sys: party, place: 广东, from: 2000, to: 2001-02, cite: b16-xinhua-2016-09-13-li-tianjin }
    - { title: 广东省副省长, sys: gov, place: 广东, from: 2001-02, to: 2003, cite: b16-xinhua-2016-09-13-li-tianjin }
    - { title: 深圳市代市长、市长, sys: gov, place: 广东, from: 2003, to: 2005, cite: c02-gov-2017-10-25-19th-cvs }
    - { title: 深圳市委书记, sys: party, place: 广东, from: 2005-03, to: 2007-11, cite: wd-Q1822563 }
    - { title: 湖北省省长, sys: gov, place: 湖北, from: 2007-12, to: 2010-12, cite: c02-gov-2017-10-25-19th-cvs }
    - { title: 湖北省委书记, sys: party, place: 湖北, from: 2010-12, to: 2016-09, cite: wd-Q1822563 }
    - { title: 天津市委书记, sys: party, place: 天津, from: 2016-09, to: 2022-12, cite: b16-xinhua-2016-09-13-li-tianjin }
    - { title: 中央政治局委员, sys: party, from: 2017-10, cite: c02-xinhua-2017-10-25-19-1-plenum }
