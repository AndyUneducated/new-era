  life:
    - h: 知青与秘书
      from: 1956
      to: 1988
      text: >-
        1956 年 8 月生于辽宁沈阳，祖籍山东昌乐。1975–1978 年在沈阳市苏家屯区姚千公社前陡大队插队，当过民兵连长、治保主任、团总支书记和革委会副主任，1976 年入党。
        1978–1982 年读吉林大学历史系，毕业后进沈阳市政府办公厅秘书处，1985 年任辽宁省委办公厅秘书，同年转任电子工业部办公厅秘书，1987 年任部党组办公室副主任（正处级）。官方简历只写“秘书”，没有写为谁服务。
      cites: [c02-gov-2017-10-25-19th-cvs]
    - h: 惠州与深圳
      from: 1988
      to: 2007
      text: >-
        1988 年挂职广东惠州副市长，1990–1991 年兼大亚湾工业区管委会党组书记，1991 年 10 月定为副局级，1993–1995 年兼仲恺国家高新技术产业开发区管委会主任。1995 年任惠州市委副书记、代市长、市长，其间 1996–1997 年读中央党校一年制中青班，2000 年任惠州市委书记。2001 年 2 月任广东副省长，2002 年进省委常委，
        2003 年调深圳任代市长、市长，2005 年起任深圳市委书记，兼市人大常委会主任。他是十六届、十七届中央候补委员，2012 年十八大升为中央委员。从挂职惠州到离开深圳，他在广东待了约十九年。
      cites: [c02-gov-2017-10-25-19th-cvs, b16-xinhua-2016-09-13-li-tianjin]
    - h: 湖北省长与录音笔事件
      from: 2007
      to: 2010
      text: >-
        2007 年底调湖北任代省长，2008 年 1 月任省长。2010 年 3 月全国两会期间，《京华时报》女记者刘杰追问前一年的邓玉娇案，据中国媒体报道，李鸿忠“大怒，训斥该记者并抢走她的录音笔”。
        数十名媒体人联名致信全国人大，要求他道歉并辞职、启动调查及弹劾程序，人民日报前副总编辑周瑞金等五名学者也联名敦促他公开道歉。他对媒体说这只是误会，“不涉及道歉”，
        又说刘杰“应该更开朗一些，大大方方的”。BBC 中文网发现，一些主要网站已删除转载公开信的博客。
      cites: [c02-gov-2017-10-25-19th-cvs, b16-bbc-2010-03-13-li-openletter, b16-voa-2010-03-14-li-no-apology]
    - h: 湖北书记与“习核心”
      from: 2010
      to: 2016
      text: >-
        2010 年 12 月升任湖北省委书记，次年兼省人大常委会主任。2016 年 1 月 15 日他主持湖北省委常委会，会议提出“习近平总书记是党中央的领导核心”，要“自觉维护习近平总书记这个领导核心”。
        自由亚洲电台称这是地方诸侯首度公开喊出“习核心”；历史学者章立凡说他是揣摩领导心态抢先这么说，若中央不认可，“就是马屁拍到马腿上”。同年 10 月，十八届六中全会正式确立习近平的核心地位。
      cites: [b16-rfa-2016-01-30-li-core, b16-bbc-2016-01-31-xi-core, b16-zaobao-2017-02-20-li-core, c02-gov-2017-10-25-19th-cvs]
    - h: 接手天津
      from: 2016
      to: 2017
      text: >-
        2016 年 9 月，代理天津市委书记黄兴国落马，中央决定李鸿忠调任天津市委书记，中组部常务副部长陈希到天津宣布。联合早报说，这被认为是拿到了十九大后新一届政治局的“入场券”。
        10 月的天津市委工作会议上，他说党中央的领导核心就是习近平，要以“成仁之心”示忠，“忠诚不绝对，就是绝对不忠诚”。2017 年 2 月他又称维护习近平的核心地位“是当代中国最大的政治”，并几次称习近平为“领袖”。
      cites: [b16-xinhua-2016-09-13-li-tianjin, p01-wiki-huang-xingguo, b16-zaobao-2016-10-21-li-loyalty, b16-zaobao-2017-02-20-li-core]
    - h: 政治局委员
      from: 2017
      to: 2022
      text: >-
        2017 年 10 月十九届一中全会进入政治局。詹姆斯敦基金会当时把他列为政治局里的习派成员；路透社 2022 年的介绍说他与习近平没有已知的长期联系，但被视为“习家军”里的亲密盟友；
        《中国季刊》2021 年的一篇论文则按通常分类把他算作江泽民派系的地方大员。二十大前，BBC 中文引述分析人士宋文笛说，2022 年是他和黄坤明入常的最后时机，结果两人都留在政治局委员一级。
        2022 年 12 月他不再兼任天津市委书记，由陈敏尔接任。
      cites: [f02-jamestown-2017-emperor, f02-reuters-2022-10-24-elites, b16-cq-2021-06-21-dominant-faction, b06-bbc-2022-10-23-psc, b11-xinhua-2022-12-08-chen-tianjin]
    - h: 全国人大副委员长
      from: 2023
      to: 2026
      text: >-
        2022 年 10 月二十届一中全会上他连任政治局委员。2023 年 3 月十四届全国人大一次会议选他为全国人大常委会副委员长；这届副委员长共 14 人，王东明、肖捷、郑建邦等人在列，他排在名单首位。此后他以政治局委员、副委员长身份主管人大的执法检查等工作，
        2026 年 9 月 24 日在北京主持全国人大常委会粮食安全保障法执法检查组第二次全体会议并讲话。卸任天津市委书记后，他不再兼任地方职务。
      cites: [b08-wikisource-2022-10-23-20-1-plenum, b06-gov-2023-03-10-state-leaders, c02-people-2026-09-24-li-hongzhong]
