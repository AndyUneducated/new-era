- id: wei-jianxing
  name: 尉健行
  pinyin: Wèi Jiànxíng
  gender: m
  ethnicity: 汉族
  born: 1931-01-02
  died: 2015-08-07
  birthplace: 浙江新昌
  education:
    - { school: 大连工学院机械系, from: 1949-09, to: 1952 }
  joinedParty: 1949-03
  roles: [psc, pb, sec, ccdi, cc, minister, prov]
  status: dead
  statusNote: 2015 年 8 月 7 日在北京病逝。
  tier: 1
  headline: 中纪委书记（1992–2002）、政治局常委（1997–2002）
  ids: { wikidata: Q1133559 }
  bio: >-
    浙江新昌教师家庭出身，1949 年在上海读中学时入党，大连工学院毕业后赴苏联学企业管理，在哈尔滨东北轻合金加工厂工作二十多年，做到厂长。1980 年代任哈尔滨市长、全总副主席、中组部部长，1987 年受命恢复组建监察部。
    1992–2002 年任中纪委书记，查办了陈希同、成克杰、慕马、远华等大案；1995 年 4 月陈希同引咎辞职后，他兼任北京市委书记两年多。1997 年进入常委会，同时兼任全总主席、中央维稳领导小组组长。2002 年退休，2015 年病逝，官方称他“一身正气，两袖清风”。
  positions:
    - { title: 国营东北轻合金加工厂厂长、党委书记, sys: other, place: 黑龙江, from: 1978-06, to: 1981-04, cite: c01-people-2015-08-17-wei-jianxing-life }
    - { title: 哈尔滨市市长, sys: gov, place: 黑龙江, from: 1981-04, to: 1983-10, cite: c01-people-2015-08-17-wei-jianxing-life }
    - { title: 中华全国总工会副主席、书记处书记, sys: other, from: 1983-10, to: 1984-08, cite: c01-people-2015-08-17-wei-jianxing-life }
    - { title: 中央组织部副部长、部长, sys: party, from: 1984-08, to: 1987-05, cite: c01-people-2015-08-17-wei-jianxing-life }
    - { title: 监察部部长, sys: gov, from: 1987-05, to: 1993, cite: c01-people-2015-08-17-wei-jianxing-life }
    - { title: 中纪委书记, sys: party, from: 1992-10, to: 2002-11, cite: c01-people-2015-08-17-wei-jianxing-life }
    - { title: 中华全国总工会主席, sys: other, from: 1993, to: 2002, cite: c01-people-2015-08-17-wei-jianxing-life }
    - { title: 北京市委书记, sys: party, place: 北京, from: 1995-04, to: 1997-08, cite: c01-people-2015-08-17-wei-jianxing-life }
    - { title: 中央政治局常委, sys: party, from: 1997-09, to: 2002-11, cite: c01-people-2015-08-17-wei-jianxing-life }
    - { title: 中央维护稳定工作领导小组组长, sys: party, from: 1998-03, to: 2002-11, cite: c01-people-2015-08-17-wei-jianxing-life }
  life:
    - h: 新昌、光华附中与留苏
      from: 1931
      to: 1955
      text: >-
        1931 年 1 月生于浙江新昌“一个清贫的教师家庭”。1947–1949 年在上海光华大学附中读书，参加党的秘密外围组织和学生运动，1949 年 3 月入党。BBC 中文指出，他和不久前去世的乔石是光华附中校友。
        1949 年 9 月进大连工学院机械系，1952 年毕业后入抚顺俄语训练班，1953 年赴苏联乌拉尔卡明斯克铝加工厂学习企业管理。
      cites: [c01-people-2015-08-17-wei-jianxing-life, b18-bbc-2015-08-07-wei-death]
    - h: 东轻二十年
      from: 1955
      to: 1981
      text: >-
        回国后分到哈尔滨的国营东北轻合金加工厂，1955–1966 年历任科长、车间主任、厂长办公室主任等职，文革中受到冲击。1978 年 6 月起任厂长、党委书记，被授予黑龙江省特等劳动模范；1980 年被选派到中央党校中青年干部培训班学习。
        中新网说，“在东北的三十年，尉健行从技术领域走向政坛”。
      cites: [c01-people-2015-08-17-wei-jianxing-life, b18-chinanews-2015-08-07-wei-ccdi]
    - h: 哈尔滨、全总与中组部
      from: 1981
      to: 1987
      text: >-
        1981 年 4 月任哈尔滨市委副书记、市长，1983 年 10 月调任全国总工会副主席、书记处书记、党组副书记。1984 年 8 月至 1987 年 5 月先后任中组部副部长、部长；官方生平说他坚决执行干部“四化”方针，落实平反冤假错案，清理文革中的“三种人”。
        BBC 中文引中国媒体说，他长期在乔石领导下工作，“两人工作作风、理念相近且配合默契”。
      cites: [c01-people-2015-08-17-wei-jianxing-life, b18-bbc-2015-08-07-wei-death]
    - h: 监察部与中纪委
      from: 1987
      to: 1995
      text: >-
        1987 年 5 月任监察部部长、党组书记，按中央和全国人大常委会的决定恢复组建了监察部和地方各级监察机关。官方生平写道，在 1989 年政治风波中，他“坚决拥护党中央的重大决策部署”。
        1992 年 10 月十四大当选政治局委员、书记处书记，十四届一中全会批准他为中纪委书记。1993 年初中纪委与监察部合署办公；同年起他还兼任全国总工会主席，直到 2002 年。
      cites: [c01-people-2015-08-17-wei-jianxing-life, e01-cpc-dsj-1992]
    - h: 兼任北京市委书记
      from: 1995
      to: 1997
      text: >-
        1995 年 4 月 5 日北京副市长王宝森自杀，次日市委书记陈希同提交引咎辞职报告。4 月 27 日，胡锦涛受中央委托宣布任命尉健行为北京市委书记，批准陈希同辞职。新京报记述，他在北京通报王宝森案时说，如果不坚持反腐败斗争，“确实有亡党亡国危险”；1996 年春节前又说北京当年的重要任务是配合中央审查陈希同的经济问题。
        1997 年 8 月他卸任北京市委书记，贾庆林接任；同月中央决定开除陈希同党籍，1998 年 7 月陈被判刑十六年。
      cites: [e01-cpc-dsj-1995, b18-bjnews-2015-08-08-wei-cases, c01-people-2015-08-17-wei-jianxing-life, p01-wiki-beijing-sec]
    - h: 常委、大案与维稳
      from: 1997
      to: 2002
      text: >-
        1997 年 9 月十五届一中全会当选政治局常委，连任中纪委书记。1998 年 1 月中纪委二次全会通过他的报告《以党的十五大精神为指导，加大工作力度，深入开展反腐败斗争》；同年 3 月他兼任中央维护稳定工作领导小组组长，主持建立中央维稳办。
        查处人数说法不一：中新网说 1993–2002 年共 41 名省部级官员受查处，新京报的标题则是“任职中纪委书记10年查处176名省部级官员”。其中全国人大副委员长成克杰被判死刑，中新网称这是新中国首个因腐败被判死刑的国家领导人。BBC 中文还提到慕马案和厦门远华案。
      cites: [e01-cpc-dsj-1997, e01-cpc-dsj-1998, c01-people-2015-08-17-wei-jianxing-life, b18-chinanews-2015-08-07-wei-ccdi, b18-bjnews-2015-08-08-wei-cases, b18-bbc-2015-08-07-wei-death]
    - h: 退休与病逝
      from: 2002
      to: 2015
      text: >-
        卸任前的 2002 年 3 月 12 日，他说领导干部手中的权力“绝不能把它当作自己的家庭成员谋取私利的手段”。2002 年 11 月十六大退出领导岗位。此后偶尔出席重大场合，包括 2008 年北京奥运会开幕式和 2012 年十八大。据大纪元转载的《争鸣》（传闻），2007 年夏北戴河的退休领导人会上，乔石、尉健行等批评了江泽民。
        2015 年 5 月《尉健行谈工会工作》出版，8 月 7 日他在北京病逝，官方讣告称他“享年85岁”（按虚岁计；实足 84 岁）。
      cites: [b18-people-2015-08-07-wei-death, c01-people-2015-08-17-wei-jianxing-life, e02-consulate-2008-08-08-olympics, e02-ce-2012-11-08-18th-congress, r01-epoch-2007-08-10-zhengming]
  assess:
    - voice: doc
      quote: true
      text: 他一身正气，两袖清风，严以律己，廉洁奉公
      cite: c01-people-2015-08-17-wei-jianxing-life
    - voice: official
      quote: true
      text: 尉健行主政中纪委期间，纪检工作进入到一个新高潮。
      cite: b18-chinanews-2015-08-07-wei-ccdi
    - voice: zh
      quote: true
      text: 尉健行曾长期在乔石领导下工作，两人工作作风、理念相近且配合默契。
      cite: b18-bbc-2015-08-07-wei-death
    - voice: zh
      quote: true
      text: 乔石、尉健行等对江泽民下台后种种忘乎所以的丑态给予严厉的批评
      cite: r01-epoch-2007-08-10-zhengming
  cites: [wd-Q1133559, c01-people-2015-08-17-wei-jianxing-life, e01-cpc-dsj-1995, b18-bbc-2015-08-07-wei-death, b18-chinanews-2015-08-07-wei-ccdi, b18-people-2015-08-07-wei-death, b18-bjnews-2015-08-08-wei-cases, e01-cpc-dsj-1998]

- id: wu-yi
  name: 吴仪
  pinyin: Wú Yí
  gender: f
  ethnicity: 汉族
  born: 1938-11-17
  birthplace: 湖北武汉
  education:
    - { school: 北京石油学院炼油专业, from: 1956, to: 1962 }
  joinedParty: 1962-04
  roles: [pb, cc, minister]
  status: retired
  statusNote: 2007 年十七大退出中央委员会，2008 年 3 月卸任副总理。2026 年 8 月 17 日出席江泽民百年诞辰纪念大会（星岛日报）。
  tier: 1
  headline: 国务院副总理（2003–2008），中国对外经贸谈判的“铁娘子”
  ids: { wikidata: Q50952 }
  bio: >-
    湖北武汉人，北京石油学院炼油专业毕业，在兰州、北京的炼油厂做了二十年技术和管理工作，官至燕山石化党委书记，1988 年任北京市副市长。1991 年调外经贸部任副部长，临时替补出任中美知识产权谈判的中方代表，1992 年 1 月签署谅解备忘录；此后参与入世谈判，1993–1998 年任外经贸部长，外电称她“中国的铁娘子”。
    1998 年任国务委员，2002 年进入政治局，2003–2008 年任副总理，非典期间兼卫生部长，2006 年与美国财长保尔森共同主持首次中美战略经济对话。2007 年宣布“裸退”。
  positions:
    - { title: 燕山石油化工公司副经理、党委书记, sys: other, place: 北京, from: 1983, to: 1988, cite: c01-people-2013-02-26-wu-yi }
    - { title: 北京市副市长, sys: gov, place: 北京, from: 1988, to: 1991, cite: c01-people-2013-02-26-wu-yi }
    - { title: 对外经济贸易部副部长, sys: gov, from: 1991-04, to: 1993, cite: b18-people-2008-03-17-wu-yi-retires }
    - { title: 对外贸易经济合作部部长, sys: gov, from: 1993, to: 1998-03, cite: c01-people-2013-02-26-wu-yi }
    - { title: 中央政治局候补委员, sys: party, from: 1997-09, to: 2002-11, cite: c01-people-2013-02-26-wu-yi }
    - { title: 国务委员, sys: gov, from: 1998-03, to: 2003-03, cite: c01-people-2013-02-26-wu-yi }
    - { title: 中央政治局委员, sys: party, from: 2002-11, to: 2007-10, cite: c01-people-2013-02-26-wu-yi }
    - { title: 国务院副总理, sys: gov, from: 2003-03, to: 2008-03, cite: c01-people-2013-02-26-wu-yi }
    - { title: 国务院防治非典指挥部总指挥, sys: gov, from: 2003-04, cite: c01-people-2013-02-26-wu-yi }
    - { title: 卫生部部长, sys: gov, from: 2003-04, to: 2005-04, cite: c01-people-2013-02-26-wu-yi }
  life:
    - h: 炼油工程师
      from: 1938
      to: 1988
      text: >-
        1938 年 11 月生于武汉。1956–1962 年先后在西北工学院国防系、北京石油学院炼油专业读书，1962 年 4 月入党，毕业后到兰州炼油厂当车间技术员、政治部办公室干事。1965 年调石油工业部生产技术司，1967–1983 年在北京东方红炼油厂从技术员做到副总工程师、副厂长，1983–1988 年任燕山石油化工公司副经理、党委书记。
        联合早报在宋平的讣闻里，把她和胡锦涛、温家宝并列为曾在甘肃工作、后来受到重用的人。
      cites: [c01-people-2013-02-26-wu-yi, f05-zaobao-2026-03-04-song-ping]
    - h: 知识产权谈判
      from: 1988
      to: 1992
      text: >-
        1988–1991 年任北京市副市长。人民网说，1991 年 4 月她任外经贸部副部长，不到 4 个月，中美知识产权谈判开始前两天，中方团长突然患病，她临时替补赴美。
        中新网 2003 年记述，美方代表一开口就说“我们是在和小偷谈判”，她回敬“我们是在和强盗谈判”，问对方博物馆里有多少展品是从中国抢来的。这段对话流传甚广，澎湃新闻 2019 年则把它当作复关和入世谈判年代的语录来讲，场合说法不一。1992 年 1 月 17 日中美签署保护知识产权谅解备忘录。
      cites: [c01-people-2013-02-26-wu-yi, b18-people-2008-03-17-wu-yi-retires, b18-chinanews-2003-04-28-wu-yi-sars, b18-thepaper-2019-12-wto-48-hours, v01-chinanews-2008-03-18-wu-yi]
    - h: 外经贸部长与入世
      from: 1993
      to: 1999
      text: >-
        1993 年起任对外贸易经济合作部部长、党组书记，1997 年十五大当选政治局候补委员。中新网说，在入世和中美知识产权谈判的每个关键时刻，她“或直接参与，或居幕后督战”；中新网 2008 年又说她在入世谈判中“扮演了积极和强硬的角色”，作风直截了当。
        澎湃新闻回顾 1999 年 11 月中美入世谈判的最后 48 小时，写她与美国贸易代表巴尔舍夫斯基这对“老对手”针尖对麦芒。
      cites: [c01-people-2013-02-26-wu-yi, b18-chinanews-2003-04-28-wu-yi-sars, v01-chinanews-2008-03-18-wu-yi, b18-thepaper-2019-12-wto-48-hours]
    - h: 国务委员与入局
      from: 1998
      to: 2003
      text: >-
        1998 年 3 月任国务委员。2002 年上海申办世博会，她在最后陈述中说：“我的13亿同胞，正翘首等待着各位的选择。”人民日报 2010 年回顾此事时称她“时任国务院副总理”，实际上她当时是国务委员。
        同年 11 月十六大她当选政治局委员；詹姆斯敦基金会《中国简报》指出，这届政治局只有三人出自国务院：她、罗干和曾培炎。2003 年 3 月十届人大选举副总理，BBC 中文记录她得 2907 张赞成票、18 张反对票，赞成票为几位副总理中最多。
      cites: [c01-people-2013-02-26-wu-yi, i04-rmrb-2010-11-05-renzhongping, b18-jamestown-2002-12-anti-jiang-backlash, b18-bbc-2003-03-17-npc-cabinet]
    - h: 非典与卫生部
      from: 2003
      to: 2007
      text: >-
        2003 年 4 月 23 日，她兼任新成立的国务院防治非典指挥部总指挥，26 日又兼任卫生部部长，直到 2005 年 4 月。中新网说，喜欢自称“小女子”的她，这次又说了常说的那句话：“小女子受命于危难之中”。
        2004 年 2 月起她兼任国务院防治艾滋病工作委员会主任，2007 年 8 月起任国务院产品质量和食品安全领导小组组长。
      cites: [c01-people-2013-02-26-wu-yi, b18-chinanews-2003-04-28-wu-yi-sars]
    - h: 对日与对美
      from: 2005
      to: 2007
      text: >-
        2005 年 5 月访日期间，她在东京的论坛上说，“因为众所周知的原因”两国政治关系不理想，随后中方以回国“处理一项紧急公务”为由，取消了原定 5 月 23 日与小泉纯一郎的会见；小泉说“我不理解为什么现在要取消”。BBC 中文同时提到小泉每年参拜靖国神社引起的愤怒。
        2006 年 12 月，她与美国财长保尔森在北京共同主持首次中美战略经济对话，开场说一些美国朋友对中国“不仅知之不多，而且误解不少”。《财富》杂志形容她像一位不耐烦的女校长，用一堂课开场。
      cites: [b18-bbc-2005-05-23-wu-yi-japan, b18-bbc-2006-12-15-wu-yi-sed, b18-cnn-2006-12-14-wu-yi-sed]
    - h: 裸退
      from: 2007
      to: 2026
      text: >-
        2007 年 10 月十七大她退出中央委员会。同年 12 月，她宣布在 2008 年两会后完全退休，不再担任官方、半官方或群众团体的任何职务，称之为“裸退”，希望人们“完全把我忘记”。美国之音报道，她透露自己年收入 12 万元人民币，经济学家杨帆说她没有结婚，没有子女。2008 年 3 月卸任副总理。
        此后她极少露面。2026 年 8 月 17 日江泽民百年诞辰大会上，星岛日报报道 87 岁的她坐在主席台上，头发花白。
      cites: [c01-people-2013-02-26-wu-yi, b18-people-2008-03-17-wu-yi-retires, b18-voa-2007-12-25-wu-yi-naked-retire, b18-singtao-2026-08-18-jiang-centenary]
  assess:
    - voice: official
      quote: true
      text: 她给外界留下坚韧、强硬、果敢，而又不失机敏、开放、透明的刚柔相济、明快干练的形象
      cite: b18-chinanews-2003-04-28-wu-yi-sars
    - voice: west
      quote: true
      text: Like an impatient schoolmistress, she opened this historic gathering with a lecture.
      zh: 她像一位不耐烦的女校长，用一堂课为这场历史性会晤开场。
      cite: b18-cnn-2006-12-14-wu-yi-sed
    - voice: zh
      quote: true
      text: 对这样的有能力、有特点、有个性的‘清官铁娘子’，让人们忘，人们也不会忘。
      cite: b18-voa-2007-12-25-wu-yi-naked-retire
    - voice: zh
      quote: true
      text: 外号“铁娘子”的吴仪得赞成票数最高。
      cite: b18-bbc-2003-03-17-npc-cabinet
  cites: [wd-Q50952, c01-people-2013-02-26-wu-yi, c01-gov-2018-03-19-state-council-history, v01-chinanews-2008-03-18-wu-yi, b18-chinanews-2003-04-28-wu-yi-sars, b18-people-2008-03-17-wu-yi-retires, b18-voa-2007-12-25-wu-yi-naked-retire, b18-cnn-2006-12-14-wu-yi-sed, b18-bbc-2006-12-15-wu-yi-sed, b18-bbc-2005-05-23-wu-yi-japan, b18-thepaper-2019-12-wto-48-hours, b18-singtao-2026-08-18-jiang-centenary]

- id: zeng-peiyan
  name: 曾培炎
  pinyin: Zēng Péiyán
  gender: m
  ethnicity: 汉族
  born: 1938-12-01
  birthplace: 浙江绍兴
  education:
    - { school: 清华大学无线电电子学系, from: 1956-09, to: 1962-09 }
  joinedParty: 1978-09
  joinedWork: 1962-09
  roles: [pb, cc, minister]
  status: retired
  statusNote: 2007 年十七大退出政治局，2008 年 3 月卸任副总理；2009–2024 年任中国国际经济交流中心理事长。2026 年 8 月出席江泽民百年诞辰纪念大会（星岛日报）。
  tier: 1
  headline: 国务院副总理（2003–2008）、国家发展计划委员会主任（1998–2003）
  ids: { wikidata: Q189517 }
  bio: >-
    浙江绍兴人，清华无线电电子学系毕业，1962 年分到上海电器科学研究所当技术员，“他是主管科研的副所长，我是技术员”——他这样回忆江泽民。此后在西安整流器研究所工作十七年，1982 年起在驻美使馆商务处任职，1984 年回国进电子工业部，后来与江泽民在电子部共事。
    1992 年起在中央财经领导小组和国家计委任职，1998–2003 年任国家发展计划委员会主任，兼管西部开发和信息化。2002 年进入政治局，2003–2008 年任副总理。退休后任中国国际经济交流中心首任理事长。海外媒体称他是江泽民的心腹（传闻）。
