- id: li-ruihuan
  name: 李瑞环
  pinyin: Lǐ Ruìhuán
  gender: m
  ethnicity: 汉族
  born: 1934-09-17
  birthplace: 天津宝坻
  education:
    - { school: 北京建工业余学院, degree: 工业与民用建筑专业, from: 1958, to: 1963 }
  joinedParty: 1959-09
  joinedWork: 1951-07
  roles: [psc, pb, sec, cc, prov]
  status: retired
  statusNote: 2003 年卸任全国政协主席。联合早报报道，他未出席 2026 年 8 月 17 日的江泽民百年诞辰纪念大会。
  tier: 1
  headline: 全国政协主席（1993–2003）、政治局常委（1989–2002）
  ids: { wikidata: Q704916 }
  bio: >-
    天津宝坻农家子弟，1951 年进北京第三建筑公司当工人，一干十四年，业余读完建筑专业，自称“一个普通的木匠”。1965 年起在北京建材系统和市建委任职，1979 年进团中央书记处，1981 年调天津，任市长、市委书记近十年。
    1989 年 6 月十三届四中全会被增选为政治局常委、书记处书记，1993–2003 年任两届全国政协主席。BBC 等西方媒体称他为党内开明派，与江泽民不睦。2002 年十六大，未满 70 岁的他退出常委会，外界普遍认为是被江泽民逼退。退休后极少露面，2026 年江泽民百年诞辰大会未到场。
  positions:
    - { title: 北京市建委副主任兼市基建指挥部指挥, sys: gov, place: 北京, from: 1973, to: 1979, cite: c01-people-2013-02-26-li-ruihuan }
    - { title: 共青团中央书记处书记, sys: party, from: 1979, to: 1982, cite: c01-people-2013-02-26-li-ruihuan }
    - { title: 天津市市长, sys: gov, place: 天津, from: 1982, to: 1989, cite: c01-people-2013-02-26-li-ruihuan }
    - { title: 天津市委书记, sys: party, place: 天津, from: 1987-08, to: 1989, cite: c01-people-2013-02-26-li-ruihuan }
    - { title: 中央政治局委员, sys: party, from: 1987-11, to: 1989-06, cite: c01-people-2013-02-26-li-ruihuan }
    - { title: 中央政治局常委, sys: party, from: 1989-06, to: 2002-11, cite: c01-people-2013-02-26-li-ruihuan }
    - { title: 中央书记处书记, sys: party, from: 1989-06, to: 1992-10, cite: c01-people-2013-02-26-li-ruihuan }
