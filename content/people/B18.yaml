  life:
    - h: 清华与上海电科所
      from: 1938
      to: 1965
      text: >-
        1938 年 12 月生于浙江绍兴。1956 年 9 月进清华大学无线电电子学系，1962 年 9 月毕业分到一机部上海电器科学研究所，任技术员、课题组组长。他 2010 年回忆：“1962年，我和江泽民同志同一年到上海电器科学研究所工作，他是主管科研的副所长，我是技术员。”当年江 36 岁，他 23 岁，接触有限。据大纪元（传闻），江泽民当时刚从长春第一汽车制造厂动力分厂厂长调任该所副所长。1964 年 10 月他调往西安开关整流器厂，到整流器研究室当技术员。
      cites: [c01-chinanews-2002-11-16-zeng-peiyan, c01-ce-2010-04-26-zeng-peiyan-on-jiang, b18-epoch-2014-08-17-zeng-qiushi]
    - h: 西安、华盛顿与电子部
      from: 1965
      to: 1992
      text: >-
        1965 年 12 月至 1982 年 1 月在一机部西安整流器研究所，从组长做到研究室副主任、副总工程师，1978 年 9 月入党。1982 年起任驻美国大使馆商务参赞处二秘、一秘。1984 年 8 月回国任电子工业部办公厅主任、计划建设司司长，1987 年 4 月升副部长，1988 年机构合并后任机械电子工业部副部长。
        他在回忆文章中说，离开电科所后“我们也曾一起在电子部共事”。
      cites: [c01-chinanews-2002-11-16-zeng-peiyan, b18-chinanews-2010-04-26-zeng-on-jiang]
    - h: 计委与西部开发
      from: 1992
      to: 2002
      text: >-
        1992 年 12 月任中央财经领导小组副秘书长（正部长级）、国家计委副主任，1994 年 8 月起兼财经领导小组办公室主任。1997 年 10 月他陪同江泽民访美。1998 年 3 月国务院机构改革后任国家发展计划委员会主任、党组书记，5 月兼国务院三峡工程建设委员会副主任，2000 年 1 月兼国务院西部开发领导小组办公室主任，2001 年起兼任国家信息化领导小组副组长、国务院信息化工作办公室主任。
      cites: [c01-chinanews-2002-11-16-zeng-peiyan, b18-chinanews-2010-04-26-zeng-on-jiang]
    - h: 入局与车祸
      from: 2002
      to: 2003
      text: >-
        2002 年 11 月十六大当选政治局委员；詹姆斯敦基金会《中国简报》指出，这届政治局只有三人出自国务院：吴仪、罗干和他。
        2003 年 1 月底，他冒着零下二十多度的严寒走访东北 8 个矿区和工厂，在去哈尔滨途中遇车祸受伤。一个多月后他在全国人大会议上作报告，中国青年报记一位哈尔滨代表说：“看到他气色很好，我们放心了。”这篇报道还说他被称为“中国最大的经济管家”。3 月人大选举副总理，BBC 中文记录他得 2867 张赞成票、53 张反对票。
      cites: [b18-jamestown-2002-12-anti-jiang-backlash, b18-cyol-2003-03-07-zeng-peiyan, b18-bbc-2003-03-17-npc-cabinet]
    - h: 副总理
      from: 2003
      to: 2008
      text: >-
        2003–2008 年任温家宝内阁的四位副总理之一，另三位是黄菊、吴仪、回良玉。据看中国转述港媒（传闻），他分管工业。2005 年 7 月 12 日，他在国家发改委主办的中国改革论坛上提出深化改革的六项重点，“一是加快行政管理体制改革，切实转变政府职能”，其余依次是完善基本经济制度、建设现代市场体系、金融体制改革、财税投资体制改革和城乡区域协调发展的体制。
        2007 年 10 月十七大他退出政治局，2008 年 3 月卸任副总理，同年 8 月以退休领导人身份出席北京奥运会开幕式。
      cites: [c01-gov-2018-03-19-state-council-history, f06-secretchina-2003-03-09-hua-jianmin, e01-cpc-dsj-2005, e02-consulate-2008-08-08-olympics]
    - h: 国经中心与晚年
      from: 2009
      to: 2026
      text: >-
        2009 年 3 月 20 日，中国国际经济交流中心召开首届理事会，他当选理事长；他说政府宏观调控和企业跨国经营面临越来越复杂的国际环境，“这也是对各国智库谋划能力的考验”。2014 年 8 月他在《求是》发表纪念邓小平诞辰 110 周年的文章，称邓小平理论是“马克思主义中国化的典范”，号召“紧密团结在以习近平同志为总书记的党中央周围”；大纪元（传闻）把这篇文章解读为向习近平表忠心。
        澎湃新闻 2024 年 3 月报道，毕井泉已接任理事长，他是该中心首任理事长。2026 年 8 月 17 日他出席江泽民百年诞辰大会，星岛日报记他在退休副国级领导人之列。
      cites: [b18-chinanews-2009-03-20-zeng-cciee, b18-people-2014-08-15-zeng-qiushi, b18-epoch-2014-08-17-zeng-qiushi, b18-thepaper-2024-03-25-bi-jingquan-cciee, b18-singtao-2026-08-18-jiang-centenary]
  assess:
