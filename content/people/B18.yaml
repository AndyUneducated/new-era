  life:
    - h: 木匠与北京建工
      from: 1934
      to: 1979
      text: >-
        1934 年 9 月生于天津宝坻。1951 年参加工作，到 1965 年一直在北京第三建筑公司当工人，其间 1958–1963 年在北京建工业余学院读工业与民用建筑专业。BBC 的人物介绍说他是木工，参加过人民大会堂的施工。官方简历记他 1959 年 9 月入党，BBC 则误作 1969 年。
        1965 年起任北京建筑木材厂党总支书记，文革中受迫害五年，1971 年复出任木材厂党委书记，1973–1979 年任北京市建委副主任兼市基建指挥部指挥、市总工会副主任。
      cites: [c01-people-2013-02-26-li-ruihuan, b18-bbcen-2002-li-ruihuan-profile]
    - h: 团中央与主政天津
      from: 1979
      to: 1989
      text: >-
        1979–1981 年任团中央书记处书记、全国青联副主席。China Media Project 的钱钢指出，他虽在团中央担任过要职，但把他归入“团派”是错的。1981 年调天津任市委常委、副市长，1982 年起任代市长、市长，1987 年 8 月兼任市委书记，同年十三大进入政治局。
        BBC 报道，他当天津市长时在本地电台、电视台开热线节目，直接回应市民的诉求。1983–1986 年在他手下任天津副市长的李岚清，后来也和他同在常委会。
      cites: [c01-people-2013-02-26-li-ruihuan, f05-cmp-2007-09-14-factions, b18-bbcen-2002-11-14-li-retires, c01-people-2013-02-26-li-lanqing]
    - h: 四中全会入常
      from: 1989
      to: 1993
      text: >-
        1989 年 6 月 23–24 日的十三届四中全会撤销赵紫阳的职务，选举江泽民为总书记，增选江泽民、宋平、李瑞环为政治局常委，并增补李瑞环、丁关根为书记处书记。
        同年 11 月 25 日，他在中宣部举办的全国党报总编辑新闻工作研讨班上说，“新闻报道必须坚持以正面宣传为主的方针”，新闻的党性同人民性是统一的。1992 年十四届一中全会他连任常委，同年 10 月退出书记处。
      cites: [e01-cpc-dsj-1989, e01-cpc-dsj-1992, c01-people-2013-02-26-li-ruihuan]
    - h: 两届政协主席
      from: 1993
      to: 2002
      text: >-
        1993 年 3 月当选八届全国政协主席，1998 年 3 月连任。1994 年 9 月他在政协成立 45 周年会上说，“人民政协是我国社会主义民主政治建设的一大创造、一大特色”。
        《环球人物》说他任内留下“不少机敏之事”：1995 年 3 月中英争论香港政制时，他在政协小组会上讲了一个故事，老太太把祖传紫砂壶里的茶垢洗干净，壶就不值钱了，用来比喻不要妄洗香港的“茶垢”；2000 年 11 月访港时，他又以一句反问回应记者对“身体健康”祝词的追问。
      cites: [e01-cpc-dsj-1993, e01-cpc-dsj-1998, e01-cpc-dsj-1994, b18-hqrw-2012-11-26-li-ruihuan]
    - h: 十六大出局
      from: 2000
      to: 2002
      text: >-
        吉利（Bruce Gilley）与黎安友（Andrew Nathan）2002 年 9 月在《纽约书评》撰文说，他未满 70 岁，原定 2003 年 3 月接任全国人大委员长；他是最积极主张江泽民交出全部职务、由胡锦涛接掌三项最高职务的人，甚至对人说江若留任军委主席，自己就辞去常委、不当人大委员长；江泽民则一直设法逼他退休。
        2002 年 11 月十六大，68 岁的他退出领导层。BBC 当时引分析人士说，这是江泽民为在高层保留影响力而为，江把他视为对自己一派的威胁，还对他坚持叫“老江”感到不快。
      cites: [b18-nybooks-2002-09-26-gilley-nathan, b18-bbcen-2002-11-14-li-retires]
    - h: 告别讲话
      from: 2002
      to: 2003
      text: >-
        2002 年 11 月 22 日，他在九届政协常委会第十九次会议闭幕时发表告别讲话，后来作为《务实求理》的代序发表。他说，“我这样一个农民的孩子，一个普通的木匠”，能被提拔到这么高的职位，是党和人民培养的结果；对中央要他退下来的意见，“我毫不犹豫地接受，痛痛快快地响应”。他转述江泽民在 10 月 31 日常委会上说他“从党和国家的利益出发，心胸开阔，顾全大局”，并保证对新班子“支持拥护，绝不干扰”。2003 年 3 月贾庆林接任政协主席，美国之音称他是“改革派”。
      cites: [b18-banyuetan-2010-07-06-li-farewell, b18-voa-2003-03-13-jia-qinglin]
    - h: 元老
      from: 2003
      to: 2026
      text: >-
        退休后少有公开活动，曾出席 2008 年北京奥运会开幕式，2012 年列名十八大主席团常委。据大纪元转载的《争鸣》（传闻），2007 年 7 月北戴河退休领导人组织生活会由他召集。
        2026 年 8 月 17 日江泽民百年诞辰大会，星岛日报统计有 13 位退休正国级元老到场，他和胡锦涛、吴官正、罗干未到；联合早报说他前一年还登上天安门城楼观看九三阅兵。据阿波罗网（传闻），他当年是推动江泽民交权、确保胡锦涛接班的力量之一；大纪元（传闻）则说此后他两次“露面”。
      cites: [e02-consulate-2008-08-08-olympics, e02-ce-2012-11-08-18th-congress, r01-epoch-2007-08-10-zhengming, b02-zaobao-2026-08-17-jiang-centenary, b18-singtao-2026-08-18-jiang-centenary, r01-aboluowang-2026-08-17-hu, r01-epoch-2026-08-31-li-yanming]
  assess:
