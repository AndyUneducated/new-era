- id: li-lanqing
  name: 李岚清
  pinyin: Lǐ Lánqīng
  gender: m
  ethnicity: 汉族
  born: 1932-05-22
  birthplace: 江苏镇江
  education:
    - { school: 复旦大学企业管理系, to: 1952 }
  joinedParty: 1952-09
  joinedWork: 1952
  roles: [psc, pb, cc, minister]
  status: retired
  statusNote: 2003 年卸任副总理。2026 年 8 月出席江泽民百年诞辰纪念大会，联合早报称他是到场卸任常委中年纪最大的一位（94 岁）。
  tier: 1
  headline: 国务院副总理（1993–2003）、政治局常委（1997–2002）
  ids: { wikidata: Q388125 }
  bio: >-
    江苏镇江人，复旦企业管理系毕业，从长春一汽的计划员做起，在汽车工业干了近三十年，参与二汽、三汽和重型汽车厂的筹建。1980 年代转做外资外贸，任天津副市长、外经贸部长，1992 年进入政治局，1993–2003 年任两届副总理，1997 年起为政治局常委。
    他先后分管外资、打击走私和科技教育，主持 1999 年起的高校大扩招，任中央处理法轮功问题领导小组组长，也参与了北京申奥。2002 年退休后以篆刻和著述闻名，2026 年 8 月以 94 岁高龄出席江泽民百年诞辰大会。
  positions:
    - { title: 天津市副市长, sys: gov, place: 天津, from: 1983, to: 1986, cite: c01-people-2013-02-26-li-lanqing }
    - { title: 对外经济贸易部副部长, sys: gov, from: 1986, to: 1990, cite: c01-people-2013-02-26-li-lanqing }
    - { title: 对外经济贸易部部长, sys: gov, from: 1990, to: 1993-03, cite: c01-people-2013-02-26-li-lanqing }
    - { title: 中央政治局委员, sys: party, from: 1992-10, to: 1997-09, cite: c01-people-2013-02-26-li-lanqing }
    - { title: 国务院副总理, sys: gov, from: 1993-03, to: 2003-03, cite: c01-people-2013-02-26-li-lanqing }
    - { title: 全国打击走私领导小组组长, sys: gov, from: 1993-06, cite: c01-people-2013-02-26-li-lanqing }
    - { title: 中央政治局常委, sys: party, from: 1997-09, to: 2002-11, cite: c01-people-2013-02-26-li-lanqing }
    - { title: 国家科技教育领导小组副组长, sys: gov, from: 1998-03, to: 2003-03, cite: b01-chinaqw-1998-03-19-zhu-presser }
    - { title: 中央处理法轮功问题领导小组负责人, sys: party, from: 1999-06, to: 2003, cite: b18-jamestown-2011-11-610-office }
  life:
    - h: 一汽与汽车工业
      from: 1932
      to: 1981
      text: >-
        1932 年 5 月生于江苏镇江。1952 年从复旦大学企业管理系毕业，同年 9 月入党，进长春第一汽车制造厂任计划科计划员、副科长；1956–1957 年到苏联利哈乔夫、高尔基汽车厂实习，回厂任计划处科长。1959 年调一机部，1961 年起在国家经委，文革中下放“五七”干校。
        1972–1978 年在二汽任计划处副处长、发动机厂党委第一书记，1978 年起参与三汽和重型汽车厂筹建。凤凰网说，“与江泽民类似”，他也是从一汽走出的国家领导人。
      cites: [c01-people-2013-02-26-li-lanqing, b18-ifeng-2013-06-22-li-lanqing-faw]
    - h: 外资与外贸
      from: 1981
      to: 1993
      text: >-
        1981 年调国家外国投资管理委员会，负责政府贷款办公室；1982 年任外经贸部外资管理局局长。1983–1986 年任天津市副市长兼市委对外经济贸易党工委书记，当时的天津市长是李瑞环。
        1986 年回外经贸部任副部长，1990 年升任部长兼国务院经贸办副主任。他在十三大当选中央候补委员，1992 年 10 月十四大进入政治局。
      cites: [c01-people-2013-02-26-li-lanqing, c01-people-2013-02-26-li-ruihuan]
    - h: 副总理：外资与缉私
      from: 1993
      to: 1998
      text: >-
        1993 年 3 月八届人大任命他为国务院副总理，6 月兼任全国打击走私领导小组组长，1994 年任全国外资工作领导小组组长，1995 年起任国务院学位委员会主任委员。
        1997 年 9 月十五届一中全会选出的七名政治局常委依次为江泽民、李鹏、朱镕基、李瑞环、胡锦涛、尉健行、李岚清，他列第七。1998 年 3 月九届人大上，他和李瑞环分别连任副总理和全国政协主席，两位当年的天津搭档同在常委会。
      cites: [c01-people-2013-02-26-li-lanqing, e01-cpc-dsj-1997, e01-cpc-dsj-1998]
    - h: 科教领导小组与大扩招
      from: 1998
      to: 2003
      text: >-
        1998 年 3 月连任副总理，在九届国务院四位副总理中名列首位。朱镕基在首次记者会上宣布成立国家科技教育领导小组，“我担任组长，李岚清副总理担任副组长”；同场记者会上，他就入世说中国“为此进行了十一年的谈判”，参加了乌拉圭回合谈判的全过程，并签署了最后的一揽子协议。
        中新网报道，《李岚清教育访谈录》里他把扩招的理由归为四条，其中一条是推迟学生就业、增加教育消费、拉动内需；他认为“高校大幅度地扩招是客观的必然”。官方数据说，到 2002 年高等教育毛入学率约为 15%。
      cites: [c01-gov-2018-03-19-state-council-history, b01-chinaqw-1998-03-19-zhu-presser, b18-chinanews-2003-12-11-li-lanqing-expansion]
    - h: 法轮功与申奥
      from: 1999
      to: 2002
      text: >-
        詹姆斯敦基金会《中国简报》2011 年的研究说，1999 年 6 月 7 日江泽民下令在中央成立专门领导小组处理法轮功问题，交由政治局常委李岚清负责，要求“立即组织力量”；6 月 10 日成立的执行机构就是“610 办公室”，在国家体制之外运作，没有任何正式的法律地位。2003 年他退休后，江泽民的亲信罗干接管了这个领导小组并兼任政法委书记，2007 年再由周永康接替；这套系统与政法委的结构高度重叠。
        2001 年 2 月他在大会上要求同法轮功进行坚决斗争。同年 7 月 13 日北京申奥成功，人在莫斯科的他接到江泽民的祝贺电话。
      cites: [b18-jamestown-2011-11-610-office, e01-cpc-dsj-2001]
    - h: 篆刻与晚年
      from: 2002
      to: 2026
      text: >-
        2002 年 11 月十六大，他与江泽民等一同退出常委会，2003 年 3 月卸任副总理。此后他出版教育访谈录，又以篆刻出名：中新网 2007 年报道，他以 71 岁高龄花三年刻成近三百方印，在南京展出；2011 年的展览有 550 件篆刻、200 余件书法，他在题记中说要“让篆刻艺术跟进时代步伐，贴近大众”，一位法国博物馆学专家看后说展览“完全像一个包罗万象的百科大全”。
        2008 年 8 月他作为退休领导人出席北京奥运会开幕式。2026 年 8 月 17 日他出席江泽民百年诞辰大会，联合早报称他是到场元老中年纪最大的一位（94 岁）。
      cites: [c01-people-2013-02-26-li-lanqing, b18-chinanews-2003-12-11-li-lanqing-expansion, b18-chinanews-2007-04-15-li-lanqing-seal, b18-cflac-2011-05-30-li-lanqing-seal, e02-consulate-2008-08-08-olympics, b02-zaobao-2026-08-17-jiang-centenary, b03-gov-2026-08-17-jiang-centenary]
  assess:
