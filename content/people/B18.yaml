      quote: true
      text: He ordered that the team, placed under the responsibility of Politburo Standing Committee member Li Lanqing, “should immediately organize forces”
      zh: 江泽民下令，这个交由政治局常委李岚清负责的小组“应立即组织力量”。
      cite: b18-jamestown-2011-11-610-office
