- id: guo-weiguo
  name: 郭维国
  gender: m
  born: 1967
  roles: [tiger]
  status: purged
  statusNote: 2012 年 8 月被合肥中院以徇私枉法罪判处有期徒刑 11 年；按刑期计算或已刑满，未见公开报道。
  fall:
    - { date: 2012-08-20, text: 合肥中院以徇私枉法罪判处有期徒刑 11 年，认定其为主犯, cite: b07-xinhua-2012-08-20-gu-kailai-sentence }
  tier: 2
  headline: 重庆市公安局原副局长，为包庇薄谷开来徇私枉法的主犯
  ids: { wikidata: Q9355502 }
  bio: >-
    薄谷开来杀害尼尔·伍德案的同案关联人。王立军的判决称，王立军明知薄谷开来有重大嫌疑，仍指派“与其本人及薄谷开来关系密切”的副局长郭维国负责此案，
    郭维国等人作出伍德系酒后猝死的结论。合肥中院认定，郭维国、李阳、王鹏飞、王智为使薄谷开来不受追诉，伪造、隐匿、毁灭证据，引导死者亲属不解剖尸体，
    郭维国是主犯，还曾要求李阳等人销毁物证。薄熙来的判决也写明时任副局长郭维国等人徇私枉法，使此案未被依法侦破。
  positions:
    - { title: 重庆市公安局副局长, sys: gov, place: 重庆, cite: b07-xinhua-2012-08-20-gu-kailai-sentence }
  cites: [b07-xinhua-2012-08-20-gu-kailai-sentence, b07-xinhua-2012-09-24-wang-lijun-sentence, b07-xinhua-2013-09-22-bo-sentence, wd-Q9355502]

