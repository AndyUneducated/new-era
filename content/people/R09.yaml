  fall:
    - { date: 2006-08-09, text: 上海市人大常委会免去其上海市劳动和社会保障局局长职务，市长韩正通报其涉嫌社保基金违规使用和收受贿赂, cite: e07-cctv-2006-08-11-zhu-junyi }
    - { date: 2007-03, text: 被开除党籍和公职，同批被“双开”的社保案涉案党员共 9 人, cite: e07-bbc-2007-03-02-pension-expelled }
    - { date: 2007-09-23, text: 长春中院以受贿罪、挪用公款罪、滥用职权罪数罪并罚判处有期徒刑 18 年，没收个人财产 30 万元, cite: r09-chinanews-2007-09-26-pension-verdicts }
  tier: 2
  headline: 上海市劳动和社会保障局原局长，上海社保案主角
  ids: { wikidata: Q8071122 }
  bio: >-
    上海社保案的主角，2006 年 8 月被免职时是上海改革开放以来出事级别最高的官员。长春中院认定，1999—2006 年他把劳动和社会保障局的巨额资金借给
    张荣坤控制的上海沸点投资发展有限公司使用，受贿 166 万余元，挪用公款 13 亿元供张荣坤的公司营利，并违规运营社保资金；另说挪用公款 10 亿元
    （《财经》、BBC 转述）。BBC 称此案导致上海市委原书记陈良宇等多位政商要人落马。他因提供线索侦破其他重大案件被认定重大立功。
  positions:
    - { title: 上海市劳动和社会保障局局长, sys: gov, place: 上海, to: 2006-08-09, cite: e07-cctv-2006-08-11-zhu-junyi }
  cites: [r09-chinanews-2007-09-26-pension-verdicts, r09-ce-2007-09-24-pension-verdicts, e07-cctv-2006-08-11-zhu-junyi, e07-bbc-2007-03-02-pension-expelled, e07-bbc-2007-09-24-zhu-junyi, wd-Q8071122]

