  tier: 1
  headline: 中央政治局常委、中央纪委书记（2007–2012），此前任中组部长（2002–2007）
  ids: { wikidata: Q737894 }
  factions:
    - f: jiang-shanghai
      cite: b03-bbcen-2007-he-profile
      quote: Scores of senior officials were implicated, but Mr He survived - possibly because of his close relationship with Jiang Zemin, who was president at the time.
      zh: 数十名高官牵涉其中，但贺国强安然无恙——可能因为他与时任国家主席江泽民关系密切。
  bio: >-
    化工技术员出身，在山东化肥厂工作十余年后进入政界，历任济南市委书记、化工部副部长、福建省长、重庆市委书记，2002–2007 年任中组部长，2007–2012 年以政治局常委身份任中央纪委书记。
    他主持中纪委的五年处在胡锦涛时期反腐的“常态”阶段：强调依纪依法、“惩前毖后、治病救人”，兼顾“经济发展、政治稳定、社会和谐”。BBC 称他多次在丑闻中全身而退，可能与江泽民的关系有关。2011 年他赴重庆观看薄熙来推动的“唱读讲传”演出。退休后，《南华早报》报道其长子贺锦涛一度接受调查。
  positions:
    - { title: 鲁南化肥厂副厂长, sys: other, place: 山东, from: 1978, to: 1980, cite: b03-chinanews-2007-10-22-he-resume }
    - { title: 山东省化学石油工业厅厅长, sys: gov, place: 山东, from: 1984, to: 1986, cite: b03-chinanews-2007-10-22-he-resume }
    - { title: 济南市委书记, sys: party, place: 山东, from: 1987, to: 1991, cite: b03-chinanews-2007-10-22-he-resume }
    - { title: 化学工业部副部长, sys: gov, from: 1991, to: 1996, cite: b03-chinanews-2007-10-22-he-resume }
    - { title: 福建省长, sys: gov, place: 福建, from: 1996, to: 1999, cite: b03-chinanews-2007-10-22-he-resume }
    - { title: 重庆市委书记, sys: party, place: 重庆, from: 1999, to: 2002, cite: b03-chinanews-2007-10-22-he-resume }
    - { title: 中央政治局委员、中央书记处书记, sys: party, from: 2002-11, to: 2007-10, cite: b03-chinanews-2007-10-22-he-resume }
    - { title: 中央组织部部长, sys: party, from: 2002, to: 2007, cite: b03-chinanews-2007-10-22-he-resume }
    - { title: 中央政治局常委, sys: party, from: 2007-10, to: 2012-11, cite: wd-Q737894 }
    - { title: 中央纪委书记, sys: party, from: 2007-10, to: 2012-11, cite: b03-chinanews-2007-10-22-he-resume }
  life:
    - h: 湘乡与化肥厂
      from: 1943
      to: 1982
      text: >-
        1943 年 10 月生于湖南湘乡。1961–1966 年在北京化工学院无机化工系学无机物工学，1966 年 1 月入党，毕业后留校待分配一年。1967 年分到山东鲁南化肥厂合成车间，当了十一年技术员、车间主任和车间党支部书记，1978 年升任副厂长兼副总工程师。
        1980 年调山东省化学石油工业厅任调度室主任。BBC 介绍他时说，他是受过训练的化学工程师，七八十年代在化肥厂做过多份工作后，才开始在党内逐级上升。
      cites: [b03-chinanews-2007-10-22-he-resume, b03-bbcen-2007-he-profile]
    - h: 山东与化工部
      from: 1982
      to: 1996
      text: >-
        1982 年任山东省化学石油工业厅副厅长，1984 年任厅长。1986 年进入山东省委常委会，兼济南市委副书记，1987–1991 年任济南市委书记，主政省会四年。
        1991 年调回北京任化学工业部副部长、党组副书记，在部里工作五年。这段时间他的履历仍是典型的行业技术官僚：从工厂、厅局到部委，前后三十年都在化工一个系统里，直到 1996 年才第一次被派去主政一个省份。
      cites: [b03-chinanews-2007-10-22-he-resume]
    - h: 福建与重庆
      from: 1996
      to: 2002
      text: >-
        1996 年任福建省委副书记、代省长，1997–1999 年任省长。BBC 写道，中共党史上最大的走私案正是在他任福建省委副书记时爆发，数十名高官牵连，他却安然无恙，“possibly because of his close relationship with Jiang Zemin”（可能因为与江泽民关系密切）。
        1999–2002 年任重庆市委书记，BBC 称他被普遍认为在招商引资上颇有成绩，但任内又出了挪用三峡工程资金的腐败丑闻，他再次全身而退。2011 年他重访重庆，看望在重庆工作时结对帮扶的两户“穷亲”，说“穿上你们做的鞋，走路‘踏实’”。
      cites: [b03-chinanews-2007-10-22-he-resume, b03-bbcen-2007-he-profile, b03-sina-2011-03-21-he-chongqing]
    - h: 中组部长
      from: 2002
      to: 2007
      text: >-
        2002 年十六大进入政治局和书记处，接任中央组织部部长，掌管全国干部的考察任用。BBC 解释说，这个看似不起眼的部门负责在官员提拔前对其进行考察，因此握有相当的影响力和权力。
        他在中组部任职的五年正是胡锦涛接班后的第一个任期。2007 年 10 月十七大，他由中组部长直接进入政治局常委会，同时当选中央纪委书记。BBC 当时评论说，他数次与丑闻擦身而过，显示他有政治上的生存之道。
      cites: [b03-chinanews-2007-10-22-he-resume, b03-bbcen-2007-he-profile]
    - h: 中纪委书记
      from: 2007
      to: 2012
      text: >-
        2007 年 10 月起任中纪委书记。他在全国查办案件工作会议上通报，2002 年 12 月以来全国纪检监察机关共处分党员干部 86 万余人，其中省部级干部 94 人；他要求“不管是什么人，不论职务多高，只要搞腐败，就要一查到底”，同时强调依纪依法、安全文明办案，要把案件查处与“经济发展、政治稳定、社会和谐等因素统一起来”。
        他提出“惩前毖后”“治病救人”，要求查办案件发挥“治本”功能。在中央纪委监察部机关的一次座谈会上，他把重大责任事故和群体性事件称为“影响社会和谐稳定的一个突出因素”，认为重要原因是一些领导干部“对群众的利益和疾苦漠不关心、麻木不仁”，有的甚至为不法经营“大开绿灯”；他要求在追究直接责任人的同时追究有关领导的责任，并深挖其背后为非法生产经营充当“保护伞”的问题。
        这些讲话后来收入 2014 年 1 月由人民出版社、党建读物出版社出版的《贺国强党建工作文集》。
      cites: [b03-12371-2014-01-04-he-cases, b03-people-2014-01-05-he-mass-incidents]
    - h: 重庆“唱读讲传”
      from: 2011
      to: 2011
      text: >-
        2011 年 3 月 17 日至 21 日，他以常委、中纪委书记身份到重庆黔江、彭水、武隆和主城区调研，听取重庆市委、市政府和市纪委汇报，“对重庆近年来的工作给予充分肯定”，参观重庆市廉政教育基地并观看“唱读讲传”汇报演出，时任重庆市委书记薄熙来全程陪同。
        在重庆大学，他回答学生关于腐败的提问时说，腐败是“古今中外都存在的世界性难题”。一年后的 2012 年 3 月，薄熙来被免去重庆市委书记职务。
      cites: [b03-sina-2011-03-21-he-chongqing, b03-bbc-2015-06-11-zhou-profile]
    - h: 退休与家人
      from: 2012
      to: 2026
      text: >-
        2012 年十八大退休，中纪委书记由王岐山接任。2014 年 5 月《南华早报》引述四名消息人士称，中共高层已批准对其长子贺锦涛展开腐败调查，贺锦涛被软禁，王岐山曾向贺国强通报初步调查结果；消息人士同时说，调查并不意味着贺国强本人涉案。官方从未就此发布通报。
        2026 年 8 月 17 日，他出席纪念江泽民诞辰 100 周年大会，出现在新华社公布的出席名单中，与李长春、曾庆红等退休常委并列。
      cites: [b03-scmp-2014-05-26-he-jintao, b03-gov-2026-08-17-jiang-centenary]
  assess:
    - voice: west
      quote: true
      text: And he has survived several brushes with scandal - suggesting that he has a knack for political survival.
      zh: 他数次与丑闻擦身而过，显示他有政治上的生存之道。
      cite: b03-bbcen-2007-he-profile
    - voice: west
      quote: true
      text: >-
        This apparently obscure department is in charge of investigating officials before they are promoted, so it has influence and power.
      zh: 这个看似不起眼的部门负责在官员提拔前对其进行考察，因此握有影响力和权力。
      cite: b03-bbcen-2007-he-profile
  family:
    - name: 贺锦涛
      rel: 长子
      text: >-
        《南华早报》2014 年 5 月 26 日引述四名知情人士称，中共高层批准对他展开腐败调查，他已被软禁；王岐山向贺国强通报了初步调查结果。报道称不清楚次子贺锦雷是否也受调查，并称调查不意味着贺国强本人涉案。官方未公布任何调查结果。
      cites: [b03-scmp-2014-05-26-he-jintao]
  cites: [b03-chinanews-2007-10-22-he-resume, b03-12371-2014-01-04-he-cases, b03-bbcen-2007-he-profile, wd-Q737894]

- id: zhang-dejiang
  name: 张德江
  pinyin: Zhāng Déjiāng
  gender: m
  ethnicity: 汉族
  born: 1946-11-04
  birthplace: 辽宁台安
  education:
    - { school: 延边大学朝鲜语系朝鲜语专业, from: 1972, to: 1975 }
    - { school: 朝鲜金日成综合大学经济系, from: 1978, to: 1980 }
  joinedParty: 1971-01
  joinedWork: 1968-11
  roles: [psc, pb, cc, prov, hkmt]
  status: retired
  statusNote: 2018 年 3 月卸任全国人大常委会委员长后退休；2026 年 8 月仍出席纪念江泽民诞辰 100 周年大会。
  tier: 1
  headline: 中央政治局常委（2012–2017）、全国人大常委会委员长（2013–2018）
  ids: { wikidata: Q197178 }
  factions:
    - f: jiang-shanghai
      cite: b03-qz-2016-05-zhang-sars
      quote: better known for his loyal allegiance to former President Jiang Zemin than for his reformist qualities
      zh: 他更以对前国家主席江泽民的忠诚而非改革作风闻名
  bio: >-
    知青出身、在延边学朝鲜语并留学平壤金日成综合大学的官员，先后主政吉林、浙江、广东三省，2008 年任副总理，2012 年 3 月薄熙来下台后接掌重庆，同年 11 月进入政治局常委会，2013–2018 年任全国人大常委会委员长并主管港澳工作。
    他在广东任内遇上 2003 年 SARS，外媒普遍批评广东当局起初封锁消息、延误应对。任委员长期间，他代表北京阐述“中央对香港特别行政区拥有全面管治权”。外媒把他视为江泽民一系的官员，也形容他是中央危机时可以依靠的“铁腕”人物。
  positions:
    - { title: 延边大学副校长, sys: other, place: 吉林, from: 1980, to: 1983, cite: b03-gov-2013-03-14-zhang-resume }
    - { title: 民政部副部长, sys: gov, from: 1986, to: 1990, cite: b03-gov-2013-03-14-zhang-resume }
    - { title: 延边州委书记, sys: party, place: 吉林, from: 1990, to: 1995, cite: b03-gov-2013-03-14-zhang-resume }
    - { title: 吉林省委书记, sys: party, place: 吉林, from: 1995, to: 1998, cite: b03-gov-2013-03-14-zhang-resume }
    - { title: 浙江省委书记, sys: party, place: 浙江, from: 1998, to: 2002, cite: b03-gov-2013-03-14-zhang-resume }
    - { title: 中央政治局委员, sys: party, from: 2002-11, to: 2012-11, cite: wd-Q197178 }
    - { title: 广东省委书记, sys: party, place: 广东, from: 2002, to: 2007, cite: b03-gov-2013-03-14-zhang-resume }
    - { title: 国务院副总理, sys: gov, from: 2008-03, to: 2013-03, cite: wd-Q197178 }
    - { title: 重庆市委书记, sys: party, place: 重庆, from: 2012-03, to: 2012-11, cite: wd-Q197178 }
    - { title: 中央政治局常委, sys: party, from: 2012-11, to: 2017-10, cite: wd-Q197178 }
    - { title: 全国人大常委会委员长, sys: gov, from: 2013-03, to: 2018-03, cite: wd-Q197178 }
    - { title: 中央港澳工作协调小组组长, sys: party, cite: b03-bbc-2016-05-13-zhang-hk }
  life:
    - h: 知青、延边与平壤
      from: 1946
      to: 1983
      text: >-
        1946 年 11 月生于辽宁台安。1968 年到吉林汪清县罗子沟公社当知青，1970 年进县革委会宣传组，1971 年入党。1972–1975 年在延边大学学朝鲜语，毕业后留校任系党总支副书记、校革委会副主任。
        1978–1980 年赴朝鲜金日成综合大学经济系留学，任留学生党支部书记，回国后任延边大学副校长。《基督教科学箴言报》评论说，他的朝鲜语能力让他得以在中朝边境的延边任职，而他成功遏止非法移民潮也引起北京的注意。
      cites: [b03-gov-2013-03-14-zhang-resume, b03-csm-2012-11-14-zhang]
    - h: 延边、民政部与吉林
      from: 1983
      to: 1998
      text: >-
        1983 年起任延吉市委副书记、延边州委常委，1985 年任延边州委副书记。1986–1990 年调任民政部副部长，1990 年回吉林任省委副书记兼延边州委书记，1995–1998 年任吉林省委书记、省人大常委会主任。
        新华社 2012 年的人物特稿引用他二十多年前任吉林省委副书记时接受专访说的话：“我们的干部无论职务多高，都是群众中的一员，心里要时刻装着老百姓。”BBC 则把他介绍为对中国“最古老的盟友”朝鲜最在行的领导人。
      cites: [b03-gov-2013-03-14-zhang-resume, b03-people-2012-12-25-zhang-feature, b03-bbcen-2012-03-05-zhang-profile]
    - h: 浙江与广东
      from: 1998
      to: 2005
      text: >-
        1998–2002 年任浙江省委书记，2002 年进入政治局，调任广东省委书记。上任不久，SARS 在广东暴发。BBC 写道，政府反应迟缓，身为省委书记的他“was heavily criticised”（饱受批评）；《基督教科学箴言报》说他试图把疫情当作秘密，正如上级所期望的，却使疫情恶化，一年后报道此事的本地报纸编辑和出版人还以腐败罪被起诉。
        Quartz 引用学者 Tony Saich 的研究称，他主导了最初的掩盖：2003 年 2 月 11 日让卫生官员开记者会宣布疫情已受控制，此后不准媒体再报道。香港最终有 299 人死于 SARS。
      cites: [b03-gov-2013-03-14-zhang-resume, b03-bbcen-2012-03-05-zhang-profile, b03-csm-2012-11-14-zhang, b03-qz-2016-05-zhang-sars]
    - h: 汕尾东洲事件
      from: 2005
      to: 2007
      text: >-
        2005 年 12 月 6 日，广东汕尾东洲村发生警民冲突，武警开枪镇压，事后村子仍被警察包围。新华社称警方“鸣枪警告时造成3人死亡、8人受伤”；法新社引述当地居民说有 30 人被警方开枪打死，《纽约时报》引述的说法是“多达20人”。BBC 称国际媒体将其形容为 1989 年天安门事件以来当局开枪镇压示威者“杀死最多平民的一次”。
        事件发生时他正任广东省委书记；BBC 当时的报道没有提及他本人在处置中的角色。2007 年他卸任广东，转任中央。
      cites: [b03-bbc-2005-12-dongzhou, b03-gov-2013-03-14-zhang-resume]
    - h: 副总理
      from: 2008
      to: 2012
      text: >-
        2008 年任国务院副总理，分管工业、交通、社保，兼国务院安全生产委员会主任。据新华社特稿，2010 年王家岭煤矿透水事故后他连夜赶赴现场；2011 年 2 月利比亚撤侨中任总指挥，12 天撤回 3.5 万多人；同年“7·23”甬温线事故后他赶到现场，官方报道称他明确指示“残骸不能埋”。
        2011 年 7 月他率团访问朝鲜并回母校金日成综合大学参观；BBC 称他同年 11 月还去见过金正日，就在金正日去世前不久。
      cites: [b03-people-2012-12-25-zhang-feature, b03-bbcen-2012-03-05-zhang-profile]
    - h: 接管重庆
      from: 2012
      to: 2012
      text: >-
        2012 年 3 月薄熙来被免职，他以副总理兼任重庆市委书记。《基督教科学箴言报》形容他是被派去“restore the party’s grip on the mega-city”（恢复党对这座特大城市的控制），并称他是中国领导人信任的危机处理者，“a safe pair of hands, in iron gloves”（戴着铁手套的稳妥之手）。
        新华社称他“临危受命”，八个月里“稳定了大局，理清了发展思路”。11 月十八大当选政治局常委，11 月 20 日卸任重庆市委书记时说：“重庆在我心中，我祝福重庆！”
      cites: [b03-csm-2012-11-14-zhang, b03-people-2012-12-25-zhang-feature, wd-Q197178]
    - h: 人大委员长与港澳
      from: 2013
      to: 2018
      text: >-
        2013 年 3 月当选全国人大常委会委员长，至 2018 年 3 月。他同时任中央港澳工作协调小组组长，主管港澳事务。2016 年 5 月他访港出席“一带一路”论坛，是 2012 年以来首位访港的常委，香港动用三千至五千警力，并在他视线以外设立示威区（BBC）。Quartz 写道，他一到香港就提起与香港合作抗击 SARS，但多数港人对那段时间没有好的记忆。
        2017 年 5 月纪念基本法实施 20 周年座谈会上，他说“中央对香港特别行政区拥有全面管治权”，中央与特区是“授权与被授权的关系，而不是分权关系”。他点名批评香港社会有人鼓吹“固有权力”“自主权力”乃至“本土自决”“香港独立”，说其实质是“企图把香港变成一个独立、半独立的政治实体”，要求特区“切实履行基本法关于立法维护国家安全的宪制性责任”。他同时强调“一国两制”既要保持香港、澳门长期繁荣稳定，也要维护国家主权、安全和发展利益。
      cites: [wd-Q197178, b03-bbc-2016-05-13-zhang-hk, b03-qz-2016-05-zhang-sars, b03-xinhua-2017-05-27-zhang-hk]
    - h: 退休
      from: 2017
      to: 2026
      text: >-
        2017 年十九大退出常委会，2018 年 3 月卸任人大委员长。2026 年 8 月 17 日他出席纪念江泽民诞辰 100 周年大会，在新华社公布的出席名单中排在温家宝、贾庆林之后，位列其他退休常委之前。
        外界对他的评价两极：官方称他“敢于负责 勇挑重担”，外媒则更多记得 SARS 时的掩盖与他在香港问题上的强硬表态。
      cites: [wd-Q197178, b03-gov-2026-08-17-jiang-centenary, b03-people-2012-12-25-zhang-feature]
