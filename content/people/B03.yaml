  bio: >-
    石油系统出身的技术官僚，在中石油、四川和公安部一路升迁，2007 年进入政治局常委会并出任中央政法委书记，统辖公安、检察、法院、国安和武警，是胡锦涛时期“维稳”体制的掌舵人。
    他主政政法系统期间，公共安全预算超过国防预算，外界称其为“政法王”。2012 年薄熙来事件后，外媒报道他曾为薄说项，失势传闻随之而起。十八大退休后，他在石油、四川、政法和秘书系统的旧部相继落马；2014 年 7 月被立案审查，打破了改革开放后“刑不上常委”的惯例，2015 年 6 月被判无期徒刑。
    官方后来把他与薄熙来、郭伯雄、徐才厚、令计划并列，指其从事“政治阴谋活动”。
