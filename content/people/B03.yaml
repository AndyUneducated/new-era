  life:
    - h: 石油系统三十年
      from: 1942
      to: 1998
      text: >-
        1942 年生于江苏无锡，BBC 称其原名周元根。1961 年考入北京石油学院勘探系，1966 年毕业，1967 年起在大庆油田六七三厂地质队当实习员。此后长期在辽河油田工作，从技术员、大队长做到辽河石油勘探局局长，1983–1985 年兼任辽宁盘锦市长。
        1985 年任石油工业部副部长，1988 年起任中国石油天然气总公司副总经理，其间兼任塔里木石油会战指挥、胜利石油管理局局长和山东东营市委书记，1996 年升任总经理、党组书记。新京报统计他在石油系统工作了 31 年，BBC 则称 32 年；据媒体报道，他在这一时期培植了蒋洁敏、王永春、李华林等大批“门徒”。
      cites: [b03-bjreview-2007-10-23-zhou-resume, b03-bbc-2015-06-11-zhou-profile, b03-cnr-2015-10-15-zhou-disciples]
    - h: 国土资源部与四川
      from: 1998
      to: 2002
      text: >-
        1998 年国务院机构改革中出任首任国土资源部部长，一年后调任四川省委书记。他在四川只待了三年，但被认为在当地留下一张人事网：1980 年代在胜利油田给他当秘书、此后随他到中石油和国土资源部任职的郭永祥，2000 年随他入川任省委副秘书长、秘书长，后升至副省长；李崇禧、谭力被报道为获其提拔，李春城则被视为他在四川官场的代表人物。
        新京报报道称，他离开四川后仍“继续插手四川官场”；2015 年时任四川省委书记王东明说，“周长期插手四川事务，给四川政治生态造成的恶劣影响不可低估”。
      cites: [b03-bjreview-2007-10-23-zhou-resume, b03-cnr-2015-10-15-zhou-disciples, b03-bbc-2013-08-30-zhou-clique]
    - h: 公安部长
      from: 2002
      to: 2007
      text: >-
        2002 年十六大进入政治局和书记处，任中央政法委副书记（书记为罗干），年底接任公安部长；BBC 称这是华国锋之后首位以政治局委员身份兼任公安部长的人。2003 年起兼任国务委员，并任武警部队第一政委。
        2007 年十七大升任常委后，全国人大常委会 10 月 28 日免去其公安部长职务，由孟建柱接任。BBC 当时分析，孟建柱接任而不进入政治局和书记处，“是有意降低公安在权力架构中的权重”。
      cites: [b03-bjreview-2007-10-23-zhou-resume, b03-bbc-2015-06-11-zhou-profile, b03-bbc-2007-10-28-meng-replaces-zhou]
    - h: 政法委书记与维稳体制
      from: 2007
      to: 2012
      text: >-
        2007 年接替罗干任中央政法委书记，以常委身份统管公、检、法、国安和武警，BBC 写道其“实权之大非中共其他政治局常委可比”。据美国之音引述的财政预算，2011 年公共安全支出预算 6244.21 亿元，首次超过国防预算的 6011.56 亿元；BBC 称到 2012 年维稳经费已逾 7000 亿元，超过军费开支。
        2011 年 2 月他在省部级“社会管理”研讨班上提出建立覆盖全部实有人口的国家人口基础信息库、建立互联网“综合管理格局”、加强对境外非政府组织的管理。BBC 报道称他在任期间极大扩大了警察系统的权力，并负责镇压异议人士及新疆、西藏的分裂活动；维权律师浦志强评论说，他的维稳思维讲究社会治安综合治理，“法律的权威则被放在一边”。
      cites: [b03-bbc-2015-06-11-zhou-profile, b03-voa-2011-05-13-weiwen, b03-xatu-2011-05-01-zhou-qiushi, b03-bbc-2012-11-19-zhou-zhengfa]
    - h: 与薄熙来
      from: 2010
      to: 2012
      text: >-
        薄熙来在重庆“唱红打黑”期间，周永康 2010 年到重庆视察，称打黑除恶是“让老百姓过上安定日子的‘民心工程’”。2012 年 3 月王立军事件后，他是唯一出席重庆代表团会议的常委，3 月 8 日与薄熙来一同露面并高调肯定重庆。薄熙来受审时说，王立军出走后曾收到中央政法委的“六点指示”。
        英国《金融时报》5 月报道（BBC 转述），他因在薄下台后仍为其游说，已把实权移交孟建柱，并在常委会上为替薄辩护道歉；BBC 另称他在“反薄”中一开始犹豫不决。同年 3 月网上流传“政变”之说，BBC 英文网报道称，传言指周可能试图把胡锦涛、温家宝赶下台，但同时强调并无证据显示发生过政变。周是否为薄的靠山，BBC 称目前还无从考证。
      cites: [b03-bbc-2015-06-11-zhou-profile, b03-bbc-2012-05-13-zhou-ft, b03-bbc-2012-11-19-zhou-zhengfa, b03-bbcen-2012-03-23-coup-rumours]
    - h: 退休与旧部落马
      from: 2012
      to: 2014
      text: >-
        2012 年十八大退休，政法委书记改由政治局委员孟建柱兼任，不再进入常委会，BBC 称这反映领导层对该职位权力过大的担忧。此后一年多里，他的旧部成批落马：四川的李春城、郭永祥、李崇禧，石油系统的蒋洁敏、王永春、李华林、冉新权、王道富，政法系统的李东生，以及先后为他当过秘书的李华林、沈定成、冀文林、郭永祥、余刚、谈红。
        2013 年 12 月 1 日，常委会决定对其违纪线索开展核查。路透社 2014 年 3 月引述消息来源称（BBC 转述），已有逾 300 名亲友和亲信被拘押或问话，没收财产至少 900 亿元，周本人坚称遭到“政治迫害”。
      cites: [b03-bbc-2012-11-19-zhou-zhengfa, b03-cnr-2015-10-15-zhou-disciples, b03-bbc-2014-02-22-zhou-secretaries, b03-people-2014-12-06-zhou-expelled, b03-bbc-2014-03-30-zhou-assets]
    - h: 立案、开除与判刑
      from: 2014
      to: 2015
      text: >-
        2014 年 7 月 29 日，新华社只用一句话宣布对其立案审查，消息中没有头衔，也没有“同志”称呼。12 月中央通报他严重违反政治纪律、组织纪律、保密纪律，直接或通过家人收受巨额贿赂，滥用职权帮助亲属、情妇、朋友经营获利，泄露党和国家机密，并“与多名女性通奸并进行权色、钱色交易”，开除党籍并移送司法。
        2015 年 6 月 11 日天津一中院宣判：认定其受贿共计折合 1.29772113 亿元，大部分由其子周滨、妻子贾晓晔收受并事后告知他；滥用职权使周滨等人非法获利 21.36 亿余元；把 5 份绝密级、1 份机密级文件交给不应知悉的曹永正。法院以三罪并罚决定执行无期徒刑。
      cites: [b03-gov-2014-07-29-zhou-probe, b03-bbc-2015-06-11-zhou-profile, b03-people-2014-12-06-zhou-expelled, e03-xinhua-2015-06-11-zhou-verdict]
    - h: 从“腐败”到“政治阴谋”
      from: 2014
      to: 2017
      text: >-
        判决只涉及经济和泄密罪名，但官方此后的定性逐步升级。2016 年 10 月习近平在十八届六中全会上说，周永康、薄熙来、郭伯雄、徐才厚、令计划等人“政治上野心膨胀”，大搞“结党营私、拉帮结派等政治阴谋活动”；BBC 认为这“似乎显示导致他们下台的是党内权力斗争”。2017 年十九大期间，证监会主席刘士余在分组讨论中称这些人“阴谋篡党夺权”，自由亚洲电台指出此话未见于大陆媒体，学者洪振快则说审判材料中“并没有正式指控他们篡党夺权或者阴谋政变”。
        更早的 2014 年，台湾《苹果日报》报道称，据传周组建以他为首的“新四人帮”并图谋政变（BBC 转述），这类说法均未获官方证实。
      cites: [b03-xinhua-2017-01-01-xi-6th-plenum, b03-bbc-2017-01-02-xi-conspiracy, b03-rfa-2017-10-20-liu-shiyu, b03-bbc-2014-07-30-taiwan-media]
  assess:
    - voice: doc
      quote: true
      text: 周永康的所作所为完全背离党的性质和宗旨，严重违反党的纪律，极大损害党的形象，给党和人民事业造成重大损失，影响极其恶劣。
      cite: b03-people-2014-12-06-zhou-expelled
    - voice: doc
      quote: true
      text: 不仅经济上贪婪、生活上腐化，而且政治上野心膨胀，大搞阳奉阴违、结党营私、拉帮结派等政治阴谋活动。
      cite: b03-xinhua-2017-01-01-xi-6th-plenum
    - voice: zh
      quote: true
      text: 而作为中央政法委书记，周永康的权力涵盖中国公、检、法、国安和武警系统。其实权之大非中共其他政治局常委可比，被人称为“政法王”。
      cite: b03-bbc-2015-06-11-zhou-profile
    - voice: west
      quote: true
      text: a hardliner with a reputation for dealing firmly with dissent
      zh: 以强硬对付异见闻名的强硬派
      cite: b03-guardian-2010-12-05-li-google
    - voice: zh
      quote: true
      text: 周永康被视为已被同样判处终身监禁的前中共高官薄熙来的亲密盟友，专家认为这也是周永康落马的原因之一。
      cite: b03-dw-2015-06-11-zhou-verdict
  family:
    - name: 贾晓晔
      rel: 妻子
      text: >-
        曾在中央电视台工作（新京报报道李东生通过这层关系结识周永康）。法院认定周滨、贾晓晔收受吴兵、丁雪峰等人财物并事后告知周永康。2016 年 6 月被湖北宜昌中院以受贿罪、利用影响力受贿罪判处有期徒刑九年，并处罚金 100 万元（纽约时报中文网）。BBC 转述路透社报道时写作“贾晓烨”。
      cites: [b03-cnr-2015-10-15-zhou-disciples, e03-xinhua-2015-06-11-zhou-verdict, b03-nytcn-2016-06-15-zhou-family, b03-bbc-2014-03-30-zhou-assets]
    - name: 周滨
      rel: 长子
      text: >-
        法院认定他与父亲共同受贿 9804.66 万元，另利用其父影响力受贿 1.24 亿余元，并犯非法经营罪。2016 年 6 月 15 日宜昌中院判处有期徒刑十八年，并处罚金 3.502 亿元，他当庭表示不上诉。周永康案判决书称，蒋洁敏、李春城曾按周的要求为周滨等人的经营提供帮助。
      cites: [b03-court-2016-06-15-zhou-bin, e03-xinhua-2015-06-11-zhou-verdict]
    - name: 周元青
      rel: 弟弟
      text: >-
        周永康案判决书所列因周滥用职权而获利的人员之一。路透社 2014 年 3 月引述消息来源称（BBC 转述），周元青一家与周滨夫妇、贾晓烨等十余名亲属已被拘押。
      cites: [e03-xinhua-2015-06-11-zhou-verdict, b03-bbc-2014-03-30-zhou-assets]
  cites: [b03-bjreview-2007-10-23-zhou-resume, b03-people-2014-12-06-zhou-expelled, e03-xinhua-2015-06-11-zhou-verdict, b03-bbc-2015-06-11-zhou-profile, wd-Q198042]

