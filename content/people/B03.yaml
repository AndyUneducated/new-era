  ids: { wikidata: Q705248 }
  bio: >-
    工程师出身、留学东德的技术官僚，经李鹏提携在国务院系统升迁，1988–1998 年任国务院秘书长，1998–2007 年任中央政法委书记，2002–2007 年为政治局常委中年龄最大的一位。
    他主管政法委近十年，统筹公、检、法、国安和对外情报工作：外媒说他推行“严打”、处决人数急升；他本人提出“社会主义法治理念”，要求政法队伍警惕借“维权”和“依法治国”之名否定党的领导。2007 年他把政法委交给副手周永康后退休，后者在此基础上把维稳体制推向顶峰。
  positions:
    - { title: 河南省副省长、省委书记, sys: gov, place: 河南, from: 1981, to: 1983, cite: b03-theorychina-2012-08-04-luo-resume }
