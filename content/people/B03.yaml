  life:
    - h: 大连、哈工大与沈阳
      from: 1944
      to: 1985
      text: >-
        1944 年 2 月生于辽宁大连。1961–1966 年在哈尔滨工业大学电机工程系学工业企业自动化，1965 年入党，毕业后留校待分配两年。1968 年到沈阳市开关厂当技术员，此后在沈阳电器工业公司、电器控制设备工业公司任经理、党委副书记，1980 年任沈阳市机电工业局副局长。
        1982 年任沈阳市副市长兼经委主任，1983 年 39 岁时出任沈阳市委书记、市长，在当时是罕见的年轻省会主官。
      cites: [b03-bjreview-2007-10-23-li-resume]
    - h: 辽宁省长
      from: 1985
      to: 1990
      text: >-
        1985 年任辽宁省委副书记仍兼沈阳市委书记，1986 年任代省长，1987 年正式当选辽宁省长，至 1990 年。官方简历显示他在辽宁从工厂一路做到省长，前后二十余年未离开这一个省份。
        从 1968 年进沈阳开关厂到 1990 年离开辽宁，他用二十二年从技术员做到省长，中间做过企业经理、市局副局长、副市长、市长和市委书记。1990 年他被调往河南，此后再也没有回到东北任职。
      cites: [b03-bjreview-2007-10-23-li-resume]
    - h: 河南与“血浆经济”
      from: 1990
      to: 1998
      text: >-
        1990 年调河南任代省长，1991 年任省长，1992 年起任河南省委书记，1993 年兼省人大常委会主任，1997 年十五大进入政治局。
        1990 年代河南在政府倡导下大办“血浆经济”，农民卖血致大批人感染艾滋病毒。2010 年，前中国健康教育研究所所长陈秉中发表致胡锦涛的公开信，指李长春、李克强在河南任职时“封锁疫情，拒绝向上正式报告河南省发生的严重问题”，要求两人认错道歉（BBC 报道）。自由亚洲电台 2007 年转述，路透社一篇报道的标题是“尽管河南省艾滋病疫情丑闻缠身，李长春却得以在政坛存活”。
      cites: [b03-bjreview-2007-10-23-li-resume, b03-bbc-2010-12-01-aids-letter, b03-rfa-2007-10-16-li-career]
    - h: 广东与入常
      from: 1998
      to: 2002
      text: >-
        1998 年以政治局委员身份调任广东省委书记，主政广东四年，2002 年十六大进入政治局常委会。
        自由亚洲电台 2007 年引述路透社称，他进入常委会是得到江泽民的提拔；美国西东大学学者杨力宇则认为“李长春好象过去跟江泽民并没有什么太大的渊源”。旅美评论人李洪宽说他“最早是江泽民的人”，后又很快赢得胡锦涛信任，是官场上“比较典型的骑墙派”。这些都是海外媒体与评论人的看法，官方没有派系说法。
      cites: [b03-bjreview-2007-10-23-li-resume, b03-rfa-2007-10-16-li-career]
    - h: 主管宣传
      from: 2002
      to: 2012
      text: >-
        2002–2012 年他在常委会主管宣传和意识形态，兼任中央宣传思想工作领导小组组长、中央精神文明建设指导委员会主任。2008 年央视建台 50 周年时他提出“传播力决定影响力”，要把央视等中央媒体“打造成具有世界影响的国际一流媒体”；香港媒体报道当局为此拨款 450 亿元扩大官方媒体的海外影响（BBC 转述）。2009 年记者节，他要求记者“自觉抵御西方敌对势力对我实施西化分化的政治图谋”。同年 12 月他点击开通中国网络电视台，称主流媒体向互联网延伸是大势所趋。
        西方观察者多把这一时期意识形态的收紧与他联系在一起；杨力宇则认为他“是一个执行者”，宣传方针的松紧并不由他决定。
      cites: [wd-Q560391, b03-gmw-2008-12-23-li-cctv, b03-bbc-2009-11-09-li-journalists, b03-cntv-2009-12-28-li-cntv, b03-rfa-2007-10-16-li-career]
    - h: 谷歌事件与维基解密
      from: 2009
      to: 2010
      text: >-
        2010 年 1 月，谷歌承认其系统遭到攻击，但没有说明认为谁应负责。
        同年 12 月维基解密公开的美国使馆电报显示：据一名消息灵通的中国人士，中国政府协调了对谷歌系统的入侵，行动由政治局常委会指挥，李长春负责“the oversight”（监督），周永康协助。电报还记录，北京不满的起因是谷歌拒绝从受审查的 Google.cn 删除通往 Google.com 的链接；2009 年 5 月使馆人员获悉李长春用 Google.com 搜索过自己，看到批评他的文章。BBC 中文网报道，电报引述消息人士称攻击“100%出于政治目的”，但也指出美方未能确定中国高层领导人是否牵涉其中。
      cites: [b03-guardian-2010-12-05-li-google, b03-bbc-2010-12-05-google]
    - h: 退休
      from: 2012
      to: 2026
      text: >-
        2012 年 11 月十八大时，68 岁的李长春与同届多数常委一起退休，退出常委会。他主管宣传的十年，恰好覆盖了官方媒体海外扩张和互联网管控体系成形的阶段。
        2026 年 8 月 17 日，他与温家宝、贾庆林、曾庆红、贺国强、刘云山等退休领导人一同出席纪念江泽民诞辰 100 周年大会，出席名单由新华社公布。
      cites: [wd-Q560391, b03-gov-2026-08-17-jiang-centenary]
  assess:
    - voice: west
      quote: true
      text: >-
        A member of China's ruling politburo, he is the individual in charge of propaganda and censorship and the man behind the "great firewall of China".
      zh: 作为中国执政的政治局成员，他负责宣传与审查，是“防火长城”背后的那个人。
      cite: b03-guardian-2010-12-05-li-google
    - voice: zh
      quote: true
      text: 美国西东大学著名学者杨力宇说，主管意识形态的李长春给很多人以思想僵化的印象，份内的宣传工作没有作好。
      cite: b03-rfa-2007-10-16-li-career
    - voice: zh
      quote: true
      text: 中国健康教育研究所前所长陈秉中教授在世界艾滋病日前夕发表致中共领导人胡锦涛公开信，举报现任中共政治局常委李长春和李克强在担任河南省领导时严重失职，导致血浆经济引发大规模艾滋病流行。
      cite: b03-bbc-2010-12-01-aids-letter
