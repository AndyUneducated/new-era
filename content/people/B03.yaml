  life:
    - h: 济南与东德
      from: 1935
      to: 1962
      text: >-
        1935 年 7 月生于山东济南。1953 年入北京钢铁工业学院压力加工系，次年被派往民主德国，先在莱比锡卡尔·马克思大学学德语，在莱比锡钢铁厂、金属铸造厂实习，1956–1962 年在富莱堡矿冶学院学机械铸造，1960 年 6 月在留学期间入党。
        BBC 2002 年的人物简介称他在莱比锡的钢厂工作了八年，与官方简历所列的学习经历有出入；按官方简历，他在东德前后九年，1962 年 5 月回国参加工作。
      cites: [b03-theorychina-2012-08-04-luo-resume, b03-bbcen-2002-luo-profile]
    - h: 机械部与河南
      from: 1962
      to: 1983
      text: >-
        1962 年回国，在第一机械工业部机械科学研究院任课题组组长、技术员，文革中下放“五七”干校劳动。1970 年代在一机部机械研究院漯河筹备处和郑州机械研究所工作，升至副所长。
        1980 年转入地方政府，任河南省进出口委员会副主任、省科委主任，1981–1983 年任河南省副省长、省委书记（简历注明当时河南另设第一书记）。BBC 把这段经历概括为在河南出任党的领导职务，这也是他唯一的地方主政经历。
      cites: [b03-theorychina-2012-08-04-luo-resume, b03-bbcen-2002-luo-profile]
    - h: 李鹏的国务院秘书长
      from: 1983
      to: 1993
      text: >-
        1983–1988 年任全国总工会副主席、书记处书记。1988 年 4 月任劳动部部长，8 个月后改任国务院秘书长，兼中央国家机关工委书记，在李鹏两届政府中主管国务院日常运转。
        BBC 写道，“his friendship with senior leader Li Peng”（他与李鹏的交情）才是他快速上升的原因，并称两人的关系在 1989 年巩固：天安门学生运动期间，他代表李鹏向武警下达指示。《南华早报》也说，两人在 1989 年镇压期间及其后协调警察和情报机构。官方简历对这一时期只列职务。
      cites: [b03-theorychina-2012-08-04-luo-resume, b03-bbcen-2002-luo-profile, b03-scmp-2002-11-16-luo-gan]
    - h: 国务委员与政法委书记
      from: 1993
      to: 2002
      text: >-
        1993 年起任国务委员（仍兼国务院秘书长）、中央政法委副书记；1997 年十五大进入政治局和书记处；1998 年卸任秘书长，出任中央政法委书记。BBC 称他入政治局后分管社会治安以及对外情报和反间谍工作。
        他主持推行“严打”，BBC 引国际特赦组织数字说，2001 年中国处决了 2468 人，超过世界其他国家的总和。法轮功同样在他主管的范围内：他在 2006 年的讲话中把“利用‘法轮功’等邪教组织捣乱滋事”与“三股势力”并列为政法机关的打击对象。
      cites: [b03-theorychina-2012-08-04-luo-resume, b03-bbcen-2002-luo-profile, b03-reformdata-2006-luo-qiushi]
    - h: 常委与“社会主义法治理念”
      from: 2002
      to: 2007
      text: >-
        2002 年十六大，67 岁的他成为常委会中年龄最大的成员，继续兼任政法委书记，周永康任副书记兼公安部长。《南华早报》称李鹏为保护自己“groomed Mr Luo to be his man”（把罗干培养成自己在常委会里的人），但罗干未能拿到中纪委书记一职，显示李鹏的影响力在减弱。
        2006 年 4 月他在研讨班上提出“社会主义法治理念”，概括为依法治国、执法为民、公平正义、服务大局、党的领导五个方面，批评有人“打着依法治国的幌子否定党对政法工作的领导”，要求防范有人“打着‘维权’幌子进行破坏活动”。同一篇讲话也写了党的领导要“不插手、不干预司法机关的正常司法活动”。
      cites: [b03-scmp-2002-11-16-luo-gan, b03-theorychina-2012-08-04-luo-resume, b03-bjreview-2007-10-23-zhou-resume, b03-reformdata-2006-luo-qiushi]
    - h: 维稳的框架
      from: 2006
      to: 2007
      text: >-
        同一篇讲话勾勒了后来被称作“维稳”的工作框架。他判断中国正处在“人民内部矛盾凸显、刑事犯罪高发、对敌斗争复杂的时期”，说群体性事件“已成为影响社会稳定的突出问题”，点名企业改制、农村征地、城市拆迁、水库移民等领域，要求对矛盾多发的重点地区、领域、行业、人群逐一排查，领导干部到一线处置群体性事件。
        他把政法委的职责写成“加强对维护国家安全和社会稳定工作的统筹协调”，并要求推进社会治安综合治理，抓平安乡村、平安社区、平安校园等基层创建；讲话还把境外非政府组织在华活动列为需要“加强管理”的新问题。这些提法后来在周永康任内被扩展为覆盖全国的维稳体系。
      cites: [b03-reformdata-2006-luo-qiushi, b03-bbc-2012-11-19-zhou-zhengfa]
    - h: 交棒与退休
      from: 2007
      to: 2026
      text: >-
        2007 年 10 月，72 岁的罗干未进入十七届中央委员会，随即卸任常委和政法委书记，由周永康接任。他交出的政法委在周永康手中继续扩权，直到 2012 年十八大，政法委书记改由政治局委员兼任、不再进入常委会，BBC 称这反映了领导层对该职位权力过大的担忧。
        2026 年 8 月 17 日纪念江泽民诞辰 100 周年大会，新华社公布的出席名单包括李岚清、曾庆红、李长春、贺国强等退休常委，未列罗干；官方迄今未发布他的逝世消息。
      cites: [wd-Q705248, b03-bbc-2015-06-11-zhou-profile, b03-bbc-2012-11-19-zhou-zhengfa, b03-gov-2026-08-17-jiang-centenary]
  assess:
    - voice: west
      quote: true
      text: >-
        He has implemented China's "strike hard" anti-crime campaign, which has seen the number of executions in the country soar.
      zh: 他推行了中国的“严打”运动，使全国处决人数激增。
      cite: b03-bbcen-2002-luo-profile
    - voice: west
      quote: true
      text: >-
        He is a loyal backer of Mr Li, and is known to be a trusted trouble-shooter for the departing second-ranked leader in the party hierarchy.
      zh: 他是李鹏的忠实支持者，被认为是这位即将离任的党内二号人物信赖的“救火队员”。
      cite: b03-scmp-2002-11-16-luo-gan
  cites: [b03-theorychina-2012-08-04-luo-resume, b03-reformdata-2006-luo-qiushi, b03-bbcen-2002-luo-profile, b03-scmp-2002-11-16-luo-gan, wd-Q705248]

- id: li-changchun
  name: 李长春
  pinyin: Lǐ Chángchūn
  gender: m
  ethnicity: 汉族
  born: 1944-02
  birthplace: 辽宁大连
  education:
    - { school: 哈尔滨工业大学电机工程系工业企业自动化专业, from: 1961, to: 1966 }
  joinedParty: 1965-09
  joinedWork: 1966-09
  roles: [psc, pb, cc, prov]
  status: retired
  statusNote: 2012 年十八大退休；2026 年 8 月仍出席纪念江泽民诞辰 100 周年大会。
  tier: 1
  headline: 中央政治局常委（2002–2012），主管宣传和意识形态
  ids: { wikidata: Q560391 }
  factions:
    - f: jiang-shanghai
      cite: b03-rfa-2007-10-16-li-career
      quote: 路透社说，李长春晋升政治局常委，是因为得到前中共领导人江泽民的提拔
  bio: >-
    从沈阳开关厂技术员起步，39 岁任沈阳市长，此后历任辽宁省长、河南省委书记和广东省委书记，是改革开放后最年轻的一批省级主官之一。
    2002–2012 年任政治局常委，主管宣传、意识形态和精神文明建设，任内推动央视、新华社等官方媒体“走出去”和向互联网扩张，同时被外界视为网络审查与“防火长城”的总负责人。2010 年维基解密公开的美国外交电报称他主导了针对谷歌的施压与攻击。他在河南任职期间的艾滋病疫情问题也一再被追问。路透社称他靠江泽民提拔进入常委会，也有学者不认同这一说法。
  positions:
    - { title: 沈阳市委书记、市长, sys: party, place: 辽宁, from: 1983, to: 1985, cite: b03-bjreview-2007-10-23-li-resume }
    - { title: 辽宁省长, sys: gov, place: 辽宁, from: 1986, to: 1990, cite: b03-bjreview-2007-10-23-li-resume }
    - { title: 河南省长, sys: gov, place: 河南, from: 1990, to: 1992, cite: b03-bjreview-2007-10-23-li-resume }
    - { title: 河南省委书记, sys: party, place: 河南, from: 1992, to: 1998, cite: b03-bjreview-2007-10-23-li-resume }
    - { title: 中央政治局委员, sys: party, from: 1997-09, to: 2002-11, cite: b03-bjreview-2007-10-23-li-resume }
    - { title: 广东省委书记, sys: party, place: 广东, from: 1998, to: 2002, cite: b03-bjreview-2007-10-23-li-resume }
    - { title: 中央政治局常委, sys: party, from: 2002-11, to: 2012-11, cite: wd-Q560391 }
