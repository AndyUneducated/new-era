    - { title: 国务院副秘书长, sys: gov, from: 2003, to: 2005, cite: b05-xinhua-2018-03-14-wang-yang-resume }
    - { title: 重庆市委书记, sys: party, place: 重庆, from: 2005, to: 2007, cite: b05-xinhua-2018-03-14-wang-yang-resume }
    - { title: 广东省委书记, sys: party, place: 广东, from: 2007, to: 2012, cite: b05-xinhua-2018-03-14-wang-yang-resume }
