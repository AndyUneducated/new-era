  joinedWork: 1972-12
  roles: [psc, pb, sec, cc, prov]
  status: retired
  statusNote: 2023 年 3 月卸任全国人大常委会委员长后退休，2025 年九三阅兵和 2026 年 8 月江泽民诞辰百年纪念大会仍以元老身份出席。
  tier: 1
  headline: 中共中央政治局常委（2017–2022）、全国人大常委会委员长（2018–2023）
  ids: { wikidata: Q391443 }
  factions:
    - f: xi-jiajun
      cite: b05-zaobao-2017-10-23-li-zhanshu
      quote: 这短短两年为栗战书后来的政治生涯发挥了重要铺垫作用，也成为外界判断他是“习家班”嫡系人马的主要依据。
    - f: shaanxi
      cite: f01-brookings-2017-new-politburo
      quote: Li is also widely seen as a member of the “Shaanxi Gang,” Xi’s most important power base.
      zh: 栗战书也被普遍视为习近平最重要的权力基础“陕西帮”的一员。
    - f: tuanpai
      cite: b05-rfi-2012-09-02-li-zhongban
      quote: 根据资料，栗战书是团派人马，当然得胡锦涛支持
  bio: >-
    河北起家的地方官员，1980 年代任无极县委书记时与在邻县正定任职的习近平相识，后来在陕西、黑龙江、贵州任职。2012 年十八大前夕接替令计划任中央办公厅主任，在习近平第一个任期里掌管中办，2014 年起兼国家安全委员会办公室主任，几乎每次出巡出访都随行，被视为习近平最亲近的助手。
    2017 年进入常委会排名第三，2018–2023 年任全国人大常委会委员长。2022 年访俄时的讲话被视为北京对俄乌战争最明确的支持。二十大时 72 岁，退出中央委员会，2023 年卸任。
  positions:
    - { title: 河北省无极县委书记, sys: party, place: 河北, from: 1983, to: 1985, cite: b05-xinhua-2018-03-17-li-zhanshu-resume }
    - { title: 共青团河北省委书记, sys: party, place: 河北, from: 1986, to: 1990, cite: b05-xinhua-2018-03-17-li-zhanshu-resume }
    - { title: 河北省委常委、秘书长, sys: party, place: 河北, from: 1993, to: 1997, cite: b05-xinhua-2018-03-17-li-zhanshu-resume }
    - { title: 陕西省委常委、组织部部长, sys: party, place: 陕西, from: 2000, to: 2002, cite: b05-xinhua-2018-03-17-li-zhanshu-resume }
    - { title: 西安市委书记, sys: party, place: 陕西, from: 2002, to: 2003, cite: b05-xinhua-2018-03-17-li-zhanshu-resume }
    - { title: 黑龙江省省长, sys: gov, place: 黑龙江, from: 2007, to: 2010, cite: b05-xinhua-2018-03-17-li-zhanshu-resume }
    - { title: 贵州省委书记, sys: party, place: 贵州, from: 2010, to: 2012, cite: b05-xinhua-2018-03-17-li-zhanshu-resume }
