      text: Li Zhanshu is one of Xi Jinping’s most trusted long-time friends.
      zh: 栗战书是习近平最信任的老朋友之一。（布鲁金斯学会，李成）
      cite: f01-brookings-2017-new-politburo
    - voice: zh
