      quote: true
      text: "Wang is widely considered a prote\u0301gé of Hu Jintao, with whom he developed strong patron-client ties in the early 1980s, when Hu was head of the CCYL and Wang was deputy secretary of the Anhui Provincial CCYL Committee."
      zh: 汪洋被普遍视为胡锦涛的门生。1980 年代初胡锦涛主持共青团、汪洋任安徽团省委副书记时，两人建立了牢固的庇护关系。（布鲁金斯学会，李成）
      cite: f01-brookings-2017-new-politburo
    - voice: zh
      quote: true
      text: 他履历完整，并被视为具有鲜明改革精神的高干。
      cite: b05-zaobao-2022-10-22-wang-yang-exit
    - voice: zh
      quote: true
      text: 新一届中央委员会不包括李克强或汪洋，他们都被视为经济自由主义者，都与上一届政府的思想有关。
      cite: b09-bbc-2022-10-22-20th-close
    - voice: scholar
      quote: true
