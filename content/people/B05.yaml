    - { title: 国务院副总理, sys: gov, from: 2013-03, to: 2018-03, cite: b05-xinhua-2018-03-14-wang-yang-resume }
    - { title: 中央政治局常委, sys: party, from: 2017-10, to: 2022-10, cite: b05-zaobao-2017-10-25-seven }
    - { title: 全国政协主席, sys: other, from: 2018-03, to: 2023-03, cite: b05-gov-2023-03-10-wang-huning-cppcc }
  life:
    - h: 早年
      from: 1955
      to: 1981
      text: >-
        1955 年生于安徽宿州。布鲁金斯学会的李成写道，他出身寒微，父亲在他幼年去世，作为长子 17 岁就开始工作帮母亲养家。1972 年进入宿县地区食品厂当工人，后任车间负责人；1976 年起在宿县地区“五七”干校任教员，1979–1980 年到中央党校理论宣传干部班学习政治经济学，回来后在地委党校任教。
      cites: [b05-xinhua-2018-03-14-wang-yang-resume, f01-brookings-2017-new-politburo]
    - h: 共青团与铜陵
      from: 1981
      to: 1992
      text: >-
        1981 年起任共青团宿县地委副书记、团省委宣传部长，1983 年任团安徽省委副书记。李成说，他正是在这一时期与时任团中央负责人胡锦涛建立起牢固的庇护关系。之后任安徽省体委主任，1988 年起任铜陵市代市长、市长。
        据中国记者报道，1992 年邓小平视察安徽时见到 37 岁的铜陵市长汪洋，称赞他是难得的人才。
      cites: [b05-xinhua-2018-03-14-wang-yang-resume, f01-brookings-2017-new-politburo]
    - h: 安徽与北京
      from: 1992
      to: 2005
      text: >-
        1992 年任安徽省计委主任、省长助理，1993 年升副省长，在职读完中国科技大学管理科学专业研究生课程，获工学硕士学位；1998 年任省委副书记。
        1999 年调任国家发展计划委员会副主任，2003 年任国务院副秘书长，负责国务院办公厅常务工作，从地方转入中央经济部门和国务院中枢。
      cites: [b05-xinhua-2018-03-14-wang-yang-resume]
    - h: 重庆
      from: 2005
      to: 2007
      text: >-
        2005 年任重庆市委书记，2006 年兼市人大常委会主任，2007 年十七届一中全会进入政治局。BBC 中文的常委档案说，他在重庆要求媒体改革对领导人的报道，让读者“到二版找汪洋”，因此一度被视为中共党内的改革派人物。2007 年底他离开重庆南下广东。
      cites: [b05-xinhua-2018-03-14-wang-yang-resume, b05-bbc-2017-10-25-psc-profiles]
    - h: 广东与“蛋糕论”
      from: 2007
      to: 2012
      text: >-
        2007 年底任广东省委书记。2011 年 7 月他在省委全会上说“分蛋糕不是重点工作，做蛋糕是重点”，并强调“这点是有针对性的”。法广指出，几乎同时薄熙来在重庆提出“要一边分好蛋糕，一边做大蛋糕”，两人被认为在十八大前公开斗法；他在网上与网民对话时说“为什么领导能骂娘，群众就不能骂娘”，也被解读为暗讽薄熙来。
        澳大利亚国立大学的《中国故事》年鉴说，这场“蛋糕之争”是中共领导人第一次借媒体公开表达相互竞争的地区发展路线。
      cites: [b05-rfi-2011-07-15-cake, b05-bbc-2011-08-23-cake, b05-chinastory-2012-cake]
    - h: 乌坎与“幸福广东”
      from: 2011
      to: 2012
      text: >-
        2011 年乌坎村民因土地问题抗议，BBC 中文说他以比较开明的方式处理，但继任者胡春华后来采取高压手段推翻了他的政策。
        2012 年 5 月，他在广东省第十一次党代会上作题为“加快转型升级建设幸福广东”的报告，提出“腾笼换鸟”“双转移”等转型思路，并写道“我们必须破除人民幸福是党和政府恩赐的错误认识”。
      cites: [b05-bbc-2017-10-25-psc-profiles, b05-gd-2012-05-09-wang-yang-report]
    - h: 副总理与政协
      from: 2013
      to: 2022
      text: >-
        2013 年 3 月任国务院副总理。同年 7 月在华盛顿首次主持中美战略与经济对话框架下的经济对话，全场脱稿，把中美经济关系比作夫妻，说“我们两家不能走离婚的路”，引来哄堂大笑。
        2017 年十九大进入政治局常委会，排名第四，2018 年 3 月当选十三届全国政协主席。
      cites: [b05-xinhua-2018-03-14-wang-yang-resume, b05-people-2013-07-11-wang-yang-sed, b05-zaobao-2017-10-25-seven]
    - h: 二十大出局
      from: 2022
      to: 2026
      text: >-
        2022 年二十大前，有副总理资历、年龄又未超出“七上八下”惯例的他被外界猜测可能接任总理，结果与李克强一同未进入新一届中央委员会。美国之音引述旅美政论作家胡平说，两位团派常委出局意味着习近平派系将在新常委会中占绝对优势；BBC 中文认为两人都被视为经济自由主义者。
        2023 年 3 月卸任，在政协会场起立与接任的王沪宁握手致贺；2026 年 8 月出席江泽民诞辰百年纪念大会。
      cites: [b05-zaobao-2022-10-22-wang-yang-exit, b05-voa-2022-10-22-congress, b09-bbc-2022-10-22-20th-close, b05-gov-2023-03-10-wang-huning-cppcc, b05-zaobao-2026-08-17-jiang-centenary]
  assess:
