- id: wang-yang
  name: 汪洋
  pinyin: Wāng Yáng
  gender: m
  ethnicity: 汉族
  born: 1955-03-12
  birthplace: 安徽宿州
  education:
    - { school: 中央党校理论宣传干部班政治经济学专业, from: 1979, to: 1980 }
    - { school: 中国科技大学管理科学系, degree: 工学硕士, from: 1993, to: 1995 }
  joinedParty: 1975-08
  joinedWork: 1972-06
  roles: [psc, pb, cc, prov]
  status: retired
  statusNote: 2022 年二十大以 67 岁未进入中央委员会，2023 年 3 月卸任全国政协主席；2026 年 8 月仍出席江泽民诞辰百年纪念大会。
  tier: 1
  headline: 中共中央政治局常委（2017–2022）、全国政协主席（2018–2023）
  ids: { wikidata: Q734914 }
  factions:
    - f: tuanpai
      cite: b05-voa-2022-10-22-congress
      quote: 原来呼声很高的被认为是改革派和团派领军人物的李克强和汪洋已经不再是中共中央委员
  bio: >-
    安徽工人出身，从共青团系统起步，被普遍视为胡锦涛的门生、团派代表人物。先后主政重庆和广东，在广东推“腾笼换鸟”和“幸福广东”，2011 年与重庆的薄熙来就“做蛋糕”还是“分蛋糕”隔空交锋，被视为党内改革派。
    2013 年起任副总理，主持中美经济对话；2017 年进入常委会，2018–2023 年任全国政协主席。2022 年二十大时 67 岁，未超过“七上八下”的年龄线，却与李克强一同退出中央委员会，被普遍解读为团派在最高层出局。
  positions:
    - { title: 共青团安徽省委副书记, sys: party, place: 安徽, from: 1983, to: 1984, cite: b05-xinhua-2018-03-14-wang-yang-resume }
    - { title: 安徽省铜陵市市长, sys: gov, place: 安徽, from: 1988, to: 1992, cite: b05-xinhua-2018-03-14-wang-yang-resume }
    - { title: 安徽省副省长, sys: gov, place: 安徽, from: 1993, to: 1999, cite: b05-xinhua-2018-03-14-wang-yang-resume }
