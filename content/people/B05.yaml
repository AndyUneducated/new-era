  roles: [psc, pb, cc, prov]
  status: retired
  statusNote: 2018 年卸任副总理后退休；2021 年遭彭帅在微博指控后从未公开回应，2026 年 8 月仍出席江泽民诞辰百年纪念大会。
  tier: 1
  headline: 中共中央政治局常委（2012–2017）、国务院副总理（2013–2018）
  ids: { wikidata: Q197180 }
  factions:
    - f: petroleum
      cite: b05-jamestown-2010-energy-faction
      quote: >-
        Equally significant is the fact that two Politburo members began their careers in the oil-and-gas sector. They are Politburo Standing Committee member in charge of law and order Zhou Yongkang, and Politburo member and Party boss of Tianjin, Zhang Gaoli
      zh: 同样值得注意的是，有两位政治局委员的仕途起步于石油天然气行业：分管政法的政治局常委周永康，以及政治局委员、天津市委书记张高丽。
    - f: jiang-shanghai
      cite: b05-orientaldaily-2021-11-04-zhang
      quote: 张高丽最常被贴上的标签是“江系人马”，原因是在广东任职期间受到江泽民赏识
  bio: >-
    石油系统出身的经济官员。在广东茂名石油公司工作十余年后转入地方，先后主政深圳、山东、天津，2007 年进入政治局，2012 年十八大进入常委会，2013–2018 年任国务院副总理，牵头京津冀协同发展和北京冬奥会筹办。
    外界把他归入“石油帮”和江泽民一系。2018 年退休。2021 年 11 月，网球运动员彭帅在微博发长文，称他曾胁迫她发生性关系，帖文约 20 分钟后被删；张高丽本人从未回应，此后仍以退休元老身份出席二十大和 2026 年江泽民诞辰百年纪念大会。
  positions:
    - { title: 广东省茂名市委副书记、茂名石油工业公司经理, sys: party, place: 广东, from: 1984, to: 1985, cite: b05-gov-2013-03-16-zhang-gaoli-resume }
    - { title: 广东省副省长, sys: gov, place: 广东, from: 1988, to: 1997, cite: b05-gov-2013-03-16-zhang-gaoli-resume }
    - { title: 深圳市委书记, sys: party, place: 广东, from: 1997, to: 2001, cite: b05-gov-2013-03-16-zhang-gaoli-resume }
    - { title: 山东省省长, sys: gov, place: 山东, from: 2001, to: 2003, cite: b05-gov-2013-03-16-zhang-gaoli-resume }
    - { title: 山东省委书记, sys: party, place: 山东, from: 2002, to: 2007, cite: b05-gov-2013-03-16-zhang-gaoli-resume }
    - { title: 天津市委书记, sys: party, place: 天津, from: 2007, to: 2012-11, cite: b05-gov-2013-03-16-zhang-gaoli-resume }
    - { title: 中央政治局委员, sys: party, from: 2007, to: 2012, cite: b05-gov-2013-03-16-zhang-gaoli-resume }
    - { title: 中央政治局常委, sys: party, from: 2012-11, to: 2017-10, cite: b05-bbc-2017-10-25-psc-profiles }
    - { title: 国务院副总理, sys: gov, from: 2013-03, to: 2018, cite: b05-gov-2013-03-16-zhang-gaoli-resume }
  life:
    - h: 厦大与茂名石油
      from: 1946
      to: 1984
      text: >-
        1946 年生于福建晋江。1965–1970 年在厦门大学经济系读计划统计专业，毕业后分配到石油部广东茂名石油公司，从后勤部总仓库的起重搬运工做起，历任公司团委副书记、炼油厂党委书记、计划处处长和副经理，1973 年入党。
        马来西亚《东方日报》指出，他在石油系统任职达 14 年，外界因此把他归入一度颇为庞大的“石油帮”，而落马的周永康被视为这一派的大老。
      cites: [b05-gov-2013-03-16-zhang-gaoli-resume, b05-orientaldaily-2021-11-04-zhang]
    - h: 广东与深圳
      from: 1984
      to: 2001
      text: >-
        1984 年任茂名市委副书记兼茂名石油工业公司经理，次年调任广东省经委主任，1988 年起任副省长近十年，兼省计委主任和珠江三角洲经济区规划协调领导小组组长。1997 年起任深圳市委书记，1998 年升广东省委副书记。
        《东方日报》说，他在广东任职期间受到江泽民赏识，而江泽民首次提出“三个代表”正是在视察他发迹的茂名时，所以他最常被贴上“江系人马”的标签。
      cites: [b05-gov-2013-03-16-zhang-gaoli-resume, b05-orientaldaily-2021-11-04-zhang]
    - h: 山东
      from: 2001
      to: 2007
      text: >-
        2001 年调任山东省委副书记、代省长、省长，2002 年起任省委书记，2003 年兼省人大常委会主任。
        《东方日报》转述了一则流传已久的轶事：2006 年 5 月，已退休的江泽民游览泰山，坐八人大轿登顶，时任山东省委书记的张高丽一路相陪、全程步行上山；翌年他便升任政治局委员。这一说法没有官方证实。
      cites: [b05-gov-2013-03-16-zhang-gaoli-resume, b05-orientaldaily-2021-11-04-zhang]
    - h: 天津
      from: 2007
      to: 2012
      text: >-
        2007 年调任天津市委书记，同年十七届一中全会进入政治局。詹姆斯敦基金会 2010 年分析能源企业高管大举进入政坛的现象时，把他与周永康并列为两位从石油天然气行业起家的政治局成员，并认为能源系统形成了中共第一个以产业为依托的主要派系，有别于以地缘和人脉为纽带的上海帮、太子党和团派。
        2012 年 11 月十八大进入政治局常委会，随即卸任天津市委书记。
      cites: [b05-gov-2013-03-16-zhang-gaoli-resume, b05-jamestown-2010-energy-faction]
    - h: 副总理
      from: 2013
      to: 2018
      text: >-
        2013 年 3 月任国务院副总理、党组副书记，兼京津冀协同发展领导小组组长，2014 年在领导小组会议上强调“一分部署，九分落实”。同年以习近平特使身份出席联合国气候峰会，表示今后中国将“以更大力度和更好效果应对气候变化”。他还任第 24 届冬奥会工作领导小组组长，督办延庆、张家口赛区和京张高铁等工程。
        2017 年十九大他与王岐山等四人一同未进入新一届中央委员会，2018 年退休。
      cites: [b05-gov-2013-03-16-zhang-gaoli-resume, b05-gov-2014-09-04-zhang-jjj, b05-people-2014-09-24-zhang-climate, b05-gov-2017-10-10-zhang-olympics, b05-bbc-2017-10-25-psc-profiles, b05-nytcn-2021-11-25-zhang]
    - h: 彭帅的指控
      from: 2021
      to: 2021
      text: >-
        2021 年 11 月 2 日晚，网球运动员彭帅的认证微博发表长文，称张高丽退休后，经天津网球中心的医生再联系上她，与妻子康洁一起把她带到家中要求发生性关系，并说十多年前在天津时也是如此。BBC 中文报道，帖文约 20 分钟后被删除，截屏随即在境外流传。
        外交部发言人汪文斌次日被问及时说“这不是一个有关外交事务的问题”；《纽约时报》中文网说，赵立坚后来称外界关注是“恶意炒作”，官方媒体既未报道张高丽，也没有直接质疑她的说法。
      cites: [e04-bbc-2021-11-03-peng-shuai, b05-voa-2021-11-04-peng-shuai, b05-nytcn-2021-11-25-zhang]
    - h: 余波与退休生活
      from: 2021
      to: 2026
      text: >-
        WTA 以彭帅不能自由沟通、似乎被迫否认指控为由，于 2021 年 12 月 1 日宣布暂停在中国的全部赛事。彭帅同月接受《联合早报》采访时说“我从未说过、写过任何人性侵我”，称微博内容属个人隐私。2023 年 4 月 WTA 宣布恢复中国赛事，说已获保证她与家人在北京安全生活。
        张高丽从未回应指控，2022 年 10 月二十大开幕时首次公开露面；2026 年 8 月 17 日仍出席江泽民诞辰百年纪念大会。
      cites: [b05-guardian-2021-12-01-wta, b05-zaobao-2021-12-20-peng-shuai, b05-wta-2023-04-13-china-return, b05-voa-2022-10-17-zhang-congress, b05-zaobao-2026-08-17-jiang-centenary]
  assess:
    - voice: zh
      quote: true
      text: 由于在石油系统任职达14年，外界遂将张高丽归纳为中共党内势力一度颇为庞大的“石油帮”一员。
      cite: b05-orientaldaily-2021-11-04-zhang
    - voice: zh
      quote: true
      text: “严肃、低调、不苟言笑”是中国媒体上为数不多的关于他的描述之一。
      cite: b05-nytcn-2021-11-25-zhang
    - voice: west
      quote: true
      text: >-
        In good conscience, I don’t see how I can ask our athletes to compete there when Peng Shuai is not allowed to communicate freely and has seemingly been pressured to contradict her allegation of sexual assault.
      zh: 凭良心说，在彭帅不能自由沟通、似乎被迫否认其性侵指控的情况下，我不知道怎么能让我们的球员去那里比赛。（WTA 主席史蒂夫·西蒙）
      cite: b05-guardian-2021-12-01-wta
  family:
    - name: 康洁
      rel: 妻子
      text: >-
        彭帅 2021 年 11 月的微博帖文称，张高丽与妻子康洁一起带她去了他们家（BBC 中文转引帖文原文）。官方从未就此作出说明。
      cites: [e04-bbc-2021-11-03-peng-shuai, b05-nytcn-2021-11-25-zhang]
    - name: Lee Shing Put
      rel: 女婿
      text: >-
        2016 年 4 月“巴拿马文件”曝光后，国际调查记者同盟（ICIJ）报道，张高丽的女婿 Lee Shing Put 曾是三家英属维尔京群岛公司的股东：Zennon Capital Management、Sino Reliance Networks Corporation 和 Glory Top Investments Ltd。《卫报》同日指出，文件中没有任何内容表明相关政治人物在其亲属关联的公司中拥有实益权益。
      cites: [b01-icij-2016-04-06-red-nobility, b01-guardian-2016-04-06-red-nobility]
  cites: [b05-gov-2013-03-16-zhang-gaoli-resume, b05-orientaldaily-2021-11-04-zhang, e04-bbc-2021-11-03-peng-shuai, b05-nytcn-2021-11-25-zhang, b05-jamestown-2010-energy-faction, b05-zaobao-2026-08-17-jiang-centenary, wd-Q197180]

- id: li-zhanshu
  name: 栗战书
  pinyin: Lì Zhànshū
  gender: m
  ethnicity: 汉族
  born: 1950-08-30
  birthplace: 河北平山
  education:
    - { school: 河北师范大学夜大学政教系, from: 1980, to: 1983 }
    - { school: 哈尔滨工业大学高级管理人员工商管理专业, degree: 高级工商管理硕士, from: 2005, to: 2007 }
