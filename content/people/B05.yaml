      zh: 这是共产党领导人第一次利用媒体公开表达相互竞争的地区发展愿景。（《中国故事》年鉴 2012，谈“蛋糕之争”）
      cite: b05-chinastory-2012-cake
  family:
    - name: 父亲（未具名）
      rel: 父亲
      text: >-
        李成写道，汪洋出身寒微，父亲在他幼年去世；作为长子，他 17 岁就开始工作，帮母亲养家。
      cites: [f01-brookings-2017-new-politburo]
  cites: [b05-xinhua-2018-03-14-wang-yang-resume, f01-brookings-2017-new-politburo, b05-rfi-2011-07-15-cake, b05-chinastory-2012-cake, b05-zaobao-2022-10-22-wang-yang-exit, b05-voa-2022-10-22-congress, wd-Q734914]

- id: wang-huning
  name: 王沪宁
  pinyin: Wáng Hùníng
  gender: m
  ethnicity: 汉族
  born: 1955-10-06
  birthplace: 上海
  origin: 山东莱州
  education:
    - { school: 上海师范大学干校外语培训班, from: 1972, to: 1977 }
    - { school: 复旦大学国际政治系国际政治专业, degree: 法学硕士, from: 1978, to: 1981 }
  joinedParty: 1984-04
  joinedWork: 1977-02
  roles: [psc, pb, sec, cc, scholar]
  status: active
  statusNote: 二十届中央政治局常委，2023 年 3 月起任十四届全国政协主席；2026 年 9 月 24 日仍主持全国政协主席会议。
  tier: 1
  headline: 中共中央政治局常委（2017– ）、全国政协主席（2023– ）
  ids: { wikidata: Q64543 }
  factions:
    - f: jiang-shanghai
      cite: f01-brookings-2017-new-politburo
      quote: >-
        In the late 1980s, he established his patron-mentor relationship with Jiang Zemin and Zeng Qinghong, who were then top leaders in Shanghai, and thus he earned membership in the “Shanghai Gang.”
      zh: 1980 年代末，他与当时主政上海的江泽民、曾庆红建立了师承关系，因此被视为“上海帮”的一员。
  bio: >-
    复旦大学政治学教授出身，1995 年被江泽民调进中央政策研究室，此后二十多年一直是中共最高层的理论与文稿起草者。外界普遍认为，江泽民的“三个代表”、胡锦涛的“科学发展观”和习近平的“新时代”提法都出自他手，中国网民称他为“国师”。
    他是十九届常委中唯一没有主政过地方的人：2017 年进入常委会分管党务和意识形态，2023 年起任全国政协主席并主持对台工作。1991 年出版的《美国反对美国》被看作他对美国看法的底本。
  positions:
    - { title: 复旦大学国际政治系主任, sys: other, place: 上海, from: 1989, to: 1994, cite: b05-xinhua-2017-10-25-wang-huning-resume }
    - { title: 复旦大学法学院院长, sys: other, place: 上海, from: 1994, to: 1995, cite: b05-xinhua-2017-10-25-wang-huning-resume }
    - { title: 中央政策研究室政治组组长, sys: party, from: 1995, to: 1998, cite: b05-xinhua-2017-10-25-wang-huning-resume }
    - { title: 中央政策研究室主任, sys: party, from: 2002, to: 2020-10, cite: wd-Q64543 }
    - { title: 中央书记处书记, sys: party, from: 2007, to: 2012, cite: b05-xinhua-2017-10-25-wang-huning-resume }
    - { title: 中央政治局委员, sys: party, from: 2012, to: 2017, cite: b05-xinhua-2017-10-25-wang-huning-resume }
    - { title: 中央全面深化改革领导小组办公室主任, sys: party, from: 2014, cite: b05-xinhua-2017-10-25-wang-huning-resume }
    - { title: 中央政治局常委, sys: party, from: 2017-10, cite: b05-xinhua-2017-10-25-wang-huning-resume }
    - { title: 全国政协主席, sys: other, from: 2023-03, cite: b05-gov-2023-03-10-wang-huning-cppcc }
  life:
    - h: 上海与复旦
      from: 1955
      to: 1989
      text: >-
        1955 年生于上海，籍贯山东莱州。1972–1977 年在上海师范大学干校外语培训班学习，之后在上海市出版局当干部。1978 年考入复旦大学国际政治系读研究生，1981 年留校任教，很快升为教授。
        《纽约客》写道，1980 年代他参与提出“新权威主义”，在 1986 年一份在高层引起连串争论的报告里，主张为推进市场改革而对中央权力作“必要的集中”。
      cites: [b05-xinhua-2017-10-25-wang-huning-resume, b05-newyorker-wang-huning, wd-Q64543]
    - h: 《美国反对美国》
      from: 1988
      to: 1995
      text: >-
        1980 年代末他以访问学者身份赴美，写成书名看似矛盾的《美国反对美国》，详述美国社会的种种矛盾。《伦敦书评》说书中记录了旧金山街头的流浪者，也赞叹信用卡、智库和州际公路；《纽约客》说这本书奠定了他作为民主制度分析者的地位，今天的中国读者把他看作最早看穿“美国例外论”的人之一。
        1989 年起任复旦国际政治系主任，1994 年任法学院院长，还曾率复旦辩论队击败台湾大学。
      cites: [b05-bbc-2017-11-wang-huning-op, b05-lrb-2023-wang-huning, b05-newyorker-wang-huning, b05-xinhua-2017-10-25-wang-huning-resume]
    - h: 进京
      from: 1995
      to: 2002
      text: >-
        1995 年，40 岁的他由江泽民钦点进京，出任中央政策研究室政治组组长，1998 年升副主任，2002 年任主任。李成说，他 1980 年代末就与当时主政上海的江泽民、曾庆红建立了师承关系，因此被视为“上海帮”成员。
        《联合早报》说，从步入政坛起，这位学者就从公众视野中消失，也渐渐跟学界断了来往，名字通常只出现在官媒通稿的最后一句。
      cites: [b05-bbc-2017-10-25-psc-profiles, f01-brookings-2017-new-politburo, b05-zaobao-2017-10-24-wang-huning, b05-xinhua-2017-10-25-wang-huning-resume]
    - h: 三朝文胆
      from: 2002
      to: 2012
      text: >-
        胡锦涛时期他继续任政研室主任，常随胡锦涛出访，李成说他被认为是江、胡之间的非正式沟通渠道。2007 年进入中央书记处，2012 年十八大进入政治局。
        《联合早报》说他直接参与、起草了“三个代表”“科学发展观”和“新时代中国特色社会主义”等重大论述；《伦敦书评》也写道，他被认为塑造了最近三位领导人的意识形态，“三个代表”据说就是他的表述。
      cites: [f01-brookings-2017-new-politburo, b05-zaobao-2017-10-24-wang-huning, b05-lrb-2023-wang-huning, b05-xinhua-2017-10-25-wang-huning-resume]
    - h: 习近平身边
      from: 2012
      to: 2017
      text: >-
        习近平第一个任期里，他几乎参加了所有重要的国内外行程，与中办主任栗战书一起被称为习近平的“哼哈二将”。2014 年起兼任中央全面深化改革领导小组办公室主任。
        《伦敦书评》说，习近平自 2012 年起用来概括其执政的“中国梦”一词，据说也是他想出来的。《纽约客》则说，国际媒体常把他描绘成现代马基雅维利、“织梦者”或拉斯普京式的幕后人物，并形容他以笔为炉，把马克思主义的语汇熔铸成习近平思想。
      cites: [f01-brookings-2017-new-politburo, b05-zaobao-2017-10-23-li-zhanshu, b05-xinhua-2017-10-25-wang-huning-resume, b05-lrb-2023-wang-huning, b05-newyorker-wang-huning]
    - h: 常委
      from: 2017
      to: 2022
      text: >-
        2017 年十九大进入政治局常委会，排名第五，任中央书记处书记、中央文明委主任，《联合早报》预计他分管党务与意识形态；政研室主任一职他一直兼到 2020 年。
        BBC 中文刊发的澳大利亚格里菲斯大学学者王毅的评论说，他的影响力“不着迹但无所不在”，靠理念和说服力，而不是强人政治常见的强硬态度。
      cites: [b05-xinhua-2017-10-25-wang-huning-resume, b05-zaobao-2017-10-25-seven, b05-bbc-2017-11-wang-huning-op, wd-Q64543]
    - h: 政协主席
      from: 2022
      to: 2026
      text: >-
        2022 年二十大，67 岁的他留在中央委员会并连任常委。2023 年 3 月当选十四届全国政协主席，卸任的汪洋在会场起立与他握手。
        2026 年 2 月他出席对台工作会议并讲话，要求坚持一个中国原则和“九二共识”、坚决打击“台独”分裂势力、反对外部势力干涉，同时扩大两岸民间和基层交流；会议由王毅主持。9 月 24 日他主持全国政协第五十六次主席会议，部署学习习近平的近期讲话，并决定 11 月上旬召开全国政协常委会会议。
      cites: [b09-bbc-2022-10-22-20th-close, b05-gov-2023-03-10-wang-huning-cppcc, b05-xinhua-2026-02-10-wang-huning-taiwan, b05-xinhua-2026-09-24-wang-huning-cppcc]
  assess:
    - voice: scholar
      quote: true
      text: >-
        Wang Huning is one of only a few leaders unanimously favored by the three most recent party bosses: Jiang Zemin, Hu Jintao, and Xi Jinping.
      zh: 王沪宁是少数同时受到最近三任党的总书记江泽民、胡锦涛、习近平一致青睐的领导人之一。（布鲁金斯学会，李成）
      cite: f01-brookings-2017-new-politburo
    - voice: west
      quote: true
      text: >-
        He helped pen the main slogans of three Chinese Presidents: Jiang Zemin’s “Three Represents,” Hu Jintao’s “Scientific Outlook on Development,” and, most recently, Xi Jinping’s “new era” of global ascendency.
      zh: 他参与执笔了三位中国国家主席的主要口号：江泽民的“三个代表”、胡锦涛的“科学发展观”，以及最近习近平走向全球崛起的“新时代”。（《纽约客》）
      cite: b05-newyorker-wang-huning
    - voice: scholar
      quote: true
      text: 他被称为江泽民“三个代表”、胡锦涛“科学发展观”及习近平“中国梦”意识形态的幕后军师。
      cite: b05-bbc-2017-11-wang-huning-op
    - voice: zh
      quote: true
      text: 如今，北京的观察家们早已不再纠结王沪宁到底是左还是右了，他的形象是学者，智囊，见识广，有国际视野。
      cite: b05-zaobao-2017-10-24-wang-huning
  cites: [b05-xinhua-2017-10-25-wang-huning-resume, f01-brookings-2017-new-politburo, b05-zaobao-2017-10-24-wang-huning, b05-bbc-2017-11-wang-huning-op, b05-newyorker-wang-huning, b05-lrb-2023-wang-huning, b05-xinhua-2026-09-24-wang-huning-cppcc, wd-Q64543]

- id: zhao-leji
  name: 赵乐际
  pinyin: Zhào Lèjì
  gender: m
  ethnicity: 汉族
  born: 1957-03-08
  birthplace: 青海西宁
  origin: 陕西西安
  education:
    - { school: 北京大学哲学系哲学专业, from: 1977, to: 1980 }
    - { school: 中央党校在职研究生班政治学专业, from: 2002, to: 2005 }
  joinedParty: 1975-07
  joinedWork: 1974-09
  roles: [psc, pb, sec, cc, ccdi, prov]
  status: active
  statusNote: 二十届中央政治局常委，2023 年 3 月起任十四届全国人大常委会委员长；2026 年 9 月仍在吉林、黑龙江调研。
  tier: 1
  headline: 中共中央政治局常委（2017– ）、中央纪委书记（2017–2022）、全国人大常委会委员长（2023– ）
  ids: { wikidata: Q127295 }
  factions:
    - f: shaanxi
      cite: f01-voa-2022-10-24-xi-jiajun
      quote: 现年65岁的赵乐际被一些观察家视为习近平的“陕西帮”成员，因为他们的家族都与陕西有关系。
  bio: >-
    在青海长大、籍贯陕西的官员，42 岁任青海省长、46 岁任省委书记，都是当时全国最年轻的。2007–2012 年主政陕西，随后进京任中组部部长五年，执行习近平第一任期的人事布局。
    2017 年以 60 岁成为十九届最年轻的常委，接掌中央纪委五年，任内立案审查调查中管干部 261 人。2022 年连任常委，2023 年起任全国人大常委会委员长。外界把他归入习近平的“陕西帮”；他在陕西任内的秦岭违建别墅问题曾引起舆论猜测。
  positions:
    - { title: 青海省副省长, sys: gov, place: 青海, from: 1994, to: 1997, cite: b05-xinhua-2017-10-25-zhao-leji-resume }
    - { title: 西宁市委书记, sys: party, place: 青海, from: 1997, to: 1999, cite: b05-xinhua-2017-10-25-zhao-leji-resume }
    - { title: 青海省省长, sys: gov, place: 青海, from: 1999, to: 2003, cite: b05-xinhua-2017-10-25-zhao-leji-resume }
    - { title: 青海省委书记, sys: party, place: 青海, from: 2003, to: 2007, cite: b05-xinhua-2017-10-25-zhao-leji-resume }
    - { title: 陕西省委书记, sys: party, place: 陕西, from: 2007, to: 2012, cite: b05-xinhua-2017-10-25-zhao-leji-resume }
    - { title: 中央政治局委员、中央书记处书记, sys: party, from: 2012, to: 2017, cite: b05-xinhua-2017-10-25-zhao-leji-resume }
    - { title: 中央组织部部长, sys: party, from: 2012, to: 2017, cite: b05-xinhua-2017-10-25-zhao-leji-resume }
    - { title: 中央政治局常委, sys: party, from: 2017-10, cite: b05-xinhua-2017-10-25-zhao-leji-resume }
    - { title: 中央纪律检查委员会书记, sys: party, from: 2017-10, to: 2022-10, cite: wd-Q127295 }
    - { title: 全国人大常委会委员长, sys: gov, from: 2023-03, cite: b05-gov-2023-03-10-zhao-leji-npc }
  life:
    - h: 青海知青与北大
      from: 1957
      to: 1980
      text: >-
        1957 年生于青海西宁，籍贯陕西西安。李成写道，他父亲是西安人，曾任厅级干部；另有未经证实的说法称，习近平的父亲习仲勋与赵父是好友。
        1974 年他在青海贵德县河东乡当知青，1975 年入党，任青海省商业厅通讯员，1977–1980 年在北京大学哲学系读书。李成说他至今说话仍带浓重的陕西口音。
      cites: [b05-xinhua-2017-10-25-zhao-leji-resume, f01-brookings-2017-new-politburo, wd-Q127295]
    - h: 青海仕途
      from: 1980
      to: 2007
      text: >-
        毕业后回到青海商业系统，历任省商业学校教师、商业厅副厅长、厅长，1993 年任省长助理兼财政厅长，1994 年升副省长，1997 年兼西宁市委书记。1999 年任代省长，2000 年任省长，2003 年任省委书记。
        《联合早报》指出，他 42 岁当省长、46 岁升省委书记，均为当时全国最年轻的省长和省委书记。
      cites: [b05-xinhua-2017-10-25-zhao-leji-resume, b05-zaobao-2017-10-25-seven]
    - h: 陕西
      from: 2007
      to: 2012
      text: >-
        2007 年调任陕西省委书记，次年兼省人大常委会主任。李成说，他的兄弟赵乐秦在陕西任职二十多年，在他出任陕西省委书记几个月后调往广西，2013 年 1 月任桂林市委书记。
        2019 年前陕西省委书记赵正永落马后，法广报道舆论怀疑此案与秦岭北麓违建别墅有关，并指出违建问题主要发生在赵乐际任书记、赵正永任省长期间，有官媒文章被指影射“二赵”。这些都是舆论猜测，没有官方结论涉及赵乐际。
      cites: [b05-xinhua-2017-10-25-zhao-leji-resume, f01-brookings-2017-new-politburo, b05-rfi-2019-01-16-zhao]
    - h: 中组部长
      from: 2012
      to: 2017
      text: >-
        2012 年十八大进入政治局和书记处，任中央组织部部长。《联合早报》说，作为掌握人事中枢的中组部长，他五年来积极执行习近平的人事布局，成效大体实现了习近平的设想；也有舆论指，他与习近平同属陕西籍，使他的升迁机会大幅提高。李成写道，有分析人士称他是习近平“陕西帮”的“代言人”。
      cites: [b05-xinhua-2017-10-25-zhao-leji-resume, b05-zaobao-2017-10-25-seven, f01-brookings-2017-new-politburo]
    - h: 中纪委书记
      from: 2017
      to: 2022
      text: >-
        2017 年十九大以 60 岁成为最年轻的常委，出任中央纪委书记。2020 年 1 月他在中纪委全会的工作报告中说“腐败是我们党面临的最大威胁”，要求一体推进不敢腐、不能腐、不想腐。
        十九届中纪委向二十大的报告称，五年来“中央纪委国家监委立案审查调查中管干部261人”，全国纪检监察机关共立案 306.6 万件。美国之音评论说，他协助习近平通过大规模反腐运动铲除异己，并在官员中制造对习近平的敬畏与忠诚。
      cites: [b05-zaobao-2017-10-25-seven, b05-ccdi-2020-01-zhao-leji-report, b05-saac-2022-10-ccdi-report, f01-voa-2022-10-24-xi-jiajun]
    - h: 2019 年的成绩单与陕西旧案
      from: 2019
      to: 2020
      text: >-
        他在 2020 年 1 月的报告里列出 2019 年的数字：中央纪委国家监委立案审查调查中管干部 45 人，全国纪检监察机关立案 61.9 万件、处分 58.7 万人，10357 人主动投案。
        报告点名查处赵正永、秦光荣、孟宏伟等“两面派、两面人”，并要求各地区各部门汲取秦岭北麓西安境内违建别墅问题的深刻教训。法广指出，赵正永正是他主政陕西时的省长搭档，违建别墅问题也主要发生在两人共事期间。
      cites: [b05-ccdi-2020-01-zhao-leji-report, b05-rfi-2019-01-16-zhao]
    - h: 委员长
      from: 2022
      to: 2026
      text: >-
        2022 年二十大，65 岁的他是三位留任的常委之一。2023 年 3 月当选十四届全国人大常委会委员长。2024 年 4 月率中国党政代表团访问朝鲜，出席“中朝友好年”开幕式，并在平壤会见金正恩。
        2026 年 3 月 9 日他向十四届全国人大四次会议作常委会工作报告，称过去一年共审议法律、法律解释和决定草案 40 件，通过 24 件。9 月 21 日至 24 日他在吉林、黑龙江调研。
      cites: [f01-voa-2022-10-24-xi-jiajun, b05-gov-2023-03-10-zhao-leji-npc, b05-xinhua-2024-04-13-zhao-kim, b05-gov-2026-03-15-npc-report, b05-xinhua-2026-09-24-zhao-leji-jilin]
  assess:
    - voice: zh
      quote: true
      text: 他因此也成为习近平的亲信之一，协助习近平通过大规模的反腐运动，不仅铲除异己，而且在众多官员中制造对习近平的敬畏与忠诚。
      cite: f01-voa-2022-10-24-xi-jiajun
    - voice: scholar
      quote: true
      text: Some analysts have characterized him as the “spokesperson” of Xi Jinping’s Shaanxi Gang.
      zh: 一些分析人士把他形容为习近平“陕西帮”的“代言人”。（布鲁金斯学会，李成）
      cite: f01-brookings-2017-new-politburo
    - voice: zh
      quote: true
      text: 作为掌握人事中枢的中组部部长，赵乐际过去五年积极执行总书记习近平的人事布局，他的工作成效大体实现了习近平的设想。
      cite: b05-zaobao-2017-10-25-seven
  family:
    - name: 赵乐秦
      rel: 兄弟
      text: >-
        李成写道，赵乐秦在陕西任职二十多年，历任山阳县委书记、陕西省交通厅副厅长、汉中市长；赵乐际出任陕西省委书记几个月后他调往广西，2013 年 1 月任桂林市委书记，是十九大代表。
      cites: [f01-brookings-2017-new-politburo]
    - name: 父亲（未具名）
      rel: 父亲
      text: >-
        据李成，赵乐际的父亲是西安人，曾任厅级干部；有未经证实的说法称他与习仲勋是好友。
      cites: [f01-brookings-2017-new-politburo]
  cites: [b05-xinhua-2017-10-25-zhao-leji-resume, b05-zaobao-2017-10-25-seven, f01-brookings-2017-new-politburo, f01-voa-2022-10-24-xi-jiajun, b05-saac-2022-10-ccdi-report, b05-gov-2026-03-15-npc-report, wd-Q127295]
