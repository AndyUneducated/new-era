  name: 张高丽
  pinyin: Zhāng Gāolì
  gender: m
  ethnicity: 汉族
  born: 1946-11
  birthplace: 福建晋江
  education:
    - { school: 厦门大学经济系计划统计专业, from: 1965, to: 1970 }
  joinedParty: 1973-12
