    - { title: 中央国家安全委员会办公室主任, sys: party, from: 2014, to: 2018, cite: b05-xinhua-2018-03-17-li-zhanshu-resume }
    - { title: 中央政治局委员、中央书记处书记, sys: party, from: 2012, to: 2017, cite: b05-xinhua-2018-03-17-li-zhanshu-resume }
    - { title: 中央政治局常委, sys: party, from: 2017-10, to: 2022-10, cite: b05-zaobao-2017-10-25-seven }
    - { title: 全国人大常委会委员长, sys: gov, from: 2018-03, to: 2023-03, cite: b05-xinhua-2018-03-17-li-zhanshu-resume }
  life:
    - h: 河北起步
      from: 1950
      to: 1985
      text: >-
        1950 年生于河北平山。1971 年进入石家庄地区财贸学校读物价专业，1972 年参加工作，在石家庄地区商业局、地委办公室任职，业余读完河北师范大学夜大学政教系。1983–1985 年任无极县委书记。
        《联合早报》写道，习近平当时就在毗邻的正定县任县委书记，两人工作上有交集、为人处世理念相契合；这两年被外界视为判断他属于习近平嫡系的主要依据。布鲁金斯学会的李成也说，两人从那时起建立了良好的工作关系。
      cites: [b05-xinhua-2018-03-17-li-zhanshu-resume, b05-zaobao-2017-10-23-li-zhanshu, f01-brookings-2017-new-politburo]
    - h: 团省委与河北
      from: 1985
      to: 1998
      text: >-
        1985 年任石家庄地委副书记、行署专员，1986–1990 年任共青团河北省委书记，之后任承德地委副书记、行署专员，1993 年进入河北省委常委会任秘书长，1997 年改任省委农村工作领导小组副组长。
        因为有团省委书记的经历，法广 2012 年引资料称他“是团派人马”，得到胡锦涛支持；但同一篇报道也说他与习近平熟稔，是双方都能接受的人选。
      cites: [b05-xinhua-2018-03-17-li-zhanshu-resume, b05-rfi-2012-09-02-li-zhongban]
    - h: 陕西
      from: 1998
      to: 2003
      text: >-
        1998 年调任陕西省委常委，2000 年任省委组织部部长，2002 年任西安市委书记，同年升省委副书记。
        《联合早报》引香港《明报》称，他出身中共革命家庭，属“红二代”，祖辈与习近平的母亲齐心有渊源；2000 年 6 月，时任陕西省委常委的他陪同齐心、习近平的姐姐习桥桥和弟弟习远平拜谒渭北革命烈士纪念碑。李成则说，他被普遍视为“陕西帮”的一员，而陕西帮是习近平最重要的权力基础。
      cites: [b05-xinhua-2018-03-17-li-zhanshu-resume, b05-zaobao-2017-10-23-li-zhanshu, f01-brookings-2017-new-politburo]
    - h: 黑龙江与贵州
      from: 2003
      to: 2012
      text: >-
        2003 年调任黑龙江省委副书记，2004 年兼副省长，其间在哈尔滨工业大学读完高级管理人员工商管理课程，获高级工商管理硕士学位。2007 年任代省长，2008–2010 年任省长。
        2010 年调任贵州省委书记，第一次成为一省的党委一把手，2012 年兼省人大常委会主任。同年调回北京任中办主持常务工作的副主任，起初仍兼任贵州省人大常委会主任。
      cites: [b05-xinhua-2018-03-17-li-zhanshu-resume]
    - h: 中办主任
      from: 2012
      to: 2017
      text: >-
        2012 年 9 月十八大前夕，胡锦涛的心腹令计划突然被免去中办主任，由栗战书接任，成为即将接班的习近平的“大内总管”。十八大后他进入政治局和书记处，2014 年起兼任中央国家安全委员会办公室主任。
        《联合早报》说他自称“不整人、不耍滑、不偷懒”，令计划落马后对中办全面整顿；习近平出巡出访总能看到他和王沪宁的身影，两人被称为习近平的“哼哈二将”。
      cites: [b05-rfi-2012-09-02-li-zhongban, b05-xinhua-2018-03-17-li-zhanshu-resume, b05-zaobao-2017-10-23-li-zhanshu]
    - h: 委员长
      from: 2017
      to: 2022
      text: >-
        2017 年十九大进入政治局常委会，排名第三，2018 年 3 月当选十三届全国人大常委会委员长。他在闭幕会上称习近平是“全党拥护、人民爱戴、当之无愧的党的核心、军队统帅、人民领袖”和国家的“掌舵者”。
        BBC 中文同时提到，2017 年 7 月《南华早报》曾刊登暗示其家人敛财的文章，但次日即删除并郑重道歉。
      cites: [b05-zaobao-2017-10-25-seven, b05-xinhua-2018-03-17-li-zhanshu-resume, b05-bbc-2018-03-20-li-zhanshu-npc]
    - h: 访俄与卸任
      from: 2022
      to: 2026
      text: >-
        2022 年 9 月访问俄罗斯。德国之声报道，有消息显示他在莫斯科说中方对俄罗斯在核心利益问题上“表示充分的理解和支持”，称“俄罗斯被逼到了墙角，为维护国家核心利益而采取了一次反击”；《纽约时报》认为这是北京迄今对俄乌战争最明确的支持，而新华社的报道只提到台湾问题和立法交流。
        同年 10 月二十大，72 岁的他未进入新一届中央委员会，2023 年 3 月卸任。此后仍以退休元老身份出席 2025 年九三阅兵和 2026 年 8 月的江泽民诞辰百年纪念大会。
      cites: [b05-dw-2022-09-li-russia, b09-bbc-2022-10-22-20th-close, b05-zaobao-2025-09-03-parade, b05-zaobao-2026-08-17-jiang-centenary]
  assess:
