- id: li-zuocheng
  name: 李作成
  pinyin: Lǐ Zuòchéng
  gender: m
  ethnicity: 汉族
  born: 1953-10
  birthplace: 湖南安化
  education:
    - { school: 广西师范大学马克思主义理论与思想政治教育专业, degree: 研究生 }
  joinedParty: 1972
  joinedWork: 1970-12
  roles: [cmc, cc, general]
  status: retired
  statusNote: 2022 年 10 月二十大后卸任中央军委委员、联合参谋部参谋长，退休；2026 年 9 月仍出席国庆招待会。
  tier: 1
  headline: 中央军委联合参谋部参谋长（2017–2022）、首任陆军司令员
  bio: >-
    1979 年对越作战的战斗英雄，带全连血战 26 个昼夜，连队被命名为“尖刀英雄连”，29 岁就入选中共十二大主席团。此后在广西边防和第 41 集团军一路做到 45 岁的全军最年轻集团军军长，却在正军级停留近 10 年。
    习近平掌军后他快速上升：2013 年以非中央委员身份出任成都军区司令员，2015 年晋上将，年底任新组建的陆军首任司令员，2017 年接替落马的房峰辉任联合参谋部参谋长并进入中央军委。
    任内他代表军方宣示对台“不承诺放弃使用武力”，也是美军参联会主席米利 2020–2021 年两次秘密致电的中方对象。2022 年二十大到龄退出军委。
  positions:
    - { title: 第 41 集团军军长, sys: army, from: 1998-04, to: 2002-01, cite: c02-wiki-li-zuocheng }
    - { title: 广州军区副参谋长, sys: army, from: 2002-01, to: 2007-12, cite: c02-wiki-li-zuocheng }
    - { title: 成都军区副司令员, sys: army, from: 2007-12, to: 2013-07, cite: b21-caixin-2013-08-06-li-chengdu }
    - { title: 成都军区司令员, sys: army, from: 2013-07, to: 2015-12, cite: b21-people-2013-07-10-li-chengdu }
    - { title: 陆军司令员, sys: army, from: 2015-12, to: 2017-08, cite: b21-gxnu-2016-01-04-li-army }
    - { title: 中央军委联合参谋部参谋长, sys: army, from: 2017-08, to: 2022-10, cite: b21-rfi-2017-08-28-li-joint-staff }
    - { title: 中央军委委员, sys: army, from: 2017-10, to: 2022-10, cite: c02-xinhua-2017-10-25-19-1-plenum }
  life:
    - h: 尖刀英雄连
      from: 1953
      to: 1979
      text: >-
        1953 年 10 月生于湖南安化，1970 年 12 月入伍，1972 年入党。1979 年对越自卫还击战时，他是广西军区边防独立师 3 团 8 连连长，率连队与敌血战 26 昼夜。他后来在演讲里说，全连和兄弟连队一起“共毙敌194人”，连队被中央军委授予“尖刀英雄连”称号，25 岁的他被记一等功并获“战斗英雄”称号。
        一名 41 集团军老兵说他打仗不要命，“有湖南人的霸蛮，有湘军的血性”；他自己回忆曾用左手抓住敌人发烫的枪管、右手提冲锋枪射击，击毙敌人后才发现抓枪管的手烫满血泡；右臂被子弹打穿，顾不上包扎仍继续战斗。
      cites: [b21-gxnu-2016-01-04-li-army, b21-hunantoday-2017-08-li, b21-people-2013-07-10-li-chengdu]
    - h: 英模与边防
      from: 1980
      to: 1997
      text: >-
        战后他作为作战英模报告团成员在全国巡回演讲，1982 年 29 岁入选中共十二大主席团。他在演讲中讲到 1984 年东兴镇炮战，全团官兵在灌满水的猫耳洞里蹲了一个多月。
        此后逐级任营长、团长、师参谋长，1991 年任广州军区守备第三师师长，1992 年 12 月该师撤销后任第 41 集团军步兵第 123 师师长，1994 年率部抗击广西洪灾；1995 年被评为全国“百佳公仆”，升副军长，1997 年授少将。
      cites: [b21-gxnu-2016-01-04-li-army, b21-people-2013-07-10-li-chengdu, c02-wiki-li-zuocheng]
    - h: 正军级十年
      from: 1998
      to: 2012
      text: >-
        1998 年 4 月，45 岁的他接替欧金谷任第 41 集团军军长，是当时全军最年轻的集团军军长，同年率部转战湖南、湖北抗洪。
        此后他在正军级“原地踏步”近 10 年：2002 年任广州军区副参谋长，2007 年底首次跨大军区调任成都军区副司令员，成为当时唯一被授予过“战斗英雄”称号的大军区副司令员，2009 年晋中将。界面新闻转述有人透露的说法，他遭遇瓶颈的重要原因是一身正气、不搞“歪门斜道”。
      cites: [b21-caixin-2013-08-06-li-chengdu, b21-jiemian-2015-12-li-army, c02-wiki-li-zuocheng]
    - h: 成都军区与陆军
      from: 2013
      to: 2017
      text: >-
        2013 年 7 月，并非中央委员或候补委员的他接替到龄的李世明任成都军区司令员，在副大军区职上待了五年半后一步跨到正职，标志十八大后七大军区主官调整完成；8 月《西藏日报》报道他在拉萨视察民兵训练，内地官媒首次确认这一任命。2015 年 7 月 31 日在八一大楼由习近平颁发命令状晋上将，界面新闻称他由此成为 38 位现役上将之一。
        同年 12 月 31 日，习近平在八一大楼向新成立的陆军领导机构授旗，他成为首任陆军司令员。法广评论称，2013 年起他在习近平器重下连串高升，成为“习近平军中改革的重要左右手”。
      cites: [b21-people-2013-07-10-li-chengdu, b21-caixin-2013-08-06-li-chengdu, c02-wiki-li-zuocheng, b21-jiemian-2015-12-li-army, b21-gxnu-2016-01-04-li-army, b21-rfi-2017-08-28-li-joint-staff]
    - h: 联合参谋部参谋长
      from: 2017-08
      to: 2020
      text: >-
        2017 年 8 月房峰辉被带走调查，他接任中央军委联合参谋部参谋长，掌管作战计划、战略、后勤和训练；10 月当选十九届中央委员并进入中央军委，2018 年 3 月任国家军委委员。
        2020 年 5 月《反分裂国家法》实施 15 周年座谈会上，他说如果和平统一的可能性完全丧失，人民军队将“采取一切必要措施”，又说“我们不承诺放弃使用武力，保留采取一切必要措施的选项”。
      cites: [b21-rfi-2017-08-28-li-joint-staff, c02-wiki-li-zuocheng, c02-xinhua-2017-10-25-19-1-plenum, b21-gwytb-2020-05-29-li-taiwan]
    - h: 米利的电话
      from: 2020-10
      to: 2022-07
      text: >-
        据美联社和 BBC 转述的新书内容，美军参联会主席米利在 2020 年 10 月 30 日大选前四天和 2021 年 1 月 8 日国会山骚乱两天后，两次致电李作成，保证美国不会突然对华开战；第二通电话里米利说“民主有时候就是有点乱”，书中称李作成“仍有些不安”。
        2022 年 7 月，他与米利视频通话时说，中方在事关国家核心利益问题上“没有任何妥协退让的余地”，要求美方停止美台军事勾连。
      cites: [b21-ap-2021-09-14-milley, b21-bbc-2021-09-15-milley-li, b21-mod-2022-07-08-li-milley]
    - h: 退休
      from: 2022-10
      to: 2026
      text: >-
        2022 年 10 月二十大，69 岁的他与许其亮、魏凤和一起届龄退出中央军委。美国之音称新入军委的刘振立是“循现任军委联合参谋部参谋长李作成的模式升迁”，也可望接任他的参谋长一职。
        据联合早报，他缺席了 2026 年 8 月 17 日的江泽民诞辰 100 周年大会，但 9 月 30 日仍出席国庆招待会。
      cites: [b21-voa-2022-10-23-cmc, b21-zaobao-2026-09-30-reception]
  assess:
    - voice: official
      quote: true
      text: 李作成这个名字，可谓家喻户晓。
      cite: b21-gxnu-2016-01-04-li-army
    - voice: official
      quote: true
      text: 曾有人透露，李作成遭遇“瓶颈”的重要原因，是一身正气，不搞“歪门斜道”。
      cite: b21-jiemian-2015-12-li-army
    - voice: zh
      quote: true
      text: 自2013年开始，在习近平的器重之下，李作成连串高升，当年他被任命为前成都军区司令员，2015年晋升为上将，成为了习近平军中改革的重要左右手。
      cite: b21-rfi-2017-08-28-li-joint-staff
    - voice: west
      quote: true
      text: Chairman of the Joint Chiefs of Staff Mark Milley told Gen. Li Zuocheng of the People’s Liberation Army that the United States would not strike.
      zh: 参谋长联席会议主席马克·米利告诉解放军的李作成上将，美国不会发动打击。
      cite: b21-ap-2021-09-14-milley
