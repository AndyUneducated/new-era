  life:
    - h: 忠县十五年
      from: 1947
      to: 1985
      text: >-
        1947 年 7 月生于南京，1964–1969 年在南京大学物理系声学专业学习，留校待分配一年后，1970 年分到四川省忠县水电局当电力股干部，1973–1979 年任县体委教练。1979 年 4 月入党，此后任县委宣传部理论教员、文教局副局长、文化局局长，1983 年任忠县县委副书记、县长。从 1970 年分配到忠县到 1985 年调往成都，他在这个川东县城工作了十五年，从电力股干部一路做到县长。
      cites: [c02-cyol-2012-11-16-18th-cvs]
    - h: 四川
      from: 1985
      to: 1993
      text: >-
        1985 年调任四川省委农村政策研究室副主任、省农村经济委员会副主任，1987 年任乐山市委副书记，1990 年升市委书记，1992 年进入四川省委常委，1993 年任省委副书记，同年调往西藏任自治区党委副书记。
        据万维读者网（传闻），一位采访过他的记者说他喜欢体育，会拉二胡，围棋下得不错，讲话稿干净简洁，除了特别正式的大会基本都即兴发言。
      cites: [c02-cyol-2012-11-16-18th-cvs, b21-creaders-2012-06-15-guo]
    - h: 西藏
      from: 1993
      to: 2004
      text: >-
        1994 年起任西藏自治区党委常务副书记，2000 年接替陈奎元任党委书记。BBC 报道，53 岁的他是在噶玛巴活佛出走印度后的紧张局势中上任的，首次讲话就表示会继续把打击分离主义活动放在首位。
        2001 年 7 月和平解放 50 周年大会上，他在胡锦涛率领的中央代表团面前说：“没有共产党，就没有新西藏。只有社会主义才能发展西藏。”万维读者网（传闻）称，正是这段经历让被视为胡锦涛人马的他踏上仕途快车道。
      cites: [c02-cyol-2012-11-16-18th-cvs, b21-bbc-2000-10-31-guo-tibet, b21-sina-2001-07-20-tibet-50, b21-creaders-2012-06-15-guo]
    - h: 安徽
      from: 2004-12
      to: 2007-11
      text: >-
        2004 年 12 月任安徽省委书记，2005 年起兼省人大常委会主任。据万维读者网（传闻），这是胡锦涛主政一年后把他调到自己的老家安徽；该文说他先任人大主任、后任书记，与官方简历顺序相反。2007 年 11 月 30 日，十七大刚开过，他调任北京市副市长、代市长，接替王岐山，同一文章称胡锦涛是把这位“爱将”调到了北京。
        当时距奥运会不到一年，据万维读者网（传闻），北京政坛有人为王岐山“喊冤”，说王在奥运来临之际离开，“如同操办了一场满汉全席，却眼睁睁地看着别人享用”。
      cites: [c02-cyol-2012-11-16-18th-cvs, p01-wiki-beijing-gov, b21-creaders-2012-06-15-guo]
    - h: 奥运市长
      from: 2008
      to: 2012-06
      text: >-
        2008 年 1 月正式当选北京市长，兼北京奥组委执行主席、党组副书记，负责奥运会城市运行，2009 年 8 月免去奥组委职务。此后近五年，北京的书记、市长一直是刘淇和他，据新唐人（传闻），香港《明报》当时援引北京消息说，考虑到施政连续性，刘淇将在十八大时退休，由市长郭金龙接替。据中央社，他任北京市长、市委书记期间曾赴台访问，与台湾政商界人士交流。
      cites: [c02-cyol-2012-11-16-18th-cvs, p01-wiki-beijing-gov, b21-ntdtv-2012-07-03-guo-liu, b21-cna-2018-07-18-guo-summit]
    - h: 暴雨中接班
      from: 2012-07
      to: 2012-11
      text: >-
        2012 年 7 月 3 日北京市委十一届一次全会选他接替刘淇任市委书记，他说要“满腔热忱地为人民群众排忧解难”。BBC 称据信他是胡锦涛的政治盟友，路透社分析这一任命可让胡锦涛交班后保留一定政治影响。
        7 月 21 日特大暴雨致近 40 人死亡，25 日北京市人大接受他辞去市长。学者高瑜认为这“实际是郭金龙进政治局的一个程序”，评论员张伟国则说胡锦涛多年把心腹推上此位，不可能让他因暴雨引咎辞职。11 月十八大他进入政治局。
      cites: [b21-ce-2012-07-03-liu-qi-out, b21-bbc-2012-07-03-guo-beijing, b21-bbc-2012-07-25-guo-mayor, b21-rfa-2012-07-26-beijing-rain, c02-xinhua-2012-11-15-18-1-plenum]
    - h: 疏解非首都功能
      from: 2014
      to: 2017
      text: >-
        习近平 2014 年 2 月视察北京后，京津冀协同发展成为国家战略。他把疏解非首都功能称为北京的必由之路，说“一个浮肿的巨人，必然是步履艰难，很难走远的”，“疏解非首都功能，我们没有退路！”
        2015 年 7 月他又说，北京的人口资源环境矛盾和“大城市病”已成为“我们不能释怀的最大焦虑”，强调 2300 万的人口控制目标是必须守住的底线，要加快通州市行政副中心建设。
      cites: [b21-people-2015-04-30-guo-no-retreat, b21-cntv-2015-07-13-guo-big-test]
    - h: 卸任与两岸
      from: 2017-05
      to: 2026
      text: >-
        2017 年 5 月 27 日，中央宣布他任中央精神文明建设指导委员会副主任，不再兼任北京市委书记，由蔡奇接任，新华社称这次调整是中央“通盘考虑、慎重研究决定的”。
        2018 年 7 月 18 日，两岸企业家峰会第 2 届会员大会由他出任陆方理事长。2025 年 12 月在南京年会上，他呼吁两岸企业家坚持“拉手”而不是“松手”，说“越是风高浪急，越要同舟共济”。2026 年 8 月 17 日，他以前政治局委员身份出席江泽民诞辰 100 周年纪念大会。
      cites: [b21-xinhua-2017-05-27-guo-cai, b21-cna-2018-07-18-guo-summit, b21-chinanews-2025-12-16-guo-summit, b17-zaobao-2026-08-17-jiang-centenary]
  assess:
    - voice: zh
      quote: true
      text: 据信，郭金龙是中国国家主席胡锦涛的政治盟友。
      cite: b21-bbc-2012-07-03-guo-beijing
    - voice: zh
      quote: true
      text: 張偉國認為，這樣做主要是因為胡錦濤已經花了很多年時間把心腹郭金龍推上現在這個位置，就是為了在十八大上讓他進常委，所以不可能因為北京暴雨死人而讓他引咎辭職。
      cite: b21-bbc-2012-07-25-guo-mayor
    - voice: zh
      quote: true
      text: 为了十八大进政治局，因为北京市书记肯定要进政治局，实际是郭金龙进政治局的一个程序
      cite: b21-rfa-2012-07-26-beijing-rain
    - voice: official
      quote: true
      text: 称这次调整是中央从大局出发，根据工作需要和北京市领导班子建设实际，通盘考虑、慎重研究决定的。
      cite: b21-xinhua-2017-05-27-guo-cai
  ids: { wikidata: Q1368232 }
  cites: [wd-Q1368232, c02-cyol-2012-11-16-18th-cvs, c02-xinhua-2012-11-15-18-1-plenum, b21-bbc-2012-07-03-guo-beijing, b21-xinhua-2017-05-27-guo-cai, b21-people-2015-04-30-guo-no-retreat]

