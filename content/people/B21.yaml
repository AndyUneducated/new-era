    - voice: scholar
      quote: true
      text: 这3名军官（马晓天、张海阳和刘源）全都是太子党。通过这一举措，胡锦涛向军方的太子党发出了一项重要讯息：他会像他的前任江泽民（也是太子党）一样照顾他们。
      cite: f04-brookings-2010-06-29-military
