      to: 1993
      text: >-
        1942 年 11 月生于江苏武进，1959–1964 年在北京钢铁学院冶金系学钢铁冶金，1964–1968 年读炼铁专业研究生。1968 年 6 月分配到武汉钢铁公司炼铁厂，在二高炉当了十年瓦斯工、炉前工、工长，1975 年 9 月入党。
        1978 年起任三高炉技术员、副炉长，1983 年升炼铁厂副厂长、公司生产部部长，1985 年任武钢第一副经理、公司党委常委，1990 年任经理。从入厂到调任部长，他在这家钢厂待了 25 年，职称是教授级高级工程师。
      cites: [c01-people-2013-12-06-liu-qi, b21-ce-2012-07-03-liu-qi-out]
    - h: 冶金部长
      from: 1993
      to: 1999
      text: >-
        1993 年出任冶金工业部部长、党组书记，是十四届中央候补委员、十五届中央委员。1996 年 12 月 31 日，他宣布当年全国钢产量突破一亿吨，产量达到世界第一位。
        1998 年 3 月他调任北京市委副书记、副市长，在市委书记贾庆林手下工作；1999 年 2 月接替贾庆林任北京市长，至 2003 年 1 月。
      cites: [c01-people-2013-12-06-liu-qi, e01-cpc-dsj-1996, b21-chinaorg-2007-05-23-liu-qi, p01-wiki-beijing-gov]
    - h: 市长
      from: 1999
      to: 2002
      text: >-
        2001 年起他兼任北京奥组委主席、党组副书记。美国国会研究处报告称，2002 年他途经旧金山前往盐湖城冬奥会时被法轮功学员起诉并送达法律文书，2004 年 12 月旧金山联邦地区法院裁定他因侵犯法轮功学员人权违反了美国、国际和中国法律，不享有主权豁免，原告未获赔偿。
        2002 年 6 月北京蓝极速网吧火灾致至少 24 人死亡后，他下令立即关闭全市网吧整顿。同年 10 月接替贾庆林任市委书记，11 月十六大进入政治局。
      cites: [b21-ce-2012-07-03-liu-qi-out, b21-crs-2006-falun-gong, e07-bbc-2002-06-16-lanjisu, p01-wiki-beijing-sec, c01-people-2013-12-06-liu-qi]
    - h: 非典
      from: 2003-01
      to: 2003-04
      text: >-
        2003 年 1 月孟学农接任市长。春天非典疫情在北京蔓延，4 月 20 日的全市领导干部大会上，中组部长贺国强宣布王岐山接替孟学农，批评北京“没有及时准确地上报疫情”，同时说王岐山将在以刘淇为“班长”的市委领导下工作。
        刘淇在会上承认信息不畅、疫情统计数字不准确、防治基础薄弱、切断传染链不力等问题，说：“我作为市委书记，负有领导责任，我诚恳地作自我批评。”他宣布由北京统管全市防治工作，要求二、三级医院实行首诊负责制，拒收病人的医院要坚决处分。他保住了书记职位。
      cites: [b21-sina-2003-04-21-beijing-cadres, p01-wiki-beijing-gov]
    - h: 北京反腐风波
      from: 2006
      to: 2007
      text: >-
        2006 年北京市政府高层腐败调查展开时，《纽约时报》报道，被视为调查可能目标的包括前北京市委书记、政治局常委贾庆林和现任书记刘淇，而到当时为止被牵涉的人几乎都被视为江泽民的亲信，或曾抵制胡锦涛的政策。
        新唐人（传闻）后来称，正因为“江泽民亲信刘淇”任北京市委书记，胡温一直难以对北京进行实际管控。调查没有触及他的职位，2007 年 5 月北京市委十届一次全会上他连任市委书记。新华社报道，他在会上说奥运会是中华民族的夙愿，并定下未来五年 GDP 年均增长 9%、人均 GDP 从 6000 美元提高到 1 万美元的目标。
      cites: [b21-nyt-2006-10-27-beijing-inquiry, b21-ntdtv-2012-07-03-guo-liu, b21-chinaorg-2007-05-23-liu-qi]
    - h: 北京奥运
      from: 2007
      to: 2008
      text: >-
        2007 年《时代》周刊把他列入年度百位最具影响力人物，序言提到他参加北京“排队日”，发起改变市民随地吐痰、学英语、保持厕所清洁的运动。2008 年 6 月他到朝阳区社区和信访部门调研，提出“平安奥运”重于泰山，要依靠群众“群防群治”，把每个社区都当作奥运非竞赛场馆，把社会矛盾化解在基层。
        8 月 8 日开幕式上，他致辞说“举办奥运会是中华儿女的百年梦想”，提到四川地震后国际社会的援助；24 日闭幕式上，他说 16 天里运动员打破 38 项世界纪录、85 项奥运会纪录，“熊熊燃烧的奥运圣火即将熄灭，但中国人民拥抱世界的热情之火将永远燃烧”。
      cites: [b21-bbc-2007-05-04-time100, b21-chinanews-2008-06-15-safe-olympics, b21-gmw-2008-08-09-liu-qi-opening, b21-cctv-2008-08-24-liu-qi-closing]
    - h: 交班
      from: 2012
      to: 2013
      text: >-
        据新唐人（传闻），香港《明报》此前援引北京消息称，考虑施政连续性，他将在十八大时退休，由市长郭金龙接替。2012 年 7 月 3 日北京市委十一届一次全会选出郭金龙任书记。7 月 12 日他首次以中央文明委副主任身份亮相，与中宣部长刘云山一同出席道德领域突出问题专项教育和治理座谈会；文明委主任是政治局常委李长春，这是一个议事机构。11 月十八大退出政治局。
        2013 年 12 月，在中央文明委指导下成立的中国志愿服务联合会经民政部批准登记，他任首任会长，此时官方已称他为“中央文明委原副主任”。
      cites: [b21-ntdtv-2012-07-03-guo-liu, b21-ce-2012-07-03-liu-qi-out, b21-cntv-2012-07-13-liu-qi-wenming, c01-people-2013-12-06-liu-qi]
