# B21: full biographies. Each entry below starts as the dossier card written in round 1 (C01/C02); expand it to tier 1.
- id: wu-shengli
  name: 吴胜利
  pinyin: Wú Shènglì
  gender: m
  ethnicity: 汉族
  born: 1945-08
  birthplace: 河北吴桥
  education:
    - { school: 中国人民解放军测绘学院海测系, from: 1964 }
  joinedWork: 1964-08
  roles: [cmc, cc, general]
  status: retired
  statusNote: 2017 年 1 月到龄卸任海军司令员，同年十九大退出中央军委。
  tier: 1
  headline: 海军司令员（2006–2017）、中央军委委员（2007–2017）
  bio: >-
    高级干部子弟，父亲吴宪做过杭州市委书记、浙江省副省长。1964 年考入解放军测绘学院后一辈子在海军，当过 8 年驱逐舰、护卫舰舰长，据 The Diplomat 还参加过 1988 年赤瓜礁海战。
    历任福建基地司令员、东海舰队副司令员、南海舰队司令员、副总参谋长，2006 年接替因健康原因离任的张定发任海军司令员，2007 年进入中央军委。
    十八大时同龄的军种将领都退了，他却留任，主政海军近 11 年，是仅次于萧劲光的任职最久的海军司令员；任内辽宁舰入列，南沙岛礁大规模建设，他是军方在南海问题上的强硬发言人。
    2017 年 1 月到龄卸任。退休后海外中文媒体屡传他被查、被审计（传闻），官方未通报。
  positions:
    - { title: 海军福建基地司令员, sys: army, from: 1997-10, to: 1999, cite: c01-people-2012-09-26-wu-shengli }
    - { title: 东海舰队副司令员, sys: army, from: 1999, to: 2002-01, cite: c01-people-2012-09-26-wu-shengli }
    - { title: 广州军区副司令员兼南海舰队司令员, sys: army, from: 2002-01, to: 2004-07, cite: c01-people-2012-09-26-wu-shengli }
    - { title: 副总参谋长, sys: army, from: 2004-07, to: 2006-08, cite: c01-people-2012-09-26-wu-shengli }
    - { title: 海军司令员, sys: army, from: 2006-08, to: 2017-01, cite: b21-thepaper-2017-01-20-wu-11-years }
    - { title: 中央军委委员, sys: army, from: 2007-10, to: 2017-10, cite: c01-people-2012-09-26-wu-shengli }
  factions:
    - f: princelings
      cite: b21-diplomat-2017-01-erickson-wu
      quote: Wu’s father’s status as a former vice governor of Zhejiang province, made the admiral, like Xi, one of China’s “princelings.”
  life:
    - h: 高干子弟
      from: 1945
      to: 1964
      text: >-
        1945 年 8 月生于河北吴桥。据《环球人物》，他“出生在一个中共高级干部家庭，父亲是位老革命”。维基百科记载，父亲吴宪参加过一二·九运动，1938 年入党，解放战争时任解放军第三十五军政治部主任，建国后历任杭州市委书记兼市长、浙江省委书记处书记、浙江省副省长和省政协副主席。
        1964 年 8 月，他从地方高考考入解放军测绘学院海测系，同时入伍，从此再没离开海军。
      cites: [c01-people-2012-09-26-wu-shengli, b21-wiki-wu-shengli]
    - h: 八年舰长
      from: 1968
      to: 1997
      text: >-
        毕业后他先后在 4 艘驱逐舰、护卫舰上任职，1974 年起历任水面舰艇副航海长、护卫舰副舰长和舰长、驱逐舰舰长，当了 8 年舰长。
        The Diplomat 2017 年的文章称，他参加过 1988 年 3 月 14 日中越赤瓜礁海战，因此是解放军海军中少有的有海上实战经历的将领；中国官方简历和《环球人物》的长篇介绍都没有提到这一段。
      cites: [c01-people-2012-09-26-wu-shengli, b21-wiki-wu-shengli, b21-diplomat-2017-02-pla-reshuffle]
    - h: 从东海到南海
      from: 1997
      to: 2006
      text: >-
        1997 年 10 月回到东海舰队任福建基地司令员，两年后升东海舰队副司令员。2002 年 1 月调任广州军区副司令员兼南海舰队司令员，2003 年晋海军中将。2004 年 7 月任副总参谋长。
        2006 年 8 月，由于时任海军司令员张定发的健康问题，由他接任。2007 年 7 月晋海军上将，同年十七届一中全会进入中央军委。
      cites: [c01-people-2012-09-26-wu-shengli, b21-thepaper-2017-01-20-wu-11-years]
    - h: 海军司令员
      from: 2006
      to: 2012
      text: >-
        据《环球人物》，出任海军司令员后，他加大海军武器装备自主创新力度，也注重引进国外先进技术，海军五大兵种逐步向信息化转型。2008 年底海军开始亚丁湾护航。
        2012 年 9 月 25 日，中国第一艘航空母舰辽宁舰交接入列，郭伯雄宣布舰名舷号，他在仪式上发言。十八大时，同龄的军种级将领都被要求退休，他却留任并连任军委委员；海军学者易思安（Andrew Erickson）认为，这显示领导层把海军现代化放在优先位置，也对他本人格外信任。
      cites: [c01-people-2012-09-26-wu-shengli, e02-ce-2012-09-25-liaoning, b21-diplomat-2017-01-erickson-wu]
    - h: 南海岛礁
      from: 2014
      to: 2016
      text: >-
        习近平时期，他是南沙岛礁建设的军方代言人。2016 年 1 月与美国海军作战部长理查德森视频通话时，他说永暑礁新机场的校验试飞是为了检验民航标准，岛礁上的防御设施不是军事化，“我们绝不会谋求岛礁军事化，但也绝不会不设防”。
        同年 7 月 18 日理查德森访华，他一口气说了五个“绝不会”，要美方“不要指望我们在领土主权上作出让步”，并说不管什么国家施加什么压力，“中方都会按计划推进并完成岛礁建设”。
      cites: [b21-xinhua-2016-01-20-wu-richardson, b21-cri-2016-07-18-wu-five-nevers]
    - h: 到龄卸任
      from: 2016-12
      to: 2017-10
      text: >-
        2016 年 12 月，他登上辽宁舰指导空中加油和空战对抗训练；2017 年 1 月 11 日辽宁舰编队绕台湾航行，易思安称这是他卸任前的“告别曲”。据《环球时报》，1 月 17 日他到龄退役，原南海舰队司令员沈金龙接任。从 2006 年 8 月算起，他主政海军近 11 年，是除首任司令员萧劲光外任职最长的海军司令员。这一年他步入 72 岁，已到军委委员最高任职年限，仍保留军委委员到 10 月十九大。
      cites: [b21-diplomat-2017-01-erickson-wu, b21-thepaper-2017-01-20-wu-11-years, b21-xinhua-2017-09-02-three-services]
    - h: 退休后的传闻
      from: 2015
      to: 2020
      text: >-
        据看中国（传闻），2015 年就有军纪委巡视组进驻海军大院、海军原政委刘晓江实名举报他贪腐的说法；日本共同社 2017 年 9 月报道他“涉嫌违纪”正在接受调查。据大纪元（传闻），党史学者高文谦在美国之音节目中称他退休“事出有因”；2020 年 6 月，红二代蔡小心在微博贴出一张“军队审计公告”照片，称军委审计署对他任海军司令员期间履行经济责任情况进行审计。
        看中国又称，2020 年国庆招待会的新闻联播画面里，他身穿白色海军制服出席。官方从未通报对他立案。
      cites: [b21-secretchina-2020-10-01-wu-reception, b21-epoch-2020-06-26-wu-audit]
  assess:
    - voice: official
      quote: true
      text: 这是海军成立以来除了首任海军司令员开国元勋萧劲光之外任职最长的海军司令员。
      cite: b21-thepaper-2017-01-20-wu-11-years
    - voice: scholar
      quote: true
      text: Wu’s retention in October 2012, when all other service-grade military leaders of his age were forced to retire, suggested both the Chinese leadership’s prioritization of naval modernization and its particular confidence in him.
      zh: 2012 年 10 月，所有同龄的军种级将领都被迫退休，吴胜利却得以留任，这既说明中国领导层把海军现代化放在优先位置，也说明对他本人格外信任。
      cite: b21-diplomat-2017-01-erickson-wu
    - voice: scholar
      quote: true
      text: Here Wu has made a name for himself that will be remembered and ultimately rediscovered by all who follow Chinese naval developments, in his case as a leading career-long naval officer who took his service far out to sea.
      zh: 吴胜利在这方面留下了自己的名字，所有关注中国海军发展的人都会记住并重新发现他——一位终身服役海军、把这支军种带向远海的领军人物。
      cite: b21-diplomat-2017-01-erickson-wu
    - voice: west
      quote: true
      text: He was thus one of the few PLAN admirals who had actual combat experience at sea.
      zh: 因此，他是解放军海军中少数有过海上实战经历的将领之一。
      cite: b21-diplomat-2017-02-pla-reshuffle
  family:
    - name: 吴宪
      rel: 父亲
      text: >-
        据维基百科，参加过一二·九运动，1938 年入党，后任解放军第三十五军政治部主任；建国后历任杭州市委书记兼市长、浙江省委书记处书记、浙江省副省长、浙江省政协副主席。
        自由亚洲电台和看中国称他为“前浙江省委书记”，易思安称他做过浙江副省长，各家说法不一。
      cites: [b21-wiki-wu-shengli, f04-rfa-2017-11-07-princelings, b21-diplomat-2017-01-erickson-wu]
  ids: { wikidata: Q717014 }
  cites: [wd-Q717014, c01-people-2012-09-26-wu-shengli, b21-thepaper-2017-01-20-wu-11-years, b21-wiki-wu-shengli, b21-diplomat-2017-01-erickson-wu, b21-xinhua-2016-01-20-wu-richardson]

- id: ma-xiaotian
  name: 马晓天
  pinyin: Mǎ Xiǎotiān
  gender: m
  ethnicity: 汉族
  born: 1949-08
  birthplace: 河南巩义
  education:
    - { school: 国防大学基本系, from: 1993-05, to: 1994-04 }
  joinedParty: 1969-07
  joinedWork: 1965-07
  roles: [cmc, cc, general]
  status: retired
  statusNote: 2017 年 8 月卸任空军司令员，十九大退出中央军委，2018 年 3 月退休。
  tier: 1
  headline: 空军司令员（2012–2017）、中央军委委员
  bio: >-
    开国大校马载尧之子，不满 16 岁进航校，25 岁成为空军最年轻的飞行副团长，49 岁还驾驶苏-30 参加珠海航展。
    历任空十军军长、兰州和南京军区空军司令员、空军副司令员，2006 年任国防大学校长，2007 年任副总参谋长，分管外事及情报工作，2010 年公开表态坚决反对美韩在黄海军演，被媒体称为“鹰派上将”；2009 年与刘源、张海阳同日晋上将，学者视三人为军中太子党。
    2012 年接替许其亮任空军司令员并入军委，2017 年说“日本海不是日本的海”。同年 8 月由丁来杭接任，2018 年退休。
  positions:
    - { title: 空军第十军参谋长、军长, sys: army, from: 1994-04, to: 1997-03, cite: f06-sohu-2009-07-20-three-generals }
    - { title: 空军副参谋长, sys: army, from: 1997-03, to: 1998-08, cite: f06-sohu-2009-07-20-three-generals }
    - { title: 广州军区空军参谋长, sys: army, from: 1998-08, to: 1999-06, cite: f06-sohu-2009-07-20-three-generals }
    - { title: 兰州军区副司令员兼军区空军司令员, sys: army, from: 1999-06, to: 2001-01, cite: f06-sohu-2009-07-20-three-generals }
    - { title: 南京军区副司令员兼军区空军司令员, sys: army, from: 2001-01, to: 2003-07, cite: c02-wiki-ma-xiaotian }
    - { title: 空军副司令员, sys: army, from: 2003-07, to: 2006-08, cite: c02-wiki-ma-xiaotian }
    - { title: 国防大学校长, sys: army, from: 2006-08, to: 2007-09, cite: c02-wiki-ma-xiaotian }
    - { title: 副总参谋长, sys: army, from: 2007-09, to: 2012-10, cite: c02-wiki-ma-xiaotian }
    - { title: 空军司令员, sys: army, from: 2012-10, to: 2017-08, cite: c02-caixin-2012-10-23-pla-reshuffle }
    - { title: 中央军委委员, sys: army, from: 2012-11, to: 2017-10, cite: c02-xinhua-2012-11-15-18-1-plenum }
  life:
    - h: 将门之子
      from: 1949
      to: 1972
      text: >-
        1949 年 8 月生于河南巩义。父亲马载尧是开国大校、解放军政治学院原教育长，长期做部队干部政治培训。《环球人物》记载，三年困难时期马载尧的老战友请他全家吃饭，十一二岁的马晓天问：“伯伯，我们今天可以吃饱饭吗？”
        1965 年 7 月不满 16 岁入伍，先后在空军第二航空预备学校、第十二航空学校、第五航空学校学习，当过飞行教员，被纪录片称为“塔台上的儿童团长”；1969 年 7 月入党。
      cites: [f06-sohu-2009-07-20-three-generals, b21-hqrw-2012-11-06-ma]
    - h: 飞行员
      from: 1972
      to: 1999
      text: >-
        1972 年 1 月成为空军飞行员，历任中队长、副大队长、副团长、团长。据《南方周末》，他 25 岁就成为空军最年轻的飞行团副团长，那一年央视为他拍了电视片《共和国同龄人：塔台上的儿童团》；他和后来接替他的丁来杭一样出自空 24 师。1983 年任航空兵师副师长、师长。
        1993–1994 年在国防大学基本系学习，此后任空军第十军参谋长、军长，1995 年晋少将；1997 年任空军副参谋长，1998 年任广州军区空军参谋长。同年珠海航展上，49 岁的他亲自驾驶苏-30 战斗机飞行。
      cites: [f06-sohu-2009-07-20-three-generals, b21-infzm-2017-09-three-services, b21-hqrw-2012-11-06-ma]
    - h: 大军区空军与国防大学
      from: 1999
      to: 2007
      text: >-
        1999 年 6 月任兰州军区副司令员兼军区空军司令员，2000 年晋空军中将；2001 年 1 月调任南京军区副司令员兼军区空军司令员，2002 年当选中共十六届中央委员。
        2003 年 7 月任空军副司令员，2006 年 8 月出任国防大学校长，执掌最高军事学府，2007 年 9 月转任副总参谋长。《环球人物》说他经历了野战部队、空军机关、军校、军委总部多个关键岗位，多次指挥上海合作组织的联合军演。
      cites: [f06-sohu-2009-07-20-three-generals, c02-wiki-ma-xiaotian, b21-hqrw-2012-11-06-ma]
    - h: 副总参谋长
      from: 2007
      to: 2012
      text: >-
        据《环球人物》，任副总参谋长期间他分管外事及情报工作，多次代表军方强硬表态。2010 年 7 月 1 日，美韩准备在黄海联合军演，他对凤凰卫视说：“因为是在黄海，距离中国领海很近，举行这样的演习，我们是非常反对的。”韩国《中央日报》称这是解放军最高层首次公开表态。美国之音采访的旅美学者张鹤慈认为，军方通常以鹰派姿态示人，与军需和军费要求有关，中国高层在对美问题上的分歧并不大，只是愿意借个人之口让外界听到声音；《环球人物》也说他放“狠话”的同时强调和平发展是中国郑重的战略选择。2011 年 7 月中日防务安全磋商中，他批评日本“正走向危险的方向”。
        2009 年 7 月，他与刘源、张海阳同日晋上将；布鲁金斯学会的李成指出三人全是太子党，认为胡锦涛借此向军中太子党发出讯息。
      cites: [b21-hqrw-2012-11-06-ma, b21-cntv-2010-07-03-ma-yellow-sea, b21-voa-2010-07-04-yellow-sea, f06-sohu-2009-07-20-three-generals, f04-brookings-2010-06-29-military]
    - h: 空军司令员
      from: 2012
      to: 2017-08
      text: >-
        2012 年 10 月接替许其亮任空军司令员，是空军第十一任司令员，11 月十八届一中全会进入中央军委，2013 年 3 月任国家军委委员。《环球人物》称他被媒体誉为“共和国史上最帅空军司令”。
        2017 年 8 月，日本防卫白皮书对中国空军在日本海的活动表示担忧，他在长春空军开放日上回答记者：“我们发展我们的，他担忧什么”，“日本海不是日本的海，不是不能去。”
      cites: [b21-hqrw-2012-11-06-ma, c02-caixin-2012-10-23-pla-reshuffle, c02-wiki-ma-xiaotian, b21-cnr-2017-08-11-ma-japan-sea]
    - h: 卸任与退休
      from: 2017-08
      to: 2026
      text: >-
        2017 年 9 月 1 日，丁来杭首次以空军司令员身份公开亮相，新京报称此前空军司令员由中央军委委员马晓天担任。他当年 68 岁，十九大退出中央军委，2018 年 3 月退休。ETtoday 引述中国官媒称，他的儿子张昊是空军飞行员，在朱日和阅兵中驾驶歼-20 受阅。
        退休后他偶尔出席官方活动，据联合早报引星岛网，2026 年 9 月 30 日国庆招待会的新闻联播画面中仍可见到他。
      cites: [b21-xinhua-2017-09-02-three-services, b21-ettoday-2017-09-02-ding-ma, c02-wiki-ma-xiaotian, b21-zaobao-2026-09-30-reception]
  assess:
    - voice: official
      quote: true
      text: 其实，外界称马晓天上述言论为“狠话”并以此为依据称他为军方“鹰派”，有过度解读、妄加猜测和以偏概全之嫌。
      cite: b21-hqrw-2012-11-06-ma
    - voice: zh
      quote: true
      text: 中美关系离战争边缘还很远，不过是双方都因为内政的原因而打牌和做姿态。而军方通常以鹰派姿态示人，这也基于军需和军费要求。
