  born: 1951-08
  died: 2017-11-23
  birthplace: 河北武强
  education:
    - { school: 国防大学基本系, from: 1991-10, to: 1992 }
    - { school: 中共中央党校行政管理专业, to: 1996 }
  joinedParty: 1969-05
  joinedWork: 1968
  roles: [cmc, cc, general, tiger]
  status: dead
  statusNote: 2017 年 11 月 23 日在接受组织谈话期间于家中自缢身亡；2018 年 10 月被开除党籍，此前已被开除军籍、取消上将军衔。
  fall:
    - { date: 2017-08-28, text: 中央军委决定对其进行组织谈话，调查其涉郭伯雄、徐才厚等案问题线索, cite: c02-xinhua-2017-11-28-zhang-yang }
    - { date: 2017-11-23, text: 在家中自缢死亡；新华社称其涉嫌行贿受贿、巨额财产来源不明犯罪, cite: c02-xinhua-2017-11-28-zhang-yang }
    - { date: 2018-10-16, text: 新华社通报，经中共中央批准，中央军委审查认定其涉嫌行贿、受贿、巨额财产来源不明犯罪，决定开除党籍、依纪依法追缴涉案财物；此前已被开除军籍、取消上将军衔, cite: b21-xinhua-2018-10-16-zhang-yang-expel }
  tier: 1
  headline: 总政治部主任、军委政治工作部主任（2012–2017），2017 年调查中自杀
  bio: >-
    一辈子做政治工作，从河北武强入伍的战士做到第 42 集团军政委、广州军区政委，2010 年晋上将。
    2012 年接替李继耐任总政治部主任并进入中央军委，2016 年军委机关改革后任军委政治工作部首任主任，是总政最后一任、政工部第一任主官。任内他是肃清郭伯雄、徐才厚“流毒”的主要执行者，屡次公开批判郭徐；但港媒称他本人是“徐才厚的嫡系”。
    2017 年 8 月被组织谈话，11 月 23 日在家中自缢，是十九大后首名落马的上将；2018 年被追开除党籍、军籍。2021 年历史决议把他与郭伯雄、徐才厚、房峰辉并列点名。
  positions:
    - { title: 第 42 集团军政治部主任, sys: army, from: 1999-09, to: 2002, cite: c02-wiki-zhang-yang }
    - { title: 第 42 集团军政治委员, sys: army, from: 2002, to: 2004-12, cite: c02-wiki-zhang-yang }
    - { title: 广州军区政治部主任, sys: army, from: 2004-12, to: 2007-09, cite: c02-wiki-zhang-yang }
    - { title: 广州军区政治委员, sys: army, from: 2007-09, to: 2012-10, cite: c02-wiki-zhang-yang }
    - { title: 总政治部主任, sys: army, from: 2012-10, to: 2016-01, cite: c02-sina-2012-10-25-pla-hq }
    - { title: 中央军委委员, sys: army, from: 2012-11, to: 2017-10, cite: c02-xinhua-2012-11-15-18-1-plenum }
    - { title: 中央军委政治工作部主任, sys: army, from: 2016-01, to: 2017-08, cite: b21-sina-2017-11-28-zhang-xu }
  factions:
    - f: guo-xu
      cite: c02-zaobao-2018-01-10-fang-fenghui
      quote: 张阳则是徐才厚的嫡系
  life:
    - h: 武强的兵
      from: 1951
      to: 1999
      text: >-
        1951 年 8 月生于河北武强县孙庄乡，1968 年 17 岁入伍，次年 5 月入党。他从战士做起，历任班长、技师、政治指导员、政治教导员、团政治处主任、团政委，军旅生涯大部分在政工岗位上。
        1991 年 10 月进国防大学基本系学习，一年后任炮兵一师政治部主任、副政委；1996 年任第 42 集团军第 163 师政委，同年从中央党校行政管理专业毕业。
      cites: [b21-sina-2017-11-28-zhang-xu, c02-wiki-zhang-yang, b21-rfa-2017-11-28-zhang-yang]
    - h: 广州军区
      from: 1999
      to: 2012
      text: >-
        1999 年 9 月任第 42 集团军政治部主任，2001 年晋少将，2002 年升集团军政委。据《环球人物》，所属摩托化步兵师改编机械化步兵师时，他们叫响了“宁可让人才等装备，也不能让装备等人才”的口号。
        2004 年 12 月任广州军区政治部主任，与时任军区参谋长房峰辉搭档近 3 年，2012 年两人分掌总政、总参，“重新成为搭档”；2007 年 9 月接替杨德清任军区政委，七年内从副军职升到正大军区职。2008 年南方冰冻灾害时到韶关乳源一线指挥抢险。2010 年 7 月与房峰辉等 11 人同批晋上将，时年 58 岁。
      cites: [c02-wiki-zhang-yang, b21-sina-2017-11-28-zhang-xu]
    - h: 总政治部主任
      from: 2012-10
      to: 2015
      text: >-
        2012 年 10 月四总部同步换将，61 岁的他接替李继耐任总政治部主任，11 月当选中央军委委员；任命公布前四天，他还紧随徐才厚观看话剧《生命宣言》。2013 年他在《求是》撰文，要求坚决抵制“军队非党化、非政治化”和“军队国家化”等错误政治观点。
        徐才厚 2014 年落马后，他反复批判郭徐：政知圈统计仅 2015 年 1 至 3 月他就至少在 6 个公开场合提到“肃清徐才厚案的影响”，维基百科汇集的媒体统计说他被谈话前不下 13 次痛批徐才厚。
      cites: [b21-sina-2017-11-28-zhang-xu, b21-sina-2013-04-16-zhang-article, c02-wiki-zhang-yang, c02-sina-2012-10-25-pla-hq]
    - h: 政治工作部
      from: 2016-01
      to: 2017-08
      text: >-
        2016 年 1 月军委机关由四总部改为 15 个职能部门，他任军委政治工作部主任，成为总政最后一任、政工部第一任主任（维基百科作 2015 年 11 月）。
        2016 年 8 月 26 日，他以全军贯彻落实古田政工会精神领导小组组长身份讲话，要求以领导干部为重点，“做到情感上憎恨、政治上决裂，切实与郭徐的圈子、品行、套路、作风等彻底划清界限”。2017 年 8 月 7 日随中央代表团赴内蒙古，是他最后一次公开露面。
      cites: [b21-sina-2017-11-28-zhang-xu, b21-cnr-2016-08-27-zhang-gutian, c02-wiki-zhang-yang]
    - h: 组织谈话与自缢
      from: 2017-08
      to: 2017-11
      text: >-
        2017 年 8 月 28 日，经党中央批准，中央军委决定对他组织谈话，调查其涉郭伯雄、徐才厚等案问题线索。9 月公布的军队十九大代表名单里没有他和房峰辉，国防部不确认也不否认。联合早报说坊间传言他在广州军区任职时与多名商人有不当往来；BBC 转述星岛日报，调查由习近平“亲自下令”。
        10 月十九大后，他和房峰辉都卸任中央军委委员，自由亚洲电台说两人此前已传出涉嫌违纪被查。谈话期间他一直住在家中，11 月 23 日上午自缢身亡，终年 66 岁。据香港01综合海外媒体报道，军纪委人员当天上门，他说要先去“换衣服”，随即上吊。纽约时报指出，中国高官自杀几乎闻所未闻。
      cites: [c02-xinhua-2017-11-28-zhang-yang, b13-voa-2017-09-07-fang-zhang, b21-zaobao-2017-11-29-zhang-yang, f02-bbc-2017-11-28-zhang-yang, b21-rfa-2017-11-28-zhang-yang, b21-hk01-2017-11-28-zhang-details, b21-nyt-2017-11-28-zhang-yang]
    - h: 身后定性
      from: 2017-11
      to: 2021
      text: >-
        新华社五天后才公布死讯。同日，解放军报旗下的钧正平工作室发文称“张阳畏罪自杀！”，说这个上将“以这种可耻的方式结束了自己的一生”，是嘴上喊忠诚、背后搞贪腐的典型“两面人”。察时局公号援引党内规定指出，当事人死亡并不必然免于追究党纪。
        2018 年 10 月 16 日新华社通报，他被开除党籍、追缴涉案财物，此前已被开除军籍、取消上将军衔。2021 年的第三个历史决议写入“坚决查处郭伯雄、徐才厚、房峰辉、张阳等严重违纪违法案件”。
      cites: [b21-nyt-2017-11-28-zhang-yang, b21-81cn-2017-11-28-zhang-commentary, b21-dw-2017-11-28-zhang-yang, b21-xinhua-2018-10-16-zhang-yang-expel, b04-gov-2021-11-16-resolution]
    - h: 传闻
      from: 2004
      to: 2018
      text: >-
        据大纪元（传闻），他在广州军区任职时就被冠以“麻袋政委”“张麻袋”的绰号，意思是找他买官得装一麻袋钱才能见面。香港01 综合海外媒体报道称，他别墅装修花费的 300 多万元人民币全部由他人支付。这些细节都没有得到官方证实，官方通报只认定他涉嫌行贿、受贿和巨额财产来源不明。
      cites: [b21-epoch-2018-10-16-zhang-yang, b21-hk01-2017-11-28-zhang-details, b21-xinhua-2018-10-16-zhang-yang-expel]
  assess:
    - voice: official
      quote: true
      text: 张阳对党不忠诚不老实，搞两面派做两面人，政治蜕变、经济贪婪、生活腐化、品行低劣
      cite: b21-xinhua-2018-10-16-zhang-yang-expel
    - voice: history
      quote: true
      text: 坚决查处郭伯雄、徐才厚、房峰辉、张阳等严重违纪违法案件并彻底肃清其流毒影响
      cite: b04-gov-2021-11-16-resolution
    - voice: west
      quote: true
      text: Suicides by top officials are almost unheard-of in China, and the ruling Communist Party appeared uncertain how to handle the death.
      zh: 高官自杀在中国几乎闻所未闻，执政的共产党似乎不知该如何处理这起死亡。
      cite: b21-nyt-2017-11-28-zhang-yang
    - voice: zh
      quote: true
      text: 他被捕入狱已是势在必行，这或许是他自缢身亡的原因。
      cite: b21-zaobao-2017-11-29-zhang-yang
  ids: { wikidata: Q27826 }
  cites: [wd-Q27826, c02-sina-2012-10-25-pla-hq, c02-xinhua-2017-11-28-zhang-yang, c02-wiki-zhang-yang, b21-xinhua-2018-10-16-zhang-yang-expel, b21-sina-2017-11-28-zhang-xu]

- id: guo-jinlong
  name: 郭金龙
  pinyin: Guō Jīnlóng
  gender: m
  ethnicity: 汉族
  born: 1947-07
  birthplace: 江苏南京
  education:
    - { school: 南京大学物理系声学专业, from: 1964, to: 1969 }
  joinedParty: 1979-04
  joinedWork: 1969-08
  roles: [pb, cc, prov]
  status: retired
  statusNote: 2017 年 5 月卸任北京市委书记，转任中央文明委副主任，十九大后退出政治局；2018 年 7 月起任两岸企业家峰会大陆方面理事长，2025 年 12 月仍以此身份出席峰会年会。
  tier: 1
  headline: 北京市委书记（2012–2017）、政治局委员；西藏自治区党委书记（2000–2004）
  bio: >-
    南京大学物理系毕业后分到四川忠县，从水电局干部、体委教练做到县长，再从乐山市委书记升到四川省委副书记。1993 年进藏，任常务副书记、书记共 11 年，2000 年上任时宣示把打击分离主义放在首位。
    2004 年起主政安徽，2007 年底接替王岐山任北京市长、奥组委执行主席，主持奥运会城市运行。BBC 等外媒视他为胡锦涛的政治盟友。2012 年 7 月北京特大暴雨后不久由市长转任市委书记，十八大进入政治局，任内推动疏解非首都功能。
    2017 年 5 月由蔡奇接任，退休后任两岸企业家峰会大陆方面理事长。
  positions:
