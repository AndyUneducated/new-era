  life:
    - h: 农场到复旦
      from: 1950
      to: 1983
      text: >-
        1950年11月生，江苏涟水人。法广引《苹果日报》说，他的父亲李干成文革前曾任上海市委常委、副市长。1968年起他在江苏大丰县的上海农场当了四年职工，1972年进入上海师范大学数学系，此后在中学和业余工业专科学校教书。1978年他考入复旦大学数学系七七级，同年3月入党，任系团总支书记，毕业后留校任管理系教师、校团委副书记。
      cites: [b09-gov-2013-03-14-li-yuanchao-cv, b09-rfi-2020-11-15-li-yuanchao]
    - h: 团中央与外宣
      from: 1983
      to: 1996
      text: >-
        1983年是李源潮政治生涯的转折点：他一年之内从复旦团委副书记升为团上海市委书记，又进入共青团中央书记处，一干七年。《联合早报》说，当时正值胡耀邦任总书记，团系干部前途光明，他“以火箭般的速度杀入团中央”，进入了接班人梯队。1990年后他转到中央对外宣传小组任一局局长，1993年任外宣办、国务院新闻办副主任，其间在中央党校读完法学博士。
      cites: [b09-gov-2013-03-14-li-yuanchao-cv, b09-zaobao-2017-10-28-li-yuanchao]
    - h: 文化部与江苏
      from: 1996
      to: 2007
      text: >-
        1996年李源潮任文化部副部长、党组副书记。2000年他外放江苏任省委副书记，次年兼南京市委书记，2002年至2007年任江苏省委书记，2003年起兼省人大常委会主任。《联合早报》提到，他与江泽民同为江苏人，曾主政江苏多年。美国之音则指出，十八大后他主政过的江苏有多名高官落马，给他的政治前景蒙上阴影。
      cites: [b09-gov-2013-03-14-li-yuanchao-cv, b09-zaobao-2017-12-31-li-reappears, b09-voa-2017-10-13-19th]
    - h: 中组部长
      from: 2007
      to: 2012
      text: >-
        2007年十七大，李源潮进入中央政治局和中央书记处，出任中组部部长，主持干部人事制度改革。2009年他对全国县委组织部长说，要“把最优秀的干部用在最关键的岗位上”，“坚持德才兼备、以德为先标准”，并要求纠正干部任职年龄“一刀切”的错误做法，强调年轻化不等于“低龄化”。他还要求组织部长当好党的干部制度和用人原则的“守门员”。
      cites: [b09-gov-2013-03-14-li-yuanchao-cv, b09-taiwan-2009-11-21-li-cadres]
    - h: 落选常委，转任副主席
      from: 2012
      to: 2017
      text: >-
        中央社说，十八大前李源潮是晋级政治局常委的大热门，入常可能性甚至高于汪洋，但最终落榜，跌破了许多人的眼镜。他续任政治局委员，2013年3月当选国家副主席；美国之音指出，他是1998年以来第一个不是常委的国家副主席，中央社则认为这一荣誉职是习近平对他和团派的补偿。《联合早报》评论说，明眼人都看出“他的政治巅峰期已经结束”。
      cites: [b09-cna-2017-10-25-li-yuanchao, b09-voa-2017-10-13-19th, b09-zaobao-2017-10-28-li-yuanchao, b09-gov-2013-03-14-li-yuanchao-cv]
    - h: 十九大出局与传言
      from: 2017
      to: 2018
      text: >-
        2017年10月十九大，67岁的李源潮没有进入新一届中央委员会，而政治局委员的惯常退休年龄是68岁。中央社报道，海外媒体流传他在国家副主席任内被调查，说法包括他任江苏书记时姻亲涉贪，以及与已落马的令计划关系密切；这些说法从未获官方证实。同年12月他出席全国政协新年茶话会，是十九大后首次公开露面。2018年3月17日，他卸任国家副主席，由王岐山接任，随后退休。
      cites: [b09-wiki-li-yuanchao, b09-cna-2017-10-25-li-yuanchao, b09-zaobao-2017-12-31-li-reappears]
    - h: 退休后的露面
      from: 2018
      to: 2020
      text: >-
        退休后李源潮极少露面，境外传言不断。法广引《苹果日报》说，令计划落马后他被指与令“团团伙伙”，又传出妻弟涉贪，司机、秘书乃至他本人被调查，退休后还多次传出自杀消息；2020年9月20日曾有传言称他在家中自杀身亡，央视随后在9月30日播出他出席国庆招待会的画面，被外界视为辟谣；同年11月，他罕见地与妻子高建进一同参观上海第三届国际进口博览会。《联合早报》早在2017年就写道，他已“开始规划自己的养老生涯了”。
      cites: [b09-rfi-2020-11-15-li-yuanchao, b09-zaobao-2017-10-28-li-yuanchao]
  assess:
    - voice: zh
      quote: true
      text: 李源潮虽然续任政治局委员，并当上国家副主席，但明眼人都看出，他的政治巅峰期已经结束。
      cite: b09-zaobao-2017-10-28-li-yuanchao
    - voice: zh
      quote: true
      text: 事後，李源潮轉任榮譽職的國家副主席，被認為是中共總書記習近平對他及「團派」的補償。
      cite: b09-cna-2017-10-25-li-yuanchao
    - voice: zh
      quote: true
      text: 18大前李曾是入常热门人选，但最终名落孙山，随后成为1998年以来第一个不是常委的国家副主席。
      cite: b09-voa-2017-10-13-19th
  cites: [b09-gov-2013-03-14-li-yuanchao-cv, b09-zaobao-2017-10-28-li-yuanchao, b09-cna-2017-10-25-li-yuanchao, b09-rfi-2020-11-15-li-yuanchao, wd-Q708802]
