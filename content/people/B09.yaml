    - { title: 广东省委书记, sys: party, place: 广东, from: 2012, to: 2017, cite: b09-people-2018-03-hu-chunhua-cv }
    - { title: 国务院副总理, sys: gov, from: 2018-03, to: 2023-03, cite: b09-people-2018-03-hu-chunhua-cv }
