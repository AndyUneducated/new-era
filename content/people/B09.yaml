  life:
    - h: 工人与工农兵学员
      from: 1953
      to: 1979
      text: >-
        1953年9月生，福建莆田人。1970年起在福州大学机械厂当了五年工人，1975年作为工农兵学员进入清华大学化工系，与习近平同年入学。日本国际问题研究所2020年的研究报告说，两人“寮で同室であった”（在宿舍同住一室），中国官方媒体没有报道过，但多家有影响的报纸都这样写，应属事实。《联合早报》引境外媒体说两人睡过上下铺，并有消息称当时任学生党支部书记的习近平是陈希1978年的入党介绍人之一。
      cites: [b09-people-2018-04-chen-xi-cv, b09-jiia-2020-01-chen-xi, b09-zaobao-2017-10-24-chen-xi]
    - h: 清华三十年
      from: 1979
      to: 2008
      text: >-
        1979年3月毕业后，陈希短暂回福州大学任教，当年考回清华读研究生，此后一直留在清华：先后任校团委书记、学生工作部部长，1990年至1992年在斯坦福大学做访问学者，回国后任校党委副书记、常务副书记，2002年至2008年任党委书记（副部长级）。习近平1998年起在清华读在职博士，《联合早报》说据称是由陈希“在幕后牵线安排的”；但自由亚洲电台专栏作者高新认为，陈希升到清华党委书记为止的仕途“与习近平一点关系都没有”。
      cites: [b09-people-2018-04-chen-xi-cv, b09-zaobao-2017-10-24-chen-xi, b09-rfa-2013-04-30-chen-xi]
    - h: 辗转与调入中组部
      from: 2008
      to: 2017
      text: >-
        2008年陈希离开清华任教育部副部长，2010年调任辽宁省委副书记，2011年转任中国科协党组书记、常务副主席，《联合早报》称之为“闲职”。2013年4月，习近平上台不久，陈希被调入中组部任主持常务工作的副部长（正部长级）。自由亚洲电台评论说，舆论一致认为这是习近平“内举不避亲”，并称陈希与习近平“即是同窗，更是同党”。
      cites: [b09-people-2018-04-chen-xi-cv, b09-zaobao-2017-10-24-chen-xi, b09-rfa-2013-04-30-chen-xi]
    - h: 执掌组织部
      from: 2017
      to: 2022
      text: >-
        2017年10月十九大，陈希进入中央政治局和中央书记处，出任中组部部长兼中央党校校长，次年又兼国家行政学院院长。联合新闻网指出，这打破了28年来中央党校校长由政治局常委兼任的惯例。十九大后不久，他在《人民日报》撰文，强调“选人用人首先要看政治素质”，点名周永康、薄熙来、郭伯雄、徐才厚、孙政才、令计划为“政治野心家、阴谋家”，并批评有的干部“不信马列信鬼神，不信理想信方术”。美国之音称他为“习近平的清华同窗”。
      cites: [b09-people-2018-04-chen-xi-cv, b09-udn-2026-06-06-cai-qi-school, b09-xinhua-2017-11-16-chen-xi-article, b09-voa-2017-11-16-chen-xi]
    - h: “五看”用人标准
      from: 2017-11
      to: 2022
      text: >-
        陈希那篇文章把“突出政治标准”具体化为五条：一看政治忠诚，二看政治定力，三看政治担当，四看政治能力，五看政治自律。他写道，对党忠诚“不是有条件的而是无条件的”，对同党中央“唱对台戏”、阳奉阴违的人“绝对不能用”；干部政治上出问题，“对党的危害绝不亚于腐败问题”。他还以衡阳破坏选举案和南充、辽宁拉票贿选案为例，说明政治能力“绝不是可有可无的软性指标”，要求对政治表现“考准考实”。
      cites: [b09-xinhua-2017-11-16-chen-xi-article]
    - h: 二十大退出
      from: 2022
      to: 2023
      text: >-
        2022年10月二十大，陈希与刘鹤、陈全国等9名十九届政治局委员一起不再进入中央委员会。高新称他是习近平当年在清华当工农兵学员时的“上铺兄弟”，他未能更进一步，说明二十大的人事安排仍“原则上实行七上八下”。《联合早报》报道，陈希卸任政治局委员后，以普通党员身份继续担任中组部长，直到2023年3月29日至4月7日之间才卸任，由李干杰接替。
      cites: [b09-rfa-2022-10-22-20th-cc, b09-rfa-2023-05-26-age-rule, b09-zaobao-2023-04-26-chen-xi-out]
    - h: 党校校长九年
      from: 2023
      to: 2026
      text: >-
        交出中组部后，陈希仍保留中央党校（国家行政学院）校长一职。2026年6月5日，政治局常委蔡奇首次以中央党校校长身份出席毕业典礼；中央社引港媒《星岛日报》说，陈希卸任中组部长后仍担任党校校长，“至此番卸任”，党校校长重新由政治局常委兼任。联合新闻网统计，陈希任校长长达9年。此后未见他担任其他公开职务。
      cites: [b09-cna-2026-06-06-cai-qi-school, b09-udn-2026-06-06-cai-qi-school]
  assess:
    - voice: zh
      quote: true
      text: 被视为总书记习近平嫡系干将的中组部常务副部长陈希，是十九大后“入局”的热门人选
      cite: b09-zaobao-2017-10-24-chen-xi
    - voice: zh
      quote: true
      text: 所以说，陈希与习近平之间即是同窗，更是同党。
      cite: b09-rfa-2013-04-30-chen-xi
    - voice: scholar
      quote: true
      text: 両者は、同じ1975年に清華大学の化学科に入学しており、寮で同室であった。このことは中国の公式メディアでは報じられていないが、有力な新聞の多くが報じており、事実であると思われる
      zh: 两人同于1975年进入清华大学化学系，在宿舍同住一室。此事中国官方媒体没有报道，但多家有影响的报纸都有报道，应属事实。
      cite: b09-jiia-2020-01-chen-xi
    - voice: zh
      quote: true
      text: 打破了長達28年中央黨校校長由中央政治局常委兼任的慣例
      cite: b09-udn-2026-06-06-cai-qi-school
  cites: [b09-people-2018-04-chen-xi-cv, b09-zaobao-2017-10-24-chen-xi, b09-zaobao-2023-04-26-chen-xi-out, b09-cna-2026-06-06-cai-qi-school, wd-Q8293788]

- id: hu-chunhua
  name: 胡春华
  pinyin: Hú Chūnhuá
  gender: m
  ethnicity: 汉族
  born: 1963-04
  origin: 湖北五峰
  education:
    - { school: 北京大学中文系, from: 1979, to: 1983 }
