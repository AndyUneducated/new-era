- id: wang-yi
  name: 王毅
  pinyin: Wáng Yì
  gender: m
  ethnicity: 汉族
  born: 1953-10
  birthplace: 北京
  origin: 北京
  education:
    - { school: 北京第二外国语学院亚非语系日语专业, from: 1978, to: 1982 }
    - { school: 南开大学亚太经合组织研究中心, degree: 经济学硕士, from: 1996, to: 1998 }
  joinedParty: 1981-05
  joinedWork: 1969-09
  roles: [pb, cc, minister]
  status: active
  statusNote: 现任中央政治局委员、中央外事工作委员会办公室主任、外交部部长；2026年3月仍以外长身份出席全国人大外交记者会。
  tier: 1
  headline: 中共中央政治局委员、中央外办主任，外交部部长（2013–2022、2023– ）
  ids: { wikidata: Q701801 }
  bio: >-
    王毅是习近平时代中国外交的主要执行者。他出身外交部亚洲司，是日本问题专家，做过驻日大使和国台办主任，2013年起任外交部长。他的第一个外长任期里，中国外交风格明显转向强硬，外媒普遍把他视为“战狼外交”的代表人物。2022年中共二十大上，69岁的他打破“七上八下”惯例进入政治局，接替杨洁篪任中央外办主任；2023年7月秦刚突然被免职后，他重新兼任外交部长，同时执掌党和政府两条外交线，至今仍是北京对外关系的首席代表。
  positions:
    - { title: 外交部亚洲司司长, sys: gov, from: 1995, to: 1998, cite: b09-xinhua-2018-03-19-wang-yi-cv }
    - { title: 外交部副部长, sys: gov, from: 2001, to: 2004, cite: b09-xinhua-2018-03-19-wang-yi-cv }
    - { title: 驻日本大使, sys: gov, from: 2004, to: 2007, cite: b09-xinhua-2018-03-19-wang-yi-cv }
    - { title: 中央台湾工作办公室主任、国务院台湾事务办公室主任, sys: party, from: 2008, to: 2013, cite: b09-xinhua-2018-03-19-wang-yi-cv }
    - { title: 外交部部长, sys: gov, from: 2013-03, to: 2022, cite: b09-zaobao-2022-10-23-wang-yi-cc }
    - { title: 国务委员, sys: gov, from: 2018-03, to: 2023-03, cite: b09-xinhua-2018-03-19-wang-yi-cv }
    - { title: 中央政治局委员、中央外事工作委员会办公室主任, sys: party, from: 2022-10, cite: b09-zaobao-2022-10-23-wang-yi-pb }
    - { title: 外交部部长（再任）, sys: gov, from: 2023-07, cite: b09-gov-2023-07-25-order-8 }
  life:
    - h: 兵团知青与日语
      from: 1953
      to: 1989
      text: >-
        1953年10月生于北京。1969年9月，王毅到黑龙江生产建设兵团，当了八年战士、连通讯员、营报道员和代理宣传干事。1977年返城待分配，在邮电部情报所当工人。1978年他考入北京第二外国语学院亚非语系学日语，1982年毕业进入外交部亚洲司，从科员做到处长；后来又在南开大学读研究生课程进修班，获经济学硕士学位。日语和亚洲事务成了他此后几十年仕途的底色。
      cites: [b09-xinhua-2018-03-19-wang-yi-cv]
    - h: 日本通
      from: 1989
      to: 2008
      text: >-
        1989年至1994年，王毅在驻日本使馆任参赞、公使衔参赞，回国后历任亚洲司副司长、司长，其间到美国乔治敦大学做访问学者。1998年任部长助理兼政研室主任，2001年升任副部长。2004年至2007年他出任驻日本大使，澳大利亚广播公司的报道说，他作为大使“肩负过改善中日关系的重任”。2007年他回部任党委书记、副部长。
      cites: [b09-xinhua-2018-03-19-wang-yi-cv, b09-abc-2023-07-25-wang-yi]
    - h: 国台办与渥太华记者会
      from: 2008
      to: 2016
      text: >-
        2008年至2013年，王毅任中共中央台湾工作办公室、国务院台湾事务办公室主任，2013年3月起任外交部长。2016年6月1日在渥太华的中加外长联合记者会上，一名加拿大记者向加方外长提问中国人权问题，王毅主动回应：“你的提问，充满了对中国的偏见, 和不知道从什么地方来的傲慢，我是完全不能接受的。”他还说“最了解中国人权状况的，不是你，是中国人自己”。新华网说现场有人鼓掌；BBC报道，加拿大总理特鲁多表示已向中方表达不满。
      cites: [b09-xinhua-2018-03-19-wang-yi-cv, b09-zaobao-2022-10-23-wang-yi-cc, b09-xinhua-2016-06-03-wang-canada-p3, b09-bbc-2016-06-03-canada]
    - h: “战狼”外交的面孔
      from: 2013
      to: 2022
      text: >-
        王毅第一个外长任期里，中国外交风格明显转向强硬。澳大利亚广播公司评论说，“王毅因此被外界视为战狼外交的主要实践者”，他在这十年里也“一度被视为习近平的传话人”。2018年起他升任国务委员兼外长。新加坡国立大学学者吴木銮2023年初对德国之声说，中国战狼外交的特点仍很明显，“现在只是由秦刚来扮演温和派角色，而王毅则会继续坚持强硬立场”。学者高树超对BBC中文说，王毅过去在“战狼”外交上表现良好，他的破格留任预示今后的重点是“斗争”。
      cites: [b09-abc-2023-07-25-wang-yi, b09-dw-2023-01-wolf-warrior, b09-bbc-2022-10-25-pb-24, b09-xinhua-2018-03-19-wang-yi-cv]
    - h: 二十大破格入局
      from: 2022
      to: 2022
      text: >-
        2022年10月中共二十大，72岁的杨洁篪没有进入新一届中央委员会，69岁的王毅则进入中央政治局，接替杨洁篪任中央外事工作委员会办公室主任。《联合早报》认为，王毅入局说明67岁留任、68岁退休的“七上八下”惯例已不再成立。自由亚洲电台专栏作者高新则指出，除习近平本人外，二十大上只有张又侠和王毅两人是年龄上的“例外”。随后驻美大使秦刚接任外交部长，王毅交出了部长职务。
      cites: [b09-zaobao-2022-10-23-wang-yi-pb, b09-zaobao-2022-10-23-wang-yi-cc, b09-rfa-2023-05-26-age-rule, b09-dw-2023-01-wolf-warrior]
    - h: 秦刚去职后回任
      from: 2023-07
      to: 2023
      text: >-
        2023年7月25日，全国人大常委会免去秦刚的外长职务，同日国家主席令第八号任命王毅为外交部部长；秦刚上任只有半年多，免职原因未作说明。王毅由此同时担任党和政府的最高外交职务，开始第三个外长任期。学者杨大利认为此举是“为了救火”；BBC中文网引述的评论说，“王毅的回巢给中国外交注入了稳定性和持续性”，也有分析担心中国外交官会再次倾向更具侵略性的“战狼”风格。受访学者当时多认为这是过渡安排，但他此后一直留任。
      cites: [b09-gov-2023-07-25-order-8, b09-bbc-2023-07-26-qin-wang, b09-abc-2023-07-25-wang-yi, b09-mfa-2026-03-08-wang-presser]
    - h: 慕尼黑、青岛与记者会
      from: 2023
      to: 2026
      text: >-
        王毅的言辞仍屡屡引起争议。2023年2月在慕尼黑，他形容美国击落中国气球“几乎是歇斯底里的，荒唐的，是百分之百的滥用武力”，法广评论说他显现的是“做外交部长时人们记忆犹新的战狼姿态”。同年7月在青岛的中日韩合作国际论坛期间，他对与会嘉宾说：“不管你把头发染得再黄、鼻子修得再尖，你也变不了欧美人”。2025年3月的人大记者会上，他说要“以中国的确定性稳住不确定的世界”；2026年3月，他仍以政治局委员、外交部长身份出席外交记者会。
      cites: [b09-rfi-2023-02-18-wang-munich, b09-ifeng-2023-07-04-wang-qingdao, b09-mfa-2025-03-07-wang-presser, b09-mfa-2026-03-08-wang-presser]
  assess:
    - voice: zh
      quote: true
      text: 王毅因此被外界视为战狼外交的主要实践者
      cite: b09-abc-2023-07-25-wang-yi
    - voice: zh
      quote: true
      text: 中国战狼外交的特点仍很明显。我看不出有任何变化，现在只是由秦刚来扮演温和派角色，而王毅则会继续坚持强硬立场。
      cite: b09-dw-2023-01-wolf-warrior
    - voice: zh
      quote: true
      text: 王毅的回巢给中国外交注入了稳定性和持续性
      cite: b09-bbc-2023-07-26-qin-wang
    - voice: zh
      quote: true
      text: 高树超认为，王毅过去在“战狼”外交上表现良好，张又侠则有参加越南战争的实战经验，这预示未来的重中之重是“斗争”。
      cite: b09-bbc-2022-10-25-pb-24
  cites: [b09-xinhua-2018-03-19-wang-yi-cv, b09-xinhua-2022-10-23-wang-yi-cv, b09-gov-2023-07-25-order-8, b09-zaobao-2022-10-23-wang-yi-pb, b09-abc-2023-07-25-wang-yi, wd-Q701801]

- id: liu-he
  name: 刘鹤
  pinyin: Liú Hè
  gender: m
  ethnicity: 汉族
  born: 1952-01
  origin: 河北昌黎
  education:
    - { school: 中国人民大学工业经济系, from: 1979, to: 1983 }
    - { school: 中国人民大学工业经济系, degree: 硕士研究生, from: 1983, to: 1986 }
    - { school: 哈佛大学肯尼迪政府学院, degree: 公共管理硕士, from: 1994-07, to: 1995-06 }
  joinedParty: 1976-12
  joinedWork: 1969-04
  roles: [pb, cc]
  status: retired
  statusNote: 2022年10月不再进入中央委员会，2023年卸任副总理和中财办主任；此后无公职，但据《南华早报》消息人士仍参与经济事务内部会议。
  tier: 1
  headline: 中共中央政治局委员、国务院副总理（2018–2023），中美贸易谈判中方牵头人
  ids: { wikidata: Q8294074 }
  bio: >-
    刘鹤是习近平时代前十年经济政策的主要设计者。他是从国家计委成长起来的经济官僚，从未主政地方，长期参与起草五年规划和中央经济讲稿，2013年起任中财办主任，2017年进入政治局，2018年出任副总理。中美贸易战期间他是中方牵头人，2020年1月在白宫与特朗普签署第一阶段贸易协议。外界常说他是习近平的中学同学，但这一说法有争议。2022年二十大后他退出中央委员会，次年卸任副总理。
  positions:
    - { title: 国家计委长期规划和产业政策司副司长, sys: gov, from: 1994, to: 1998, cite: b09-xinhua-2017-10-25-liu-he-cv }
    - { title: 国家信息中心常务副主任, sys: gov, from: 1998, to: 2001, cite: b09-xinhua-2017-10-25-liu-he-cv }
    - { title: 中央财经领导小组办公室副主任, sys: party, from: 2003, to: 2013, cite: b09-xinhua-2017-10-25-liu-he-cv }
    - { title: 国务院发展研究中心党组书记、副主任, sys: gov, from: 2011, to: 2013, cite: b09-xinhua-2017-10-25-liu-he-cv }
    - { title: 中央财经领导小组（委员会）办公室主任, sys: party, from: 2013, to: 2023, cite: b09-voa-2023-10-30-he-cfac }
    - { title: 国家发展和改革委员会副主任, sys: gov, from: 2013, to: 2018, cite: b09-xinhua-2017-10-25-liu-he-cv }
    - { title: 中央政治局委员, sys: party, from: 2017-10, to: 2022-10, cite: b09-xinhua-2017-10-25-liu-he-cv }
    - { title: 国务院副总理, sys: gov, from: 2018-03, to: 2023-03, cite: b09-bbc-2025-us-china-talks }
  life:
    - h: 知青、士兵、工人
      from: 1952
      to: 1979
      text: >-
        1952年1月出生，籍贯河北昌黎。1969年4月，他到吉林省洮南县瓦房公社插队，第二年参军，在解放军三十八军一一二师高炮团当战士、副班长；1973年进北京无线电厂当工人，做到厂团委书记，1976年12月入党。BBC中文网说，他与习近平都是“红二代”，上世纪60年代同在北京读中学，两人的父亲都在文革中遭受迫害。
      cites: [b09-xinhua-2017-10-25-liu-he-cv, b09-bbc-2018-03-19-liu-he]
    - h: “同学”之争
      from: 1960
      to: 2021
      text: >-
        刘鹤常被称为习近平的“发小”。德国之声2018年写道，刘鹤“中学毕业于红二代云集的北京101中学，是现任中国最高领导人习近平的同班同学”。但自由亚洲电台专栏作者高新2021年撰文反驳说，“习近平从来没有就读过一零一中学”，习当年读的是北京八一学校；他追溯认为，这一说法源自《华尔街日报》2013年10月7日的一篇报道，之后被港媒和外媒反复转引。BBC中文网的说法较谨慎，只说两人同在北京读中学。
      cites: [b09-dw-2018-03-19-liu-he, b09-rfa-2021-05-21-liu-he-xi, b09-bbc-2018-03-19-liu-he]
    - h: 计委里的经济学者
      from: 1979
      to: 2003
      text: >-
        1979年刘鹤考入中国人民大学工业经济系，读完硕士后短暂留校，1986年进入国务院发展研究中心，次年进国家计委，从工业综合局干部做到长期规划和产业政策司副司长。1992年他在美国西东大学做访问学者，1994年至1995年在哈佛大学肯尼迪政府学院读公共管理硕士，BBC说这“在同龄官员中较罕见”。1998年后他历任国家信息中心常务副主任、国务院信息化工作办公室副主任。
      cites: [b09-xinhua-2017-10-25-liu-he-cv, b09-bbc-2018-03-19-liu-he]
    - h: 中财办的笔杆子
      from: 2003
      to: 2017
      text: >-
        2003年起刘鹤任中央财经领导小组办公室副主任。BBC中文网说，他参与制定了从“八五”到“十二五”的多份经济长期规划，先后为江泽民、胡锦涛、习近平起草经济讲稿，还兼任过福建省政府顾问。十八大后习近平南下广东的“新南巡”，刘鹤全程陪同。2013年他升任中财办主任兼国家发改委副主任，被认为参与设计了十八届三中全会的改革计划。官方《环球人物》称他是“总书记的经济智囊”，彭博社则称他为“中国的萨默斯”。
      cites: [b09-xinhua-2017-10-25-liu-he-cv, b09-bbc-2018-03-19-liu-he, b09-bbc-2025-us-china-talks, b09-dw-2018-03-19-liu-he]
    - h: 入局与副总理
      from: 2017
      to: 2018
      text: >-
        2017年10月十九大，刘鹤以中财办主任兼发改委副主任的身份进入中央政治局。BBC中文网指出，一个从未在地方政府任职的官员位列政治局并掌握经济实权，“这样的升迁轨迹颇为罕见”。2018年3月他出任国务院副总理，继续兼任中财办主任，并以中美全面经济对话中方牵头人的身份，负责与特朗普政府的贸易谈判。
      cites: [b09-xinhua-2017-10-25-liu-he-cv, b09-bbc-2025-us-china-talks, b09-gov-2019-05-11-liu-he-washington]
    - h: 贸易战谈判
      from: 2018
      to: 2020
      text: >-
        2019年5月第十一轮磋商后，刘鹤在华盛顿对媒体说，“合作是双方唯一正确的选择，但合作是有原则的，在重大原则问题上中方决不让步”，并提出取消全部加征关税等三项核心关切。2020年1月15日，他与特朗普在白宫东厅签署美中第一阶段贸易协议，中国承诺两年内多进口2000亿美元美国商品与服务；签字仪式上他朗读了习近平的口信。BBC中文网后来指出，由于疫情等原因，这份协议“几乎没有履行”。
      cites: [b09-gov-2019-05-11-liu-he-washington, b09-bbc-2020-01-16-phase-one, b09-bbc-2025-us-china-talks]
    - h: 退而未休
      from: 2022
      to: 2025
      text: >-
        2022年10月二十大，刘鹤与陈希、陈全国等9名十九届政治局委员一起不再进入中央委员会，2023年卸任副总理，中财办主任一职当年由何立峰接任。BBC中文网引述《南华早报》消息人士的说法，刘鹤卸下所有职务后仍参加政府经济事务的内部会议，“并具有很高的影响力”；2023年7月美国财长耶伦访华，见完李强和何立峰后，还专门与已退休的刘鹤见面。
      cites: [b09-rfa-2022-10-22-20th-cc, b09-voa-2023-10-30-he-cfac, b09-bbc-2025-us-china-talks]
  assess:
    - voice: zh
      quote: true
      text: 刘鹤长期在中央任职，扮演“智囊”的角色，从第八个五年计划到第十二个五年计划，刘鹤曾参与制定多份中国经济长期规划
      cite: b09-bbc-2025-us-china-talks
    - voice: zh
      quote: true
      text: 美国彭博新闻社称刘鹤为'中国的萨默斯（美国白宫原首席经济顾问）'，以强调刘鹤在经济决策中的重要性
      cite: b09-dw-2018-03-19-liu-he
    - voice: zh
      quote: true
      text: 对即将扛起美中经贸关系牵头人大任的何立峰来说，刘鹤立下了很好的典范，因为，在华外商圈对刘鹤这几年的专业表现多所肯定。
      cite: b09-voa-2023-11-he-lifeng
  cites: [b09-xinhua-2017-10-25-liu-he-cv, b09-bbc-2018-03-19-liu-he, b09-bbc-2025-us-china-talks, b09-rfa-2021-05-21-liu-he-xi, wd-Q8294074]

- id: chen-xi
  name: 陈希
  pinyin: Chén Xī
  gender: m
  ethnicity: 汉族
  born: 1953-09
  origin: 福建莆田
  education:
    - { school: 清华大学化工系基本有机合成专业, from: 1975, to: 1979 }
    - { school: 清华大学化学与化学工程系, degree: 工学硕士, from: 1979, to: 1982 }
