  life:
    - h: 北大与西藏
      from: 1963
      to: 1997
      text: >-
        1963年4月生，湖北五峰人。1979年考入北京大学中文系，1983年4月入党，同年8月毕业后到西藏，先后在团区委组织部、西藏青年报社、西藏饭店工作，1987年起任团区委副书记、书记，其间做过林芝地区行署副专员，1995年任山南地委副书记、行署专员。中央社统计，他在西藏前后工作达19年。
      cites: [b09-people-2018-03-hu-chunhua-cv, b09-cna-2017-10-01-hu-chunhua]
    - h: 团中央与再度入藏
      from: 1997
      to: 2008
      text: >-
        1997年胡春华调任共青团中央书记处书记、全国青联副主席。2001年他重返西藏，历任自治区党委常委兼秘书长、党委副书记兼政府常务副主席、党委常务副书记；2006年回京任团中央第一书记。法广报道说，他因为与胡锦涛同姓，又有相似的团派政治背景，有“小胡”之称；中央社则说他有“小胡锦涛”之称。
      cites: [b09-people-2018-03-hu-chunhua-cv, b09-rfi-2012-08-08-xiao-hu, b09-cna-2017-10-01-hu-chunhua]
    - h: 河北与内蒙古
      from: 2008
      to: 2012
      text: >-
        2008年胡春华出任河北省代省长、省长，2009年调任内蒙古自治区党委书记，次年兼任自治区人大常委会主任。法广2012年报道说，前一年内蒙古发生骚乱时，主政内蒙古的胡春华处理危机的方式被中央认可；一名接近中共高层的消息人士说，“胡锦涛对胡春华的评价很高，决心提拔他”。当时的分析认为，胡锦涛希望他在十八大直接进入政治局常委会，或者至少调任上海市委书记。
      cites: [b09-people-2018-03-hu-chunhua-cv, b09-rfi-2012-08-08-xiao-hu]
    - h: 政治局与广东
      from: 2012
      to: 2017
      text: >-
        2012年11月十八大，49岁的胡春华进入中央政治局，随后出任广东省委书记。他是十八届政治局委员中第二年轻的，只比同年出生的孙政才大几个月，两人一起被视为政治新星。2016年9月，路透社援引接近中共中央的消息说，他下令镇压了乌坎村的大规模抗议，消息人士称“这对胡春华的能力是一个考验”。十九大前，中央社评论他行情下滑，有人认为他是血统纯正的团派，在习近平眼中是“非我族类”。2017年他保住政治局委员，但没有入常。
      cites: [b09-people-2018-03-hu-chunhua-cv, b09-cna-2022-10-23-hu-chunhua, b09-voa-2016-09-24-wukan, b09-cna-2017-10-01-hu-chunhua]
    - h: 扶贫副总理
      from: 2018
      to: 2022
      text: >-
        2018年3月胡春华任国务院副总理，兼国务院扶贫开发领导小组组长，主抓习近平提出的脱贫攻坚，分管农业农村。2019年他在四川广元的督导推进会上要求“不获全胜、决不收兵”；2020年6月又强调“脱贫攻坚越到最后阶段越要保持定力”，要纠正“急于清零、冲刺抢跑”的苗头。2021年初北京宣布消除绝对贫困。2022年6月，他以中央农村工作领导小组组长身份主持“三农”座谈会，副组长是刚卸任新疆书记的陈全国。
      cites: [b09-people-2018-03-hu-chunhua-cv, b09-xinhua-2019-09-03-hu-poverty, b09-xinhua-2020-06-18-hu-poverty, b09-cna-2022-10-23-hu-chunhua, b09-thepaper-2022-06-14-chen-rural]
    - h: 二十大出局
      from: 2022-10
      to: 2022
      text: >-
        2022年10月二十大，59岁的胡春华仍当选中央委员，却没有进入24人的新一届政治局，而他主管的脱贫攻坚一年多前才被宣布“全面胜利”。法新社的说法是，这位“一度被外界看好的中共政治明星”不但没有入常，“甚至没有进入二十届政治局委员会”。中央社说他从曾经的“太子”沦为“出局”，并引分析以“灭团”形容团派处境；BBC中文网把胡锦涛、李克强、胡春华并列为团派代表，认为团派在习近平主政时期已“逐步退场”。
      cites: [b09-zaobao-2022-10-23-hu-out, b09-cna-2022-10-23-hu-chunhua, b09-bbc-2022-10-25-pb-24, b09-bbc-2022-10-22-20th-close]
    - h: 政协“新兵”
      from: 2023
      to: 2026
      text: >-
        2023年3月，胡春华当选十四届全国政协副主席，任党组副书记。韩国《亚洲经济》引《南华早报》说，他将获授礼节性职务，他“虽然忠实执行了习近平主席的扶贫项目，却从未被视为习家军”。同年4月，他在政协党组学习会上自称“作为一个政协新兵”，表示要“自觉在王沪宁同志的带领下”工作。法广评论说，网上不少人叹息这位前储君贬为政协副主席后仍卖力表态，“行文像小学生表态”。
      cites: [b09-xinhua-2023-03-10-cppcc-vice-cv, b09-asiae-2023-01-18-hu-cppcc, b09-rmzxw-2023-04-03-hu-speech, b09-rfi-2023-04-07-hu-cppcc]
  assess:
    - voice: zh
      quote: true
      text: 從曾經的「太子」到如今的「出局」，胡春華的際遇反映出中共官場最新現實。
      cite: b09-cna-2022-10-23-hu-chunhua
    - voice: zh
      quote: true
      text: 去年10月被排除在政治局之外的‘一度的领导层竞争者’胡春华，将在今年3月获授礼节性职务
      cite: b09-asiae-2023-01-18-hu-cppcc
    - voice: zh
      quote: true
      text: 多是叹息这位前储君，贬为政协副主席，不知为什么还在那么卖力地吹捧习近平。
      cite: b09-rfi-2023-04-07-hu-cppcc
  cites: [b09-people-2018-03-hu-chunhua-cv, b09-xinhua-2023-03-10-cppcc-vice-cv, b09-cna-2022-10-23-hu-chunhua, b09-zaobao-2022-10-23-hu-out, wd-Q1185298]

- id: chen-quanguo
  name: 陈全国
  pinyin: Chén Quánguó
  gender: m
  ethnicity: 汉族
  born: 1955-11
  origin: 河南平舆
  education:
    - { school: 郑州大学经济系政治经济学专业, from: 1978, to: 1981 }
    - { school: 武汉理工大学管理学院, degree: 管理学博士（在职）, from: 1999, to: 2004 }
  joinedParty: 1976-02
  joinedWork: 1973-12
  roles: [pb, cc, prov]
  status: retired
  statusNote: 2021年12月卸任新疆党委书记，2022年6月任中央农村工作领导小组副组长，同年10月未进入二十届中央委员会，此后未见新的公开任职。
  tier: 1
  headline: 西藏自治区党委书记（2011–2016）、新疆维吾尔自治区党委书记（2016–2021）
  ids: { wikidata: Q551462 }
  bio: >-
    陈全国是先后主政西藏和新疆的“维稳”书记，也是第一个兼有两地党委书记经历的高官。他在河南基层和组织系统起家，2011年任西藏党委书记，以密布的便民警务站和联防网络闻名；2016年调任新疆后，再教育营迅速扩张，《纽约时报》披露的内部文件和BBC等媒体发布的“新疆公安文件”显示他亲自下达“应收尽收”的命令。2017年他进入政治局，2020年被美国以人权理由制裁。2021年底他离开新疆，2022年退出中央委员会。
  positions:
    - { title: 遂平县委书记, sys: party, place: 河南, from: 1988, to: 1994, cite: b09-xinhua-2017-10-25-chen-quanguo-cv }
    - { title: 漯河市市长, sys: gov, place: 河南, from: 1996, to: 1998, cite: b09-xinhua-2017-10-25-chen-quanguo-cv }
    - { title: 河南省委组织部部长, sys: party, place: 河南, from: 2000, to: 2004, cite: b09-xinhua-2017-10-25-chen-quanguo-cv }
    - { title: 河北省省长, sys: gov, place: 河北, from: 2010-01, to: 2011, cite: b09-thepaper-2022-06-14-chen-rural }
    - { title: 西藏自治区党委书记, sys: party, place: 西藏, from: 2011-08, to: 2016-08, cite: b09-thepaper-2022-06-14-chen-rural }
    - { title: 新疆维吾尔自治区党委书记、新疆生产建设兵团第一政委, sys: party, place: 新疆, from: 2016-08, to: 2021-12, cite: b09-thepaper-2022-06-14-chen-rural }
    - { title: 中央政治局委员, sys: party, from: 2017-10, to: 2022-10, cite: b09-xinhua-2017-10-25-chen-quanguo-cv }
    - { title: 中央农村工作领导小组副组长, sys: party, from: 2022-06, cite: b09-thepaper-2022-06-14-chen-rural }
  life:
    - h: 河南基层起家
      from: 1955
      to: 1998
      text: >-
        1955年11月生，河南平舆人。1973年12月参军，在陆军一军三师炮团服役四年，1976年入党；退伍后在驻马店汽车配件厂当工人，1978年考入郑州大学经济系。毕业后他从平舆县辛店公社、驻马店地委办公室秘书做起，1988年任遂平县委书记，1994年任平顶山市委组织部长，1996年任漯河市委副书记、市长。
      cites: [b09-xinhua-2017-10-25-chen-quanguo-cv]
    - h: 河南组织部长与河北省长
      from: 1998
      to: 2011
      text: >-
        1998年陈全国升任河南省副省长，此后长期主管组织工作，历任省委常委、组织部部长和省委副书记，其间在武汉理工大学在职读完管理学博士。2009年他调任河北省委副书记、代省长，2010年1月任省长。这一阶段他的履历仍是典型的内地省级官员，没有民族地区工作经历。
      cites: [b09-xinhua-2017-10-25-chen-quanguo-cv, b09-thepaper-2022-06-14-chen-rural]
    - h: 治藏五年
      from: 2011-08
      to: 2016-08
      text: >-
        2011年8月，陈全国出任西藏自治区党委书记。法广引《南华早报》报道说，他治藏期间从2012年起要求所有藏人交出普通护照，在拉萨建了156个便民警务站，有的两站相距仅15米；全区组建了8万多个“双联防队”，300多万人被纳入监视网。澳洲拉筹伯大学学者雷国俊统计，陈全国在西藏至少创建了6套维稳措施，调任新疆后又把它们搬了过去。
      cites: [b09-xinhua-2017-10-25-chen-quanguo-cv, b09-thepaper-2022-06-14-chen-rural, b09-rfi-2016-12-13-chen-tibet]
    - h: 新疆：“应收尽收”
      from: 2016-08
      to: 2019
      text: >-
        2016年8月陈全国调任新疆党委书记兼兵团第一政委。2017年2月，他在乌鲁木齐万人反恐维稳誓师大会上宣称“危害不除，新疆难安”，要求对暴恐分子“追着打、压着打、挖着打”。同年10月他进入中央政治局。《纽约时报》2019年11月根据403页泄露的内部文件报道，陈全国上任后新疆的拘禁营迅速扩大，他发布了“应收尽收”的命令；同月国际调查记者同盟公布“中国电文”，其中一份文件显示2017年仅一周就有1.5万人被送往再教育营。
      cites: [b09-xinhua-2017-10-25-chen-quanguo-cv, b09-chinanews-2017-02-28-chen-rally, b09-nyt-2019-11-16-xinjiang-papers, b09-bbc-2019-11-25-china-cables]
    - h: 铁腕治疆
      from: 2016-08
      to: 2021-12
      text: >-
        德国之声说，与新疆前任张春贤相比，陈全国的治疆策略更为强硬，他曾在“反恐维稳誓师大会”上说“在新疆，没有稳定一切皆为零”；据官媒报道，“暗访”是他最喜欢的手法之一。中央社概括说，他最为人所知的是“铁腕治疆”，包括大兴再教育营、扩大招募维稳人员、强力推行“反恐”措施，屡屡引发西方批评，北京则辩称这些手段是在打击极端主义。
      cites: [b09-dw-2021-12-chen-leaves, b09-cna-2022-06-15-chen-rural]
    - h: 制裁与调离
      from: 2020
      to: 2021-12
      text: >-
        2020年7月9日，美国宣布制裁陈全国、朱海仑、王明山和霍留军。2021年3月欧盟、英国和加拿大制裁四名新疆官员，名单上却没有陈全国；路透社引专家和外交人士说，这是“为了避免发生更大的外交争端”。2021年12月25日，新华社宣布陈全国不再兼任新疆党委书记，由马兴瑞接任，“陈全国同志将另有任用”。BBC中文网引学者陆曦的分析说，这说明北京认为“陈全国的强硬手腕已经收获预期的成效”。
      cites: [b09-bbc-2020-07-09-sanctions, b09-voa-2021-03-23-free-tibet, b09-thepaper-2022-06-14-chen-rural, b09-bbc-2021-12-26-chen-leaves]
    - h: “新疆公安文件”
      from: 2022-05
      to: 2022-05
      text: >-
        2022年5月，BBC等多家国际媒体发布“新疆公安文件”，其中收录了陈全国对军队和警察系统高级干部的讲话：“对于一些人，甚至5年的再教育可能是不够的”；“这些人一旦放出去，问题又会重新出现，这就是新疆的现实。”BBC认为，这似乎承认只要维吾尔人继续忠于自己的民族身份或信仰，打压就不会停止。这批文件是BBC等媒体当年早些时候收到的，经过数月调查和真伪鉴定才发表。
      cites: [b09-bbc-2022-05-24-police-files, b09-cna-2022-06-15-chen-rural]
    - h: 闲职与退出
      from: 2022-06
      to: 2022-10
      text: >-
        2022年6月14日，陈全国以中央农村工作领导小组副组长的新身份首次亮相，给组长胡春华当副手。同年10月二十大，他与刘鹤、陈希等9名十九届政治局委员一起不再进入中央委员会。按他1955年11月的出生年月推算，当时他还不满67岁，并未到“七上八下”的退休年龄。此后未见他新的公开任职。
      cites: [b09-thepaper-2022-06-14-chen-rural, b09-cna-2022-06-15-chen-rural, b09-rfa-2022-10-22-20th-cc, b09-xinhua-2017-10-25-chen-quanguo-cv]
  assess:
    - voice: zh
      quote: true
      text: 之前的张春贤因为不够强硬而受到批评，尽管我认为原因应该是党内派系的不和所致，但现在人人都似乎同意陈全国是个铁腕统治者
      cite: b09-rfi-2016-12-13-chen-tibet
    - voice: zh
      quote: true
      text: 陈全国是第一个拥有西藏、新疆两地党委书记身份的高官。与其在新疆的前任张春贤相比，陈全国的治疆策略更为强硬。
      cite: b09-dw-2021-12-chen-leaves
    - voice: zh
      quote: true
      text: 他最為人所知的是其「鐵腕治疆」策略，包含大興再教育營、擴大招募維穩人員，強力實施「反恐」措施等等，屢屢引發西方批評；北京則為其辯護，稱這些鐵腕手段是在打擊極端主義。
      cite: b09-cna-2022-06-15-chen-rural
    - voice: zh
      quote: true
      text: 他因在任内通过铁腕政策压制该地区的维吾尔族和其他穆斯林少数民族成为西方国家制裁的目标
      cite: b09-bbc-2021-12-26-chen-leaves
  cites: [b09-xinhua-2017-10-25-chen-quanguo-cv, b09-thepaper-2022-06-14-chen-rural, b09-nyt-2019-11-16-xinjiang-papers, b09-bbc-2022-05-24-police-files, wd-Q551462]

- id: he-lifeng
  name: 何立峰
  pinyin: Hé Lìfēng
  gender: m
  ethnicity: 汉族
  born: 1955-02
  origin: 广东兴宁
  education:
    - { school: 厦门大学经济系财政金融专业, from: 1978, to: 1982 }
    - { school: 厦门大学财政金融系, degree: 硕士研究生, from: 1982, to: 1984 }
    - { school: 厦门大学财政金融系, degree: 经济学博士（在职）, from: 1995, to: 1998 }
  joinedParty: 1981-06
  joinedWork: 1973-08
  roles: [pb, cc, minister]
  status: active
  statusNote: 现任中央政治局委员、国务院副总理、中央财经委员会办公室主任，2026年9月仍以中美经贸中方牵头人身份赴美磋商。
  tier: 1
  headline: 中共中央政治局委员、国务院副总理（2023– ），中美经贸中方牵头人
  ids: { wikidata: Q8291839 }
  factions:
    - f: fujian
      cite: b09-voa-2023-11-he-lifeng
      quote: 隶属于习近平“福建帮”人马的何立峰
  bio: >-
    何立峰是习近平在福建时期的老部下，也是习近平第三任期的经济主管。他在厦门大学读完本科和硕士，1984年进入厦门政坛，次年习近平到厦门任副市长，此后他一路升任泉州、福州、厦门的党政一把手。2009年他调到天津主持滨海新区，2014年进入国家发改委，2017年任主任。2022年他进入政治局，2023年任副总理并接任中财办主任，接替刘鹤成为中美经贸谈判的中方牵头人。
  positions:
    - { title: 厦门市财政局局长, sys: gov, place: 福建, from: 1987, to: 1990, cite: b09-xinhua-2018-03-14-he-lifeng-cv }
    - { title: 厦门市副市长, sys: gov, place: 福建, from: 1992, to: 1995, cite: b09-xinhua-2018-03-14-he-lifeng-cv }
    - { title: 泉州市市长、市委书记, sys: party, place: 福建, from: 1995, to: 2000, cite: b09-xinhua-2018-03-14-he-lifeng-cv }
    - { title: 福州市委书记, sys: party, place: 福建, from: 2000, to: 2005, cite: b09-xinhua-2018-03-14-he-lifeng-cv }
    - { title: 厦门市委书记, sys: party, place: 福建, from: 2005, to: 2009, cite: b09-xinhua-2018-03-14-he-lifeng-cv }
    - { title: 天津市委副书记、滨海新区区委书记, sys: party, place: 天津, from: 2009, to: 2013, cite: b09-xinhua-2018-03-14-he-lifeng-cv }
    - { title: 国家发展和改革委员会主任, sys: gov, from: 2017, to: 2023, cite: b09-xinhua-2018-03-14-he-lifeng-cv }
    - { title: 中央政治局委员, sys: party, from: 2022-10, cite: b09-xinhua-2022-10-23-he-lifeng-cv }
    - { title: 国务院副总理, sys: gov, from: 2023-03, cite: b09-xinhua-2023-03-12-vice-premiers }
    - { title: 中央财经委员会办公室主任, sys: party, from: 2023-10, cite: b09-voa-2023-10-30-he-cfac }
  life:
    - h: 知青与厦大
      from: 1955
      to: 1984
      text: >-
        1955年2月生，广东兴宁人。1973年8月起，他在福建永定县立新知青农场插队三年，又在狮象潭水电站当了两年工人。1978年考入厦门大学经济系财政金融专业，1981年6月入党，本科毕业后继续读财政学硕士研究生，1984年毕业。此后他的整个前半段仕途都在福建，尤其是厦门。
      cites: [b09-xinhua-2018-03-14-he-lifeng-cv]
    - h: 厦门：习近平的属下
      from: 1984
      to: 1995
      text: >-
        1984年何立峰进入厦门经济特区经济研究所，随即调到市政府办公室，做到副主任。美国之音指出，他1984年踏入厦门政坛后的“最大贵人是习近平”：习1985年出任厦门副市长，何立峰随后升任市财政局副局长、局长，又任杏林区委书记，1992年任厦门副市长，兼象屿保税区管委会主任。BBC中文网也说，1980年代他曾是习近平的属下。
      cites: [b09-xinhua-2018-03-14-he-lifeng-cv, b09-voa-2023-11-he-lifeng, b09-bbc-2023-03-12-new-govt]
    - h: 泉州、福州、厦门一把手
      from: 1995
      to: 2009
      text: >-
        1995年起何立峰历任泉州市代市长、市长和市委书记，其间在厦门大学在职读完财政学博士。2000年他调任福州市委书记，次年进入福建省委常委；2005年至2009年改任厦门市委书记，后兼市人大常委会主任。在福建工作的三十多年里，他从知青一路做到省委常委，十七届中共中央把他列为候补委员。
      cites: [b09-xinhua-2018-03-14-he-lifeng-cv]
    - h: 天津与发改委
      from: 2009
      to: 2022
      text: >-
        2009年何立峰离开福建，任天津市委副书记，主持滨海新区工委和管委会，兼塘沽区委书记，此后任滨海新区区委书记；2013年转任天津市政协主席。2014年他调任国家发改委副主任（正部长级），2017年升任主任、党组书记，2018年3月兼任十三届全国政协副主席。直到十九大，他才从中央候补委员升为中央委员。
      cites: [b09-xinhua-2018-03-14-he-lifeng-cv, b09-bbc-2023-03-12-new-govt]
    - h: 入局与经济主管
      from: 2022-10
      to: 2023
      text: >-
        2022年10月二十大，何立峰进入中央政治局；2023年3月任国务院副总理。同年10月，官媒报道他已接替刘鹤出任中央财经委员会办公室主任。美国之音引观察人士说，他既不是习近平的经济顾问，也不是“经济沙皇”，而是靠“裙带关系”上位、被安插来执行习近平的经济路线；前美国商会上海分会会长季恺文则说，他能否施展，“端赖习近平是否释权”。
      cites: [b09-xinhua-2022-10-23-he-lifeng-cv, b09-xinhua-2023-03-12-vice-premiers, b09-voa-2023-10-30-he-cfac, b09-voa-2023-11-he-lifeng]
    - h: 外商眼中的接班人
      from: 2023
      to: 2023
      text: >-
        何立峰接手的是刘鹤留下的经济和对美经贸两条线。季恺文对美国之音说，他回中国拜会的不少美商多数对何立峰的新人新政抱持乐观期待，认为他是个务实派，但“未来6-18个月，习近平如何治理经济将见真章”。他认为刘鹤为何立峰立下了很好的典范：“商界乐见两国经贸谈判者展现稳当的专业能力”，在特朗普执政期间官员到处放火，让大家很不安。
      cites: [b09-voa-2023-11-he-lifeng]
    - h: 中美经贸牵头人
      from: 2025
      to: 2026
      text: >-
        2025年5月10日至11日，何立峰在瑞士日内瓦与美国财长贝森特、贸易代表格里尔举行中美经贸高层会谈。他在会谈中说，“贸易战没有赢家，中方不愿打贸易战，但也不怕打”，美方若执意侵害中方权益，中方将“奉陪到底”。会后他在新闻发布会上称，会谈“迈出了通过平等对话协商解决分歧的重要一步”，双方一致同意建立中美经贸磋商机制，并于5月12日发布联合声明。
      cites: [b09-mofcom-2025-05-12-geneva-talks, b09-gov-2025-05-12-he-geneva-presser]
    - h: 磋商机制下的谈判
      from: 2025-05
      to: 2026-09
      text: >-
        日内瓦会谈后，中美经贸磋商机制由何立峰与贝森特、格里尔分别牵头，谈判一轮轮延续。2026年9月20日起，他率团在美国纽约等地进行第八轮经贸磋商；商务部发言人何亚东介绍，双方围绕对等降税安排、建立贸易理事会和投资理事会、吉隆坡经贸磋商联合安排延期等问题达成多项共识，何立峰与贝森特还在这一机制下就人工智能进行了首次对话。
      cites: [b09-chinanews-2026-09-24-eighth-round, b09-mofcom-2025-05-12-geneva-talks]
  assess:
    - voice: zh
      quote: true
      text: 观察人士多认为，他既不是习近平的经济顾问，也不是中国的经济沙皇，因为隶属于习近平“福建帮”人马的何立峰，是靠“裙带关系”上位，仅是被安插来执行习近平的左倾经济路线。
      cite: b09-voa-2023-11-he-lifeng
    - voice: zh
      quote: true
      text: 多数都对何立峰的新人新政抱持乐观期待，认为他是个务实派
      cite: b09-voa-2023-11-he-lifeng
    - voice: zh
      quote: true
      text: 68岁的他曾在福建长期工作，1980年代他曾是习近平的属下。
      cite: b09-bbc-2023-03-12-new-govt
  cites: [b09-xinhua-2018-03-14-he-lifeng-cv, b09-xinhua-2022-10-23-he-lifeng-cv, b09-xinhua-2023-03-12-vice-premiers, b09-voa-2023-11-he-lifeng, wd-Q8291839]

