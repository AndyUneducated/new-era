  factions:
    - f: qinghua
      cite: b09-voa-2017-11-16-chen-xi
      quote: 习近平的清华同窗、中共十九大后跻身政治局委员、晋升中组部部长兼中央党校校长的陈希
    - f: xi-jiajun
