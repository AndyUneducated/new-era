  statusNote: 2023年3月起任十四届全国政协副主席、全国政协党组副书记，仍为二十届中央委员。
  tier: 1
  headline: 全国政协副主席（2023– ），前国务院副总理（2018–2023）
  ids: { wikidata: Q1185298 }
  factions:
    - f: tuanpai
      cite: b09-cna-2022-10-23-hu-chunhua
      quote: 由於升遷路線與共青團分不開，因此被外界視為「團派」的一員
  bio: >-
    胡春华曾被普遍视为胡锦涛属意的接班人。他北大毕业后到西藏工作近二十年，又任共青团中央第一书记，因与胡锦涛同姓、同为团派出身，被称为“小胡”。2012年他以49岁进入政治局并主政广东，2018年任分管扶贫和农业的副总理。但他2017年未能入常，2022年二十大更连政治局委员都没有保住，次年转任全国政协副主席。外媒普遍把他的出局看作团派在习近平时代彻底退场的标志。
  positions:
    - { title: 共青团西藏自治区委书记, sys: party, place: 西藏, from: 1992, to: 1995, cite: b09-people-2018-03-hu-chunhua-cv }
    - { title: 共青团中央书记处书记, sys: party, from: 1997, to: 2001, cite: b09-people-2018-03-hu-chunhua-cv }
    - { title: 西藏自治区党委副书记、常务副书记, sys: party, place: 西藏, from: 2003, to: 2006, cite: b09-people-2018-03-hu-chunhua-cv }
    - { title: 共青团中央书记处第一书记, sys: party, from: 2006, to: 2008, cite: b09-people-2018-03-hu-chunhua-cv }
