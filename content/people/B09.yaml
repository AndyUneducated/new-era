  bio: >-
    李源潮是胡锦涛时代团派的代表人物之一。他是复旦大学数学系七七级学生，1983年进入团中央书记处，此后历任外宣办副主任、文化部副部长、江苏省委书记。2007年他进入政治局并出任中组部长，主管干部人事五年；十八大前一度是入常大热门，却意外落选，转任国家副主席。2017年十九大，67岁的他退出中央委员会，2018年卸任后退休。海外媒体多次传出他受调查甚至自杀的消息，都未获官方证实。
