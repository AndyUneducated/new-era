  bio: >-
    陈希是习近平在清华大学的同学和室友，也是习近平时代掌管干部人事的关键人物。他在清华从团委干部做到党委书记，2008年后经教育部、辽宁、中国科协辗转，十八大后调入中组部任常务副部长，2017年进入政治局并出任中组部长兼中央党校校长，主持了十九大到二十大之间的干部布局，提出选拔干部必须“突出政治标准”。2022年二十大他退出政治局，2023年交出中组部，2026年卸任中央党校校长。
  positions:
