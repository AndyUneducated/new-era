- id: he-xuefeng
  name: 贺雪峰
  gender: m
  born: 1968
  birthplace: 湖北荆门
  roles: [scholar]
  status: active
  statusNote: 武汉大学社会学院院长、中国乡村治理研究中心主任。
  tier: 2
  headline: 武汉大学社会学院院长、中国乡村治理研究中心主任，“华中乡土派”代表人物
  ids: { wikidata: Q111312626 }
  bio: >-
    社会学者，1968 年生于湖北荆门，原华中科技大学教授，现任武汉大学社会学院院长，2015 年入选长江学者特聘教授。他自 2004 年起每年驻村调研两三个月，
    2009 年出版《地权的逻辑》，与周其仁争论农民土地权利；他认为增减挂钩指标“并不会产生财富，仅仅是一种财富转移”，2020 年与桂华撰文批评山东大范围合村并居。
  positions:
    - { title: 华中科技大学教授, sys: other, cite: cs11-zhwiki-he-xuefeng }
    - { title: 武汉大学社会学院院长, sys: other, cite: cs11-93-2021-he-xuefeng }
    - { title: 武汉大学中国乡村治理研究中心主任, sys: other, cite: cs11-93-2021-he-xuefeng }
    - { title: 九三学社湖北省委常委, sys: other, place: 湖北, cite: cs11-93-2021-he-xuefeng }
  assess:
    - voice: official
      quote: true
      text: 学术上强调经验训练的极端重要性，主张建立有主体性的中国社会科学。
      cite: cs11-93-2021-he-xuefeng
    - voice: scholar
      quote: true
      text: 实际上，增减挂钩没有创造出任何财富，只是转移了财富。
      cite: cs11-aisixiang-2019-he-xuefeng-guagou
    - voice: scholar
      quote: true
      text: 地方政府套用城乡建设用地“增减挂钩”政策搞合村并居，一是想解决建设用地指标问题，二是想解决乡村建设资金来源问题。
      cite: e16-sdaeu-2020-06-12-he-xuefeng-hecun
