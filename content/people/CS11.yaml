  assess:
    - voice: scholar
      quote: true
      text: 干部考核制度对于经济发展绩效的倚重直接引发了地方官员围绕着区域经济发展的晋升竞争，即基于经济增长的“政治锦标赛”。
      cite: e16-thepaper-2018-05-25-zhou-lian-governance
    - voice: scholar
      quote: true
      text: 此外，相对于市场竞争，官场竞争更具有零和性质。
      cite: e16-sina-2014-03-20-zhou-lian-nfc
    - voice: scholar
      quote: true
      text: 改革开放以后的中国并不存在一个从中央到省、从省到地市、从地市到县乃至乡的层层放大的、将政治提拔和经济增长，或主要经济指标直接挂钩的考核体系。
      cite: e16-cufe-li-zhou-vs-tao
