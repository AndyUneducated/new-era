  bio: >-
    从仓库管理员起步、四十多年不离上海的地方官员，团市委书记出身，2003 年起任上海市长近十年。2006 年陈良宇被查后代理市委书记，2007 年习近平到任后退回市长，2012 年再任市委书记。
    外界常把他归入“上海帮”，但他先后与习近平、俞正声共事而未受清洗。2017 年入常，2018–2023 年任常务副总理，分管港澳；2022 年退出常委会后于 2023 年当选国家副主席，多次作为习近平特别代表出访。
