      text: 韓正被視為江派，不利他的傳聞也未間斷，但韓正至今屹立不搖，顯見其政治底蘊與智慧確有過人之處。
      cite: b06-rti-2017-han-shanghai
    - voice: zh
      quote: true
      text: 韩正的主要政治生涯都在上海度过，其主要政绩集中在经济改革、城市治理领域。
      cite: b06-bbc-2017-10-25-19th-psc
  cites: [b06-xinhua-2018-03-19-han-resume, b06-gov-2023-03-10-han-vp, b06-bbc-2014-09-23-shanghai-gang, b06-rti-2017-han-shanghai, wd-Q48405]

