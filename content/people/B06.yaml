      text: 高新说，有人把现任上海市委书记韩正视为是“上海帮”今天的代表人物。但韩正是在习近平、俞正声先后掌管上海市时期已经“考验过关了”的。
      cite: b06-bbc-2014-09-23-shanghai-gang
    - voice: zh
