    - h: 上海仕途
      from: 1999
      to: 2007
      text: >-
        1999 年任上海市科委副主任，2001 年任闸北区代区长、区长；2004 年任市委组织部副部长兼市人事局局长，2006 年任市委副秘书长、办公厅主任。中央社指出，除了近三年的闸北区长外，他没有地方一、二把手的经验。
      cites: [b06-people-2017-10-25-ding-resume, b06-cna-2023-03-12-ding-vp]
    - h: 习近平的政治秘书
      from: 2007
      to: 2013
      text: >-
        2007 年习近平短暂主政上海，45 岁的丁薛祥任市委常委、秘书长，BBC 中文说他由此成为“时任上海市委书记习近平的政治秘书”。两人共事不到一年习近平就调入中央，但 BBC 认为这段经历为他赢得了习近平的信任。2012 年他转任上海市委政法委书记。
      cites: [b06-people-2017-10-25-ding-resume, b06-bbc-2022-10-23-psc, b06-voa-2023-03-12-vice-premiers]
    - h: 中办与“习办”
      from: 2013
      to: 2022
      text: >-
        2013 年习近平任国家主席后，他调任中央办公厅副主任兼国家主席办公室主任，BBC 中文称这是授予他的习近平个人办公室主任的新头衔，此后他多次陪同习近平出访。2015 年主持中办常务工作，2017 年进入政治局和书记处并任中办主任，被视为习近平的“左膀右臂”。到 2022 年，他还兼任中央和国家机关工作委员会书记；据美国之音，他同时仍兼任习近平办公室主任。中央社写道，习近平出访或接见外宾时，总能看见他的身影。
      cites: [b06-people-2017-10-25-ding-resume, b06-bbc-2022-10-23-psc, b06-cna-2023-03-12-ding-vp, b06-cppcc-2022-10-23-20th-resumes, b06-voa-2023-03-12-vice-premiers]
    - h: 入常与第一副总理
      from: 2022
      to: 2023
      text: >-
        2022 年二十大，他进入常委会，排名第六。BBC 中文引分析人士宋文笛说，他原本很可能在政治局委员层级再待一届，习近平却把常委席位给了他，显示有意把他培养成党内传统上可以接受的总理人选。宋文笛认为，习近平本可以把这个位置留给入常最后机会的黄坤明或李鸿忠，但没有这样做；考虑到李强的年龄，丁薛祥被看作下一届总理的可能人选。
        BBC 也指出，往届常委中通常有一人出任常务副总理，如张高丽、韩正，而他的履历里没有主政一方的经历。蔡奇出任书记处排名第一的书记后，他于 2023 年 3 月转任排名第一的国务院副总理，即常务副总理。
      cites: [b06-bbc-2022-10-23-psc, b06-cna-2023-03-12-ding-vp, b06-voa-2023-03-12-vice-premiers]
    - h: 科技与经济外交
      from: 2023
      text: >-
        2023 年机构改革新组建中央科技委员会，负责审议国家科技发展重大战略、统筹国家实验室等战略科技力量。2024 年 6 月 25 日他首次以委员会主任身份亮相，在全国科技大会上强调“要以新型举国体制推进科技创新”，加快关键核心技术攻关。
        2025 年 1 月 21 日，他在达沃斯世界经济论坛年会致辞，说“关税战、贸易战阴云密布”，称中国“不追求贸易顺差”，外资准入负面清单已从 2013 年的 190 条压缩到 27 条；他也承认外资企业有时会遭遇“玻璃门”“弹簧门”问题，表示愿意一起解决。
        2026 年 4 月作为习近平主席特别代表访问土库曼斯坦，出席复兴气田四期项目开工仪式，签署两国天然气合作基本原则总协议；9 月在符拉迪沃斯托克出席东方经济论坛期间会见普京，与俄方共同主持中俄投资合作委员会和能源合作委员会会议，并出席中俄能源商务论坛。
      cites: [b06-cna-2024-06-26-ding-tech, b06-gov-2024-06-25-ding-tech, b06-gov-2025-01-21-ding-davos, b06-embassy-2026-04-18-ding-turkmenistan, b06-gov-2026-09-05-ding-putin]
  assess:
    - voice: scholar
      quote: true
      text: 相反他把这个位置给了丁，显示出他准备把丁培养成一个在党内传统上可以接受的总理人选。
      cite: b06-bbc-2022-10-23-psc
    - voice: zh
      quote: true
      text: 丁薛祥雖然長期擔任幕僚工作，但除了曾擔任近3年的上海市閘北區長外，沒有地方一、二把手經驗。
      cite: b06-cna-2023-03-12-ding-vp
    - voice: zh
      quote: true
      text: 尽管两个人共事时间不到一年，习近平就被调入中央，但这段时间仍可能为他赢得了习近平的信任。
      cite: b06-bbc-2022-10-23-psc
    - voice: zh
      quote: true
      text: 若按「七上八下」的年齡劃分未被全然打破，依照他的出生年齡，以及現在歷練副總理的全國性經驗，有機會接任下屆國務院總理，但仍需觀察是否被視為接班人選。
      cite: b06-cna-2023-03-12-ding-vp
  cites: [b06-people-2017-10-25-ding-resume, b06-cppcc-2022-10-23-20th-resumes, b06-bbc-2022-10-23-psc, b06-cna-2023-03-12-ding-vp, wd-Q8292421]

- id: li-xi
