    北京任内因大兴火灾后的清理行动引发“低端人口”争议，也主持了 2022 年冬奥会。二十大后进入常委会，任书记处第一书记，并以常委身份兼任中办主任，2026 年又兼任中央党校校长，被外媒称为习近平实际上的幕僚长。
