  life:
    - h: 瑞安的工人
      from: 1976
      to: 1984
      text: >-
        1976 年在瑞安县马屿区机电排灌站当职工，后到县工具三厂做工。1978 年考入浙江农业大学宁波分校农机系，1982 年毕业后回瑞安做团的工作，1984 年任团县委书记。BBC 中文介绍他时第一句就是：“李强曾是一名工人”。
      cites: [b06-xinhua-2017-10-25-li-qiang-resume, b06-bbc-2022-10-23-psc]
    - h: 民政厅到温州
      from: 1984
      to: 2004
      text: >-
        1984 年调浙江省民政厅，在农村救济处一路做到处长，1992 年任副厅长。1996 年任金华市委常委、永康市委书记，1998 年任省政府办公厅副主任，2000 年任省工商局局长，2002 年任温州市委书记。
        温州是中国民营经济最发达的地方之一，2023 年记者会上新加坡《联合早报》记者提问时特别提到他这段经历。
      cites: [b06-xinhua-2017-10-25-li-qiang-resume, b06-gov-2023-03-13-li-qiang-presser]
    - h: 习近平的省委秘书长
      from: 2004
      to: 2012
      text: >-
        2004 年 11 月，他出任时任省委书记习近平的省委秘书长，次年进入省委常委会。美国之音称这是他仕途的重大转折点，他由此成为后来“之江新军”中的一员大将。BBC 中文写道，两人“常常工作到深夜，给上级留下深刻印象”。
        《卫报》说，那几年他实际上是习近平最主要的私人助手，陪同习近平外出考察、修改讲稿。2007 年习近平调走后，他继续任秘书长至 2012 年，其间兼任省委副书记、政法委书记。
      cites: [b06-voa-2022-10-23-li-qiang, b06-bbc-2023-03-04-li-qiang-deputy, b06-guardian-2022-10-24-li-qiang, b06-xinhua-2017-10-25-li-qiang-resume]
    - h: 浙江省长与江苏
      from: 2012
      to: 2017
      text: >-
        2012 年 12 月 21 日，他接替夏宝龙任浙江代省长，2013 年 1 月转正。《纽约时报》指出，这是习近平成为最高领导人仅两个月后作出的任命。2016 年他调任江苏省委书记。BBC 中文报道，他曾与阿里巴巴创始人马云等企业高管会面，就营商环境征求意见。
      cites: [b06-voa-2022-10-23-li-qiang, b06-nytcn-2023-03-14-li-qiang, b06-bbc-2023-03-04-li-qiang-deputy]
    - h: 上海与封城
      from: 2017
      to: 2022
      text: >-
        2017 年十九大进入政治局，任上海市委书记。2022 年春奥密克戎疫情暴发，上海坚持“动态清零”，将 2500 万人封控在家约两个月。4 月他在《新闻联播》上表示坚持“动态清零”总方针不动摇，又说“我相信历史会记住为这座城市坚守和付出的所有人”。
        BBC 中文报道，封城导致上海民生危机频发，他在居民区视察时还罕见地被情绪激动的居民当面斥责。
      cites: [b06-cctv-2022-04-17-shanghai-zero, b06-nytcn-2023-03-14-li-qiang, b06-bbc-2022-10-23-psc]
    - h: 封城后反升总理
      from: 2022
      to: 2023
      text: >-
        外界原本认为封城会影响他的仕途，但 2022 年 10 月二十大上，他紧随习近平之后出场，排名第二。美国之音写道，上海许多人相信封城的决定是中央而非李强作出的，他只是忠实执行“清零”，而这份忠诚在二十大上得到回报。
        《纽约时报》认为，他在上海防疫上的转向显示出对习近平的忠诚。BBC 中文引学者张扬指出，他将是第一个没有中央工作经验、从地方直接升任的总理，也是周恩来之后唯一没有当过副总理的总理。2023 年 3 月十四届全国人大一次会议上，他出任国务院总理。
      cites: [b06-bbc-2022-10-23-psc, b06-voa-2022-10-23-li-qiang, b06-nytcn-2023-03-14-li-qiang, b06-guardian-2022-10-24-li-qiang, b06-gov-2023-03-12-li-qiang-resume]
    - h: 总理任内与取消记者会
      from: 2023
      text: >-
        2023 年 3 月 13 日首场记者会上，他说去年社会上“有一些不正确的议论”，使民营企业家感到忧虑，并要求官员“不能光踩刹车、不踩油门”。但这也是最后一场：2024 年 3 月 4 日，人大发言人娄勤俭宣布当年及本届人大余下几年都不再举行总理记者会。
        《联合早报》称，这打破了延续 30 多年的惯例；据中央社梳理，这一做法始于 1988 年李鹏，1993 年起成为常态，中国网民讥讽为“演都不演了”。此后他继续主持国务院：外交部 2025 年 11 月宣布，他将出席莫斯科上合组织总理会议、访问赞比亚并赴约翰内斯堡出席 G20 峰会；2026 年 3 月的政府工作报告把当年增长目标定为 4.5%－5%；6 月在大连出席夏季达沃斯论坛。
      cites: [b06-gov-2023-03-13-li-qiang-presser, b06-zaobao-2024-03-04-no-presser, b06-cna-2024-03-04-no-presser, b06-gov-2025-11-13-li-qiang-trip, b06-gov-2026-03-05-gwr-digest, b06-mfa-2026-06-24-li-davos]
  assess:
    - voice: west
      quote: true
      text: Li’s appointment demonstrates that Xi places loyalty and trustworthiness above all else, according to analysts.
      zh: 分析人士认为，李强的任命表明习近平把忠诚和可靠放在高于一切的位置。
      cite: b06-guardian-2022-10-24-li-qiang
    - voice: scholar
      quote: true
      text: The premier’s role in relation to Xi has changed into that of an executor of his decisions. What (Xi) needs is a strong implementer, and during the Shanghai lockdown, Li has proven himself as a loyal enforcer of Xi’s zero-Covid policy
      zh: 总理相对于习近平的角色已变成其决策的执行者。习需要的是一个强有力的执行人，而在上海封城期间，李强已证明自己是习近平清零政策的忠实执行者。（前上海政法学院教授陈道银）
      cite: b06-guardian-2022-10-24-li-qiang
    - voice: zh
      quote: true
      text: 李强在上海防疫上的转向显示出他对习近平的忠诚，这一点似乎让他在过去20年里一直与这位最高领导人保持着密切联系，并最终使他在周六被提拔到总理位置。
      cite: b06-nytcn-2023-03-14-li-qiang
    - voice: scholar
      quote: true
      text: 李强将成为华国锋下台后，首位权力基础不再独立于党领导人的总理，他的权力基础恰恰来自于党的领导人。
      cite: b06-bbc-2022-10-23-psc
    - voice: zh
      quote: true
      text: 取消总理记者会代表高层持续收紧对媒体和信息管控，让中国扩大开放的承诺大打折扣，必将进一步冲击在华外企信心。
      cite: b06-zaobao-2024-03-04-no-presser
  cites: [b06-xinhua-2017-10-25-li-qiang-resume, b06-gov-2023-03-12-li-qiang-resume, b06-voa-2022-10-23-li-qiang, b06-guardian-2022-10-24-li-qiang, b06-nytcn-2023-03-14-li-qiang, wd-Q4414390]

