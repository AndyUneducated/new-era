  life:
    - h: 福建省委办公厅
      from: 1973
      to: 1999
      text: >-
        1973 年到永安县西洋公社插队，1975 年入福建师范大学政教系，毕业后留校在党委办公室工作。1983 年调福建省委办公厅，历任综合处副处长、正处级秘书、省委办公厅副主任，1994 年起到三明挂职，后任三明市长。
        这一时期习近平也在福建任职，BBC 中文称他是习近平在福建和浙江的旧部。
      cites: [b06-people-2017-10-25-cai-resume, b06-bbc-2022-09-psc-candidates]
    - h: 浙江十五年
      from: 1999
      to: 2014
      text: >-
        1999 年调浙江任衢州市长，此后历任衢州、台州市委书记、杭州市长；2010 年任省委常委、组织部部长，2013 年任副省长。习近平 2002 至 2007 年主政浙江，正与他的浙江任期重叠。
        《卫报》把他与李强、李希一并列入所谓“New Zhijiang Army”，即习近平主政浙江时的部下。
      cites: [b06-people-2017-10-25-cai-resume, b06-guardian-2022-10-24-li-qiang]
    - h: 国安办与北京
      from: 2014
      to: 2017
      text: >-
        2014 年调任新成立的中央国家安全委员会办公室副主任，2015 年主持常务工作，2016 年任北京市委副书记、代市长，次年任市长、市委书记。2017 年十九大上，他在并非中央委员或候补委员的情况下直接进入政治局。
        BBC 中文形容他“曾有着火箭般的官场跃升速度”。
      cites: [b06-people-2017-10-25-cai-resume, b06-bbc-2022-10-23-psc, b06-bbc-2022-09-psc-candidates]
    - h: 大兴火灾与“低端人口”
      from: 2017-11
      to: 2017-12
      text: >-
        2017 年 11 月 18 日晚，大兴区西红门镇新建二村发生火灾，19 人死亡、8 人受伤，死者中有 8 名儿童。蔡奇当晚赶赴现场，次日带领全体市领导在火灾现场开会，称火灾是安全生产的“灰犀牛”，部署为期 40 天的安全隐患大排查，要求“一家一家、一村一村地毯式摸排”；市长陈吉宁则要求“倒逼安全隐患突出的低端业态疏解腾退”。
        一周之内全市排查上账的安全隐患达 25395 处，大批违章出租公寓的租户、主要是外来务工者，在寒冬中被要求搬离。网民认为这是在借机清理“低端人口”；北京市安委会负责人回应称这种说法“不负责任、毫无根据”，并称没有“低端人口”一说。《纽约时报》指出，批评者认为当局是以火灾为借口加速驱赶外来人口，而压减人口本是 2014 年习近平给北京定下的任务。
      cites: [b06-people-2017-11-20-cai-fire, b06-qq-2017-11-26-no-low-end, b06-bbc-2017-11-28-beijing-evictions, b06-nytcn-2017-12-01-beijing-migrants]
    - h: 冬奥与党代会
      from: 2018
      to: 2022
      text: >-
        他兼任北京冬奥组委主席，BBC 中文认为北京在疫情中成功举办冬奥会可能成为他仕途上的加分项。2022 年 6 月北京市第十三次党代会上，他在报告中称颂习近平，说“总书记非凡的雄才大略、远见卓识和领袖风范，让我们深受感召”，并说“只要有总书记定向引航，我们就有无穷的信心、无尽的力量”。报告同时总结五年来北京拆除违法建设超过 2 亿平方米，城六区常住人口比 2014 年下降 15%。
      cites: [b06-people-2017-10-25-cai-resume, b06-bbc-2022-09-psc-candidates, b06-bj-2022-07-05-13th-congress-report]
    - h: 常委兼中办主任
      from: 2022-10
      text: >-
        2022 年二十大，他进入常委会，排名第五，同时任中央书记处书记，在七名书记中排名第一。BBC 中文认为，这使丁薛祥的未来职务一度成疑。
        2023 年 3 月 20 日，《新闻联播》报道习近平访俄时称他为“中央办公厅主任”，这是他首次以中办主任身份公开亮相。《联合早报》指出，由政治局常委兼任中办主任的安排极为罕见，他由此成为中南海的“大内总管”。
      cites: [b06-cppcc-2022-10-23-20th-resumes, b06-zaobao-2023-03-20-cai-general-office, b06-bbc-2022-10-23-psc]
    - h: 中央党校校长
      from: 2026
      text: >-
        2026 年 6 月 5 日，他首次以中央党校校长身份出席毕业典礼，接替陈希；6 月 18 日国务院公布他兼任国家行政学院院长。中央社引路透社报道，苏黎世大学学者认为这项任命把党的组织、论述和行政职能集中到一位常委身上，“史无前例”。
        9 月 23 日，他仍以中办主任身份陪同习近平对美国进行国事访问。
      cites: [b06-cna-2026-06-06-cai-party-school, b06-gov-2026-06-18-cai-nsa, b06-mfa-2026-09-23-xi-us-trip]
  assess:
    - voice: scholar
      quote: true
      text: 透過這項任命，他將共產黨的組織、論述和行政職能，全數集中在一位政治局常委身上
      cite: b06-cna-2026-06-06-cai-party-school
    - voice: zh
      quote: true
      text: 蔡奇目前身兼中共中央辦公廳主任等多項黨內要職，是習近平實際上的幕僚長。
      cite: b06-cna-2026-06-06-cai-party-school
    - voice: zh
      quote: true
      text: 批评北京市这项行动的人在文章和公开信中，指责北京市政府以火灾为借口，加速驱赶外来人口，这次专项行动之前，市政府一直未能减缓北京市人口的增长速度。
      cite: b06-nytcn-2017-12-01-beijing-migrants
    - voice: official
      quote: true
      text: 说专项行动是在驱赶“低端人口”，这是不负责任、毫无根据的，没有“低端人口”一说。
      cite: b06-qq-2017-11-26-no-low-end
  cites: [b06-people-2017-10-25-cai-resume, b06-cppcc-2022-10-23-20th-resumes, b06-bbc-2022-09-psc-candidates, b06-zaobao-2023-03-20-cai-general-office, b06-cna-2026-06-06-cai-party-school, wd-Q3370201]

