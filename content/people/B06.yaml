  bio: >-
    甘肃两当人，早年给甘肃省委书记李子奇当秘书，在甘肃组织系统和地方任职近三十年。2004 年调陕西任省委秘书长，后任延安市委书记，据报道曾为习近平与梁家河村民传递书信。
    此后历任上海市委组织部长、辽宁省长和省委书记，2017 年主政广东，任内有多名“老虎”落马，并在党代会报告中盛赞习近平“定于一尊、一锤定音的权威”。2022 年二十大以排名第七进入常委会，任中央纪委书记，主持习近平第三任期的反腐和党纪工作。
