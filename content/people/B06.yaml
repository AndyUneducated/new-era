  life:
    - h: 两当与李子奇的秘书
      from: 1956
      to: 1986
      text: >-
        生于甘肃陇南两当县。美国之音指出，两当是习仲勋等人 1932 年发动兵变的地方。他 1975 年在家乡云屏公社当知青，1978 至 1982 年读西北师范学院中文系。
        毕业后在甘肃省委宣传部、办公厅工作，据美国之音，他到 1986 年一直担任时任甘肃省委书记李子奇的秘书；李子奇是习仲勋的老部下和陕西老乡。该报道还说，有报道称李希常陪李子奇去北京、深圳探望习仲勋，由此与习近平相熟。
      cites: [b06-xinhua-2017-10-25-li-xi-resume, b06-voa-2022-10-23-li-xi]
    - h: 甘肃组织系统
      from: 1986
      to: 2004
      text: >-
        1986 年起在甘肃省委组织部工作近十年，历任干部调配处副处长、党政干部处处长；1995 年任兰州市西固区委书记，1996 年任兰州市委组织部部长，1999 年兼市委副书记；2001 年任张掖地委（市委）书记，2004 年短暂任甘肃省委秘书长。从知青算起，他在甘肃工作了将近三十年，48 岁才第一次离开本省任职。
      cites: [b06-xinhua-2017-10-25-li-xi-resume]
    - h: 陕西与延安
      from: 2004
      to: 2011
      text: >-
        2004 年调陕西任省委常委、秘书长，2006 年任延安市委书记，期间在清华大学读 EMBA。延安延川县梁家河是习近平当年插队的地方。据美国之音转述的消息，梁家河村民 2007 年写给习近平的信及习近平的回信，是由李希转交的；2008 年，时任陕西省委书记赵乐际又委托他向梁家河转达习近平的问候。
      cites: [b06-xinhua-2017-10-25-li-xi-resume, b06-voa-2022-10-23-li-xi]
    - h: 上海与辽宁
      from: 2011
      to: 2017
      text: >-
        2011 年调任上海市委常委、组织部部长，2013 年升任市委副书记，兼任中国浦东干部学院第一副院长。2014 年任辽宁省代省长、省长，2015 年任省委书记，2017 年十九大进入政治局。
      cites: [b06-xinhua-2017-10-25-li-xi-resume]
    - h: 广东五年
      from: 2017-10
      to: 2022-10
      text: >-
        2017 年 10 月调任广东省委书记。美国之音引香港《明报》报道，他在广东大力反腐，深圳前市长陈如桂等多名“老虎”落马，全省立案调查省管干部 697 人。
        2022 年 5 月广东省第十三次党代会上，他在报告中说习近平思想是思想上的“定盘星”、行动上的“指南针”，并称广东的成绩靠的是“总书记定于一尊、一锤定音的权威”和“山高水长的关怀厚爱”。报告还提到广州大规模迁移砍伐城市树木一事，称习近平就此作出重要指示，给予广东“最及时的纠偏、最深刻的警示警醒”。
      cites: [b06-voa-2022-10-23-li-xi, b06-gd-2022-05-22-li-xi-report]
    - h: 中纪委书记
      from: 2022-10
      text: >-
        2022 年二十大，他以第七名进入常委会，出任中央纪委书记。美国之音写道，这让习近平掌握了党内反腐的生杀大权；新一届中纪委副书记中，还有他在广东时的“大秘”、广东省委秘书长张福海。
        2026 年 1 月 12 日，他在二十届中央纪委五次全会上作工作报告：2025 年中央纪委国家监委立案审查调查中管干部 181 人，全国纪检监察机关立案 101.2 万件、留置 4.7 万人；报告称腐败是党面临的“最大风险、最大威胁、最大挑战”，要求“一刻不能停、半步不能退”。
        报告列出的 2025 年落马中管干部包括金湘军、蓝天立、王莉霞、毕井泉、蒋超良、易会满等；全年有 2.6 万人主动投案，追回外逃人员 963 人；配合八项规定学习教育，全国查处享乐主义、奢靡之风问题 15 万起，并公开通报河南罗山等地的违规吃喝案例。2026 年的工作重点包括严明换届纪律、清除“两面人”、查处政商勾连和“退而不休”的领导干部。习近平出席了这次全会并讲话。
      cites: [b06-cppcc-2022-10-23-20th-resumes, b06-bbc-2022-10-23-psc, b06-voa-2022-10-23-li-xi, b06-xinhua-2026-01-12-li-xi-ccdi-report, b06-gov-2026-01-14-ccdi-5th]
  assess:
