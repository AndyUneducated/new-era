  bio: >-
    温州瑞安人，工人出身，在浙江民政、工商系统和温州任职多年，2004 年起任习近平主政浙江时的省委秘书长，被视为“之江新军”的核心人物。
    习近平掌权后，他先后任浙江省长、江苏和上海市委书记。2022 年主持上海约两个月的封城，外界普遍认为这会影响他的仕途，但同年他在二十大上排名第二，2023 年出任总理。他是没有中央工作经历、也未当过副总理而直接出任总理的少数例子。任内取消了延续三十多年的总理记者会。
  positions:
