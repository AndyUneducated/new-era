  life:
    - h: 工厂与共青团
      from: 1975
      to: 1992
      text: >-
        1975 年在上海徐汇起重安装队当仓库管理员，此后在化工系统做团的工作，边工作边读书，先后在复旦大学大专班、华东师大夜大学和研究生班学习。1987 年任上海胶鞋六厂党委书记、副厂长。
        台湾中央广播电台引中央社报道说，时任上海市委书记、市长朱镕基到厂抽查时对他印象很好，随后提拔他任团市委副书记；1991 年他升任团市委书记。该报道因此认为，他虽被外界归为上海帮，也被视为团派。
      cites: [b06-xinhua-2018-03-19-han-resume, b06-rti-2017-han-shanghai]
    - h: 从卢湾到市长
      from: 1992
      to: 2006
      text: >-
        1992 年起任卢湾区代区长、区长，1995 年任市政府副秘书长兼市计委主任，1997 年进入市委常委会，1998 年当选副市长，2002 年任市委副书记、常务副市长。
        2003 年 2 月在市人大会议上当选市长；据台湾中央广播电台报道，当时他不满 49 岁，是上海五十多年来最年轻的市长。任内兼任 2010 年上海世博会执行委员会负责人。
      cites: [b06-xinhua-2018-03-19-han-resume, b06-chinanews-2006-09-25-han-acting, b06-rti-2017-han-shanghai]
    - h: 陈良宇案与代理书记
      from: 2006
      to: 2007
      text: >-
        2006 年 9 月 24 日，政治局会议决定对上海市委书记陈良宇立案检查，指其涉及违规使用社保资金等问题；中央同时决定由市长韩正代理市委书记。BBC 中文指出，海外媒体把陈良宇被撤职视为胡锦涛以反腐为名对上海帮动手的开始。
        2007 年 3 月习近平由浙江调任上海市委书记，韩正不再代理书记、回到市长岗位。台湾中央广播电台形容他处境尴尬，但全力配合习近平，两人共事约八个月。
      cites: [b06-chinanews-2006-09-25-han-acting, b06-bbc-2014-09-23-shanghai-gang, b06-rti-2017-han-shanghai]
    - h: 上海市委书记
      from: 2012
      to: 2017
      text: >-
        习近平调京后，俞正声接任上海市委书记，韩正继续任市长。2012 年十八大后，他升任上海市委书记并进入政治局，任内推动中国首个自贸区和科技创新中心建设。
        BBC 中文 2014 年引评论人士高新的话说，有人把他视为上海帮今天的代表人物，但他在习近平、俞正声先后主政上海时期已经“考验过关了”。台湾中央广播电台则说，习近平掌权后在上海持续清理江派，而韩正始终未被撼动。
      cites: [b06-bbc-2017-10-25-19th-psc, b06-bbc-2014-09-23-shanghai-gang, b06-rti-2017-han-shanghai, b06-xinhua-2018-03-19-han-resume]
    - h: 常委与常务副总理
      from: 2017
      to: 2023
      text: >-
        2017 年十九大进入政治局常委会，2018 年 3 月任国务院副总理、党组副书记，即外界所说的常务副总理，此职位此前由张高丽担任。他分管港澳事务。
        2019 年香港修例风波期间，他 11 月在北京会见林郑月娥，称“止暴制乱、恢复秩序仍然是香港当前最重要的任务”，并表示中央对林郑月娥和香港警队的表现“是充分肯定的”。他同时表示中央坚定支持特区政府采取更积极、更有效的举措，解决中低收入家庭和年轻人的住房、就业等民生问题。
      cites: [b06-xinhua-2018-03-19-han-resume, b06-bbc-2022-10-23-psc, b06-xinhua-2019-11-06-han-lam]
    - h: 国家副主席
      from: 2022
      text: >-
        2022 年二十大，他未进入新一届常委会。2023 年 3 月 10 日，十四届全国人大一次会议选举他为国家副主席。
        此后他多次作为习近平主席特别代表出访：2025 年 1 月在华盛顿出席特朗普就职典礼，会见当选副总统万斯和特斯拉首席执行官马斯克，对美国工商界代表说希望美国企业继续投资中国、扎根中国。
        2026 年 3 月访问肯尼亚，会见总统鲁托，推介中方自 5 月 1 日起对 53 个非洲建交国全面实施的零关税措施；5 月在北京全球贸易投资促进峰会上提出维护多边贸易体制等 4 点建议；9 月在纽约出席联大期间会见联合国秘书长古特雷斯，并在全球发展倡议 5 周年高级别对话会上宣读习近平贺信。
      cites: [b06-bbc-2022-10-23-psc, b06-gov-2023-03-10-han-vp, b06-gov-2023-03-10-state-leaders, b06-gov-2025-01-21-han-inauguration, b06-embassy-2026-03-25-han-kenya, b06-xinhua-2026-05-18-han-summit, b06-mfa-2026-09-26-han-un]
  assess:
    - voice: zh
