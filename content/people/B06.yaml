      text: 从广东省委书记任上晋升为政治局常委排名第七的李希，出任可谓权高位重的中纪委书记，为习近平掌握中共内部所谓“反腐”的生杀大权。
      cite: b06-voa-2022-10-23-li-xi
    - voice: zh
      quote: true
      text: 有报道说，李希常陪伴李子奇到北京、深圳探望习仲勋，由此与习近平相熟。
      cite: b06-voa-2022-10-23-li-xi
