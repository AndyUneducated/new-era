  origin: 甘肃两当
  education:
    - { school: 西北师范学院中文系汉语言文学专业, from: 1978, to: 1982 }
    - { school: 清华大学经济管理学院, degree: 高级管理人员工商管理硕士, from: 2008, to: 2011 }
