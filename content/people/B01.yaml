  statusNote: 2007 年 6 月 2 日在北京病逝，享年 69 岁，在任政治局常委、国务院副总理。
  tier: 1
  headline: 中央政治局常委、国务院常务副总理（2002/2003–2007）
  ids: { wikidata: Q505710 }
  factions:
    - f: jiang-shanghai
      cite: b01-bbc-2007-06-02-huang-ju-shanghai
      quote: 黄菊普遍被视为江泽民的亲信，也被视为是所谓“上海帮”的重要成员。
  bio: >-
    清华电机系毕业的工程师，在上海工作四十年，由工厂技术员升至市长、市委书记，1994 年进入政治局，被视为江泽民在上海的“忠实助手”；
    官方称他“善于统揽全局，考虑问题全面，处事严谨稳妥”。
    2002 年进入政治局常委会，次年任常务副总理，分管金融、工业和安全生产，但外界认为他在北京实权不大。2006 年起病重，上海社保基金案爆发后其前秘书被捕，
    2007 年 6 月在任内病逝。BBC 认为，他的去世使“上海帮”在高层的力量更见薄弱。
