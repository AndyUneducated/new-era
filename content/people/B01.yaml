  life:
    - h: 嘉善与清华
      from: 1938
      to: 1963
      text: >-
        1938 年 9 月 28 日生于上海，原籍浙江嘉善魏塘镇。1944 年起先后在嘉善益善小学、启东小学读书，1950–1956 年就读嘉善一中、嘉兴一中，1953 年加入共青团。
        1956 年 9 月考入清华大学电机工程系电机制造专业，1963 年 5 月分配到上海人造板机器厂参加工作，此后在上海工作了 40 年。
      cites: [b01-chinanews-2007-06-05-huang-ju-life]
    - h: 工厂技术员
      from: 1963
      to: 1983
      text: >-
        在上海人造板机器厂、中华冶金厂任技术员十余年，1966 年入党。官方生平称他研制出“我国第一台可控硅电炉自动配电装置”，并编写《小电炉变压器超功率运行》一书；“文化大革命”中受到冲击。
        1977 年起任中华冶金厂副厂长，1978 年主持全厂工作时组织制定生产、质量等 10 项管理制度；1980 年任上海市石油化工通用机械制造公司副经理，其间被派往国外学习企业管理；1982 年任市第一机电工业局副局长。
      cites: [b01-chinanews-2007-06-05-huang-ju-life]
    - h: 上海党政
      from: 1983
      to: 1991
      text: >-
        1983 年 3 月进入上海市委常委会兼市工业工作党委书记，1984 年任市委秘书长，1985 年任市委副书记分管宣传文化，官方称他在反对资产阶级自由化的斗争中“立场坚定，旗帜鲜明”。
        1986 年兼任常务副市长，先后协助江泽民、朱镕基两任市长。1989 年春夏之交，他“努力维护市内交通，积极组织生产”，为保持上海稳定做了大量工作。
      cites: [b01-chinanews-2007-06-05-huang-ju-life]
    - h: 市长与市委书记
      from: 1991
      to: 2002
      text: >-
        1991 年接替朱镕基任上海市市长，推动国企技改、上市和兼并；1994 年 9 月升任市委书记并增选为政治局委员，主政上海八年，建立社会保障体系和城市社区管理新机制。
        官方生平称他以浦东开发为契机，努力实现邓小平对上海“一年一个样，三年大变样”的要求。十六大后 BBC 分析新一届常委，称他为江泽民的“忠实助手”。
      cites: [b01-chinanews-2007-06-05-huang-ju-life, b01-bbc-2007-06-02-huang-ju-shanghai, f01-bbc-2002-11-16-jiang-shadow]
    - h: 常务副总理
      from: 2002
      to: 2006
      text: >-
        2002 年 11 月进入政治局常委会，2003 年 3 月任国务院副总理，负责常务工作，协助分管金融，并负责工业、交通和企业改革，兼任国务院安全生产委员会主任，推进电力、邮政和国资管理体制改革。
        2004 年高校毕业生达 280 万人，他在全国电视电话会议上要求鼓励毕业生“到西部、到基层、到祖国最需要的地方去建功立业”。
        BBC 写道，他“普遍被视为江泽民的亲信”，但有观察家称他进京后在中央很受排挤，实权不大。
      cites: [b01-chinanews-2007-06-05-huang-ju-life, b01-cyol-2004-04-23-huang-graduates, b01-bbc-2007-06-02-huang-ju-shanghai]
    - h: 病重与社保案
      from: 2006
      to: 2007
      text: >-
        据报道，他 2006 年被诊断患有胰腺癌，此后少有露面。同年接任上海市委书记的陈良宇因社保基金案落马，BBC 称“有传言称黄菊的妻子余慧文也涉入社保基金案”。
        2007 年 3 月 7 日，久未露面的他到全国人大上海代表团参加审议，据在场代表转述，他说“所有重大决定都需要集体研究决定，绝对不能一个人说了算”，上海要把好的制度恢复、完善和发展，相信上海会从社保案吸取教训。
      cites: [b01-bbc-2007-06-02-huang-ju-shanghai, b01-chinanews-2007-03-07-huang-shanghai]
    - h: 逝世与“上海帮”式微
      from: 2007
      to: 2007
      text: >-
        2007 年 6 月 2 日 2 时 03 分在北京病逝，享年 69 岁；官方生平称他生前留下遗愿，“要把遗体捐献给祖国的医学事业”，并嘱咐丧事从简。刘晓波对 BBC 说，“黄菊本是非常重要江派人物,可以制衡胡锦涛”。7 月，曾任其秘书的王维工因涉嫌社保案被捕；
        BBC 写道，舆论普遍认为查处社保案、逮捕陈良宇是胡锦涛瓦解“上海帮”的举动。
      cites: [b01-chinanews-2007-06-05-huang-ju-life, b01-bbc-2007-06-02-huang-ju-shanghai, b01-bbc-2007-08-03-wang-weigong]
