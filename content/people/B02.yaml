- id: wu-guanzheng
  name: 吴官正
  pinyin: Wú Guānzhèng
  gender: m
  ethnicity: 汉族
  born: 1938-08
  birthplace: 江西余干
  origin: 江西余干
  education:
    - { school: 清华大学动力系热工测量及自动控制专业, from: 1959, to: 1965 }
    - { school: 清华大学动力系热工测量及自动控制专业, degree: 研究生, from: 1965, to: 1968 }
  joinedParty: 1962-03
  joinedWork: 1968-04
  roles: [psc, pb, ccdi, cc, prov]
  status: retired
  statusNote: 健在。2025 年登上天安门城楼观看九三阅兵；2026 年 8 月未出席江泽民诞辰百年纪念大会。
  tier: 1
  headline: 中央纪委书记、中央政治局常委（2002–2007）
  ids: { wikidata: Q709473 }
  bio: >-
    清华动力系研究生出身，在武汉化工厂当了七年技术员，1983 年起任武汉市委书记兼市长，此后主政江西十一年、山东五年，1997 年进入政治局。
    2002—2007 年任政治局常委、中央纪委书记，任内把纪委定位为“党内监督的专门机关”，建立中央巡视制度，查处了上海市委书记陈良宇等高官，五年间全国给予党纪处分逾 51 万人；外媒同时评论这些机构的实际反腐效果并不明显。
    2007 年十七大按年龄退休，此后写作出书，自称“晚下不如早下”。2026 年仍健在。
  positions:
    - { title: 武汉市委书记、市长, sys: party, place: 湖北, from: 1983, to: 1986, cite: b02-cctv-2004-02-16-wu-guanzheng-resume }
    - { title: 江西省省长, sys: gov, place: 江西, from: 1986, to: 1995, cite: b02-cctv-2004-02-16-wu-guanzheng-resume }
    - { title: 江西省委书记, sys: party, place: 江西, from: 1995, to: 1997, cite: b02-cctv-2004-02-16-wu-guanzheng-resume }
    - { title: 山东省委书记, sys: party, place: 山东, from: 1997, to: 2002, cite: b02-cctv-2004-02-16-wu-guanzheng-resume }
