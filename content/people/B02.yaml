    - b02-bbc-2022-10-22-hu-escorted
    - b02-zaobao-2026-08-17-jiang-centenary
    - wd-Q15029

- id: wen-jiabao
  name: 温家宝
  pinyin: Wēn Jiābǎo
  gender: m
  ethnicity: 汉族
  born: 1942-09-15
  birthplace: 天津
  origin: 天津
  education:
    - { school: 北京地质学院地质矿产一系, from: 1960, to: 1965 }
    - { school: 北京地质学院地质构造专业, degree: 研究生, from: 1965, to: 1968 }
  joinedParty: 1965-04
  joinedWork: 1967-09
  roles: [psc, pb, sec, cc]
  status: retired
  statusNote: 健在。2026 年 8 月 17 日出席江泽民诞辰百年纪念大会，在出席的卸任常委中官方排序最靠前。
  tier: 1
  headline: 国务院总理（2003–2013）
  ids: { wikidata: Q16628 }
  factions:
    - f: populist
      cite: f01-brookings-2009-one-party-two-coalitions
      quote: The Populist Coalition is currently led by President Hu Jintao and Premier Wen Jiabao.
      zh: 民粹联盟目前由国家主席胡锦涛和总理温家宝领导。
  bio: >-
    地质学出身，在甘肃地质局工作十余年，1986 年起任中央办公厅主任，历经胡耀邦、赵紫阳、江泽民三任总书记，1989 年 5 月曾随赵紫阳到天安门广场看望绝食学生。
    1998 年任副总理，2003—2013 年任国务院总理两届，以奔赴灾区、亲近民众的“平民总理”形象著称，并多次公开呼吁政治体制改革，外界对此评价两极，有人认为他“有心无力”，也有人讥为“影帝”。
    2012 年 10 月《纽约时报》报道其亲属掌控至少 27 亿美元资产，家属经律师否认。卸任后 2021 年发表悼念母亲的文章，谈“公平正义”，随即在中国社交平台被限制转发。
  positions:
    - { title: 地质矿产部副部长, sys: gov, from: 1983, to: 1985, cite: b02-gov-2008-03-16-wen-resume }
    - { title: 中央办公厅主任, sys: party, from: 1986, to: 1993, cite: b02-gov-2008-03-16-wen-resume }
    - { title: 中央书记处书记, sys: party, from: 1992, to: 2002, cite: b02-gov-2008-03-16-wen-resume }
    - { title: 国务院副总理, sys: gov, from: 1998-03, to: 2003-03, cite: b02-gov-2008-03-16-wen-resume }
    - { title: 中央金融工委书记, sys: party, from: 1998, to: 2003, cite: b02-gov-2008-03-16-wen-resume }
    - { title: 中央政治局常委, sys: party, from: 2002-11, to: 2012-11, cite: b02-gov-2008-03-16-wen-resume }
    - { title: 国务院总理, sys: gov, from: 2003-03, to: 2013-03, cite: b02-gov-2008-03-16-wen-resume }
  life:
    - h: 天津、北京地质学院与甘肃
      from: 1942
      to: 1982
      text: >-
        1942 年 9 月生于天津。1960 年考入北京地质学院地质矿产一系，1965 年入党，同年读地质构造专业研究生。1968 年分配到甘肃省地质局地质力学队，从技术员、政治干事做到队政治处负责人、副队长，1981 年升任甘肃省地质局副局长。他在甘肃前后工作十四年，与同在甘肃起步的胡锦涛经历相近。
      cites: [b02-gov-2008-03-16-wen-resume, wd-Q16628]
    - h: 地矿部与中央办公厅
      from: 1982
      to: 1993
      text: >-
        1982 年调地质矿产部任政策法规研究室主任，次年升任副部长。1985 年调中央办公厅任副主任，1986 年任主任，1987 年十三大起任中央书记处候补书记，兼中央直属机关工委书记。
        1989 年 5 月 19 日凌晨，赵紫阳到天安门广场看望绝食学生，这是他最后一次公开露面；《纽约时报》中文网刊出的新华社照片显示，时任中办主任的温家宝就站在他身旁。赵紫阳下台后，温家宝继续留任中办主任至 1993 年。
      cites: [b02-gov-2008-03-16-wen-resume, b02-nytcn-2014-06-04-june-fourth]
    - h: 副总理与金融工委
      from: 1992
      to: 2003
      text: >-
        1992 年十四大当选政治局候补委员、中央书记处书记，1997 年十五大成为政治局委员。1998 年 3 月朱镕基组阁时出任国务院副总理，并兼任中央金融工委书记直至 2003 年。2002 年十六大进入政治局常委会，同时仍任副总理和金融工委书记，次年接任总理。
      cites: [b02-gov-2008-03-16-wen-resume, wd-Q16628]
    - h: “平民总理”
      from: 2003
      to: 2013
      text: >-
        2003 年 3 月出任国务院总理，2008 年连任。他常在灾难现场露面：2008 年汶川地震后，他多次到受灾惨重的北川中学，5 月 23 日在安置点的黑板上写下“多难兴邦”，对学生说“对国家我们要记住这四个字”。
        BBC 中文网总结说，“他在总理任期内一直保持亲民形象”；2012 年他最后一次答记者问后，中新社转述台湾《联合报》的评论，称他不负“平民总理”的封号。
      cites: [b02-chinanews-2008-05-23-duonan-xingbang, b02-bbc-2013-03-05-wen-decade, b02-chinanews-2012-03-15-wen-overseas-media]
    - h: 政治体制改革言论
      from: 2010
      to: 2012
      text: >-
        2010 年 8 月在深圳特区 30 周年之际，他说“不仅要推进经济体制改革，还要推进政治体制改革”，要“从制度上解决权力过分集中又得不到制约的问题”。
        2012 年 3 月 14 日最后一次总理记者会上，他警告没有政治体制改革的成功，“已经取得的改革和建设成果还有可能得而复失”，甚至文化大革命那样的历史悲剧还可能重演；他还点名重庆市委、市政府“必须反思，并认真从王立军事件中吸取教训”。
        BBC 认为他“多次呼吁政改”却始终未能兑现，因而说得多做得少，令知识分子失望。
      cites: [b02-gov-2010-08-21-wen-shenzhen, b02-sina-2012-03-14-wen-presser, b02-bbc-2013-03-05-wen-decade]
    - h: 《纽约时报》家族财富报道
      from: 2012
      to: 2012
      text: >-
        2012 年 10 月 26 日，《纽约时报》发表调查报道，称根据 1992—2012 年的公司与监管记录，温家宝的儿子、女儿、弟弟及妻弟等亲属“掌控了价值不低于27亿美元（约合170亿元人民币）的资产”，其中包括其母亲名下的平安保险股份；报道同时说明“调查中没有发现温家宝名下有任何财产”。
        外交部发言人洪磊称“有关媒体的报道抹黑中国，别有用心”。10 月 28 日，两名代表温家家属的律师在《南华早报》发表声明，称“《纽约时报》报道的所谓温家宝家人的‘隐秘财富’，是不存在的”，并称“温家宝从未在家人的经营活动中起任何作用”。
      cites: [b02-nytcn-2012-10-26-wen-wealth, b02-nytcn-2012-10-29-wen-response]
    - h: 卸任与悼念母亲的文章
      from: 2013
      to: 2021
      text: >-
        2013 年 3 月卸任总理后极少公开发声。2021 年 3 月底至 4 月初，他在《澳门导报》分四篇发表悼念亡母的长文，回忆家史，文末写道“我心目中的中国应该是一个充满公平正义的国家”。
        德国之声报道，凤凰网、网易等转载很快变成 404 页面，微信上的转载被禁止分享、转发和评论，理由是“该文章违反《微信公众平台运营规范》”，官媒对此只字未提。BBC 采访的学者指出，他“选择在胡耀邦去世纪念日附近发表文章”，带有政治信号。
      cites: [b02-bbc-2021-04-19-wen-mother, b02-dw-2021-04-19-wen-mother-blocked]
    - h: 近况
      from: 2026
      to: 2026
      text: >-
        2026 年 8 月 17 日江泽民诞辰百年纪念大会上，温家宝与其他卸任常委坐在人民大会堂主席台第一排。《联合早报》注意到，在出席的 13 位卸任常委中，即将年满 84 岁的温家宝官方排名最靠前，而同为胡温体制核心的胡锦涛则未现身。
      cites: [b02-zaobao-2026-08-17-jiang-centenary]
  assess:
    - voice: zh
      quote: true
      text: 温家宝可以被称为共产党中国最有争议的总理，他多次呼吁政改，但同时却一直无法实现他的承诺
      cite: b02-bbc-2013-03-05-wen-decade
    - voice: zh
      quote: true
      text: 低姿态地向民众祈求宽恕，令人刮目相看，也不负他“平民总理”的封号
      cite: b02-chinanews-2012-03-15-wen-overseas-media
    - voice: zh
      quote: true
      text: 但与此同时，他因为说得多做得少而让外界尤其是知识分子失望
      cite: b02-bbc-2013-03-05-wen-decade
  family:
    - name: 张培莉（纽约时报中文网作张蓓莉）
      rel: 妻
      text: >-
        宝石学家。《纽约时报》2012 年 10 月 26 日报道称，“他的妻子张蓓莉是中国珠宝与宝石领域的权威人士之一”，曾主管国有的中国地矿宝石总公司，并帮助亲属把钻石业的少数股权扩充为价值十亿美元级的投资组合。家属律师声明否认存在“隐秘财富”。
      cites: [b02-nytcn-2012-10-26-wen-wealth, b02-nytcn-2012-10-29-wen-response]
    - name: 温云松
      rel: 子
      text: >-
        温家宝的独子，英文名 Winston。《纽约时报》2012 年报道称他创办或主导多家科技公司与私募基金新天域，后任国有的中国卫星通信集团董事长；他本人拒绝受访。
      cites: [b02-nytcn-2012-10-26-wen-wealth]
    - name: 杨志云
      rel: 母
      text: >-
        《纽约时报》2012 年报道称，记录显示她名下对平安保险的投资在 2007 年价值 1.2 亿美元；家属律师声明称“温家宝的母亲除了按规定领取的工资/退休金，无其他任何收入，也无其他任何财产”。她去世后，温家宝于 2021 年撰文悼念。
      cites: [b02-nytcn-2012-10-26-wen-wealth, b02-nytcn-2012-10-29-wen-response, b02-bbc-2021-04-19-wen-mother]
