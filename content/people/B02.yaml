- id: wu-bangguo
  name: 吴邦国
  pinyin: Wú Bāngguó
  gender: m
  ethnicity: 汉族
  born: 1941-07-22
  died: 2024-10-08
  birthplace: 贵州平坝
  origin: 安徽肥东
  education:
    - { school: 清华大学无线电电子学系电真空器件专业, from: 1960-09, to: 1967-09 }
  joinedParty: 1964-04
  roles: [psc, pb, sec, cc, prov]
  status: dead
  statusNote: 2024 年 10 月 8 日 4 时 36 分在北京病逝，享年 84 岁。
  tier: 1
  headline: 全国人大常委会委员长（2003–2013）
  ids: { wikidata: Q360563 }
  factions:
    - f: elitist
      cite: f01-brookings-2012-04-16-power-shift
      quote: the “elitist coalition,” which emerged in the Jiang era and is currently led by Wu Bangguo, chairman of the national legislature
      zh: “精英联盟”形成于江泽民时代，目前由全国人大委员长吴邦国领导。
    - f: jiang-shanghai
      cite: b02-rfa-2024-10-08-wu-death
      quote: 并以"上海帮"身份进入中共权力核心
  bio: >-
    清华无线电系出身的技术官僚，在上海电子工业系统工作十六年，1991 年接替朱镕基任上海市委书记，次年进入政治局，被视为江泽民“上海帮”的核心成员。
    1995 年调任副总理，主管国有企业改革与三峡等基础设施；2003—2013 年任全国人大常委会委员长两届，在胡温体制中排名第二，李成称他是“精英联盟”的领袖。
    任内主持 2004 年修宪，把“尊重和保障人权”写入宪法，又在 2011 年人大工作报告中提出“五不搞”，成为反对西方政制的标志性表述。2024 年 10 月病逝。
  positions:
    - { title: 上海市委副书记, sys: party, place: 上海, from: 1985-06, to: 1991-03, cite: b02-gov-2024-10-14-wu-bangguo-life }
    - { title: 上海市委书记, sys: party, place: 上海, from: 1991-03, to: 1994-09, cite: b02-gov-2024-10-14-wu-bangguo-life }
    - { title: 中央政治局委员, sys: party, from: 1992-10, to: 2002-11, cite: b02-gov-2024-10-14-wu-bangguo-life }
    - { title: 中央书记处书记, sys: party, from: 1994-09, to: 1997-09, cite: b02-gov-2024-10-14-wu-bangguo-life }
    - { title: 国务院副总理, sys: gov, from: 1995-03, to: 2003-03, cite: b02-gov-2024-10-14-wu-bangguo-life }
    - { title: 中央政治局常委, sys: party, from: 2002-11, to: 2012-11, cite: b02-gov-2024-10-14-wu-bangguo-life }
    - { title: 全国人大常委会委员长, sys: gov, from: 2003-03, to: 2013-03, cite: b02-gov-2024-10-14-wu-bangguo-life }
  life:
    - h: 清华与上海电子工业
      from: 1941
      to: 1983
      text: >-
        1941 年 7 月 22 日生于贵州平坝，籍贯安徽肥东。1960 年 9 月考入清华大学无线电电子学系电真空器件专业，1964 年入党，1967 年毕业。
        此后进入上海电子管三厂，从技术员、技术科科长做到厂长，再任上海市电子元件工业公司副经理、电真空器件公司副经理和市仪表电讯工业局党委副书记，是典型的工程师出身的技术官僚。
      cites: [b02-gov-2024-10-14-wu-bangguo-life, wd-Q360563]
    - h: 上海市委
      from: 1983
      to: 1994
      text: >-
        1983 年 3 月进入上海市委常委会，1985 年 6 月任市委副书记，主管党群和日常工作。官方生平称，1989 年政治风波中他与上海市委主要领导一道，“顶住压力，稳定秩序，采取有力措施制止动乱”。
        1991 年 3 月接任上海市委书记，1992 年十四届一中全会当选政治局委员。任内推动浦东开发、城市基础设施建设和棚户区改造，并“在全国率先设立国有资产管理委员会”。
      cites: [b02-gov-2024-10-14-wu-bangguo-life]
    - h: 副总理与国企改革
      from: 1994
      to: 2002
      text: >-
        1994 年 9 月十四届四中全会增补为中央书记处书记，1995 年 3 月出任国务院副总理，负责国有企业改革、工交生产和基础设施建设，兼任国务院三峡工程建设委员会副主任、中央企业工委书记。
        他主持起草十五届四中全会关于国有企业改革的决定，从纺织业入手推行兼并、破产与下岗分流，官方称推动了“国有大中型企业改革和脱困三年目标如期基本实现”。他还主管京九、南昆铁路与青藏铁路开工、洋山深水港立项等工程。
      cites: [b02-gov-2024-10-14-wu-bangguo-life]
    - h: 人大委员长
      from: 2003
      to: 2013
      text: >-
        2002 年十六大进入政治局常委会，2003 年 3 月当选全国人大常委会委员长，2008 年连任，官方排名仅次于胡锦涛。他担任中央宪法修改小组组长，主持的 2004 年宪法修正案写入“三个代表”，并明确“国家尊重和保障人权”、保护私有财产。
        十届、十一届人大任内共审议通过法律案 186 件，包括物权法、劳动合同法、监督法，他还主持制定反分裂国家法，并主持对香港、澳门基本法作出解释。
        监督方面，十年间人大常委会听取审议“一府两院”报告 126 个、组织执法检查 46 次；对外交往方面，与 14 个国家议会及欧洲议会建立定期交流机制。官方生平同时强调，他坚持人大工作“有利于加强和改善党的领导，有利于巩固党的执政地位”。
      cites: [b02-gov-2024-10-14-wu-bangguo-life]
    - h: “五不搞”
      from: 2009
      to: 2011
      text: >-
        2009 年 3 月人大工作报告中，他逐条论述人民代表大会制度与西方议会的“本质区别”，表示“要积极借鉴人类社会创造的文明成果包括政治文明的有益成果，但绝不照搬西方那一套”。
        2011 年 3 月 10 日，他在宣布中国特色社会主义法律体系已经形成的报告中进一步表态：“郑重表明我们不搞多党轮流执政，不搞指导思想多元化”，也不搞三权鼎立和两院制、联邦制、私有化，即外界所说的“五不搞”。
      cites: [b02-chinanews-2009-03-09-wu-west, b02-npc-2011-03-10-npcsc-report]
    - h: 外界评价
      from: 2011
      to: 2024
      text: >-
        法广评论说，“五不搞”提出后，舆论认为全国人大更成了名副其实的表决机器；文章还指出，吴邦国虽是江泽民的亲信，但习近平的“七不讲”与“五不搞”有明显的传承关系，“五不搞”为随后的习政权在理论上打下了基础。法广也提到，2012 年 3 月人大会上他再次反驳批评，称要理直气壮地坚持人大制度；观察人士则认为“五不搞”并非他一人首创，邓小平早就说过中国不搞议会民主、不搞多党制。
        自由亚洲电台引述评论人士横河的看法，认为“五不搞”与邓小平的四项基本原则一脉相承，说明中共“从来就没有准备进行政治体制改革”。
      cites: [b02-rfi-2024-10-08-wu-five-nos, b02-rfa-2024-10-08-wu-death]
    - h: 退休与逝世
      from: 2013
      to: 2024
      text: >-
        2013 年 3 月卸任委员长后淡出公众视野。2024 年 10 月 8 日在北京病逝，享年 84 岁。新华社播发的生平称他是“中国特色社会主义民主法治建设的重要领导者”，并特别写道他强调“决不能搞西方那种多党制、议会制”。
        自由亚洲电台的讣闻则把他描述为随邓小平改革开放崛起、以“上海帮”身份进入权力核心，晚年却回到维护一党专政老路的技术官僚。
      cites: [b02-gov-2024-10-14-wu-bangguo-life, b02-rfa-2024-10-08-wu-death]
  assess:
    - voice: doc
      quote: true
      text: 他党性坚强，坚持真理，坚持原则，在大是大非问题上旗帜鲜明、敢于担当。
      cite: b02-gov-2024-10-14-wu-bangguo-life
    - voice: zh
      quote: true
      text: 吴邦国“孰可忍不可忍也”，拿起“五不搞”抵制“西方思潮”，倒是为随后而来的习政权从理论上奠定了坚实的基础。
      cite: b02-rfi-2024-10-08-wu-five-nos
    - voice: zh
      quote: true
      text: 中国共产党从来就没有准备让权，从来就没有准备进行政治体制改革。
      cite: b02-rfa-2024-10-08-wu-death
  cites:
    - b02-gov-2024-10-14-wu-bangguo-life
    - b02-npc-2011-03-10-npcsc-report
    - b02-chinanews-2009-03-09-wu-west
    - f01-brookings-2012-04-16-power-shift
    - b02-rfa-2024-10-08-wu-death
    - b02-rfi-2024-10-08-wu-five-nos
    - wd-Q360563

- id: jia-qinglin
  name: 贾庆林
  pinyin: Jiǎ Qìnglín
  gender: m
  ethnicity: 汉族
  born: 1940-03
  birthplace: 河北泊头
  origin: 河北泊头
  education:
    - { school: 河北工学院电力系电机电器设计与制造专业, from: 1958, to: 1962 }
  joinedParty: 1959-12
  joinedWork: 1962-10
  roles: [psc, pb, cc, prov]
  status: retired
  statusNote: 健在。2026 年 8 月 17 日出席江泽民诞辰百年纪念大会。
  tier: 1
  headline: 全国政协主席（2003–2013）
  ids: { wikidata: Q380590 }
  factions:
    - f: jiang-shanghai
      cite: b02-bbc-2003-03-13-jia-cppcc
      quote: 贾庆林被认为是即将离任的国家主席江泽民的亲密的政治盟友
  bio: >-
    机械工业出身，外媒称他是江泽民自 1960 年代起的老盟友。1985 年起在福建任职十一年，历任省长、省委书记，1996 年调北京任市长、市委书记，1997 年进入政治局。
    1999 年曝光的厦门远华走私案发生在他主政福建期间，其妻林幼芳曾在福建外贸系统任职，外媒报道她一度被问话，但贾庆林本人未受处分，并于 2002 年进入政治局常委会，2003—2013 年任全国政协主席两届，主管对台统战。
    2016 年“巴拿马文件”显示其孙女持有离岸公司。2026 年仍健在。
  positions:
    - { title: 中国机械设备进出口总公司总经理, sys: other, from: 1978, to: 1983, cite: b02-chinanews-2007-10-22-jia-resume }
    - { title: 福建省省长, sys: gov, place: 福建, from: 1990, to: 1994, cite: b02-chinanews-2007-10-22-jia-resume }
    - { title: 福建省委书记, sys: party, place: 福建, from: 1993, to: 1996, cite: b02-chinanews-2007-10-22-jia-resume }
    - { title: 北京市市长, sys: gov, place: 北京, from: 1996, to: 1999, cite: b02-chinanews-2007-10-22-jia-resume }
    - { title: 北京市委书记, sys: party, place: 北京, from: 1997, to: 2002, cite: b02-chinanews-2007-10-22-jia-resume }
    - { title: 中央政治局委员, sys: party, from: 1997, to: 2002, cite: b02-chinanews-2007-10-22-jia-resume }
    - { title: 中央政治局常委, sys: party, from: 2002-11, to: 2012-11, cite: b02-chinanews-2007-10-22-jia-resume }
    - { title: 全国政协主席, sys: other, from: 2003-03, to: 2013-03, cite: b02-chinanews-2007-10-22-jia-resume }
  life:
    - h: 一机部与外贸
      from: 1940
      to: 1985
      text: >-
        1940 年 3 月生于河北泊头。1956 年入石家庄工业管理学校，1958 年考入河北工学院电力系，1959 年入党。1962 年毕业后分配到第一机械工业部设备成套总局，任技术员和团委副书记，文革中下放江西奉新“五七”干校劳动。
        1978 年起任中国机械设备进出口总公司总经理，1983 年任山西太原重型机器厂厂长、党委书记。
      cites: [b02-chinanews-2007-10-22-jia-resume, wd-Q380590]
    - h: 福建十一年
      from: 1985
      to: 1996
      text: >-
        1985 年调任福建省委常委、副书记，此后兼任省委组织部部长、省委党校校长，1990 年任代省长，1991 年任省长，1993 年起任省委书记，1994 年兼任省人大常委会主任。
        他的妻子林幼芳是他在河北工学院的同学，也在福建外贸系统任职；外媒报道，她曾主管厦门的进出口公司。这段经历后来使他被卷入远华案的舆论。
      cites: [b02-chinanews-2007-10-22-jia-resume, b02-bbc-2003-02-24-jia-resume, b02-irishtimes-2000-jia-wife]
    - h: 北京市长、市委书记
      from: 1996
      to: 2002
      text: >-
        1996 年调任北京市委副书记、代市长、市长，1997 年十五大当选政治局委员并接任北京市委书记，1999 年起专任市委书记。此前的北京市委书记陈希同已在 1995 年因腐败案下台，据《爱尔兰时报》，他是当时唯一因腐败入狱的政治局委员，1998 年被判刑 16 年。
        《爱尔兰时报》2000 年报道，江泽民在电视上与贾庆林一同亮相，并表扬他把 1999 年国庆庆典、澳门回归和千禧年庆祝组织得顺利，分析人士把这解读为江泽民准备保护这位老盟友的信号。
      cites: [b02-chinanews-2007-10-22-jia-resume, b02-irishtimes-2000-jia-wife]
    - h: 远华案疑云
      from: 1999
      to: 2003
      text: >-
        1999 年曝光的厦门远华特大走私案，案发地正是贾庆林主政多年的福建。《爱尔兰时报》2000 年报道，林幼芳因涉嫌向走私集团发放许可证一事“has been detained for questioning”（被拘留问话），该报还称贾庆林在妻子涉案后才与她离婚，此说未见其他来源证实。
        BBC 2003 年写道，“在丑闻曝光之前调往北京的贾庆林没有受到任何处罚”；但据报道，一些调查人员认为他应当知道内幕，“至少负有玩忽职守的责任”。
      cites: [b02-irishtimes-2000-jia-wife, b02-bbc-2003-03-13-jia-cppcc]
    - h: 全国政协主席
      from: 2002
      to: 2013
      text: >-
        2002 年十六大进入政治局常委会，2003 年 3 月当选全国政协主席，2008 年连任，主管统一战线与对台工作。2010 年 6 月在第二届海峡论坛上，他说“两岸同胞是血脉相连的命运共同体”，要求在反对“台独”、坚持“九二共识”的基础上增强政治互信。
        2013 年 3 月他作最后一次政协常委会工作报告，称五年间开展各类协商活动 420 多场次、办复提案 26583 件，强调“坚持中国共产党的领导，是人民政协存在和发展的根本前提”，并把“团结和民主”列为政协的两大主题，随后卸任。
      cites: [b02-cntv-2010-06-20-jia-straits-forum, b02-people-2013-03-13-cppcc-report, wd-Q380590]
    - h: 赖昌星遣返
      from: 2011
      to: 2012
      text: >-
        2011 年 7 月，远华案主犯赖昌星从加拿大被遣返。BBC 报道，许多分析认为这会在十八大前引发政治冲击，“曾经主政福建的贾庆林会特别受到关注”。
        但香港时事评论员刘锐绍认为，中共对远华案早有划线，即“副部级以上的高官不受牵连”，加上贾庆林一年后就要退休，当局出于稳定考虑不会对其采取行动。此后贾庆林确实如期在 2012 年十八大退出常委会。
      cites: [b02-bbc-2011-07-22-lai-politics, wd-Q380590]
    - h: 巴拿马文件与晚年
      from: 2013
      to: 2026
      text: >-
        2016 年 4 月，《卫报》根据“巴拿马文件”报道，贾庆林的孙女 Jasmine Li 在 2010 年 12 月刚进入斯坦福大学读书时，就成为两家英属维尔京群岛公司的唯一股东，当时她的祖父是中国排名第四的领导人。
        退休后贾庆林很少露面。2026 年 8 月 17 日江泽民诞辰百年纪念大会上，他与俞正声等前任政协主席一同坐在主席台第一排。
      cites: [b01-guardian-2016-04-06-red-nobility, b02-zaobao-2026-08-17-jiang-centenary]
  assess:
    - voice: west
      quote: true
      text: The television appearance of President Jiang with Mr Jia has been taken by analysts to signal that he is prepared to protect the Beijing chief, an old ally from the 1960s.
      zh: 分析人士把江泽民主席与贾庆林一同在电视上亮相，解读为江准备保护这位北京一把手——他自 1960 年代起的老盟友。
      cite: b02-irishtimes-2000-jia-wife
    - voice: zh
      quote: true
      text: 中共已有对远华案划线的做法，即副部级以上的高官不受牵连，而且贾庆林还有一年退休
      cite: b02-bbc-2011-07-22-lai-politics
    - voice: zh
      quote: true
      text: 据报道，一些调查人员认为，贾庆林的妻子在对外贸易部门工作，贾庆林应当知道事件的内幕，至少负有玩忽职守的责任。
      cite: b02-bbc-2003-03-13-jia-cppcc
  family:
    - name: 林幼芳
      rel: 妻
      text: >-
        BBC 介绍，“林幼芳，祖籍金门，是贾庆林在河北工学院的同窗”。《爱尔兰时报》2000 年报道她时任厦门进出口公司负责人，因远华案被拘留问话，并称两人已离婚；此后未见官方说明。
      cites: [b02-bbc-2003-02-24-jia-resume, b02-irishtimes-2000-jia-wife]
    - name: Jasmine Li
      rel: 孙女
      text: >-
        据《卫报》2016 年 4 月 6 日根据“巴拿马文件”所作的报道，她在 2010 年 12 月入读斯坦福大学之初，成为两家英属维尔京群岛公司的唯一股东。
      cites: [b01-guardian-2016-04-06-red-nobility]
