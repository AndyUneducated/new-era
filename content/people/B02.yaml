  life:
    - h: 余干与清华
      from: 1938
      to: 1968
      text: >-
        1938 年 8 月生于江西余干。1959 年考入清华大学动力系热工测量及自动控制专业，任团支部书记，1962 年入党；1965 年本科毕业后留校读研究生，任党支部副书记。官方简历记其为研究生学历、工程师。Wikidata 记其生日为 1938 年 10 月 18 日，与官方简历的“8 月”不一致，此处从官方简历。
      cites: [b02-cctv-2004-02-16-wu-guanzheng-resume, wd-Q709473]
    - h: 武汉
      from: 1968
      to: 1986
      text: >-
        1968 年分配到湖北武汉葛店化工厂，从技术员做到技术科副科长、车间主任和厂革委会副主任。1975 年调任武汉市科委副主任，兼市科协副主席、市工程科技中心主任等职，1982 年进入武汉市委常委会，1983 年任武汉市委书记兼市长（当时另设第一书记）。
      cites: [b02-cctv-2004-02-16-wu-guanzheng-resume]
    - h: 江西与山东
      from: 1986
      to: 2002
      text: >-
        1986 年调回家乡江西，任省委副书记、副省长，随后任代省长、省长，1995 年升任江西省委书记，在江西任职共十一年。
        1997 年十五大当选政治局委员，同年调任山东省委书记兼省委党校校长，主政这一经济大省五年，直到 2002 年进京。
      cites: [b02-cctv-2004-02-16-wu-guanzheng-resume]
    - h: 中纪委书记：定位与巡视
      from: 2002
      to: 2004
      text: >-
        2002 年十六大当选政治局常委、中央纪委书记。2003 年 1 月他在专家座谈会上提出“推进党的作风建设，核心是保持党同人民群众的血肉联系”。他主张在查办大案要案的同时，着力解决老百姓身边的不正之风，并提出要“加大巡视工作力度”。同年 2 月十六届中纪委二次全会把纪委定位为“党内监督的专门机关”，并提出建立巡视制度；8 月中央批准设立专门巡视机构，首批组建 5 个巡视组。
        首批 5 个巡视组共 45 人，组长从刚离开工作岗位、尚未办理退休手续的正省部级干部中选任。据《环球人物》，巡视组成立第二年即 2004 年有 16 名省部级官员落马，创下新高，陈良宇案、杜世成案的线索都来自巡视。
      cites: [b02-chinanews-2003-01-14-wu-guanzheng, b02-people-2014-01-16-hqrw-xunshi]
    - h: 陈良宇案与五年账单
      from: 2006
      to: 2007
      text: >-
        2006 年 9 月 24 日，政治局会议审议中纪委关于陈良宇的初核报告，决定立案检查并免去其上海市委书记职务，通稿称“不论是谁，不论其职务多高，只要触犯党纪国法，都要受到严肃追究和严厉惩处”。
        2007 年中纪委向十七大的报告称，2002 年 12 月至 2007 年 6 月全国纪检机关立案 677924 件，给予党纪处分 518484 人，并“查处陈良宇、杜世成、郑筱萸等极少数高级干部严重违纪案件”。BBC 则评论，各级反腐机构“真正起到的反腐作用似乎并不明显”。
      cites: [b02-xinhua-2006-09-25-chen-liangyu, b02-gov-2007-10-26-ccdi-report, b02-bbc-2007-10-27-ccdi-500k]
    - h: 外界观察
      from: 2003
      to: 2007
      text: >-
        吴官正任内的反腐话语常被外媒认为雷声大于雨点。2003 年 2 月中纪委全会再次就腐败的“极端危害性”发出警告时，BBC 写道，“从吴官正此次讲话中却并不能看到多少具体的反腐败新计划或者新措施”。
        官方总结则强调制度建设：中纪委向十七大的报告列举了建立巡视机构、完成中央和省级纪检监察派驻机构统一管理、颁布《党内监督条例（试行）》等举措，同时承认违纪违法案件在一些地方和部门“仍呈易发多发态势”。
      cites: [b02-bbc-2003-02-18-ccdi-warning, b02-people-2014-01-16-hqrw-xunshi, b02-gov-2007-10-26-ccdi-report]
    - h: 退休与写作
      from: 2007
      to: 2026
      text: >-
        2007 年十七大退出常委会。据他自述，他在最后一次中纪委常委会上只说：“我退下来后，拥护党中央，支持中纪委，安度晚年，保持晚节。”随即宣布散会。在卸任前与中办调研室人员的谈话中，他说执政党要重视制度建设和制度创新，“包括发展民主，健全法制，也包括干部的任期制、退休制等”，又引《诗经》“靡不有初，鲜克有终”，说政治人物有个好结局不容易。2013 年 4 月人民出版社出版他的随笔集《闲来笔潭》，收录散文、小说和画作。
        《联合早报》报道，他 2025 年曾登上天安门城楼观看九三阅兵；2026 年 8 月江泽民诞辰百年纪念大会上，88 岁的他没有出席。
      cites: [b02-people-2013-05-08-wu-book, b02-zaobao-2026-08-17-jiang-centenary]
  assess:
