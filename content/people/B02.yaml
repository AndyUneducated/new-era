  tier: 1
  headline: 中共中央总书记（2002–2012）、国家主席（2003–2013）、中央军委主席（2004–2012）
  ids: { wikidata: Q15029 }
  factions:
    - f: tuanpai
      cite: f01-brookings-2012-04-16-power-shift
      quote: the populist coalition consists of former Chinese Communist Youth League officials, known as tuanpai, who comprise Hu’s power base
      zh: 民粹联盟由前共青团官员组成，即所谓“团派”，他们是胡锦涛的权力基础。
    - f: populist
      cite: f01-brookings-2012-04-16-power-shift
      quote: 'The two factions can be labeled the “populist coalition,” led by Hu'
      zh: 两派可称为由胡锦涛领导的“民粹联盟”……
  bio: >-
    清华水利系出身，在甘肃基层工作十余年后经共青团系统快速上升，1992 年由邓小平隔代指定、49 岁进入政治局常委会，2002 年接任总书记，2004 年才从江泽民手中接过军委主席。
    执政十年提出“科学发展观”和“构建社会主义和谐社会”，海外学者把他视为团派与“民粹联盟”的领袖，批评者则称他的时代回避政治改革、维稳膨胀。
    2012 年十八大把总书记与军委主席一并交给习近平，被称为“裸退”。2022 年二十大闭幕会上他被工作人员带离主席台，官方称其身体不适。2026 年仍健在，是官方排序最靠前的中共元老。
  positions:
    - { title: 共青团中央书记处第一书记, sys: party, from: 1984, to: 1985, cite: b02-gov-2008-03-16-hu-resume }
    - { title: 贵州省委书记, sys: party, place: 贵州, from: 1985, to: 1988, cite: b02-gov-2008-03-16-hu-resume }
    - { title: 西藏自治区党委书记, sys: party, place: 西藏, from: 1988, to: 1992, cite: b02-gov-2008-03-16-hu-resume }
    - { title: 中央政治局常委、中央书记处书记, sys: party, from: 1992-10, to: 2012-11, cite: b02-gov-2008-03-16-hu-resume }
    - { title: 中央党校校长, sys: party, from: 1993, to: 2002-12, cite: b02-gov-2008-03-16-hu-resume }
    - { title: 国家副主席, sys: gov, from: 1998-03, to: 2003-03, cite: b02-gov-2008-03-16-hu-resume }
    - { title: 中共中央总书记, sys: party, from: 2002-11, to: 2012-11, cite: b02-gov-2008-03-16-hu-resume }
