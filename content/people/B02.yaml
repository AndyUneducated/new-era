# B02: Hu-Wen core (胡锦涛、温家宝、吴邦国、贾庆林、吴官正), tier 1.
- id: hu-jintao
  name: 胡锦涛
  pinyin: Hú Jǐntāo
  gender: m
  ethnicity: 汉族
  born: 1942-12-21
  birthplace: 江苏泰州
  origin: 安徽绩溪
  education:
