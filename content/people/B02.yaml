  life:
    - h: 清华与甘肃
      from: 1942
      to: 1982
      text: >-
        1942 年 12 月生，籍贯安徽绩溪。1959 年考入清华大学水利工程系，1964 年入党，毕业后留校任政治辅导员并参加科研，“文化大革命”开始后科研中止。
        1968 年下放到水电部刘家峡工程局房建队劳动，此后在水电部第四工程局历任技术员、秘书、机关党总支副书记；1974 年调甘肃省建委，1980 年升任副主任，1982 年短暂出任共青团甘肃省委书记。
      cites: [b02-gov-2008-03-16-hu-resume, wd-Q15029]
    - h: 团中央、贵州与西藏
      from: 1982
      to: 1992
      text: >-
        1982 年底调任团中央书记处书记兼全国青联主席，1984 年升任团中央第一书记，这段经历成为日后“团派”说法的起点。1985 年出任贵州省委书记，1988 年转任西藏自治区党委书记兼西藏军区党委第一书记。
        1989 年 3 月拉萨实行戒严时他正主政西藏；2016 年出版的《胡锦涛文选》收录了他当时的讲话，称“国务院从西藏各族人民根本利益出发，果断决定在拉萨市实行戒严”，并要求“树立长期斗争的思想准备”。1992 年调离西藏。
      cites: [b02-gov-2008-03-16-hu-resume, b02-sina-2016-09-20-hu-wenxuan]
    - h: 隔代接班人
      from: 1992
      to: 2004
      text: >-
        1992 年十四大，他从西藏党委书记任上直接进入政治局常委会和中央书记处，1993 年起兼任中央党校校长，1998 年当选国家副主席，1999 年十五届四中全会增补为中央军委副主席，接班人地位逐步确立。
        2002 年十六大接任总书记，2003 年当选国家主席，但江泽民继续留任中央军委主席，直到 2004 年 9 月十六届四中全会才把军委主席交给他。BBC 转述《南华早报》指出，江泽民的留任“打破了以往中共总书记同时担任中央军委主席的惯例”。
      cites: [b02-gov-2008-03-16-hu-resume, b02-bbc-2012-11-12-scmp-hu-cmc]
    - h: 科学发展观与和谐社会
      from: 2003
      to: 2012
      text: >-
        胡锦涛执政时期的标志性提法是“科学发展观”与“构建社会主义和谐社会”。2007 年十七大报告把前者概括为：“科学发展观，第一要义是发展，核心是以人为本，基本要求是全面协调可持续，根本方法是统筹兼顾。”并宣称“社会和谐是中国特色社会主义的本质属性”。
        2008 年纪念十一届三中全会 30 周年时，他提出“不动摇、不懈怠、不折腾”，“不折腾”一词随即流行。2012 年十八大报告中，他强调“既不走封闭僵化的老路、也不走改旗易帜的邪路”。
      cites: [b02-npc-2007-10-24-17th-report, b02-12371-2008-12-18-hu-30th, b02-chinanews-2012-11-08-hu-18th-road]
    - h: 两个联盟与“绕着走”
      from: 2002
      to: 2012
      text: >-
        布鲁金斯学会的李成把胡温时期的高层政治描述为“一党两联盟”：以胡锦涛为首、以团派为核心的“民粹联盟”强调社会公正与社会凝聚，与江泽民时代形成的“精英联盟”相互制衡；他认为两派张力使决策更冗长，甚至可能陷入僵局。
        批评者的评价更为尖锐。BBC 中文网 2012 年的一篇评论把胡锦涛时代的施政风格概括为“绕着走”，认为他以“社会和谐”回避政治体制改革，同时强化维稳机器，结果“和谐”在网络上沦为“河蟹”，成了讥讽的对象。
      cites: [f01-brookings-2012-04-16-power-shift, f01-brookings-2009-one-party-two-coalitions, b02-bbc-2012-10-29-hu-era]
    - h: 十八大“裸退”
      from: 2012
      to: 2013
      text: >-
        2012 年 11 月十八大，胡锦涛同时卸任总书记和中央军委主席，没有效仿江泽民留任军委。习近平在随后的军委扩大会议上说，“胡主席从党、国家、军队事业发展全局考虑，主动提出不再担任中共中央总书记、中央军委主席职务”。
        BBC 汇编的东南亚华文报评论中，《联合早报》认为这让“中共实现了接班人一步到位”，是胡锦涛留下的最大政治遗产；另一份报道则说失去军权使他成了卸任领导人中的“跛脚鸭”。2013 年 3 月他卸任国家主席。
      cites: [b02-people-2012-11-18-cmc-meeting, b02-bbc-2012-11-16-sea-press-hu]
    - h: 二十大闭幕会离场
      from: 2022
      to: 2022
      text: >-
        2022 年 10 月 22 日二十大闭幕会，媒体获准入场后不久，坐在习近平身旁的胡锦涛被工作人员搀扶离开主席台。BBC 记录，他离场前曾伸手去拿习近平面前的文件，习近平随即按住卷宗；BBC 还写道，党代会通常高度脚本化，“这让人们猜测胡锦涛离开的时机可能并非突发事件”。
        当晚新华社只在英文推特上回应，称胡锦涛近来在休养，仍坚持出席闭幕会，“会议期间身体不适，工作人员为了他的健康，陪他到会场旁的房间休息”，并说他“现在好多了”。BBC 指出，“中国国内媒体并未报道该事件”，这一说法也没有出现在新华社中文网站。
      cites: [b02-bbc-2022-10-22-hu-escorted, e04-guardian-2022-10-23-hu-jintao]
    - h: 元老现状
      from: 2022
      to: 2026
      text: >-
        据《联合早报》，胡锦涛最后一次公开亮相是 2022 年 12 月江泽民逝世时到医院送别。2026 年 8 月朱镕基逝世，新华社通稿把他列入表示哀悼的领导人名单，并写道“胡锦涛送花圈，对朱镕基同志逝世表示哀悼”，他本人没有出现在告别仪式上。
        同月 17 日的江泽民诞辰百年纪念大会上，年底满 84 岁的胡锦涛未现身；《联合早报》称“胡锦涛目前是官方排序最靠前的中共元老”。
      cites: [b02-zaobao-2026-08-17-jiang-centenary, b02-gov-2026-08-18-zhu-rongji-farewell]
  assess:
    - voice: official
      quote: true
      text: 他集中全党智慧创立了科学发展观，党的十八大已经将其同马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想一道确立为党必须长期坚持的指导思想
      cite: b02-people-2012-11-18-cmc-meeting
    - voice: scholar
      quote: true
      text: The elitist coalition tends to emphasize economic efficiency and GDP growth, while the populist coalition stands for social justice and social cohesion.
      zh: 精英联盟倾向于强调经济效率和 GDP 增长，民粹联盟则主张社会公正与社会凝聚。
      cite: f01-brookings-2012-04-16-power-shift
    - voice: zh
      text: BBC 中文网评论认为胡锦涛时代是“绕着走”的十年：并非看不到问题，而是在强人离去、江系掣肘之下步步小心，回避政改，以社会和谐论代替制度改革。
      cite: b02-bbc-2012-10-29-hu-era
    - voice: zh
      text: 《联合早报》认为，习近平在十八大同时接任中央军委主席，使中共实现了接班人一步到位，这是胡锦涛留下的最大政治遗产。
      cite: b02-bbc-2012-11-16-sea-press-hu
  family:
    - name: 胡海峰
      rel: 子
      text: >-
        胡锦涛的独子。据《联合早报》，他在父亲 2012 年卸任总书记后“才踏入政界”：2013 年 5 月到浙江嘉兴挂职市委副书记，后任丽水市委书记，2024 年 1 月 16 日调任民政部副部长，在浙江工作 14 年后返京。
      cites: [b02-zaobao-2024-01-16-hu-haifeng]
  cites:
    - b02-gov-2008-03-16-hu-resume
    - b02-npc-2007-10-24-17th-report
