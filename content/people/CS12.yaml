  bio: >-
    十三、十四、十五届中央委员。从常州起家，历任常州市委书记、南京市委书记、河南省长，1990 年起在河北任省长、省委书记、省人大常委会主任。
    2000 年秘书李真案发后，儿子程慕阳经香港去了加拿大；2003 年中央纪委认定他为他人和程慕阳谋利、打击报复举报人郭光允，开除其党籍。
