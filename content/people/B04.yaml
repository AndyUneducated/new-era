  life:
    - h: 内蒙古教师与记者
      from: 1947
      to: 1982
      text: >-
        1947 年 7 月生于内蒙古土默特右旗一个普通农民家庭，祖籍山西忻州。1964 至 1968 年就读集宁师范学校，BBC 指出这所学校“远不是一所名校”。毕业后当过农村教师、在公社劳动锻炼，1969 年起任土默特右旗旗委宣传部干事。
        1975 至 1982 年任新华社内蒙古分社农牧组记者，所写通讯《夜宿车马店》被官方称为中国新闻界的范文。
      cites: [b04-gov-2012-11-15-liu-resume, b04-chinanews-2012-12-25-liu-profile, b04-bbc-2012-09-04-psc-profiles]
    - h: 从团干部到中宣部
      from: 1982
      to: 2002
      text: >-
        1982 年中共提倡提拔年轻干部，他调任内蒙古团委副书记，此后任自治区党委宣传部副部长、部长；1985 年中共全国代表会议上，年仅 38 岁的他当选候补中央委员。此后历任自治区党委秘书长、赤峰市委书记、自治区党委副书记。据新华社的人物特稿，1986 年任自治区党委宣传部长时，他为调研农村思想政治工作，独自坐火车、乘汽车、搭拖拉机下乡，进农家、住帐篷。
        1993 年首次离开内蒙古，进京任中宣部副部长、常务副部长，1997 年起兼任中央精神文明建设指导委员会办公室主任。
      cites: [b04-gov-2012-11-15-liu-resume, b04-chinanews-2012-12-25-liu-profile, b04-bbc-2012-09-04-psc-profiles]
    - h: 中宣部长十年
      from: 2002
      to: 2012
      text: >-
        2002 年出任中宣部长，十六届一中全会上当选政治局委员、书记处书记。他把宣传工作概括为“坚持重在建设”，称中宣部实际上是个“建设部”，并常用“接地气才能有底气、长灵气”要求下属。
        作为中央宣传思想工作领导小组副组长，他推动 2004 年启动的马克思主义理论研究和建设工程，设 160 多个课题组、3000 多名专家直接参与。十六大后的文化体制改革由他分管，国有经营性文化单位基本完成转企改制，他被官方誉为“操盘手”；新华社还称，他提出的“文化自觉、文化自信、文化自强”得到文化界、理论界的高度认同。公务之余他常写散文随笔，2011 年出访非洲后写的《文化的非洲》曾在文化界引起热议。
      cites: [b04-gov-2012-11-15-liu-resume, b04-chinanews-2012-12-25-liu-profile]
    - h: 管媒体与管网络
      from: 2002
      to: 2012
      text: >-
        新华社称，“传播力决定影响力，话语权决定主动权，透明度决定公信度”这句话出自他。2008 年汶川地震发生十几分钟后，他亲自打电话给央视台长，要求不间断直播；此后定下的“及时准确、公开透明、有序开放、有效管理、正确引导”二十字方针，成为官方媒体报道突发事件的原则。他还推动新闻界“走基层、转作风、改文风”，提倡“善待媒体、善用媒体、善管媒体”，主张媒体监督应是“建设性监督”。
      cites: [b04-chinanews-2012-12-25-liu-profile]
    - h: 管网络
      from: 2002
      to: 2012
      text: >-
        新华社称，他对互联网“始终持开放态度”，每天上网浏览资讯；他的说法是要大胆积极利用，同时依法管理，“管理是为了促进网络信息自由、有序、安全流动”。
        2011 年 9 月会见日韩记者时，他说：“中宣部不可能完全管理五亿网民，批评是过高评价中宣部了”。日本《读卖新闻》认为，这番话显示中国将以新的法律措施来限制网络自由。半岛电视台则评论说，他任内收紧了对国内媒体的控制，同时推动大型官媒向海外扩张。
      cites: [b04-chinanews-2012-12-25-liu-profile, b04-bbc-2011-09-08-liu-netizens, b04-aljazeera-2012-11-15-new-leaders]
    - h: 常委与退休
      from: 2012
      to: 2017
      text: >-
        2012 年十八大进入政治局常委会，在七名常委中排名第五，仍任中央书记处书记，并兼任中央党校校长，2013 年 1 月首次以这一身份出现在官方报道中。半岛电视台称他被普遍视为新领导层中较保守的一员。
        2015 年 10 月，他率团赴平壤出席朝鲜劳动党成立 70 周年庆典，与金正恩一起观看阅兵。BBC 指出，这是金正恩 2011 年底掌权后首次会见中共最高层领导人，此行意在恢复因朝鲜核导问题而冷却的两党两国往来；金正恩在庆典上举起他的手向人群致意。他还到安州祭扫了中国人民志愿军烈士陵园。
        2017 年十九大，他与张德江、俞正声、张高丽一起如外界所料未进入新一届中央委员会，告别政坛。
      cites: [b04-gov-2012-11-15-liu-resume, b04-gov-2012-11-15-xi-press, b04-people-2013-01-15-liu-party-school, b04-aljazeera-2012-11-15-new-leaders, b04-gov-2015-10-11-liu-dprk, b04-bbc-2015-10-09-liu-dprk, b04-bbc-2015-10-11-dprk-kim, b04-zaobao-2017-10-25-wang-exit]
