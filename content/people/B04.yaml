  life:
    - h: 红色家庭
      from: 1945
      to: 1963
      text: >-
        1945 年 4 月生于延安，籍贯浙江绍兴，是黄敬与范瑾的次子。父亲黄敬原名俞启威，是江青的前夫和她入党的介绍人，1949 年后任天津市首任市长；母亲范瑾是历史学家范文澜的妹妹，曾任《北京日报》社长、北京市副市长。
        谈到家庭的影响，他对新华社说：“他们就是希望我们做一个正直的人，不要有特权，不要谋求特权。”
      cites: [b04-bbc-2007-10-27-yu-shanghai, b04-voa-2015-12-11-yu-qiangsheng, b04-xinhua-2013-03-11-yu-resume, b04-gov-2012-12-24-yu-profile]
    - h: 导弹专业与电子工业
      from: 1963
      to: 1985
      text: >-
        1963 年入哈尔滨军事工程学院导弹工程系，学习弹道式导弹自动控制，1968 年分配到河北张家口无线电厂当技术员。1975 年进入第四机械工业部电子技术推广应用研究所，此后升至电子工业部计划司副司长，前后做了 16 年技术工作。1984 年转任中国残疾人福利基金会副理事长。多年后他在上海视察电站设备基地时提了许多专业问题，企业负责人以为他是清华电站设备专业出身。
      cites: [b04-xinhua-2013-03-11-yu-resume, b04-gov-2012-12-24-yu-profile]
    - h: 兄长叛逃
      from: 1985
      to: 1985
      text: >-
        1985 年，他的哥哥、国家安全部官员俞强声叛逃美国，并向美方揭发了中情局分析员金无怠为中国间谍的身份，金无怠随即被捕，1986 年在狱中自杀。
        俞强声的下落众说纷纭：BBC 2007 年称他两年后在南美被中共特工暗杀，美国之音 2015 年采访的前联邦调查局官员则否认了这一说法。美国之音还提到，坊间传言因邓朴方力保，俞家才屹立不倒，俞正声也才得以官至政治局常委。
      cites: [b04-bbc-2012-06-01-state-security, b04-bbc-2007-10-27-yu-shanghai, b04-voa-2015-12-11-yu-qiangsheng]
    - h: 山东与建设部
      from: 1985
      to: 2001
      text: >-
        叛逃事件同年，他出任山东烟台市委副书记，1987 年任市长；1989 年调青岛，1992 至 1997 年任山东省委常委、青岛市委书记。1997 年进京任建设部党组书记，1998 至 2001 年任建设部部长。
        据新华社介绍，他任烟台市长时在全国率先推行房改；在青岛重视工业品牌，海尔、海信、澳柯玛由此在全国出名，他也得了“品牌市长”的称号，还曾通过电视公布自己的收入、住房和收受礼品的处理情况。到建设部后，他把“抓质量”定为第一中心工作。
      cites: [b04-xinhua-2013-03-11-yu-resume, b04-gov-2012-12-24-yu-profile]
    - h: 湖北
      from: 2001
      to: 2007
      text: >-
        2001 年任湖北省委书记，次年进入政治局。他在湖北主推武汉城市圈和县域经济这“两大抓手”。2007 年 10 月调离时，中组部副部长沈跃跃评价他在湖北的六年是湖北“经济社会发展最快、最好”的时期之一。
      cites: [b04-xinhua-2013-03-11-yu-resume, b04-bbc-2007-10-27-yu-shanghai, b04-gov-2012-12-24-yu-profile]
    - h: 上海
      from: 2007
      to: 2012
      text: >-
        2007 年 10 月调任上海市委书记，接替升任常委的习近平。到任不久，市委公开纳谏，宣布“言论无禁区，只要有建设性即可”，新华社称之为“俞式风格”。任内南汇并入浦东，上海在全国率先试点营业税改增值税；他兼任世博会执委会主任，2010 年世博会半年吸引 7300 多万人次参观。
        2008 年上海两会上他说“上海没出马云我们多少有问题”，引发“上海为何出不了马云”的讨论；2012 年初他又坦言，转型就要接受增速和财政收入下降。2012 年 11 月 20 日，他卸任上海市委书记。
      cites: [b04-xinhua-2013-03-11-yu-resume, b04-gov-2012-12-24-yu-profile, b04-cntv-2012-01-12-yu-transition]
    - h: 政协主席
      from: 2012
      to: 2018
      text: >-
        2012 年十八大进入政治局常委会，同年 12 月下旬与习近平一起在一天半内登门走访 8 个民主党派中央和全国工商联。2013 年 3 月当选十二届全国政协主席，是第八位全国政协主席。日本《产经新闻》当时报道称，这次人事变动令政协成了“太子党俱乐部”，认为政协可能成为习近平的势力范围。
        2017 年十九大，他与张德江、刘云山、张高丽一起未进入新一届中央委员会，告别政坛；2018 年 3 月 14 日，汪洋当选全国政协主席，接替了他。
      cites: [b04-xinhua-2013-03-11-yu-resume, b04-xinhua-2013-03-11-yu-profile, b04-bbc-2013-03-12-cppcc-princelings, b04-zaobao-2017-10-25-wang-exit, b04-cppcc-2018-03-14-wang-yang]
  assess:
    - voice: official
      quote: true
      text: 言谈举止中透着儒雅之风的俞正声，是位学者型领导，有着从中央到地方多个领导岗位的丰富从政经历。
      cite: b04-gov-2012-12-24-yu-profile
    - voice: official
      quote: true
      text: 俞正声在湖北的六年，是湖北改革开放以来全省经济社会发展最快、最好，老百姓得到实惠最多的时期之一
      cite: b04-bbc-2007-10-27-yu-shanghai
    - voice: japan
      quote: true
      text: 刚当选全国政协主席的俞正声，其父是前天津市委书记的中共长老黄敬，所以俞正声是太子党成员之一。
      cite: b04-bbc-2013-03-12-cppcc-princelings
    - voice: scholar
      quote: true
      text: Some Chinese analysts argue that due to their princeling background, these leaders have more political capital and resources than did their predecessors Hu Jintao and Wen Jiabao
      zh: 一些中国分析人士认为，由于太子党背景，这几位领导人比出身寒微的前任胡锦涛、温家宝拥有更多政治资本和资源。
      cite: f01-brookings-2013-02-10-princelings
  family:
    - name: 黄敬（俞启威）
      rel: 父亲
      text: >-
        1930 年代在上海投身中共，是江青的前夫和入党介绍人，1949 年后任天津市首任市长。
      cites: [b04-voa-2015-12-11-yu-qiangsheng, b04-bbc-2007-10-27-yu-shanghai]
    - name: 范瑾
      rel: 母亲
      text: >-
        历史学家范文澜的妹妹，曾任天津日报社总编辑、《北京日报》社长、北京市副市长。
      cites: [b04-bbc-2007-10-27-yu-shanghai]
    - name: 张志凯
      rel: 妻子
      text: >-
        前国防科工委副主任张震寰之女，已退休。两人育有一子。
      cites: [b04-bbc-2007-10-27-yu-shanghai, b04-gov-2012-12-24-yu-profile]
    - name: 俞强声
      rel: 哥哥
      text: >-
        国家安全部官员，1985 年叛逃美国，导致中国间谍金无怠暴露被捕。BBC 2007 年称他两年后在南美被暗杀，美国之音 2015 年采访的前联邦调查局官员否认这一说法。
      cites: [b04-bbc-2012-06-01-state-security, b04-bbc-2007-10-27-yu-shanghai, b04-voa-2015-12-11-yu-qiangsheng]
  cites: [b04-xinhua-2013-03-11-yu-resume, b04-gov-2012-12-24-yu-profile, b04-bbc-2007-10-27-yu-shanghai, b04-voa-2015-12-11-yu-qiangsheng, b04-bbc-2013-03-12-cppcc-princelings, b04-cppcc-2018-03-14-wang-yang, f01-brookings-2013-02-10-princelings, wd-Q115671]

