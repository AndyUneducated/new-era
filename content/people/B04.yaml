  bio: >-
    中共元老习仲勋之子，文革中下放陕北梁家河七年，此后在河北正定、福建、浙江、上海任职二十余年，2007 年进入政治局常委会成为接班人。
    2012 年起任中共中央总书记、中央军委主席，2013 年起任国家主席。执政后发动中共建政以来规模最大的反腐运动，2016 年被确立为“核心”，2018 年修宪取消国家主席任期限制，2022 年开启第三任期。
    2023 年以来，他提拔的外长秦刚、国防部长李尚福，以及军委副主席何卫东、张又侠等高级将领相继落马。
