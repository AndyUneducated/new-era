  roles: [pb, sec, ccdi, cc, minister]
  status: retired
  statusNote: 2023 年 3 月卸任国家监委主任后退休，同年 9 月任中国残联第八届名誉主席；2026 年 8 月出席江泽民百年诞辰纪念大会。
  tier: 1
  headline: 首任国家监察委员会主任（2018–2023）、政治局委员
  bio: >-
    上海人，1970 年到安徽太和插队，1973–1976 年读上海中医学院药学系，毕业后进藏，在那曲、昌都和自治区机关工作二十五年，升至西藏自治区政府副主席。
    2001 年回上海任副市长，2006 年任市委常委、统战部长，2007 年习近平主政上海时是市委班子成员，2012 年任上海市纪委书记。2014 年 1 月调任中纪委副书记，
    2016 年底兼监察部部长，十九大进入政治局和书记处，2018 年监察法通过、国家监委成立，他任首任主任，2023 年退休。
  positions:
    - { title: 西藏那曲地区行署副专员, sys: gov, place: 西藏, from: 1986, to: 1992, cite: c02-gov-2017-10-25-19th-cvs }
    - { title: 西藏自治区财政厅厅长, sys: gov, place: 西藏, from: 1995, to: 1998, cite: c02-gov-2017-10-25-19th-cvs }
    - { title: 西藏自治区政府副主席, sys: gov, place: 西藏, from: 1998, to: 2001, cite: c02-gov-2017-10-25-19th-cvs }
    - { title: 上海市副市长, sys: gov, place: 上海, from: 2001, to: 2006, cite: c02-gov-2017-10-25-19th-cvs }
