# B17: full biographies of Wang Xiaohong, Liu Jinguo, Guo Shengkun, Yang Xiaodu, Zhang Chunxian and You Quan (tier 2 cards from C02 expanded to tier 1).
- id: wang-xiaohong
  name: 王小洪
  pinyin: Wáng Xiǎohóng
  gender: m
  ethnicity: 汉族
  born: 1957-07-11
  birthplace: 福建福州
  education:
    - { school: 中国人民公安大学公安管理专业, from: 1985-09, to: 1987-07 }
    - { school: 中央党校函授学院本科班经济管理专业, from: 1994-08, to: 1996-12 }
  joinedParty: 1982-12
  joinedWork: 1974-07
  roles: [sec, cc, minister]
  status: active
  statusNote: 中央书记处书记、国务委员、公安部部长，2026 年 9 月仍以此身份公开活动。
  tier: 1
  headline: 公安部部长（2022– ）、国务委员、中央书记处书记
  bio: >-
    福州人，1974 年在闽侯县当知青，此后在闽侯县公安局从干部做到局长。1993 年任福州市公安局副局长，在时任福州市委书记习近平手下工作，1998 年升局长，
    此后在副厅级上停了十五年，历任福建省公安厅副厅长、厦门市副市长兼公安局长。习近平主政后，他 2013 年调河南任省长助理兼公安厅长，2015 年任北京市副市长兼公安局长，
    2016 年任公安部副部长，2018 年主持部里日常工作，2022 年 6 月接替赵克志任部长，二十大进入书记处，2023 年兼国务委员，同时任国家禁毒委员会主任。
  positions:
    - { title: 闽侯县公安局局长、福州市公安局郊区分局局长, sys: gov, place: 福建, from: 1989-01, to: 1993-08, cite: b17-fznews-2022-06-28-wang-xiaohong-cv }
    - { title: 福州市公安局副局长, sys: gov, place: 福建, from: 1993-08, to: 1998-02, cite: b17-fznews-2022-06-28-wang-xiaohong-cv }
    - { title: 福州市公安局局长（兼漳州市公安局局长）, sys: gov, place: 福建, from: 1998-02, to: 2002-05, cite: b17-fznews-2022-06-28-wang-xiaohong-cv }
    - { title: 福建省公安厅副厅长, sys: gov, place: 福建, from: 2002-05, to: 2011-09, cite: b17-fznews-2022-06-28-wang-xiaohong-cv }
    - { title: 厦门市副市长兼公安局局长, sys: gov, place: 福建, from: 2011-09, to: 2013-08, cite: b17-fznews-2022-06-28-wang-xiaohong-cv }
    - { title: 河南省长助理、副省长兼公安厅厅长, sys: gov, place: 河南, from: 2013-08, to: 2015-03, cite: b17-fznews-2022-06-28-wang-xiaohong-cv }
    - { title: 北京市副市长, sys: gov, place: 北京, from: 2015-03, to: 2018-01, cite: b17-fznews-2022-06-28-wang-xiaohong-cv }
    - { title: 北京市公安局局长, sys: gov, place: 北京, from: 2015-03, to: 2020-04, cite: b17-fznews-2022-06-28-wang-xiaohong-cv }
    - { title: 公安部副部长（2018 年起分管日常工作，正部长级）, sys: gov, from: 2016-05, to: 2022-06, cite: b17-fznews-2022-06-28-wang-xiaohong-cv }
    - { title: 公安部特勤局局长, sys: gov, from: 2019-11, cite: b17-fznews-2022-06-28-wang-xiaohong-cv }
    - { title: 公安部部长, sys: gov, from: 2022-06, cite: b17-fznews-2022-06-28-wang-xiaohong-cv }
    - { title: 中央书记处书记, sys: party, from: 2022-10, cite: b08-wikisource-2022-10-23-20-1-plenum }
    - { title: 国务委员, sys: gov, from: 2023-03, cite: b08-xinhua-2023-03-13-state-councilor-cv }
  life:
    - h: 闽侯知青与县公安局
      from: 1974
      to: 1993
      text: >-
        1957 年 7 月生于福州，1974 年 7 月在闽侯县当知青，后进风机厂当工人。1979 年底进闽侯县公安局，1984 年任副局长，其间 1985–1987 年在中国人民公安大学读公安管理专业，
        1989 年升任局长，兼福州市公安局郊区分局局长。The Diplomat 的文章说，他近四十年仕途几乎都在家乡福建，习近平任福州市委书记后，他被调到福州市公安局郊区分局任局长。
      cites: [b17-fznews-2022-06-28-wang-xiaohong-cv, b17-diplomat-2015-04-fujian-clique]
    - h: 福州市公安局
      from: 1993-08
      to: 2002-05
      text: >-
        1993 年 8 月任福州市公安局副局长、党委副书记，维基百科称他在时任福州市委书记习近平领导下工作；1994 年 10 月定为正处级。1998 年 2 月升任福州市公安局局长兼市委政法委副书记，同时兼任漳州市公安局局长，级别为副厅级。
        自由亚洲电台在他 2022 年出任公安部长时称，他是习近平的福州旧部，这一任命被认为是习近平握紧刀把子。
      cites: [b17-fznews-2022-06-28-wang-xiaohong-cv, c02-wiki-wang-xiaohong, c02-rfa-2022-06-24-wang-xiaohong]
    - h: 副厅级十五年
      from: 2002-05
      to: 2013-08
      text: >-
        2002 年 5 月调任福建省公安厅副厅长，兼省公安边防总队第一政委，一做九年；2011 年 9 月任厦门市副市长兼市公安局局长、市委政法委副书记，同月被授予一级警监警衔。
        The Diplomat 指出，习近平离开福州后他的仕途停滞：1998 年拿到副厅级，此后在这一级别停了 15 年。
      cites: [b17-fznews-2022-06-28-wang-xiaohong-cv, b17-diplomat-2015-04-fujian-clique]
    - h: 河南与北京
      from: 2013-08
      to: 2016-05
      text: >-
        2013 年 8 月调任河南省长助理兼公安厅厅长，年底又兼武警河南总队第一政委，2014 年 12 月升副省长，2015 年 1 月授副总警监警衔；2015 年 3 月转任北京市副市长兼市公安局局长。
        The Diplomat 当时评论说，习近平成为中国最有权势的人之后，王小洪的仕途开始上升，一年半里从副厅级升到副部级。
      cites: [b17-fznews-2022-06-28-wang-xiaohong-cv, c02-wiki-wang-xiaohong, b17-diplomat-2015-04-fujian-clique]
    - h: 公安部常务副部长
      from: 2016-05
      to: 2022-06
      text: >-
        2016 年 5 月任公安部副部长，仍兼北京市公安局局长，副市长一职到 2018 年 1 月卸下。2018 年 3 月任公安部党委副书记、分管日常工作的副部长，正部长级；
        2019 年 11 月起兼公安部特勤局局长，2020 年 4 月不再兼北京市公安局长，改兼部督察长；2021 年 11 月任公安部党委书记、中央政法委员会委员，部长一职仍由赵克志担任。
      cites: [b17-fznews-2022-06-28-wang-xiaohong-cv]
    - h: 公安部部长
      from: 2022-06
      to: 2023-03
      text: >-
        2022 年 6 月 24 日，全国人大常委会免去赵克志兼任的公安部部长职务，任命王小洪接任，他随后兼任中央政法委副书记，并继续兼任部督察长和特勤局局长。维基百科称他是 1998 年以来首位有公安背景的公安部部长。
        同年 10 月二十届一中全会上他进入中央书记处，2023 年 3 月任国务委员。
      cites: [b17-fznews-2022-06-28-wang-xiaohong-cv, c02-wiki-wang-xiaohong, b08-wikisource-2022-10-23-20-1-plenum, b08-xinhua-2023-03-13-state-councilor-cv]
    - h: 禁毒与中美会谈
      from: 2025-01
      to: 2025-05
      text: >-
        他兼任国家禁毒委员会主任，上报介绍，该委员会 1990 年由公安部、国务院办公厅、外交部等单位组成，以公安部为主责部会。2025 年 1 月他与美国白宫国家禁毒政策办公室主任古普塔视频通话。
        同年 5 月，中央社引述《华尔街日报》报道，习近平指定他赴瑞士参加中美经贸会谈处理芬太尼问题，他是何立峰率领的代表团成员，对手是美国财长贝森特和贸易代表葛里尔；
        会谈达成休兵 90 天、双方各降 115% 关税的共识。上报引述日经前驻华记者中泽克二的分析说，他与习近平从福建开始已有 35 年交情。
      cites: [b17-gov-2025-01-08-wang-gupta, b17-cna-2025-05-10-wang-geneva, b17-upmedia-2025-05-22-wang-drug-tsar]
    - h: 失踪传闻与复出
      from: 2026-03
      to: 2026-09
      text: >-
        据看中国（传闻）2026 年 4 月 10 日报道，他访问越南后 24 天没有公开露面，海外流传他已被秘密控制。官方报道显示，他 5 月 18 日在哈萨克斯坦阿斯塔纳出席中国－中亚公安内务部长会晤机制第二次会议，
        9 月 7 日在北京主持该机制非正式会晤，9 月 22 日又以书记处书记、公安部部长身份出席全国公安机关视频会议。
      cites: [b17-kzg-2026-04-10-wang-rumor, b17-gov-2026-05-19-wang-astana, b17-gov-2026-09-07-wang-central-asia, c02-gov-2026-09-22-wang-xiaohong]
  assess:
    - voice: west
      quote: true
      text: His career stalled after the departure of Xi Jinping from Fuzhou. He obtained the rank of deputy department head in 1998 but remained at that level for 15 years.
      zh: 习近平离开福州后，他的仕途停滞了。他 1998 年获得副厅级，但此后在这一级别停留了 15 年。
      cite: b17-diplomat-2015-04-fujian-clique
    - voice: zh
      quote: true
      text: 王小洪是中共总书记习近平的福州旧部，此举被认为是习近平握紧“刀把子”。
      cite: c02-rfa-2022-06-24-wang-xiaohong
    - voice: zh
      quote: true
      text: 加上他與中國領導人習近平之間，從福建開始建立的35年交情，使其成為知情人士口中習近平「少數真正能夠信任的老朋友」
      cite: b17-upmedia-2025-05-22-wang-drug-tsar
  factions:
    - f: fujian
      cite: c02-rfa-2022-06-24-wang-xiaohong
      quote: 王小洪是中共总书记习近平的福州旧部
  ids: { wikidata: Q18109475 }
