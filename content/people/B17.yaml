  life:
    - h: 兵团、工厂与人大
      from: 1954
      to: 1988
      text: >-
        1954 年 1 月生于北京，祖籍河北卢龙。1969 年 9 月到黑龙江生产建设兵团当战士，后任连指导员，1973 年入党。1976 年回北京，在北京第一机床厂当工人、组织科干事。
        1980–1984 年读中国人民大学一分校国民经济计划专业，1984–1987 年读人大计划经济系硕士研究生，毕业后留系任教一年。
      cites: [b17-people-2017-11-07-you-ufwd, wd-Q4276510]
    - h: 国务院办公厅
      from: 1988
      to: 2006
      text: >-
        1988 年调入国务院办公厅，在秘书二局历任主任科员、一组副组长、组长、助理政务专员、副局长，1998 年升任局长，2000 年任国务院副秘书长、机关党组成员，一做六年。
        南华早报说，他职业生涯的大部分时间都在国务院做秘书工作。
      cites: [b17-people-2017-11-07-you-ufwd, b17-scmp-2017-11-07-you-ufwd]
    - h: 电监会与国务院副秘书长
