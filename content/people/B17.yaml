  roles: [pb, cc, prov, minister]
  status: retired
  statusNote: 2023 年 3 月卸任全国人大常委会副委员长后退休；2026 年 2 月仍在春节看望老同志名单上。
  tier: 1
  headline: 新疆维吾尔自治区党委书记（2010–2016）、政治局委员（2012–2017）
  bio: >-
    河南禹州人，当兵五年后读锻压专业，在机械部第十设计研究院从计划员做到党委书记，1990 年代任中国包装和食品机械总公司总经理、云南省长助理。1998 年任交通部副部长，2002 年升部长，
    2005 年底任湖南省委书记。2009 年乌鲁木齐七五事件后，2010 年 4 月接替王乐泉主政新疆，以发展民生、解封互联网等柔性做法著称，2012 年进入政治局。
    2016 年 8 月由陈全国接任，转任中央党建工作领导小组副组长，2018–2023 年任全国人大常委会副委员长。
  positions:
    - { title: 中国包装和食品机械总公司总经理, sys: other, from: 1993, to: 1995, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 云南省长助理, sys: gov, place: 云南, from: 1995, to: 1997, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 交通部副部长, sys: gov, from: 1998, to: 2002, cite: c02-cyol-2012-11-16-18th-cvs }
