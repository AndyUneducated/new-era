  bio: >-
    生于北京，祖籍河北卢龙，1969 年到黑龙江生产建设兵团，回京后当过机床厂工人，1980 年代在中国人民大学读国民经济计划专业硕士。1988 年进国务院办公厅，在秘书二局从主任科员做到局长，
