- id: liu-jinguo
  name: 刘金国
  pinyin: Liú Jīnguó
  gender: m
  ethnicity: 汉族
  born: 1955-04
  birthplace: 河北昌黎
  education:
    - { school: 中央党校领导干部函授本科班经济管理专业, from: 1996-08, to: 1998-12 }
  joinedParty: 1975-09
  joinedWork: 1976-12
  roles: [sec, ccdi, cc, minister]
  status: active
  statusNote: 中央书记处书记、中纪委副书记、国家监委主任，2026 年 8 月仍以此身份公开活动。
  tier: 1
  headline: 国家监察委员会主任（2023– ）、中央书记处书记、中纪委副书记
  bio: >-
    河北昌黎农家子弟，1974 年高中毕业回村当民兵连副连长，1975 年入党，从公社书记做起。1992 年转入公安，历任秦皇岛市公安局长、河北省公安厅副厅长、河北省委政法委书记，
    2005 年调任公安部副部长，2009 年兼部纪委书记，因指挥汶川地震救援和大连油港火灾扑救当选感动中国 2011 年度人物。2014 年 1 月李东生落马后升任公安部党委副书记（正部级），
    兼管防范处理邪教工作，同年 10 月任中纪委副书记。二十大进入书记处，成为排名第一的中纪委副书记，2023 年接替杨晓渡任国家监委主任。
  positions:
    - { title: 秦皇岛市公安局局长, sys: gov, place: 河北, from: 1992-05, to: 1995-07, cite: b17-xinhua-2015-05-26-liu-jinguo-cv }
    - { title: 河北省公安厅副厅长, sys: gov, place: 河北, from: 1995-07, to: 2001-12, cite: b17-xinhua-2015-05-26-liu-jinguo-cv }
    - { title: 河北省委政法委书记（2002 年 12 月起任省委常委）, sys: party, place: 河北, from: 2001-12, to: 2005-03, cite: b17-xinhua-2015-05-26-liu-jinguo-cv }
    - { title: 公安部副部长, sys: gov, from: 2005-03, to: 2015-03, cite: b17-xinhua-2015-05-26-liu-jinguo-cv }
    - { title: 公安部纪委书记、督察长, sys: gov, from: 2009-08, to: 2015-03, cite: b17-xinhua-2015-05-26-liu-jinguo-cv }
    - { title: 中央防范和处理邪教问题领导小组副组长、办公室主任, sys: party, from: 2014-01, to: 2014-12, cite: b17-xinhua-2015-05-26-liu-jinguo-cv }
    - { title: 中纪委副书记, sys: party, from: 2014-10, cite: b17-xinhua-2015-05-26-liu-jinguo-cv }
    - { title: 中央书记处书记, sys: party, from: 2022-10, cite: b08-wikisource-2022-10-23-20-1-plenum }
    - { title: 国家监察委员会主任, sys: gov, from: 2023-03, cite: b17-gov-2023-03-11-liu-ncs }
  life:
    - h: 公社书记
      from: 1955
      to: 1992
      text: >-
        1955 年 4 月生于河北昌黎。新京报的报道说，他 1974 年高中毕业后回村当民兵连副连长，1975 年入党，此后任村党支部书记，1976 年底起任槐李庄公社党委副书记、书记。
        1983–1985 年在河北省委党校中青班学习，之后历任昌黎县委常委、组织部长和县委副书记，1987 年任秦皇岛市山海关区区长，1991 年任秦皇岛市委秘书长。
      cites: [b17-xinhua-2015-05-26-liu-jinguo-cv, b17-chinanews-2014-10-25-liu-ccdi]
    - h: 河北公安与政法
      from: 1992-05
      to: 2005-03
      text: >-
        1992 年 5 月出任秦皇岛市公安局局长，后兼市委常委、副市长；1995 年 7 月调河北省公安厅任副厅长，2001 年 12 月任河北省委政法委书记，2002 年 12 月进省委常委（维基百科记政法委书记任期从 2002 年 1 月起）。
        央视网转载的人民网报道说，他调省厅搬家时全部家当只有半卡车旧家具和一台黑白电视机，单位分房要交 4.6 万元集资款，他拿不出，只能找银行贷款。
      cites: [b17-xinhua-2015-05-26-liu-jinguo-cv, c02-wiki-liu-jinguo, b17-cntv-2012-02-06-liu-touching-china]
    - h: 公安部副部长
      from: 2005-03
      to: 2013
      text: >-
        2005 年 3 月调任公安部副部长，主管经济犯罪侦查，2009 年 8 月起兼部纪委书记、督察长。2008 年汶川地震时任公安部前线总指挥，调集全国 2 万多名公安专业救援力量，从废墟中救出 8335 人。
        他给部纪委干部写下的四条纪律是：不枉纪枉法，不干预办案，不泄露案情，不吃请受礼。
      cites: [b17-xinhua-2015-05-26-liu-jinguo-cv, c02-wiki-liu-jinguo, b17-cntv-2012-02-06-liu-touching-china, b17-chinanews-2014-10-25-liu-ccdi]
    - h: 大连火场与感动中国
      from: 2010-07
      to: 2012-02
      text: >-
        2010 年 7 月 16 日大连新港输油管线闪爆起火，他率专家组赶到现场。人民网说他在前沿连续指挥了七个小时，新京报则说他站着指挥了 8 个小时，其间发生 6 次大爆炸，
        他对时任大连市公安局长王立科说：“我来到了这个火场，就没想活着回去。”2012 年 2 月他当选感动中国 2011 年度人物，颁奖词称他为“烈火锻造的铁血将帅，两袖清风的忠诚卫士”。
      cites: [b17-cntv-2012-02-06-liu-touching-china, b17-chinanews-2014-10-25-liu-ccdi, c02-wiki-liu-jinguo]
    - h: 与周永康的传闻
      from: 2005
      to: 2014
      text: >-
        据澳洲《中国报》转述港媒（传闻），他没有政治背景和靠山，在公安部受到周永康及其手下人的排挤，资历在副部长中排名靠后；该报道还传言，北京抓捕周永康时专案组组长是王岐山，
        副组长是刘金国，动用了他分管的武警消防部队完成抓捕。维基百科也说他在公安部受到周永康的排挤。这些说法都没有官方证实。
      cites: [b17-cbfau-2015-liu-wang-qishan, c02-wiki-liu-jinguo]
    - h: 主持部务与猎狐行动
      from: 2014-01
      to: 2014-10
      text: >-
        李东生因贪腐下台后，2014 年 1 月他升任公安部党委副书记（正部级），兼中央防范和处理邪教问题领导小组副组长、办公室主任，成为部长郭声琨的副手。同年 7 月部署猎狐 2014 专项行动，
        要求即使犯罪分子逃到天涯海角，也要缉捕归案。南华早报称他是北京最忙的人之一，同时管着警察、反腐和打击邪教。
      cites: [b17-xinhua-2015-05-26-liu-jinguo-cv, c02-wiki-liu-jinguo, b17-chinanews-2014-10-25-liu-ccdi, b17-scmp-2014-11-08-liu-many-hats]
    - h: 中纪委副书记
      from: 2014-10
      to: 2022-10
      text: >-
        2014 年 10 月十八届中纪委四次全会增选他为中纪委常委、副书记，新京报说他是近年来第二位政法系统出身的中纪委副书记。到 2015 年初他已不再兼管防范邪教的职务，
        3 月卸下公安部全部职务，傅政华接任部党委副书记（正部长级），邓卫平接任部纪委书记。2017 年十九大他当选中央委员。
      cites: [b17-chinanews-2014-10-25-liu-ccdi, b17-xinhua-2015-05-26-liu-jinguo-cv, c02-wiki-liu-jinguo]
    - h: 国家监委主任
      from: 2022-10
      to: 2026-08
      text: >-
        2022 年 10 月二十届一中全会上，67 岁的他进入中央书记处，并升任中纪委排名第一的副书记。2023 年 3 月 11 日十四届全国人大一次会议选举他为国家监察委员会主任，
        联合早报报道，原任国家监委副主任的他以 2943 票赞成、三票反对、一票弃权当选，接替杨晓渡。2026 年 8 月 26 日，他受李希委托出席中央纪委国家监委机关第二次党员代表大会并讲话。
      cites: [c02-wiki-liu-jinguo, b17-gov-2023-03-11-liu-ncs, b17-zaobao-2023-03-12-ncs-heads, c02-zmdsjw-2026-08-27-liu-jinguo]
  assess:
    - voice: official
      quote: true
      text: 贼有未曾经我缚，事无不可对人言。……烈火锻造的铁血将帅，两袖清风的忠诚卫士。
      cite: b17-cntv-2012-02-06-liu-touching-china
    - voice: zh
      quote: true
      text: Liu Jinguo is a hard-working, seemingly incorruptible law enforcer but most of all, has a squeaky-clean record that puts him above reproach
      zh: 刘金国是一位勤勉、看上去不受腐蚀的执法者，但最重要的是，他履历清白，无可指摘。
      cite: b17-scmp-2014-11-08-liu-many-hats
  family:
    - name: 陈惠英
      rel: 母亲
      text: >-
        昌黎农村老人。她对法制晚报记者说，刘金国在北京安家买房时没什么钱，老家兄弟姐妹也凑不出钱，最后是贷款 40 万元、按月还贷解决的；她还说儿媳从未动用丈夫的关系。
      cites: [b17-chinanews-2014-10-28-liu-family]
    - name: 刘金凤、刘金平、刘金宽、刘金燕、刘金荣
      rel: 姐姐、弟弟、妹妹
      text: >-
        刘家兄妹六人，大姐刘金凤，刘金国排第二，下有刘金平、刘金宽两个弟弟和刘金燕、刘金荣两个妹妹，除他之外都在家务农。人民网的报道说，他亲手审批过近 20 万个农转非指标，自己的 38 个亲属无一跳出农门。
      cites: [b17-chinanews-2014-10-28-liu-family, b17-cntv-2012-02-06-liu-touching-china]
    - name: 妻子（姓名未公开）
      rel: 妻子
      text: >-
        据人民公安报（新京报转述），刘金国担任领导职务 30 多年，妻子一直是临时工。
      cites: [b17-chinanews-2014-10-25-liu-ccdi]
  ids: { wikidata: Q8990812 }
  cites: [wd-Q8990812, b17-xinhua-2015-05-26-liu-jinguo-cv, c02-gov-2022-10-23-20th-cvs, c02-wiki-liu-jinguo, b17-chinanews-2014-10-25-liu-ccdi, b17-scmp-2014-11-08-liu-many-hats, b17-gov-2023-03-11-liu-ncs, c02-zmdsjw-2026-08-27-liu-jinguo]

- id: guo-shengkun
  name: 郭声琨
  pinyin: Guō Shēngkūn
  gender: m
