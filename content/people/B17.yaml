        维基百科记载，2013 年 3 月肖捷任国务院常务副秘书长，接替尤权负责李克强总理的日常工作。他 2007 年当选十七届中央候补委员，2012 年十八大升为中央委员。
      cites: [b17-people-2017-11-07-you-ufwd, k04-wiki-xiao-jie]
    - h: 主政福建
      from: 2012-12
      to: 2014-09
      text: >-
        2012 年 12 月 19 日，中组部副部长张纪南在福建省领导干部大会上宣布由他任省委书记，接替孙春兰。他在会上表示，作为一名新的福建人，要尽快融入福建、扎根福建。
        2013 年起兼任省人大常委会主任。2014 年 9 月在莆田与民营企业座谈时，他开场就说表扬政府的话就不说了，有什么问题就讲什么问题；座谈中他又笑着表示，
        政府一定会为企业打造更好的市场环境和开放环境，你们只管放手干，我们为你们做好服务。
      cites: [b17-people-2012-12-20-you-fujian, b17-people-2017-11-07-you-ufwd, b17-hxnews-2014-09-22-you-putian]
    - h: 习近平的第二故乡
      from: 2014-11
      to: 2017-10
      text: >-
        2014 年 11 月 1–2 日，习近平在他和省长苏树林陪同下考察平潭综合实验区和福州，对省委省政府工作汇报给予肯定，并说“福建是我的第二故乡。”
        2017 年 10 月十九大闭幕后，他于 10 月 28 日把福建省委书记一职交给省长于伟国。
      cites: [b17-gov-2014-11-02-xi-fujian, p01-wiki-yu-weiguo]
    - h: 中央统战部部长
      from: 2017-10
      to: 2018-04
      text: >-
        十九届一中全会进入中央书记处，2017 年 11 月 7 日首次以中央统战部部长身份主持座谈会。南华早报说统战部职能很广，从笼络党外精英、联系海外华人到管理少数民族和宗教事务、处理西藏和新疆问题，
        但他几乎没有处理民族宗教问题的直接经验，新职责还包括争取香港商界精英的支持。2018 年 4 月他在安徽考察安徽神学院和宗教活动场所，要求坚持我国宗教的中国化方向，
        坚决抵御境外利用宗教进行的渗透，防范和治理各种非法违法宗教活动。
      cites: [c02-xinhua-2017-10-25-19-1-plenum, b17-people-2017-11-07-you-ufwd, b17-scmp-2017-11-07-you-ufwd, b17-xinhua-2018-04-04-you-religion]
    - h: 大统战与港澳
      from: 2018
      to: 2021-01
      text: >-
        2018 年机构改革后，统战部统一领导国家民委，统一管理宗教和侨务工作。2019 年 11 月他在人民日报撰文阐述大统战工作格局，写道统一战线是政治联盟，统战工作是政治工作。
        他还兼任中央港澳工作协调小组副组长；2021 年 1 月 15 日，美国国务院为回应港府大规模逮捕泛民人士，宣布制裁他等 6 名中港官员，
        同批还有驻港国安公署副署长孙青野、港区全国人大常委谭耀宗等，受制裁者在美资产将被冻结。
      cites: [b17-people-2019-11-26-you-united-front, b17-rfi-2021-01-15-sanctions]
    - h: 退休
      from: 2022-10
      to: 2026-02
      text: >-
        2022 年 10 月 25 日二十大闭幕后，他仍以统战部长身份受中共中央委托，向各民主党派中央、全国工商联负责人和无党派人士通报二十大精神，要求他们深刻领悟两个确立的决定性意义。28 日中央社报道，新当选政治局委员、书记处书记的石泰峰已接任中央统战部长，此前历任统战部长中只有乌兰夫、孙春兰有政治局委员资格。
        2026 年 2 月春节前，他在中央领导看望的老同志名单上。
      cites: [b17-minge-2022-10-26-you-briefing, b16-cna-2022-10-28-shi-ufwd, b17-xinhua-2026-02-14-old-comrades]
