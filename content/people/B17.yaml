    - { school: 中南工业大学管理工程系管理工程专业（在职）, degree: 管理学硕士, from: 1994, to: 1996 }
    - { school: 北京科技大学管理科学与工程专业（在职）, degree: 管理学博士, from: 2003, to: 2007 }
  joinedParty: 1974-12
  joinedWork: 1973-08
  roles: [pb, sec, cc, prov, minister]
  status: retired
  statusNote: 二十大后卸任中央政法委书记，由陈文清接任；2026 年仍出现在春节看望老同志名单和江泽民百年诞辰纪念大会上。
  tier: 1
  headline: 中央政法委书记（2017–2022）、政治局委员、前公安部部长
  bio: >-
    江西兴国人，知青出身，读完选矿专业后在赣南画眉坳钨矿从技术员做到矿长，此后在有色金属系统任南昌公司经理、总公司副总经理，2001 年起任中国铝业公司总经理。
    2004 年转任广西自治区党委副书记、政府副主席，2007 年底任广西党委书记。2012 年底接替孟建柱任公安部部长，次年兼国务委员，被认为缺乏政法经验。
    十九大进入政治局和书记处，接任中央政法委书记，2021 年主持全国政法队伍教育整顿，二十大退休，由陈文清接任。
  positions:
    - { title: 画眉坳钨矿矿长, sys: other, place: 江西, from: 1985, to: 1992, cite: b17-hxw-2017-11-03-guo-zhengfa }
    - { title: 中国有色金属工业总公司副总经理, sys: other, from: 1997, to: 1998, cite: b17-hxw-2017-11-03-guo-zhengfa }
    - { title: 中国铝业公司总经理, sys: other, from: 2001, to: 2004, cite: b17-hxw-2017-11-03-guo-zhengfa }
    - { title: 广西壮族自治区党委副书记、政府副主席, sys: party, place: 广西, from: 2004, to: 2007, cite: b17-hxw-2017-11-03-guo-zhengfa }
    - { title: 广西壮族自治区党委书记, sys: party, place: 广西, from: 2007-11, to: 2012-12, cite: b17-people-2012-12-30-guo-mps }
    - { title: 公安部部长, sys: gov, from: 2012-12, to: 2017-11, cite: b17-people-2012-12-30-guo-mps }
