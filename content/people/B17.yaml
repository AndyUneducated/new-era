    - { title: 中央政治局委员、书记处书记, sys: party, from: 2017-10, to: 2022-10, cite: c02-xinhua-2017-10-25-19-1-plenum }
    - { title: 中央政法委书记, sys: party, from: 2017-10, to: 2022-10, cite: b17-hxw-2017-11-03-guo-zhengfa }
  life:
    - h: 知青与钨矿
      from: 1954
      to: 1993
      text: >-
        1954 年 10 月生于江西兴国，1973 年在兴国县五里亭公社当知青，1974 年底入党。1977–1979 年在江西冶金学院读选矿专业，毕业后进冶金部画眉坳钨矿，
        从机选车间技术员、工段长做到矿长；1990 年起兼贵溪银矿建设指挥部总指挥、党委书记，1992 年任贵溪银矿矿长。
      cites: [b17-hxw-2017-11-03-guo-zhengfa, b17-people-2012-12-30-guo-mps]
    - h: 有色金属与中铝
      from: 1993
      to: 2004
      text: >-
        1993 年任中国有色金属工业总公司南昌公司经理，其间读完中南工业大学管理工程硕士，1995–1996 年又在中央党校一年制中青年干部培训班学习；1997 年升总公司副总经理，1999 年任国家有色金属工业局副局长。
        2000 年任国有重点大型企业监事会主席兼中国铝业公司筹备组组长，2001–2004 年任中铝总经理、党组书记兼中铝股份董事长、总裁，2004 年 4 月由肖亚庆接任。
      cites: [b17-hxw-2017-11-03-guo-zhengfa, k04-wiki-xiao-yaqing]
    - h: 广西
      from: 2004
      to: 2012-12
      text: >-
        2004 年转入地方，任广西自治区党委副书记、政府副主席，其间在北京科技大学读完管理学博士；2007 年 11 月升任广西党委书记，2008 年 1 月兼自治区人大常委会主任。他是十六届、十七届中央候补委员，2012 年十八大才成为中央委员。
        南华早报说，他 2010 年接受党刊采访时把经营企业和治理自治区相提并论，认为两者都要追求利益最大化，只是服务对象不同。
      cites: [b17-people-2012-12-30-guo-mps, b17-hxw-2017-11-03-guo-zhengfa, b17-scmp-2012-12-29-guo-divides]
    - h: 公安部长
      from: 2012-12
      to: 2013-03
      text: >-
        2012 年 12 月 19 日中央决定由彭清华接任广西党委书记，28 日全国人大常委会免去孟建柱兼任的公安部部长职务，任命郭声琨接任。南华早报当时说，他曾自称是有企业背景的政治人物，分析人士对他缺乏安全系统经验、能否靠企业背景弥补看法不一。
        2013 年 3 月他兼任国务委员，并任中央政法委副书记、武警部队第一政委。
      cites: [k04-wiki-peng-qinghua, b17-people-2012-12-30-guo-mps, b17-scmp-2012-12-29-guo-divides, c02-chinanews-2013-03-16-state-council, b17-hxw-2017-11-03-guo-zhengfa]
    - h: 新疆与昆明
      from: 2013-06
      to: 2015
      text: >-
        部长任内他多次随中央政法委书记孟建柱处置暴恐事件：2013 年 6 月 30 日两人到新疆和田、阿克苏看望民警和武警；2014 年 3 月 1 日昆明火车站暴力恐怖事件后，正在外地调研的他于 2 日凌晨 5 时赶到昆明指导处置。
        2014 年 1 月起，刘金国以公安部党委副书记身份成为他的副手。
      cites: [b11-12371-2013-06-30-meng-xinjiang, b11-yndaily-2014-03-02-meng-kunming, c02-wiki-liu-jinguo]
    - h: 中央政法委书记
      from: 2017-10
      to: 2020
      text: >-
        2017 年 10 月十九届一中全会当选政治局委员、书记处书记，10 月 31 日以中央政法委书记身份主持中央政法委全体会议，公安部部长一职随后交给赵克志。
        2018 年 9 月 17–20 日他到喀什、和田等地的维稳指挥部和法院、监狱考察，美国之音报道，他要求加强服刑人员教育改造工作，又到清真寺要求宗教人士自觉去极端化，
        并称新疆社会稳定的良好局面来之不易，要倍加珍惜、持续巩固。
      cites: [c02-xinhua-2017-10-25-19-1-plenum, b17-hxw-2017-11-03-guo-zhengfa, k03-wiki-jia-chunwang, b17-voa-2018-09-21-guo-xinjiang]
    - h: 政法队伍教育整顿
      from: 2021-02
      to: 2021-04
      text: >-
        2021 年 2 月 27 日，他以全国政法队伍教育整顿领导小组组长身份作动员部署，要求以刀刃向内的决心勇气抓好查纠整改，坚决清除害群之马、整治顽瘴痼疾，打造一支党和人民信得过、靠得住、能放心的政法铁军；
        赵克志、周强、陈文清等任副组长。他说政法队伍的主流是好的，但还存在一些突出问题，要依纪依法适用自查从宽、被查从严政策。4 月 6 日第一批教育整顿推进会上，他又要求稳妥有序推进干警违纪违法问题查处。
      cites: [b17-court-2021-02-guo-rectification, b17-spp-2021-04-06-guo-rectification]
    - h: 退休
      from: 2022-10
      to: 2026-08
      text: >-
        2022 年 10 月二十大，他在自由亚洲电台列出的九名不再连任的政治局委员之列；一中全会五天后，陈文清接替他任中央政法委书记，维基百科称陈是罗干之后 15 年来首位非公安部长出身的政法委书记。
        2026 年 2 月他在春节前中央看望的老同志名单上，8 月 17 日以中央政法委前书记身份出席纪念江泽民诞辰 100 周年大会，在主席台就座。
      cites: [b09-rfa-2022-10-22-20th-cc, c02-wiki-chen-wenqing, b17-xinhua-2026-02-14-old-comrades, b17-zaobao-2026-08-17-jiang-centenary]
  assess:
    - voice: zh
      quote: true
      text: Analysts say it remains to be seen whether that background is enough to make up for his lack of experience in the security system.
      zh: 分析人士说，他的企业背景能否弥补他在安全系统经验上的欠缺，还有待观察。
      cite: b17-scmp-2012-12-29-guo-divides
    - voice: zh
      quote: true
      text: 在国际社会越来越关注中国新疆维吾尔族人权遭践踏之际， 主管中国各级司法机构的中国政法委书记郭声琨在视察新疆后强调说，要“加强服刑人员教育改造工作”。
      cite: b17-voa-2018-09-21-guo-xinjiang
  ids: { wikidata: Q4276774 }
  cites: [wd-Q4276774, b17-hxw-2017-11-03-guo-zhengfa, b17-people-2012-12-30-guo-mps, c02-gov-2017-10-25-19th-cvs, c02-chinanews-2013-03-16-state-council, b17-scmp-2012-12-29-guo-divides, b17-voa-2018-09-21-guo-xinjiang, b17-court-2021-02-guo-rectification]

