    - { title: 国家监察委员会主任, sys: gov, from: 2018-03, to: 2023-03, cite: e08-bbc-2018-03-20-supervision-law }
    - { title: 中国残联名誉主席, sys: other, from: 2023-09, cite: b17-xinhua-2023-09-20-cdpf }
  life:
    - h: 插队、学药与进藏
      from: 1953
      to: 1992
      text: >-
        1953 年 10 月生于上海，1970 年 5 月到安徽省太和县宋集公社插队，1973 年入党，同年进上海中医学院药学系读药学专业。1976 年毕业后进藏，在那曲地区医药公司从股长做到副经理，
        1984 年任那曲地区医院党委书记，1986 年升任那曲地区行署副专员。据博谈网（传闻）的文章，他本是上海人，青年时到西藏支边。
      cites: [c02-gov-2017-10-25-19th-cvs, f08-botanwang-2014-10-new-shanghai]
    - h: 西藏自治区
      from: 1992
      to: 2001
      text: >-
        1992 年任昌都地委副书记、行署副专员，1995 年任西藏自治区财政厅厅长，1998 年升任自治区政府副主席，其间在中央党校研究生院读法学理论在职研究生。
        2017 年十九大记者会上谈人权问题时，他说自己曾经长期在西藏工作，又说在中国人民心目中林肯是英雄，因为他解放了黑奴，反问美国朋友为何想不通中国在西藏解放农奴，
        并说人权问题从来是特定的、有前提有条件的。
      cites: [c02-gov-2017-10-25-19th-cvs, b17-12371-2017-10-19-yang-presser]
    - h: 上海
      from: 2001
      to: 2014-01
      text: >-
        2001 年回上海任副市长，2006 年任市委常委、统战部部长。BBC 中文说，2007 年习近平调任上海市委书记时，杨晓渡已是市委常委、统战部长，是习近平的班子成员；
        据博谈网（传闻），2007 年 5 月上海市委九届一次全会产生的十三人常委班子里有他；该文把习近平的上海旧部分为本土派和外来派，说杨晓渡比较特殊，本是上海人，在西藏升到副主席后才回沪。
        2012 年他改任上海市纪委书记。
      cites: [c02-gov-2017-10-25-19th-cvs, f04-bbc-2018-03-18-yang-xiaodu, f08-botanwang-2014-10-new-shanghai]
    - h: 中纪委副书记
      from: 2014-01
      to: 2017-10
      text: >-
        2014 年 1 月十八届中纪委增选他为常委、副书记。据博谈网（传闻），他由上海市纪委书记晋升中纪委副书记兼直属机关党委书记，是十八大后习近平沪浙闽旧部纷纷获委重任的一例。
        2016 年底他兼任监察部部长，2017 年 1 月又兼国家预防腐败局局长。他后来说自己访问过新加坡和新西兰，途经香港时与廉署负责人讨论过，大家都说反腐败最关键的一条是领导人的决心。
      cites: [c02-gov-2017-10-25-19th-cvs, f08-botanwang-2014-10-new-shanghai, b17-12371-2017-10-19-yang-presser]
    - h: 十九大记者会
      from: 2017-10
      to: 2017-10
      text: >-
        2017 年 10 月 19 日在十九大新闻中心记者会上，他说十八大以来立案查处的省军级以上党员干部及其他中管干部已有 440 人。回答朝日新闻记者时他说，十九大后中纪委打击腐败高官的重点，
        仍是十八大以来不收敛不收手、问题线索集中、现在重要岗位且可能还要提拔的领导干部，三种情况同时具备、政治腐败和经济腐败相交织的是重中之重。
        被问到孙政才、苏荣、王珉、周本顺为何带病升迁时，他承认管党治党曾有一段宽松软的时期，让这些两面人得逞于一时；他又说三不之中不敢已基本做到，不能正在快速推进，不想还要相当长的过程。
      cites: [b17-12371-2017-10-19-yang-presser]
    - h: 首任国家监委主任
      from: 2017-10
      to: 2018-03
      text: >-
        十九届一中全会上他当选政治局委员、书记处书记。2018 年 3 月 18 日全国人大选举他为首任国家监察委员会主任，20 日表决通过监察法；23 日国家监委揭牌，由他主持、赵乐际讲话。
        BBC 中文指出，监察法以留置取代饱受外界批评的双规，留置最长不超过半年，但期间不允许律师介入；浙江省监委主任刘建超的解释是，监委不是司法机关，不受刑诉法约束。
      cites: [c02-xinhua-2017-10-25-19-1-plenum, e08-bbc-2018-03-20-supervision-law, e08-xinhua-2018-03-23-ncs]
    - h: 退休
      from: 2022-10
      to: 2026-08
      text: >-
        2022 年 10 月二十大，他在自由亚洲电台列出的九名不再连任的政治局委员之列；2023 年 3 月刘金国以 2943 票赞成、三票反对、一票弃权当选，接替他任国家监委主任。同年 9 月 20 日中国残联第八次全国代表大会宣布他为第八届名誉主席。
        2026 年 2 月他在春节看望老同志名单上，8 月 17 日以中央纪委前副书记身份出席纪念江泽民诞辰 100 周年大会，与李源潮、孙春兰、刘鹤、陈全国、郭声琨等退休政治局前委员同在主席台就座。
      cites: [b09-rfa-2022-10-22-20th-cc, b17-zaobao-2023-03-12-ncs-heads, b17-xinhua-2023-09-20-cdpf, b17-xinhua-2026-02-14-old-comrades, b17-zaobao-2026-08-17-jiang-centenary]
  assess:
    - voice: zh
      quote: true
      text: 2007年，习近平调任上海市委书记，彼时杨晓渡已任上海市委常委、统战部部长，是习近平的“班子”成员。
      cite: f04-bbc-2018-03-18-yang-xiaodu
    - voice: scholar
      quote: true
      text: 监察法草案中对留置笔墨较重，说明已经意识到了留置可能造成人身伤害，怕人员滥用权力。
      cite: e08-bbc-2018-03-20-supervision-law
    - voice: zh
      quote: true
      text: 留置过程中最引起外界关注的是，期间不允许律师介入。
      cite: e08-bbc-2018-03-20-supervision-law
