  born: 1953-10
  birthplace: 上海
  education:
    - { school: 上海中医学院药学系药学专业, from: 1973, to: 1976 }
    - { school: 中央党校研究生院在职研究生班法学理论专业, from: 1998, to: 2001 }
  joinedParty: 1973-09
