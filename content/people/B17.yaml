  life:
    - h: 当兵与机械系统
      from: 1953
      to: 1995
      text: >-
        1953 年 5 月生于河南禹县，1970 年 12 月参军，在解放军八一九二部队当了五年兵，1973 年入党，退伍后在禹县城关公社东关大队当了一年干部。1976–1980 年在东北重型机械学院读锻压工艺及设备专业，
        毕业后进三机部一一六厂当技术员，1982 年转入机械部第十设计研究院，1985 年起任院党委书记。1991 年任监察部驻机电部监察局副局长兼机电部纠风办主任，
        1992 年任中国包装和食品机械总公司副总经理，次年升总经理兼党委书记。
      cites: [c02-cyol-2012-11-16-18th-cvs]
    - h: 云南与交通部
      from: 1995
      to: 2005-12
      text: >-
        1995 年出任云南省政府党组成员、省长助理，1997 年回交通部任党组成员，1998 年升副部长，其间在哈尔滨工业大学读完管理学硕士，2000 年秋在中央党校省部级干部进修班学习。
        2002 年任交通部部长、党组书记，同年十六大当选中央委员，此后连任三届。后来他对记者说，当交通部部长时最担心的是车祸。
      cites: [c02-cyol-2012-11-16-18th-cvs, b17-chinanews-2006-03-07-zhang-hunan]
    - h: 湖南
      from: 2005-12
      to: 2010-04
      text: >-
        2005 年 12 月接替杨正午任湖南省委书记，次年兼省人大常委会主任。上任三个多月时他对第一财经日报说，现在当湖南省委书记最担心人祸，因为更关心百姓关心的安全、社会和谐等问题；
        又说不喜欢新官上任烧三把火，在中央和地方之间轮换岗位，能了解百姓的想法和苦衷；
        他还笑说，原来一吃辣椒就说不出话，现在却很上瘾。2010 年 4 月他调离湖南，由周强接任。
      cites: [p02-wiki-hunan-sec, c02-cyol-2012-11-16-18th-cvs, b17-chinanews-2006-03-07-zhang-hunan, p02-wiki-zhou-qiang]
    - h: 接掌新疆
      from: 2010-04
      to: 2012
      text: >-
        2009 年 7 月乌鲁木齐骚乱造成近 200 人丧生，BBC 中文说新疆党委书记王乐泉此后一直受到下台压力。2010 年 4 月 24 日中央宣布由张春贤接任新疆党委书记，兼新疆生产建设兵团第一政委，习近平出席宣布大会并讲话。
        法广说他当年由周永康举荐出任，但习近平曾陪同他到新疆履新。BBC 中文说他上任后互联网很快解封，不少网民称赞他是开明派。
      cites: [v01-bbc-2010-04-24-wang-lequan, e02-xinhua-2010-04-24-xinjiang-secretary, c02-cyol-2012-11-16-18th-cvs, f04-rfi-2016-03-09-xinjiang, b17-bbc-2016-08-29-xinjiang-change]
    - h: 柔性治疆
      from: 2010
      to: 2014
      text: >-
        联合早报说，与前任过于依靠强力打压不同，他推行被外界称为柔性治疆的策略，在打击暴恐的同时更注重发展经济、保证就业，通过解决贫困问题消除恐怖主义土壤。
        他说要让冰冷的民心暖过来，唯有大力发展民生；2014 年两会上又说反恐要标本兼治、多管齐下，但根本还在争取民心，七五事件后民族隔阂大大加深，现在已大大缓解，并欢迎记者去新疆旅游。
        中新社的特写称他曾被香港媒体称为内地最开放官员。
      cites: [b17-zaobao-2016-10-17-zhang-not-negated, b17-people-2014-03-07-zhang-sixteen-minutes, b17-people-2014-03-06-zhang-terror]
    - h: 暴恐高峰
      from: 2014-03
      to: 2016-03
      text: >-
        2014 年 3 月昆明火车站暴恐案后的两会开放日上，境外记者问是否严打导致暴恐上升，他反问不打就不发生了吗，并称新疆的暴恐九成是翻墙，受网络视频煽动；
        他又说这不是民族问题，也不是宗教问题，也不是哪个地区的问题。2016 年元旦他说过去一年深入推进去极端化，宗教极端氛围明显淡化，打击和教育疏导两手都要硬。
        同年 3 月两会上被问是否支持习近平领导时，他只说了一句再说吧。
      cites: [b17-people-2014-03-07-zhang-sixteen-minutes, b17-bbc-2016-01-01-zhang-religion, f04-rfi-2016-03-09-xinjiang]
    - h: 离疆与退休
      from: 2016-05
      to: 2023-03
      text: >-
        2016 年 5 月多名与他关系良好的新疆官员因腐败被双开；8 月 29 日中央宣布他不再兼任新疆党委书记、另有任用，由陈全国接任。BBC 中文说，分析人士认为他是江泽民派人物，免职是习近平十九大前的扫除行动。
        10 月他以中央党建工作领导小组副组长、中央新疆工作协调小组副组长身份亮相，联合早报引述的分析认为他已被边缘化，被免去新疆一把手也显示高层对柔性治疆不太满意。2018–2023 年任全国人大常委会副委员长。
      cites: [b17-bbc-2016-08-29-xinjiang-change, e03-xinhua-2016-08-29-chen-quanguo, b17-zaobao-2016-10-17-zhang-not-negated, c02-xinhua-2018-03-17-npc-leaders, b06-gov-2023-03-10-state-leaders]
  assess:
    - voice: scholar
      quote: true
      text: 之前的张春贤因为不够强硬而受到批评，尽管我认为原因应该是党内派系的不和所致
      cite: b09-rfi-2016-12-13-chen-tibet
    - voice: zh
