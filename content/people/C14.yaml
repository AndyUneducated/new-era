  tier: 2
  headline: 中国共产党、解放军和中华人民共和国的主要缔造者，1945–1976 年任中共中央主席
  ids: { wikidata: Q5816 }
  bio: >-
    中共一大代表，井冈山时期领导红军和根据地建设，1945 年起任中共中央主席、中央军委主席直到 1976 年去世，1954–1959 年任国家主席。
    1945 年 7 月黄炎培访问延安时与他谈如何跳出兴亡周期律，官方叙述称他给出了“第一个答案”，即“让人民来监督政府”。
    1981 年的历史决议说他在“文化大革命”中犯了严重错误，但“他的功绩是第一位的，错误是第二位的”；2023 年习近平在诞辰 130 周年座谈会上重申这一评价。
  positions:
