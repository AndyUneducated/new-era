    - { title: 全国政协主席, sys: other, from: 1949-09-21, to: 1954-09-27, cite: wd-Q5816 }
    - { title: 中华人民共和国主席, sys: gov, from: 1954-09-27, to: 1959-04-27, cite: wd-Q5816 }
  assess:
    - voice: doc
      text: 毛泽东同志是伟大的马克思主义者，是伟大的无产阶级革命家、战略家和理论家。他虽然在“文化大革命”中犯了严重错误，但是就他的一生来看，他对中国革命的功绩远远大于他的过失。他的功绩是第一位的，错误是第二位的。
      cite: i07-12371-1981-06-27-history-resolution
      quote: true
