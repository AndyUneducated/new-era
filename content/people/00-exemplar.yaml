  bio: >-
    共青团出身的经济官员，胡锦涛时期被视为接班人选之一，2007 年与习近平同时进入政治局常委会，2012 年后排名第二，任国务院总理十年。
    任内提出简政放权，“克强指数”“克强经济学”的说法在外界流行；外媒普遍认为他在习近平集权后被边缘化。2022 年二十大上未满“七上八下”的年龄线即退出中央委员会，2023 年 3 月卸任，同年 10 月猝逝于上海。
