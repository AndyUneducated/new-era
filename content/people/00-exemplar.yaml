  life:
    - h: 早年与北大
      from: 1955
      to: 1982
      text: >-
        生于合肥，籍贯定远。1974 年到凤阳县大庙公社插队，1976 年入党并任大队党支部书记。1978 年恢复高考后入北京大学法律系，曾任校学生会负责人。
      cites: [xinhua-2023-11-02-li-keqiang-life]
    - h: 共青团
      from: 1982
      to: 1998
      text: >-
        毕业后留校任北大团委书记，随后进入团中央，1993 年任团中央书记处第一书记。BBC 指出，他在团中央是胡锦涛的下属，“十年后，李成为共青团中央书记处的第一书记，进一步夯实其团派背景”。
      cites: [xinhua-2023-11-02-li-keqiang-life, bbc-2023-10-27-li-keqiang]
    - h: 河南与辽宁
      from: 1998
      to: 2007
      text: >-
        1998 年调任河南，历任代省长、省长、省委书记；2004 年底调任辽宁省委书记，推动“五点一线”沿海经济带与棚户区改造。官方生平称他在河南“提出实现中原崛起的奋斗目标”。
      cites: [xinhua-2023-11-02-li-keqiang-life]
    - h: 常委与副总理
      from: 2007
      to: 2013
      text: >-
        2007 年十七届一中全会进入常委会，排名在习近平之后；2008 年任常务副总理，分管发改、财政、医改等，兼任国务院医改领导小组组长。
      cites: [xinhua-2023-11-02-li-keqiang-life]
    - h: 总理十年
      from: 2013
      to: 2023
      text: >-
        2013、2018 年两度出任总理。任初外界有“克强指数”“克强经济学”之说；BBC 写道，到 2016 年《人民日报》文章“已经放弃了‘李克强经济学’”。
        2020 年 5 月 28 日记者会上他说中国“有6亿人每个月的收入也就1000元”，引起广泛讨论；中国政府网刊出的实录把这句话改写为“有6亿中低收入及以下人群”，国家统计局随后出面说明口径。
      cites: [bbc-2023-10-27-li-keqiang, natcm-2020-06-01-li-keqiang-presser, gov-2020-05-29-li-keqiang-presser, people-2020-06-15-nbs-600m]
    - h: 退出与猝逝
      from: 2022
      to: 2023
      text: >-
        2022 年二十大，年龄尚未到“七上八下”的他未进入新一届中央委员会，与汪洋一同退出常委会。2023 年 3 月卸任总理，10 月 27 日在上海逝世，享年 68 岁。
      cites: [bbc-2023-10-27-li-keqiang, xinhua-2023-11-02-li-keqiang-life]
