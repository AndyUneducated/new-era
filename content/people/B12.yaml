  life:
    - h: 当兵与入党
      from: 1970
      to: 1980
      text: >-
        1955 年 3 月生于河北滦县，1970 年 12 月参加工作。官方简历记他 1973 年 9 月入党，北京大学分校法律专业毕业，法学硕士。中纪委专题片《永远吹冲锋号》中，第十一监督检查室副主任李永红则说他“1970年当兵以后，第二年就入党”，入党时老班长嫌他年龄太小、建议缓一缓，这件事他记了一辈子。
        李永红说，傅政华把入党做官看成“人生的入场券、垫脚石、敲门砖”，人生信条就是当大官、掌重权。
      cites: [b12-guancha-2020-04-21-fu-resume, b12-chinanews-2023-01-07-bugle-ep1]
    - h: 北京刑警
      from: 1980
      to: 2010
      text: >-
        他从北京市公安局普通侦查员做起，历任刑侦处大要案队队长、刑侦处副处长，BBC 记载他参与侦破 1996 年运钞车抢劫案、1997 年白宝山案、门头沟袭警案、黄光裕案等大案要案；此后调任公安部刑侦局副局长，再回北京任市公安局副局长。
        法院认定他的受贿始于 2005 年，即副局长任内。《永远吹冲锋号》称，2008 年他结识时任公安部办公厅副主任的孙力军，此后孙力军来北京市局开会作指示，他每次亲自下楼迎接，甚至把上报材料先交孙修改审定。
      cites: [b12-bbc-2021-10-03-fu-zhenghua, c03-xinhua-2022-09-22-fu-zhenghua-verdict, b12-chinanews-2023-01-07-bugle-ep1]
    - h: 北京公安局长
      from: 2010-02
      to: 2015
      text: >-
        2010 年 2 月升任北京市公安局局长，上任 74 天后，朝阳警方突查天上人间等四家豪华会所并责令停业半年，他由此成为舆论焦点。上任伊始他宣布“三个凡是”铁规，称收钱捞人、打听案情者一律开除。后来他兼任北京市委常委。
        同年 9 月，《财经》杂志披露安元鼎保安公司专业截访。媒体人罗昌平在他落马后回忆：“周永康批示，傅政华派特警队来财经办公室，一定要把我带走。”法院后来认定，2014 至 2015 年他任北京市公安局局长期间，对弟弟付卫华涉嫌严重犯罪的线索隐瞒不报。
      cites: [b12-bbc-2021-10-03-fu-zhenghua, c03-xinhua-2022-09-22-fu-zhenghua-verdict]
    - h: 公安部副部长
      from: 2013
      to: 2018-03
      text: >-
        习近平主政后不久，他升任公安部副部长。BBC 引《南华早报》称，习近平为办理周永康案设立特别小组，以傅政华为首，直接向习汇报、绕过中纪委；他也是中共历史上同时兼任北京市委常委、北京公安局一把手和公安部副部长的第一人。美国之音记载，他 2014 年主导全国扫黄，2015 至 2018 年任中央防范和处理邪教领导小组副组长，2015 年负责针对人权律师和活动人士的“709 大抓捕”。
        他何时成为正部长级，说法不一：BBC 2021 年称是 2015 年 3 月升任党委副书记时；美国之音则说他 2013 年任副部长时即为正部级，2016 年升任常务副部长。
      cites: [b12-bbc-2021-10-03-fu-zhenghua, b12-voa-2021-10-02-fu-zhenghua]
    - h: 司法部长与政治骗子
      from: 2018-03
      to: 2020-04
      text: >-
        2018 年 3 月机构改革，司法部与国务院法制办合并，他出任新司法部部长、党组副书记，任内提出加强党对律师工作的全面领导。《永远吹冲锋号》称他醉心旁门左道、迷信政治骗子：2018 年，北京市公安局退休干部石晓春吹嘘能帮他搭天线谋升迁；中专学历的李全自称领导身边的高级智囊，从 2003 年左右起骗了他近 20 年，他反过来替李全推动土地开发、协调诉讼、安排亲属进银行。
        2020 年 4 月，孙力军落马 10 天后，他被免去部长职务，转任全国政协社会和法制委员会副主任；BBC 指出他当时刚满 65 岁，已到退休年龄。
      cites: [b12-bbc-2021-10-03-fu-zhenghua, b12-chinanews-2023-01-07-bugle-ep1]
    - h: 落马与判决
      from: 2021-09
      to: 2022-09
      text: >-
        自由亚洲电台称，他 2021 年 9 月中下旬在重庆被带走；10 月 2 日中纪委宣布审查调查。2022 年 3 月他被开除党籍和公职，通报称他“政治野心极度膨胀，政治品行极为卑劣”，“长期违规领用和携带枪支”，“长期搞迷信活动，对抗组织审查”。
        7 月 28 日长春中院开庭，9 月 22 日以受贿 1.17 亿余元和徇私枉法罪判处死缓，期满后终身监禁。专题片称其受贿超过 80% 发生在十八大之后，他还在北京市中心长期违规占用一套 700 多平方米的四合院。
      cites: [b12-rfa-2021-10-04-fu-zhenghua, c03-ccdi-2021-10-02-fu-zhenghua-probe, c03-ccdi-2022-03-31-fu-zhenghua-expel, b12-xinhua-2022-07-28-fu-trial, c03-xinhua-2022-09-22-fu-zhenghua-verdict, b12-chinanews-2023-01-07-bugle-ep1]
  assess:
    - voice: doc
      quote: true
      text: 傅政华完全背弃理想信念，从未真正忠诚于党和人民，彻底丧失党性原则，毫无“四个意识”，背离“两个维护”，政治野心极度膨胀，政治品行极为卑劣，投机钻营，利令智昏，为达到个人政治目的不择手段
      cite: c03-ccdi-2022-03-31-fu-zhenghua-expel
    - voice: official
      quote: true
      text: 他与孙力军结党营私、拉帮结派，使党对公安政法工作的政治领导、组织领导被悬空，其本质上是破坏党的集中统一领导，破坏党中央的权威
      cite: b12-chinanews-2023-01-07-bugle-ep1
    - voice: witness
      quote: true
      text: "He cracked down on civilians with huge force, although he was just an enforcer [of other people's orders]"
      zh: 他以极大的力度镇压民众，尽管他只是（别人命令的）执行者。（周姓受访者，自由亚洲电台引述）
      cite: b12-rfa-2021-10-04-fu-zhenghua
    - voice: scholar
      quote: true
      text: 中国的贪腐是体制性的、全局性的、普遍性的，抓谁、判谁是一种政治斗争的需要，也是清除政治对手的需要
      cite: f03-bbc-2022-09-27-fu-sun
  family:
    - name: 付卫华
      rel: 弟
      text: >-
        判决认定，2014 至 2015 年傅政华任北京市公安局局长期间，对弟弟付卫华涉嫌严重犯罪的线索隐瞒不报、不依法处置，致其长期未被追诉，这构成他的徇私枉法罪。专题片称傅政华的多名亲属借助他的权力牟利，傅政华在片中说，是自己用权越轨“带坏了家人，败坏了家风”。
      cites: [c03-xinhua-2022-09-22-fu-zhenghua-verdict, b12-chinanews-2023-01-07-bugle-ep1]
  cites: [wd-Q15733195, c03-ccdi-2021-10-02-fu-zhenghua-probe, c03-ccdi-2022-03-31-fu-zhenghua-expel, c03-xinhua-2022-09-22-fu-zhenghua-verdict, b12-guancha-2020-04-21-fu-resume, b12-bbc-2021-10-03-fu-zhenghua, b12-voa-2021-10-02-fu-zhenghua, b12-chinanews-2023-01-07-bugle-ep1]

- id: su-rong
  name: 苏荣
  pinyin: Sū Róng
  gender: m
  ethnicity: 汉族
  born: 1948-10-29
  birthplace: 吉林洮南
  education:
    - { school: 吉林大学经济管理学院国际经济系世界经济专业（在职研究生）, degree: 经济学硕士, from: 1994, to: 1997 }
  joinedParty: 1970-01
  joinedWork: 1974-01
  roles: [tiger, prov]
  status: detained
  statusNote: 2017 年 1 月一审被判无期徒刑，当庭表示不上诉，在押服刑。
  fall:
    - { date: 2014-06-14, text: 中纪委宣布其涉嫌严重违纪违法，接受组织调查, cite: c03-ccdi-2014-06-14-su-rong-probe }
    - { date: 2014-06-25, text: 全国政协常委会表决免去其全国政协副主席职务、撤销其全国政协委员资格, cite: b12-bbc-2014-06-25-su-rong }
    - { date: 2015-02-16, text: 被开除党籍、开除公职，涉嫌犯罪问题移送司法机关, cite: c03-ccdi-2015-02-16-su-rong-expel }
    - { date: 2016-12-29, text: 济南市中级人民法院一审公开开庭审理，当庭认罪悔罪, cite: b12-xinhua-2016-12-29-su-rong-trial }
    - { date: 2017-01-23, text: 济南中院以受贿、滥用职权、巨额财产来源不明罪判处无期徒刑, cite: c03-people-2017-01-23-su-rong-verdict }
  tier: 1
  headline: 全国政协副主席（2013–2014），曾任青海、甘肃、江西省委书记，2017 年被判无期徒刑
  ids: { wikidata: Q1059126 }
  factions:
    - f: zhou-clique
      cite: b12-bbc-2015-02-16-su-rong
      quote: 苏荣被认为与前中共政治局常委，中共中央政法委前书记周永康关系密切。
  bio: >-
    吉林洮南人，从公社会计做起，在吉林历任白城地委书记、四平市委书记、延边州委书记和省委副书记，2001 年起先后主政青海、甘肃、江西，2013 年 3 月升任全国政协副主席。
    2014 年 6 月他成为十八大后首个落马的副国级官员，起因之一是江西官员家属向中央巡视组实名举报其妻于丽芳。中纪委称他“大肆卖官鬻爵”，“支持、纵容亲属利用其特殊身份擅权干政”；专题片称他家十多位亲属涉案。2017 年 1 月被判无期徒刑。BBC 等媒体称他与周永康关系密切。
  positions:
    - { title: 吉林省白城地委书记, sys: party, place: 吉林, from: 1987, to: 1989, cite: b12-xinhua-2013-03-11-su-rong-resume }
    - { title: 吉林省四平市委书记, sys: party, place: 吉林, from: 1989, to: 1992, cite: b12-xinhua-2013-03-11-su-rong-resume }
    - { title: 吉林省委常委、秘书长, sys: party, place: 吉林, from: 1992, to: 1995, cite: b12-xinhua-2013-03-11-su-rong-resume }
    - { title: 吉林省委常委、延边自治州委书记, sys: party, place: 吉林, from: 1995, to: 1998, cite: b12-xinhua-2013-03-11-su-rong-resume }
    - { title: 吉林省委副书记, sys: party, place: 吉林, from: 1996, to: 2001, cite: b12-xinhua-2013-03-11-su-rong-resume }
    - { title: 青海省委书记、省人大常委会主任, sys: party, place: 青海, from: 2001, to: 2003, cite: b12-xinhua-2013-03-11-su-rong-resume }
    - { title: 甘肃省委书记、省人大常委会主任, sys: party, place: 甘肃, from: 2003, to: 2006, cite: b12-xinhua-2013-03-11-su-rong-resume }
    - { title: 中央党校副校长（正部长级）, sys: party, from: 2006, to: 2007, cite: b12-xinhua-2013-03-11-su-rong-resume }
    - { title: 江西省委书记、省人大常委会主任, sys: party, place: 江西, from: 2007, to: 2013, cite: b12-xinhua-2013-03-11-su-rong-resume }
    - { title: 全国政协副主席, sys: gov, from: 2013-03, to: 2014-06, cite: b12-bbc-2014-06-25-su-rong }
  life:
    - h: 吉林起家
      from: 1968
      to: 2001
      text: >-
        1948 年 10 月生，1968 年起在洮安县那金公社新力大队当会计、党支部副书记，1970 年 1 月入党，此后从公社书记、洮安县委副书记做到扶余县委书记、白城地委书记兼行署专员。1989 年任四平市委书记，1992 年进吉林省委常委任秘书长，1995 年兼任延边州委书记，1996 年升任省委副书记。
        其间他在职就读吉林大学世界经济专业，1997 年获经济学硕士。他是中共十四届、十五届中央候补委员，十六届、十七届中央委员。
      cites: [b12-xinhua-2013-03-11-su-rong-resume]
    - h: 青海与甘肃
      from: 2001
      to: 2007
      text: >-
        2001 年调任青海省委书记，次年兼省人大常委会主任；2003 年转任甘肃省委书记，2006 年任中央党校副校长（正部长级）。检方指控的受贿从 2002 年青海任内开始。
        专题片《永远在路上》则称，中纪委调查发现他在青海和甘肃期间“虽然也发现了一些问题，但都是小问题”。儿子苏铁志在片中说，父亲在青海、甘肃时不把下属介绍给家人，到江西后才把自己圈子里的朋友介绍给他认识。
      cites: [b12-xinhua-2013-03-11-su-rong-resume, b12-xinhua-2016-12-29-su-rong-trial, b12-people-2016-10-21-su-rong-documentary]
    - h: 江西“最后一站”
      from: 2007
      to: 2013
      text: >-
        2007 年任江西省委书记，次年兼省人大常委会主任。官方 2015 年的警示文章记载，他初到江西就在干部大会上说：“我到江西是最后一站了，希望离任时老百姓能说，苏荣这个人还行，还是做了些实事，我就满足了。”文章称，其亲属把江西视为最后捞一把的机会，所收贿赂大部分发生在 2011 年换届前后，已超龄的他仍连任省委书记。
        他对持异议的干部打击报复，口头禅是叫纪委查你。2009 年他违规拍板南昌钢铁公司改制，致 57.97% 国有股权被一家民企集团低价收购，后被认定为滥用职权罪。
      cites: [b12-xinhua-2013-03-11-su-rong-resume, b12-xinhua-2015-05-29-su-rong-warning, b12-xinhua-2016-12-29-su-rong-trial]
    - h: 苏家生意
      from: 2007
      to: 2014
      text: >-
        警示文章称苏荣家族“夫妻联手、父子上阵、兄弟串通、七大姑八大姨共同敛财”，查实 13 名家庭成员涉案。妻子于丽芳直接给省市领导打招呼提拔干部，插手土地出让、工程建设和招投标；儿子多次插手干部任免和土地、工程项目；围绕苏家还出现了被称为地下组织部长的掮客。
        景德镇瓷器成了送礼的土特产，专案组从苏荣及亲友处扣押瓷板画 200 块、瓷瓶等瓷器 319 件，苏荣在忏悔录里承认“自己简直成了瓷器经销商”。于丽芳在深圳手术疗养时，许多厅级干部坐飞机前去探望并送上红包。
      cites: [b12-xinhua-2015-05-29-su-rong-warning, b12-people-2016-10-21-su-rong-documentary]
    - h: 举报与巡视
      from: 2011
      to: 2014-06
      text: >-
        《财经》报道，2011 年新余市人大常委会主任周建华在系统内部实名举报于丽芳和新余市委主要领导，称高专土地出让腐败致国有资产损失 10 亿元；半年后周建华本人被双规，后以受贿罪一审被判死缓。2013 年 5 至 8 月中央第八巡视组进驻江西，周建华前妻姚敏建向巡视组实名举报苏妻。巡视组副组长宁延令说，苏荣在省人大主任选举中丢了近 50 票，在全国人大代表选举中丢了近 70 票。
        2014 年 6 月 14 日中纪委宣布调查苏荣，《财经》称于丽芳此前已被带走；6 月 25 日全国政协常委会免去他的副主席职务。
      cites: [b12-caijing-2014-07-02-yu-lifang, b12-bbc-2014-06-25-su-rong, b12-people-2016-10-21-su-rong-documentary, c03-ccdi-2014-06-14-su-rong-probe]
    - h: 双开与审判
      from: 2015-02
      to: 2017-01
      text: >-
        2015 年 2 月他被开除党籍和公职，通报称他“对江西省出现的严重腐败问题负有主要领导责任”。2016 年 10 月，他在专题片《永远在路上》中首次露面，自称是全家腐败窝案的掌门人，用四句话概括自己的贪腐之路，从收受瓷瓶、瓷碗、字画一直说到“使自己跌入了经济犯罪的万丈深渊”。
        2016 年 12 月济南中院开庭，2017 年 1 月 23 日判决认定他受贿 1.16 亿余元、滥用职权，另有 8027 万余元财产不能说明来源，决定执行无期徒刑。他当庭表示不上诉。
      cites: [c03-ccdi-2015-02-16-su-rong-expel, b12-people-2016-10-21-su-rong-documentary, b12-xinhua-2016-12-29-su-rong-trial, c03-people-2017-01-23-su-rong-verdict]
    - h: 江西的连锁落马
      from: 2013
      to: 2016
      text: >-
        警示文章称，2013 年以来中纪委查处的陈安众、姚木根、赵智勇等江西省级干部，腐败行为多发生在苏荣主政期间，且都给苏荣送过钱物；苏荣在忏悔录中写道，副厅级以上干部给他送钱物的达 40 多人。
        外界对他的靠山另有说法：BBC 称他被认为与周永康关系密切；自由亚洲电台引前国务院办公厅秘书俞梅荪说，他靠打击法轮功上台，与周永康势力盘根错节；前《山西晚报》记者李建军则认为他的落马与周案牵涉不大，而与华润前董事长宋林有关。
      cites: [b12-xinhua-2015-05-29-su-rong-warning, b12-bbc-2015-02-16-su-rong, b12-rfa-2014-06-15-su-rong]
  assess:
    - voice: doc
      quote: true
      text: 苏荣身为党的高级领导干部，无视党的政治规矩，严重违反组织纪律，大肆卖官鬻爵，带坏了干部队伍，败坏了社会风气
      cite: c03-ccdi-2015-02-16-su-rong-expel
    - voice: official
      quote: true
      text: 不少行贿人讥笑他没有一点省委书记的尊严，只是批发“官帽”的商人
      cite: b12-xinhua-2015-05-29-su-rong-warning
    - voice: zh
      quote: true
      text: 苏荣在2013年3月担任全国政协副主席之前，还曾担任过中共青海省委书记、甘肃省委书记及江西省委书记，曾被视为是中国政坛上的一位明星人物
      cite: b12-bbc-2014-06-25-su-rong
    - voice: witness
      quote: true
      text: 苏荣靠打击法轮功上台，跟周永康势力都有盘根错节的关系
      cite: b12-rfa-2014-06-15-su-rong
  family:
    - name: 于丽芳
      rel: 妻
      text: >-
        在江西被称为于姐、于大姐。警示文章称她直接给省市领导打招呼提拔干部，常以要不要老苏帮忙暗示官员送钱送物，并频繁插手土地出让和工程项目。《财经》2014 年报道她先于苏荣被中纪委带走。苏荣在专题片中说，自己出了问题，“老婆变得贪婪无度，收敛钱财不择手段”。
      cites: [b12-xinhua-2015-05-29-su-rong-warning, b12-caijing-2014-07-02-yu-lifang, b12-people-2016-10-21-su-rong-documentary]
    - name: 苏铁志
      rel: 子
      text: >-
        警示文章称苏荣之子多次插手江西干部任免和土地、工程项目，大肆收取好处费。苏荣在专题片中自述“儿子利用我的职权影响受贿数额巨大”。苏铁志在片中说，父亲到江西后才把自己圈子里的朋友介绍给他认识。
      cites: [b12-xinhua-2015-05-29-su-rong-warning, b12-people-2016-10-21-su-rong-documentary]
  cites: [wd-Q1059126, c03-ccdi-2014-06-14-su-rong-probe, c03-ccdi-2015-02-16-su-rong-expel, c03-people-2017-01-23-su-rong-verdict, b12-xinhua-2013-03-11-su-rong-resume, b12-xinhua-2015-05-29-su-rong-warning, b12-people-2016-10-21-su-rong-documentary, b12-bbc-2015-02-16-su-rong]

- id: lu-wei
  name: 鲁炜
  pinyin: Lǔ Wěi
  gender: m
  ethnicity: 汉族
  born: 1960-01
  birthplace: 安徽巢湖
  education:
    - { school: 广西广播电视大学语文专业, from: 1982-09, to: 1985-08 }
    - { school: 广西大学研究生班, from: 1997-09, to: 2001-06 }
    - { school: 中央党校研究生班, from: 2006-09, to: 2009-01 }
    - { school: 中国人民大学, degree: 硕士, from: 2008-11, to: 2011-07 }
  joinedWork: 1978-10
  roles: [tiger, minister]
  status: detained
  statusNote: 2019 年 3 月被判有期徒刑 14 年，当庭表示不上诉，在押服刑。
  fall:
    - { date: 2017-11-21, text: 中纪委宣布其涉嫌严重违纪，接受组织审查, cite: c03-ccdi-2017-11-21-lu-wei-probe }
    - { date: 2018-02-13, text: 被开除党籍、开除公职，涉嫌犯罪问题移送有关国家机关, cite: c03-xinhua-2018-02-13-lu-wei-expel }
    - { date: 2018-10-19, text: 宁波市中级人民法院一审公开开庭审理，当庭认罪悔罪, cite: b12-xinhua-2018-10-19-lu-wei-trial }
    - { date: 2019-03-26, text: 宁波中院以受贿罪判处有期徒刑 14 年，并处罚金 300 万元, cite: c03-xinhua-2019-03-26-lu-wei-verdict }
  tier: 1
  headline: 国家网信办主任（2013–2016）、中央网信办主任、中宣部副部长，2019 年以受贿罪被判 14 年
  ids: { wikidata: Q15733214 }
  bio: >-
    安徽巢湖人，知青、工人出身，在广西从地方报记者做到新华社广西分社社长，2004 年起任新华社副社长，2011 年任北京市委宣传部部长。2013 年执掌国家网信办，次年兼任新设的中央网信办主任，整治网络大 V、高举网络主权、创办乌镇世界互联网大会，被外媒称为中国互联网的守门人和网络沙皇。
    2016 年调离网信办，2017 年 11 月成为十九大后首个落马的正部级官员，次年被开除党籍和公职，通报称他“阳奉阴违、欺骗中央”，是典型的两面人；2019 年以受贿 3200 万余元被判有期徒刑 14 年。
  positions:
    - { title: 新华社桂林记者站站长、桂林支社社长, sys: other, place: 广西, from: 1991-04, to: 1994-06, cite: c03-ccdi-2017-11-21-lu-wei-probe }
    - { title: 新华社广西分社社长, sys: other, place: 广西, from: 1997-11, to: 2001-10, cite: c03-ccdi-2017-11-21-lu-wei-probe }
    - { title: 新华社党组成员、秘书长, sys: other, from: 2001-11, to: 2004-05, cite: c03-ccdi-2017-11-21-lu-wei-probe }
    - { title: 新华社副社长, sys: other, from: 2004-05, to: 2011-03, cite: c03-ccdi-2017-11-21-lu-wei-probe }
    - { title: 北京市委常委、宣传部部长，北京市副市长, sys: party, place: 北京, from: 2011-03, to: 2013-04, cite: c03-ccdi-2017-11-21-lu-wei-probe }
    - { title: 国家互联网信息办公室主任, sys: gov, from: 2013-04, to: 2016-06, cite: c03-ccdi-2017-11-21-lu-wei-probe }
    - { title: 中央网络安全和信息化领导小组办公室主任, sys: party, from: 2014-05, to: 2016-06, cite: c03-ccdi-2017-11-21-lu-wei-probe }
    - { title: 中共中央宣传部副部长, sys: party, from: 2014-05, to: 2017-11, cite: c03-ccdi-2017-11-21-lu-wei-probe }
  life:
    - h: 知青、工人与记者
      from: 1960
      to: 1994
      text: >-
        1960 年 1 月生于安徽巢湖庙岗乡鲁集大队，中学毕业后下乡，1978 年回乡当代课和民办教师。BBC 记载，1980 年他通过顶班进入广西桂林风动工具厂，从机械工人做到宣传干事，后调桂林市中级法院当书记员，再任《广西法制报》记者，其间在广西广播电视大学读语文专业。
        1991 年任新华社桂林记者站站长，一年发稿 500 多篇，1992 年被评为新华社十大杰出人才之一。桂林空难后他带队最先赶到现场，发稿辟谣劫机打斗的说法，受到中央领导赞扬。
      cites: [c03-ccdi-2017-11-21-lu-wei-probe, b12-bbc-2018-07-30-lu-wei]
    - h: 新华社
      from: 1994
      to: 2013
      text: >-
        1994 年任新华社广西分社副社长，1997 年任社长，BBC 称他是当时新华社最年轻的正司局级干部。2001 年调回总社，历任副秘书长、秘书长，2004 年任副社长，兼管中国经济信息社、金融信息交易所等经营业务，其间在人民大学读硕士。2011 年 3 月任北京市委常委、宣传部部长、副市长。
        法院后来认定，他的受贿从 2002 年任新华社秘书长时开始，一直延续到 2017 年。BBC 总结说，他用 21 年从广西到北京，用 13 年从新华社记者做到副社长。
      cites: [c03-ccdi-2017-11-21-lu-wei-probe, b12-bbc-2018-07-30-lu-wei, c03-xinhua-2019-03-26-lu-wei-verdict]
    - h: 执掌网信办
      from: 2013-04
      to: 2014-05
      text: >-
        2013 年 4 月任国家互联网信息办公室主任。8 月 10 日，他与潘石屹、薛蛮子等网络名人座谈，希望他们“承担更多社会责任”，会上达成坚守七条底线的共识。BBC 记载，十几天后薛蛮子因嫖娼被北京警方拘留，成为第一个倒在鲁炜手下的大 V，方舟子随后也被全网封杀。同年两高发布“诽谤信息转贴500次以上可判刑”的司法解释，外界视他为始作俑者。
        2014 年 5 月他兼任新成立的中央网信办主任和中宣部副部长。
      cites: [c03-ccdi-2017-11-21-lu-wei-probe, b12-xinhua-2013-08-12-lu-wei-bigv, b12-bbc-2017-11-22-lu-wei, b12-bbc-2018-07-30-lu-wei]
    - h: 自由与秩序
      from: 2013-09
      to: 2014-10
      text: >-
        他常把管控讲成秩序。2013 年 9 月在伦敦中英互联网圆桌会议上，他说“自由和秩序紧密相连、不可分割”，“离开了秩序的自由是不存在的”。2014 年夏季达沃斯论坛上，他把技术比作汽车，“再好的汽车都要有刹车”，并警告外国企业不能“占着中国的市场，挣了中国的钱，又来伤害中国”。
        同年 10 月在国新办发布会上，他说中国没有关过境外任何一家网站，并用做客作比喻：“谁到我家做客，我是有选择的。”《纽约时报》记载，他还说过没有内容审查不等于没有管理。
      cites: [b12-wenming-2013-09-lu-wei-freedom-order, b12-xinhua-2014-09-10-lu-wei-davos, b12-xinhua-2014-10-30-lu-wei-guest, b12-nytcn-2017-11-22-lu-wei]
    - h: 乌镇与硅谷
      from: 2014-11
      to: 2016
      text: >-
        2014 年首届世界互联网大会在浙江乌镇召开，BBC 称这是他的重要政治遗产。据 BBC 记载，大会最后一晚，一份呼吁尊重各国网络主权的声明草案在深夜被塞进与会者的门缝；次日闭门会议上西方代表抗议，声明无法通过，鲁炜说自己还有会，拂袖而去。
        同年他访美，在 Facebook 总部，扎克伯格向他展示了《习近平谈治国理政》。《纽约时报》称他是中国互联网“直言不讳、盛气凌人的守门人”，斥责美国互联网公司，访美时却仍受到库克、贝佐斯等人欢迎；2015 年习近平访美，他也在随行官员之列。
      cites: [b12-bbc-2017-11-22-lu-wei, b12-bbc-2018-07-30-lu-wei, b12-nytcn-2017-11-22-lu-wei]
    - h: 失势与落马
      from: 2016-06
      to: 2017-11
      text: >-
        2016 年 6 月他调离网信办，只保留中宣部副部长职务，可能被查的传言随即流传。2017 年 6 月，中央第八巡视组反馈称网信办政治生态不良、存在小圈子问题，并已把一些领导干部的问题线索转交中纪委；10 月 24 日他在延安调研，这是最后一次公开露面。
        11 月 21 日中纪委宣布对他组织审查，他成为十九大后落马的首位正部级官员。中央网信办次日开会，表示要“坚决全面彻底肃清鲁炜对网信办和网信系统的恶劣影响”。
      cites: [b12-bbc-2017-11-22-lu-wei, b12-bbc-2018-07-30-lu-wei, c03-ccdi-2017-11-21-lu-wei-probe, b12-cac-2017-11-22-lu-wei-meeting]
    - h: 双开与判决
      from: 2018-02
      to: 2019-03
      text: >-
        2018 年 2 月他被开除党籍和公职，通报罗列他干扰中央巡视、“品行恶劣、匿名诬告他人”、“以权谋色、毫无廉耻”，称他是典型的两面人。4 月，黑龙江省委常委会专门研究以鲁炜为典型在全省开展党内警示教育。
        10 月宁波中院开庭，检方指控他 2002 年 7 月至 2017 年下半年受贿 3200 万余元；2019 年 3 月 26 日以受贿罪判处有期徒刑 14 年、罚金 300 万元，他当庭表示不上诉。
      cites: [c03-xinhua-2018-02-13-lu-wei-expel, b12-bbc-2018-07-30-lu-wei, b12-xinhua-2018-10-19-lu-wei-trial, c03-xinhua-2019-03-26-lu-wei-verdict]
  assess:
    - voice: doc
      quote: true
      text: 鲁炜身为党的高级干部，理想信念缺失，毫无党性原则，对党中央极端不忠诚，“四个意识”个个皆无，“六大纪律”项项违反，是典型的“两面人”
      cite: c03-xinhua-2018-02-13-lu-wei-expel
    - voice: official
      quote: true
      text: 严重污染了网信办的政治生态，严重败坏了中央网信办和网信干部队伍的形象，严重危害了党的网信事业健康发展，是一个典型的“两面人”
      cite: b12-cac-2017-11-22-lu-wei-meeting
    - voice: west
      quote: true
      text: 在中国，政府官员普遍沉闷、默守陈规，但鲁炜与众不同，经常做出令人吃惊的举动
      cite: b12-nytcn-2017-11-22-lu-wei
    - voice: witness
      quote: true
      text: 他很聪明，知道网络发达了他的权力也大了，他给了网络媒体一些空间，而他的继任者还是在沿用管制传统媒体那一套方法
      cite: b12-bbc-2017-11-22-lu-wei
  cites: [wd-Q15733214, c03-ccdi-2017-11-21-lu-wei-probe, c03-xinhua-2018-02-13-lu-wei-expel, c03-xinhua-2019-03-26-lu-wei-verdict, b12-bbc-2017-11-22-lu-wei, b12-bbc-2018-07-30-lu-wei, b12-nytcn-2017-11-22-lu-wei, b12-wenming-2013-09-lu-wei-freedom-order]

- id: lai-xiaomin
  name: 赖小民
  pinyin: Lài Xiǎomín
  gender: m
  born: 1962-07-21
  died: 2021-01-29
  birthplace: 江西瑞金
  education:
    - { school: 江西财经大学, to: 1983 }
  joinedWork: 1983-07
  roles: [tiger]
  status: dead
  statusNote: 2021 年 1 月 5 日被判死刑，同月 29 日在天津被执行死刑。
  fall:
    - { date: 2018-04-17, text: 中纪委宣布其涉嫌严重违纪违法，接受纪律审查和监察调查, cite: c03-ccdi-2018-04-17-lai-xiaomin-probe }
    - { date: 2018-10-15, text: 被开除党籍、开除公职，涉嫌犯罪问题移送检察机关审查起诉, cite: c03-ccdi-2018-10-15-lai-xiaomin-expel }
    - { date: 2020-08-11, text: 天津市第二中级人民法院一审公开开庭审理，当庭认罪悔罪, cite: b12-people-2020-08-11-lai-trial }
    - { date: 2021-01-05, text: 天津二中院以受贿、贪污、重婚罪判处死刑, cite: c03-court-2021-01-05-lai-xiaomin-verdict }
    - { date: 2021-01-29, text: 天津高院驳回上诉、最高人民法院核准后，被执行死刑, cite: c03-xinhua-2021-01-29-lai-xiaomin-executed }
  tier: 1
  headline: 中国华融资产管理公司董事长（2012–2018），受贿 17.88 亿元，2021 年被执行死刑
  ids: { wikidata: Q16907225 }
  bio: >-
    江西瑞金人，1983 年从江西财大毕业进入人民银行，后任北京银监局局长、银监会办公厅主任兼新闻发言人，2009 年转任中国华融资产管理公司总裁，2012 年起任董事长，把这家处置不良资产的坏账银行扩张成全牌照金融集团并在香港上市。
    2018 年 4 月落马，通报称其“盲目扩张、无序经营导致公司严重偏离主责主业”。2021 年 1 月他以受贿 17.88 亿余元等罪被判死刑，审判长称这是新中国成立以来受贿数额最大的职务犯罪案件，同月 29 日被执行死刑。华融随后公布 2020 年亏损逾千亿元。
  positions:
    - { title: 中国人民银行银行监管二司副司长, sys: gov, cite: c03-ccdi-2018-04-17-lai-xiaomin-probe }
    - { title: 北京银监局局长、党委书记, sys: gov, place: 北京, cite: c03-ccdi-2018-04-17-lai-xiaomin-probe }
    - { title: 中国银监会办公厅主任、首席新闻发言人, sys: gov, cite: c03-ccdi-2018-04-17-lai-xiaomin-probe }
    - { title: 中国华融资产管理公司党委副书记、总裁, sys: other, from: 2009, to: 2012-09, cite: b12-hkcd-2018-08-12-lai-cash }
    - { title: 中国华融资产管理股份有限公司党委书记、董事长, sys: other, from: 2012-09, to: 2018-04, cite: c03-ccdi-2018-04-17-lai-xiaomin-probe }
    - { title: 第十二届全国人大代表, sys: gov, cite: c03-ccdi-2018-04-17-lai-xiaomin-probe }
  life:
    - h: 人民银行与银监会
      from: 1983
      to: 2009
      text: >-
        1962 年 7 月生于江西瑞金，1983 年 7 月从江西财大毕业后进入中国人民银行，历任计划资金司中央资金处处长、信贷管理司副司长、银行监管二司副司长。此后转入银监会，任北京监管局筹备组组长、北京银监局局长，再任银监会办公厅主任、党委办公室主任和首席新闻发言人。
        法院认定，他的受贿从 2008 年任银监会办公厅主任时开始，此后持续十年。
      cites: [c03-ccdi-2018-04-17-lai-xiaomin-probe, b12-hkcd-2018-08-12-lai-cash, c03-court-2021-01-05-lai-xiaomin-verdict]
    - h: 掌舵华融
      from: 2009
      to: 2017
      text: >-
        2009 年调任中国华融资产管理公司党委副书记、总裁，2012 年 9 月华融改制为股份公司，他任党委书记、董事长。华融本是 20 世纪 90 年代末为接收国有银行不良贷款设立的坏账银行，他开设几十家子公司和分公司，使之成为拥有银行、证券、信托、期货等全牌照的金融集团，2015 年 10 月在香港上市，由他敲锣。《纽约时报》称华融与华信、海航等靠举债扩张的民企都做过生意。
        2017 年 3 月他在业绩会上笑称：“我来到公司8年瘦了20斤，公司养肥了，我却瘦了。”
      cites: [c03-ccdi-2018-04-17-lai-xiaomin-probe, b12-hkcd-2018-08-12-lai-cash, b12-sina-2020-01-13-national-supervision-ep2, b12-nytcn-2021-01-06-lai-xiaomin, b12-voa-2018-08-11-lai-cash]
    - h: 老赖一支笔
      from: 2012
      to: 2018
      text: >-
        中纪委专题片《国家监察》称，他急速扩张、追求短期业绩，下属只能去投房地产、股票等高风险项目；他直接指定与自己有利益输送的私企项目，审批程序倒置。华融国际原董事长汪平华说，干部的官帽、绩效和资金支持“实际上都是老赖一支笔说了算”。
        他在大会上公开宣讲不发一案、不倒一人的口号，从管理层到食堂大厨安插瑞金老乡。2015 年起银监会多次警示华融控制债务规模、回归主业，他却斥责监管人员不专业。
      cites: [b12-sina-2020-01-13-national-supervision-ep2]
    - h: 超市
      from: 2008
      to: 2018
      text: >-
        法院认定，2008 至 2018 年他受贿共 22 起，其中 3 起分别在 2 亿、4 亿、6 亿元以上，另有 1.04 亿余元尚未到手；他还伙同特定关系人侵吞、套取公款 2513 万余元。专案组在北京一处房子里发现多个保险柜，存放现金两个多亿；他要求行贿人付现金，收钱后亲自开车送去，路上多绕几圈防止跟踪，和知情人把这处房子叫作超市。
        他在片中说：“最后又不敢花又不敢用，还提心吊胆的。”
      cites: [c03-court-2021-01-05-lai-xiaomin-verdict, b12-sina-2020-01-13-national-supervision-ep2]
    - h: 落马
      from: 2018-04
      to: 2018-10
      text: >-
        2018 年 4 月 17 日中纪委宣布对他审查调查。8 月，华融年中工作会通报，办案人员在他几处房产里搜出折合人民币 2.7 亿元的本外币现金，美国之音转述财新报道称重约三吨，与专题片所说的两个多亿不尽一致；美国之音注意到，新浪等网站的部分相关报道随后被删。
        10 月他被开除党籍和公职，通报称他搞政治投机，“参加迷信活动，对抗组织审查”，“与多名女性搞权色交易”。
      cites: [c03-ccdi-2018-04-17-lai-xiaomin-probe, b12-hkcd-2018-08-12-lai-cash, b12-voa-2018-08-11-lai-cash, b12-sina-2020-01-13-national-supervision-ep2, c03-ccdi-2018-10-15-lai-xiaomin-expel]
    - h: 死刑
      from: 2020-08
      to: 2021-01
      text: >-
        2020 年 8 月天津二中院开庭，起诉书称他在婚姻存续期间与他人长期以夫妻名义同居并育有二子。2021 年 1 月 5 日一审以受贿、贪污、重婚罪判处死刑，法院认为他虽有检举下属的重大立功表现，但“不足以对其从宽处罚”；审判长解释，他检举的是与他为同一行贿人的同一项目分别受贿的下属，性质与一般立功不同。
        天津高院驳回上诉，最高法院核准后，他于 1 月 29 日上午被执行死刑。新华社称：“临刑前，赖小民与其近亲属进行了会见。”
      cites: [b12-people-2020-08-11-lai-trial, c03-court-2021-01-05-lai-xiaomin-verdict, b12-xinhua-2021-01-29-lai-judge-qa, c03-xinhua-2021-01-29-lai-xiaomin-executed]
    - h: 死刑之议与华融的窟窿
      from: 2021-01
      to: 2021-08
      text: >-
        BBC 指出，十八大后受贿数亿元的白恩培、魏鹏远、于铁义都只被判死缓及终身监禁，以经济犯罪判处死刑近年较为少见；人权观察称这是杀鸡儆猴。《纽约时报》引律师张培鸿说，判处他死刑“会得到很多中下层人士的支持”。
        2021 年 8 月，停牌四个多月的华融预告 2020 年亏损 1029.03 亿元，财新称这是对“赖小民时期狂飙突进留下的后果”全面减值，中信集团等五家机构同时签约入股。
      cites: [b12-bbc-2021-01-07-lai-xiaomin, b12-nytcn-2021-01-06-lai-xiaomin, b12-caixin-2021-08-19-huarong-loss]
  assess:
    - voice: official
      quote: true
      text: 赖小民受贿数额达17.88亿余元，是新中国成立以来受贿数额最大的职务犯罪案件
      cite: b12-xinhua-2021-01-29-lai-judge-qa
    - voice: doc
      quote: true
      text: 赖小民目无法纪，极其贪婪，大部分犯罪行为均发生在党的十八大之后，属于典型的不收敛、不收手、顶风作案
      cite: c03-court-2021-01-05-lai-xiaomin-verdict
    - voice: west
      quote: true
      text: 因受贿等金融犯罪对赖小民处以死刑，是骇人听闻和不可接受的，显然违背了中国对尊重国际人权标准的承诺
      cite: b12-bbc-2021-01-07-lai-xiaomin
    - voice: scholar
      quote: true
      text: 这个死刑判决可能是向公众发出信息，表明习近平政权仍把腐败视为一个严重问题，或是向中国商界精英发出信息，告诉他们需要循规蹈矩
      cite: b12-nytcn-2021-01-06-lai-xiaomin
    - voice: witness
      quote: true
      text: 他往上升的话肯定需要业绩，他不会考虑长期的风险会怎么样，只要你第一时间把规模给我做出来，把短期利润给我实现出来，至于这个项目三年、五年之后出现风险，他不管的
      cite: b12-sina-2020-01-13-national-supervision-ep2
  family:
    - name: 妻子与同居者（均未具名）
      rel: 妻；同居者
      text: >-
        判决认定，他在与妻子合法婚姻关系存续期间，还与他人长期以夫妻名义共同居住生活并育有子女，构成重婚罪，起诉书写作育有二子；贪污罪所涉 2513 万余元公款也是他伙同特定关系人侵吞、套取的。新华社称，临刑前他与近亲属进行了会见。
      cites: [c03-court-2021-01-05-lai-xiaomin-verdict, b12-people-2020-08-11-lai-trial, c03-xinhua-2021-01-29-lai-xiaomin-executed]
