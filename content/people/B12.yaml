  tier: 1
  headline: 公安部副部长（2018–2020），“孙力军政治团伙”头目，2022 年被判死缓并终身监禁
  ids: { wikidata: Q92378949 }
  factions:
    - f: sun-lijun-gang
      cite: b12-dw-2022-09-23-sun-lijun-verdict
      quote: 孙力军是所谓“孙力军政治团伙”之首，先前被官方称背弃“两个维护”，妄议党中央大政方针。
  bio: >-
    1969 年生于青岛，早年在上海卫生系统和市外办工作，2008 年前后进入公安部，以办公厅副主任身份辅佐部长孟建柱，此后历任国内安全保卫局局长、港澳台事务办公室主任，2018 年成为公安部最年轻的副部长。
    2020 年 4 月在武汉督导疫情期间落马，2021 年被开除党籍和公职，通报称他“政治野心极度膨胀”，“成伙作势控制要害部门”。官方把他与龚道安、邓恢林、王立科、刘新云和司法部原部长傅政华并称为孙力军政治团伙，定为十八大后严重违反政治纪律的典型。
    2022 年 9 月以受贿 6.46 亿余元等罪被判死缓并终身监禁。
  positions:
    - { title: 上海市卫生局外事处副处长, sys: gov, place: 上海, cite: c03-xinhua-2022-09-23-sun-lijun-verdict }
    - { title: 上海市人民政府外事办公室综合业务处处长, sys: gov, place: 上海, cite: c03-xinhua-2022-09-23-sun-lijun-verdict }
