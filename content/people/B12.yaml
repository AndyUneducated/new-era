  headline: 北京市公安局局长（2010–2013）、公安部副部长、司法部部长（2018–2020），2022 年被判死缓并终身监禁
  ids: { wikidata: Q15733195 }
  factions:
    - f: sun-lijun-gang
      cite: c03-ccdi-2022-03-31-fu-zhenghua-expel
      quote: 参加孙力军政治团伙，拉帮结派，结党营私
  bio: >-
    北京刑警出身，2010 年任北京市公安局局长，以查封天上人间等会所成名；2013 年起任公安部副部长，外媒称他主持周永康案调查，并主导 2014 年全国扫黄和 2015 年针对人权律师的“709”大抓捕；2018 年出任重组后的司法部部长。
    2020 年卸任部长，2021 年 10 月落马，次年 3 月被开除党籍和公职，通报称他“参加孙力军政治团伙，拉帮结派，结党营私”，长期结交多名政治骗子、违规领用和携带枪支。2022 年 9 月以受贿 1.17 亿余元和徇私枉法罪被判死缓并终身监禁，徇私枉法指他任北京市公安局局长时包庇涉嫌严重犯罪的弟弟付卫华。
