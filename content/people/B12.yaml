    - { title: 公安部党委委员、副部长, sys: gov, from: 2018-03, to: 2020-04, cite: b12-zaobao-2020-04-21-sun-lijun }
  life:
    - h: 青岛、澳洲与上海
      from: 1969
      to: 2008
      text: >-
        1969 年 1 月生于山东青岛，1988 年 9 月参加工作，1997 年 12 月入党，在职就读澳大利亚新南威尔士州州立大学公共卫生和城市管理专业，获公共卫生硕士学位。BBC 说，这种西方院校背景在中国安全官员中较为罕见。
        中纪委工作人员顾桧在专题片《零容忍》中说，他大学毕业后先跟几个温州商人倒卖钢材，后来父亲找关系把他安排进卫生部门。法院认定他的受贿始于 2001 年，当时他任上海市卫生局外事处副处长，此后任上海市外办综合业务处处长；《联合早报》称他调京前是上海市外办副主任。
      cites: [c03-ccdi-2020-04-19-sun-lijun-probe, b12-bbc-2020-04-20-sun-lijun, b12-xinhua-2022-01-15-zero-tolerance-ep1, c03-xinhua-2022-09-23-sun-lijun-verdict, b12-zaobao-2020-04-21-sun-lijun]
    - h: 当官与发财
      from: 2001
      to: 2020
      text: >-
        《零容忍》称，2001 年他与一名医药老板约定，由他介绍政府和医院关系、老板出资经营，利益三七分成。他在片中说：“我错误地认为，当官和发财是可以两不误的。”
        到公安部后，他继续为这家公司处理法律纠纷、逃避监管处罚。他承认公安部有一个案子涉及此人，他向专案组打了招呼，“没有对他进行依法处理，让他逃避了法律制裁”。法院判决也认定，他收受贿赂后“干预医药、金融等民生领域正常经济活动”。
      cites: [b12-xinhua-2022-01-15-zero-tolerance-ep1, c03-xinhua-2022-09-23-sun-lijun-verdict]
    - h: 进入公安部
      from: 2008
      to: 2018
      text: >-
        他何时调京，说法不一：《零容忍》称他 2008 年调到北京工作，王立科也说 2008 年下半年认识他时，他已是公安部办公厅副主任；《联合早报》则说他 2010 年才从上海市外办副主任调任公安部办公厅副主任。他以这一身份辅佐部长孟建柱，BBC 称他曾任孟建柱的秘书。
        此后他历任国内安全保卫局（一局）局长、二十六局（原反邪教局）局长、港澳台事务办公室主任，2016 年升任公安部党委委员、中央 610 办公室副主任。2017 年 12 月，他与香港保安局局长李家超在北京签署内地与香港刑事罪行相互通报机制文件。
      cites: [b12-xinhua-2022-01-15-zero-tolerance-ep1, b12-zaobao-2020-04-21-sun-lijun, b12-bbc-2020-04-20-sun-lijun]
    - h: 经营“小圈子”
      from: 2008
      to: 2018
      text: >-
        《零容忍》用大段篇幅讲他如何培植自己人。时任辽宁省公安厅副厅长的王立科从 2011 年起给他送银行卡、美元和公司股份，孙力军在片中说，王立科每年四五次来京，每次送 30 万美元，“放在一个小的海鲜盒里面”，累计折合 9000 多万元；王立科后来升任江苏副省长、省委政法委书记，“这一路我都提供了帮助”。
        对湖北咸宁公安局长龚道安，他反过来花钱收买人心，把龚运作进公安部技侦局，后者官至上海副市长兼公安局长；经龚推荐，宜昌公安局长邓恢林升至重庆副市长；2014 年济南公安局长刘新云调任公安部网安局局长。专题片称，龚、刘向他违规提供大量他无权知悉的舆情和办案材料。
      cites: [b12-xinhua-2022-01-15-zero-tolerance-ep1]
    - h: 副部长
      from: 2018-03
      to: 2020-04
      text: >-
        2018 年 3 月任公安部副部长，《联合早报》称他在部领导班子中位列第八，分管治安。《零容忍》说他自恃是公安部最年轻的党委委员、副部长，给自己定了“十五年规划”，争取五年上一个台阶。同年上半年，他应人请托指使他人连续买卖股票、影响股价，法院认定帮他人避免损失 1.45 亿余元。
        2020 年 2 月他作为中央指导组成员赴武汉，2 月 10 日在《新闻联播》中随习近平视频连线出镜；3 月 5 日在武汉为两名火线入党的年轻女民警当入党介绍人，这是他最后一次在媒体上公开亮相。
      cites: [b12-zaobao-2020-04-21-sun-lijun, b12-xinhua-2022-01-15-zero-tolerance-ep1, c03-xinhua-2022-09-23-sun-lijun-verdict, b12-bbc-2020-04-20-sun-lijun]
    - h: 落马与“双开”
      from: 2020-04
      to: 2021-09
      text: >-
        2020 年 4 月 19 日中纪委宣布对他审查调查。公安部党委连夜表态，要“肃清周永康、孟宏伟、孙力军等人流毒影响”，BBC 称这种并列很罕见。2021 年 9 月他被开除党籍和公职，通报除受贿外，还称他“妄议党中央大政方针”，“在抗击新冠肺炎疫情一线擅离职守，私藏私放大量涉密材料，长期搞迷信活动”，并“使用公安侦查手段对抗组织审查”。
        《卫报》援引《华尔街日报》称，他曾参与一项中方提议：帮助马来西亚前总理监视调查 1MDB 丑闻的记者。
      cites: [c03-ccdi-2020-04-19-sun-lijun-probe, b12-bbc-2020-04-20-sun-lijun, c03-ccdi-2021-09-30-sun-lijun-expel, b12-guardian-2021-10-01-sun-lijun]
    - h: 政治团伙案
      from: 2022-01
      to: 2022-09
      text: >-
        2022 年 1 月，中纪委专题片《零容忍》首集以他开篇，称“孙力军政治团伙案就是这方面的典型”，案件审理室副主任孙东升说这是“十九大以来我们查处的最严重的案件之一”。孙力军在片中说，公安本是公平正义的维护者，“没想到自己成了一个法治建设或者是公平正义的破坏者”。
        7 月 8 日长春中院开庭，9 月 23 日以受贿、操纵证券市场、非法持有枪支（2 支）罪判处死缓，期满减为无期徒刑后终身监禁。德国之声指出，判决没有提及审查通报中的任何政治罪状；同一周内，龚道安、邓恢林、刘新云、王立科和傅政华也相继被判。
      cites: [b12-xinhua-2022-01-15-zero-tolerance-ep1, b12-xinhua-2022-07-08-sun-lijun-trial, c03-xinhua-2022-09-23-sun-lijun-verdict, b12-dw-2022-09-23-sun-lijun-verdict]
  assess:
    - voice: doc
      quote: true
      text: 为实现个人政治目的，不择手段，操弄权术，在党内大搞团团伙伙、拉帮结派、培植个人势力，形成利益集团，成伙作势控制要害部门，严重破坏党的团结统一，严重危害政治安全
      cite: c03-ccdi-2021-09-30-sun-lijun-expel
    - voice: official
      quote: true
      text: 孙力军案件是一个典型的政治问题和经济问题交织的案件，特别是这些人顶风违纪、知法犯法，结党营私，搞团团伙伙，贪污贿赂数额巨大，影响非常恶劣
      cite: b12-xinhua-2022-01-15-zero-tolerance-ep1
    - voice: zh
      quote: true
      text: 公安部将孙力军与中共政治局原常委、公安部原部长周永康和孟宏伟并列，要一并肃清他们的“流毒影响”，说明孙力军的问题不小
      cite: b12-zaobao-2020-04-21-sun-lijun
    - voice: scholar
      quote: true
      text: 也许他们并非对习不忠，然而，这样一些掌握刀把子的人抱团会做出什么事情来，任何一个当政者都是会戒备的，何况对树敌众多的习
      cite: b12-dw-2022-09-23-sun-lijun-verdict
  family:
    - name: 父亲（未具名）
      rel: 父
      text: >-
        《零容忍》称，孙力军大学毕业后先经商，后由父亲找关系安排进卫生部门工作。专题片把这段经历与王立科的父亲托关系送儿子进警队、一路帮他提拔相提并论，说二人根子上都“从未真正树立理想信念”。
      cites: [b12-xinhua-2022-01-15-zero-tolerance-ep1]
  cites: [wd-Q92378949, c03-ccdi-2020-04-19-sun-lijun-probe, c03-ccdi-2021-09-30-sun-lijun-expel, c03-xinhua-2022-09-23-sun-lijun-verdict, b12-xinhua-2022-01-15-zero-tolerance-ep1, b12-zaobao-2020-04-21-sun-lijun, b12-dw-2022-09-23-sun-lijun-verdict]

