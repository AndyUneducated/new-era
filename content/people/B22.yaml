    - { title: 国务委员兼国家计划委员会主任, sys: gov, from: 1983-06, to: 1988-04, cite: wd-Q618323 }
    - { title: 中央组织部部长, sys: party, from: 1987-05, to: 1989-12, cite: f05-xinhua-2026-03-10-song-ping }
    - { title: 中央政治局委员, sys: party, from: 1987-11, to: 1989-06, cite: f05-xinhua-2026-03-10-song-ping }
    - { title: 中央政治局常委, sys: party, from: 1989-06, to: 1992-10, cite: f05-xinhua-2026-03-10-song-ping }
    - { title: 中央党的建设工作小组组长, sys: party, from: 1989-07, cite: f05-xinhua-2026-03-10-song-ping }
  life:
    - h: 清华学生与周恩来秘书
      from: 1917
      to: 1947
      text: >-
        原名宋延平，1917 年 4 月生于山东莒县一个农民家庭，1934–1937 年先后在北平大学农学院、清华大学读书，参加一二·九运动，1937 年 12 月入党。1938–1947 年在延安中央党校、马列学院和重庆《新华日报》等处任职，其间担任周恩来的政治秘书，并作为中共代表团秘书参加国共和谈。
      cites: [f05-xinhua-2026-03-10-song-ping, b22-cna-2026-03-04-song-ping]
    - h: 计划干部与西北局
      from: 1947
      to: 1972
      text: >-
        1947–1952 年在哈尔滨和东北总工会工作。1952 年起任国家计委委员、劳动工资计划局局长兼劳动部副部长，参与编制一五计划，1957 年任国家计委副主任。1960 年起任西北局计委主任、三线建设委员会副主任，其间下放担任陕西蒲城县委书记。文革中受到冲击，恢复工作后调研西北三线建设。
      cites: [f05-xinhua-2026-03-10-song-ping]
    - h: 甘肃十年与胡锦涛
      from: 1972
      to: 1981
      text: >-
        1972 年任甘肃省委书记，1977 年任第一书记、省革委会主任。官方生平说他落实包产到户，主持研究引大入秦工程，“注重发现和培养选拔优秀年轻干部”。联合早报引《南风窗》说，1979 年他到省建委主持座谈会，副处长胡锦涛出面汇报，“给宋平留下深刻印象”，次年胡出任省建委副主任。
        中央社说这被视为胡锦涛仕途的起点。联合早报还说，曾在甘肃工作的温家宝、吴仪后来也受到重用。
      cites: [f05-xinhua-2026-03-10-song-ping, f05-zaobao-2026-03-04-song-ping, b22-cna-2026-03-04-song-ping]
    - h: 国家计委主任
      from: 1981
      to: 1987
      text: >-
        1981 年 1 月回国家计委任副主任，1983 年 6 月任国务委员兼国家计委主任。他参与和主持编制“六五”“七五”计划和全国国土总体规划纲要，推动三线企业调整，在综合平衡的计划方法之外，鼓励用计量经济和数学模型做经济预测。
      cites: [f05-xinhua-2026-03-10-song-ping, wd-Q618323]
    - h: 中组部长与六四
      from: 1987
      to: 1989
      text: >-
        1987 年 5 月任中组部部长，11 月当选政治局委员，参加十三大人事安排小组，推行干部离退休制度和领导干部任期制。官方生平写道：“在1989年春夏之交的政治风波中，他坚决拥护党中央的重大决策部署，表现出坚强党性和组织纪律性。”
        1989 年 6 月十三届四中全会，赵紫阳、胡启立被免职，他与江泽民、李瑞环一起增补为政治局常委。
      cites: [f05-xinhua-2026-03-10-song-ping, b22-cna-2026-03-04-song-ping]
    - h: 政治局常委
      from: 1989
      to: 1992
      text: >-
        入常后他任中央党的建设工作小组组长，分工负责党的建设和组织工作，同年 12 月不再兼任中组部部长。官方生平说他“狠抓清查、清理工作”，在部分单位进行党员重新登记，深入进行反对资产阶级自由化的教育，并在山东莱西召开村级组织建设座谈会。
        1992 年 10 月十四大退出常委。中央社引述媒体报道，他卸任前向邓小平建议提拔胡锦涛，使胡在未当过政治局委员的情况下越级入常。
      cites: [f05-xinhua-2026-03-10-song-ping, b22-cna-2026-03-04-song-ping, b22-st-2026-03-04-song-ping-reuters]
    - h: 最长寿的常委
      from: 1992
      to: 2025
      text: >-
        退休后他关注党史研究、国企改革、“三农”和人口问题。官方说十八大以来他“坚决拥护和支持以习近平同志为核心的党中央领导，坚定支持党风廉政建设和反腐败斗争”，100 岁高龄时仍以普通党员身份参加党支部组织生活会。路透社称他是政治局常委中最长寿的人，2022 年 10 月他仍与温家宝、曾庆红等一起出席二十大开幕式。
      cites: [f05-xinhua-2026-03-10-song-ping, b22-st-2026-03-04-song-ping-reuters]
    - h: 信件传闻与逝世
      from: 2026-01
      to: 2026-03
      text: >-
        2026 年 1 月，据阿波罗新闻网（传闻），网上流传一封署名宋平致习近平的信，自称“一个108岁的老党员”，批评退休老干部受到全方位监控、“实际上等同于被软禁在家”；此信未获官方或家属证实。
        3 月 4 日 15 时 36 分他在北京逝世，新华社称他为“杰出的无产阶级革命家、政治家，党和国家的卓越领导人”。3 月 10 日遗体在八宝山火化，习近平、李强、赵乐际、王沪宁、蔡奇、丁薛祥、李希、韩正前往送别，胡锦涛送花圈。
      cites: [b22-aboluowang-2026-01-22-song-letter, b22-gov-2026-03-04-song-ping-death, b22-gov-2026-03-10-song-ping-farewell]
  assess:
    - voice: official
      quote: true
      text: 具有很强的政治敏锐性和政治鉴别力，在大是大非面前始终保持清醒头脑，经受住了各种风浪考验
      cite: f05-xinhua-2026-03-10-song-ping
    - voice: zh
      quote: true
      text: 在中共元老中，宋平的政治生涯相对平稳，得益于他受到周恩来、邓小平、陈云、江泽民、胡锦涛、习近平等历任中共领导人的信任和尊重
      cite: f05-zaobao-2026-03-04-song-ping
    - voice: west
      quote: true
      text: Song was credited with bringing Hu Jintao, China's leader before current President Xi Jinping, to the attention of Deng.
      zh: 人们认为是宋平把胡锦涛——习近平之前的中国领导人——推荐到邓小平面前。
      cite: b22-st-2026-03-04-song-ping-reuters
    - voice: zh
      quote: true
      text: 被視為胡錦濤晉身中共高層進而成為中共第四代領導人的仕途起點
      cite: b22-cna-2026-03-04-song-ping
  family:
    - name: 陈舜瑶
      rel: 妻子
      text: >-
        清华大学原党委副书记。1953 年初重返清华工作八年，历任副教务长、校长助理、党委副书记。2019 年 7 月 31 日在北京逝世，享年 102 岁。
      cites: [b22-chinanews-2019-08-03-chen-shunyao]
  cites: [wd-Q618323, f05-xinhua-2026-03-10-song-ping, f05-zaobao-2026-03-04-song-ping, b22-st-2026-03-04-song-ping-reuters, b22-aboluowang-2026-01-22-song-letter, b22-gov-2026-03-10-song-ping-farewell]

- id: li-jianguo
  name: 李建国
  pinyin: Lǐ Jiànguó
  gender: m
  ethnicity: 汉族
  born: 1946-04-18
  birthplace: 山东鄄城
  education:
    - { school: 山东大学中文系汉语言文学专业, from: 1964, to: 1969 }
  joinedParty: 1971-06
  joinedWork: 1969-09
  roles: [pb, cc, prov]
  status: retired
  statusNote: 2018 年 3 月卸任全国人大常委会副委员长和全国总工会主席后退休。
  tier: 1
  headline: 全国人大常委会副委员长（2008–2018）、政治局委员（2012–2017），曾任陕西、山东省委书记
  ids: { wikidata: Q211384 }
  bio: >-
    天津起家，1978 年进入天津市委办公厅，历任办公厅主任、市委秘书长，BBC 称他“原是中共前政治局常委李瑞环的秘书”，1992–1997 年任天津市委副书记。1997 年 8 月至 2007 年 3 月任陕西省委书记近十年，随后接替张高丽短暂主政山东。
    2008 年进京任全国人大常委会副委员长兼秘书长，2012 年十八大进入政治局，同年底被网民实名举报提拔亲属，官方未公布调查。2013–2018 年兼任全国总工会主席，2018 年 3 月卸任退休。2019 年有评论推测他会因陕西旧案被追究，至今未见官方证实。
  positions:
