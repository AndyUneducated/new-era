  life:
    - h: 山大中文系与宁河
      from: 1946
      to: 1982
      text: >-
        1946 年 4 月生于山东鄄城，1964–1969 年在山东大学中文系汉语言文学专业学习，毕业后留校待分配。1970 年到天津宁河县东棘坨公社姜庄大队劳动锻炼，1971 年 6 月入党，此后任宁河县文教局和县委宣传部干事；1976 年调天津市农委宣传处，1978 年进入天津市委办公厅当干事。
      cites: [b22-people-2013-03-18-li-jianguo-resume]
    - h: 李瑞环身边
      from: 1981
      to: 1997
      text: >-
        1981 年任市委办公厅办公室副主任，1983–1988 年任办公厅主任，1989 年任市委秘书长，1991 年进入市委常委并兼和平区委书记，1992–1997 年任市委副书记。BBC 和法广都说他原是李瑞环的秘书。
        据高新（传闻），他 1982 年起就在李瑞环身边工作，“等于是李瑞环的大管家”，此后仕途一帆风顺也得益于李瑞环的提拔。
      cites: [b22-people-2013-03-18-li-jianguo-resume, b22-bbc-2013-01-29-li-jianguo, b22-rfi-2012-12-17-li-jianguo-report, b22-rfa-2019-02-04-gaoxin-li-jianguo]
    - h: 主政陕西
      from: 1997
      to: 2007
      text: >-
        1997 年 8 月，51 岁的他升任陕西省委书记，1998 年起兼任省人大常委会主任，2003 年 1 月再次当选。2007 年中组部副部长李建华评价他在陕西“把握西部大开发的历史机遇”，“使陕西经济社会发展迈入快车道”。
        法广引述接近陕西政坛的人士说，他离任前违反常规紧急提拔安插了十几名厅级官员，令接任的赵乐际颇为不满，曾“告状”到北京。
      cites: [b22-people-2013-03-18-li-jianguo-resume, p02-sohu-2003-01-18-jia-zhibang-elected, b22-ifeng-2007-03-27-li-jianguo-shandong, b22-rfi-2012-12-17-li-jianguo-report]
    - h: 山东一年
      from: 2007
      to: 2008
      text: >-
        2007 年 3 月，中央决定他接替调任天津的张高丽任山东省委书记。中组部副部长李建华宣布决定时称他“政治上强，有较高的政策理论水平”，“为人正派，坚持原则，团结同志”，并说山东两个多月后就要召开第九次党代会。2008 年他兼任山东省人大常委会主任，3 月即调往北京。
      cites: [b22-ifeng-2007-03-27-li-jianguo-shandong, b22-people-2013-03-18-li-jianguo-resume]
    - h: 人大秘书长与政治局
      from: 2008
      to: 2013
      text: >-
        2008 年 3 月十一届全国人大一次会议上，他同时当选全国人大常委会副委员长和秘书长。2012 年 11 月十八届一中全会当选政治局委员。2013 年 1 月习近平作出厉行节约的批示后，他召集人大机关开会研究落实措施，BBC 认为新华网的这篇报道意在辟谣。
      cites: [e02-npc-2008-03-15-xi-vp, c02-xinhua-2012-11-15-18-1-plenum, b22-bbc-2013-01-29-li-jianguo]
    - h: 网络举报风波
      from: 2012-12
      to: 2013-01
      text: >-
        2012 年 12 月 16 日，在西安经商的河北人韩宠光在微博上称，济宁市委常委张辉是李建国的“亲外甥”，在李任山东省委书记期间 8 个月内从副处升到副厅，并通过中纪委网站实名举报；微博很快被删除。法广引当地消息人士说，张辉其实是他的外甥女婿。
        BBC 称有传闻说他因此受中纪委调查、一个多月没有公开露面，官方没有证实。据高新（传闻），还有人爆料他的侄女李茜也通过他被破格提拔。
      cites: [b22-rfi-2012-12-17-li-jianguo-report, b22-bbc-2013-01-29-li-jianguo, b22-rfa-2019-02-04-gaoxin-li-jianguo]
    - h: 全总主席与退休
      from: 2013
      to: 2019
      text: >-
        2013 年 3 月 1 日，全总十五届七次执委会选举他接替王兆国任全国总工会主席，同月连任十二届全国人大常委会副委员长。2013 年 10 月习仲勋百年座谈会上，他称习仲勋的一生“是革命的一生，光辉战斗的一生”。2017 年十九大退出政治局；2018 年 3 月 22 日，中共中央决定他“不再兼任中华全国总工会主席职务”，由王东明接任。
        2019 年，据高新在自由亚洲电台的评论（传闻），赵正永落马后他可能被“适时抛出”，这一推测未获官方证实。
      cites: [b22-xinhua-2013-03-01-li-jianguo-acftu, b22-people-2013-03-18-li-jianguo-resume, c05-gov-2013-10-15-xi-zhongxun-centenary, b22-xinhua-2018-03-22-wang-dongming-acftu, b22-rfa-2019-02-04-gaoxin-li-jianguo]
  assess:
    - voice: official
      quote: true
      text: 李建国同志政治上强，有较高的政策理论水平，注意从政治上、大局上思考和把握问题，贯彻中央大政方针坚决有力
      cite: b22-ifeng-2007-03-27-li-jianguo-shandong
    - voice: zh
      quote: true
      text: 他違反常規緊急提拔安插了十數名副廳、正廳一級的高級官員
      cite: b22-rfi-2012-12-17-li-jianguo-report
    - voice: zh
      quote: true
      text: 李建国原是中共前政治局常委李瑞环的秘书，曾任天津市委副书记
      cite: b22-bbc-2013-01-29-li-jianguo
  family:
    - name: 张辉
      rel: 亲属（举报称外甥，法广称外甥女婿）
      text: >-
        1980 年代出生，2012 年时任济宁市委常委、市中区委书记。2012 年 12 月韩宠光举报称，李建国任山东省委书记期间，张辉仅 8 个月完成从副处到副厅的擢升；法广引当地消息人士说，李建国是张辉妻子的姑父。官方未回应。
      cites: [b22-rfi-2012-12-17-li-jianguo-report]
    - name: 李茜
      rel: 侄女（传闻）
      text: >-
        据高新（传闻），有人爆料她通过李建国被破格提拔，32 岁出任昆明市副市长，2012 年升任云南省委宣传部副部长。
      cites: [b22-rfa-2019-02-04-gaoxin-li-jianguo]
  cites: [wd-Q211384, c02-cyol-2012-11-16-18th-cvs, c02-xinhua-2012-11-15-18-1-plenum, b22-people-2013-03-18-li-jianguo-resume, b22-bbc-2013-01-29-li-jianguo, b22-ifeng-2007-03-27-li-jianguo-shandong, b22-rfi-2012-12-17-li-jianguo-report]
