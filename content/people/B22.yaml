# B22: full biographies (tier 1), rewritten from the dossier cards in C09 (邓小平、胡耀邦)、F05 (陈云、宋平)、C02 (李建国).
- id: deng-xiaoping
  name: 邓小平
  pinyin: Dèng Xiǎopíng
  gender: m
  born: 1904-08-22
  died: 1997-02-19
  birthplace: 四川广安
  roles: [psc, cmc]
  status: dead
  statusNote: 1997 年 2 月 19 日因帕金森病晚期并发肺部感染在北京逝世，官方称享年九十三岁（虚岁）。
  tier: 1
  headline: 中共第二代领导核心，改革开放“总设计师”
  ids: { wikidata: Q16977 }
  bio: >-
    中共称他为“党的第二代中央领导集体的核心”和改革开放的“总设计师”。1978 年十一届三中全会后，他不任党政一把手，却是实际最高领导人，推动农村改革、经济特区和对外开放，提出“一国两制”；1987 年、1989 年先后让胡耀邦、赵紫阳下台，并主导六四镇压。他选定江泽民为第三代核心，又“隔代指定”胡锦涛，BBC 2001 年写道“胡锦涛则是邓小平生前预先安排的第四代领导班子的核心”。
    2000 年后的十年任期、隔代接班和“韬光养晦”都被看作他的遗产；中央社 2022 年认为，习近平不安排接班人，摧毁了这套制度。
  positions:
    - { title: 中共中央书记处总书记, sys: party, from: 1956-09, to: 1966-08, cite: wd-Q16977 }
    - { title: 中央政治局常委, sys: party, from: 1956-09-28, to: 1967-03, cite: wd-Q16977 }
    - { title: 中央政治局常委, sys: party, from: 1975-01, to: 1976-04, cite: wd-Q16977 }
    - { title: 中央政治局常委, sys: party, from: 1977-07-21, to: 1987-11-02, cite: wd-Q16977 }
    - { title: 全国政协主席, sys: gov, from: 1978-03-08, to: 1983-06-22, cite: wd-Q16977 }
    - { title: 中共中央军委主席, sys: army, from: 1981-06-28, to: 1989-11-09, cite: wd-Q16977 }
    - { title: 国家中央军委主席, sys: army, from: 1983-06-06, to: 1990-03-21, cite: wd-Q16977 }
  life:
    - h: 勤工俭学与“三落三起”
      from: 1904
      to: 1976
      text: >-
        1904 年生于四川广安县协兴乡牌坊村，16 岁赴法勤工俭学，在那里接受马克思主义、加入中共。抗战和内战时期与刘伯承共事 13 年，任一二九师政委、中原局第一书记，领导淮海战役和渡江战役。1956 年八届一中全会当选政治局常委、总书记，主持书记处十年。
        文革中他被剥夺一切职务，1973 年复出，1975 年任中央副主席、副总理、总参谋长，主持日常工作并大刀阔斧整顿，不久再次被撤职。习近平称他一生“三落三起”。
      cites: [b22-gov-2014-08-20-xi-deng-110, b22-reformdata-1997-02-19-deng-obit]
    - h: 历史转折
      from: 1977
      to: 1981
      text: >-
        1977 年恢复职务。他反对“两个凡是”，支持真理标准讨论，1978 年 12 月十一届三中全会停止使用“以阶级斗争为纲”，转向现代化建设，官方说“经过这次全会，邓小平同志成为第二代中央领导集体的核心”。
        1980 年 8 月，他在政治局扩大会议上批评权力过分集中和领导职务终身制，说“这些方面的制度好可以使坏人无法任意横行，制度不好可以使好人无法充分做好事，甚至会走向反面”。1981 年 6 月他任中央军委主席，此后不再担任党政一把手。
      cites: [b22-gov-2014-08-20-xi-deng-110, b22-reformdata-1997-02-19-deng-obit, b22-reformdata-1980-08-18-leadership-reform, wd-Q16977]
    - h: 改革开放与“一国两制”
      from: 1979
      to: 1986
      text: >-
        三中全会后，他支持农村搞家庭联产承包、废除人民公社，后来回忆“开始的时候只有三分之一的省干起来，第二年超过三分之二”。他支持在沿海兴办经济特区，提出“走自己的道路，建设有中国特色的社会主义”，制定“三步走”发展战略，并以“一国两制”构想促成中英、中葡关于香港、澳门的协议。
        1979 年他访问美国。默萨对 BBC 说，在美国人们常被这次访问的表面现象干扰，而正是他向撒切尔夫人明确表示香港绝对会回归中国。
      cites: [b22-reformdata-1992-01-18-southern-talks, b22-gov-2014-08-20-xi-deng-110, b22-reformdata-1997-02-19-deng-obit, b22-bbc-2024-08-22-deng-120]
    - h: 两任总书记下台与六四
      from: 1986
      to: 1989
      text: >-
        1986 年底学潮后，邓小平指责胡耀邦没能对意识形态松动和学生抗议采取有力行动，胡 1987 年 1 月辞职。1989 年胡耀邦去世引发民运，官方说“1989年春夏之交我国发生严重政治风波”，邓小平“领导党和人民旗帜鲜明反对动乱”。
        BBC 称李鹏“坚决支持手握实权的中共最高领导人邓小平武力镇压学生的决定”，镇压造成数百甚至上千人死亡。纽约时报说，他选定的接班人赵紫阳因同情示威者在镇压前夕被撤职；镇压后强硬派重新主导经济政策，邓小平只能随之。
      cites: [b14-nytcn-2015-11-22-hu-yaobang, c09-gov-2024-08-22-xi-deng-120, b01-bbc-2019-07-23-li-peng-obit, b22-nyt-1997-02-20-deng-obit]
    - h: 交班与南方谈话
      from: 1989
      to: 1992
      text: >-
        六四后，元老们以上海市委书记江泽民为妥协人选，邓小平宣布他为第三代领导集体的“核心”。1989 年 11 月十三届五中全会同意他辞去军委主席，此后不再担任正式职务；官方称他“早就主张废除干部领导职务终身制”。
        1992 年初，他视察深圳、珠海、上海等地，说“发展才是硬道理”，“基本路线要管一百年”。他还说，此前推荐的两个接班人“都是在反对资产阶级自由化的问题上栽跟头”，并称“我坚持退下来，就是不要在老年的时候犯错误”。同年十四大前，据中央社引述的报道，他接受宋平的建议，让胡锦涛越级进入政治局常委会。
      cites: [b22-nyt-1997-02-20-deng-obit, b22-reformdata-1997-02-19-deng-obit, b22-reformdata-1992-01-18-southern-talks, b22-cna-2026-03-04-song-ping]
    - h: 逝世
      from: 1997
      to: 1997
      text: >-
        1997 年 2 月 19 日 21 时 08 分，他因帕金森病晚期并发肺部感染在北京逝世，告全党书称享年九十三岁，纽约时报按周岁写作 92 岁。告全党书称他为“我国社会主义改革开放和现代化建设的总设计师”，并说香港即将回归。
        按他的遗愿，角膜捐献给医院，遗体供医学解剖，骨灰撒入大海。纽约时报讣闻说，本世纪几乎没有人在政治生命的长度上比得上他。
      cites: [b22-reformdata-1997-02-19-deng-obit, b22-gov-2014-08-20-xi-deng-110, b22-nyt-1997-02-20-deng-obit]
    - h: 110 周年与 120 周年
      from: 2014
      to: 2024
      text: >-
        2014 年 8 月 20 日，习近平在诞辰 110 周年座谈会上称他是“中国特色社会主义道路的开创者，邓小平理论的主要创立者”，既引他“改革开放胆子要大一些”，也强调“不能全盘照搬外国”。同月央视播出电视剧《历史转折中的邓小平》，卫报说它服务于现任领导人的方略；纽约时报引学者泰伟斯说，华国锋支持甚至领导的一些改革，后来被记在邓小平名下。
        2024 年 120 周年，习近平再次座谈纪念。美国之音引张弘远说，邓的改革是“放权让利”，习的是“集权兴利”。
      cites: [b22-gov-2014-08-20-xi-deng-110, b22-bbc-2014-08-15-deng-tv, b22-nytcn-2014-08-29-deng-drama, c09-gov-2024-08-22-xi-deng-120, b22-voa-2024-08-21-deng-120]
    - h: 隔代接班的遗产
      from: 2002
      to: 2024
      text: >-
        邓小平安排的隔代接班，成为 2000 年后两次权力交接的规则：美国之音称胡锦涛是“邓小平隔代指定的中共领导人”，BBC 2001 年则认为这一安排“可能恰好在无意之间埋下了江胡之争的伏笔”。中央社 2022 年说，胡锦涛 2012 年按旧规矩指定了胡春华，而习近平摧毁了这套制度。
        对邓的遗产，余茂春对 BBC 说习近平“实则是邓小平的逻辑后继人”；默萨则认为两人的主要区别是“邓小平乐于授权，而习近平似乎相反”。
      cites: [b07-voa-2014-07-03-xu-hu, c09-bbc-2001-hu-dragon-chair, c09-cna-2022-10-08-deng-succession, b22-bbc-2024-08-22-deng-120]
  assess:
    - voice: official
      quote: true
      text: 全党全军全国各族人民公认的享有崇高威望的卓越领导人，伟大的马克思主义者，伟大的无产阶级革命家、政治家、军事家、外交家
      cite: b22-gov-2014-08-20-xi-deng-110
    - voice: west
      quote: true
      text: Few if any figures in this century matched Mr. Deng for political longevity.
      zh: 本世纪几乎没有哪位人物在政治生命的长度上比得上邓小平。
      cite: b22-nyt-1997-02-20-deng-obit
    - voice: scholar
      quote: true
      text: 邓小平不懂经济。他自己都承认过很多次。
      cite: b22-nytcn-2014-08-29-deng-drama
    - voice: zh
      quote: true
      text: 摧毀了鄧小平苦心創造的「隔代指定接班」制度
      cite: c09-cna-2022-10-08-deng-succession
  family:
    - name: 卓琳
      rel: 妻子
      text: >-
        1916 年生于云南宣威，1938 年 4 月入党，1939 年 9 月与邓小平在延安结为伴侣。文革中受牵连，1969 年 10 月随邓到江西新建县拖拉机修造厂劳动，1978 年 1 月任中央军委办公厅顾问。2009 年 7 月 29 日在北京逝世，享年 93 岁。
      cites: [b22-xinhua-2009-07-29-zhuo-lin]
    - name: 邓朴方
      rel: 儿子
      text: >-
        下身瘫痪。随父亲复出，1984 年任中国残疾人福利基金会副理事长，1988 年创建中国残疾人联合会并连任主席 20 年，2008 年任全国政协副主席。
      cites: [k03-wiki-deng-pufang]
    - name: 邓楠
      rel: 女儿
      text: >-
        北大物理系毕业，1998 年任科技部副部长，后任中国科协常务副主席、全国政协常委。其女邓卓芮是安邦保险董事长吴小晖的第三任妻子；吴小晖 2018 年 5 月因集资诈骗、职务侵占被判刑 18 年、没收财产 105 亿元。
      cites: [k04-wiki-deng-nan, c04-zaobao-2018-08-17-wu-xiaohui]
    - name: 贺平
      rel: 女婿
      text: >-
        BBC 转述彭博社 2012 年调查：王震之子王军、邓小平女婿贺平和陈云之子陈元三人领导的国有公司，2011 年总市值 1.6 万亿美元，相当于中国年度经济产出的五分之一强。
      cites: [f06-bbc-2012-12-27-bloomberg-heirs]
  cites: [c09-gov-2024-08-22-xi-deng-120, c09-bbc-2001-hu-dragon-chair, c09-cna-2022-10-08-deng-succession, b07-voa-2014-07-03-xu-hu, wd-Q16977, b22-gov-2014-08-20-xi-deng-110, b22-reformdata-1997-02-19-deng-obit, b22-reformdata-1992-01-18-southern-talks, b22-nyt-1997-02-20-deng-obit, b22-bbc-2024-08-22-deng-120]

- id: hu-yaobang
  name: 胡耀邦
  pinyin: Hú Yàobāng
  gender: m
  born: 1915-11-20
  died: 1989-04-15
  birthplace: 湖南浏阳
  joinedParty: 1933-09
  roles: [psc, sec]
  status: dead
  statusNote: 1989 年 4 月 15 日因突发心脏病去世。
  fall:
    - { date: 1987-01, text: 被指“纵容自由化”而遭整肃，辞去总书记职务, cite: c09-bbc-2015-11-20-hu-yaobang-100 }
  tier: 1
  headline: 中共中央主席、总书记（1981–1987）
  ids: { wikidata: Q99850 }
  bio: >-
    长期主持共青团中央，文革后任中组部部长，主持平反冤假错案、推动真理标准讨论；1980 年起主持中央书记处，1981–1987 年任中共中央主席、总书记，纽约时报称他是“邓小平的长期门生”。1986 年底学潮后，他被指“纵容自由化”，1987 年 1 月辞职。1989 年 4 月病逝，成为六四民运的导火索，此后纪念他成为禁忌。
    2005 年中共以座谈会为他有限度地恢复名誉，胡锦涛未出席；2015、2025 年习近平两度出席纪念座谈会，称他是“长期担任党的重要领导职务的卓越领导人”，但官方叙事都回避他的下台。
  positions:
    - { title: 共青团中央书记处书记、第一书记, sys: party, from: 1952, cite: c09-gov-2015-11-20-xi-hu-yaobang-100 }
