    - { title: 中央纪律检查委员会第三书记, sys: party, from: 1978-12, cite: b22-people-2005-11-18-zeng-hu-90 }
    - { title: 中央宣传部部长, sys: party, from: 1978-12-25, to: 1980-03-12, cite: wd-Q99850 }
    - { title: 中央书记处总书记, sys: party, from: 1980-02, to: 1982-09, cite: wd-Q99850 }
