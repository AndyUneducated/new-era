  life:
    - h: 从“红小鬼”到团中央
      from: 1915
      to: 1966
      text: >-
        1915 年 11 月 20 日生于湖南浏阳，14 岁加入共青团，1933 年 9 月转为中共党员，1934 年参加长征。抗战中任中央军委总政治部组织部长，内战中任晋察冀军区纵队政委、十八兵团政治部主任。1949 年后主政川北，邓小平评价他“有主见，不盲从”。
        1952 年起长期主持团中央，倡导“朝气蓬勃，实事求是”的作风；1962 年后兼任湘潭地委第一书记，1964 年任西北局第二书记、陕西省委第一书记。文革中遭严重迫害。
      cites: [b22-people-2005-11-18-zeng-hu-90, b22-gov-2025-11-20-xi-hu-110, c09-gov-2015-11-20-xi-hu-yaobang-100]
    - h: 中组部与平反冤假错案
      from: 1975
      to: 1978
      text: >-
        1975 年任中国科学院党组织负责人，起草科技工作汇报提纲。1977 年 3 月任中央党校副校长，组织推动真理标准问题讨论；12 月任中组部部长。纽约时报引习仲勋官方传记说，他对齐心表示“凡是冤假错案都要实事求是地坚决平反昭雪，不论谁说的，谁定的”。
        BBC 称他平反冤假错案“哪怕是毛泽东批的也照样平反”；习近平 2025 年说他“使大批受到迫害的老同志重新走上领导岗位”。
      cites: [b22-people-2005-11-18-zeng-hu-90, b14-nytcn-2015-11-22-hu-yaobang, b22-bbc-2009-04-15-hu-20th, b22-gov-2025-11-20-xi-hu-110]
    - h: 总书记
      from: 1978
      to: 1986
      text: >-
        1978 年 12 月当选政治局委员、中纪委第三书记，任中央秘书长兼中宣部部长；1980 年 2 月任政治局常委、书记处总书记，1981 年 6 月任中央主席，1982 年 9 月改任总书记。纽约时报说，“在80年代早中期的中国自由化进程中，胡耀邦负责日常事务工作”。
        BBC 称他 1980 年到西藏说汉族干部过多，“西藏应主要由藏族人自己管”。1986 年初他率中央机关干部到贵州、云南、广西贫困地区调研，温家宝回忆，自己当时“刚调任中央办公厅副主任不久”，负责组织这次考察。
      cites: [b22-people-2005-11-18-zeng-hu-90, b22-nytcn-1989-04-15-hu-obit, b22-bbc-2009-04-15-hu-20th, b22-people-2010-04-15-wen-xingyi]
    - h: 下台
      from: 1986-12
      to: 1987-11
      text: >-
        1986 年底各地学生示威，邓小平指责他没能对意识形态松动和学生抗议采取有力行动，邓的支持者和保守派猛烈抨击他；习仲勋在批判会上说“这不正常！”。1987 年 1 月 16 日，官方宣布他“检讨了他担任党中央总书记期间，违反党的集体领导原则、在重大的政治原则问题上的失误”，已提出辞职，随后开展反“资产阶级自由化”运动。
        他保留政治局常委到十三大，1987 年 11 月仍当选政治局委员。1992 年邓小平在南方谈话中说，他推荐的两个接班人“都是在反对资产阶级自由化的问题上栽跟头”。
      cites: [b14-nytcn-2015-11-22-hu-yaobang, b22-nytcn-1989-04-15-hu-obit, b22-people-2005-11-18-zeng-hu-90, b22-reformdata-1992-01-18-southern-talks]
    - h: 猝逝与禁忌
      from: 1989
      to: 2004
      text: >-
        BBC 写道：“1989年4月15日，胡耀邦因突发心脏病去世，引发大批学生和民众自发前去悼念”，他的去世“成了89年六四天安门民主运动的导火索”。BBC 2009 年说，他 1987 年被迫下台引起改革派民众的不平，两年后他的去世让这种情绪迸发出来。
        六四之后，纪念他成了禁忌，BBC 说“这一禁就是16年”：“16年来不曾有过任何纪念活动，也没有对胡耀邦做过任何公开的正面评价”。
      cites: [c09-bbc-2015-11-20-hu-yaobang-100, b22-bbc-2009-04-15-hu-20th, b22-bbc-2005-11-18-hu-90]
    - h: 2005 年：有限度的恢复名誉
      from: 2005
      to: 2010
      text: >-
        2005 年 11 月 18 日，中共中央在人民大会堂举行诞辰 90 周年座谈会，曾庆红讲话对 1987 年辞职只字不提，只写“1987年11月，他在党的十三届一中全会上当选为中央政治局委员”。BBC 说胡锦涛“在最后一刻决定不出席纪念会，并技术性地将诞辰纪念会提前两天举行”；家属拟定的约 200 人名单中，部分敏感人物被剔除。
        2010 年 4 月 15 日，总理温家宝在人民日报发表《再回兴义忆耀邦》，说自己“情不自禁地想起24年前随耀邦同志在这里考察调研的情形”。
      cites: [b22-people-2005-11-18-zeng-hu-90, b22-bbc-2009-04-15-hu-20th, b22-bbc-2005-11-18-hu-90, b22-people-2010-04-15-wen-xingyi]
    - h: 百年与 110 周年
      from: 2015
      to: 2025
      text: >-
        2015 年 11 月 20 日，习近平出席百年座谈会并讲话约 30 分钟，称他是“我军杰出的政治工作者”；纽约时报说习避开了敏感记忆，而胡耀邦当年曾帮习仲勋平反。2017 年遗孀李昭去世，齐心的花圈第一个进入灵堂。
        2025 年 11 月 20 日 110 周年座谈会由蔡奇主持，习近平只说他“1981年6月至1987年1月，担任中央委员会主席、中央委员会总书记”，并把他树为端正党风、落实中央八项规定精神的榜样。
      cites: [c09-gov-2015-11-20-xi-hu-yaobang-100, c09-bbc-2015-11-20-hu-yaobang-100, b14-nytcn-2015-11-22-hu-yaobang, b22-rfa-2017-03-13-li-zhao, b22-gov-2025-11-20-xi-hu-110, b22-gov-2025-11-20-hu-110-meeting]
  assess:
    - voice: official
      quote: true
      text: 久经考验的忠诚的共产主义战士，伟大的无产阶级革命家、政治家，我军杰出的政治工作者，长期担任党的重要领导职务的卓越领导人
      cite: b22-gov-2025-11-20-xi-hu-110
    - voice: west
      quote: true
      text: sacked the Communist Party general secretary, Hu Yaobang, for encouraging the democratic cause
      zh: （邓小平）以鼓励民主事业为由撤掉了中共总书记胡耀邦。
      cite: b22-nyt-1997-02-20-deng-obit
    - voice: witness
      quote: true
      text: 眼前便不断浮现出耀邦同志诚挚坦荡、平易近人的音容笑貌
      cite: b22-people-2010-04-15-wen-xingyi
    - voice: zh
      quote: true
      text: 在藏人眼里，胡耀邦是唯一对中共在西藏的统治表示歉意的领导人
      cite: b22-bbc-2009-04-15-hu-20th
  family:
    - name: 李昭
      rel: 妻子
      text: >-
        本名李淑秀，1941 年与胡耀邦结婚，育有四个子女。2017 年 3 月 11 日在北京去世，享年 95 岁；自由亚洲电台说，习近平之母齐心的花圈第一个进入灵堂，李锐、田纪云、杜导正等也前往吊唁。
      cites: [b22-rfa-2017-03-13-li-zhao]
    - name: 胡德平
      rel: 长子
      text: >-
        曾任全国工商联党组书记、全国政协常委，被视为体制内改革派的声音；2011 年出版《中国为什么要改革—思忆父亲胡耀邦》，主张从根本上否定文革。
      cites: [c05-voa-2013-04-03-hu-deping]
    - name: 刘湖、胡德华、李恒
      rel: 次子、三子、女儿
      text: >-
        次子刘湖、三子胡德华、女儿李恒。2017 年母亲去世后，胡德平、胡德华在家中为母亲设灵堂接待吊唁者。
      cites: [b22-rfa-2017-03-13-li-zhao]
  cites: [c09-gov-2015-11-20-xi-hu-yaobang-100, c09-bbc-2015-11-20-hu-yaobang-100, wd-Q99850, b22-nytcn-1989-04-15-hu-obit, b22-people-2005-11-18-zeng-hu-90, b22-bbc-2009-04-15-hu-20th, b22-gov-2025-11-20-xi-hu-110]

- id: chen-yun
  name: 陈云
  pinyin: Chén Yún
  gender: m
  born: 1905-06-13
  died: 1995-04-10
  birthplace: 上海青浦
  joinedParty: 1925
  roles: [psc, ccdi]
  status: dead
  statusNote: 1995 年 4 月 10 日在北京逝世，终年 89 岁。
  tier: 1
  headline: 中共元老，曾任中央副主席、中纪委第一书记、中顾委主任，改革开放时期保守派代表人物
  ids: { wikidata: Q557233 }
  bio: >-
    中共第一代经济工作领导人，1949 年后主持全国财经工作，1956 年任中央副主席、政治局常委。1978 年十一届三中全会后重新入常、任中央副主席和中纪委第一书记，1987–1992 年任中顾委主任，纽约时报说他与邓小平是两位最资深的领导人。他主张计划为主、市场调节为辅，用“鸟笼”比喻计划与搞活的关系；BBC 称当时元老大致分为“以邓小平为代表的改革派和以陈云为代表的保守派”，李鹏被视为他的门生。
    2000 年后官方三次隆重纪念，突出他“坚定维护邓小平同志在中央领导集体中的核心地位”和抓党风党纪；其子陈元执掌国家开发银行 15 年。
  positions:
    - { title: 国务院副总理, sys: gov, from: 1954, to: 1965, cite: wd-Q557233 }
    - { title: 中共中央副主席, sys: party, from: 1956-09, to: 1966-08, cite: wd-Q557233 }
    - { title: 中央政治局常委, sys: party, from: 1956-09, to: 1969-04, cite: wd-Q557233 }
    - { title: 中央政治局常委, sys: party, from: 1978-12, to: 1987-11, cite: wd-Q557233 }
    - { title: 中共中央副主席, sys: party, from: 1978-12, cite: b22-cctv-2005-06-13-hu-chen-100 }
    - { title: 中央纪律检查委员会第一书记, sys: party, from: 1978-12, to: 1987-11, cite: b22-people-2015-06-12-xi-chen-110 }
    - { title: 中央顾问委员会主任, sys: party, from: 1987-11, to: 1992-10, cite: b22-cctv-2005-06-13-hu-chen-100 }
  factions:
    - f: conservatives
      cite: f05-bbc-2007-01-16-bo-yibo
      quote: '幕后干政的元老中间大致分为以邓小平为代表的改革派和以陈云为代表的保守派'
      rank: elder
      rankQuote: '以陈云为代表的保守派'
    - f: conservatives
      cite: b01-bbc-2019-07-23-li-peng-obit
      quote: '他的政绩平平，但获得以陈云为代表的中共保守派鼎力扶持'
      rank: elder
  life:
    - h: 从五卅运动到中组部长
      from: 1905
      to: 1949
      text: >-
        1905 年 6 月 13 日生于江苏青浦县练塘镇一户贫苦农家，只读过小学。1925 年在上海参加五卅运动和工人罢工，同年入党。遵义会议上他支持毛泽东；抗战期间任中组部部长 7 年，制定“了解人、气量大、用得好、爱护人”的干部政策。内战中参加领导东北解放，辽沈战役后接管沈阳，主持东北经济恢复。
      cites: [b22-cctv-2005-06-13-hu-chen-100, b22-people-2015-06-12-xi-chen-110]
    - h: 财经统帅
      from: 1949
      to: 1966
      text: >-
        建国后任政务院副总理兼中财委主任，“只用不到一年时间”实现全国财经统一、稳定物价，主持一五计划的编制和执行，推行统购统销。1956 年任中央副主席、政治局常委，提出“三个主体，三个补充”。傅高义评价，按任何标准，他和同事控制通胀、保障供应和控制预算的政策都取得了巨大胜利。
        他较早发现大跃进的问题，1960 年代初同刘少奇、周恩来、邓小平一起调整国民经济。1969 年九大后不再是政治局常委。
      cites: [b22-cctv-2005-06-13-hu-chen-100, b22-jiemian-2015-06-chen-yun, wd-Q557233]
    - h: 复出与调整
      from: 1978
      to: 1981
      text: >-
        1978 年底的中央工作会议上，他提出要转移工作重点就必须解决历史遗留的重大问题，为突破“两个凡是”起了作用；十一届三中全会上重新当选政治局常委、中央副主席，并任中纪委第一书记。
        此后他主持国民经济调整，指出以往经济工作错误的主要来源是“左”的指导思想，并提出“只有有计划按比例还不行，还必须有市场调节”。
      cites: [b22-people-2015-06-12-xi-chen-110, b22-cctv-2005-06-13-hu-chen-100]
    - h: 鸟笼与党风
      from: 1982
      to: 1987
      text: >-
        1982 年 11、12 月间，他多次借用黄克诚的“鸟笼”之说：“鸟不能捏在手里，捏在手里会死，要让它飞，但只能让它在笼子里飞。没有笼子，它就飞跑了。”党史专家对中国新闻周刊说，这一比喻与当时经济过热有关。
        他担任中纪委第一书记 9 年，提出“执政党的党风问题是有关党的生死存亡的问题”，反对“经济要搞活，纪律要松绑”的说法。
      cites: [b22-jiemian-2015-06-chen-yun, b22-people-2015-06-12-xi-chen-110, b22-news-2025-06-13-xi-chen-120]
    - h: 与邓小平的分合
      from: 1984
      to: 1992
      text: >-
        纽约时报讣闻说，他大半生与邓小平合作，但最后十年领导一派马克思主义理论家和保守的中央计划者与邓抗衡，对西方资本主义的反感成了改革步伐的重要刹车。洛杉矶时报 1987 年称他是邓小平、赵紫阳市场化改革最有力的批评者，李鹏是他的门生；BBC 也说李鹏“获得以陈云为代表的中共保守派鼎力扶持”。
        官方叙事则说他“积极支持邓小平同志倡导的改革开放”。1987 年十三大他退出政治局常委，改任中顾委主任，十四大后完全退下来。
      cites: [b22-nyt-1995-04-12-chen-yun-obit, f03-latimes-1987-11-25-li-peng, b01-bbc-2019-07-23-li-peng-obit, b22-people-2015-06-12-xi-chen-110, b22-cctv-2005-06-13-hu-chen-100]
    - h: 逝世
      from: 1995
      to: 1995
      text: >-
        1995 年 4 月 10 日在北京逝世，终年 89 岁。纽约时报报道说，外交官认为他的葬礼会被审视政治含义，因为 90 岁的邓小平健康衰退，权力交接正在进行；许多中国人此前觉得，改革的方向可能取决于邓、陈两人谁活得更久。
      cites: [b22-nyt-1995-04-12-chen-yun-obit, wd-Q557233]
    - h: 三次纪念
      from: 2005
      to: 2025
      text: >-
        2005 年 6 月 13 日百年诞辰，中共举行的是纪念大会（胡耀邦 90 周年只开座谈会），胡锦涛讲话称他是“中国社会主义经济建设的开创者和奠基人之一”，引他的名言“不解决实际问题谈为人民服务，则是空话一句”。
        2015 年 6 月 12 日 110 周年座谈会上，习近平说他“担任了9年中央纪委第一书记”，称赞他的“十五字诀”。2025 年 6 月 13 日 120 周年座谈会上，习近平着重引他的选人用人和纪律论述，如“用干部，要五湖四海，平常不熟悉的干部也要用”。
      cites: [b22-cctv-2005-06-13-hu-chen-100, b22-people-2005-11-18-zeng-hu-90, b22-people-2015-06-12-xi-chen-110, b22-news-2025-06-13-xi-chen-120]
  assess:
    - voice: official
      quote: true
      text: 伟大的无产阶级革命家、政治家，杰出的马克思主义者，是中国社会主义经济建设的开创者和奠基人之一
      cite: b22-people-2015-06-12-xi-chen-110
    - voice: west
      quote: true
      text: >-
        a conservative Communist Party patriarch whose revulsion to Western capitalism served as an important brake on the pace of economic reform in China during the last 16 years
      zh: 一位保守的共产党元老，他对西方资本主义的反感在过去 16 年里成了中国经济改革步伐的重要刹车。
      cite: b22-nyt-1995-04-12-chen-yun-obit
    - voice: scholar
      quote: true
      text: 用任何标准衡量，陈云及其同事制定的控制通货膨胀、提供日常生活必需品和控制国家预算等政策都取得了巨大的胜利
      cite: b22-jiemian-2015-06-chen-yun
    - voice: zh
      quote: true
      text: 幕后干政的元老中间大致分为以邓小平为代表的改革派和以陈云为代表的保守派
      cite: f05-bbc-2007-01-16-bo-yibo
  family:
    - name: 于若木
      rel: 妻子
      text: >-
        原名于陆华，1919 年生于济南，1938 年 3 月与陈云结为伴侣，1961 年任陈云秘书，后为营养学家、中央书记处研究室科技组顾问。2006 年 2 月 28 日在北京逝世，享年 87 岁。
      cites: [b22-zjrb-2006-03-07-yu-ruomu]
    - name: 陈元
      rel: 儿子
      text: >-
        1988 年任中国人民银行副行长，1998–2013 年先后任国家开发银行行长、董事长，2013 年任全国政协副主席。BBC 转述彭博社 2012 年调查，他与王军、贺平三人领导的国有公司 2011 年总市值 1.6 万亿美元，相当于中国年度经济产出的五分之一强。
      cites: [f06-people-2013-03-12-chen-yuan-cv, f06-bbc-2012-12-27-bloomberg-heirs]
  cites: [wd-Q557233, f05-bbc-2007-01-16-bo-yibo, f03-latimes-1987-11-25-li-peng, b22-cctv-2005-06-13-hu-chen-100, b22-people-2015-06-12-xi-chen-110, b22-nyt-1995-04-12-chen-yun-obit, f06-people-2013-03-12-chen-yuan-cv]

- id: song-ping
  name: 宋平
  pinyin: Sòng Píng
  aka: [宋延平]
  gender: m
  born: 1917-04-24
  died: 2026-03-04
  birthplace: 山东莒县
  education:
    - { school: 北平大学农学院、清华大学, from: 1934, to: 1937 }
  joinedParty: 1937-12
  roles: [psc]
  status: dead
  statusNote: 2026 年 3 月 4 日 15 时 36 分在北京逝世，享年 109 岁；3 月 10 日遗体在八宝山火化。
  tier: 1
  headline: 原中央政治局常委（1989–1992）、中组部部长，曾在甘肃提拔胡锦涛、温家宝
  ids: { wikidata: Q618323 }
  bio: >-
    长期从事计划工作，1972 年起主政甘肃，1981 年回国家计委，1983 年任国务委员兼国家计委主任，1987 年任中组部部长、政治局委员，六四后增补为政治局常委，主管党建和组织，1992 年十四大退出。联合早报说他提拔举荐过胡锦涛、温家宝，被称为“中国政坛最大伯乐”；路透社说是他把胡锦涛推荐给邓小平。
    退休后他是政治局常委中最长寿的人，2022 年仍出席二十大开幕式。2026 年 1 月，据阿波罗新闻网（传闻），网上流传一封署名宋平致习近平的信，未获证实；同年 3 月他以 109 岁去世，习近平等到八宝山送别。
  positions:
    - { title: 甘肃省委书记, sys: party, place: 甘肃, from: 1972, to: 1977, cite: f05-xinhua-2026-03-10-song-ping }
    - { title: 甘肃省委第一书记, sys: party, place: 甘肃, from: 1977, to: 1981-01, cite: f05-xinhua-2026-03-10-song-ping }
