  life:
    - h: 黄河滩上的神童
      from: 1964
      to: 1984
      text: >-
        1964 年 1 月生于河南原阳。1978 年 14 岁考入北京大学图书馆学系；北大校友会的文章说，他考完并不多想，回家干活，录取通知书来时正在黄河滩上放羊，姐姐拿着通知书去找他，他把羊鞭甩进黄河，“当时就想，这下子终于不用放羊了。”
        1982 年转读北大中文系中国现代文学专业硕士，1984 年毕业。看中国说他 21 岁获当代文学硕士，与官方简历的“现代文学”不同。南洋理工大学的陈抗（Tan Kong Yam）称他以“北大天才”闻名。
      cites: [b15-pku-2016-li-shulei-prodigy, b15-thepaper-2020-12-li-shulei-cv, b15-secretchina-2022-10-26-li-shulei, b15-thinkchina-2022-12-21-tan-kong-yam]
    - h: 党校教书匠
      from: 1984-12
      to: 2008-12
      text: >-
        1984 年 12 月进中央党校文史教研室任教员，1986—1989 年回北大读现代文学博士（简历注“结业”），其间 1986 年入党。此后历任语文教研室主任、文史教研部副主任、主任、培训部主任、教务部主任，其间挂职河北青龙满族自治县委副书记和西安市委副书记。
        人民网 2014 年的文章引述他当“教书匠”时的文字，批评主流话语常带党八股色彩、自说自话，并说执政党若因党八股之困危及自身与民族生存，“那就应是它奋起从思想上与体制上反对党八股的时候了”。
      cites: [b15-thepaper-2020-12-li-shulei-cv, b15-people-2014-11-12-party-jargon, f08-caixin-2023-03-06-hu-heping]
    - h: 习近平的副校长
      from: 2008-12
      to: 2014-01
      text: >-
        2008 年 12 月 44 岁任中央党校副校长，官至副部级，校长正是时任政治局常委、书记处书记习近平。联合早报说他辅助习近平，被视为习的“文胆”；詹姆斯敦基金会的林和立称他 2007—2012 年在党校给习当副手，也是习的讲稿撰写人（官方简历记他 2008 年底才任副校长）。
        据看中国（传闻），习在党内的一些讲话稿出自他手；该网还称他六四后曾在荷兰莱顿大学待过数年，官方简历这段时间记为在党校任教。
      cites: [b15-pku-2016-li-shulei-prodigy, c02-zaobao-2022-11-11-li-shulei, b15-jamestown-2022-20th-leadership, b15-secretchina-2022-10-26-li-shulei, b15-thepaper-2020-12-li-shulei-cv]
    - h: 福建宣传与北京纪委
      from: 2014-01
      to: 2017-01
      text: >-
        2014 年 1 月离开党校，任福建省委常委、宣传部部长。2015 年 12 月跨界进入纪检系统，任北京市委常委、市纪委书记；一年后成为中央纪委副书记候选人，2017 年 1 月在十八届中纪委全会上增选为中纪委常委、副书记。
        据大纪元（传闻）的一篇派系分析，他属于“党校帮”，也曾到福建工作过。
      cites: [b15-thepaper-2020-12-li-shulei-cv, c02-zaobao-2022-11-11-li-shulei, f07-epoch-2023-11-09-five-cliques]
    - h: 中纪委副书记
      from: 2017-01
      to: 2020-12
      text: >-
        2017 年十九大连任中纪委常委、副书记，同年 11 月兼任中国纪检监察学院院长；2018 年 3 月国家监察委员会成立，任国家监委副主任，2020 年 7 月又兼中央纪委国家监委机关党委书记。
        他在纪检系统前后五年，却始终不是中央委员或候补委员。BBC 中文后来把他和何卫东相提并论，说两人都是从非中央候补委员直接进入政治局，是二十大后备受关注的政治新星，“一个拿笔、一个拿枪”。
      cites: [b15-thepaper-2020-12-li-shulei-cv, c02-xinhua-2017-10-25-19-1-plenum, b04-bbc-2025-10-nine-generals]
    - h: 回党校与入中宣部
      from: 2020-12
      to: 2022-10
      text: >-
        2020 年 12 月回中央党校（国家行政学院）任分管日常工作的副校（院）长，正部长级。2022 年 6 月 5 日，他已以中宣部分管日常工作的副部长身份出席六五环境日国家主场活动。
        南华早报指出，他在二十大前四个月升为中宣部二号人物，因此接掌部长并不意外；林和立在大会前就预测，接替黄坤明主管宣传的会是这位“知名学者”。陈抗则称他是“两个确立”“两个维护”背后的主要设计者，起草了习近平的许多重要讲话和党内文件。
      cites: [b15-thepaper-2020-12-li-shulei-cv, b15-fznews-2022-06-05-li-shulei, b15-scmp-2022-10-26-li-shulei, b15-jamestown-2022-20th-leadership, b15-thinkchina-2022-12-21-tan-kong-yam]
    - h: 中宣部部长
      from: 2022-10
      text: >-
        二十届一中全会当选政治局委员、书记处书记，10 月 26 日首次以中宣部部长身份公开亮相。11 月他在人民日报撰文阐释二十大报告的文化部分，一面说“要发扬学术民主、艺术民主，鼓励解放思想、大胆探索”，一面说要“旗帜鲜明反对和抵制各种错误观点”，并强调新闻舆论工作处在意识形态斗争最前沿。
        2023 年 10 月全国宣传思想文化工作会议上，他就贯彻习近平文化思想作工作布置。2026 年 9 月他先后在亚太媒体高端论坛和北京文化论坛发表主旨演讲。
      cites: [b08-wikisource-2022-10-23-20-1-plenum, b15-secretchina-2022-10-26-li-shulei, b15-people-2022-11-10-li-shulei-article, i03-gov-2023-10-08-culture-thought, c02-xinhua-2026-09-05-apac-media, c02-cyol-2026-09-23-beijing-forum]
