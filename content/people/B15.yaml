    - { school: 北京大学中文系中国现代文学专业, degree: 文学硕士, from: 1982, to: 1984 }
    - { school: 北京大学中文系中国现代文学专业, degree: 博士研究生（结业）, from: 1986, to: 1989 }
  joinedParty: 1986-09
