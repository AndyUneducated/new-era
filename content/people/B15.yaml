    - { title: 宁夏回族自治区政府副主席（2013 年 4 月起常务）, sys: gov, place: 宁夏, from: 2013-01, to: 2014-07, cite: c02-wiki-yuan-jiajun }
    - { title: 浙江省委常委、常务副省长, sys: gov, place: 浙江, from: 2014-08, to: 2016-11, cite: b15-cctv-2020-12-01-yuan-jiajun-cv }
