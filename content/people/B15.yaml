- id: chen-jining
  name: 陈吉宁
  pinyin: Chén Jíníng
  gender: m
  ethnicity: 汉族
  born: 1964-02-04
  birthplace: 辽宁盖州
  origin: 吉林梨树
  education:
    - { school: 清华大学土木与环境工程系, degree: 学士, from: 1981, to: 1986 }
    - { school: 清华大学环境工程系, degree: 硕士研究生, from: 1986, to: 1988 }
    - { school: 英国帝国理工医学院土木系, degree: 博士, from: 1989, to: 1993 }
  joinedParty: 1984-04
  joinedWork: 1998-04
  roles: [pb, cc, prov, minister, scholar]
  status: active
  statusNote: 中央政治局委员、上海市委书记，2026 年 9 月仍以此身份主持市委常委会议。
  tier: 1
  headline: 上海市委书记（2022– ）、政治局委员、前北京市长、前清华大学校长
  bio: >-
    清华环境工程出身，英国帝国理工学院博士，在英国做了几年博士后和研究员，1998 年回清华任教，2006 年任副校长，2012 年出任清华大学校长，被称为 1949 年以来最年轻的清华校长。
    2015 年任环境保护部部长，上任后第一次见媒体就公开称赞柴静的雾霾纪录片《穹顶之下》。2017 年接替蔡奇任北京市长，主持冬奥会筹办，任内经历大兴火灾后的大清理。
    二十大进入政治局，接替李强任上海市委书记；外界多视他为“技术型”官员和清华系的代表人物。
  positions:
    - { title: 清华大学环境工程系主任, sys: other, from: 1999-07, to: 2006-02, cite: b15-cernet-2012-02-21-chen-jining-cv }
    - { title: 清华大学副校长（2007 年起任常务副校长）, sys: other, from: 2006-02, to: 2012-01, cite: b15-cernet-2012-02-21-chen-jining-cv }
    - { title: 清华大学校长, sys: other, from: 2012-01, to: 2015-01, cite: p01-xinhua-2022-10-28-chen-jining }
    - { title: 环境保护部部长, sys: gov, from: 2015-02, to: 2017-06, cite: c02-wiki-chen-jining }
    - { title: 北京市市长, sys: gov, place: 北京, from: 2017-05, to: 2022-10, cite: p01-xinhua-2022-10-28-chen-jining }
    - { title: 中央政治局委员, sys: party, from: 2022-10, cite: b08-wikisource-2022-10-23-20-1-plenum }
    - { title: 上海市委书记, sys: party, place: 上海, from: 2022-10, cite: p01-xinhua-2022-10-28-chen-jining }
  life:
    - h: 清华与留英
      from: 1964
      to: 1998
      text: >-
        1964 年 2 月生，籍贯吉林梨树。1981 年考入清华大学土木与环境工程系，1986 年本科毕业，接着读环境工程硕士；清华简历记他 1984 年 4 月入党，2022 年官方简历则记为 1984 年 6 月。
        1988 年 10 月赴英国布鲁耐尔大学读博，1989 年 7 月转到帝国理工医学院土木系，1993 年获博士学位，此前一年起已在帝国理工做博士后，1994 年任助理研究员。The Diplomat 的文章说，他和胡和平都是 1980 年代初进清华读本科、读完硕士再出国读博的。
      cites: [b15-cernet-2012-02-21-chen-jining-cv, c02-gov-2022-10-23-20th-cvs, f08-diplomat-2015-04-27-tsinghua]
    - h: 回清华
      from: 1998-03
      to: 2012-01
      text: >-
        1998 年 3 月回清华任教，任环境工程系副主任，次年任系主任。2006 年 2 月与胡和平同时出任清华副校长，2007 年 12 月任常务副校长兼秘书长，2010 年兼研究生院院长。
        联合早报说，他参与过多项国家重大环境工程攻关，2006 年曾帮助处理东北松花江化学污染问题；还说“有消息说”他在清华时受到党委书记陈希的欣赏。The Diplomat 的薄智跃则直接把他和胡和平称作陈希在清华的门生。
      cites: [b15-cernet-2012-02-21-chen-jining-cv, b15-zaobao-2017-05-27-chen-mayor, f08-diplomat-2015-04-27-tsinghua]
    - h: 清华校长
      from: 2012-01
      to: 2015-01
      text: >-
        2012 年初出任清华大学校长（新华社和清华简历记 1 月，维基百科和 The Diplomat 记 2 月），是 1949 年以来最年轻的清华校长；因为没有院士头衔，在校内外引起不小争议，也有人认为管理水平不能与学术水平等同。
        薄智跃 2015 年写道，他是国务院高层职位和政治局委员的合适人选。据大纪元（传闻），学者沈栋称陈希并不喜欢他，真正提拔他的很可能是温家宝时期的副总理刘延东。
      cites: [p01-xinhua-2022-10-28-chen-jining, b15-cernet-2012-02-21-chen-jining-cv, c02-wiki-chen-jining, f08-diplomat-2015-04-27-tsinghua, f08-epoch-2022-10-28-tsinghua]
    - h: 环保部长与《穹顶之下》
      from: 2015-01
      to: 2017-05
      text: >-
        2015 年 1 月 28 日接替周生贤任环境保护部党组书记，2 月 27 日 51 岁任部长，是当时国务院最年轻的部长。3 月 1 日第一次见媒体，他说前一晚完整看完了柴静的雾霾纪录片《穹顶之下》，并发短信向她致谢，称赞她从公众和健康的视角唤起关注，“值得我们敬佩”，还拿它比《寂静的春天》。
        BBC 中文报道，他说对柴静的报道要用积极和善意的态度鼓励。联合早报说，他任内推出被称为“史上最严”的新环保法。
      cites: [c02-wiki-chen-jining, b15-bjnews-2015-03-01-chen-chaijing, b15-bbc-2015-03-01-chen-chaijing, b15-zaobao-2017-05-27-chen-mayor]
    - h: 北京市长
      from: 2017-05
      to: 2022-10
      text: >-
        2017 年 5 月 27 日任北京市代市长，接替升任市委书记的蔡奇；联合早报说，与蔡奇的“大器晚成”不同，他属于“少年得志”，但长期在学校工作，缺乏主政地方的行政经验。2018 年 1 月当选市长，后兼北京冬奥组委执行主席。
        2017 年 11 月 18 日大兴西红门镇火灾造成 19 人死亡，他与蔡奇连夜赶到现场；随后的安全隐患大清理中，他要求取缔违法场所、拆除违法建筑，“倒逼安全隐患突出的低端业态疏解腾退”。
      cites: [c02-wiki-chen-jining, b15-zaobao-2017-05-27-chen-mayor, c02-gov-2022-10-23-20th-cvs, b06-people-2017-11-20-cai-fire]
    - h: 主政上海
      from: 2022-10
      text: >-
        2022 年 10 月 23 日当选政治局委员，28 日由中组部部长陈希在上海宣布，他接替升任政治局常委的李强任上海市委书记。联合早报说，外界原本预计他会接替蔡奇主政北京，而上海市委书记向来是“入常”热门人选。
        他表态要以“我将无我”的担当和“时时放心不下”的责任感埋头苦干，次日瞻仰中共一大会址。此后他一直主政上海，2026 年 9 月还主持市委常委会扩大会议，部署巩固树立和践行正确政绩观学习教育成果。
      cites: [p01-xinhua-2022-10-28-chen-jining, b15-zaobao-2022-10-29-chen-shanghai, c02-wiki-chen-jining, c02-shgov-2026-09-08-chen-jining]
    - h: 技术官僚与接班猜测
      from: 2022-10
      text: >-
        自由亚洲电台说，他被外界视为“技术性官僚”。美利坚大学的张扬在推特上希望他和李干杰两位新任政治局委员继续关注环境治理；旅欧学者王庆民则认为，专业性只是手段，最终还要受限于体制。
        大纪元（传闻）引张杨说，他和李干杰双双提拔与习近平和陈希有关。据看中国（传闻），前内蒙古自治区政府法律顾问室执行主任杜文 2025 年称，如果习近平 2027 年退休，二号接班人（总理）是陈吉宁。
      cites: [b15-rfa-2022-10-28-technocrats, f08-epoch-2022-10-28-tsinghua, r01-secretchina-2025-08-15-xi-retire]
  assess:
