  tier: 1
  headline: 中央统战部部长（2025– ）、政治局委员、书记处书记、前中组部部长
  bio: >-
    清华核反应堆工程硕士，从国家核安全局北京核安全中心的助理工程师干起，在核安全和环保系统工作近三十年，42 岁任国家环保总局副局长兼国家核安全局局长，此后任环保部副部长近十年。
    2016 年外放河北任省委副书记，次年回任环保部部长，2018 年机构改革后任生态环境部部长。2020 年调任山东省长，2021 年升省委书记，是当时最年轻的省级党委书记。
    二十大以本届最年轻政治局委员的身份进入书记处，2023 年接替陈希执掌中组部；2025 年 4 月与统战部长石泰峰罕见对调，改任统战部长。
