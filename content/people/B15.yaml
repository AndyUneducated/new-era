  life:
    - h: 清华核工程
      from: 1964
      to: 1989
      text: >-
        1964 年 11 月生，湖南人；2007 年清华校友网和 2020 年人民网资料记籍贯为湖南望城，2021、2022 年的新华社通稿则写作湖南长沙（望城今为长沙市辖区）。
        1981 年考入清华大学工程物理系核反应堆工程专业，1984 年 12 月入党，1986、1989 年先后获学士、硕士学位。亚洲协会政策研究院的研究提到，他是清华校友，两个学位都是核工程。
      cites: [b15-tsinghua-2007-01-11-li-ganjie, b15-guancha-2020-07-21-li-ganjie-governor, p01-xinhua-2021-09-30-li-ganjie, f01-asiasociety-tsinghua]
    - h: 核安全系统
      from: 1989
      to: 2006
      text: >-
        1989 年 7 月到国家核安全局北京核安全中心任助理工程师，1991 年 9 月起赴法国核安全与辐射防护研究院进修（人民网资料记到 1992 年 12 月，清华校友网记到 1993 年 1 月）。
        回国后在核安全局核反应堆处由主任科员升至处长；1998 年 1 月至 1999 年 1 月挂任湖南平江县委副书记、科技部驻湘科技扶贫团团长，随即出任驻法国使馆科技处一等秘书。
        2000 年回国家环保总局任核安全与辐射环境管理司副司长，2001 年任核安全中心主任（正局级），2002 年任核安全司司长，2005—2006 年在中央党校一年制中青年干部培训班学习。
      cites: [b15-guancha-2020-07-21-li-ganjie-governor, b15-tsinghua-2007-01-11-li-ganjie]
    - h: 环保部副部长十年
      from: 2006-12
      to: 2016-10
      text: >-
        2006 年 12 月任国家环保总局副局长、党组成员，兼国家核安全局局长，时年 42 岁；2008 年 3 月环保总局改为环境保护部后，他任副部长并继续兼任国家核安全局局长，在这个位置上一直做到 2016 年。
        联合早报日后回顾他的履历时说，他是高级工程师，长期在环保系统工作。自由亚洲电台的评论也提到，他是从国家核安全局北京核安全中心助理工程师干起，在核安全局和环保总局一路晋升。
      cites: [b15-tsinghua-2007-01-11-li-ganjie, b15-guancha-2020-07-21-li-ganjie-governor, c02-zaobao-2025-04-03-shi-li-swap, f02-rfa-2023-02-13-jungong]
    - h: 河北与生态环境部
      from: 2016-10
      to: 2020-04
      text: >-
        2016 年 10 月外放河北任省委副书记，不到一年即回京，2017 年 5 月任环境保护部党组书记，6 月任部长；2018 年 3 月国务院机构改革组建生态环境部，他任首任部长。自由亚洲电台的评论说，他在担任环保部长期间被习近平指定“抓紧培养”。
        2019 年 3 月两会记者会上被问到环保督察中的“一刀切”，他说对于“一刀切”，“我们的态度一直是非常鲜明的，坚决反对，坚决制止，严格禁止”，并称这是生态环境领域形式主义和官僚主义的典型表现，要坚持“双查”，既查不作为、慢作为，也查乱作为、滥作为。
      cites: [b15-guancha-2020-07-21-li-ganjie-governor, c02-rmzxw-2018-03-19-state-council, f02-rfa-2023-02-13-jungong, b15-people-2019-03-11-li-ganjie-presser]
    - h: 主政山东
      from: 2020-04
      to: 2022-12
      text: >-
        2020 年 4 月 17 日山东省人大常委会接受龚正辞职，任命他为副省长、代理省长，7 月 21 日当选省长。2021 年 9 月接替因年龄原因卸任的刘家义任山东省委书记，中组部副部长傅兴国到济南宣布中央决定；
        他由此成为时任最年轻的省级行政区党委书记，同年 10 月当选省人大常委会主任。二十大后他以政治局委员身份兼任山东省委书记，直到 2022 年 12 月 29 日由林武接任，宣布这一决定的仍是中组部部长陈希。
      cites: [p01-xinhua-2020-04-17-li-ganjie, b15-guancha-2020-07-21-li-ganjie-governor, p01-xinhua-2021-09-30-li-ganjie, p01-wiki-li-ganjie, p01-xinhua-2022-12-29-lin-wu]
    - h: 接替陈希掌中组部
      from: 2022-10
      to: 2025-04
      text: >-
        2022 年 10 月二十届一中全会当选政治局委员、书记处书记，是本届最年轻的政治局委员。2023 年 4 月官媒首次披露他的中组部部长身份，正式接替陈希主管党内组织和人事工作。
        亚洲协会政策研究院的吴国光把他看作陈希的接班人，称陈希十年来扮演“清华新军”教父的角色，如今李干杰是他的副手。海外媒体还把他和刘国中、张国清、袁家军、马兴瑞并称“军工五人帮”，但自由亚洲电台的评论认为他的军工背景“多少有些牵强”。
      cites: [b08-wikisource-2022-10-23-20-1-plenum, b09-zaobao-2023-04-26-chen-xi-out, f01-asiasociety-tsinghua, f02-rfa-2023-02-13-jungong]
    - h: 与石泰峰对调
      from: 2025-04
      text: >-
        2025 年 4 月 2 日官方媒体证实，他与中央统战部部长石泰峰职务对调，当天他以统战部长身份主持各民主党派中央长江生态环境保护民主监督工作座谈会；德国之声说“这是官方首次披露两名高官都换到了新的岗位”，中央社称这次对调原因不明，引起外界揣测。
        据大纪元（传闻），大西洋理事会研究员宋文棣认为这说明习近平觉得中组部审查高层候选人做得不够好，时评人李林一则称他与习的关系不够紧密。2026 年 9 月他仍以统战部长身份出席民族团结进步宣传周主场活动。
      cites: [b15-dw-2025-04-02-swap, c02-cna-2025-04-02-shi-li-swap, c02-zaobao-2025-04-03-shi-li-swap, b15-epoch-2025-04-02-swap, c02-zytzb-2026-09-22-li-ganjie]
