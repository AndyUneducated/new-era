  life:
    - h: 北航与五院
      from: 1962
      to: 1995
      text: >-
        1962 年 9 月生于吉林通化。1980—1984 年在北京航空学院飞机设计与应用力学系读固体力学，随后到航空航天工业部第五研究院（航天五院）501 部读空间飞行器设计硕士，1987 年 7 月留在 501 部结构室当助理工程师，1992 年 11 月入党。
        此后由工程师、主任助理升至结构室副主任、501 部副主任。联合早报说他毕业后在航天系统一干就是 28 年。
      cites: [b15-cctv-2020-12-01-yuan-jiajun-cv, b15-zaobao-2020-09-01-jungong-zj-ln]
    - h: 神舟总指挥
      from: 1995
      to: 2007
      text: >-
        1995 年 5 月 33 岁任五院院长助理、神舟一号飞船系统常务副总指挥（人民网另一篇文章说他自 1992 年载人航天工程启动起就任飞船系统第一副总指挥），1996 年任五院副院长。1999 年 11 月神舟一号首飞成功，联合早报说时年 37 岁的他名声大噪。
        此后他担任神舟二号至五号飞船系统总指挥，2003 年任五院院长，在职读完北航飞行器设计博士。人民网称他曾被外界认为是“中国航天工程的领航人物”，与张庆伟是老搭档。
      cites: [b15-cctv-2020-12-01-yuan-jiajun-cv, f08-people-2016-12-07-aerospace, b15-zaobao-2020-09-01-jungong-zj-ln, b15-zaobao-2022-12-08-yuan-chongqing]
    - h: 航天科技副总经理
      from: 2007-10
      to: 2012-03
      text: >-
        2007 年 10 月十七大当选中央候补委员，11 月 45 岁出任中国航天科技集团副总经理、党组成员，主管宇航业务，与总经理马兴瑞共事；2008 年兼任探月工程二期副总指挥和中俄联合探测火星工程副总指挥，2009 年在中央党校中青年干部培训班学习。
        他还先后任第七、八届中国科协副主席，调任地方后仍保留这一兼职。
      cites: [c02-wiki-yuan-jiajun, b15-zaobao-2022-12-08-yuan-chongqing, b15-cctv-2020-12-01-yuan-jiajun-cv, f08-chinanews-2017-02-07-jungong]
    - h: 下放宁夏
      from: 2012-03
      to: 2014-07
      text: >-
        2012 年 3 月离开航天系统，任宁夏回族自治区党委常委、宁东能源化工基地党工委书记、管委会主任。2013 年起兼自治区政府副主席，同年升任常务副主席（人民网资料记为 2013 年 1 月即任常务副主席，维基百科和联合早报记为 2013 年 4 月）。
        人民网 2016 年统计，近五年至少有六名航天系统中央干部空降地方担任主要领导，他是其中之一，同批还有张庆伟、陈求发、马兴瑞、许达哲等人。
      cites: [b15-cctv-2020-12-01-yuan-jiajun-cv, c02-wiki-yuan-jiajun, b15-zaobao-2020-09-01-jungong-zj-ln, f08-people-2016-12-07-aerospace]
    - h: 浙江省长
      from: 2014-07
      to: 2020-08
      text: >-
        2014 年 7 月调浙江，8 月任省委常委、常务副省长兼浙江行政学院院长；2016 年 10 月任省委副书记、政法委书记。2017 年 4 月任代省长，南华早报说浙江是民营经济重镇、习近平的权力基地，航天系老兵被党认定具备主政要省的条件。
        2017 年 7 月正式任省长（2018 年 1 月新一届省人大再次选举他为省长），同年 10 月十九大当选中央委员。2020 年 8 月接替年满 65 岁的车俊任浙江省委书记，联合早报说他“仕途备受看好”。
      cites: [b15-cctv-2020-12-01-yuan-jiajun-cv, c02-wiki-yuan-jiajun, b15-scmp-2017-05-04-aerospace-elite, p01-xinhua-2018-01-30-yuan-jiajun, b15-zaobao-2020-09-01-jungong-zj-ln]
    - h: 共同富裕示范区
      from: 2021-06
      to: 2022-10
      text: >-
        2021 年 6 月 10 日中共中央、国务院发文支持浙江建设共同富裕示范区。他接受新华社专访说，“共同富裕不仅是社会发展概念，更是一场以缩小地区差距、城乡差距、收入差距为标志的社会变革”，浙江将按“每年有新突破、5年有大进展、15年基本建成”推进，到 2025 年率先基本形成以中等收入群体为主体的橄榄型社会结构，并以数字化改革撬动体制机制突破。
        南华早报称他以浙江省委书记身份牵头推行习近平的“共同富裕”运动；林和立此前就认为他是下一届政治局的有力竞争者。
      cites: [b15-xinhua-2021-06-10-yuan-common-prosperity, b15-scmp-2022-12-08-yuan-chongqing, b15-jamestown-2022-20th-leadership]
    - h: 主政重庆
      from: 2022-10
      text: >-
        2022 年 10 月当选政治局委员，12 月 8 日由陈希在重庆宣布，他接替调任天津的陈敏尔任重庆市委书记。南华早报说，重庆市委书记这一职位的在任者常常被进一步提拔进入国家最高领导层。
        2026 年 7 月，与他同期任航天科技集团副总经理的马兴瑞被官宣落马，BBC 中文说两人当年都在二十大成为政治局委员，被视为“航天系”技术官僚的从政顶峰。2026 年 9 月他仍以市委书记身份主持市委常委会扩大会议。
      cites: [p02-xinhua-2022-12-08-chongqing-sec, b15-scmp-2022-12-08-yuan-chongqing, b08-bbc-2026-07-14-ma, c02-cqnews-2026-09-19-yuan-jiajun]
