- id: zhang-guoqing
  name: 张国清
  pinyin: Zhāng Guóqīng
  gender: m
  ethnicity: 汉族
  born: 1964-08-13
  birthplace: 河南罗山
  education:
    - { school: 长春光学精密机械学院电子工程系光学电子技术专业, from: 1981, to: 1985 }
    - { school: 华东工学院（今南京理工大学）管理工程系工业外贸专业, from: 1985, to: 1987 }
    - { school: 清华大学经济管理学院数量经济学专业（在职）, degree: 经济学博士, from: 2000, to: 2004 }
  joinedParty: 1984-07
  joinedWork: 1985-09
  roles: [pb, cc, prov, minister, biz]
  status: active
  statusNote: 中央政治局委员、国务院副总理，2026 年 9 月仍以此身份出席全国食品安全宣传周活动。
  tier: 1
  headline: 国务院副总理（2023– ）、政治局委员、前兵器工业集团总经理
  bio: >-
    河南罗山人，学光电出身，1987 年进中国北方工业公司做军贸，二十五六岁派驻伊朗德黑兰，32 岁升北方工业副总裁，此后在兵器工业集团做到总经理，任内集团营收率先突破 3000 亿元，得了“兵工少帅”的外号。
    2013 年空降重庆任市委副书记，2017 年初接替黄奇帆任重庆市长，年底转任天津市长，2020 年任辽宁省委书记，是当时最年轻的省委书记。
    二十大进入政治局，2023 年任国务院副总理，公开活动多涉安全生产、防汛救灾和食品安全，海外媒体视他为“军工系”在国务院的代表。
  positions:
    - { title: 中国北方工业公司副总裁, sys: other, from: 1996-07, to: 2004-04, cite: b15-people-2013-04-24-zhang-guoqing-cv }
    - { title: 中国兵器工业集团副总经理（2007 年起任党组书记）, sys: other, from: 1999-06, to: 2008-10, cite: b15-cctv-2021-01-31-zhang-guoqing-cv }
    - { title: 中国兵器工业集团总经理, sys: other, from: 2008-10, to: 2013-04, cite: c02-wiki-zhang-guoqing }
    - { title: 重庆市委副书记, sys: party, place: 重庆, from: 2013-04, to: 2017-12, cite: b15-cctv-2021-01-31-zhang-guoqing-cv }
    - { title: 重庆市市长, sys: gov, place: 重庆, from: 2016-12, to: 2017-12, cite: b15-cctv-2021-01-31-zhang-guoqing-cv }
    - { title: 天津市委副书记, sys: party, place: 天津, from: 2017-12, to: 2020-08, cite: b15-cctv-2021-01-31-zhang-guoqing-cv }
    - { title: 天津市市长, sys: gov, place: 天津, from: 2018-01, to: 2020-09, cite: wd-Q8292210 }
    - { title: 辽宁省委书记, sys: party, place: 辽宁, from: 2020-08, to: 2022-12, cite: b15-cctv-2021-01-31-zhang-guoqing-cv }
    - { title: 中央政治局委员, sys: party, from: 2022-10, cite: b08-wikisource-2022-10-23-20-1-plenum }
    - { title: 国务院副总理, sys: gov, from: 2023-03, cite: c02-wiki-zhang-guoqing }
  life:
    - h: 罗山到北方工业
      from: 1964
      to: 1989
      text: >-
        1964 年 8 月生于河南罗山县灵山镇。1981—1985 年在长春光学精密机械学院（今长春理工大学）电子工程系学光电技术，1984 年 7 月入党；1985—1987 年在华东工学院（今南京理工大学）管理工程系读对外经济贸易专业。
        1987 年 7 月进入中国北方工业公司，从成套项目与技术出口处的项目经理做起，后任中东地区部地区经理。詹姆斯敦基金会的林和立说，他几乎整个职业生涯都在北方工业（Norinco）系统度过，并称之为中国最大的军火制造商。
      cites: [b15-people-2013-04-24-zhang-guoqing-cv, b15-cctv-2021-01-31-zhang-guoqing-cv, f02-jamestown-2018-xi-faction-regions]
    - h: 驻德黑兰的军贸生涯
      from: 1989-10
      to: 1999-06
      text: >-
        1989 年 10 月至 1993 年 2 月任北方工业驻伊朗德黑兰代表处总代表助理。联合早报说，他年轻时作为北方工业的代表，曾驻伊朗等中东国家推销中国军工产品。
        回国后任中东地区处副处长、处长，1995 年任国际贸易一部副总经理，1996 年 7 月升任北方工业副总裁并兼中国万宝工程公司总经理。詹姆斯敦基金会的林和立指出，他当上副总裁时才 32 岁。1998 年底兼任北方工业党委书记。
      cites: [b15-people-2013-04-24-zhang-guoqing-cv, b15-zaobao-2020-09-01-jungong-zj-ln, f02-jamestown-2018-xi-faction-regions]
    - h: 兵工少帅
      from: 1999-06
      to: 2013-04
      text: >-
        1999 年 6 月任中国兵器工业集团副总经理、党组成员，仍兼管北方工业，其间在清华经管学院在职读数量经济学博士，2001 年秋到哈佛商学院参加高级管理培训。2004 年任北方工业总裁，2007 年 6 月 43 岁任集团党组书记，同年十七大当选中央候补委员。
        2008 年 10 月任集团总经理。他任内兵器工业集团在 2011 年成为首家营业收入迈上 3000 亿元台阶的军工集团，2012 年列世界 500 强第 205 位，他因此被誉为“兵工少帅”；同年十八大当选中央委员。
      cites: [b15-people-2013-04-24-zhang-guoqing-cv, b15-cctv-2021-01-31-zhang-guoqing-cv, c02-wiki-zhang-guoqing, b15-zaobao-2020-09-01-jungong-zj-ln]
    - h: 空降重庆
      from: 2013-04
      to: 2017-12
      text: >-
        2013 年 4 月从兵器集团总经理任上空降重庆，任市委副书记兼市委党校校长，成为市委书记孙政才的副手。中国经济周刊记下他临行前的话：今后不管走到哪里，兵器工业永远是他的“娘家”，会经常回来汇报工作。
        2016 年 12 月 30 日接替黄奇帆任代市长，2017 年 1 月 19 日当选市长。联合早报说，他由此成为当时最年轻的直辖市政府主官；中国经济周刊称他是业界著名的军工少帅。
      cites: [c02-wiki-zhang-guoqing, f08-chinanews-2017-02-07-jungong, c07-ifeng-2026-10-13-huang-qifan, b15-zaobao-2020-09-01-jungong-zj-ln]
    - h: 天津与辽宁
      from: 2017-12
      to: 2022-12
      text: >-
        2017 年 12 月调任天津市委副书记，2018 年 1 月 2 日任代市长，成为市委书记李鸿忠的副手，1 月 29 日当选市长。林和立当时写道，他是党内所谓“国防—航天派”最有名的成员之一。
        2020 年 8 月任辽宁省委书记（官方简历记 8 月，新华社 9 月 1 日发布），成为时任最年轻的省委书记，至此有了两个直辖市和一个工业大省的主政履历；2021 年 1 月兼省人大常委会主任，在辽宁主打优化营商环境、“数字辽宁、智造强省”。
      cites: [c02-wiki-zhang-guoqing, f02-jamestown-2018-xi-faction-regions, b15-cctv-2021-01-31-zhang-guoqing-cv, b15-zaobao-2020-09-01-jungong-zj-ln]
    - h: 国务院副总理
      from: 2023-03
      text: >-
        二十届一中全会当选政治局委员；2023 年 1 月在西藏当选全国人大代表，3 月 12 日经李强提名当选国务院副总理，排名第三。
        5 月 31 日他在全国“安全生产月”启动仪式上说，必须时刻绷紧安全生产这根弦。8 月京津冀遭遇极端强降雨，他受习近平委派紧急赶赴天津指导防汛，要求“坚决打赢当前防汛抗洪救灾这场遭遇战”，确保风险区域人员应撤尽撤、不落一人。2026 年 9 月他出席全国食品安全宣传周主场活动并讲话。
      cites: [c02-wiki-zhang-guoqing, b15-xinhua-2023-05-31-zhang-safety-month, b15-xinhua-2023-08-05-zhang-tianjin-flood, c02-gov-2026-09-22-zhang-guoqing]
    - h: 军工系副总理
      from: 2023
      text: >-
        海外媒体把他和刘国中、袁家军、马兴瑞、李干杰并称二十届政治局里的“军工五人帮”。据大纪元（传闻），国务院五名副总理“都是习家军，但分属五个不同帮派”，他属于军工帮；
        大纪元 2026 年 3 月的另一篇报道（传闻）引三名体制内消息人士说，伊朗局势紧张后他直接受命于习近平，协调军工供应链，被视为“伊朗通”。2026 年 7 月同属军工航天系的马兴瑞被官宣落马，BBC 中文说二十大周期内已有三名在任政治局委员落马。
      cites: [f02-rfa-2023-02-13-jungong, f07-epoch-2023-11-09-five-cliques, b15-epoch-2026-03-12-zhang-iran, b08-bbc-2026-07-14-ma]
