- id: yuan-jiajun
  name: 袁家军
  pinyin: Yuán Jiājūn
  gender: m
  ethnicity: 汉族
  born: 1962-09
  birthplace: 吉林通化
  education:
    - { school: 北京航空学院飞机设计与应用力学系固体力学专业, degree: 学士, from: 1980, to: 1984 }
    - { school: 航空航天工业部第五研究院 501 部空间飞行器设计专业, degree: 硕士研究生, from: 1984, to: 1987 }
    - { school: 北京航空航天大学飞行器设计专业（在职）, degree: 工学博士, from: 2001, to: 2006 }
  joinedParty: 1992-11
  joinedWork: 1987-07
  roles: [pb, cc, prov, biz]
  status: active
  statusNote: 中央政治局委员、重庆市委书记，2026 年 9 月仍以此身份主持市委常委会议。
  tier: 1
  headline: 重庆市委书记（2022– ）、政治局委员、前浙江省委书记、神舟飞船前总指挥
  bio: >-
    北京航空学院毕业后进航天五院，在航天系统干了 28 年，33 岁任神舟一号飞船系统常务副总指挥，此后担任神舟二号至五号飞船系统总指挥，2003 年任五院院长，2007 年任中国航天科技集团副总经理，有“航天少帅”之称。
    2012 年下放宁夏，2014 年调浙江任常务副省长，2017 年任省长，2020 年接替车俊任浙江省委书记，主持“共同富裕示范区”建设。
    二十大进入政治局，接替陈敏尔主政重庆；2026 年曾与他同在航天科技集团领导层的马兴瑞落马后，他仍在重庆任上。
  positions:
