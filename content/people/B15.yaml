  roles: [pb, sec, ccdi, cc]
  status: active
  statusNote: 中央政治局委员、书记处书记、中宣部部长，2026 年 9 月仍以此身份出席亚太媒体高端论坛和北京文化论坛。
  tier: 1
  headline: 中央宣传部部长（2022– ）、政治局委员、书记处书记、习近平在中央党校的副手
  bio: >-
    14 岁考入北大，有“北大神童”之称，北大中文系现代文学硕士毕业后进中央党校，从文史教研室教员做到教务部主任，在党校工作二十多年。
    2008 年底任中央党校副校长，给时任校长习近平当副手，外界视他为习的“文胆”。2014 年外放福建任宣传部长，2015 年转入纪检系统任北京市纪委书记，2017 年起任中纪委副书记、国家监委副主任。
    2020 年回党校主持日常工作，2022 年年中转任中宣部常务副部长，二十大从中纪委常委直接跃入政治局和书记处，接替黄坤明任中宣部部长。
  positions:
