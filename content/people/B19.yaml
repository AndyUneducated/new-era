- id: wang-lequan
  name: 王乐泉
  pinyin: Wáng Lèquán
  gender: m
  ethnicity: 汉族
  born: 1944-12
  birthplace: 山东寿光
  joinedParty: 1966-03
  joinedWork: 1965-09
  roles: [pb, cc, prov]
  status: retired
  statusNote: 2012 年十八大退出政治局；2013–2019 年任中国法学会会长，2026 年春节仍在中央看望的老同志名单上。
  tier: 1
  headline: 新疆维吾尔自治区党委书记（1995–2010）、政治局委员（2002–2012）
  bio: >-
    山东寿光人，公社干部出身，做过寿光县委书记、团省委副书记、聊城地委书记和山东副省长。1991 年调新疆，1995–2010 年任自治区党委书记兼兵团第一政委，2002–2012 年为政治局委员。习近平在宣布他离任时称赞他“牢固树立稳定压倒一切的思想”，海外媒体则称他是处理“疆独”问题的强硬派。
    2009 年乌鲁木齐七五骚乱后，汉族示威者要求他下台，次年 4 月他调离新疆，改任中央政法委副书记，《卫报》说许多人视之为降级。2013–2019 年任中国法学会会长。
  positions:
    - { title: 寿光县委书记, sys: party, place: 山东, from: 1978, to: 1982, cite: c01-jjckb-2007-10-23-wang-lequan }
    - { title: 共青团山东省委副书记, sys: party, place: 山东, from: 1982, to: 1986, cite: c01-jjckb-2007-10-23-wang-lequan }
    - { title: 聊城地委书记, sys: party, place: 山东, from: 1988, to: 1989, cite: c01-jjckb-2007-10-23-wang-lequan }
    - { title: 山东省副省长, sys: gov, place: 山东, from: 1989, to: 1991, cite: c01-jjckb-2007-10-23-wang-lequan }
    - { title: 新疆维吾尔自治区党委代理书记, sys: party, place: 新疆, from: 1994, to: 1995, cite: c01-jjckb-2007-10-23-wang-lequan }
    - { title: 新疆维吾尔自治区党委书记, sys: party, place: 新疆, from: 1995, to: 2010-04, cite: c01-jjckb-2007-10-23-wang-lequan }
    - { title: 中央政治局委员, sys: party, from: 2002-11, to: 2012-11, cite: c01-jjckb-2007-10-23-wang-lequan }
    - { title: 中央政法委副书记, sys: party, from: 2010-04, to: 2012-11, cite: c01-cyol-2010-04-25-xinjiang-reshuffle }
    - { title: 中国法学会会长, sys: other, from: 2013-11, to: 2019-03, cite: b19-caixin-2019-03-20-law-society }
  life:
    - h: 寿光县委书记
      from: 1944
      to: 1986
      text: >-
        1944 年 12 月生，山东寿光人。1965 年参加工作，先在胶南县搞“社教”，1966 年 3 月入党。此后在寿光县侯镇公社、城关公社任副社长、党委副书记等职，1975 年任寿光县委副书记，1978–1982 年任县委书记兼县革委会主任。
        1982 年调任共青团山东省委副书记，其间 1983–1986 年在中央党校培训班学习。
      cites: [c01-jjckb-2007-10-23-wang-lequan]
    - h: 聊城与副省长
      from: 1986
      to: 1991
      text: >-
        1986 年任聊城地委副书记，1988 年升任地委书记，1989–1991 年任山东省副省长。
        自由亚洲电台评论员高新后来把他和刘云山、汪洋一起，列为地方省级团委书记、副书记出身而进入十七届政治局的“青帮”人马，以说明团派在胡锦涛时代领导层中人数之多。
      cites: [c01-jjckb-2007-10-23-wang-lequan, f05-rfa-2023-01-13-wang-zhaoguo-xi]
    - h: 入疆
      from: 1991
      to: 1995
      text: >-
        他自述 1991 年 4 月从山东调到新疆，在自治区政府任常务副主席；官方简历记他同时任自治区党委常委，1992 年升党委副书记。他说自己从 1994 年起到自治区党委主持工作，1994–1995 年为党委代理书记，1995 年正式任自治区党委书记，兼新疆生产建设兵团第一政委。
      cites: [c01-jjckb-2007-10-23-wang-lequan, b19-sina-2002-01-21-wang-lequan-interview]
    - h: 主政十五年
      from: 1995
      to: 2009
      text: >-
        1997 年 2 月 5 日伊犁发生骚乱。2002 年初他接受法国《欧洲时报》等记者采访时说，闹事者“在境外是有背景的”，受“国际极端伊斯兰势力”影响；记者问是否与少数民族的文化习俗未获尊重有关，他答“跟这个问题是没有关系的”。
        2002 年他进入政治局。按 2006 年施行的任期规定本应调离，但他在同年 10 月破例第三次当选自治区党委书记。美国之音转述港报说，他与王震、王恩茂并称“新疆三王”，以奉行强硬路线处理“疆独”问题著称。
      cites: [b19-sina-2002-01-21-wang-lequan-interview, c01-jjckb-2007-10-23-wang-lequan, b19-wiki-wang-lequan, b19-voa-2009-09-06-xinjiang-reshuffle]
    - h: 七五之后
      from: 2009-07
      to: 2009-11
      text: >-
        2009 年 7 月乌鲁木齐骚乱后，7 日部分汉族市民上街游行，他当天发表电视讲话，呼吁维护民族团结；9 月 3 日汉族市民再次游行，有人高喊要他下台。美国之音记者在新疆采访，无论维族还是汉族“几乎没有说他好话的”，还有人在集会上向他扔矿泉水瓶。
        9 月初乌鲁木齐市委书记栗智被撤换。BBC 中文转引布鲁金斯学会李成的话说，北京想保住他，因为撤换政治局委员会发出错误信号。
      cites: [b19-wiki-wang-lequan, b19-voa-2009-11-02-wang-lequan, b19-voa-2009-09-06-xinjiang-reshuffle, b19-bbc-2009-09-07-xinjiang-wang, b19-guardian-2010-04-25-xinjiang]
    - h: 调离新疆
      from: 2010-04
      to: 2010-05
      text: >-
        2010 年 4 月 24 日，习近平到乌鲁木齐出席全区干部大会，李源潮宣布中央决定：他兼任中央政法委副书记，不再兼任自治区党委书记，由张春贤接任。习近平说“中央对王乐泉同志是充分肯定的”，他本人表示完全拥护中央决定。
        官方没有说明调动原因。BBC 说分析人士注意到公众对他处理骚乱的方式强烈不满；《卫报》说许多人把新职位视为降级；BBC 中文引分析说，这显示中央对新疆的政策从铁腕统治转向大力发展经济。
      cites: [b19-cntv-2010-04-25-xinjiang-meeting, b19-bbcen-2010-04-24-xinjiang, b19-guardian-2010-04-25-xinjiang, b19-bbc-2010-05-06-xinjiang-policy]
    - h: 政法委与法学会
      from: 2010
      to: 2026
      text: >-
        2010–2012 年任中央政法委副书记，2012 年十八大退出政治局，2013 年 11 月当选中国法学会会长。2019 年 3 月中国法学会换届，政治局委员王晨接替 74 岁的他任会长，并在闭幕讲话中向他和第七届理事会致以崇高敬意。2026 年春节前，他在中央领导看望的老同志名单上。
      cites: [c01-cyol-2010-04-25-xinjiang-reshuffle, c01-people-2013-11-30-wang-lequan-law-society, b19-caixin-2019-03-20-law-society, b19-chinalaw-2019-03-20-wang-chen-speech, b19-xinhua-2026-02-13-old-comrades]
  assess:
    - voice: official
      quote: true
      text: 乐泉同志交流到新疆工作近20年，担任自治区党委主要领导15年，为新疆的发展稳定作出了重要贡献。
      cite: b19-cntv-2010-04-25-xinjiang-meeting
    - voice: zh
      quote: true
      text: 王乐泉主政新疆十多年，维汉问题未得到缓解，反而愈益加剧。
      cite: b19-voa-2009-09-06-xinjiang-reshuffle
    - voice: zh
      quote: true
      text: 王樂泉是政治局委員，據信也是胡錦濤的盟友，15年來一直掌管新疆，對少數民族採取強硬政策。
      cite: b19-bbc-2009-09-07-xinjiang-wang
    - voice: west
      quote: true
      text: Wang Lequan's new position as deputy secretary of the party's political and legislative affairs committee was seen by many as a demotion, although his 15-year tenure as the region's top official was highly unusual.
      zh: 王乐泉的新职务中央政法委副书记被许多人视为降级，不过他担任该地区最高官员长达 15 年，本身就极不寻常。
      cite: b19-guardian-2010-04-25-xinjiang
  family:
    - name: 妻子及三个子女（姓名未见于来源）
      rel: 妻子、子女
      text: >-
        他 2002 年对法国记者说，家里“除我的夫人外，还有三个孩子”，都已工作且都在新疆；前两个孩子先在山东参加工作，后来调到新疆。
      cites: [b19-sina-2002-01-21-wang-lequan-interview]
  factions:
    - f: tuanpai
      cite: f05-rfa-2023-01-13-wang-zhaoguo-xi
      quote: 同为十七届中央政治局委员或中央书记处书记的的还有地方省级团委书记和副书记出身的刘云山、汪洋、王乐泉以及团中央部门负责人出身的令计划。
  ids: { wikidata: Q715990 }
