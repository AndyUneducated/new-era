- id: liu-qibao
  name: 刘奇葆
  pinyin: Liú Qíbǎo
  gender: m
  ethnicity: 汉族
  born: 1953-01
  birthplace: 安徽宿松
  education:
    - { school: 安徽师范大学历史系, from: 1972, to: 1974 }
    - { school: 吉林大学, degree: 国民经济计划和管理专业经济学硕士（在职）, from: 1991, to: 1993 }
  joinedParty: 1971-12
  joinedWork: 1974-09
  roles: [pb, sec, cc, prov]
  status: retired
  statusNote: 2023 年 3 月卸任全国政协副主席后退休，2026 年春节仍在中央看望的老同志名单上。
  tier: 1
  headline: 中宣部部长（2012–2017）、政治局委员、书记处书记
  bio: >-
    安徽宿松人，生产队指导员出身，安徽师大历史系毕业后在安徽省委宣传部、办公厅工作。1980 年转入共青团，1983 年任团安徽省委书记，1985–1993 年任团中央书记处书记，被视为胡锦涛的团派旧部。此后任人民日报副总编辑、国务院副秘书长，2000 年起在广西任副书记、书记，2007 年底调任四川省委书记，任内经历汶川地震和灾后重建。
    十八大进入政治局和书记处，执掌中宣部五年；2017 年十九大未到年龄即退出政治局，2018–2023 年任全国政协副主席。
  positions:
    - { title: 共青团安徽省委书记, sys: party, place: 安徽, from: 1983, to: 1985, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 团中央书记处书记, sys: party, from: 1985, to: 1993, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 人民日报社副总编辑, sys: other, from: 1993, to: 1994, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 国务院副秘书长, sys: gov, from: 1994, to: 2000, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 广西壮族自治区党委副书记, sys: party, place: 广西, from: 2000-09, to: 2006-06, cite: b19-chinanews-2007-12-01-liu-sichuan }
    - { title: 广西壮族自治区党委书记, sys: party, place: 广西, from: 2006-06, to: 2007-11, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 四川省委书记, sys: party, place: 四川, from: 2007-12, to: 2012-11, cite: c02-cyol-2012-11-16-18th-cvs }
    - { title: 中央政治局委员、书记处书记, sys: party, from: 2012-11, to: 2017-10, cite: c02-xinhua-2012-11-15-18-1-plenum }
    - { title: 中央宣传部部长, sys: party, from: 2012-11, to: 2017-10, cite: wd-Q194157 }
    - { title: 全国政协副主席, sys: other, from: 2018-03, to: 2023-03, cite: c02-gov-2018-03-14-cppcc-leaders }
  life:
    - h: 宿松与安徽省委
      from: 1953
      to: 1980
      text: >-
        1953 年 1 月生于安徽宿松，维基百科记其父为刘象成。1968 年起在宿松县洲头公社金坝大队任生产队指导员、大队团支部书记，1971 年 12 月入党。1972–1974 年在安徽师范大学历史系学习，毕业后进安徽省委宣传部理论研究室，1977 年调省委办公厅秘书处任秘书。他后来在职读吉林大学经济学硕士，2012 年的官方简历记为 1991–1993 年，2007 年中新社刊登的简历则记 1992 年 2 月获学位。
      cites: [c02-cyol-2012-11-16-18th-cvs, b19-chinanews-2007-12-01-liu-sichuan, b19-wiki-liu-qibao]
    - h: 共青团
      from: 1980
      to: 1993
      text: >-
        1980 年任团安徽省委宣传部副部长，1982 年任副书记，1983 年任团省委书记，1984–1985 年挂职宿州市长。1985 年 11 月进入团中央书记处，兼团中央机关党委书记，一做八年；团十一大后增选的书记处书记有李源潮、李克强和他。
        台湾学者蔡文轩把他列为胡锦涛团中央时期的团派干部；香港《太阳报》称他是胡锦涛的“十八罗汉”之一。
      cites: [c02-cyol-2012-11-16-18th-cvs, b19-chinanews-2007-12-01-liu-sichuan, f05-people-2013-06-21-cyl-secretaries, f05-sef-2012-10-tsai-fifth-gen, c02-sun-2012-11-28-liu-qibao]
    - h: 人民日报、国务院与广西
      from: 1993
      to: 2007
      text: >-
        1993 年任人民日报社副总编辑，1994–2000 年任国务院副秘书长。据大纪元（传闻），这段经历使他成为时任国务院秘书长罗干的副手，因此“横跨团派和江派两大派系”。
        2000 年 9 月调任广西壮族自治区党委副书记，年底兼区党委党校校长；2006 年 6 月接任自治区党委书记，2007 年 1 月兼任自治区人大常委会主任。香港《太阳报》说，他和李源潮一样在北京有过工作“发霉”的日子，胡锦涛掌权后把他们外放地方，才一路顺风顺水。
      cites: [c02-cyol-2012-11-16-18th-cvs, b19-chinanews-2007-12-01-liu-sichuan, b19-epoch-2017-10-25-liu-out, c02-sun-2012-11-28-liu-qibao]
    - h: 四川与汶川
      from: 2007
      to: 2012
      text: >-
        2007 年 12 月 1 日调任四川省委书记，接替杜青林，次年兼省人大常委会主任。2008 年 5 月汶川地震后任省抗震救灾指挥部指挥长。BBC 中文报道，约 7 千间教室或校舍倒塌，数千学生遇难，遇难学生家长认为豆腐渣工程和腐败是根源。
        8 月底他到绵竹、什邡察看复课，绵竹中学 95% 的校舍已成危房，学生在板房里上课。他要求“决不让一个灾区孩子因灾失学、辍学”，并要求重建的永久校舍提高抗震设防标准，建成让学生、家长、社会放心的“安全岛”。
      cites: [b19-chinanews-2007-12-01-liu-sichuan, c02-cyol-2012-11-16-18th-cvs, p02-wiki-sichuan-sec, b19-bbc-2008-06-20-school-parents, b19-sohu-2008-09-01-liu-schools]
    - h: 中宣部长
      from: 2012
      to: 2017
      text: >-
        2012 年十八届一中全会当选政治局委员、书记处书记，出任中宣部部长；中央社说外界认为这是胡锦涛安排的结果。2017 年 9 月十九大前，他对新任省级宣传部长说，要“按照政治家的标准严格要求自己”，要“把导向、管阵地，不给错误思想提供传播渠道”。
        香港01 称，他执掌的中宣部是过去五年间被外界诟病最多的中共部门，批评者说它舆论治理手段陈旧、跟不上习近平的思路，甚至有人说中宣部成了习近平的“高级黑”。另据大纪元（传闻）援引港媒，他出任中宣部长是周永康要刘云山推荐的。
      cites: [c02-xinhua-2012-11-15-18-1-plenum, b19-cna-2017-10-25-three-exit, b19-people-2017-09-16-liu-propaganda, b11-hk01-2017-10-30-huang-propaganda, b19-epoch-2017-10-25-liu-out]
    - h: 出局与政协
      from: 2017
      to: 2026
      text: >-
        2017 年十九大，64 岁的他与李源潮、张春贤一样未满 68 岁就退出政治局，但仍当选中央委员；中宣部由常务副部长黄坤明接掌。中央社分析，他作风低调，但团派背景不为习近平所喜。11 月他在《人民日报》撰文谈推动社会主义文化繁荣兴盛，说尊重差异、包容多样不是“无原则的尊重、无底线的包容”。
        2018–2023 年任全国政协副主席，2026 年春节前仍在中央看望的老同志名单上。
      cites: [b19-cna-2017-10-25-three-exit, b11-hk01-2017-10-30-huang-propaganda, b19-people-2017-11-13-liu-culture, c02-gov-2018-03-14-cppcc-leaders, b19-xinhua-2026-02-13-old-comrades]
  assess:
    - voice: zh
      quote: true
      text: 劉奇葆在任期間作風相對低調，但外界仍有習近平無法百分百掌握黨內宣傳系統的說法。
      cite: b19-cna-2017-10-25-three-exit
    - voice: zh
      quote: true
      text: 劉奇葆所執掌的中宣部，是過去5年間被外界詬病最多的中共部門
      cite: b11-hk01-2017-10-30-huang-propaganda
    - voice: scholar
      quote: true
      text: He has practically eliminated his potential competitors from princelings (especially military princelings such as General Liu Yuan and General Liu Yazhou) and from the Youth League group such as Li Yuanchao, Liu Qibao and Lu Hao.
      zh: 他（习近平）几乎清除了太子党（尤其是刘源、刘亚洲等军中太子党）和共青团派（如李源潮、刘奇葆、陆昊）中的潜在竞争者。
      cite: f01-thinkchina-2022-09-27-factions
  family:
    - name: 刘象成
      rel: 父亲
      text: >-
        维基百科记其父为刘象成，已去世，未见其他公开信息。
      cites: [b19-wiki-liu-qibao]
  factions:
    - f: tuanpai
      cite: c02-sun-2012-11-28-liu-qibao
      quote: 劉奇葆則是正兒八經的團派大將，被稱為胡錦濤的「十八羅漢」之一。
  ids: { wikidata: Q194157 }
  cites: [wd-Q194157, c02-cyol-2012-11-16-18th-cvs, c02-gov-2018-03-14-cppcc-leaders, c02-sun-2012-11-28-liu-qibao, c02-xinhua-2012-11-15-18-1-plenum, b19-wiki-liu-qibao, b19-chinanews-2007-12-01-liu-sichuan, f05-people-2013-06-21-cyl-secretaries, f05-sef-2012-10-tsai-fifth-gen, b19-epoch-2017-10-25-liu-out, p02-wiki-sichuan-sec, b19-bbc-2008-06-20-school-parents, b19-sohu-2008-09-01-liu-schools, b19-cna-2017-10-25-three-exit, b19-people-2017-09-16-liu-propaganda, b11-hk01-2017-10-30-huang-propaganda, b19-people-2017-11-13-liu-culture, f01-thinkchina-2022-09-27-factions, b19-xinhua-2026-02-13-old-comrades]

- id: wang-chen
  name: 王晨
  pinyin: Wáng Chén
  gender: m
  ethnicity: 汉族
  born: 1950-12
  birthplace: 北京
  education:
    - { school: 中国社会科学院研究生院新闻系, degree: 新闻业务专业文学硕士, from: 1979, to: 1982 }
  joinedParty: 1969-12
  joinedWork: 1969-01
  roles: [pb, cc]
  status: retired
  statusNote: 2023 年 3 月卸任全国人大常委会副委员长；2025 年 9 月仍以中国延安精神研究会会长身份出席活动，2026 年春节在中央看望的老同志名单上。
  tier: 1
  headline: 全国人大常委会副委员长（2013–2023）、政治局委员（2017–2022）
  bio: >-
    北京人，1969 年到陕西延安地区宜君县插队，后在县委、延安地委当干部。1974 年进光明日报当记者，读完社科院新闻系硕士后在光明日报做到总编辑，2001 年起任人民日报总编辑、社长。2008–2013 年任中宣部副部长兼国务院新闻办主任，2011 年起兼任首任国家网信办主任，法广称他是网络新闻管制的“沙皇”。
    2013 年起任全国人大常委会副委员长兼秘书长，2017 年进入政治局，2020、2021 年先后向人大作香港国安立法和选举制度决定草案的说明，被美国制裁。2019 年起兼任中国法学会会长，2023 年退休。
  positions:
    - { title: 光明日报总编辑, sys: other, from: 1995, to: 2000, cite: c02-gov-2017-10-25-19th-cvs }
    - { title: 人民日报社社长, sys: other, from: 2002, to: 2008, cite: c02-gov-2017-10-25-19th-cvs }
    - { title: 中央外宣办、国务院新闻办主任, sys: party, from: 2008, to: 2013, cite: c02-gov-2017-10-25-19th-cvs }
    - { title: 国家互联网信息办公室主任, sys: gov, from: 2011-05, to: 2013, cite: b19-gov-2011-05-04-cac }
    - { title: 全国人大常委会副委员长兼秘书长, sys: other, from: 2013-03, to: 2018-03, cite: c02-gov-2017-10-25-19th-cvs }
    - { title: 中央政治局委员, sys: party, from: 2017-10, to: 2022-10, cite: c02-xinhua-2017-10-25-19-1-plenum }
    - { title: 全国人大常委会副委员长, sys: other, from: 2018-03, to: 2023-03, cite: c02-xinhua-2018-03-17-npc-leaders }
    - { title: 中国法学会会长, sys: other, from: 2019-03, cite: b19-caixin-2019-03-20-law-society }
    - { title: 中国延安精神研究会会长, sys: other, cite: b19-gscn-2025-09-10-wang-yanan }
  life:
    - h: 宜君知青
      from: 1950
      to: 1974
      text: >-
        1950 年 12 月生，北京人。1969 年 1 月到陕西延安地区宜君县下乡插队，同年 12 月入党，1970 年起任宜君县委宣传部、县委办公室干部，1973 年调延安地委办公室。
        习近平同期在延安地区插队。自由亚洲电台的高新称王晨是习的“北京哥们”，并说习被推荐上大学时，是已在延安地委任职的王晨具体运作的；这一说法未见官方证实。
      cites: [c02-gov-2017-10-25-19th-cvs, f04-rfa-2017-10-09-wang-chen]
    - h: 光明日报与人民日报
      from: 1974
      to: 2008
      text: >-
        1974 年进光明日报社任国内部记者，1979–1982 年在中国社会科学院研究生院新闻系读硕士，回报社后历任政治经济部记者、群工部主任、总编室主任，1986 年任副总编辑，1995–2000 年任总编辑。
        2000 年任中宣部副部长，2001 年调任人民日报社总编辑，兼全国记协副主席，2002 年起任社长兼总编辑，2003–2008 年专任社长。财新说他是记者出身，在新闻界和宣传主管部门工作三十多年。
      cites: [c02-gov-2017-10-25-19th-cvs, b19-caixin-2019-03-20-law-society]
    - h: 国新办与网信办
      from: 2008
      to: 2013
      text: >-
        2008 年任中宣部副部长、中央外宣办和国务院新闻办主任。2010 年 1 月谷歌退出中国风波期间，他发表讲话说“淫秽色情信息、黑客攻击、网络欺诈等是网络安全的主要威胁”，要把关闭违法违规网站的工作常态化，还要广泛发动公众举报、落实举报奖励制度；法广称他是中国网络新闻管制的沙皇，认为讲话意在为互联网审查辩护。
        2011 年 5 月国务院设立国家互联网信息办公室，由他兼任主任。
      cites: [c02-gov-2017-10-25-19th-cvs, b19-rfi-2010-01-14-wang-internet, b19-gov-2011-05-04-cac]
    - h: 人大秘书长与法学会
      from: 2013
      to: 2019
      text: >-
        2013 年 3 月任十二届全国人大常委会副委员长兼秘书长、机关党组书记，2017 年十九届一中全会进入政治局，2018 年 3 月十三届全国人大连任副委员长，不再兼任秘书长。
        2019 年 3 月他接替王乐泉当选中国法学会会长，财新说在兼任群团组织一把手的副国级领导人中，他是唯一的政治局委员。他在就职讲话中说，决不能走西方“宪政”“三权鼎立”“司法独立”的路子。
      cites: [c02-gov-2017-10-25-19th-cvs, c02-xinhua-2017-10-25-19-1-plenum, c02-xinhua-2018-03-17-npc-leaders, b19-caixin-2019-03-20-law-society, b19-chinalaw-2019-03-20-wang-chen-speech]
    - h: 香港立法
      from: 2020
      to: 2021
      text: >-
        2020 年 5 月 22 日，他向十三届人大三次会议作建立健全香港维护国家安全法律制度和执行机制的决定草案说明，提出采取“决定+立法”的方式分两步推进：先由全国人大作决定并授权，再由人大常委会制定法律、列入基本法附件三。
        2021 年 3 月 5 日他又作完善香港选举制度的决定草案说明，称香港现行选举制度“存在明显的漏洞和缺陷”，方案以重新构建选举委员会并增加赋权为核心，确保“爱国者治港”。
        2021 年 3 月美国以香港问题制裁 24 名中港官员，CNN 报道他名列其中，并点明他是 25 人政治局的成员。
      cites: [b19-xinhua-2020-05-22-wang-hk-nsl, b19-people-2021-03-05-wang-hk-election, b19-cnn-2021-03-17-hk-sanctions]
    - h: 退休
      from: 2022
      to: 2026
      text: >-
        2022 年二十大，他与刘鹤、孙春兰等九人不再连任政治局委员，2023 年 3 月卸任人大副委员长。此后仍任中国延安精神研究会会长，2025 年 9 月在兰州出席该会工作经验交流会并讲话，要求把弘扬延安精神与弘扬抗战精神结合起来。2026 年春节前，他在中央领导看望的老同志名单上。
