- id: hui-liangyu
  name: 回良玉
  pinyin: Huí Liángyù
  gender: m
  ethnicity: 回族
  born: 1944-10
  birthplace: 吉林榆树
  education:
    - { school: 吉林省农业学校, from: 1961, to: 1964 }
    - { school: 吉林省委党校函授班, degree: 党政干部基础专业（大专）, from: 1984, to: 1987 }
  joinedParty: 1966-04
  joinedWork: 1964-08
  roles: [pb, cc, prov]
  status: retired
  statusNote: 2013 年 3 月卸任国务院副总理，2026 年春节仍在中央看望的老同志名单上。
  tier: 1
  headline: 国务院副总理（2003–2013）
  bio: >-
    回族，吉林榆树人。吉林省农业学校毕业后从榆树县农业局科员做起，在吉林农口干了二十多年，做到副省长。1990 年调任中央政策研究室副主任，此后历任湖北省委副书记、安徽省长和省委书记、江苏省委书记。
    2002 年进入政治局，2003–2013 年任两届国务院副总理，主管农林水利，被媒体称为“农”副总理，也是两届温家宝政府中唯一连任的副总理。任内推动 2004 年关注农业的中央一号文件出台，并坐镇指挥玉树地震救灾。
  positions:
    - { title: 榆树县委副书记, sys: party, place: 吉林, from: 1974, to: 1977, cite: c01-ifeng-2007-10-22-hui-liangyu }
    - { title: 吉林省委常委、省委农工部部长, sys: party, place: 吉林, from: 1985, to: 1987, cite: c01-ifeng-2007-10-22-hui-liangyu }
    - { title: 吉林省副省长, sys: gov, place: 吉林, from: 1987, to: 1990, cite: c01-ifeng-2007-10-22-hui-liangyu }
    - { title: 中央政策研究室副主任, sys: party, from: 1990, to: 1992, cite: c01-ifeng-2007-10-22-hui-liangyu }
    - { title: 湖北省委副书记, sys: party, place: 湖北, from: 1992, to: 1994, cite: c01-ifeng-2007-10-22-hui-liangyu }
    - { title: 湖北省政协主席, sys: other, place: 湖北, from: 1993, to: 1994, cite: c01-ifeng-2007-10-22-hui-liangyu }
    - { title: 安徽省省长, sys: gov, place: 安徽, from: 1994, to: 1998, cite: c01-ifeng-2007-10-22-hui-liangyu }
    - { title: 安徽省委书记, sys: party, place: 安徽, from: 1998, to: 1999, cite: c01-ifeng-2007-10-22-hui-liangyu }
    - { title: 江苏省委书记, sys: party, place: 江苏, from: 1999, to: 2002, cite: c01-ifeng-2007-10-22-hui-liangyu }
    - { title: 中央政治局委员, sys: party, from: 2002-11, to: 2012-11, cite: c01-ifeng-2007-10-22-hui-liangyu }
    - { title: 国务院副总理, sys: gov, from: 2003-03, to: 2013-03, cite: c01-gov-2018-03-19-state-council-history }
  life:
    - h: 榆树
      from: 1944
      to: 1977
      text: >-
        1944 年 10 月生，回族，吉林榆树人。1961–1964 年在吉林省农业学校学习，20 岁毕业后回到老家榆树县农业局当科员，1966 年 4 月入党。文革中下放县“五七”干校劳动一年，1969 年起在县革委会政治部、县委组织部任职，1972 年兼任于家公社党委书记，1974–1977 年任榆树县委副书记。
      cites: [c01-ifeng-2007-10-22-hui-liangyu, b19-sina-2008-03-18-hui-profile]
    - h: 吉林农口
      from: 1977
      to: 1990
      text: >-
        1977–1984 年任吉林省农业局副局长、省农牧厅副厅长，1984 年任白城地委副书记、行署专员。1985 年吉林省委班子调整，高狄升任省委书记，后来任国务院秘书长的王忠禹任副书记，他和杜青林、李德洙等人升任省委常委，兼省委农村政策研究室主任；1986 年改任恢复设立的省委农工部部长。
        高新语带讥讽地提到，他这一时期在省委党校函授班拿到了大专学历。1987–1990 年任吉林省副省长。
      cites: [c01-ifeng-2007-10-22-hui-liangyu, b19-rfa-2014-07-15-hui-gaoxin]
    - h: 进京与外放
      from: 1990
      to: 1999
      text: >-
        高新称，六四后主管组织工作的政治局常委宋平主张在农村重搞“社会主义教育运动”，依据的正是他的“吉林经验”；在高狄推荐下，他被调进京任中央政策研究室副主任兼农村组组长，宋平要他“到中央来上班”。高新说，他随即投其所好，建议在中央政策研究室增设“农村社会主义思想教育联络组”。
        1992 年他外放湖北任省委副书记，次年兼省政协主席；1994 年调安徽任代省长、省长，1998 年任安徽省委书记。
      cites: [b19-rfa-2014-07-17-hui-conservatives, c01-ifeng-2007-10-22-hui-liangyu]
    - h: 江苏
      from: 1999
      to: 2002
      text: >-
        官方简历记他 1999–2002 年任江苏省委书记，维基百科的历任书记表则作 2000 年 1 月至 2002 年 12 月；高新也说他和李源潮都是 2000 年初到江苏，一任书记、一任副书记。
        2002 年十六大，他和李源潮、省长季允石同被列入中央委员预选名单，江苏代表团大量跑票，李源潮落选中委、只当选候补。十六届一中全会后他进入政治局，江苏省委书记由李源潮接任。高新还写道，后来落马的杨卫泽在他和李源潮主政江苏时继续升迁，但真正的推手是李源潮。
      cites: [c01-ifeng-2007-10-22-hui-liangyu, p01-wiki-jiangsu-sec, f05-rfa-2015-01-08-yang-weize, k06-rfa-2024-04-15-yuan-jie]
    - h: “农”副总理
      from: 2003
      to: 2008
      text: >-
        2003 年 3 月任国务院副总理，主管农林水利。人物素描说，他上任后第一件事是去产粮最多的河南，此后视察的也大多是中西部农业省份；2003 年 9 月他经调研并请示温家宝后，促成了 2004 年关注农业的中央一号文件。
        2005 年两会在湖南代表团谈到农民工时，他感慨“农民工真不容易！”，还念起打工者的顺口溜“城市大楼我们盖，城市马路我们修”，最后却连工资都不给；他说下矿的矿工 80% 是农民工，“我们得带着感情看他们，善待他们”。
      cites: [b19-sina-2008-03-18-hui-profile, c01-gov-2018-03-19-state-council-history]
    - h: 第二任与救灾
      from: 2008
      to: 2026
      text: >-
        2008 年 3 月连任副总理，是新一届政府中唯一留任的副总理。2010 年 4 月 14 日青海玉树 7.1 级地震当天，他以国务院抗震救灾总指挥部总指挥身份飞抵结古镇，连夜主持会议作出十项部署，强调“当前抗震救灾工作第一位的任务是全力救人”，并要确保受灾群众有饭吃、不受冻。
        2012 年 3 月在江苏徐州的全国春季农业生产工作会议上，他要求念好“好、抗、高、强、实”五字诀。2013 年 3 月卸任，2026 年春节前仍在中央看望的老同志名单上。
      cites: [b19-sina-2008-03-18-hui-profile, b19-chinanews-2010-04-15-hui-yushu, b19-cntv-2012-03-23-hui-spring, c01-gov-2018-03-19-state-council-history, b19-xinhua-2026-02-13-old-comrades]
  assess:
    - voice: official
      quote: true
      text: 农业系统出身的回良玉为此倾注了诸多心血。
      cite: b19-sina-2008-03-18-hui-profile
    - voice: zh
      quote: true
      text: 农学专业出身的则只有回良玉一人。第二个理由是回良玉是回族人，他还可以充当那届中央领导集体中唯一一位少数民族代表。
      cite: b19-rfa-2014-07-15-hui-gaoxin
    - voice: zh
      quote: true
      text: 回良玉在高狄的推荐下能令江泽民相信是“不可多得的懂农业的干部”，从吉林奉调进京出任该研究室副主任兼农村组长，也还是因为他积极迎合了在“六四”事件之后升任政治局常委主管中央组织工作的宋平的极左思路。
      cite: b19-rfa-2014-07-17-hui-conservatives
  ids: { wikidata: Q957744 }
  cites: [wd-Q957744, c01-ifeng-2007-10-22-hui-liangyu, c01-gov-2018-03-19-state-council-history, b19-sina-2008-03-18-hui-profile, b19-rfa-2014-07-15-hui-gaoxin, b19-rfa-2014-07-17-hui-conservatives, b19-chinanews-2010-04-15-hui-yushu, b19-cntv-2012-03-23-hui-spring, p01-wiki-jiangsu-sec, f05-rfa-2015-01-08-yang-weize, k06-rfa-2024-04-15-yuan-jie, b19-wiki-hui-liangyu, b19-xinhua-2026-02-13-old-comrades]

- id: liu-yandong
  name: 刘延东
  pinyin: Liú Yándōng
  gender: f
  ethnicity: 汉族
  born: 1945-11-22
  birthplace: 江苏淮安
  origin: 江苏南通
  education:
    - { school: 清华大学工程化学系, from: 1964, to: 1970 }
    - { school: 中国人民大学社会学系, degree: 社会学硕士（在职）, from: 1990, to: 1994 }
    - { school: 吉林大学行政学院, degree: 政治学理论专业法学博士（在职）, from: 1994, to: 1998 }
  joinedParty: 1964-07
  joinedWork: 1970-03
  roles: [pb, cc, minister]
  status: retired
  statusNote: 2017 年十九大退出政治局，2018 年 3 月卸任副总理；2019–2023 年任国际儒学联合会会长，2026 年春节仍在中央看望的老同志名单上。
  tier: 1
  headline: 国务院副总理（2013–2018）、政治局委员（2007–2017）
  bio: >-
    清华大学工程化学系毕业，在唐山、北京的化工厂工作十年后转入北京市委组织部。1982–1991 年任共青团中央书记处书记、常务书记，先后与王兆国、胡锦涛共事；此后在中央统战部工作二十年，2002 年任部长，2003 年任全国政协副主席。
    2007 年进入政治局，是继邓颖超之后第二位连任的女性政治局委员；2008 年任国务委员，2013–2018 年任国务院副总理，分管教育、卫生、体育等，兼任中国足球改革领导小组组长。2012 年未能进入常委。2019–2023 年任国际儒学联合会会长。
  positions:
    - { title: 共青团中央书记处书记、常务书记, sys: party, from: 1982, to: 1991, cite: c01-people-2013-03-16-liu-yandong }
    - { title: 中央统战部副部长, sys: party, from: 1991, to: 2002, cite: c01-people-2013-03-16-liu-yandong }
    - { title: 中央统战部部长, sys: party, from: 2002, to: 2007, cite: c01-people-2013-03-16-liu-yandong }
    - { title: 全国政协副主席, sys: other, from: 2003, to: 2008, cite: c01-people-2013-03-16-liu-yandong }
    - { title: 中央政治局委员, sys: party, from: 2007-10, to: 2017-10, cite: c01-people-2013-03-16-liu-yandong }
    - { title: 国务委员, sys: gov, from: 2008-03, to: 2013-03, cite: c01-people-2013-03-16-liu-yandong }
    - { title: 国务院副总理, sys: gov, from: 2013-03, to: 2018-03, cite: c01-gov-2018-03-19-state-council-history }
    - { title: 国际儒学联合会会长, sys: other, from: 2019-11, to: 2023-11, cite: b19-ica-2019-11-20-liu-president }
  life:
    - h: 清华与化工厂
      from: 1945
      to: 1980
      text: >-
        1945 年 11 月生，籍贯江苏南通，维基百科记她生于淮安；父亲刘瑞龙，BBC 说他做过农业部副部长。1964 年考入清华大学工程化学系，同年 7 月入党，在校任年级政治辅导员。
        1970 年到唐山开平化工厂当工人、技术员，1972 年调北京化工实验厂，从工人做到厂党委副书记。
      cites: [c01-people-2013-03-16-liu-yandong, b19-wiki-liu-yandong, b19-bbcen-2012-03-05-liu-yandong]
    - h: 团中央九年
      from: 1980
      to: 1991
      text: >-
        1980 年调北京市委组织部，1981 年任朝阳区委副书记。1982 年进入团中央，任书记处书记、常务书记，兼全国青联副主席、主席。1982 年 12 月团十一大，她与胡锦涛同时进入书记处，第一书记是王兆国；维基百科说她在团中央先后与王兆国、胡锦涛、宋德福三任负责人共事。高新称她和李源潮是胡锦涛在团中央书记处的左右臂膀。
      cites: [c01-people-2013-03-16-liu-yandong, f05-people-2013-06-21-cyl-secretaries, b19-wiki-liu-yandong, f05-rfa-2023-01-13-wang-zhaoguo-xi]
    - h: 统战部二十年
      from: 1991
      to: 2007
      text: >-
        1991 年转任中央统战部副秘书长，随后升副部长，兼中央社会主义学院党组书记、宋庆龄基金会副主席，其间在职读完人民大学社会学硕士和吉林大学政治学博士。2002 年任统战部部长，2003 年当选全国政协副主席。
        詹姆斯敦基金会 2006 年刊登的李成文章，把她列为团派进入下一届领导层的四名热门人选之一。
      cites: [c01-people-2013-03-16-liu-yandong, c01-jamestown-2006-cheng-li-two-factions]
    - h: 国务委员
      from: 2007
      to: 2012
      text: >-
        2007 年十七届一中全会进入政治局，2008 年 3 月任国务委员，兼北京奥运会组委会副主席、国家科技教育领导小组副组长。BBC 2012 年介绍她时说，她在中国高层政治中极为罕见，因为她是女性；她与胡锦涛有工作渊源，又是父辈为革命元老的“太子党”。BBC 还说，有分析人士据此把她看作改革派，但很难说她愿意接受多大的变革；她当时 66 岁，即便入常也大概只能做一届。
        2012 年 8 月北戴河会期，BBC 中文转述日媒说，她与李源潮、令计划一同抵达，被看好进入新一届常委。
      cites: [c01-people-2013-03-16-liu-yandong, b19-bbcen-2012-03-05-liu-yandong, r01-bbc-2012-08-07-jp-beidaihe]
    - h: 副总理
      from: 2012
      to: 2018
      text: >-
        2012 年十八大她连任政治局委员但未进常委。布鲁金斯学会的李成指出，三名年龄合格却未能入常的上届政治局委员都是团派，她是唯一的女性人选。2013 年 3 月由李克强提名任副总理，是第四位女副总理。
        任内分管教育、卫生、体育等，2015–2018 年任中国足球改革领导小组组长，2015 年 8 月在足球改革发展工作会议上要求打好振兴中国足球的攻坚战。2016 年 12 月她要求高校领导做“中国特色社会主义高校政治家、教育家”；同月与中医药高校教学名师座谈，说 60 年来中医药高等教育培养了近 200 万专门人才。
      cites: [f01-brookings-2013-02-10-princelings, b19-wiki-liu-yandong, b19-sport-2015-08-17-liu-football, b19-gov-2016-12-09-liu-universities, b19-gov-2016-12-30-liu-tcm]
    - h: 退休与儒联
      from: 2017
      to: 2026
      text: >-
        2017 年十九大，71 岁的她退出政治局，2018 年 3 月卸任副总理。詹姆斯敦基金会 2016 年曾预计她退休后会转任人大或政协职务，但她没有再任国家级职务。2019 年 11 月当选国际儒学联合会第六届会长，2023 年 11 月由孙春兰接任。2026 年春节前，她在中央领导看望的老同志名单上。
      cites: [c01-gov-2018-03-19-state-council-history, f05-jamestown-2016-cyl-eclipse, b19-ica-2019-11-20-liu-president, b19-ica-2023-11-10-sun-succeeds, b19-xinhua-2026-02-13-old-comrades]
  assess:
    - voice: west
      quote: true
      text: She is also well-connected. She has work ties to the man in charge at the moment, President Hu Jintao, and is a "princeling", one of a group of senior leaders whose parents were important revolutionaries or officials.
      zh: 她的人脉也很广：她与现任掌权者胡锦涛主席有工作渊源，又是“太子党”——父母是重要革命者或官员的一批高层领导人之一。
      cite: b19-bbcen-2012-03-05-liu-yandong
    - voice: scholar
      quote: true
      text: There were three eligible candidates who served on the previous politburo and met the age requirement but failed to be elevated to the PSC at the 18th Party Congress—all were tuanpai leaders. These include the only woman candidate, State Councilor Liu Yandong……All three, especially Wang and Li, are regarded as staunch advocates of political reform.
      zh: 上届政治局中有三名符合年龄要求的候选人在十八大未能进入常委，全都是团派领导人，其中包括唯一的女性候选人、国务委员刘延东……三人（尤其是汪洋和李源潮）都被视为政治改革的坚定支持者。
      cite: f01-brookings-2013-02-10-princelings
    - voice: zh
      quote: true
      text: 所谓的“红色基因”决定了习近平与象刘延东，还有栗战书等“团派太子党”之间依然还是“血浓于水”。
      cite: c01-rfa-2015-02-10-gao-xin-tuanpai-princelings
  family:
