- id: wang-zhaoguo
  name: 王兆国
  pinyin: Wáng Zhàoguó
  gender: m
  ethnicity: 汉族
  born: 1941-07-14
  birthplace: 河北丰润
  education:
    - { school: 哈尔滨工业大学动力机械系, degree: 涡轮机专业, from: 1961, to: 1966 }
  joinedParty: 1965-12
  joinedWork: 1966-09
  roles: [pb, sec, cc, prov, minister]
  status: retired
  statusNote: 2013 年 3 月卸任全国人大常委会副委员长和全国总工会主席，2026 年春节仍在中央看望的老同志名单上。
  tier: 1
  headline: 全国人大常委会副委员长（2003–2013）、全国总工会主席（2002–2013）
  bio: >-
    河北丰润人，哈工大涡轮机专业毕业，在第二汽车制造厂从技术员做到党委书记。1982 年任团中央第一书记，胡锦涛是他的副手；1984 年任中办主任，1985 年进入中央书记处。
    1987 年他被调任福建省长、退出书记处，此后长期主管对台和统战，任国台办主任、中央统战部部长、全国政协副主席。2002–2012 年为政治局委员，2003–2013 年任全国人大常委会副委员长兼全国总工会主席，先后向人大作《反分裂国家法》《物权法》草案说明。
  positions:
    - { title: 第二汽车制造厂党委书记, sys: other, from: 1979, to: 1982, cite: c01-people-2013-02-26-wang-zhaoguo }
    - { title: 共青团中央书记处第一书记, sys: party, from: 1982, to: 1984, cite: c01-people-2013-02-26-wang-zhaoguo }
    - { title: 中央办公厅主任, sys: party, from: 1984, to: 1986, cite: c01-people-2013-02-26-wang-zhaoguo }
    - { title: 中央书记处书记, sys: party, from: 1985, to: 1987, cite: c01-people-2013-02-26-wang-zhaoguo }
    - { title: 福建省省长, sys: gov, place: 福建, from: 1987, to: 1990, cite: c01-people-2013-02-26-wang-zhaoguo }
    - { title: 国务院台湾事务办公室主任, sys: gov, from: 1990, to: 1996, cite: c01-people-2013-02-26-wang-zhaoguo }
    - { title: 中央统战部部长, sys: party, from: 1992, to: 2002, cite: c01-people-2013-02-26-wang-zhaoguo }
    - { title: 全国政协副主席, sys: other, from: 1993, to: 2003, cite: c01-people-2013-02-26-wang-zhaoguo }
    - { title: 中央政治局委员, sys: party, from: 2002-11, to: 2012-11, cite: c01-people-2013-02-26-wang-zhaoguo }
    - { title: 全国人大常委会副委员长, sys: gov, from: 2003-03, to: 2013-03, cite: c01-people-2013-02-26-wang-zhaoguo }
    - { title: 中华全国总工会主席, sys: other, from: 2002, to: 2013-03, cite: c01-people-2013-02-26-wang-zhaoguo }
  life:
    - h: 二汽
      from: 1941
      to: 1982
      text: >-
        1941 年 7 月生于河北丰润。1961–1966 年在哈尔滨工业大学动力机械系涡轮机专业学习，毕业后留校待分配两年，1968 年随第一汽车制造厂包建第二汽车制造厂，在车桥厂当技术员；1971 年起任车桥厂团委副书记、二汽团委书记，1979–1982 年任二汽副厂长、党委书记。
        高新转述的说法是，邓小平 1980 年视察二汽时听说他在 1976 年“批邓”时坚决不批邓，召见后向中央推荐了他。
      cites: [c01-people-2013-02-26-wang-zhaoguo, f05-rfa-2023-01-13-wang-zhaoguo-xi]
    - h: 团中央与中办
      from: 1982
      to: 1987
      text: >-
        高新称胡耀邦视察湖北时也专门召见他，并安排他到中央党校受训。1982 年 12 月团十一大选举他为团中央书记处第一书记，兼中央团校校长，胡锦涛、刘延东等同时进入书记处，李源潮、李克强、刘奇葆后来增选。
        1984 年 12 月他把第一书记交给胡锦涛，转任中共中央办公厅主任，高新说温家宝当时是他的副手；1985 年起又任中央书记处书记、中直机关党委书记。
      cites: [c01-people-2013-02-26-wang-zhaoguo, f05-people-2013-06-21-cyl-secretaries, f05-rfa-2023-01-13-wang-zhaoguo-xi]
    - h: 下放福建
      from: 1987
      to: 1990
      text: >-
        高新写道，1987 年 8 月主持十三大人事筹备的薄一波找他谈话，传达邓小平、陈云的意见，要他到福建接任省长，十三大上不再留任书记处书记，这等于把他从副国级降为正省级。于泽远则把这次调动与同年胡耀邦下台、团派受挫联系在一起。
        他在福建任省委副书记、代省长、省长到 1990 年。高新称他在福建时曾在省委内部竭力推荐习近平。
      cites: [f05-rfa-2023-01-13-wang-zhaoguo-xi, f05-thinkhk-2022-10-24-tuanpai, c01-people-2013-02-26-wang-zhaoguo]
    - h: 对台与统战
      from: 1990
      to: 2002
      text: >-
        1990 年调回北京任国务院台湾事务办公室主任，1991 年兼中央台湾工作办公室主任，1992 年起任中央统战部部长，1993 年起兼任全国政协副主席。台办主任一职做到 1996 年，统战部长做到 2002 年。2002 年十六大进入政治局，同年任中华全国总工会主席。
      cites: [c01-people-2013-02-26-wang-zhaoguo]
    - h: 两部法律
      from: 2003
      to: 2008
      text: >-
        2003 年起任十届、十一届全国人大常委会副委员长、党组副书记。2005 年 3 月 8 日，他向十届人大三次会议作《反分裂国家法（草案）》说明，称采取非和平方式是“不得已作出的最后选择”。
        2007 年 3 月 8 日他又作《物权法（草案）》说明，强调对国家、集体和私人的物权实行平等保护。《纽约时报》后来形容他“曾经带头支持一项保护私有财产的标志性法律”。
      cites: [c01-people-2013-02-26-wang-zhaoguo, b19-chinanews-2005-03-08-anti-secession, b19-sina-2007-03-08-property-law, c04-nyt-2015-04-28-wang-jianlin]
    - h: 算不算团派
      from: 2002
      to: 2012
      text: >-
        他是否算团派，说法不一。China Media Project 的钱钢 2007 年写道，他当过团中央第一书记，但没有人把他与“团派”联系在一起。高新则称他是“团派”出身，在十六届政治局“比选”接班人时，他没有把票投给同样做过团中央第一书记的李克强，而是投给了习近平。于泽远的文章称他为团派大将。
      cites: [f05-cmp-2007-09-14-factions, f05-rfa-2023-01-13-wang-zhaoguo-xi, f05-thinkhk-2022-10-24-tuanpai]
    - h: 卸任
      from: 2012
      to: 2026
      text: >-
        2012 年十八大退出政治局。2013 年 3 月 1 日，全总十五届七次执委会议选举李建国接任全国总工会主席，会议对他领导全总以来的工作给予高度评价；同月十二届全国人大换届，他卸任副委员长。2026 年春节前，他在中央领导看望的老同志名单上。
      cites: [b19-people-2013-03-02-acftu, b19-xinhua-2026-02-13-old-comrades]
  assess:
    - voice: scholar
      quote: true
      text: Then there is Wang Zhaoguo (王兆国), who served formerly as first secretary of the youth league. No one associates Wang with the “Youth League faction.”
      zh: 再如王兆国，他曾任团中央第一书记，但没有人把他与“团派”联系在一起。
      cite: f05-cmp-2007-09-14-factions
    - voice: zh
      quote: true
      text: 正是这个“团派”出身的王兆国，在福建省任职时即在省委内部竭力推荐习近平担当重任
      cite: f05-rfa-2023-01-13-wang-zhaoguo-xi
    - voice: zh
      quote: true
      text: 1987年，胡耀邦因反對「自由化」不力，被迫辭去總書記職務，團派大將王兆國從中辦主任調任福建省長
      cite: f05-thinkhk-2022-10-24-tuanpai
    - voice: official
      quote: true
      text: 对王兆国同志领导中华全国总工会以来的工作给予高度评价
