# E09: folk lane — buzzwords, memes, self-mockery and censorship, 2000–2026.

# ---------- 2000–2008 ----------
- id: e09-2000-moha
  date: 2000-10
  end: 2022-11
  title: “图样图森破”与膜蛤文化
  lane: folk
  major: true
  summary: 2000年10月，江泽民与上京述职的董建华在人民大会堂见记者，被香港有线电视记者张宝华追问是否“钦定”董连任，当场训斥数分钟，“图样图森破”等语录日后被反复引用。2007年前后完整视频传上YouTube，在校内网流行，被视为膜蛤文化起源。2016年江90岁生日网民“为长者祝寿”，凤凰财经的祝寿微博被网信办下令删除；墙内膜蛤屡遭打压，部分蛤丝2017年转往YouTube成立“新蛤社”。
  people: [jiang-zemin, dong-jianhua]
  cites: [e09-cdt-space-moha]

- id: e09-2008-dajiangyou
  date: 2008
  title: “打酱油”
  lane: folk
  summary: 2008年，广州电视台《今日报导》街头随机采访市民对“艳照门”的看法，一名男子从容答道“关我屌事，我出来买酱油的……”。“打酱油”由此成为网络流行语，多用来表示对政治及其他敏感话题不发表意见、置身事外，是网民面对敏感议题时一种半自嘲、半自保的表态。
  cites: [e09-cdt-space-dajiangyou]

- id: e09-2008-cnn
  date: 2008-04
  title: “做人不能太CNN”
  lane: folk
  summary: 2008年，美国CNN报道拉萨骚乱时被指把暴徒袭击军车的照片裁成局部特写，主播卡弗蒂又在奥运火炬在美传递期间称中国人是“一群五十年不变的呆子和暴徒”，引发全球华人签名抗议。“做人不能太CNN”随之风靡网络，网络歌手慕容萱还写成歌曲《做人别太CNN》。央视网年终把它列为2008网络流行语，释义为“是非不分，歪曲新闻事实”。
  cites: [e09-cctv-2008-12-23-cnn]

- id: e09-2008-pimin
  date: 2008-10-29
  title: “屁民”
  lane: folk
  summary: 2008年10月29日，深圳海事局书记林嘉祥被指猥亵11岁女童，并冲围观民众喊“我级别和你们市长一样高，你们算个屁！”。“屁民”随即窜红，逐渐取代“草民”成为老百姓的自称。萧强在2014年TEDx演讲中说，这个词体现了网民对公民身份的认同、渴望、抗争和坚守；长平则认为“算个屁”更准确地代表了权贵对民众的态度。
  cites: [e09-cdt-space-pimin]

# ---------- 2009 ----------
- id: e09-2009-kuasheng-zhuibu
  date: 2009-03-06
  title: “跨省追捕”
  lane: folk
  summary: 2009年2月，在上海的河南灵宝青年王帅发帖揭露家乡政府违法“租”用农地，3月6日灵宝网警跨省到上海以“诽谤罪”将他抓回，关押8天。内蒙古吴保全也因发帖批评征地两度遭跨省追捕，被判刑2年。“跨省追捕”迅速流行，指地方公权力跨省抓捕网上批评者。后来宁夏吴忠也通报纠正跨省刑拘王鹏的错案，免职相关官员。
  concepts: [stability-maintenance]
  cites: [e09-cdt-space-kuasheng]

- id: e09-2009-bei-daibiao
  date: 2009-03
  end: 2009-12
  title: “被代表”与“被”时代
  lane: folk
  summary: 2009年全国两会期间，网友把并非民选产生的人大代表、政协委员“代表民众”发言戏称为“被代表”，两会也成了“被代表大会”；当届人大工农代表仅占8.24%，官员却占83.6%。“被”字句式随即泛化为“被就业”“被自杀”“被幸福”“被捐款”等，用来讽刺官方宣传的虚假，“被”字还在“汉语盘点2009”中当选年度汉字。
  cites: [e09-cdt-space-beidaibiao]

- id: e09-2009-qishima
  date: 2009-05-08
  end: 2009-05-14
  title: “70码”与“欺实马”
  lane: folk
  summary: 2009年5月7日晚，20岁的胡斌在杭州驾改装跑车撞死斑马线上的浙大毕业生谭卓。次日交警通报车速为“70公里/小时左右”，现场哗然，“70码”成了最热的网络新名词，网友还在互动百科造出新物种“欺实马”。5月14日杭州警方公布鉴定，车速在84.1至101.2公里/小时之间且车辆改装，并称胡斌已获释是谣言。
  cites: [e09-infzm-2009-05-14-qishima, e09-cctv-2009-05-15-hangzhou-speed]

- id: e09-2009-lvba-niang
  date: 2009-06
  end: 2009-06-30
  title: “绿坝娘”与罢网
  lane: folk
  major: true
  summary: 工信部6月19日通知，7月1日起境内出售的电脑须预装过滤软件“绿坝-花季护航”。网民认为其真实用意是强化网络控制，动漫爱好者把它拟人化为“绿坝娘”调侃；据称其数据库中要屏蔽的政治信息近六倍于色情暴力信息。艾未未号召7月1日罢网抗议。6月30日官方在国内舆论和国际压力下宣布推迟预装，艾未未称这是“网民的一个胜利”。
  people: [ai-weiwei]
  concepts: [harmonious-society]
  cites: [e09-cdt-space-lvba-niang, e09-cdt-space-hexie, e09-bbc-2009-07-01-green-dam]

- id: e09-2009-lu-jun
  date: 2009-06-17
  title: “替党说话，还是替老百姓说话”
  lane: folk
  summary: 2009年6月17日，中央人民广播电台记者追问郑州经济适用房用地为何建起别墅，郑州市规划局副局长逯军反问“你是替党说话，还是替老百姓说话？”，舆论一致谴责，被视为官员权力傲慢的写照，《人民日报》也发文批评。郑州随即要求他停职接受调查；2011年媒体发现他已低调复出，郑州市委称不公开是因为没有记者问起。
  cites: [e09-chinanews-2009-06-23-lu-jun, e09-bbc-2011-08-12-lu-jun-back]

# ---------- 2010–2011 ----------
- id: e09-2010-kong-yizi
  date: 2010-12-10
  title: “空椅子”
  lane: folk
  major: true
  summary: 2010年12月奥斯陆诺贝尔和平奖颁奖礼上，为无法到场的刘晓波摆放了一张空椅子。“空椅子”随即被网民用来绕开对刘晓波名字的审查，但很快也被屏蔽，转发、点赞空椅子照片的账号遭封禁。12月12日《南方都市报》头版刊出含三把空椅子、五只仙鹤的亚残运会彩排照，被广泛解读为致意。2017年刘晓波去世后，“刘晓B”“648”乃至蜡烛表情都被屏蔽。
  people: [liu-xiaobo]
  concepts: [charter-08]
  cites: [e09-cdt-space-kong-yizi]

- id: e09-2011-guo-meimei
  date: 2011-06
  end: 2011-12-31
  title: 郭美美与红会信任危机
  lane: folk
  summary: 20岁的郭美美以“中国红十字会商业总经理”的认证身份在新浪微博炫富，引发网民和媒体追问红会善款流向，审计署又揭出红会420万元超额采购。郭美美后承认身份系“杜撰”，红会7月1日深夜宣布暂停“商业红会”一切活动，舆论普遍认为事件反映公益组织长期欠缺透明度。12月31日红会公布调查报告，称郭美美与红会无任何关系，并撤销商红会。
  cites: [e09-bbc-2011-07-02-red-cross, e09-bbc-2011-12-31-guo-meimei-report]

- id: e09-2011-fang-binxing
  concepts: [great-firewall]
  date: 2011-05
  end: 2013-06
  title: 扔鞋、“滚”与“祝病魔早日战胜方校长”
  lane: folk
  summary: 被网民称为“中国防火墙之父”的方滨兴，2011年5月到武汉大学演讲前，推特上发起“#随手扔方校长解救中国互联网”悬赏，网友寒君依当场向他扔鞋和鸡蛋。2013年2月他发微博拜年，近万条转发几乎清一色是“滚”，他随即关闭评论。同年6月他以“身体原因”请辞北邮校长，跟帖中转发最多的一句是“祝病魔早日战胜方校长”。
  cites: [e09-cdt-space-fanqiang, e09-cdt-space-fang-binxing, e09-cdt-space-bingmo]

# ---------- 2012 ----------
- id: e09-2012-xiujiashi-zhiliao
  date: 2012-02-08
  title: “休假式治疗”
  lane: folk
  summary: 2012年2月8日，重庆市政府新闻办微博称副市长王立军“因长期超负荷工作，精神高度紧张，身体严重不适”，经同意“现正在接受休假式的治疗”。而据中国数字时代词条，他2月7日夜间在美国驻成都领馆寻求庇护被拒，随后被中方押往北京。官方委婉说法与真相的落差，使“休假式治疗”成为网民的讽刺用语。
  people: [wang-lijun]
  cites: [e09-cdt-space-xiujiashi]

- id: e09-2012-bei-zisha
  date: 2012-06-06
  end: 2012-07-12
  title: 李旺阳之死与“被自杀”
  lane: folk
  summary: 2012年5月22日，李旺阳接受香港有线电视采访，揭露狱中遭受酷刑，节目于六四前夕播出。6月6日清晨他被发现在医院窗前“吊颈身亡”，湖南公安抢走遗体，9日未经家属同意火化；10日香港万人游行要求调查。7月12日当局公布调查结果称确系“自杀”。“被自杀”一词由此流行，维权与异议人士在推特、微博纷纷发表“我不自杀”声明。
  cites: [e09-cdt-space-li-wangyang, e09-cdt-space-bei-zisha]

- id: e09-2012-ni-xingfu-ma
  date: 2012-09-29
  end: 2012-10
  title: “你幸福吗？”“我姓曾”
  lane: folk
  summary: 2012年国庆长假期间，央视推出街头采访专题“你幸福吗”。9月29日播出的节目里，山西清徐一名中年男子先推脱“我是外地打工的，不要问我”，被追问后答“我姓曾”，迅速走红网络。主创称这一提问不带政治任务，“没有预见会爆红”。也有网友评论，与其说中国人是幸福的，“不如说他们是幸运的”，建议央视别再问这类虚无浮夸的话题。
  cites: [e09-chinanews-2012-10-13-xingfu, e09-bbc-2012-10-17-xingfu]

- id: e09-2011-diaosi
  date: 2011
  end: 2014-12-02
  title: “屌丝”
  lane: folk
  summary: “屌丝”源自百度贴吧中的骂战，后被年轻人拾起用于自嘲，表达疏离与缺乏抱负。2011年底该词在谷歌的搜索结果达4110万、新浪微博超过220万条，成为众多大陆男青年的口头禅，还催生《屌丝男士》等作品，2013年4月一度登上纽约时代广场广告牌。《人民日报》2014年12月2日刊文对它的流行表示担忧。中国数字时代认为它与十年后的“躺平”逻辑相通。
  cites: [e09-cdt-space-diaosi]

- id: e09-2012-zhengnengliang
  concepts: [positive-energy]
  date: 2012-12
  end: 2014-10
  title: “正能量”
  lane: folk
  summary: “正能量”2012年末被《咬文嚼字》评为年度十大网络流行语之首。2013年8月，国信办主任鲁炜要求互联网公司“要传播网络正能量”；2014年10月，习近平在文艺工作座谈会上寄语周小平、花千芳“要创作更多正能量作品”，它由此进入宣传体系，成为官方话语。网友讽刺：一块写着“自由、平等、公正、法治”的牌子，“放在公园里就是正能量，拿起来上街那就是负能量”。
  people: [lu-wei, xi-jinping]
  cites: [e09-cdt-space-zhengnengliang]

# ---------- 2014–2016 ----------
- id: e09-2014-fanqiang
  concepts: [great-firewall]
  date: 2014-11
  end: 2023-11
  title: “翻墙”入罪与翻墙工具的接连停更
  lane: folk
  major: true
  summary: 2014年11月，翻墙工具“枫叶香蕉”开发者许东以“寻衅滋事罪”被捕，被称为“大陆翻墙第一案”；2015年8月Shadowsocks作者被“喝茶”后中止维护。2020年10月，浙江政务服务网公示80多份“翻墙处罚决定书”，理由均为“擅自建立、使用非法定信道国际联网”。2023年4月央视新闻意外播出程序员用Clash翻墙的画面，同年11月Clash for Windows删库停更。
  cites: [e09-cdt-space-fanqiang]

- id: e09-2014-apec-lan
  date: 2014-11-03
  title: “APEC蓝”
  lane: folk
  summary: 2014年北京APEC会议期间，京津冀实施道路限行、污染企业停工等措施保障空气质量。11月3日上午8点，北京城六区PM2.5浓度降到每立方米37微克，接近一级优。网友把这种靠限行和停工换来、只在会议期间出现的蓝天称为“APEC蓝”，调侃好空气要靠行政命令临时“保障”。
  cites: [e09-cdt-space-apec-blue]

- id: e09-2015-zhaojiaren
  date: 2015-12
  end: 2016-06
  title: “赵家人”
  lane: folk
  major: true
  summary: 万科宝能股权之争期间，文章《细思极恐的万科宝能之争：门口野蛮人，背后赵家人》把资本市场分为“散，庄，财阀，赵家人”四层，用最顶层的“赵家人”指既握财富又握权力的中共权贵，衍生出“赵国”“贵赵”等词。中宣部随即下令媒体不得使用。2016年2月博客“编程随想”在GitHub发布权贵关系项目“Zhao”，6月中国网络空间安全协会致信要求删除。
  cites: [e09-cdt-space-zhaojiaren]

- id: e09-2016-wumao-ziganwu
  date: 2016
  title: “五毛”与“自干五”
  lane: folk
  major: true
  summary: “五毛党”指受政府部门、高校、网站雇用或指导，以普通网民身份发帖拥护政府、围攻批评声音的网络评论员，名称源于网民猜测他们每帖可得五角钱。2016年哈佛学者Gary King团队研究称，五毛每年产出约4.48亿个帖子。亲官方的普通网民则被讥为“自带干粮的五毛”即“自干五”，不少人却以此自称，《光明日报》称赞自干五为“好网民”。
  concepts: [little-pink]
  cites: [e09-cdt-space-wumao, e09-cdt-space-ziganwu]

- id: e09-2016-tongshang-kuanyi
  date: 2016-09-04
  title: “通商宽衣”
  lane: folk
  summary: 2016年9月4日，习近平在G20杭州峰会开幕演讲中把《国语·晋语四》的“轻关易道，通商宽农”读成“通商宽衣”。宣传部门随即要求微博、微信、论坛等平台屏蔽“通商宽农”及相关内容，24小时监控、手动清理并每两小时汇报，且不得用后台关键词屏蔽；新华社等网站的演讲音频也删去了这一句。这一口误随后被网民收入“辱包”语料。
  people: [xi-jinping]
  cites: [e09-cdt-space-ruxia]

# ---------- 2017–2019 ----------
- id: e09-2017-xi-baozi
  date: 2017-07-07
  end: 2017-08-24
  title: 称“习包子”被行政拘留
  lane: folk
  summary: 2017年7月，湖南张家界网民敬迎军因发文批评“习包子”，被以“侮辱党和国家领导人”为由行政拘留七天，被认为是官方首次承认民间对最高领导人的这一戏称。8月24日，罗平一网民因在微信群发布“习包子，量中华之物力接与国之欢心”被行拘，消息引来大量调侃，曲靖警方随即删除官方微博、微信上的相关内容，新浪微博相关转发也遭封杀。
  people: [xi-jinping]
  cites: [e09-cdt-space-xibaozi]

- id: e09-2018-xiuxian-shencha
  date: 2018-02-25
  end: 2018-03
  title: 修宪消息后的“袁世凯”“移民”与“客车司机”
  lane: folk
  major: true
  summary: 2018年2月25日新华社发布取消国家主席任期限制的修宪建议后，社交媒体“一石激起千层浪”。《我为什么想当皇帝——袁世凯采访手记》在朋友圈热传后被删；百度指数上“移民”数小时内从不到100飙升至近2500，随后“袁世凯”在微博被屏蔽、“移民”指数被隐藏。3月两会期间，知乎提问“客车司机连续疲劳驾驶不换班”被指影射修宪，知乎App被下架七天。
  people: [xi-jinping]
  concepts: [core]
  cites: [e09-bbc-2018-02-26-term-limits, e09-cdt-space-ruxia]

- id: e09-2018-mitu
  date: 2018-01
  end: 2019-07
  title: “米兔”
  lane: folk
  summary: 2018年1月，北航博士毕业生罗茜茜实名举报教授陈小武性骚扰，“#MeToo在中国#”话题1月17日被封禁前阅读量达四百五十万。因相关话题屡遭审查，女权主义者改用谐音“米兔”。7月，前央视实习生弦子指控主持人朱军性骚扰，《财新》的采访报道遭全网删除，她的诉讼后被法院驳回。2019年7月，北京、成都、广州等地的米兔展览相继被取消。
  cites: [e09-cdt-space-mitu]

- id: e09-2019-dijihong-gaojihei
  date: 2019-02
  end: 2022-09-05
  title: “低级红、高级黑”写进中央文件
  lane: folk
  summary: 2019年2月，《中共中央关于加强党的政治建设的意见》要求不得搞任何形式的“低级红、高级黑”，这个说法正式进入中央文件，指把口号喊得震天响却适得其反、甚至“打着拥护的旗号，行诋毁之实”的表现。典型如2016年南昌铁路官微宣传新婚夫妇洞房夜抄写党章、按红手印，引来排山倒海的讽刺。2022年9月5日“浙江宣传”刊文细数其六种形式。
  cites: [e09-cdt-space-dijihong2]

- id: e09-2019-azhong-gege
  date: 2019-08-14
  end: 2019-08-18
  title: “阿中哥哥”与“饭圈治国”
  lane: folk
  summary: 2019年8月14日，饭圈女孩联合帝吧网友“出征”海外社交平台，用口号、表情包刷屏“开撕”香港示威者，并把中国比作偶像“阿中哥哥”。随后两天，《环球时报》《人民日报》、共青团中央跟进，“守护全世界最好的阿中”登上微博热搜；8月18日《新闻联播》点名表扬“饭圈女孩”。官媒用饭圈语言拟人化宣传，被网友讽刺为“饭圈治国”。
  concepts: [little-pink]
  cites: [e09-cdt-space-azhong]

- id: e09-2019-ruguanxue
  date: 2019-12
  title: “入关学”
  lane: folk
  summary: 2019年12月，知乎用户“山高县”回答“中国人从明亡的历史中学到过哪些历史教训”，把美国比作明朝、中国比作未入关的建州女真，主张推翻旧朝贡体系、建立自己的世界秩序，被称为“入关学”开山之作。与遭审查的“加速主义”不同，“入关学”在社交媒体上畅通无阻，知乎相关问答七个月内超过两万条，被认为迎合了“战狼”叙事。
  concepts: [wolf-warrior, little-pink]
  cites: [e09-cdt-space-ruguanxue]

# ---------- 2020 ----------
- id: e09-2020-zong-jiasushi
  date: 2020
  end: 2022-03
  title: “总加速师”与“加速主义”
  lane: folk
  summary: 2020年起，推特出现“#总加速师”标签，套用邓小平“总设计师”的称号，调侃习近平正把中国加速推向崩坏；支持者则说是加速走向强盛。官方对“加速主义”及“大翻译运动”等话语迅速打压，微博、知乎禁搜，抖音、B站、豆瓣清理内容；2021年3月起推特出现大量机器人账号刷屏污染搜索。2022年3月《环球时报》批“大翻译运动”是“具有新特点的舆论斗争”。
  people: [xi-jinping, deng-xiaoping]
  cites: [e09-cdt-space-jiasushi, e09-cdt-space-jiasuzhuyi]

- id: e09-2020-fa-shaozi-de-ren
  date: 2020-03-10
  title: 《发哨子的人》接力
  lane: folk
  major: true
  summary: 2020年3月10日早上，《人物》杂志发布采访武汉中心医院急诊科主任艾芬的文章《发哨子的人》，她说早知如此，“我管他批评不批评我，老子到处说，是不是？”。文章不到半日即被删除，而同一上午习近平开始视察武汉。网民随即接力转发，从倒排、繁体、英文到甲骨文、颜文字、摩斯密码、盲文，让文章一次次“复活”，与审查较力。
  people: [xi-jinping]
  cites: [e09-bbc-2020-03-11-fashaozi, e09-cdt-space-ai-fen]

- id: e09-2020-houlang
  date: 2020-05-03
  title: 《后浪》
  lane: folk
  summary: 2020年5月3日晚，由演员何冰演讲、官方与B站联合推出的青年节短片《后浪》登陆央视黄金时段，随后刷屏。片中说“向你们的自信致敬，弱小的人才习惯嘲讽与否定，内心强大的人从不吝啬赞美与鼓励”。中国数字时代批评这是洗脑宣传，意在教育年轻人不要批评政府，而要赞美国家。
  cites: [e09-cdt-space-houlang]

- id: e09-2020-chuan-jianguo
  date: 2020-11
  title: “川建国”与“拜振华”
  lane: folk
  summary: “川建国”是中国网友对特朗普的戏称，来自他的另一个中文译名“川普”：许多同龄中国男性名叫“建国”，而爱国者认为他的贸易战和在疫情、香港问题上的强硬只会让中国更团结、更好地建设中国。2020年美国大选期间，网民又给拜登取名“拜振华”。BBC认为“川建国”反映了特朗普强硬对华政策下中国国内日渐高涨的民族主义，民间多以隔岸观火的心态看戏。
  concepts: [little-pink]
  cites: [e09-bbc-2020-11-06-chuan-jianguo]

- id: e09-2020-xiaozhen-zuotijia
  date: 2020-12-20
  title: “小镇做题家”
  lane: folk
  summary: “小镇做题家”2020年起出现在中文互联网上。2020年12月20日，官媒《中青评论》发文《“做题家”们的怨气，为何要往丁真身上撒？》，把网民对“政府造星”丁真的不满归为“羡慕嫉妒恨”；《中国新闻周刊》后来为易烊千玺考编辩护时，也把做题家讽刺为无能恼怒的失败者。网民反击说，小镇做题家可以自嘲，却不能被官媒“他嘲”。
  cites: [e09-cdt-space-xiaozhen]

# ---------- 2022 ----------
- id: e09-2022-hecha
  date: 2022
  title: “喝茶”“查水表”
  lane: folk
  summary: 网络语境中，“喝茶”指警方的非正式问询或约谈，上门拘捕则称“查水表”，后者源自电视剧《派出所的故事》中民警为让人开门谎称的身份。约谈往往伴随威胁，要求删帖、关号、签保证书。2022年，关注黄雪琴、王建兵案的“关注雪饼”小组发起喝茶问卷：多数人被约谈前家人等身边人已被查访，仅36%是被告知时间后自行前往，约谈时长多在8小时以内。
  concepts: [stability-maintenance]
  cites: [e09-cdt-space-hecha, e09-cdt-space-chao-shuibiao]

- id: e09-2022-tanke-bingqilin
  date: 2022-06-03
  title: 李佳琦“坦克冰淇淋”与“李佳琦悖论”
  lane: folk
  summary: 2022年6月3日晚、六四33周年前夕，带货主播李佳琦在直播中展示一款造型类似坦克的和路雪冰淇淋，直播随即中断。他先称“后台技术故障”，后改称设备故障无法继续，此后连续三天缺席直播，不少年轻观众反而追问“坦克意味着什么”。由此产生“李佳琦悖论”：严厉审查让多数人不知道事件，持续审查却又欲盖弥彰地提醒人们它的存在。
  cites: [e09-bbc-2022-06-06-tank-cake, e09-cdt-space-li-jiaqi]

- id: e09-2022-erjiu
  date: 2022-07-26
  end: 2022-07-31
  title: 《二舅》与“苦难美学”
  lane: folk
  summary: 2022年7月26日，B站视频《回村三天，二舅治好了我的精神内耗》冲上热播榜第一，在新华社、人民日报、央视等官媒力捧下全网热议，一周播放近4000万次；人民日报微博称“面对命运冷峻的玩笑，二舅没有躺倒”。批评者指其“歌颂苦难”且有造假，公众号文章说“这个叙事遮蔽了生产苦难的社会环境”。7月31日该片被B站撤销推荐。
  cites: [e09-cdt-space-erjiu]

- id: e09-2022-fangyi-zaoci
  date: 2022-04
  end: 2022-10
  title: “静默”“社会面”：清零造词
  lane: folk
  major: true
  summary: 清零期间，当局造出至少120个防疫宣传词，用“静态管理”“静默”“居家办公”替代“封锁”，又有“全域静默”“临时社会面管控”等说法，坚称不是“封城”。萧强说官方把措辞变得“混沌模糊、不伦不类”，导致混乱和不满。上海摄影师杨潇把600个宣传用语随机打乱后用喇叭播放，视频获130万次观看后被删，他说要“用荒谬来打败荒谬”。
  concepts: [dynamic-zero]
  cites: [e09-nyt-2022-09-30-covid-words, e09-bbc-2022-10-21-lockdown-words]

- id: e09-2022-tingdai-gaozhishu
  date: 2022-07
  title: 烂尾楼“停贷告知书”
  lane: folk
  summary: 2022年7月，多地烂尾楼业主因项目停工迟迟无法收房，集体发布“停贷告知书”，宣布停止偿还房贷，“断供潮”迅速蔓延，受到中国内外媒体高度关注。据中国内部统计，多达52个停工或烂尾楼盘的业主发布了告知书，涉及恒大等约十家开发商。彭博社分析认为，拒付房贷凸显房地产风暴对中产阶级的冲击，“对社会稳定构成威胁”。
  cites: [e09-bbc-2022-07-14-mortgage-boycott]

# ---------- 2023 ----------
- id: e09-2023-renkuang
  date: 2023-01-02
  title: “人矿”遭全网封杀
  lane: folk
  major: true
  summary: 知乎上关于“人矿”的问答走红，网民用它自嘲为“生下来就被当作消耗品使用的人”，并概括为“沙特油，澳洲铁，中国人”。中国数字时代1月2日备份该问答后，知乎旋即删除提问，“人矿”遭全网封杀：微博完全禁搜，热搜第11位的话题页被下线，抖音只剩政府和媒体账号的视频。各平台部署时间一致、方式相似，应为响应网信办统一指令。
  cites: [e09-cdt-space-renkuang]

- id: e09-2023-jiucai-cuisheng
  date: 2023-08
  title: “韭菜”与西安催生短信
  lane: folk
  summary: “韭菜”最早指股市散户，后来引申为被权力反复剥削的顺民。政府推出“二孩”“三孩”政策鼓励生育后，网民常以此表达不愿生育：“怎么？韭菜不够割了呀？”2023年七夕前夕，西安政府部门群发“催生”短信，祝民众“适龄婚育、优生优育”，“赓续中华血脉，共担复兴重任”，社交媒体上群嘲“用你的时候是韭菜，让你生的时候谈血脉”。
  cites: [e09-cdt-space-jiucai]

- id: e09-2023-quanzhi-ernv
  date: 2023-05
  title: “全职儿女”
  lane: folk
  summary: “全职儿女”是年轻人退出就业市场、在家“全职”当孩子“啃老”的委婉说法，也被视为一种“躺平”，豆瓣上还出现了“全职儿女工作交流中心”小组。它流行的背景是青年失业率居高不下：2023年3月16至24岁青年失业率为19.6%，4月进一步攀升至20.4%，而同期全国城镇调查失业率为5.2%。
  cites: [e09-cdt-space-quanzhi-ernv]

- id: e09-2023-yaoyao-lingxian
  date: 2023-08
  end: 2024-09
  title: “遥遥领先”
  lane: folk
  summary: 2023年8月底，华为趁美国商务部长雷蒙多访华之际无预警发售5G手机Mate 60 Pro，在全球半导体界引起震动，支持者以“遥遥领先”叫板美国。公众号“我们的言论”批评这种民族主义狂欢，反问“支持华为，我们的工人们的生活水平就会提高了吗”。2024年9月华为发布售价近两万元的三折叠手机，又被网友戏称为“电子茅台”。
  concepts: [little-pink]
  cites: [e09-bbc-2024-09-13-huawei, e09-cdt-2023-10-28-yaoyao-lingxian]

- id: e09-2023-yayunhui-liusi
  date: 2023-10-01
  title: 亚运会上的“六四”拥抱
  lane: folk
  summary: 网民用不存在的“5月35日”指代6月4日以躲避审查。2023年10月1日杭州亚运会女子100米栏决赛后，第一名林雨薇（6道）与暂列第二的吴艳妮（4道）相拥，号码意外组成“六四”；前一天吴艳妮预赛站第9道，与第8道韩国选手相拥组成“八九”。墙外网友惊叹“这个巧合也实在是太巧了”，相关图片不久遭官方审查，墙内全网清零。
  cites: [e09-cdt-space-may-35b]

- id: e09-2023-danchaofan
  date: 2023-11-27
  end: 2024-01
  title: 王刚“蛋炒饭”与“蛋炒饭悖论”
  lane: folk
  summary: 网民把毛岸英忌日11月25日戏称为“中国感恩节”“蛋炒饭节”，源于他在朝鲜战争中违规做蛋炒饭引来空袭的说法。2023年11月27日，美食博主王刚发布蛋炒饭视频，被一些网民指责临近忌日“用蛋炒饭侮辱英烈”，随即删除；2024年初微博又屏蔽了“#美食作家王刚”话题。网友总结出“蛋炒饭悖论”：一边辟谣、一边下架，反而坐实了传闻。
  cites: [e09-cdt-space-danchaofan]

# ---------- 2024–2026 ----------
- id: e09-2024-niuma
  date: 2024
  title: “牛马”
  lane: folk
  summary: 近几年，网友常用“牛马”自况为生活所迫、供人驱使的职场处境，与“社畜”“韭菜”“人矿”一脉相承。2024年，脱口秀演员徐志胜在《脱口秀和它的朋友们》中调侃公司年终奖：“这怎么着，挤我的奶给我喝？”被做成短视频广泛传播。智联招聘7月的报告显示，白领、蓝领工作超过八小时的比例都接近七成，34%的人自嘲过着“牛马人生”。
  cites: [e09-rfa-2024-10-01-niuma]

- id: e09-2025-xi-pifu
  date: 2025-04
  end: 2025-09
  title: “习近逼”“150岁”：领导人的新“皮肤”
  lane: folk
  summary: 2025年4月初，中国军方发布台海演习海报《进逼》，有网民留言“演习进逼，拿下台湾”附和，账号却被封，网民测试发现后三字谐音构成“习近逼”。北京纪念二战结束80周年阅兵期间，习近平与普京谈器官移植延寿被麦克风录下，习说“本世纪呢，可能可以活到150岁”，“长生不老”“150岁”随即成为新代称，与“羽哥”等一同被列入年度敏感词。
  people: [xi-jinping]
  cites: [e09-cdt-2025-12-18-sensitive-words]

- id: e09-2025-babaige
  date: 2025-05-20
  end: 2025-05-23
  title: “八百哥”
  lane: folk
  summary: 2025年5月20日，四川宜宾屏山县一家纺织厂起火，网传一名员工因被克扣、拖欠800元工资而纵火，警方22日凌晨通报27岁文姓男子点火后被控制。网民称他“800哥”“八爷”乃至“人民英雄”，说“800哥点燃了打工人的怒火”。屏山警方23日晚再发通报，称拖欠800元工资的说法不属实；随后“八百哥”等称呼在社交媒体遭屏蔽。
  cites: [e09-cdt-2025-12-18-sensitive-words]

- id: e09-2025-hamasaki-kongchang
  date: 2025-11-29
  end: 2025-12-01
  title: 滨崎步“一个人的演唱会”
  lane: folk
  summary: 2025年11月高市早苗就台湾发言后，中方以“战狼外交”反制，多位日本艺人在华演出被取消。滨崎步原定11月29日的上海演唱会前夕以“不可抗力”为由被取消，当天却有自称摄像团队的人上传她在空场表演的视频，她也发文说现场有1万4000个空位。12月1日该人改称视频是彩排时偷拍、属“不实讯息”并道歉，其他说法的文章被删、账号被封。
  concepts: [wolf-warrior]
  cites: [e09-cdt-2025-12-18-sensitive-words]

- id: e09-2025-wuchang-jiaban
  date: 2025-11
  title: “每月无偿多加5个班”
  lane: folk
  summary: 2025年11月，《光明日报》头版文章引述一名“流水线上的普通车工”：“为了回击高市早苗的挑衅，我向班组长申请，从本月起，我每月无偿多加5个班。”这句话一夜之间被全网传播、仿写，被视为“低级红高级黑”的新句式。胡锡进同月也提醒，个别带官方标识的账号渲染对日对抗情绪，容易演变为“低级红高级黑”。
  people: [hu-xijin]
  cites: [e09-cdt-space-dijihong2]

- id: e09-2026-zhongshi-menghe
  date: 2026-07
  title: “中式梦核”
  lane: folk
  summary: 2020年代起，“中式梦核”在小红书等平台流行：Z世代分享网吧、蓝色玻璃大楼、“杀马特”等2000年代初的图像，怀念经济高速增长、未来充满想象的童年。在就业严峻、工资下降、竞争无休止的当下，有博主称它是“当代年轻人的新型数字止痛药”。纽约时报2026年7月报道称它尚未遭审查，但甘肃省委宣传部出版的期刊文章警告其“潜在风险仍不容忽视”。
  cites: [e09-nyt-2026-07-07-dream-core]
