- id: cs9-2026-qin-weizhong-probed
  date: 2026-09-21
  title: 深圳原市长覃伟中被查
  lane: purge
  summary: 2026年9月21日，中央纪委国家监委宣布广东省人大常委会党组成员覃伟中接受纪律审查和监察调查。覃伟中是二十届中央候补委员，出身石化系统，2021年4月起任深圳市市长，2026年8月卸任市长、转任广东省人大常委会党组成员，不到一个月即被查。同一天中央政治局会议决定五中全会于10月26日召开，国防部宣布张又侠、刘振立被开除党籍。
