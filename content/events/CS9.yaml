- id: cs9-2026-ye-jianchun-probed
  date: 2026-08-27
  title: 江西省长叶建春在任上被查
  lane: purge
  summary: 2026年8月27日，中央纪委国家监委宣布江西省委副书记、省长叶建春接受纪律审查和监察调查。叶建春是二十届中央委员，长期在水利系统任职，曾任水利部太湖流域管理局局长、水利部副部长，2021年调任江西省委副书记，后任省长。同年在任上被查的地方和部委正职中央委员，此前还有应急管理部部长王祥喜、重庆市长胡衡华。
