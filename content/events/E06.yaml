  end: 2024-09
  title: 《华尔街日报》：秦刚因婚外情被免
  lane: foreign
  summary: 《华尔街日报》2023年9月19日引述知情人士报道，中共向部级官员通报，秦刚被免去外长的正式原因是生活作风问题，调查发现他有婚外情并在美国生下一个孩子。此前社交媒体已盛传他与一名女主播有染。官方从未公布免职原因；2024年7月三中全会接受他辞去中央委员，路透社等称他被安排到出版社任低阶职务。
  people: [qin-gang]
  voices:
    - voice: zh
      text: 他们被告知，秦刚遭免职的正式原因是“生活作风问题”。
      cite: b08-zaobao-2023-09-19-qin-affair
      quote: true
    - voice: zh
      text: 这些官员也被告知，调查发现秦刚有婚外情，并因此有了一个在美国出生的孩子。
      cite: b08-zaobao-2023-09-19-qin-affair
      quote: true
    - voice: official
      text: 全会决定，接受秦刚同志辞职申请，免去秦刚同志中央委员会委员职务。
