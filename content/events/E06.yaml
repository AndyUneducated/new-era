    - voice: zh
      text: 英国《金融时报》报道，中共政治局委员、中央军委副主席的何卫东已被免去职务，有多名知情人士透露，免职事件涉及贪腐。
      cite: e06-dw-2025-04-he-weidong
      quote: true
    - voice: scholar
      text: 这是自1967年贺龙以来，首次有在职中央军委副主席被清洗
