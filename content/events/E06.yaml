      text: 英国《金融时报》星期三（27日）引述现任和前任美国官员报道，中国高层正对解放军展开一系列反腐调查，董军也卷入其中。中国外交部当天回应，指这一传言是“捕风捉影”。
      cite: e06-zaobao-2024-11-28-dong-jun
      quote: true
    - voice: official
