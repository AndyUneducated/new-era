  end: 2025-10-17
  title: 何卫东从公众视野消失
  lane: army
  summary: 《华盛顿时报》2025年3月25日引述美国国防官员称，美国情报机构认为两会后消失十多天的军委副主席何卫东已是高层清洗的最新对象；国防部发言人吴谦回应称没有这方面的消息。4月《金融时报》称他已因涉贪被免职，是1967年贺龙以来首位被清洗的在职军委副主席。10月17日国防部宣布何卫东等九名上将被开除党籍。
  people: [he-weidong, miao-hua, xi-jinping]
  factions: [fujian-generals, he-miao]
  voices:
