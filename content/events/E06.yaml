  summary: 英国《金融时报》2024年11月27日引述现任和前任美国官员报道，国防部长董军卷入解放军一系列反腐调查。外交部当天称这是捕风捉影；次日国防部发言人吴谦称报道纯属捏造、造谣者居心叵测，同时宣布军委委员苗华停职检查。董军本人从未被官方宣布立案。
  people: [miao-hua]
  factions: [he-miao]
  voices:
