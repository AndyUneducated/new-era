  title: “习近平被架空”传闻
  lane: power
  major: true
  summary: 2025年5月下旬起习近平约两周未公开露面，大纪元、人民报等海外媒体引述所谓权威人士称，习近平表面在台上实则大势已去，温家宝、张又侠左右政局，何卫东已自杀身亡。7月习近平首次缺席金砖峰会，传闻再起。评论人邓聿文认为这类谣言反映部分人等待惊变。何卫东10月被开除党籍、移送检察机关，张又侠2026年1月反被立案审查。
  people: [xi-jinping, wen-jiabao, zhang-youxia, he-weidong]
  factions: [zhang-liu]
  voices:
