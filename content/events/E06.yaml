      cite: c10-voa-2023-12-07-qin-dead
      quote: true
    - voice: zh
      text: “读者需要注意，这些说法的消息源并不可靠。这篇关于中国领导层的报道充满了猜测、八卦、流言，听起来很棒但很难去证实。”
      cite: c10-voa-2023-12-07-qin-dead
      quote: true
