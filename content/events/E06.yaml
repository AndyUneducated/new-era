      quote: true
    - voice: zh
      text: 两会结束后被抓的军委副主席何卫东已自我了断（自杀身亡）。
      cite: e06-epoch-2025-06-06-xi-sidelined
      quote: true
    - voice: zh
      text: 目前控制军中实权的是军委副主席张又侠。
      cite: e06-renminbao-2025-06-04-xi-power
