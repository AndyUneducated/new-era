- id: e06-2022-xi-down-li-up
  date: 2022-05
  end: 2022-10-23
  title: “习降李升”传闻
  lane: power
  summary: 2022年5月初，海外网络流传一段以录音形式传入国内的爆料短片，称习近平因内外困境在党内会议上遭质疑，李克强取得部分权力，习近平在二十大无法续任。中央社称其真假难辨，也有人认为这是自媒体博点击。5月25日李克强召开规模超过十万人的稳经济电视电话会议。10月二十届一中全会上习近平连任总书记，李克强未进新常委会。
  people: [xi-jinping, li-keqiang]
  factions: [tuanpai]
  voices:
    - voice: zh
      text: 5月初海外网络上一则爆料短片迅速流传，以录音档方式传入中国内部。内容声称习近平因中国当今面临的内外困境，在党内的会议上遭到质疑，李克强因此取得部分权力，甚至迳指习近平在中共20大无法再续任等，绘声绘影，真假难辨。
      cite: e06-rfi-2022-05-18-xi-down-li-up
      quote: true
    - voice: zh
      text: 有人认为，这不过是一些以“中南海听床师”自诩的自媒体人吸引点阅的耸动作法
      cite: e06-rfi-2022-05-18-xi-down-li-up
      quote: true
    - voice: zh
      text: 李克强长期以来被边缘化，如今在总理任期临近结束时，他的政治影响力却出现了某种程度的回升。
      cite: e06-dw-2022-05-26-li-100k
      quote: true
    - voice: official
      text: 习近平同志主持会议并在当选中共中央委员会总书记后作了重要讲话。
      cite: e04-gov-2022-10-23-1st-plenum
      quote: true
  cites: [e06-rfi-2022-05-18-xi-down-li-up, e06-dw-2022-05-26-li-100k, e04-gov-2022-10-23-1st-plenum]

- id: e06-2022-xi-house-arrest-rumour
  date: 2022-09-22
  end: 2022-09-27
  title: “习近平被软禁”政变谣言
  lane: power
  major: true
  summary: 2022年9月22日前后，推特中文圈流传政变传闻，称习近平出访中亚期间，胡锦涛、温家宝等前领导人控制了中央警卫局并罢黜习的军权，习回京后被软禁在中南海家中，传言获大量转发。欧亚集团总裁布雷默等观察人士称这些只是没有根据的网上猜测。9月27日习近平在官媒画面中公开露面，传言不攻自破。
  people: [xi-jinping, hu-jintao, wen-jiabao]
  voices:
    - voice: zh
      text: 传言称，在习近平出访中亚期间，胡锦涛和温家宝等前中国领导人控制了中央警卫局，并罢黜了习近平的军权。习近平在抵达北京后被控制，软禁在中南海家中。
      cite: e06-voa-2022-09-26-coup-twitter
      quote: true
    - voice: scholar
      text: “除了没有根据的网上猜测外，有关习主席和‘中国政变’的有用信息为零。直到这一点出现变化以前，我对此没有观点。”
      cite: e06-voa-2022-09-26-coup-twitter
      quote: true
    - voice: zh
      text: 习近平再次在公共场合露面，彻底推翻了日前有关习近平访问中亚多国后被“软禁”，军中将领已经政变接过职权的猜测和谣言。
      cite: e06-dw-2022-09-27-xi-reappears
      quote: true
    - voice: zh
      text: 针对最新的习近平被软禁政变的传言，蔡霞表示：“传言反映人心，当真就不必了。”
      cite: e06-dw-2022-09-27-xi-reappears
      quote: true
  cites: [e06-voa-2022-09-26-coup-twitter, e06-dw-2022-09-27-xi-reappears]

