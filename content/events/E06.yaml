- id: e06-2024-gu-wanming-sentenced
  date: 2024-11
  end: 2024-12-10
  title: 要求彻查李克强死因的顾万明获刑
  lane: society
  summary: 美国之音和自由亚洲电台2025年2月引述维权网报道，新华社退休记者顾万明在李克强猝逝后发公开信，质疑官方只说心脏病、未说明抢救过程，要求停止火化以待调查，随即被刑拘；2024年11月被上海法院以寻衅滋事罪判刑一年，12月新华社取消其退休待遇。官方讣告称李克强因突发心脏病在上海逝世。
  people: [li-keqiang]
  factions: [tuanpai]
  voices:
    - voice: zh
      text: 曾发表公开信要求官方彻查中国前总理李克强死因的新华社退休记者顾万明日前被披露去年11月被上海法院以“寻衅滋事”罪判处有期徒刑一年，随后又被新华社取消退休待遇。
      cite: e06-voa-2025-02-gu-wanming
      quote: true
    - voice: zh
      text: “李克强突然逝世后，有关方面没有向众人说明其死因、抢救过程，只说了‘因心脏病’，其中有很多疑点不可理解，
      cite: e06-voa-2025-02-gu-wanming
      quote: true
    - voice: zh
      text: 他提出的五项要求包括，停止遗体火化，以待调查；
      cite: e06-rfa-2025-02-11-gu-wanming
      quote: true
    - voice: official
      text: 国务院原总理李克强同志，因突发心脏病，经全力抢救无效，于2023年10月27日0时10分在上海逝世，享年68岁。
