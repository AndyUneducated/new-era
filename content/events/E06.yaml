      text: 这场失业大赛谁会获胜？中国年轻人还是习近平的内阁？
      cite: e06-bbc-2023-09-15-li-shangfu
      quote: true
    - voice: zh
      text: 据十名知情人士向路透社记者透露，失踪两周多的中国国防部长李尚福正在接受军委纪律检查委员会的调查。调查涉及军事装备采购中的腐败案。
      cite: e06-dw-2023-09-15-li-shangfu
      quote: true
    - voice: zh
      text: 美国政府相信李尚福已接受调查，无法履行国防部长的职责。BBC不能独立核实该说法。
      cite: e06-bbc-2023-09-15-li-shangfu
      quote: true
    - voice: official
      text: 2023年8月31日，由军委纪委监委对李尚福严重违纪违法问题立案审查调查。
      cite: b08-gov-2024-06-27-li-shangfu-expelled
      quote: true
  cites: [e06-bbc-2023-09-15-li-shangfu, e06-dw-2023-09-15-li-shangfu, b08-gov-2024-06-27-li-shangfu-expelled]

- id: e06-2023-qin-gang-affair-report
