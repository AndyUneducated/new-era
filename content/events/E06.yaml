- id: e06-2026-jingxi-gunfight-rumour
  date: 2026-01-25
  end: 2026-01-27
  title: “京西宾馆枪战”军变传闻
  lane: army
  major: true
  summary: 张又侠、刘振立1月24日被宣布立案审查后，加拿大华裔记者盛雪次日在X上转述一名墙内友人的说法，称两人原准备在京西宾馆抓捕习近平，事泄后双方爆发枪战、各有死伤，禁闻网等转载扩散，但均未获证实。流亡记者赵兰健批评这类叙事完全依赖不可核查的转述。官方通报只说二人涉嫌严重违纪违法。
  people: [zhang-youxia, liu-zhenli, xi-jinping]
  factions: [zhang-liu]
  voices:
    - voice: zh
      text: 结果就是，双方在京西宾馆发生激烈枪战，“习近平身边的警卫人员死了9个，张又侠的人死了几十个人。”
      cite: e06-bannedbook-2026-01-26-jingxi
      quote: true
    - voice: zh
      text: 但以上军变内容并未获得证实
      cite: e06-bannedbook-2026-01-26-jingxi
      quote: true
    - voice: zh
      text: 此類敘事完全依賴「X先生」、「牆內朋友」等不可核查的轉述，卻不斷疊加戲劇細節以增強「真實感」，更像吹噓的兒戲，而非嚴肅情報。
      cite: e06-newtalk-2026-01-27-jingxi
      quote: true
    - voice: official
      text: 中央政治局委员、中央军委副主席张又侠，中央军委委员、中央军委联合参谋部参谋长刘振立涉嫌严重违纪违法，经党中央研究，决定对张又侠、刘振立立案审查调查。
      cite: k01-mod-2026-01-24-zhang-youxia-liu-zhenli
      quote: true
  cites: [e06-bannedbook-2026-01-26-jingxi, e06-newtalk-2026-01-27-jingxi, k01-mod-2026-01-24-zhang-youxia-liu-zhenli]
