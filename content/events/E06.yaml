- id: e06-2023-beidaihe-elders
  date: 2023-08
  end: 2023-09-06
  title: 日经：北戴河元老斥责习近平
  lane: power
  summary: 《日经亚洲》编委中泽克二2023年9月撰文引述消息人士称，当年北戴河会议期间，以曾庆红为核心的一群退休元老以前所未有的方式斥责习近平，说不能再更乱了；习近平事后对亲信抱怨前三任留下的问题都落在他肩上。此说无法证实，自由亚洲电台访问的评论人认为元老多已被清洗、禁锢，不可能集体发声。
  people: [xi-jinping, zeng-qinghong]
  factions: [jiang-shanghai]
  voices:
    - voice: zh
      text: 消息人士指稱，在今年北戴河會議上，一群退休中共元老以前所未有的方式斥責了習近平。
      cite: c10-cna-2023-09-05-beidaihe-elders
      quote: true
    - voice: zh
      text: 據悉，中共元老們說，不能再更亂了。這群大老的核心人物是前國家副主席曾慶紅
      cite: c10-cna-2023-09-05-beidaihe-elders
      quote: true
    - voice: zh
      text: 不过，陈破空对此消息保持半信半疑。
      cite: e06-rfa-2023-09-06-beidaihe
      quote: true
    - voice: zh
      text: 中共的元老在过去十年多数已经被清洗、禁锢，私下发牢骚也许有可能，但是不可能让他们集体发声。
      cite: e06-rfa-2023-09-06-beidaihe
      quote: true
  cites: [c10-cna-2023-09-05-beidaihe-elders, e06-rfa-2023-09-06-beidaihe]

- id: e06-2023-li-shangfu-missing
  date: 2023-09-08
  end: 2024-06-27
  title: 李尚福失踪与美方“被查”说
  lane: army
  major: true
  summary: 美国驻日大使伊曼纽尔2023年9月在社交媒体上调侃国防部长李尚福两周没有露面，后又称他被软禁；路透社引述十名知情人士称，李尚福因军备采购腐败正接受军委纪委调查。外交部回应称不了解情况。2024年6月官方通报，军委纪委早在2023年8月31日就已对李尚福立案审查调查。
  people: [li-shangfu, qin-gang]
  factions: [equipment-system, rocket-equipment]
  voices:
