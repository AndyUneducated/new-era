- id: e05-2026-joshua-wong-plea
  date: 2026-09-02
  title: 黄之锋承认串谋勾结外国势力罪
  lane: hkmt
  summary: 正因“47人案”服刑、原定2027年1月获释的黄之锋，在香港高等法院承认《香港国安法》下的串谋勾结外国势力罪。控方指他与罗冠聪自2016年起透过国际游说推动《香港人权与民主法案》，国安法生效后仍寻求外国制裁。这是继黎智英后第二宗勾结外国势力罪起诉，最高可判终身监禁；法官押后判刑，日期另行通知。
  people: [huang-zhifeng, luo-guancong, li-zhiying]
  voices:
    - voice: official
      text: 公然为反中乱港分子黄之锋撑腰张目，恶意抹黑香港警方正常执法行动，赤裸裸干预香港事务和中国内政。
      cite: c04-bbc-2026-09-02-joshua-wong
      quote: true
    - voice: zh
      text: 突显当局对异见人士的恐惧，亦显示港府不惜一切手段，力求将这些人士长期关押，以持续打压香港的公民行动和社会参与。
      cite: c04-bbc-2026-09-02-joshua-wong
      quote: true
  cites: [c04-bbc-2026-09-02-joshua-wong]

- id: e05-2026-dong-jianhua-death
  date: 2026-09-08
  title: 董建华逝世
  lane: hkmt
  summary: 香港特区首任行政长官、全国政协前副主席董建华9月8日在香港病逝，享年89岁，新华社称他为“一国两制”杰出贡献者。中央社回顾，船王之子董建华当年被江泽民“钦点”出任首任特首，2003年推动基本法23条立法引发50万人上街，2005年第二任期未满即请辞；卸任后创办中美交流基金会，穿梭中美之间，2021年中起淡出公众视野。
  people: [dong-jianhua, jiang-zemin, hu-jintao, zeng-yinquan]
  concepts: [one-country-two-systems]
  voices:
    - voice: official
      text: “一国两制”杰出贡献者，著名的爱国人士，杰出的社会活动家，中国共产党的亲密朋友
      cite: c04-xinhua-2026-09-09-dong-jianhua
      quote: true
    - voice: zh
      text: 2004年，時任中國國家主席胡錦濤要求董建華政府「查找不足」，對董建華的管治似乎頗有微言。
      cite: c04-cna-2026-09-09-dong-jianhua
      quote: true
  cites: [c04-xinhua-2026-09-09-dong-jianhua, c04-cna-2026-09-09-dong-jianhua]
