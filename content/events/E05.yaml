  title: 纪念江泽民诞辰100周年大会
  lane: power
  summary: 中共中央等五机构在人民大会堂举行大会纪念江泽民诞辰100周年，习近平讲话称江“成功把中国特色社会主义推向二十一世纪”，并要求持之以恒推进全面从严治党。据联合早报，13位卸任政治局常委出席并与七常委同坐主席台第一排，温家宝官方排名最靠前；胡锦涛、李瑞环、吴官正、罗干未现身。
  people: [jiang-zemin, xi-jinping, wen-jiabao, zeng-qinghong, zhang-gaoli, hu-jintao, li-ruihuan, wu-guanzheng, luo-gan]
  voices:
    - voice: official
      text: 江泽民同志的一生，是光辉的一生、战斗的一生
