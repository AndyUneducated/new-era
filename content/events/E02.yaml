# E02 timeline: 2008-01 to 2012-12. Sources in research/manifests/E02.yaml.

# ---------- 2008 ----------
- id: e2008-southern-snowstorm
  date: 2008-01-10
  end: 2008-02
  title: 南方低温雨雪冰冻灾害
  lane: society
  summary: 1月10日起，南方大部分地区发生低温雨雪冰冻灾害，上海、湖南、广东、贵州、四川等20个省（区、市）和新疆生产建设兵团不同程度受灾。民政部统计，因灾死亡129人、失踪4人，紧急转移安置166万人，倒塌房屋48.5万间，农作物受灾面积1.78亿亩，直接经济损失1516.5亿元。
  cites: [e02-mca-2008-02-snowstorm]

- id: e2008-lhasa-unrest
  date: 2008-03-14
  title: 拉萨“3·14”事件
  lane: ethnic
  major: true
  summary: 3月14日，拉萨主要路段发生打砸抢烧，车辆、商场、电信网点和政府机关遭冲击。新华社事后通报，不法分子纵火300余处，18名无辜群众被烧死或砍死，受伤382人，直接财产损失近2.5亿元，并将事件定性为达赖集团策划煽动。官方初期公布的死亡人数为13人；BBC报道目击者称街上听到枪声，西藏流亡政府称死亡人数至少80人。
  voices:
    - voice: official
      text: 这起严重的暴力犯罪事件是由达赖集团有组织、有预谋、精心策划煽动的
      cite: e02-ce-2008-03-22-lhasa-xinhua
      quote: true
    - voice: zh
      text: 西藏流亡政府则称拉萨骚乱的死亡人数至少有80人。
      cite: e02-bbc-2008-03-17-lhasa-toll
      quote: true
  cites: [e02-ce-2008-03-22-lhasa-xinhua, e02-bbc-2008-03-17-lhasa-toll]

- id: e2008-xi-vice-president
  date: 2008-03-15
  title: 十一届全国人大一次会议选举习近平为国家副主席
  lane: power
  summary: 十一届全国人大一次会议3月15日以无记名投票方式，选举胡锦涛连任国家主席和国家中央军委主席，吴邦国连任全国人大常委会委员长，习近平当选国家副主席，王兆国等13人当选副委员长。同一天会议还表决批准了国务院机构改革方案。国家主席、副主席和军委主席均为等额选举。
  people: [xi-jinping, hu-jintao, wu-bangguo, wang-zhaoguo]
  cites: [e02-npc-2008-03-15-xi-vp]

- id: e2008-ma-ying-jeou-elected
  date: 2008-03-22
  title: 马英九当选台湾地区领导人，国民党重新执政
  lane: hkmt
  summary: 台湾地区领导人选举中，国民党提名的马英九、萧万长以58.45%的得票率、约765万票当选，民进党提名的谢长廷、苏贞昌得票率41.55%，约544万票，投票率76.33%。民进党8年执政结束，台湾完成第二次政党轮替。
  people: [ma-yingjiu]
  cites: [e02-bbc-2008-03-22-ma-elected]

- id: e2008-torch-relay-carrefour
  date: 2008-04-07
  end: 2008-04-15
  title: 奥运火炬巴黎受阻与抵制家乐福
  lane: foreign
  summary: 4月7日北京奥运火炬在巴黎传递时，几名西藏独立支持者试图抢夺轮椅上的残疾火炬手金晶手中的火炬，官方媒体大篇幅报道金晶护火炬。随后中国网民通过互联网和手机短信呼吁抵制法国家乐福，称其母公司向达赖喇嘛捐款。BBC引述中国媒体称，网上呼吁文章一度达17万篇，后只能搜到3万多篇，显示当局开始控制有关言论。
  concepts: [little-pink]
  cites: [e02-bbc-2008-04-carrefour]

- id: e2008-chen-liangyu-sentenced
  date: 2008-04-11
  title: 陈良宇一审被判有期徒刑十八年
  lane: purge
  summary: 天津市第二中级人民法院4月11日一审认定，前政治局委员、上海市委书记陈良宇犯受贿罪和滥用职权罪，两罪并罚判处有期徒刑18年，没收个人财产30万元。判决认定其受贿折合239万余元，并在上海路桥股权低价转让、为其弟违规征地、违规动用10亿元社保基金等事项中滥用职权。
  people: [chen-liangyu]
  factions: [jiang-shanghai]
  cites: [e02-chinanews-2008-04-11-chen-liangyu]

- id: e2008-wenchuan-earthquake
  date: 2008-05-12
  title: 汶川大地震
  lane: society
  major: true
  summary: 5月12日，四川汶川发生大地震。国务院新闻办9月25日根据抗震救灾总指挥部授权发布，截至当日已确认69227人遇难、374643人受伤、17923人失踪。大量校舍在地震中倒塌，许多学生遇难，遇难学生家长质疑校舍建筑质量，此后数周在绵竹、都江堰等地聚集请愿，成为海外媒体的报道重点。
  cites: [e02-chinanews-2008-09-25-wenchuan, e02-voa-2008-06-06-dujiangyan]

- id: e2008-tofu-dreg-schools
  date: 2008-06-01
  end: 2008-06-03
  title: 校舍“豆腐渣工程”与遇难学生家长抗议
  lane: society
  summary: 汶川地震中，部分学校校舍倒塌而周边建筑完好，遇难学生家长指责“豆腐渣工程”。6月1日，绵竹富新二小近百名家长在市政府前静坐，都江堰新建小学家长身穿写有“严惩豆腐渣腐败”的白衫集会；6月3日，聚源中学家长欲到法院起诉，被警察包围拖走。VOA称中国主流媒体对家长抗议没有任何报道。
  concepts: [stability-maintenance]
  cites: [e02-voa-2008-06-06-dujiangyan]

- id: e2008-wengan-incident
  date: 2008-06-28
  title: 贵州瓮安事件
  lane: society
  summary: 6月28日，贵州瓮安县上万民众围绕女生李树芬溺亡的死因争议，冲击并焚烧县委、县政府和公安局大楼，百余名民警受伤。官方最初的口径是“少数人煽动不明真相的群众闹事”；省委书记石宗源到当地调查后，承认当地长期侵犯群众利益、干部作风粗暴，先后三次道歉，县委书记、县长、公安局长等被撤职。
  concepts: [stability-maintenance]
  cites: [e02-chinanews-2008-07-02-wengan, e02-bbc-2008-07-wengan-accountability]

- id: e2008-fuwocheng
  date: 2008-07-01
  end: 2008-07-03
  title: “俯卧撑”成为网络热词
  lane: folk
  summary: 7月1日瓮安事件新闻发布会上，贵州省公安厅通报李树芬死因时称，她跳河前，同行的刘某正在桥上做俯卧撑。说法公布数小时后，天涯社区出现发帖“做俯卧撑”的潮流，并蔓延到百度、新浪、猫扑等网站，“俯卧撑”被引申为对某事不便或不愿发表意见。7月3日起，该词在许多论坛遭屏蔽，据报是第一个被屏蔽的网络热词。
  cites: [e02-wiki-fuwocheng, e02-chinanews-2008-07-02-wengan]

- id: e2008-beijing-olympics
  date: 2008-08-08
  end: 2008-08-24
  title: 北京奥运会
  lane: foreign
  major: true
  summary: 8月8日晚，第二十九届奥运会开幕式在国家体育场举行，胡锦涛宣布开幕，美国总统布什、俄罗斯总理普京、日本首相福田康夫等数十位外国领导人出席。本届奥运会打破43项世界纪录，东道主中国以51枚金牌首次居金牌榜首位，奖牌总数100枚。此前火炬传递曾在巴黎等地遭遇抗议。
  people: [hu-jintao, jiang-zemin]
  cites: [e02-consulate-2008-08-08-olympics, e02-olympiccn-2008-08-24-golds, e02-bbc-2008-04-carrefour]

- id: e2008-melamine-milk
  date: 2008-09-13
  title: 三鹿奶粉三聚氰胺事件
  lane: society
  summary: 三鹿牌婴幼儿奶粉被发现含三聚氰胺，导致大量婴幼儿患结石病。9月13日国务院专题研究，启动国家重大食品安全事故I级响应，由卫生部牵头成立应急处置领导小组，对患儿实行免费治疗，三鹿集团被停产整顿。官方称不法分子在原料奶收购环节添加三聚氰胺，已拘留19人。
  cites: [e02-taiwancn-2008-09-13-melamine]

- id: e2008-four-trillion-stimulus
  date: 2008-11-05
  title: 国务院推出“四万亿”刺激计划
  lane: econ
  major: true
  summary: 国际金融危机爆发后，11月5日国务院常务会议确定进一步扩大内需、促进经济增长的十项措施，初步匡算到2010年底约需投资4万亿元，外界通称“四万亿”计划。2010年十七届五中全会回顾时，把它概括为有效实施应对国际金融危机冲击的一揽子计划，称经济保持了平稳较快发展。
  people: [wen-jiabao]
  cites: [e02-chinanews-2008-11-09-four-trillion, e02-chinanews-2010-10-18-plenum5]

- id: e2008-charter-08
  date: 2008-12-08
  title: 《零八宪章》发表，刘晓波被拘
  lane: ideo
  major: true
  summary: 《零八宪章》由303名学者、作家等首批签署，称自由、平等、人权是人类共同的普世价值，民主、共和、宪政是现代政治的基本制度架构；签署人包括于浩成、沙叶新、鲍彤、丁子霖、刘晓波等。宪章公开前夕的12月8日晚，参与起草的刘晓波被北京警方带走，政治评论家张祖桦也被带走。
  people: [liu-xiaobo, bao-tong]
  concepts: [charter-08, liberals]
  cites: [e02-bbc-2008-12-09-charter08, e02-bbc-2009-12-25-liu-sentenced]

- id: e2008-three-links
  date: 2008-12-15
  title: 两岸直接“三通”启动
  lane: hkmt
  summary: 两岸空运直航、海运直航与直接通邮于12月15日正式启动，北京、天津、上海以及台北、高雄、基隆等城市举行首航仪式和庆祝活动，新华社称两岸直接“三通”基本实现。在北京航空邮件交换站的通邮仪式上，出生在台湾、现居北京的81岁老人郑坚投出第一封直接寄给台湾亲属的家书。
  cites: [e02-taiwancn-2008-12-15-three-links]

- id: e2008-buzheteng
  date: 2008-12-18
  title: “不折腾”成为流行语
  lane: folk
  summary: 胡锦涛在纪念十一届三中全会30周年大会上说，“只要我们不动摇、不懈怠、不折腾”，就一定能实现宏伟蓝图。“不折腾”随即流行。12月30日国务院新闻办发布会上，翻译干脆按拼音念作bu zheteng，引来笑声。联合早报评论说官方权威解释缺席，网上有人大赞，也有网民不买账。
  people: [hu-jintao]
  cites: [e02-12371-2008-12-18-hu-30th, e02-sina-2009-01-02-buzheteng]

- id: e2008-gulf-of-aden-escort
  date: 2008-12-26
  title: 海军首批护航编队赴亚丁湾
  lane: army
  summary: 由“武汉”号、“海口”号和“微山湖”号综合补给舰组成的海军舰艇编队12月26日从三亚启航，赴亚丁湾、索马里海域执行护航任务。官方称，这是中国首次使用军事力量赴海外维护国家战略利益，也是中国军队首次组织海上作战力量赴海外履行国际人道主义义务。
  cites: [e02-chinanews-2008-12-26-aden]

# ---------- 2009 ----------
- id: e2009-duomaomao
  date: 2009-02
  end: 2009-02-27
  title: “躲猫猫”事件
  lane: folk
  summary: 云南晋宁县看守所在押青年李荞明受伤后死亡，当地警方称他与狱友玩“躲猫猫”游戏时发生意外，说法引起强烈质疑，“躲猫猫”成为网络流行语，相关网页一度多达70余万个。云南省委宣传部随后邀网民组成调查团参与调查；2月27日，云南省检察院公布李荞明系被狱霸以玩游戏为名殴打致死。
  cites: [e02-chinanews-2009-02-24-duomaomao-netizens, e02-bbc-2009-02-27-duomaomao]

- id: e2009-grass-mud-horse
  date: 2009-02
  end: 2009-03
  title: 《草泥马之歌》
  lane: folk
  summary: 官方开展互联网专项整治期间，一首童声合唱的《草泥马之歌》在网上流传，借“草泥马”“马勒戈壁”的谐音讲粗口，唱草泥马打败偷吃戈壁野草的“河蟹”，而“河蟹”与官方强调的“和谐”同音。BBC评论称，这是草根网民对官方干涉手段的反弹；以羊驼为原形的草泥马毛绒玩具随后热销。
  concepts: [harmonious-society]
  cites: [e02-bbc-2009-03-grass-mud-horse]

- id: e2009-urumqi-riots
  date: 2009-07-05
  title: 乌鲁木齐“7·5”事件
  lane: ethnic
  major: true
  summary: 7月5日乌鲁木齐发生大规模骚乱和暴力冲突，当局随后实行宵禁。新疆自治区主席努尔·白克力7月18日说，事件已造成197人死亡，其中绝大多数是无辜群众，并定性为境内外“三股势力”策划组织的打砸抢烧暴力犯罪。世界维吾尔代表大会则称，事件起因是当局对广东韶关玩具厂维吾尔工人遭群殴一事处理不当，民众上街是自发抗议。
  voices:
    - voice: official
      text: 这次事件是境内外“三股势力”精心策划、组织的一起打砸抢烧暴力犯罪行为。
      cite: e02-govcn-2009-07-urumqi
      quote: true
    - voice: zh
      text: 这次事件完全是因为政府对韶关事件处理不当导致的维族民众自发抗议。
      cite: e02-bbc-2009-07-urumqi-wuc
      quote: true
  cites: [e02-govcn-2009-07-urumqi, e02-bbc-2009-07-urumqi-wuc]

- id: e2009-chongqing-strike-black
  date: 2009
  title: 重庆“打黑除恶”
  lane: purge
  summary: 2009年，重庆在市委书记薄熙来主政下开展大规模扫黑行动，检察机关批捕犯罪嫌疑人1176人，其中782人被起诉。薄熙来回应批评时说，“打黑除恶”不是“异想天开，没事找事”。批评者认为这像文革搞运动，而不是通过法制途径对付腐败和黑社会；也有人认为，在法制不健全时它必然受民众欢迎。
  people: [bo-xilai]
  cites: [e02-bbc-2010-03-31-bo-anti-triad, e02-bbc-2010-07-07-wen-qiang]

- id: e2009-60th-anniversary-parade
  date: 2009-10-01
  title: 国庆60周年阅兵
  lane: army
  summary: 10月1日，首都各界庆祝中华人民共和国成立60周年大会在天安门广场举行，胡锦涛检阅受阅部队并发表讲话，20万军民参加阅兵和群众游行。由坦克、战车、火炮、导弹等组成的30个装备方队全部为国产装备，90%是第一次公开展示，巡航导弹方队等首次亮相，核导弹方队最后通过。
  people: [hu-jintao, jiang-zemin]
  cites: [e02-sina-2009-10-01-parade]

- id: e2009-liu-xiaobo-sentenced
  date: 2009-12-25
  title: 刘晓波被判有期徒刑十一年
  lane: ideo
  summary: 参与起草《零八宪章》、一年前被拘押的异见人士刘晓波，12月25日被以煽动颠覆国家政权罪判处有期徒刑11年、剥夺政治权利2年，该罪名最高刑罚为15年。美国外交官在宣判后发表声明，再次促请释放刘晓波；新华社则称法院依法公开审理，充分保障了刘晓波的诉讼权利。
  people: [liu-xiaobo]
  concepts: [charter-08]
  cites: [e02-bbc-2009-12-25-liu-sentenced]

# ---------- 2010 ----------
- id: e2010-weiguan
  date: 2010-01-13
  title: “围观改变中国”
  lane: folk
  summary: 《南方周末》1月刊出笑蜀的评论《关注就是力量 围观改变中国》，以电价听证会上市民代表刘天晓扔水瓶引来媒体追问为例，认为“关注就是力量，围观就是压力”，权力部门已不能视围观为无物，必须回应。文章称亿万人的围观能聚成探照灯，一点点穿透特殊利益的高墙。
  cites: [e02-infzm-2010-01-13-weiguan]

- id: e2010-tan-zuoren-sentenced
  date: 2010-02-09
  title: 调查川震校舍的谭作人被判五年
  lane: society
  summary: 四川环保人士谭作人2月9日被成都中级人民法院以煽动颠覆国家政权罪判处有期徒刑五年。他在汶川地震后公开质疑灾区学校的豆腐渣工程，并与冉云飞、艾未未等组织志愿者搜集遇难学生名单；起诉罪名还涉及与流亡学生领袖王丹联系。艾未未称判决违反宪法精神，国际特赦组织要求释放他。
  people: [ai-weiwei]
  cites: [e02-bbc-2010-02-09-tan-zuoren]

- id: e2010-google-exit
  date: 2010-03-22
  title: 谷歌关闭中国大陆搜索服务
  lane: foreign
  summary: 谷歌3月22日关闭在中国大陆的搜索服务Google.cn，访问者被转往谷歌在香港的中文搜索网页，页面显示“欢迎您来到谷歌搜索在中国的新家”。BBC报道称，目前还不清楚中国大陆网民能否自由登陆香港网站；路透社引述谷歌说，未来在华销售团队的规模将取决于有多少中国人能打开该网站。
  cites: [e02-bbc-2010-03-22-google]

- id: e2010-xinjiang-secretary-change
  date: 2010-04-24
  title: 张春贤接替王乐泉主政新疆
  lane: ethnic
  summary: 乌鲁木齐七五事件后不到一年，中央调整新疆自治区党委主要负责人：政治局委员王乐泉不再兼任自治区党委书记，改任中央政法委副书记，由湖南省委书记张春贤接任。王乐泉在新疆工作近20年，1995年起任党委书记15年。习近平在宣布会议上称赞他同民族分裂势力作斗争、坚定维护民族团结。
  people: [wang-lequan, zhang-chunxian, xi-jinping]
  cites: [e02-xinhua-2010-04-24-xinjiang-secretary]

- id: e2010-ecfa
  date: 2010-06-29
  title: 两岸签署ECFA
  lane: hkmt
  summary: 海协会会长陈云林与海基会董事长江丙坤6月29日在重庆签署《海峡两岸经济合作框架协议》。协议除序言外共5章16条、约3200字，涵盖总则、贸易与投资、经济合作、早期收获等内容，并规定双方成立两岸经济合作委员会，被视为推动两岸经济合作制度化的标志。
  cites: [e02-chinanews-2010-06-29-ecfa]

- id: e2010-wen-qiang-executed
  date: 2010-07-07
  title: 文强被执行死刑
  lane: purge
  summary: 重庆市高级法院7月7日宣布，经最高人民法院核准，维持对重庆市原司法局长文强的死刑判决，文强当天在重庆被执行死刑。在2009年重庆检察机关的大规模扫黑行动中，共有1176名犯罪嫌疑人被批捕、782人被起诉，文强是其中官位最高者。
  people: [bo-xilai]
  cites: [e02-bbc-2010-07-07-wen-qiang]

- id: e2010-wen-shenzhen-political-reform
  date: 2010-08-20
  end: 2010-08-21
  title: 温家宝在深圳谈政治体制改革
  lane: ideo
  summary: 深圳经济特区建立30周年之际，温家宝在深圳听取工作汇报时说，“不仅要推进经济体制改革，还要推进政治体制改革”，没有政治体制改革的保障，经济体制改革的成果就会得而复失。他还提出要从制度上解决权力过分集中又得不到制约的问题。BBC引述批评人士说，对领导人讲话重要的不是听其言，而是观其行。
  people: [wen-jiabao, wang-yang]
  cites: [e02-gov-2010-08-21-wen-shenzhen, e02-bbc-2010-08-22-wen-shenzhen]

- id: e2010-diaoyu-trawler
  date: 2010-09-07
  end: 2010-09-24
  title: 钓鱼岛撞船事件
  lane: foreign
  summary: 9月7日，一艘中国拖网渔船在钓鱼岛海域与日本海上保安厅巡逻船相撞，船长詹其雄被日方扣押。外交部发言人姜瑜提出严正交涉，重申中国对钓鱼岛的主权。日方延长扣押期，纷争随后升级，中国逮捕四名日本人，对日稀土出口通关一度停滞，但中方否认禁止出口。日本9月24日宣布释放詹其雄。
  cites: [e02-bbc-2010-09-07-trawler, e02-bbc-2010-09-24-captain-release]

- id: e2010-liu-xiaobo-nobel
  date: 2010-10-08
  title: 刘晓波获诺贝尔和平奖
  lane: foreign
  major: true
  summary: 挪威诺贝尔委员会10月8日宣布将和平奖授予正在服刑的刘晓波，表彰他长期以非暴力方式在中国争取基本人权的斗争和推动中国民主化的努力。刘晓波一年前因参与起草《零八宪章》被判刑11年。中国外交部称他是触犯中国法律的罪犯，授奖是对和平奖的亵渎，也会损害中挪关系。
  people: [liu-xiaobo]
  concepts: [charter-08]
  voices:
    - voice: official
      text: 诺委会把和平奖授予这样一个人，完全违背了该奖项的宗旨，也是对和平奖的亵渎。
      cite: e02-mfa-2010-10-08-nobel
      quote: true
    - voice: zh
      text: 长期以来以非暴力方式在中国争取基本人权的斗争
      cite: e02-bbc-2010-10-08-liu-nobel
      quote: true
  cites: [e02-mfa-2010-10-08-nobel, e02-bbc-2010-10-08-liu-nobel, e02-bbc-2009-12-25-liu-sentenced]

- id: e2010-xi-cmc-vice-chair
  date: 2010-10-15
  end: 2010-10-18
  title: 十七届五中全会增补习近平为中央军委副主席
  lane: power
  summary: 十七届五中全会10月15日至18日在北京举行，审议通过《中共中央关于制定国民经济和社会发展第十二个五年规划的建议》，温家宝就建议稿作说明。全会提出要大力推进经济体制改革，积极稳妥推进政治体制改革，并决定增补习近平为中央军事委员会副主席。
  people: [xi-jinping, hu-jintao, wen-jiabao]
  concepts: [scientific-development]
  cites: [e02-chinanews-2010-10-18-plenum5]

- id: e2010-my-father-is-li-gang
  date: 2010-10-16
  end: 2010-11-17
  title: “我爸是李刚”
  lane: folk
  summary: 10月16日晚，李启铭在河北大学校园内醉酒驾车撞人，被拦下时口出狂言“有本事你告去，我爸是李刚。”其父李刚时任保定市公安局副局长。网民随即发起“我爸是李刚”造句大赛，参与者迅速过万；李刚在央视流泪道歉。11月，受害者陈晓凤的父亲称迫于警方压力，接受46万元赔偿、放弃起诉。
  cites: [e02-cntv-2010-10-22-ligang, e02-bbc-2010-11-18-ligang]

# ---------- 2011 ----------
- id: e2011-j20-test-flight
  date: 2011-01-11
  title: 歼-20首飞获官方证实
  lane: army
  summary: 胡锦涛1月11日向来访的美国国防部长盖茨证实，中国成功试飞歼20隐形战机，这是中国首次正式证实该机的研发和试飞；此前北京对相关消息既不肯定也不否定。盖茨说，胡锦涛告诉他这次试飞与他的访问没有任何关系，是一次事先计划的试飞。
  people: [hu-jintao]
  cites: [e02-bbc-2011-01-11-j20]

- id: e2011-liu-zhijun-investigated
  date: 2011-02-12
  title: 铁道部部长刘志军落马
  lane: purge
  summary: 中央纪委2月12日证实，铁道部部长、党组书记刘志军涉嫌严重违纪，正接受组织调查，中央免去其党组书记职务，由盛光祖接任。同年温州动车事故调查报告认定，刘志军片面追求铁路建设速度而忽视安全管理，对事故负有主要领导责任，鉴于其涉嫌严重经济问题，建议另案一并处理。
  cites: [e02-xinhua-2011-02-12-liu-zhijun, e02-zjol-2011-12-28-wenzhou-report]

- id: e2011-second-largest-economy
  date: 2011-02-14
  title: 中国超过日本成为世界第二大经济体
  lane: econ
  summary: 日本公布2010年经济统计，正式确认中国超过日本成为世界第二大经济体，日本自1968年起保持42年的第二位置告终。央视报道回顾，2000年时中国GDP只有日本的四分之一，2005年超过英国和法国，2007年超过德国；但美国经济规模约15万亿美元，仍是中国的3倍。
  cites: [e02-cntv-2011-02-14-gdp]

- id: e2011-jasmine-calls
  date: 2011-02-20
  title: “茉莉花革命”号召与警方驱散
  lane: society
  summary: 受阿拉伯世界反政府示威浪潮启发，网上出现匿名号召，要求在中国各地发起“茉莉花革命”集会。2月20日，北京王府井麦当劳门外有数百人聚集，上海等地也有民众响应，均被大批警力驱散，部分人被带走。新浪微博、百度搜索“茉莉花”显示结果未予显示，大批维权人士事前被警方带走。
  concepts: [stability-maintenance]
  cites: [e02-bbc-2011-02-20-jasmine]

- id: e2011-wu-bangguo-five-nos
  date: 2011-03-10
  title: 吴邦国宣示“五不搞”
  lane: ideo
  summary: 吴邦国3月10日在十一届全国人大四次会议作人大常委会工作报告，宣布中国特色社会主义法律体系形成，并郑重表明“不搞多党轮流执政，不搞指导思想多元化”，不搞三权鼎立和两院制，不搞联邦制，不搞私有化，外界称为“五不搞”。他说法律体系从制度上确保中国共产党始终成为领导核心。
  people: [wu-bangguo]
  cites: [e02-cntv-2011-03-10-wu-bangguo]

- id: e2011-ai-weiwei-detained
  date: 2011-04-03
  end: 2011-06-22
  title: 艾未未被拘与取保候审
  lane: society
  summary: 艺术家艾未未4月3日在北京机场准备出境前往香港时被带走，警方随后搜查其位于草场地的住所兼工作室，并带走八名工作人员问话，国际社会纷纷谴责。6月22日新华社称，公安机关查明艾未未有逃税和故意销毁会计凭证等犯罪行为，因其认罪良好、患有疾病并主动表示补缴税款，准许取保候审。
  people: [ai-weiwei]
  cites: [e02-bbc-2011-04-03-aiweiwei, e02-voa-2011-06-22-aiweiwei-bail]

- id: e2011-bo-xilai-red-songs
  date: 2011-04
  title: 薄熙来为重庆“唱红”辩护
  lane: ideo
  summary: 重庆市委书记薄熙来在重庆推行“唱红”活动，外界多有批评。他回应时强调，“唱红”决非搞社会意识形态的政治运动，更不是搞极左、倒退的文化革命，外界对此存在相当大的误解；所谓红歌不仅指抗战时期的歌曲，还包括爱国歌曲和任何能激发高尚情感的中外歌曲。
  people: [bo-xilai]
  concepts: [maoist-left]
  cites: [e02-voa-2011-04-30-bo-red-songs]

- id: e2011-wenzhou-train-crash
  date: 2011-07-23
  title: 甬温线动车追尾事故
  lane: society
  major: true
  summary: 7月23日晚，甬温线温州境内D301次与D3115次动车组追尾，造成40人死亡、172人受伤，中断行车32小时35分，直接经济损失约1.94亿元。国务院调查组年底公布的报告认定，事故是列控中心设备存在严重设计缺陷、上道使用审查把关不严、雷击导致设备故障后应急处置不力等因素造成的责任事故。
  cites: [e02-zjol-2011-12-28-wenzhou-report]

- id: e2011-believe-it-or-not
  date: 2011-07-24
  title: “至于你们信不信，我反正是信的”
  lane: folk
  summary: 温州动车事故后，铁道部新闻发言人王勇平在发布会上被问及为何掩埋车头，他转述现场人员的解释说，因为现场是泥塘、施展不便，所以把车头埋在下面，主要是便于抢险，并说“至于你们信不信，我反正是信的。”这句话迅速流传，BBC评论称这样的解释显然难以打消公众疑虑。
  cites: [e02-bbc-2011-07-25-wang-yongping]

- id: e2011-wukan
  date: 2011-12-21
  end: 2012-03-03
  title: 乌坎事件
  lane: society
  summary: 广东乌坎村村民为反对强征土地举行大规模抗议，村民代表薛锦波死亡后，村民要求交还遗体并由国际媒体验看。12月21日，广东省委副书记朱明国会见村民代表，接受交还薛锦波遗体、承认临时理事会村代表地位等要求。2012年3月3日乌坎举行村委会选举，维权村民领袖林祖銮作为唯一候选人当选村主任。
  people: [zhu-mingguo]
  cites: [e02-bbc-2011-12-21-wukan, e02-bbc-2012-03-02-wukan-election]

# ---------- 2012 ----------
- id: e2012-tibetan-self-immolations
  date: 2012-01-06
  title: 藏区自焚潮
  lane: ethnic
  summary: 1月6日，四川阿坝格尔登寺附近一名藏族男子自焚，维权组织称这是一年内中国藏区第13起自焚。自2011年3月年轻僧人平措自焚后，四川藏区已有9名僧人和2名尼姑自焚抗议，至少7人死亡，有自焚者呼喊要求达赖喇嘛返回西藏。温家宝3月表示年轻僧人是无辜的，不赞成以极端行为破坏社会和谐。
  people: [wen-jiabao]
  cites: [e02-bbc-2012-01-06-tibet-immolation, e02-sina-2012-03-14-wen-presser]

- id: e2012-ma-ying-jeou-reelected
  date: 2012-01-14
  title: 马英九连任
  lane: hkmt
  summary: 台湾地区领导人选举中，马英九以接近80万票的差距击败民进党候选人蔡英文，获得连任。蔡英文表示对败选承担全部责任，宣布辞去民进党主席。马英九说连任后将继续深化与大陆的合作与互信，推动两岸减少摩擦的机制，同时强调将继续维护中华民国的主权独立与完整。
  people: [ma-yingjiu, cai-yingwen]
  cites: [e02-bbc-2012-01-14-ma-reelected]

- id: e2012-wang-lijun-consulate
  date: 2012-02-06
  title: 王立军进入美国驻成都总领事馆
  lane: purge
  major: true
  summary: 重庆市副市长王立军2月6日进入美国驻成都总领事馆，滞留一天后离开。重庆官方2月8日称他因长期超负荷工作、身体严重不适，正在接受“休假式的治疗”；外交部次日证实其进入领事馆。据新华社后来披露，谷开来杀害英商后与王立军矛盾激化，王立军被薄熙来扇耳光、调离公安局长职位，最终出走美领馆。
  people: [wang-lijun, bo-xilai, gu-kailai]
  cites: [e02-bbc-2012-02-09-wang-lijun-consulate, e02-bbc-2012-04-20-bo-timeline]

- id: e2012-wen-final-press-conference
  date: 2012-03-14
  title: 温家宝最后一次总理记者会
  lane: power
  summary: 温家宝在任内最后一次人大闭幕记者会上说，“文革”错误的遗毒和封建的影响并没有完全清除，没有政治体制改革的成功，“文化大革命”这样的历史悲剧还有可能重新发生。被问及王立军事件时，他说现任重庆市委和市政府必须反思，认真吸取教训。次日，中央宣布薄熙来不再兼任重庆市委书记。
  people: [wen-jiabao, bo-xilai, wang-lijun]
  cites: [e02-sina-2012-03-14-wen-presser, e02-xinhua-2012-03-15-chongqing-secretary]

- id: e2012-ling-gu-ferrari-crash
  date: 2012-03-18
  title: 令谷法拉利车祸
  lane: power
  summary: 3月18日北京四环发生一起法拉利车祸，驾车男子身亡。《环球时报》当时报道了车祸，但未表明死伤者身份，微博上的相关信息和照片被删除。9月初，《纽约时报》引述几位官员、英国《每日电讯报》等也报道，死者是中央办公厅主任、胡锦涛的紧密盟友令计划的儿子。
  people: [ling-gu, ling-jihua, hu-jintao]
  factions: [tuanpai]
  cites: [e02-nyt-2012-09-04-ling-ferrari, e02-bbc-2012-09-04-ling-crash-press]

- id: e2012-bo-xilai-removed
  date: 2012-03-15
  end: 2012-04-10
  title: 薄熙来被免职并立案调查
  lane: purge
  major: true
  summary: 3月15日，李源潮在重庆宣布中央决定，薄熙来不再兼任重庆市委书记，由张德江兼任。4月10日，中央以薄熙来涉嫌严重违纪，停止其政治局委员、中央委员职务，交中纪委立案调查；其妻薄谷开来和勤务人员张晓军涉嫌故意杀人，被移送司法机关。微博上有网民感慨“这不亚于四人帮倒台啊”。
  people: [bo-xilai, gu-kailai, zhang-dejiang, li-yuanchao]
  factions: [princelings, new-gang-of-four]
  voices:
    - voice: official
      text: 停止其担任的中央政治局委员、中央委员职务，由中共中央纪律检查委员会对其立案调查。
      cite: e02-xinhua-2012-04-10-bo-suspended
      quote: true
    - voice: zh
      text: 虽然在中国各大微博网站上“薄熙来”以及“谷开来”，甚至“薄”、“薄熙来”、“BXL”等均成为被禁止搜索的敏感词，但有网民将各报头版汇总为一张图片，并被广泛转发。
      cite: e02-bbc-2012-04-11-bo-frontpages
      quote: true
  cites: [e02-xinhua-2012-03-15-chongqing-secretary, e02-xinhua-2012-04-10-bo-suspended, e02-bbc-2012-04-20-bo-timeline, e02-bbc-2012-04-11-bo-frontpages]

- id: e2012-leung-chun-ying-elected
  date: 2012-03-25
  title: 梁振英当选香港特首
  lane: hkmt
  summary: 香港第四任行政长官选举中，梁振英在选举委员会投票中获689票，超过600张有效选票，选举主任依《行政长官选举条例》宣布他当选；唐英年得285票，何俊仁得76票。梁振英被视为受北京支持的候选人，此前有选委和报章称中联办官员施加压力，要求他们支持梁振英。
  people: [liang-zhenying]
  cites: [e02-govhk-2012-03-25-ce-election, e02-bbc-2012-03-25-leung-elected, e02-sina-2012-03-14-wen-presser]

- id: e2012-chen-guangcheng
  date: 2012-05-02
  end: 2012-05-19
  title: 陈光诚进入美国使馆后赴美
  lane: foreign
  summary: 盲人维权人士陈光诚进入美国驻华使馆后，5月2日离开使馆入院与家人团聚，数小时后又对朋友和外国媒体说感到受威胁、希望出国，拒绝了此前让他安全留在中国的协议，使正在北京参加中美高层会谈的希拉里和奥巴马政府陷入外交困境。5月19日，陈光诚与妻儿乘美联航班机赴美，到纽约大学法学院进修。
  people: [chen-guangcheng]
