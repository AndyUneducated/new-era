  lane: purge
  summary: 合肥市中级人民法院8月20日一审以故意杀人罪判处薄谷开来死刑、缓期二年执行，张晓军被判有期徒刑九年。法院认定，薄谷开来与英国人尼尔·伍德因经济利益发生矛盾，认为对方威胁其子安全，2011年11月在重庆一家酒店以氰化物将其毒杀。两人当庭表示不上诉。
