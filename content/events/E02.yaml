  lane: hkmt
  summary: 香港政府原定从2012年9月起分三年在中小学推行德育及国民教育科，批评者认为这是对下一代政治洗脑，教的内容爱党多于爱国。反对者在政府总部外以集会、罢课、绝食等方式抗议。9月8日梁振英宣布取消三年期限，由办学团体和学校自行决定是否开设、是否独立成科及推行方式。
