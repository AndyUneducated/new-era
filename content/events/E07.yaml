- id: e07-2006-dprk-nuclear-test
  date: 2006-10-09
  title: 朝鲜首次核试验与中方“悍然”表态
  lane: foreign
  summary: 10月9日朝鲜进行核试验。中国政府当天发表声明，称朝鲜无视国际社会的普遍反对，“悍然实施核试验，中国政府对此表示坚决反对”，重申实现半岛无核化、反对核扩散的立场，强烈要求朝方信守无核化承诺，停止一切可能导致局势进一步恶化的行动，重新回到六方会谈的轨道上来。
  voices:
    - voice: doc
      text: 中方强烈要求朝方信守无核化承诺，停止一切可能导致局势进一步恶化的行动，重新回到六方会谈的轨道上来。
      cite: e07-cyol-2006-10-10-dprk-test
      quote: true
  cites: [e07-cyol-2006-10-10-dprk-test]

- id: e07-2006-icbc-ipo
  date: 2006-10-27
  title: 工商银行A+H同步上市
  lane: econ
  summary: 10月27日，中国最大国有商业银行工商银行在香港和上海两地同步挂牌上市，成为第一家同时发行A股和H股、两地同时招股上市的公司。新华社称首次公开募股筹资约215亿美元，其中H股约156亿美元、A股约59亿美元；BBC称集资额逾1400亿港元，创下全球最大的集资纪录。农业银行决策层则表示最终会“择机上市”。
  voices:
    - voice: official
      text: 27日在香港和上海两地同步挂牌上市，进行全球最大规模的首次公开募股。
      cite: e07-xinhua-2006-10-27-icbc
      quote: true
  cites: [e07-xinhua-2006-10-27-icbc, e07-bbc-2006-10-19-icbc]

- id: e07-2007-xi-shanghai
