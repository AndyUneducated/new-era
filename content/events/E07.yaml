- id: e07-2007-taihu-algae
  date: 2007-05-29
  end: 2007-08-10
  title: 太湖蓝藻与吴立红案
  lane: society
  summary: 5月底太湖爆发蓝藻，无锡自来水水源受污染，市民抢购瓶装水，全市断水六天，230多万居民饮水出了问题。多年收集太湖水样、警告污染的“太湖卫士”吴立红，4月已被宜兴警方刑事拘留；8月10日宜兴市法院认定他自称“环保卫士”向企业索要钱财，以敲诈勒索罪和诈骗罪数罪并罚判处有期徒刑3年。
  cites: [e07-bbc-2007-05-31-taihu, e07-bbc-2007-10-taihu-cleanup, e07-cyol-2007-08-11-wu-lihong]

- id: e07-2007-labor-contract-law
