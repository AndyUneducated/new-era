  title: 深圳市长许宗衡落马
  lane: purge
  summary: 6月8日中央纪委证实，深圳市委副书记、市长许宗衡涉嫌严重违纪，正在接受组织调查。香港《南华早报》称他因牵涉国美电器创办人黄光裕的贿赂案被调查。2011年5月9日郑州市中级法院一审认定，2001年至2009年他利用组织部长、副市长、市长等职务便利受贿共计折合3318万余元，判处死刑缓期二年执行，没收个人全部财产。
  voices:
    - voice: zh
      text: 许宗衡是因为牵涉在国美电器创办人黄光裕的贿赂案而被调查的。
      cite: e07-bbc-2009-06-08-xu-zongheng
      quote: true
  cites: [e07-chinanews-2009-06-08-xu-zongheng, e07-bbc-2009-06-08-xu-zongheng, e07-chinanews-2011-05-09-xu-zongheng]

- id: e07-2009-deng-yujiao
  date: 2009-05
  end: 2009-06-16
  title: 邓玉娇案
  lane: society
  summary: 湖北巴东县“邓玉娇刺死官员案”喧腾一个月后，6月16日巴东县法院一审宣判：认定邓玉娇在遭受邓、黄两人无理纠缠、拉扯推搡、言词侮辱等不法侵害下实施反击，具有防卫性质但防卫过当，构成故意伤害罪；因她主动投案自首，且经鉴定属部分（限定）刑事责任能力，免于刑事处罚，当庭释放。有律师认为舆论起了一定作用。
  cites: [e07-voa-2009-06-16-deng-yujiao, e07-people-2009-06-16-deng-yujiao]

- id: e07-2009-shishou
  date: 2009-06-17
  end: 2009-06-25
  title: 湖北石首事件
  lane: society
  major: true
  summary: 6月17日晚，石首永隆大酒店23岁厨师涂远高从三楼坠亡，警方称是自杀，家属认为死因可疑。19日起大约四万名市民与警察冲突，阻止警方从酒店移走尸体，并设置路障阻断交通，约两百名居民受伤。25日石首市政府称公安部和同济医学院法医认定涂远高系高坠自杀，遗书为本人所写，尸体已火化。
  concepts: [stability-maintenance]
  voices:
    - voice: official
      text: 认定涂远高系高坠自杀死亡
      cite: e07-cctv-2009-06-25-shishou
      quote: true
    - voice: zh
      text: 家属认为涂远高死因可疑，因为涂远高耳鼻内有干血块，但尸体落下的地方却无一点血迹。
      cite: e07-bbc-2009-06-20-shishou
      quote: true
  cites: [e07-bbc-2009-06-20-shishou, e07-cctv-2009-06-25-shishou]

- id: e07-2009-tonghua-steel
  date: 2009-07-24
  title: 吉林通钢事件
  lane: econ
  summary: 7月24日，吉林通钢集团部分职工在厂区聚集上访，反对河北建龙集团对通钢增资扩股，围殴建龙新派驻的通钢股份公司总经理陈国君致死（新华社事后更正此前“陈国军”的写法）。吉林省国资委当天宣布建龙集团永不参与通钢重组。中国劳工通讯的蔡崇国对BBC说，国企工人民怨多又无处申诉，此类群体性事件会越来越多、越来越暴力。
  voices:
    - voice: official
      text: 反对河北建龙集团对通钢集团进行增资扩股，并将矛盾集中在建龙集团新派驻通化钢铁股份公司的总经理陈国君身上
      cite: e07-xinhua-2009-07-31-tonghua
      quote: true
  cites: [e07-xinhua-2009-07-31-tonghua, e07-bbc-2009-07-27-tonghua]

- id: e07-2009-chenzhou
  date: 2009-08-14
  title: 郴州腐败窝案终审
  lane: purge
  summary: 2006年下半年起，湖南郴州市委书记李大伦、市长周政坤、纪委书记曾锦春等接连落马，外界称“在监狱里可以召开市委常委会了”。曾锦春被抓后城区响起鞭炮声。8月14日湖南高院驳回上诉，维持李大伦死缓、曾锦春死刑的一审判决。李大伦案发前4年的常委会记录本“一年比一年薄”，最后只剩他一人的一句话。
  voices:
    - voice: official
      text: 驳回一审被告人李大伦、曾锦春上诉，维持长沙市中级人民法院一审判决。
      cite: e07-cctv-2009-08-14-chenzhou
      quote: true
  cites: [e07-cctv-2009-08-14-chenzhou, e07-moa-2009-09-chenzhou]

- id: e07-2009-urumqi-syringe
  date: 2009-09-03
  end: 2009-09-05
  title: 乌鲁木齐“针刺事件”与栗智被免
  lane: ethnic
  summary: 七五事件两个月后，乌鲁木齐发生一系列注射针头袭击事件，引发暴力抗议，9月3日抗议中五人死亡、14人受伤，数千名安全部队设卡巡逻。乌鲁木齐市委书记栗智和自治区公安厅长柳耀华随后被免职。官方称针刺事件是“严重的恐怖犯罪行为，目的是制造民族隔阂，挑起民族对立”。
  voices:
    - voice: official
      text: 严重的恐怖犯罪行为，目的是制造民族隔阂，挑起民族对立
      cite: e07-bbc-2009-09-06-li-zhi
      quote: true
  cites: [e07-bbc-2009-09-06-li-zhi, e07-voa-2009-09-05-li-zhi]

- id: e07-2009-fourth-plenum
  date: 2009-09-18
  title: 十七届四中全会：党建决定与习近平未进军委
  lane: power
  summary: 9月18日闭幕的中共十七届四中全会审议通过《中共中央关于加强和改进新形势下党的建设若干重大问题的决定》，习近平就决定讨论稿向全会作说明。全会承认党内存在“严重削弱党的创造力、凝聚力、战斗力”的问题。外界关注习近平能否在此次全会出任中央军委副主席，但官方媒体并未公布这一消息。
  people: [xi-jinping, hu-jintao]
  voices:
    - voice: doc
      text: 党内也存在不少不适应新形势新任务要求、不符合党的性质和宗旨的问题。
      cite: e07-cctv-2009-09-18-4th-plenum
      quote: true
    - voice: zh
      text: 不过官方媒体并未公布习近平担任中共中央军委副主席的消息。
      cite: e07-bbc-2009-09-18-4th-plenum
      quote: true
  cites: [e07-cctv-2009-09-18-4th-plenum, e07-bbc-2009-09-18-4th-plenum]

- id: e07-2009-pudong-entrapment
  date: 2009-10-14
  end: 2009-10-26
  title: 上海浦东“钓鱼执法”事件
  lane: society
  summary: 10月14日，上海浦东新区城管交通执法大队对来自河南的18岁青年司机孙中界进行“钓鱼”执法，事件曝光后引起舆论强烈关注。10月26日浦东新区召开记者会，承认执法中使用了“不正当取证手段”。区长姜樑说，城管局此前的错误结论“误导了公众和舆论”，并代表区政府向社会公众公开道歉。
  concepts: [rule-of-law]
  cites: [e07-bbc-2009-10-26-fishing]

- id: e07-2009-tang-fuzhen
  date: 2009-11
  end: 2009-12-07
  title: 唐福珍自焚与五学者上书
  lane: society
  summary: 成都拆迁户唐福珍在自家楼顶与城管执法人员对峙近三小时后，向身上倾倒汽油点火自焚，后不治身亡。12月7日，北京大学法学院姜明安、沈岿、王锡锌、钱明星和陈端洪五位学者以特快专递向全国人大常委会递交建议，认为《城市房屋拆迁管理条例》与宪法和物权法保护公民房屋的规定相抵触，请求审查并撤销或修改。
  concepts: [rule-of-law]
  cites: [e07-chinanews-2009-12-02-tang-fuzhen, e07-xjb-2009-12-08-five-scholars]

- id: e07-2009-copenhagen
  date: 2009-12
  end: 2009-12-22
  title: 哥本哈根气候大会与中英交锋
  lane: foreign
  summary: 12月哥本哈根气候变化大会结束后，英国气候大臣米利班德指责中国阻挠会议通过在2050年前全球减排50%、最发达国家减排80%的方案。中国外长杨洁篪则称大会取得了“重要而积极”的成果。外交部发言人姜瑜反驳说，英方指责“具有明显的政治图谋”，目的是“推卸其应该履行的对发展中国家的义务”。
  people: [yang-jiechi]
  cites: [e07-bbc-2009-12-21-copenhagen, e07-bbc-2009-12-22-copenhagen]

- id: e07-2010-huang-songyou
  date: 2010-01-19
  title: 最高法院前副院长黄松有被判无期
  lane: purge
  summary: 1月19日，廊坊市中级法院以受贿罪、贪污罪判处最高人民法院原副院长黄松有无期徒刑。法院认定2005年至2008年他为律师陈卓伦等五人在案件审判、执行中谋利，收受钱款折合390万余元；1997年任湛江中院院长时还伙同他人骗取公款308万元，个人分得120万元。判决称他“身为最高人民法院大法官，知法犯法”。
  concepts: [rule-of-law]
  cites: [e07-chinadaily-2010-01-19-huang-songyou]

- id: e07-2010-hukou-editorial
  date: 2010-03-01
  title: 13家报纸联合社论呼吁户籍改革
  lane: ideo
  summary: 两会前夕，13家报社3月1日联合发表“共同社论”《提请两会代表委员敦促加快户籍改革》。据香港《明报》报道，在中宣部推动下，发起此事的《经济观察报》高层受到整肃，负责起草社论的经济观察网前副总编辑张宏被解雇。《南方都市报》媒体研究院的长平认为，社论遭封杀主要是因为当局视这种表达形式为失控。
  voices:
    - voice: zh
      text: 当局认为这种表达意见的形式超出了他们的控制。
      cite: e07-bbc-2010-03-10-hukou-editorial
      quote: true
  cites: [e07-bbc-2010-03-10-hukou-editorial]

- id: e07-2010-yushu-quake
  date: 2010-04-14
  end: 2010-05-30
  title: 青海玉树地震
  lane: society
  summary: 4月14日青海玉树发生强烈地震。青海省政府5月底公布，截至5月30日18时，经民政、公安部门和玉树州政府核准，地震造成2698人遇难，其中已确认身份2687人、无名尸体11具，另有270人失踪；已确认身份者中玉树籍2537人、省内非玉树籍54人、外省籍96人，遇难学生199人。
  cites: [e07-embassy-2010-05-31-yushu]

- id: e07-2010-foxconn-suicides
  date: 2010-01
  end: 2010-06-02
  title: 富士康连环跳楼
  lane: society
  major: true
  summary: 2010年上半年，深圳富士康员工接连跳楼，BBC 5月27日称半年多内已有13人自杀。郭台铭否认这与工作压力和企业管理有关，归咎于大陆年轻人心理承受能力不够；劳工组织SACOM指富士康工会主席就是郭台铭的秘书。6月鸿海宣布为富士康在中国的员工加薪30%，BBC此时称当年已发生12起员工自杀事件、其中10人身亡。
  cites: [e07-bbc-2010-05-27-foxconn, e07-bbc-2010-06-02-foxconn]

- id: e07-2010-nanhai-honda-strike
  date: 2010-05
  end: 2010-06-04
  title: 南海本田罢工
  lane: society
  summary: 5月广东南海本田零部件厂中国工人罢工，公开信要求加薪800元并重新选举工会主席，称中国员工月薪约1500元，日籍员工却有5万元。工人推选16人谈判代表团，广汽集团总经理曾庆洪和人民大学教授常凯居间斡旋，6月4日劳资政三方达成协议，工资提高34%，每月约增加500元，但“重整工会”诉求没有结果。业界预计珠三角将面临加薪潮。
  cites: [e07-bbc-2010-05-28-honda, e07-wenweipo-2010-06-06-honda]

- id: e07-2010-xinjiang-forum
  date: 2010-05-17
  end: 2010-05-19
  title: 首次中央新疆工作座谈会
  lane: ethnic
  major: true
  summary: 七五事件后，中共中央、国务院5月17日至19日召开新疆工作座谈会，胡锦涛称新疆工作具有特殊重要的战略地位，提出到2015年新疆人均地区生产总值达到全国平均水平。中央决定在新疆率先把原油、天然气资源税由从量计征改为从价计征，对困难地区企业给予“两免三减半”所得税优惠。此前3月已确定19个省市对口援疆。
  people: [hu-jintao, wen-jiabao]
  cites: [e07-xinhua-2010-05-20-xinjiang-forum, e07-cnr-2010-06-23-aid-xinjiang]

- id: e07-2010-hk-political-reform
  date: 2010-06-21
  end: 2010-06-25
  title: 香港2012政改方案通过
  lane: hkmt
  summary: 6月21日，特区政府宣布接纳民主党提出的“1人两票”改良方案，2012年新增的5个功能界别议席改由区议会功能组别产生。立法会随后表决，60名议员中有46人支持、12人反对，困扰香港政界多年的政改方案终获通过。这是2007年全国人大常委会决定普选时间表后，香港首次通过政制改革方案。
  people: [zeng-yinquan]
  cites: [e07-hkgov-2010-06-21-tsang, e07-bbc-2010-06-25-hk-reform, e07-bbc-2007-12-29-hk-2017]

- id: e07-2010-hanoi-arf
  date: 2010-07-23
  end: 2010-07-25
  title: 河内东盟地区论坛南海交锋
  lane: foreign
  summary: 在河内举行的东盟地区论坛外长会议上，美国国务卿克林顿大谈南海与美国国家利益的关系，称亚洲公海的进出权与自由航运权关系到美国的国家利益，并反对在南海问题上“胁迫”。杨洁篪随后发表谈话，称这种讲话“实际上是在攻击中国”，并警告美国不要把南海问题多边化与国际化。
  people: [yang-jiechi]
  voices:
    - voice: official
      text: 这种貌似公允的讲话实际上是在攻击中国
      cite: e07-mfa-2010-07-25-yang-hanoi
      quote: true
    - voice: zh
      text: 拥有在亚洲公海的进出权与自由航运权关系到美国的国家利益
      cite: e07-bbc-2010-07-25-yang-hanoi
      quote: true
  cites: [e07-mfa-2010-07-25-yang-hanoi, e07-bbc-2010-07-25-yang-hanoi]

- id: e07-2010-yihuang
  date: 2010-09-10
  end: 2011-12
  title: 江西宜黄强拆自焚事件
  lane: society
  summary: 9月10日，江西宜黄县凤冈镇因拆迁发生自焚事件，3人重伤，79岁的叶忠诚18日死亡。事后县委书记邱建国率队在机场拦截欲赴京受访的拆迁户家属，县长苏建国率人到医院抢夺死者尸体，舆论哗然。两人先被立案调查，10月被免职；2011年12月新华社报道两人已复出，网民批评调查没有下文就复出是对民意的漠视。
  voices:
    - voice: official
      text: 在曾经的“立案调查”没有下文的情况下，就让被免职官员复出，这是对民意的漠视。
      cite: e07-dzwww-2011-12-06-yihuang
      quote: true
  cites: [e07-xinhua-2010-09-18-yihuang, e07-chinanews-2010-10-10-yihuang, e07-dzwww-2011-12-06-yihuang]

- id: e07-2010-jiaozhou-fire
  date: 2010-11-15
  end: 2011-06-09
  title: 上海胶州路公寓大火
  lane: society
  summary: 11月15日，上海静安区胶州路728号公寓大楼起火，造成58人死亡、71人受伤，直接经济损失1.58亿元。国务院调查组认定，节能改造施工中有人违规在10层窗外电焊，熔融物引燃9层脚手架上的聚氨酯保温材料；建设、投标、招标代理单位相互串通、虚假招标和违法分包。2011年6月对54名责任人作出处理，其中26人被移送司法机关。
  people: [yu-zhengsheng, han-zheng]
  cites: [e07-ce-2011-06-10-jiaozhou]

- id: e07-2010-qian-yunhui
  date: 2010-12-25
  end: 2011-02-01
  title: 浙江乐清钱云会之死
  lane: society
  summary: 12月25日，53岁的乐清蒲岐镇寨桥村前村委会主任钱云会被车碾压致死。他多年坚持为村民上访，抗议土地被强征用于修建电厂，死讯引发谋杀质疑。温州警方按交通肇事和命案两套程序侦查，宣布完全排除“谋杀”可能。2011年2月1日司机费良玉以交通肇事罪被判3年半，BBC引述记者说判决仍难以消除人们的疑问。
  concepts: [stability-maintenance]
  voices:
    - voice: official
      text: 乐清蒲岐“12·25”案件完全排除“谋杀”可能,认定为交通肇事案件。
      cite: e07-chinanews-2010-12-30-qian-yunhui
      quote: true
    - voice: zh
      text: 从法律角度，没有证据证明钱云会是被谋杀的，但是法庭的判决仍难以消除人们的疑问。
      cite: e07-bbc-2011-02-01-qian-yunhui
      quote: true
  cites: [e07-chinanews-2010-12-30-qian-yunhui, e07-bbc-2011-02-01-qian-yunhui]

- id: e07-2011-libya-evacuation
  date: 2011-02-22
  end: 2011-03-05
  title: 利比亚大撤侨
  lane: foreign
  major: true
  summary: 利比亚局势动荡后，中国政府在12天内调派91架次民航包机、12架次军机、5艘货轮和1艘军舰，租用35架次外航包机、11艘次外籍邮轮和100余班次客车，共撤出35860人，全部回国。外交部官员称这是新中国历史上最大规模的有组织撤侨，首次采用海陆空联动、首次把人员摆渡至第三国再撤回国。
  voices:
    - voice: official
      text: 这是新中国历史上最大规模的、有组织的撤离海外中国公民行动
      cite: e07-chinanews-2011-03-07-libya
      quote: true
  cites: [e07-chinanews-2011-03-07-libya]

- id: e07-2011-zengcheng
  date: 2011-06-10
  end: 2011-06-13
  title: 广东增城新塘事件
  lane: society
  summary: 6月，四川籍孕妇王联梅在增城新塘镇街头摆卖时遭驱赶，引发外来民工连续三晚骚乱，至少25人被捕，当地派驻大批军警戒备。市长叶牛平称这是“个别群众与治保人员纠纷引发的聚众滋事事件”，王联梅丈夫也出面说妻子和胎儿“都没事”；但外省民工控诉当地治安队长期勒索保护费、借故殴打外省民工。
  concepts: [stability-maintenance]
  voices:
    - voice: official
      text: 个别群众与治保人员纠纷引发的聚众滋事事件
      cite: e07-bbc-2011-06-13-zengcheng
      quote: true
    - voice: zh
      text: 当地外省民工控诉称，地方治安队长期对商户小贩勒索保护费，并借故殴打外省民工，引起民愤。
      cite: e07-bbc-2011-06-13-zengcheng
      quote: true
  cites: [e07-bbc-2011-06-13-zengcheng]

- id: e07-2011-lai-changxing
  date: 2011-07-23
  title: 赖昌星被加拿大遣返
  lane: purge
  summary: 厦门特大走私案首要嫌犯赖昌星1999年8月自香港潜逃加拿大并申请难民资格，被驳回后，7月23日被遣返回国，公安机关在首都机场向他宣布逮捕令。最高法院2007年曾表示，承诺不判他死刑是国际合作缉捕的必要条件。BBC引述分析称，曾主政福建的贾庆林会特别受到关注，但评论人刘锐绍认为当局对远华案已经划线。
  people: [jia-qinglin]
  voices:
    - voice: official
      text: 承诺不判处赖昌星死刑，是国际合作途径缉捕赖昌星的必要条件
      cite: e07-gov-2007-03-13-lai-no-death
      quote: true
    - voice: zh
      text: 中共已有对远华案划线的做法，即副部级以上的高官不受牵连
      cite: b02-bbc-2011-07-22-lai-politics
      quote: true
  cites: [e07-xinhua-2011-07-23-lai, e07-gov-2007-03-13-lai-no-death, b02-bbc-2011-07-22-lai-politics]

- id: e07-2011-dalian-px
  date: 2011-08-14
  end: 2011-08-15
  title: 大连PX“集体散步”
  lane: society
  major: true
  summary: 8月初台风“梅花”冲垮大连福佳大化石化厂的防波堤，民众担心有毒的对二甲苯（PX）泄漏。网上呼吁“集体散步”后，8月14日新华社称12000多名市民上街，在市政府前要求工厂搬出大连。市委书记唐军到广场对话并承诺搬迁，但群众不为所动。路透社称次日工厂不顾禁令照常运转。2007年厦门PX抗议也以取消建厂告终。
  concepts: [stability-maintenance]
  cites: [e07-bbc-2011-08-14-dalian, e07-bbc-2011-08-15-dalian]

- id: e07-2011-mekong-massacre
  date: 2011-10-05
  end: 2013-03-01
  title: 湄公河惨案
  lane: foreign
  summary: 10月5日，两艘中国货船在湄公河金三角水域遭武装人员袭击，13名中国船员遇害。泰国警察总监28日说，泰国陆军第三军区的9名军人涉嫌此案正在接受调查，但这些军人拒不承认谋杀和毁坏物证的指控。2013年3月1日，昆明市中级法院对糯康等四名湄公河案罪犯执行死刑。
  voices:
    - voice: official
      text: 负责泰国北部防务的泰国陆军第三军区的９名军人因涉嫌“１０·５”中国船员遇害案正在接受调查。
      cite: e07-gov-2011-10-29-mekong
      quote: true
    - voice: zh
      text: 9名泰国军人的归案并未使得惨案的真相大白于天下，反倒使案件早先的几个疑点更为突出。
      cite: e07-bbc-2011-10-29-mekong
      quote: true
  cites: [e07-gov-2011-10-29-mekong, e07-bbc-2011-10-29-mekong, e07-cyol-2013-03-02-naw-kham]

- id: e07-2011-sixth-plenum
  date: 2011-10-18
  title: 十七届六中全会提出“文化强国”
  lane: ideo
  summary: 10月18日闭幕的中共十七届六中全会审议通过《中共中央关于深化文化体制改革、推动社会主义文化大发展大繁荣若干重大问题的决定》，李长春向全会作说明。全会提出以建设社会主义核心价值体系为根本任务，培养文化自觉和文化自信，增强国家文化软实力，“努力建设社会主义文化强国”。
  people: [li-changchun, hu-jintao]
  concepts: [scientific-development]
  cites: [e07-cppcc-2011-10-18-6th-plenum]

- id: e07-2012-wu-ying
  date: 2012-03-14
  end: 2012-04-20
  title: 吴英集资诈骗案死刑复核
  lane: econ
  summary: 浙江吴英集资诈骗案死刑复核期间引起广泛关注。3月14日温家宝答记者问说，“这件事情反映了民间金融的发展与我们经济社会发展的需求还不适应”，表示要允许民间资本进入金融领域，并透露温州民间金融正被考虑作为综合改革试点。4月20日最高法院裁定不核准吴英死刑，发回浙江高院重审。
  people: [wen-jiabao]
  voices:
    - voice: official
      text: 吴英归案后，如实供述所犯罪行，并供述了其贿赂多名公务人员的事实，综合全案考虑，对吴英判处死刑，可不立即执行。
      cite: e07-court-2012-04-20-wu-ying
      quote: true
  cites: [e07-xinhua-2012-03-14-wen-wu-ying, e07-court-2012-04-20-wu-ying]

- id: e07-2012-beijing-rainstorm
  date: 2012-07-21
  end: 2012-08-06
  title: 北京“7·21”特大暴雨
  lane: society
  summary: 7月21日北京遭遇特大暴雨山洪泥石流灾害，房山区为重灾区。官方7月22日通报死亡37人，25日的新闻会拒绝公布新的伤亡数字，引起媒体和网民批评，网上有死亡超过300人的说法。7月26日北京市防汛办改称发现77具遇难者遗体，8月6日遇难者总数升至79人。
  voices:
    - voice: zh
      text: 中国媒体和网民批评北京官方周三（7月25日）晚上就暴雨发布的新闻会拒绝公布新的伤亡数字。
      cite: e07-bbc-2012-07-26-beijing-rain
      quote: true
  cites: [e07-chinanews-2012-08-06-beijing-rain, e07-bbc-2012-07-26-beijing-rain]

- id: e07-2012-tang-hui
  date: 2012-08-02
  end: 2012-08-10
  title: 唐慧被劳教引发舆论
  lane: society
  summary: 湖南永州唐慧的女儿被强奸和强迫卖淫，她为指控民警包庇、要求判处被告人死刑，多次到法院和有关单位上访。8月2日永州市劳教委以扰乱社会秩序为由对她劳动教养一年六个月，永州公安微博的说明转发评论逼近七万，几乎一边倒批评。湖南省委政法委派出调查组，省劳教委复议后撤销了这一劳教决定。
  concepts: [stability-maintenance, rule-of-law]
  cites: [e07-people-2012-08-10-tang-hui, e07-bbc-2012-08-10-tang-hui]

- id: e07-2012-mo-yan-nobel
  date: 2012-10-11
  end: 2012-10-12
  title: 莫言获诺贝尔文学奖
  lane: ideo
  summary: 10月11日莫言获诺贝尔文学奖。李长春致贺信，称这“也是我国综合国力和国际影响力不断提升的体现”；外交部发言人说莫言“文学造诣有目共睹”，同时重申两年前坚决反对把和平奖授予刘晓波。香港《明报》称两人际遇有天壤之别；莫言的中国作协副主席背景也引发争议，反对者认为他对压抑创作自由负有重大责任。
  people: [li-changchun, liu-xiaobo]
  voices:
    - voice: official
      text: 也是我国综合国力和国际影响力不断提升的体现
      cite: e07-xinhua-2012-10-12-li-changchun
      quote: true
    - voice: zh
      text: 一些反对莫言获奖的中国人士认为他对压抑创作自由负有重大责任，没有资格获奖。
      cite: e07-bbc-2012-10-12-mo-yan-hk
      quote: true
  cites: [e07-xinhua-2012-10-12-li-changchun, e07-gov-2012-10-12-mo-yan, e07-bbc-2012-10-12-mo-yan-hk]

- id: e07-2012-ningbo-px
  date: 2012-10
  end: 2012-10-28
  title: 宁波镇海PX抗议
  lane: society
  summary: 10月下旬，宁波市民抗议镇海炼化一体化项目中的PX装置，示威者高举“PX滚出宁波”标语，高喊要求市长刘奇辞职，与在场的300多名警察发生冲突，一些人被带走。10月28日宁波市政府宣布，经与投资方研究决定“坚决不上PX项目”，炼化一体化项目前期工作停止推进，再作科学论证。
  concepts: [stability-maintenance]
  cites: [e07-cnnb-2012-10-28-ningbo, e07-bbc-2012-10-27-ningbo]
