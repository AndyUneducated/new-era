  end: 2008-09-14
  title: 山西襄汾溃坝与孟学农二度下台
  lane: society
  major: true
  summary: 9月8日，山西襄汾县新塔矿业公司尾矿库溃坝，泥沙流经2公里，截至14日确认254人死亡、34人受伤，调查认定是一起特别重大责任事故。9月14日中央同意孟学农引咎辞去山西省长职务，副省长张建民被免职。孟学农2003年曾因应对非典不力被免去北京市长，这是他第二次因问责下台。
