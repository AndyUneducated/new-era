  end: 2008-11-07
  title: 陈云林首次访台与“野草莓”学运
  lane: hkmt
  major: true
  summary: 11月初海协会会长陈云林访台，4日与海基会董事长江丙坤在圆山饭店会谈，签署空运、海运、邮件和食品安全四项协议。BBC称他是1949年以来到访台湾的最高级大陆官员。5日晚他出席吴伯雄晚宴时遭群众包围、受困晶华酒店，凌晨两点多才脱身；6日与马英九的会面突然提前五个小时。大学生自6日起发起“野草莓运动”，抗议行政滥权。
