  cites: [e07-bbc-2007-12-29-hk-2017]

- id: e07-2008-super-ministry
  date: 2008-02-25
  end: 2008-03-18
  title: 十七届二中全会与“大部制”改革
  lane: power
  summary: 2月25日至27日，中共十七届二中全会通过《关于深化行政管理体制改革的意见》和《国务院机构改革方案》。3月十一届全国人大一次会议批准方案，探索实行职能有机统一的大部门体制，调整变动机构15个，减少正部级机构4个，国务院组成部门设置27个；会议选举胡锦涛为国家主席、习近平为国家副主席，决定温家宝为总理。
