  lane: society
  summary: 11月3日，重庆市主城区发生出租车罢运，市交委派出12个工作组进驻各出租车公司，督促车辆上路营运。市委书记薄熙来随后反思说，“这次出租车停运是事出有因，政府首先要检讨我们的工作”，要研究政府哪里做得不足或有官僚主义，并承认重庆出租车“份儿钱”确实不合理，应加以调整。
