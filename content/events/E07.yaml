  title: 人大常委会决定香港2017年可普选行政长官
  lane: hkmt
  summary: 12月29日全国人大常委会决定，2012年香港不实行行政长官和立法会“双普选”，但2017年行政长官可以由普选产生，随后2020年立法会选举也可普选产生；修改产生办法须经立法会三分之二多数通过、行政长官同意并报全国人大常委会批准。人大常委会副秘书长乔晓阳称，2017年是实行普选的最早时间。
  voices:
