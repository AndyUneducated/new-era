  title: 《劳动合同法》通过
  lane: econ
  summary: 2005年国务院向全国人大提出劳动合同法等7部法律议案。2007年6月29日，十届全国人大常委会第二十八次会议通过《中华人民共和国劳动合同法》。2008年政府工作报告要求“认真贯彻实施就业促进法和劳动合同法”，督促各类企业同劳动者依法签订并履行劳动合同，加强劳动争议处理和劳动保障监察，严厉打击非法用工。
