      quote: true
  cites: [e07-bbc-2008-11-26-yang-jia, e07-voa-2008-11-26-yang-jia]

- id: e07-2008-menglian
  date: 2008-07-19
  end: 2008-09
  title: 云南孟连胶农冲突
  lane: society
  summary: 7月19日，云南孟连县警方强制传唤5名胶农后，500多名胶农与民警冲突，官方称民警“被迫使用防暴枪自卫”，两人死亡，41名民警和19名群众受伤。海外人权组织称地方政府强迫胶农以低于市价40%出售收成。云南省委事后认定县委书记胡文彬把利益纠纷“错误定性”为恶势力问题，撤销其党内职务，普洱市委政法委书记谢丕坤被责令辞职。
  concepts: [stability-maintenance]
  voices:
    - voice: official
      text: 表面上看是警民冲突，实质上是胶农与企业的经济利益长期纠纷所引发的
      cite: e07-cyol-2008-07-24-menglian
      quote: true
  cites: [e07-bbc-2008-07-20-menglian, e07-cyol-2008-07-24-menglian, e07-people-2008-09-04-menglian]

- id: e07-2008-kashgar-attack
  date: 2008-08-04
  title: 喀什袭警案
  lane: ethnic
  major: true
  summary: 北京奥运开幕前四天，8月4日早晨，两名男子驾驶自卸式货车冲向正在出操的喀什公安边防支队队伍，又引爆爆炸装置、持刀行凶，造成16名干警死亡、16名受伤。警方称两人为28岁和33岁的出租车司机和菜贩，现场缴获自制爆炸装置9枚和宣扬“圣战”的宣传品。喀什官员称这是恐怖袭击，但也表示尚无充分证据断定“东伊运”是幕后主使。
  voices:
    - voice: official
      text: 已造成16名干警死亡，另有16名干警受伤。
      cite: e07-xinhua-2008-08-04-kashgar
      quote: true
    - voice: official
      text: No sufficient evidence has been found to say for sure that ETIM was behind Monday's deadly attack
