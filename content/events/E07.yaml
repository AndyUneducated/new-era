  title: 十七届三中全会推进农村改革
  lane: econ
  summary: 10月9日至12日，中共十七届三中全会通过《中共中央关于推进农村改革发展若干重大问题的决定》，对进一步推进农村改革发展作出全面部署。次年政府工作报告据此提出“现有土地承包关系要保持稳定并长久不变”，赋予农民更加充分而有保障的土地承包经营权，流转须坚持依法自愿有偿，并严守18亿亩耕地红线。
  people: [hu-jintao]
  concepts: [scientific-development]
  cites: [e07-cpc-dsj-2008, i02-gov-2009-gwr]

- id: e07-2008-chongqing-taxi-strike
