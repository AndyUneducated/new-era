# E07：2000–2012 年事件扩充（第四轮）

- id: e07-2000-hu-changqing
  date: 2000-02-15
  title: 江西原副省长胡长清一审被判死刑
  lane: purge
  summary: 2月15日，江西省南昌市中级人民法院对江西省人民政府原副省长胡长清受贿、行贿、巨额财产来源不明案作出一审判决，胡长清“因大肆收受、索取贿赂被判处死刑”，剥夺政治权利终身。此案被写入官方编纂的当年党史大事记，是江泽民时期惩处省部级腐败官员的标志性案件之一。
  cites: [e01-cpc-dsj-2000]

- id: e07-2000-fifth-plenum
  date: 2000-10-09
  end: 2000-10-11
  title: 十五届五中全会通过“十五”计划建议
  lane: econ
  summary: 10月9日至11日，中共十五届五中全会在北京举行，审议通过《中共中央关于制定国民经济和社会发展第十个五年计划的建议》。全会评价改革开放二十多年特别是“九五”以来的成就，认为从新世纪开始，“我国将进入全面建设小康社会，加快推进现代化的新的发展阶段”，并提出“十五”期间现代化建设的总体部署。
  people: [jiang-zemin]
  concepts: [xiaokang]
  cites: [e01-cpc-dsj-2000]

- id: e07-2001-sino-russian-treaty
  date: 2001-07-15
  end: 2001-07-25
  title: 中俄签署睦邻友好合作条约
  lane: foreign
  summary: 7月江泽民对俄罗斯、白俄罗斯、摩尔多瓦、乌克兰和马耳他进行国事访问。访俄期间，江泽民与普京在莫斯科签署“共25条、有效期为20年的《中华人民共和国和俄罗斯联邦睦邻友好合作条约》”，以法律形式确定两国“世代友好、永不为敌”的思想，规定两国今后在政治、经济、贸易、科技、文化和国际事务中合作的原则和方向。
  people: [jiang-zemin]
  cites: [e01-cpc-dsj-2001]

- id: e07-2001-nandan
  date: 2001-07-17
  title: 广西南丹矿难与瞒报
  lane: society
  summary: 7月17日，广西南丹县龙泉矿冶总厂下属拉甲坡矿和龙山矿发生重大透水事故，据报300名矿工被困井下。矿主黎东明利用矿上保安和社会恶势力威胁知情者和遇难者家属、用钱收买，隐瞒事故，后与其保镖等15人被刑事拘留。新华网称“南丹的财政收入有70%是依赖开矿的税收”，官员与矿主勾结、疏于监管，致使事故被掩盖、救援不力。
  cites: [e07-bbc-2001-08-07-nandan]

- id: e07-2002-lanjisu
  date: 2002-06-16
  title: 北京“蓝极速”网吧大火与网吧整顿
  lane: society
  summary: 6月16日凌晨，北京海淀区学院路的“蓝极速”网吧起火，大门锁着、其他出口被铁条封住，造成至少24人死亡、13人受伤。北京市长刘淇当即下令关闭北京所有网吧进行整顿。随后全国开展网吧消防检查，公安部称截至6月底“共检查3.9万多家网吧，依法责令停业整改1.1万多家，依法取缔3100多家”。
  people: [liu-qi]
  cites: [e07-bbc-2002-06-16-lanjisu, e07-cctv-2002-07-26-netbar-crackdown]

- id: e07-2003-second-plenum
  date: 2003-02-24
  end: 2003-02-26
  title: 十六届二中全会部署国务院机构改革
  lane: power
  summary: 2月24日至26日，中共十六届二中全会在北京举行。这是十六大产生新一届中央委员会后的第二次全会，全会审议通过关于深化行政管理体制和机构改革的意见，建议国务院根据这个意见形成《国务院机构改革方案》，提交3月召开的十届全国人大一次会议审议，为国务院换届和机构改革作出部署。
  cites: [e07-cpc-dsj-2003]

- id: e07-2003-third-plenum
  date: 2003-10-11
  end: 2003-10-14
  title: 十六届三中全会完善市场经济体制
  lane: econ
  summary: 10月11日至14日，中共十六届三中全会在北京举行，听取和讨论胡锦涛受中央政治局委托作的工作报告，审议通过《中共中央关于完善社会主义市场经济体制若干问题的决定》，并审议通过《中共中央关于修改宪法部分内容的建议》，决定提交十届全国人大常委会审议。
  people: [hu-jintao]
  cites: [e07-cpc-dsj-2003]

- id: e07-2003-sun-dawu
  date: 2003-10-30
  title: 民营企业家孙大午案宣判
  lane: society
  summary: 河北大午农牧集团董事长孙大午5月被警方拘留、7月5日被逮捕。10月30日徐水县法院以“非法吸收公众存款罪”判处他有期徒刑3年、缓期4年执行，交纳10万元罚金。检方指大午公司向社会变相吸收存款1627单、共计1308万余元，涉及611人；辩方称资金用于生产经营和兴办教育。不少人认为他是“因言获罪”，刘晓波称此案是“恶法治国”。
  people: [sun-dawu, liu-xiaobo, xu-zhiyong]
  concepts: [liberals]
  voices:
    - voice: official
      text: 有些知名经济学家曾公开为孙大午一案喊冤。
      cite: e07-cyol-2003-10-31-sun-dawu
      quote: true
  cites: [e07-cyol-2003-10-31-sun-dawu, c04-bbc-2021-07-28-sun-dawu]

- id: e07-2003-kaixian-blowout
  date: 2003-12-23
  title: 重庆开县井喷事故
  lane: society
  summary: 12月23日，中国石油天然气集团公司川东钻探公司在重庆开县的一口高含硫气井发生井喷，大量含高浓度硫化氢的有害气体喷出，事故导致200多人丧生。国家安全生产监督管理局副局长、调查组组长孙华山称，这是一起因现场作业人员违章违规造成的特大责任事故：有关人员拆除了防井喷的回压阀，井喷失控后又没有及时点火。
  factions: [petroleum]
  voices:
    - voice: official
      text: 有关人员违反有关规定拆除了在钻具中安装的回压阀，也就是防井喷的装置，导致了井喷的严重失控。
      cite: e07-bbc-2004-01-02-kaixian
      quote: true
  cites: [e07-bbc-2004-01-02-kaixian, e07-chinanews-2004-04-14-ma-fucai]

- id: e07-2004-ma-fucai-resigns
  date: 2004-04-14
  title: 中石油总经理马富才因开县井喷引咎辞职
  lane: power
  summary: 开县“12·23”井喷事故后，中石油总经理、党组书记马富才多次表示负有领导责任并提出引咎辞职。4月中央批准他辞去党组书记，国务院同意他辞去总经理职务，分管安全的副总经理任传俊被记大过。国资委称“安全生产责任重于泰山”。一年前非典疫情中，卫生部长张文康和北京市长孟学农已被免职，问责由此延伸到央企负责人。
  people: [meng-xuenong]
  factions: [petroleum]
  voices:
    - voice: official
      text: 鉴于调查认定这起事故是一起责任事故，马富才同志负有主要领导责任
      cite: e07-chinanews-2004-04-14-ma-fucai
      quote: true
  cites: [e07-chinanews-2004-04-14-ma-fucai, e01-bbc-2023-03-13-jiang-yanyong-obit]

- id: e07-2004-fuyang-milk
  date: 2004-04
  end: 2004-05-16
  title: 安徽阜阳劣质奶粉事件
  lane: society
  summary: 4月官方媒体报道，大量伪劣婴儿奶粉流入安徽阜阳农村，上百名婴儿严重营养不良，成为“大头娃娃”。国务院调查组5月核实，因食用劣质奶粉营养不良的婴儿229人，死亡婴儿共12人；阜阳市政府先前公布的13人中有3人死于其他疾病。55种不合格奶粉涉及10个省份的40家企业，警方刑事拘留47人、逮捕31人。
  people: [wen-jiabao]
  voices:
    - voice: official
      text: 阜阳市因食用劣质奶粉造成营养不良而死亡的婴儿共计12人。
      cite: e07-chinanews-2004-05-16-fuyang
      quote: true
    - voice: zh
      text: 造成当地上百名婴儿严重营养不良，而且陆续患上怪病，变成"大头娃娃"。其中至少8名婴孩已经夭折。
      cite: e07-bbc-2004-04-20-fuyang
      quote: true
  cites: [e07-chinanews-2004-05-16-fuyang, e07-bbc-2004-04-20-fuyang]

- id: e07-2004-tieben
  date: 2004-04-30
  title: 江苏铁本事件
  lane: econ
  major: true
  summary: 国务院4月30日通报江苏铁本钢铁违规项目：设计能力840万吨钢、概算总投资105.9亿元，被“化整为零”拆分成22个项目报批，实际占用土地6541亩，2004年3月被责令全面停工。常州市委书记范燕青等8名官员和银行负责人受处分，铁本法人代表戴国芳等10人被刑事拘留。通报借此要求整肃过热投资，确保宏观调控“政令畅通”。
  concepts: [scientific-development]
  voices:
    - voice: doc
      text: 铁本公司项目是一起典型的地方政府有关部门严重失职违规、企业涉嫌违法犯罪的固定资产投资项目。
      cite: e07-gov-2004-tieben
      quote: true
  cites: [e07-gov-2004-tieben]

- id: e07-2004-audit-storm
  date: 2004-06
  title: 李金华审计报告与“审计风暴”
  lane: econ
  summary: 审计署自2003年开始公布年度审计报告，被中国媒体称为“审计风暴”。2004年6月审计长李金华向全国人大常委会提交2003年度报告，点名国家体育总局动用中国奥委会专项资金1.31亿元、国防科工委年初预留预算比例达38.8%，并揭出长江堤防“豆腐渣”工程、挤占挪用救灾资金等。据外媒报道，李金华被中国媒体选为2004年“年度人物”。
  voices:
    - voice: official
      text: 国家体育总局动用中国奥委会专项资金1.31亿元，其中用于建设职工住宅小区1.09亿元
      cite: e07-cctv-2004-06-24-audit
      quote: true
    - voice: zh
      text: 他坚持将"审计利剑"指向位高权重中央部门，赢得了人民英雄形象。
      cite: e07-bbc-2005-06-29-audit
      quote: true
  cites: [e07-cctv-2004-06-24-audit, e07-bbc-2005-06-29-audit]

- id: e07-2004-southern-metropolis-case
  date: 2004-06-15
  end: 2004-08-31
  title: 《南方都市报》高层获刑案
  lane: ideo
  summary: 《南方都市报》曾报道孙志刚被打死案、孙大午案和广州非典疫情，使地方政府极为尴尬。随后该报多名高层以经济罪受审：喻华峰6月15日被判八年，南方日报报业集团社务委员李民英被判六年；前总编辑程益中被指贪污10万元，8月31日获广州东山区检察院以证据不足不起诉。BBC称外界认为这些案件含有政治动机。
  voices:
    - voice: zh
      text: 《南方都市报》多名高层被判刑的事件引起了广泛的反响，人们认为这些案件含有政治动机。
      cite: e07-bbc-2004-08-31-cheng-yizhong
      quote: true
  cites: [e07-bbc-2004-08-31-cheng-yizhong]

- id: e07-2004-lang-gu
  date: 2004-08-09
  end: 2005-07-29
  title: “郎顾之争”与国企产权改革争论
  lane: econ
  summary: 8月9日，香港中文大学教授郎咸平在复旦大学演讲，指格林柯尔董事长顾雏军用“七板斧”伎俩在“国退民进”中侵吞国有资产，顾雏军告其诽谤。郎咸平认为国有资产流失是最大威胁，呼吁停止国企改革，引发全国性的国企产权改革争论。2005年7月29日顾雏军因涉嫌挪用上市公司资金被捕，“郎顾之争”告一段落，但改革要不要触动产权的争论仍在继续。
  concepts: [new-left]
  cites: [e07-people-2014-05-04-langgu]

- id: e07-2004-wanzhou
  date: 2004-10-18
  end: 2004-10-19
  title: 重庆万州事件
  lane: society
  summary: 10月18日，重庆万州一名挑夫被打，当地警察处理不公激起民愤，民众追打警察、烧毁警车，与防暴武警对峙；19日上午人群再次包围区政府，重庆派出大批防暴武警用警棍和催泪瓦斯驱散，多人受伤，区政府门前广场全面戒严。同月四川汉源、陕西榆林、河南中牟也发生大规模冲突，引起高层重视。
  concepts: [stability-maintenance]
  cites: [e07-bbc-2004-12-review-2]

- id: e07-2004-hanyuan
  date: 2004-10
  end: 2004-11
  title: 四川汉源瀑布沟移民抗议
  lane: society
  major: true
  summary: 瀑布沟水电站至少需移民10多万人，汉源县移民不满征地补偿过低，指地方官贪污挪用搬迁费。10月底到11月初，数万名农民与当地政府和军警发生流血冲突。四川省委书记张学忠赴现场时一度被人群扣作人质，上万名武警出动，数百人被捕。被控打死一名武警的村民陈滔2006年11月底被秘密处决。周永康称2004年群体事件由58,000起升至74,000起。
  people: [zhou-yongkang]
  concepts: [stability-maintenance]
  voices:
    - voice: zh
      text: 很多当地民众指责地方官蒙骗中央，贪污挪用大坝搬迁费、克扣搬迁居民的应得补偿。
      cite: e07-bbc-2004-11-07-hanyuan
      quote: true
  cites: [e07-bbc-2004-11-07-hanyuan, e07-bbc-2006-12-hanyuan-execution]

- id: e07-2005-split-share-reform
  date: 2005-04-29
  title: 启动上市公司股权分置改革
  lane: econ
  major: true
  summary: 经国务院批准，证监会4月29日发布通知，启动上市公司股权分置改革试点，着手解决非流通股与流通股并存的股权分置问题。方案由试点公司股东自主决定，但须经参加表决的股东及流通股股东所持表决权各三分之二以上通过；非流通股获得流通权后“至少在十二个月内不上市交易或者转让”，大股东此后还须分步减持。
  cites: [e07-chinanews-2005-04-29-split-share]

- id: e07-2005-hu-soong
  date: 2005-05-12
  title: 胡锦涛与宋楚瑜会谈公报
  lane: hkmt
  summary: 继连战访问之后，亲民党主席宋楚瑜5月5日至13日率团访问大陆，这是中共与亲民党首次两党交流对话。5月12日胡锦涛与宋楚瑜在北京会谈并发表公报，提出在“九二共识”基础上尽速恢复两岸平等谈判、坚决反对“台独”、推动结束敌对状态、加强经贸交流等六点，并筹设“两岸民间菁英论坛”。宋楚瑜在会见时重申亲民党三点基本立场。
  people: [hu-jintao, zeng-qinghong]
  voices:
    - voice: official
      text: 这是中国共产党与亲民党之间首次进行两党交流对话，具有重要意义。
      cite: e07-gwytb-2005-05-12-hu-soong
      quote: true
    - voice: zh
      text: 我们从来不认为‘台独’应该是台湾的选项，因为那只能带来灾难和战争
      cite: e07-bbc-2005-05-12-soong
      quote: true
  cites: [e07-gwytb-2005-05-12-hu-soong, e07-bbc-2005-05-12-soong]

- id: e07-2005-dingzhou
  date: 2005-06-11
  end: 2005-07
  title: 河北定州绳油村血案
  lane: society
  summary: 定州绳油村村民抗议国华定洲电厂征地建贮灰场补偿不足。6月11日清晨，200多名身穿迷彩服、手持刀枪棍棒的男子袭击抗议村民，造成六人死亡、48人受伤。新华社事后称河北省和保定市“决定不再征用该村土地”，电厂另行选址；警方以“6·11”案逮捕31人、刑事拘留131人。
  concepts: [stability-maintenance]
  voices:
    - voice: official
      text: 河北省政府和保定市政府决定不再征用该村土地，电厂贮灰场用地将另行选址。
      cite: e07-bbc-2005-07-21-dingzhou
      quote: true
  cites: [e07-bbc-2005-06-16-dingzhou, e07-bbc-2005-07-21-dingzhou]

- id: e07-2005-cnooc-unocal
  date: 2005-06
  end: 2005-08-02
  title: 中海油收购优尼科受挫
  lane: foreign
  summary: 中海油提出以总价一百八十五亿美元现金收购美国优尼科公司全部流通股，比雪佛龙竞价高约十亿美元。6月30日美国众议院以398票赞成、15票反对，要求布什政府检讨这项收购。8月2日中海油宣布撤回要约，董事长傅成玉称美方给予不公平待遇；优尼科董事会接受雪佛龙173亿美元的出价。中海油称竞购宣布后美国出现“前所未有的政治上的反对声音”。
  voices:
    - voice: official
      text: 我们竞购交易宣布后，在美国出现了前所未有的政治上的反对声音
      cite: e07-chinanews-2005-08-03-cnooc
      quote: true
    - voice: zh
      text: 中国经济迅速发展，而美国对华贸易赤字高达1600亿美元；此外，北京的政治和军事实力开始崛起。
      cite: e07-bbc-2005-07-03-cnooc
      quote: true
  cites: [e07-chinanews-2005-08-03-cnooc, e07-bbc-2005-07-03-cnooc, e07-bbc-2005-08-02-cnooc]

