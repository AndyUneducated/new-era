  title: 习近平调任上海市委书记
  lane: power
  major: true
  summary: 陈良宇落马半年后，3月24日中组部长贺国强在上海党政负责干部大会上宣布，习近平任上海市委书记，称“习近平同志担任上海市委书记是合适的”，并肯定代理书记韩正半年来的工作。新华社只用一句话报道这一任命，没有说明中央何时作出决定。BBC指上海市委书记按惯例是政治局委员，舆论认为此举与十七大的领导层布局有关。
