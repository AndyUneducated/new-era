- id: e07-2008-yang-jia
  date: 2008-07-01
  end: 2008-11-26
  title: 杨佳袭警案
  lane: society
  summary: 北京青年杨佳2007年10月在上海骑自行车时遭巡逻民警盘查，因态度不配合被带回派出所，有传言称他遭殴打，上海警方否认。2008年7月1日他持刀在闸北公安分局袭击警察和保安，造成6名警察死亡、3名警察和1名保安受伤。他被判处死刑，经最高法院核准于11月26日被处决，但中国社会出现很多同情他的声音。
  concepts: [stability-maintenance]
