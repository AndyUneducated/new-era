  cites: [c03-ccdi-2014-06-14-su-rong-probe, c03-ccdi-2015-02-16-su-rong-expel, c03-people-2017-01-23-su-rong-verdict]

- id: e08-2015-skynet-red-notices
  date: 2015-04-22
  title: “天网”行动与百名红色通缉令
  lane: purge
  summary: 2015年4月22日晚，国际刑警组织中国国家中心局集中公布100名外逃国家工作人员和重要腐败案件涉案人的红色通缉令，人民网称这在中国尚属首次。名单之首是浙江省建设厅原副厅长、“第一女巨贪”杨秀珠，还有“逃跑书记”杨湘洪和河北省委原书记程维高之子程慕阳。此前中央反腐败协调小组国际追逃追赃工作办公室已决定启动“天网”行动。
  cites: [e08-people-2015-04-23-red-notice]

