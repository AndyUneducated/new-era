  date: 2022-09-22
  end: 2022-09-23
  title: 傅政华、孙力军被判死缓并终身监禁
  lane: purge
  summary: 2022年9月22日和23日，长春中院先后宣判司法部原部长傅政华和公安部原副部长孙力军。傅政华受贿1.17亿余元，并在任北京市公安局局长时隐瞒其弟付卫华涉嫌严重犯罪的线索；孙力军受贿6.46亿余元，另犯操纵证券市场、非法持有枪支罪。二人均被判死缓，期满减为无期徒刑后终身监禁、不得减刑假释。官方通报称他们均属孙力军“政治团伙”。
  people: [fu-zhenghua, sun-lijun]
  factions: [sun-lijun-gang, zhengfa]
  voices:
    - voice: scholar
      text: 在二十大前夕审判傅政华和孙力军，反映中共党内权力斗争加剧，习近平意图给潜在的政治对手释放一些信号，让他们不敢轻举妄动。
      cite: f03-bbc-2022-09-27-fu-sun
      quote: true
  cites: [c03-xinhua-2022-09-22-fu-zhenghua-verdict, c03-xinhua-2022-09-23-sun-lijun-verdict, f03-bbc-2022-09-27-fu-sun]

