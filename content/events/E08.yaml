- id: e08-2021-lai-xiaomin-executed
  date: 2021-01-29
  title: 华融原董事长赖小民被执行死刑
  lane: purge
  summary: 2021年1月5日，天津二中院以受贿、贪污、重婚罪判处中国华融原董事长赖小民死刑，认定其受贿17.88亿余元，其中1.04亿余元属未遂，并伙同特定关系人侵吞公款2513万余元。经最高法院核准，1月29日赖小民被执行死刑。BBC指近年中国对经济类犯罪判处死刑较为少见，白恩培、魏鹏远等人均被判死缓及终身监禁。
  people: [lai-xiaomin]
  voices:
    - voice: official
      text: 赖小民受贿数额特别巨大，犯罪情节特别严重，社会影响特别恶劣
      cite: c03-xinhua-2021-01-29-lai-xiaomin-executed
      quote: true
    - voice: west
      text: 因受贿等金融犯罪对赖小民处以死刑，是骇人听闻和不可接受的，显然违背了中国对尊重国际人权标准的承诺。
      cite: b12-bbc-2021-01-07-lai-xiaomin
      quote: true
  cites: [c03-court-2021-01-05-lai-xiaomin-verdict, c03-xinhua-2021-01-29-lai-xiaomin-executed, b12-bbc-2021-01-07-lai-xiaomin]

