- id: e08-2017-chongqing-inspection-revisit
  date: 2017-02-11
  title: 中央巡视组对重庆“回头看”反馈：清除薄王遗毒不彻底
  lane: purge
  summary: 2017年2月11日，中央第十一巡视组向重庆市委反馈巡视“回头看”情况，组长徐令义当面向政治局委员、市委书记孙政才指出，重庆存在党的领导弱化、选人用人把关不严、一些干部带病提拔等问题，上轮巡视整改不到位，清除薄熙来、王立军思想遗毒不彻底。这轮“回头看”于2016年11月至2017年1月进行，反馈会由中央巡视工作领导小组成员姜信治主持。
  people: [sun-zhengcai, bo-xilai, wang-lijun]
  voices:
