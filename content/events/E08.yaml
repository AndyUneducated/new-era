      quote: true
  cites: [b07-ccdi-2017-02-13-chongqing-inspection]

- id: e08-2017-lu-wei
  date: 2017-11-21
  title: 前网信办主任鲁炜落马
  lane: purge
  summary: 2017年11月21日，中纪委宣布中宣部原副部长鲁炜涉嫌严重违纪接受组织审查，他是十九大后落马的首位正部级官员。鲁炜2013年起任国家网信办主任，曾与潘石屹等十多位“大V”座谈并达成“七条底线”共识，乌镇世界互联网大会被视为他的政治遗产，BBC称他是中国互联网审查的捍卫者。中央巡视组此前指网信办“存在小圈子”等问题。
  people: [lu-wei]
  voices:
    - voice: witness
      text: 他很聪明，知道网络发达了他的权力也大了，他给了网络媒体一些空间，而他的继任者还是在沿用管制传统媒体那一套方法。
      cite: b12-bbc-2017-11-22-lu-wei
      quote: true
  cites: [c03-ccdi-2017-11-21-lu-wei-probe, b12-bbc-2017-11-22-lu-wei]

- id: e08-2018-national-supervision-commission
  date: 2018-03-20
  end: 2018-03-23
  title: 《监察法》通过，国家监察委员会挂牌
  lane: purge
  major: true
  summary: 2018年3月20日，十三届全国人大一次会议表决通过《监察法》，此前已选举杨晓渡为国家监察委员会主任；23日国家监委揭牌，赵乐际称这“标志着中国特色国家监察体制已经形成”。监察法以“留置”取代党纪检查中的“两规”，留置最长不得超过半年，期间不允许律师介入；BBC称“双规”长期以来一直遭到外界批评。
  people: [yang-xiaodu, zhao-leji]
  voices:
    - voice: official
      text: 纪委监委作为党内监督、国家监察的专责机关
      cite: e08-xinhua-2018-03-23-ncs
      quote: true
    - voice: zh
      text: 留置过程中最引起外界关注的是，期间不允许律师介入。
      cite: e08-bbc-2018-03-20-supervision-law
      quote: true
  cites: [e08-xinhua-2018-03-23-ncs, e08-bbc-2018-03-20-supervision-law]

