- id: e08-2013-ccdi-second-plenum
  date: 2013-01-22
  title: 十八届中纪委二次全会：“老虎”“苍蝇”一起打
  lane: purge
  major: true
  summary: 2013年1月22日，习近平在十八届中央纪委二次全会上讲话，称反腐败斗争形势依然严峻，要求“有腐必反、有贪必肃”，坚持“老虎”、“苍蝇”一起打，并要求加强对权力运行的制约和监督，“把权力关进制度的笼子里”，形成不敢腐、不能腐、不易腐的机制。王岐山主持会议，并代表中纪委常委会作工作报告。
  people: [xi-jinping, wang-qishan]
  concepts: [eight-point-rules]
  voices:
    - voice: official
      text: 要坚持“老虎”、“苍蝇”一起打，既坚决查处领导干部违纪违法案件，又切实解决发生在群众身边的不正之风和腐败问题。
      cite: e08-gov-2013-01-22-ccdi-plenum
      quote: true
  cites: [e08-gov-2013-01-22-ccdi-plenum]

- id: e08-2013-liu-tienan
  date: 2013-05-12
  end: 2014-12-10
  title: 刘铁男落马：十八大后首个被“双开”的省部级官员
  lane: purge
  summary: 2013年5月，中纪委宣布国家发改委副主任、国家能源局原局长刘铁男涉嫌严重违纪接受组织调查，8月被开除党籍和公职。他是十八大后首个被中纪委立案调查并“双开”的省部级官员，此前媒体人罗昌平曾实名举报其伪造学历、与商人结成官商同盟。2014年12月10日，刘铁男因受贿3558万余元一审被判无期徒刑；此案还牵出能源系统20多名官员和国企高管落马。
  people: [liu-tienan]
  cites: [c03-jjckb-2013-05-12-liu-tienan-probe, c03-ccdi-2013-08-08-liu-tienan-expel, c03-chinacourt-2014-12-10-liu-tienan-verdict]

- id: e08-2013-jiang-jiemin
  date: 2013-09-01
  end: 2015-10-12
  title: 国资委主任蒋洁敏被查，后获刑十六年
  lane: purge
  summary: 2013年9月1日，中纪委宣布国务院国资委主任、中石油集团原董事长蒋洁敏涉嫌严重违纪接受组织调查，他长期在胜利油田、青海石油管理局和中石油系统任职。2015年10月12日，湖北汉江中院以受贿、巨额财产来源不明、国有公司人员滥用职权罪判处其有期徒刑十六年，认定他受贿1403万余元，并在2004至2008年间“在周永康指使或授意下”违规为他人经营活动提供帮助。
  people: [jiang-jiemin, zhou-yongkang]
  factions: [petroleum, zhou-clique]
  cites: [c03-12371-2013-09-01-jiang-jiemin-probe, c03-xinhua-2015-10-12-jiang-jiemin-verdict]

- id: e08-2014-su-rong
  date: 2014-06-14
  end: 2017-01-23
  title: 全国政协副主席苏荣落马
  lane: purge
  summary: 2014年6月14日，中纪委宣布全国政协副主席苏荣涉嫌严重违纪违法接受组织调查。2015年2月中纪委通报称其大肆卖官鬻爵，支持、纵容亲属利用其特殊身份擅权干政，对江西省出现的严重腐败问题负有主要领导责任，决定开除其党籍和公职。2017年1月23日，济南中院认定他受贿1.16亿余元，以受贿、滥用职权、巨额财产来源不明罪判处无期徒刑。
