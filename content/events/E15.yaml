  summary: 2026年初，晨起喝热水、居家穿棉拖鞋、熬苹果银耳汤等华人生活习惯在TikTok和Instagram上流行，各国年轻人纷纷效仿，戏称自己正在“成为中国人”，英文称Chinamaxxing。外交部发言人林剑2月6日在记者会上说，“很高兴看到越来越多的外国朋友有意愿、有机会感受中国的发展变化”，体验中国百姓的烟火日常。
