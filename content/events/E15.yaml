- id: e15-2026-openclaw-lobster
  date: 2026-03
  title: “养龙虾”热潮与官方降温
  lane: folk
  summary: 2026年3月，开源AI代理软件OpenClaw在中国爆红，因其标志为红色龙虾，被俗称“龙虾”，网民争相“养龙虾”。腾讯在深圳的安装活动近千人排队，百度办起“龙虾市集”。随后国企和政府机构被要求限制在办公网络使用，至少15家券商禁止私装，工信部发出风险提示；新华网转载经济日报评论，提醒普通用户“先别着急尝鲜”，网上随即出现付费“卸龙虾”。
  cites: [e15-bbc-2026-03-17-openclaw, e15-xinhua-2026-03-18-openclaw]

- id: e15-2026-feidudu
  date: 2026-08
  title: “胆子真是肥嘟嘟的”
  lane: folk
  summary: 2026年8月，“胆子真是肥嘟嘟的”刷屏。它出自一段网传对话：顾客打算出一百元小费请骑手捎一包烟，一旁的商家跳出来抢单，骑手吐槽“抢生意都抢到我头上来了，胆子真是肥嘟嘟的”。紫金山新闻说，这句话后来被用来调侃各种大胆操作，既表达“你好大的胆子”又不至于引发争吵，在抖音、微博衍生大量表情包和配音段子，“成为八月刷屏的网络流行语”。
  cites: [e15-zjsnews-2026-08-26-feidudu]
