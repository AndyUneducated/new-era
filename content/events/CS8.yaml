- id: cs8-2026-xin-baoan-guo-wenqing
  date: 2026-07-31
  title: 国家电网原董事长辛保安被查，五矿原总经理国文清主动投案
  lane: purge
  summary: 2026年7月31日，新华社同日发布两条消息：国家电网原董事长辛保安涉嫌严重违纪违法接受审查调查；中国五矿原总经理国文清涉嫌严重违纪违法，主动投案。辛保安是继寇伟之后又一位被查的国家电网前董事长。此前一周，中核原总经理顾军、哈电原纪委书记杨宏勇先后被开除党籍；8月8日东方电气原党组副书记宋致远也被宣布审查调查。
