# CS8 — events for the soe-chiefs-2024 case: the 2013 aerospace boards, the 2016 discipline-group reshuffle, the formal probes of 2024 and 2026, the 2025 deputies removed, the navy commissar
- id: cs8-2013-aerospace-boards
  date: 2013-04-24
  title: 航天科技、航天科工设立董事会，许达哲、曹建国等换岗
  lane: power
  summary: 2013年4月，中共中央、国务院决定航天科技、航天科工两大集团设立董事会。航天科工总经理许达哲改任航天科技董事长、党组书记，航天科技副总经理雷凡培升任总经理；航天科工副总经理高红卫任该集团董事长，副总经理曹建国接任总经理。十二年后两人都已出局：许达哲2025年9月被湖南省人大常委会罢免全国人大代表，未说明原因；2016年起执掌中国航发的曹建国2025年12月被撤销全国政协委员资格。
  people: [xu-dazhe, lei-fanpei, cao-jianguo]
