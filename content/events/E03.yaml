- id: e03-2014-kunming-station-attack
  date: 2014-03-01
  title: 昆明火车站暴力恐怖袭击
  lane: ethnic
  summary: 2014年3月1日晚，五名袭击者在昆明火车站持刀砍杀民众，四人被当场击毙，一人被击伤抓获。云南省高级人民法院二审查明袭击致31人死亡、141人受伤，其中40人重伤，并认定依斯坎达尔·艾海提等三人纠集他人形成恐怖组织、策划了这次袭击。中国官方指责新疆分裂分子制造袭击。2014年10月，二审维持三人死刑判决。
