- id: e03-2017-daxing-fire-evictions
  date: 2017-11-18
  title: 北京大兴火灾与外来人口清退
  lane: society
  summary: 2017年11月18日晚，北京大兴区西红门镇新建二村发生火灾，造成19人死亡、8人受伤。北京随即部署安全隐患大排查大清理大整治专项行动，大兴区自20日起开展为期40日的行动，大批违章出租公寓租户被要求撤离，网民批评当局在严寒中逼迁。北京市安委会负责人否认借机驱赶外来人口，但承认有些村的工作“过于焦急”，给搬迁群众生活安置造成暂时困难。
  voices:
    - voice: official
      text: 说专项行动是在驱赶“低端人口”，这是不负责任、毫无根据的，没有“低端人口”一说。
      cite: b06-qq-2017-11-26-no-low-end
      quote: true
    - voice: zh
      text: BBC中文网报道，网络流传北京多个地区出现租户被逼迁的情况，有租户被警告将断水断电，不得不露宿街头，网民质疑当局借机清理外来人口。
