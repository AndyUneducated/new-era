  lane: folk
  summary: 2013年12月28日中午，习近平在北京庆丰包子铺排队点餐、自己付款、端盘取包子，点了二两猪肉大葱包子、一碗炒肝和一份芥菜，共21元，消息由新华社官方微博“新华视点”发布。次日该店顾客盈门，这份组合被称为“主席套餐”并一度脱销。BBC中文网称习近平上台后一直希望塑造亲民、简朴形象；也有网民评论说，吃一次包子不难，难的是取消特供制度。
  people: [xi-jinping]
