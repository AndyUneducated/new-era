- id: e03-2013-third-plenum-reform-decision
  date: 2013-11-12
  title: 十八届三中全会通过全面深化改革决定
  lane: econ
  major: true
  summary: 2013年11月12日，十八届三中全会通过《中共中央关于全面深化改革若干重大问题的决定》，15日全文公布。决定称经济体制改革的核心问题是处理好政府和市场的关系，“使市场在资源配置中起决定性作用和更好发挥政府作用”；同时宣布设立国家安全委员会、废止劳动教养制度，并启动实施“一方是独生子女的夫妇可生育两个孩子的政策”。
  people: [xi-jinping]
  cites: [e03-gov-2013-11-15-reform-decision]

- id: e03-2013-east-china-sea-adiz
  date: 2013-11-23
  title: 中国宣布划设东海防空识别区
  lane: army
  summary: 2013年11月23日，据国防部网站消息，中国政府依据《国防法》《民用航空法》和《飞行基本规则》宣布划设东海防空识别区，范围为六个坐标点连线与中国领海线之间的空域，北起北纬33度11分，南至北纬24度45分。央视报道称识别区涵盖钓鱼岛。
  cites: [e03-people-2013-11-23-adiz]

- id: e03-2013-qingfeng-baozi
