- id: e03-2015-709-lawyers-crackdown
  date: 2015-07-09
  title: “709”维权律师大抓捕
  lane: society
  major: true
  summary: 2015年7月9日凌晨，北京锋锐律师事务所律师王宇被从家中带走，此后两天各地数十名维权律师及相关人士被带走、失联或传唤，维权网统计至7月11日上午已有57人。官方媒体称公安部摧毁了一个以锋锐律所为平台、先后炒作40余起敏感案事件的“涉嫌重大犯罪团伙”。2016年1月，周世锋、王宇、王全璋等人在指定居所监视居住半年期满后以“颠覆国家政权罪”被批捕。
  people: [wang-quanzhang, wu-gan]
  concepts: [stability-maintenance]
  voices:
    - voice: official
      text: 至此，一个由“维权”律师、推手、“访民”相互勾连，组织严密、人数众多、分工精细的涉嫌犯罪团伙浮出水面
      cite: e03-xinhua-2015-07-11-weiquan
      quote: true
    - voice: zh
      text: 据维权网统计，截至7月11日上午共有57名维权律师、律所工作人员及维权人士被带走、失联、约谈、传唤或限制人身自由；锋锐律所主任周世锋等多人失联。
      cite: e03-bbc-2015-07-11-lawyers
    - voice: zh
      text: 锋锐律所合伙人刘晓原对美国之音说，按官方媒体此前的报道，周世锋等人的行为与颠覆或煽动颠覆国家政权罪“对不上号”，当局起诉的法律依据仍不明朗。
      cite: e03-voa-2016-01-13-fengrui-arrests
  cites: [e03-bbc-2015-07-11-lawyers, e03-xinhua-2015-07-11-weiquan, e03-voa-2016-01-13-fengrui-arrests]

