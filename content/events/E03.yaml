# E03 events, 2013-01 to 2019-12

# 2013
- id: e03-2013-southern-weekly-new-year
  date: 2013-01-03
  title: 《南方周末》新年献词事件
  lane: ideo
  summary: 2013年1月3日，《南方周末》新年特刊刊出的献词题为《我们比任何时候都更接近梦想》。据BBC中文网报道，初稿题为《中国梦，宪政梦》，起草过程受中共广东省委宣传部干预，有消息称由宣传部长庹震改写，也有消息称其与此事无关。报社官方微博称网上传言不实后，经济部编采人员联署声明称官微“失守”并停止正常采编工作，报社前雇员联署公开信要求庹震引咎辞职。
  concepts: [chinese-dream, liberals]
  cites: [e03-bbc-2013-01-07-southern-weekly]

- id: e03-2013-xi-elected-president
  date: 2013-03-14
  title: 习近平当选国家主席、国家中央军委主席
  lane: power
  major: true
  summary: 2013年3月14日，十二届全国人大一次会议举行第四次全体会议，以无记名投票方式选举习近平为中华人民共和国主席、中央军事委员会主席，张德江为全国人大常委会委员长，李源潮为国家副主席，并批准国务院机构改革和职能转变方案。任期届满的国家主席胡锦涛与习近平握手致意，吴邦国与张德江握手。
  people: [xi-jinping, zhang-dejiang, li-yuanchao, hu-jintao]
  cites: [e03-gov-2013-03-14-npc-election]

