  lane: foreign
  major: true
  summary: 2018年7月6日，美国开始对价值340亿美元的中国产品加征25%关税，中国随即对同等规模、545项美国商品加征25%关税回击，包括农产品、汽车、水产品等。中国商务部称美国“发动了迄今为止经济史上规模最大的贸易战”，是“典型的贸易霸凌主义”。特朗普表示，如果中国继续报复，将考虑对约5000亿美元的中国产品征税。
  cites: [e03-mofcom-2018-07-06-tariffs, e03-bbc-2018-07-06-trade-war]

- id: e03-2018-xinjiang-camps-legalised
  date: 2018-10-09
  title: 新疆修订去极端化条例，“教培中心”入法
  lane: ethnic
  major: true
  summary: 2018年10月9日，新疆维吾尔自治区人大常委会修订《去极端化条例》，规定县级以上人民政府可以设立“职业技能教育培训中心等教育转化机构”，对受极端主义影响人员进行教育转化。BBC中文网报道，此前人权组织和国际社会指责中国在新疆设立再教育营、囚禁约百万维吾尔人；新条例首次以立法形式把“再教育”合法化。2019年8月国务院新闻办公室发表白皮书，称教培中心依法设立。
  people: [chen-quanguo]
  voices:
    - voice: doc
      text: 县级以上人民政府可以设立职业技能教育培训中心等教育转化机构和管理部门，对受极端主义影响人员进行教育转化，做好去极端化工作。
      cite: e03-xjpcsc-2018-10-09-deextremification
      quote: true
    - voice: doc
      text: 教培工作根本不是什么限制、剥夺人身自由的措施，而是依法采取的帮助学员摆脱恐怖主义、宗教极端主义束缚的重要措施
      cite: e03-gov-2019-08-16-xinjiang-whitepaper
      quote: true
    - voice: zh
      text: 首次以立法的形式将其合法化，把对新疆维吾尔人的“再教育”列入法律要求
      cite: e03-bbc-2018-10-11-xinjiang-regulation
      quote: true
  cites: [e03-xjpcsc-2018-10-09-deextremification, e03-bbc-2018-10-11-xinjiang-regulation, e03-gov-2019-08-16-xinjiang-whitepaper]

- id: e03-2018-meng-hongwei-detained
  date: 2018-10-07
  title: 国际刑警组织主席孟宏伟被调查
  lane: purge
  summary: 2018年10月7日深夜，中央纪委国家监委网站发布消息，公安部副部长孟宏伟涉嫌违法，正接受国家监委监察调查。孟宏伟2016年11月起任国际刑警组织主席，是该组织首位中国负责人；他被报失踪后，国际刑警组织表示收到其“立即生效”的辞职信。公安部党委会议称，他被调查“完全是其一意孤行、咎由自取的结果”。
  people: [meng-hongwei, zhao-kezhi]
  cites: [e03-people-2018-10-08-meng-hongwei, e03-nytcn-2018-10-08-meng-hongwei]

# 2019
- id: e03-2019-xuexi-qiangguo
  date: 2019-01-01
  title: “学习强国”平台上线
  lane: ideo
  summary: 2019年1月1日，“学习强国”学习平台上线，政治局常委王沪宁出席仪式并宣布平台正式上线。BBC中文网报道，平台由中共中央宣传部推出，党员被要求下载并定期阅读，公务员、国企员工和公立学校教师也收到类似要求；用户阅读、答题可获得“学习积分”，积分可能成为考核指标。2月12日，它超过微信和抖音，成为苹果中国应用商店下载量最大的应用。
  people: [wang-huning]
  concepts: [xi-thought]
  cites: [e03-people-2019-01-02-xuexi, e03-bbc-2019-02-16-xuexi]

- id: e03-2019-taiwan-compatriots-speech
  date: 2019-01-02
  title: 习近平《告台湾同胞书》40周年讲话
  lane: hkmt
  summary: 2019年1月2日，习近平在《告台湾同胞书》发表40周年纪念会上讲话，提出探索“两制”台湾方案，倡议在坚持“九二共识”、反对“台独”的基础上，由两岸各政党、各界别推举代表开展民主协商。他说“中国人不打中国人”，同时表示“我们不承诺放弃使用武力，保留采取一切必要措施的选项”，称这针对的是外部势力干涉和极少数“台独”分裂分子。
  people: [xi-jinping]
  cites: [e03-gov-2019-01-02-taiwan-speech]

- id: e03-2019-996-icu
  date: 2019-04
  title: “996.ICU”与“福报”之争
  lane: folk
  summary: 2019年春，中国程序员在GitHub上发起名为“996.ICU”的在线抗议。“996”指每天早9点工作到晚9点、每周工作6天，意思是这样下去“生病了会被送到ICU”。截至4月5日，项目获得超过17万次点赞，并出现列有阿里巴巴、京东、字节跳动的公司黑名单，几家国内浏览器则屏蔽了该网址。4月11日马云称能“996”是“修来的福报”，引发反对，次日他又说任何公司不应强制员工“996”。
  people: [ma-yun]
  cites: [e03-bbc-2019-04-05-996, e03-ce-2019-04-15-996]

- id: e03-2019-hong-kong-anti-extradition
  date: 2019-06-09
  title: 香港反修例运动
  lane: hkmt
  major: true
  summary: 2019年6月9日，大批香港市民上街反对港府修订《逃犯条例》。主办方民间人权阵线称有103万人参加，警方称高峰时约24万人，BBC称这是1997年主权移交以来香港最大规模的游行；6月16日的游行主办方称约200万人，警方称高峰期约33.8万人。此后抗议持续并出现暴力冲突。国务院港澳办7月29日表态，坚决支持林郑月娥带领特区政府依法施政、支持香港警方严正执法。
  people: [lin-zheng-yuee]
  voices:
    - voice: zh
      text: 他们担心修例后，身在香港的人会被移交到中国大陆受审并遭遇不公平审讯。
      cite: e03-bbc-2019-06-09-hk-march
      quote: true
    - voice: official
      text: 香港近期事态的演变，特别是少数激进分子实施的暴力活动，已经严重破坏了香港繁荣稳定的大局，严重挑战了香港法治和社会秩序，严重威胁到香港市民的生命财产安全，也严重触碰了“一国两制”的原则底线，绝对不能容忍。
      cite: e03-xinhua-2019-07-29-hkmao
      quote: true
  cites: [e03-bbc-2019-06-09-hk-march, e03-bbc-2019-06-25-hk-numbers, e03-xinhua-2019-07-29-hkmao]

- id: e03-2019-70th-anniversary-parade
  date: 2019-10-01
  title: 建国70周年阅兵
  lane: army
  summary: 2019年10月1日，庆祝中华人民共和国成立70周年大会在北京天安门广场举行，20余万军民参加阅兵和群众游行。习近平乘车检阅15个徒步方队、32个装备方队，近15000名受阅官兵和580台受阅装备参阅。新华社称这是中国特色社会主义进入“新时代的首次国庆阅兵”，也是武装力量改革重塑后的首次整体亮相。
  people: [xi-jinping]
  concepts: [new-era]
  cites: [e03-gov-2019-10-01-70th]

- id: e03-2019-polyu-siege
  date: 2019-11-17
  end: 2019-11-29
  title: 香港理工大学围城
  lane: hkmt
  summary: 位于红磡隧道附近的香港理工大学自2019年11月13日起被示威者占据。11月17日警方封锁校园，双方对峙至凌晨，多次爆发严重冲突，理大附近多处起火；部分人离开校园时被警方逮捕，逾千人被困。此后逾千名被困示威者及留守人士陆续离开，消防等部门清除危险品后，警方宣布解封，理大于11月29日解除封锁。
  cites: [e03-bbc-2019-11-29-polyu]

- id: e03-2019-district-council-election
  date: 2019-11-24
  title: 香港区议会选举民主派大胜
  lane: hkmt
  summary: 2019年11月24日，香港区议会选举约294万名选民投票，投票率71.2%，均为主权移交以来最高。452个选区结果显示，泛民主派取得超过385席，首次在区议会取得过半议席；建制派取得59席，较上届的292席大幅减少。行政长官林郑月娥表示特区政府尊重选举结果，会“虚心聆听市民的意见，并认真反思”。
  people: [lin-zheng-yuee]
  cites: [e03-bbc-2019-11-25-dc-election]

- id: e03-2019-china-cables
  date: 2019-11-24
  title: “中国电文”披露新疆再教育营文件
  lane: ethnic
  summary: 2019年11月，国际调查记者同盟公布一批泄露的新疆官方文件，称为“中国电文”，其中包括2017年时任新疆自治区党委副书记朱海仑向再教育营管理人员下发的九页文件。BBC中文网称，文件明确指出这些营地是戒备森严的监狱，有严格纪律和惩罚、不允许逃跑；另一份文件显示2017年中仅一周就有1.5万人被送往营地。中国官方白皮书则称学员可定期回家、有通信自由。
  voices:
    - voice: doc
      text: 教培中心实行寄宿制管理，学员可定期回家，有事请假，学员有通信自由。
      cite: e03-gov-2019-08-16-xinjiang-whitepaper
      quote: true
    - voice: zh
      text: 其中明确指出，这些营地是戒备森严的监狱，有严格的纪律和惩罚，不允许逃跑。
      cite: e03-bbc-2019-11-25-china-cables
      quote: true
  cites: [e03-bbc-2019-11-25-china-cables, e03-gov-2019-08-16-xinjiang-whitepaper]
