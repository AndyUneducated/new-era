- id: e03-2013-bo-xilai-verdict
  date: 2013-09-22
  title: 薄熙来一审被判无期徒刑
  lane: purge
  summary: 2013年9月22日，济南市中级人民法院对中共中央政治局原委员、重庆市委原书记薄熙来受贿、贪污、滥用职权案作出一审判决，数罪并罚决定执行无期徒刑，剥夺政治权利终身，没收个人全部财产。法院认定其受贿2044万余元、贪污500万元，并认定他在薄谷开来杀害英国公民尼尔·伍德案的查处和王立军叛逃事件中滥用职权，造成特别恶劣的社会影响。
