- id: e03-2015-rmb-fixing-reform
  date: 2015-08-11
  title: “8·11”人民币汇率中间价报价改革
  lane: econ
  summary: 2015年8月11日，中国人民银行宣布完善人民币兑美元汇率中间价报价，做市商在每日开盘前参考上日银行间外汇市场收盘汇率报价。当日中间价报6.2298，较上一交易日贬值1136点，媒体称为历史最大单日降幅。央行发言人称这是过去中间价与市场汇率点差的“一次性校正”，并表示将稳定市场预期。
