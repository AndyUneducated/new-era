- id: e03-2015-stock-market-crash
  date: 2015-06-12
  end: 2015-08-14
  title: 2015年A股股灾与救市
  lane: econ
  summary: 上证综指2015年6月12日收于七年来最高点5166.35点，至7月3日已下挫29%。7月8日，证监会称股市存在恐慌情绪；此前12家证券公司出资1200亿元稳定股市，国资委要求中央企业在异常波动期间不得减持所控股上市公司股票，央行协助中国证券金融公司获得流动性。8月14日证监会公告称，证金公司今后若干年不会退出，并向中央汇金转让部分股票。
