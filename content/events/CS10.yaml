- id: cs10-2026-li-xiaohong-probe
  date: 2026-06-02
  title: 中央巡视办原主任黎晓宏被查
  lane: purge
  summary: 2026年6月2日，中央纪委国家监委宣布中央巡视工作领导小组办公室原主任黎晓宏接受纪律审查和监察调查。他2007年起任北京市政府秘书长，时任市长为王岐山，2011年任证监会纪委书记；2013年首轮巡视任中央第七巡视组副组长，同年10月起任中央巡视办主任，2014年为中央巡视工作领导小组成员，2017年由王鸿津接任。他与董宏合著《金融反腐论》。他是十八届中央巡视全覆盖期间的巡视办主任。
  people: [li-xiaohong-xunshi, wang-qishan, dong-hong]
