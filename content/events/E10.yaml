- id: e10-2016-guo-boxiong-sentenced
  date: 2016-07-25
  title: 郭伯雄被军事法院判处无期徒刑
  lane: army
  major: true
  summary: 2016年7月25日，军事法院对中央军委原副主席郭伯雄受贿案一审宣判，认定他利用职务便利为他人谋取职务提拔或调整，单独或伙同他人收受财物，“受贿数额特别巨大，犯罪情节特别严重”，判处无期徒刑、剥夺政治权利终身、没收个人全部财产，并剥夺上将军衔。因部分证据涉及军事秘密，案件不公开开庭审理，郭伯雄当庭表示服从判决、不上诉。
  people: [guo-boxiong]
  cites: [b07-xinhua-2016-07-25-guo-sentence, b07-cctv-2016-07-25-guo-recap]

- id: e10-2016-guo-xu-poison-campaign
  date: 2016-07
  end: 2016-10-11
  title: “肃清郭徐流毒”升级为“全面彻底肃清”
  lane: army
  major: true
  summary: 2016年7月起，官方媒体开始使用“肃清郭伯雄、徐才厚流毒影响”的新提法。8月下旬，军委政治工作部主任张阳在全军贯彻古田政工会精神领导小组会议上要求扭住“六个肃清”、与郭徐的圈子划清界限；10月11日解放军报文章称二人“流毒影响是全面的、深层次的”，提出“全面彻底肃清”。联合早报后来梳理，提法由“彻底肃清”逐步加码到“全面彻底肃清”。
  people: [guo-boxiong, xu-caihou, zhang-yang]
  voices:
    - voice: scholar
      text: 胡佛研究所《中国领导观察》的 Mulvenon 把 2016 年 7 月出现的这一提法当作一场新运动来考察，追溯其起源和进程，评估它对党军关系的含义。
      cite: b07-hoover-clm-guo-xu-poison
  cites: [b07-hoover-clm-guo-xu-poison, b21-cnr-2016-08-27-zhang-gutian, b07-xinhua-2016-10-11-guo-xu-poison, a01-zaobao-2017-04-14-yang-shiguang]

