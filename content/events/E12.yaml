  summary: 2015年9月15日，四川省委召开会议，省纪委书记王雁飞宣读《中共中央关于四川南充拉票贿选案查处情况及其教训警示的通报》。经查，2011年南充市委五届一次全会前，时任仪陇县委书记杨建华用公款80万元送钱拉票，当选市委常委；全案涉及477人、涉案金额1671.9万元，33人被开除党籍公职并移送司法，杨建华获刑20年，时任市委书记刘宏建以玩忽职守罪获刑3年。
