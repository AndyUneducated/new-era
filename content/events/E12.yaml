- id: e12-2014-ding-shumiao-sentenced
  date: 2014-12-16
  title: 刘志军案关键人物丁书苗一审获刑20年
  lane: purge
  summary: 2014年12月16日，北京市第二中级人民法院以行贿罪、非法经营罪判处丁羽心（又名丁书苗）有期徒刑20年，并处罚金25亿元、没收个人财产2000万元。法院认定她通过时任铁道部部长刘志军，帮助23家投标公司中标57个铁路工程项目，本人违法获利20亿余元，并为刘志军“跑官”“办事”行贿4900万元。另说她个人非法获利25亿余元（新华网）。她2011年初被抓获后很快供出刘志军。
  people: [ding-shumiao, liu-zhijun]
