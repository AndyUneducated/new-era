  end: 2017-01-01
  title: 最高法减刑假释新规：终身监禁的贪污受贿罪犯不得再减刑假释
  lane: purge
  summary: 2016年11月15日，最高人民法院发布《关于办理减刑、假释案件具体应用法律的规定》，2017年1月1日起施行。审监庭庭长夏道虎介绍，规定细化了刑法修正案（九）的新规，“新增对决定终身监禁的贪污、受贿罪犯不得再减刑、假释的规定”，并对职务犯罪、黑社会性质组织犯罪、金融犯罪等罪犯，从严规定减刑的起始时间、间隔时间和幅度。
