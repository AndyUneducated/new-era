- id: e12-2018-ma-jian-sentenced
  date: 2018-12-27
  title: 国安部原副部长马建一审被判无期徒刑
  lane: purge
  summary: 2018年12月27日，大连中院以受贿、强迫交易、内幕交易罪判处国家安全部原副部长马建无期徒刑。法院认定他1999年至2014年为郭文贵及其控制的政泉公司提供帮助，收受财物1.09亿余元；与郭文贵共谋，指派人员以威胁等手段强迫他人转让股份，使政泉控股民族证券；还利用方正证券重组的内幕信息让亲属买卖股票获利4929万余元。案件因涉国家秘密不公开审理。
