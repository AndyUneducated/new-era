- id: e12-2023-discipline-regulations
  date: 2023-12-27
  end: 2024-01-01
  title: 新修订的纪律处分条例增写结交政治骗子条款
  lane: purge
  summary: 2023年12月27日，新华社播发中共中央印发的修订后《中国共产党纪律处分条例》，2024年1月1日起施行。新增的第五十五条规定，“搞投机钻营，结交政治骗子或者被政治骗子利用的”，给予严重警告或撤销党内职务处分，情节严重的给予留党察看或开除党籍；充当政治骗子的，给予撤销党内职务、留党察看或开除党籍处分。二十届中纪委三次全会随后对严惩政治骗子作出部署。
  concepts: [strict-governance]
  cites: [e12-gov-2023-12-27-discipline-regulations, cs5-scjc-2024-06-05-swindlers]

- id: e12-2024-sichuan-swindlers-meeting
  date: 2024-12-20
  title: 四川召开全省严防政治骗子警示教育大会
  lane: purge
  summary: 2024年12月20日，四川召开全省严防政治骗子警示教育大会，省纪委书记廖建宇出席讲话。会议称政治骗子“游走于体制内外、混迹于官商之间”，虚构政治背景招摇撞骗，要求党员干部对声称“朝中有人”、允诺运作升迁或“摆案抹案”的行为果断拒绝，并称“各级纪委监委和公安机关要加大对政治骗子的惩治力度”。此前绵阳原副市长刘海昌、仕途集中在四川的杨克宁都被通报结交政治骗子。
  concepts: [strict-governance]
  cites: [cs5-scol-2024-12-20-sichuan-swindlers, cs5-cjn-2024-05-24-political-swindlers]
