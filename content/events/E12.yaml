- id: e12-2015-army-16-cases
  date: 2015-01-15
  end: 2015-01-16
  title: 军队集中公布2014年16名军级以上落马干部
  lane: army
  summary: 2015年1月15日，十八届中纪委五次全会闭幕次日，中国军网公布2014年军队查处的16起军级以上干部重大贪腐案件。除南京政治学院政治部主任马向东为大校外，其余15人都是将军，包括上将徐才厚、中将杨金山、范长秘、于大清和总后勤部副部长刘铮；人民日报称省军区和军事院校各有四人落马，成为“重灾区”。次日解放军报报道，总政、总后和军委纪委决定用两年时间在全军和武警部队专项清理整治经济适用住房建设项目。
  people: [xu-caihou, yang-jinshan, fan-changmi, yu-daqing, liu-zheng]
  concepts: [xi-military-thought]
  cites: [f09-hqrw-2015-01-26-army-tigers, cs4-people-2015-01-16-army-tigers]

- id: e12-2016-msd-to-mobilization
  date: 2016-02-18
  end: 2016-03-11
  title: 省军区系统转隶军委国防动员部
  lane: army
  summary: 2016年1月军委机关调整组建时新设军委国防动员部。2月18日，“军报记者”微信公号报道，“省军区系统转隶军委国防动员部领导管理”。盛斌3月在全国两会期间接受中国国防报专访时说，国防动员部“履行组织指导国防动员和后备力量建设职能，领导管理省军区”，并称按相关法律，省军区系统是“同级党委的军事部、地方政府的兵役机构、当地驻军的协调机关”。
  people: [sheng-bin]
  concepts: [xi-military-thought]
  cites: [cs4-thepaper-2016-02-18-msd, cs4-chinacom-2016-03-11-sheng-bin]

- id: e12-2016-paid-services-halt
  date: 2016-03-27
  end: 2019-07-10
  title: 军队和武警部队全面停止有偿服务
  lane: army
  summary: 2016年3月27日，新华社报道中央军委近日印发《关于军队和武警部队全面停止有偿服务活动的通知》，计划用3年左右时间分步骤停止一切有偿服务活动，自通知下发之日起“一律不得新上项目、新签合同”。2019年7月新华社宣布“全面停止军队有偿服务任务基本完成”，称有偿服务是1998年军队停止经商后暂时保留的“特殊历史条件下的产物”。另说通知是2016年2月下发的（新华社，2019年）。
  concepts: [xi-military-thought]
  cites: [cs4-chinanews-2016-03-27-paid-services, cs4-xinhua-2019-07-10-paid-services]

- id: e12-2016-joint-logistics-force
  date: 2016-09-13
  title: 中央军委联勤保障部队成立
  lane: army
  summary: 2016年9月13日，中央军委联勤保障部队成立大会在八一大楼举行。习近平向武汉联勤保障基地和无锡、桂林、西宁、沈阳、郑州五个联勤保障中心授予军旗并致训词，称联勤保障部队是“实施联勤保障和战略战役支援保障的主体力量”，要求坚决听党指挥。范长龙宣读组建命令，许其亮主持大会，武汉联勤保障基地司令员李士生、政委殷志红接旗。
  people: [xi-jinping, fan-changlong, xu-qiliang]
  concepts: [xi-military-thought]
  cites: [cs4-gov-2016-09-13-jlsf]

- id: e12-2017-pap-leadership
  date: 2017-12-27
  title: 武警部队改由党中央、中央军委集中统一领导
  lane: army
  major: true
  summary: 2017年12月27日，新华社播发中共中央《关于调整中国人民武装警察部队领导指挥体制的决定》：“自2018年1月1日零时起，武警部队由党中央、中央军委集中统一领导”，实行军委—武警部队—部队的领导指挥体制，“武警部队归中央军委建制，不再列国务院序列”。此前武警受国务院和中央军委双重领导，德国之声称地方政府以维稳名义调动武警的现象“曾司空见惯”。
  concepts: [xi-military-thought, party-leadership]
  voices:
    - voice: scholar
      text: 现在将武警统统收为中央军委控制，剥夺了地方、各地政府对武警的控制权
      cite: cs4-dw-2017-12-27-pap
      quote: true
  cites: [cs4-gov-2017-12-27-pap-leadership, cs4-dw-2017-12-27-pap]

