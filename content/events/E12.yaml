- id: e12-2025-political-cadre-rules
  date: 2025-07-21
  title: 中央军委印发重塑政治干部形象威信的若干规定
  lane: army
  summary: 2025年7月21日，解放军报报道中央军委近日印发《关于大力弘扬优良传统、全面肃清流毒影响 重塑政治干部形象威信的若干规定》，共7个方面22条，要求政治干部特别是政治领导干部“带头徙木立信、从严肃毒除弊、重塑形象威信”，牢记“党代表”身份，执行情况接受全军党组织和官兵监督。詹姆斯敦基金会分析，官方把政工系统的核心问题归于不当的人际关系，而非财务腐败。
  people: [he-weidong, miao-hua]
  factions: [he-miao]
  concepts: [xi-military-thought]
  voices:
    - voice: scholar
      text: 詹姆斯敦基金会认为，这份规定意味着何卫东、苗华很可能是因为政治工作和人事管理上的缺失而失去了习近平的信任。
      cite: cs4-jamestown-2025-pwd-reshape
  cites: [e12-mod-2025-07-21-political-cadre-rules, cs4-jamestown-2025-pwd-reshape]

