- id: e12-2016-graft-interpretation
  date: 2016-04-18
  title: 两高司法解释明确贪污受贿定罪量刑标准和终身监禁适用
  lane: purge
  summary: 2016年4月18日，最高法、最高检联合发布办理贪污贿赂刑事案件的司法解释，公布之日起施行。它把贪污受贿“数额较大”的一般标准由1997年刑法的五千元调到三万元，二十万元以上不满三百万元为“数额巨大”，三百万元以上为“数额特别巨大”；判死刑立即执行过重、判一般死缓又偏轻的重大贪污受贿罪犯可决定终身监禁，须在一、二审作出死缓裁判时一并决定。
  concepts: [rule-of-law]
  cites: [e12-ccdi-2016-04-18-graft-interpretation, cs5-xinhua-2016-10-10-bai-enpei-first]

- id: e12-2016-sentence-rules
