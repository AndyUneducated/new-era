- id: e12-2015-criminal-law-9
  date: 2015-08-29
  end: 2015-11-01
  title: 刑法修正案（九）通过，重大贪污受贿犯罪可判终身监禁
  lane: purge
  major: true
  summary: 2015年8月29日，十二届全国人大常委会第十六次会议通过《刑法修正案（九）》，11月1日起施行。修正案取消贪污受贿罪的具体数额标准，改为“数额较大”“数额巨大”“数额特别巨大”和相应情节，并规定因贪污受贿被判死缓的，法院可同时决定期满减为无期徒刑后“终身监禁，不得减刑、假释”。三审稿审议时，也有专家和司法工作者认为终身监禁让罪犯看不到希望，有违教育改造的刑罚目的。
  concepts: [rule-of-law]
  voices:
    - voice: scholar
      text: 草案三审稿新增这一条款，意味着被判死缓的贪官很可能要把牢底坐穿。
