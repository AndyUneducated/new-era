- id: e12-2017-fin-work-conference
  date: 2017-07-14
  end: 2017-11-08
  title: 全国金融工作会议召开，国务院金融稳定发展委员会成立
  lane: econ
  summary: 2017年7月14日至15日，全国金融工作会议在北京召开。习近平称“金融安全是国家安全的重要组成部分”，要求“坚持党中央对金融工作集中统一领导”，强化对金融系统关键岗位特别是一把手的监督，并宣布设立国务院金融稳定发展委员会。11月8日，中国政府网宣布金稳委成立并召开第一次全体会议，作为统筹协调金融稳定和改革发展重大问题的议事协调机构，马凯任主任。
  people: [xi-jinping, ma-kai]
  concepts: [party-leadership, holistic-security]
  cites: [cs5-gov-2017-07-15-fin-work-conf, cs5-gov-2017-11-08-fsdc]

