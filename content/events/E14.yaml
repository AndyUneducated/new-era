- id: e14-2019-base-burden-year
  date: 2019-03-11
  title: 中办通知把2019年定为“基层减负年”
  lane: power
  summary: 2019年3月11日，新华社公布中办《关于解决形式主义突出问题为基层减负的通知》。根据习近平“2019年要解决一些困扰基层的形式主义问题”的批示，通知把2019年定为“基层减负年”：发给县级以下的文件、会议减少30%－50%，中央政策性文件原则上不超过10页，对县乡村的督查检查考核事项减少50%以上，不得以微信工作群、政务APP截图代替对实际工作的评价。通知还要求汲取秦岭北麓违建别墅问题的教训，把树牢“四个意识”、做到“两个维护”落到实处。
  people: [xi-jinping]
  concepts: [four-winds, two-safeguards, four-consciousness, three-distinctions]
  cites: [lk3-gov-2019-03-11-base-burden]

- id: e14-2021-three-child-policy
  date: 2021-05-31
  title: 政治局会议决定实施三孩生育政策
  lane: society
  major: true
  summary: 2021年5月31日，中共中央政治局召开会议，审议《关于优化生育政策促进人口长期均衡发展的决定》，决定实施一对夫妻可以生育三个子女政策及配套支持措施。会议要求依法组织实施三孩生育政策，把婚嫁、生育、养育、教育一体考虑，治理婚嫁陋习、天价彩礼，发展普惠托育服务体系、降低家庭教育开支，完善生育休假与生育保险制度，保障女性就业合法权益；对全面两孩政策调整前的独生子女家庭和农村计划生育双女家庭继续实行奖励扶助。
  concepts: [family-planning-debate]
  cites: [i08-gov-2021-05-31-three-child, i08-gov-2021-07-20-birth-decision]

- id: e14-2021-birth-decision
  date: 2021-07-20
  title: 中共中央、国务院优化生育政策决定公布，取消社会抚养费
  lane: society
  summary: 2021年7月20日，《中共中央 国务院关于优化生育政策促进人口长期均衡发展的决定》公布，实施一对夫妻可以生育三个子女政策，取消社会抚养费等制约措施、清理和废止相关处罚规定，将入户、入学、入职等与个人生育情况全面脱钩，并修改《人口与计划生育法》。决定称预计“十四五”期间我国人口将进入中度老龄化阶段、2035年前后进入重度老龄化阶段，群众生育观念已总体转向少生优育，经济负担、子女照料、女性对职业发展的担忧成为制约生育的主要因素。
  concepts: [family-planning-debate]
  cites: [i08-gov-2021-07-20-birth-decision]

