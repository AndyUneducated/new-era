  title: 习近平主持民营企业座谈会，批“民营经济离场论”
  lane: econ
  summary: 2018年11月1日，习近平主持召开民营企业座谈会并讲话。他说一段时间以来社会上有人提出所谓“民营经济离场论”“新公私合营论”，说民营经济已经完成使命、要退出历史舞台，把混合所有制改革曲解为新一轮“公私合营”，还有人说加强企业党建和工会工作是要控制民营企业，这些说法“是完全错误的，不符合党的大政方针”。他称民营企业和民营企业家“是我们自己人”，我国民营经济“只能壮大、不能弱化”，不仅不能“离场”，而且要走向更加广阔的舞台。
