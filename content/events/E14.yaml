- id: e14-2010-new-36-articles
  date: 2010-05-13
  title: 国务院“新36条”鼓励民间投资
  lane: econ
  summary: 2010年5月13日，中国政府网公布《国务院关于鼓励和引导民间投资健康发展的若干意见》，共三十六条，俗称“新36条”。意见要求鼓励和引导民间资本“进入法律法规未明确禁止准入的行业和领域”，对各类投资主体同等对待，不得单对民间资本设置附加条件；国有资本在一般竞争性领域要为民间资本营造更广阔的市场空间。意见逐项列出交通运输、电信、金融服务、国防科技工业等领域，允许民间资本参股基础电信运营、参与铁路干线建设和军工企业改组改制。
  concepts: [guojin-mintui]
  cites: [lk3-gov-2010-05-13-private-investment]

- id: e14-2011-happy-guangdong
