  title: 刑法修正案（十一）：侵害英烈名誉入刑，刑责年龄个别下调至12岁
  lane: society
  summary: 2020年12月26日，十三届全国人大常委会第二十四次会议通过刑法修正案（十一），2021年3月1日起施行。修正案规定，已满十二周岁不满十四周岁的人犯故意杀人、故意伤害罪，致人死亡或者以特别残忍手段致人重伤造成严重残疾、情节恶劣的，经最高人民检察院核准追诉，应当负刑事责任；增设第二百九十九条之一，“侮辱、诽谤或者以其他方式侵害英雄烈士的名誉、荣誉”，情节严重的处三年以下有期徒刑、拘役、管制或者剥夺政治权利；还增设引诱、教唆、欺骗运动员使用兴奋剂参赛等罪。
