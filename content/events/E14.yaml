- id: e14-2023-legislation-law-amended
  date: 2023-03-13
  title: 修改立法法，写入“全过程人民民主”
  lane: power
  summary: 2023年3月13日，十四届全国人大一次会议通过关于修改立法法的决定，3月15日起施行。修改后的第六条增加一款：“立法应当坚持和发展全过程人民民主，尊重和保障人权，保障和促进社会公平正义。”修改还把设区的市可以制定地方性法规的事项扩展到基层治理，允许省级和设区的市、自治州人大协同制定地方性法规、设立基层立法联系点，并授权国务院备案审查工作机构对报送备案的地方性法规和规章主动审查。
