- id: e14-1993-third-plenum-14th
  date: 1993-11-11
  end: 1993-11-14
  title: 十四届三中全会勾画社会主义市场经济体制框架
  lane: prelude
  major: true
  summary: 1993年11月11日至14日，中共十四届三中全会召开，通过《关于建立社会主义市场经济体制若干问题的决定》，勾画了社会主义市场经济体制的基本框架。决定称社会主义市场经济体制是同社会主义基本制度结合在一起的，建立这一体制就是要使市场在国家宏观调控下对资源配置起基础性作用；要求进一步转换国有企业经营机制，建立“产权清晰、权责明确、政企分开、管理科学”的现代企业制度。
  concepts: [socialist-market-economy, soe-reform]
  cites: [e01-gov-2021-06-28-cpc-100y]

