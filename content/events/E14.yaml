- id: e14-2017-miit-vpn-cleanup
  date: 2017-01-22
  end: 2018-03-31
  title: 工信部清理网络接入服务市场，无资质VPN在列
  lane: ideo
  summary: 2017年1月22日，工信部发布落款1月17日的《关于清理规范互联网网络接入服务市场的通知》，自即日起至2018年3月31日在全国清理互联网数据中心、接入服务和内容分发业务的无证经营、超范围经营和“层层转租”。通知规定未经电信主管部门批准，“不得自行建立或租用专线（含虚拟专用网络VPN）等其他信道开展跨境经营活动”，出租的国际专线仅供用户内部办公专用。7月国新办发布会上，工信部称清理对象是无国际通信业务经营资质的企业和个人，外贸、跨国企业办公自用可向依法设置国际通信出入口局的运营商租用专线。
