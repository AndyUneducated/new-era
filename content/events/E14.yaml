  summary: 2025年4月30日，十四届全国人大常委会第十五次会议通过《民营经济促进法》，5月20日起施行，共九章七十八条。法律第二条写明促进民营经济发展工作坚持中国共产党的领导，“毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展”，民营经济组织与其他各类经济组织享有平等的法律地位、市场机会和发展权利；要求各级政府落实公平竞争审查制度，对民营经济组织及其经营者违法行为的行政处罚按与其他经济组织同等原则实施。此前两个多月，习近平出席了民营企业座谈会。
