- id: e13-2013-shanghai-ftz
  date: 2013-09-29
  title: 中国（上海）自由贸易试验区挂牌
  lane: econ
  summary: 2013年9月29日，中国（上海）自由贸易试验区在外高桥挂牌，韩正揭牌，商务部长高虎城和上海市长杨雄为管委会挂牌，首批入驻企业和金融机构获颁证照。上海市政府同日公布2013年版外商投资准入负面清单，清单之外的外资项目由核准制改为备案制。高虎城致辞说，试验区将在负面清单管理、扩大服务业开放、人民币资本项目可兑换、利率市场化等方面先行先试，力争用两到三年建成“具有国际水准的自由贸易试验区”。
  people: [han-zheng, gao-hucheng, yang-xiong]
  voices:
