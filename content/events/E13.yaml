- id: e13-2013-money-crunch
  date: 2013-06-20
  end: 2013-06-25
  title: 银行间市场“钱荒”，隔夜拆借利率升至13.44%
  lane: econ
  summary: 2013年6月20日，银行间市场资金面骤紧，隔夜Shibor一天上涨578.4个基点至13.44%，财新称这种状况“为十年来所罕见”。人民银行当日仍地量发行20亿元央票，申银万国认为这表明央行继续坚持“不放松”的信号。6月25日，央行首度表态已向符合宏观审慎要求的金融机构提供流动性支持，并要求银行“用好增量、盘活存量”，隔夜回购利率随即回落至5.83%。
  people: [li-keqiang, zhou-xiaochuan]
  concepts: [macro-control]
  voices:
