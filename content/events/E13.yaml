- id: e13-2002-may-31-speech
  date: 2002-05-31
  title: 江泽民“5·31”讲话：全面贯彻“三个代表”迎接十六大
  lane: ideo
  summary: 2002年5月31日，江泽民在中央党校省部级干部进修班毕业典礼上讲话，称贯彻“三个代表”要求，“关键在坚持与时俱进，核心在保持党的先进性，本质在坚持执政为民”，提出21世纪头二十年是“必须紧紧抓住并且可以大有作为的重要战略机遇期”，并说“我们要发展的是有中国特色社会主义民主政治，决不照搬西方政治制度模式”。讲话最后号召全党讲大局、讲团结、讲稳定，“以优异的成绩迎接党的十六大”召开。
  people: [jiang-zemin]
  concepts: [three-represents, xiaokang]
  voices:
