  end: 2013-09-12
  title: 新疆鄯善鲁克沁镇暴力袭击案
  lane: ethnic
  summary: 2013年6月26日凌晨，新疆吐鲁番地区鄯善县鲁克沁镇，多名袭击者先后袭击镇派出所、特巡警中队、镇政府和民工工地，放火焚烧警车。新华社称24人遇害，其中维吾尔族16人、民警2人，另有21名民警和群众受伤，警方当场击毙11名袭击者。9月12日吐鲁番中院一审判处3人死刑、1人25年徒刑，判决认定袭击者2010年起聚集从事非法宗教活动并逐渐形成恐怖组织，致24人死亡、23人受伤。
