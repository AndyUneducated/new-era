- id: e13-2002-liaoyang-daqing-protests
  date: 2002-03
  end: 2003-05-09
  title: 辽阳、大庆下岗工人大规模抗议
  lane: society
  summary: 2002年3月，东北两地下岗工人连续上街。大庆油田被“买断工龄”的下岗工人从3月初起抗议补偿不合理；辽阳破产的铁合金厂工人联合20多家工厂的工人，3月11日起上街要求补发欠薪、惩治腐败，导火索是市人大主任龚尚武在全国人大会期间对电视台称辽阳没有失业者。工人代表姚福信等四人先后被捕，当局同时补发部分欠薪。2003年5月姚福信、肖云良以颠覆国家政权罪被判7年和4年。
  concepts: [soe-reform, mass-incidents]
  voices:
    - voice: west
