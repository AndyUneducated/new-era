- id: e13-2013-rtl-abolished
  date: 2013-12-28
  title: 全国人大常委会废止劳动教养制度
  lane: society
  major: true
  summary: 2013年12月28日，十二届全国人大常委会第六次会议通过决定，废止1957年8月一届全国人大常委会批准的《国务院关于劳动教养问题的决定》和1979年11月五届全国人大常委会批准的《国务院关于劳动教养的补充规定》，实行半个多世纪的劳动教养制度就此终止。决定规定废止前依法作出的劳教决定有效，正在执行的人员解除劳教，剩余期限不再执行，决定自公布之日起施行。
  people: [zhang-dejiang]
  concepts: [rule-of-law]
  voices:
    - voice: doc
      text: 劳动教养制度废止后，对正在被依法执行劳动教养的人员，解除劳动教养，剩余期限不再执行。
      cite: e13-npc-2013-12-28-rtl-abolished
      quote: true
  cites: [e13-npc-2013-12-28-rtl-abolished]
