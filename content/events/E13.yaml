      cite: e13-cctv-2002-05-31-jiang-speech
      quote: true
  cites: [e13-cctv-2002-05-31-jiang-speech]

- id: e13-2002-navy-circumnavigation
  date: 2002-05-15
  end: 2002-09-23
  title: 中国海军首次环球航行
  lane: army
  summary: 2002年5月15日至9月23日，“青岛”号导弹驱逐舰和“太仓”号综合补给舰组成的编队从青岛起航，完成中国海军首次环球航行。132天里编队航行3.3万余海里，跨越印度洋、大西洋、太平洋，访问五大洲10国10港。解放军报十年后的回顾称，这标志着海军舰艇编队远航能力“由近海走向大洋”，是人民海军历史上具有里程碑意义的远航。
  people: [jiang-zemin]
  cites: [e13-12371-2012-09-25-pla-firsts]

- id: e13-2002-one-country-each-side
  date: 2002-08-03
  end: 2002-08-05
  title: 陈水扁提出两岸“一边一国”
  lane: hkmt
  summary: 2002年8月3日，陈水扁以视讯向在日本召开的“世台会”致辞，称台湾“是主权独立的国家”，“一边一国必须要分清楚”，并主张以公民投票立法决定台湾前途，与他两年前就职时的“四不一没有”形成对照。8月5日国台办发言人李维一称这是对一个中国原则的“公然挑衅”，“四不一没有”只是权宜之计。连战批评此举会带来灾难。
  people: [chen-shuibian, lian-zhan]
  voices:
    - voice: zh
      text: 台湾要走自己的民主路，台湾是主权独立的国家，不是别人的一部分，也不是地方政府，更不是香港澳门，一边一国必须要分清楚。
      cite: e13-bbc-2002-08-03-one-country-each-side
      quote: true
    - voice: official
      text: 充分证明他所表白的‘四不一没有’，只不过是欺骗台湾民众、蒙骗国际舆论的权宜之计
      cite: e13-bbc-2002-08-05-tao-response
      quote: true
  cites: [e13-bbc-2002-08-03-one-country-each-side, e13-bbc-2002-08-05-tao-response]

- id: e13-2002-etim-un-listing
  date: 2002-09-11
  title: 联合国安理会把“东伊运”列入恐怖组织名单
  lane: ethnic
  major: true
  summary: 2002年9月11日，在中国、美国、阿富汗、吉尔吉斯斯坦共同提出要求后，联合国安理会把“东突厥斯坦伊斯兰运动”列入1267委员会恐怖组织名单，实行冻结资产、旅行限制和武器禁运。外交部称这是中美反恐合作的“积极成果”，并通报称该组织制造的暴恐案件导致140人死亡。美国财政部次日声明称，该组织1990年至2001年据报制造了200多起恐怖行为。
  people: [jiang-zemin, tang-jiaxuan]
  concepts: [stability-maintenance]
  voices:
    - voice: official
      text: 这也是中国与美国等有关国家进行反恐合作取得的一项积极成果。
      cite: e13-chinanews-2002-09-12-etim-kong-quan
      quote: true
  cites: [e13-gov-2002-etim-un-listing, e13-chinanews-2002-09-12-etim-kong-quan, e13-treasury-2002-09-12-etim]

- id: e13-2002-article-23-consultation
  date: 2002-09-24
  end: 2002-12-24
  title: 港府公布基本法第二十三条立法咨询文件
  lane: hkmt
  summary: 2002年9月24日，香港特区政府公布实施基本法第二十三条咨询文件，保安局局长叶刘淑仪提出叛国、分裂国家、煽动叛乱、颠覆、窃取国家机密等罪行的定义，并建议对“从属于”内地以国家安全理由取缔组织的本地团体可予禁制，咨询期至12月24日。董建华说立法对确保国家安全必要。支联会表示反对，担心传媒自我审查；香港法轮功团体担心活动空间受限，人权人士则担心言论自由受影响。
  people: [dong-jianhua]
  concepts: [one-country-two-systems, holistic-security]
  voices:
    - voice: official
      text: 香港特別行政區有道義上及法律上的責任實施《基本法》第二十三條
      cite: e13-hkgov-2002-09-24-article23
      quote: true
  cites: [e13-hkgov-2002-09-24-article23, e13-bbc-2002-09-24-article23]

- id: e13-2002-china-kyrgyz-exercise
  date: 2002-10-10
  end: 2002-10-11
  title: 中吉联合反恐演习，解放军首次与外军联合演习
  lane: army
  summary: 2002年10月10日至11日，中国与吉尔吉斯斯坦在两国边境地区举行联合反恐军事演习。这是上海合作组织框架内中吉首次双边联合演习，解放军报称也是“我军第一次与外国军队举行联合演习”。此后解放军每年都与外军举行联合演习和训练，解放军报称这些演练“拓宽了中国与有关国家安全合作的领域”。
  people: [jiang-zemin, chi-haotian]
  cites: [e13-12371-2012-09-25-pla-firsts]

- id: e13-2002-asean-framework-doc
  date: 2002-11-04
  title: 中国—东盟全面经济合作框架协议与《南海各方行为宣言》签署
  lane: foreign
  major: true
  summary: 2002年11月4日，朱镕基在金边出席第六次中国—东盟领导人会议，与东盟十国领导人签署《中国与东盟全面经济合作框架协议》，决定到2010年建成中国—东盟自由贸易区；同日中国与东盟各国外长签署《南海各方行为宣言》，各方承诺不诉诸武力或以武力相威胁，保持自我克制，不在现无人居住的岛礁上采取居住的行动，并同意朝最终制定“南海行为准则”努力。
  people: [zhu-rongji, tang-jiaxuan]
  voices:
    - voice: doc
      text: 不采取使争议复杂化、扩大化和影响和平与稳定的行动，包括不在现无人居住的岛、礁、滩、沙或其它自然构造上采取居住的行动
      cite: e13-mfa-2002-11-04-doc-south-china-sea
      quote: true
  cites: [e13-fmprc-2002-11-05-asean-framework, e13-mfa-2002-11-04-doc-south-china-sea]

