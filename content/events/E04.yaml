      quote: true
    - voice: zh
      text: 据二十大闭幕会场现场画面，代表“团派”的中共前总书记胡锦涛在会议中途突然被两名工作人员搀扶离场，离场时跟习近平打了个招呼，也轻拍了一下李克强左肩。
