# E04 events, 2020-01 to 2026-10. Sources in research/manifests/E04.yaml.

# ---------- 2020 ----------
- id: wuhan-lockdown-2020
  date: 2020-01-23
  end: 2020-04-08
  title: 武汉“封城”
  lane: society
  major: true
  summary: 国务院新闻办白皮书记载，2019年12月27日湖北省中西医结合医院上报不明原因肺炎，2020年1月19日深夜高级别专家组确认人传人。1月23日10时起武汉离汉通道关闭，4月8日解除持续76天的离汉离鄂管控。早期通报是否延误，至今是中外争议焦点。
  people: [xi-jinping, li-wenliang]
  concepts: [dynamic-zero]
  voices:
    - voice: doc
      text: 19日深夜，高级别专家组经认真研判，明确新冠病毒出现人传人现象。
      cite: e04-gov-2020-06-07-covid-whitepaper
      quote: true
    - voice: zh
      text: 有迹象显示涉及李文亮之死的言论遭到删查
      cite: b10-bbc-2020-02-07-li-death
      quote: true
  cites: [e04-gov-2020-06-07-covid-whitepaper, b10-bbc-2020-02-07-li-death]

- id: li-wenliang-death
  date: 2020-02-07
  end: 2020-03-19
  title: 李文亮去世与国家监委调查
  lane: society
  summary: 早期因谈论不明肺炎而被武汉中南路派出所训诫的医生李文亮感染新冠去世，年仅34岁。微博上“武汉政府欠李文亮医生一个道歉”等言论短暂流传后消失。3月19日国家监委调查组通报，认定训诫书不当，建议撤销并追究责任。
  people: [li-wenliang]
  voices:
    - voice: official
      text: 由于中南路派出所出具训诫书不当，执法程序不规范，调查组已建议湖北省武汉市监察机关对此事进行监督纠正，督促公安机关撤销训诫书并追究有关人员责任
      cite: b10-xinhua-2020-03-19-li-report
      quote: true
    - voice: zh
      text: “武汉政府欠李文亮医生一个道歉”和“我们要言论自由”等周四在微博网站短暂流传之后，迅即消失
      cite: b10-bbc-2020-02-07-li-death
      quote: true
  cites: [b10-bbc-2020-02-07-li-death, b10-xinhua-2020-03-19-li-report]
  verify: true

- id: galwan-clash
  date: 2020-06-15
  title: 中印加勒万河谷冲突
  lane: army
  summary: 中印两军在拉达克与阿克赛钦之间的加勒万河谷爆发数十年来最严重的冲突，虽未开一枪，据BBC报道仍造成双方至少24名军人丧生。中方直到八个月后的2021年2月19日，才由《解放军报》等官方媒体首次披露有4名军人阵亡。
  cites: [e04-bbc-2021-06-01-galwan]

- id: hk-national-security-law
  date: 2020-06-30
  title: 全国人大常委会通过《香港国安法》
  lane: hkmt
  major: true
  summary: 十三届全国人大常委会第二十次会议全票通过《中华人民共和国香港特别行政区维护国家安全法》，由国家主席习近平以第49号主席令公布，并列入基本法附件三在港实施。此后港人以举白纸方式表达抗议，香港政治生态随之改变。
  people: [xi-jinping, li-zhanshu, lin-zheng-yuee]
  concepts: [holistic-security]
  cites: [e04-gov-2020-06-30-hk-nsl, e04-bbc-2022-11-28-white-paper]

- id: ren-zhiqiang-sentenced
  date: 2020-09-22
  title: 任志强被判刑十八年
  lane: purge
  summary: 北京市第二中级人民法院一审认定地产大亨任志强贪污罪、受贿罪、挪用公款罪、国有公司人员滥用职权罪成立，判处有期徒刑十八年，并处罚金420万元。他此前撰文批评当局抗疫，文中称某人是“剥光了衣服也要坚持当皇帝的小丑”。
  people: [ren-zhiqiang, xi-jinping]
  cites: [e04-bbc-2020-09-22-ren-zhiqiang]

- id: fifth-plenum-19th
  date: 2020-10-26
  end: 2020-10-29
  title: 十九届五中全会
  lane: power
  summary: 十九届五中全会审议通过关于制定“十四五”规划和二〇三五年远景目标的建议，提出立足新发展阶段、贯彻新发展理念、构建新发展格局。全会并称预计二〇二〇年国内生产总值突破一百万亿元，五千五百七十五万农村贫困人口实现脱贫。
  people: [xi-jinping]
  concepts: [new-development-philosophy, dual-circulation]
  cites: [e04-xinhua-2020-10-29-5th-plenum]

- id: ant-ipo-halted
  date: 2020-11-03
  title: 蚂蚁集团上市被叫停
  lane: econ
  summary: 人民银行、银保监会、证监会和外汇局联合约谈马云等蚂蚁集团高管后，上海证券交易所突然宣布暂停蚂蚁集团上市，蚂蚁随即暂缓在港H股上市。外界普遍认为与马云10月24日在外滩金融峰会上的讲话有关，他当时称“我们必须改掉金融的当铺思想”。
  people: [ma-yun]
  cites: [e04-bbc-2020-11-03-ant-ipo]

- id: neijuan-dagongren
  date: 2020-12-04
  title: “内卷”“打工人”入选年度流行语
  lane: folk
  summary: 《咬文嚼字》编辑部12月4日在上海公布2020年十大流行语，“内卷”和“打工人”入选。前者原为社会学术语，在网络上被用来形容无意义的过度竞争；后者是年轻上班族带有自嘲意味的自称，反映职场压力下的集体情绪。
  cites: [e04-xinhua-2020-12-04-buzzwords]

# ---------- 2021 ----------
- id: hk-electoral-overhaul
  date: 2021-03-11
  title: 全国人大改革香港选举制度
  lane: hkmt
  summary: 十三届全国人大四次会议通过关于完善香港特别行政区选举制度的决定，选举委员会扩为五个界别共1500人，立法会议员定为每届90人，并设立候选人资格审查委员会，以确保以爱国者为主体的“港人治港”。
  people: [lin-zheng-yuee, xia-baolong]
  cites: [e04-gov-2021-03-11-hk-electoral]

- id: xinjiang-cotton-sanctions
  date: 2021-03-22
  end: 2021-03-25
  title: 欧盟涉疆制裁与新疆棉风波
  lane: ethnic
  summary: 欧盟以新疆维吾尔族人权问题为由，制裁四名中国官员及新疆生产建设兵团公安局，中国随即宣布制裁欧盟10名个人和实体。H&M一则关于新疆棉花的旧声明随后在中国网络遭猛烈抨击，耐克、阿迪达斯等品牌也被卷入，多名中国艺人宣布终止与H&M合作。
  cites: [e04-bbc-2021-03-25-xinjiang-cotton]

- id: tangping
  date: 2021-04
  end: 2021-06
  title: “躺平”
  lane: folk
  summary: 2021年4月，百度贴吧一篇《躺平即是正义》的帖子获大量转发，主张以退出竞争回应无意义的努力，“躺平”与“内卷”一起成为90后、00后的口头禅。《光明日报》《南方日报》等官方媒体发文批评甚至谴责，学者项飙则把它视为年轻人对内卷的反抗。
  concepts: [common-prosperity]
  voices:
    - voice: official
      text: 在压力面前选择“躺平”不仅不正义，还是可耻的
      cite: e04-xinhua-2021-05-20-tangping
      quote: true
    - voice: scholar
      text: 躺平是年轻人对“内卷”的一种反抗
      cite: e04-bbc-2021-06-01-tangping
      quote: true
  cites: [e04-bbc-2021-06-01-tangping, e04-xinhua-2021-05-20-tangping]
  verify: true

- id: apple-daily-closes
  date: 2021-06-24
  title: 《苹果日报》停刊
  lane: hkmt
  summary: 创办人黎智英及多名高层依《香港国安法》被捕、公司资产遭冻结后，香港《苹果日报》于2021年6月24日最后一次出版，“终年”26年又四日。英美等国和新闻自由组织谴责打压新闻自由，北京与港府则称是打击危害国家安全的犯罪。
  people: [li-zhiying]
  cites: [e04-bbc-2021-06-24-apple-daily]

- id: cpc-centenary
  date: 2021-07-01
  title: 建党一百周年大会
  lane: ideo
  major: true
  summary: 习近平在天安门广场庆祝中国共产党成立100周年大会上宣告，实现了第一个百年奋斗目标，在中华大地上全面建成了小康社会，历史性地解决了绝对贫困问题，并警告外来势力将“碰得头破血流”，开启第二个百年奋斗目标新征程。
  people: [xi-jinping]
  concepts: [xiaokang, chinese-dream]
  cites: [e04-gov-2021-07-01-centenary-speech]

- id: double-reduction
  date: 2021-07-24
  title: “双减”整顿校外培训
  lane: society
  summary: 中办、国办印发关于进一步减轻义务教育阶段学生作业负担和校外培训负担的意见，要求现有学科类培训机构统一登记为非营利性机构，学科类培训机构一律不得上市融资，严禁资本化运作，外资也不得控股或参股学科类培训机构。
  cites: [e04-gov-2021-07-24-double-reduction]

- id: common-prosperity-meeting
  date: 2021-08-17
  title: 中央财经委会议部署共同富裕
  lane: econ
  summary: 习近平主持中央财经委员会第十次会议，强调共同富裕是社会主义的本质要求，是中国式现代化的重要特征，要构建初次分配、再分配、三次分配协调配套的基础性制度安排，扩大中等收入群体比重，合理调节高收入，取缔非法收入，形成中间大、两头小的橄榄型分配结构。
  people: [xi-jinping]
  concepts: [common-prosperity, chinese-modernization]
  cites: [e04-gov-2021-08-17-common-prosperity]

- id: peng-shuai
  date: 2021-11-02
  end: 2021-12-01
  title: 彭帅发文指控张高丽
  lane: society
  summary: 北京时间11月2日晚，网球名将彭帅的认证微博发长文，称曾与已退休的前国务院副总理张高丽发生性关系并描述当时的恐惧，帖子约20分钟后被删除，相关讨论遭审查。国际女子网球协会要求彭帅声音被听到，12月1日宣布暂停在华全部赛事；中国外交部称事件不应被政治化。
  people: [peng-shuai, zhang-gaoli]
  voices:
    - voice: zh
      text: 这篇帖文据悉在微博上发表了约20分钟后被删除
      cite: e04-bbc-2021-11-03-peng-shuai
      quote: true
    - voice: west
      text: 国际女子网球协会要求彭帅的指控得到全面、公正、透明的调查，称她的声音应当“被听到，而不是被审查”。
      cite: e04-bbc-2021-11-15-peng-shuai-wta
    - voice: official
      text: 中國外交部發言人趙立堅11月23日首度開腔，他稱該事件「不應被政治化」
      cite: e04-bbc-2021-12-02-peng-shuai-wta-suspend
      quote: true
  cites: [e04-bbc-2021-11-03-peng-shuai, e04-bbc-2021-11-15-peng-shuai-wta, e04-bbc-2021-12-02-peng-shuai-wta-suspend]

- id: sixth-plenum-19th
  date: 2021-11-08
  end: 2021-11-11
  title: 十九届六中全会与第三个历史决议
  lane: ideo
  major: true
  summary: 十九届六中全会审议通过《中共中央关于党的百年奋斗重大成就和历史经验的决议》，习近平就决议讨论稿向全会作说明；全会并审议通过关于召开党的二十大的决议，决定二十大于2022年下半年在北京召开。出席全会的有中央委员197人、候补中央委员151人。
  people: [xi-jinping]
  concepts: [third-resolution, two-establishes, xi-thought]
  cites: [e04-gov-2021-11-11-6th-plenum]

- id: evergrande-default
  date: 2021-12-09
  title: 恒大被评级机构认定违约
  lane: econ
  summary: 恒大在最后期限过去三天后仍未回应是否已向债券持有人支付8200万美元，惠誉评级随即将其列入“限制性违约”类别，同日把佳兆业也列入该类别。在对房地产行业借贷的广泛收紧下，当年已有超过11家房企出现债券违约。
  people: [xu-jiayin]
  cites: [e04-nytcn-2021-12-10-evergrande]

# ---------- 2022 ----------
- id: sino-russian-statement
  date: 2022-02-04
  title: 中俄“合作没有禁区”联合声明
  lane: foreign
  summary: 中俄发表关于新时代国际关系和全球可持续发展的联合声明，称中俄新型国家间关系超越冷战时期的军事政治同盟模式，“两国友好没有止境，合作没有禁区”；双方反对北约继续扩张，并高度警惕美国“印太战略”的消极影响。
  people: [xi-jinping]
  cites: [e04-gov-2022-02-04-sino-russian]

- id: feng-county-chained-woman
  date: 2022-02-23
  title: 丰县“铁链女”事件调查结果
  lane: society
  summary: 江苏丰县一名被铁链锁住的生育八孩女子的视频引发全网追问。江苏省委省政府调查组2月23日发布通报，认定小花梅于1998年被他人介绍花钱买来，对17人进行问责，给予丰县县委书记娄海撤销党内职务、政务撤职处分。
  cites: [e04-news-2022-02-23-fengxian]

- id: shanghai-lockdown
  date: 2022-03-27
  title: 上海封城
  lane: society
  major: true
  summary: 3月27日上海宣布实施严厉的封城措施。从被强制入住方舱医院的感染者和密接者，到在医院前求助无门的病患，大批市民在网上分享遭遇、批评不合理的防疫手段，许多文章很快被删。BBC指出，网民针对重要公共政策自发大规模批评的现象在中国并不常见。
  people: [li-qiang]
  concepts: [dynamic-zero]
  cites: [e04-bbc-2022-04-19-shanghai-lockdown]

- id: voices-of-april
  date: 2022-04-22
  title: 《四月之声》
  lane: folk
  summary: 一段记录上海封城期间市民声音的视频《四月之声》，4月22日起在微博和微信广传，片中能听到一名女士抱怨所住方舱医院都还没有封顶。周末起互联网公司和有关当局试图将其删除，与不断复制、制作新版本的网民反复拉锯。
  cites: [e04-bbc-2022-04-23-voices-of-april]

- id: last-generation
  date: 2022-05-11
  title: “我们是最后一代”
  lane: folk
  summary: 5月11日起网络疯传一段视频：上海一对核酸阴性的年轻夫妇被“大白”强拉转运，对方威胁处罚会影响他的三代，男子回答“这是我们最后一代，谢谢!”。这句话被称为史诗级对白，道出许多年轻人的心声；微博随后屏蔽了相关话题。
  cites: [e04-rfi-2022-05-12-last-generation]

- id: xinjiang-police-files
  date: 2022-05
  title: “新疆公安文件”外泄
  lane: ethnic
  summary: BBC等媒体发布由学者郑国恩转交的新疆警方外泄资料，包括数千张维吾尔被拘留者照片、拘留营警卫指令和陈全国等官员讲话，至少2884人可证实已被拘留。发布恰逢联合国人权高专巴切莱特访华；中国驻美使馆称涉疆问题本质是反恐。
  people: [chen-quanguo, zhao-kezhi, xi-jinping]
  voices:
    - voice: zh
      text: “对于一些人，甚至5年的再教育可能是不够的，”陈全国向军队和警察系统高级干部表示。
      cite: e04-bbc-2022-05-25-xinjiang-police-files
      quote: true
    - voice: official
      text: 新疆有关问题本质上是打击恐怖主义暴力、激进化和分裂主义的问题，而不是人权或宗教问题
      cite: e04-bbc-2022-05-25-xinjiang-police-files
      quote: true
  cites: [e04-bbc-2022-05-25-xinjiang-police-files]

- id: run-xue
  date: 2022-06
  title: “润学”
  lane: folk
  summary: 上海封城期间，网民用“润”字的拼音谐音英文run，指移民离开中国，有关润的种种讨论与分析被戏称为“润学”，专门讨论润的网站也吸引成千上万网民参与。BBC把它看作内卷之后年轻人开始考虑移民的信号。
  cites: [e04-bbc-2022-06-run-xue]

- id: pelosi-taiwan-drills
  date: 2022-08-04
  end: 2022-08-07
  title: 佩洛西访台与环台军演
  lane: hkmt
  summary: 美国众议院议长佩洛西8月2日访台后，解放军东部战区在台岛周边举行规模空前的联合演训，划定的演习范围部分处于台湾岛周边12海里之内，台湾国防部称共有11枚东风系列导弹射向台湾周边海域。BBC指出，1996年台海危机时的禁区全部在台湾领海之外。
  people: [cai-yingwen]
  cites: [e04-news-2022-08-04-pelosi-drills, e04-bbc-2022-08-04-pelosi-drills]

- id: sitong-bridge
  date: 2022-10-13
  title: 四通桥标语
  lane: folk
  summary: 二十大开幕前三天，一名抗议者在北京四通桥挂出两条横幅，一条写有“不要核酸要吃饭，不要封控要自由”等六句口号，另一条要求习近平下台。相关搜索在微博被清空，口号却以厕所涂鸦等形式在国内流传，并出现在至少20个国家的200多所大学的公告栏上。
  voices:
    - voice: zh
      text: 不要核酸要吃饭，不要封控要自由，不要谎言要尊严，不要文革要改革，不要领袖要选票，不做奴才做公民。
      cite: e04-bbc-2022-10-13-sitong
      quote: true
  cites: [e04-bbc-2022-10-13-sitong, e04-bbc-2022-10-28-sitong-spread, e04-nytcn-2022-10-23-sitong-overseas]

- id: charter-two-establishes
