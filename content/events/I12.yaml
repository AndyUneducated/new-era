- id: i12-2006-new-countryside-seminar
  date: 2006-02-14
  end: 2006-02-20
  title: 省部级主要领导干部建设社会主义新农村专题研讨班
  lane: econ
  summary: 2006年2月14日至20日，中共中央举办省部级主要领导干部建设社会主义新农村专题研讨班，胡锦涛、温家宝先后在开班式和结业式上讲话，胡锦涛强调要使新农村建设成为惠及广大农民群众的民心工程。研讨班紧接中央一号文件发布。2006年4月至2007年1月，中央又连续举办50期培训班，对全国5474名县委书记、县长进行新农村建设专题培训。
