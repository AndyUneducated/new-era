# I07: fields appended to concepts owned by I01 — the long-form history of the Deng/Jiang/Hu-era guiding
# thoughts and formulas, and their official numbered lists. New concepts of this batch are in content/concepts/I07.yaml.

deng-theory:
  related: [primary-stage, basic-line, four-cardinal-principles, development-hard-truth, three-favorables, crossing-river-stones, two-hands, no-debate]
  sections:
    - h: 从“有中国特色”到理论概括
      from: 1982
      to: 1992
      text: 习近平2014年纪念邓小平诞辰110周年时说，邓小平响亮提出“走自己的道路，建设有中国特色的社会主义”。1992年十四大报告把十四年的实践称为“建设有中国特色社会主义的理论”，说它“第一次比较系统地初步回答了”经济文化比较落后的国家如何建设、巩固和发展社会主义的问题，并从发展道路、发展阶段、根本任务、发展动力、外部条件、政治保证、战略步骤、领导力量和祖国统一九个方面概括其主要内容。
      cites: [b22-gov-2014-08-20-xi-deng-110, i03-reformdata-1992-10-12-14th-report]
    - h: 命名与写入党章
      from: 1997
      to: 1998
      text: 邓小平逝世七个月后，十五大报告第一次以“邓小平理论”为旗帜，称它是毛泽东思想的继承和发展、“当代中国的马克思主义”、马克思主义在中国发展的新阶段；中共党史大事记概括为马列主义与中国实际相结合的“第二次飞跃”。修改后的党章把邓小平理论同马列主义、毛泽东思想一起确立为指导思想。1998年6月中共中央发出在全党深入学习邓小平理论的通知，胡锦涛在纪念真理标准讨论二十周年时说，二十年来党在理论上的最大成果“就是形成并确立了邓小平理论”。
      cites: [i01-wenming-1997-09-12-15th-report, e01-cpc-dsj-1997, e01-cpc-dsj-1998]
    - h: 习近平时期的解读
      from: 2014
      to: 2024
      text: 2024年纪念邓小平诞辰120周年时，习近平列举了一组需要“完整、准确理解”的邓小平论断，包括党的基本路线要管一百年、计划和市场都是经济手段、物质文明和精神文明两手抓、稳定压倒一切、一手抓改革开放一手抓惩治腐败等，并警告如果“顾此失彼、畸轻畸重”，就容易导致实践偏差。
      cites: [c09-gov-2024-08-22-xi-deng-120]
  lists:
    - title: 建设有中国特色社会主义理论的九个方面（十四大报告，1992）
      cite: i03-reformdata-1992-10-12-14th-report
      items:
        - 在社会主义的发展道路问题上，强调走自己的路，不把书本当教条，不照搬外国模式
        - 在社会主义的发展阶段问题上，作出了我国还处在社会主义初级阶段的科学论断
        - 在社会主义的根本任务问题上，指出社会主义的本质是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕
        - 在社会主义的发展动力问题上，强调改革也是一场革命，也是解放生产力，是中国现代化的必由之路
        - 在社会主义建设的外部条件问题上，指出和平与发展是当代世界两大主题
        - 在社会主义建设的政治保证问题上，强调坚持社会主义道路、坚持人民民主专政、坚持中国共产党的领导、坚持马克思列宁主义毛泽东思想
        - 在社会主义建设的战略步骤问题上，提出基本实现现代化分三步走
        - 在社会主义的领导力量和依靠力量问题上，强调作为工人阶级先锋队的共产党是社会主义事业的领导核心
        - 在祖国统一的问题上，提出“一个国家、两种制度”的创造性构想
  cites: [b22-gov-2014-08-20-xi-deng-110, i03-reformdata-1992-10-12-14th-report, i01-wenming-1997-09-12-15th-report, e01-cpc-dsj-1997, e01-cpc-dsj-1998, c09-gov-2024-08-22-xi-deng-120]

three-represents:
  related: [rule-by-virtue, three-stresses, advanced-nature-education, going-out, western-development]
  voices:
    - voice: zh
      text: 政治观察人士说，从维护共产党的执政地位的角度来看，中共需要扩大群众基础，江泽民的主张是必然之举。
      cite: e05-voa-2001-08-14-entrepreneurs
      quote: true
  sections:
    - h: 广东、江浙沪、西北三次考察
      from: 2000
      text: 2000年2月20日至25日江泽民在广东考察时提出这一论断；5月在江苏、浙江、上海考察时说，“三个代表”是党的立党之本、执政之基、力量之源；6月在宁夏、甘肃考察时再次阐述。年底起，中央在全国农村开展“三个代表”重要思想学习教育活动，同期结束的“三讲”教育总结会议也以它为指导。
      cites: [e01-cpc-dsj-2000, e01-gov-2021-06-28-cpc-100y, b01-cpc-2000-02-three-represents]
    - h: 七一讲话与私营企业主入党之争
      from: 2001
      text: 2001年7月1日建党80周年讲话系统阐述“三个代表”，要求不断增强党的阶级基础和扩大党的群众基础。美国之音报道，讲话中关于私营企业主可以入党的主张引发了一份据传由邓力群、袁木等17人签名的“万言书”，指其是把共产党变成资本家的共产党。同年9月十五届六中全会称七一讲话是“一篇马克思主义的纲领性文献”。
      cites: [e01-cpc-dsj-2001, e05-voa-2001-08-14-entrepreneurs]
    - h: 十六大的定型
      from: 2002
      to: 2004
      text: 十六大报告把十三年的十条基本经验“归结起来”就是三个代表，提出贯彻这一思想“关键在坚持与时俱进,核心在坚持党的先进性,本质在坚持执政为民”。同次大会写入党章，2004年写入宪法；2005年起的先进性教育活动以实践“三个代表”为主要内容。
      cites: [i01-jszx-2002-11-08-16th-report, e01-gov-2021-06-28-cpc-100y]
  lists:
    - title: 三个代表（十六大报告，2002）
      cite: i01-jszx-2002-11-08-16th-report
      items: [代表中国先进生产力的发展要求, 代表中国先进文化的前进方向, 代表中国最广大人民的根本利益]
    - title: 立党之本、执政之基、力量之源（江泽民，2000）
      cite: e01-cpc-dsj-2000
      items: [立党之本, 执政之基, 力量之源]
    - title: 贯彻“三个代表”的根本要求（十六大报告，2002）
      cite: i01-jszx-2002-11-08-16th-report
      items: [关键在坚持与时俱进, 核心在坚持党的先进性, 本质在坚持执政为民]
    - title: 十三年的十条基本经验（十六大报告，2002）
      cite: i01-jszx-2002-11-08-16th-report
      items:
        - 坚持以邓小平理论为指导,不断推进理论创新
        - 坚持以经济建设为中心,用发展的办法解决前进中的问题
        - 坚持改革开放,不断完善社会主义市场经济体制
        - 坚持四项基本原则,发展社会主义民主政治
        - 坚持物质文明和精神文明两手抓,实行依法治国和以德治国相结合
        - 坚持稳定压倒一切的方针,正确处理改革发展稳定的关系
        - 坚持党对军队的绝对领导,走中国特色的精兵之路
        - 坚持团结一切可以团结的力量,不断增强中华民族的凝聚力
        - 坚持独立自主的和平外交政策,维护世界和平与促进共同发展
        - 坚持加强和改善党的领导,全面推进党的建设新的伟大工程
  cites: [e01-cpc-dsj-2000, e01-gov-2021-06-28-cpc-100y, e01-cpc-dsj-2001, e05-voa-2001-08-14-entrepreneurs, i01-jszx-2002-11-08-16th-report]

scientific-development:
  related: [people-oriented, innovative-country, sannong, northeast-revitalization, development-hard-truth, advanced-nature-education]
  sections:
    - h: 非典之后成形
      from: 2003
      text: 2003年4月胡锦涛在广东考察时，针对非典疫情带来的损失提出“全面的发展观”；7月全国防治非典工作会议上说，发展“绝不只是指经济增长”；8月底在江西首次使用“科学发展观”一词；10月十六届三中全会决定正式提出。人民日报2004年初的评论说，非典疫情反映出经济社会发展不够全面，必须统筹城乡、区域、经济社会、人与自然、国内发展和对外开放。
      cites: [i01-cma-2012-12-17-scientific-development, i04-rmrb-2004-01-12-renzhongping]
    - h: 从发展观到指导思想
      from: 2004
      to: 2012
      text: 2004年2月中央举办省部级领导干部专题研究班，9月十六届四中全会把树立和落实科学发展观作为提高执政能力的重要内容，要求建立“五个统筹”的有效体制机制。2007年6月25日胡锦涛在中央党校讲话，归纳出第一要义、核心、基本要求、根本方法四句话，为十七大报告提供了框架；同年写入党章。2012年十八大把它确立为指导思想。
      cites: [i01-cma-2012-12-17-scientific-development, i01-wikisource-2004-09-19-governing-capacity-decision, b02-npc-2007-10-24-17th-report]
    - h: 与“发展是硬道理”的衔接
      from: 2003
      to: 2011
      text: 胡锦涛在十六届三中全会上说，树立科学发展观对于更好地坚持“发展才是硬道理”的战略思想具有重大意义。他后来又把两者的关系概括为“坚持发展是硬道理的本质要求就是坚持科学发展”；这句话在人民网文章中记在2011年建党90周年讲话名下，中新社则报道为2010年十七届五中全会的表述。
      cites: [i01-cma-2012-12-17-scientific-development, e02-chinanews-2010-10-18-plenum5]
  lists:
    - title: 科学发展观的四句话（十七大报告，2007）
      cite: b02-npc-2007-10-24-17th-report
      items: [第一要义是发展, 核心是以人为本, 基本要求是全面协调可持续, 根本方法是统筹兼顾]
    - title: 四个“必须坚持”（十七大报告，2007）
      cite: b02-npc-2007-10-24-17th-report
      items: [必须坚持把发展作为党执政兴国的第一要务, 必须坚持以人为本, 必须坚持全面协调可持续发展, 必须坚持统筹兼顾]
    - title: 五个统筹（十六届四中全会执政能力决定，2004）
      cite: i01-wikisource-2004-09-19-governing-capacity-decision
      items: [统筹城乡发展, 统筹区域发展, 统筹经济社会发展, 统筹人与自然和谐发展, 统筹国内发展和对外开放]
    - title: 十六大以来的重大战略思想和重大战略任务（胡锦涛，2006）
      cite: e01-cpc-dsj-2006
      items: [以人为本, 实现科学发展, 构建社会主义和谐社会, 建设社会主义新农村, 建设创新型国家, 树立社会主义荣辱观, 推动建设和谐世界, 加强党的先进性建设]
  cites: [i01-cma-2012-12-17-scientific-development, i04-rmrb-2004-01-12-renzhongping, i01-wikisource-2004-09-19-governing-capacity-decision, b02-npc-2007-10-24-17th-report, e02-chinanews-2010-10-18-plenum5, e01-cpc-dsj-2006]

harmonious-society:
  related: [people-oriented, sannong, harmonious-world]
  voices:
    - voice: zh
      text: “和谐”迅速地沦为“河蟹”，成为讥讽、嘲笑甚至是社会反抗的对象也就毫不令人奇怪。
      cite: b02-bbc-2012-10-29-hu-era
      quote: true
  sections:
    - h: 从执政能力到总要求
      from: 2004
      to: 2005
      text: 2004年9月十六届四中全会把构建社会主义和谐社会列为五种执政能力之一，要求形成全体人民各尽其能、各得其所而又和谐相处的社会。2005年2月中央在党校举办省部级主要领导干部专题研讨班，胡锦涛提出和谐社会的六项特征；同年3月的政府工作报告把“着力建设和谐社会”列为当年三项重点之一。研讨班的官方记载写作“民主法制”，政府工作报告和此后文件写作“民主法治”。
      cites: [i01-wikisource-2004-09-19-governing-capacity-decision, e01-cpc-dsj-2005, i02-gov-2005-gwr]
    - h: 六中全会决定
      from: 2006
      text: 2006年10月十六届六中全会通过关于构建社会主义和谐社会若干重大问题的决定，称“社会和谐是中国特色社会主义的本质属性”。胡锦涛在全会上说，经济体制深刻变革，社会结构深刻变动，利益格局深刻调整，思想观念深刻变化，必须把构建和谐社会摆在更加突出的地位。
      cites: [e01-gov-2021-06-28-cpc-100y, e01-cpc-dsj-2006]
    - h: 十七大的民生目标
      from: 2007
      text: 十七大报告说科学发展和社会和谐是内在统一的，要求“努力使全体人民学有所教、劳有所得、病有所医、老有所养、住有所居”，形成“社会和谐人人有责、和谐社会人人共享”的局面。
      cites: [b02-npc-2007-10-24-17th-report]
  lists:
    - title: 和谐社会的总要求（十七大报告，2007）
      cite: b02-npc-2007-10-24-17th-report
      items: [民主法治, 公平正义, 诚信友爱, 充满活力, 安定有序, 人与自然和谐相处]
    - title: 五个“有所”（十七大报告，2007）
      cite: b02-npc-2007-10-24-17th-report
      items: [学有所教, 劳有所得, 病有所医, 老有所养, 住有所居]
  cites: [i01-wikisource-2004-09-19-governing-capacity-decision, e01-cpc-dsj-2005, i02-gov-2005-gwr, e01-gov-2021-06-28-cpc-100y, e01-cpc-dsj-2006, b02-npc-2007-10-24-17th-report, b02-bbc-2012-10-29-hu-era]

xiaokang:
  related: [primary-stage, sannong, scientific-development]
  sections:
    - h: 小康之家与三步走
      from: 1979
      to: 1987
      text: 1979年12月邓小平对大平正芳说，中国式的四个现代化是“小康之家”，到本世纪末人均国民生产总值1000美元也还是“小康的状态”。1982年十二大提出到20世纪末工农业年总产值翻两番、人民物质文化生活达到小康水平；1987年4月邓小平第一次明确提出“三步走”，十三大报告据此写入战略部署。
      cites: [i01-cpc-2022-10-31-deng-modernization, i07-people-1987-10-25-13th-report]
    - h: 总体小康
      from: 1992
      to: 2002
      text: 十四大报告说十一亿人民的温饱问题基本解决，“正在向小康迈进”；十五大报告说本世纪末达到小康的目标“能够如期实现”。十六大报告宣布人民生活总体上达到小康水平，但承认这“还是低水平的、不全面的、发展很不平衡的小康”。
      cites: [i03-reformdata-1992-10-12-14th-report, i01-wenming-1997-09-12-15th-report, i01-jszx-2002-11-08-16th-report]
    - h: 全面建设到全面建成
      from: 2000
      to: 2021
      text: 2000年10月十五届五中全会认为，中国从新世纪开始将进入全面建设小康社会的新阶段。十六大要求在本世纪头二十年全面建设惠及十几亿人口的更高水平的小康社会；十八大改为“确保到二0二0年实现全面建成小康社会宏伟目标”。2021年7月1日习近平宣告“在中华大地上全面建成了小康社会”。
      cites: [e01-cpc-dsj-2000, i01-jszx-2002-11-08-16th-report, i01-wsyu-2012-11-08-18th-report, i05-xinhua-2021-07-01-centenary-speech]
  lists:
    - title: 三步走（十三大报告，1987）
      cite: i07-people-1987-10-25-13th-report
      items:
        - 第一步，实现国民生产总值比一九八○年翻一番，解决人民的温饱问题
        - 第二步，到本世纪末，使国民生产总值再增长一倍，人民生活达到小康水平
        - 第三步，到下个世纪中叶，人均国民生产总值达到中等发达国家水平，人民生活比较富裕，基本实现现代化
    - title: 全面建设小康社会的六个“更加”（十六大报告，2002）
      cite: i01-jszx-2002-11-08-16th-report
      items: [经济更加发展, 民主更加健全, 科教更加进步, 文化更加繁荣, 社会更加和谐, 人民生活更加殷实]
  cites: [i01-cpc-2022-10-31-deng-modernization, i07-people-1987-10-25-13th-report, i03-reformdata-1992-10-12-14th-report, i01-wenming-1997-09-12-15th-report, e01-cpc-dsj-2000, i01-jszx-2002-11-08-16th-report, i01-wsyu-2012-11-08-18th-report, i05-xinhua-2021-07-01-centenary-speech]
