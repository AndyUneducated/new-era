taoguang-yanghui:
  voices:
    - voice: scholar
      text: 中国以往韬光养晦的策略反映的是弱国外交，中国变大变强之后，采取道义现实主义的理论和政策应是一个主流趋势。
      cite: i09-people-2014-12-10-yan-xuetong
      quote: true
    - voice: scholar
      text: 回答现场提问时，阎学通说，中国正在改变以往的“韬光养晦”政策，转而“奋发有为”。
