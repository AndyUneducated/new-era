      quote: true
    - voice: west
      text: 萧功秦是中国支持“新威权主义”的人中最知名的一位，他认为，习近平的出现是件极大的好事，习近平是他概念中的模范领导人邓小平的新化身。
      cite: i09-nytcn-2013-11-16-xi-leader
      quote: true
  cites: [i09-fudan-ias-xiao-gongqin, i09-reformdata-luyi-new-authoritarianism, i09-nytcn-2013-11-16-xi-leader]

