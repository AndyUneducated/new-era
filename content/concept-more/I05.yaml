# I05: fields appended to concepts owned by I01 — the official numbered lists and the long-form history of
# Xi Jinping Thought and its components. New concepts of this batch are in content/concepts/I05.yaml.

xi-thought:
  related: [xi-economic-thought, xi-rule-of-law-thought, xi-diplomacy-thought, xi-military-thought, xi-culture-thought, ecological-civilization, two-combinations, people-centered]
  lists:
    - title: 八个明确（十九大报告，2017）
      cite: i01-gov-2017-10-18-19th-report
      items:
        - 明确坚持和发展中国特色社会主义，总任务是实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国
        - 明确新时代我国社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，必须坚持以人民为中心的发展思想，不断促进人的全面发展、全体人民共同富裕
        - 明确中国特色社会主义事业总体布局是“五位一体”、战略布局是“四个全面”，强调坚定道路自信、理论自信、制度自信、文化自信
        - 明确全面深化改革总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化
        - 明确全面推进依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家
        - 明确党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队
        - 明确中国特色大国外交要推动构建新型国际关系，推动构建人类命运共同体
        - 明确中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，党是最高政治领导力量，提出新时代党的建设总要求，突出政治建设在党的建设中的重要地位
    - title: 十四个坚持（新时代坚持和发展中国特色社会主义的基本方略，十九大报告，2017）
      cite: i01-gov-2017-10-18-19th-report
      items:
        - 坚持党对一切工作的领导
        - 坚持以人民为中心
        - 坚持全面深化改革
        - 坚持新发展理念
        - 坚持人民当家作主
        - 坚持全面依法治国
        - 坚持社会主义核心价值体系
        - 坚持在发展中保障和改善民生
        - 坚持人与自然和谐共生
        - 坚持总体国家安全观
        - 坚持党对人民军队的绝对领导
        - 坚持“一国两制”和推进祖国统一
        - 坚持推动构建人类命运共同体
        - 坚持全面从严治党
    - title: 九个必须（建党百年讲话“以史为鉴、开创未来”，2021）
      cite: i05-xinhua-2021-07-01-centenary-speech
      items:
        - 必须坚持中国共产党坚强领导
        - 必须团结带领中国人民不断为美好生活而奋斗
        - 必须继续推进马克思主义中国化
        - 必须坚持和发展中国特色社会主义
        - 必须加快国防和军队现代化
        - 必须不断推动构建人类命运共同体
        - 必须进行具有许多新的历史特点的伟大斗争
        - 必须加强中华儿女大团结
        - 必须不断推进党的建设新的伟大工程
    - title: “两个结合”（建党百年讲话，2021）
      cite: i05-xinhua-2021-07-01-centenary-speech
      items: [同中国具体实际相结合, 同中华优秀传统文化相结合]
    - title: 新时代十三个方面的成就（第三个历史决议，2021）
      cite: b04-gov-2021-11-16-resolution
      items:
        - 在坚持党的全面领导上
        - 在全面从严治党上
        - 在经济建设上
        - 在全面深化改革开放上
        - 在政治建设上
        - 在全面依法治国上
        - 在文化建设上
        - 在社会建设上
        - 在生态文明建设上
        - 在国防和军队建设上
        - 在维护国家安全上
        - 在坚持“一国两制”和推进祖国统一上
        - 在外交工作上
    - title: 六个必须坚持（新时代中国特色社会主义思想的世界观和方法论，二十大报告，2022）
      cite: i01-gov-2022-10-16-20th-report
      items: [必须坚持人民至上, 必须坚持自信自立, 必须坚持守正创新, 必须坚持问题导向, 必须坚持系统观念, 必须坚持胸怀天下]
  sections:
    - h: 十九大：思想和基本方略
      from: 2017-10
      text: 十九大报告第三部分题为“新时代中国特色社会主义思想和基本方略”，用“八个明确”概括思想内容，用“十四个坚持”列出基本方略，前者讲“是什么”，后者讲“怎么做”。报告正文没有冠以习近平的名字；同月通过的党章修正案决议则把“习近平新时代中国特色社会主义思想”同马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观一道确立为党的行动指南。林和立对BBC中文说，江泽民、胡锦涛的理论入党章时都没有冠名。
      cites: [i01-gov-2017-10-18-19th-report, e03-gov-2017-10-24-charter-resolution, i01-bbc-2017-10-24-xi-thought-charter]
    - h: 写入宪法
      from: 2018-03
      text: 2018年3月的宪法修正案把习近平新时代中国特色社会主义思想加入序言的指导思想序列，同时写入“贯彻新发展理念”“推动物质文明、政治文明、精神文明、社会文明、生态文明协调发展”和“富强民主文明和谐美丽的社会主义现代化强国”等十九大提法，并在总纲第一条加入“中国共产党领导是中国特色社会主义最本质的特征”。
      cites: [i01-gov-2018-03-11-constitution]
    - h: 分领域的“思想”
      from: 2017-12
      to: 2023-10
      text: 十九大以后，各领域陆续提出以习近平命名的分支思想：2017年12月中央经济工作会议提出经济思想，2018年5月全国生态环境保护大会、6月中央外事工作会议、2020年11月中央全面依法治国工作会议分别确立生态文明思想、外交思想和法治思想，2023年10月全国宣传思想文化工作会议提出文化思想；强军思想则在十九大党章中写作“习近平强军思想”。一个规律是，习近平本人的讲话通常用不带名字的说法，如“新时代中国特色社会主义外交思想”“新时代中国特色社会主义生态文明思想”，冠名的提法多出现在会议总结、其他常委的讲话或人民日报评论员文章里，例如2018年韩正和2023年丁薛祥都讲“习近平生态文明思想”。
      cites: [i03-gov-2017-12-20-xi-economic-thought, i05-gov-2018-05-19-eco-conference, i03-gov-2018-06-23-foreign-affairs-conference, i05-gov-2018-06-24-rmrb-diplomacy-thought, i03-gov-2020-11-17-rule-of-law-conference, i03-gov-2023-10-08-culture-thought, i05-gov-2023-07-18-eco-conference, d01-12371-2017-10-28-party-charter]
    - h: 第三个历史决议：从八个明确到十个明确
      from: 2021-11
      text: 第三个历史决议把“八个明确”扩充为“十个明确”。党的领导一条从最后移到第一，并加上“四个意识”“四个自信”“两个维护”；新增两条：一条讲社会主义基本经济制度、新发展阶段、新发展理念、新发展格局和统筹发展和安全，一条讲全面从严治党和“以伟大自我革命引领伟大社会革命”；原有各条也补入“以中国式现代化推进中华民族伟大复兴”“发展全过程人民民主”等新提法。决议同时用十三个方面总结新时代成就，称这一思想是“当代中国马克思主义、二十一世纪马克思主义”，并说“党确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位”，后者被概括为“两个确立”。
      cites: [b04-gov-2021-11-16-resolution, i01-gov-2017-10-18-19th-report]
    - h: 二十大：世界观和方法论
      from: 2022-10
      text: 二十大报告第二部分说，“继续推进实践基础上的理论创新，首先要把握好新时代中国特色社会主义思想的世界观和方法论”，随后列出“六个必须坚持”：人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下。同一部分阐述了“两个结合”。修改后的党章写入“两个结合”，并说这一思想“是当代中国马克思主义、二十一世纪马克思主义”。
      cites: [i01-gov-2022-10-16-20th-report, i01-12371-2022-10-22-party-charter]
    - h: 主题教育
      from: 2023-04
      text: 2023年4月起，中共以县处级以上领导干部为重点开展“学习贯彻习近平新时代中国特色社会主义思想主题教育”，总要求是“学思想、强党性、重实践、建新功”，目标是“以学铸魂、以学增智、以学正风、以学促干”。领导小组组长是政治局常委蔡奇。会议名称用全称，习近平本人的讲话仍说“学习贯彻新时代中国特色社会主义思想主题教育”。
      cites: [i05-gov-2023-04-03-theme-education]
  cites: [i01-gov-2017-10-18-19th-report, i05-xinhua-2021-07-01-centenary-speech, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report, i05-gov-2023-04-03-theme-education]

four-comprehensives:
  related: [strict-governance, governance-modernization, chinese-modernization]
  lists:
    - title: 四个全面（江苏调研，2014）
      cite: i01-xinhua-2014-12-14-jiangsu-four-comprehensives
      items: [全面建成小康社会, 全面深化改革, 全面推进依法治国, 全面从严治党]
    - title: 四个全面（党章，2017）
      cite: d01-12371-2017-10-28-party-charter
      items: [全面建成小康社会, 全面深化改革, 全面依法治国, 全面从严治党]
    - title: 四个全面（党章，2022）
      cite: i01-12371-2022-10-22-party-charter
      items: [全面建设社会主义现代化国家, 全面深化改革, 全面依法治国, 全面从严治党]
  sections:
    - h: 四次全会分头部署
      from: 2013-11
      to: 2016-10
      text: 十八届三中、四中、五中、六中全会分别处理四个“全面”的内容：2013年三中全会决定“全面深化改革”，2014年四中全会决定“全面推进依法治国”，2015年五中全会制定决胜全面建成小康社会的“十三五”规划建议，公报已称坚持“四个全面”战略布局，2016年六中全会以全面从严治党为主题。习近平在六中全会的说明中说，制定新的党内政治生活准则，第一是完善“四个全面”战略布局的需要。
      cites: [e03-gov-2013-11-15-reform-decision, e03-gov-2014-10-28-rule-of-law, i01-moe-2015-10-29-5th-plenum-communique, b07-people-2016-11-03-xi-explanation]
    - h: 从“全面推进依法治国”到“全面依法治国”
      from: 2014-12
      to: 2017-10
      text: 2014年江苏调研时第三项写作“全面推进依法治国”，2017年党章改为简称“全面依法治国”。十九大报告的“八个明确”说战略布局是“四个全面”，与总体布局“五位一体”并列。
      cites: [i01-xinhua-2014-12-14-jiangsu-four-comprehensives, d01-12371-2017-10-28-party-charter, i01-gov-2017-10-18-19th-report]
    - h: 第一项的替换
      from: 2020-10
      to: 2022-10
      text: 第一项改为“全面建设社会主义现代化国家”的时间早于全面建成小康社会的正式宣告：2020年10月十九届五中全会公报已写“协调推进全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党的战略布局”。2021年7月1日习近平宣布全面建成小康社会，第三个历史决议和2022年党章沿用新表述。
      cites: [e04-xinhua-2020-10-29-5th-plenum, i05-xinhua-2021-07-01-centenary-speech, b04-gov-2021-11-16-resolution, i01-12371-2022-10-22-party-charter]
  cites: [d01-12371-2017-10-28-party-charter, e04-xinhua-2020-10-29-5th-plenum]

five-in-one:
  related: [chinese-modernization, high-quality-development]
  lists:
    - title: 五位一体（十八大报告，2012）
      cite: i01-wsyu-2012-11-08-18th-report
      items: [经济建设, 政治建设, 文化建设, 社会建设, 生态文明建设]
    - title: 五个文明（宪法序言，2018）
      cite: i01-gov-2018-03-11-constitution
      items: [物质文明, 政治文明, 精神文明, 社会文明, 生态文明]
  sections:
    - h: 目标的变化
      from: 2012-11
      to: 2017-10
      text: 十八大报告的奋斗目标是建设“富强民主文明和谐的社会主义现代化国家”，四个形容词对应经济、政治、文化、社会四项建设。十九大报告“八个明确”改为“富强民主文明和谐美丽的社会主义现代化强国”，加上与生态文明对应的“美丽”，“国家”也改成“强国”，同年写入党章的基本路线。
      cites: [i01-wsyu-2012-11-08-18th-report, i01-gov-2017-10-18-19th-report, d01-12371-2017-10-28-party-charter]
    - h: 五个文明写入宪法
      from: 2018-03
      text: 2018年宪法修正案在序言中写入“推动物质文明、政治文明、精神文明、社会文明、生态文明协调发展，把我国建设成为富强民主文明和谐美丽的社会主义现代化强国”，五个“文明”与五项“建设”一一对应。
      cites: [i01-gov-2018-03-11-constitution]
    - h: 与中国式现代化的衔接
      from: 2021-07
      text: 七一讲话说，推动五个文明协调发展，“创造了中国式现代化新道路，创造了人类文明新形态”。第三个历史决议的“十个明确”把总体布局完整写作“经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体”。二十大报告所列中国式现代化本质要求中的“丰富人民精神世界”“促进人与自然和谐共生”等，大体也对应这一布局。
      cites: [i05-xinhua-2021-07-01-centenary-speech, b04-gov-2021-11-16-resolution, i01-gov-2022-10-16-20th-report]
  cites: [i01-gov-2017-10-18-19th-report, i05-xinhua-2021-07-01-centenary-speech]

new-development-philosophy:
  related: [high-quality-development, people-centered, new-quality-productive-forces]
  lists:
    - title: 五大发展理念（十八届五中全会公报，2015）
      cite: i01-moe-2015-10-29-5th-plenum-communique
      items:
        - 坚持创新发展，必须把创新摆在国家发展全局的核心位置
        - 坚持协调发展，必须牢牢把握中国特色社会主义事业总体布局
        - 坚持绿色发展，必须坚持节约资源和保护环境的基本国策
        - 坚持开放发展，必须顺应我国经济深度融入世界经济的趋势
        - 坚持共享发展，必须坚持发展为了人民、发展依靠人民、发展成果由人民共享
  sections:
    - h: 提出
      from: 2015-10
      text: 十八届五中全会公报说，实现“十三五”目标“必须牢固树立并切实贯彻创新、协调、绿色、开放、共享的发展理念”，称“这是关系我国发展全局的一场深刻变革”，随后用五段分述。创新一段要求“推动大众创业、万众创新”，共享一段写入“发展为了人民、发展依靠人民、发展成果由人民共享”，次年政府工作报告随即提出以人民为中心的发展思想。
      cites: [i01-moe-2015-10-29-5th-plenum-communique, i02-gov-2016-gwr]
    - h: 基本方略与宪法
      from: 2017-10
      to: 2018-03
      text: 十九大“十四个坚持”的第四条是“坚持新发展理念”，开头说“发展是解决我国一切问题的基础和关键，发展必须是科学发展”，把它接在科学发展观之后。2018年宪法序言写入“贯彻新发展理念”。
      cites: [i01-gov-2017-10-18-19th-report, i01-gov-2018-03-11-constitution]
    - h: 新发展阶段、新发展理念、新发展格局
      from: 2020-10
      to: 2022-10
      text: 2020年十九届五中全会把“坚持新发展理念”列为“十四五”五项原则之一。七一讲话要求“立足新发展阶段，完整、准确、全面贯彻新发展理念，构建新发展格局，推动高质量发展”，三个“新”从此连用，写入第三个历史决议的“十个明确”和2022年党章。二十大报告回顾五年工作时同样说“完整、准确、全面贯彻新发展理念”。
      cites: [e04-xinhua-2020-10-29-5th-plenum, i05-xinhua-2021-07-01-centenary-speech, b04-gov-2021-11-16-resolution, i01-12371-2022-10-22-party-charter, i01-gov-2022-10-16-20th-report]
  cites: [i01-moe-2015-10-29-5th-plenum-communique]

chinese-modernization:
  related: [five-in-one, high-quality-development, whole-process-democracy, struggle-spirit]
  lists:
    - title: 中国式现代化的本质要求（二十大报告，2022）
      cite: i01-gov-2022-10-16-20th-report
      items: [坚持中国共产党领导, 坚持中国特色社会主义, 实现高质量发展, 发展全过程人民民主, 丰富人民精神世界, 实现全体人民共同富裕, 促进人与自然和谐共生, 推动构建人类命运共同体, 创造人类文明新形态]
    - title: 前进道路上必须牢牢把握的五个重大原则（二十大报告，2022）
      cite: i01-gov-2022-10-16-20th-report
      items: [坚持和加强党的全面领导, 坚持中国特色社会主义道路, 坚持以人民为中心的发展思想, 坚持深化改革开放, 坚持发扬斗争精神]
  sections:
    - h: 重新提出
      from: 2021-07
      to: 2021-11
      text: 七一讲话宣布全面建成小康社会时说，党领导人民“创造了中国式现代化新道路，创造了人类文明新形态”。第三个历史决议在“十个明确”第二条中加入“以中国式现代化推进中华民族伟大复兴”。
      cites: [i05-xinhua-2021-07-01-centenary-speech, b04-gov-2021-11-16-resolution]
    - h: 二十大的系统表述
      from: 2022-10
      text: 二十大报告第三部分把党的中心任务定为“以中国式现代化全面推进中华民族伟大复兴”，概括了中国式现代化的五个特征（人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路），列出九项本质要求，并提出五个重大原则，最后一项是“坚持发扬斗争精神”。报告说中国式现代化“不走一些国家通过战争、殖民、掠夺等方式实现现代化的老路”。
      cites: [i01-gov-2022-10-16-20th-report]
    - h: 改革决定的主题
      from: 2024-07
      text: 2024年二十届三中全会决定以“进一步全面深化改革、推进中国式现代化”为主题，政治部分开头说“发展全过程人民民主是中国式现代化的本质要求”，外交部分说“中国式现代化是走和平发展道路的现代化”。
      cites: [i01-gov-2024-07-18-third-plenum-decision]
  cites: [i01-gov-2022-10-16-20th-report, i05-xinhua-2021-07-01-centenary-speech]

whole-process-democracy:
  related: [people-centered, party-leadership, chinese-modernization]
  lists:
    - title: 二十大报告第六部分“发展全过程人民民主，保障人民当家作主”的四项任务（2022）
      cite: i01-gov-2022-10-16-20th-report
      items: [加强人民当家作主制度保障, 全面发展协商民主, 积极发展基层民主, 巩固和发展最广泛的爱国统一战线]
  sections:
    - h: 前身
      from: 2017-10
      to: 2019-11
      text: 十九大报告已说“我国社会主义民主是维护人民根本利益的最广泛、最真实、最管用的民主”，这句话后来成为全过程人民民主的标准定义的后半句。2019年11月习近平在上海古北市民中心考察时说“人民民主是一种全过程的民主”。
      cites: [i01-gov-2017-10-18-19th-report, i01-jhsjk-2019-11-02-whole-process-democracy]
    - h: 定名
      from: 2021-07
      to: 2021-11
      text: “全过程人民民主”这个完整说法在七一讲话中已经出现：“践行以人民为中心的发展思想，发展全过程人民民主”。同年11月第三个历史决议把它写入“十个明确”，说“发展全过程人民民主”。
      cites: [i05-xinhua-2021-07-01-centenary-speech, b04-gov-2021-11-16-resolution]
    - h: 民主白皮书
      from: 2021-12
      text: 2021年12月，美国召开“民主峰会”前夕，中国政府发表民主白皮书。BBC中文报道，白皮书称中国发展的是“全过程人民民主”，而“拉票时受宠，选举后就被冷落”的民主不是真正的民主；发布会上中方官员说美国“自身民主劣迹斑斑，国内治理一团糟，却对别国的民主指手画脚、横加指责”。BBC认为这一提法似有定义“中国式民主”之意，并提到有批评者称其为“空洞的口号”。
      cites: [i05-bbc-2021-12-04-democracy-white-paper]
    - h: 本质属性与本质要求
      from: 2022-10
      to: 2024-07
      text: 二十大报告给出定义：“全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主”，并称“协商民主是实践全过程人民民主的重要形式”“基层民主是全过程人民民主的重要体现”。“发展全过程人民民主”也是报告所列中国式现代化本质要求之一。2024年三中全会决定专设“健全全过程人民民主制度体系”一部分。
      cites: [i01-gov-2022-10-16-20th-report, i01-gov-2024-07-18-third-plenum-decision]
  voices:
    - voice: zh
      text: 习近平提出“全过程民主”，似有定义“中国式民主”之意。当时也有批评声称，这种定义是“空洞的口号”。
      cite: i05-bbc-2021-12-04-democracy-white-paper
      quote: true
  cites: [i01-gov-2017-10-18-19th-report, i05-xinhua-2021-07-01-centenary-speech, i05-bbc-2021-12-04-democracy-white-paper, i01-gov-2024-07-18-third-plenum-decision]

self-revolution:
  related: [strict-governance, liuzhi, four-winds]
  lists:
    - title: 推进党的自我革命的六项要求（十九届中央纪委六次全会讲话，2022）
      cite: i01-gov-2022-01-18-self-revolution
      items:
        - 必须坚持以党的政治建设为统领
        - 必须坚持把思想建设作为党的基础性建设
        - 必须坚决落实中央八项规定精神、以严明纪律整饬作风
        - 必须坚持以雷霆之势反腐惩恶
        - 必须坚持增强党组织政治功能和组织力凝聚力
        - 必须坚持构建自我净化、自我完善、自我革新、自我提高的制度规范体系
    - title: 推进自我革命的“九个以”（人民日报评论员文章，2024）
      cite: i04-rmrb-2024-01-11-commentator
      items:
        - 以坚持党中央集中统一领导为根本保证
        - 以引领伟大社会革命为根本目的
        - 以习近平新时代中国特色社会主义思想为根本遵循
        - 以跳出历史周期率为战略目标
        - 以解决大党独有难题为主攻方向
        - 以健全全面从严治党体系为有效途径
        - 以锻造坚强组织、建设过硬队伍为重要着力点
        - 以正风肃纪反腐为重要抓手
        - 以自我监督和人民监督相结合为强大动力
  sections:
    - h: 历史经验之一
      from: 2021-11
      text: 第三个历史决议的十条历史经验以“坚持自我革命”收尾，称“勇于自我革命是中国共产党区别于其他政党的显著标志”。“十个明确”的最后一条也写入“以伟大自我革命引领伟大社会革命”。
      cites: [b04-gov-2021-11-16-resolution]
    - h: 2022年中央纪委全会讲话
      from: 2022-01
      text: 2022年1月，习近平在十九届中央纪委六次全会上说，党“探索出依靠党的自我革命跳出历史周期率的成功路径”，总结了九条管党治党经验，并提出六项要求，从“以党的政治建设为统领”到构建“自我净化、自我完善、自我革新、自我提高的制度规范体系”。同年二十大报告写入“党找到了自我革命这一跳出治乱兴衰历史周期率的第二个答案”。
      cites: [i01-gov-2022-01-18-self-revolution, i01-gov-2022-10-16-20th-report]
    - h: “重要思想”的提出
      from: 2024-01
      text: 2024年1月二十届中央纪委三次全会公报说，已“形成习近平总书记关于党的自我革命的重要思想”，称它是“习近平新时代中国特色社会主义思想的新篇章”。人民日报评论员文章随后把实践要求概括为“九个以”，其中“以解决大党独有难题为主攻方向”要求围绕“六个如何始终”标本兼治。
      cites: [cs2-ccdi-2024-01-10-ccdi-3rd-plenum, i04-rmrb-2024-01-11-commentator]
  cites: [b04-gov-2021-11-16-resolution, cs2-ccdi-2024-01-10-ccdi-3rd-plenum, i04-rmrb-2024-01-11-commentator]

ecological-civilization:
  related: [high-quality-development, chinese-modernization, xi-thought]
  lists:
    - title: 新时代推进生态文明建设的六项原则（全国生态环境保护大会，2018）
      cite: i05-gov-2018-05-19-eco-conference
      items: [坚持人与自然和谐共生, 绿水青山就是金山银山, 良好生态环境是最普惠的民生福祉, 山水林田湖草是生命共同体, 用最严格制度最严密法治保护生态环境, 共谋全球生态文明建设]
    - title: 生态文明体系的五个子体系（全国生态环境保护大会，2018）
      cite: i05-gov-2018-05-19-eco-conference
      items:
        - 以生态价值观念为准则的生态文化体系
        - 以产业生态化和生态产业化为主体的生态经济体系
        - 以改善生态环境质量为核心的目标责任体系
        - 以治理体系和治理能力现代化为保障的生态文明制度体系
        - 以生态系统良性循环和环境风险有效防控为重点的生态安全体系
    - title: 需要处理好的五个重大关系（全国生态环境保护大会，2023）
      cite: i05-gov-2023-07-18-eco-conference
      items: [高质量发展和高水平保护的关系, 重点攻坚和协同治理的关系, 自然恢复和人工修复的关系, 外部约束和内生动力的关系, “双碳”承诺和自主行动的关系]
    - title: 新时代生态文明建设的四个重大转变（全国生态环境保护大会，2023）
      cite: i05-gov-2023-07-18-eco-conference
      items: [由重点整治到系统治理的重大转变, 由被动应对到主动作为的重大转变, 由全球环境治理参与者到引领者的重大转变, 由实践探索到科学理论指导的重大转变]
  sections:
    - h: 千年大计
      from: 2017-10
      to: 2018-03
      text: 十九大“十四个坚持”的第九条是“坚持人与自然和谐共生”，说“建设生态文明是中华民族永续发展的千年大计”，要求“像对待生命一样对待生态环境”。2018年宪法修正案把“生态文明”写入序言，与物质、政治、精神、社会文明并列。
      cites: [i01-gov-2017-10-18-19th-report, i01-gov-2018-03-11-constitution]
    - h: 2018年全国生态环境保护大会
      from: 2018-05
      text: 2018年5月的大会上，习近平说“生态文明建设是关系中华民族永续发展的根本大计”，“生态兴则文明兴，生态衰则文明衰”，提出六项原则和由五个子体系构成的生态文明体系。“习近平生态文明思想”这一名称出自韩正的总结讲话：“要认真学习领会习近平生态文明思想”；习近平本人的讲话没有使用这一名称。
      cites: [i05-gov-2018-05-19-eco-conference]
    - h: 2023年全国生态环境保护大会
      from: 2023-07
      text: 2023年7月的大会上，习近平说“今后5年是美丽中国建设的重要时期”，要求“深入贯彻新时代中国特色社会主义生态文明思想”，总结新时代生态文明建设的四个“重大转变”，并要求处理好五个重大关系，其中包括“双碳”承诺和自主行动的关系。丁薛祥在总结讲话中用的是“习近平生态文明思想”。
      cites: [i05-gov-2023-07-18-eco-conference]
    - h: 写入中国式现代化
      from: 2021-10
      to: 2022-10
      text: 2021年中共中央、国务院关于碳达峰碳中和的意见称，实现碳达峰、碳中和“是以习近平同志为核心的党中央统筹国内国际两个大局作出的重大战略决策”。二十大报告把“人与自然和谐共生的现代化”列为中国式现代化的特征之一，并把2018年的“山水林田湖草”扩展为“坚持山水林田湖草沙一体化保护和系统治理”。
      cites: [i06-gov-2021-10-24-carbon-opinion, i01-gov-2022-10-16-20th-report]
  cites: [i05-gov-2018-05-19-eco-conference, i05-gov-2023-07-18-eco-conference]
