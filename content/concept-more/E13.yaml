three-represents:
  policies:
    - date: 2002-05-31
      name: 江泽民“5·31”讲话
      text: 贯彻“三个代表”要求，关键在坚持与时俱进，核心在保持党的先进性，本质在坚持执政为民；21世纪头二十年是重要战略机遇期。
