stability-maintenance:
  policies:
    - date: 2001-04-02
      name: 全国社会治安工作会议部署“严打”整治斗争
      text: 要求两年内社会治安明显进步，重点打击有组织犯罪、严重暴力犯罪和多发性犯罪，坚持依法从重从快。
