      cite: e13-cyol-2001-04-04-strike-hard

sannong:
  policies:
    - date: 2001-02-17
      name: 全国农村税费改革试点工作会议
      text: 总结安徽等地农村税费改革试点经验，部署当年试点，以从根本上减轻农民负担。
      events: [e13-2001-rural-tax-reform-pilot]
      cite: e01-cpc-dsj-2001

poverty-alleviation:
  policies:
    - date: 2001-05-24
      name: 中国农村扶贫开发纲要（2001—2010年）
      text: 中央扶贫开发工作会议总结“八七扶贫攻坚计划”，部署此后十年尽快解决少数贫困人口温饱问题。
      events: [e13-2001-poverty-outline]
      cite: e01-cpc-dsj-2001

one-country-two-systems:
  policies:
    - date: 2002-09-24
      name: 实施基本法第二十三条咨询文件
      text: 港府提出叛国、分裂国家、煽动叛乱、颠覆、窃取国家机密等罪行的立法建议，咨询期三个月。
      events: [e13-2002-article-23-consultation]
