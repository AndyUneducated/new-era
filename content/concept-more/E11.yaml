      events: [e11-2021-cewc-red-green-lights]
      cite: i06-gov-2021-12-10-cewc
  cites: [i06-gov-2020-09-22-unga-carbon, i06-gov-2020-12-18-cewc, i06-gov-2021-10-24-carbon-opinion, i06-gov-2021-12-10-cewc]

