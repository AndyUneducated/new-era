      cite: b09-nyt-2019-11-16-xinjiang-papers
    - date: 2020-02-06
      name: 武汉排查收治“四类人员”
      text: 孙春兰率中央指导组督促武汉以战时状态抓好源头防控，全力排查收治“四类人员”，实施全民拉网式排查，坚决落实应收尽收、应治尽治。
      events: []
      cite: b11-people-2020-02-07-sun-wartime

