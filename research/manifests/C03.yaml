    start: "新华社南宁11月11日电 11日，广"
    end: "柳州市中级人民法院认为，被告人朱明国身为国家工作人员，利用职务上的便利，为他人谋取利益，或利用本人职权和地位形成的便利条件，通过其他国家工作人员的职务行为，为他人谋取不正当利益，非法收受他人财物，数额特别巨大，严重侵害了国家工作人员职务行为的廉洁性，并使国家和人民利益遭受特别重大损失，其行为构成受贿罪；朱明国本人及家庭财产、支出明显超过合法收入，差额特别巨大，不能说明来源，其行为又构成巨额财产来源不明罪，均应依法惩处。鉴于朱明国归案后能够如实供述自己罪行，认罪悔罪，积极退赃，涉案赃款赃物已全部追缴，具有法定和酌定从轻处罚情节，对其受贿犯罪，判处死刑，可不立即执行。法庭遂作出上述判决。"
