# A01: PLA / PAP officers of major general or above (incl. academies, the active-duty police ranks under the Ministry
# of Public Security, and active generals in the defence industry) who fell, were recalled or went missing, first
# public news 2012-11 to 2022-12. `date` is the first public news (an official notice; for those without one, the
# first credible report); `id` is the person card. Case records: content/falls/A01.yaml.
# Basis: the twelve 2015 "军队查处军级以上干部重大案件情况" batches (a01-thepaper-2015-10-army-tigers-44, which
# reprints them all; f09-hqrw-2015-01-26-army-tigers and f09-rmzxw-2015-03-03-army-tigers for the first two), the later
# 中国军网 notices, the NPC delegate-qualification reports and gazette notices, the CPPCC and CCDI plenum decisions,
# and zh.wikipedia's list of fallen deputy-corps-level officers (a01-wiki-pla-fallen-list).
# Out of scope: 刘亚洲 and everyone first reported 2023-01 or later (A02); 吴国华 (died 2023, A02).
# Left out: 李继耐, 廖锡龙 (2016 reports of being taken away, but both appeared at the 2016 National Day reception and
# no official action followed); 马向东, 王东 (senior colonels); 马发祥 (navy deputy political commissar, died 2014-11-13;
# the navy paper announced death from illness, and the link to a probe rests only on hearsay — no fall can be set);
# 张福生 (R05).
