# R03: centrally managed cadres (non-military) whose first public CCDI notice (a probe, or a punishment announced
# without an earlier probe notice) fell in 2016–2017. Date = that first notice.
# Basis: the CCDI probe and punishment column lists (t01-ccdi-jlsc-list-p0/p1, t01-ccdi-djcf-list-p1–p4), the
# 2016-01-29 round-up of ten cadres punished in 2015 (r02-ccdi-2016-01-29-ten-cadres; 许爱民 and 朱福寿 were first
# announced in 2015 and belong to R02), the CCDI 7th and 8th plenum communiqués, and the Central Committee's 7th
# plenum communiqué (c03-xinhua-2017-10-14-seventh-plenum).
# Out of scope: 王建平, 田修思, 张阳 and the other generals (military); 张昆生 (first notice 2015, R02);
# 周化辰 (CCDI notice in 2018, R04); 冯新柱, 季缃绮, 王晓光 (2018, R04).
# 李建波 was given a 严重警告 in 2017 (7th CCDI plenum) but has no card; a 2026 probe reported on Wikipedia has not
# been checked against an official notice, so he is left undone for whoever covers 2026.
